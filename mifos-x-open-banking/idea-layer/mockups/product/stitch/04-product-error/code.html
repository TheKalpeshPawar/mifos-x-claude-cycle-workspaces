<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HSBC Open Banking - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#95CDF7",
              "on-primary": "#00344E",
              secondary: "#50606E",
              tertiary: "#64597B",
              background: "#101417",
              surface: "#101417",
              "surface-container": "#1C2024",
              on_surface: "#E0E3E8",
              on_surface_variant: "#C1C7CE",
              outline: "#72787E",
              error: "#FFB4AB",
              "error-container": "#93000A",
              positive: "#266489",
              negative: "#BA1A1A",
            },
            fontFamily: {
              headline: ["Outfit", "sans-serif"],
              display: ["Outfit", "sans-serif"],
              body: ["Outfit", "sans-serif"],
              label: ["Outfit", "sans-serif"],
              mono: ["Roboto Mono", "monospace"],
            },
            borderRadius: {
              small: "8px",
              medium: "12px",
              large: "16px",
              "extra-large": "28px",
              full: "9999px",
            },
            spacing: {
              margin: "16px",
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #101417;
            font-family: 'Outfit', sans-serif;
            color: #E0E3E8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .error-badge-fill .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .max-w-body {
            max-width: 280px;
        }
        .h-app-bar {
            height: 56px;
        }
        .h-nav-bar {
            height: 56px;
        }
        /* Custom spacing for error state requirements */
        .spacing-24 {
            margin-bottom: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on_surface flex flex-col min-h-screen overflow-hidden">
<!-- Component 1: Top App Bar -->
<header class="h-app-bar sticky top-0 z-50 flex items-center px-4 bg-background border-b border-outline-variant/10">
<div class="flex items-center justify-between w-full max-w-5xl mx-auto">
<div class="flex items-center">
<button aria-label="Go back" class="p-2 -ml-2 transition-colors hover:bg-surface-container rounded-full">
<span class="material-symbols-outlined text-[#E0E3E8]">arrow_back</span>
</button>
<h1 class="ml-4 font-bold text-lg text-[#E0E3E8]">Product Details</h1>
</div>
<div class="flex items-center">
<button class="p-2 transition-colors hover:bg-surface-container rounded-full">
<span class="material-symbols-outlined text-[#E0E3E8]">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Component 2: Error State (Main Content) -->
<main class="flex-grow flex flex-col items-center justify-center px-margin">
<div class="flex flex-col items-center text-center animate-in fade-in duration-700">
<!-- Error Icon Badge -->
<div class="w-[72px] h-[72px] rounded-full bg-error-container flex items-center justify-center spacing-24 shadow-lg shadow-black/20">
<span class="material-symbols-outlined text-error text-[40px]" style="font-variation-settings: 'FILL' 1;">priority_high</span>
</div>
<!-- Heading -->
<h2 class="text-[22px] font-bold text-on_surface spacing-24 leading-tight">Could not load product</h2>
<!-- Body Text -->
<p class="text-[14px] text-on_surface_variant leading-relaxed max-w-body spacing-24">
                We could not retrieve product data from HSBC. Check your connection and try again.
            </p>
<!-- Component 3: Primary Button -->
<button class="w-[280px] h-[48px] bg-primary text-on-primary rounded-[24px] font-bold text-[14px] transition-transform active:scale-95 hover:brightness-110 shadow-md">
                Retry
            </button>
</div>
</main>
<!-- Component 4: Bottom Navigation Bar -->
<nav class="h-nav-bar fixed bottom-0 left-0 right-0 bg-surface-container flex items-center justify-center z-50">
<div class="flex justify-around items-center w-full max-w-lg h-full">
<!-- Tab: Accounts (Active) -->
<a class="flex flex-col items-center justify-center w-full h-full text-primary group" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="text-[12px] font-medium mt-0.5">Accounts</span>
<div class="absolute bottom-0 w-12 h-1 bg-primary rounded-t-full"></div>
</a>
<!-- Tab: Balances -->
<a class="flex flex-col items-center justify-center w-full h-full text-on_surface_variant hover:text-on_surface transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">account_balance_wallet</span>
<span class="text-[12px] font-medium mt-0.5">Balances</span>
</a>
<!-- Tab: Party -->
<a class="flex flex-col items-center justify-center w-full h-full text-on_surface_variant hover:text-on_surface transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">group</span>
<span class="text-[12px] font-medium mt-0.5">Party</span>
</a>
<!-- Tab: ATMs -->
<a class="flex flex-col items-center justify-center w-full h-full text-on_surface_variant hover:text-on_surface transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">atm</span>
<span class="text-[12px] font-medium mt-0.5">ATMs</span>
</a>
</div>
</nav>
<!-- Script for interaction simulation -->
<script>
        document.querySelector('button').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Retrying...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = originalText;
                btn.classList.remove('opacity-80');
                // Simulate a subtle shake to show persistent error
                const container = btn.parentElement;
                container.classList.add('animate-bounce');
                setTimeout(() => container.classList.remove('animate-bounce'), 500);
            }, 1200);
        });
    </script>
</body></html>
