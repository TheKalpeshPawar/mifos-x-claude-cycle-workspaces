<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Product Details - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#266489",
            "on-primary": "#FFFFFF",
            "primary-container": "#C9E6FF",
            secondary: "#50606E",
            tertiary: "#64597B",
            background: "#101417",
            surface: "#101417",
            "surface-container": "#1C2024",
            "on-surface": "#E0E3E8",
            "on-surface-variant": "#C1C7CE",
            outline: "#72787E",
            divider: "#41474D",
            shimmer: "#262A2E"
          },
          borderRadius: {
            "small": "8px",
            "medium": "12px",
            "large": "16px",
            "extra_large": "28px",
            "full": "9999px"
          },
          spacing: {
            "margin-mobile": "16px",
            "gutter": "16px"
          },
          fontFamily: {
            headline: ["Public Sans", "sans-serif"],
            display: ["Public Sans", "sans-serif"],
            body: ["Public Sans", "sans-serif"],
            label: ["Public Sans", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          }
        },
      },
    }
  </script>
<style>
    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    @keyframes pulse-subtle {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.85;
      }
    }

    .shimmer-wrapper {
      position: relative;
      overflow: hidden;
      background-color: #1C2024;
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .shimmer-wrapper::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(
        90deg,
        rgba(38, 42, 46, 0) 0%,
        rgba(38, 42, 46, 0.6) 50%,
        rgba(38, 42, 46, 0) 100%
      );
      animation: shimmer 1.5s infinite;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-primary">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center justify-between px-margin-mobile h-14 max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface cursor-pointer" data-icon="arrow_back">arrow_back</span>
<h1 class="font-headline text-[20px] font-semibold text-on-surface">Product Details</h1>
</div>
<span class="material-symbols-outlined text-on-surface opacity-60" data-icon="more_vert">more_vert</span>
</header>
<main class="pb-24 max-w-screen-xl mx-auto">
<!-- Hero Card -->
<section class="px-margin-mobile mt-4">
<div class="w-full h-auto p-4 rounded-medium bg-surface-container flex flex-col gap-3">
<div class="shimmer-wrapper w-[180px] h-[18px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[120px] h-[14px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[220px] h-[12px] rounded-[4px] mt-1"></div>
</div>
</section>
<!-- General Info Section -->
<section class="px-margin-mobile mt-8">
<div class="shimmer-wrapper w-[60px] h-[12px] rounded-[4px] mb-4 opacity-70"></div>
<div class="flex items-center justify-between h-[48px] border-b border-divider">
<div class="shimmer-wrapper w-[140px] h-[14px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[80px] h-[14px] rounded-[4px]"></div>
</div>
</section>
<!-- Credit Interest Section -->
<section class="px-margin-mobile mt-8">
<div class="shimmer-wrapper w-[100px] h-[12px] rounded-[4px] mb-4 opacity-70"></div>
<div class="flex flex-col">
<div class="flex items-center justify-between h-[48px] border-b border-divider">
<div class="shimmer-wrapper w-[200px] h-[14px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[90px] h-[14px] rounded-[4px]"></div>
</div>
<div class="flex items-center justify-between h-[48px] border-b border-divider">
<div class="shimmer-wrapper w-[200px] h-[14px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[90px] h-[14px] rounded-[4px]"></div>
</div>
<div class="flex items-center justify-between h-[48px] border-b border-divider">
<div class="shimmer-wrapper w-[200px] h-[14px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[90px] h-[14px] rounded-[4px]"></div>
</div>
</div>
</section>
<!-- Overdraft Section -->
<section class="px-margin-mobile mt-8">
<div class="shimmer-wrapper w-[80px] h-[12px] rounded-[4px] mb-4 opacity-70"></div>
<div class="flex flex-col">
<div class="flex items-center justify-between h-[48px] border-b border-divider">
<div class="shimmer-wrapper w-[200px] h-[14px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[90px] h-[14px] rounded-[4px]"></div>
</div>
<div class="flex items-center justify-between h-[48px] border-b border-divider">
<div class="shimmer-wrapper w-[200px] h-[14px] rounded-[4px]"></div>
<div class="shimmer-wrapper w-[90px] h-[14px] rounded-[4px]"></div>
</div>
</div>
</section>
<!-- Features Section -->
<section class="px-margin-mobile mt-8">
<div class="shimmer-wrapper w-[70px] h-[12px] rounded-[4px] mb-4 opacity-70"></div>
<div class="flex flex-col gap-0">
<div class="flex items-center h-[48px] gap-4">
<div class="shimmer-wrapper w-6 h-6 rounded-full shrink-0"></div>
<div class="shimmer-wrapper w-[220px] h-[14px] rounded-[4px]"></div>
</div>
<div class="flex items-center h-[48px] gap-4">
<div class="shimmer-wrapper w-6 h-6 rounded-full shrink-0"></div>
<div class="shimmer-wrapper w-[220px] h-[14px] rounded-[4px]"></div>
</div>
<div class="flex items-center h-[48px] gap-4">
<div class="shimmer-wrapper w-6 h-6 rounded-full shrink-0"></div>
<div class="shimmer-wrapper w-[220px] h-[14px] rounded-[4px]"></div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-gutter pb-safe bg-surface-container z-50">
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[24px]" data-icon="account_balance">account_balance</span>
<span class="text-[12px] mt-1 font-medium">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[24px]" data-icon="payments">payments</span>
<span class="text-[12px] mt-1 font-medium">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[24px]" data-icon="trending_up">trending_up</span>
<span class="text-[12px] mt-1 font-medium">Invest</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[24px]" data-icon="support_agent">support_agent</span>
<span class="text-[12px] mt-1 font-medium">Support</span>
</div>
</nav>
<script>
    // Interaction: Handle navigation items tap effect
    document.querySelectorAll('nav div').forEach(tab => {
      tab.addEventListener('mousedown', () => {
        tab.style.transform = 'scale(0.95)';
        tab.style.transition = 'transform 150ms ease';
      });
      tab.addEventListener('mouseup', () => {
        tab.style.transform = 'scale(1)';
      });
      tab.addEventListener('mouseleave', () => {
        tab.style.transform = 'scale(1)';
      });
    });

    // Interaction: Simple back button simulation
    const backBtn = document.querySelector('[data-icon="arrow_back"]');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        backBtn.classList.add('opacity-50');
        setTimeout(() => backBtn.classList.remove('opacity-50'), 200);
      });
    }
  </script>
</body></html>
