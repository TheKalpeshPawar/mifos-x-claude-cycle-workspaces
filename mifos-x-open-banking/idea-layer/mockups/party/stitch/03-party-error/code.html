<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account Holder - Error State</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#95CDF7",
            "on-primary": "#00344E",
            "primary-container": "#C9E6FF",
            secondary: "#B7C9D9",
            tertiary: "#64597B",
            background: "#101417",
            surface: "#101417",
            "surface-container": "#1C2024",
            "on-surface": "#E0E3E8",
            "on-surface-variant": "#C1C7CE",
            outline: "#8B9198",
            error: "#FFB4AB",
            "error-container": "#93000A",
            negative: "#FFB4AB"
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          },
          spacing: {
            'margin-mobile': '16px',
            'base': '4px'
          }
        }
      }
    };
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #101417;
      color: #E0E3E8;
      font-family: 'Outfit', sans-serif;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="h-[56px] w-full flex items-center px-4 sticky top-0 z-50 bg-[#101417] text-[#E0E3E8]">
<div class="flex items-center gap-4 w-full">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-[22px] font-headline font-medium">Account Holder</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pb-20">
<!-- Error State Container -->
<div class="flex flex-col items-center text-center max-w-[280px]">
<!-- Error Badge -->
<div class="w-[72px] h-[72px] rounded-full bg-[#93000A] flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-[#FFB4AB] text-[40px]" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<!-- Heading -->
<h2 class="text-[22px] font-headline font-medium text-[#E0E3E8] mb-6 leading-tight">
        Could not load holder data
      </h2>
<!-- Body -->
<p class="text-[14px] font-body text-[#C1C7CE] mb-6 leading-relaxed">
        We could not retrieve account holder details from HSBC. Check your connection and try again.
      </p>
<!-- Retry Button -->
<button class="w-[280px] h-[48px] bg-[#95CDF7] text-[#00344E] rounded-[24px] font-headline font-bold text-[14px] uppercase tracking-wide active:scale-[0.98] transition-transform flex items-center justify-center">
        Retry
      </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full h-[56px] flex justify-around items-center bg-[#1C2024] z-50">
<!-- Accounts -->
<a class="flex flex-col items-center justify-center text-[#C1C7CE] transition-colors duration-200 hover:text-[#95CDF7]" href="#">
<span class="material-symbols-outlined">account_balance</span>
<span class="text-[12px] mt-1">Accounts</span>
</a>
<!-- Balances -->
<a class="flex flex-col items-center justify-center text-[#C1C7CE] transition-colors duration-200 hover:text-[#95CDF7]" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="text-[12px] mt-1">Balances</span>
</a>
<!-- Party (ACTIVE) -->
<a class="flex flex-col items-center justify-center text-[#95CDF7] font-medium transition-transform scale-100" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-[12px] mt-1">Party</span>
</a>
<!-- ATMs -->
<a class="flex flex-col items-center justify-center text-[#C1C7CE] transition-colors duration-200 hover:text-[#95CDF7]" href="#">
<span class="material-symbols-outlined">atm</span>
<span class="text-[12px] mt-1">ATMs</span>
</a>
</nav>
<script>
    // Simple micro-interaction for retry button
    const retryBtn = document.querySelector('button.bg-\\[\\#95CDF7\\]');
    retryBtn.addEventListener('click', () => {
      retryBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
      setTimeout(() => {
        retryBtn.innerHTML = 'Retry';
      }, 2000);
    });
  </script>
</body></html>
