<!DOCTYPE html>

<html class="dark" lang="en"><head>

<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#95CDF7",
              on_primary: "#00344F",
              primary_container: "#004B70",
              on_primary_container: "#C9E6FF",
              secondary: "#B1C9DE",
              on_secondary: "#1B3242",
              tertiary: "#D1C1E9",
              on_tertiary: "#372C4C",
              background: "#101417",
              surface: "#101417",
              surface_container: "#1C2024",
              on_surface: "#E0E3E8",
              on_surface_variant: "#C1C7CE",
              outline: "#8B9198",
              error: "#FFB4AB",
              skeleton_base: "#262A2E",
              divider: "#41474D"
            },
            borderRadius: {
              "small": "8px",
              "medium": "12px",
              "large": "16px",
              "extra_large": "28px",
              "full": "9999px"
            },
            fontFamily: {
              headline: ["Public Sans", "sans-serif"],
              display: ["Public Sans", "sans-serif"],
              body: ["Public Sans", "sans-serif"],
              mono: ["Roboto Mono", "monospace"]
            }
          }
        }
      }

<style>
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .shimmer-container {
        position: relative;
        overflow: hidden;
        background-color: #262A2E;
      }

      .shimmer-container::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          rgba(38, 42, 46, 0) 0%,
          rgba(255, 255, 255, 0.05) 50%,
          rgba(38, 42, 46, 0) 100%
        );
        animation: shimmer 2s infinite ease-in-out;
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      body {
        background-color: #101417;
        color: #E0E3E8;
        font-family: 'Public Sans', sans-serif;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="h-[56px] w-full max-w-md flex items-center px-4 bg-background z-10 sticky top-0">
<div class="flex items-center gap-4 w-full">
<span class="material-symbols-outlined text-on-surface cursor-pointer">arrow_back</span>
<h1 class="text-on-surface font-headline text-[20px] font-medium tracking-tight">Account Holder</h1>
</div>
</header>
<main class="flex-1 w-full max-w-md px-4 pt-4 pb-20 space-y-6">
<!-- Main Identity Card -->
<section class="bg-surface_container rounded-medium p-4 flex flex-col gap-4">
<div class="flex items-start gap-4">
<!-- Avatar Shimmer -->
<div class="w-12 h-12 rounded-full shimmer-container shrink-0"></div>
<div class="flex flex-col gap-2 pt-1">
<!-- Title Bar -->
<div class="w-[160px] h-[18px] rounded-small shimmer-container"></div>
<!-- Subtitle Bar -->
<div class="w-[100px] h-[14px] rounded-small shimmer-container"></div>
</div>
</div>
<!-- Identity Status Pill -->
<div class="w-[64px] h-[28px] rounded-full shimmer-container mt-2"></div>
</section>
<!-- Contact Details List -->
<section class="space-y-4">
<div class="w-[60px] h-[12px] rounded-small shimmer-container opacity-60"></div>
<div class="bg-surface_container rounded-medium overflow-hidden">
<!-- Row 1 -->
<div class="px-4 h-[48px] flex items-center gap-4">
<div class="w-6 h-6 rounded-full shimmer-container shrink-0"></div>
<div class="w-[220px] h-[14px] rounded-small shimmer-container"></div>
</div>
<div class="h-px bg-divider mx-4"></div>
<!-- Row 2 -->
<div class="px-4 h-[48px] flex items-center gap-4">
<div class="w-6 h-6 rounded-full shimmer-container shrink-0"></div>
<div class="w-[220px] h-[14px] rounded-small shimmer-container"></div>
</div>
<div class="h-px bg-divider mx-4"></div>
<!-- Row 3 -->
<div class="px-4 h-[48px] flex items-center gap-4">
<div class="w-6 h-6 rounded-full shimmer-container shrink-0"></div>
<div class="w-[220px] h-[14px] rounded-small shimmer-container"></div>
</div>
</div>
</section>
<!-- Address Section -->
<section class="space-y-4">
<div class="w-[70px] h-[12px] rounded-small shimmer-container opacity-60"></div>
<div class="w-full h-[96px] rounded-medium shimmer-container"></div>
</section>
<!-- Informational Footer (Minimalist hint) -->
<div class="px-2 pt-4">
<div class="w-1/2 h-[12px] rounded-small shimmer-container opacity-30"></div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full max-w-md h-[56px] bg-surface_container flex justify-around items-center z-50">
<!-- Account -->
<div class="flex flex-col items-center justify-center opacity-60">
<span class="material-symbols-outlined text-on-surface-variant">account_balance</span>
<span class="text-[10px] text-on-surface-variant mt-0.5">Accounts</span>
</div>
<!-- Balances -->
<div class="flex flex-col items-center justify-center opacity-60">
<span class="material-symbols-outlined text-on-surface-variant">account_balance_wallet</span>
<span class="text-[10px] text-on-surface-variant mt-0.5">Balances</span>
</div>
<!-- Party (Active contextually, but no indicator per instructions) -->
<div class="flex flex-col items-center justify-center opacity-60">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-[10px] text-on-surface-variant mt-0.5">Party</span>
</div>
<!-- ATMs -->
<div class="flex flex-col items-center justify-center opacity-60">
<span class="material-symbols-outlined text-on-surface-variant">atm</span>
<span class="text-[10px] text-on-surface-variant mt-0.5">ATMs</span>
</div>
</nav>
