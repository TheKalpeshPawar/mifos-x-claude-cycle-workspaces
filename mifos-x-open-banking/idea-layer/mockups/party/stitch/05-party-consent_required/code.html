<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account Holder | Consent Required</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&amp;family=Roboto+Mono&amp;family=Outfit:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#266489",
            "on-primary": "#FFFFFF",
            "primary-container": "#C9E6FF",
            "on-primary-container": "#001E2F",
            secondary: "#50606E",
            tertiary: "#64597B",
            background: "#101417",
            surface: "#101417",
            "surface-container": "#1C2024",
            "on-surface": "#E0E3E8",
            "on-surface-variant": "#C1C7CE",
            outline: "#8B9198",
            error: "#BA1A1A",
            brand_dark: "#101417",
            brand_banner: "#004B6F",
            brand_accent: "#95CDF7",
            brand_text_accent: "#00344E",
            redacted: "#41474D"
          },
          borderRadius: {
            "small": "8px",
            "medium": "12px",
            "large": "16px",
            "extra-large": "28px",
            "full": "9999px"
          },
          fontFamily: {
            outfit: ["Outfit", "sans-serif"],
            mono: ["Roboto Mono", "monospace"],
            body: ["Public Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #101417;
      color: #E0E3E8;
      font-family: 'Public Sans', sans-serif;
    }
    .redacted-bar {
      height: 12px;
      border-radius: 6px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="w-full h-[56px] flex items-center px-4 bg-[#101417] sticky top-0 z-50">
<button class="p-2 -ml-2 transition-colors hover:bg-surface-container rounded-full">
<span class="material-symbols-outlined text-[#E0E3E8]">arrow_back</span>
</button>
<h1 class="ml-4 font-outfit font-medium text-[20px] text-[#E0E3E8]">Account Holder</h1>
</header>
<main class="w-full max-w-md px-4 pt-4 flex-grow pb-24">
<!-- Banner: Consent Required -->
<div class="w-full h-[80px] bg-[#004B6F] rounded-[12px] px-4 flex items-center mb-6">
<div class="bg-[#004B6F] mr-4">
<span class="material-symbols-outlined text-[#C9E6FF] text-[24px]">lock</span>
</div>
<div class="flex flex-col">
<h2 class="font-outfit font-bold text-[14px] text-[#C9E6FF]">Consent required</h2>
<p class="font-outfit text-[13px] text-[#C9E6FF] leading-tight">Your Open Banking authorisation has expired. Re-authorise to view holder details.</p>
</div>
</div>
<!-- Information Card -->
<section class="w-full bg-[#1C2024] rounded-[12px] p-6 mb-8 flex flex-col items-center">
<!-- Avatar Section -->
<div class="w-[48px] h-[48px] bg-[#004B6F] rounded-full flex items-center justify-center mb-4">
<span class="font-outfit font-bold text-[18px] text-[#C9E6FF]">PS</span>
</div>
<h3 class="font-outfit text-[20px] text-[#E0E3E8] mb-1">Priya Sharma</h3>
<p class="font-outfit text-[14px] text-[#C1C7CE] mb-8">Sole account holder</p>
<!-- Masked Data Rows -->
<div class="w-full space-y-6">
<div class="flex flex-col gap-2">
<label class="text-[12px] font-outfit text-[#C1C7CE]">Email</label>
<div class="redacted-bar bg-[#41474D]" style="width: 180px;"></div>
</div>
<div class="flex flex-col gap-2">
<label class="text-[12px] font-outfit text-[#C1C7CE]">Mobile</label>
<div class="redacted-bar bg-[#41474D]" style="width: 140px;"></div>
</div>
<div class="flex flex-col gap-2">
<label class="text-[12px] font-outfit text-[#C1C7CE]">Address</label>
<div class="redacted-bar bg-[#41474D]" style="width: 220px;"></div>
</div>
</div>
</section>
<!-- Call to Action -->
<div class="flex justify-center">
<button class="w-[280px] h-[48px] bg-[#95CDF7] rounded-full flex items-center justify-center transition-transform active:scale-95 hover:brightness-110">
<span class="font-outfit font-bold text-[14px] text-[#00344E]">Re-authorise with HSBC</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full h-[56px] bg-[#1C2024] flex justify-around items-center z-50">
<!-- Accounts -->
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined">account_balance</span>
<span class="font-outfit text-[11px] mt-0.5">Accounts</span>
</a>
<!-- Balances -->
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-outfit text-[11px] mt-0.5">Balances</span>
</a>
<!-- Party (Active) -->
<a class="flex flex-col items-center justify-center text-[#95CDF7] font-medium transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-outfit text-[11px] mt-0.5">Party</span>
</a>
<!-- ATMs -->
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined">atm</span>
<span class="font-outfit text-[11px] mt-0.5">ATMs</span>
</a>
</nav>
<script>
    // Micro-interaction: ripple effect or simple feedback for the CTA button
    document.querySelector('button').addEventListener('click', function(e) {
      console.log('Re-authorisation flow initiated');
    });

    // Handle Active State styles dynamically if needed
    const navItems = document.querySelectorAll('nav a');
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        navItems.forEach(i => {
          i.classList.remove('text-[#95CDF7]', 'font-medium');
          i.classList.add('text-on-surface-variant');
          i.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
        });
        item.classList.remove('text-on-surface-variant');
        item.classList.add('text-[#95CDF7]', 'font-medium');
        item.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
      });
    });
  </script>
</body></html>
