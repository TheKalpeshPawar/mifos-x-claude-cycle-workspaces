<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X - About Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        primary_container: "#CDEDA3",
                        on_primary: "#FFFFFF",
                        on_primary_container: "#102000",
                        secondary: "#386663",
                        secondary_container: "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E", // Requested background
                        surface: "#1E201A",    // Requested component background
                        surface_variant: "#282A24", // Requested divider and highlight
                        outline: "#75796C",
                        outline_variant: "#C5C8BA",
                        "nav-active-indicator": "#DCE7C8"
                    },
                    borderRadius: {
                        small: "4px",
                        medium: "12px",
                        large: "16px",
                        pill: "999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    animation: {
                        'shimmer': 'shimmer 1200ms linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #12140E;
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .shimmer-base {
            position: relative;
            overflow: hidden;
            background-color: #282A24; /* Base color for the shimmer element itself */
        }

        .shimmer-overlay::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(68, 72, 61, 0.4) 50%, 
                transparent 100%
            );
            animation: shimmer 1200ms infinite;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .skeleton-rect {
            background-color: #282A24;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center">
<!-- TopAppBar Shell (Immutable Identity Logic applied but in skeleton form) -->
<header class="w-full max-w-[390px] h-[64px] bg-background flex items-center justify-center px-4 sticky top-0 z-50">
<div class="w-[120px] h-[20px] skeleton-rect shimmer-base shimmer-overlay"></div>
</header>
<main class="w-full max-w-[390px] px-4 pb-24">
<!-- Component 2: Profile Card -->
<section class="mt-6 w-full bg-surface rounded-medium p-4 flex flex-col items-center space-y-4">
<div class="w-[72px] h-[72px] rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="flex flex-col items-center space-y-2">
<div class="w-[160px] h-[16px] skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-[120px] h-[12px] skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
</section>
<!-- Component 3: Data Card -->
<section class="mt-4 w-full bg-surface rounded-medium flex flex-col overflow-hidden">
<!-- Row 1 -->
<div class="h-[56px] px-4 flex items-center justify-between">
<div class="w-[60px] h-[14px] skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-[80px] h-[14px] skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
<!-- Divider -->
<div class="h-[1px] w-full bg-surface_variant"></div>
<!-- Row 2 -->
<div class="h-[56px] px-4 flex items-center justify-between">
<div class="w-[60px] h-[14px] skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-[80px] h-[14px] skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
</section>
<!-- Component 4: List Card -->
<section class="mt-4 w-full bg-surface rounded-medium p-4 flex flex-col">
<!-- Header Shimmer -->
<div class="w-[100px] h-[12px] skeleton-rect shimmer-base shimmer-overlay mb-4"></div>
<div class="flex flex-col">
<!-- List Row 1 -->
<div class="h-[56px] flex items-center justify-between">
<div class="w-[140px] h-[14px] skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-[18px] h-[18px] rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
<!-- List Row 2 -->
<div class="h-[56px] flex items-center justify-between border-t border-surface_variant/30">
<div class="w-[140px] h-[14px] skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-[18px] h-[18px] rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
<!-- List Row 3 -->
<div class="h-[56px] flex items-center justify-between border-t border-surface_variant/30">
<div class="w-[140px] h-[14px] skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-[18px] h-[18px] rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
</div>
</section>
<!-- Component 5: Action Button -->
<section class="mt-6 px-4">
<div class="w-full h-[48px] rounded-pill skeleton-rect shimmer-base shimmer-overlay"></div>
</section>
</main>
<!-- Bottom Navigation Shell (Skeleton Version) -->
<nav class="fixed bottom-0 left-0 w-full max-w-[390px] left-1/2 -translate-x-1/2 h-20 bg-background border-t border-surface_variant flex justify-around items-center px-2 pb-safe z-50">
<div class="flex flex-col items-center space-y-1">
<div class="w-6 h-6 rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-8 h-2 skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-6 h-6 rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-12 h-2 skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-6 h-6 rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
<div class="w-12 h-2 skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
<div class="flex flex-col items-center space-y-1">
<!-- Active State Indication (Profile usually at the end) -->
<div class="w-12 h-8 rounded-pill bg-nav-active-indicator/10 flex items-center justify-center">
<div class="w-5 h-5 rounded-full skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
<div class="w-10 h-2 skeleton-rect shimmer-base shimmer-overlay"></div>
</div>
</nav>
<script>
        // Micro-interaction for shimmer offset if needed
        document.querySelectorAll('.shimmer-overlay').forEach((el, index) => {
            el.style.animationDelay = `${index * 100}ms`;
        });
    </script>
</body></html>
