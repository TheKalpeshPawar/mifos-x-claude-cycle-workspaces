<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="h-[64px] w-full fixed top-0 bg-background flex items-center justify-between px-margin-mobile border-b border-outline-variant/20 z-50">

<h1 class="font-title-lg text-title-lg text-on-surface text-center absolute left-1/2 -translate-x-1/2">About</h1>
<div class="w-12"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->

<!-- Hero Section -->

<div class="w-[96px] h-[96px] rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed-variant" style="font-size: 48px; font-variation-settings: 'FILL' 1;">info</span>
</div>
</div>
<!-- Headline -->

<h2 class="font-headline-sm text-headline-sm text-on-surface line-clamp-2">

            </h2>
</div>
<!-- Subtitle -->

<p class="font-body-md text-body-md text-on-surface-variant leading-[20px] max-w-[280px]">
                App details could not be loaded. Please check your connection and try again.
            </p>
</div>
<!-- Action Button -->
<div class="mt-8 w-full px-8 max-w-[400px]">
<button class="w-full h-[48px] rounded-full bg-on-primary-fixed-variant flex items-center justify-center transition-transform active:scale-95 shadow-lg shadow-black/20 group">
<span class="font-button text-button text-primary tracking-wide">Retry</span>
</button>
</div>
<!-- Optional Decorative Element -->

<div class="w-32 h-32 rounded-full border-4 border-primary/20 flex items-center justify-center">
<div class="w-16 h-16 rounded-full border-2 border-primary/20"></div>
</div>

<script>
        // Simple micro-interaction for the retry button
        const retryBtn = document.querySelector('button');
        retryBtn.addEventListener('click', () => {
            const label = retryBtn.querySelector('span');
            const originalText = label.textContent;
            label.textContent = 'Retrying...';
            retryBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                label.textContent = originalText;
                retryBtn.classList.remove('opacity-80');
            }, 2000);
        });

        // Navigation simulation
        const navItems = document.querySelectorAll('nav > div');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                // Clear active styles from all
                navItems.forEach(i => {
                    i.className = 'flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright p-2 rounded-xl transition-colors cursor-pointer';
                });
                // Set active style for clicked (simplified mock)
                item.className = 'flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-95 transition-transform cursor-pointer';
            });
        });
    </script>
