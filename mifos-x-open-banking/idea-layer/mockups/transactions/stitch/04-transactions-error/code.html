<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HSBC UK - Transaction Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;family=Roboto+Mono:wght@400;500;600&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: #101417;
      color: #E0E3E8;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
    .font-outfit { font-family: 'Outfit', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .status-dimmed { color: #8B9198; }
    .error-red { color: #FFB4AB; }
    .error-bg { background-color: #93000A; }
    .primary-blue { background-color: #95CDF7; color: #00344E; }
    .surface-container { background-color: #1C2024; }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#266489",
            "on-primary": "#FFFFFF",
            "primary-container": "#C9E6FF",
            secondary: "#50606E",
            tertiary: "#64597B",
            background: "#101417",
            surface: "#101417",
            "surface-container": "#1C2024",
            "on-surface": "#E0E3E8",
            "on-surface-variant": "#B7C9D9",
            outline: "#72787E",
            error: "#BA1A1A",
          },
          borderRadius: {
            small: "8px",
            medium: "12px",
            large: "16px",
            extra_large: "28px",
            full: "9999px"
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col h-screen">
<!-- Top App Bar -->
<header class="flex items-center px-4 h-14 w-full sticky top-0 z-50 bg-[#101417]">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 active:opacity-60 transition-opacity">
<span class="material-symbols-outlined text-[#E0E3E8]">arrow_back</span>
</button>
<h1 class="font-outfit text-[22px] font-normal text-[#E0E3E8]">Transactions</h1>
</div>
</header>
<main class="flex-1 px-4 py-2 overflow-y-auto flex flex-col">
<!-- Stat Block -->
<section class="grid grid-cols-2 gap-4 p-4 rounded-[12px] bg-[#1C2024] mb-8">
<div class="flex flex-col">
<span class="font-outfit text-[12px] text-[#B7C9D9] mb-1">Money In</span>
<span class="font-outfit font-semibold text-[20px] text-[#8B9198]">0.00</span>
</div>
<div class="flex flex-col">
<span class="font-outfit text-[12px] text-[#B7C9D9] mb-1">Money Out</span>
<span class="font-outfit font-semibold text-[20px] text-[#8B9198]">0.00</span>
</div>
</section>
<!-- Centered Error State -->
<section class="flex-1 flex flex-col items-center justify-center text-center max-w-sm mx-auto">
<span class="material-symbols-outlined text-[64px] text-[#FFB4AB] mb-4">error_outline</span>
<h2 class="font-outfit font-semibold text-[20px] text-[#E0E3E8] mb-2 leading-tight">
        Could not load transactions
      </h2>
<p class="font-outfit text-[14px] text-[#B7C9D9] leading-relaxed mb-6">
        HSBC returned an error. Your consent is active; this may be a temporary outage.
      </p>
<div class="w-full p-3 rounded-[8px] bg-[#93000A] text-left mb-6">
<p class="font-outfit text-[12px] text-[#FFDAD6] leading-tight">
          HSBC_AIS_40005: Temporary server error
        </p>
</div>
<button class="w-full h-[48px] flex items-center justify-center rounded-full bg-[#95CDF7] text-[#00344E] font-outfit font-semibold text-[14px] active:scale-[0.98] transition-transform duration-100">
        Try Again
      </button>
</section>
</main>
<!-- Bottom Nav Bar -->
<nav class="h-14 w-full bg-[#1C2024] flex justify-around items-center rounded-t-[28px] fixed bottom-0 left-0">
<div class="flex flex-col items-center justify-center p-2">
<div class="bg-[#C9E6FF]/10 text-[#95CDF7] rounded-full px-5 py-1 flex flex-col items-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-outfit text-[11px] mt-0.5">Accounts</span>
</div>
</div>
<div class="flex flex-col items-center justify-center p-2 text-[#8B9198]">
<span class="material-symbols-outlined">insights</span>
<span class="font-outfit text-[11px] mt-0.5">PFM</span>
</div>
<div class="flex flex-col items-center justify-center p-2 text-[#8B9198]">
<span class="material-symbols-outlined">verified_user</span>
<span class="font-outfit text-[11px] mt-0.5">Consents</span>
</div>
<div class="flex flex-col items-center justify-center p-2 text-[#8B9198]">
<span class="material-symbols-outlined">person</span>
<span class="font-outfit text-[11px] mt-0.5">Profile</span>
</div>
</nav>
<script>
    // Subtle interaction for the "Try Again" button
    const retryBtn = document.querySelector('button.bg-\\[\\#95CDF7\\]');
    if (retryBtn) {
      retryBtn.addEventListener('click', () => {
        retryBtn.classList.add('opacity-50');
        setTimeout(() => {
          retryBtn.classList.remove('opacity-50');
        }, 800);
      });
    }
  </script>
</body></html>
