<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X Open Banking - Consent Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        background: "#F9FAEF",
                        "on-background": "#1A1C16",
                        surface: "#FFFFFF",
                        "on-surface": "#1A1C16",
                        "surface-variant": "#E1E4D5",
                        "on-surface-variant": "#44483D",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        "surface-container": "#F0F1E6",
                        // Dark variants as requested for the skeleton screen
                        dark: {
                            bg: "#12140E",
                            surface: "#1E201A",
                            highlight: "#282A24"
                        }
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "12px",
                        lg: "16px",
                        pill: "999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    animation: {
                        'shimmer': 'shimmer 1200ms linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-150%)' },
                            '100%': { transform: 'translateX(150%)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        .skeleton-shimmer {
            position: relative;
            overflow: hidden;
            background-color: #1E201A; /* style_skeleton_base */
        }
        .skeleton-shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                rgba(30, 32, 26, 0) 0%,
                rgba(40, 42, 36, 1) 50%,
                rgba(30, 32, 26, 0) 100%
            );
            animation: shimmer 1200ms linear infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#12140E] text-[#C5C8BA] min-h-screen">
<!-- Component 1: App Bar Shimmer -->
<header class="fixed top-0 w-full h-[64px] bg-[#12140E] flex items-center justify-center z-50">
<div class="w-[120px] h-[20px] rounded-sm skeleton-shimmer"></div>
</header>
<!-- Scrollable Content Canvas -->
<main class="pt-[64px] pb-24 px-4 max-w-md mx-auto overflow-y-auto">
<!-- Component 2: Card Shimmer -->
<section class="mt-6 bg-[#1E201A] rounded-md p-4 min-h-[200px] border border-[#282A24]">
<!-- Header Shimmer -->
<div class="flex items-center gap-4 mb-6">
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
<div class="space-y-2">
<div class="w-[160px] h-4 rounded-sm skeleton-shimmer"></div>
<div class="w-[100px] h-3 rounded-sm skeleton-shimmer opacity-60"></div>
</div>
</div>
<!-- Chip Row Shimmer -->
<div class="flex gap-2 mb-6">
<div class="w-[72px] h-[28px] rounded-pill skeleton-shimmer"></div>
<div class="w-[72px] h-[28px] rounded-pill skeleton-shimmer"></div>
<div class="w-[72px] h-[28px] rounded-pill skeleton-shimmer"></div>
</div>
<!-- Button Shimmer -->
<div class="w-full h-[44px] rounded-pill skeleton-shimmer"></div>
</section>
<!-- Component 3: Card Shimmer (Variation) -->
<section class="mt-3 bg-[#1E201A] rounded-md p-4 min-h-[200px] border border-[#282A24]">
<div class="flex items-center gap-4 mb-6">
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
<div class="space-y-2">
<div class="w-[160px] h-4 rounded-sm skeleton-shimmer"></div>
<div class="w-[100px] h-3 rounded-sm skeleton-shimmer opacity-60"></div>
</div>
</div>
<div class="flex gap-2 mb-6">
<div class="w-[72px] h-[28px] rounded-pill skeleton-shimmer"></div>
<div class="w-[72px] h-[28px] rounded-pill skeleton-shimmer"></div>
</div>
<div class="w-full h-[44px] rounded-pill skeleton-shimmer"></div>
</section>
<!-- Component 4: Card Shimmer (Variation) -->
<section class="mt-3 bg-[#1E201A] rounded-md p-4 min-h-[200px] border border-[#282A24]">
<div class="flex items-center gap-4 mb-6">
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
<div class="space-y-2">
<div class="w-[160px] h-4 rounded-sm skeleton-shimmer"></div>
<div class="w-[100px] h-3 rounded-sm skeleton-shimmer opacity-60"></div>
</div>
</div>
<div class="flex gap-2 mb-6">
<div class="w-[72px] h-[28px] rounded-pill skeleton-shimmer"></div>
</div>
<div class="w-full h-[44px] rounded-pill skeleton-shimmer"></div>
</section>
<!-- Extra content for scrolling feel -->
<div class="mt-3 bg-[#1E201A]/30 rounded-md p-4 h-[100px] border border-[#282A24]/50 opacity-40">
<div class="w-1/2 h-4 rounded-sm skeleton-shimmer mb-4"></div>
<div class="w-full h-[44px] rounded-pill skeleton-shimmer"></div>
</div>
</main>
<!-- Bottom Navigation Mockup (Inactive) -->
<nav class="fixed bottom-0 w-full h-20 bg-[#12140E] border-t border-[#282A24] flex justify-around items-center px-4 z-50">
<div class="flex flex-col items-center gap-1 opacity-20">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px]">Home</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-20">
<span class="material-symbols-outlined">account_balance</span>
<span class="text-[10px]">Accounts</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-20">
<span class="material-symbols-outlined">payments</span>
<span class="text-[10px]">Payments</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-20">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px]">Profile</span>
</div>
</nav>
<!-- Visual Polish: Soft Glow background effect -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-[-1]">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[#4C662B] blur-[120px] opacity-10"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#386663] blur-[120px] opacity-10"></div>
</div>
<script>
        // Simulate a tiny delay before elements "shimmer" if needed for JS control, 
        // but CSS animation is preferred for skeletons.
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Consent Manager Skeleton Loaded");
        });
    </script>
</body></html>
