<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->

<script>
        // Simple micro-interaction for chips
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('bg-[#004B6F]')) return; // ignore already active
                // Logic for real app would go here
            });
        });

        // Add visual polish to map on mouse movement if desktop (micro-interaction)
        const mapSection = document.querySelector('.custom-map-bg');
        mapSection.addEventListener('mousemove', (e) => {
            const rect = mapSection.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            mapSection.style.backgroundImage = `
                radial-gradient(circle at ${x}% ${y}%, rgba(149, 205, 247, 0.05), transparent 50%),
                linear-gradient(#262a2e 1px, transparent 1px),
                linear-gradient(90deg, #262a2e 1px, transparent 1px)
            `;
        });
    </script>
