<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ATM &amp; Branches - Mifos X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-custom": "#B2D188",
                        "primary-container": "#CDEDA3",
                        "on-primary-container": "#102000",
                        "dark-bg": "#12140E",
                        "surface-high": "#282A24",
                        "outline-custom": "#44483D",
                        "outline-active": "#B2D188",
                        "text-main": "#E3E3D8",
                        "text-secondary": "#C5C8BA",
                        "text-muted": "#8F9285",
                        "error-accent": "#FFB4AB",
                        "btn-container": "#354E16"
                    },
                    borderRadius: {
                        "small": "4px",
                        "medium": "12px",
                        "large": "16px",
                        "pill": "999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Outfit', sans-serif; background-color: #12140E; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-text-main antialiased min-h-screen">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 right-0 h-16 bg-[#12140E] z-50 flex items-center px-4 justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[#B2D188]">arrow_back</span>
</button>
<h1 class="text-[18sp] font-medium text-[#E3E3D8]">ATM &amp; Branches</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-20 px-4 max-w-md mx-auto pb-32">
<!-- Disabled Search Field -->
<div class="mt-4">
<div class="relative h-14 w-full rounded-medium border border-[#44483D] flex items-center px-4 opacity-60">
<span class="text-[#8F9285] text-[14sp]">Find location</span>
<span class="material-symbols-outlined text-[#8F9285] ml-auto">my_location</span>
</div>
</div>
<!-- Access Denied Card -->
<div class="mt-4 bg-[#282A24] rounded-medium border-l-4 border-[#FFB4AB] p-4 flex gap-4 animate-pulse-subtle">
<span class="material-symbols-outlined text-[#FFB4AB] shrink-0">location_off</span>
<div class="flex flex-col">
<h2 class="text-[15sp] font-semibold text-[#E3E3D8]">Location access denied</h2>
<p class="text-[13sp] text-[#C5C8BA] mt-1 leading-relaxed">
                    Mifos X needs location permission to find ATMs near you.
                </p>
</div>
</div>
<!-- Preferences Button -->
<button class="mt-4 w-full h-12 bg-[#354E16] rounded-medium flex items-center justify-center gap-2 active:scale-95 transition-transform tap-highlight-transparent">
<span class="material-symbols-outlined text-[#CDEDA3] text-[20px]">settings</span>
<span class="text-[#CDEDA3] font-semibold text-[15sp]">Open Preferences</span>
</button>
<!-- Divider / Section Header -->
<div class="mt-8">
<h3 class="text-[#8F9285] font-semibold text-[13sp] tracking-wider">SEARCH BY ADDRESS</h3>
</div>
<!-- Manual Search Field (Active) -->
<div class="mt-2 group">
<div class="relative h-14 w-full rounded-medium border border-[#B2D188] bg-transparent flex items-center px-4 ring-1 ring-inset ring-[#B2D188]/20">
<span class="material-symbols-outlined text-[#B2D188] mr-3 text-[20px]">search</span>
<input class="bg-transparent border-none outline-none focus:ring-0 text-[#E3E3D8] text-[14sp] w-full placeholder-[#8F9285]" placeholder="Enter city, postcode or address" type="text"/>
</div>
</div>
<!-- Find ATMs Button -->
<button class="mt-3 w-full h-12 border border-[#B2D188] rounded-medium flex items-center justify-center active:bg-[#B2D188]/10 transition-all tap-highlight-transparent">
<span class="text-[#B2D188] font-medium text-[15sp]">Find ATMs</span>
</button>
<!-- Aesthetic Empty State Graphic -->
<div class="mt-12 flex flex-col items-center opacity-40">
<div class="relative w-48 h-48 mb-6">
<div class="absolute inset-0 bg-gradient-to-tr from-[#354E16] to-transparent rounded-full blur-2xl"></div>
<img alt="Financial connectivity" class="w-full h-full object-cover rounded-medium grayscale mix-blend-lighten opacity-50" data-alt="A sophisticated abstract architectural rendering of a modern bank vault with glowing light green fiber optic lines tracing the floor. The environment is dark and professional, reflecting a high-tech financial infrastructure. Soft lighting highlights geometric metallic surfaces in deep charcoal and muted olive green. The atmosphere is secure, innovative, and deeply connected to digital banking growth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZPAeH8fs_zfguzKEuNp_Zh-x6rAZenCZUt1hUNinC3wGO_Q2XaO1KfVn7EPpRFrP-tOUAdzY2Efy6DmZsstjv01l58dS3RJAvYy_6XysCzxD8_tSwmeMi7ThChmLEdCu8b3b9KtuIKss3oirKiBz-auSkKClrEW3Ab574ka00MwP6CPXWCS2BTQ_AsuV4T3TWxs1jTWVO67Dw94OYiFBs0fs1cithXvl5Xdem7M5QmI7chFVC2-rJsj2UrxRlXMDcNsoNDCcBUW0f"/>
</div>
<p class="text-[#8F9285] text-center text-[12sp] italic">Securely locating the nearest Mifos branch for you.</p>
</div>
</main>
<!-- Shared Bottom Nav (Simulated based on JSON structure) -->
<nav class="fixed bottom-0 left-0 right-0 bg-[#12140E] border-t border-[#44483D] h-20 flex justify-around items-center px-2 pb-safe z-50">
<div class="flex flex-col items-center justify-center text-[#8F9285] px-5 py-1">
<span class="material-symbols-outlined">home</span>
<span class="text-[12px] mt-1 font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#DCE7C8]/10 text-[#B2D188] rounded-full px-5 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="text-[12px] mt-1 font-medium">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-[#8F9285] px-5 py-1">
<span class="material-symbols-outlined">payments</span>
<span class="text-[12px] mt-1 font-medium">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-[#8F9285] px-5 py-1">
<span class="material-symbols-outlined">person</span>
<span class="text-[12px] mt-1 font-medium">Profile</span>
</div>
</nav>
<script>
        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.style.opacity = '0.7';
            });
            button.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        });

        // Subtle parallax effect on the background pulse
        window.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.blur-2xl');
            if(glow) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                glow.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
</body></html>
