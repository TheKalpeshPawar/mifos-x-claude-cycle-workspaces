<style>
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes pulse-soft {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    @keyframes beacon {
      0% { transform: scale(0.8); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 0.6; }
      100% { transform: scale(0.8); opacity: 0.3; }
    }

    .shimmer-container {
      position: relative;
      overflow: hidden;
      background-color: #1C2024;
    }

    .shimmer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(28, 32, 36, 0) 0%,
        rgba(38, 42, 46, 1) 50%,
        rgba(28, 32, 36, 0) 100%
      );
      animation: shimmer 2s infinite linear;
    }

    .skeleton-block {
      background-color: #262A2E;
      position: relative;
      overflow: hidden;
      animation: pulse-soft 2s infinite ease-in-out;
    }

    .skeleton-block::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(38, 42, 46, 0) 0%,
        rgba(49, 53, 57, 0.4) 50%,
        rgba(38, 42, 46, 0) 100%
      );
