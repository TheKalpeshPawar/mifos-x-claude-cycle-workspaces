<body class="font-body-md overflow-x-hidden">

<header class="fixed top-0 w-full h-16 bg-[#12140E] flex items-center justify-center px-md z-50">

<script>
        // Simple micro-interaction for the bottom nav icons (visual feedback only)
        document.querySelectorAll('nav div').forEach(item => {
            item.addEventListener('mousedown', () => {
                item.style.transform = 'scale(0.9)';
            });
            item.addEventListener('mouseup', () => {
                item.style.transform = 'scale(1)';
            });
            item.style.transition = 'transform 150ms ease';
        });
    </script>
