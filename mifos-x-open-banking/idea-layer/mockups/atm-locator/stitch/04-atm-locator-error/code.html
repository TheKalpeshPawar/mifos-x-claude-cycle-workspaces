<style>
        body {
            background-color: #111416;
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .error-badge {
            width: 72px;
            height: 72px;
            background-color: #93000A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-badge .material-symbols-outlined {
            font-size: 32px;
            color: #FFB4AB;
        }
        .retry-button {
            width: 280px;
            height: 48px;
            background-color: #95CDF7;
            border-radius: 24px;
            color: #00344E;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .retry-button:active {
            transform: scale(0.95);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<style>
    body {

<body class="bg-background text-on-surface">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background h-[56px] w-full flex items-center px-margin-mobile w-full fixed top-0 z-50">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary" data-icon="location_on">location_on</span>
<h1 class="font-headline-md text-headline-md text-on-surface dark:text-on-surface font-extrabold tracking-tight">Nearby ATMs</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex flex-col items-center justify-center min-h-screen p-margin-mobile">
<!-- Error State Container -->
<div class="flex flex-col items-center justify-center animate-in fade-in slide-in-from-bottom-4 duration-500">
<!-- Circular Badge -->
<div class="error-badge mb-[24px]">
<span class="material-symbols-outlined" data-icon="location_off">location_off</span>
</div>
<!-- Heading -->
<h2 class="text-center font-headline-md text-[22px] text-[#E0E3E8] mb-[24px] leading-tight">
                Location unavailable
            </h2>
<!-- Body Text -->
<p class="text-center font-body-md text-[14px] text-[#C1C7CE] max-w-[280px] mb-[24px] leading-relaxed">
                We could not access your location or load HSBC ATM data. Enable location access and try again.
            </p>
<!-- Retry Button -->
<button class="retry-button">
                Retry
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full h-[56px] z-50 bg-surface-container dark:bg-surface-container fixed bottom-0 left-0 w-full flex justify-around items-center">
<!-- Accounts Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary scale-95 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
<span class="font-label-md text-label-md">Accounts</span>
</div>
<!-- Balances Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary scale-95 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-md text-label-md">Balances</span>
</div>
<!-- Party Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary scale-95 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-md text-label-md">Party</span>
</div>
<!-- ATMs Tab (ACTIVE) -->
<div class="flex flex-col items-center justify-center text-primary-container dark:text-primary-container font-medium scale-95 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" data-icon="atm" style="font-variation-settings: 'FILL' 1;">atm</span>
<span class="font-label-md text-label-md">ATMs</span>
</div>
</nav>
<script>
        // Micro-interaction for the retry button
        document.querySelector('.retry-button').addEventListener('click', function() {
            const container = this.parentElement;
            container.style.opacity = '0.5';
            container.style.transform = 'scale(0.98)';
            
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'scale(1)';
            }, 300);
        });
    </script>
</body></html>
