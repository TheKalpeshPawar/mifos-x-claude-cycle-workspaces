<script>
        // Simple micro-interaction for the retry button
        const retryBtn = document.querySelector('.action-button');
        retryBtn.addEventListener('click', () => {
            const originalText = retryBtn.innerText;
            retryBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            retryBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                retryBtn.innerText = originalText;
                retryBtn.classList.remove('opacity-80');
