<style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-background w-full h-16 flex items-center justify-center px-margin-mobile md:px-margin-desktop sticky top-0 z-50">
<div class="flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-primary" data-icon="lock">lock</span>
<span class="text-primary font-display-lg text-[20px] tracking-tight">Secure Authorization</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full flex flex-col items-center justify-center px-margin-mobile">
<div class="w-full max-w-[361px] space-y-6">
<!-- Stat Block: Indeterminate Progress Bar -->
<div class="progress-bar-container mx-auto rounded-full">
<div class="progress-bar-active"></div>
</div>
<!-- Card: Authorization Status -->
<section class="bg-surface-container rounded-xl p-8 flex flex-col items-center text-center shadow-sm border border-on-surface-variant/10">
<div class="bg-on-primary-fixed-variant p-3 rounded-full mb-6">
<span class="material-symbols-outlined text-primary text-[32px] filled-icon" data-icon="check_circle">check_circle</span>
</div>
<h1 class="font-title-md text-[20px] text-on-surface mb-2 leading-tight">
                    Completing authorisation
                </h1>
<p class="font-body-md text-on-surface-variant px-2 leading-relaxed">
                    You approved access on the HSBC portal. Confirming your consent now.
                </p>
</section>
<!-- Banner: Instructional Message -->
<aside class="bg-on-primary-fixed-variant rounded-lg p-4 flex items-center space-x-4 border border-primary/10">
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="lock">lock</span>
</div>
<span class="font-body-md text-primary font-medium">
                    Do not close this app.
                </span>
</aside>
</div>
</main>
<!-- Visual Polish: Subtle Background Noise/Grain for Dark Fintech feel -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay">
<svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<filter id="noiseFilter">
<feturbulence basefrequency="0.65" numoctaves="3" stitchtiles="stitch" type="fractalNoise"></feturbulence>
</filter>
<rect filter="url(#noiseFilter)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Micro-interaction for calm feel -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: Simulate a subtle fade-in for the components
            const elements = document.querySelectorAll('main > div > *');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = `opacity 0.8s ease ${index * 0.1}s, transform 0.8s ease ${index * 0.1}s`;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 50);
            });
        });
    </script>
