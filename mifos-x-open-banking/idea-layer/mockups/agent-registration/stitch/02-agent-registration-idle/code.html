<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos Agent Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#1e201a",
                    "on-surface-variant": "#c4c8b9",
                    "on-background": "#e3e3d9",
                    "on-tertiary-container": "#405a21",
                    "tertiary-fixed-dim": "#b1d18a",
                    "secondary-fixed-dim": "#a0cfcb",
                    "surface-container-highest": "#34362e",
                    "on-primary-fixed": "#102000",
                    "tertiary-container": "#b2d18a",
                    "on-secondary": "#013735",
                    "surface-container-high": "#292b24",
                    "on-primary-container": "#415a1f",
                    "primary-fixed": "#cdeda1",
                    "on-tertiary": "#1f3701",
                    "primary-fixed-dim": "#b2d188",
                    "surface-bright": "#383a33",
                    "on-error-container": "#ffdad6",
                    "outline-variant": "#44483c",
                    "error-container": "#93000a",
                    "surface-variant": "#34362e",
                    "error": "#ffb4ab",
                    "on-primary": "#203700",
                    "primary-container": "#b2d188",
                    "tertiary": "#cdeea4",
                    "inverse-on-surface": "#2f312a",
                    "inverse-surface": "#e3e3d9",
                    "tertiary-fixed": "#cdeda4",
                    "secondary": "#a0cfcb",
                    "background": "#12140e",
                    "secondary-container": "#1f4e4b",
                    "inverse-primary": "#4c662a",
                    "surface-dim": "#12140e",
                    "secondary-fixed": "#bcece7",
                    "on-primary-fixed-variant": "#354e14",
                    "on-tertiary-fixed": "#102000",
                    "surface": "#12140e",
                    "on-tertiary-fixed-variant": "#354e16",
                    "on-error": "#690005",
                    "on-secondary-container": "#8fbeba",
                    "surface-container-lowest": "#0d0f09",
                    "on-surface": "#e3e3d9",
                    "on-secondary-fixed": "#00201e",
                    "outline": "#8e9284",
                    "surface-container-low": "#1a1c16",
                    "on-secondary-fixed-variant": "#1f4e4b",
                    "primary": "#ceeda2",
                    "surface-tint": "#b2d188"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "24px",
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "xl": "32px",
                    "sm": "8px",
                    "md": "16px",
                    "base": "4px",
                    "margin-desktop": "64px",
                    "xs": "4px",
                    "margin-tablet": "32px"
            },
            "fontFamily": {
                    "label-md": ["Outfit"],
                    "body-md": ["Outfit"],
                    "label-lg": ["Outfit"],
                    "headline-lg": ["Outfit"],
                    "headline-md": ["Outfit"],
                    "display-lg": ["Outfit"],
                    "title-lg": ["Outfit"],
                    "headline-lg-mobile": ["Outfit"],
                    "body-lg": ["Outfit"],
                    "title-md": ["Outfit"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                    "headline-md": ["28px", {"lineHeight": "36px", "fontWeight": "400"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140e;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for institutional look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #12140e;
        }
        ::-webkit-scrollbar-thumb {
            background: #34362e;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen flex flex-col">
<!-- Component 1: TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 h-[64px] bg-surface flex items-center justify-between px-md w-full">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high transition-colors rounded-full active:opacity-80">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<!-- Title is requested centered in prompt instructions but following common pattern for registration -->
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="font-title-lg text-[18px] font-medium text-[#E3E3D8]">Agent Registration</h1>
</div>
<div>
<button class="p-2 hover:bg-surface-container-high transition-colors rounded-full active:opacity-80">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Area (Scrollable) -->
<main class="flex-1 mt-[64px] pb-32 overflow-y-auto">
<div class="max-w-[600px] mx-auto">
<!-- Component 2: Header -->
<section class="px-md pt-lg mt-lg">
<h2 class="font-title-lg text-[22px] font-semibold text-[#E3E3D8] mb-2">Agent Registration</h2>
<p class="font-body-md text-[14px] text-[#C5C8BA]">Register to become an authorised OBP field agent with your bank</p>
</section>
<!-- Component 3: Form Group -->
<section class="px-md mt-lg space-y-6">
<!-- Legal Name -->
<div class="relative">
<div class="h-[56px] px-4 rounded-xl border border-outline/20 bg-surface-container flex flex-col justify-center focus-within:border-primary focus-within:border-2 transition-all">
<label class="text-[12px] font-label-md text-[#8F9285]">Legal Name</label>
<input class="bg-transparent border-none p-0 focus:ring-0 text-[16px] text-[#E3E3D8] w-full" placeholder="Enter full legal name" type="text"/>
</div>
</div>
<!-- Mobile Phone Number -->
<div class="relative">
<div class="h-[56px] px-4 rounded-xl border border-outline/20 bg-surface-container flex flex-col justify-center focus-within:border-primary focus-within:border-2 transition-all">
<label class="text-[12px] font-label-md text-[#8F9285]">Mobile Phone Number</label>
<div class="flex items-center gap-2">
<span class="text-[16px] text-[#E3E3D8]">+254</span>
<input class="bg-transparent border-none p-0 focus:ring-0 text-[16px] text-[#E3E3D8] w-full" placeholder="700 000 000" type="tel"/>
</div>
</div>
</div>
<!-- Agent Number -->
<div class="relative">
<div class="h-[56px] px-4 rounded-xl border border-outline/20 bg-surface-container flex flex-col justify-center focus-within:border-primary focus-within:border-2 transition-all">
<label class="text-[12px] font-label-md text-[#8F9285]">Agent Number</label>
<input class="bg-transparent border-none p-0 focus:ring-0 text-[16px] text-[#E3E3D8] w-full" placeholder="Assign unique agent ID" type="text"/>
</div>
</div>
<!-- Operating Currency -->
<div class="relative">
<div class="h-[56px] px-4 rounded-xl border border-outline/20 bg-surface-container flex flex-col justify-center focus-within:border-primary focus-within:border-2 transition-all">
<label class="text-[12px] font-label-md text-[#8F9285]">Operating Currency</label>
<div class="flex justify-between items-center">
<input class="bg-transparent border-none p-0 focus:ring-0 text-[16px] text-[#E3E3D8] w-full cursor-pointer" readonly="" type="text" value="KES - Kenyan Shilling"/>
<span class="material-symbols-outlined text-outline">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Component 4: Services -->
<div class="pt-2">
<label class="text-[14px] font-label-lg text-[#C5C8BA] block mb-4">Supported Services</label>
<div class="flex flex-wrap gap-2">
<div class="chip px-4 py-2 rounded-lg bg-surface-container border border-outline/20 flex items-center gap-2 cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="text-[14px] font-label-md text-on-surface">Cash Deposit</span>
</div>
<div class="chip px-4 py-2 rounded-lg bg-surface-container border border-outline/20 flex items-center gap-2 cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="text-[14px] font-label-md text-on-surface">Cash Withdrawal</span>
</div>
<div class="chip px-4 py-2 rounded-lg bg-surface-container border border-outline/20 flex items-center gap-2 cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="text-[14px] font-label-md text-on-surface">Account Opening</span>
</div>
<div class="chip px-4 py-2 rounded-lg bg-surface-container border border-outline/20 flex items-center gap-2 cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="text-[14px] font-label-md text-on-surface">Bill Payment</span>
</div>
<div class="chip px-4 py-2 rounded-lg bg-surface-container border border-outline/20 flex items-center gap-2 cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="text-[14px] font-label-md text-on-surface">Fund Transfer</span>
</div>
</div>
</div>
<!-- Component 5: Commission -->
<div class="relative pt-2">
<div class="h-[56px] px-4 rounded-xl border border-outline/20 bg-surface-container flex flex-col justify-center focus-within:border-primary focus-within:border-2 transition-all">
<label class="text-[12px] font-label-md text-[#8F9285]">Commission Rate (%)</label>
<input class="bg-transparent border-none p-0 focus:ring-0 text-[16px] text-[#E3E3D8] w-full" placeholder="e.g. 1.5" type="number"/>
</div>
</div>
</section>
</div>
</main>
<!-- Component 6: Action Footer -->
<footer class="fixed bottom-0 left-0 right-0 p-md bg-background/80 backdrop-blur-md">
<div class="max-w-[600px] mx-auto">
<button class="w-full h-[48px] bg-[#B2D188] hover:bg-[#CEEDA2] active:scale-[0.98] transition-all rounded-full flex items-center justify-center">
<span class="font-title-md text-[16px] font-semibold text-[#1F3701]">Register as Agent</span>
</button>
</div>
</footer>
<!-- Interactive Layer for Chips Selection -->
<script>
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('bg-primary-container');
                chip.classList.toggle('border-primary');
                const text = chip.querySelector('span');
                text.classList.toggle('text-on-primary-container');
            });
        });
    </script>
</body></html>
