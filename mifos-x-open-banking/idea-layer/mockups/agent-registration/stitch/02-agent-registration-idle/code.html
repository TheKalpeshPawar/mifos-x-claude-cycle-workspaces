    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col selection:bg-primary selection:text-on-primary">
<!-- TopAppBar Section -->
<header class="fixed top-0 left-0 right-0 h-[64px] bg-surface z-50 flex items-center justify-between px-margin-mobile border-none">
<div class="flex items-center gap-md">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-title-md text-on-surface text-[18px] tracking-tight">Agent Registration</h1>
</div>
<div class="w-10"></div> <!-- Spacer for center-aligned feel -->
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-[64px] overflow-y-auto pb-margin-mobile">
<div class="max-w-[1280px] mx-auto">
<!-- Header Block -->
<section class="px-margin-mobile mt-[24px]">
<h2 class="font-title-lg text-on-surface text-[22px] font-semibold">Agent Registration</h2>
<p class="font-body-md text-on-surface-variant mt-[8px] leading-relaxed">
                    Register to become an authorised OBP field agent with your bank
                </p>
</section>
<!-- Text Field Group -->
<section class="px-margin-mobile mt-[24px] space-y-[12px]">
<!-- Legal Name -->
<div class="relative">
<label class="block font-label-md text-outline mb-[4px] ml-[4px]">Legal Name</label>
<div class="h-[56px] w-full bg-[#1E201A] border border-outline rounded-[12px] flex items-center px-md transition-all focus-within:border-primary group">
<input class="bg-transparent border-none w-full text-on-surface font-body-lg placeholder:text-outline/50 focus:ring-0" placeholder="Enter legal business name" type="text"/>
</div>
</div>
<!-- Mobile Phone Number -->
<div class="relative">
<label class="block font-label-md text-outline mb-[4px] ml-[4px]">Mobile Phone Number</label>
<div class="flex gap-[8px]">
<div class="h-[56px] min-w-[64px] bg-[#1E201A] border border-outline rounded-[12px] flex items-center justify-center text-on-surface font-body-lg">
                            +254
                        </div>
<div class="h-[56px] flex-1 bg-[#1E201A] border border-outline rounded-[12px] flex items-center px-md transition-all focus-within:border-primary group">
<input class="bg-transparent border-none w-full text-on-surface font-body-lg placeholder:text-outline/50 focus:ring-0" placeholder="700 000 000" type="tel"/>
</div>
</div>
</div>
<!-- Agent Number -->
<div class="relative">
<label class="block font-label-md text-outline mb-[4px] ml-[4px]">Agent Number</label>
<div class="h-[56px] w-full bg-[#1E201A] border border-outline rounded-[12px] flex items-center px-md transition-all focus-within:border-primary group">
<input class="bg-transparent border-none w-full text-on-surface font-body-lg placeholder:text-outline/50 focus:ring-0" placeholder="Unique agent identification" type="text"/>
</div>
</div>
<!-- Operating Currency (Dropdown Style) -->
<div class="relative">
<label class="block font-label-md text-outline mb-[4px] ml-[4px]">Operating Currency</label>
<button class="h-[56px] w-full bg-[#1E201A] border border-outline rounded-[12px] flex items-center justify-between px-md text-left transition-all hover:bg-surface-container-high">
<span class="text-on-surface font-body-lg">KES - Kenyan Shilling</span>
<span class="material-symbols-outlined text-outline">arrow_drop_down</span>
</button>
</div>
</section>
<!-- Supported Services Chips -->
<section class="px-margin-mobile mt-[16px]">
<h3 class="font-title-md text-on-surface-variant text-[14px] mb-[12px]">Supported Services</h3>
<div class="flex flex-wrap gap-[8px]">
<div class="h-[32px] px-md flex items-center bg-[#1E201A] border border-outline rounded-[8px] text-on-surface text-[13px] font-medium cursor-pointer hover:bg-surface-container-highest transition-colors">
                        Cash Deposit
                    </div>
<div class="h-[32px] px-md flex items-center bg-[#1E201A] border border-outline rounded-[8px] text-on-surface text-[13px] font-medium cursor-pointer hover:bg-surface-container-highest transition-colors">
                        Cash Withdrawal
                    </div>
<div class="h-[32px] px-md flex items-center bg-[#1E201A] border border-outline rounded-[8px] text-on-surface text-[13px] font-medium cursor-pointer hover:bg-surface-container-highest transition-colors">
                        Account Opening
                    </div>
<div class="h-[32px] px-md flex items-center bg-[#1E201A] border border-outline rounded-[8px] text-on-surface text-[13px] font-medium cursor-pointer hover:bg-surface-container-highest transition-colors">
                        Bill Payment
                    </div>
<div class="h-[32px] px-md flex items-center bg-[#1E201A] border border-outline rounded-[8px] text-on-surface text-[13px] font-medium cursor-pointer hover:bg-surface-container-highest transition-colors">
                        Fund Transfer
                    </div>
</div>
</section>
<!-- Commission Rate -->
<section class="px-margin-mobile mt-[12px]">
<div class="relative">
<label class="block font-label-md text-outline mb-[4px] ml-[4px]">Commission Rate (%)</label>
<div class="h-[56px] w-full bg-[#1E201A] border border-outline rounded-[12px] flex items-center px-md transition-all focus-within:border-primary group">
<input class="bg-transparent border-none w-full text-on-surface font-body-lg placeholder:text-outline/50 focus:ring-0" placeholder="0.00" type="number"/>
<span class="material-symbols-outlined text-outline ml-sm">percent</span>
</div>
</div>
</section>
<!-- Registration Footer -->
<section class="px-margin-mobile mt-[24px] mb-[32px]">
<button class="w-full h-[48px] bg-primary-container text-on-primary-container font-semibold rounded-full flex items-center justify-center active:scale-95 duration-200 transition-transform shadow-md">
                    Register as Agent
                </button>
</section>
</div>
</main>
<!-- Bottom Navigation Mockup (Suppressed if this is a sub-page, but showing for shell context as per rules) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container flex justify-around items-center py-sm px-margin-mobile shadow-lg rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 transition-all" href="#">
<span class="material-symbols-outlined">badge</span>
<span class="font-label-md">Agents</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">swap_horiz</span>
<span class="font-label-md">Transactions</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md">Profile</span>
</a>
</nav>
<script>
        // Simple micro-interaction for chips
        document.querySelectorAll('.flex-wrap div').forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('bg-primary-container');
                chip.classList.toggle('text-on-primary-container');
                chip.classList.toggle('border-primary-container');
            });
        });

        // Soft ripple-like effect on button
        const btn = document.querySelector('button.bg-primary-container');
        if(btn) {
            btn.addEventListener('mousedown', () => btn.classList.add('opacity-80'));
            btn.addEventListener('mouseup', () => btn.classList.remove('opacity-80'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('opacity-80'));
        }
    </script>
</body></html>
