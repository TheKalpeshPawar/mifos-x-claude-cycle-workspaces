<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Agent Registration - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        "on-secondary-container": "#00201E",
                        error: "#BA1A1A",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "surface-dim": "#D9DBCE",
                        "surface-container": "#F0F1E6",
                        "surface-container-low": "#F9FAEF",
                        "surface-container-high": "#EAECE1",
                        "on-surface": "#1A1C16",
                        "on-surface-variant": "#44483D",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        "skeleton-bg": "#12140E",
                        "skeleton-base": "#1E201A",
                        "skeleton-highlight": "#282A24",
                        "brand-spinner": "#B2D188"
                    },
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'unit': '8px'
                    },
                    animation: {
                        'shimmer': 'shimmer 1200ms infinite linear',
                        'spinner': 'spin 1000ms linear infinite'
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        .shimmer-container {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }
        .shimmer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #282A24, transparent);
            animation: shimmer 1200ms infinite linear;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            color: white;
        }
        .custom-spinner {
            border: 3px solid rgba(178, 209, 136, 0.1);
            border-top: 3px solid #B2D188;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="overflow-y-auto">
<!-- Top App Bar Skeleton -->
<header class="fixed top-0 w-full z-50 bg-skeleton-bg h-16 flex items-center px-4 border-b border-white/5">
<div class="flex items-center w-full">
<span class="material-symbols-outlined text-white/40 mr-4">arrow_back</span>
<div class="shimmer-container w-[160px] h-[22px] rounded-sm">
<div class="shimmer-overlay"></div>
</div>
<div class="ml-auto">
<span class="material-symbols-outlined text-white/40">help_outline</span>
</div>
</div>
</header>
<main class="pt-20 pb-24 max-w-md mx-auto min-h-screen flex flex-col">
<!-- Title Block Skeleton -->
<section class="px-4 mt-6 space-y-2">
<div class="shimmer-container w-[220px] h-[20px] rounded-sm">
<div class="shimmer-overlay"></div>
</div>
<div class="shimmer-container w-[300px] h-[14px] rounded-sm">
<div class="shimmer-overlay"></div>
</div>
</section>
<!-- Progress Indicator -->
<section class="flex flex-col items-center mt-8">
<div class="custom-spinner"></div>
<div class="shimmer-container w-[180px] h-[14px] rounded-sm mt-3">
<div class="shimmer-overlay"></div>
</div>
</section>
<!-- Form Card Shimmer Group 1 -->
<section class="px-4 mt-6">
<div class="bg-skeleton-base rounded-[12px] p-4 space-y-3">
<div class="shimmer-container w-full h-[56px] rounded-[8px]">
<div class="shimmer-overlay"></div>
</div>
<div class="shimmer-container w-full h-[56px] rounded-[8px]">
<div class="shimmer-overlay"></div>
</div>
<div class="shimmer-container w-full h-[56px] rounded-[8px]">
<div class="shimmer-overlay"></div>
</div>
<div class="shimmer-container w-full h-[56px] rounded-[8px]">
<div class="shimmer-overlay"></div>
</div>
</div>
</section>
<!-- Form Card Shimmer Group 2 (Visual Continuity) -->
<section class="px-4 mt-4">
<div class="bg-skeleton-base rounded-[12px] p-4 space-y-3">
<div class="shimmer-container w-full h-[56px] rounded-[8px]">
<div class="shimmer-overlay"></div>
</div>
<div class="shimmer-container w-full h-[56px] rounded-[8px]">
<div class="shimmer-overlay"></div>
</div>
</div>
</section>
<!-- Button Shimmer -->
<section class="px-4 mt-6 mb-8">
<div class="shimmer-container w-full h-[48px] rounded-full !bg-[#282A24]">
<div class="shimmer-overlay"></div>
</div>
</section>
</main>
<!-- Bottom Navigation Mock (Consistent with App State) -->
<nav class="fixed bottom-0 w-full z-50 bg-[#1A1C16] h-20 px-2 flex justify-around items-center border-t border-white/5 md:hidden">
<div class="flex flex-col items-center justify-center text-white/20">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="text-[11px] mt-1">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-white/20">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-[11px] mt-1">Transfers</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary/20 text-brand-spinner rounded-xl px-4 py-1">
<span class="material-symbols-outlined" data-icon="badge">badge</span>
<span class="text-[11px] mt-0.5">Agents</span>
</div>
<div class="flex flex-col items-center justify-center text-white/20">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[11px] mt-1">Settings</span>
</div>
</nav>
</body></html>
