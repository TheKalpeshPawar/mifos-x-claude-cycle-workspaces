<script>
        // Micro-interaction: Subtle fade-in of the skeleton container
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transition = 'opacity 600ms ease-out';
            requestAnimationFrame(() => {
                main.style.opacity = '1';
            });
        });

        // Atmospheric effect: Subtle grain overlay logic
        const createGrain = () => {
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.pointerEvents = 'none';
            canvas.style.opacity = '0.02';
            canvas.style.zIndex = '9999';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            const resize = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resize);
            resize();

            const render = () => {
                const w = canvas.width;
                const h = canvas.height;
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const val = Math.random() * 255;
                    data[i] = val;
                    data[i+1] = val;
                    data[i+2] = val;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                setTimeout(() => requestAnimationFrame(render), 100);
            };
            render();
        };
        // createGrain(); // Uncomment for a film-grain texture effect
    </script>
