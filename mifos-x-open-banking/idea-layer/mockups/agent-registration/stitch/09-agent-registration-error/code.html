<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140e;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden">
<!-- TopAppBar (Component 1) -->
<nav class="fixed top-0 left-0 w-full z-50 px-margin-mobile md:px-margin-desktop bg-background h-[64px] flex items-center justify-between border-b border-outline-variant/10">
<div class="flex items-center">
<button class="p-2 transition-colors duration-200 ease-in-out hover:bg-surface-variant/20 rounded-full text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="font-medium text-[18px] text-on-surface tracking-tight">Agent Registration</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</nav>
<!-- Main Canvas -->
<main class="min-h-screen flex flex-col items-center justify-center px-8 text-center animate-in fade-in duration-700">
<!-- Error Illustration (Component 2) -->
<div class="mt-[64px] mb-[24px]">
<img alt="Technical error representation" class="w-[160px] h-[160px] object-contain opacity-90 transition-transform duration-500 hover:scale-105" data-alt="A professional minimalist flat vector illustration of a disconnected API plug and broken network link. The visual uses neutral tones of deep charcoal and muted grey-green on a solid dark background. The composition conveys a technical connectivity failure with a high-fidelity fintech aesthetic, avoiding alarming red tones for a more institutional and secure feel." src="https://lh3.googleusercontent.com/aida/ADBb0ujmv-0lOqdmR5edopHQbnZz0_CcNO2bNXeZof5kzBxnYm5vCokBHzdJOngLz78E6Sw7DMZ87tQVzI9buRAaHTuvSMoLpf7syhHVYexn5KOrc1fFl6QBWylO-MeLxj4aMk9MK0Vt0oFJ79MUdTnPe2ytfs7PpLCf2yCAuyGYc11y4xphK8SFHV8ItMqgc4HZNHCQ3llF4J73Wx_emCeVvstpKKqwrfK9NBZj72ZywCvaWpCa6zQr5EpF2ev-"/>
</div>
<!-- Error Title (Component 3) -->
<h2 class="font-semibold text-[22px] leading-[28px] text-on-surface max-w-[280px] mb-2">
            Registration Unavailable
        </h2>
<!-- Error Subtext (Component 4) -->
<p class="font-body-md text-on-surface-variant max-w-[320px] mb-[32px] px-2 leading-relaxed">
            Unable to reach the Open Bank Project server. Check your connection and try again.
        </p>
<!-- Action Area -->
<div class="w-full max-w-[320px] flex flex-col items-center">
<!-- Retry Button (Component 5) -->
<button class="group relative w-full h-[48px] bg-primary text-on-primary-container rounded-full flex items-center justify-center gap-2 overflow-hidden transition-all duration-200 active:scale-95 hover:bg-primary/90 shadow-lg shadow-primary/5" onclick="handleRetry()">
<span class="material-symbols-outlined text-[20px] transition-transform duration-500" id="retry-icon">refresh</span>
<span class="font-semibold text-[16px]">Retry</span>
<!-- Micro-interaction ripple simulation -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-active:opacity-100 transition-opacity"></div>
</button>
<!-- Secondary Action (Component 6) -->
<button class="mt-4 px-6 py-2 text-[14px] font-medium text-outline hover:text-on-surface-variant transition-colors duration-200 flex items-center gap-1">
                Go back
            </button>
</div>
</main>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 pointer-events-none z-[-1]">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
<script>
        function handleRetry() {
            const icon = document.getElementById('retry-icon');
            icon.classList.add('rotate-180');
            
            // Simulating a loading state before showing the error again or succeeding
            const btn = icon.parentElement;
            const originalText = btn.querySelector('span:not(.material-symbols-outlined)').innerText;
            btn.style.opacity = '0.7';
            btn.querySelector('span:not(.material-symbols-outlined)').innerText = 'Connecting...';
            
            setTimeout(() => {
                icon.classList.remove('rotate-180');
                btn.style.opacity = '1';
                btn.querySelector('span:not(.material-symbols-outlined)').innerText = originalText;
                
                // Add a slight shake effect to indicate failure still persists
                btn.classList.add('translate-x-1');
                setTimeout(() => btn.classList.remove('translate-x-1'), 100);
            }, 1500);
        }

        // Handle Active State Logic for shell (if expanded to multiple pages)
        // Based on JSON: Home, Agents, Transactions, Profile. 
        // Current: Agent Registration -> Agents tab.
    </script>
