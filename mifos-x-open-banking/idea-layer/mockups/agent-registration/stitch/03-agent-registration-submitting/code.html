<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Agent Registration - Submitting</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#B2D188",
                        "on-primary": "#1F3701",
                        "primary-container": "#354E16",
                        "on-primary-container": "#CDEDA3",
                        secondary: "#A0CFCB",
                        background: "#12140E",
                        surface: "#FFFFFF",
                        "on-surface": "#E3E3D8",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                        outline: "#8F9285",
                        "outline-variant": "#C5C8BA",
                        error: "#FFB4AB",
                        pending: "#E8A317",
                        "on-surface-variant": "#C5C8BA",
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"],
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'margin-desktop': '24px',
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes spin-custom {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-spin-slow {
            animation: spin-custom 1.5s linear infinite;
        }

        /* Glassmorphism for depth without standard borders */
        .glass-overlay {
            background: rgba(30, 32, 26, 0.7);
            backdrop-filter: blur(8px);
        }
        
        .disabled-field {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-20">
<!-- Top App Bar -->
<!-- JSON Rule: TopAppBar type: small_center_aligned -->
<header class="fixed top-0 w-full z-50 bg-background border-b border-outline-variant/10 flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high/50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</div>
<h1 class="font-medium text-[18px] leading-[24px] text-on-surface">Agent Registration</h1>
<div class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high/50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">help_outline</span>
</div>
</header>
<main class="mt-16 px-margin-mobile pt-8 max-w-md mx-auto">
<!-- Header Block -->
<section class="mb-8">
<h2 class="font-semibold text-[22px] leading-[28px] text-on-surface mb-2">Agent Registration</h2>
<p class="font-normal text-[14px] leading-[20px] text-on-surface-variant">Register to become an authorised OBP field agent with your bank</p>
</section>
<!-- Form Fields (Disabled State) -->
<div class="space-y-4 mb-10">
<!-- Legal Name -->
<div class="disabled-field group">
<div class="h-14 w-full border border-outline rounded-[12px] bg-surface-container flex items-center px-4 relative">
<label class="absolute -top-2.5 left-3 bg-background px-1 text-[11px] font-medium text-outline">Legal Name</label>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface text-[16px] p-0" disabled="" type="text" value="Jonathan K. Mwangi"/>
</div>
</div>
<!-- Mobile Phone -->
<div class="disabled-field group">
<div class="h-14 w-full border border-outline rounded-[12px] bg-surface-container flex items-center px-4 relative">
<label class="absolute -top-2.5 left-3 bg-background px-1 text-[11px] font-medium text-outline">Mobile Phone Number</label>
<div class="flex items-center w-full">
<span class="text-on-surface-variant mr-2">+254</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface text-[16px] p-0" disabled="" type="text" value="712 345 678"/>
</div>
</div>
</div>
<!-- Agent Number -->
<div class="disabled-field group">
<div class="h-14 w-full border border-outline rounded-[12px] bg-surface-container flex items-center px-4 relative">
<label class="absolute -top-2.5 left-3 bg-background px-1 text-[11px] font-medium text-outline">Agent Number</label>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface text-[16px] p-0" disabled="" type="text" value="AG-8829-X"/>
</div>
</div>
<!-- Operating Currency -->
<div class="disabled-field group">
<div class="h-14 w-full border border-outline rounded-[12px] bg-surface-container flex items-center px-4 relative">
<label class="absolute -top-2.5 left-3 bg-background px-1 text-[11px] font-medium text-outline">Operating Currency</label>
<div class="flex justify-between items-center w-full">
<span class="text-on-surface text-[16px]">KES - Kenyan Shilling</span>
<span class="material-symbols-outlined text-outline">arrow_drop_down</span>
</div>
</div>
</div>
</div>
<!-- Progress Indicator -->
<div class="flex flex-col items-center justify-center space-y-4 py-6">
<div class="relative flex items-center justify-center">
<!-- Indeterminate Spinner -->
<svg class="animate-spin-slow h-8 w-8 text-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-100" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<p class="font-normal text-[14px] leading-[20px] text-on-surface-variant">Submitting your application...</p>
</div>
<!-- Button Section -->
<div class="mt-8">
<button class="w-full h-12 bg-primary-container text-on-primary-container font-semibold text-[16px] rounded-full active:scale-95 duration-200 opacity-80 cursor-not-allowed" disabled="">
                Register as Agent
            </button>
</div>
<!-- Contextual Visual Element (Bento-style background hint) -->
<div class="mt-12 grid grid-cols-2 gap-4 opacity-20 pointer-events-none">
<div class="bg-surface-container-high h-24 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">verified_user</span>
</div>
<div class="bg-surface-container-high h-24 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">account_balance</span>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Suppressed because this is a focused registration flow) -->
<!-- According to Shell Visibility & Relevance: "Suppress if page intent is Transactional/Onboarding" -->
<script>
        // Micro-interaction: Periodic label flicker for "submitting" text to show activity
        const statusText = document.querySelector('p.text-on-surface-variant');
        const labels = ["Submitting your application...", "Verifying details...", "Connecting to Mifos Core..."];
        let currentLabel = 0;

        setInterval(() => {
            statusText.style.opacity = '0';
            setTimeout(() => {
                currentLabel = (currentLabel + 1) % labels.length;
                statusText.innerText = labels[currentLabel];
                statusText.style.opacity = '1';
            }, 300);
        }, 3000);
    </script>
</body></html>
