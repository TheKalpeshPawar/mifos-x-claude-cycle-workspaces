<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #12140E;
      color: #E3E3D9;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .input-focus-ring:focus-within {
      border-color: #CEEDA2 !important;
      border-width: 2px !important;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-background": "#e3e3d9",
            "error": "#ffb4ab",
            "inverse-on-surface": "#2f312a",
            "on-error-container": "#ffdad6",
            "surface-bright": "#383a33",
            "primary": "#ceeda2",
            "on-tertiary": "#432c00",
            "secondary-fixed-dim": "#a0cfcb",
            "on-secondary-fixed": "#00201e",
            "on-primary": "#203700",
            "primary-container": "#b2d188",
            "surface": "#12140e",
            "secondary-container": "#1f4e4b",
            "on-tertiary-fixed-variant": "#604100",
            "on-error": "#690005",
            "outline": "#8e9284",
            "tertiary-fixed-dim": "#ffba3e",
            "on-tertiary-container": "#704c00",
            "surface-variant": "#34362e",
            "secondary": "#a0cfcb",
            "on-secondary": "#013735",
            "inverse-surface": "#e3e3d9",
            "primary-fixed-dim": "#b2d188",
            "on-tertiary-fixed": "#281900",
            "tertiary-container": "#ffba3f",
            "surface-container-highest": "#34362e",
            "on-surface": "#e3e3d9",
            "tertiary-fixed": "#ffdeae",
            "surface-container-lowest": "#0d0f09",
            "secondary-fixed": "#bcece7",
            "on-secondary-container": "#8fbeba",
            "on-primary-fixed": "#102000",
            "outline-variant": "#44483c",
            "on-primary-container": "#415a1f",
            "background": "#12140e",
            "surface-dim": "#12140e",
            "tertiary": "#ffdeae",
            "primary-fixed": "#cdeda1",
            "surface-tint": "#b2d188",
            "error-container": "#93000a",
            "surface-container-low": "#1a1c16",
            "on-primary-fixed-variant": "#354e14",
            "on-secondary-fixed-variant": "#1f4e4b",
            "surface-container": "#1e201a",
            "inverse-primary": "#4c662a",
            "surface-container-high": "#292b24",
            "on-surface-variant": "#c4c8b9"
          },
          "spacing": {
            "margin-tablet": "24px",
            "gutter": "16px",
            "xl": "32px",
            "md": "16px",
            "sm": "8px",
            "xs": "4px",
            "base": "4px",
            "lg": "24px",
            "margin-mobile": "16px",
            "margin-desktop": "48px"
          },
          "fontFamily": {
            "label-md": ["Outfit"],
            "headline-lg-mobile": ["Outfit"],
            "label-sm": ["Outfit"],
            "body-lg": ["Outfit"],
            "headline-sm": ["Outfit"],
            "headline-md": ["Outfit"],
            "body-md": ["Outfit"],
            "label-lg": ["Outfit"],
            "body-sm": ["Outfit"],
            "headline-lg": ["Outfit"]
          },
          "fontSize": {
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
            "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
            "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
            "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
            "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600"}],
            "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- Shared Component: TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-background border-b border-outline-variant/20">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:bg-surface-variant/50 transition-colors p-2 rounded-full active:scale-95 duration-100" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface font-bold">Agent Registration</h1>
</div>
<div class="flex items-center">
<button class="material-symbols-outlined text-primary hover:bg-surface-variant/50 transition-colors p-2 rounded-full active:scale-95 duration-100" data-icon="help">help</button>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-20 max-w-xl mx-auto">
<!-- Header Section -->
<section class="px-margin-tablet pt-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Agent Registration</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 max-w-[280px]">
        Register to become an authorised OBP field agent with your bank
      </p>
</section>
<!-- Registration Form -->
<section class="px-margin-tablet pt-lg flex flex-col gap-3">
<!-- Legal Name -->
<div class="input-focus-ring flex flex-col justify-center h-14 w-full rounded-xl border border-outline/20 bg-surface-container px-4 transition-all">
<label class="font-label-md text-label-md text-outline">Legal Name</label>
<input class="bg-transparent border-none p-0 font-body-md text-on-surface focus:ring-0 w-full h-6" type="text" value="Amara Osei"/>
</div>
<!-- Phone Number -->
<div class="input-focus-ring flex flex-col justify-center h-14 w-full rounded-xl border border-outline/20 bg-surface-container px-4 transition-all">
<label class="font-label-md text-label-md text-outline">Mobile Phone Number</label>
<div class="flex items-center gap-1">
<span class="font-body-md text-on-surface-variant">+254</span>
<input class="bg-transparent border-none p-0 font-body-md text-on-surface focus:ring-0 w-full h-6" type="tel" value="712345678"/>
</div>
</div>
<!-- Agent Number -->
<div class="input-focus-ring flex flex-col justify-center h-14 w-full rounded-xl border border-outline/20 bg-surface-container px-4 transition-all">
<label class="font-label-md text-label-md text-outline">Agent Number</label>
<input class="bg-transparent border-none p-0 font-body-md text-on-surface focus:ring-0 w-full h-6" type="text" value="AG-20240115"/>
</div>
<!-- Operating Currency -->
<div class="input-focus-ring flex flex-col justify-center h-14 w-full rounded-xl border border-outline/20 bg-surface-container px-4 transition-all">
<label class="font-label-md text-label-md text-outline">Operating Currency</label>
<input class="bg-transparent border-none p-0 font-body-md text-on-surface focus:ring-0 w-full h-6" type="text" value="KES"/>
</div>
</section>
<!-- Chip Section -->
<section class="px-margin-tablet pt-md">
<h3 class="font-label-lg text-label-lg text-on-surface-variant mb-2">Supported Services</h3>
<div class="flex flex-wrap gap-2">
<!-- Active Chips -->
<button class="h-8 px-4 rounded-lg bg-on-primary-fixed-variant text-primary-fixed flex items-center justify-center font-label-md active:scale-95 transition-transform">
          Cash Deposit
        </button>
<button class="h-8 px-4 rounded-lg bg-on-primary-fixed-variant text-primary-fixed flex items-center justify-center font-label-md active:scale-95 transition-transform">
          Cash Withdrawal
        </button>
<button class="h-8 px-4 rounded-lg bg-on-primary-fixed-variant text-primary-fixed flex items-center justify-center font-label-md active:scale-95 transition-transform">
          Account Opening
        </button>
<!-- Inactive Chips -->
<button class="h-8 px-4 rounded-lg bg-surface-container border border-outline/10 text-on-surface flex items-center justify-center font-label-md active:scale-95 transition-transform">
          Bill Payment
        </button>
<button class="h-8 px-4 rounded-lg bg-surface-container border border-outline/10 text-on-surface flex items-center justify-center font-label-md active:scale-95 transition-transform">
          Fund Transfer
        </button>
</div>
</section>
<!-- Footer Form Area -->
<section class="px-margin-tablet pt-3">
<div class="input-focus-ring flex flex-col justify-center h-14 w-full rounded-xl border border-outline/20 bg-surface-container px-4 transition-all">
<label class="font-label-md text-label-md text-outline">Commission Rate (%)</label>
<input class="bg-transparent border-none p-0 font-body-md text-on-surface focus:ring-0 w-full h-6" type="text" value="2.5"/>
</div>
<p class="font-label-sm text-label-sm text-outline mt-2 leading-relaxed">
        By registering, you agree to the Mifos Agent Terms and Conditions
      </p>
</section>
<!-- Primary Action -->
<section class="px-margin-tablet pt-lg pb-xl">
<button class="w-full h-12 bg-primary-container text-on-primary flex items-center justify-center rounded-full font-label-lg active:scale-[0.98] transition-all shadow-lg shadow-primary/10">
        Register as Agent
      </button>
</section>
</main>
<!-- Shared Component: BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-container shadow-[0_-4px_12px_rgba(0,0,0,0.2)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person_add" style="font-variation-settings: 'FILL' 1;">person_add</span>
<span class="font-label-md text-label-md">Agents</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-md text-label-md">Transactions</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_circle">account_circle</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<script>
    // Subtle interaction effect for the primary button
    document.querySelector('button.bg-primary-container').addEventListener('mousedown', function() {
      this.classList.add('brightness-90');
    });
    document.querySelector('button.bg-primary-container').addEventListener('mouseup', function() {
      this.classList.remove('brightness-90');
    });

    // Simple ripple-like effect on inputs
    const inputs = document.querySelectorAll('.input-focus-ring');
    inputs.forEach(input => {
      input.addEventListener('click', () => {
        input.classList.add('bg-surface-container-high');
        setTimeout(() => input.classList.remove('bg-surface-container-high'), 200);
      });
    });
  </script>
</body></html>
