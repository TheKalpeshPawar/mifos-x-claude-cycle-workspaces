<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .registration-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Component -->
<!-- Managed by JSON Identity: TopAppBar | type: small_center_aligned -->
<header class="fixed top-0 left-0 w-full h-16 z-50 flex items-center justify-between px-4 bg-background border-none shadow-none">
<div class="flex items-center justify-center w-10 h-10 cursor-pointer transition-transform duration-200 active:scale-95" data-interaction="back">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-title-lg text-title-lg text-on-surface text-center flex-1">Agent Registration</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center pt-16 pb-20 px-4 max-w-container-max mx-auto w-full">
<!-- Content Container centered horizontally -->
<div class="flex flex-col items-center text-center w-full max-w-md">
<!-- Empty Illustration -->
<div class="mt-[64px] transition-all duration-700 ease-out opacity-0 translate-y-4" id="illustration-container">
<img alt="Unactivated agent ID card illustration" class="w-[160px] h-[160px] object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ujz49dEytmfQiBAr9RYqXyOT_gBBj_DsNGi1N5I1IYze66UiXJ408FBF-40YTNfbzBRev-BiQO0ByQzyZuLhK5YSteWlTUoVmFBLYWDMPF_tNiC_GjN5885XHtaT0mErWCgiIbR0ETD2cxwWHAy1s15NTn2j9By9lDLu7IslB_oMFxbfD9r_CFzy4pO1C45KdaeDVDNZ2vwMZE5pIT_edJqyY41CBoOqRirBCAFVsD0OXoRwmfqTmnfY4lL"/>
</div>
<!-- Empty Title -->
<h2 class="mt-6 px-8 font-headline-md text-headline-md text-on-surface">
                No Agent Profile Found
            </h2>
<!-- Empty Subtitle -->
<p class="mt-2 px-12 font-body-md text-body-md text-on-surface-variant leading-[20px] max-w-[320px]">
                You are not yet registered as an OBP field agent. Complete the registration below to get started.
            </p>
<!-- Action Button -->
<div class="mt-8 w-full px-8">
<button class="registration-button w-full h-[48px] bg-primary-container text-on-primary-fixed rounded-full font-label-lg text-label-lg transition-all duration-200 flex items-center justify-center hover:brightness-110">
                    BEGIN REGISTRATION
                </button>
</div>
</div>
</main>
<!-- BottomNavBar Component -->
<!-- Managed by JSON Identity: BottomNavBar | Active State: Profile (Contextual fallback for agent registration context) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container shadow-none border-none">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 cursor-pointer transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="home_app_logo">home_app_logo</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 cursor-pointer transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-label-md text-label-md">Agents</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 cursor-pointer transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="assignment">assignment</span>
<span class="font-label-md text-label-md">Tasks</span>
</div>
<!-- Active Tab: Profile (Closest mapping to registration/account status) -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 cursor-pointer transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Profile</span>
</div>
</nav>
<script>
        // Micro-interaction for content entrance
        window.addEventListener('DOMContentLoaded', () => {
            const illustration = document.getElementById('illustration-container');
            setTimeout(() => {
                illustration.classList.remove('opacity-0', 'translate-y-4');
                illustration.classList.add('opacity-100', 'translate-y-0');
            }, 100);
        });

        // Atmospheric effect: Subtle pulse on the registration button to draw focus
        const btn = document.querySelector('.registration-button');
        if (btn) {
            setInterval(() => {
                btn.classList.add('brightness-110');
                setTimeout(() => btn.classList.remove('brightness-110'), 1500);
            }, 4000);
        }
    </script>
