<style>

<!-- FAB Suppression: This is a loading state for messages, FAB is not shown until data is ready to maintain focus. -->
<script>
        // Micro-interaction: Subtle parallax shift on load
        window.addEventListener('DOMContentLoaded', () => {
            const listItems = document.querySelectorAll('.animate-shimmer');
            listItems.forEach((item, index) => {
                item.style.animationDelay = `${index * 100}ms`;
            });
        });
    </script>
