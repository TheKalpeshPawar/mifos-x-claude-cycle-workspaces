<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=393, height=852, initial-scale=1.0" name="viewport"/>
<title>Security Error - HSBC Open Banking</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#95CDF7",
            on_primary: "#00344E",
            primary_container: "#004B6F",
            secondary: "#50606E",
            tertiary: "#64597B",
            background: "#101417",
            surface: "#101417",
            surface_container: "#1C2024",
            on_surface: "#E0E3E8",
            on_surface_variant: "#C1C7CE",
            outline: "#72787E",
            error: "#FFB4AB",
            error_container: "#93000A",
            on_error_container: "#FFB4AB"
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            display: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            label: ["Outfit", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          },
          borderRadius: {
            small: "8px",
            medium: "12px",
            large: "16px",
            extra_large: "28px",
            full: "9999px"
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #101417;
      color: #E0E3E8;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      width: 393px;
      height: 852px;
      overflow: hidden;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
    }
    .btn-active:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    /* Smooth transition for entry */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<!-- Top App Bar (Shared Component Strategy: Logic Locked to Security Context) -->
<header class="fixed top-0 w-full z-50 flex items-center px-4 h-[64px] bg-surface">
<div class="flex items-center justify-between w-full">
<h1 class="font-headline text-[20px] font-medium text-on-surface">Security alert</h1>
<!-- No leading or trailing icons as per constraints -->
</div>
</header>
<main class="flex-1 mt-[64px] px-4 flex flex-col items-center">
<!-- Banner: High Priority Security Notification -->
<div class="fade-in mt-4 w-full min-h-[56px] bg-error_container rounded-small flex items-center p-3 gap-3">
<span class="material-symbols-outlined text-on-error_container text-[20px]" data-icon="gpp_bad">gpp_bad</span>
<p class="font-body text-[13px] leading-tight text-on-error_container">
        This request could not be verified. Your session has been terminated for your protection.
      </p>
</div>
<!-- Stat Block: Centered Visual Anchor -->
<div class="flex-1 flex flex-col items-center justify-center text-center -mt-16 fade-in" style="animation-delay: 0.1s;">
<div class="mb-4">
<span class="material-symbols-outlined text-error text-[72px]" data-icon="gpp_bad">gpp_bad</span>
</div>
<h2 class="font-headline text-[22px] font-medium text-on-surface mb-2">
        Security check failed
      </h2>
<p class="font-body text-[14px] text-on-surface-variant max-w-[280px] leading-relaxed">
        The callback state token did not match. This may indicate a session replay attempt. Start a new session from the Consents screen.
      </p>
</div>
<!-- Primary Action -->
<div class="w-full pb-10 fade-in" style="animation-delay: 0.2s;">
<button class="btn-active w-full h-[48px] bg-primary rounded-full flex items-center justify-center transition-all duration-200 shadow-lg">
<span class="font-headline font-medium text-[14px] text-on_primary">Start over</span>
</button>
</div>
</main>
<!-- Bottom Navigation (Excluded per Suppression Rules: Task-Focused/Security Error State) -->
<!-- The navigation shell is suppressed to prioritize the critical security recovery action -->
<script>
    // Simple micro-interaction for the button
    document.querySelector('button').addEventListener('click', () => {
      // Simulate redirection with a slight delay for tactile feedback
      setTimeout(() => {
        console.log("Redirecting to start of consent flow...");
      }, 150);
    });

    // Handle Material Symbols weight application logic
    document.querySelectorAll('.material-symbols-outlined').forEach(span => {
      const iconName = span.getAttribute('data-icon');
      if (iconName) {
        span.textContent = iconName;
      }
    });
  </script>
</body></html>
