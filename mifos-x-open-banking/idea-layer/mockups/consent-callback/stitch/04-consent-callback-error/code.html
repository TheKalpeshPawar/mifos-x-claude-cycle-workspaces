<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=393, height=852, initial-scale=1.0" name="viewport"/>
<title>Connection Error - Open Banking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#95CDF7",
                        "on-primary": "#00344E",
                        "primary-container": "#004B70",
                        secondary: "#50606E",
                        tertiary: "#64597B",
                        background: "#101417",
                        surface: "#101417",
                        "surface-container": "#1C2024",
                        "on-surface": "#E0E3E8",
                        "on-surface-variant": "#C1C7CE",
                        outline: "#8B9198",
                        error: "#FFB4AB",
                        "on-error": "#690005",
                        positive: "#95CDF7",
                        negative: "#FFB4AB"
                    },
                    borderRadius: {
                        "small": "8px",
                        "medium": "12px",
                        "large": "16px",
                        "extra_large": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #101417;
            color: #E0E3E8;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen selection:bg-primary/30">
<!-- Top App Bar (As per JSON/Prompt Override) -->
<!-- Note: BottomNavBar suppressed for transactional error state per instructions -->
<header class="fixed top-0 w-full z-50 h-16 flex items-center px-4 bg-surface">
<h1 class="font-headline text-[20px] font-medium leading-normal text-on-surface">
            Connecting HSBC
        </h1>
</header>
<!-- Main Content: Error State -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-16">
<!-- Error Content Cluster -->
<div class="w-full max-w-sm flex flex-col items-center text-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Animated Shader Background (Subtle atmospheric effect) -->
<div class="relative w-full h-48 flex items-center justify-center overflow-hidden mb-8">
<!-- Cloud Off Icon -->
<div class="relative z-10 w-24 h-24 bg-surface-container rounded-full flex items-center justify-center shadow-2xl">
<span class="material-symbols-outlined text-[72px] text-error" data-icon="cloud_off">cloud_off</span>
</div>
</div>
<!-- Typography Content -->
<div class="space-y-2 mb-10">
<h2 class="font-headline text-[22px] font-medium text-on-surface">
                    Connection failed
                </h2>
<p class="font-body text-[14px] leading-relaxed text-on-surface-variant max-w-[280px] mx-auto">
                    We received your HSBC redirect but could not complete the connection. Check your network and try again.
                </p>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-2">
<!-- Primary Action -->
<button class="h-12 w-full bg-primary text-on-primary font-headline text-[14px] font-medium rounded-full active:scale-95 transition-transform duration-200 flex items-center justify-center" onclick="window.location.reload()">
                    Try again
                </button>
<!-- Secondary Action -->
<button class="h-12 w-full text-on-surface-variant font-headline text-[14px] font-medium rounded-full hover:bg-on-surface/5 active:scale-95 transition-transform duration-200 flex items-center justify-center">
                    Back to Home
                </button>
</div>
</div>
<!-- Decorative Asset at Bottom -->
<div class="mt-16 opacity-30">
<div class="w-12 h-1 bg-surface-container rounded-full"></div>
</div>
</main>
<!-- Visual Polish: Soft Glow -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[150%] h-64 bg-primary/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<script>
        // Micro-interaction for feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
</body></html>
