<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Consent Success - HSBC Connected</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;family=Outfit:wght@400;500;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#95CDF7",
              on_primary: "#00344E",
              primary_container: "#004B6F",
              on_primary_container: "#C9E6FF",
              secondary: "#50606E",
              tertiary: "#64597B",
              background: "#101417",
              surface: "#101417",
              surface_container: "#1C2024",
              on_surface: "#E0E3E8",
              on_surface_variant: "#C1C7CE",
              outline: "#8B9198",
              error: "#FFB4AB",
              positive: "#95CDF7",
              negative: "#FFB4AB",
            },
            borderRadius: {
              "small": "8px",
              "medium": "12px",
              "large": "16px",
              "extra_large": "28px",
              "full": "9999px"
            },
            fontFamily: {
              headline: ["Outfit", "Public Sans", "sans-serif"],
              display: ["Outfit", "Public Sans", "sans-serif"],
              body: ["Outfit", "Public Sans", "sans-serif"],
              label: ["Outfit", "Public Sans", "sans-serif"],
              mono: ["Roboto Mono", "monospace"]
            }
          },
        },
      }
    </script>
<style>
      body {
        background-color: #101417;
        color: #E0E3E8;
        font-family: 'Outfit', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .fill-icon {
        font-variation-settings: 'FILL' 1;
      }
      /* Custom shadow for dark mode depth */
      .depth-1 {
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.4);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<!-- Following Shared Components Logic: Transactional screen - No Bottom Nav, No Back Button -->
<header class="fixed top-0 w-full z-50 bg-surface flex items-center justify-center px-4 h-16">
<h1 class="font-headline text-lg font-medium text-on-surface">HSBC Connected</h1>
</header>
<main class="flex-1 w-full max-w-md px-6 flex flex-col justify-center items-center text-center pt-20 pb-12">
<!-- Success Stat Block -->
<div class="mb-10 flex flex-col items-center">
<div class="mb-6 animate-in fade-in zoom-in duration-700">
<span class="material-symbols-outlined text-[72px] text-primary fill-icon" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<h2 class="text-2xl font-medium text-on-surface mb-4">Access granted</h2>
<p class="text-[15px] leading-relaxed text-on-surface-variant max-w-[280px]">
                Your HSBC current and savings accounts are now connected. Balances and transactions will refresh automatically.
            </p>
</div>
<!-- Security Banner -->
<div class="w-full bg-primary_container rounded-xl p-4 flex items-start gap-4 text-left mb-12">
<span class="material-symbols-outlined text-primary mt-0.5">
                shield
            </span>
<p class="text-[13px] leading-snug text-on_primary_container">
                Connection secured under UK Open Banking. You can revoke access any time from Consents.
            </p>
</div>
<!-- Illustration Area (Atmospheric) -->
<div class="w-full h-48 relative mb-12 flex justify-center items-center">

<!-- Data Visual Representation -->
<div class="relative z-10 flex gap-3">
<div class="w-12 h-16 bg-surface_container rounded-lg border border-outline/20 flex flex-col items-center justify-center gap-1">
<div class="w-6 h-1 bg-primary/40 rounded-full"></div>
<div class="w-4 h-1 bg-primary/20 rounded-full"></div>
</div>
<div class="w-14 h-20 bg-surface_container rounded-lg border border-primary/30 flex flex-col items-center justify-center gap-1 shadow-lg -translate-y-2">
<div class="w-8 h-1 bg-primary rounded-full"></div>
<div class="w-6 h-1 bg-primary/60 rounded-full"></div>
<div class="w-4 h-1 bg-primary/30 rounded-full"></div>
</div>
<div class="w-12 h-16 bg-surface_container rounded-lg border border-outline/20 flex flex-col items-center justify-center gap-1">
<div class="w-6 h-1 bg-primary/40 rounded-full"></div>
<div class="w-4 h-1 bg-primary/20 rounded-full"></div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-3 mt-auto">
<button class="w-full py-4 bg-primary text-on_primary font-medium rounded-[24px] text-sm transition-transform active:scale-95 shadow-lg">
                Go to Consents
            </button>
<button class="w-full py-4 bg-transparent border border-primary text-primary font-medium rounded-[24px] text-sm transition-colors hover:bg-primary/5 active:scale-95">
                Back to Home
            </button>
</div>
</main>
<!-- Bottom Nav is suppressed for Transactional Success Screen per Shared Components Logic -->
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                // Feedback or Navigation Logic
                console.log('Action triggered:', this.innerText);
            });
        });

        // Background subtle parallax or entry animation
        document.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main');
            mainContent.classList.add('transition-all', 'duration-1000', 'ease-out');
            mainContent.style.opacity = '1';
            mainContent.style.transform = 'translateY(0)';
        });
    </script>
</body></html>
