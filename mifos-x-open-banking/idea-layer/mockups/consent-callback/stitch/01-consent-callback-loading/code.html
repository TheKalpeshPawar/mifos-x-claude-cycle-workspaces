</main>

<script>
        // Micro-interaction: Subtle atmospheric glow movement
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('glow-container');
            const glowCount = 2;

            for (let i = 0; i < glowCount; i++) {
                const glow = document.createElement('div');
                glow.style.position = 'absolute';
                glow.style.width = '300px';
                glow.style.height = '300px';
                glow.style.borderRadius = '50%';
                glow.style.background = 'radial-gradient(circle, #95CDF7 0%, transparent 70%)';
                glow.style.filter = 'blur(60px)';
                glow.style.top = Math.random() * 100 + '%';
                glow.style.left = Math.random() * 100 + '%';
                glow.style.transition = 'all 8s ease-in-out';
                container.appendChild(glow);

                const animateGlow = (el) => {
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    el.style.transform = `translate(${x - 50}%, ${y - 50}%) scale(${0.8 + Math.random()})`;
                    setTimeout(() => animateGlow(el), 8000 + Math.random() * 2000);
                };
                animateGlow(glow);
            }
        });
    </script>
