<body class="bg-background">
<!-- Pixel 5 Frame Simulation Container -->
<div class="app-container shadow-2xl flex flex-col">
<!-- Component 1: Top App Bar -->
<header class="h-16 w-full px-margin-mobile flex items-center bg-background sticky top-0 z-50">
<h1 class="font-title-lg text-title-lg text-on-background font-medium">Connecting HSBC</h1>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile">
<!-- Atmospheric Background Element (Subtle) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full pointer-events-none opacity-20 overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary rounded-full blur-[120px] mix-blend-soft-light opacity-10"></div>
</div>
<!-- Component 2: Empty State Area (Centered) -->
<div class="w-full h-[300px] flex flex-col items-center justify-center text-center relative z-10">
<!-- Icon Container -->
<div class="relative mb-stack-lg flex items-center justify-center">
<div class="absolute w-24 h-24 bg-surface-container rounded-full pulse-animation"></div>
<span class="material-symbols-outlined text-[72px] text-on-surface-variant relative z-10" style="font-variation-settings: 'wght' 200;">pending</span>
</div>
<!-- Headline -->
<h2 class="font-title-lg text-title-lg text-on-background font-medium mb-2 max-w-[280px]">
                    Awaiting confirmation
                </h2>
<!-- Body Text -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[300px]">
                    We have not yet received your authorisation from HSBC. This may take a few moments.
                </p>
<!-- Button Actions -->
<div class="mt-[24px] w-full flex flex-col items-center">
<!-- Component 3: Primary Button -->
<button class="w-full max-w-[280px] h-12 bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center transition-all active:scale-95 active:opacity-90">
                        Check again
                    </button>
<!-- Component 4: Text Button -->
<button class="mt-2 w-full max-w-[280px] h-12 text-on-surface-variant font-label-lg text-label-lg rounded-full flex items-center justify-center transition-all hover:bg-surface-container active:bg-surface-variant">
                        Cancel
                    </button>
</div>
</div>
</main>
<!-- Decorative Progress Indicator (Atmospheric) -->
<div class="w-full px-margin-mobile pb-12">
<div class="w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 transition-all duration-1000 ease-in-out" id="progress-bar"></div>
</div>
</div>
</div>
<script>
        // Micro-interaction: Progress Bar Simulation
        const bar = document.getElementById('progress-bar');
        let width = 25;
        setInterval(() => {
            if (width >= 90) {
                width = 85; // Stay near end but don't finish
            } else {
                width += Math.random() * 2;
            }
            bar.style.width = width + '%';
        }, 2000);

        // Interaction for buttons
        document.querySelector('.bg-primary').addEventListener('click', function() {
            const originalText = this.innerText;
            this.innerText = 'Checking...';
            this.disabled = true;
            this.style.opacity = '0.7';
            
            setTimeout(() => {
                this.innerText = originalText;
                this.disabled = false;
                this.style.opacity = '1';
                width = 25; // Reset progress bar visual
                bar.style.width = '25%';
            }, 1500);
        });
    </script>
