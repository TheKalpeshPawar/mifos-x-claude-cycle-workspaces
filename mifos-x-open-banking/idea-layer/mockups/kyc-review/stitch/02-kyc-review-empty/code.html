<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface min-h-screen pb-bottom-nav-height">
<!-- Top App Bar (Shared Component Strategy) -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant h-16 flex items-center justify-between px-margin-mobile">
<button aria-label="Go back" class="material-symbols-outlined text-primary p-2 hover:bg-surface-container-highest/50 transition-colors rounded-full active:opacity-70">
            arrow_back
        </button>
<h1 class="text-on-surface font-semibold text-lg">KYC Review</h1>
<button aria-label="Account" class="material-symbols-outlined text-on-surface-variant p-2 hover:bg-surface-container-highest/50 transition-colors rounded-full">
            account_circle
        </button>
</header>
<main class="pt-20 px-gutter-md max-w-lg mx-auto flex flex-col items-center">
<!-- Empty State Hero Section -->
<section class="w-full flex flex-col items-center mt-12 mb-10 text-center animate-fade-in">
<div class="relative w-32 h-32 mb-8">
<div class="absolute inset-0 bg-accent/10 rounded-full blur-2xl animate-pulse"></div>
<img alt="Completed tasks illustration" class="w-full h-full object-contain relative z-10" data-alt="A minimalist digital illustration of a clean white document folder with a bold green checkmark icon floating above it. The aesthetic is clean and corporate modern, set against a dark verdant background with soft atmospheric lighting. The lighting is low-key with a subtle emerald glow emanating from behind the folder to symbolize security and completion. Professional banking app style with sharp lines and high-contrast dark mode palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8c3fS8Ul5oVDnmY3Z5Zd6p_tj3uKfanUN8fihQAhPItr1ErVcKgvZWFwzbBc5bVeFb6acf-XsfYL0-j_po_6CLcMWx2dld0fQVMb35rsq-Gs25n_AjPYOjd-nN39uGFN8pkkZshY96zhr3ecVeYVeZuGGA9GtHGHpnroWfmIEVS-2EIYSymArwsl5v-90Y3jEIiMHSnj-QaPu0KK6gxh1Be4Ur9yT-QZQ65pTtKIme4AMbeOgVy-I5N18KIi2HBVEdk9fozy-gDHF"/>
</div>
<h2 class="text-[24px] font-semibold leading-tight text-on-surface mb-3">
                No Pending Reviews
            </h2>
<p class="text-[14px] text-on-surface-variant max-w-[280px] leading-relaxed">
                All assigned customer identity reviews are complete. Search below to start a new verification.
            </p>
</section>
<!-- Performance Success Metric -->
<section class="w-full mb-10">
<div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center border-accent/20">
<div class="flex items-center gap-3 mb-1">
<span class="material-symbols-outlined text-accent text-[32px]" style="font-variation-settings: 'FILL' 1;">
                        verified
                    </span>
<span class="text-[20px] font-bold text-accent">100%</span>
</div>
<span class="text-label-md text-on-surface-variant uppercase tracking-wider font-medium">Weekly Completion</span>
<div class="w-full h-1 bg-surface-container-highest rounded-full mt-4 overflow-hidden">
<div class="h-full bg-accent w-full shadow-[0_0_8px_rgba(178,209,136,0.5)]"></div>
</div>
</div>
</section>
<!-- Input Section -->
<section class="w-full space-y-6 mb-12">
<div class="flex items-center justify-between">
<h3 class="text-[16px] font-medium text-on-surface">Manual Lookup</h3>
<span class="h-[1px] flex-grow ml-4 bg-outline-variant"></span>
</div>
<div class="space-y-4">
<!-- Customer ID Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-accent transition-transform group-focus-within:scale-110">
                        badge
                    </span>
<input class="w-full h-14 bg-surface border border-outline rounded-xl pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-all" placeholder="Customer ID" type="text"/>
</div>
<!-- Phone Number Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-accent transition-transform group-focus-within:scale-110">
                        phone_iphone
                    </span>
<input class="w-full h-14 bg-surface border border-outline rounded-xl pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-all" placeholder="Phone Number" type="tel"/>
</div>
</div>
</section>
<!-- Actions -->
<section class="w-full flex flex-col gap-4 mb-8">
<button class="w-full h-14 bg-accent text-on-accent font-bold rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg shadow-accent/10">
<span class="material-symbols-outlined">search</span>
                Search for Customer
            </button>
<button class="w-full h-14 border border-accent text-accent font-semibold rounded-xl flex items-center justify-center gap-2 hover:bg-accent/5 active:scale-95 transition-all">
<span class="material-symbols-outlined">history</span>
                View Review History
            </button>
<button class="w-full py-4 text-accent font-medium text-[14px] hover:underline active:opacity-70 transition-opacity">
                Return to Dashboard
            </button>
</section>
</main>
<!-- Navigation Bar (Shared Component Strategy) -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-high/80 backdrop-blur-xl flex justify-around items-center px-4 pb-4 pt-2 border-t border-outline-variant shadow-lg h-20">
<div class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors cursor-pointer active:scale-90">
<span class="material-symbols-outlined">home</span>
<span class="text-[12px] mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-transform cursor-pointer active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="text-[12px] mt-0.5">History</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors cursor-pointer active:scale-90">
<span class="material-symbols-outlined">group</span>
<span class="text-[12px] mt-1">Agents</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors cursor-pointer active:scale-90">
<span class="material-symbols-outlined">person</span>
<span class="text-[12px] mt-1">Profile</span>
</div>
</nav>
<script>
        // Micro-interactions for button ripple effects or feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Simple Fade-in Animation logic on load
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelector('main').classList.add('opacity-100');
        });
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        .opacity-0 { opacity: 0; }
        .opacity-100 { opacity: 1; transition: opacity 0.5s ease-in; }
    </style>
</body></html>
