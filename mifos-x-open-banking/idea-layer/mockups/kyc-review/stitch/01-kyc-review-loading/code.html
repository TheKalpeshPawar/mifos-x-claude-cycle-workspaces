<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KYC Review - Skeleton Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        primary_container: "#CDEDA3",
                        on_primary: "#FFFFFF",
                        on_primary_container: "#102000",
                        secondary: "#386663",
                        secondary_container: "#BCEBE7",
                        error: "#BA1A1A",
                        pending: "#E8A317",
                        background: "#12140E",
                        surface: "#1E201A",
                        surface_variant: "#44483D",
                        surface_container: "#282A24",
                        surface_container_high: "#33352E",
                        on_background: "#E4E3DA",
                        on_surface: "#E4E3DA",
                        on_surface_variant: "#C5C8BA",
                        outline: "#8F9285",
                        outline_variant: "#44483D",
                        nav_active_indicator: "#4C662B"
                    },
                    borderRadius: {
                        "none": "0px",
                        "sm": "4px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-effect {
            background: linear-gradient(90deg, #1E201A 25%, #282A24 50%, #1E201A 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        .content-shimmer {
            background: linear-gradient(90deg, #282A24 25%, #33352E 50%, #282A24 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E4E3DA;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased overflow-hidden">
<!-- TopAppBar Skeleton -->
<header class="flex items-center w-full px-4 h-14 bg-background fixed top-0 left-0 z-50">
<div class="w-10 h-10 flex items-center justify-center rounded-full content-shimmer">
<span class="material-symbols-outlined text-surface_variant">arrow_back</span>
</div>
<div class="flex-1 flex justify-center">
<div class="h-6 w-32 rounded-md content-shimmer"></div>
</div>
<div class="w-10 h-10"></div>
</header>
<!-- Scrollable Content -->
<main class="mt-14 mb-20 px-4 py-6 space-y-6 max-w-md mx-auto">
<!-- Header Section: Application Summary -->
<div class="w-full h-24 rounded-lg shimmer-effect flex flex-col justify-center px-4 space-y-3">
<div class="h-4 w-24 rounded-sm content-shimmer opacity-60"></div>
<div class="h-6 w-48 rounded-sm content-shimmer"></div>
</div>
<!-- Profile Section -->
<div class="flex items-center p-4 rounded-md border border-outline_variant shimmer-effect space-x-4">
<div class="w-16 h-16 rounded-full content-shimmer"></div>
<div class="flex-1 space-y-2">
<div class="h-5 w-3/4 rounded-sm content-shimmer"></div>
<div class="h-4 w-1/2 rounded-sm content-shimmer opacity-70"></div>
</div>
</div>
<!-- Verification Status Section -->
<div class="space-y-3">
<div class="h-4 w-40 rounded-sm content-shimmer mb-2"></div>
<div class="space-y-2">
<!-- Status Row 1 -->
<div class="flex items-center justify-between p-3 rounded-md bg-surface border border-outline_variant">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full content-shimmer"></div>
<div class="h-4 w-24 rounded-sm content-shimmer"></div>
</div>
<div class="h-6 w-16 rounded-pill content-shimmer"></div>
</div>
<!-- Status Row 2 -->
<div class="flex items-center justify-between p-3 rounded-md bg-surface border border-outline_variant">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full content-shimmer"></div>
<div class="h-4 w-32 rounded-sm content-shimmer"></div>
</div>
<div class="h-6 w-16 rounded-pill content-shimmer"></div>
</div>
<!-- Status Row 3 -->
<div class="flex items-center justify-between p-3 rounded-md bg-surface border border-outline_variant">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full content-shimmer"></div>
<div class="h-4 w-28 rounded-sm content-shimmer"></div>
</div>
<div class="h-6 w-16 rounded-pill content-shimmer"></div>
</div>
</div>
</div>
<!-- Documents Section -->
<div class="space-y-3">
<div class="h-4 w-32 rounded-sm content-shimmer mb-2"></div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 rounded-md shimmer-effect border border-outline_variant flex flex-col items-center justify-center p-4 space-y-2">
<div class="w-10 h-10 rounded-sm content-shimmer"></div>
<div class="h-3 w-20 rounded-sm content-shimmer"></div>
</div>
<div class="h-32 rounded-md shimmer-effect border border-outline_variant flex flex-col items-center justify-center p-4 space-y-2">
<div class="w-10 h-10 rounded-sm content-shimmer"></div>
<div class="h-3 w-20 rounded-sm content-shimmer"></div>
</div>
</div>
</div>
<!-- Risk Assessment Section -->
<div class="p-4 rounded-md border border-outline_variant shimmer-effect space-y-4">
<div class="flex justify-between items-center">
<div class="h-4 w-36 rounded-sm content-shimmer"></div>
<div class="h-4 w-12 rounded-sm content-shimmer"></div>
</div>
<div class="w-full h-3 rounded-full content-shimmer overflow-hidden">
<div class="h-full w-2/3 bg-primary/20"></div>
</div>
</div>
<!-- Reviewer Notes -->
<div class="space-y-2">
<div class="h-4 w-32 rounded-sm content-shimmer mb-2"></div>
<div class="h-32 w-full rounded-md shimmer-effect border border-outline_variant p-4">
<div class="space-y-2">
<div class="h-3 w-full rounded-sm content-shimmer"></div>
<div class="h-3 w-5/6 rounded-sm content-shimmer"></div>
<div class="h-3 w-4/6 rounded-sm content-shimmer"></div>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="pt-6 space-y-3">
<div class="h-12 w-full rounded-pill content-shimmer"></div>
<div class="h-12 w-full rounded-pill shimmer-effect border border-outline_variant"></div>
<div class="flex justify-center">
<div class="h-10 w-32 rounded-sm content-shimmer opacity-50"></div>
</div>
</div>
</main>
<!-- BottomNavBar Skeleton -->
<nav class="fixed bottom-0 left-0 w-full h-20 z-50 flex justify-around items-center px-2 bg-background border-t border-outline_variant">
<!-- Dashboard -->
<div class="flex flex-col items-center justify-center gap-1 px-5 py-1">
<div class="w-8 h-8 rounded-full content-shimmer"></div>
<div class="h-3 w-12 rounded-sm content-shimmer"></div>
</div>
<!-- Active -->
<div class="flex flex-col items-center justify-center gap-1 px-5 py-1">
<div class="w-8 h-8 rounded-full content-shimmer"></div>
<div class="h-3 w-10 rounded-sm content-shimmer"></div>
</div>
<!-- Verify (Active Tab) -->
<div class="flex flex-col items-center justify-center gap-1 bg-surface_container rounded-full px-5 py-1">
<div class="w-12 h-8 rounded-full content-shimmer"></div>
<div class="h-3 w-10 rounded-sm content-shimmer"></div>
</div>
<!-- History -->
<div class="flex flex-col items-center justify-center gap-1 px-5 py-1">
<div class="w-8 h-8 rounded-full content-shimmer"></div>
<div class="h-3 w-10 rounded-sm content-shimmer"></div>
</div>
</nav>
<!-- Micro-interaction script for soft shimmer pulse enhancement -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.content-shimmer, .shimmer-effect');
            shimmers.forEach((el, index) => {
                // Add a slight stagger to the animation for a more natural loading feel
                el.style.animationDelay = `${index * 0.1}s`;
            });
        });
    </script>
</body></html>
