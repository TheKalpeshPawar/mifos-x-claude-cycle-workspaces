<html class="dark" lang="en"><head>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CDEDA3",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3DC",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#8E9285",
                        "outline-variant": "#44483D",
                        "surface-container-low": "#1A1C16",
                        "surface-container": "#1E2019",
                        "surface-container-high": "#282B21",
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"],
                    },
                    spacing: {
                        'gutter': '16px',
                        'sm': '8px',
                        'md': '16px',
                        'lg': '24px',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
        }

        .shimmer {
            position: relative;
            overflow: hidden;
            background-color: #1A1C16; /* surface-container-low */
        }

        .shimmer::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(26, 28, 22, 0) 0,
                rgba(53, 78, 22, 0.4) 20%,
                rgba(178, 209, 136, 0.2) 60%,
                rgba(26, 28, 22, 0) 100%
            );
            animation: shimmer 2s infinite;
            content: '';
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<!-- TopAppBar Shell -->
<header class="w-full sticky top-0 bg-surface-container-low border-b border-outline/20 z-40 flex justify-between items-center px-gutter py-sm">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full shimmer"></div>
<div class="h-6 w-32 shimmer rounded-sm"></div>
</div>

<div class="grid grid-cols-1 gap-4">

<div class="h-4 w-32 shimmer rounded-xs"></div>
</div>
<div class="h-[1px] bg-outline-variant/30 w-full"></div>
<div class="flex justify-between items-center">
<div class="h-4 w-24 shimmer rounded-xs"></div>
<div class="h-4 w-28 shimmer rounded-xs"></div>
</div>
<div class="h-[1px] bg-outline-variant/30 w-full"></div>
<div class="flex justify-between items-center">
<div class="h-4 w-16 shimmer rounded-xs"></div>
<div class="h-4 w-40 shimmer rounded-xs"></div>
</div>
<div class="h-[1px] bg-outline-variant/30 w-full"></div>
<div class="flex justify-between items-center">
<div class="h-4 w-28 shimmer rounded-xs"></div>
<div class="h-4 w-24 shimmer rounded-xs"></div>
</div>
<div class="h-[1px] bg-outline-variant/30 w-full"></div>
<div class="flex justify-between items-center">

</div>
</div>
</div>
</section>
<!-- Address Details Section -->
<section class="mb-lg">
<div class="h-5 w-36 shimmer rounded-sm mb-md opacity-80"></div>
<div class="bg-surface rounded-xl border border-outline-variant p-md">
<div class="space-y-4">
<div class="flex gap-4 items-start">
<div class="w-10 h-10 rounded-lg shimmer shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-full shimmer rounded-xs"></div>
<div class="h-4 w-3/4 shimmer rounded-xs"></div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="h-10 shimmer rounded-lg"></div>
<div class="h-10 shimmer rounded-lg"></div>
</div>
</div>
</div>
</section>
<!-- Employment Data Section -->
<section class="mb-lg">
<div class="h-5 w-44 shimmer rounded-sm mb-md opacity-80"></div>
<div class="bg-surface-container-high rounded-xl p-md border border-outline-variant/50">
<div class="flex flex-col gap-4">
<div class="h-6 w-1/2 shimmer rounded-sm"></div>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-16 px-gutter w-full bg-surface-container border-t border-outline/10 hidden md:hidden">

</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant gap-1">

</div>

<div class="h-6 w-6 shimmer rounded-full"></div>
<div class="h-2 w-10 shimmer rounded-xs"></div>
</div>
</nav>
<script>
        // Simple micro-interaction for skeleton fade-in
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.shimmer');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.transition = 'opacity 0.5s ease-in-out';
                    el.style.opacity = '1';
                }, index * 20);
            });
        });
    </script>
</body></html>
