<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transaction Detail Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Outfit:wght@400;600&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#266489",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#C9E6FF",
                        "primary-fixed-dim": "#95CDF7",
                        secondary: "#50606E",
                        tertiary: "#64597B",
                        background: "#101417",
                        surface: "#101417",
                        "surface-container": "#EBEEF3",
                        "surface-container-dark": "#1C2024",
                        "on-surface": "#E0E3E8",
                        "on-surface-variant": "#41474D",
                        outline: "#72787E",
                        error: "#BA1A1A",
                        "error-container": "#93000A",
                        "on-error-container": "#FFDAD6",
                        "error-icon": "#FFB4AB",
                        "body-text": "#B7C9D9",
                        positive: "#266489",
                        negative: "#BA1A1A"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "title-lg": ["22px", "28px"],
                        "title-md": ["20px", "24px"],
                        "body-md": ["14px", "20px"],
                        "label-sm": ["12px", "16px"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #101417;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full flex flex-col overflow-hidden">
<!-- Top App Bar -->
<header class="h-[56px] w-full flex items-center px-4 bg-[#101417] shrink-0">
<div class="flex items-center w-full">
<button class="mr-4 text-[#E0E3E8] hover:bg-white/10 p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-[#E0E3E8] text-[22px] font-normal truncate">Transaction Detail</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
<!-- Error State Illustration Area -->
<div class="mb-6 flex flex-col items-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<span class="material-symbols-outlined text-[64px] text-[#FFB4AB] mb-4">error_outline</span>
<h2 class="text-[#E0E3E8] text-[20px] font-semibold mb-2">
                Transaction not available
            </h2>
<p class="text-[#B7C9D9] text-[14px] font-normal leading-relaxed max-w-[280px]">
                HSBC could not return this transaction record. Consent may have expired or the transaction ID is no longer valid.
            </p>
<!-- Error Banner -->
<div class="mt-4 bg-[#93000A] rounded-[8px] px-3 py-3 w-full max-w-sm">
<p class="text-[#FFDAD6] text-[12px] font-normal font-mono text-left">
                    HSBC_AIS_40014: Resource not found
                </p>
</div>
</div>
<!-- Action Buttons Cluster -->
<div class="w-full max-w-xs space-y-2 mt-4 animate-in fade-in slide-in-from-bottom-8 duration-1000">
<button class="h-[48px] w-full bg-[#95CDF7] text-[#00344E] rounded-full text-[14px] font-semibold active:scale-[0.98] transition-transform flex items-center justify-center">
                Try Again
            </button>
<button class="h-[48px] w-full border border-[#41474D] text-[#E0E3E8] rounded-full text-[14px] font-normal active:scale-[0.98] transition-transform flex items-center justify-center">
                Go Back
            </button>
</div>
</main>
<!-- Shared Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full h-[56px] z-50 flex justify-around items-center bg-[#1C2024]">
<!-- Accounts (Active) -->
<div class="flex flex-col items-center justify-center text-[#95CDF7] cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="text-[12px] font-medium mt-0.5">Accounts</span>
</div>
<!-- PFM -->
<div class="flex flex-col items-center justify-center text-[#8B9198] cursor-pointer active:scale-95 transition-transform hover:text-[#E0E3E8]">
<span class="material-symbols-outlined">insights</span>
<span class="text-[12px] font-medium mt-0.5">PFM</span>
</div>
<!-- Consents -->
<div class="flex flex-col items-center justify-center text-[#8B9198] cursor-pointer active:scale-95 transition-transform hover:text-[#E0E3E8]">
<span class="material-symbols-outlined">verified_user</span>
<span class="text-[12px] font-medium mt-0.5">Consents</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-[#8B9198] cursor-pointer active:scale-95 transition-transform hover:text-[#E0E3E8]">
<span class="material-symbols-outlined">person</span>
<span class="text-[12px] font-medium mt-0.5">Profile</span>
</div>
</nav>
<script>
        // Simple interaction logic for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const text = btn.innerText.trim();
                console.log(`Action: ${text}`);
                
                if (text === "Try Again") {
                    // Visual feedback for retry
                    btn.innerHTML = '<span class="animate-spin material-symbols-outlined">refresh</span>';
                    setTimeout(() => {
                        btn.innerHTML = 'Try Again';
                    }, 1500);
                }
            });
        });

        // Highlight Active Nav State (already set in HTML but keeping for dynamic reference)
        const navItems = document.querySelectorAll('nav > div');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => {
                    i.classList.remove('text-[#95CDF7]');
                    i.classList.add('text-[#8B9198]');
                    const icon = i.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                item.classList.remove('text-[#8B9198]');
                item.classList.add('text-[#95CDF7]');
                const icon = item.querySelector('.material-symbols-outlined');
                if(icon) icon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
</body></html>
