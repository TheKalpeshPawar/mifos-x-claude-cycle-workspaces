<script>
    // Simple micro-interaction for chips
    const chips = document.querySelectorAll('.flex.gap-2 button');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => {
          c.classList.remove('bg-primaryContainer', 'text-primary');
          c.classList.add('border', 'border-divider', 'text-onSurfaceVariant');
          c.style.fontWeight = '400';
        });
        chip.classList.add('bg-primaryContainer', 'text-primary');
        chip.classList.remove('border', 'border-divider', 'text-onSurfaceVariant');
        chip.style.fontWeight = '500';
      });
    });

    // Handle bottom nav active state simulation
    const navItems = document.querySelectorAll('nav button');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => {
          i.classList.remove('text-primary', 'font-bold');
          i.classList.add('text-outline');
          const icon = i.querySelector('.material-symbols-outlined');
          if(icon) icon.style.fontVariationSettings = "'FILL' 0";
        });
        item.classList.add('text-primary');
        item.classList.remove('text-outline');
        const activeIcon = item.querySelector('.material-symbols-outlined');
        if(activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
      });
    });
  </script>
