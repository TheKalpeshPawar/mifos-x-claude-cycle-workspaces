<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="flex items-center w-full px-md h-16 bg-background sticky top-0 z-50">
<div class="flex items-center gap-md">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-[22px] font-medium leading-tight text-on-surface">Spending by Category</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pb-24">
<!-- Period Selector Chips -->
<div class="w-full flex items-center gap-sm mt-4 mb-xl overflow-x-auto no-scrollbar">
<button class="h-8 px-4 bg-on-primary-fixed-variant text-primary-container font-medium text-[14px] rounded-full flex items-center justify-center whitespace-nowrap transition-transform active:scale-95">
        This Month
      </button>
<button class="h-8 px-4 border border-outline-variant text-on-surface-variant font-medium text-[14px] rounded-full flex items-center justify-center whitespace-nowrap hover:bg-surface-container-high transition-colors">
        Last Month
      </button>
<button class="h-8 px-4 border border-outline-variant text-on-surface-variant font-medium text-[14px] rounded-full flex items-center justify-center whitespace-nowrap hover:bg-surface-container-high transition-colors">
        3 Months
      </button>
</div>
<!-- Error State Section -->
<div class="flex-grow flex flex-col items-center justify-center text-center max-w-md mx-auto animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="mb-6">
<span class="material-symbols-outlined text-[72px] text-error" style="font-variation-settings: 'opsz' 48;">warning_amber</span>
</div>
<h2 class="text-on-surface text-[20px] font-medium mb-3">Couldn't load spending data</h2>
<p class="text-on-surface-variant text-[14px] font-normal leading-relaxed mb-8 px-4">
        HSBC returned an error. Check your connection and try again.
      </p>
<div class="flex flex-col items-center gap-4 w-full">
<button class="h-12 min-w-[160px] px-8 bg-primary-container text-on-primary font-medium text-[14px] rounded-full flex items-center justify-center shadow-sm hover:brightness-110 active:scale-[0.98] transition-all">
          Retry
        </button>
<button class="h-10 px-6 text-primary-container font-medium text-[14px] rounded-full hover:bg-primary-container/10 transition-colors">
          View cached data
        </button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-md pb-safe bg-surface-container z-50">
<!-- Overview -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright/10 px-4 py-2 rounded-xl transition-all">
<span class="material-symbols-outlined mb-1">home</span>
<span class="text-label-md font-label-md">Overview</span>
</button>
<!-- Spending (Active) -->
<button class="flex flex-col items-center justify-center text-primary-container active:scale-95 transition-transform duration-150 px-4 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1 icon-fill">pie_chart</span>
<span class="text-label-md font-label-md">Spending</span>
</button>
<!-- Budgets -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright/10 px-4 py-2 rounded-xl transition-all">
<span class="material-symbols-outlined mb-1">account_balance_wallet</span>
<span class="text-label-md font-label-md">Budgets</span>
</button>
<!-- Subscriptions -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright/10 px-4 py-2 rounded-xl transition-all">
<span class="material-symbols-outlined mb-1">calendar_today</span>
<span class="text-label-md font-label-md">Subscriptions</span>
</button>
</nav>
<!-- Light interactive script for micro-animations -->
<script>
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('mousedown', () => {
        button.style.transform = 'scale(0.97)';
      });
      button.addEventListener('mouseup', () => {
        button.style.transform = 'scale(1)';
      });
      button.addEventListener('mouseleave', () => {
        button.style.transform = 'scale(1)';
      });
    });

    // Simulated retry effect
    const retryBtn = document.querySelector('button:contains("Retry")');
    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        this.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
        setTimeout(() => {
          this.innerHTML = 'Retry';
        }, 2000);
      });
    }

    // Helper for contains selector in vanilla JS
    function findByText(text) {
      return Array.from(document.querySelectorAll('button')).find(el => el.textContent.includes(text));
    }
    
    const rBtn = findByText('Retry');
    if (rBtn) {
      rBtn.onclick = function() {
        const originalText = this.innerText;
        this.innerHTML = `<svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
        setTimeout(() => {
          this.innerText = originalText;
        }, 1500);
      };
    }
  </script>
</body></html>
