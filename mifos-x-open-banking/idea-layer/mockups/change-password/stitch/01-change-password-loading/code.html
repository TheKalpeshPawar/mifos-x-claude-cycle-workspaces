<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Change Password - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#B2D188",
                        "on-primary": "#1A1C16",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#1A1C16",
                        surface: "#242620",
                        "on-surface": "#E3E3DC",
                        "surface-variant": "#44483D",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#8E9285",
                        "outline-variant": "#44483D",
                        "primary-container": "#354E16",
                        "on-primary-container": "#CDEDA3"
                    },
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                        headline: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"]
                    },
                    spacing: {
                        'safe': 'env(safe-area-inset-bottom)'
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #2A2C24 25%, #32352B 50%, #2A2C24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-sans min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="bg-surface/80 dark:bg-surface/80 backdrop-blur-md docked full-width top-0 sticky z-50 border-b border-on-surface/10">
<div class="flex items-center justify-between px-4 h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
<div class="h-6 w-32 rounded-md skeleton-shimmer"></div>
</div>
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
</div>
</nav>
<main class="flex-grow w-full max-w-2xl mx-auto px-6 py-8 animate-pulse">
<!-- Headline and Subtitle -->
<div class="space-y-4 mb-8">
<div class="h-10 w-3/4 rounded-lg skeleton-shimmer"></div>
<div class="h-4 w-full rounded-md skeleton-shimmer"></div>
<div class="h-4 w-2/3 rounded-md skeleton-shimmer"></div>
</div>
<!-- Progress Bar Shimmer -->
<div class="w-full h-2 bg-surface rounded-full mb-8 overflow-hidden">
<div class="h-full w-1/3 skeleton-shimmer rounded-full"></div>
</div>
<!-- Security Status Card -->
<div class="p-6 rounded-2xl bg-surface border border-outline-variant mb-10">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-xl skeleton-shimmer shrink-0"></div>
<div class="space-y-3 w-full">
<div class="h-5 w-1/2 rounded-md skeleton-shimmer"></div>
<div class="h-4 w-5/6 rounded-md skeleton-shimmer"></div>
</div>
</div>
</div>
<div class="h-px w-full bg-outline-variant mb-10"></div>
<!-- Input Fields -->
<div class="space-y-8 mb-10">
<!-- Current Password -->
<div class="space-y-2">
<div class="h-4 w-32 rounded skeleton-shimmer"></div>
<div class="h-14 w-full rounded-xl skeleton-shimmer"></div>
</div>
<!-- New Password -->
<div class="space-y-2">
<div class="h-4 w-32 rounded skeleton-shimmer"></div>
<div class="h-14 w-full rounded-xl skeleton-shimmer"></div>
<div class="h-3 w-48 rounded skeleton-shimmer"></div>
</div>
<!-- Confirm Password -->
<div class="space-y-2">
<div class="h-4 w-36 rounded skeleton-shimmer"></div>
<div class="h-14 w-full rounded-xl skeleton-shimmer"></div>
</div>
</div>
<div class="h-px w-full bg-outline-variant mb-10"></div>
<!-- Banners -->
<div class="space-y-4 mb-12">
<div class="flex items-center gap-4 p-4 rounded-xl bg-surface/50 border border-outline-variant/50">
<div class="w-6 h-6 rounded-full skeleton-shimmer shrink-0"></div>
<div class="h-4 w-full rounded skeleton-shimmer"></div>
</div>
<div class="flex items-center gap-4 p-4 rounded-xl bg-surface/50 border border-outline-variant/50">
<div class="w-6 h-6 rounded-full skeleton-shimmer shrink-0"></div>
<div class="h-4 w-3/4 rounded skeleton-shimmer"></div>
</div>
</div>
<!-- Primary Action -->
<div class="h-14 w-full rounded-full skeleton-shimmer mb-10"></div>
</main>
<!-- BottomNavBar Shimmer (Filtered for Transactional focused view, but showing skeleton for system context) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface/90 dark:bg-surface/90 backdrop-blur-xl border-t border-on-surface/10 md:hidden">
<div class="flex justify-around items-center h-20 w-full pb-safe">
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full skeleton-shimmer"></div>
<div class="w-10 h-2 rounded skeleton-shimmer"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full skeleton-shimmer"></div>
<div class="w-10 h-2 rounded skeleton-shimmer"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full skeleton-shimmer"></div>
<div class="w-10 h-2 rounded skeleton-shimmer"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full skeleton-shimmer"></div>
<div class="w-10 h-2 rounded skeleton-shimmer"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full skeleton-shimmer"></div>
<div class="w-10 h-2 rounded skeleton-shimmer"></div>
</div>
</div>
</nav>
<!-- Content for hydration/reference purposes hidden behind skeleton -->
<div class="hidden">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
</body></html>
