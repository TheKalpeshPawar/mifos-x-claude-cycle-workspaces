<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "on-primary": "#FFFFFF",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#12140F", // Forced dark theme background for skeleton
                        surface: "#1A1C16",
                        "surface-variant": "#44483D",
                        "on-surface": "#EAECE1",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#75796C",
                        "outline-variant": "#44483D",
                        "nav-indicator": "#4C662B"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "12px",
                        lg: "16px",
                        xl: "24px",
                        pill: "999px"
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite linear',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        }
                    }
                }
            }
        }
    </script>
<style>
        .shimmer-base {
            background: linear-gradient(90deg, #2A2D24 25%, #34382C 50%, #2A2D24 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background flex items-center h-14 px-4 border-b border-outline-variant">
<div class="flex items-center gap-4 w-full">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer active:scale-95 transition-transform">arrow_back</span>
<div class="h-6 w-40 shimmer-base rounded-sm"></div>
</div>
</header>
<main class="pt-14 pb-24 px-4 max-w-md mx-auto space-y-6">
<!-- Header Section: Brand/Profile Stack -->
<section class="mt-6">
<div class="relative w-full h-40 rounded-lg shimmer-base overflow-hidden flex items-end p-4">
<div class="flex items-center gap-4">
<div class="w-16 h-16 rounded-full bg-surface border-4 border-background shimmer-base"></div>
<div class="space-y-2">
<div class="h-5 w-32 shimmer-base rounded-sm"></div>
<div class="h-4 w-24 shimmer-base rounded-sm opacity-60"></div>
</div>
</div>
</div>
</section>
<!-- Content Section -->
<section class="space-y-6">
<!-- Instructions -->
<div class="space-y-2">
<div class="h-4 w-full shimmer-base rounded-sm"></div>
<div class="h-4 w-3/4 shimmer-base rounded-sm"></div>
</div>
<!-- Current Password -->
<div class="space-y-2">
<div class="h-3 w-24 shimmer-base rounded-sm mb-1"></div>
<div class="h-14 w-full rounded-sm border border-outline-variant bg-surface/50 relative overflow-hidden">
<div class="absolute inset-0 shimmer-base opacity-20"></div>
</div>
</div>
<div class="h-[1px] w-full bg-outline-variant"></div>
<!-- New Password Group -->
<div class="space-y-4">
<div class="space-y-2">
<div class="h-3 w-20 shimmer-base rounded-sm mb-1"></div>
<div class="h-14 w-full rounded-sm border border-outline-variant bg-surface/50 relative overflow-hidden">
<div class="absolute inset-0 shimmer-base opacity-20"></div>
</div>
</div>
<!-- Password Strength Indicator Stack -->
<div class="flex gap-2">
<div class="h-1.5 flex-1 rounded-pill shimmer-base"></div>
<div class="h-1.5 flex-1 rounded-pill shimmer-base"></div>
<div class="h-1.5 flex-1 rounded-pill shimmer-base"></div>
<div class="h-1.5 flex-1 rounded-pill shimmer-base"></div>
</div>
<!-- Progress Bar placeholder -->
<div class="w-full h-1 bg-surface-variant rounded-pill overflow-hidden">
<div class="w-1/3 h-full bg-primary/40 shimmer-base"></div>
</div>
<!-- Requirements Text -->
<div class="space-y-2">
<div class="h-3 w-4/5 shimmer-base rounded-sm"></div>
<div class="h-3 w-3/5 shimmer-base rounded-sm"></div>
</div>
</div>
<div class="h-[1px] w-full bg-outline-variant"></div>
<!-- Confirm New Password -->
<div class="space-y-2">
<div class="h-3 w-32 shimmer-base rounded-sm mb-1"></div>
<div class="h-14 w-full rounded-sm border border-outline-variant bg-surface/50 relative overflow-hidden">
<div class="absolute inset-0 shimmer-base opacity-20"></div>
</div>
</div>
</section>
<!-- Banners Section -->
<section class="space-y-4">
<div class="p-4 rounded-md border border-outline-variant bg-surface flex gap-4 items-start relative overflow-hidden">
<div class="w-10 h-10 rounded-full shimmer-base flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-24 shimmer-base rounded-sm"></div>
<div class="h-3 w-full shimmer-base rounded-sm"></div>
</div>
</div>
<div class="p-4 rounded-md border border-outline-variant bg-surface flex gap-4 items-start relative overflow-hidden">
<div class="w-10 h-10 rounded-full shimmer-base flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-32 shimmer-base rounded-sm"></div>
<div class="h-3 w-full shimmer-base rounded-sm"></div>
</div>
</div>
</section>
</main>
<!-- Fixed Action Button Placeholder -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background border-t border-outline-variant md:max-w-md md:mx-auto">
<div class="h-12 w-full rounded-pill shimmer-base"></div>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 opacity-20 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-accent/5 blur-[100px] rounded-full"></div>
</div>
<script>
        // Simple micro-interaction for the back button
        document.querySelector('.material-symbols-outlined').addEventListener('click', () => {
            document.body.style.opacity = '0.5';
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 300);
        });
    </script>
</body></html>
