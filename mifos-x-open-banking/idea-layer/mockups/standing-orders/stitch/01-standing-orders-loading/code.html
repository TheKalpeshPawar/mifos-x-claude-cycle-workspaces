<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HSBC Open Banking - Standing Orders Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#95CDF7",
            surface: "#101417",
            onSurface: "#E0E3E8",
            surfaceContainer: "#1C2024",
            surfaceContainerHigh: "#262A2E",
            surfaceContainerHighest: "#313539",
            outline: "#8B9198",
            onSurfaceVariant: "#C1C7CE",
            surfaceVariant: "#41474D",
          },
          borderRadius: {
            "small": "8px",
            "medium": "12px",
            "large": "16px",
            "extra_large": "28px",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Public Sans", "sans-serif"],
            body: ["Public Sans", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          }
        },
      },
    }
  </script>
<style>
    @keyframes shimmer-sweep {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .shimmer {
      background: linear-gradient(
        90deg, 
        #262A2E 25%, 
        #313539 50%, 
        #262A2E 75%
      );
      background-size: 200% 100%;
      animation: shimmer-sweep 1400ms ease-in-out infinite;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    body {
      background-color: #101417;
      color: #E0E3E8;
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top App Bar (56dp) -->
<header class="sticky top-0 z-50 w-full h-14 bg-surface flex items-center justify-between px-4 border-b border-outline/10">
<div class="flex items-center gap-4">
<!-- Back Arrow Shimmer (24x24) -->
<div class="w-6 h-6 rounded-full shimmer"></div>
<!-- Title Shimmer (160x20) -->
<div class="w-40 h-5 rounded shimmer"></div>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline" style="font-size: 24px;">account_circle</span>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 max-w-2xl mx-auto w-full px-4 pt-6 pb-24">
<!-- Stat Block -->
<div class="mb-8">
<div class="w-32 h-3.5 rounded shimmer"></div>
</div>
<!-- List of Skeletons (5 Cards, 96dp tall, 12dp gap) -->
<div class="flex flex-col gap-3">
<!-- Card 1 -->
<div class="h-24 w-full bg-surfaceContainer rounded-[12px] p-4 flex flex-col justify-between">
<div class="flex justify-between items-start">
<div class="w-16 h-5 rounded-full shimmer"></div> <!-- Status Badge -->
<div class="w-32 h-4 rounded shimmer"></div> <!-- Headline -->
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<div class="w-52 h-3 rounded shimmer"></div> <!-- Frequency -->
<div class="w-20 h-3.5 rounded shimmer"></div> <!-- Amount -->
</div>
<div class="w-40 h-3 rounded shimmer"></div> <!-- Footer -->
</div>
</div>
<!-- Card 2 -->
<div class="h-24 w-full bg-surfaceContainer rounded-[12px] p-4 flex flex-col justify-between">
<div class="flex justify-between items-start">
<div class="w-16 h-5 rounded-full shimmer"></div>
<div class="w-32 h-4 rounded shimmer"></div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<div class="w-52 h-3 rounded shimmer"></div>
<div class="w-20 h-3.5 rounded shimmer"></div>
</div>
<div class="w-40 h-3 rounded shimmer"></div>
</div>
</div>
<!-- Card 3 -->
<div class="h-24 w-full bg-surfaceContainer rounded-[12px] p-4 flex flex-col justify-between">
<div class="flex justify-between items-start">
<div class="w-16 h-5 rounded-full shimmer"></div>
<div class="w-32 h-4 rounded shimmer"></div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<div class="w-52 h-3 rounded shimmer"></div>
<div class="w-20 h-3.5 rounded shimmer"></div>
</div>
<div class="w-40 h-3 rounded shimmer"></div>
</div>
</div>
<!-- Card 4 -->
<div class="h-24 w-full bg-surfaceContainer rounded-[12px] p-4 flex flex-col justify-between">
<div class="flex justify-between items-start">
<div class="w-16 h-5 rounded-full shimmer"></div>
<div class="w-32 h-4 rounded shimmer"></div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<div class="w-52 h-3 rounded shimmer"></div>
<div class="w-20 h-3.5 rounded shimmer"></div>
</div>
<div class="w-40 h-3 rounded shimmer"></div>
</div>
</div>
<!-- Card 5 -->
<div class="h-24 w-full bg-surfaceContainer rounded-[12px] p-4 flex flex-col justify-between">
<div class="flex justify-between items-start">
<div class="w-16 h-5 rounded-full shimmer"></div>
<div class="w-32 h-4 rounded shimmer"></div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<div class="w-52 h-3 rounded shimmer"></div>
<div class="w-20 h-3.5 rounded shimmer"></div>
</div>
<div class="w-40 h-3 rounded shimmer"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (80dp) -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-surfaceContainer flex justify-around items-center px-4 border-t border-outline/10 z-50">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-outline">account_balance</span>
<span class="text-[11px] text-outline font-medium">Accounts</span>
</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-outline">receipt_long</span>
<span class="text-[11px] text-outline font-medium">Transactions</span>
</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-outline">verified_user</span>
<span class="text-[11px] text-outline font-medium">Consent</span>
</div>
</nav>
<script>
    // Lightweight interaction to simulate state change or feedback
    document.querySelectorAll('.bg-surfaceContainer').forEach(card => {
      card.addEventListener('mousedown', () => {
        card.style.transform = 'scale(0.98)';
        card.style.transition = 'transform 150ms ease';
      });
      card.addEventListener('mouseup', () => {
        card.style.transform = 'scale(1)';
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'scale(1)';
      });
    });
  </script>
</body></html>
