<header class="fixed top-0 w-full z-50 bg-surface flex items-center px-md h-14 w-full">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors duration-200">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="ml-2 font-title-lg text-title-lg text-on-surface font-medium">Standing Orders</h1>
</header>
<!-- Content Canvas: Error State -->
<main class="content-canvas flex flex-col items-center justify-center px-lg text-center">
<!-- Background Subtle Glow Effect (Atmospheric) -->
<div class="absolute inset-0 pointer-events-none opacity-20 overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-primary/10 blur-[100px] rounded-full"></div>
</div>
<div class="relative z-10 flex flex-col items-center max-w-xs">
<!-- Icon -->
<div class="mb-6 flex items-center justify-center w-24 h-24 rounded-full bg-error-container/10 border border-error/10">
<span class="material-symbols-outlined text-error" style="font-size: 64px;">cloud_off</span>
</div>
<!-- Headline -->
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm font-medium">Could not load standing orders</h2>
<!-- Supporting Text -->
<p class="font-body-md text-on-surface-variant mb-xl px-4">Check your connection and try again</p>
<!-- Primary Action Button -->
<button class="bg-primary-fixed-dim hover:bg-primary-fixed hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 px-lg h-12 flex items-center justify-center rounded-full">
<span class="text-on-primary font-label-lg font-medium">Try again</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<!-- Logic: Active tab is "Orders" based on the screen title -->
<nav class="fixed bottom-0 w-full z-50 h-[80px] bg-surface-container shadow-sm flex justify-around items-center w-full px-sm pb-safe">

<button class="flex flex-col items-center justify-center text-outline hover:bg-surface-container-high transition-all duration-200 rounded-xl px-2 py-1">
<span class="material-symbols-outlined mb-1">account_balance_wallet</span>
<span class="font-label-md text-label-md">Accounts</span>
</button>
<!-- Payments Tab -->
<button class="flex flex-col items-center justify-center text-outline hover:bg-surface-container-high transition-all duration-200 rounded-xl px-2 py-1">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label-md text-label-md">Payments</span>
</button>

<button class="flex flex-col items-center justify-center text-primary-fixed-dim bg-secondary-container rounded-xl px-4 py-1 transition-transform scale-100 active:scale-95">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">event_repeat</span>
<span class="font-label-md text-label-md">Orders</span>
</button>
<!-- Profile Tab -->
<button class="flex flex-col items-center justify-center text-outline hover:bg-surface-container-high transition-all duration-200 rounded-xl px-2 py-1">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
</nav>
<!-- Lightweight Micro-interaction Script -->
<script>
        document.querySelector('button.bg-primary-fixed-dim').addEventListener('click', function() {
            // Simple visual feedback for "Try again"
            const btn = this;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        });
    </script>
