<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #12140f;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Hide scrollbar for cleaner look */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container": "#1f201b",
            "outline-variant": "#44483c",
            "secondary-fixed-dim": "#a0cfcb",
            "inverse-on-surface": "#2f312b",
            "on-surface": "#e3e3da",
            "surface-container-low": "#1a1c17",
            "secondary-fixed": "#bcece7",
            "on-tertiary-fixed-variant": "#1f4e4b",
            "on-secondary-fixed-variant": "#1f4e4b",
            "surface-container-highest": "#343530",
            "background": "#12140f",
            "on-background": "#e3e3da",
            "surface-bright": "#383a34",
            "surface-dim": "#12140f",
            "primary-fixed": "#cdeda1",
            "inverse-primary": "#4c662a",
            "secondary": "#a0cfcb",
            "on-tertiary-fixed": "#00201e",
            "inverse-surface": "#e3e3da",
            "surface-container-lowest": "#0d0f0a",
            "on-primary-fixed-variant": "#354e14",
            "primary-container": "#b2d188",
            "on-secondary-fixed": "#00201e",
            "primary": "#ceeda2",
            "surface": "#12140f",
            "on-primary": "#203700",
            "tertiary-container": "#a1d0cc",
            "surface-variant": "#343530",
            "surface-container-high": "#292b25",
            "primary-fixed-dim": "#b2d188",
            "surface-tint": "#b2d188",
            "tertiary-fixed": "#bcece7",
            "on-error": "#690005",
            "tertiary-fixed-dim": "#a0cfcb",
            "on-surface-variant": "#c4c8b9",
            "outline": "#8e9284",
            "on-secondary": "#013735",
            "on-error-container": "#ffdad6",
            "on-primary-container": "#415a1f",
            "error": "#ffb4ab",
            "on-secondary-container": "#8fbeba",
            "on-primary-fixed": "#102000",
            "tertiary": "#bdece8",
            "on-tertiary-container": "#2d5a57",
            "error-container": "#93000a",
            "secondary-container": "#1f4e4b",
            "on-tertiary": "#013735"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin-mobile": "16px",
            "margin-desktop": "32px",
            "xs": "4px",
            "md": "16px",
            "gutter": "16px",
            "base": "4px",
            "xl": "32px",
            "sm": "8px",
            "lg": "24px"
          },
          "fontFamily": {
            "title-md": ["Outfit"],
            "display-lg": ["Outfit"],
            "body-md": ["Outfit"],
            "label-lg": ["Outfit"],
            "title-lg": ["Outfit"],
            "label-md": ["Outfit"],
            "headline-lg-mobile": ["Outfit"],
            "body-lg": ["Outfit"],
            "headline-lg": ["Outfit"]
          },
          "fontSize": {
            "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
            "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
            "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
            "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
            "title-lg": ["22px", {"lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "500"}],
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
            "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "0px", "fontWeight": "400"}],
            "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "0px", "fontWeight": "400"}]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col no-scrollbar">
<!-- Top App Bar (Shared Component Strategy) -->
<header class="w-full top-0 bg-background dark:bg-background flex items-center px-md h-14 sticky z-50">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-primary dark:text-primary active:opacity-80 transition-opacity hover:bg-surface-variant/20 rounded-full p-2" data-icon="arrow_back">arrow_back</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-primary">Forgot Password</h1>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-4 md:px-8 pb-xl">
<div class="w-full max-w-[440px] flex flex-col gap-lg py-md">
<!-- Hero Illustration -->
<div class="flex justify-center items-center w-full py-4">
<img alt="Illustration of account recovery" class="w-40 h-40 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uiJ_OWkvC2DyUYHdKRu5n425E8o4TU2UoRXX49jK8N7IyzVUWaU-WvWdemn1Mmz9emHE1lpmWHJTHeSi5RhJzzTrVq69XAvm3T6RwnOlaobcZ71dekWK6Fc6WYKw5lbHAuj2jfA4wwti2QUav5o-rTMolnGdwz3nh8KvM-nF5wONOsdqICZb78jgxAHETmHmr0ego5AthlLOYqB2rggomtpoQsFxoGgo4896JPotR_kOeZ3HuiZQW7fbLBd"/>
</div>
<!-- Heading & Subtitle -->
<div class="flex flex-col gap-1">
<h2 class="font-semibold text-[24px] leading-tight text-[#F9FAEF] tracking-tight">Forgot Password?</h2>
<p class="font-normal text-[14px] leading-relaxed text-[#C5C8BA]">Enter your email to receive recovery instructions.</p>
</div>
<!-- Form Stack -->
<div class="flex flex-col gap-lg">
<!-- Input Group -->
<div class="relative group">
<label class="absolute -top-2.5 left-3 px-1 bg-background text-label-md font-label-md text-primary transition-all group-focus-within:text-primary" for="email">Email Address</label>
<input class="w-full h-14 bg-transparent border border-outline-variant rounded-lg px-4 text-body-lg font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="email" placeholder="e.g. alex@mifos.org" type="email"/>
</div>
<!-- Informational Banner -->
<div class="bg-[#354E16] rounded-xl p-md flex items-start gap-md border border-primary/10">
<span class="material-symbols-outlined text-[#CDEDA3] mt-0.5" data-icon="info">info</span>
<p class="text-[14px] leading-snug text-[#CDEDA3] font-medium">Check your spam folder if you don't see the email.</p>
</div>
<!-- Security Info Container -->
<div class="bg-surface-container rounded-xl p-md flex flex-col gap-sm border border-outline-variant/30">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-[#B2D188]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<h3 class="font-medium text-[16px] text-[#F9FAEF]">Account Protection</h3>
</div>
<p class="text-[12px] leading-normal text-[#C5C8BA] font-normal">
            Mifos X uses multi-factor authentication to secure your recovery process.
          </p>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-[#B2D188] hover:bg-[#A1C077] active:scale-[0.98] transition-all rounded-full flex items-center justify-center gap-2 group">
<span class="text-[#1F3701] font-semibold text-[14px] tracking-widest">SEND RECOVERY LINK</span>
<span class="material-symbols-outlined text-[#1F3701] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Back to Login Link -->
<div class="flex justify-center pt-2">
<a class="text-[#B2D188] font-medium text-[14px] hover:underline transition-all flex items-center gap-1 active:opacity-70" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="chevron_left">chevron_left</span>
            Back to Login
          </a>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Suppressed for Transactional Screen per instructions -->
<script>
    // Micro-interactions for the form field
    const emailInput = document.getElementById('email');
    const emailLabel = document.querySelector('label[for="email"]');

    emailInput.addEventListener('focus', () => {
      emailLabel.classList.add('text-primary');
    });

    emailInput.addEventListener('blur', () => {
      if (!emailInput.value) {
        emailLabel.classList.remove('text-primary');
        emailLabel.classList.add('text-outline');
      }
    });

    // Ripple effect simulation for primary button
    const btn = document.querySelector('button.bg-\\[\\#B2D188\\]');
    btn.addEventListener('mousedown', function(e) {
      const x = e.clientX - e.target.offsetLeft;
      const y = e.clientY - e.target.offsetTop;
      const ripple = document.createElement('span');
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  </script>
</body></html>
