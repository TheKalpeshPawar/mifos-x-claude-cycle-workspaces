<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Loading State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#4C662B",
              "primary-fixed-dim": "#B2D188",
              "on-primary": "#FFFFFF",
              secondary: "#386663",
              "secondary-container": "#BCEBE7",
              "on-secondary-container": "#00201E",
              surface: "#12140F",
              "on-surface": "#E2E3D8",
              "on-surface-variant": "#C5C8BA",
              outline: "#8F9285",
              "outline-variant": "#44483D",
              "surface-container": "#1A1C16",
              "surface-container-high": "#252720"
            },
            fontFamily: {
              sans: ["Outfit", "sans-serif"],
              display: ["Outfit", "sans-serif"],
              body: ["Outfit", "sans-serif"]
            },
            animation: {
              'shimmer': 'shimmer 2s infinite linear',
            },
            keyframes: {
              shimmer: {
                '0%': { 'background-position': '-200% 0' },
                '100%': { 'background-position': '200% 0' },
              }
            }
          },
        },
      }
    </script>
<style>
      .shimmer-base {
        background: linear-gradient(90deg, #1A1C14 25%, #44483D 50%, #1A1C14 75%);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-sans text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar Shimmer -->
<header class="bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant h-16 w-full flex items-center justify-between px-4 max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full shimmer-base"></div>
<div class="w-32 h-6 rounded-md shimmer-base"></div>
</div>
<div class="w-10 h-10 rounded-full shimmer-base"></div>
</header>
<main class="flex-1 w-full max-w-md mx-auto px-6 py-8 flex flex-col items-center">
<!-- Large Centered Image Placeholder -->
<div class="w-64 h-64 rounded-2xl shimmer-base mb-10 shadow-xl opacity-80" data-alt="A sophisticated 3D abstract render of a metallic shield and glowing digital key floating in a dark, atmospheric space. The scene is illuminated by soft emerald green and charcoal lighting, reflecting the Mifos X Open Banking aesthetic. Geometric patterns shimmer in the background with a high-end, finance-security theme. The style is minimalist yet technologically advanced, emphasizing trust and digital safety."></div>
<!-- Headline Text Placeholder -->
<div class="w-3/4 h-8 rounded-lg shimmer-base mb-4"></div>
<!-- Sub-headline Text Placeholder -->
<div class="w-full space-y-2 mb-10">
<div class="w-full h-4 rounded-md shimmer-base"></div>
<div class="w-5/6 h-4 rounded-md shimmer-base mx-auto"></div>
</div>
<!-- Banner/Alert Placeholder -->
<div class="w-full h-14 rounded-xl border border-outline-variant bg-surface-container mb-8 flex items-center px-4 gap-3">
<div class="w-6 h-6 rounded-full shimmer-base shrink-0"></div>
<div class="w-full h-4 rounded-md shimmer-base"></div>
</div>
<!-- Stack Container for Input Fields -->
<div class="w-full space-y-6 mb-12">
<div class="space-y-2">
<div class="w-24 h-4 rounded-md shimmer-base mb-2"></div>
<!-- Text Input Field Placeholder -->
<div class="w-full h-14 rounded-lg border border-outline-variant shimmer-base opacity-40"></div>
</div>
</div>
<!-- Button Placeholder at the bottom -->
<div class="w-full h-14 rounded-full shimmer-base mb-8"></div>
<!-- Link/Text Placeholder at the very bottom -->
<div class="mt-auto py-6 flex flex-col items-center gap-3">
<div class="w-40 h-4 rounded-md shimmer-base"></div>
<div class="w-24 h-4 rounded-md shimmer-base"></div>
</div>
</main>
<!-- Suppressed Bottom Navigation for Transactional/Focused Screen -->
<!-- The BottomNavBar is hidden based on the "Destination" rule as this is a focused auth journey -->
<script>
      // Micro-interaction for shimmer offset variation
      document.querySelectorAll('.shimmer-base').forEach((el, index) => {
        el.style.animationDelay = `${index * 0.1}s`;
      });
    </script>
</body></html>
