<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-hidden">
<!-- Top App Bar -->
<!-- JSON Mapping: name: TopAppBar, headline: Statements, leading_icon: arrow_back -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface border-b border-outline-variant/20 transition-colors duration-200 z-50">
<div class="flex items-center h-16 px-4 w-full">
<button aria-label="Go back" class="p-2 mr-2 rounded-full hover:bg-surface-container dark:hover:bg-surface-container transition-colors text-primary">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline font-medium text-title-lg-mobile text-on-surface dark:text-on-surface">Statements</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pb-20">
<!-- Error State Illustration/Icon -->
<div class="mb-4">
<span class="material-symbols-outlined text-[64px] text-error" style="font-variation-settings: 'wght' 300;">
                error_outline
            </span>
</div>
<!-- Headline -->
<h2 class="font-headline font-medium text-[20px] leading-tight text-on-surface text-center mb-4">
            Could not load statements
        </h2>
<!-- Body Text -->
<p class="font-body text-[14px] leading-relaxed text-on-surface-variant text-center max-w-[280px] mb-8">
            HSBC returned an error when fetching your statements. Check your connection and try again.
        </p>
<!-- Retry Action -->
<button class="btn-retry w-[200px] h-[48px] bg-primary text-on-primary rounded-full font-headline font-medium text-[16px] flex items-center justify-center transition-all shadow-sm hover:brightness-110">
            Try again
        </button>
</main>
<!-- Bottom Navigation Bar -->
<!-- JSON Mapping: Home, Accounts, Statements, More -->
<!-- Logic: "Statements" is the current context, so it receives style_active_navigation -->
<nav class="fixed bottom-0 w-full flex justify-around items-center h-20 px-2 bg-surface-container dark:bg-surface-container z-50">

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant/10 rounded-full transition-colors group" href="#">

</a>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant/10 rounded-full transition-colors group" href="#">

</a>

<span class="font-label text-[12px] font-medium">More</span>
</a>

            const originalText = btn.innerText;
