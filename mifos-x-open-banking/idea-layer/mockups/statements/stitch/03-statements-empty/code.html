<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Statements - Open Banking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;family=Outfit:wght@400;500;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#266489",
            "on-primary": "#FFFFFF",
            "primary-container": "#C9E6FF",
            secondary: "#50606E",
            tertiary: "#64597B",
            background: "#101417", // Custom dark background as per prompt
            surface: "#101417",
            "surface-container": "#1C2024", // Bottom nav background
            "on-surface": "#E0E3E8",
            "on-surface-variant": "#C1C7CE",
            outline: "#72787E",
            "outline-variant": "rgba(114, 120, 126, 0.2)",
            "brand-blue": "#95CDF7", // The accent blue from prompt
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            display: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            label: ["Outfit", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          },
          fontSize: {
            "title-lg-mobile": "22px",
            "headline-lg-mobile": "20px",
            "body-sm": "14px",
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #101417;
      color: #E0E3E8;
      font-family: 'Outfit', sans-serif;
    }
    .empty-state-icon {
      font-size: 64px !important;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar: Content & Identity from JSON, Styles Override from Prompt -->
<header class="w-full top-0 sticky z-40 bg-[#101417] border-b border-outline-variant/20 transition-colors duration-200">
<div class="flex items-center h-16 px-4 w-full">
<button aria-label="Go back" class="mr-4 p-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[#95CDF7]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-medium text-[22px] text-[#E0E3E8] leading-none">Statements</h1>
</div>
</header>
<!-- Main Canvas: Empty State -->
<main class="flex-grow flex flex-col items-center justify-center px-8 text-center pb-20">
<div class="max-w-md animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Icon -->
<div class="mb-4">
<span class="material-symbols-outlined empty-state-icon text-[#95CDF7]" data-icon="description">description</span>
</div>
<!-- Headline -->
<h2 class="font-medium text-[20px] text-[#E0E3E8] mb-4">No statements available</h2>
<!-- Body Text -->
<p class="font-normal text-[14px] text-[#C1C7CE] leading-relaxed max-w-xs mx-auto">
        No statements have been generated for this HSBC account. Statements typically appear after your first full billing period.
      </p>
</div>
</main>
<!-- BottomNavBar: Executed according to JSON + Prompt Resolution -->
<!-- Platform Pivot: Mobile Visibility (Fixed bottom) -->
<nav class="fixed bottom-0 w-full z-50 bg-[#1C2024] flex justify-around items-center h-20 px-2">
<!-- Home Tab -->
<a class="flex flex-col items-center justify-center text-[#C1C7CE] px-5 py-1 hover:bg-surface-variant/10 transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="text-[12px] font-medium">Home</span>
</a>
<!-- Accounts Tab -->
<a class="flex flex-col items-center justify-center text-[#C1C7CE] px-5 py-1 hover:bg-surface-variant/10 transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance">account_balance</span>
<span class="text-[12px] font-medium">Accounts</span>
</a>
<!-- Statements Tab (ACTIVE) -->
<a class="flex flex-col items-center justify-center text-[#95CDF7] px-5 py-1 transition-all transform active:scale-95" href="#">
<div class="bg-[#266489]/20 rounded-full px-5 py-1 mb-1 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="description" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<span class="text-[12px] font-medium">Statements</span>
</a>
<!-- More Tab -->
<a class="flex flex-col items-center justify-center text-[#C1C7CE] px-5 py-1 hover:bg-surface-variant/10 transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="more_horiz">more_horiz</span>
<span class="text-[12px] font-medium">More</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const navItems = document.querySelectorAll('nav a');
      navItems.forEach(item => {
        item.addEventListener('touchstart', () => {
          item.style.transform = 'scale(0.95)';
        });
        item.addEventListener('touchend', () => {
          item.style.transform = 'scale(1)';
        });
      });
    });
  </script>
</body></html>
