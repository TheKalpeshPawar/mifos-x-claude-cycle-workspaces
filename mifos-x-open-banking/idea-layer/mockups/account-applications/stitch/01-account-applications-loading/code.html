<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Applications Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1E201A",
                        "on-surface-variant": "#C5C8BA",
                        "primary-container": "#4C662B",
                        "on-primary-container": "#FFFFFF",
                        "outline-variant": "#C5C8BA",
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        "sm": "4px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px",
                        "pill": "999px"
                    },
                    animation: {
                        'shimmer-sweep': 'shimmer 1200ms linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #F9FAEF;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .shimmer-base {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }
        .shimmer-base::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                rgba(30, 32, 26, 0) 0%,
                rgba(40, 42, 36, 1) 50%,
                rgba(30, 32, 26, 0) 100%
            );
            animation: shimmer 1200ms linear infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 h-16 bg-[#12140E] flex items-center px-4 z-50">
<div class="shimmer-base w-[180px] h-[20px] rounded-sm"></div>
<div class="ml-auto flex gap-4">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
</header>
<main class="pt-20 px-4">
<!-- Chip Row -->
<div class="flex gap-2 overflow-hidden mb-6">
<div class="shimmer-base w-[72px] h-[32px] rounded-lg flex-shrink-0"></div>
<div class="shimmer-base w-[72px] h-[32px] rounded-lg flex-shrink-0"></div>
<div class="shimmer-base w-[72px] h-[32px] rounded-lg flex-shrink-0"></div>
<div class="shimmer-base w-[72px] h-[32px] rounded-lg flex-shrink-0"></div>
</div>
<!-- Application Card 1 -->
<div class="bg-surface border border-white/5 rounded-md p-4 mb-3">
<div class="flex justify-between items-center mb-2">
<div class="shimmer-base w-[120px] h-[16px] rounded-sm"></div>
<div class="shimmer-base w-[80px] h-[24px] rounded-lg"></div>
</div>
<div class="shimmer-base w-[160px] h-[14px] rounded-sm mt-2"></div>
<div class="flex justify-between items-end mt-4">
<div class="shimmer-base w-[120px] h-[12px] rounded-sm"></div>
<div class="shimmer-base w-[64px] h-[32px] rounded-pill"></div>
</div>
</div>
<!-- Application Card 2 -->
<div class="bg-surface border border-white/5 rounded-md p-4 mb-3">
<div class="flex justify-between items-center mb-2">
<div class="shimmer-base w-[140px] h-[16px] rounded-sm"></div>
<div class="shimmer-base w-[80px] h-[24px] rounded-lg"></div>
</div>
<div class="shimmer-base w-[180px] h-[14px] rounded-sm mt-2"></div>
<div class="shimmer-base w-[120px] h-[12px] rounded-sm mt-3"></div>
</div>
<!-- Application Card 3 -->
<div class="bg-surface border border-white/5 rounded-md p-4 mb-3">
<div class="flex justify-between items-center mb-2">
<div class="shimmer-base w-[100px] h-[16px] rounded-sm"></div>
<div class="shimmer-base w-[80px] h-[24px] rounded-lg"></div>
</div>
<div class="shimmer-base w-[160px] h-[14px] rounded-sm mt-2"></div>
<div class="flex justify-between items-center mt-3">
<div class="shimmer-base w-[100px] h-[12px] rounded-sm"></div>
<div class="shimmer-base w-[80px] h-[12px] rounded-sm"></div>
</div>
</div>
<!-- Extra spacing for scrolling -->
<div class="h-8"></div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full h-[80px] bg-background border-t border-outline-variant/20 px-2 flex justify-around items-center z-50">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[12px] font-medium tracking-[0.5px] mt-1">Home</span>
</div>
<!-- Accounts (Active State) -->
<div class="flex flex-col items-center justify-center bg-[#4C662B] text-white rounded-full px-5 py-1 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="text-[12px] font-medium tracking-[0.5px]">Accounts</span>
</div>
<!-- Payments -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="text-[12px] font-medium tracking-[0.5px] mt-1">Payments</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[12px] font-medium tracking-[0.5px] mt-1">Profile</span>
</div>
</nav>
</body></html>
