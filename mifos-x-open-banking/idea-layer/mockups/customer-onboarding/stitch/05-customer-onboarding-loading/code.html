<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#4C662B",
              "primary-container": "#CDEDA3",
              "on-primary": "#FFFFFF",
              "on-primary-container": "#102000",
              secondary: "#386663",
              "secondary-container": "#BCEBE7",
              accent: "#CDEDA3",
              error: "#BA1A1A",
              background: "#F9FAEF",
              surface: "#FFFFFF",
              "on-surface": "#1A1C16",
              "on-surface-variant": "#44483D",
              "surface-variant": "#E1E4D5",
              "surface-container": "#F0F1E6",
              "surface-container-high": "#EAECE1",
              "nav-active-indicator": "#DCE7C8",
              outline: "#75796C",
              "outline-variant": "#C5C8BA",
              "dark-surface": "#12140E",
              "dark-accent": "#B2D188"
            },
            borderRadius: {
              "none": "0",
              "xs": "4px",
              "sm": "8px",
              "md": "12px",
              "lg": "16px",
              "xl": "24px",
              "pill": "9999px"
            },
            fontFamily: {
              headline: ["Outfit", "sans-serif"],
              display: ["Outfit", "sans-serif"],
              body: ["Outfit", "sans-serif"],
              label: ["Outfit", "sans-serif"]
            }
          }
        }
      }
    </script>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #23261D; /* Custom dark surface variant for skeleton */
        }
        .shimmer-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.05) 50%,
                transparent 100%
            );
            animation: shimmer 2s infinite linear;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E1E4D5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex justify-center items-start min-h-screen">
<!-- Mobile Container (393x852 simulated) -->
<div class="w-[393px] min-h-[852px] bg-dark-surface relative flex flex-col overflow-hidden">
<!-- TopAppBar (Based on JSON) -->
<header class="flex justify-between items-center h-14 px-4 w-full z-50 bg-dark-surface border-b border-outline-variant/10">
<div class="flex items-center gap-4">
<button class="text-dark-accent p-2 Active: opacity-80 scale-95 transition-all">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline text-title-large font-regular text-dark-accent">Corporate Onboarding</h1>
</div>
<button class="text-dark-accent p-2">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 px-4 py-6 overflow-y-auto pb-32">
<!-- Active Progress Indicator Skeleton (Used Sparingly) -->
<div class="w-full h-1 mb-8 rounded-full bg-outline-variant/20 overflow-hidden">
<div class="h-full bg-dark-accent/40 w-1/3 rounded-full"></div>
</div>
<!-- Large Rectangular Box (Header/Illustration) -->
<div class="w-full h-48 rounded-lg shimmer-wrapper mb-8"></div>
<!-- Headline Text Placeholder -->
<div class="space-y-3 mb-10">
<div class="w-3/4 h-8 rounded-sm shimmer-wrapper"></div>
<div class="w-1/2 h-4 rounded-sm shimmer-wrapper opacity-50"></div>
</div>
<!-- 11 Sequential Input Field Skeleton Shapes -->
<div class="space-y-6">
<!-- Row 1-11 -->
<div class="space-y-2">
<div class="w-24 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-20 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-32 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-28 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-16 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-40 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-24 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-20 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-32 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-28 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
<div class="space-y-2">
<div class="w-24 h-3 rounded-xs shimmer-wrapper opacity-30"></div>
<div class="w-full h-14 rounded-xs shimmer-wrapper border border-outline-variant/10"></div>
</div>
</div>
</main>
<!-- Bottom Action Buttons (Sticky) -->
<div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-dark-surface via-dark-surface to-transparent flex flex-col gap-3">
<!-- Three Button Skeletons -->
<div class="w-full h-12 rounded-pill shimmer-wrapper"></div>
<div class="w-full h-12 rounded-pill shimmer-wrapper opacity-60"></div>
<div class="w-full h-12 rounded-pill shimmer-wrapper opacity-40"></div>
</div>
</div>
<!-- Background Decoration for atmosphere -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] rounded-full bg-dark-accent/5 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px]"></div>
</div>
<script>
        // Simple micro-interaction for the arrow back
        document.querySelector('button').addEventListener('mousedown', function() {
            this.classList.add('scale-95', 'opacity-80');
        });
        document.querySelector('button').addEventListener('mouseup', function() {
            this.classList.remove('scale-95', 'opacity-80');
        });
    </script>
</body></html>
