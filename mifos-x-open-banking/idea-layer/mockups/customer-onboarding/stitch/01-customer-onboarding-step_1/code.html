<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X - Registration Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#013735",
                    "on-primary-fixed": "#102000",
                    "on-error": "#690005",
                    "surface-variant": "#333531",
                    "on-tertiary-fixed-variant": "#1f4e4b",
                    "secondary": "#a0cfcb",
                    "surface-container-lowest": "#0d0f0b",
                    "background": "#121410",
                    "surface": "#121410",
                    "on-surface": "#e3e3dc",
                    "outline-variant": "#44483c",
                    "on-secondary-fixed": "#00201e",
                    "on-secondary-fixed-variant": "#1f4e4b",
                    "tertiary": "#bdece8",
                    "inverse-on-surface": "#2f312d",
                    "on-surface-variant": "#c4c8b9",
                    "error": "#ffb4ab",
                    "tertiary-fixed": "#bcece7",
                    "on-primary": "#203700",
                    "primary-container": "#b2d188",
                    "surface-container-high": "#292b26",
                    "on-secondary-container": "#8fbeba",
                    "surface-dim": "#121410",
                    "secondary-container": "#1f4e4b",
                    "surface-container-low": "#1a1c18",
                    "primary-fixed": "#cdeda1",
                    "error-container": "#93000a",
                    "on-primary-container": "#415a1f",
                    "secondary-fixed": "#bcece7",
                    "surface-container": "#1e201c",
                    "on-tertiary": "#013735",
                    "primary-fixed-dim": "#b2d188",
                    "outline": "#8e9284",
                    "on-background": "#e3e3dc",
                    "tertiary-fixed-dim": "#a0cfcb",
                    "tertiary-container": "#a1d0cc",
                    "surface-tint": "#b2d188",
                    "on-error-container": "#ffdad6",
                    "inverse-surface": "#e3e3dc",
                    "secondary-fixed-dim": "#a0cfcb",
                    "surface-bright": "#383a35",
                    "primary": "#ceeda2",
                    "surface-container-highest": "#333531",
                    "on-tertiary-container": "#2d5a57",
                    "on-tertiary-fixed": "#00201e",
                    "on-primary-fixed-variant": "#354e14",
                    "inverse-primary": "#4c662a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "gutter": "24px",
                    "xl": "32px",
                    "sm": "12px",
                    "margin-desktop": "48px",
                    "margin-mobile": "16px",
                    "base": "8px",
                    "xs": "4px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "body-md": ["Outfit"],
                    "label-sm": ["Outfit"],
                    "headline-lg": ["Outfit"],
                    "display-lg": ["Outfit"],
                    "body-lg": ["Outfit"],
                    "headline-lg-mobile": ["Outfit"],
                    "title-lg": ["Outfit"],
                    "label-lg": ["Outfit"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "0px", "fontWeight": "400"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "0px", "fontWeight": "400"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #121410;
            color: #e3e3dc;
            font-family: 'Outfit', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(35, 38, 31, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-container {
            background: #23261F;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .input-container:focus-within {
            border-bottom-color: #b2d188;
        }
        input:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="bg-background dark:bg-background border-b border-outline-variant/10 w-full top-0 sticky z-40">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full max-w-[1440px] mx-auto">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high/50 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-bold text-primary">Registration</h1>
</div>
<button class="p-2 hover:bg-surface-container-high/50 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="help">help</span>
</button>
</div>
</header>
<main class="w-full max-w-[1440px] flex flex-col flex-1 px-margin-mobile md:px-margin-desktop py-gutter gap-lg">
<!-- Progress Indicator -->
<div class="w-full mb-base">
<div class="flex justify-between items-end mb-xs">
<span class="font-label-lg text-label-lg text-primary">Step 1 of 4</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">25% Complete</span>
</div>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[25%] rounded-full transition-all duration-500"></div>
</div>
</div>
<!-- Header Section -->
<div class="space-y-base max-w-2xl">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface font-semibold">Personal Information</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">
                Please provide your basic details to start your open banking journey with Mifos X.
            </p>
</div>
<!-- Form Section: Bento/Grid Hybrid -->
<form class="glass-card p-lg rounded-xl grid grid-cols-1 md:grid-cols-12 gap-gutter" onsubmit="return false;">
<!-- Row 1: Identity -->
<div class="md:col-span-12 lg:col-span-6 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Full Name</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="Enter your full legal name" type="text"/>
</div>
</div>
<div class="md:col-span-6 lg:col-span-3 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Date of Birth</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md [color-scheme:dark]" type="date"/>
</div>
</div>
<div class="md:col-span-6 lg:col-span-3 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Gender</label>
<div class="input-container px-base py-sm rounded-t-lg relative">
<select class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md appearance-none">
<option disabled="" selected="" value="">Select Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other / Prefer not to say</option>
</select>
</div>
</div>
<!-- Row 2: Nationality & ID -->
<div class="md:col-span-12 lg:col-span-4 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Nationality</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="e.g. United Kingdom" type="text"/>
</div>
</div>
<div class="md:col-span-6 lg:col-span-4 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">ID Type</label>
<div class="input-container px-base py-sm rounded-t-lg">
<select class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md appearance-none">
<option disabled="" selected="" value="">Select ID Type</option>
<option value="passport">Passport</option>
<option value="driving">Driving License</option>
<option value="national">National Identity Card</option>
</select>
</div>
</div>
<div class="md:col-span-6 lg:col-span-4 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">ID Number</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="Document ID number" type="text"/>
</div>
</div>
<!-- Row 3: Contact -->
<div class="md:col-span-12 lg:col-span-6 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Phone Number</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="+44 20 7946 0000" type="tel"/>
</div>
</div>
<div class="md:col-span-12 lg:col-span-6 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Email Address</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Row 4: Address -->
<div class="md:col-span-12 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Residential Address</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="House number, street, and apartment" type="text"/>
</div>
</div>
<div class="md:col-span-6 lg:col-span-8 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">City</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="City / Town" type="text"/>
</div>
</div>
<div class="md:col-span-6 lg:col-span-4 space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base">Postal Code</label>
<div class="input-container px-base py-sm rounded-t-lg">
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md placeholder:text-outline-variant" placeholder="ZIP / Postcode" type="text"/>
</div>
</div>
<!-- Buttons Actions Container -->
<div class="md:col-span-12 pt-gutter flex flex-col md:flex-row gap-gutter md:items-center">
<button class="order-1 md:order-3 bg-[#B2D188] text-[#1F3701] font-label-lg text-label-lg px-xl h-12 rounded-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-base" type="submit">
                    Next Step
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="order-2 md:order-2 border border-[#A0CFCB]/50 text-[#A0CFCB] font-label-lg text-label-lg px-xl h-12 rounded-lg hover:bg-secondary/10 transition-all" type="button">
                    Save Draft
                </button>
<div class="md:flex-1 md:order-1 flex justify-center md:justify-start">
<button class="text-[#B2D188] font-label-lg text-label-lg px-base h-12 hover:bg-primary-container/10 rounded-lg transition-all" type="button">
                        Cancel
                    </button>
</div>
</div>
</form>
<!-- Aesthetic Branding Element (Floating Visual) -->
<div class="hidden lg:block absolute right-0 top-1/4 -z-10 opacity-20 pointer-events-none translate-x-1/2">
<div class="w-96 h-96 bg-primary blur-[120px] rounded-full"></div>
</div>
<!-- Footer Help -->
<footer class="w-full flex justify-center py-gutter mt-auto">
<a class="flex items-center gap-xs text-on-surface-variant hover:text-primary transition-colors font-label-lg text-label-lg" href="#">
<span class="material-symbols-outlined" data-icon="support_agent">support_agent</span>
                Need Help? Contact our onboarding specialist
            </a>
</footer>
</main>
<script>
        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.98)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });

        // Simple validation visualization
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                if (input.value) {
                    input.closest('.input-container').style.borderBottomColor = 'rgba(178, 209, 136, 0.5)';
                } else {
                    input.closest('.input-container').style.borderBottomColor = 'transparent';
                }
            });
        });
    </script>
</body></html>
