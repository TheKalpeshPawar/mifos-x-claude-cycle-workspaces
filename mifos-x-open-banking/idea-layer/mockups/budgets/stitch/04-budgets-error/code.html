<body class="font-body-md text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-xl bg-surface">
<div class="flex items-center gap-sm">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors rounded-full p-xs active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-on-surface">Budgets</h1>
</div>
<div class="flex items-center gap-xs">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors rounded-full p-xs active:scale-95 transition-transform" data-icon="more_vert">more_vert</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-xl pb-32">
<div class="max-w-xs w-full flex flex-col items-center text-center">
<!-- Error Icon -->
<span class="material-symbols-outlined text-[72px] text-error mb-md" data-icon="warning_amber" style="font-size: 72px;">warning_amber</span>
<!-- Heading -->
<h2 class="font-title-md text-title-md text-on-surface mb-xs" style="font-weight: 500; font-size: 20px;">Couldn't load budgets</h2>
<!-- Body text -->
<p class="font-body-md text-on-surface-variant mb-lg" style="font-size: 14px; font-weight: 400;">
                Your transaction data is temporarily unavailable. Pull down to refresh or tap retry.
            </p>
<!-- Action Button -->
<button class="bg-primary-container text-on-primary font-title-md text-title-md px-xl py-sm rounded-full active:scale-95 transition-transform hover:brightness-110 shadow-lg" onclick="window.location.reload()" style="font-size: 14px; font-weight: 500;">
                Retry
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-xs py-base bg-surface-container z-50">
<!-- Overview -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-sm py-xs hover:text-on-surface transition-colors active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-base" data-icon="dashboard">dashboard</span>
<span class="font-label-sm text-label-sm">Overview</span>
</a>
<!-- Budgets (Active State) -->
<a class="flex flex-col items-center justify-center bg-on-primary-container text-primary-container rounded-xl px-sm py-xs active:scale-90 transition-transform" href="#">

</a>
<!-- Spending -->

<span class="material-symbols-outlined mb-base" data-icon="payments">payments</span>
<span class="font-label-sm text-label-sm">Spending</span>
</a>
<!-- Subscriptions -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-sm py-xs hover:text-on-surface transition-colors active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-base" data-icon="event_repeat">event_repeat</span>
<span class="font-label-sm text-label-sm">Subscriptions</span>
</a>
</nav>
<script>
        // Micro-interaction for pull-to-refresh simulation
        let touchstartY = 0;
        let touchendY = 0;

        document.addEventListener('touchstart', e => {
            touchstartY = e.changedTouches[0].screenY;
        });

        document.addEventListener('touchend', e => {
            touchendY = e.changedTouches[0].screenY;
            if (touchendY > touchstartY + 150) {
                // Simulate refresh
                const btn = document.querySelector('button');
                btn.classList.add('animate-pulse');
                setTimeout(() => {
                    window.location.reload();
                }, 800);
            }
        });
    </script>
