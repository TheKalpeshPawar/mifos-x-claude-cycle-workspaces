<body class="flex flex-col min-h-screen">
<!-- Component 1: TopAppBar (Shared Component Logic Applied) -->

<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-outline/20">
<img class="w-full h-full object-cover" data-alt="A professional high-quality studio headshot of a middle-aged business executive with a friendly expression. The lighting is soft and cinematic, following the corporate modern aesthetic with deep blues and neutral grays in the background to match the banking app's premium dark theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBn_vkxodiBdcLK8koPWsaaImf73Qn3vkIGODYxbTnNT8UJDKbGtbKe2yTetzt6oGDTc7iEqF9k7v0SxhVaPmPl7gvS9o-ibBhOGO6E1KzA1sVHO--bG-t2cTzA6uo7aCh9d3iuygVbjZktkbLUbxxKCUxSgqkeZo9bSXAeRHIspr2xbHTj0CbOcOFUIQyVSsse359LcxXQxczKUoVZVJ0JNo3Bol1LTwrxL0HSZ61BdJqHdbYS3jBGLvlWtEb166RkeMXTGITYGpc"/>

<!-- Main Content Canvas -->
<main class="flex-1 mt-[64px] mb-[80px] overflow-y-auto px-margin-mobile pt-8">
<!-- Component 2: Set Budget Card -->
<section class="w-full max-w-md mx-auto mb-12">
<div class="bg-surface-container rounded-xl p-md border border-outline/10 shadow-sm">
<h2 class="font-section-label text-section-label text-primary-fixed-dim uppercase mb-xs">
          SET A BUDGET
        </h2>
<div class="flex flex-col gap-4 mt-base">
<!-- Category Field -->
<div class="relative">
<div class="flex items-center h-[48px] px-md border border-outline-variant rounded-lg focus-within:border-primary-fixed-dim transition-colors group">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="category">category</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body font-body text-on-surface p-0" placeholder="Category" type="text"/>
</div>
</div>
<!-- Monthly Limit Field -->
<div class="relative">
<div class="flex items-center h-[48px] px-md border border-outline-variant rounded-lg focus-within:border-primary-fixed-dim transition-colors group">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="payments">payments</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body font-body text-on-surface p-0" placeholder="Monthly limit" type="number"/>
</div>
</div>
<!-- Save Button -->
<button class="w-full h-[48px] bg-primary-container hover:bg-primary-container/90 active:scale-[0.98] transition-all rounded-full flex items-center justify-center">
<span class="font-button text-button text-on-primary">Save Budget</span>
</button>
</div>
</div>
</section>
<!-- Component 3: Empty State -->
<section class="flex flex-col items-center text-center px-margin-mobile pt-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="w-16 h-16 mb-md flex items-center justify-center rounded-full bg-surface-container-highest/30">
<span class="material-symbols-outlined text-[64px] text-on-surface-variant" data-icon="savings" style="font-variation-settings: 'FILL' 0;">savings</span>
</div>
<h3 class="font-heading text-heading text-on-surface mb-xs">
        No budgets set
      </h3>
<p class="font-body text-body text-on-surface-variant max-w-[280px]">
        Use the form above to create your first monthly spending limit. Limits are tracked against your HSBC transactions.
      </p>
<!-- Atmospheric background decoration -->
<div class="absolute -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full pointer-events-none opacity-20">

<div class="absolute bottom-[20%] right-[10%] w-48 h-48 bg-secondary-container/20 rounded-full blur-[80px]"></div>
</div>
</section>
</main>
<!-- Component 4: BottomNavBar (Shared Component Logic Applied) -->
<!-- Budgets is active -->
<nav class="fixed bottom-0 left-0 w-full h-[80px] bg-surface-container flex justify-around items-center px-margin-mobile border-t border-outline/10 z-50">
<!-- Overview -->
<div class="flex flex-col items-center justify-center text-outline cursor-pointer active:scale-95 transition-all">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-section-label text-section-label">Overview</span>
</div>
<!-- Budgets (Active State) -->
<div class="flex flex-col items-center justify-center text-primary-fixed-dim cursor-pointer active:scale-95 transition-all">
<div class="bg-secondary-container/40 px-5 py-1 rounded-full mb-1">

</div>
<span class="font-section-label text-section-label">Budgets</span>
</div>
<!-- Spending -->
<div class="flex flex-col items-center justify-center text-outline cursor-pointer active:scale-95 transition-all">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="font-section-label text-section-label">Spending</span>
</div>
<!-- Subscriptions -->
<div class="flex flex-col items-center justify-center text-outline cursor-pointer active:scale-95 transition-all">
<span class="material-symbols-outlined mb-1" data-icon="event_repeat">event_repeat</span>
<span class="font-section-label text-section-label">Subscriptions</span>
</div>
</nav>
<script>
    // Lightweight interaction for the button and fields
    document.querySelector('button').addEventListener('click', function() {
      const inputs = document.querySelectorAll('input');
      let hasValue = false;
      inputs.forEach(input => {
        if(input.value) hasValue = true;
      });
      
      if(!hasValue) {
        // Feedback if empty
        this.classList.add('bg-error-container');
        setTimeout(() => {
          this.classList.remove('bg-error-container');
        }, 300);
      }
    });
  </script>
