<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HSBC Open Banking - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#95CDF7",
                        "on-primary": "#00344E",
                        "primary-container": "#C9E6FF",
                        secondary: "#50606E",
                        tertiary: "#64597B",
                        background: "#101417",
                        surface: "#101417",
                        "surface-container": "#1C2024",
                        "on-surface": "#E0E3E8",
                        "on-surface-variant": "#C1C7CE",
                        outline: "#8B9198",
                        "outline-variant": "#41474D",
                        error: "#FFB4AB",
                        "on-error": "#690005",
                        "error-container": "#93000A",
                        "on-error-container": "#FFDAD6"
                    },
                    borderRadius: {
                        "small": "8px",
                        "medium": "12px",
                        "large": "16px",
                        "extra-large": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Public Sans", "sans-serif"],
                        label: ["Public Sans", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    }
                }
            }
        };
    </script>
<style>
        body {
            background-color: #101417;
            color: #E0E3E8;
            font-family: 'Public Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .nav-item-active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-press:active {
            transform: scale(0.96);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 w-full h-16 flex items-center justify-between px-4 bg-[#101417] border-b border-outline-variant/20">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-on-surface/5 transition-colors text-primary">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-[22px] font-medium text-on-surface tracking-tight">Scheduled Payments</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-on-surface/5 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 text-center max-w-md mx-auto">
<!-- Error State Container -->
<div class="flex flex-col items-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Icon -->
<div class="mb-4">
<span class="material-symbols-outlined text-[64px] text-error leading-none">error_outline</span>
</div>
<!-- Headline -->
<h2 class="text-[20px] font-medium text-on-surface mb-4">
                Could not load payments
            </h2>
<!-- Body Text -->
<p class="text-[14px] leading-relaxed text-on-surface-variant mb-10 max-w-[280px]">
                We could not connect to HSBC to retrieve your scheduled payment data. Check your connection and try again.
            </p>
<!-- Recovery Action -->
<button class="w-[200px] h-[48px] bg-primary text-on-primary rounded-full font-medium text-[16px] shadow-sm hover:shadow-md transition-all btn-press flex items-center justify-center">
                Try again
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-[#1C2024] flex items-center justify-around px-2 z-50">
<!-- Home -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="text-[12px] font-medium tracking-wide">Home</span>
</a>
<!-- Accounts -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">account_balance</span>
<span class="text-[12px] font-medium tracking-wide">Accounts</span>
</a>
<!-- Payments (Active) -->
<a class="nav-item-active flex flex-col items-center justify-center gap-1 min-w-[64px]" href="#">
<div class="bg-primary-container/20 px-5 py-1 rounded-full mb-0.5">
<span class="material-symbols-outlined text-[24px] text-primary" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<span class="text-[12px] font-bold tracking-wide text-primary">Payments</span>
</a>
<!-- More -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">more_horiz</span>
<span class="text-[12px] font-medium tracking-wide">More</span>
</a>
</nav>
<!-- Background Atmospheric Effect (Optional Micro-interaction) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-primary/5 blur-[120px] rounded-full"></div>
</div>
<script>
        // Simple micro-interaction for the button
        const retryBtn = document.querySelector('button');
        if (retryBtn) {
            retryBtn.addEventListener('click', () => {
                const text = retryBtn.innerText;
                retryBtn.disabled = true;
                retryBtn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                `;
                
                // Simulate refresh
                setTimeout(() => {
                    retryBtn.disabled = false;
                    retryBtn.innerText = text;
                }, 2000);
            });
        }
    </script>
</body></html>
