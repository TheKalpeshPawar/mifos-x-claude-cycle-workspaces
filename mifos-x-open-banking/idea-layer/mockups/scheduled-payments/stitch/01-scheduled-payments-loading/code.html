<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HSBC Open Banking - Scheduled Payments Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#95CDF7",
                        "on-primary": "#00344E",
                        secondary: "#50606E",
                        tertiary: "#64597B",
                        background: "#101417",
                        surface: "#101417",
                        "surface-container": "#1C2024",
                        "surface-container-high": "#262A2E",
                        "surface-container-highest": "#313539",
                        "on-surface": "#E0E3E8",
                        "on-surface-variant": "#C1C7CE",
                        outline: "#72787E",
                        "outline-variant": "rgba(114, 120, 126, 0.2)",
                        "secondary-container": "#3C4856",
                        "on-secondary-container": "#D6E3F2"
                    },
                    borderRadius: {
                        "small": "8px",
                        "medium": "12px",
                        "large": "16px",
                        "extra-large": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Public Sans", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .shimmer-sweep {
            position: relative;
            overflow: hidden;
        }
        
        .shimmer-sweep::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                rgba(49, 53, 57, 0) 0%,
                rgba(49, 53, 57, 0.6) 50%,
                rgba(49, 53, 57, 0) 100%
            );
            animation: shimmer 1.8s infinite ease-in-out;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface h-16 border-b border-outline-variant/10">
<div class="flex items-center justify-between px-4 h-full max-w-[393px] mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">arrow_back</span>
<!-- 120x18dp shimmer bar -->
<div class="w-[120px] h-[18px] bg-surface-container-high rounded shimmer-sweep"></div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">shield</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 pb-24 px-4 max-w-[393px] mx-auto min-h-screen space-y-4">
<!-- Skeleton Card 1 -->
<div class="w-full h-[96px] bg-surface-container rounded-medium p-4 flex flex-col justify-between shimmer-sweep overflow-hidden">
<div class="flex justify-between items-start">
<!-- Payee name: 160x16dp -->
<div class="w-[160px] h-[16px] bg-surface-container-high rounded"></div>
<!-- Amount: 80x16dp -->
<div class="w-[80px] h-[16px] bg-surface-container-high rounded"></div>
</div>
<div class="flex flex-col gap-2">
<!-- Date: 120x14dp -->
<div class="w-[120px] h-[14px] bg-surface-container-high rounded"></div>
<!-- Reference: 100x12dp -->
<div class="w-[100px] h-[12px] bg-surface-container-high rounded"></div>
</div>
</div>
<!-- Skeleton Card 2 -->
<div class="w-full h-[96px] bg-surface-container rounded-medium p-4 flex flex-col justify-between shimmer-sweep overflow-hidden">
<div class="flex justify-between items-start">
<div class="w-[160px] h-[16px] bg-surface-container-high rounded"></div>
<div class="w-[80px] h-[16px] bg-surface-container-high rounded"></div>
</div>
<div class="flex flex-col gap-2">
<div class="w-[120px] h-[14px] bg-surface-container-high rounded"></div>
<div class="w-[100px] h-[12px] bg-surface-container-high rounded"></div>
</div>
</div>
<!-- Skeleton Card 3 -->
<div class="w-full h-[96px] bg-surface-container rounded-medium p-4 flex flex-col justify-between shimmer-sweep overflow-hidden">
<div class="flex justify-between items-start">
<div class="w-[160px] h-[16px] bg-surface-container-high rounded"></div>
<div class="w-[80px] h-[16px] bg-surface-container-high rounded"></div>
</div>
<div class="flex flex-col gap-2">
<div class="w-[120px] h-[14px] bg-surface-container-high rounded"></div>
<div class="w-[100px] h-[12px] bg-surface-container-high rounded"></div>
</div>
</div>
<!-- Skeleton Card 4 -->
<div class="w-full h-[96px] bg-surface-container rounded-medium p-4 flex flex-col justify-between shimmer-sweep overflow-hidden">
<div class="flex justify-between items-start">
<div class="w-[160px] h-[16px] bg-surface-container-high rounded"></div>
<div class="w-[80px] h-[16px] bg-surface-container-high rounded"></div>
</div>
<div class="flex flex-col gap-2">
<div class="w-[120px] h-[14px] bg-surface-container-high rounded"></div>
<div class="w-[100px] h-[12px] bg-surface-container-high rounded"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full bg-surface-container h-20 border-t border-outline-variant/10 z-50 px-4">
<div class="max-w-[393px] mx-auto h-full flex justify-around items-center">
<!-- Home -->
<div class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined">home</span>
<span class="text-[12px] font-medium">Home</span>
</div>
<!-- Accounts -->
<div class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined">account_balance</span>
<span class="text-[12px] font-medium">Accounts</span>
</div>
<!-- Payments (Active) -->
<div class="flex flex-col items-center gap-1">
<div class="bg-secondary-container text-primary rounded-full px-5 py-1 mb-1 transition-transform active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<span class="text-[12px] font-bold text-primary">Payments</span>
</div>
<!-- More -->
<div class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined">more_horiz</span>
<span class="text-[12px] font-medium">More</span>
</div>
</div>
</nav>
<script>
        // Micro-interaction for feedback
        document.querySelectorAll('nav div').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.add('scale-95');
                setTimeout(() => item.classList.remove('scale-95'), 150);
            });
        });
    </script>
</body></html>
