<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Card Detail Loading - Mifos X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3DC",
                        "on-surface-variant": "#C5C8BA",
                        "outline": "#8F9284",
                        "outline-variant": "#44483D",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "8px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px",
                        "full": "9999px"
                    },
                    spacing: {
                        'margin': '16px',
                        'unit': '8px',
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    animation: {
                        'shimmer': 'shimmer 1200ms linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-150%)' },
                            '100%': { transform: 'translateX(150%)' }
                        }
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #E3E3DC;
        }
        .shimmer-base {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }
        .shimmer-base::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(30, 32, 26, 0) 0%,
                rgba(40, 42, 36, 1) 50%,
                rgba(30, 32, 26, 0) 100%
            );
            animation: shimmer 1200ms linear infinite;
        }
        .shimmer-high {
            position: relative;
            overflow: hidden;
            background-color: #282A24;
        }
        .shimmer-high::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(40, 42, 36, 0) 0%,
                rgba(68, 72, 61, 0.3) 50%,
                rgba(40, 42, 36, 0) 100%
            );
            animation: shimmer 1200ms linear infinite;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col">
<header class="w-full top-0 sticky bg-background z-50 flex items-center justify-between px-margin h-14">
<div class="w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</div>
<div class="shimmer-base w-[120px] h-6 rounded-sm"></div>
<div class="w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">more_vert</span>
</div>
</header>
<main class="flex-1 w-full max-w-[390px] mx-auto pb-10">
<section class="mt-4 px-margin">
<div class="shimmer-base w-full h-[192px] rounded-lg p-6 flex flex-col justify-between border border-outline-variant/30 relative">
<div class="flex justify-end">
<div class="shimmer-high w-12 h-8 rounded-sm"></div>
</div>
<div class="space-y-3">
<div class="shimmer-high w-48 h-3 rounded-full opacity-60"></div>
<div class="shimmer-high w-32 h-3 rounded-full opacity-40"></div>
</div>
</div>
</section>
<section class="mt-8 px-margin">
<div class="shimmer-base w-full h-[112px] rounded-md p-4 flex flex-col gap-4 border border-outline-variant/20">
<div class="shimmer-high w-[120px] h-4 rounded-full"></div>
<div class="space-y-2">
<div class="shimmer-high w-[100px] h-3 rounded-full opacity-60"></div>
<div class="shimmer-high w-[80px] h-3 rounded-full opacity-40"></div>
</div>
</div>
</section>
<section class="mt-6 px-margin space-y-3">
<div class="shimmer-base w-full h-14 rounded-md px-4 flex items-center justify-between border border-outline-variant/10">
<div class="shimmer-high w-[180px] h-4 rounded-full"></div>
<div class="shimmer-high w-[40px] h-6 rounded-full opacity-80"></div>
</div>
<div class="shimmer-base w-full h-14 rounded-md px-4 flex items-center justify-between border border-outline-variant/10">
<div class="shimmer-high w-[140px] h-4 rounded-full"></div>
<div class="shimmer-high w-[40px] h-6 rounded-full opacity-80"></div>
</div>
</section>
<section class="mt-8 px-margin flex flex-col gap-3">
<div class="w-full h-12 rounded-md border border-outline-variant shimmer-base flex items-center justify-center">
<div class="shimmer-high w-24 h-3 rounded-full opacity-40"></div>
</div>
<div class="w-full h-12 rounded-md border border-outline-variant shimmer-base flex items-center justify-center">
<div class="shimmer-high w-32 h-3 rounded-full opacity-40"></div>
</div>
<div class="w-full h-12 rounded-md bg-surface-container-high shimmer-high flex items-center justify-center mt-2">
<div class="bg-on-surface/10 w-40 h-3 rounded-full"></div>
</div>
</section>
<section class="mt-10 px-margin">
<div class="flex items-center gap-4 py-4">
<div class="shimmer-base w-12 h-12 rounded-full shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="shimmer-base w-3/4 h-3 rounded-full"></div>
<div class="shimmer-base w-1/2 h-2 rounded-full opacity-50"></div>
</div>
</div>
<div class="flex items-center gap-4 py-4">
<div class="shimmer-base w-12 h-12 rounded-full shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="shimmer-base w-2/3 h-3 rounded-full"></div>
<div class="shimmer-base w-1/3 h-2 rounded-full opacity-50"></div>
</div>
</div>
</section>
</main>
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe w-full bg-surface-container/80 backdrop-blur-md border-t border-outline-variant/20 shadow-[0_-4px_12px_rgba(0,0,0,0.2)]">
<div class="flex flex-col items-center justify-center text-on-surface-variant gap-1">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant gap-1">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="text-[10px] font-medium">Transactions</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant gap-1">
<span class="material-symbols-outlined">payments</span>
<span class="text-[10px] font-medium">Payments</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] font-bold">Profile</span>
</div>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.shimmer-base, .shimmer-high');
            shimmers.forEach((el, index) => {
                el.style.animationDelay = `${index * 50}ms`;
            });
        });
    </script>
</body></html>
