<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X - Card Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1E201A",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#75796C",
                        "outline-variant": "#44483D",
                        "custom-green": "#354E16",
                        "custom-accent": "#B2D188",
                        "custom-blue": "#A0CFCB",
                        "custom-error-text": "#FFB4AB",
                        "custom-error-border": "#93000A"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        'sm': '4px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '24px',
                        'full': '9999px'
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Outfit', sans-serif; background-color: #12140E; color: #E3E3D8; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-gradient {
            background: linear-gradient(135deg, #354E16 0%, #1E201A 100%);
        }
        .custom-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        ::-webkit-scrollbar { width: 0; background: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="flex items-center px-4 h-16 w-full sticky top-0 z-50 bg-[#12140E] transition-colors duration-200">
<div class="flex items-center justify-between w-full">
<button class="material-symbols-outlined text-[#B2D188] hover:bg-surface-variant/20 p-2 rounded-full transition-colors duration-200" data-icon="arrow_back">
                arrow_back
            </button>
<h1 class="font-medium text-[18sp] text-[#E3E3D8] absolute left-1/2 -translate-x-1/2">Card Details</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content (Scrollable) -->
<main class="flex-1 overflow-y-auto px-4 pb-32 space-y-6">
<!-- Card Visual -->
<section class="mt-4">
<div class="card-gradient h-[192px] w-full rounded-lg p-6 flex flex-col justify-between custom-shadow relative overflow-hidden border border-outline-variant/30">
<!-- Decorative elements -->
<div class="absolute top-[-20%] right-[-10%] w-48 h-48 bg-primary-container/5 rounded-full blur-3xl"></div>
<div class="flex justify-between items-center z-10">
<span class="font-bold text-[14sp] text-[#CDEDA3] tracking-tight">Mifos X</span>
<div class="flex space-x-1 items-center">
<div class="w-8 h-5 bg-[#E3E3D8]/20 rounded-sm flex items-center justify-center">
<span class="text-[10px] font-bold text-[#E3E3D8]">VISA</span>
</div>
</div>
</div>
<div class="z-10 flex justify-center py-4">
<p class="font-medium text-[20sp] tracking-[2sp] text-[#E3E3D8]">.... .... .... 4521</p>
</div>
<div class="flex justify-between items-end z-10">
<div>
<p class="text-[10px] text-[#C5C8BA] mb-0.5 opacity-70">CARD HOLDER</p>
<p class="font-medium text-[13sp] text-[#C5C8BA]">ALEX JOHNSON</p>
</div>
<div class="text-right">
<p class="text-[10px] text-[#C5C8BA] mb-0.5 opacity-70">EXPIRES</p>
<p class="font-regular text-[13sp] text-[#C5C8BA]">09/29</p>
</div>
</div>
</div>
<button class="w-full text-center mt-4 text-[12sp] text-[#B2D188] font-medium hover:opacity-80 transition-opacity">
                Show card details
            </button>
</section>
<!-- Status Row -->
<section class="bg-[#1E201A] rounded-md p-4 flex items-center justify-between border border-outline-variant/20">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-[#B2D188]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-semibold text-[15sp] text-[#E3E3D8]">Card Active</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-[#354E16] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-[#B2D188] after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#354E16]"></div>
</label>
</section>
<!-- Spending Limits Card -->
<section class="bg-[#1E201A] rounded-md p-4 border border-outline-variant/20">
<h2 class="font-semibold text-[15sp] text-[#E3E3D8] mb-4">Spending Limits</h2>
<div class="space-y-4">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-[13sp] text-[#C5C8BA]">Daily limit</span>
<span class="text-[15sp] font-medium text-[#E3E3D8]">2500 GBP</span>
</div>
<button class="material-symbols-outlined text-[#B2D188] hover:bg-surface-variant/30 p-2 rounded-full transition-colors" data-icon="edit">
                        edit
                    </button>
</div>
<div class="h-[1px] w-full bg-[#44483D]"></div>
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-[13sp] text-[#C5C8BA]">Monthly limit</span>
<span class="text-[15sp] font-medium text-[#E3E3D8]">10000 GBP</span>
</div>
<button class="material-symbols-outlined text-[#B2D188] hover:bg-surface-variant/30 p-2 rounded-full transition-colors" data-icon="edit">
                        edit
                    </button>
</div>
</div>
</section>
<!-- Action Buttons -->
<section class="space-y-3 pt-2">
<button class="w-full flex items-center justify-center space-x-2 py-3.5 px-4 rounded-full border border-[#44483D] text-[#E3E3D8] font-medium hover:bg-surface-variant/10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[#A0CFCB]" data-icon="ac_unit">ac_unit</span>
<span>Freeze Card</span>
</button>
<button class="w-full flex items-center justify-center space-x-2 py-3.5 px-4 rounded-full border border-[#93000A] text-[#FFB4AB] font-medium hover:bg-error/5 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[#FFB4AB]" data-icon="warning">warning</span>
<span>Report Lost/Stolen</span>
</button>
<button class="w-full flex items-center justify-center space-x-2 py-3.5 px-4 rounded-full bg-[#354E16] text-[#CDEDA3] font-semibold active:scale-95 transition-all shadow-lg">
<span class="material-symbols-outlined text-[#CDEDA3]" data-icon="list" style="font-variation-settings: 'FILL' 1;">list</span>
<span>View Transactions</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface-container rounded-t-xl border-t border-outline/10">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="credit_card" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<span class="font-label-md text-label-md mt-1">Cards</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md mt-1">Payments</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</button>
</nav>
<script>
        // Simple micro-interaction for toggle
        const toggle = document.querySelector('input[type="checkbox"]');
        toggle.addEventListener('change', function() {
            const statusText = document.querySelector('section span.font-semibold');
            const statusIcon = document.querySelector('section span.material-symbols-outlined[data-icon="check_circle"]');
            
            if(this.checked) {
                statusText.textContent = 'Card Active';
                statusText.style.color = '#E3E3D8';
                statusIcon.style.color = '#B2D188';
                statusIcon.textContent = 'check_circle';
            } else {
                statusText.textContent = 'Card Frozen';
                statusText.style.color = '#C5C8BA';
                statusIcon.style.color = '#A0CFCB';
                statusIcon.textContent = 'ac_unit';
            }
        });
    </script>
</body></html>
