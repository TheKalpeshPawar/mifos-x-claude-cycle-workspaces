<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X Card Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        pending: "#E8A317",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "surface-variant": "#E1E4D5",
                        "surface-container": "#F0F1E6",
                        "surface-container-high": "#EAECE1",
                        on_background: "#1A1C16",
                        on_surface: "#1A1C16",
                        "on-surface-variant": "#44483D",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "Public Sans", "sans-serif"],
                        display: ["Outfit", "Public Sans", "sans-serif"],
                        body: ["Outfit", "Public Sans", "sans-serif"],
                        label: ["Outfit", "Public Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #E3E3D8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-gradient {
            background: linear-gradient(135deg, #354E16 0%, #1E201A 100%);
        }
        .custom-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="fixed top-0 w-full max-w-[390px] h-16 bg-[#12140E] flex items-center px-4 z-50">
<button class="w-10 h-10 flex items-center justify-start text-[#B2D188] active:opacity-60 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-[18px] font-medium text-[#E3E3D8]">Card Details</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-[390px] pt-20 pb-24 px-4 space-y-6">
<!-- Virtual Card Section -->
<section class="flex flex-col items-center space-y-3">
<div class="w-full h-48 rounded-2xl card-gradient p-6 flex flex-col justify-between custom-shadow relative overflow-hidden">
<!-- Decorative grain/texture overlay -->
<div class="absolute inset-0 opacity-10 pointer-events-none mix-blend-soft-light bg-[radial-gradient(circle_at_center,_#ffffff_0%,_transparent_100%)]"></div>
<div class="flex justify-between items-center">
<span class="font-bold text-[14px] text-[#CDEDA3] tracking-tight">Mifos X</span>
<div class="flex items-center space-x-1">
<div class="w-8 h-5 rounded-sm bg-[#E3E3D8]/20 flex items-center justify-center">
<span class="text-[8px] font-bold text-[#E3E3D8]">VISA</span>
</div>
</div>
</div>
<div class="flex justify-center items-center py-2">
<span class="text-[20px] font-medium text-[#E3E3D8] tracking-[0.15em]">••••  ••••  ••••  4521</span>
</div>
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="text-[10px] text-[#C5C8BA] font-regular uppercase tracking-wider mb-0.5">Card Holder</span>
<span class="text-[13px] font-medium text-[#C5C8BA]">ALEX JOHNSON</span>
</div>
<div class="flex flex-col items-end">
<span class="text-[10px] text-[#C5C8BA] font-regular uppercase tracking-wider mb-0.5">Expires</span>
<span class="text-[13px] font-regular text-[#C5C8BA]">09/29</span>
</div>
</div>
</div>
<button class="text-[12px] font-medium text-[#B2D188] hover:underline active:opacity-70 transition-all">
                Show card details
            </button>
</section>
<!-- Card Status Toggle -->
<section class="bg-[#1E201A] rounded-[12px] p-4 flex justify-between items-center">
<span class="text-[15px] font-semibold text-[#E3E3D8]">Card Active</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" id="status-toggle" type="checkbox"/>
<div class="w-12 h-6 bg-[#354E16] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-[#B2D188] after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
</label>
</section>
<!-- Spending Limits -->
<section class="bg-[#1E201A] rounded-[12px] p-4 flex flex-col">
<h2 class="text-[15px] font-semibold text-[#E3E3D8] mb-4">Spending Limits</h2>
<!-- Row 1 -->
<div class="flex items-center justify-between py-1">
<div class="flex flex-col">
<span class="text-[14px] font-regular text-[#C5C8BA]">Daily limit</span>
<span class="text-[14px] font-semibold text-[#E3E3D8]">2500 GBP</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-[#B2D188] active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-size: 18px;">edit</span>
</button>
</div>
<div class="h-[1px] bg-[#44483D] my-3"></div>
<!-- Row 2 -->
<div class="flex items-center justify-between py-1">
<div class="flex flex-col">
<span class="text-[14px] font-regular text-[#C5C8BA]">Monthly limit</span>
<span class="text-[14px] font-semibold text-[#E3E3D8]">10000 GBP</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-[#B2D188] active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-size: 18px;">edit</span>
</button>
</div>
</section>
<!-- Action Buttons Cluster -->
<section class="flex flex-col space-y-3">
<!-- View Transactions -->
<button class="w-full h-12 rounded-[12px] bg-[#354E16] flex items-center justify-center space-x-2 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[#CDEDA3]" style="font-size: 20px;">list_alt</span>
<span class="text-[15px] font-medium text-[#CDEDA3]">View Transactions</span>
</button>
<!-- Freeze Card -->
<button class="w-full h-12 rounded-[12px] border border-[#44483D] flex items-center justify-center space-x-2 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[#A0CFCB]" style="font-size: 20px;">ac_unit</span>
<span class="text-[15px] font-medium text-[#E3E3D8]">Freeze Card</span>
</button>
<!-- Report Stolen -->
<button class="w-full h-12 rounded-[12px] border border-[#93000A] flex items-center justify-center space-x-2 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[#FFB4AB]" style="font-size: 20px;">warning</span>
<span class="text-[15px] font-medium text-[#FFB4AB]">Report Lost/Stolen</span>
</button>
</section>
</main>
<!-- Bottom Navigation Mockup (Refined Shell) -->
<nav class="fixed bottom-0 w-full max-w-[390px] h-20 bg-[#12140E] border-t border-[#44483D] flex justify-around items-center px-4 z-50">
<button class="flex flex-col items-center justify-center space-y-1 text-[#C5C8BA]">
<span class="material-symbols-outlined">home</span>
<span class="text-[11px]">Home</span>
</button>
<button class="flex flex-col items-center justify-center space-y-1 bg-[#384D14] text-[#CDEDA3] rounded-full px-5 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="text-[11px]">Accounts</span>
</button>
<button class="flex flex-col items-center justify-center space-y-1 text-[#C5C8BA]">
<span class="material-symbols-outlined">payments</span>
<span class="text-[11px]">Payments</span>
</button>
<button class="flex flex-col items-center justify-center space-y-1 text-[#C5C8BA]">
<span class="material-symbols-outlined">person</span>
<span class="text-[11px]">Profile</span>
</button>
</nav>
<script>
        // Micro-interaction for status toggle
        const toggle = document.getElementById('status-toggle');
        toggle.addEventListener('change', (e) => {
            const label = e.target.closest('section').querySelector('span');
            if(e.target.checked) {
                label.innerText = 'Card Active';
                label.style.color = '#E3E3D8';
            } else {
                label.innerText = 'Card Deactivated';
                label.style.color = '#75796C';
            }
        });

        // Add ripple-like effect on buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;
            });
        });
    </script>
</body></html>
