<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#B2D188",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#8F9285",
                        "primary-container": "#1F3701",
                        "outline": "#44483D"
                    },
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'safe-bottom': 'env(safe-area-inset-bottom)'
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #E3E3D8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased overflow-hidden flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 flex items-center h-16 px-4 bg-background z-10">
<div class="flex-shrink-0 active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-primary text-[24px]">arrow_back</span>
</div>
<div class="flex-1 flex justify-center pr-6">
<h1 class="text-[18px] font-medium text-on-surface leading-tight">Card Details</h1>
</div>
</header>
<!-- Main Content: Empty State Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-[390px] mx-auto overflow-y-auto pb-24">
<!-- Hero Illustration -->
<div class="mt-20 w-[120px] h-[120px] flex items-center justify-center rounded-[16px] bg-[#1A1C16] border border-outline relative overflow-hidden group">
<!-- Decorative abstract background pattern -->
<div class="absolute inset-0 opacity-10 bg-gradient-to-br from-primary to-transparent pointer-events-none"></div>
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined text-[#44483D] text-[64px]" style="font-variation-settings: 'wght' 200;">credit_card</span>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-background border border-outline rounded-full w-8 h-8 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-surface-variant text-[20px] font-bold">help</span>
</div>
</div>
</div>
<!-- Headline -->
<h2 class="mt-6 px-8 text-[22px] font-semibold text-on-surface text-center leading-tight">
            No Card Found
        </h2>
<!-- Subtitle -->
<p class="mt-2 px-12 text-[14px] font-normal text-on-surface-variant text-center leading-[20px]">
            This card is no longer available. Order a replacement or contact support.
        </p>
<!-- Primary Action -->
<div class="w-full px-6 mt-8">
<button class="w-full h-12 bg-primary hover:bg-opacity-90 active:scale-[0.98] transition-all rounded-[12px] flex items-center justify-center">
<span class="text-[16px] font-semibold text-[#1F3701]">Order New Card</span>
</button>
</div>
<!-- Secondary Action -->
<button class="mt-3 px-6 py-2 text-[14px] font-medium text-on-surface-variant hover:text-on-surface transition-colors active:scale-95">
            Contact Support
        </button>
</main>
<!-- BottomNavBar (Hidden but required for shell integrity) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-4 pb-safe bg-surface-container/60 backdrop-blur-md z-50">
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface cursor-pointer">
<span class="material-symbols-outlined">home</span>
<span class="text-[12px] font-medium mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface cursor-pointer">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="text-[12px] font-medium mt-1">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<span class="text-[12px] font-medium">Cards</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface cursor-pointer">
<span class="material-symbols-outlined">contact_support</span>
<span class="text-[12px] font-medium mt-1">Support</span>
</div>
</nav>
<script>
        // Simple micro-interaction for the illustration
        document.addEventListener('DOMContentLoaded', () => {
            const illustration = document.querySelector('main div:first-child');
            if(illustration) {
                illustration.addEventListener('mouseover', () => {
                    illustration.style.transform = 'translateY(-4px)';
                });
                illustration.addEventListener('mouseout', () => {
                    illustration.style.transform = 'translateY(0px)';
                });
                illustration.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            }
        });
    </script>
</body></html>
