<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Find Customer - Mifos X</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",

                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",

                        "surface-variant": "#E1E4D5",

                        "on-surface-variant": "#44483D",

                        "outline-variant": "#C5C8BA",
                        "custom-bg": "#12140E",
                        "custom-surface": "#1E201A",
                        "custom-accent": "#B2D188",
                        "custom-text": "#E3E3D8",
                        "custom-chip-bg": "#354E16",
                        "custom-shimmer": "#282A24"
                    },
                    spacing: {
                        'edge-margin': '16px',
                        'sm': '8px',
                        'md': '16px',
                        'lg': '24px'
                    },
                    fontFamily: {
                        body: ['Outfit', 'sans-serif'],
                        headline: ['Outfit', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        label: ['Outfit', 'sans-serif']
                    },
                    borderRadius: {
                        'md': '12px',
                        'lg': '16px',
                        'xl': '24px',
                        'full': '9999px'
                    }
                }
            }

    </script>
<style>
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #E3E3D8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .shimmer {
            background: linear-gradient(90deg, #1E201A 0%, #282A24 50%, #1E201A 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .spinner {
            border: 2px solid rgba(178, 209, 136, 0.1);
            border-top: 2px solid #B2D188;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .custom-cursor {
            width: 2px;
            height: 20px;
            background-color: #B2D188;
            display: inline-block;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased">
<!-- Top App Bar -->
<header class="w-full h-16 top-0 sticky z-50 flex items-center justify-between px-edge-margin bg-custom-bg">
<div class="flex items-center gap-4">
<button class="active:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-custom-text">menu</span>
</button>
<h1 class="text-[18px] font-medium text-custom-text leading-tight">Find Customer</h1>
</div>
<button class="active:opacity-80 transition-opacity">

<span class="material-symbols-outlined text-on-surface-variant mr-3">search</span>

<!-- Results Area (Skeleton) -->

<div class="h-3 w-3/4 rounded-sm shimmer"></div>
<div class="h-2 w-1/2 rounded-sm shimmer"></div>
<div class="h-2 w-2/3 rounded-sm shimmer opacity-60"></div>
</div>
</div>
<!-- Skeleton Card 2 -->
<div class="h-[72px] w-full bg-custom-surface rounded-md flex items-center px-4 gap-4">
<div class="w-10 h-10 rounded-full shimmer shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-2/3 rounded-sm shimmer"></div>
<div class="h-2 w-1/3 rounded-sm shimmer"></div>
<div class="h-2 w-1/2 rounded-sm shimmer opacity-60"></div>
</div>
</div>
<!-- Skeleton Card 3 -->
<div class="h-[72px] w-full bg-custom-surface rounded-md flex items-center px-4 gap-4">
<div class="w-10 h-10 rounded-full shimmer shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-4/5 rounded-sm shimmer"></div>
<div class="h-2 w-1/2 rounded-sm shimmer"></div>
<div class="h-2 w-3/4 rounded-sm shimmer opacity-60"></div>
</div>
</div>
</div>
<!-- Messaging / Context -->
<div class="py-4 text-center">
<p class="text-[14px] text-on-surface-variant max-w-[280px] mx-auto">
                Searching our secure banking database for matching records
            </p>
</div>
</main>
<!-- Footer Buttons -->
<div class="fixed bottom-20 w-full px-edge-margin space-y-3 pb-4">
<button class="w-full h-12 bg-custom-surface rounded-full opacity-40 flex items-center justify-center gap-2 text-[#8F9285] font-medium text-[14px]" disabled="">
<span class="material-symbols-outlined text-[18px]">person_add</span>
            Onboard New Customer
        </button>
<button class="w-full h-12 bg-custom-surface rounded-full opacity-40 flex items-center justify-center gap-2 text-[#8F9285] font-medium text-[14px]" disabled="">
<span class="material-symbols-outlined text-[18px]">domain</span>
            Onboard Business Customer
        </button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 bg-background px-sm">

<span class="text-[12px] font-medium mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-[12px] font-medium mt-1">Customers</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">payments</span>

</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">person</span>
<span class="text-[12px] font-medium mt-1">Profile</span>
</div>
</nav>
