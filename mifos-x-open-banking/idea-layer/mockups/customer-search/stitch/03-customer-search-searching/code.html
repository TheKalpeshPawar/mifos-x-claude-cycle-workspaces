<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X Open Banking - Customer Lookup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#B2D188",
                        "on-primary": "#1F3701",
                        "primary-container": "#354E16",
                        "on-primary-container": "#CDEDA3",
                        secondary: "#A0CFCB",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                        outline: "#8F9285",
                        "outline-variant": "#44483D",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#C5C8BA"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "12px",
                        lg: "16px",
                        xl: "24px",
                        full: "9999px"
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .shimmer {
            background: linear-gradient(
                90deg,
                #1E201A 0%,
                #282A24 50%,
                #1E201A 100%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .spinner {
            border: 2px solid rgba(178, 209, 136, 0.1);
            border-top: 2px solid #B2D188;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cursor-blink {
            width: 2px;
            height: 1.2rem;
            background-color: #B2D188;
            animation: blink 1s step-end infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 1px;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen max-w-[390px] mx-auto overflow-x-hidden shadow-2xl bg-background">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center h-16 px-4 bg-background border-b border-outline-variant/30">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface cursor-pointer">arrow_back</span>
<h1 class="text-[18px] font-medium text-on-surface leading-tight">Find Customer</h1>
</div>
<div class="ml-auto">
<span class="material-symbols-outlined text-on-surface">more_vert</span>
</div>
</header>
<main class="flex-1 px-4 pt-4 pb-20 space-y-6">
<!-- Search Field -->
<div class="relative flex items-center h-12 px-4 rounded-xl bg-surface-container border border-primary ring-1 ring-primary shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant mr-3">search</span>
<div class="flex-1 text-[14px] font-normal text-on-surface flex items-center">
                John<span class="cursor-blink"></span>
</div>
<div class="spinner"></div>
</div>
<!-- Filter Chips -->
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2">
<button class="flex items-center justify-center px-4 h-8 rounded-sm bg-primary-container text-on-primary-container text-[14px] font-medium border border-primary-container">
                All
            </button>
<button class="flex items-center justify-center px-4 h-8 rounded-sm border border-outline-variant text-on-surface-variant text-[14px] font-medium bg-transparent">
                Individual
            </button>
<button class="flex items-center justify-center px-4 h-8 rounded-sm border border-outline-variant text-on-surface-variant text-[14px] font-medium bg-transparent">
                Business
            </button>
<button class="flex items-center justify-center px-4 h-8 rounded-sm border border-outline-variant text-on-surface-variant text-[14px] font-medium bg-transparent">
                Group
            </button>
</div>
<!-- Loading Results (Skeleton Shimmers) -->
<div class="space-y-4">
<div class="flex items-center h-[72px] p-4 rounded-md bg-surface-container gap-4">
<div class="w-10 h-10 rounded-full shimmer"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-3/4 rounded-full shimmer"></div>
<div class="h-2 w-1/2 rounded-full shimmer"></div>
<div class="h-2 w-1/4 rounded-full shimmer"></div>
</div>
</div>
<div class="flex items-center h-[72px] p-4 rounded-md bg-surface-container gap-4">
<div class="w-10 h-10 rounded-full shimmer"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-2/3 rounded-full shimmer"></div>
<div class="h-2 w-1/3 rounded-full shimmer"></div>
<div class="h-2 w-1/2 rounded-full shimmer"></div>
</div>
</div>
<div class="flex items-center h-[72px] p-4 rounded-md bg-surface-container gap-4">
<div class="w-10 h-10 rounded-full shimmer"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-4/5 rounded-full shimmer"></div>
<div class="h-2 w-2/5 rounded-full shimmer"></div>
<div class="h-2 w-1/3 rounded-full shimmer"></div>
</div>
</div>
</div>
<!-- Action Buttons Section -->
<div class="pt-4 space-y-3">
<p class="text-[12px] font-medium text-on-surface-variant/60 uppercase tracking-wider mb-2">Customer not found?</p>
<button class="w-full h-12 flex items-center justify-center rounded-full bg-surface-container opacity-40 border border-outline-variant/30" disabled="">
<span class="text-[14px] font-medium text-outline">Onboard New Customer</span>
</button>
<button class="w-full h-12 flex items-center justify-center rounded-full bg-surface-container opacity-40 border border-outline-variant/30" disabled="">
<span class="text-[14px] font-medium text-outline">Onboard Business Customer</span>
</button>
</div>
</main>
<!-- Bottom Navigation Shell (Invisible padding to prevent content overlap) -->
<div class="h-16 w-full fixed bottom-0 bg-background border-t border-outline-variant/20 flex justify-around items-center px-4">
<div class="flex flex-col items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="text-[11px] mt-1">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">assignment</span>
<span class="text-[11px] mt-1">Applications</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-[11px] mt-1">Clients</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
<span class="text-[11px] mt-1">Settings</span>
</div>
</div>
<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle pulse on the search icon while "searching"
            const searchIcon = document.querySelector('.material-symbols-outlined.text-on-surface-variant');
            if (searchIcon) {
                setInterval(() => {
                    searchIcon.style.opacity = searchIcon.style.opacity === '0.5' ? '1' : '0.5';
                }, 1000);
            }
        });
    </script>
</body></html>
