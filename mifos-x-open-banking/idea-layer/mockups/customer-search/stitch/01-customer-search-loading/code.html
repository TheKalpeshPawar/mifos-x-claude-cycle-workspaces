<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "outline-variant": "#44483c",
                        "on-tertiary": "#432c00",

                        "surface-container-low": "#1a1c16",

                        "secondary": "#a0cfcb",
                        "on-tertiary-container": "#704c00",

                        "inverse-surface": "#e3e3d9",
                        "secondary-fixed": "#bcece7",
                        "on-secondary-fixed-variant": "#1f4e4b",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {

                        "md": "16px",
                        "gutter-mobile": "16px",
                        "base": "8px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Outfit"],
                        "body-md": ["Outfit"],
                        "label-lg": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],

                        "label-md": ["Outfit"],
                        "title-lg": ["Outfit"],
                        "label-sm": ["Outfit"],
                        "body-lg": ["Outfit"],

                    }
                }
            }
        }
    </script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-base {
            background: linear-gradient(90deg, #1E201A 25%, #282A24 50%, #1E201A 75%);
            background-size: 200% 100%;
            animation: shimmer 1200ms infinite linear;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md antialiased overflow-hidden">
<!-- Top App Bar Shell -->
<header class="flex items-center justify-between px-md w-full h-[64px] bg-background">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary">menu</span>
<!-- Title Shimmer: 100x20px -->
<div class="w-[100px] h-[20px] rounded-sm shimmer-base"></div>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
</header>
<main class="flex flex-col h-[calc(100vh-64px-80px)] px-margin-mobile">
<!-- Search Area Section -->
<section class="mt-[16px] flex flex-col gap-sm">
<!-- Search field shimmer: 48px tall, 24px radius, #282A24 background -->
<div class="w-full h-[48px] rounded-[24px] shimmer-base border border-outline-variant/10"></div>
<!-- Horizontal Chip Row: 4 chips, 56x32px, 8px gap -->
<div class="flex gap-sm overflow-hidden mt-sm">
<div class="flex-shrink-0 w-[56px] h-[32px] rounded-full shimmer-base"></div>
<div class="flex-shrink-0 w-[56px] h-[32px] rounded-full shimmer-base"></div>
<div class="flex-shrink-0 w-[56px] h-[32px] rounded-full shimmer-base"></div>
<div class="flex-shrink-0 w-[56px] h-[32px] rounded-full shimmer-base"></div>
</div>
</section>
<!-- Results List: 3 customer cards -->
<section class="mt-xl flex flex-col gap-[8px]">
<!-- Card 1 -->
<div class="w-full h-[72px] rounded-[12px] bg-surface-container border border-outline-variant/20 p-md flex items-center gap-md">
<!-- Circle Shimmer: 40px -->
<div class="w-[40px] h-[40px] rounded-full shimmer-base flex-shrink-0"></div>
<!-- Column Text Stack -->
<div class="flex flex-col gap-[4px] flex-grow">
<div class="w-[120px] h-[15px] rounded-sm shimmer-base"></div>
<div class="w-[80px] h-[12px] rounded-sm shimmer-base"></div>
<div class="w-[100px] h-[12px] rounded-sm shimmer-base"></div>
</div>
</div>
<!-- Card 2 -->
<div class="w-full h-[72px] rounded-[12px] bg-surface-container border border-outline-variant/20 p-md flex items-center gap-md">
<div class="w-[40px] h-[40px] rounded-full shimmer-base flex-shrink-0"></div>
<div class="flex flex-col gap-[4px] flex-grow">
<div class="w-[120px] h-[15px] rounded-sm shimmer-base"></div>
<div class="w-[80px] h-[12px] rounded-sm shimmer-base"></div>
<div class="w-[100px] h-[12px] rounded-sm shimmer-base"></div>
</div>
</div>
<!-- Card 3 -->
<div class="w-full h-[72px] rounded-[12px] bg-surface-container border border-outline-variant/20 p-md flex items-center gap-md">
<div class="w-[40px] h-[40px] rounded-full shimmer-base flex-shrink-0"></div>
<div class="flex flex-col gap-[4px] flex-grow">
<div class="w-[120px] h-[15px] rounded-sm shimmer-base"></div>
<div class="w-[80px] h-[12px] rounded-sm shimmer-base"></div>
<div class="w-[100px] h-[12px] rounded-sm shimmer-base"></div>
</div>
</div>
</section>
<!-- Bottom Actions (Floating at bottom of container before nav) -->
<section class="mt-auto mb-lg flex flex-col gap-[8px]">
<!-- Button Shimmer 1: 48px tall, 12px radius -->
<div class="w-full h-[48px] rounded-[12px] shimmer-base border border-outline-variant/30"></div>
<!-- Button Shimmer 2 -->
<div class="w-full h-[48px] rounded-[12px] shimmer-base border border-outline-variant/30"></div>
</section>
</main>
<!-- Bottom Navigation Shell (Fixed) -->
<nav class="fixed bottom-0 w-full z-50 h-[80px] bg-surface-container flex justify-around items-center px-lg pb-safe">
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md mt-1">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center bg-on-primary-fixed-variant text-on-primary-fixed rounded-full px-5 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md mt-1">Customers</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-label-md text-label-md mt-1">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md mt-1">Settings</span>
</div>
</nav>
<script>
        // Simple logic to ensure the dark theme is correctly applied
        document.documentElement.classList.add('dark');
        
        // Potential micro-interaction: Subtle fade in for the skeleton
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 500ms ease-in-out';
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body></html>
