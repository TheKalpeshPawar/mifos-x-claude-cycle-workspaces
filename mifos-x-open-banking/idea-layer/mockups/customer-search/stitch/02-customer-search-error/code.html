<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- Top App Bar -->
<header class="w-full h-[64px] bg-surface flex items-center px-4 sticky top-0 z-50">
<span class="material-symbols-outlined text-on-surface mr-4 cursor-pointer" data-icon="arrow_back">arrow_back</span>
<h1 class="font-headline-md text-title-lg text-on-surface tracking-tight">Find Customer</h1>
<div class="ml-auto">
<span class="material-symbols-outlined text-on-surface" data-icon="more_vert">more_vert</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center">
<!-- Search Field -->
<div class="w-full px-4 mt-4">
<div class="relative w-full h-[48px] bg-surface-container rounded-full border border-error-container flex items-center px-4 group transition-all duration-300">
<span class="material-symbols-outlined text-outline mr-3" data-icon="person_search">person_search</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md text-on-surface placeholder-outline" placeholder="Find customers" type="text"/>
</div>
</div>
<!-- Hero Illustration -->
<div class="mt-[64px] flex justify-center">
<div class="w-[140px] h-[140px] relative">
<img alt="Connection error illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ug-H35I5gwnUexdZXTm_4QWn2UKmbSGxOqlDmun40Nhzzdv-G45wiJZvPl9KU7uDKT-0sTRnnuSjKWTfPG3LwhJouMHlGfF0vMEtBO3F6kS3HJyG6sSQOWQ96nWbKSFCDNZ0VxsG78F3q2_6dIed0JBvkwuEtzhIlMpcC9d5L3lJNCNDCHVOzValaeBZ-5eOtg5NA1UrFqXt7dFOQboVDSZufSuY7BrgLsYo7aqoRY_YosymrUSMo9Jp1OG"/>
</div>
</div>
<!-- Headline -->
<div class="mt-6 px-8 text-center">
<h2 class="font-headline-lg-mobile text-[20px] text-on-surface font-semibold leading-tight">
                Lookup unavailable
            </h2>
</div>
<!-- Subtitle -->
<div class="mt-2 px-12 text-center max-w-[400px]">
<p class="font-body-md text-outline text-[14px] leading-relaxed">
                Unable to retrieve customer records. Check your connection and try again.
            </p>
</div>
<!-- Retry Button -->
<div class="mt-8 px-8 w-full max-w-[400px]">
<button class="w-full h-[48px] bg-primary rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform duration-200">
<span class="material-symbols-outlined text-on-primary text-[18px]" data-icon="refresh">refresh</span>
<span class="font-label-lg text-on-primary font-semibold">Retry</span>
</button>
</div>
</main>
<!-- Bottom Navigation Shell (Suppressed based on Transactional/Error context, but logic check performed) -->
<!-- As this is an error state within a focused search journey, the BottomNavBar is suppressed to maintain task focus -->
<script>
        // Micro-interaction for the retry button
        const retryBtn = document.querySelector('button');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 1000);
        });

        // Search bar focus effect
        const searchInput = document.querySelector('input');
        const searchContainer = searchInput.parentElement;
        searchInput.addEventListener('focus', () => {
            searchContainer.classList.add('bg-surface-container-high');
        });
        searchInput.addEventListener('blur', () => {
            searchContainer.classList.remove('bg-surface-container-high');
        });
    </script>
</body></html>
