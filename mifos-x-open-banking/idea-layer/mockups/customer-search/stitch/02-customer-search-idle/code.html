<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #12140e;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "secondary-fixed-dim": "#a0cfcb",
                  "surface": "#12140e",
                  "secondary-fixed": "#bcece7",
                  "tertiary": "#ffdeae",
                  "surface-container-lowest": "#0d0f09",
                  "on-secondary-fixed-variant": "#1f4e4b",
                  "inverse-surface": "#e3e3d8",
                  "inverse-primary": "#4c662a",
                  "on-tertiary": "#432c00",
                  "on-primary": "#203700",
                  "on-secondary-container": "#8fbeba",
                  "tertiary-fixed": "#ffdeae",
                  "on-secondary-fixed": "#00201e",
                  "primary-container": "#b2d188",
                  "on-primary-fixed": "#102000",
                  "error-container": "#93000a",
                  "surface-variant": "#34362e",
                  "on-tertiary-fixed-variant": "#604100",
                  "outline-variant": "#44483c",
                  "surface-tint": "#b2d188",
                  "tertiary-fixed-dim": "#ffba3e",
                  "outline": "#8e9284",
                  "inverse-on-surface": "#2f312a",
                  "on-surface": "#e3e3d8",
                  "primary-fixed": "#cdeda1",
                  "on-secondary": "#013735",
                  "surface-dim": "#12140e",
                  "on-error": "#690005",
                  "surface-container": "#1f201a",
                  "on-error-container": "#ffdad6",
                  "surface-container-highest": "#34362e",
                  "on-tertiary-container": "#704c00",
                  "secondary-container": "#1f4e4b",
                  "surface-container-high": "#292b24",
                  "surface-bright": "#383a32",
                  "on-surface-variant": "#c4c8b9",
                  "secondary": "#a0cfcb",
                  "on-background": "#e3e3d8",
                  "background": "#12140e",
                  "on-primary-container": "#415a1f",
                  "on-primary-fixed-variant": "#354e14",
                  "primary-fixed-dim": "#b2d188",
                  "tertiary-container": "#ffba3f",
                  "error": "#ffb4ab",
                  "surface-container-low": "#1b1c16",
                  "on-tertiary-fixed": "#281900",
                  "primary": "#ceeda2"
          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "full": "9999px"
          },
          "spacing": {
                  "stack-sm": "8px",
                  "margin-tablet": "24px",
                  "margin-mobile": "16px",
                  "stack-md": "16px",
                  "safe-area": "32px",
                  "gutter": "16px",
                  "stack-lg": "24px"
          },
          "fontFamily": {
                  "headline-lg": ["Outfit"],
                  "headline-lg-mobile": ["Outfit"],
                  "body-md": ["Outfit"],
                  "title-lg": ["Outfit"],
                  "label-md": ["Outfit"],
                  "body-lg": ["Outfit"],
                  "label-lg": ["Outfit"],
                  "title-md": ["Outfit"],
                  "headline-md": ["Outfit"]
          },
          "fontSize": {
                  "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                  "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                  "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                  "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                  "label-md": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                  "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                  "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                  "title-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                  "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-background min-h-screen text-on-background flex flex-col items-center">
<header class="w-full top-0 sticky bg-background z-50 flex items-center justify-between px-margin-mobile py-stack-md h-[64px]">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-100 p-2 hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface">Find Customer</h1>
</div>
<button class="active:scale-95 duration-100 p-2 hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="w-full max-w-md px-margin-mobile flex flex-col flex-1 pb-24">
<div class="mt-4 relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="search">search</span>
</div>
<input class="w-full h-[48px] bg-surface-container-low border-none rounded-full pl-12 pr-4 text-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-high transition-all" placeholder="Find customers" type="text"/>
</div>
<div class="mt-stack-md flex gap-2 overflow-x-auto custom-scrollbar whitespace-nowrap py-1">
<button class="flex items-center justify-center bg-on-primary-fixed-variant text-primary rounded-full px-5 py-2 font-label-lg transition-all active:scale-95">
        All
      </button>
<button class="flex items-center justify-center border border-outline-variant text-on-surface-variant rounded-full px-5 py-2 font-label-lg transition-all hover:bg-surface-container active:scale-95">
        Individual
      </button>
<button class="flex items-center justify-center border border-outline-variant text-on-surface-variant rounded-full px-5 py-2 font-label-lg transition-all hover:bg-surface-container active:scale-95">
        Business
      </button>
<button class="flex items-center justify-center border border-outline-variant text-on-surface-variant rounded-full px-5 py-2 font-label-lg transition-all hover:bg-surface-container active:scale-95">
        Group
      </button>
</div>
<button class="mt-stack-md flex items-center justify-center w-full border border-primary-container text-primary-fixed-dim rounded-xl h-[48px] font-title-md gap-2 active:scale-[0.98] transition-all hover:bg-primary-container hover:bg-opacity-5">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
      Scan Customer ID
    </button>
<div class="flex flex-col items-center mt-12 mb-10">
<div class="w-[120px] h-[120px] rounded-full flex items-center justify-center relative">
<div class="absolute inset-0 bg-primary-container opacity-5 rounded-full scale-125 blur-xl"></div>
<img alt="Find Customer Illustration" class="w-full h-full object-contain filter grayscale invert brightness-50 contrast-125 mix-blend-screen" src="https://lh3.googleusercontent.com/aida/ADBb0uhHDvppp2T_KxWzfpxJqjY2I14qSC4-qGjZhq5FdBe4xoD2zI5biKxmbItbkZ2e_DdWF0q7jZGW44FnzTjVIpwFnCRPjyx4PUB-EXOp0XIGWJuMEUi3VG8axm1f9KRAN2elyhq3cZ-dwYCKN2hl8TZ49ZQCDUO1eJx234rmMB_D0uqwaEVPvTolywwaL94guEm4f-HNXlzDKAeG2fhBhly6E6MUL3ywWaEupYcV7ETL4GKT_2dO4s-FbyY"/>
</div>
<p class="mt-6 font-body-md text-body-md text-outline text-center">
        Find by name, ID number, or phone
      </p>
</div>
<div class="flex flex-col gap-stack-sm w-full">
<button class="w-full bg-primary-container text-on-primary-container h-[56px] rounded-xl font-title-md active:scale-[0.98] transition-all flex items-center justify-center shadow-lg shadow-primary/5">
        Onboard New Customer
      </button>
<button class="w-full border border-outline-variant text-on-surface h-[56px] rounded-xl font-title-md active:scale-[0.98] transition-all flex items-center justify-center hover:bg-surface-container">
        Onboard Business Customer
      </button>
</div>
</main>
<nav class="fixed bottom-0 w-full z-50 bg-surface-container flex justify-around items-center px-4 py-2 h-[80px]">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="home">home</span>
<span class="font-label-lg text-label-lg mt-1">Home</span>
</button>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1 active:scale-90 duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-lg text-label-lg mt-1">Customers</span>
</div>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="swap_horiz">swap_horiz</span>
<span class="font-label-lg text-label-lg mt-1">Transactions</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="settings">settings</span>
<span class="font-label-lg text-label-lg mt-1">Settings</span>
</button>
</nav>
<script>
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function(e) {
        let ripple = document.createElement('div');
        ripple.classList.add('ripple');
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>
</body></html>
