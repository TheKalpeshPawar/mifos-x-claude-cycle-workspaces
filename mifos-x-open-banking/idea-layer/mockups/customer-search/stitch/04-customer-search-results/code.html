<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X - Customer Lookup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140F;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #12140F;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #343530;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-on-surface": "#2f312b",
                      "surface-bright": "#383a34",
                      "on-background": "#e3e3da",
                      "on-tertiary-fixed": "#35072e",
                      "primary-fixed-dim": "#b2d188",
                      "on-surface-variant": "#c4c8b9",
                      "tertiary-fixed-dim": "#f6b2e1",
                      "inverse-primary": "#4c662a",
                      "surface-container": "#1f201b",
                      "tertiary": "#ffd8f0",
                      "tertiary-container": "#f6b2e1",
                      "surface-variant": "#343530",
                      "secondary": "#a0cfcb",
                      "error-container": "#93000a",
                      "background": "#12140f",
                      "on-tertiary": "#4e1e44",
                      "on-primary-container": "#415a1f",
                      "outline": "#8e9284",
                      "surface-container-high": "#292b25",
                      "on-primary": "#203700",
                      "on-primary-fixed": "#102000",
                      "primary": "#ceeda2",
                      "on-secondary-container": "#8fbeba",
                      "surface-container-lowest": "#0d0f0a",
                      "primary-fixed": "#cdeda1",
                      "on-error-container": "#ffdad6",
                      "surface-container-highest": "#343530",
                      "on-secondary-fixed": "#00201e",
                      "outline-variant": "#44483c",
                      "on-error": "#690005",
                      "surface-dim": "#12140f",
                      "inverse-surface": "#e3e3da",
                      "tertiary-fixed": "#ffd7f0",
                      "surface-tint": "#b2d188",
                      "secondary-container": "#1f4e4b",
                      "on-secondary": "#013735",
                      "on-tertiary-container": "#764069",
                      "surface": "#12140f",
                      "secondary-fixed-dim": "#a0cfcb",
                      "error": "#ffb4ab",
                      "on-primary-fixed-variant": "#354e14",
                      "secondary-fixed": "#bcece7",
                      "surface-container-low": "#1a1c17",
                      "on-tertiary-fixed-variant": "#68355c",
                      "primary-container": "#b2d188",
                      "on-surface": "#e3e3da",
                      "on-secondary-fixed-variant": "#1f4e4b"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "8px",
                      "xs": "4px",
                      "margin-mobile": "16px",
                      "xl": "32px",
                      "md": "16px",
                      "gutter-mobile": "12px",
                      "lg": "24px",
                      "base": "4px"
              },
              "fontFamily": {
                      "display-lg": ["Outfit"],
                      "body-lg": ["Outfit"],
                      "headline-md": ["Outfit"],
                      "title-md": ["Outfit"],
                      "label-sm": ["Outfit"],
                      "title-lg": ["Outfit"],
                      "label-lg": ["Outfit"],
                      "body-md": ["Outfit"],
                      "headline-lg": ["Outfit"]
              },
              "fontSize": {
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "title-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "label-sm": ["10px", {"lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                      "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
              }
            },
          },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface custom-scrollbar selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center justify-between px-margin-mobile h-14">
<div class="flex items-center gap-4">
<button class="transition-colors duration-200 hover:bg-surface-variant p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface">Find Customer</h1>
</div>
<button class="transition-colors duration-200 hover:bg-surface-variant p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="px-margin-mobile pb-24 max-w-2xl mx-auto">
<!-- Search Field -->
<section class="mt-4">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
</div>
<input class="h-12 w-full bg-surface-container border-none rounded-full pl-12 pr-12 font-body-md text-body-md text-on-surface focus:ring-1 focus:ring-primary transition-all duration-300" placeholder="Search by name or ID..." type="text" value="John"/>
<div class="absolute inset-y-0 right-4 flex items-center">
<button class="flex items-center justify-center text-outline transition-colors hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="cancel">cancel</span>
</button>
</div>
</div>
</section>
<!-- Filter Chips -->
<section class="mt-6 flex gap-2 overflow-x-auto no-scrollbar pb-2">
<button class="h-8 px-4 rounded-full flex items-center justify-center bg-on-primary-fixed-variant text-primary-fixed whitespace-nowrap font-label-lg text-label-lg transition-all active:scale-95">
                All
            </button>
<button class="h-8 px-4 rounded-full border border-outline-variant text-on-surface-variant flex items-center justify-center whitespace-nowrap font-label-lg text-label-lg transition-all hover:bg-surface-container-high active:scale-95">
                Active
            </button>
<button class="h-8 px-4 rounded-full border border-outline-variant text-on-surface-variant flex items-center justify-center whitespace-nowrap font-label-lg text-label-lg transition-all hover:bg-surface-container-high active:scale-95">
                Prospect
            </button>
<button class="h-8 px-4 rounded-full border border-outline-variant text-on-surface-variant flex items-center justify-center whitespace-nowrap font-label-lg text-label-lg transition-all hover:bg-surface-container-high active:scale-95">
                Dormant
            </button>
</section>
<!-- Results List Header -->
<div class="mt-8 mb-4">
<p class="font-label-lg text-label-lg text-outline">3 results</p>
</div>
<!-- Cards List -->
<div class="space-y-4">
<!-- Card 1 -->
<div class="p-4 bg-surface-container rounded-xl flex items-start gap-4 transition-transform active:scale-[0.98] cursor-pointer hover:bg-surface-container-high">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-on-primary-fixed-variant text-primary-fixed font-title-md text-title-md shrink-0">
                    JM
                </div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between gap-2 mb-1">
<h3 class="font-title-md text-title-md text-on-surface truncate">John Mwangi</h3>
<span class="px-2 py-0.5 rounded-full bg-on-primary-fixed-variant text-primary-fixed font-label-sm text-label-sm whitespace-nowrap">KYC Verified</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">Checking Account • KES 45,200</p>
<p class="font-label-sm text-label-sm text-outline">3 days ago</p>
</div>
</div>
<!-- Card 2 -->
<div class="p-4 bg-surface-container rounded-xl flex items-start gap-4 transition-transform active:scale-[0.98] cursor-pointer hover:bg-surface-container-high">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-secondary-container text-secondary-fixed font-title-md text-title-md shrink-0">
                    SO
                </div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between gap-2 mb-1">
<h3 class="font-title-md text-title-md text-on-surface truncate">Sarah Odhiambo</h3>
<span class="px-2 py-0.5 rounded-full bg-surface-container-lowest text-[#E8A317] font-label-sm text-label-sm whitespace-nowrap">KYC Pending</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Application in Review</p>
</div>
</div>
<!-- Card 3 -->
<div class="p-4 bg-surface-container rounded-xl flex items-start gap-4 transition-transform active:scale-[0.98] cursor-pointer hover:bg-surface-container-high">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-surface-container-high text-on-surface font-title-md text-title-md shrink-0">
                    PK
                </div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between gap-2 mb-1">
<h3 class="font-title-md text-title-md text-on-surface truncate">Peter Kamau</h3>
<span class="px-2 py-0.5 rounded-full border border-outline-variant text-on-surface-variant font-label-sm text-label-sm whitespace-nowrap">New Prospect</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">No account yet</p>
</div>
</div>
</div>
<!-- Action Buttons Section -->
<section class="mt-10 space-y-3">
<button class="w-full h-12 bg-primary-fixed text-on-primary font-title-md text-title-md rounded-full flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-primary/5">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
                Onboard New Customer
            </button>
<button class="w-full h-12 border border-outline-variant text-on-surface font-title-md text-title-md rounded-full flex items-center justify-center gap-2 transition-all active:scale-95 hover:bg-surface-container">
<span class="material-symbols-outlined" data-icon="business">business</span>
                Onboard Business Customer
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container h-20 flex justify-around items-center px-xs">
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-lg text-label-lg">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-lg text-label-lg">Customers</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="swap_horiz">swap_horiz</span>
<span class="font-label-lg text-label-lg">Transactions</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-lg text-label-lg">Profile</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple haptic-like effect for cards
        document.querySelectorAll('.bg-surface-container').forEach(card => {
            card.addEventListener('mousedown', () => {
                card.style.opacity = '0.8';
            });
            card.addEventListener('mouseup', () => {
                card.style.opacity = '1';
            });
        });
    </script>
</body></html>
