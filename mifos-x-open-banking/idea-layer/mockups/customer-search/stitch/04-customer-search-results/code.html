<style>
        body {
            background-color: #12140F;
            color: #E3E3DA;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scroll::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile h-14">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<h1 class="font-headline-sm text-[18px] font-medium text-on-surface">Find Customer</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-highest">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a financial advisor in a sleek modern office. The lighting is soft and focused, creating a sense of trust and approachability. The background consists of blurred glass partitions and soft warm indoor lighting, maintaining a premium fintech aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCh3Z30RjuSg2or1QvhsglNXE9d_lBxwU-lTXJOGHQyPhnaR_s4uxrN-lXhUb-Pl-VC8x_-2EDfBKR9RNSAsiuhUIHulXn93jPC_AZNnTkhXvTQOGkjhF7ZUWj1uUBKKbe1ivFsVzRMGyD6Uimp6sniNyOv3Jnz5GiJ_oJ8HeALW4ZkYxR7J5f-e2t8VcNAIRDi-nGBCNUwOqgbmdPkdXDheXBTmfte3500WGdlQDpqbLyD4iYAFFIYHcBiEadXzub2u4PcviFidZyN"/>
</div>
</header>
<main class="flex-grow flex flex-col pb-24">
<!-- Search Field -->
<div class="px-margin-mobile pt-4">
<div class="relative flex items-center h-12 bg-surface-container rounded-full px-4 border border-transparent focus-within:border-primary-container transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="search">search</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-body-md text-[14px] placeholder-on-surface-variant" placeholder="Search customers..." type="text" value="John"/>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Chip Row -->
<div class="px-margin-mobile pt-6 overflow-x-auto custom-scroll flex gap-2">
<button class="px-4 py-1.5 rounded-lg bg-[#354E16] text-[#CDEDA3] font-label-lg text-[12px] whitespace-nowrap">All</button>
<button class="px-4 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-[12px] whitespace-nowrap">Active</button>
<button class="px-4 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-[12px] whitespace-nowrap">Prospect</button>
<button class="px-4 py-1.5 rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-[12px] whitespace-nowrap">Dormant</button>
</div>
<!-- Results Header -->
<div class="px-margin-mobile pt-6 pb-2">
<p class="font-label-sm text-[13px] text-outline">3 results</p>
</div>
<!-- Customer List -->
<div class="px-margin-mobile flex flex-col gap-sm">
<!-- Card 1 -->
<div class="bg-surface-container p-4 rounded-xl flex items-start gap-4 active:scale-[0.98] transition-transform">
<div class="w-10 h-10 flex-shrink-0 rounded-full bg-[#354E16] flex items-center justify-center">
<span class="text-[#CDEDA3] font-title-sm">JM</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-[15px] font-semibold text-on-surface">John Mwangi</h3>
<span class="bg-[#354E16] text-[#CDEDA3] px-2 py-0.5 rounded text-[10px] font-label-lg uppercase">KYC Verified</span>
</div>
<p class="font-body-md text-[13px] text-on-surface-variant mt-1">Checking Account KES 45,200</p>
<p class="font-label-sm text-[11px] text-outline mt-2">3 days ago</p>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-container p-4 rounded-xl flex items-start gap-4 active:scale-[0.98] transition-transform">
<div class="w-10 h-10 flex-shrink-0 rounded-full bg-[#1F4E4B] flex items-center justify-center">
<span class="text-[#BCEBE7] font-title-sm">SO</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-[15px] font-semibold text-on-surface">Sarah Odhiambo</h3>
<span class="bg-surface-container-low text-[#E8A317] px-2 py-0.5 rounded text-[10px] font-label-lg uppercase border border-[#E8A317]/20">KYC Pending</span>
</div>
<p class="font-body-md text-[13px] text-on-surface-variant mt-1">Application in Review</p>
</div>
</div>
<!-- Card 3 -->
<div class="bg-surface-container p-4 rounded-xl flex items-start gap-4 active:scale-[0.98] transition-transform">
<div class="w-10 h-10 flex-shrink-0 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="text-on-surface-variant font-title-sm">PK</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-[15px] font-semibold text-on-surface">Peter Kamau</h3>
<span class="border border-outline-variant text-on-surface-variant px-2 py-0.5 rounded text-[10px] font-label-lg uppercase">New Prospect</span>
</div>
<p class="font-body-md text-[13px] text-on-surface-variant mt-1">No account yet</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="px-margin-mobile pt-8 flex flex-col gap-3">
<button class="h-12 w-full bg-primary-container text-[#1F3701] rounded-xl font-title-sm text-[14px] font-semibold flex items-center justify-center gap-2 active:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-[20px]" data-icon="person_add">person_add</span>
                Onboard New Customer
            </button>
<button class="h-12 w-full border border-outline-variant text-on-surface rounded-xl font-title-sm text-[14px] font-medium flex items-center justify-center gap-2 active:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="domain">domain</span>
                Onboard Business Customer
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container rounded-t-xl">
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-sm text-label-sm">Customers</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
<span class="font-label-sm text-label-sm mt-1">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-label-sm text-label-sm mt-1">More</span>
</div>
</nav>
<script>
        // Simple haptic-like interaction for cards
        document.querySelectorAll('.bg-surface-container').forEach(card => {
            card.addEventListener('touchstart', () => card.classList.add('scale-[0.98]'));
            card.addEventListener('touchend', () => card.classList.remove('scale-[0.98]'));
        });
    </script>
</body></html>
