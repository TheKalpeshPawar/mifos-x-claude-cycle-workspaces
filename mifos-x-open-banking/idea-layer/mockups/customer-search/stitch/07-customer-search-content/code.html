<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Find Customer - Mifos X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CDEDA3",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        "on-secondary-container": "#00201E",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1E201A",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#75796C",
                        "outline-variant": "#44483D",
                        "nav-active-indicator": "#DCE7C8",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                        "custom-green-dark": "#354E16",
                        "custom-green-light": "#B2D188",
                        "custom-text-dim": "#8F9285"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"],
                    },
                    borderRadius: {
                        'small': '4px',
                        'medium': '12px',
                        'large': '16px',
                        'pill': '9999px',
                        'xl': '24px'
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 h-[64px] bg-[#12140E] flex items-center px-4">
<h1 class="text-[18px] font-medium text-[#E3E3D8]">Find Customer</h1>
</header>
<main class="px-4 space-y-6">
<!-- Search Field -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#8F9285] text-[20px]">search</span>
<input class="w-full h-12 pl-12 pr-4 bg-[#1E201A] border-none rounded-xl text-sm text-on-surface placeholder-[#8F9285] focus:ring-2 focus:ring-[#B2D188] transition-all outline-none" placeholder="Find customers" type="text"/>
</div>
<!-- Filter Chips -->
<div class="flex gap-2 overflow-x-auto hide-scrollbar -mx-4 px-4">
<button class="shrink-0 h-8 px-4 rounded-large bg-[#354E16] text-[#CDEDA3] text-sm font-medium">All</button>
<button class="shrink-0 h-8 px-4 rounded-large border border-[#44483D] text-[#C5C8BA] text-sm font-medium">Active</button>
<button class="shrink-0 h-8 px-4 rounded-large border border-[#44483D] text-[#C5C8BA] text-sm font-medium">Prospect</button>
<button class="shrink-0 h-8 px-4 rounded-large border border-[#44483D] text-[#C5C8BA] text-sm font-medium">Dormant</button>
</div>
<!-- Scan Button -->
<button class="flex items-center justify-center w-full h-10 gap-2 border border-[#44483D] rounded-xl text-[#B2D188] font-medium text-sm">
<span class="material-symbols-outlined text-[18px]">qr_code_scanner</span>
<span>Scan Customer ID</span>
</button>
<!-- Customer List -->
<div class="flex flex-col gap-3">
<!-- Card 1 -->
<div class="p-4 bg-[#1E201A] rounded-medium flex items-start gap-4 border border-transparent hover:border-[#44483D] transition-colors">
<div class="w-10 h-10 rounded-full bg-[#354E16] flex items-center justify-center text-[#CDEDA3] font-semibold text-sm">JM</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between mb-1">
<h3 class="text-[#E3E3D8] font-medium truncate">John Mwangi</h3>
<span class="text-[11px] text-[#8F9285]">3 days ago</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded-sm bg-[#354E16] text-[#CDEDA3] text-[10px] font-medium mb-2 uppercase">KYC Verified</div>
<p class="text-[#C5C8BA] text-sm truncate">Checking Account - KES 45,200</p>
</div>
</div>
<!-- Card 2 -->
<div class="p-4 bg-[#1E201A] rounded-medium flex items-start gap-4 border border-transparent hover:border-[#44483D] transition-colors">
<div class="w-10 h-10 rounded-full bg-[#1F4E4B] flex items-center justify-center text-[#BCEBE7] font-semibold text-sm">SO</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between mb-1">
<h3 class="text-[#E3E3D8] font-medium truncate">Sarah Odhiambo</h3>
<span class="text-[11px] text-[#8F9285]">7 days ago</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded-sm bg-[#E8A317] text-white text-[10px] font-medium mb-2 uppercase">KYC Pending</div>
<p class="text-[#C5C8BA] text-sm truncate">Application in Review</p>
</div>
</div>
<!-- Card 3 -->
<div class="p-4 bg-[#1E201A] rounded-medium flex items-start gap-4 border border-transparent hover:border-[#44483D] transition-colors">
<div class="w-10 h-10 rounded-full bg-[#282A24] flex items-center justify-center text-[#C5C8BA] font-semibold text-sm">PK</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between mb-1">
<h3 class="text-[#E3E3D8] font-medium truncate">Peter Kamau</h3>
<span class="text-[11px] text-[#8F9285]">Recently</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded-sm border border-[#44483D] text-[#C5C8BA] text-[10px] font-medium mb-2 uppercase">New Prospect</div>
<p class="text-[#C5C8BA] text-sm truncate">No account yet</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-4 flex flex-col gap-2">
<button class="w-full h-12 bg-[#B2D188] text-[#1F3701] rounded-medium font-semibold text-sm active:scale-[0.98] transition-transform">
                Onboard New Customer
            </button>
<button class="w-full h-12 border border-[#44483D] text-[#E3E3D8] rounded-medium font-medium text-sm active:scale-[0.98] transition-transform">
                Onboard Business Customer
            </button>
</div>
</main>
<!-- Bottom Navigation (Shared Component from JSON) -->
<nav class="fixed bottom-0 w-full z-50 h-20 bg-background border-t border-outline-variant flex justify-around items-center px-2 pb-safe">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform duration-150 active:scale-95">
<span class="material-symbols-outlined">home</span>
<span class="text-[12px] font-medium mt-1">Home</span>
</button>
<!-- Accounts (Active intent for Search/Lookup) -->
<button class="flex flex-col items-center justify-center bg-nav-active-indicator text-on-surface rounded-full px-5 py-1 transition-transform duration-150 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="text-[12px] font-medium mt-1">Accounts</span>
</button>
<!-- Payments -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform duration-150 active:scale-95">
<span class="material-symbols-outlined">payments</span>
<span class="text-[12px] font-medium mt-1">Payments</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform duration-150 active:scale-95">
<span class="material-symbols-outlined">person</span>
<span class="text-[12px] font-medium mt-1">Profile</span>
</button>
</nav>
<script>
        // Micro-interactions for chips
        document.querySelectorAll('button.shrink-0').forEach(chip => {
            chip.addEventListener('click', function() {
                // Reset others
                document.querySelectorAll('button.shrink-0').forEach(c => {
                    c.classList.remove('bg-[#354E16]', 'text-[#CDEDA3]');
                    c.classList.add('border', 'border-[#44483D]', 'text-[#C5C8BA]');
                });
                // Set active
                this.classList.remove('border', 'border-[#44483D]', 'text-[#C5C8BA]');
                this.classList.add('bg-[#354E16]', 'text-[#CDEDA3]');
            });
        });
    </script>
</body></html>
