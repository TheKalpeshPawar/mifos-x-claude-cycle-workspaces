<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X - Find Customer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#FFFFFF",
                        "surface-variant": "#E1E4D5",
                        "surface-container": "#F0F1E6",
                        "surface-container-high": "#EAECE1",
                        "on-surface-variant": "#44483D",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        custom: {
                            dark_bg: "#12140E",
                            input_bg: "#1E201A",
                            text_main: "#E3E3D8",
                            text_secondary: "#8F9285",
                            chip_active: "#354E16",
                            chip_outline: "#44483D",
                            btn_bg: "#B2D188",
                            btn_text: "#1F3701"
                        }
                    },
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'margin-desktop': '24px',
                        'sm': '8px',
                        'md': '16px',
                        'lg': '24px'
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center overflow-hidden">
<!-- Top App Bar -->
<header class="w-full h-[64px] flex items-center justify-between px-4 bg-transparent z-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined cursor-pointer text-custom-text-main">arrow_back</span>
<h1 class="text-[18px] font-medium text-custom-text-main">Find Customer</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-custom-chip-outline">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a financial services field officer in a clean, modern studio setting. The lighting is soft and natural, emphasizing a trustworthy and friendly expression. The background is a soft, muted earth tone that aligns with a professional banking environment. High resolution, minimalist composition with sharp focus on the facial features." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4xidFJgtJfoSTgMP85_PoNTVpoP872mAQIVAritRf8m2N7VQ3X7V7KjehPXaGZ04ANU7fWf-kJHzYZ1e-EBoFVhyQgwd0ESDrWu6yAgrJWe4sPEIfpGaonqC6j-SejYlLBE4dWMUTxCVF-4w7aXsV3n2apjJX_QeJ9VUt43WswsvwQrEZnWV7Doi41wIF5aUuLXH6owAITFLwra5kUq7cNucjsbuS4N3MVgLoFXfZGvjOHI5JzQYpXIAxoWTnhm9S-1mb_Vx0BYm2"/>
</div>
</header>
<main class="w-full max-w-[480px] px-4 flex-1 flex flex-col">
<!-- Search Field -->
<div class="mt-4 w-full h-[48px] bg-custom-input-bg rounded-[24px] flex items-center px-4 gap-3 focus-within:ring-1 ring-primary transition-all shadow-lg">
<span class="material-symbols-outlined text-custom-text-secondary">search</span>
<input class="bg-transparent border-none outline-none flex-1 text-[14px] text-custom-text-main placeholder-custom-text-secondary" readonly="" type="text" value="xyz"/>
<span class="material-symbols-outlined text-custom-text-secondary cursor-pointer hover:text-custom-text-main transition-colors">close</span>
</div>
<!-- Chip Row -->
<div class="mt-6 flex gap-2 overflow-x-auto no-scrollbar pb-2">
<button class="px-5 py-2 rounded-full bg-custom-chip-active text-white text-[14px] font-medium whitespace-nowrap">All</button>
<button class="px-5 py-2 rounded-full border border-custom-chip-outline text-custom-text-main text-[14px] font-medium whitespace-nowrap hover:bg-white/5 transition-colors">Active</button>
<button class="px-5 py-2 rounded-full border border-custom-chip-outline text-custom-text-main text-[14px] font-medium whitespace-nowrap hover:bg-white/5 transition-colors">Prospect</button>
<button class="px-5 py-2 rounded-full border border-custom-chip-outline text-custom-text-main text-[14px] font-medium whitespace-nowrap hover:bg-white/5 transition-colors">Dormant</button>
</div>
<!-- Content Area -->
<div class="flex-1 flex flex-col items-center justify-center -mt-12 text-center">
<!-- Hero Illustration -->
<div class="relative w-[120px] h-[120px] mb-8 flex items-center justify-center bg-white/5 rounded-full">
<div class="absolute inset-0 border-2 border-dashed border-custom-chip-outline rounded-full opacity-20 animate-[spin_20s_linear_infinite]"></div>
<div class="relative">
<span class="material-symbols-outlined text-[64px] text-custom-on-surface-variant opacity-60">search</span>
<div class="absolute -bottom-1 -right-1 bg-background p-1 rounded-full">
<span class="material-symbols-outlined text-[32px] text-error font-bold">close</span>
</div>
</div>
</div>
<!-- Headline -->
<h2 class="text-[20px] font-semibold text-custom-text-main mb-3">No results for 'xyz'</h2>
<!-- Subtitle -->
<p class="text-[14px] text-custom-text-secondary leading-relaxed max-w-[280px]">
                Try looking up by full name, national ID, or registered phone number.
            </p>
<!-- Actions -->
<div class="mt-10 w-full space-y-3">
<button class="w-full h-[48px] bg-custom-btn-bg text-custom-btn-text font-semibold rounded-full hover:brightness-110 active:scale-[0.98] transition-all shadow-md">
                    Try Different Lookup
                </button>
<button class="w-full h-[48px] bg-custom-btn-bg text-custom-btn-text font-semibold rounded-full hover:brightness-110 active:scale-[0.98] transition-all shadow-md">
                    Onboard New Customer
                </button>
</div>
</div>
</main>
<!-- Navigation Bar Simulation (Shared Component Logic) -->
<nav class="fixed bottom-0 w-full max-w-[480px] flex justify-around items-center py-4 bg-custom-input-bg/50 backdrop-blur-md border-t border-custom-chip-outline/20 md:hidden">
<div class="flex flex-col items-center text-custom-text-secondary">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] mt-1">Home</span>
</div>
<div class="flex flex-col items-center text-primary">
<div class="bg-primary-container/20 px-4 py-1 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">support_agent</span>
</div>
<span class="text-[10px] mt-1 font-semibold">Agents</span>
</div>
<div class="flex flex-col items-center text-custom-text-secondary">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="text-[10px] mt-1">Transactions</span>
</div>
<div class="flex flex-col items-center text-custom-text-secondary">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] mt-1">Profile</span>
</div>
</nav>
<script>
        // Micro-interaction for the input clear action
        document.querySelector('.material-symbols-outlined.cursor-pointer.hover\\:text-custom-text-main').addEventListener('click', () => {
            const input = document.querySelector('input');
            input.value = '';
            input.placeholder = 'Search for customers...';
        });

        // Toggle chip active state
        const chips = document.querySelectorAll('.whitespace-nowrap');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-custom-chip-active', 'text-white');
                    c.classList.add('border', 'border-custom-chip-outline', 'text-custom-text-main');
                });
                chip.classList.remove('border', 'border-custom-chip-outline', 'text-custom-text-main');
                chip.classList.add('bg-custom-chip-active', 'text-white');
            });
        });
    </script>
</body></html>
