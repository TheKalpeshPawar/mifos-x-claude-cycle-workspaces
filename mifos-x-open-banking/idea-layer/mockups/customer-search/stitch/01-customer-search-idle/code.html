<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Customer Lookup - Mifos X Open Banking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "inverse-primary": "#4c662a",
                "surface-variant": "#34362e",
                "background": "#12140e",
                "primary-fixed-dim": "#b2d188",
                "inverse-surface": "#e3e3d9",
                "surface": "#12140e",
                "inverse-on-surface": "#2f312a",
                "surface-container-high": "#292b24",
                "on-primary-container": "#415a1f",
                "tertiary-fixed": "#bcece7",
                "surface-container-highest": "#34362e",
                "surface-container": "#1e201a",
                "surface-container-lowest": "#0d0f09",
                "on-secondary": "#013735",
                "on-secondary-fixed-variant": "#1f4e4b",
                "on-secondary-container": "#8fbeba",
                "on-tertiary-container": "#2d5a57",
                "secondary-container": "#1f4e4b",
                "on-secondary-fixed": "#00201e",
                "tertiary-container": "#a1d0cc",
                "on-tertiary-fixed-variant": "#1f4e4b",
                "on-primary-fixed-variant": "#354e14",
                "tertiary-fixed-dim": "#a0cfcb",
                "tertiary": "#bdece8",
                "on-error-container": "#ffdad6",
                "surface-tint": "#b2d188",
                "on-primary": "#203700",
                "on-surface": "#e3e3d9",
                "primary-container": "#b2d188",
                "outline": "#8e9284",
                "on-background": "#e3e3d9",
                "on-error": "#690005",
                "on-tertiary": "#013735",
                "error-container": "#93000a",
                "surface-container-low": "#1a1c16",
                "on-tertiary-fixed": "#00201e",
                "secondary": "#a0cfcb",
                "surface-dim": "#12140e",
                "primary-fixed": "#cdeda1",
                "on-primary-fixed": "#102000",
                "outline-variant": "#44483c",
                "secondary-fixed-dim": "#a0cfcb",
                "surface-bright": "#383a33",
                "primary": "#ceeda2",
                "on-surface-variant": "#c4c8b9",
                "secondary-fixed": "#bcece7",
                "error": "#ffb4ab"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "16px",
                "xl": "24px",
                "pill": "9999px"
            },
            "fontFamily": {
                "headline-sm": ["Outfit"],
                "title-md": ["Outfit"],
                "body-md": ["Outfit"],
                "label-lg": ["Outfit"],
                "display-lg": ["Outfit"],
                "headline-lg-mobile": ["Outfit"],
                "label-md": ["Outfit"],
                "headline-lg": ["Outfit"],
                "title-lg": ["Outfit"],
                "headline-md": ["Outfit"],
                "body-lg": ["Outfit"]
            },
            "fontSize": {
                "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700"}],
                "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                "headline-md": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
      body {
        font-family: 'Outfit', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar (Based on JSON Component 1) -->
<header class="fixed top-0 w-full z-50 bg-background h-14 flex items-center px-4 border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-title-md font-medium text-on-surface">Find Customer</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-14 mb-20 px-4 pt-4 flex flex-col">
<!-- Search Field (Requirement 2) -->
<div class="relative w-full h-12 mb-6">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#8F9285]" data-icon="search">search</span>
</div>
<input class="w-full h-12 bg-surface-container rounded-pill pl-12 pr-4 border-none text-body-md text-on-surface placeholder-[#8F9285] focus:ring-2 focus:ring-primary-container outline-none transition-shadow" placeholder="Find customers" type="text"/>
</div>
<!-- Filter Chips (Requirement 3) -->
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-6 -mx-1 px-1">
<button class="whitespace-nowrap h-8 px-4 rounded-lg bg-[#354E16] text-[#CDEDA3] font-label-md flex items-center justify-center transition-colors active:scale-95">
                All
            </button>
<button class="whitespace-nowrap h-8 px-4 rounded-lg border border-outline-variant text-on-surface-variant font-label-md flex items-center justify-center transition-colors hover:bg-surface-variant/10 active:scale-95">
                Individual
            </button>
<button class="whitespace-nowrap h-8 px-4 rounded-lg border border-outline-variant text-on-surface-variant font-label-md flex items-center justify-center transition-colors hover:bg-surface-variant/10 active:scale-95">
                Business
            </button>
<button class="whitespace-nowrap h-8 px-4 rounded-lg border border-outline-variant text-on-surface-variant font-label-md flex items-center justify-center transition-colors hover:bg-surface-variant/10 active:scale-95">
                Group
            </button>
</div>
<!-- Scan Action (Requirement 4) -->
<div class="flex justify-center mb-12">
<button class="h-10 px-6 border border-outline-variant rounded-lg flex items-center gap-2 text-[#B2D188] font-medium text-[13px] hover:bg-surface-variant/10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="qr_code_scanner">qr_code_scanner</span>
                Scan Customer ID
            </button>
</div>
<!-- Hero Section (Requirement 5) -->
<div class="flex-1 flex flex-col items-center justify-center text-center py-8">
<img alt="Customer lookup illustration" class="w-[120px] h-[120px] mb-4 opacity-80" data-alt="A minimalist digital illustration for a financial application lookup screen. The center features a stylized charcoal green magnifying glass outline encircling a simplified human profile icon. The graphic is set against a deep obsidian background with professional, clean lines, evoking a sense of secure data retrieval and precision fintech design." src="https://lh3.googleusercontent.com/aida/ADBb0ugKSabeBWvxPTdTRQMgfrXn9oCz5p1pecSCD6-x9ET7OBxSjmqq_qwKoyECA5ryuEJ5GHTzLWNfVHDH-_yQp8KDT9cWIvwOKPOY-0pp9ZSAsbQcBz5LA7ZbTW9pp43PYOdKHk675J7HnycR9W7ujKqepI9Aw0QMWMx2pNR0DKVPoD4-cbgw8lA0UdCrDB1SSzhIuEo8WRIfrevsspOAo-jz9vq5_gcByPHYjPvvJhcATlnVdmGbu0DAkVaA"/>
<p class="font-body-md text-[#8F9285] max-w-[200px]">
                Find by name, ID number, or phone
            </p>
</div>
<!-- Footer CTAs (Requirement 6) -->
<div class="space-y-3 mt-auto pt-6 pb-4">
<button class="w-full h-12 bg-[#B2D188] text-[#1F3701] font-semibold text-body-md rounded-lg shadow-sm hover:brightness-105 active:scale-[0.98] transition-all">
                Onboard New Customer
            </button>
<button class="w-full h-12 border border-outline-variant text-[#E3E3D8] font-medium text-body-md rounded-lg hover:bg-surface-variant/10 active:scale-[0.98] transition-all">
                Onboard Business Customer
            </button>
</div>
</main>
<!-- BottomNavBar (Based on JSON Component 2) -->
<nav class="fixed bottom-0 w-full z-50 h-20 bg-background border-t border-outline-variant flex justify-around items-center px-2">
<div class="flex justify-around items-center w-full max-w-md mx-auto">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/10 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="text-label-md font-medium">Home</span>
</button>
<!-- Accounts (Active state contextually interpreted as "Customers" segment) -->
<button class="flex flex-col items-center justify-center bg-[#DCE7C8] dark:bg-[#4C662B] text-on-primary-container dark:text-[#FFFFFF] rounded-pill px-5 py-1 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="account_balance" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="text-label-md font-medium">Accounts</span>
</button>
<!-- Payments -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/10 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="text-label-md font-medium">Payments</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/10 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="text-label-md font-medium">Profile</span>
</button>
</div>
</nav>
<script>
        // Micro-interactions for chip selection
        document.querySelectorAll('.no-scrollbar button').forEach(button => {
            button.addEventListener('click', function() {
                // Reset all to inactive style
                document.querySelectorAll('.no-scrollbar button').forEach(btn => {
                    btn.className = "whitespace-nowrap h-8 px-4 rounded-lg border border-outline-variant text-on-surface-variant font-label-md flex items-center justify-center transition-colors hover:bg-surface-variant/10 active:scale-95";
                });
                // Set active style
                this.className = "whitespace-nowrap h-8 px-4 rounded-lg bg-[#354E16] text-[#CDEDA3] font-label-md flex items-center justify-center transition-colors active:scale-95";
            });
        });
    </script>
</body></html>
