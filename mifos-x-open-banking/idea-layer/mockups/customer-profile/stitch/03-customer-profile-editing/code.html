<body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 px-margin-mobile flex justify-between items-center bg-surface h-[64px] w-full">
<button class="material-symbols-outlined text-on-surface hover:bg-surface-container-high rounded-full p-2 transition-colors duration-200 active:scale-95" data-icon="arrow_back">arrow_back</button>
<h1 class="font-title-lg text-title-lg text-on-surface">Edit Profile</h1>
<button class="font-label-lg text-label-lg text-primary px-4 py-2 hover:bg-surface-container-high rounded-full transition-colors duration-200 active:scale-95">Save</button>
</header>
<main class="pt-[64px] pb-[120px] px-margin-mobile max-w-2xl mx-auto">
<form class="space-y-xl mt-lg">
<!-- Avatar Section (Implicit but standard for profile) -->
<div class="flex flex-col items-center mb-xl">
<div class="relative group">
<img alt="Profile" class="w-24 h-24 rounded-full object-cover border-2 border-outline-variant group-hover:border-primary transition-all duration-300" data-alt="A professional headshot of a smiling man in his 30s with a clean haircut, set against a blurred urban background with soft natural lighting. The visual style is modern, sharp, and high-fidelity, using a color palette of deep blacks and olive greens to match a sophisticated dark banking UI. The overall mood is confident and trustworthy." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXqMkC5S6cXfWKPuew_-ZbSRXWiX8BtYNceVjT0OwqgXghzaA3EWDvHQR8XFrEMjrrMNB0mH40oezV-G8bvJyZ_wA_BVdnCqcpwBzaYCMdXyB2pg5KI2k5Qjs0vbTl78Ept_tZ-5O1keREvkcDUvUf1vVPyN1gM6l52StMtZj_gOgF3dSHGUFwfmUOqfxcO8kRKKTuQ8WTfxYgZB_U_ZP0tRsCq9EQA2UQcIa-naxBOj8th-7x2c2pR9p1jMUCXuQgXvcrM6ajIcsy"/>
<div class="absolute bottom-0 right-0 bg-primary p-1.5 rounded-full border-4 border-background text-on-primary cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
</div>
</div>
</div>
<!-- Section 1: Personal Information -->
<div class="space-y-md">
<h2 class="text-primary-container font-title-md text-title-md">Personal Information</h2>
<div class="space-y-sm">
<!-- Full Name -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Full Name</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="text" value="John Kamau Mwangi"/>
</div>
</div>
<!-- Phone -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Phone</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="tel" value="+254 722 123 456"/>
</div>
</div>
<!-- Email -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Email</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="email" value="john.mwangi@gmail.com"/>
</div>
</div>
</div>
</div>
<!-- Section 2: Address -->
<div class="space-y-md">
<h2 class="text-primary-container font-title-md text-title-md">Address</h2>
<div class="space-y-sm">
<!-- Street -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Street</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="text" value="123 Moi Avenue, Nairobi"/>
</div>
</div>
<!-- County (Focused State) -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-primary-container font-label-md text-label-md z-10">County</label>
<div class="h-full border-2 border-primary-container rounded-xl flex items-center px-4 transition-colors duration-200 shadow-[0_0_8px_rgba(178,209,136,0.1)]">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="text" value="Nairobi County, Kenya"/>
</div>
</div>
<!-- Postcode -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Postcode</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="text" value="00100"/>
</div>
</div>
</div>
</div>
<!-- Section 3: Employment -->
<div class="space-y-md">
<h2 class="text-primary-container font-title-md text-title-md">Employment</h2>
<div class="space-y-sm">
<!-- Employer -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Employer</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="text" value="Safaricom PLC"/>
</div>
</div>
<!-- Monthly Income -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Monthly Income</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="text" value="KES 85,000"/>
</div>
</div>
<!-- Employment Type -->
<div class="relative group h-[56px]">
<label class="absolute -top-2 left-3 px-1 bg-background text-outline font-label-md text-label-md z-10">Employment Type</label>
<div class="h-full border border-outline-variant rounded-xl flex items-center px-4 group-focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg p-0" type="text" value="Permanent"/>
</div>
</div>
</div>
</div>
</form>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 left-0 right-0 bg-background/80 backdrop-blur-md p-margin-mobile flex flex-col gap-base border-t border-outline-variant/10">
<button class="h-[48px] w-full bg-primary-container text-on-primary-fixed-variant font-title-md text-title-md rounded-xl transition-all duration-200 active:scale-[0.98] hover:shadow-lg hover:shadow-primary/10">
            Save Changes
        </button>
<button class="h-[48px] w-full text-outline font-label-lg text-label-lg rounded-xl transition-all duration-200 active:scale-[0.98] hover:bg-surface-container">
            Discard Changes
        </button>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', (e) => {
                    const container = e.target.closest('div');
                    const label = container.previousElementSibling;
                    if (label) {
                        label.classList.add('text-primary-container');
                        label.classList.remove('text-outline');
                    }
                });
                input.addEventListener('blur', (e) => {
                    const container = e.target.closest('div');
                    const label = container.previousElementSibling;
                    // Keep county focused style as per request
                    if (label && label.innerText !== 'County') {
                        label.classList.remove('text-primary-container');
                        label.classList.add('text-outline');
                    }
                });
            });
        });
    </script>
</body></html>
