<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - Mifos X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#B2D188",
              "on-primary": "#1F3701",
              "primary-container": "#354E16",
              "on-primary-container": "#CDEDA3",
              secondary: "#A0CFCB",
              "on-secondary": "#003735",
              "secondary-container": "#1F4E4B",
              "on-secondary-container": "#BCEBE7",
              error: "#FFB4AB",
              background: "#12140E",
              "on-background": "#E3E3D8",
              surface: "#12140E",
              "on-surface": "#E3E3D8",
              "surface-variant": "#44483D",
              "on-surface-variant": "#C5C8BA",
              "surface-container": "#1E201A",
              "surface-container-high": "#282A24",
              outline: "#8F9285",
              "outline-variant": "#44483D",
              pending: "#E8A317",
              "nav-active-indicator": "#354E16",
            },
            fontFamily: {
              body: ["Outfit", "sans-serif"],
              display: ["Outfit", "sans-serif"],
              headline: ["Outfit", "sans-serif"],
              label: ["Outfit", "sans-serif"],
            },
            borderRadius: {
              small: "4px",
              medium: "12px",
              large: "16px",
              pill: "9999px",
            },
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #12140E;
        color: #E3E3D8;
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .input-field-focus:focus-within {
        border-color: #B2D188 !important;
        outline: none;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background selection:bg-primary-container">
<!-- Header / TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-background flex items-center justify-between px-4 h-[64px] w-full">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors active:opacity-80">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<h1 class="font-display text-[18px] font-medium text-on-surface text-center absolute left-1/2 -translate-x-1/2">Edit Profile</h1>
<button class="font-display text-[14px] font-semibold text-primary hover:bg-surface-variant/20 px-3 py-2 rounded-lg transition-colors active:opacity-80">
            Save
        </button>
</header>
<!-- Content Area -->
<main class="max-w-md mx-auto px-4 pb-12">
<!-- Profile Image Placeholder/Visual Decor -->
<div class="flex flex-col items-center justify-center mt-6 mb-8">
<div class="relative w-24 h-24 rounded-full overflow-hidden border-2 border-outline-variant group cursor-pointer">
<img alt="User Profile" class="w-full h-full object-cover bg-surface-container" data-alt="A professional studio portrait of a handsome Kenyan man with short hair and a warm, confident expression. The lighting is soft and cinematic, highlighting his facial features against a dark, textured charcoal background. He is wearing a minimalist dark green linen shirt that aligns with the earth-tone palette of the application. The image conveys trust, sophistication, and modern financial professional style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAs7xpBiAjm_aDwfegKScVFKzJ0p0CtUiSeQHpEKT9ihEzIAzhEVCrcDby7Nz-FsVLY6kgqvZ77cAYEk35ASXZzns6g8akaXxEdTa3aytX1274czXfIR4rM5nx3uBDHl3IQcU1aFRu1q6bh6Tdt02zzL9W2tet6yipltbbracFkan1CE2DryMfSLglbdzTlqlBKq4CHm8u8L3Qx30lr6trbVkIRG-wUwA7vCPmKdLL9fFh2au8A9ZU6KdpGLW3Kurcm9AVGdyS58RNq"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white" data-icon="edit">edit</span>
</div>
</div>
<p class="text-on-surface-variant text-label-small mt-3">Change Profile Photo</p>
</div>
<!-- Personal Information Section -->
<section class="mt-[24px]">
<h2 class="font-display text-[14px] font-semibold text-primary mb-4 tracking-wide uppercase">Personal Information</h2>
<div class="flex flex-col gap-3">
<!-- Field 1 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Full Name</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="text" value="John Kamau Mwangi"/>
</div>
<!-- Field 2 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Phone</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="tel" value="+254 722 123 456"/>
</div>
<!-- Field 3 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Email</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="email" value="john.mwangi@gmail.com"/>
</div>
</div>
</section>
<!-- Address Section -->
<section class="mt-[16px]">
<h2 class="font-display text-[14px] font-semibold text-primary mb-4 tracking-wide uppercase">Address</h2>
<div class="flex flex-col gap-3">
<!-- Field 1 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Street</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="text" value="123 Moi Avenue, Nairobi"/>
</div>
<!-- Field 2 (Focused State Representation) -->
<div class="h-[56px] border border-primary rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface shadow-[0_0_0_1px_#B2D188]">
<label class="text-[11px] font-medium text-primary leading-tight">County</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="text" value="Nairobi County, Kenya"/>
</div>
<!-- Field 3 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Postcode</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="text" value="00100"/>
</div>
</div>
</section>
<!-- Employment Section -->
<section class="mt-[16px]">
<h2 class="font-display text-[14px] font-semibold text-primary mb-4 tracking-wide uppercase">Employment</h2>
<div class="flex flex-col gap-3">
<!-- Field 1 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Employer</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="text" value="Safaricom PLC"/>
</div>
<!-- Field 2 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Monthly Income</label>
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" spellcheck="false" type="text" value="KES 85,000"/>
</div>
<!-- Field 3 -->
<div class="input-field-focus h-[56px] border border-outline-variant rounded-[12px] px-4 py-2 flex flex-col justify-center bg-surface transition-all duration-200">
<label class="text-[11px] font-medium text-outline leading-tight">Employment Type</label>
<div class="flex items-center justify-between">
<input class="bg-transparent border-none p-0 text-[16px] text-on-surface focus:ring-0 w-full placeholder:text-on-surface-variant" readonly="" type="text" value="Permanent"/>
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Action Buttons -->
<div class="mt-[32px] mb-[32px] flex flex-col items-center">
<button class="w-full h-[48px] bg-primary text-on-primary font-display text-[15px] font-semibold rounded-[12px] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Save Changes
            </button>
<button class="mt-[12px] font-display text-[14px] font-medium text-outline hover:text-on-surface-variant active:opacity-60 transition-colors py-2">
                Discard Changes
            </button>
</div>
</main>
<!-- Navigation Shell Placeholder -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 bg-background border-t border-outline-variant">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="text-[12px] font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-[12px] font-medium">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="text-[12px] font-medium">Payments</span>
</div>
<div class="flex flex-col items-center justify-center bg-nav-active-indicator text-on-primary-container rounded-pill px-5 py-1">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[12px] font-medium">Profile</span>
</div>
</nav>
<script>
        // Micro-interactions for form focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-[0_0_0_1px_#B2D188]');
                input.parentElement.classList.replace('border-outline-variant', 'border-primary');
                const label = input.parentElement.querySelector('label');
                if (label) label.classList.replace('text-outline', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-[0_0_0_1px_#B2D188]');
                input.parentElement.classList.replace('border-primary', 'border-outline-variant');
                const label = input.parentElement.querySelector('label');
                if (label) label.classList.replace('text-primary', 'text-outline');
            });
        });
    </script>
</body></html>
