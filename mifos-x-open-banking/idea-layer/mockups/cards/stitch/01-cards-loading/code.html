        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",

<style>
        @keyframes shimmer-sweep {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(150%); }
        }

        .shimmer-base {
            background-color: #1E201A;
            position: relative;
            overflow: hidden;
        }

        .shimmer-base::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(40, 42, 36, 0.8) 50%,
                transparent 100%
            );
            animation: shimmer-sweep 1200ms infinite ease-in-out;
        }

        body {
            background-color: #12140E;
            color: #C5C8BA;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased select-none">
