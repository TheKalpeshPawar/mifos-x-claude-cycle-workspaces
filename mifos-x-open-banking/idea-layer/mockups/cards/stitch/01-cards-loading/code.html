<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X - Cards Loading</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-base {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }
        .shimmer-base::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(40, 42, 36, 0.6),
                transparent
            );
            animation: shimmer 1200ms infinite linear;
        }
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #e3e3db;
            -webkit-font-smoothing: antialiased;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#1E201A",
                      "surface-container-highest": "#343530",
                      "on-tertiary-fixed-variant": "#354e14",
                      "on-surface-variant": "#c4c8b9",
                      "surface-container-lowest": "#0d0f0a",
                      "surface-bright": "#C5C8BA",
                      "primary-container": "#4c662b",
                      "on-error": "#690005",
                      "tertiary-fixed-dim": "#b2d188",
                      "surface-container-low": "#1b1c17",
                      "on-primary": "#203701",
                      "secondary-fixed-dim": "#a0d0cc",
                      "error": "#BA1A1A",
                      "on-surface": "#e3e3db",
                      "surface-tint": "#b2d189",
                      "on-tertiary-fixed": "#102000",
                      "tertiary": "#b2d188",
                      "surface-variant": "#343530",
                      "on-error-container": "#ffdad6",
                      "on-tertiary-container": "#c3e398",
                      "on-secondary-container": "#8fbeba",
                      "on-primary-container": "#c3e39a",
                      "surface-dim": "#12140f",
                      "primary": "#b2d189",
                      "error-container": "#93000a",
                      "on-secondary-fixed-variant": "#1e4e4b",
                      "surface-container": "#1f201b",
                      "on-primary-fixed": "#102000",
                      "inverse-primary": "#4c662b",
                      "pending": "#E8A317",
                      "primary-fixed": "#cdeda3",

                      "on-background": "#e3e3db",
                      "secondary-fixed": "#bbece8",
                      "on-tertiary": "#203700",
                      "on-accent": "#1F3701",
                      "inverse-surface": "#e3e3db",
                      "accent": "#B2D188",
                      "surface-container-high": "#292b25",
                      "outline": "#44483D",
                      "inverse-on-surface": "#2f312c",

              "borderRadius": {
                      "DEFAULT": "0.25rem",

              "spacing": {
                      "app-bar-height": "64px",

              "fontFamily": {

                      "label-md": ["Outfit"],
                      "body-sm": ["Outfit"],
                      "headline-md": ["Outfit"],
                      "body-md": ["Outfit"],
                      "title-sm": ["Outfit"]
              },
              "fontSize": {
                      "label-sm": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                      "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                      "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface">
<!-- App Bar Shimmer -->
<header class="fixed top-0 left-0 w-full h-[64px] bg-surface/80 backdrop-blur-xl z-50 flex items-center px-4">
<div class="shimmer-base w-[80px] h-[24px] rounded-lg"></div>
<div class="ml-auto flex gap-4">
<div class="shimmer-base w-6 h-6 rounded-full"></div>
<div class="shimmer-base w-6 h-6 rounded-full"></div>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-[64px] pb-[80px] flex flex-col">
<!-- Main Card Shimmer -->
<div class="mt-6 mx-4 h-[192px] shimmer-base rounded-[16px] relative p-6">
<!-- Brand Logo Spot -->
<div class="absolute top-6 right-6 w-12 h-12 bg-[#282A24]/40 rounded-lg"></div>
<!-- Internal Card Details -->
<div class="absolute bottom-6 left-6 space-y-2">
<div class="w-48 h-4 bg-[#282A24]/40 rounded"></div>
<div class="w-32 h-3 bg-[#282A24]/40 rounded"></div>
<div class="w-20 h-3 bg-[#282A24]/40 rounded"></div>
</div>
</div>
<!-- Filter Chip Row Shimmer -->
<div class="mt-4 flex gap-2 overflow-x-hidden px-4">
<div class="shimmer-base min-w-[80px] h-[40px] rounded-full"></div>
<div class="shimmer-base min-w-[80px] h-[40px] rounded-full"></div>
<div class="shimmer-base min-w-[80px] h-[40px] rounded-full"></div>
<div class="shimmer-base min-w-[80px] h-[40px] rounded-full"></div>
</div>
<!-- Transactions Header Shimmer -->
<div class="mt-8 px-4 flex justify-between items-center">
<div class="shimmer-base w-[140px] h-[16px] rounded"></div>
<div class="shimmer-base w-[60px] h-[14px] rounded"></div>
</div>
<!-- Transaction List Shimmers -->
<div class="mt-4 flex flex-col px-4 gap-1">
<!-- Row 1 -->
<div class="h-[64px] flex items-center gap-4 border-b border-outline/20">
<div class="shimmer-base w-8 h-8 rounded shrink-0"></div>
<div class="flex flex-col gap-1 grow">
<div class="shimmer-base w-[180px] h-[16px] rounded"></div>
<div class="shimmer-base w-[80px] h-[12px] rounded"></div>
</div>
<div class="shimmer-base w-[60px] h-[16px] rounded shrink-0"></div>
</div>
<!-- Row 2 -->
<div class="h-[64px] flex items-center gap-4 border-b border-outline/20">
<div class="shimmer-base w-8 h-8 rounded shrink-0"></div>
<div class="flex flex-col gap-1 grow">
<div class="shimmer-base w-[180px] h-[16px] rounded"></div>
<div class="shimmer-base w-[80px] h-[12px] rounded"></div>
</div>
<div class="shimmer-base w-[60px] h-[16px] rounded shrink-0"></div>
</div>
<!-- Row 3 -->
<div class="h-[64px] flex items-center gap-4 border-b border-outline/20">
<div class="shimmer-base w-8 h-8 rounded shrink-0"></div>
<div class="flex flex-col gap-1 grow">
<div class="shimmer-base w-[180px] h-[16px] rounded"></div>
<div class="shimmer-base w-[80px] h-[12px] rounded"></div>
</div>
<div class="shimmer-base w-[60px] h-[16px] rounded shrink-0"></div>
</div>
<!-- Row 4 -->
<div class="h-[64px] flex items-center gap-4 border-b border-outline/20">
<div class="shimmer-base w-8 h-8 rounded shrink-0"></div>
<div class="flex flex-col gap-1 grow">
<div class="shimmer-base w-[180px] h-[16px] rounded"></div>
<div class="shimmer-base w-[80px] h-[12px] rounded"></div>
</div>
<div class="shimmer-base w-[60px] h-[16px] rounded shrink-0"></div>
</div>
<!-- Row 5 -->
<div class="h-[64px] flex items-center gap-4">
<div class="shimmer-base w-8 h-8 rounded shrink-0"></div>
<div class="flex flex-col gap-1 grow">
<div class="shimmer-base w-[180px] h-[16px] rounded"></div>
<div class="shimmer-base w-[80px] h-[12px] rounded"></div>
</div>
<div class="shimmer-base w-[60px] h-[16px] rounded shrink-0"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface-container">
<!-- Accounts -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined mb-1">account_balance_wallet</span>
<span class="font-label-lg text-label-lg">Accounts</span>
</button>
<!-- Cards (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 scale-100 transition-transform">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<span class="font-label-lg text-label-lg">Cards</span>
</button>
<!-- Payments -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label-lg text-label-lg">Payments</span>
</button>
<!-- More -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined mb-1">more_horiz</span>
<span class="font-label-lg text-label-lg">More</span>
</button>
</nav>
<script>
        // Simple micro-interaction for active nav state
        document.querySelectorAll('nav button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('scale-95');
                btn.style.opacity = '0.8';
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('scale-95');
                btn.style.opacity = '1';
            });
        });
    </script>
</body></html>
