<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Cards - Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Public+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "surface-variant": "#E1E4D5",
                        "on-surface-variant": "#44483D",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        "nav-active-indicator": "#DCE7C8",
                        // Dark theme specific mappings from Design System
                        dark: {
                            bg: "#12140E",
                            surface: "#1A1C16",
                            onSurface: "#E3E3D8",
                            onSurfaceVariant: "#8F9285",
                            primaryContainer: "#384D14",
                            onPrimaryContainer: "#CDEDA3"
                        }
                    },
                    borderRadius: {
                        "none": "0",
                        "xs": "4px",
                        "sm": "8px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px",
                        "pill": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-[#12140E] text-[#E3E3D8] min-h-screen flex flex-col overflow-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 right-0 h-16 flex items-center px-4 bg-[#12140E] z-50">
<h1 class="text-[20px] font-semibold text-[#E3E3D8] tracking-tight">My Cards</h1>
</header>
<!-- Content Canvas -->
<main class="flex-1 flex flex-col items-center pt-16 pb-20">
<!-- Hero Illustration -->
<div class="mt-20 w-40 h-[120px] flex items-center justify-center relative group">
<div class="absolute inset-0 bg-white/5 rounded-2xl blur-2xl group-hover:bg-white/10 transition-all duration-700"></div>
<img alt="Empty state illustration showing a blank credit card outline with a plus sign" class="w-full h-full object-contain relative z-10 opacity-90 brightness-110" src="https://lh3.googleusercontent.com/aida/ADBb0ug1AsiNVlLTWUymImMAiYsmjGyP3Mg03QSV9XbRc8reVBnXBgVGtC_tbug_tJSGBV0G05PScruC6en1_mKZOW5aCpdLDqc8m7ubi-by8ItGd7YNqlQrwMbQTUMQAeyxIGMsBh-vKXwHIUx7Ah0cnf-Hc3JKMH4CkiM4m7-xBfyy0J_DVt8IbHp1YcFv1gjMhj-CNfq0QrSz8mjMHCx95J7PXXR0WMSnzwEdx7tRb67XjhBwwyS2_Sij7kwb"/>
</div>
<!-- Text Content -->
<div class="mt-6 text-center px-12">
<h2 class="text-[22px] font-semibold text-[#E3E3D8]">No Cards Yet</h2>
<p class="mt-2 text-[14px] text-[#8F9285] leading-relaxed">
                Order your first Mifos debit or credit card to start spending and managing limits.
            </p>
</div>
<!-- Action Section -->
<div class="mt-8 w-full px-6 flex flex-col items-center gap-3">
<button class="flex items-center justify-center gap-2 w-full h-12 bg-[#B2D188] hover:bg-[#c2e198] active:scale-[0.98] transition-all duration-200 rounded-[12px] text-[#1F3701] font-semibold text-base shadow-lg shadow-[#1F3701]/20">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<span>Order New Card</span>
</button>
<button class="h-10 px-6 text-[14px] font-medium text-[#8F9285] hover:text-[#E3E3D8] active:opacity-60 transition-colors">
                Learn about cards
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Contextual Shell) -->
<!-- Determined active tab: "Cards" (labeled "Accounts" or similar in nav but usually mapped to card/balance view) -->
<nav class="fixed bottom-0 w-full h-20 bg-[#12140E] border-t border-[#44483D] flex justify-around items-center px-2 z-50">
<div class="flex flex-col items-center justify-center text-[#C5C8BA] hover:bg-white/5 px-5 py-1 rounded-full transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform">home</span>
<span class="text-[12px] font-medium">Home</span>
</div>
<!-- Active Tab: Mapping to Accounts/Cards -->
<div class="flex flex-col items-center justify-center bg-[#384D14] text-[#CDEDA3] rounded-full px-5 py-1 cursor-pointer transition-all duration-200 scale-105">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="text-[12px] font-medium">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-[#C5C8BA] hover:bg-white/5 px-5 py-1 rounded-full transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform">payments</span>
<span class="text-[12px] font-medium">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-[#C5C8BA] hover:bg-white/5 px-5 py-1 rounded-full transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform">person</span>
<span class="text-[12px] font-medium">Profile</span>
</div>
</nav>
<script>
        // Subtle micro-interaction for the illustration
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            const hero = document.querySelector('img[src="https://lh3.googleusercontent.com/aida/ADBb0ug1AsiNVlLTWUymImMAiYsmjGyP3Mg03QSV9XbRc8reVBnXBgVGtC_tbug_tJSGBV0G05PScruC6en1_mKZOW5aCpdLDqc8m7ubi-by8ItGd7YNqlQrwMbQTUMQAeyxIGMsBh-vKXwHIUx7Ah0cnf-Hc3JKMH4CkiM4m7-xBfyy0J_DVt8IbHp1YcFv1gjMhj-CNfq0QrSz8mjMHCx95J7PXXR0WMSnzwEdx7tRb67XjhBwwyS2_Sij7kwb"]');
            if (hero) {
                hero.style.transform = `translate(${(x - 0.5) * 10}px, ${(y - 0.5) * 10}px)`;
            }
        });
    </script>
</body></html>
