<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-sweep {
            position: relative;
            overflow: hidden;
            background-color: #1E201A; /* surface-container */
        }
        .shimmer-sweep::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                rgba(40, 42, 36, 0) 0%,
                rgba(40, 42, 36, 0.6) 50%,
                rgba(40, 42, 36, 0) 100%
            );
            animation: shimmer 1200ms infinite linear;
        }
        .shimmer-text {
            background-color: #282A24; /* surface-container-high */
            border-radius: 4px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#34362e",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#354e14",
                        "tertiary-fixed-dim": "#ffba3e",
                        "on-surface-variant": "#c4c8b9",
                        "surface-container-highest": "#34362e",
                        "tertiary-fixed": "#ffdeae",
                        "primary-container": "#b2d188",
                        "outline": "#8e9284",
                        "inverse-on-surface": "#2f312a",
                        "surface": "#12140e",
                        "secondary-fixed-dim": "#a0cfcb",
                        "on-error": "#690005",
                        "secondary-fixed": "#bcece7",
                        "tertiary-container": "#ffba3f",
                        "surface-dim": "#12140e",
                        "surface-container-high": "#292b24",
                        "inverse-primary": "#4c662a",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#1a1c16",
                        "on-primary": "#203700",
                        "background": "#12140e",
                        "secondary": "#a0cfcb",
                        "surface-tint": "#b2d188",
                        "on-tertiary-container": "#704c00",
                        "on-tertiary-fixed-variant": "#604100",
                        "on-secondary-container": "#8fbeba",
                        "surface-bright": "#383a33",
                        "primary-fixed-dim": "#b2d188",
                        "on-primary-fixed": "#102000",
                        "on-primary-container": "#415a1f",
                        "tertiary": "#ffdeae",
                        "on-tertiary": "#432c00",
                        "surface-container": "#1e201a",
                        "on-tertiary-fixed": "#281900",
                        "primary": "#ceeda2",
                        "outline-variant": "#44483c",
                        "on-secondary": "#013735",
                        "surface-container-lowest": "#0d0f09",
                        "on-secondary-fixed": "#00201e",
                        "on-surface": "#e3e3d9",
                        "error-container": "#93000a",
                        "on-background": "#e3e3d9",
                        "inverse-surface": "#e3e3d9",
                        "secondary-container": "#1f4e4b",
                        "on-secondary-fixed-variant": "#1f4e4b",
                        "primary-fixed": "#cdeda1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "4px",
                        "base": "4px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "title-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "label-md": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-lg": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md">
<!-- Component 1: TopAppBar Skeleton -->
<header class="bg-surface sticky top-0 z-50 h-16 w-full flex items-center justify-between px-4">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container shimmer-sweep"></div>
<div class="w-[160px] h-[20px] shimmer-text shimmer-sweep"></div>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container shimmer-sweep"></div>
</header>
<main class="pb-24">
<!-- Component 2: Grid Shimmer (Stats/Quick Actions) -->
<section class="px-8 mt-6">
<div class="grid grid-cols-2 gap-3">
<div class="h-[80px] rounded-xl shimmer-sweep"></div>
<div class="h-[80px] rounded-xl shimmer-sweep"></div>
<div class="h-[80px] rounded-xl shimmer-sweep"></div>
<div class="h-[80px] rounded-xl shimmer-sweep"></div>
</div>
</section>
<!-- Component 3: List Row Shimmer (Client Approvals) -->
<section class="px-gutter mt-8">
<div class="w-[120px] h-[16px] shimmer-text shimmer-sweep mb-4"></div>
<div class="flex flex-col gap-3">
<!-- 3 blocks -->
<div class="h-[72px] bg-surface-container rounded-xl p-4 flex items-center justify-between shimmer-sweep">
<div class="w-[240px] h-[14px] shimmer-text"></div>
<div class="w-[100px] h-[36px] bg-primary/20 rounded-[18px]"></div>
</div>
<div class="h-[72px] bg-surface-container rounded-xl p-4 flex items-center justify-between shimmer-sweep">
<div class="w-[240px] h-[14px] shimmer-text"></div>
<div class="w-[100px] h-[36px] bg-primary/20 rounded-[18px]"></div>
</div>
<div class="h-[72px] bg-surface-container rounded-xl p-4 flex items-center justify-between shimmer-sweep">
<div class="w-[240px] h-[14px] shimmer-text"></div>
<div class="w-[100px] h-[36px] bg-primary/20 rounded-[18px]"></div>
</div>
</div>
</section>
<!-- Component 4: Card Shimmer (Featured Banner) -->
<section class="px-gutter mt-8">
<div class="h-[72px] rounded-xl shimmer-sweep p-4 flex items-center justify-between">
<div class="w-[200px] h-[14px] shimmer-text"></div>
<div class="w-[120px] h-[36px] bg-primary/20 rounded-lg"></div>
</div>
</section>
<!-- Component 5: List Row Shimmer (Transaction History) -->
<section class="px-gutter mt-8">
<div class="w-[140px] h-[16px] shimmer-text shimmer-sweep mb-4"></div>
<div class="bg-surface-container rounded-xl divide-y divide-[#282A24]">
<!-- Row 1 -->
<div class="h-[56px] px-4 flex items-center justify-between">
<div class="w-[60px] h-[14px] shimmer-text shimmer-sweep"></div>
<div class="w-[180px] h-[14px] shimmer-text shimmer-sweep"></div>
</div>
<!-- Row 2 -->
<div class="h-[56px] px-4 flex items-center justify-between">
<div class="w-[60px] h-[14px] shimmer-text shimmer-sweep"></div>
<div class="w-[180px] h-[14px] shimmer-text shimmer-sweep"></div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar Placeholder -->
<nav class="fixed bottom-0 w-full z-50 h-[80px] bg-surface-container border-t border-outline-variant flex justify-around items-center px-sm pb-safe">
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">assignment</span>
<span class="font-label-md text-label-md">Applications</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">Clients</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</div>
</nav>
<script>
        // Micro-interaction: Subtle fade-in for the main content
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transition = 'opacity 400ms ease-in';
            requestAnimationFrame(() => {
                main.style.opacity = '1';
            });
        });
    </script>
</body></html>
