<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Corporate Onboarding | Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #1A1C16;
            color: #C5C8BA;
        }
        .shimmer {
            position: relative;
            overflow: hidden;
            background: #2D3126;
        }
        .shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(178, 209, 136, 0) 0,
                rgba(178, 209, 136, 0.05) 20%,
                rgba(178, 209, 136, 0.15) 60%,
                rgba(178, 209, 136, 0)
            );
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-accent": "#B2D188",
                        secondary: "#386663",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "on-surface-variant": "#44483D",
                        "outline-variant": "#C5C8BA",
                        dark: {
                            bg: "#1A1C16",
                            surface: "#23261E",
                            outline: "#44483D"
                        }
                    },
                    borderRadius: {
                        'pill': '9999px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '24px'
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#1A1C16] text-[#C5C8BA] min-h-screen">

</div>

</main>

<div class="fixed bottom-0 w-full bg-[#1A1C16] border-t border-[#44483D] p-4 z-40">
<div class="max-w-2xl mx-auto flex flex-col gap-4">
