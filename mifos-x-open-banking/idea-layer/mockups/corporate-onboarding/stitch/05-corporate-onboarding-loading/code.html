<style>
        body {
            background-color: #12140f;
            color: #e3e3da;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer-base {
            background: linear-gradient(90deg, #1f201b 25%, #343530 50%, #1f201b 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }

        .shimmer-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface h-16 flex items-center justify-between px-margin-mobile md:px-margin-desktop">
<div class="flex items-center gap-4">
<button class="p-2 active:scale-95 transition-transform duration-200 text-primary hover:bg-surface-container-high rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary">Onboarding</h1>
</div>
<div class="flex items-center">
<button class="p-2 active:scale-95 transition-transform duration-200 text-primary hover:bg-surface-container-high rounded-full">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
</div>
</header>
<!-- Content Canvas -->
<main class="max-w-container-max-width mx-auto px-margin-mobile md:px-margin-desktop pb-32">
<div class="flex flex-col gap-6 pt-6">
<!-- Component 1: Hero Image Box Shimmer -->
<div class="shimmer-base h-[200px] w-full rounded-xl opacity-80"></div>
<!-- Component 2: Headline Text Shimmer -->
<div class="shimmer-base h-10 w-[60%] rounded-lg"></div>
<!-- Components 3-8: Six Input Field Shimmers -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="shimmer-base h-14 w-full rounded-lg border border-outline-variant/30"></div>
<div class="shimmer-base h-14 w-full rounded-lg border border-outline-variant/30"></div>
<div class="shimmer-base h-14 w-full rounded-lg border border-outline-variant/30"></div>
<div class="shimmer-base h-14 w-full rounded-lg border border-outline-variant/30"></div>
<div class="shimmer-base h-14 w-full rounded-lg border border-outline-variant/30"></div>
<div class="shimmer-base h-14 w-full rounded-lg border border-outline-variant/30"></div>
</div>
<!-- Components 9-11: Three Card Section Shimmers -->
<div class="flex flex-col gap-3">
<div class="shimmer-base h-20 w-full rounded-xl bg-surface-container-low border border-outline-variant/10"></div>
<div class="shimmer-base h-20 w-full rounded-xl bg-surface-container-low border border-outline-variant/10"></div>
<div class="shimmer-base h-20 w-full rounded-xl bg-surface-container-low border border-outline-variant/10"></div>
</div>
<!-- Components 12-15: Four Button Shimmers (Clustered) -->
<div class="flex flex-wrap gap-4 mt-4">
<div class="shimmer-base h-12 w-36 rounded-full"></div>
<div class="shimmer-base h-12 w-32 rounded-full"></div>
<div class="shimmer-base h-12 w-40 rounded-full"></div>
<div class="shimmer-base h-12 w-28 rounded-full"></div>
</div>
<!-- Component 16: Metadata/Footer Box Shimmer -->
<div class="shimmer-base h-24 w-full rounded-xl opacity-40"></div>
<!-- Component 17: Additional Button Shimmer -->
<div class="flex justify-end">
<div class="shimmer-base h-14 w-48 rounded-full"></div>
</div>
<!-- Component 18: Stack Shimmer (List Items) -->
<div class="flex flex-col gap-2 p-4 bg-surface-container rounded-xl">
<div class="flex items-center gap-4">
<div class="shimmer-base h-10 w-10 rounded-full"></div>
<div class="shimmer-base h-4 w-48 rounded-md"></div>
</div>
<div class="flex items-center gap-4 border-t border-outline-variant/20 pt-2">
<div class="shimmer-base h-10 w-10 rounded-full"></div>
<div class="shimmer-base h-4 w-32 rounded-md"></div>
</div>
<div class="flex items-center gap-4 border-t border-outline-variant/20 pt-2">
<div class="shimmer-base h-10 w-10 rounded-full"></div>
<div class="shimmer-base h-4 w-56 rounded-md"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Filtered for Onboarding destination) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-4 bg-surface-container rounded-t-xl shadow-sm">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-90 transition-transform duration-150" href="#">

<span class="font-label-md text-label-md">Registration</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" data-icon="domain_verification">domain_verification</span>
<span class="font-label-md text-label-md">Verification</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" data-icon="pending_actions">pending_actions</span>
<span class="font-label-md text-label-md">Review</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" data-icon="contact_support">contact_support</span>
<span class="font-label-md text-label-md">Support</span>
</a>
</nav>
<script>
        // Micro-interaction for skeleton pulse
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.shimmer-base');
            shimmers.forEach((s, index) => {
                // Stagger the pulse for a more organic loading feel
                s.style.animationDelay = `${index * 0.1}s`;
            });
        });
    </script>
</body></html>
