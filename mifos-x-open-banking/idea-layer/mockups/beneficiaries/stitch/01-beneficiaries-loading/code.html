<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1E201A",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3DC",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#8F9285",
                        "outline-variant": "#44483D",
                        "nav-active-indicator": "#DCE7C8",
                        "shimmer-base": "#1E201A",
                        "shimmer-highlight": "#282A24"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        'xs': '4px',
                        'sm': '8px',
                        'md': '12px',
                        'lg': '16px',
                        'pill': '9999px'
                    },
                    animation: {
                        'shimmer-sweep': 'shimmer 1200ms linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        .shimmer-container {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }
        .shimmer-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(40, 42, 36, 0.8) 50%,
                transparent 100%
            );
            animation: shimmer 1200ms linear infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen">
<!-- Component 1: Top App Bar Shimmer -->
<header class="fixed top-0 w-full z-50 bg-background h-16 flex items-center justify-center px-4 border-b border-outline-variant">
<div class="shimmer-container w-[120px] h-[24px] rounded-sm"></div>
</header>
<main class="pt-16 pb-24 max-w-md mx-auto">
<!-- Component 2: Search/Text Field Shimmer -->
<div class="px-4 mt-4">
<div class="shimmer-container w-full h-12 rounded-pill"></div>
</div>
<!-- Component 3: Section Header Shimmer -->
<div class="px-4 mt-4">
<div class="shimmer-container w-[100px] h-[14px] rounded-xs"></div>
</div>
<!-- Components 4, 5, 6: Three List Row Shimmers -->
<div class="mt-2 flex flex-col gap-1">
<!-- Row 1 -->
<div class="px-4 h-[72px] flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="shimmer-container w-10 h-10 rounded-full"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-container w-[160px] h-[16px] rounded-xs"></div>
<div class="shimmer-container w-[80px] h-[12px] rounded-xs"></div>
</div>
</div>
<div class="shimmer-container w-[60px] h-[12px] rounded-xs"></div>
</div>
<!-- Row 2 -->
<div class="px-4 h-[72px] flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="shimmer-container w-10 h-10 rounded-full"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-container w-[160px] h-[16px] rounded-xs"></div>
<div class="shimmer-container w-[80px] h-[12px] rounded-xs"></div>
</div>
</div>
<div class="shimmer-container w-[60px] h-[12px] rounded-xs"></div>
</div>
<!-- Row 3 -->
<div class="px-4 h-[72px] flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="shimmer-container w-10 h-10 rounded-full"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-container w-[160px] h-[16px] rounded-xs"></div>
<div class="shimmer-container w-[80px] h-[12px] rounded-xs"></div>
</div>
</div>
<div class="shimmer-container w-[60px] h-[12px] rounded-xs"></div>
</div>
</div>
<!-- Component 7: Section Header Shimmer -->
<div class="px-4 mt-4">
<div class="shimmer-container w-[120px] h-[14px] rounded-xs"></div>
</div>
<!-- Components 8, 9: Two Card Shimmers -->
<div class="px-4 mt-2 space-y-2">
<!-- Card 1 -->
<div class="p-4 rounded-md border border-outline-variant flex items-center justify-between h-20">
<div class="flex items-center gap-3">
<div class="shimmer-container w-8 h-8 rounded-sm"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-container w-[180px] h-[16px] rounded-xs"></div>
<div class="shimmer-container w-[120px] h-[12px] rounded-xs"></div>
</div>
</div>
<div class="shimmer-container w-[60px] h-[12px] rounded-xs"></div>
</div>
<!-- Card 2 -->
<div class="p-4 rounded-md border border-outline-variant flex items-center justify-between h-20 mb-6">
<div class="flex items-center gap-3">
<div class="shimmer-container w-8 h-8 rounded-sm"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-container w-[180px] h-[16px] rounded-xs"></div>
<div class="shimmer-container w-[120px] h-[12px] rounded-xs"></div>
</div>
</div>
<div class="shimmer-container w-[60px] h-[12px] rounded-xs"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar Placeholder -->
<nav class="fixed bottom-0 w-full z-50 h-20 bg-background border-t border-outline-variant flex justify-around items-center px-2 pb-safe">
<div class="flex flex-col items-center justify-center px-5 py-1">
<div class="shimmer-container w-6 h-6 rounded-full mb-1"></div>
<div class="shimmer-container w-8 h-3 rounded-xs"></div>
</div>
<div class="flex flex-col items-center justify-center px-5 py-1">
<div class="shimmer-container w-6 h-6 rounded-full mb-1"></div>
<div class="shimmer-container w-8 h-3 rounded-xs"></div>
</div>
<div class="flex flex-col items-center justify-center px-5 py-1">
<div class="shimmer-container w-6 h-6 rounded-full mb-1"></div>
<div class="shimmer-container w-8 h-3 rounded-xs"></div>
</div>
<div class="flex flex-col items-center justify-center px-5 py-1">
<div class="shimmer-container w-6 h-6 rounded-full mb-1"></div>
<div class="shimmer-container w-8 h-3 rounded-xs"></div>
</div>
</nav>
</body></html>
