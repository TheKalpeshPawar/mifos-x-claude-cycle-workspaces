<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Beneficiaries Error State — Mifos X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#8F9285",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        "nav-active-indicator": "#DCE7C8",
                        "brand-accent": "#B2D188",
                        "brand-on-accent": "#1F3701"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        "pill": "9999px",
                        "md": "12px",
                        "lg": "16px"
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-active:active {
            transform: scale(0.96);
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Component 1: TopAppBar -->
<header class="fixed top-0 w-full h-[64px] bg-background z-50 flex items-center px-4">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors btn-active">
<span class="material-symbols-outlined text-[24px] text-brand-accent">arrow_back</span>
</button>
<div class="flex-grow text-center">
<h1 class="text-[18px] leading-[24px] font-medium text-on-surface tracking-tight">Beneficiaries</h1>
</div>
<div class="w-12"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col items-center justify-center px-8 pt-[64px]">
<!-- Component 2: Hero Illustration -->
<div class="relative w-[160px] h-[160px] flex items-center justify-center overflow-hidden mb-6">
<div class="absolute inset-0 bg-surface-variant/10 rounded-full blur-3xl opacity-30"></div>
<img alt="Error Illustration" class="w-[160px] h-[160px] object-contain relative z-10" src="https://lh3.googleusercontent.com/aida/ADBb0uib9SKBidhzU8ZMZZta8XXJJQhhgtxnJ1DxbRB4D4ch5fRPXd28H7ltIPj_8fhNWzHonBJLlh30S5nj_UiY_iuUpVozBxPtz4zWw3TYLdCRTeIz7grDQCpgjg4MA3cGwUA4XDvuvHxxlWVSHubFMtV6wmggU51TYriJxH4260shITnebM-_WAV2DwehJHm8CJi_TTQur3UjpXoOmIz4MVtc0XCOnrO-yGdCekHMqLSc6huxbKlFiURUslo"/>
</div>
<!-- Component 3: Title -->
<h2 class="text-[22px] leading-[28px] font-semibold text-on-surface text-center px-4 mb-2 max-w-[320px]">
            Could not load beneficiaries
        </h2>
<!-- Component 4: Body -->
<p class="text-[14px] leading-[20px] font-normal text-on-surface-variant text-center px-4 max-w-[294px]">
            Check your connection and try again. Your saved beneficiaries will appear once restored.
        </p>
<!-- Component 5: Primary Button -->
<div class="w-full mt-8 flex justify-center">
<button class="w-full max-w-[326px] h-[48px] bg-brand-accent text-brand-on-accent rounded-pill flex items-center justify-center gap-2 hover:brightness-110 transition-all btn-active shadow-lg shadow-black/20">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 600;">refresh</span>
<span class="text-[16px] font-semibold">Retry</span>
</button>
</div>
<!-- Component 6: Secondary Button -->
<button class="mt-4 py-2 px-6 text-[14px] font-medium text-on-surface-variant hover:text-on-surface transition-colors btn-active">
            Go back
        </button>
</main>
<!-- Bottom Navigation Suppression (Transactional/Error State Rule) -->
<!-- The prompt defines an error screen, which is task-focused/dead-end, thus nav shell is suppressed per Conflict Resolution Protocol -->
<script>
        // Micro-interaction for refresh button spin
        const retryBtn = document.querySelector('button.bg-brand-accent');
        if (retryBtn) {
            retryBtn.addEventListener('click', () => {
                const icon = retryBtn.querySelector('.material-symbols-outlined');
                icon.classList.add('animate-spin');
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                }, 1000);
            });
        }
    </script>
</body></html>
