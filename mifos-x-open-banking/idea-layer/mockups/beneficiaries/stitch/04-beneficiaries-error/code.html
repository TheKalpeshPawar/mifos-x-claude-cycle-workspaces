<h1 class="font-title-lg text-title-lg text-[#E0E3E8] tracking-tight">Beneficiaries</h1>

<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile -mt-16">

<script>
        // Simple micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.97)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });
