<!-- Visual Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle entrance animation for the empty state
            const emptyState = document.querySelector('section.flex-grow');
            emptyState.style.opacity = '0';
            emptyState.style.transform = 'translateY(10px)';
            emptyState.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
            
            setTimeout(() => {
                emptyState.style.opacity = '1';
                emptyState.style.transform = 'translateY(0)';
            }, 200);
        });
