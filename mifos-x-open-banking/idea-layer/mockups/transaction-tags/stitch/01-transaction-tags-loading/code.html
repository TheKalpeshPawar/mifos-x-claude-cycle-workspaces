<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-base {
            background: linear-gradient(90deg, #1E201A 25%, #282A24 50%, #1E201A 75%);
            background-size: 200% 100%;
            animation: shimmer 1200ms infinite linear;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#1a1c17",
                        "surface-container": "#1f201b",
                        "outline-variant": "#44483c",
                        "tertiary": "#ffd8f0",
                        "on-tertiary-fixed": "#35072e",
                        "secondary-fixed-dim": "#a0cfcb",
                        "tertiary-fixed": "#ffd7f0",
                        "on-secondary-fixed": "#00201e",
                        "secondary": "#a0cfcb",
                        "surface-dim": "#12140f",
                        "tertiary-container": "#f6b2e1",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#764069",
                        "on-primary-container": "#415a1f",
                        "primary-fixed": "#cdeda1",
                        "surface-container-lowest": "#0d0f0a",
                        "outline": "#8e9284",
                        "surface-variant": "#343530",
                        "on-surface": "#e3e3da",
                        "error-container": "#93000a",
                        "on-tertiary": "#4e1e44",
                        "on-error": "#690005",
                        "inverse-primary": "#4c662a",
                        "surface-bright": "#383a34",
                        "on-secondary-fixed-variant": "#1f4e4b",
                        "on-secondary-container": "#8fbeba",
                        "on-primary": "#203700",
                        "primary-container": "#b2d188",
                        "secondary-fixed": "#bcece7",
                        "tertiary-fixed-dim": "#f6b2e1",
                        "primary": "#ceeda2",
                        "surface-tint": "#b2d188",
                        "background": "#12140f",
                        "on-primary-fixed-variant": "#354e14",
                        "surface": "#12140f",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#102000",
                        "primary-fixed-dim": "#b2d188",
                        "on-secondary": "#013735",
                        "inverse-on-surface": "#2f312b",
                        "on-tertiary-fixed-variant": "#68355c",
                        "secondary-container": "#1f4e4b",
                        "inverse-surface": "#e3e3da",
                        "surface-container-high": "#292b25",
                        "on-surface-variant": "#c4c8b9",
                        "surface-container-highest": "#343530",
                        "on-background": "#e3e3da"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "lg": "24px",
                        "sm": "8px",
                        "xs": "4px",
                        "base": "4px",
                        "xl": "32px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "max-width": "1200px"
                    },
                    "fontFamily": {
                        "body-lg": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "label-lg": ["Outfit"],
                        "label-md": ["Outfit"],
                        "title-lg": ["Outfit"],
                        "title-md": ["Outfit"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</div>
<div class="shimmer-base w-[120px] h-[20px] rounded-lg"></div>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<main class="pt-20 px-margin-mobile max-w-lg mx-auto space-y-lg">
<!-- 1. Card Shimmer (Transaction Summary) -->
<section class="bg-surface-container rounded-xl p-md border border-outline-variant">
<div class="flex justify-between items-start mb-sm">
<div class="shimmer-base w-[200px] h-[18px] rounded"></div>
<div class="shimmer-base w-[80px] h-[22px] rounded"></div>
</div>
<div class="shimmer-base w-[140px] h-[12px] rounded mt-sm"></div>
</section>
<!-- 2. Section Shimmer (Title & Hint) -->
<section class="space-y-xs">
<div class="shimmer-base w-[40px] h-[14px] rounded"></div>
<div class="shimmer-base w-[120px] h-[12px] rounded opacity-60"></div>
</section>
<!-- 3. Chip Row Shimmer -->
<section class="flex gap-sm overflow-x-hidden">
<div class="shimmer-base w-[80px] h-[32px] rounded-full shrink-0"></div>
<div class="shimmer-base w-[80px] h-[32px] rounded-full shrink-0"></div>
<div class="shimmer-base w-[80px] h-[32px] rounded-full shrink-0"></div>
<div class="shimmer-base w-[80px] h-[32px] rounded-full shrink-0"></div>
<div class="shimmer-base w-[80px] h-[32px] rounded-full shrink-0"></div>
</section>
<!-- 4. Input Shimmer (Add New Tag) -->
<section>
<div class="shimmer-base w-full h-[56px] rounded-lg border border-outline-variant/30"></div>
</section>
<!-- 5. Notes Shimmer -->
<section>
<div class="shimmer-base w-full h-[80px] rounded-lg border border-outline-variant/30"></div>
</section>
<!-- 6. List Row Shimmers (Transaction Categories) -->
<section class="space-y-md">
<!-- Row 1 -->
<div class="flex items-center gap-md">
<div class="shimmer-base w-[24px] h-[24px] rounded-full shrink-0"></div>
<div class="space-y-xs">
<div class="shimmer-base w-[120px] h-[14px] rounded"></div>
<div class="shimmer-base w-[160px] h-[12px] rounded opacity-60"></div>
</div>
</div>
<!-- Row 2 -->
<div class="flex items-center gap-md">
<div class="shimmer-base w-[24px] h-[24px] rounded-full shrink-0"></div>
<div class="space-y-xs">
<div class="shimmer-base w-[120px] h-[14px] rounded"></div>
<div class="shimmer-base w-[160px] h-[12px] rounded opacity-60"></div>
</div>
</div>
<!-- Row 3 -->
<div class="flex items-center gap-md">
<div class="shimmer-base w-[24px] h-[24px] rounded-full shrink-0"></div>
<div class="space-y-xs">
<div class="shimmer-base w-[120px] h-[14px] rounded"></div>
<div class="shimmer-base w-[160px] h-[12px] rounded opacity-60"></div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container/90 backdrop-blur-md border-t border-outline-variant flex justify-around items-center h-20 px-margin-mobile pb-safe">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-label-md text-label-md">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-md text-label-md">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Profile</span>
</div>
</nav>
<script>
        // Micro-interaction for shimmer speed adjustment or simple fade-in
        window.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main');
            mainContent.style.opacity = '0';
            setTimeout(() => {
                mainContent.style.transition = 'opacity 400ms ease-in';
                mainContent.style.opacity = '1';
            }, 50);
        });
    </script>
</body></html>
