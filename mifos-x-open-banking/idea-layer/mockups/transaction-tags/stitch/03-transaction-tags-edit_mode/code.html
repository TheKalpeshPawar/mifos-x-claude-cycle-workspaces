<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Transaction Tags</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#cdeda1",
                    "surface-tint": "#b2d188",
                    "error-container": "#93000a",
                    "tertiary": "#ffdeae",
                    "surface-dim": "#12140e",
                    "background": "#12140e",
                    "on-primary-container": "#415a1f",
                    "outline-variant": "#44483c",
                    "secondary-fixed": "#bcece7",
                    "on-secondary-container": "#8fbeba",
                    "on-primary-fixed": "#102000",
                    "surface-container-lowest": "#0d0f09",
                    "surface-container-highest": "#34362e",
                    "tertiary-fixed": "#ffdeae",
                    "on-surface": "#e3e3d9",
                    "surface-container-high": "#292b24",
                    "inverse-primary": "#4c662a",
                    "on-surface-variant": "#c4c8b9",
                    "surface-container": "#1e201a",
                    "on-secondary-fixed-variant": "#1f4e4b",
                    "on-primary-fixed-variant": "#354e14",
                    "surface-container-low": "#1a1c16",
                    "on-tertiary-fixed-variant": "#604100",
                    "on-error": "#690005",
                    "outline": "#8e9284",
                    "secondary-container": "#1f4e4b",
                    "primary-container": "#b2d188",
                    "surface": "#12140e",
                    "on-primary": "#203700",
                    "secondary-fixed-dim": "#a0cfcb",
                    "on-secondary-fixed": "#00201e",
                    "primary": "#ceeda2",
                    "surface-bright": "#383a33",
                    "inverse-on-surface": "#2f312a",
                    "on-error-container": "#ffdad6",
                    "on-tertiary": "#432c00",
                    "error": "#ffb4ab",
                    "on-background": "#e3e3d9",
                    "tertiary-container": "#ffba3f",
                    "primary-fixed-dim": "#b2d188",
                    "on-tertiary-fixed": "#281900",
                    "on-secondary": "#013735",
                    "inverse-surface": "#e3e3d9",
                    "surface-variant": "#34362e",
                    "secondary": "#a0cfcb",
                    "on-tertiary-container": "#704c00",
                    "tertiary-fixed-dim": "#ffba3e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "32px",
                    "margin-mobile": "16px",
                    "base": "4px",
                    "lg": "24px",
                    "max-width": "1440px",
                    "md": "16px",
                    "sm": "8px",
                    "xs": "4px",
                    "xl": "32px",
                    "2xl": "48px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "headline-lg": ["Outfit"],
                    "title-md": ["Outfit"],

                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}]

          },
        },
      }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased scrollbar-hide">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface z-50 flex items-center justify-between px-margin-mobile h-16 transition-opacity duration-200">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:opacity-80">
<span class="material-symbols-outlined text-outline" data-icon="close">close</span>
</button>
<h1 class="font-title-lg text-on-surface text-[18px] font-medium">Edit Tags</h1>
<button class="font-label-lg text-primary px-2 py-1 rounded-lg hover:bg-primary-container/10 transition-colors active:opacity-80">
            Done
        </button>
</header>
<main class="pt-20 pb-24 px-margin-mobile max-w-xl mx-auto space-y-lg">
<!-- Transaction Card -->
<section class="bg-surface-container rounded-xl p-md border border-outline-variant/30 flex justify-between items-center">
<div class="flex flex-col gap-1">
<h2 class="font-title-md text-on-surface font-semibold text-[16px]">Whole Foods Market</h2>
<p class="font-label-sm text-outline text-[12px] font-normal">23 May 2026 at 14:32</p>
</div>
<div class="text-error font-headline-lg text-[18px] font-bold">
                -£67.84
            </div>
</section>
<!-- Tags Section -->
<section class="space-y-md">
<div class="flex flex-col gap-1">
<label class="font-label-lg text-on-surface-variant">Tags</label>
<p class="font-label-sm text-outline">Tap a tag to remove it</p>
</div>
<div class="flex flex-wrap gap-2">
<!-- Active/Filled Chip -->
<div class="flex items-center gap-1 px-3 py-1.5 bg-on-primary-fixed-variant rounded-full group cursor-pointer active:scale-95 transition-transform">
<span class="text-body-md text-primary-fixed font-medium">#groceries</span>
<span class="material-symbols-outlined text-primary-fixed text-[16px]" data-icon="close">close</span>
</div>
<!-- Outlined Chips -->
<div class="flex items-center gap-1 px-3 py-1.5 border border-outline-variant rounded-full cursor-pointer hover:bg-surface-container-high transition-colors active:scale-95">
<span class="text-body-md text-on-surface-variant">#work-expense</span>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="close">close</span>
</div>
<div class="flex items-center gap-1 px-3 py-1.5 border border-outline-variant rounded-full cursor-pointer hover:bg-surface-container-high transition-colors active:scale-95">
<span class="text-body-md text-on-surface-variant">#rent</span>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="close">close</span>
</div>
<div class="flex items-center gap-1 px-3 py-1.5 border border-outline-variant rounded-full cursor-pointer hover:bg-surface-container-high transition-colors active:scale-95">
<span class="text-body-md text-on-surface-variant">#holiday</span>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="close">close</span>
</div>
<div class="flex items-center gap-1 px-3 py-1.5 border border-outline-variant rounded-full cursor-pointer hover:bg-surface-container-high transition-colors active:scale-95">
<span class="text-body-md text-on-surface-variant">#gym</span>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="close">close</span>
</div>
</div>
</section>
<!-- Add Tag Field -->
<section class="space-y-sm">
<label class="font-label-lg text-on-surface-variant block px-1">Add new tag</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-high border-2 border-primary-fixed rounded-xl py-3 px-4 text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-0 transition-shadow" placeholder="e.g. dinner" type="text"/>
<button class="absolute right-2 px-4 py-1.5 bg-primary text-on-primary rounded-lg font-label-lg font-semibold active:scale-95 transition-transform">
                    Add
                </button>
</div>
</section>
<!-- Notes Field -->
<section class="space-y-sm">
<label class="font-label-lg text-on-surface-variant block px-1">Notes</label>
<textarea class="w-full bg-surface-container rounded-xl border border-outline-variant p-4 text-on-surface text-[14px] leading-relaxed min-h-[80px] focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" placeholder="Add a note...">Grocery run for the week, includes meal prep.</textarea>
</section>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile bg-background/80 backdrop-blur-md">
<button class="w-full bg-primary-container text-on-primary-container font-label-lg font-bold py-4 rounded-full shadow-lg active:scale-[0.98] transition-all hover:brightness-110">
            Save Changes
        </button>
</footer>
<!-- Decorative atmospheric element -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden -z-10">
<div class="absolute -top-[20%] -right-[10%] w-[60%] h-[60%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[50%] h-[50%] bg-secondary/5 blur-[100px] rounded-full"></div>
</div>
<script>
        // Simple interactivity for demonstration
        document.querySelectorAll('.cursor-pointer').forEach(chip => {
            chip.addEventListener('click', function() {
                this.style.opacity = '0.5';
                this.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    this.remove();
                }, 200);
            });
        });

        // Sticky header background shift on scroll
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md', 'bg-surface-container-low');
                header.classList.remove('bg-surface');
            } else {
                header.classList.remove('shadow-md', 'bg-surface-container-low');
                header.classList.add('bg-surface');
            }
        });
    </script>
</body></html>
