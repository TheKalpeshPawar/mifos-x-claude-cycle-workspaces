<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Application Detail Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4C662B",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CDEDA3",
                        "on-primary-container": "#102000",
                        "secondary": "#386663",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#BCEBE7",
                        "on-secondary-container": "#00201E",
                        "error": "#BA1A1A",
                        "background": "#12140E",
                        "surface": "#1A1C16",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#C5C8BA",
                        "outline": "#8F9285",
                        "outline-variant": "#44483D",
                        "custom-green": "#B2D188",
                        "custom-dark-green": "#1F3701"
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'unit': '8px'
                    },
                    fontFamily: {
                        "headline": ["Outfit", "Public Sans", "sans-serif"],
                        "display": ["Outfit", "Public Sans", "sans-serif"],
                        "body": ["Outfit", "Public Sans", "sans-serif"],
                        "label": ["Outfit", "Public Sans", "sans-serif"]
                    },
                    fontSize: {
                        "headline-sm": ["24px", "32px"],
                        "label-lg": ["14px", "20px"],
                        "label-sm": ["11px", "16px"],
                        "title-large": ["22px", "28px"],
                        "body-large": ["16px", "24px"],
                        "body-medium": ["14px", "20px"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-retry:active {
            transform: scale(0.97);
            transition: transform 0.1s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 right-0 h-[64px] bg-[#12140E] border-b border-[#44483D] flex items-center px-4 z-50">
<button class="w-12 h-12 flex items-center justify-start text-[#B2D188]">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-medium text-[18px] text-[#E3E3D8] pr-12">
            Application Detail
        </h1>
</header>
<!-- Content Canvas -->
<main class="w-full max-w-[390px] flex flex-col items-center px-8 pt-[128px]">
<!-- Hero Section -->
<div class="relative w-[160px] h-[140px] flex items-center justify-center">
<img alt="Illustration of a disconnected server stack and a stack of documents with a large X over them" class="w-full h-full object-contain opacity-90 drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida/ADBb0uh0rsPZtb7ARq14j21ir07HxjGiHS4Dw4eJ8CkDIKUPuBC9NQkUx9JXtWFc7TV_DTW4IGFAIBt43qCkjB3YMp5D6GCNw9Kh_-j1ELQOi_WdNNScESbe-b67naXR0K8Ejtv1t5KzUXxQI22VQX47hsvUDI1EoqroUnMw9u_z50RZtoLbLINzzc4IHoZkaJL2tCs5Ft4u-Js-9xoF0eAWiMK2irzeaIUXtVN6Aaj3rPgY-Y_pPo9-uf_cmoua"/>
<!-- Subtle atmospheric glow for high-end UI feel -->
<div class="absolute inset-0 bg-primary/5 blur-[40px] rounded-full -z-10"></div>
</div>
<!-- Headline -->
<h2 class="mt-6 text-[22px] font-semibold text-[#E3E3D8] text-center leading-tight max-w-[280px]">
            Could not load application
        </h2>
<!-- Body Text -->
<p class="mt-2 text-[14px] leading-[20px] text-[#C5C8BA] text-center font-normal">
            Check your connection and try again. Application data is saved securely.
        </p>
<!-- Action Section -->
<div class="w-full flex flex-col mt-[32px]">
<!-- Retry Button -->
<button class="btn-retry h-[48px] bg-[#B2D188] rounded-[24px] flex items-center justify-center gap-2 transition-all duration-200 hover:brightness-105 active:brightness-95">
<span class="material-symbols-outlined text-[20px] text-[#1F3701]">refresh</span>
<span class="text-[16px] font-semibold text-[#1F3701]">Retry</span>
</button>
<!-- Go Back Button -->
<button class="mt-4 py-2 text-[14px] font-medium text-[#8F9285] hover:text-[#E3E3D8] transition-colors duration-200 text-center">
                Go back
            </button>
</div>
<!-- Decorative background elements -->
<div class="fixed bottom-0 left-0 w-full overflow-hidden pointer-events-none -z-10">
<div class="absolute bottom-[-100px] left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full"></div>
</div>
</main>
<!-- Bottom Navigation Shell Suppression (Transactional/Error State) -->
<!-- Navigation is suppressed per "Relevance Check" rule for Error screens -->
<script>
        // Micro-interaction for the refresh button rotation
        const retryBtn = document.querySelector('.btn-retry');
        const refreshIcon = retryBtn?.querySelector('.material-symbols-outlined');

        if (retryBtn && refreshIcon) {
            retryBtn.addEventListener('click', () => {
                refreshIcon.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                refreshIcon.style.transform = 'rotate(180deg)';
                
                // Simulate a loading state transition
                retryBtn.style.opacity = '0.8';
                retryBtn.innerText = 'Retrying...';
                
                setTimeout(() => {
                    refreshIcon.style.transform = 'rotate(0deg)';
                    retryBtn.style.opacity = '1';
                    retryBtn.innerHTML = `
                        <span class="material-symbols-outlined text-[20px] text-[#1F3701]" style="font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;">refresh</span>
                        <span class="text-[16px] font-semibold text-[#1F3701]">Retry</span>
                    `;
                }, 1000);
            });
        }
    </script>
</body></html>
