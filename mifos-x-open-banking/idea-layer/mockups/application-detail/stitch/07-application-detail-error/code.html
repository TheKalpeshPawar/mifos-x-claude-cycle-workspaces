<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Application Detail - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CDEDA3",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        "on-secondary-container": "#00201E",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "on-surface": "#E3E3D8",
                        "surface-variant": "#44483D",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#8F9285",
                        "outline-variant": "#44483D",
                        "custom-green": "#B2D188",
                        "custom-dark-green": "#1F3701"
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'base': '16px',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        body: ['Outfit', 'sans-serif'],
                    },
                    fontSize: {
                        'title-lg': ['22px', '28px'],
                        'headline-sm': ['24px', '32px'],
                        'label-lg': ['14px', '20px'],
                    }
                }
            }
        };
    </script>
<style>
        body {
            background-color: #12140E;
            color: #E3E3D8;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .nav-divider {
            border-bottom: 1px solid #44483D;
        }
    </style>
</head>
<body class="dark bg-background text-on-surface">
<!-- Top App Bar -->
<header class="fixed top-0 w-full h-16 bg-[#12140E] flex items-center justify-between px-4 z-50 nav-divider">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#B2D188]" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="font-medium text-[18px] text-[#E3E3D8] absolute left-1/2 -translate-x-1/2">Application Detail</h1>
<button aria-label="Refresh" class="flex items-center justify-center w-12 h-12 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#B2D188]" style="font-size: 24px;">refresh</span>
</button>
</header>
<main class="flex flex-col items-center justify-start min-h-screen pt-16 px-6">
<!-- Hero Section -->
<section class="mt-[64px] flex flex-col items-center">
<div class="w-[160px] h-[140px] flex items-center justify-center overflow-hidden rounded-xl">
<img alt="Illustration of a broken document and disconnected link" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uh9ORqckXiGYYTqE4YPrzp4iBFy2a0MRbyoF8rESpHe91RROCB1Jzs4H2r00nYIBc_tbn9uBqOL3l_rLZq7NwVDu40ofbOgS9JIbjLYEAUxXmAFX1c9pMRjUHKoBXgD9C-gbcjSXIMG4CHfGYrupW__CMrFBPBTLTCuvGvu5Q2WGDaoqjIPXSB4cDZh9TdQglYLSoZWH9LBxSprkyWT4YVebKgqClmBqq048USHMJU_0f9BNyZgKVSX6BQ"/>
</div>
</section>
<!-- Error Message Content -->
<section class="mt-6 text-center max-w-[320px]">
<h2 class="font-semibold text-[22px] leading-tight text-[#E3E3D8]">
                Could not load application
            </h2>
<p class="mt-2 text-[14px] leading-[20px] text-[#C5C8BA] font-normal">
                Check your connection and try again. Application data is saved securely.
            </p>
</section>
<!-- Actions -->
<section class="mt-8 flex flex-col items-center w-full">
<!-- Primary Action -->
<button class="flex items-center justify-center gap-2 h-12 px-8 bg-[#B2D188] rounded-full active:scale-[0.98] transition-all hover:brightness-110 shadow-lg">
<span class="material-symbols-outlined text-[#1F3701]" style="font-size: 20px;">refresh</span>
<span class="font-semibold text-[16px] text-[#1F3701]">Retry</span>
</button>
<!-- Secondary Action -->
<button class="mt-4 px-6 py-2 font-medium text-[14px] text-[#8F9285] active:opacity-70 transition-opacity">
                Go back
            </button>
</section>
</main>
<!-- Bottom Navigation (Filtered: Transactional Error Page, so NavBar is suppressed per mandate) -->
<script>
        // Subtle atmospheric interaction: pulse effect on retry button when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const retryBtn = document.querySelector('button.bg-\\[\\#B2D188\\]');
            if (retryBtn) {
                retryBtn.animate([
                    { transform: 'scale(1)', opacity: 1 },
                    { transform: 'scale(1.02)', opacity: 0.95 },
                    { transform: 'scale(1)', opacity: 1 }
                ], {
                    duration: 2000,
                    iterations: 1,
                    easing: 'ease-in-out'
                });
            }
        });

        // Click interaction for Retry button
        const retryButton = document.querySelector('button.bg-\\[\\#B2D188\\]');
        retryButton.addEventListener('click', () => {
            retryButton.classList.add('opacity-50');
            retryButton.innerHTML = `
                <span class="material-symbols-outlined animate-spin text-[#1F3701]" style="font-size: 20px;">sync</span>
                <span class="font-semibold text-[16px] text-[#1F3701]">Retrying...</span>
            `;
            setTimeout(() => {
                location.reload();
            }, 1500);
        });
    </script>
</body></html>
