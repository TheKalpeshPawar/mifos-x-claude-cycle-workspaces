<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Application Detail Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "on-surface": "#1A1C16",
                        "on-surface-variant": "#44483D",
                        "outline-variant": "#C5C8BA",
                        dark: {
                            bg: "#12140E",
                            surface: "#1A1C16",
                            outline: "#44483D",
                            text: "#E3E3D8",
                            subtext: "#C5C8BA",
                            primary: "#B2D188",
                            onPrimary: "#1F3701",
                            secondary: "#8F9285"
                        }
                    },
                    borderRadius: {
                        "none": "0",
                        "xs": "4px",
                        "sm": "8px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px",
                        "pill": "9999px"
                    },
                    fontFamily: {
                        body: ["Outfit", "sans-serif"],
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            -webkit-font-smoothing: antialiased;
        }
        .btn-interaction {
            transition: all 200px cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-interaction:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-dark-bg text-dark-text min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full h-16 flex items-center px-4 bg-[#12140E] border-b border-[#44483D] sticky top-0 z-50">
<div class="flex items-center justify-between w-full relative">
<button aria-label="Go back" class="p-2 btn-interaction text-[#B2D188] flex items-center justify-center rounded-full hover:bg-white/5">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 font-medium text-[18px] text-[#E3E3D8] whitespace-nowrap">
                Application Detail
            </h1>
<!-- Trailing Space for balance -->
<div class="w-10"></div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6 text-center max-w-md mx-auto w-full">
<!-- Hero Illustration -->
<div class="mb-12 flex justify-center items-center h-[140px] w-[160px] overflow-hidden rounded-lg">
<img alt="Connection error illustration" class="w-full h-full object-contain" loading="lazy" src="https://lh3.googleusercontent.com/aida/ADBb0uh0rsPZtb7ARq14j21ir07HxjGiHS4Dw4eJ8CkDIKUPuBC9NQkUx9JXtWFc7TV_DTW4IGFAIBt43qCkjB3YMp5D6GCNw9Kh_-j1ELQOi_WdNNScESbe-b67naXR0K8Ejtv1t5KzUXxQI22VQX47hsvUDI1EoqroUnMw9u_z50RZtoLbLINzzc4IHoZkaJL2tCs5Ft4u-Js-9xoF0eAWiMK2irzeaIUXtVN6Aaj3rPgY-Y_pPo9-uf_cmoua"/>
</div>
<!-- Headline -->
<h2 class="text-[22px] font-semibold leading-tight text-[#E3E3D8] mb-2 px-4">
            Could not load application
        </h2>
<!-- Subtitle -->
<p class="text-[14px] font-regular leading-relaxed text-[#C5C8BA] mb-10 max-w-[280px]">
            Check your connection and try again. Application data is saved securely.
        </p>
<!-- Primary Action -->
<button class="w-full h-12 bg-[#B2D188] rounded-pill flex items-center justify-center gap-2 btn-interaction mb-4">
<span class="material-symbols-outlined text-[#1F3701] text-[20px]" data-icon="refresh">refresh</span>
<span class="text-[#1F3701] font-semibold text-[16px]">Retry</span>
</button>
<!-- Secondary Action -->
<button class="btn-interaction">
<span class="text-[#8F9285] font-medium text-[14px]">Go back</span>
</button>
</main>
<!-- Decorative Bottom Gradient for Depth -->
<div class="fixed bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-[#12140E] to-transparent pointer-events-none"></div>
<!-- Script for minor interactions -->
<script>
        // Simple logic for the retry button to simulate a loading state before returning to error
        const retryBtn = document.querySelector('button.bg-[#B2D188]');
        retryBtn.addEventListener('click', () => {
            const originalContent = retryBtn.innerHTML;
            retryBtn.innerHTML = `
                <div class="flex items-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-[#1F3701]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-[#1F3701] font-semibold text-[16px]">Retrying...</span>
                </div>
            `;
            retryBtn.disabled = true;
            retryBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                retryBtn.innerHTML = originalContent;
                retryBtn.disabled = false;
                retryBtn.classList.remove('opacity-80');
            }, 1500);
        });

        // Simple back navigation logic
        const backBtn = document.querySelector('button[aria-label="Go back"]');
        const goBackTextBtn = document.querySelector('button span.text-[#8F9285]');
        
        const goBack = () => {
            console.log('Navigating back to Application List...');
            // In a real app: window.history.back();
        };

        backBtn.addEventListener('click', goBack);
        goBackTextBtn.parentElement.addEventListener('click', goBack);
    </script>
</body></html>
