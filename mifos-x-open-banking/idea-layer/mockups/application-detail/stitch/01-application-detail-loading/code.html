<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Application Detail Skeleton</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1E201A",
                        "surface-variant": "#282A24",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        "on-surface": "#EAECE1",
                        "on-surface-variant": "#44483D",
                    },
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'base': '16px',
                    },
                    animation: {
                        'shimmer-sweep': 'sweep 1200ms infinite linear',
                    },
                    keyframes: {
                        sweep: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #EAECE1;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .skeleton-shimmer {
            position: relative;
            overflow: hidden;
            background-color: #282A24;
        }

        .skeleton-shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.05) 50%,
                transparent 100%
            );
            animation: sweep 1200ms infinite linear;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-16 flex items-center justify-between px-4 z-50 bg-[#12140E]">
<div class="flex items-center">
<div class="skeleton-shimmer w-6 h-6 rounded-full"></div>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<div class="skeleton-shimmer w-[180px] h-[18px] rounded-sm"></div>
</div>
<div class="flex items-center">
<div class="skeleton-shimmer w-6 h-6 rounded-full opacity-50"></div>
</div>
</header>
<main class="pt-20 pb-24 px-4 max-w-md mx-auto">
<!-- Card 1: Overview -->
<section class="mt-4 bg-surface rounded-[12px] p-4 border border-surface-variant">
<div class="skeleton-shimmer w-20 h-3 rounded-sm mb-6"></div>
<div class="flex items-center justify-between h-14">
<div class="skeleton-shimmer w-[140px] h-4 rounded-sm"></div>
<div class="skeleton-shimmer w-20 h-3.5 rounded-sm"></div>
</div>
</section>
<!-- Card 2: Application Details -->
<section class="mt-3 bg-surface rounded-[12px] p-4 border border-surface-variant">
<div class="skeleton-shimmer w-32 h-3 rounded-sm mb-4"></div>
<!-- Row 1 -->
<div class="flex items-center justify-between h-14 border-b border-surface-variant">
<div class="skeleton-shimmer w-20 h-3.5 rounded-sm"></div>
<div class="skeleton-shimmer w-[140px] h-3.5 rounded-sm"></div>
</div>
<!-- Row 2 -->
<div class="flex items-center justify-between h-14 border-b border-surface-variant">
<div class="skeleton-shimmer w-20 h-3.5 rounded-sm"></div>
<div class="skeleton-shimmer w-[100px] h-3.5 rounded-sm"></div>
</div>
<!-- Row 3 -->
<div class="flex items-center justify-between h-14">
<div class="skeleton-shimmer w-[60px] h-3.5 rounded-sm"></div>
<div class="skeleton-shimmer w-[180px] h-3.5 rounded-sm"></div>
</div>
</section>
<!-- List Row: Identity Verification -->
<section class="mt-3 bg-surface rounded-[12px] h-12 px-4 flex items-center space-x-3 border border-surface-variant">
<div class="skeleton-shimmer w-5 h-5 rounded-full"></div>
<div class="skeleton-shimmer w-40 h-3.5 rounded-sm"></div>
</section>
<!-- Card 3: Documents -->
<section class="mt-4 bg-surface rounded-[12px] p-4 border border-surface-variant">
<div class="skeleton-shimmer w-[140px] h-3 rounded-sm mb-4"></div>
<!-- Doc Row 1 -->
<div class="flex items-center h-16 border-b border-surface-variant">
<div class="skeleton-shimmer w-10 h-10 rounded-[4px] shrink-0"></div>
<div class="ml-4 flex-1 space-y-2">
<div class="skeleton-shimmer w-32 h-3.5 rounded-sm"></div>
<div class="skeleton-shimmer w-24 h-2.5 rounded-sm opacity-60"></div>
</div>
<div class="skeleton-shimmer w-12 h-8 rounded-[8px]"></div>
</div>
<!-- Doc Row 2 -->
<div class="flex items-center h-16">
<div class="skeleton-shimmer w-10 h-10 rounded-[4px] shrink-0"></div>
<div class="ml-4 flex-1 space-y-2">
<div class="skeleton-shimmer w-28 h-3.5 rounded-sm"></div>
<div class="skeleton-shimmer w-32 h-2.5 rounded-sm opacity-60"></div>
</div>
<div class="skeleton-shimmer w-12 h-8 rounded-[8px]"></div>
</div>
</section>
<!-- Large Text Area Shimmer: Notes/Comments -->
<section class="mt-4 bg-surface rounded-[12px] h-24 p-4 border border-surface-variant">
<div class="skeleton-shimmer w-1/3 h-3 rounded-sm mb-3 opacity-50"></div>
<div class="skeleton-shimmer w-full h-3 rounded-sm opacity-20"></div>
</section>
<!-- Action Button Shimmer -->
<section class="mt-4">
<div class="skeleton-shimmer w-full h-12 rounded-full"></div>
</section>
</main>
<!-- Bottom Navigation Mockup for Context -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-[#12140E] flex justify-around items-center px-4 pb-safe border-t border-surface-variant/30">
<div class="flex flex-col items-center gap-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full opacity-40"></div>
<div class="skeleton-shimmer w-8 h-2 rounded-sm opacity-40"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full opacity-40"></div>
<div class="skeleton-shimmer w-12 h-2 rounded-sm opacity-40"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full opacity-40"></div>
<div class="skeleton-shimmer w-12 h-2 rounded-sm opacity-40"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full opacity-40"></div>
<div class="skeleton-shimmer w-10 h-2 rounded-sm opacity-40"></div>
</div>
</nav>
<script>
        // Simple logic to ensure height and specific spacing rules from JSON/instructions are respected
        window.addEventListener('DOMContentLoaded', () => {
            // Placeholder for any micro-interactions if necessary
        });
    </script>
</body></html>
