<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#1a1c16",
                    "secondary-container": "#1f4e4b",
                    "on-tertiary-fixed-variant": "#6c3832",
                    "on-surface-variant": "#c4c8b9",
                    "on-surface": "#e3e3d9",
                    "surface": "#12140e",
                    "surface-container-high": "#292b24",
                    "on-secondary-fixed-variant": "#1f4e4b",
                    "on-tertiary-container": "#7a433d",
                    "inverse-primary": "#4c662a",
                    "primary-container": "#b2d188",
                    "on-background": "#e3e3d9",
                    "primary-fixed-dim": "#b2d188",
                    "secondary": "#a0cfcb",
                    "surface-container-highest": "#34362e",
                    "on-secondary-container": "#8fbeba",
                    "on-tertiary": "#51221d",
                    "inverse-on-surface": "#2f312a",
                    "surface-bright": "#383a33",
                    "on-primary": "#203700",
                    "tertiary": "#ffdad6",
                    "tertiary-fixed": "#ffdad5",
                    "error": "#ffb4ab",
                    "error-container": "#93000a",
                    "on-error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#ffb4ab",
                    "surface-dim": "#12140e",
                    "on-secondary": "#013735",
                    "surface-container-lowest": "#0d0f09",
                    "primary-fixed": "#cdeda1",
                    "primary": "#ceeda2",
                    "secondary-fixed-dim": "#a0cfcb",
                    "on-primary-container": "#415a1f",
                    "on-primary-fixed": "#102000",
                    "on-secondary-fixed": "#00201e",
                    "on-error": "#690005",
                    "outline": "#8e9284",
                    "background": "#12140e",
                    "surface-container": "#1e201a",
                    "secondary-fixed": "#bcece7",
                    "on-primary-fixed-variant": "#354e14",
                    "outline-variant": "#44483c",
                    "tertiary-container": "#ffb4ab",
                    "on-tertiary-fixed": "#360e0a",
                    "inverse-surface": "#e3e3d9",
                    "surface-variant": "#34362e",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "32px",
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "container-max-width": "1280px"
            },
            "fontFamily": {
                    "title-md": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "label-lg": ["Hanken Grotesk"],
                    "display-lg": ["Hanken Grotesk"],
                    "title-lg": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"]
            }
          },
        },
      }
    </script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-shimmer {
            background: linear-gradient(90deg, #1E201A 25%, #282A24 50%, #1E201A 75%);
            background-size: 200% 100%;
            animation: shimmer 1200ms infinite linear;
        }

        body {
            background-color: #12140E;
            color: #E3E3D9;
            font-family: 'Hanken Grotesk', sans-serif;
            margin: 0;
            padding: 0;
        }

        .divider {
            height: 1px;
            background-color: #282A24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="dark overflow-x-hidden">
<!-- App Bar -->
<header class="fixed top-0 left-0 right-0 h-16 bg-surface flex items-center justify-between px-margin-mobile z-50">
<div class="skeleton-shimmer w-6 h-6 rounded-full"></div>
<div class="skeleton-shimmer w-[180px] h-[18px] rounded-sm"></div>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<main class="pt-20 pb-24 px-margin-mobile max-w-container-max-width mx-auto">
<!-- Card 1 (Applicant) -->
<section class="mt-4 p-4 rounded-xl bg-surface-container">
<div class="skeleton-shimmer w-[80px] h-3 rounded-sm mb-4"></div>
<div class="flex items-center justify-between h-14">
<div class="skeleton-shimmer w-[140px] h-4 rounded-sm"></div>
<div class="skeleton-shimmer w-[80px] h-[14px] rounded-sm"></div>
</div>
</section>
<!-- Card 2 (Details) -->
<section class="mt-3 rounded-xl bg-surface-container overflow-hidden">
<div class="p-4 pb-2">
<div class="skeleton-shimmer w-[120px] h-3 rounded-sm"></div>
</div>
<div class="px-4">
<!-- Row 1 -->
<div class="flex items-center justify-between h-14">
<div class="skeleton-shimmer w-[80px] h-[14px] rounded-sm"></div>
<div class="skeleton-shimmer w-[140px] h-[14px] rounded-sm"></div>
</div>
<div class="divider"></div>
<!-- Row 2 -->
<div class="flex items-center justify-between h-14">
<div class="skeleton-shimmer w-[80px] h-[14px] rounded-sm"></div>
<div class="skeleton-shimmer w-[100px] h-[14px] rounded-sm"></div>
</div>
<div class="divider"></div>
<!-- Row 3 -->
<div class="flex items-center justify-between h-14">
<div class="skeleton-shimmer w-[60px] h-[14px] rounded-sm"></div>
<div class="skeleton-shimmer w-[180px] h-[14px] rounded-sm"></div>
</div>
</div>
</section>
<!-- List Row (Status) -->
<section class="mt-3 p-4 h-12 rounded-xl bg-surface-container flex items-center gap-3">
<div class="skeleton-shimmer w-5 h-5 rounded-full"></div>
<div class="skeleton-shimmer w-[160px] h-[14px] rounded-sm"></div>
</section>
<!-- Card 3 (Documents) -->
<section class="mt-4 rounded-xl bg-surface-container overflow-hidden">
<div class="p-4 pb-2">
<div class="skeleton-shimmer w-[140px] h-3 rounded-sm"></div>
</div>
<div class="px-4">
<!-- Row 1 -->
<div class="flex items-center gap-3 h-16">
<div class="skeleton-shimmer w-10 h-10 rounded-lg shrink-0"></div>
<div class="flex flex-col gap-1.5 flex-1">
<div class="skeleton-shimmer w-[60%] h-[12px] rounded-sm"></div>
<div class="skeleton-shimmer w-[40%] h-[10px] rounded-sm"></div>
</div>
<div class="skeleton-shimmer w-12 h-8 rounded-lg shrink-0"></div>
</div>
<div class="divider"></div>
<!-- Row 2 -->
<div class="flex items-center gap-3 h-16">
<div class="skeleton-shimmer w-10 h-10 rounded-lg shrink-0"></div>
<div class="flex flex-col gap-1.5 flex-1">
<div class="skeleton-shimmer w-[55%] h-[12px] rounded-sm"></div>
<div class="skeleton-shimmer w-[35%] h-[10px] rounded-sm"></div>
</div>
<div class="skeleton-shimmer w-12 h-8 rounded-lg shrink-0"></div>
</div>
</div>
</section>
<!-- Text Area -->
<section class="mt-4 p-4 h-24 rounded-xl bg-surface-container">
<div class="skeleton-shimmer w-full h-full rounded-lg"></div>
</section>
<!-- Button -->
<section class="mt-4 h-12">
<div class="skeleton-shimmer w-full h-full rounded-[24px]"></div>
</section>
</main>
<!-- Bottom Navigation Mock -->
<nav class="fixed bottom-0 left-0 right-0 h-16 bg-surface-container border-t border-outline-variant flex justify-around items-center px-4 z-50">
<div class="flex flex-col items-center gap-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full"></div>
<div class="skeleton-shimmer w-8 h-2 rounded-sm"></div>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container rounded-full px-5 py-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full bg-on-secondary-container"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full"></div>
<div class="skeleton-shimmer w-8 h-2 rounded-sm"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-shimmer w-6 h-6 rounded-full"></div>
<div class="skeleton-shimmer w-8 h-2 rounded-sm"></div>
</div>
</nav>
<script>
        // Micro-interaction: Periodic "pulse" effect on the entire skeleton system
        // for an atmospheric loading feel beyond the shimmer itself.
        document.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main');
            let opacity = 1;
            let direction = -1;

            setInterval(() => {
                opacity += 0.05 * direction;
                if (opacity <= 0.85) direction = 1;
                if (opacity >= 1) direction = -1;
                mainContent.style.opacity = opacity;
            }, 100);
        });
    </script>
</body></html>
