<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Application Details Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "on-surface-variant": "#44483D",
                        "outline-variant": "#C5C8BA",
                        dark: {
                            bg: "#12140E",
                            base: "#1E201A",
                            pulse: "#282A24",
                            divider: "#282A24"
                        }
                    },
                    borderRadius: {
                        "small": "4px",
                        "medium": "12px",
                        "large": "16px",
                        "pill": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    animation: {
                        'shimmer': 'shimmer 1200ms linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        .skeleton-box {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }

        .skeleton-box::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(30, 32, 26, 0) 0%,
                rgba(40, 42, 36, 1) 50%,
                rgba(30, 32, 26, 0) 100%
            );
            animation: shimmer 1200ms infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-dark-bg min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="w-full h-16 flex items-center justify-between px-4 z-50 fixed top-0 bg-[#12140E]">
<div class="flex items-center gap-4 w-full">
<div class="skeleton-box w-6 h-6 rounded-full"></div>
<div class="flex-1 flex justify-center">
<div class="skeleton-box w-[180px] h-[18px] rounded-small"></div>
</div>
<div class="w-6 h-6"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Canvas -->
<main class="w-full max-w-[390px] pt-20 pb-24 px-4 space-y-4">
<!-- Card 1: Account Overview -->
<section class="bg-[#1E201A] rounded-medium p-4 overflow-hidden border border-[#282A24]">
<div class="skeleton-box w-20 h-3 rounded-small mb-4 opacity-60"></div>
<div class="h-14 flex items-center justify-between">
<div class="skeleton-box w-[140px] h-4 rounded-small"></div>
<div class="skeleton-box w-20 h-3.5 rounded-small"></div>
</div>
</section>
<!-- Card 2: Application Details -->
<section class="bg-[#1E201A] rounded-medium p-4 border border-[#282A24] mt-3">
<div class="skeleton-box w-32 h-3 rounded-small mb-4 opacity-60"></div>
<!-- Rows with Dividers -->
<div class="divide-y divide-[#282A24]">
<div class="h-14 flex flex-col justify-center space-y-2">
<div class="flex justify-between">
<div class="skeleton-box w-20 h-3.5 rounded-small opacity-50"></div>
<div class="skeleton-box w-[140px] h-3.5 rounded-small"></div>
</div>
</div>
<div class="h-14 flex flex-col justify-center space-y-2">
<div class="flex justify-between">
<div class="skeleton-box w-20 h-3.5 rounded-small opacity-50"></div>
<div class="skeleton-box w-[100px] h-3.5 rounded-small"></div>
</div>
</div>
<div class="h-14 flex flex-col justify-center space-y-2">
<div class="flex justify-between">
<div class="skeleton-box w-15 h-3.5 rounded-small opacity-50"></div>
<div class="skeleton-box w-[180px] h-3.5 rounded-small"></div>
</div>
</div>
</div>
</section>
<!-- List Row: Action Item -->
<section class="bg-[#1E201A] rounded-medium h-12 px-4 flex items-center gap-4 border border-[#282A24]">
<div class="skeleton-box w-5 h-5 rounded-full"></div>
<div class="skeleton-box w-40 h-3.5 rounded-small"></div>
</section>
<!-- Card 3: Documents / Attachments -->
<section class="bg-[#1E201A] rounded-medium p-4 border border-[#282A24]">
<div class="skeleton-box w-[140px] h-3 rounded-small mb-4 opacity-60"></div>
<div class="divide-y divide-[#282A24]">
<!-- Document Row 1 -->
<div class="h-16 flex items-center gap-4">
<div class="skeleton-box w-10 h-10 rounded-medium shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="skeleton-box w-24 h-3 rounded-small"></div>
<div class="skeleton-box w-16 h-2 rounded-small opacity-50"></div>
</div>
<div class="skeleton-box w-12 h-8 rounded-small"></div>
</div>
<!-- Document Row 2 -->
<div class="h-16 flex items-center gap-4">
<div class="skeleton-box w-10 h-10 rounded-medium shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="skeleton-box w-28 h-3 rounded-small"></div>
<div class="skeleton-box w-20 h-2 rounded-small opacity-50"></div>
</div>
<div class="skeleton-box w-12 h-8 rounded-small"></div>
</div>
</div>
</section>
<!-- Input Placeholder -->
<div class="skeleton-box w-full h-24 rounded-medium"></div>
<!-- Sticky Footer Action -->
<div class="pt-4">
<div class="skeleton-box w-full h-12 rounded-pill"></div>
</div>
</main>
<!-- Bottom Navigation Mockup -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-[#12140E] border-t border-[#282A24] flex justify-around items-center px-6 pb-2">
<div class="flex flex-col items-center gap-1">
<div class="skeleton-box w-6 h-6 rounded-small opacity-40"></div>
<div class="skeleton-box w-8 h-2 rounded-small opacity-40"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-box w-16 h-8 rounded-pill"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-box w-6 h-6 rounded-small opacity-40"></div>
<div class="skeleton-box w-8 h-2 rounded-small opacity-40"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="skeleton-box w-6 h-6 rounded-small opacity-40"></div>
<div class="skeleton-box w-8 h-2 rounded-small opacity-40"></div>
</div>
</nav>
</body></html>
