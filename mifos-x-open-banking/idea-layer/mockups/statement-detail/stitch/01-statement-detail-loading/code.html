<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Statement Detail Skeleton</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#95CDF7",
            "on-primary": "#00344E",
            surface: "#101417",
            "on-surface": "#E0E3E8",
            "surface-container": "#1C2024",
            "surface-container-low": "#1C2024",
            "surface-container-high": "#262A2E",
            "surface-container-highest": "#313539",
            "on-surface-variant": "#C1C7CE",
            outline: "#8B9198",
            "primary-container": "#004B6F",
            "secondary-container": "#262A2E", // For BottomNav active state
            "on-secondary-container": "#E0E3E8",
            divider: "#41474D"
          },
          borderRadius: {
            "small": "8px",
            "medium": "12px",
            "large": "16px",
            "extra-large": "28px",
            "full": "9999px"
          },
          spacing: {
            "margin-mobile": "16px",
            "safe-bottom": "env(safe-area-inset-bottom)"
          },
          fontFamily: {
            headline: ["Public Sans", "sans-serif"],
            body: ["Public Sans", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          },
          animation: {
            'shimmer-sweep': 'shimmer 1.5s infinite linear',
          },
          keyframes: {
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' }
            }
          }
        }
      }
    }
  </script>
<style>
    .shimmer-base {
      position: relative;
      overflow: hidden;
      background-color: #262A2E; /* Base color */
    }
    .shimmer-base::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #313539, transparent); /* Sweep color */
      animation: shimmer 1.5s infinite linear;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #101417;
      color: #E0E3E8;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body selection:bg-primary-container selection:text-on-primary">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex items-center h-16 px-4 bg-surface text-on-surface">
<div class="flex items-center gap-4 w-full">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">arrow_back</span>
<div class="shimmer-base w-[160px] h-[18px] rounded"></div>
<div class="ml-auto">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 pb-32 px-4 space-y-4 max-w-2xl mx-auto">
<!-- Header Card -->
<section class="h-20 bg-surface-container rounded-medium px-4 flex items-center justify-between">
<div class="shimmer-base w-[180px] h-[14px] rounded"></div>
<div class="shimmer-base w-[80px] h-[20px] rounded-full"></div>
</section>
<!-- Stat Block -->
<section class="h-[112px] bg-surface-container rounded-medium flex">
<!-- Left Column -->
<div class="flex-1 flex flex-col justify-center items-center gap-3">
<div class="shimmer-base w-[100px] h-[12px] rounded"></div>
<div class="shimmer-base w-[120px] h-[20px] rounded"></div>
</div>
<!-- Divider -->
<div class="w-[1px] h-16 my-auto bg-divider"></div>
<!-- Right Column -->
<div class="flex-1 flex flex-col justify-center items-center gap-3">
<div class="shimmer-base w-[100px] h-[12px] rounded"></div>
<div class="shimmer-base w-[120px] h-[20px] rounded"></div>
</div>
</section>
<!-- Lists Section 1 -->
<div class="pt-2">
<div class="shimmer-base w-[60px] h-[12px] rounded mb-4 ml-1"></div>
<div class="bg-surface rounded-medium">
<!-- Row 1 -->
<div class="h-14 flex items-center justify-between border-b border-divider px-1">
<div class="shimmer-base w-[140px] h-[16px] rounded"></div>
<div class="shimmer-base w-[80px] h-[16px] rounded"></div>
</div>
<!-- Row 2 -->
<div class="h-14 flex items-center justify-between px-1">
<div class="shimmer-base w-[140px] h-[16px] rounded"></div>
<div class="shimmer-base w-[80px] h-[16px] rounded"></div>
</div>
</div>
</div>
<!-- Lists Section 2 -->
<div class="pt-2">
<div class="shimmer-base w-[40px] h-[12px] rounded mb-4 ml-1"></div>
<div class="bg-surface rounded-medium">
<div class="h-14 flex items-center justify-between px-1">
<div class="shimmer-base w-[120px] h-[16px] rounded"></div>
<div class="shimmer-base w-[60px] h-[16px] rounded"></div>
</div>
</div>
</div>
<!-- Lists Section 3 -->
<div class="pt-2">
<div class="shimmer-base w-[50px] h-[12px] rounded mb-4 ml-1"></div>
<div class="bg-surface rounded-medium">
<div class="h-14 flex items-center justify-between px-1">
<div class="shimmer-base w-[120px] h-[16px] rounded"></div>
<div class="shimmer-base w-[60px] h-[16px] rounded"></div>
</div>
</div>
</div>
<!-- Lists Section 4 -->
<div class="pt-2">
<div class="shimmer-base w-[90px] h-[12px] rounded mb-4 ml-1"></div>
<div class="bg-surface rounded-medium space-y-1">
<!-- Rows 1-3 -->
<div class="h-16 flex items-center justify-between px-1 border-b border-divider">
<div class="shimmer-base w-[160px] h-[16px] rounded"></div>
<div class="flex flex-col gap-1 items-end">
<div class="shimmer-base w-[80px] h-[14px] rounded"></div>
<div class="shimmer-base w-[80px] h-[14px] rounded opacity-60"></div>
</div>
</div>
<div class="h-16 flex items-center justify-between px-1 border-b border-divider">
<div class="shimmer-base w-[160px] h-[16px] rounded"></div>
<div class="flex flex-col gap-1 items-end">
<div class="shimmer-base w-[80px] h-[14px] rounded"></div>
<div class="shimmer-base w-[80px] h-[14px] rounded opacity-60"></div>
</div>
</div>
<div class="h-16 flex items-center justify-between px-1">
<div class="shimmer-base w-[160px] h-[16px] rounded"></div>
<div class="flex flex-col gap-1 items-end">
<div class="shimmer-base w-[80px] h-[14px] rounded"></div>
<div class="shimmer-base w-[80px] h-[14px] rounded opacity-60"></div>
</div>
</div>
</div>
</div>
<!-- Footer Button -->
<div class="pt-6">
<div class="h-[52px] bg-surface-container-high rounded-medium flex items-center justify-center">
<div class="shimmer-base w-[200px] h-[16px] rounded"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container flex justify-around items-center h-20 pb-safe">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined mb-1">home</span>
<span class="text-[12px] font-medium">Home</span>
</div>
<!-- Accounts -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined mb-1">account_balance</span>
<span class="text-[12px] font-medium">Accounts</span>
</div>
<!-- Statements (Active) -->
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="text-[12px] font-medium">Payments</span>
</div>
<!-- More -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined mb-1">menu</span>
<span class="text-[12px] font-medium">More</span>
</div>
</nav>
</body></html>
