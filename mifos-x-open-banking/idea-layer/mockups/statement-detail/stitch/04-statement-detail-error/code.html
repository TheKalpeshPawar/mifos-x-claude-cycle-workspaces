<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Statement Error - HSBC Open Banking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#95CDF7",
            "on-primary": "#00344E",
            surface: "#101417",
            "surface-container": "#1C2024",
            "on-surface": "#E0E3E8",
            "on-surface-variant": "#C1C7CE",
            error: "#FFB4AB",
            outline: "#72787E",
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            mono: ["Roboto Mono", "monospace"],
          },
          borderRadius: {
            'extra-large': '28px',
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #101417;
      color: #E0E3E8;
      font-family: 'Outfit', sans-serif;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col h-screen overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#101417] flex items-center px-4 h-16">
<button class="mr-6 text-[#95CDF7] active:opacity-60 transition-opacity">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-[22px] font-medium text-[#E0E3E8] tracking-tight">Statement</h1>
<div class="flex-grow"></div>
<button class="text-[#95CDF7]">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<!-- Main Canvas / Error State -->
<main class="flex-grow flex flex-col items-center justify-center px-8 text-center bg-[#101417]">
<!-- Central Error Illustration/Icon -->
<div class="mb-4">
<span class="material-symbols-outlined text-[64px] text-[#FFB4AB]">
        error_outline
      </span>
</div>
<!-- Error Messaging -->
<h2 class="text-[20px] font-medium text-[#E0E3E8] mb-2">
      Could not load statement
    </h2>
<p class="text-[14px] font-normal text-[#C1C7CE] leading-relaxed max-w-[280px]">
      HSBC returned an error fetching this statement. Check your connection and try again.
    </p>
<!-- Action -->
<div class="mt-6">
<button class="h-12 w-[200px] rounded-full bg-[#95CDF7] text-[#00344E] font-medium text-[16px] flex items-center justify-center active:scale-95 transition-transform hover:brightness-110 shadow-sm" onclick="retryConnection()">
        Try again
      </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 bg-[#1C2024] flex justify-around items-center h-20 px-2 rounded-t-extra-large">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-[#C1C7CE] w-16">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="text-[12px] mt-1 font-medium">Home</span>
</button>
<!-- Accounts -->
<button class="flex flex-col items-center justify-center text-[#C1C7CE] w-16">
<span class="material-symbols-outlined text-[24px]">account_balance_wallet</span>
<span class="text-[12px] mt-1 font-medium">Accounts</span>
</button>
<!-- Statements (Active) -->
<button class="flex flex-col items-center justify-center bg-[#95CDF7] text-[#00344E] rounded-xl px-5 py-1 min-w-[64px]">
<span class="material-symbols-outlined text-[24px] fill-icon">receipt_long</span>
<span class="text-[12px] mt-0.5 font-medium">Statements</span>
</button>
<!-- More -->
<button class="flex flex-col items-center justify-center text-[#C1C7CE] w-16">
<span class="material-symbols-outlined text-[24px]">more_horiz</span>
<span class="text-[12px] mt-1 font-medium">More</span>
</button>
</nav>
<script>
    function retryConnection() {
      // Micro-interaction for the retry button
      const btn = event.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
      btn.disabled = true;
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        // In a real app, this would trigger a re-fetch of the statement data
      }, 1500);
    }

    // Handle Active Tab Highlighting logic for future extensions
    document.querySelectorAll('nav button').forEach(button => {
      button.addEventListener('click', function() {
        // Simple UI toggle for demonstration
        if (this.innerText.includes('Statements')) return;
        
        console.log('Navigating to:', this.innerText.trim());
      });
    });
  </script>
</body></html>
