<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Direct Debits - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&amp;family=Roboto:wght@400;500&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#266489",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#C9E6FF",
                        secondary: "#50606E",
                        tertiary: "#64597B",
                        background: "#F7F9FF",
                        surface: "#F7F9FF",
                        "surface-container": "#EBEEF3",
                        "on-surface": "#181C20",
                        "on-surface-variant": "#41474D",
                        outline: "#72787E",
                        error: "#BA1A1A",
                        positive: "#266489",
                        negative: "#BA1A1A",
                        // Specific prompt overrides for dark theme/HSBC reference
                        hsbc: {
                            bg: "#101417",
                            text: "#E0E3E8",
                            subtext: "#C1C7CE",
                            accent: "#95CDF7",
                            error_icon: "#FFB4AB",
                            outline: "#8B9198",
                            nav_bg: "#1C2024",
                            on_accent: "#00344E"
                        }
                    },
                    borderRadius: {
                        "small": "8px",
                        "medium": "12px",
                        "large": "16px",
                        "extra_large": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #101417; /* Explicitly matching the requested container color */
            color: #E0E3E8;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .error-icon-large {
            font-size: 64px !important;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col selection:bg-hsbc-accent/30">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-[#101417] border-b border-outline/10 flex items-center px-4 h-14">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-[#95CDF7] active:scale-95 transition-transform" data-icon="arrow_back">
                    arrow_back
                </button>
<h1 class="font-medium text-[22px] text-[#E0E3E8] leading-tight">Direct Debits</h1>
</div>
</div>
</header>
<!-- Main Canvas: Error State -->
<main class="flex-grow flex flex-col items-center justify-center px-6 text-center animate-in fade-in duration-700">
<!-- Error Content -->
<div class="flex flex-col items-center gap-6 max-w-sm">
<div class="p-4 rounded-full bg-[#FFB4AB]/10">
<span class="material-symbols-outlined error-icon-large text-[#FFB4AB]" data-icon="cloud_off">
                    cloud_off
                </span>
</div>
<div class="space-y-2">
<h2 class="font-medium text-[20px] text-[#E0E3E8]">
                    Could not load mandates
                </h2>
<p class="text-[14px] leading-relaxed text-[#C1C7CE]">
                    No network connection. Check your connection and retry.
                </p>
</div>
</div>
<!-- Action Buttons (Bottom-Center Positioned within flow) -->
<div class="mt-12 flex flex-col items-center gap-3 w-full">
<button class="h-[48px] w-[240px] bg-[#95CDF7] text-[#00344E] font-medium text-[14px] rounded-[24px] active:scale-95 transition-all shadow-lg shadow-[#95CDF7]/10">
                Try again
            </button>
<button class="h-[48px] w-[240px] border border-[#8B9198] text-[#95CDF7] font-medium text-[14px] rounded-[24px] active:scale-95 transition-all">
                View consents
            </button>
</div>
</main>
<!-- Spacer for Bottom Nav -->
<div class="h-20"></div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-[#1C2024] border-t border-outline/5 flex justify-around items-center h-16 pb-safe px-4 safe-area-bottom">
<!-- Accounts Tab -->
<a class="flex flex-col items-center justify-center text-[#8B9198] group" href="#">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform" data-icon="account_balance_wallet">
                account_balance_wallet
            </span>
<span class="text-[12px] font-medium">Accounts</span>
</a>
<!-- Transactions Tab (Determined Active by logic: Direct Debits are transaction-adjacent, but checking context) -->
<!-- Logic: User is in Direct Debits. In the provided JSON, Direct Debits doesn't have its own tab. Transactions is the closest semantic fit for scheduled payments. -->
<a class="flex flex-col items-center justify-center text-[#95CDF7] group" href="#">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform" data-icon="receipt_long" style="font-variation-settings: 'FILL' 1;">
                receipt_long
            </span>
<span class="text-[12px] font-medium">Transactions</span>
</a>
<!-- Consent Tab -->
<a class="flex flex-col items-center justify-center text-[#8B9198] group" href="#">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform" data-icon="handshake">
                handshake
            </span>
<span class="text-[12px] font-medium">Consent</span>
</a>
</nav>
<script>
        // Micro-interaction for the "Try again" button
        document.querySelector('button:first-of-type').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">refresh</span>';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                // Simulate a slight screen shake for fail state feedback
                document.querySelector('main').classList.add('animate-pulse');
                setTimeout(() => document.querySelector('main').classList.remove('animate-pulse'), 1000);
            }, 1500);
        });
    </script>
</body></html>
