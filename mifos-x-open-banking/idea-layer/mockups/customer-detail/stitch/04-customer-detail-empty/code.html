<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Customer Detail - Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#4C662B",
            "on-primary": "#FFFFFF",
            "primary-container": "#CDEDA3",
            "on-primary-container": "#102000",
            secondary: "#386663",
            "secondary-container": "#BCEBE7",
            error: "#BA1A1A",
            background: "#F9FAEF",
            surface: "#FFFFFF",
            "surface-variant": "#E1E4D5",
            "on-surface-variant": "#44483D",
            outline: "#75796C",
            "outline-variant": "#C5C8BA",
            "nav-active-indicator": "#DCE7C8",
            // Dark specific colors from prompt request
            "dark-bg": "#12140E",
            "dark-text-primary": "#E3E3D8",
            "dark-text-secondary": "#C5C8BA",
            "dark-brand": "#B2D188",
            "dark-on-brand": "#1F3701"
          },
          borderRadius: {
            "DEFAULT": "4px",
            "medium": "12px",
            "large": "16px",
            "pill": "9999px"
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            display: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            label: ["Outfit", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #12140E;
      margin: 0;
      padding: 0;
      color: #E3E3D8;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center">
<!-- Component 1: TopAppBar -->
<!-- Managed by JSON logic but tailored to prompt specific dark theme colors -->
<header class="fixed top-0 w-full z-50 flex items-center h-[64px] px-4 bg-[#12140E] transition-transform active:scale-95" style="background-color: #12140E;">
<div class="flex items-center w-full max-w-md mx-auto">
<button class="mr-4 flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[#B2D188] text-[24px]">arrow_back</span>
</button>
<h1 class="text-[#E3E3D8] font-medium text-[18px] tracking-tight">Customer Detail</h1>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-md flex flex-col items-center px-4 pt-[64px]">
<!-- Component 2: Hero Section -->
<section class="mt-20 mb-6 flex justify-center w-full">
<div class="w-[120px] h-[120px] rounded-full flex items-center justify-center border-2 border-dashed border-[#44483D] opacity-80">
<img alt="Person outline placeholder" class="w-full h-full object-contain filter brightness-50 opacity-40" src="https://lh3.googleusercontent.com/aida/ADBb0uh92H4_WSbIpED3jO42nIhoBy2nuwcHiiHdCSeORKMV_B257VumJ7vqIOZ5Ac2aVSjpMfd3nCDAnnLRySCc4W5ndgJGYL2Fp6PlK67W_5z6QrjaoK6klxK0n-uhqToodrWJz_M5Xc39LNUHXyoGBjUlE_Md0pt7CjdTZH_p0auRQgF5exCfENsrAuya6Et1MRlz8Yg3spU_K_O7ihTJSeCKeQNOd0l58inJe7TmdcMf1Czj9BPyzrhPBOFO"/>
</div>
</section>
<!-- Component 3: Empty State Archetype -->
<section class="mt-6 px-12 text-center flex flex-col items-center">
<h2 class="text-[#E3E3D8] font-semibold text-[20px] mb-3 leading-tight">
        No customer data
      </h2>
<p class="text-[#C5C8BA] font-normal text-[14px] leading-relaxed max-w-[280px]">
        This customer record has no data available. Try refreshing or contact your administrator.
      </p>
</section>
<!-- Component 4: Primary Button -->
<section class="mt-8 px-[32px] w-full">
<button class="w-full h-[48px] bg-[#B2D188] rounded-[24px] flex items-center justify-center transition-all active:scale-[0.98] hover:opacity-90 shadow-lg shadow-black/20" onclick="location.reload()">
<span class="text-[#1F3701] font-semibold text-[15px] tracking-wide">
          Refresh
        </span>
</button>
</section>
<!-- Secondary Visual Clue (Optional/Contextual) -->
<div class="mt-auto mb-10 opacity-20 flex flex-col items-center">
<span class="text-[10px] text-[#C5C8BA] tracking-widest uppercase">Field Officer Portal v3.0</span>
</div>
</main>
<!-- Navigation Suppression Logic: Not top-level, so NavBar is excluded -->
<script>
    // Micro-interaction for the refresh button
    const btn = document.querySelector('button');
    btn.addEventListener('mousedown', () => {
      btn.style.transform = 'scale(0.96)';
    });
    btn.addEventListener('mouseup', () => {
      btn.style.transform = 'scale(1)';
    });
  </script>
</body></html>
