<style>
    body {
      background-color: #12140f;
      color: #e3e3da;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .loading-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .7; }
    }

<body class="font-body-md text-on-surface">
<!-- TopAppBar: Derived from Shared Components JSON & Specifications -->
<header class="fixed top-0 w-full z-50 flex items-center px-margin-mobile h-16 bg-surface" id="top-bar">
<button class="material-symbols-outlined text-[24px] text-primary transition-transform active:scale-95" data-icon="arrow_back">
      arrow_back
    </button>
<h1 class="ml-xl font-title-md text-[18px] text-on-surface flex-1">Customer Detail</h1>
<button class="material-symbols-outlined text-[24px] text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full p-2" data-icon="refresh">
      refresh
    </button>
</header>
<!-- Main Content Canvas -->
<main class="min-h-screen flex flex-col items-center pt-16 pb-20">
<!-- Hero Section: Minimalist Broken Data Illustration -->
<div class="mt-16 w-[140px] h-[140px] flex items-center justify-center relative">
<div class="absolute inset-0 bg-surface-container-high rounded-full opacity-20 scale-110"></div>
<!-- Illustration Placeholder Style -->
<img class="w-full h-full object-contain filter grayscale opacity-80" data-alt="A minimalist digital illustration of a broken data connection or folder link, rendered in a sophisticated charcoal and muted green palette. The visual style is clean and corporate, featuring geometric lines and simple nodes that appear disconnected. The overall mood is calm, professional, and restrained, perfectly fitting a modern fintech application's error state in dark mode." src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 140'%3E%3Cpath d='M40 70h20M80 70h20M65 55l10 30M75 55l-10 30' stroke='%2344483D' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='30' cy='70' r='6' fill='%238F9285'/%3E%3Ccircle cx='110' cy='70' r='6' fill='%238F9285'/%3E%3C/svg%3E"/>
</div>
<!-- Message Section -->
<div class="mt-lg px-margin-desktop text-center max-w-lg">
<h2 class="font-title-lg text-[20px] text-on-surface font-semibold mb-xs">
        Could not load customer
      </h2>
<p class="font-body-md text-[14px] text-on-surface-variant leading-relaxed px-base">
        Check your connection and try again. Customer data is preserved.
      </p>
</div>
<!-- Actions Section -->
<div class="mt-xl w-full px-xl flex flex-col items-center">
<!-- Primary Action: Retry -->
<button class="w-full max-w-md h-[48px] rounded-full bg-primary-container text-on-primary-fixed flex items-center justify-center gap-sm active:scale-95 transition-all shadow-sm hover:brightness-105" onclick="this.classList.add('loading-pulse'); setTimeout(() =&gt; this.classList.remove('loading-pulse'), 2000);">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
<span class="font-title-md text-[15px] font-semibold">Retry</span>
</button>
<!-- Secondary Action: Go back -->
<button class="mt-sm px-lg py-sm text-outline font-title-md text-[14px] hover:text-on-surface-variant transition-colors">
        Go back
      </button>
</div>
</main>
<!-- Bottom Navigation: Filtered for Error State Visibility (Simplified version of JSON shell) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-base pb-safe bg-surface-container-lowest border-t border-outline-variant/10">
<div class="flex flex-col items-center justify-center text-on-surface-variant transition-colors hover:text-primary">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-lg text-label-lg mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant transition-colors hover:text-primary">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-lg text-label-lg mt-1">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant transition-colors hover:text-primary">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-lg text-label-lg mt-1">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-primary-container bg-surface-container-highest px-4 py-1 rounded-full">
<span class="material-symbols-outlined" data-icon="support_agent">support_agent</span>
<span class="font-label-lg text-label-lg mt-1">Support</span>
</div>
</nav>
<script>
    // Micro-interactions for the Retry button
    document.querySelector('button[onclick]').addEventListener('click', function() {
      const originalContent = this.innerHTML;
      this.disabled = true;
      this.innerHTML = `
        <span class="material-symbols-outlined text-[20px] animate-spin">sync</span>
        <span class="font-title-md text-[15px] font-semibold">Reconnecting...</span>
      `;
      
      setTimeout(() => {
        this.disabled = false;
        this.innerHTML = originalContent;
      }, 3000);
    });

    // Handle back navigation interaction
    document.querySelector('button[data-icon="arrow_back"]').addEventListener('click', () => {
      window.history.back();
    });
  </script>
