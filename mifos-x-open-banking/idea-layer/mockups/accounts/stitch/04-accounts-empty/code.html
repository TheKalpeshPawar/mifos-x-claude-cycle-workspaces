<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>HSBC Open Banking - No Accounts</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#95CDF7",
                        "on-primary": "#00344E",
                        "primary-container": "#004B6F",
                        "on-primary-container": "#C9E6FF",
                        secondary: "#50606E",
                        tertiary: "#64597B",
                        background: "#101417",
                        surface: "#101417",
                        "surface-container": "#1C2024",
                        "on-surface": "#E0E3E8",
                        "on-surface-variant": "#C1C7CE",
                        outline: "#8B9198",
                        "outline-variant": "rgba(139, 145, 152, 0.2)",
                        error: "#BA1A1A"
                    },
                    borderRadius: {
                        "small": "8px",
                        "medium": "12px",
                        "large": "16px",
                        "extra-large": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Public Sans", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'margin-desktop': '24px',
                        'max-width': '1200px'
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .stroke-heavy {
            font-variation-settings: 'wght' 300;
        }
        body {
            background-color: #101417;
            color: #E0E3E8;
            -webkit-font-smoothing: antialiased;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body selection:bg-primary/30">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b border-outline-variant/20 h-16">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-full max-w-max-width mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="shield">shield</span>
<h1 class="font-headline font-medium text-[18px] text-on-surface">My Accounts</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex flex-col items-center px-10 min-h-[calc(100vh-136px)]">
<!-- Illustration Section -->
<div class="mt-20 flex items-center justify-center relative">
<!-- Circular Halo -->
<div class="w-[160px] h-[160px] bg-surface-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-[96px] stroke-heavy" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<!-- Animated Atmosphere (Micro-interaction) -->
<div class="absolute inset-0 w-full h-full pointer-events-none opacity-20">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-2xl animate-pulse"></div>
</div>
</div>
<!-- Text Section -->
<div class="mt-6 text-center max-w-sm">
<h2 class="font-headline font-semibold text-[22px] text-on-surface leading-tight">
                No accounts selected
            </h2>
<p class="mt-2 font-headline font-normal text-[14px] text-on-surface-variant leading-relaxed px-4">
                Your Open Banking consent does not include any accounts. Re-authorise to choose which accounts to share.
            </p>
</div>
<!-- Action Section -->
<div class="mt-8 w-full max-w-xs flex flex-col items-center gap-4">
<button class="w-full h-12 bg-primary hover:bg-primary/90 active:scale-95 transition-all duration-150 rounded-full flex items-center justify-center gap-2 group shadow-lg shadow-primary/5">
<span class="material-symbols-outlined text-on-primary text-[20px] transition-transform group-hover:rotate-180 duration-500" data-icon="refresh">refresh</span>
<span class="font-label font-semibold text-[15px] text-on-primary">Re-authorise Access</span>
</button>
<button class="font-label font-medium text-[13px] text-outline hover:text-on-surface transition-colors duration-200 py-2">
                What is Open Banking consent?
            </button>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full bg-surface-container border-t border-outline-variant/12 z-50">
<div class="flex justify-around items-center h-20 px-4 pb-safe max-w-max-width mx-auto">
<!-- Accounts (Active) -->
<div class="flex flex-col items-center justify-center transition-transform duration-150 active:scale-95">
<div class="bg-primary-container text-on-primary-container rounded-full px-5 py-1 flex flex-col items-center">
<span class="material-symbols-outlined" data-icon="account_balance" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<span class="font-label text-primary mt-1 text-[12px]">Accounts</span>
</div>
<!-- Transactions (Inactive) -->
<div class="flex flex-col items-center justify-center transition-transform duration-150 active:scale-95 text-outline">
<div class="px-5 py-1 flex flex-col items-center hover:bg-surface-variant/30 rounded-full">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
</div>
<span class="font-label mt-1 text-[12px]">Transactions</span>
</div>
<!-- Consent (Inactive) -->
<div class="flex flex-col items-center justify-center transition-transform duration-150 active:scale-95 text-outline">
<div class="px-5 py-1 flex flex-col items-center hover:bg-surface-variant/30 rounded-full">
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
</div>
<span class="font-label mt-1 text-[12px]">Consent</span>
</div>
</div>
</nav>
<!-- Global Layout Spacer for fixed Nav -->
<div class="h-20 w-full"></div>
<script>
        // Simple micro-interaction for button press feedback
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('touchstart', function() {
                    this.classList.add('opacity-80');
                });
                btn.addEventListener('touchend', function() {
                    this.classList.remove('opacity-80');
                });
            });
        });
    </script>
</body></html>
