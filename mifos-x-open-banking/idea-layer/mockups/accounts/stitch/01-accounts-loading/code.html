<script>
        // Simple micro-interaction for skeleton click (mimic "ready" state transition)
        document.body.addEventListener('click', () => {
            const shimmers = document.querySelectorAll('.shimmer-base');
            shimmers.forEach(s => {
                s.style.transition = 'opacity 0.3s ease';
                s.style.opacity = '0.7';
