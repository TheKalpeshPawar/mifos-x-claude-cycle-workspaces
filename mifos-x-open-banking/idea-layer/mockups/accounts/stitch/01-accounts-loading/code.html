<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mifos X Open Banking - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#4C662B",
            primary_container: "#CDEDA3",
            on_primary: "#FFFFFF",
            on_primary_container: "#102000",
            secondary: "#386663",
            secondary_container: "#BCEBE7",
            error: "#BA1A1A",
            background: "#12140E", // Requested dark background
            surface: "#1E201A", // Shimmer base
            surface_variant: "#282A24", // Shimmer highlight
            on_background: "#F9FAEF",
            on_surface: "#E1E4D5",
            outline: "#75796C",
            outline_variant: "#44483D",
            nav_active_indicator: "#4C662B",
          },
          borderRadius: {
            "small": "4px",
            "medium": "12px",
            "large": "16px",
            "pill": "9999px"
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            display: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            label: ["Outfit", "sans-serif"]
          },
          animation: {
            'shimmer': 'shimmer 1200ms infinite linear',
          },
          keyframes: {
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' },
            }
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #12140E;
      color: #F9FAEF;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .shimmer-container {
      position: relative;
      overflow: hidden;
      background-color: #1E201A; /* Shimmer Base */
    }

    .shimmer-effect::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(30, 32, 26, 0) 0%,
        rgba(40, 42, 36, 1) 50%,
        rgba(30, 32, 26, 0) 100%
      );
      animation: shimmer 1200ms infinite;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top App Bar Skeleton -->
<header class="fixed top-0 w-full z-50 bg-[#12140E] h-14 flex items-center justify-between px-4 border-b border-outline-variant/20">
<div class="flex items-center space-x-4">
<!-- Title Shimmer (140x22dp) -->
<div class="shimmer-container shimmer-effect w-[140px] h-[22px] rounded-sm"></div>
</div>
<div class="flex items-center">
<!-- Trailing circle (24dp) -->
<div class="shimmer-container shimmer-effect w-6 h-6 rounded-full"></div>
</div>
</header>
<main class="flex-1 mt-14 mb-20 overflow-y-auto px-4">
<!-- Action Chips Row -->
<div class="mt-3 flex gap-2 overflow-x-auto no-scrollbar py-2">
<!-- 4 rectangles (72x32dp) -->
<div class="shimmer-container shimmer-effect flex-shrink-0 w-[72px] h-[32px] rounded-large"></div>
<div class="shimmer-container shimmer-effect flex-shrink-0 w-[72px] h-[32px] rounded-large"></div>
<div class="shimmer-container shimmer-effect flex-shrink-0 w-[72px] h-[32px] rounded-large"></div>
<div class="shimmer-container shimmer-effect flex-shrink-0 w-[72px] h-[32px] rounded-large"></div>
</div>
<!-- Account Cards -->
<div class="mt-4 space-y-3">
<!-- Card 1 -->
<div class="bg-[#1E201A] rounded-large border border-outline-variant/10 p-4 mx-4 first:mt-4">
<div class="flex justify-between items-center mb-6">
<div class="shimmer-container shimmer-effect w-[120px] h-4 rounded-sm"></div>
<div class="shimmer-container shimmer-effect w-[60px] h-5 rounded-small"></div>
</div>
<div class="shimmer-container shimmer-effect w-[100px] h-7 rounded-sm mb-6"></div>
<div class="flex items-center space-x-3">
<div class="shimmer-container shimmer-effect w-4 h-4 rounded-full"></div>
<div class="shimmer-container shimmer-effect w-[200px] h-3 rounded-sm"></div>
</div>
</div>
<!-- Card 2 -->
<div class="bg-[#1E201A] rounded-large border border-outline-variant/10 p-4 mx-4">
<div class="flex justify-between items-center mb-6">
<div class="shimmer-container shimmer-effect w-[130px] h-4 rounded-sm"></div>
<div class="shimmer-container shimmer-effect w-[60px] h-5 rounded-small"></div>
</div>
<div class="shimmer-container shimmer-effect w-[110px] h-7 rounded-sm mb-6"></div>
<div class="flex items-center space-x-3">
<div class="shimmer-container shimmer-effect w-4 h-4 rounded-full"></div>
<div class="shimmer-container shimmer-effect w-[200px] h-3 rounded-sm"></div>
</div>
</div>
<!-- Card 3 -->
<div class="bg-[#1E201A] rounded-large border border-outline-variant/10 p-4 mx-4">
<div class="flex justify-between items-center mb-6">
<div class="shimmer-container shimmer-effect w-[120px] h-4 rounded-sm"></div>
<div class="shimmer-container shimmer-effect w-[60px] h-5 rounded-small"></div>
</div>
<div class="shimmer-container shimmer-effect w-[100px] h-7 rounded-sm mb-6"></div>
<div class="flex items-center space-x-3">
<div class="shimmer-container shimmer-effect w-4 h-4 rounded-full"></div>
<div class="shimmer-container shimmer-effect w-[200px] h-3 rounded-sm"></div>
</div>
</div>
</div>
<!-- Bottom Footer Section -->
<div class="mt-8 px-4">
<div class="h-[1px] bg-[#282A24] w-full mb-6"></div>
<div class="flex justify-between items-center h-14 px-2">
<div class="shimmer-container shimmer-effect w-[140px] h-[13px] rounded-sm"></div>
<div class="shimmer-container shimmer-effect w-[90px] h-[18px] rounded-sm"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component Reference) -->
<nav class="fixed bottom-0 w-full z-50 bg-[#12140E] border-t border-outline-variant/20 h-20 px-2 pb-safe flex justify-around items-center">
<!-- Home Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant group opacity-60">
<span class="material-symbols-outlined mb-1">home</span>
<span class="text-[12px] font-medium font-label">Home</span>
</div>
<!-- Accounts Tab (Active State Reference) -->
<div class="flex flex-col items-center justify-center bg-nav-active-indicator/10 text-primary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="text-[12px] font-medium font-label">Accounts</span>
</div>
<!-- Payments Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="text-[12px] font-medium font-label">Payments</span>
</div>
<!-- Profile Tab -->
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined mb-1">person</span>
<span class="text-[12px] font-medium font-label">Profile</span>
</div>
</nav>
<script>
    // Micro-interaction: Subtle interaction on the bottom nav tabs
    document.querySelectorAll('nav div').forEach(tab => {
      tab.addEventListener('mousedown', () => {
        tab.style.transform = 'scale(0.95)';
        tab.style.transition = 'transform 150ms';
      });
      tab.addEventListener('mouseup', () => {
        tab.style.transform = 'scale(1)';
      });
    });
  </script>
</body></html>
