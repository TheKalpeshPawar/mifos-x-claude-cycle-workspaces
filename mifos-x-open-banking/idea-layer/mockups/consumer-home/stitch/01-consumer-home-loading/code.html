<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X Open Banking - Home Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "on-surface-variant": "#44483D",
                        "outline-variant": "#C5C8BA",
                        "primary-container": "#CDEDA3",
                        "on-primary-container": "#102000",
                        // Dark mode specific colors for skeleton
                        dark: {
                            bg: "#12140E",
                            surface_container: "#1E201A",
                            surface_container_high: "#282A24",
                            outline: "#44483D"
                        }
                    },
                    borderRadius: {
                        "sm": "8px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px",
                        "pill": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-base {
            position: relative;
            overflow: hidden;
            background-color: #1E201A; /* surface_container */
        }
        .shimmer-base::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(30, 32, 26, 0) 0%,
                rgba(40, 42, 36, 0.6) 50%,
                rgba(30, 32, 26, 0) 100%
            );
            animation: shimmer 1.8s infinite;
        }
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #EAECE1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased">
<!-- TopAppBar Shell -->
<header class="fixed top-0 w-full z-50 bg-[#12140E] border-b border-[#44483D] flex items-center h-14 px-4 w-full">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#B2D188] active:scale-95 transition-transform duration-150" data-icon="arrow_back">arrow_back</span>
<!-- Title Shimmer: 140x20dp -->
<div class="shimmer-base w-[140px] h-[20px] rounded-sm"></div>
</div>
<!-- Notification Shimmer: 24dp circle -->
<div class="shimmer-base w-6 h-6 rounded-full"></div>
</div>
</header>
<main class="pt-20 px-4 pb-24 max-w-md mx-auto space-y-6">
<!-- Hero Card (Balance): 120dp tall, 16dp radius -->
<section class="shimmer-base h-[120px] rounded-lg p-4 flex flex-col justify-between overflow-hidden">
<div class="space-y-3 relative z-10">
<!-- Label shimmer: 80x14dp -->
<div class="bg-[#282A24] w-[80px] h-[14px] rounded-sm opacity-50"></div>
<!-- Amount shimmer: 180x36dp -->
<div class="bg-[#282A24] w-[180px] h-[36px] rounded-sm opacity-70"></div>
</div>
<!-- Sub-row with two columns of stacked shimmer rects -->
<div class="flex justify-between items-end relative z-10">
<div class="space-y-1">
<div class="bg-[#282A24] w-12 h-3 rounded-sm opacity-40"></div>
<div class="bg-[#282A24] w-16 h-3 rounded-sm opacity-40"></div>
</div>
<div class="space-y-1 text-right">
<div class="bg-[#282A24] w-12 h-3 rounded-sm opacity-40 ml-auto"></div>
<div class="bg-[#282A24] w-20 h-3 rounded-sm opacity-40 ml-auto"></div>
</div>
</div>
</section>
<!-- Chip Row: 4 pill-shaped shimmers (80x36dp) -->
<section class="flex gap-2 overflow-x-hidden">
<div class="shimmer-base w-[80px] h-[36px] rounded-pill flex-shrink-0"></div>
<div class="shimmer-base w-[80px] h-[36px] rounded-pill flex-shrink-0"></div>
<div class="shimmer-base w-[80px] h-[36px] rounded-pill flex-shrink-0"></div>
<div class="shimmer-base w-[80px] h-[36px] rounded-pill flex-shrink-0"></div>
</section>
<!-- Section Header: Two shimmer rects -->
<section class="space-y-2 pt-2">
<div class="flex justify-between items-center">
<div class="shimmer-base w-[160px] h-[16px] rounded-sm"></div>
<div class="shimmer-base w-[60px] h-[16px] rounded-sm"></div>
</div>
</section>
<!-- List Rows (x3): 56dp tall each, 8dp radius -->
<section class="space-y-4">
<!-- Row 1 -->
<div class="flex items-center justify-between h-14 px-2">
<div class="flex items-center gap-3">
<div class="shimmer-base w-10 h-10 rounded-full"></div>
<div class="shimmer-base w-[160px] h-[16px] rounded-sm"></div>
</div>
<div class="shimmer-base w-[80px] h-[16px] rounded-sm"></div>
</div>
<!-- Row 2 -->
<div class="flex items-center justify-between h-14 px-2">
<div class="flex items-center gap-3">
<div class="shimmer-base w-10 h-10 rounded-full"></div>
<div class="shimmer-base w-[160px] h-[16px] rounded-sm"></div>
</div>
<div class="shimmer-base w-[80px] h-[16px] rounded-sm"></div>
</div>
<!-- Row 3 -->
<div class="flex items-center justify-between h-14 px-2">
<div class="flex items-center gap-3">
<div class="shimmer-base w-10 h-10 rounded-full"></div>
<div class="shimmer-base w-[160px] h-[16px] rounded-sm"></div>
</div>
<div class="shimmer-base w-[80px] h-[16px] rounded-sm"></div>
</div>
</section>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 w-full z-50 h-20 bg-[#12140E] border-t border-[#44483D]">
<div class="flex justify-around items-center h-full max-w-md mx-auto px-2">
<!-- Home (Active Mapping) -->
<div class="flex flex-col items-center justify-center bg-[#4C662B] text-white rounded-pill px-5 py-1 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-xs font-medium mt-1">Home</span>
</div>
<!-- Accounts -->
<div class="flex flex-col items-center justify-center text-[#C5C8BA] px-5 py-1 hover:bg-[#44483D]/20 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
<span class="font-label text-xs font-medium mt-1">Accounts</span>
</div>
<!-- Payments -->
<div class="flex flex-col items-center justify-center text-[#C5C8BA] px-5 py-1 hover:bg-[#44483D]/20 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-xs font-medium mt-1">Payments</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-[#C5C8BA] px-5 py-1 hover:bg-[#44483D]/20 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label text-xs font-medium mt-1">Profile</span>
</div>
</div>
</nav>
<script>
        // Simple interactive feedback simulation
        document.querySelectorAll('.active\\:scale-95').forEach(el => {
            el.addEventListener('click', () => {
                // Future navigation logic
            });
        });
    </script>
</body></html>
