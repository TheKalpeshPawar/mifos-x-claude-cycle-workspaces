<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X Open Banking - Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#75796C",
                        "outline-variant": "#44483D",
                        "mifos-green": "#B2D188",
                        "mifos-dark-green": "#1F3701"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        small: "4px",
                        medium: "12px",
                        large: "16px",
                        pill: "9999px"
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .shimmer {
            background: linear-gradient(90deg, #E3E3D8 0%, #44483D 50%, #E3E3D8 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer-animation 3s infinite linear;
        }
        @keyframes shimmer-animation {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar (JSON Mapping) -->
<header class="fixed top-0 w-full z-50 bg-[#12140E] border-b border-outline-variant/30 flex items-center h-14 px-4 w-full">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-2">
<h1 class="font-headline text-title-large font-regular text-primary dark:text-[#B2D188]">
<span class="shimmer font-semibold">Hello</span>
</h1>
</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-transform active:scale-95 duration-150">
<span class="material-symbols-outlined text-[#C5C8BA]" style="font-size: 24px;">notifications</span>
</button>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-4 pb-20">
<!-- Hero Section -->
<div class="mt-20 flex flex-col items-center justify-center">
<div class="relative w-[120px] h-[120px] rounded-[24px] overflow-hidden flex items-center justify-center bg-surface-container-high/10">
<img alt="Empty state illustration" class="w-full h-full object-cover opacity-80" src="https://lh3.googleusercontent.com/aida/ADBb0ujzNoF_suSqWeDRTZHcOgSEgSzf57y9T8APhVpQJOZHjXszfh81IlQjs5x3wWisf_EGke9aNsTDcgPzPjlaalVxzJqkFMYDi5uqaG4bcdq-X5mQILeEjG9bsxQ1VdCNt7yisHU6vo2OE4cb_wj_nxs2Ztr0Mn3tYGoADlX8lXtkaPKS6QTRYsQLMzTgd7h6KoN6RsmVFxAxaKEGV19BHfZ-v14M31wxG-3zl-6DTKxapKBYUGPpbcSk1Lcq" style="filter: grayscale(1) brightness(0.8) sepia(0.2) hue-rotate(40deg);"/>
<!-- Overlay tint to match #44483D specific requirement -->
<div class="absolute inset-0 bg-[#44483D]/20 mix-blend-multiply"></div>
</div>
</div>
<!-- Content -->
<div class="mt-6 px-12 text-center max-w-md">
<h2 class="font-semibold text-[20px] leading-tight text-[#E3E3D8] mb-2">
                No accounts found
            </h2>
<p class="font-regular text-[14px] leading-relaxed text-[#C5C8BA]">
                Contact your bank to set up your account.
            </p>
</div>
<!-- Primary Action -->
<div class="mt-8 w-full max-w-sm px-8">
<button class="w-full h-12 bg-[#B2D188] rounded-[24px] flex items-center justify-center transition-all duration-200 active:scale-95 hover:opacity-90">
<span class="font-semibold text-[15px] text-[#1F3701]">Contact Support</span>
</button>
</div>
</main>
<!-- BottomNavBar (JSON Mapping) -->
<nav class="fixed bottom-0 w-full z-50 h-20 bg-background dark:bg-[#1A1C16] border-t border-outline-variant dark:border-[#44483D]">
<div class="flex justify-around items-center h-full w-full max-w-md mx-auto px-2">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-[#DCE7C8] dark:bg-[#4C662B] text-on-primary-container dark:text-[#FFFFFF] rounded-pill px-5 py-1 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-label-medium font-medium">Home</span>
</a>
<!-- Accounts -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-[#C5C8BA] px-5 py-1 hover:bg-surface-variant/10 dark:hover:bg-[#44483D]/20 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">account_balance</span>
<span class="font-label text-label-medium font-medium">Accounts</span>
</a>
<!-- Payments -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-[#C5C8BA] px-5 py-1 hover:bg-surface-variant/10 dark:hover:bg-[#44483D]/20 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-label-medium font-medium">Payments</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-[#C5C8BA] px-5 py-1 hover:bg-surface-variant/10 dark:hover:bg-[#44483D]/20 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label text-label-medium font-medium">Profile</span>
</a>
</div>
</nav>
<!-- Micro-interaction logic -->
<script>
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'absolute bg-white/20 rounded-full animate-ping pointer-events-none';
                ripple.style.width = '10px';
                ripple.style.height = '10px';
                ripple.style.left = `${e.clientX}px`;
                ripple.style.top = `${e.clientY}px`;
                // Simple feedback logic
            });
        });
    </script>
</body></html>
