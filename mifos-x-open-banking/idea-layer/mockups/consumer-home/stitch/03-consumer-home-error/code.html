<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X Open Banking - Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        error: "#BA1A1A",
                        background: "#F9FAEF",
                        surface: "#FFFFFF",
                        "surface-variant": "#E1E4D5",
                        "on-surface-variant": "#44483D",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        // Specific colors from user request for Dark Error State
                        "dark-bg": "#12140E",
                        "brand-sage": "#B2D188",
                        "text-main": "#E3E3D8",
                        "text-sub": "#C5C8BA",
                        "text-muted": "#8F9285",
                        "btn-dark-text": "#1F3701",
                        "nav-border": "#44483D"
                    },
                    borderRadius: {
                        "small": "4px",
                        "medium": "12px",
                        "large": "16px",
                        "xl": "24px",
                        "pill": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
<!-- Component 1: TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#12140E] border-b border-[#44483D] flex items-center h-14 px-4">
<button aria-label="Go back" class="p-2 active:scale-95 transition-transform duration-150 flex items-center justify-center hover:bg-white/5 rounded-full">
<span class="material-symbols-outlined text-[#B2D188]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-4 font-medium text-[18px] text-[#E3E3D8]">Home</h1>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-md flex flex-col items-center justify-start pt-14">
<!-- Component 2: Hero Illustration -->
<div class="mt-[64px] w-[140px] h-[140px] flex items-center justify-center">
<img alt="Connectivity Issue" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uib9SKBidhzU8ZMZZta8XXJJQhhgtxnJ1DxbRB4D4ch5fRPXd28H7ltIPj_8fhNWzHonBJLlh30S5nj_UiY_iuUpVozBxPtz4zWw3TYLdCRTeIz7grDQCpgjg4MA3cGwUA4XDvuvHxxlWVSHubFMtV6wmggU51TYriJxH4260shITnebM-_WAV2DwehJHm8CJi_TTQur3UjpXoOmIz4MVtc0XCOnrO-yGdCekHMqLSc6huxbKlFiURUslo"/>
</div>
<!-- Component 3: Error text group -->
<div class="mt-6 px-12 text-center">
<h2 class="font-semibold text-[20px] text-[#E3E3D8] leading-tight mb-2">
                Could not load your account
            </h2>
<p class="font-regular text-[14px] text-[#C5C8BA] max-w-[250px] mx-auto">
                Check your connection and try again.
            </p>
</div>
<!-- Component 4: Primary Button -->
<div class="mt-8 w-full px-8">
<button class="w-full h-12 rounded-[24px] bg-[#B2D188] flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-200">
<span class="material-symbols-outlined text-[#1F3701]" data-icon="refresh">refresh</span>
<span class="font-semibold text-[15px] text-[#1F3701]">Retry</span>
</button>
</div>
<!-- Component 5: Text Button -->
<button class="mt-3 py-2 px-4 active:scale-95 transition-transform duration-150">
<span class="font-medium text-[14px] text-[#8F9285]">Go back</span>
</button>
</main>
<!-- Bottom Navigation Shell (Inactive for focused error screen as per mandate, but structure kept for context) -->
<!-- Suppressed to prioritize the content canvas on this task-focused/error page -->
<script>
        // Micro-interaction for the retry button
        document.querySelector('button.bg-\\[\\#B2D188\\]').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.style.transition = 'transform 0.5s ease-in-out';
            icon.style.transform = 'rotate(360deg)';
            
            setTimeout(() => {
                icon.style.transform = 'rotate(0deg)';
                icon.style.transition = 'none';
            }, 500);
        });
    </script>
</body></html>
