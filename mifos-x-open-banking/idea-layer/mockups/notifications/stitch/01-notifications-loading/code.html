<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#D0E87D", // Example complementary for the dark theme
                        "on-primary": "#1A3700",
                        "primary-container": "#282A24",
                        "on-primary-container": "#D0E87D",
                        "surface": "#12140E",
                        "on-surface": "#E4E3DB",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                        "surface-container-highest": "#33352E",
                        "on-surface-variant": "#C7C8B7",
                        "outline": "#919283"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "display": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Public Sans"]
                    },
                    margin: {
                        "margin-mobile": "1rem"
                    }
                },
            },
        }
    </script>
<style>
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .skeleton-shimmer {
            background: linear-gradient(90deg, #1E201A 25%, #282A24 50%, #1E201A 75%);
            background-size: 200% 100%;
            animation: shimmer 1200ms infinite linear;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #12140E;
            color: #E4E3DB;
            font-family: 'Public Sans', sans-serif;
            overflow-x: hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface">
<!-- Top App Bar Skeleton -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface h-16 flex items-center justify-between px-4">
<div class="flex items-center gap-4">
<!-- Leading Icon Shimmer -->
<div class="w-6 h-6 rounded-full skeleton-shimmer"></div>
<!-- Headline Shimmer -->
<div class="w-[120px] h-[20px] rounded-sm skeleton-shimmer"></div>
</div>
<!-- Trailing Avatar Shimmer -->
<div class="w-8 h-8 rounded-full skeleton-shimmer"></div>
</header>
<!-- Main Content Area -->
<main class="pt-16 pb-24 px-4 max-w-2xl mx-auto">
<!-- Section Header 1 Skeleton (Today) -->
<div class="mt-4 mb-3">
<div class="w-20 h-4 rounded-sm skeleton-shimmer"></div>
</div>
<!-- List Row 1 Skeleton -->
<div class="mt-3 h-[72px] bg-surface-container rounded-xl flex items-center p-3 relative overflow-hidden">
<div class="w-10 h-10 rounded-full skeleton-shimmer shrink-0"></div>
<div class="ml-4 flex flex-col gap-2">
<div class="w-[180px] h-3 rounded-sm skeleton-shimmer"></div>
<div class="w-[120px] h-3 rounded-sm skeleton-shimmer"></div>
</div>
<div class="absolute bottom-3 right-3 w-12 h-2.5 rounded-sm skeleton-shimmer"></div>
</div>
<!-- List Row 2 Skeleton -->
<div class="mt-2 h-[72px] bg-surface-container rounded-xl flex items-center p-3 relative overflow-hidden">
<div class="w-10 h-10 rounded-full skeleton-shimmer shrink-0"></div>
<div class="ml-4 flex flex-col gap-2">
<div class="w-[180px] h-3 rounded-sm skeleton-shimmer"></div>
<div class="w-[120px] h-3 rounded-sm skeleton-shimmer"></div>
</div>
<div class="absolute bottom-3 right-3 w-12 h-2.5 rounded-sm skeleton-shimmer"></div>
</div>
<!-- Section Header 2 Skeleton (Earlier) -->
<div class="mt-6 mb-3">
<div class="w-[72px] h-4 rounded-sm skeleton-shimmer"></div>
</div>
<!-- List Row 3 Skeleton -->
<div class="mt-3 h-[72px] bg-surface-container rounded-xl flex items-center p-3 relative overflow-hidden">
<div class="w-10 h-10 rounded-full skeleton-shimmer shrink-0"></div>
<div class="ml-4 flex flex-col gap-2">
<div class="w-[200px] h-3 rounded-sm skeleton-shimmer"></div>
<div class="w-[140px] h-3 rounded-sm skeleton-shimmer"></div>
</div>
<div class="absolute bottom-3 right-3 w-12 h-2.5 rounded-sm skeleton-shimmer"></div>
</div>
<!-- List Row 4 Skeleton -->
<div class="mt-2 h-[72px] bg-surface-container rounded-xl flex items-center p-3 relative overflow-hidden">
<div class="w-10 h-10 rounded-full skeleton-shimmer shrink-0"></div>
<div class="ml-4 flex flex-col gap-2">
<div class="w-[160px] h-3 rounded-sm skeleton-shimmer"></div>
<div class="w-[100px] h-3 rounded-sm skeleton-shimmer"></div>
</div>
<div class="absolute bottom-3 right-3 w-12 h-2.5 rounded-sm skeleton-shimmer"></div>
</div>
<!-- Additional placeholder rows for professional fill -->
<div class="mt-2 h-[72px] bg-surface-container rounded-xl flex items-center p-3 relative overflow-hidden opacity-60">
<div class="w-10 h-10 rounded-full skeleton-shimmer shrink-0"></div>
<div class="ml-4 flex flex-col gap-2">
<div class="w-[190px] h-3 rounded-sm skeleton-shimmer"></div>
<div class="w-[110px] h-3 rounded-sm skeleton-shimmer"></div>
</div>
<div class="absolute bottom-3 right-3 w-12 h-2.5 rounded-sm skeleton-shimmer"></div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container rounded-t-xl h-20 flex justify-around items-center px-2">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[11px] font-medium mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-[11px] font-medium mt-1">Accounts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="text-[11px] font-medium mt-1">Payments</span>
</a>
<!-- ACTIVE STATE: Alerts/Notifications -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="notifications" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="text-[11px] font-bold mt-1">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[11px] font-medium mt-1">Profile</span>
</a>
</nav>
<script>
        // Micro-interaction: Smooth transition for shimmer elements if needed
        document.addEventListener('DOMContentLoaded', () => {
            // Logic to simulate data loading and removing skeleton could go here
            // For now, it stays as a permanent skeleton as requested.
        });
    </script>
</body></html>
