 ["Public Sans"], body: ["Public Sans"], label: ["Public Sans"]}, fontSize: {"headline-lg-mobile": ["28px", {lineHeight: "36px", letterSpacing: "0px", fontWeight: "500"}], "display-lg": ["57px", {lineHeight: "64px", letterSpacing: "-0.25px", fontWeight: "400"}], "label-md": ["12px", {lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500"}], "headline-lg": ["32px", {lineHeight: "40px", letterSpacing: "0px", fontWeight: "500"}], "body-md": ["14px", {lineHeight: "20px", letterSpacing: "0.25px", fontWeight: "400"}], "title-lg": ["22px", {lineHeight: "28px", letterSpacing: "0px", fontWeight: "500"}], "label-lg": ["14px", {lineHeight: "20px", letterSpacing: "0.1px", fontWeight: "500"}], "body-lg": ["16px", {lineHeight: "24px", letterSpacing: "0.5px", fontWeight: "400"}]}}}};</script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #101417;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon {
            font-variation-settings: 'FILL' 1;
        }
        .error-vignette {
            background: radial-gradient(circle at center, rgba(255, 180, 171, 0.05) 0%, rgba(16, 20, 23, 0) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Screen Wrapper (393x852dp simulation) -->
<div class="relative w-full min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-50 bg-surface border-b border-outline/10 flex items-center px-margin-mobile h-14">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95 duration-150 mr-2">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface tracking-tight">Beneficiaries</h1>
</header>
<!-- Main Content (Central Error State) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pb-32">
<!-- Atmospheric Layer -->
<div class="absolute inset-0 error-vignette pointer-events-none"></div>
<div class="w-full max-w-[320px] text-center space-y-6 relative">
<!-- Icon Anchor -->
<div class="flex justify-center mb-4">
<div class="w-24 h-24 rounded-full bg-error/10 flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-[72px] leading-none text-error" data-icon="cloud_off">cloud_off</span>
</div>
</div>
<!-- Messaging -->
<div class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface leading-tight">
                        Could not load consents
                    </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                        Check your connection and try again. If the problem persists, sign out and back in.
                    </p>
</div>
<!-- Primary Action -->
<div class="pt-stack-lg">
<button class="w-full h-12 bg-primary-container text-on-primary font-label-lg text-label-lg rounded-full shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 hover:brightness-110" onclick="this.classList.add('opacity-50')">
<span class="material-symbols-outlined text-[18px]" data-icon="refresh">refresh</span>
                        Retry
                    </button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full flex justify-around items-center h-16 pb-safe px-4 bg-surface-container border-t border-outline/10 z-50">
<!-- Account Tab -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-md text-label-md">Accounts</span>
</button>
<!-- Transactions Tab -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md">Transactions</span>
</button>
<!-- Consent Tab (Active) -->
<button class="flex flex-col items-center justify-center text-primary active:scale-90 duration-200">
<div class="bg-secondary-container/30 px-5 py-1 rounded-full mb-1">
<span class="material-symbols-outlined active-icon" data-icon="handshake" style="font-variation-settings: 'FILL' 1;">handshake</span>
</div>
<span class="font-label-md text-label-md">Consent</span>
</button>
</nav>
<!-- Toast Notification Simulation Layer (Hidden by default) -->
<div class="fixed bottom-24 left-margin-mobile right-margin-mobile transform translate-y-20 opacity-0 transition-all duration-500 z-[60]" id="toast">
<div class="bg-surface-container-highest text-on-surface px-4 py-3 rounded-lg flex items-center justify-between shadow-xl border border-outline/10">
<span class="font-body-md text-body-md">Attempting to reconnect...</span>
<button class="text-primary font-label-lg text-label-lg" onclick="hideToast()">Dismiss</button>
</div>
</div>
</div>
<script>
        // Simple micro-interaction for the Retry button
        const retryBtn = document.querySelector('button.bg-primary-container');
        const toast = document.getElementById('toast');

        function showToast() {
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(hideToast, 4000);
        }

        function hideToast() {
            toast.classList.add('translate-y-20', 'opacity-0');
            toast.classList.remove('translate-y-0', 'opacity-100');
        }

        retryBtn.addEventListener('click', () => {
            // Simulate loading state
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            retryBtn.classList.add('pointer-events-none', 'opacity-80');
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.classList.remove('pointer-events-none', 'opacity-80');
                showToast();
            }, 1500);
        });

        // Add subtle parallax effect to the atmospheric vignette
        document.addEventListener('mousemove', (e) => {
            const vignette = document.querySelector('.error-vignette');
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            vignette.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body></html>
