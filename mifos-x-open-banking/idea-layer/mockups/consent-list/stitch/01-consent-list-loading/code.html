<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=393, height=852, initial-scale=1.0" name="viewport"/>
<title>HSBC Open Banking - Consents Skeleton</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;family=Outfit:wght@500&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --surface: #101417;
      --surface-container: #1C2024;
      --shimmer-start: #1C2024;
      --shimmer-end: #262A2E;
    }

    body {
      background-color: var(--surface);
      color: #E0E3E8;
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Mobile shell fixed look */
      height: 852px;
      width: 393px;
    }

    .shimmer-base {
      position: relative;
      overflow: hidden;
      background-color: var(--shimmer-start);
    }

    .shimmer-base::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(38, 42, 46, 0) 0,
        rgba(38, 42, 46, 0.8) 50%,
        rgba(38, 42, 46, 0) 100%
      );
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .active-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#266489",
            "on-primary": "#FFFFFF",
            "primary-container": "#C9E6FF",
            secondary: "#50606E",
            tertiary: "#64597B",
            background: "#101417",
            surface: "#101417",
            "surface-container": "#1C2024",
            "on-surface": "#E0E3E8",
            "on-surface-variant": "#C1C7CE",
            outline: "#8B9198",
            error: "#FFB4AB",
            "on-primary-container": "#001E2F",
            "trust-blue": "#95CDF7"
          },
          borderRadius: {
            small: "8px",
            medium: "12px",
            large: "16px",
            extra_large: "28px",
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            body: ["Public Sans", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<!-- Component 1: Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-[#101417] flex items-center px-4 h-16">
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined text-[#E0E3E8] cursor-pointer">arrow_back</span>
<h1 class="font-outfit text-[22px] font-medium text-[#E0E3E8] leading-none">Consents</h1>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 mt-16 px-4 overflow-y-auto pb-24">
<!-- Component 2: Banner Skeleton -->
<section class="mt-4 w-full h-[60px] bg-[#1C2024] rounded-[12px] flex items-center px-4 overflow-hidden">
<div class="shimmer-base w-full h-[20px] rounded-sm"></div>
</section>
<!-- Component 3: Active Consents Section -->
<section class="mt-8">
<div class="shimmer-base w-[80px] h-[10px] rounded-full mb-4"></div>
<!-- Card Skeleton A -->
<div class="bg-[#1C2024] h-[104px] rounded-[12px] p-4 flex flex-col justify-between mb-2">
<div class="flex items-center space-x-3">
<div class="shimmer-base w-[40px] h-[40px] rounded-full shrink-0"></div>
<div class="shimmer-base w-[120px] h-[16px] rounded-sm"></div>
</div>
<div class="space-y-2 mt-2">
<div class="shimmer-base w-[220px] h-[12px] rounded-sm"></div>
<div class="shimmer-base w-[140px] h-[12px] rounded-sm"></div>
</div>
</div>
<!-- Card Skeleton B -->
<div class="bg-[#1C2024] h-[112px] rounded-[12px] p-4 flex flex-col justify-between">
<div class="flex items-center space-x-3">
<div class="shimmer-base w-[40px] h-[40px] rounded-full shrink-0"></div>
<div class="shimmer-base w-[120px] h-[16px] rounded-sm"></div>
</div>
<div class="space-y-2 mt-2">
<div class="shimmer-base w-[220px] h-[12px] rounded-sm"></div>
<div class="flex justify-between items-center">
<div class="shimmer-base w-[140px] h-[12px] rounded-sm"></div>
<div class="shimmer-base w-[60px] h-[16px] rounded-full"></div> <!-- Status Chip Pos -->
</div>
</div>
</div>
</section>
<!-- Component 4: Expired Consents Section -->
<section class="mt-8">
<div class="shimmer-base w-[72px] h-[10px] rounded-full mb-4"></div>
<div class="bg-[#1C2024] h-[72px] rounded-[12px] p-4 flex items-center space-x-4">
<div class="shimmer-base w-[32px] h-[32px] rounded-full shrink-0"></div>
<div class="space-y-2">
<div class="shimmer-base w-[100px] h-[12px] rounded-sm"></div>
<div class="shimmer-base w-[160px] h-[12px] rounded-sm"></div>
</div>
</div>
</section>
</main>
<!-- Component 5: Bottom Nav Bar -->
<nav class="fixed bottom-0 w-full h-20 bg-[#1C2024] flex justify-around items-center px-2 z-50">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-[#C1C7CE] space-y-1">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="text-[12px] font-medium">Home</span>
</div>
<!-- Accounts -->
<div class="flex flex-col items-center justify-center text-[#C1C7CE] space-y-1">
<span class="material-symbols-outlined text-[24px]">account_balance</span>
<span class="text-[12px] font-medium">Accounts</span>
</div>
<!-- Consents (Active) -->
<div class="flex flex-col items-center justify-center text-[#95CDF7] space-y-1">
<div class="bg-[#266489]/20 rounded-full px-5 py-1 mb-1">
<span class="material-symbols-outlined active-icon text-[24px]">policy</span>
</div>
<span class="text-[12px] font-bold">Consents</span>
</div>
<!-- Settings -->
<div class="flex flex-col items-center justify-center text-[#C1C7CE] space-y-1">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="text-[12px] font-medium">Settings</span>
</div>
</nav>
<!-- Atmospheric Script for subtle micro-interactions -->
<script>
    // Purely visual: gently pulse the skeleton containers to feel "alive"
    document.querySelectorAll('.bg-\\[\\#1C2024\\]').forEach((el, index) => {
      el.animate([
        { opacity: 0.95 },
        { opacity: 1 }
      ], {
        duration: 1000,
        iterations: Infinity,
        direction: 'alternate',
        easing: 'ease-in-out',
        delay: index * 150
      });
    });
  </script>
</body></html>
