<body class="font-body-md">
<div class="glass-overlay"></div>
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface flex items-center px-margin-mobile h-16 z-50">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-start hover:bg-surface-variant/10 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg-mobile text-on-surface dark:text-on-surface ml-1">Consents</h1>
</header>
<!-- Main Content: Error State -->
<main class="error-state-container relative z-10">
<!-- Error Icon -->
<div class="mb-6 flex justify-center items-center">
<span class="material-symbols-outlined text-[#FFB4AB]" data-icon="lock_reset" style="font-size: 72px;">lock_reset</span>
</div>
<!-- Headline -->
<h2 class="font-title-lg text-title-lg-mobile text-[#E0E3E8] mb-2 px-4 leading-tight max-w-[280px]">
            Session expired
        </h2>
<!-- Subtitle -->
<p class="font-body-md text-[#C1C7CE] max-w-[300px] leading-relaxed">
            Your Open Banking session has timed out. Sign in again to view and manage your HSBC consents.
        </p>
<!-- Re-authentication Button -->
<button class="re-auth-button mt-6 h-12 px-8 bg-[#95CDF7] text-[#00344E] font-label-lg text-label-lg rounded-full flex items-center justify-center hover:brightness-110 shadow-lg">
            Re-authenticate
        </button>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-3 px-margin-mobile bg-[#1C2024] z-50">

<span class="font-label-sm text-label-sm">Home</span>
</a>
<!-- Accounts -->

<span class="font-label-sm text-label-sm">Accounts</span>
</a>
<!-- Consents (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-5 py-1 transition-transform duration-150 active:scale-90" href="#">

</a>

<span class="font-label-sm text-label-sm">Settings</span>
</a>

<script>
        // Simple micro-interaction for the button
        const authBtn = document.querySelector('.re-auth-button');
        authBtn.addEventListener('click', () => {
            // Mock feedback for re-auth trigger
            authBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">sync</span>Authenticating...';
            setTimeout(() => {
                authBtn.innerHTML = 'Re-authenticate';
            }, 2000);
        });

        // Initialize Material Symbols
        document.querySelectorAll('.material-symbols-outlined').forEach(span => {
            const iconName = span.getAttribute('data-icon');
            if (iconName) {
                span.textContent = iconName;
            }
        });
    </script>
