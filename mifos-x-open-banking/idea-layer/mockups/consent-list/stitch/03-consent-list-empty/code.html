<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('button');
            btn.addEventListener('mouseenter', () => {
                const icon = document.querySelector('.material-symbols-outlined.text-\\[72px\\]');
                icon.style.fontVariationSettings = "'FILL' 1, 'wght' 300";
                icon.style.color = "#95cdf7";
                icon.parentElement.style.backgroundColor = "#1c2024";
            });
            btn.addEventListener('mouseleave', () => {
                const icon = document.querySelector('.material-symbols-outlined.text-\\[72px\\]');
                icon.style.fontVariationSettings = "'FILL' 0, 'wght' 200";
                icon.style.color = "#c1c7cf";
                icon.parentElement.style.backgroundColor = "#1c2023";
            });
        });
