<!-- Micro-interaction for the Retry Button -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const retryBtn = document.querySelector('button.bg-primary-container');
            retryBtn.addEventListener('click', () => {
                const originalContent = retryBtn.innerHTML;
                retryBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
                retryBtn.classList.add('pointer-events-none', 'opacity-80');
                
                // Simulate refresh intent
                setTimeout(() => {
                    retryBtn.innerHTML = originalContent;
                    retryBtn.classList.remove('pointer-events-none', 'opacity-80');
                }, 1500);
            });
        });
    </script>
