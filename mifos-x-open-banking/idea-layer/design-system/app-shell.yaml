# Per-screen overrides: screens/{f}/ui.yaml#/shell (see SCREEN_SCHEMA.schema.yaml).
#
# Material Design 3 defaults for a mobile Open Banking AISP app.
# Edit bottom_navigation items to reflect the real tab destinations.

schema_version: "1.0"
project: "mifos-x-open-banking"

# ─── Bottom navigation (primary-flow chrome) ────────────────────────────
# Typical for this app: Accounts | Transactions | Consents | More
# Update target_screen values to match real screen IDs from idea-plan.yaml.
bottom_navigation:
  enabled: true
  # Rail updated 2026-06-30: Home added as primary landing (shows the currently selected
  # account); Consents removed from the rail and surfaced via the Home "Manage consents"
  # quick-action + Settings → Manage consents instead (consent-list stays fully reachable).
  items:
    - id: home
      label: "Home"
      icon: "home"
      target_screen: home
      order: 0
    - id: accounts
      label: "Accounts"
      icon: "account_balance"
      target_screen: accounts
      order: 1
    - id: transactions
      label: "Transactions"
      icon: "receipt_long"
      target_screen: transactions
      order: 2
    - id: more
      label: "More"
      icon: "more_horiz"
      target_screen: settings
      order: 3
  selected_color: "primary"
  unselected_color: "on-surface-variant"

# ─── Top app bar ────────────────────────────────────────────────────────
top_app_bar:
  enabled: true
  variant: "small"
  title_source: "screen"
  static_title: null
  leading: "auto"
  trailing_actions: []

# ─── Navigation drawer (off — bottom nav is primary) ────────────────────
drawer:
  enabled: false
  items: []

# ─── FAB host ───────────────────────────────────────────────────────────
fab_host:
  enabled: true
  default_position: "bottom-end"
  per_screen_overrideable: true

# ─── Snackbar host ──────────────────────────────────────────────────────
snackbar_host:
  enabled: true
  default_position: "bottom"
  z_index: 100

# ─── Safe-area handling ─────────────────────────────────────────────────
safe_area:
  top: "respect"
  bottom: "respect"
  notch_handling: "extend-and-pad"

# ─── Per-screen defaults (screen.ui.yaml.shell overrides these) ─────────
defaults:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  drawer_accessible: false
  fab_visible: false
  snackbar_visible: true
