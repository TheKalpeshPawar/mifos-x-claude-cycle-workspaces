#
# Material Design 3 defaults for a mobile Open Banking AISP app.
# Edit bottom_navigation items to reflect the real tab destinations.

schema_version: "1.0"
project: "mifos-x-open-banking"

# ─── Bottom navigation (primary-flow chrome) ────────────────────────────
# Reverse-synced from source 2026-07-28 against
# cmp-navigation/authenticatednavbar/AuthenticatedNavBarTabItem.kt.
# Shipped rail: Home | Accounts | Pay | More
bottom_navigation:
  enabled: true
  # Rail updated 2026-06-30: Home added as primary landing (shows the currently selected
  # account); Consents removed from the rail and surfaced via Settings → Manage consents
  # (consent-list stays fully reachable). Corrected 2026-07-28: tab 2 is Pay, not
  # Transactions, and the Home "Manage consents" quick-action does not exist in source —
  # homeGraph exposes only transactions and transaction-detail callbacks.
  items:
    - id: home
      label: "Home"
      icon: "home"
      target_screen: home
      order: 0
    - id: accounts
      label: "Accounts"
      icon: "account_balance"
      target_screen: accounts
      order: 1
    # Reverse-synced 2026-07-28: source ships a "Pay" tab here, not "Transactions".
    # AuthenticatedNavBarTabItem.PayTab points at SendMoneyRoute, a placeholder
    # destination registered by bankingPlaceholderDestinations(). Recorded as the
    # running truth even though idea-plan.yaml declares PISP out of scope —
    # see the drift note below.
    - id: pay
      label: "Pay"
      icon: "payments"
      target_screen: send-money
      order: 2
      implementation_status: placeholder
      source_binding: "AuthenticatedNavBarTabItem.PayTab -> SendMoneyRoute"
      drift_note: >-
        Renders PlaceholderScreen("Pay"). idea-plan.yaml §vision.scope.out_of_scope
        declares payment initiation (PISP) out of scope, yet core/network ships a
        complete PISP wire-model surface and this tab points toward it. Transactions
        remains fully reachable from home and from account-detail's Explore chips.
    - id: more
      label: "More"
      icon: "more_horiz"
      target_screen: settings
      order: 3
  selected_color: "primary"
  unselected_color: "on-surface-variant"

# ─── Top app bar ────────────────────────────────────────────────────────
top_app_bar:
  enabled: true
  variant: "small"
  title_source: "screen"
  static_title: null
  leading: "auto"
  trailing_actions: []

# ─── Navigation drawer (off — bottom nav is primary) ────────────────────
drawer:
  enabled: false
  items: []

# ─── FAB host ───────────────────────────────────────────────────────────
fab_host:
  enabled: true
  default_position: "bottom-end"
  per_screen_overrideable: true

# ─── Snackbar host ──────────────────────────────────────────────────────
snackbar_host:
  enabled: true
  default_position: "bottom"
  z_index: 100

# ─── Safe-area handling ─────────────────────────────────────────────────
safe_area:
  top: "respect"
  bottom: "respect"
  notch_handling: "extend-and-pad"

# ─── Per-screen defaults (screen.ui.yaml.shell overrides these) ─────────
defaults:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  drawer_accessible: false
  fab_visible: false
  snackbar_visible: true
