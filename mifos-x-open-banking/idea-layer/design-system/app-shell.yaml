schema_version: "1.0"
project: "mifos-x-open-banking"

# ─── Bottom navigation (primary-flow chrome) ────────────────────────────
# Reverse-synced from source 2026-07-28 against
# cmp-navigation/authenticatednavbar/AuthenticatedNavBarTabItem.kt.
# Shipped rail: Home | Accounts | Pay | More
bottom_navigation:
  enabled: true
  # Rail updated 2026-06-30: Home added as primary landing (shows the currently selected
  # account); Consents removed from the rail and surfaced via Settings → Manage consents
  # (consent-list stays fully reachable). Corrected 2026-07-28: tab 2 is Pay, not
  # Transactions, and the Home "Manage consents" quick-action does not exist in source —
  # homeGraph exposes only transactions and transaction-detail callbacks.
  items:
    - id: home
      label: "Home"
      icon: "home"
      target_screen: home
      order: 0
    - id: accounts
      label: "Accounts"
      icon: "account_balance"
      target_screen: accounts
      order: 1
    # Reverse-synced 2026-07-28: source ships a "Pay" tab here, not "Transactions".
    # Updated 2026-07-30 (/idea-evolve STEP 4.a2 CONNECT): the PISP scope reversal
    # materialized the send-money feature this tab was already pointing at, so the
    # ingress edge is now specified rather than dangling. NO new nav edge was added —
    # target_screen already read send-money; only its status and binding change.
    - id: pay
      label: "Pay"
      icon: "payments"
      target_screen: send-money
      order: 2
      implementation_status: specified
      source_binding: "AuthenticatedNavBarTabItem.PayTab -> SendMoneyRoute"
      target_binding_pending: >-
        SendMoneyRoute must be repointed off bankingPlaceholderDestinations() to the
        feature/send-money module, exactly as settings replaced the MoreRoute placeholder:
        repoint graphRoute and startDestinationRoute, then delete the placeholder route and
        its bankingPlaceholderDestinations() line in the SAME commit. PayTab is flat
        (graphRoute == startDestinationRoute), so the navigateToTab graph-route trap that
        affects the Home tab does not apply here.
      drift_note: >-
        RESOLVED 2026-07-30. This tab previously rendered PlaceholderScreen("Pay") while
        idea-plan.yaml declared PISP out of scope, even though core/network shipped a complete
        PISP wire-model surface the tab pointed toward. The scope reversal moved PISP domestic
        single payment in_scope and materialized send-money, payment-consent and payment-status.
        The tab still renders the placeholder in source until P3 is implemented — the idea-layer
        is now ahead of source here, which is the intended direction.
    - id: more
      label: "More"
      icon: "more_horiz"
      target_screen: settings
      order: 3
  selected_color: "primary"
  unselected_color: "on-surface-variant"

# ─── Top app bar ────────────────────────────────────────────────────────
top_app_bar:
  enabled: true
  variant: "small"
  title_source: "screen"
  static_title: null
  leading: "auto"
  trailing_actions: []

# ─── Navigation drawer (off — bottom nav is primary) ────────────────────
drawer:
  enabled: false
  items: []

# ─── FAB host ───────────────────────────────────────────────────────────
fab_host:
  enabled: true
  default_position: "bottom-end"
  per_screen_overrideable: true

# ─── Snackbar host ──────────────────────────────────────────────────────
snackbar_host:
  enabled: true
  default_position: "bottom"
  z_index: 100

# ─── Safe-area handling ─────────────────────────────────────────────────
safe_area:
  top: "respect"
  bottom: "respect"
  notch_handling: "extend-and-pad"

# ─── Per-screen defaults (screen.ui.yaml.shell overrides these) ─────────
defaults:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  drawer_accessible: false
  fab_visible: false
  snackbar_visible: true
