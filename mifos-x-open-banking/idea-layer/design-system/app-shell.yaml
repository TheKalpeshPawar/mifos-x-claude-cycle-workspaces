# app-shell.yaml — app-level chrome (RULE-APP-SHELL-001)
# Resolved per-screen via screens/{f}/ui.yaml#/shell (empty {} = inherit defaults).
# Generated 2026-05-22.

schema_version: "1.0"

# ─── Defaults applied to every screen unless overridden ──────────────────────
defaults:
  top_app_bar:
    show: true
    variant: small                  # small | medium | large
    color: surface                  # surface | primary | tonal
    title_typography: title_lg
    back_action: auto               # auto | always | never

  bottom_nav:
    show: true
    style: bar                      # bar (NavigationBar) | rail (NavigationRail wide)
    items:
      - id: home
        label: Home
        icon: home
        target: home
      - id: crypto
        label: Crypto
        icon: account_balance_wallet
        target: crypto
      - id: settings
        label: Settings
        icon: settings
        target: settings

  drawer:
    show: false                     # no drawer in this app

  fab:
    show: false                     # no global FAB

  snackbar_host:
    show: true                      # global snackbar host on every screen

  error_banner_host:
    show: true                      # MifosErrorBanner global host

  safe_area:
    apply: [top, bottom, left, right]

# ─── Per-screen overrides (referenced by screens/{f}/ui.yaml#/shell) ─────────
# Examples (these patterns are referenced from individual ui.yaml files):
#
#   shell: {}                              # inherit all defaults
#
#   shell:                                 # detail screen — no bottom nav
#     bottom_nav: { show: false }
#     top_app_bar: { back_action: always }
#
#   shell:                                 # dialog — minimal chrome
#     top_app_bar: { show: false }
#     bottom_nav: { show: false }
