# design-tokens.yaml — Material Design 3 token system for mifos-x-open-banking
# Derived from idea-plan.yaml §branding + core/designsystem/MaterialTheme.
# Generated 2026-05-22.

schema_version: "1.0"
brand:
  name: "Mifos X Open Banking"
  primary_brand_color: "#1800B1"   # Mifos deep purple

# ─── Color tokens (Material 3 — light + dark) ───────────────────────────────
color:
  light:
    primary:                 "#1800B1"
    on_primary:              "#FFFFFF"
    primary_container:       "#E0E0FF"
    on_primary_container:    "#04006D"

    secondary:               "#5C5D72"
    on_secondary:            "#FFFFFF"
    secondary_container:     "#E1E0F9"
    on_secondary_container:  "#191A2C"

    tertiary:                "#785368"
    on_tertiary:             "#FFFFFF"
    tertiary_container:      "#FFD8EC"
    on_tertiary_container:   "#2E1123"

    error:                   "#BA1A1A"
    on_error:                "#FFFFFF"
    error_container:         "#FFDAD6"
    on_error_container:      "#410002"

    background:              "#FCF8FF"
    on_background:           "#1B1B21"
    surface:                 "#FCF8FF"
    on_surface:              "#1B1B21"
    surface_variant:         "#E3E1EC"
    on_surface_variant:      "#46464F"
    surface_container:       "#F0EDF7"
    surface_container_high:  "#EAE7F1"

    outline:                 "#767680"
    outline_variant:         "#C7C5D0"
    scrim:                   "#000000"

  dark:
    primary:                 "#C0C1FF"
    on_primary:              "#1E1B98"
    primary_container:       "#3835AF"
    on_primary_container:    "#E0E0FF"

    secondary:               "#C5C4DD"
    on_secondary:            "#2E2F42"
    secondary_container:     "#444559"
    on_secondary_container:  "#E1E0F9"

    tertiary:                "#E8B9D0"
    on_tertiary:             "#462637"
    tertiary_container:      "#5E3C4F"
    on_tertiary_container:   "#FFD8EC"

    error:                   "#FFB4AB"
    on_error:                "#690005"
    error_container:         "#93000A"
    on_error_container:      "#FFDAD6"

    background:              "#13131B"
    on_background:           "#E4E1E9"
    surface:                 "#13131B"
    on_surface:              "#E4E1E9"
    surface_variant:         "#46464F"
    on_surface_variant:      "#C7C5D0"
    surface_container:       "#1F1F27"
    surface_container_high:  "#292932"

    outline:                 "#90909A"
    outline_variant:         "#46464F"
    scrim:                   "#000000"

# ─── Typography (Material 3 type scale) ──────────────────────────────────────
typography:
  font_families:
    display: "Space Grotesk"
    body: "Inter"
    monospace: "JetBrains Mono"

  scale:
    display_lg:   { size: 57, line: 64, weight: 400, tracking: -0.25 }
    display_md:   { size: 45, line: 52, weight: 400, tracking: 0 }
    display_sm:   { size: 36, line: 44, weight: 400, tracking: 0 }

    headline_lg:  { size: 32, line: 40, weight: 400, tracking: 0 }
    headline_md:  { size: 28, line: 36, weight: 400, tracking: 0 }
    headline_sm:  { size: 24, line: 32, weight: 400, tracking: 0 }

    title_lg:     { size: 22, line: 28, weight: 400, tracking: 0 }
    title_md:     { size: 16, line: 24, weight: 500, tracking: 0.15 }
    title_sm:     { size: 14, line: 20, weight: 500, tracking: 0.1 }

    body_lg:      { size: 16, line: 24, weight: 400, tracking: 0.5 }
    body_md:      { size: 14, line: 20, weight: 400, tracking: 0.25 }
    body_sm:      { size: 12, line: 16, weight: 400, tracking: 0.4 }

    label_lg:     { size: 14, line: 20, weight: 500, tracking: 0.1 }
    label_md:     { size: 12, line: 16, weight: 500, tracking: 0.5 }
    label_sm:     { size: 11, line: 16, weight: 500, tracking: 0.5 }

# ─── Spacing (8dp grid) ──────────────────────────────────────────────────────
spacing:
  none:   0
  xs:     4
  sm:     8
  md:     16
  lg:     24
  xl:     32
  xxl:    48
  xxxl:   64

# ─── Radius ──────────────────────────────────────────────────────────────────
radius:
  none:   0
  xs:     4
  sm:     8
  md:     12
  lg:     16
  xl:     24
  pill:   999

# ─── Elevation (Material 3 levels) ───────────────────────────────────────────
elevation:
  level0: 0
  level1: 1
  level2: 3
  level3: 6
  level4: 8
  level5: 12

# ─── Motion ──────────────────────────────────────────────────────────────────
motion:
  duration:
    short1:   50
    short2:   100
    short3:   150
    short4:   200
    medium1:  250
    medium2:  300
    medium3:  350
    medium4:  400
    long1:    450
    long2:    500
  easing:
    standard:        "cubic-bezier(0.2, 0, 0, 1)"
    standard_accel:  "cubic-bezier(0.3, 0, 1, 1)"
    standard_decel:  "cubic-bezier(0, 0, 0, 1)"
    emphasized:      "cubic-bezier(0.2, 0, 0, 1)"

# ─── Iconography ─────────────────────────────────────────────────────────────
iconography:
  set: "Material Symbols Outlined"
  default_size: 24
  sizes: [16, 20, 24, 32, 40, 48]

# ─── Component tokens (high-level — see COMPONENTS.md for full surface) ─────
component_tokens:
  button:
    height_default: 40
    height_compact: 32
    padding_horizontal: 16
    radius: pill
  card:
    radius: md
    padding: md
    elevation: level1
  text_field:
    height: 56
    radius: xs
  app_bar:
    height: 64
  bottom_nav:
    height: 80
  touch_target_min: 48
