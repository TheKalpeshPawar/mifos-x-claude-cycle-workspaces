  scale: [0, 4, 8, 12, 16, 24, 32, 48, 64]
  screen_padding: 16
  radius:
    none: 0
    extra_small: 4
    small: 8
    medium: 12
    large: 16
    extra_large: 28
    full: 9999
  density: comfortable

elevation:
  level0: 0
  level1: 1
  level2: 3
  level3: 6
  level4: 8
  level5: 12

