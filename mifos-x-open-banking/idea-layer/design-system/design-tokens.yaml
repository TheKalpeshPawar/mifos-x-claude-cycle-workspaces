source: "Material Theme Builder (Color.kt/Theme.kt) — verbatim M3 roles"
theme_mode: auto            # design_read.brand_constraints.theme
aesthetic_family: minimalist-ui
dynamic_color: true         # Android 12+ may override with wallpaper-derived scheme

