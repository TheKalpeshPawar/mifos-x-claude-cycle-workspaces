# Agent-facing convenience aliases (DESIGN.md front-matter subset)
colors_primary: "#266489"
colors_secondary: "#50606E"
colors_tertiary: "#64597B"
colors_surface: "#F7F9FF"
colors_background: "#F7F9FF"
colors_error: "#BA1A1A"

# Contrast variants available in the source theme (for accessibility-first quiet_constraint):
contrast_variants: [standard, medium, high]   # full role sets in Color.kt if needed

# ─── Typography (Roboto — M3 default; Type.kt = Typography()) ────────────────
typography:
  font_family:
    brand: "Roboto"
    plain: "Roboto"
    body: "Roboto"
    mono: "Roboto Mono"   # for amounts / account numbers
  scale: default
  roles:
    displayLarge:   { size: 57, line: 64, weight: 400 }
    displayMedium:  { size: 45, line: 52, weight: 400 }
    displaySmall:   { size: 36, line: 44, weight: 400 }
    headlineLarge:  { size: 32, line: 40, weight: 400 }
    headlineMedium: { size: 28, line: 36, weight: 400 }
    headlineSmall:  { size: 24, line: 32, weight: 400 }
    titleLarge:     { size: 22, line: 28, weight: 400 }
    titleMedium:    { size: 16, line: 24, weight: 500 }
    titleSmall:     { size: 14, line: 20, weight: 500 }
    bodyLarge:      { size: 16, line: 24, weight: 400 }
    bodyMedium:     { size: 14, line: 20, weight: 400 }
    bodySmall:      { size: 12, line: 16, weight: 400 }
    labelLarge:     { size: 14, line: 20, weight: 500 }
    labelMedium:    { size: 12, line: 16, weight: 500 }
    labelSmall:     { size: 11, line: 16, weight: 500 }

# ─── Spacing / shape (M3; density 5 = comfortable) ───────────────────────────
spacing:
  base: 4
  scale: [0, 4, 8, 12, 16, 24, 32, 48, 64]
  screen_padding: 16
  radius:
    none: 0
    extra_small: 4
    small: 8
    medium: 12
    large: 16
    extra_large: 28
    full: 9999
  density: comfortable

elevation:
  level0: 0
  level1: 1
  level2: 3
  level3: 6
  level4: 8
  level5: 12

motion:
  enabled: true
  intensity: low            # design_read.dials.motion = 2 (accessibility-first)
  emphasis_easing: "cubic-bezier(0.2, 0.0, 0, 1.0)"
  durations: { short: 150, medium: 300, long: 450 }

# ─── Mood gradient (subtle trust-blue wash, derived from primary) ────────────
mood_gradients:
  hero:
    light: ["#C9E6FF", "#F7F9FF"]
    dark:  ["#004B6F", "#101417"]
  accent:
    light: ["#266489", "#50606E"]
    dark:  ["#95CDF7", "#B7C9D9"]

accessibility:
  contrast_target: "WCAG AA"   # quiet_constraints: accessibility-first, regulated-industry
  min_touch_target_dp: 48
  reduce_motion_supported: true
