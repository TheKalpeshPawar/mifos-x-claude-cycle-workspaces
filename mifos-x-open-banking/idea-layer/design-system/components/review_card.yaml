id: review_card
category: container
m3: Card
added: "1.1.0"
trust_critical: true
tokens_ref: "../design-tokens.yaml#irreversible_action"

purpose: >-
  The last surface a customer sees before money moves. It is to a payment what `consent_card`
  is to data sharing, and it earns the same trust-critical status — with one difference that
  matters: revoking a consent is reversible (re-authorise), sending a payment is not.

anatomy:
  container: "{colors.surfaceContainer}"
  radius: "{spacing.radius.medium}"
  elevation: "{elevation.level1}"
  padding_dp: 16
  rows: payment_summary_row
  row_order: [funding_account, payee, amount, reference]
  amount_emphasis:
    typography: headlineSmall
    font: "{typography.font_family.mono}"

content_rules:
  - id: RC-1
    rule: "Every value that will be committed appears in full. Nothing summarised, nothing truncated."
    why: >-
      A truncated sort code or a payee shown as 'Jameson L…' is exactly the field a customer
      needs to check. Truncation here defeats the surface's only purpose.
  - id: RC-2
    rule: "No value on this card is editable in place. Editing goes back to the step that owns it."
    why: >-
      Inline edit on a confirmation surface invites a change the customer does not re-read.
      Going back re-runs that step's validation.
  - id: RC-3
    rule: "The card renders before any request is sent — nothing is staged at this point."
    why: "Cancel here must cost nothing and leave no consent behind at the bank."

action_contract:
  primary_cta:
    label_pattern: "Send {amount}"
    example: "Send £850.00"
    role: primary
    why_not_error_role: >-
      Red would frame a payment the customer intends as a danger, and the system reserves red
      for genuine failure. The weight comes from this surface and from the amount in the
      label, not from alarm colour.
    on_tap: "locks immediately and shows progress — double-submission must be impossible from the UI"
  escape:
    label: Cancel
    role: text
    placement: adjacent_to_primary
    rule: "A destructive-adjacent CTA is never presented alone."

a11y:
  min_touch_target_dp: 48
  announce: >-
    Read the card as a group, in row order, before the CTA — so a screen-reader user hears the
    full commitment before reaching the button, matching what a sighted user scans.
  focus_order: [rows, cancel, primary_cta]

consumers:
  - send-money

related:
  - consent_card   # same trust-critical treatment, reversible action
