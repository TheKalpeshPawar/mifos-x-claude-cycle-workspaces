  # ── AC1: action_contract missing (RULE-IDEA-ACTION-CONTRACT-001) ─────────
  #
  # Detected 2026-07-16 by /idea-sync STEP 1 via a nested component-tree audit.
  #
  # PROJECT-WIDE: 124 of 124 interactive on_click components lack an
  # action_contract block. ZERO are present anywhere in the project. The rule is
  # severity: error, grace_until: null (HARD-IMMEDIATE, no waiver path) and
  # gates /implement.
  #
  # WHY THIS WAS NEVER REPORTED: the shipped gate
  # .claude-runtime/scripts/framework-verify-action-contract.sh returned
  # "0 violations" — a false green — for two stacked parser defects:
  #   1. It only recognised a component whose FIRST key is `- id:`, but the
  #      canonical /idea-feature-enrich output writes `- type:` first. This hid
  #      ~88% of components (30 seen vs 248 real). Fixed locally 2026-07-16.
  #   2. It models only FLAT components and collapses each subtree into a single
  #      verdict, so components nested under `children:` / `trailing_content:` —
  #      where nearly every interactive component in this project lives — are
  #      never evaluated. STILL OPEN: the gate cannot confirm these findings.
  # Until defect 2 is fixed, G-ACTION-CONTRACT exit 0 does NOT mean AC1 passes.
  #
  # Per-feature fix: /idea-feature-enrich {feature} --re-author-action-contracts
  # (RULE-IDEA-ACTION-CONTRACT-001 line 53 declares this the gap-registry route.)
  # Each contract needs: effect ∈ core/registries/ACTION_CONTRACT_EFFECTS.yaml
  # (12 keys), ≥1 library_refs/external_library_refs when effect ∉ {none,navigate}
  # (AC3), and a 30..400 char description free of DC-2 forbidden tokens (AC4/AC5).

  - feature_id: "settings"
    sub_check: AC1
    category: action_contract
    gap_class: fail
    rule: RULE-IDEA-ACTION-CONTRACT-001
    error_code: ACTION_CONTRACT_MISSING
    status: closed
    detected_at: "2026-07-16T11:30:00Z"
    detected_by: "/idea-sync STEP 1 (nested component-tree audit)"
    closed_at: "2026-07-16T12:05:00Z"
    closed_by: "/idea-feature-enrich-loop"
    resolution: >
      action_contract authored for every interactive on_click in this feature.
      Each block declares an effect from the 12-key closed enum in
      ACTION_CONTRACT_EFFECTS.yaml, a 30..400 char description grounded in the
      feature's own data-flow.yaml / api.yaml / test_context (no DC-2 forbidden
      tokens), and — for every effect outside {navigate, none} — at least one
      external_library_refs entry per AC3. library_refs[] is unused throughout:
      the cmp-* catalog in CAPABILITY_PROVIDERS.yaml provides only
