        not merely under-reporting.
        (b) home/view_all_transactions_link (text_button) and settings/theme_row (select) remain
        unevaluated DELIBERATELY. action-contract-walk.ts:32-37 documents the decision verbatim:
        the vocabulary omits text_button/segmented_button/etc. because "widening it is a
        rule-semantics change with cross-project blast radius, so it is deliberately NOT done
        here — see the gate's --report-untyped output". The untyped report IS the intended
        surfacing mechanism; it is working as designed. Retyping those two components to fit
        the tool would distort the spec to satisfy a gate, which is backwards.
      verified: "walker re-run: 414 blocks, AC3 violations 4 -> 0; unevaluated 6 -> 2 (both by design)"
    summary: >-
      6 on_click components fall outside the action-contract rule's interactive type
      vocabulary and are therefore NEVER evaluated — the walker labels this "a coverage
      hole, not a pass".
    detail: >-
      Four of the six (accounts' filter chips) declare NO `type:` at all. A component with an
      on_click but no type escapes RULE-IDEA-ACTION-CONTRACT-001 silently: it is neither
      passed nor failed, it is skipped. That is how a feature can report a clean
      action-contract gate while shipping unverified handlers. The other two declare types
      (`text_button`, `select`) that are real but absent from the rule's vocabulary.
      Two fixes are possible and they are NOT equivalent: (a) give the four accounts filters
      a real type, which is a project fix; (b) extend the rule's vocabulary to cover
      text_button and select, which is a FRAMEWORK fix affecting every project.
