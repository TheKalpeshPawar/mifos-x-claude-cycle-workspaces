findings:
  # Seeded 2026-07-30 by /idea-heal --feature scheduled-payments via the engine's
  # verify-stage discovery producer (_shared/idea-gap-discovery.md). Discovery ran
  # INLINE per STEP D0's fallback (Read tool only, no sub-agent dispatch available
  # this session). Passed the STEP D4 evidence gate: every cited path resolves and
  # each anchor was re-read with the Read tool to confirm the claim is grounded.
  #
  # NOT found by /idea-verify, and worth recording why: verify's states check is only
  # "ui.yaml#states[] non-empty" (idea-verify capsule Phase 1 step 8). scheduled-
  # payments declares four states, so it PASSES. No deterministic check compares
  # declared states across a feature cluster — which is exactly the class the
  # discovery producer exists to catch, and why the 07-28 back-fill could skip one
  # feature silently. See promotion_candidates below.
  - rule_id: RULE-IDEA-GAP-DISCOVERY-001
    gap_class: discovered-missing-state-vs-cluster-siblings
    severity: error
    evidence: "file:idea-layer/screens/scheduled-payments/ui.yaml#states"
    evidence_refs:
      - "file:idea-layer/screens/scheduled-payments/ui.yaml:15  -> states: [loading, content, empty, error]"
      - "file:idea-layer/screens/direct-debits/ui.yaml:15        -> states: [loading, content, empty, unsupported, error]"
      - "file:idea-layer/screens/standing-orders/ui.yaml:15      -> states: [loading, content, empty, unsupported, error]"
      - "file:idea-layer/screens/direct-debits/ui.yaml:252-263   -> unsupported_direct_debits component block to mirror"
      - "file:idea-layer/screens/direct-debits/ui.yaml:46        -> records that direct-debits' unsupported state was BACK-FILLED from source; 'the idea-layer never declared it'"
    feature: scheduled-payments
    screen: scheduled-payments
    source: gap-discovery
    scope: cross-feature
    discovery_id: "DISCOVERY:scheduled-payments:missing-unsupported-state"
    confidence: 95
    removal_tier: high
    delegated_to: "/idea-feature-enrich"
    recurrence: 1
    status: partially-resolved
    resolution_log:
      - at: "2026-07-30"
        by: "/idea-feature-enrich-loop --feature scheduled-payments"
        step: 1
        done: >-
          idea-layer state declared. ui.yaml#states now [loading, content, empty,
          unsupported, error]; unsupported_scheduled_payments empty_state block added
          between the empty and error blocks (mirrors direct-debits/ui.yaml:251-268,
          adapted to this feature's flat sp_* string convention); strings
          sp_unsupported_title + sp_unsupported_a11y added. All three touched files
          parse; both new keys resolve 1:1 so i18n parity holds.
        delegate_note: >-
          The engine's declared delegate /idea-feature-enrich was NOT invocable this
          session (harness "Unknown skill" — root-caused to its SKILL.md `arguments:`
          map, since removed; registration only refreshes in a NEW session). Ran the
          in-family /idea-feature-enrich-loop instead, whose runtime IS the Steps C-G
          sub-file of idea-feature-enrich. Its 882-line detail body was NOT loaded —
          remaining context could not hold it AND complete the mutation safely, so the
          change was confined to the shape this finding already specifies.
      - step: 2
        status: OPEN
        what: "Declare the U000 refusal in api.yaml for ALL THREE gated features (scheduled-payments, direct-debits, standing-orders). U000 is still modelled nowhere in the idea-layer — the state exists, the condition producing it does not."
      - step: 3
        status: OPEN
        what: "Source, via /implement (never hand-patched first): Unsupported(message) on ScheduledPaymentsUiState + the error.isUnsupportedForProduct() branch ahead of classification, mirroring DirectDebitsViewModel.kt:64, + ScheduledPaymentsUnsupported.kt."
    summary: >-
      scheduled-payments omits the `unsupported` state that both its capability-gated
      cluster siblings declare, so a product-refusal (OBIE U000) has no state to land in.
    detail: >-
      All three of direct-debits, standing-orders and scheduled-payments are product-gated
      — each one's store fetcher calls recordIfUnsupported() on a U000 refusal before
      rethrowing (source BankingStores.kt:234, :344, :377). Only the first two declare an
      `unsupported` state, and only the first two implement one.

      The 2026-07-28 reverse sync back-filled `unsupported` into direct-debits and
      standing-orders FROM source (their ui.yaml:46 says so explicitly) and MISSED
      scheduled-payments. It is therefore the one feature where the state is absent from
      BOTH layers: no `unsupported` in ui.yaml#states, and zero Unsupported files in
      feature/scheduled-payments/.

      User-visible consequence: source classifyScheduledPaymentsError() has no U000 branch,
      so the refusal falls to `else -> ScheduledPaymentsError.NetworkError`, which that
      function's own KDoc documents as retriable. A PSU reaching this screen on a credit
      card (the product that cannot serve it) gets a Retry button that can never succeed.

      Root cause is UPSTREAM of both layers: `U000` is modelled NOWHERE in the idea-layer —
      not in scheduled-payments/api.yaml, and not even in direct-debits/api.yaml. The
      idea-layer carries the STATE but has never declared the CONDITION that produces it,
      which is what let a back-fill cover two features and skip the third undetected.
    fix_order:
      - "1. idea-layer (this finding, delegated): add `unsupported` to scheduled-payments/ui.yaml#states + the unsupported_scheduled_payments component block, state_binding, test_tag, accessibility_label and strings, mirroring direct-debits/ui.yaml:252-263."
      - "2. idea-layer (recommended, wider): declare the U000 refusal in api.yaml for all THREE gated features so the condition is specified, not just the state."
      - "3. source (follows via /implement, NOT hand-patched first): Unsupported(message) on the sealed interface + the error.isUnsupportedForProduct() branch ahead of classification, mirroring DirectDebitsViewModel.kt:64, + ScheduledPaymentsUnsupported.kt. Shared helpers isUnsupportedForProduct()/obieMessage() already exist in core/data/util."
    fix_order_rationale: >-
      Idea-layer first per RULE-GAP-IDEA-FIRST-001. Patching source alone would leave
      ui.yaml declaring four states — the idea<->source drift the framework exists to
      prevent — and the next /kmp-implement could regenerate the defect.

