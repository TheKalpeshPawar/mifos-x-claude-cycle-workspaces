    scope: cross-feature
    discovery_id: "VERIFY:action-contract:unevaluated-types"
    confidence: 100
    removal_tier: low
    delegated_to: "/idea-feature-enrich"
    recurrence: 1
    status: resolved
    resolution:
      at: "2026-07-30"
      by: "/idea-heal (inline)"
      outcome: >-
        RESOLVED for the 4 real ones; the other 2 are BY DESIGN, not a defect — my original
        framing of them as "a framework fix" was wrong and is corrected here.
        (a) accounts' filter_all/current/savings/credit now declare `type: chip`, matching the
        convention account-detail's chips already use. Making them visible immediately exposed
        4 GENUINE AC3 violations that the coverage hole had been hiding — `effect:
        transform_state` with no library_refs — now fixed with external_library_refs:
