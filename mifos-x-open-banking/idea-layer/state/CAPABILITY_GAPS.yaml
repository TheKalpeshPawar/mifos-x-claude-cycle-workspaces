deferred_by_design:
  # Not findings — deliberately absent artifacts, recorded so a future run does
  # not raise them as regressions.
  #
  # DECISION 2026-07-30 (user, via /idea-heal): the visual tier is deferred to a
  # future cycle. This closes the "open decision" the 07-28 reset left on
  # stitch_coverage. Both classes below are SETTLED deferrals, not pending
  # questions — a verify/sync run must count them as satisfied, not absent.
  - class: stitch_coverage
    reason: >-
      Stitch MOCKUP generation deferred to a future cycle (user decision
      2026-07-30). Scope is mockups/{feature}/ — the Stitch-SDK visual output
      (stitch/{state}/code.html + screen.png) and STITCH_STATUS.yaml. NOT an
      open question; do not re-raise as a gap. Revisit only on an explicit
      request to run the visual tier.
    features: all
    decided_at: "2026-07-30"
    decided_by: user
    status: settled
    # SCOPE CORRECTED 2026-07-30 (user). An earlier revision of this entry claimed the
    # deferral also covered screens/*/prompts/{state}.md. That was the agent's inference,
    # NOT the user's decision — the user deferred "previews and stitch MOCKUP generation".
    # Per-state prompts are NOT deferred: they are local markdown design directives built
    # by .claude-runtime/scripts/stitch-prompt-build.ts with zero Stitch-SDK involvement.
    excludes:
      - "screens/*/prompts/{state}.md — NOT deferred; see open_no_command_path below"
    RESOLVED_2026_07_30:
      what: "95 per-state prompts built across 23/23 features — screens/{f}/prompts/{state}.md"
      how: >-
        deno run .claude-runtime/scripts/stitch-prompt-build.ts --workspace
        mifos-x/mifos-x-open-banking --all-features --all-states --force
      why_force: >-
        Every state failed STN7 ("inputs changed since last build — regenerate"), which is the
        cache-freshness gate doing its job: ui.yaml had changed since the last build. --force is
        the sanctioned way past a stale cache, not a gate bypass. With it, 95 written / 0 failed.
      no_sdk_involved: >-
        This is the BUILD stage only (capsule IFS-3). The Stitch SDK GENERATE stage was NOT run,
        so the deferred mockups were not produced — prompts and mockups stayed correctly separated.
      verified: "23/23 prompts/ dirs; 95 .md files; delimited '↓↓↓ MOCKUP PROMPT ↑↑↑' block present"
    superseded_open_no_command_path:
      note: "Kept for provenance — the gap below is what RESOLVED_2026_07_30 above closed."
      artifact: "idea-layer/screens/{feature}/prompts/{state}.md"
      problem: >-
        No command generates prompts alone. /idea-feature-stitch is a single 6-step
        pipeline (BUILD -> POLISH -> VALIDATE -> GENERATE -> VERIFY -> PREFLIGHT) whose
        own capsule states "One command, no flag toggles"; its --build-prompts flag is
        deprecated and IGNORED, so invoking it runs Stage 4 GENERATE against the Stitch
        SDK — i.e. it produces the very mockups that ARE deferred. /idea-feature-export
        --all excludes prompts by design (idea-feature-export.md:47). /idea-feature-render
        builds them only as a self-heal side effect of the preview run, which is deferred.
      only_local_path: >-
        .claude-runtime/scripts/stitch-prompt-build.ts — the script /idea-feature-stitch
        itself consumes at its BUILD stage (capsule IFS-3), so running it is that stage,
        not a hand-rolled substitute.
      recommendation: >-
        Sequence AFTER the /idea-verify re-seed and the enrich pass. Those edit multiple
        ui.yaml files (scheduled-payments already changed this session), and prompts are
        derived from ui.yaml — generating 23 x ~4 files first means regenerating them.
        Timing only; this is NOT a deferral.
  - class: preview_render
    reason: >-
      HTML preview generation (screens/*/preview/{state}.html) deferred to a
      future cycle (user decision 2026-07-30). Scope is the rendered HTML ONLY.
      The renderer's input, screens/*/prompts/{state}.md, is NOT deferred —
      corrected 2026-07-30; see stitch_coverage#excludes above.
    features: all
    decided_at: "2026-07-30"
    decided_by: user
    status: settled

