  # ── CC1: storage_location ─────────────────────────────────────────────────

  - feature_id: "pfm-dashboard"
    sub_check: CC1
    category: storage_location
    gap_class: warn
    evidence: >
      pfm-dashboard aggregates spending data from cached AIS transactions and
      balances in a local PFM Room repository (data-flow.yaml confirms
      "Read cached transaction list and account balances from the local PFM
      repository"). No "Storage location" affordance is declared in ui.yaml —
      users cannot see where the aggregated PFM data lives.
    suggested_fix: |
      Add to pfm-dashboard or settings/ui.yaml:
        - type: info_row
          label: "{strings.settings.storage.pfm_data}"
          value: "{platform.app_files_dir}/databases/pfm_cache"
      Or add a Storage sub-section in settings that aggregates PFM cache size.

  - feature_id: "spending-by-category"
    sub_check: CC1
    category: storage_location
    gap_class: warn
    evidence: >
      spending-by-category reads PFM-aggregated spending from the same local
      PFM Room cache referenced in pfm-dashboard and budgets
      ("Derived from cached PFM Room data"). No storage location surface
      declared in ui.yaml or settings.
    suggested_fix: |
      Point to the same Storage settings entry recommended for pfm-dashboard.
      Shared data source → single shared affordance is sufficient.

  - feature_id: "budgets"
    sub_check: CC1
    category: storage_location
    gap_class: warn
    status: closed
    closed_at: "2026-07-14"
    closed_by: "/idea-enrich budgets"
    evidence: >
      budgets data-flow declares "Read persisted budgets from local DataStore
      via kotlinx-serialization" and derives spend from "in-app AIS
      transaction cache". DataStore + Room cache in use, but ui.yaml had no
      storage location or storage-usage surface.
    resolution: >
      Added budgets_storage_hint caption component to ui.yaml (state_binding: [content, empty])
      with value "{strings.budgets.storage_hint}" = "Budget limits are saved on this device only.
      Clearing app data will remove all budgets." This surfaces storage transparency directly
      on the budgets screen for all states where the form is visible. String registered in
      _strings/strings.yaml per RULE-IDEA-I18N-COMPLETENESS-001.

  # ── CC5: permission_visibility ────────────────────────────────────────────

  - feature_id: "atm-locator"
    sub_check: CC5
    category: permission_visibility
    gap_class: warn
    evidence: >
      atm-locator uses GPS location via a platform expect/actual
      ("distance sort via GPS expect/actual with postcode-centroid fallback").
      ui.yaml shows a location_off icon for the no-GPS fallback path, but
      there is no in-app settings surface that (a) shows the current GPS
      permission grant state, (b) explains the purpose, or (c) offers
      revoke/re-request. The graceful degradation to postcode-centroid is
      documented, but the permission visibility surface is absent from
      settings/ui.yaml.
    suggested_fix: |
      Add to settings/ui.yaml (or a new permissions-settings sub-screen):
        - type: info_row
          label: "{strings.settings.permissions.location}"
          value: "{runtime.gps_permission_state}"  # granted | denied | not_asked
          secondary: "Used to sort ATMs by distance from your current location"
          trailing: permission_settings_deep_link_button
      Document graceful-degradation (postcode-centroid fallback) in
      atm-locator/docs.yaml under the location capability.

  # ── CC7: network_data_policy ──────────────────────────────────────────────

  - feature_id: "home"
    sub_check: CC7
    category: network_data_policy
    gap_class: advisory
    evidence: >
      home/api.yaml declares three OBIE endpoints (GET /accounts, GET
      /accounts/{AccountId}/balances, GET /accounts/{AccountId}/transactions)
      with no network_policy field on any endpoint. No project-level default
      is declared in idea-plan.yaml#network_policy.default. All endpoints
      make small JSON fetches (cellular-safe), but the policy is implicit,
      not declared.
    suggested_fix: |
      Add to each endpoint in home/api.yaml:
        network_policy: cellular_allowed  # small JSON, safe on cellular
      Add to idea-plan.yaml:
        network_policy:
          default: cellular_allowed
          large_download_threshold_kb: 500
      This advisory promotes to warn at production launch (pre-production grace).

  - feature_id: "accounts"
    sub_check: CC7
    category: network_data_policy
    gap_class: advisory
    evidence: >
      accounts/api.yaml endpoints (GET /accounts, GET
      /accounts/{AccountId}/balances) lack network_policy declarations.
      Same pattern as home — small JSON fetches, cellular-safe but undeclared.
    suggested_fix: |
      Add network_policy: cellular_allowed to all endpoints in accounts/api.yaml.

  - feature_id: "transactions"
    sub_check: CC7
    category: network_data_policy
    gap_class: advisory
    evidence: >
      transactions/api.yaml (GET /accounts/{AccountId}/transactions with
      pagination) lacks network_policy. Paginated responses can accumulate
      data transfer on cellular; declaring the policy enables user control.
    suggested_fix: |
      Add network_policy: cellular_allowed to endpoints in transactions/api.yaml.
      Consider adding a "Load more only on Wi-Fi" setting for users on
      limited data plans.

  - feature_id: "atm-locator"
    sub_check: CC7
    category: network_data_policy
    gap_class: advisory
    evidence: >
      atm-locator/api.yaml (GET /atms, unauthenticated Open Data endpoint)
      lacks network_policy. The ATM list is a mid-size JSON payload (~50-200
      KB depending on geography) and could be cached client-side, reducing
      cellular usage.
    suggested_fix: |
      Add to atm-locator/api.yaml endpoint:
        network_policy: cellular_allowed
        response_caching: ttl_minutes: 60  # ATM locations change rarely

  # ── CC8: cache_lifecycle ──────────────────────────────────────────────────

  - feature_id: "pfm-dashboard"
    sub_check: CC8
    category: cache_lifecycle
    gap_class: warn
    evidence: >
      pfm-dashboard reads from a local PFM Room repository that aggregates
      transaction and balance data. data-flow.yaml confirms cached data use,
      but neither data-flow.yaml nor docs.yaml declares (a) cache expiry TTL
      or LRU policy, (b) a manual "Clear PFM cache" UI affordance, or (c)
      current cache size display. Users cannot know when the data is stale
      or how to free the space.
    suggested_fix: |
      1. Add to pfm-dashboard/data-flow.yaml:
           cache_layers:
             - name: pfm_room_cache
               store: room-kmp
               expiry: ttl_hours: 24  # or session-bound
               max_size_mb: 50
               clear_trigger: manual | consent_revoked
      2. Add to settings/ui.yaml:
           - type: action_row
             label: "{strings.settings.storage.clear_pfm_cache}"
             secondary: "{strings.settings.storage.clear_pfm_cache.size}"
             on_click: { action: clear_pfm_cache }

  - feature_id: "spending-by-category"
    sub_check: CC8
    category: cache_lifecycle
    gap_class: warn
    evidence: >
      spending-by-category derives data from the same PFM Room cache as
      pfm-dashboard. No cache expiry or clear-UI is declared. Same gap class
      as pfm-dashboard since they share the same backing store.
    suggested_fix: |
      Same fix as pfm-dashboard — shared Room cache, single settings entry
      covers both screens. Add cache_layers to spending-by-category/data-flow.yaml
      pointing to the same pfm_room_cache layer.

  - feature_id: "budgets"
    sub_check: CC8
    category: cache_lifecycle
    gap_class: warn
    status: closed
    closed_at: "2026-07-14"
    closed_by: "/idea-enrich budgets"
    evidence: >
      budgets uses DataStore for persisted budget definitions and the AIS
      transaction cache for spend computation. data-flow.yaml declared the
      use of "in-app AIS transaction cache" but no expiry policy or
      clear-cache affordance was specified. DataStore was persistent; the
      transaction cache had no declared eviction strategy.
    resolution: >
      Added cache_layers section to budgets/data-flow.yaml with two entries:
      (1) budgets_datastore — datastore-preferences, persistent expiry, cleared only on
      explicit user delete per entry or account disconnect, ~1 KB per entry;
      (2) ais_transaction_cache — in_memory, session_bound expiry (cleared on process kill),
      owned by transactions feature, read-only consumer, no max-size cap needed.
      The AIS cache is session-bound so there is no unbounded accumulation; clear-cache
      affordance is not needed as it self-clears each session.

