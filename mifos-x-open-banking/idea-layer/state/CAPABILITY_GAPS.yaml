  # ── CC8: cache_lifecycle ──────────────────────────────────────────────────

  - feature_id: "pfm-dashboard"
    sub_check: CC8
    category: cache_lifecycle
    gap_class: warn
    status: closed
    closed_at: "2026-07-14"
    closed_by: "/idea-enrich pfm-dashboard"
    evidence: >
      pfm-dashboard reads from a local PFM Room repository that aggregates
      transaction and balance data. data-flow.yaml confirms cached data use,
      but neither data-flow.yaml nor docs.yaml declares (a) cache expiry TTL
      or LRU policy, (b) a manual "Clear PFM cache" UI affordance, or (c)
      current cache size display. Users cannot know when the data is stale
      or how to free the space.
    resolution: >
      (1) data-flow.yaml already has cache_layers: pfm_room_cache — TTL 24 h, max 50 MB, LRU,
      clear_triggers: [manual, consent_revoked], staleness_indicator: true.
      (2) Added list_item id=clear_pfm_cache_row to Storage section in settings/ui.yaml with
      on_click action=clear_pfm_cache, label "{strings.settings.storage.clear_pfm_cache}",
      supporting_text "{strings.settings.storage.clear_pfm_cache.secondary}". String keys
      registered in _strings/strings.yaml. CC8 resolution documented in docs.yaml. evidence.count_after: 0.
    suggested_fix: |
      1. Add to pfm-dashboard/data-flow.yaml:
           cache_layers:
             - name: pfm_room_cache
               store: room-kmp
               expiry: ttl_hours: 24  # or session-bound
               max_size_mb: 50
               clear_trigger: manual | consent_revoked
      2. Add to settings/ui.yaml:
           - type: action_row
             label: "{strings.settings.storage.clear_pfm_cache}"
             secondary: "{strings.settings.storage.clear_pfm_cache.size}"
             on_click: { action: clear_pfm_cache }

