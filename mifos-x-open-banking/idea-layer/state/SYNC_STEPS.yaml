    F5_export_matrix: >-
      pending_generation corrected — mockup / prompts_figma / preview_html were declared
      `absent, deferred` while 23 / 23 / 95 files sat on disk. 4 new __all__ cells registered so
      those groups are watched. summary recounted: 58 ledger rows, 436 tracked artifacts.
    F6_stitch_prompts: "95 prompts rebuilt via stitch-prompt-build.ts --force. No Stitch SDK call."
    F7_training_master: >-
      component_inventory re-measured (414 -> 430 components / 431 walker blocks, with the
      reconciliation between the two recorded); action_contract.coverage_holes closed; a new
      test_tags section added carrying the tag conventions, builder-key contracts and the
      unbound class.
    F8_journeys: "covered under F4"

  gates_after:
    yaml_parse: "295 files, 0 failures"
    action_contract: "23 ui.yaml, 431 component blocks, 0 violations, 0 unevaluated (--report-untyped empty)"
    i18n: "564 declared keys, 535 referenced, 0 unresolved"
    nav_targets: "20 distinct targets, 0 dead"
    initial_state: "23/23 initial_state values are declared states"
    flow_ref_resolution: "23/23 docs.yaml flow_refs resolve to a flows/*.yaml"
    journey_screen_ids: "0 dangling screen_ids across 9 journeys"
    prompt_rebuild: "95 written, 0 cached, 0 failed"

  new_finding_open:
    id: PROMPT-BUILDER-CHILDREN-ONLY
    severity: warn
    owner: framework
    detail: >-
      After a FORCED prompt rebuild, 11 component ids across 5 features still do not appear in
      their prompts — accounts' 4 filter chips, direct-debits' 2 count chips, user-onboarding's
      2 trust chips, transactions' 2 stat entries and beneficiaries' avatar. All 11 live under
      a container key other than `children:` (`chips:`, `stats:`, `leading:`), and
      stitch-prompt-build.ts walks only `children:` when rendering the component tree. So this
      is a BUILDER limitation, not project staleness — proven by the omission surviving --force.
    not_fixed_here: >-
      The obvious project-side "fix" is renaming those keys to `children:`, which would be
      wrong: `leading:` is a legitimate M3 list-item slot and `stats:` entries are data rows,
      not components. The real fix is teaching the builder the other container keys, which is a
      framework change with cross-project reach and wants its own canary.

