    F3_test_tags: >-
      259 test_tag bindings written across 20 features from the 18 source TestTags.kt objects.
      Every FLAT const in all 18 modules is now either bound to a component or recorded under
      ui.yaml#test_tags.unbound with the reason it has no anchor. 23/23 features carry a
      test_tags reconciliation block.
    F4_flow_metadata: >-
      flow_ref backfilled into 14 docs.yaml (23/23 now declare one, derived from
      flows/*.yaml#screens[] membership); flows/send-money-payment.yaml reshaped from the
      journey container into the flow container its 8 siblings use; journeys/send-money-payment.yaml
