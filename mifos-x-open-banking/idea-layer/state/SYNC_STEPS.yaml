# Direction is DELIBERATELY inverted for this run. RULE-GAP-IDEA-FIRST-001 normally makes the
# idea-layer the SoT; the user directed "match the idea layer with the source, source is the
# truth here". This is the project's SECOND reverse pass — the first was /gap-analysis-project
