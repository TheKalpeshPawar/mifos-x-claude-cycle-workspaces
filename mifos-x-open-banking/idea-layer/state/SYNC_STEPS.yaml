open_findings:
  - id: G-VACUOUS
    severity: error
    scope: framework
    blocks: "Phase B source G — Layer-6 interaction audit"
    summary: >-
      The Layer-6 interaction audit enumerates ZERO components on all 23 screens, then reports
      classified_pct 100 / gap_count 0 — a vacuous all-clear that reads exactly like a real one.
    root_cause: >-
      Producer/consumer attribute mismatch. core/scripts/preview-component-audit.ts selects
      `[data-component-id], [data-component-type]` (line 62) — the ONLY selector it uses. The
      rendered previews carry data-nav-to, data-action, data-state and data-screen, and NEITHER
      data-component-id NOR data-component-type. Confirmed 0 of 95 preview HTML files carry
      either attribute. The enumerator's own classifyHandler() reads data-nav-to/data-action, so
      producer and consumer agree on HANDLER attributes and disagree only on the component
      IDENTITY attributes — which is what the selector keys on.
    why_it_looked_green: >-
      per-screen `interaction.fresh: true` with a populated preview_hash, because the read+hash
      path succeeds; only the querySelectorAll returns empty. buildCoverageRollup over an empty
      component set computes 0/0 as 100%.
    ruled_out:
      - "Incremental cache: cleared .layer6-cache.json and re-ran cold — identical result."
      - "Missing previews: 95 exist, all parse, all hashed."
    decision_required: >-
      Two fixes are possible and they are NOT equivalent. (a) Teach the enumerator to also key on
      data-nav-to/data-action — no re-render, but it only ever sees components that already have
      a handler, which is precisely the population the audit exists to find gaps OUTSIDE of, so
      it would narrow the audit permanently. (b) Emit data-component-id/type from the renderer —
      correct, but requires re-rendering all 95 previews, and preview render is a SETTLED
      user deferral (CAPABILITY_GAPS class preview_render, decided_by user 2026-07-30). Not the
      agent's call; escalated rather than chosen.
  - id: DEMO-REF-FALSE-POSITIVES
    severity: warn
    scope: framework
    summary: >-
      16 of the 67 dispatch_queue items are demo_data_ref_unknown against this project, and all
      the ones inspected are false positives from two independent bugs in the same function
      (collectFieldKeys, .claude-runtime/lib/idea-graph-audit/layer2-nav-graph.ts:434).
    bug_1: >-
      `fields:` is guarded with !Array.isArray(v) and read via Object.keys, so it only resolves a
      MAP-shaped fields block. This project (and its schema) uses a LIST of {name, type}, so the
      guard skips it entirely and Object.keys would yield indices anyway. Consequence: `uiState`
      is flagged unresolved despite being a literally declared state field
      (send-money/ui.yaml:54 `- name: uiState`).
    bug_2: >-
      screen_state sealed-class MEMBER names are never collected as namespaces. Bindings like
      {content.creditor.name} / {error.message} / {item.id} resolve against a member of
      SendMoneyUiState, whose fields this project documents as a trailing comment on the member
      rather than a structured map — so neither the member nor its fields are visible to the
      resolver.
    context: >-
      The detector already carries three dated rounds of false-positive fixes for this exact
      over-flag family (92 on adhyayan-ai, 26/26 on mifos-x-group-banking, the mtime phantom).
      These are the 4th and 5th. Not fixed here: patching a shared detector mid-sync would change
      audit results for every project, which is a framework change wanting its own RED/GREEN
      canary, not a side effect of one project's sync.
    consequence_if_unfixed: "16 permanent phantom items in this project's dispatch queue."

not_run:
  - "STEP 3.2 enrichment — nothing content_stale"
  - "STEP 4.DOCSET regeneration — no idea-plan source section that any doc keys on changed materially; baseline from 07-31 21:20 still current"
  - "STEP 5.5 preview render — user-deferred (CAPABILITY_GAPS class preview_render, settled 2026-07-30)"
  - "Source G verdict — blocked, see open_findings.G-VACUOUS"

next_required:
  - "DECISION: G-VACUOUS — pick (a) enumerator or (b) renderer. Until then Layer-6 has never actually audited this project."
  - "DECISION: DEMO-REF false positives — fix collectFieldKeys, or accept 16 phantom dispatch items."
  - "TAG_REGISTRY sweep — send-money was verified by name; the other 22 screens were not. A name-level sweep is the only reliable check (counts are not comparable)."
  - "/idea approve — send-money, payment-consent, payment-status are status: enriched and await the human gate"
  - "NAV-PLACEHOLDER-001 — register the `_placeholder:` nav prefix; the deferred_routes[] side is already correct"
