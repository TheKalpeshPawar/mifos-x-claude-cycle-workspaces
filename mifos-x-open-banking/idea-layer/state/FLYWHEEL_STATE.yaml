# ── Verification performed during this Define pass ──────────────────────
# The user challenged whether PISP fits a consumer app at all, or is a merchant-only
# API. Verified against the spec rather than asserted:
#   payment-initiation-4.0-personal.yaml:2281-2299 — OBInternalPaymentContext1Code
#   includes TransferToSelf and TransferToThirdParty, both explicitly PSU-owned.
#   :2244-2280 — OBRisk1 has no required properties, so every merchant field is optional.
#   :2387-2391 — DebtorAccount is optional; required is only InstructionIdentification,
#   EndToEndIdentification, InstructedAmount and CreditorAccount.
# Conclusion: consumer PISP is in-model. The sandbox EXAMPLE bodies are merchant-shaped,
# which is the real trap — captured as FR-015 and guarded by TC-SEND-005/006.
define_verification:
  question: "Does PISP fit a consumer app, or is it merchant-only?"
  verdict: "Consumer-initiated payment is first-class in the standard; the example bodies are not."
  spec_ref: "specs/hsbc-sandbox/openapi/payment-initiation-4.0-personal.yaml"
  encoded_as: [FR-015, "screens/send-money/docs.yaml#consumer_context_constraint"]

open_risks:
  - id: RISK-PISP-001
    severity: blocking
    description: >-
      No detached-JWS signer exists. Every PISP write returns 400 U019 until one lands.
      signPs256 in core/network/BuildClientAssertion.kt is the primitive to extend
      (b64:false + crit), so this is an extension, not a new signer.
  - id: RISK-PISP-002
    severity: blocking
    description: "No Pisp.kt Ktorfit client — core/network/api ships only Aisp.kt and OAuth.kt."
  - id: RISK-PISP-003
    severity: high
    description: >-
      OAuth.kt mints only scope=accounts. A payments-scope client-credentials path is needed
      for consent staging and status reads.
  - id: RISK-PISP-004
    severity: advisory
    description: >-
      PISP is a distinct FCA permission from AISP. Sandbox unaffected; production payment
      initiation would need payment-initiation authorisation. ADR required.

