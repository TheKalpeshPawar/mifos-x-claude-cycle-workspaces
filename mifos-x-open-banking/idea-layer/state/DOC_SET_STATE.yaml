# ─── FOLLOW-UP ───────────────────────────────────────────────────────────────
# The three derived/filesystem-scan docs (design_context, layer_status, registry_coverage)
# have engine-owned bodies and empty `update_on`, so `scope: stale` regenerates them every
# pass regardless of these hashes. That is by design and is safe.
#
# The six `full` docs plus the ADR will now go stale only when their idea-plan sections
# change. When the first one does, the engine hits the write-protection hook with a real
# last-written hash for the first time and can offer the drift picker honestly.
