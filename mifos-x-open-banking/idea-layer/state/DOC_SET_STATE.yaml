# DOC_SET_STATE.yaml — per-doc generation record for the idea-layer doc set.
# Schema: layers/idea/commands/_shared/idea-doc-generators.md § "DOC_SET_STATE.yaml schema"
# Written by that engine; consumed by /idea-sync STEP 4.DOCSET `scope: stale`.

schema_version: "1.0.0"
project: mifos-x/mifos-x-open-banking

# ─── WHY THIS FILE IS A BASELINE, NOT A GENERATION RECORD ────────────────────
# This file did not exist until 2026-07-31. All 10 docs were present and current, but with
# no cache the engine had no `source_hash` to compare against, so every doc read as stale
# and `scope: stale` would have regenerated all of them.
#
# It did NOT regenerate them, deliberately. The engine's write-protection post-hook
# (RULE-HAND-EDIT-DRIFT-001) refuses to clobber a `full` doc whose content differs from the
# engine's last-written output — and with no cache there IS no last-written output for any
# doc, so "differs" is unknowable rather than false. The six `full` docs carry substantial
# authored prose (ARCHITECTURE.md, DATA_MODEL.md, ROADMAP.md and the ADR are not
# blueprint-shaped fill-ins). Regenerating them from idea-plan blueprints to satisfy a
# missing cache would have risked replacing real content with template output — the exact
# outcome the write-protection hook exists to prevent.
#
# So the current files are ADOPTED as the baseline. `source_hash` records the resolved
# `update_on` sections as they stand now, and `content_hash` records the file as it stands
# now. Drift detection is correct from this point FORWARD: the next idea-plan change to a
# doc's sources will flip its hash and mark it stale honestly.
#
# What this baseline does NOT assert: that each doc's current body was generated from the
# recorded sources. That was not established and is not claimed. `provenance: adopted`
# marks every row accordingly; a row becomes `provenance: generated` the first time the
# engine actually writes it.
baseline:
  adopted_at: "2026-07-31T21:20:00Z"
  adopted_by: "/idea-sync STEP 4.DOCSET"
  reason: "cache absent since the doc set landed; adopting rather than regenerating per RULE-HAND-EDIT-DRIFT-001"
  regenerated_any: false

