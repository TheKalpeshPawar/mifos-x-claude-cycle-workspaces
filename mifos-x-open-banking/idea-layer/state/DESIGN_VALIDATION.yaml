results:
  - id: F-001
    rule: STATE-001
    category: state
    severity: warning
    title: "send-money declares no `empty` state despite two data-driven lists"
    locations: [screens/send-money/ui.yaml]
    detail: >-
      send-money renders `debtor_account_selector` (items_source {content.debtorAccounts})
      and `creditor_selector` (items_source {content.beneficiaries}) but composes only
      loading / content / error / submitting / success. A PSU with no saved beneficiaries —
      an ordinary first-payment state — has no defined rendering. The two `empty_state`
      components in the file are not counter-evidence: both bind to `success` and `error`,
      i.e. they are the empty_state COMPONENT TYPE used as a full-screen message surface,
      not the screen STATE `empty`.
    provenance: new
    provenance_detail: >-
      send-money/ui.yaml was written 2026-07-30T06:44Z, after the 03:00Z validation, so this
      content has never been validated before.
    fix_hint: >-
      Add an `empty` state composing the no-beneficiaries case, or declare a per-list empty
      affordance on creditor_selector.
    fixable: true
    auto_fix_applied: false

  - id: F-002
    rule: REG-drift
    category: registry
    severity: warning
    title: "design catalog v1.1.0 payment components are not instantiated by the PISP screens"
    locations:
      - design-system/components/_index.yaml
      - screens/payment-consent/ui.yaml
      - screens/send-money/ui.yaml
      - screens/payment-status/ui.yaml
    detail: >-
      The catalog added review_card, payment_summary_row, field_error and step_indicator in
      v1.1.0 for the payment journey; all four are referenced by 0 of the 3 PISP screens,
      which use generic card / text_field / chip / list_item instead. review_card is the
      sharpest case — marked `trust_critical: true` and annotated "Last surface before money
      moves — payments analogue of consent_card" — yet payment-consent renders a plain
      `card`. The catalog's own removed_rationale names this as the hazard: "an aspirational
      catalog entry is worse than no entry: a codegen pass reads the registry as a contract
      and will try to satisfy it."
    provenance: new
    fix_hint: >-
      Either adopt the specialized types in the PISP screen YAML, or strike the four entries
      the way the v1.1.0 removals were struck. Adoption is the better fix for review_card,
      since the trust-critical treatment is the reason it was specified at all.
    fixable: true
    auto_fix_applied: false

  - id: F-003
    rule: STATE-001
    category: state
    severity: info
    title: "payment-consent declares no literal `loading` or `content` state"
    locations: [screens/payment-consent/ui.yaml]
    detail: >-
      Its states are checking, validating, exchanging, authorised and error. The journey
      states do fill the loading and content roles, which is defensible for a redirect
      journey screen, but nothing machine-legible says so — a reader or codegen pass looking
      for the canonical pair finds neither.
    provenance: carried-forward
    provenance_detail: "Open in the 2026-07-30 run as F-003 at warning; unchanged in substance."
    fix_hint: "Alias the journey states to the canonical roles, or record the mapping in the states block."
    fixable: true
    auto_fix_applied: false

  - id: F-004
    rule: REG-unused
    category: registry
    severity: info
    title: "2 Tier-3 registry entries have zero screen consumers"
    locations: [components.yaml]
    detail: >-
      bar_chart and info_row are declared in components.yaml and used by no screen. chip_row
      (2 screens) and section_header (9 screens) are consumed. Reported separately from
      F-002 because this is the ui.yaml `type:` registry — a different namespace from the
      design catalog.
    counting_note: >-
      A raw sweep of design-system/components/_index.yaml shows 19 of 30 entries with no
      ui.yaml consumer, but that number OVERSTATES: 3 are deliberately struck in its
      `removed:` block, and most of the rest are design-vocabulary names never expected to
      appear as a ui.yaml type (top_app_bar, bottom_nav, button_filled, state_loading).
      Only the F-002 subset is actionable.
    provenance: pre-existing
    fix_hint: "Strike bar_chart and info_row, or consume them."
    fixable: true
    auto_fix_applied: false

