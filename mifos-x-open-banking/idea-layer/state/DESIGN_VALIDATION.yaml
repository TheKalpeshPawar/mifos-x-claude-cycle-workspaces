dismissed:
  - finding: "consent-callback and payment-status declare no `empty` state"
    reason: >-
      Archetype-inappropriate. Neither renders any list or lazy_column, so there is no
      collection that can be empty. consent-callback is a redirect-return screen and
      payment-status a single-result readout. Flagging these would be a schema-literal
      reading of STATE-001 against screens its intent does not cover — which is why
      send-money (F-001) IS flagged and these two are not.

