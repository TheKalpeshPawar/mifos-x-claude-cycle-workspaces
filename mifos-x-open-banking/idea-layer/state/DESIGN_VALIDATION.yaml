# ─── Remaining Critical Findings ─────────────────────────────────────────────
remaining_critical:
  - id: CRIT-A11Y-001
    rule: A11Y-002
    screens: [all 39]
    finding: "#75796C used as normal body_medium/body_small text on #FFFFFF or #F9FAEF — 4.46:1 / 4.24:1 (both fail 4.5:1 AA). Estimated ~40 instances project-wide in supporting copy, label_source hints, and secondary metadata text."
    fix_hint: "Replace `color: \"#75796C\"` with `color: \"#44483D\"` for all normal-size body text. #75796C (4.46:1) is only AA-compliant for large text (≥18sp or ≥14sp bold)."

  - id: CRIT-A11Y-002
    rule: A11Y-SCHEMA (schema drift)
    screens: [kyc-review, account-applications, corporate-onboarding, customer-onboarding,
              customer-detail, customer-messages, agent-registration, application-detail]
    finding: "8 screens use Android Compose camelCase schema keys (contentDescription, backgroundColor,
      borderRadius, textStyle, paddingVertical, marginHorizontal, fillWidth, components:) instead
      of the project's snake_case convention. Breaks codegen and causes silent fallbacks."
    fix_hint: "Mechanical rename: contentDescription→label, backgroundColor→background, borderRadius→border_radius,
      textStyle→typography, paddingVertical→padding_vertical, marginHorizontal→margin_horizontal,
      fillWidth→full_width, components:→children:."

  - id: CRIT-REG-001
    rule: REG-001
    screens: [home, accounts, transactions, pfm-dashboard, fo-dashboard, send-money,
              notifications, login, settings]
    finding: "consumer app-shell (app-shell.yaml) declares 4 nav items (Home/Accounts/Payments/Profile)
      but per-screen shell overrides declare 5 items (Home/Accounts/Pay/Cards/More) with different
      icons and labels. Nav contract diverges between app-shell.yaml and screen overrides."
    fix_hint: "Update app-shell.yaml consumer bottom_nav to match the 5-item pattern used in screens,
      or normalize all screen shell overrides to the 4-item app-shell.yaml definition. Pick one as source of truth."

  - id: CRIT-STATE-001
    rule: STATE-001
    screens: [change-password, corporate-onboarding, customer-onboarding, forgot-password, login]
    finding: "5 form screens with api[] declarations use 'submitting' instead of 'loading' as the
      in-flight state key, and omit a 'loading' state. STATE-001 requires loading, content, error, empty
      for any screen with api declarations. These form screens trigger APIs but lack the canonical loading state."
    fix_hint: "Add `loading:` state block (can be identical to idle — shows form skeleton) alongside the
      existing `submitting:` state. Alternatively reclassify `submitting:` as `loading:` if the screen
      shows a loading skeleton while the form initializes."

  - id: CRIT-RESP-001
    rule: RESP-001 / RESP-002
    screens: [all 39]
    finding: "0/39 screens declare responsive breakpoints. All 39 screens are implicitly single-breakpoint.
      Dashboard, feed, and detail archetypes (fo-dashboard, pfm-dashboard, home, accounts) require
      at minimum mobile + tablet declarations per RESP-003."
    fix_hint: "Add `responsive: { mobile_only: true, reason: \"mobile-first banking app\" }` to non-dashboard
      screens. For 4 dashboard/feed screens add a tablet breakpoint stub."

