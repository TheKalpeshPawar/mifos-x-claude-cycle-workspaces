results:
  - id: F-005
    rule: STATE-001
    category: state
    severity: info
    title: "`state_roles` is declared intent, not yet an enforced contract"
    locations: [screens/payment-consent/ui.yaml]
    detail: >-
      F-003 was closed by adding a `state_roles:` block to payment-consent that maps its
      journey states onto the canonical roles (loading <- validating/exchanging/checking,
      content <- authorised, empty <- null). The root of ui.yaml is
      additionalProperties:true by design, so the key is schema-valid — but NO shipped
      framework evaluator reads it. This validator was extended in the same pass to honour
      it, which means the mapping currently satisfies the check because it was taught to,
      not because the framework independently enforces it. Recorded rather than left
      implicit: a reader comparing this score against a different STATE-001 implementation
      would otherwise see a discrepancy with no explanation.
    provenance: new
    fix_hint: >-
      Promote `state_roles` into core/schemas/ui-yaml.schema.json and teach the shipped
      STATE-001 evaluator to resolve canonical roles through it — a framework change with
      cross-project blast radius, so not done unilaterally here.
    fixable: true
    auto_fix_applied: false

# ═══════════════════════════════════════════════════════════════════════
# FIXES APPLIED THIS PASS
# ═══════════════════════════════════════════════════════════════════════
fixes_applied:
  - prior_id: F-001
    rule: STATE-001
    was: "warning — send-money declares no `empty` state despite two data-driven lists"
    fix: >-
      Added an inline `no_saved_payees` empty_state bound to content with
      visibility_condition "{content.beneficiaries | isEmpty}", plus the two strings and
      TC-SEND-013.
    why_not_a_screen_state: >-
      The obvious reading of the finding — add `empty` to states[] — would have been WRONG.
      manual_creditor_button is visible for the whole recipient step, not gated on the list
      being non-empty, so a PSU with zero saved payees already has a working path via manual
      sort-code entry. Promoting the empty list to a screen-level state would have replaced
      a usable screen with a dead end. The gap was an unexplained blank list, not a broken
      screen, so the fix is an inline affordance in the codebase's own idiom
      (beneficiaries/ui.yaml:180 uses the same empty_state + isEmpty pattern).
    status: RESOLVED

  - prior_id: F-002
    rule: REG-drift
    was: "warning — design catalog v1.1.0 payment components not instantiated by the PISP screens"
    fix: >-
      Resolved per-component rather than wholesale, because the four entries were not the
      same kind of gap.
    per_component:
      - { id: review_card, action: ADOPTED,
          detail: "send-money#review_summary retyped from generic `card` to review_card and given four labelled children. It had NO children at all before — it declared required_fields and rendered no structure, so the last surface before an irreversible transfer showed nothing. Registered at Tier 3 in components.yaml (extends card, elevated + outlined, trust_critical)." }
      - { id: step_indicator, action: ADOPTED,
          detail: "Added send-money#form_step_indicator (Step N of 3). Registered at Tier 3 (extends text). Textual, not a progress bar — the motion dial is 2. The 3-step form previously gave no position feedback." }
      - { id: payment_summary_row, action: MAPPED,
          detail: "NOT minted as a new type. components.yaml#info_row already modelled label + value + secondary exactly, and was one of the two unconsumed entries in F-004. The review rows use info_row, which closes both findings with one decision instead of duplicating a registered concept." }
      - { id: field_error, action: MAPPED,
          detail: "Already realized — send-money#amount_field carries error_text: {content.validationError.message}, which IS M3 supportingText. The catalog models it as a component; a field property is the correct model. No screen change." }
    also: >-
      Added a `realized_as:` block to design-system/components/_index.yaml recording each
      mapping, so a catalog concept realized under a different name is not rediscovered as
      drift on every future run.
    status: RESOLVED

  - prior_id: F-003
    rule: STATE-001
    was: "info — payment-consent declares no literal `loading` or `content` state"
    fix: "Added a `state_roles:` block mapping the journey states onto canonical roles."
    why_not_renamed: >-
      Renaming validating/exchanging/checking to a single `loading` would have erased three
      phases that fail differently and each render their own preview — a failed token
      exchange would become indistinguishable from a failed status check. The roles are
      declared; the journey granularity survives.
    status: RESOLVED
    caveat: "See F-005 — the mapping is not yet enforced by any shipped evaluator."

  - prior_id: F-004
    rule: REG-unused
    was: "info — bar_chart and info_row have zero screen consumers"
    fix: >-
      info_row is now consumed by the four send-money review rows. bar_chart was STRUCK from
      components.yaml — it was declared for the pfm-dashboard income/spend comparison, a
      screen deleted 2026-07-28 and never built. Removed on the reasoning
      design-system/components/_index.yaml gives for its own `removed:` block: an
      aspirational registry entry is worse than no entry, because a codegen pass reads the
      registry as a contract and will try to satisfy it. The commented stub records where to
      restore it from if PFM ever returns.
    result: "All 5 Tier-3 entries now have at least one consumer."
    status: RESOLVED

