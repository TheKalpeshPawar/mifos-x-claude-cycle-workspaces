    - "A11Y-003 touch target >= 44dp — no min_height/touch_target/size field (0/25)"
    - "A11Y-004 label_source — field absent (0/25); project uses accessibility_label instead (25/25)"
    - "A11Y-005 focus_visible in supported_states — neither field exists (0/25)"
    - "A11Y-008 dialog Escape shortcut — no keyboard.shortcuts block (0/25)"
    - "MOTION-001..004 — no `motion:` block anywhere (0/25); reduced_motion_fallback absent"
    - "RESP-001..003 — no breakpoints/responsive block anywhere (0/25)"
  partially_evaluable:
