self_correction:
  - id: SC-1
    initial_finding: "REG-001 — 32 of 34 component types unresolved"
    corrected_to: "REG-001 — 0 of 34 unresolved"
    cause: >-
      The first extraction pass used a key regex (`id|name` at two-space indent) that does
      not match the registry file shape (`- type:` under a `primitives:` / `patterns:`
      root), recovering only 9 of 123 registry ids. This is the SAME class as the
      2026-07-30 SC-1: a bad registry resolution manufactures mass critical false positives.
    lesson: "Sanity-check the extracted registry SIZE before trusting any REG-001 result."
  - id: SC-2
    initial_finding: "A11Y — 2 interactive components without an accessible name"
    corrected_to: "0"
    cause: >-
      The name predicate checked label/text/content but not `title`. settings/app_version_row
      carries title: {strings.settings.app_version.title} and is interaction_type: display.
  - id: SC-3
    initial_finding: "A11Y — 3 media components missing alt/decorative"
    corrected_to: "0"
    cause: >-
      The media predicate accepted only `alt` or `decorative: true`. This project's schema
      expresses the accessible name as `accessibility_label`; all three declare one, and
      consent-detail/expiry_warning_icon uses the ARIA-correct empty name ("") for a
      decorative icon whose sibling text carries the same message.

