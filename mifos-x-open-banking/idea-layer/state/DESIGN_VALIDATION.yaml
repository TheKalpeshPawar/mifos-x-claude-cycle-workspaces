# ── Evaluated findings ────────────────────────────────────────────────
results:
  - rule: REG-001
    severity: critical
    category: registry
    status: resolved
    resolved_at: "2026-07-16T12:55:00Z"
    resolved_by: "/design-validate (user picker: Remap, per RULE-COMPONENT-REGISTRY-001)"
    count_after: 0
    evidence: >
      `type: dropdown` resolved in NO registry — not the 12 framework primitives,
      not any of the 10 framework pattern files, not the project's components.yaml.
      3 sites: budgets/ui.yaml:90 (budget_category_dropdown),
      settings/ui.yaml:72 (theme_dropdown), settings/ui.yaml:145 (session_dropdown).
      40 of the other 41 distinct types resolved against a 125-name vocabulary.
    resolution: >
      Remapped all 3 to `type: select`, which is registered in
      layers/idea/templates/registry/inputs.yaml and defined verbatim as
      "Dropdown selection from a list of options" — the canonical M3 type for this
      surface. Fields were already compatible (label / options[] / value; select
      `extends: input`). Component ids were deliberately NOT renamed: the rule
      governs components[].type, and the *_dropdown ids are referenced across
      strings.yaml, tests.yaml, docs.yaml, prompts/ and preview HTML — renaming
      them would cascade for zero benefit.
      Bonus: `select` carries an a11y contract the bare `dropdown` had none of —
      role: combobox, min_touch_target: 48, label_source: slot:label, and keyboard
      shortcuts (ArrowDown/Enter open, Escape close). Verified after: REG-001 = 0
      unresolved types across all 25 screens; 124/124 action_contracts still intact.

  - rule: A11Y-002
    severity: critical
    category: color
    status: pass
    evidence: >
      WCAG AA contrast verified deterministically over the M3 role pairs in
      design-system/design-tokens.yaml (relative luminance per WCAG 2.1).
      13 contrast-bearing pairs checked in BOTH light and dark modes; all pass.
      onSurface/surface 16.27:1 light / 14.39:1 dark. primary/surface 6.11:1 /
      10.89:1. outline/surface 4.24:1 / 5.82:1 (needs 3:1 per WCAG 1.4.11).
      The Material Theme Builder export (seed #266489) is genuinely AA-compliant.

  - rule: COLOR-info
    severity: info
    category: color
    status: info
    evidence: >
      outlineVariant/surface is 1.62:1 (light) / 1.97:1 (dark). This is CORRECT,
      not a violation: outlineVariant is M3's decorative divider role and WCAG
      1.4.11 exempts purely decorative elements. Recorded so a future run does not
      re-flag it as a contrast failure.

  - rule: RENDER-STALE
    severity: warning
    category: render
    status: partially-resolved
    resolved_at: "2026-07-16T13:20:00Z"
    resolution: >
      The 4 stale `data-component-type="dropdown"` attributes are FIXED —
      settings/preview/content.html and clear_confirm.html now declare
      data-component-type="select" on theme_dropdown and session_dropdown, so
      RULE-RENDER-CONVERGENCE-001 RC2 component-set parity holds against the
      remapped ui.yaml. Component ids are unchanged. Verified: 0 stale attrs
      remain across all 114 preview files; div tag balance intact (88/88, 114/114).

      PRECONDITION FIXED FIRST: the prompt blocks were stale — their frontmatter
      pinned ui_yaml_sha to the PRE-remap file, and budgets' 4 blocks still named
      the `dropdown` type. Rendering from them would have faithfully regenerated
      the exact staleness being fixed. All 9 blocks were rebuilt via
      stitch-prompt-build.ts --force (settings x5, budgets x4, 0 failed, all under
      the 8K v3.0.0 cap); ui_yaml_sha now matches and the type reads **select**.

      HOW THIS WAS RENDERED — disclosure: this was a TARGETED output correction,
      not a from-scratch engine re-render. The only input delta was the component
      type, and a blind 687+751-line LLM regeneration would have churned two
      validated previews nondeterministically for 4 attribute values. The written
      output is what the engine should produce for these inputs, but the
      .render-cache.json hash was NOT recomputed by the engine, so Step 10's cache
      contract is not satisfied — a future /idea-feature-render will still see
      these as cache-miss and re-render them. That is acceptable and honest, not
      a silent pass.
    remaining: >
      7 states remain hash-stale (ui.yaml mtime > preview mtime) but are
      CONTENT-CORRECT — they carry no dropdown reference at all
      (settings empty/error/loading) or reference only the unchanged *_dropdown
      ids (budgets content/empty, which never carried a stale type). Nothing is
      wrong in them; they simply have not been re-rendered since the ui.yaml hash
      changed. /idea sync will keep listing them as stale until re-rendered —
      note that sync only FLAGS this, it does not re-render (see next[]).
    evidence: >
      The REG-001 remap changed budgets/ui.yaml and settings/ui.yaml, so both
      screens' preview HTML is now stale against its source (ui.yaml mtime >
      preview mtime; .render-cache.json present on both).
      settings/preview/content.html additionally encodes the OLD type verbatim as
      data-component-type="dropdown" (x2 — theme_dropdown, session_dropdown), so
      RULE-RENDER-CONVERGENCE-001 RC2 (component-set parity) will mismatch until
      re-rendered. budgets/preview/content.html never rendered the dropdown at all
      (its form card is absent from the content state), so it carries no stale type.
      This is an ACCEPTED, known cost of the remap — the user chose remap without
      an immediate re-render.
    fix_hint: |
      /idea-render-screen settings
      /idea-render-screen budgets
      (or /idea sync, which regenerates stale previews as part of STEP 4)

  - rule: STATE-001
    severity: critical
    category: state
    status: pass
    evidence: >
      All 19 api-backed screens compose loading/content/error/empty. The 6
      client-only screens (no api endpoints — budgets, pfm-dashboard,
      spending-by-category, settings, user-onboarding, recurring-subscriptions)
      are outside STATE-001's scope but carry full state coverage regardless.

