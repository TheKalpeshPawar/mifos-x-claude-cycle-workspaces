results:

  - id: R-1
    rule: REG-schema
    category: registry
    severity: critical
    status: PARTIALLY-CLOSED — project half done, framework half held
    title: "The corpus is authored against a different property contract than the registry declares"
    closed_portion:
      component: section_header
      detail: >-
        components.yaml#section_header's required property renamed value -> label, and home's
        single dissenting call site aligned. 21 of 21 sites now conform. The registry was
        corrected rather than 20 screens, because it was the outlier: the design catalog already
        calls this a "Labelled group divider" and sibling info_row already uses `label`.
    open_portion:
      - component: text
        registry_requires: "content (required); variant for typography; level 1-6 for headings"
        corpus_uses: "value (92) · style (82) · role (27)"
        level_usage: 0
        consequence: >-
          `style` bypasses the variant mechanism that carries the semantic_html h1/h2/h3 mapping,
          and `level` is unused — so no text node in this app has a machine-readable heading
          level. That is why A11Y-007 returns nothing rather than passing.
      - component: list_item
        registry_requires: "headline (slots.required; a11y.label_source: slot:headline)"
        corpus_uses: "headline (5) · headline_text (6) · title · label · none (~12)"
        mitigating: "nearly all carry an explicit accessibility_label, so the accessible NAME is present"
      - component: chip
        registry_requires: "label, icon_leading, icon_trailing, removable, selected"
        corpus_uses: "icon · color (4) · color_map (1) · icon_map (1)"
        new_this_run: true
        note: >-
          Discovered while verifying the 12:55 repair. `color_map` was pre-existing; `icon_map`
          was ADDED BY THAT REPAIR while fixing C-5. Deliberate and, on inspection, correct for
          this screen: the C-5 fix_hint said to bind per status the way consent-list does, but
          consent-list's `{item.status_icon}` depends on a ViewModel-derived field that
          consent-detail's data model does not have — its demo-data carries only the raw OBIE
          Status. icon_map is self-contained and resolves against data that exists. It does,
          however, add one more instance of exactly the divergence this finding is about, so it
          is recorded here rather than quietly banked.
    ownership_split:
      project_fixable: "section_header — DONE"
      framework_question: >-
        text, list_item and chip are FRAMEWORK registry entries shared by every project. 82 text
        components did not diverge by accident — value + style is a coherent vocabulary someone
        authored deliberately. Either the shipped properties_schema is aspirational and should be
        corrected to what projects use, or every project on this registry is non-conforming and
        needs a migration. That is FW-3, and it determines the direction of a ~190-site sweep.
    fix_hint: "HOLD the framework half pending FW-3. Do not mass-rename on this report alone."
    fixable: false

  - id: F-005
    rule: STRUCT-empty-container
    category: state
    severity: critical
    status: OPEN — out of scope for a mechanical pass
    title: "payment-status#payment_summary is a content card with zero children"
    locations: ["screens/payment-status/ui.yaml:128"]
    detail: >-
      Declares required_fields [amountLabel, creditorName, debtorAccountLabel, submittedAtLabel]
      and an accessibility_label, then declares no children. It is the screen's only rendering of
      the echoed Data.Initiation, so a PSU tracking a payment sees an empty box.
    same_class_as: "the send-money#review_summary defect fixed 07-31; both screens landed in the same 07-30 PISP materialisation and only one was swept"
    why_still_open: "needs authored content — four or five info_row children — not a rename. Deliberately excluded from the 12:55 mechanical batch."
    fix_hint: "Mirror send-money#review_summary: info_row children for amount (emphasis: true), payee, reference, funding account, submitted-at."
    fixable: true

  - id: F-002
    rule: REG-002
    category: registry
    severity: warning
    status: OPEN — the defect is mechanical, the fix is a decision
    title: "Undeclared `variant:` values across 6 component types (~89 sites)"
    breakdown:
      empty_state: { declared: "none", used: "error, info, informational, neutral, success", sites: 30 }
      button:      { declared: "none (primitive)", used: "filled, text, tonal, outlined", sites: 53 }
      badge:       { declared: "dot, count", used: "tonal + TWO boolean interpolations", sites: 4 }
      card:        { declared: "none", used: "outlined, filled", sites: 2 }
      chip:        { declared: "assist, filter, input, suggestion", used: "outline", sites: 1 }
      skeleton:    { declared: "none", used: "list, list_card", sites: 2 }
    resolved_this_cycle: "progress_indicator's 21 variant sites — closed by F-001's retype"
    worst_case: >-
      direct-debits#dd_status_badge and standing-orders#so_status_badge declare
      `variant: "{item.isActive}"` — a boolean in a variant slot, resolving to "true"/"false".
      Each component's own test_context states the intent (Active->primary, Inactive->outline),
      and `badge` declares only {dot, count}, so NEITHER the current value NOR the documented
      intent is a valid variant. There is no mechanically-correct target, which is why this was
      excluded from the repair batch.
    fix_hint: >-
      The two boolean bindings need a decision: bind a colour instead of a variant, or register a
      Tier-3 badge override. For the rest, pick one strategy per type — retype to the registry's
      real types, or declare the used variants as Tier-3 overrides.
    fixable: false

  - id: F-008
    rule: AUTHORING-DRIFT
    category: registry
    severity: warning
    status: OPEN
    title: "Six spellings for two predicates, and four conditions are English prose"
    breakdown:
      show_hide: { visible_when: 27, visibility_condition: 27, visible: 4, visibility: 5 }
      enablement: { enabled_when: 1, enabled_condition: 1 }
    substantive_half: >-
      4 of the 5 `visibility:` values are prose, not expressions — account-holder#email_row /
      #mobile_row / #address_row carry "visible when profile.email is non-empty" and #retry_button
      "visible when uiState.kind.isRetriable — hidden for ConsentMissingParty and ProfileNotFound".
      Prose in a predicate slot cannot be evaluated, so those four rows render unconditionally.
    fix_hint: "Convert the four prose conditions first — a defect regardless of which spelling wins. Then normalise on visibility_condition + enabled_condition."
    fixable: true

  - id: C-6
    rule: color-006
    category: color
    severity: info
    status: OPEN
    title: "send-money#payment_success uses the terminal-success glyph for a usually-unsettled payment"
    locations: ["screens/send-money/ui.yaml:512"]
    detail: >-
      `variant: success` + `icon: check_circle` is the pair reserved for
      payment_disposition.terminal_success, while send-money's own contract says the initial
      status is usually AcceptedSettlementInProcess.
    why_only_info: >-
      The copy is honest and carries the meaning: "Payment submitted" / "Your bank has accepted
      this payment. It may take a short time to reach %1$s." The title is also the accessible
      name. Only the glyph and variant overstate what the words correctly hedge.
    fix_hint: "Use the in_progress pair (icon: schedule, secondaryContainer) unless the ViewModel can prove a terminal status — matching the unknown_status_policy already in the token file."
    fixable: true

