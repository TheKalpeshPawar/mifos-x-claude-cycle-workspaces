    longer use. None of the fields below are declared in
    core/schemas/ui-yaml.schema.json, and none appear in any of the 25 ui.yaml
    files. Scoring them would manufacture ~14 x 25 false criticals. The corpus
    also disagrees with itself on size: the runtime claims 102 rules,
    validation-rules.json#_metadata claims 147, and its categories block actually
    contains 67.
