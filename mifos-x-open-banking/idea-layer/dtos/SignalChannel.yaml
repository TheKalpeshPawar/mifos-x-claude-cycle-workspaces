name: SignalChannel
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v6.0.0/signal/channels"
description: "Represents a notification/signal channel available to the user, such as SMS, email, or push, including the user's current subscription status and an optional human-readable description."
fields:
  - name: channel
    type: String
    required: true
    pii: false
    description: "Unique channel identifier (e.g. SMS, EMAIL, PUSH); acts as primary key"
    primary_key: true
  - name: subscribed
    type: Boolean
    required: true
    pii: false
    description: "Whether the authenticated user is currently subscribed to this channel"
    primary_key: false
  - name: description
    type:
      optional: String
    required: false
    pii: false
    description: "Optional human-readable explanation of what events this channel delivers"
    primary_key: false
used_by:
  - feature: notifications
    api_id: obp_signal_channels
enums: []
