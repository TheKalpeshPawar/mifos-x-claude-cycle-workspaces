name: OBWriteFileConsentResponse4
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/file-payment-consents"
description: "OBIE PISP File Payment consent response — the staged consent: ConsentId, status (AWUP|AWAU|AUTH|RJCT|COND), status reason, creation/update datetimes, optional cut-off datetime, echoed file metadata and optional charges. Same schema returned by the GET consent poll. Also the inferred response shape for the HSBC multi-bill consent (response schema documented-gap on that group)."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Unique consent identifier assigned by the ASPSP."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Consent status — AWUP, AWAU, AUTH, RJCT or COND."
    primary_key: false
  - name: Data.StatusReason
    type: String
    required: false
    pii: false
    description: "Reason for the current status."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the consent resource was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the consent status was last updated."
    primary_key: false
  - name: Data.CutOffDateTime
    type: String
    required: false
    pii: false
    description: "Cut-off date-time for the file payment."
    primary_key: false
  - name: Data.Initiation.FileType
    type: String
    required: true
    pii: false
    description: "Echoes the requested file type."
    primary_key: false
  - name: Data.Initiation.FileHash
    type: String
    required: true
    pii: false
    description: "Echoes the requested file hash."
    primary_key: false
  - name: Data.Initiation.ControlSum
    type: String
    required: false
    pii: false
    description: "Echoes the requested control sum."
    primary_key: false
  - name: Data.Charges
    type:
      list_of:
        dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Charges applicable to the consent — each charge's Amount/Currency."
    primary_key: false
used_by:
  - "server/apis/pisp-file.yaml"
  - "server/apis/pisp-multibill.yaml"
