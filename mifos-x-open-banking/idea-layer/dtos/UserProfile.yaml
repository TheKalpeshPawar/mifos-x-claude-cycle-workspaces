name: UserProfile
version: "1.0.0"
source:
  origin: project
  api_path: "GET/PUT /obp/v4.0.0/users/current"
description: "Represents the authenticated user's profile including identity provider details and display name used across the Open Banking platform."
fields:
  - name: user_id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: username
    type: String
    required: true
    pii: false
    primary_key: false
  - name: email
    type: Email
    required: true
    pii: true
    primary_key: false
  - name: provider
    type: String
    required: true
    pii: false
    primary_key: false
  - name: provider_id
    type: String
    required: true
    pii: false
    primary_key: false
  - name: display_name
    type: String
    required: true
    pii: true
    primary_key: false
used_by:
  - feature: profile
    api_id: get-current-user
  - feature: login
    api_id: get-current-user
