name: UserProfile
version: "1.1.0"
source:
  origin: project
  api_path: "GET/PUT /obp/v4.0.0/users/current"
description: "Represents the authenticated user's profile including identity provider details, entitlements, login metadata, and language preference used across the Open Banking platform. Updated in v1.1.0 to add entitlements, date_joined, last_login_at, language_preference from the v4.0.0 profile API spec."
fields:
  - name: user_id
    type: String
    required: true
    pii: false
    description: "Unique OBP user identifier (UUID)"
    primary_key: true
  - name: username
    type: String
    required: true
    pii: false
    description: "DirectLogin username"
    primary_key: false
  - name: email
    type: String
    required: true
    pii: true
    description: "Registered email address; PII"
    primary_key: false
  - name: provider
    type: String
    required: true
    pii: false
    description: "Auth provider identifier, typically 'obp_consumer_key'"
    primary_key: false
  - name: provider_id
    type: String
    required: true
    pii: false
    description: "Provider-scoped user ID"
    primary_key: false
  - name: display_name
    type: String
    required: true
    pii: true
    description: "Display name shown in UI; PII"
    primary_key: false
  - name: entitlements
    type: "List<String>"
    required: true
    pii: false
    description: "List of OBP role/entitlement identifiers granted to this user (e.g. 'CanGetAnyUser', 'CanCreateCustomer')"
    primary_key: false
  - name: date_joined
    type: String
    required: true
    pii: false
    description: "Account creation timestamp in ISO-8601 Instant format"
    primary_key: false
  - name: last_login_at
    type: "String?"
    required: false
    pii: false
    description: "Most recent successful login timestamp; null on first login"
    primary_key: false
  - name: language_preference
    type: "String?"
    required: false
    pii: false
    description: "ISO 639-1 two-letter language code (e.g. 'en', 'sw', 'fr'); defaults to 'en'"
    primary_key: false
used_by:
  - feature: profile
    api_id: obp_get_user_profile
  - feature: profile
    api_id: obp_update_user_profile
pii_fields:
  - email
  - display_name
