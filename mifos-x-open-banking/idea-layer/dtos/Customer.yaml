name: Customer
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/customers/{customerId}"
description: "Represents a bank customer's full profile including KYC status, contact details, credit information, and relationship data."
fields:
  - name: customer_id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: customer_number
    type: String
    required: true
    pii: false
    primary_key: false
  - name: legal_name
    type: String
    required: true
    pii: true
    primary_key: false
  - name: mobile_phone_number
    type: String
    required: true
    pii: true
    primary_key: false
  - name: email
    type: Email
    required: true
    pii: true
    primary_key: false
  - name: face_image
    type: { optional: Url }
    required: false
    pii: false
    primary_key: false
  - name: date_of_birth
    type: { optional: Date }
    required: false
    pii: true
    primary_key: false
  - name: relationship_status
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: credit_rating
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: credit_limit
    type: { optional: { dto_ref: MoneyAmount } }
    required: false
    pii: false
    primary_key: false
  - name: kyc_status
    type: Boolean
    required: true
    pii: false
    primary_key: false
  - name: last_ok_date
    type: { optional: DateTime }
    required: false
    pii: false
    primary_key: false
used_by:
  - feature: customer-detail
    api_id: get-customer
  - feature: customer-onboarding
    api_id: get-customer
  - feature: customer-search
    api_id: get-customer
  - feature: customer-profile
    api_id: get-customer
