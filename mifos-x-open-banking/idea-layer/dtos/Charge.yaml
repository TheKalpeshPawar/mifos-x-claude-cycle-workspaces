name: Charge
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SEPA/transaction-requests"
description: "Transaction/transfer fee charge object returned with a transaction request. Describes the fee summary and monetary value applied to the transaction."
fields:
  - name: summary
    type: String
    required: true
    pii: false
    description: "Human-readable description of the charge (e.g. 'SEPA transfer fee')"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code for the charge amount"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Decimal string representation of the charge amount"
    primary_key: false
used_by:
  - feature: send-money
    api_id: obp_create_sepa_transfer
  - feature: send-money-confirm
    api_id: obp_confirm_sepa_transfer
enums: []
