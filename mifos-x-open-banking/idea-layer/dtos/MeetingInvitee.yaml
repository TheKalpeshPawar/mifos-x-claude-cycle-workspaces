name: MeetingInvitee
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v3.1.0/banks/{bankId}/meetings"
description: "Nested DTO representing a single invitee to a Meeting, capturing their user identifier and whether they have accepted the invitation."
fields:
  - name: user_id
    type: String
    required: true
    pii: false
    description: "Identifier of the invited user"
    primary_key: false
  - name: invited
    type: Boolean
    required: true
    pii: false
    description: "Whether the user has accepted the meeting invitation"
    primary_key: false
used_by:
  - feature: meetings
    api_id: obp_get_meetings
enums: []
