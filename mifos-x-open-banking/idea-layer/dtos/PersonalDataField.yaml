name: PersonalDataField
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v6.0.0/my/personal-data-fields"
description: "Represents a single personal data field stored under a user's profile, capturing the field's name, value, and data type as returned by the OBP personal-data-fields endpoint."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier for the personal data field entry"
    primary_key: true
  - name: name
    type: String
    required: true
    pii: false
    description: "Machine-readable key identifying the personal data field (e.g. 'national_id', 'date_of_birth')"
    primary_key: false
  - name: value
    type: String
    required: true
    pii: false
    description: "Stored value of the personal data field"
    primary_key: false
  - name: type
    type: String
    required: true
    pii: false
    description: "Data type hint for the value (e.g. STRING, DATE, NUMBER)"
    primary_key: false
used_by:
  - feature: pfm-dashboard
    api_id: obp_personal_data_fields
  - feature: pfm-dashboard
    api_id: obp_personal_data_field_create
enums: []
