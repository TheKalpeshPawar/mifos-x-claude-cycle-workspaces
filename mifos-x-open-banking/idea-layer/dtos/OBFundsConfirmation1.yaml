name: OBFundsConfirmation1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/cbpii/funds-confirmations"
description: "OBIE CBPII v4.0 funds-confirmation request — asks the ASPSP whether the InstructedAmount is available on the account behind the funds-confirmation-consent. Requires an authorization-code token and a matching ConsentId; InstructedAmount.Currency must equal the account currency."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Max128Text; must match the funds-confirmation-consent."
    primary_key: false
  - name: Data.Reference
    type: String
    required: true
    pii: false
    description: "Max35Text — CBPII's unique reference for the check."
    primary_key: false
  - name: Data.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Amount + Currency to confirm availability for; Currency must match the account currency."
    primary_key: false
used_by:
  - "screens/send-money-amount/api.yaml"
  - "server/apis/cbpii.yaml"
