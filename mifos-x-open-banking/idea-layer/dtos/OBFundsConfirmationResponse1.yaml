name: OBFundsConfirmationResponse1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/cbpii/funds-confirmations"
description: "OBIE CBPII v4.0 funds-confirmation response — the FundsAvailable boolean result plus a unique FundsConfirmationId and echoed request fields. Backs the affordability check on the send-money amount screen."
fields:
  - name: Data.FundsConfirmationId
    type: String
    required: true
    pii: false
    description: "Unique funds-confirmation resource id, Max40Text."
    primary_key: true
  - name: Data.FundsAvailable
    type: Boolean
    required: true
    pii: false
    description: "Result of the funds-availability check."
    primary_key: false
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Echoed funds-confirmation-consent id."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the funds-confirmation was created."
    primary_key: false
  - name: Data.Reference
    type: String
    required: true
    pii: false
    description: "Echoed CBPII reference."
    primary_key: false
  - name: Data.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Echoed instructed Amount + Currency."
    primary_key: false
  - name: Links.Self
    type: String
    required: false
    pii: false
    description: "Self link to the funds-confirmation resource."
    primary_key: false
used_by:
  - "screens/send-money-amount/api.yaml"
  - "server/apis/cbpii.yaml"
