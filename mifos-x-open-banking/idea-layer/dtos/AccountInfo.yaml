name: AccountInfo
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v6.0.0/my/accounts/{account_id}/transactions"
description: "Minimal account info snapshot used in transaction listings for PFM context — identifies the account without exposing full Account details."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Account identifier"
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "Bank identifier"
    primary_key: false
  - name: label
    type: String
    required: true
    pii: false
    description: "Human-readable account label"
    primary_key: false
  - name: number
    type: String
    required: true
    pii: false
    description: "Account number"
    primary_key: false
  - name: balance
    type: MoneyAmount
    required: true
    pii: false
    description: "Current balance snapshot"
    primary_key: false
  - name: account_type
    type: "String?"
    required: false
    pii: false
    description: "Account type identifier (e.g. CURRENT, SAVINGS)"
    primary_key: false
used_by:
  - feature: pfm-dashboard
    api_id: obp_transactions_list
enums: []
