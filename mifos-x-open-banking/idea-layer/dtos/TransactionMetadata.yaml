name: TransactionMetadata
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
description: "User-generated metadata attached to a transaction by the account holder. Holds an optional free-text narrative, a list of structured comments, and a list of classification tags."
fields:
  - name: narrative
    type:
      optional: String
    required: false
    pii: false
    description: "Optional free-text note written by the account holder describing the transaction"
    primary_key: false
  - name: comments
    type:
      list_of:
        dto_ref: TransactionComment
    required: true
    pii: false
    description: "Ordered list of comments added to the transaction by the user"
    primary_key: false
  - name: tags
    type:
      list_of:
        dto_ref: TransactionTag
    required: true
    pii: false
    description: "List of classification tags applied to the transaction (e.g. #groceries, #travel)"
    primary_key: false
used_by:
  - feature: transaction-detail
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
  - feature: transaction-tags
    api_id: "GET /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
enums: []
