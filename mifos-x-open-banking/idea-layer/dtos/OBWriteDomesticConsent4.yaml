name: OBWriteDomesticConsent4
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-payment-consents"
description: "OBIE domestic-payment-consent request — stages a single immediate domestic payment for PSU authorisation. Carries the Initiation instruction and the Risk block."
fields:
  - name: Data.ReadRefundAccount
    type: String
    required: false
    pii: false
    description: "OBInternalReadRefundAccount1Code (Yes/No) requesting sharing of refund account details."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomestic2
    required: true
    pii: false
    description: "Domestic payment Initiation block (instruction, amount, debtor/creditor, remittance)."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "Risk block with PaymentContextCode and optional DeliveryAddress."
    primary_key: false
used_by:
  - "screens/send-money-confirm/api.yaml"
  - "screens/send-money-amount/api.yaml"
  - "screens/payment-authorize-handoff/api.yaml"
