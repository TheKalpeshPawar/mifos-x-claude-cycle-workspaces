name: ChangePasswordRequest
version: "1.0.0"
pii_fields: [current_password, new_password]
source:
  origin: project
  api_path: "PUT /obp/v7.0.0/users/current/password"
description: "Request body for the change-password endpoint. Contains the user's current password (for verification) and the desired new password."
fields:
  - name: current_password
    type: String
    required: true
    pii: true
    description: "The user's existing password, sent for server-side verification before applying the change"
    primary_key: false
  - name: new_password
    type: String
    required: true
    pii: true
    description: "The desired new password; must meet the OBP minimum-strength policy"
    primary_key: false
used_by:
  - api_id: obp_change_password
    feature: change-password
    role: request
