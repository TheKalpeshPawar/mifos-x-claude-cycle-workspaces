name: OBWriteDomesticScheduled2
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-scheduled-payments"
description: "OBIE domestic-scheduled-payment submission request — submits the authorised scheduled payment by referencing the consent's ConsentId and re-sending the matching scheduled Initiation and Risk blocks."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Identifier of the authorised consent this scheduled payment is created from."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomesticScheduled2
    required: true
    pii: false
    description: "Scheduled Initiation block — must equal the consent's Initiation."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "Risk block — must equal the consent's Risk block."
    primary_key: false
used_by:
  - "server/apis/pisp-domestic-scheduled.yaml"
