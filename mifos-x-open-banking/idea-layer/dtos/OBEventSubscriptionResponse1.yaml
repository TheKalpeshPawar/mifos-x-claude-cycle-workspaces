name: OBEventSubscriptionResponse1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/event-subscriptions"
description: "OBIE Event Notification v4.0 subscription response — the created event-subscription resource with its unique EventSubscriptionId, version and registered event types. Also the per-item shape returned inside OBEventSubscriptionsResponse1 (GET event-subscriptions)."
fields:
  - name: Data.EventSubscriptionId
    type: String
    required: true
    pii: false
    description: "Unique subscription identifier, 1-40 chars."
    primary_key: true
  - name: Data.Version
    type: String
    required: true
    pii: false
    description: "Subscription version."
    primary_key: false
  - name: Data.EventTypes
    type:
      list_of: String
    required: false
    pii: false
    description: "Registered event types for this subscription."
    primary_key: false
  - name: Links.Self
    type: String
    required: false
    pii: false
    description: "Self link to the created resource."
    primary_key: false
used_by:
  - "screens/notifications/api.yaml"
  - "server/apis/events.yaml"
