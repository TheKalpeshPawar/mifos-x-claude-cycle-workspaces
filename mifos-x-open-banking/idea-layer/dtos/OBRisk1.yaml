name: OBRisk1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-payment-consents"
description: "OBIE Risk block — risk-scoring data the PISP supplies with a payment initiation (payment context plus optional delivery address). Echoed back on consent responses; may be an empty object on standing-order consents."
fields:
  - name: PaymentContextCode
    type: String
    required: true
    pii: false
    description: "Payment context, e.g. EcommerceMerchantInitiatedPayment, BillPayment, TransferToThirdParty."
    primary_key: false
  - name: DeliveryAddress
    type: String
    required: false
    pii: true
    description: "Optional delivery address (street, postcode, town, country) for goods/services being paid for."
    primary_key: false
used_by:
  - "screens/send-money-confirm/api.yaml"
  - "screens/payment-authorize-handoff/api.yaml"
  - "screens/auth-callback/api.yaml"
  - "screens/standing-order-create/api.yaml"
  - "screens/standing-order-edit/api.yaml"
  - "server/apis/pisp-domestic-scheduled.yaml"
  - "server/apis/pisp-international.yaml"
  - "server/apis/pisp-international-scheduled.yaml"
  - "server/apis/pisp-international-standing-order.yaml"
  - "server/apis/vrp.yaml"
