name: StandingOrderUpdateRequest
version: "1.0.0"
source:
  origin: project
  api_path: "PUT /obp/v4.0.0/banks/{bank_id}/accounts/{account_id}/owner/standing-order/{standing_order_id}"
description: "Request body DTO for updating a standing order's mutable fields. Beneficiary and currency are immutable after creation."
fields:
  - name: account_id
    type: "String?"
    required: false
    pii: false
    description: "Account ID (optional when implied by path param)"
    primary_key: false
  - name: counterparty_id
    type: "String?"
    required: false
    pii: false
    description: "Counterparty ID for the standing order"
    primary_key: false
  - name: amount
    type: "MoneyAmount?"
    required: false
    pii: false
    description: "Updated payment amount — currency + decimal string"
    primary_key: false
  - name: description
    type: "String?"
    required: false
    pii: false
    description: "Human-readable description or reference"
    primary_key: false
  - name: when
    type: "StandingOrderSchedule?"
    required: false
    pii: false
    description: "Updated schedule (frequency, start_date, end_date)"
    primary_key: false
used_by:
  - feature: standing-order-edit
    api_id: obp_update_standing_order
enums: []
