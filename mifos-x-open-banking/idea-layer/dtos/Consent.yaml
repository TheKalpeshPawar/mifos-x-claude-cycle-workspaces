name: Consent
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/my/consents"
description: "Represents an Open Banking consent record, tracking authorization scope, lifecycle status, and associated JWT for third-party access."
fields:
  - name: consent_id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: status
    type: String
    required: true
    pii: false
    primary_key: false
    # enum: [INITIATED, ACCEPTED, REVOKED, EXPIRED]
  - name: created_at
    type: DateTime
    required: true
    pii: false
    primary_key: false
  - name: valid_until
    type: DateTime
    required: true
    pii: false
    primary_key: false
  - name: consumer_id
    type: String
    required: true
    pii: false
    primary_key: false
  - name: json_web_token
    type: String
    required: true
    pii: false
    primary_key: false
used_by:
  - feature: consent-manager
    api_id: obp_my_consents
