name: Meeting
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v3.1.0/banks/{bankId}/meetings"
description: "Represents a scheduled meeting between a customer and bank staff, including provider details, purpose, scheduling time, and the list of invited participants."
fields:
  - name: meeting_id
    type: String
    required: true
    pii: false
    description: "Unique identifier for the meeting"
    primary_key: true
  - name: provider
    type: String
    required: true
    pii: false
    description: "Name of the meeting provider or conferencing platform"
    primary_key: false
  - name: provider_id
    type: String
    required: true
    pii: false
    description: "External identifier assigned by the meeting provider"
    primary_key: false
  - name: purpose_message
    type: String
    required: true
    pii: false
    description: "Human-readable description of the meeting's purpose"
    primary_key: false
  - name: scheduled_date
    type: DateTime
    required: true
    pii: false
    description: "ISO-8601 timestamp for when the meeting is scheduled to begin"
    primary_key: false
  - name: creator_user_id
    type: String
    required: true
    pii: false
    description: "User ID of the bank staff member who created the meeting"
    primary_key: false
  - name: invitees
    type:
      list_of:
        dto_ref: MeetingInvitee
    required: true
    pii: false
    description: "List of users invited to the meeting along with their acceptance status"
    primary_key: false
used_by:
  - feature: meetings
    api_id: obp_get_meetings
  - feature: meetings
    api_id: obp_create_meeting
enums: []
