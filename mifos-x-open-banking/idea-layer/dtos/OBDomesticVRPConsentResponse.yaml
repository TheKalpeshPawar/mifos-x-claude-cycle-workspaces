name: OBDomesticVRPConsentResponse
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-vrp-consents"
description: "OBIE PISP Domestic VRP consent response — the staged consent: ConsentId, status (AWAU|RJCT|AUTH|CANC|EXPD), creation/update datetimes, echoed control parameters and initiation, optional PSU-selected debtor account, and the Risk block. Same schema returned by the GET consent poll."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Unique consent identifier assigned by the ASPSP."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Consent status — initial AWAU; AWAU, RJCT, AUTH, CANC, EXPD."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 datetime of the last status change."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 consent creation timestamp."
    primary_key: false
  - name: Data.ControlParameters
    type:
      dto_ref: OBDomesticVRPControlParameters
    required: true
    pii: false
    description: "Echo of the limits set on the consent."
    primary_key: false
  - name: Data.DebtorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Present after PSU account selection."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBIE Risk block."
    primary_key: false
used_by:
  - "server/apis/vrp.yaml"
