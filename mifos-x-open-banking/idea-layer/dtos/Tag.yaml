name: Tag
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
description: "OBP transaction tag — a user-defined label attached to a transaction for categorisation or annotation."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier of the tag"
    primary_key: true
  - name: value
    type: String
    required: true
    pii: false
    description: "Tag value/label text (e.g. '#groceries')"
    primary_key: false
  - name: date
    type: String
    required: true
    pii: false
    description: "ISO 8601 timestamp when the tag was created"
    primary_key: false
  - name: user
    type: TagAuthorUser
    required: true
    pii: false
    description: "The OBP user who created this tag"
    primary_key: false
used_by:
  - feature: transaction-detail
    api_id: obp_get_transaction_detail
enums: []
