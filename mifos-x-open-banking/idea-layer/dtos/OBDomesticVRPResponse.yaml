name: OBDomesticVRPResponse
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-vrps"
description: "OBIE PISP Domestic VRP payment-order response — the created payment order: DomesticVRPId, referenced consent, status, creation/update datetimes, expected execution datetime, optional charges and optional refund account. Same schema returned by the GET payment-order poll."
fields:
  - name: Data.DomesticVRPId
    type: String
    required: true
    pii: false
    description: "Unique payment-order identifier."
    primary_key: true
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Consent the payment was made under."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 payment-order creation timestamp."
    primary_key: false
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "ExternalPaymentTransactionStatus1Code — initial RCVD, PDNG, ACTC or RJCT; full set RCVD, PDNG, ACTC, ACCP, ACFC, ACSP, ACWC, ACSC, ACWP, ACCC, BLCK, RJCT."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 datetime of the last status change."
    primary_key: false
  - name: Data.ExpectedExecutionDateTime
    type: String
    required: false
    pii: false
    description: "Expected execution time."
    primary_key: false
  - name: Data.Charges
    type:
      list_of:
        dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Charges applied to the payment order — each charge's Amount/Currency."
    primary_key: false
  - name: Data.Refund.Account
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Refund account, present when consent ReadRefundAccount=Yes."
    primary_key: false
used_by:
  - "server/apis/vrp.yaml"
