name: OBOpenDataResponse
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /open-banking/opendata/v2.4.0/{resource}"
description: "OBIE Open Data v2.4.0 common response envelope — UNAUTHENTICATED. A top-level meta block plus data[] where each entry carries a Brand[] array; each Brand groups the per-brand resource items (Branch | ATM | PCA | BCA). Shared by the branch/atm locator and the PCA/BCA product feeds."
fields:
  - name: meta.LastUpdated
    type: String
    required: true
    pii: false
    description: "ISODateTime the dataset was last updated."
    primary_key: false
  - name: meta.TotalResults
    type: Number
    required: true
    pii: false
    description: "Total number of results in the response."
    primary_key: false
  - name: meta.Agreement
    type: String
    required: false
    pii: false
    description: "Open Data licensing agreement text."
    primary_key: false
  - name: meta.License
    type: String
    required: false
    pii: false
    description: "Open Data licence URL."
    primary_key: false
  - name: meta.TermsOfUse
    type: String
    required: false
    pii: false
    description: "Terms of use URL."
    primary_key: false
  - name: data[].Brand[].BrandName
    type: String
    required: true
    pii: false
    description: "Brand name owning the resource items (e.g. HSBC UK)."
    primary_key: false
  - name: data[].Brand[].Branch
    type:
      list_of:
        dto_ref: OBBranch
    required: false
    pii: false
    description: "Branch-locator items (present on the /branches feed)."
    primary_key: false
  - name: data[].Brand[].ATM
    type:
      list_of:
        dto_ref: OBAtm
    required: false
    pii: false
    description: "ATM-locator items (present on the /atms feed)."
    primary_key: false
  - name: data[].Brand[].PCA
    type:
      list_of:
        dto_ref: OBPCAProduct
    required: false
    pii: false
    description: "Personal Current Account products (present on the /personal-current-accounts feed)."
    primary_key: false
  - name: data[].Brand[].BCA
    type:
      list_of:
        dto_ref: OBBCAProduct
    required: false
    pii: false
    description: "Business Current Account products (present on the /business-current-accounts feed)."
    primary_key: false
used_by:
  - "screens/atm-locator/api.yaml"
  - "screens/products/api.yaml"
  - "server/apis/open-data.yaml"
