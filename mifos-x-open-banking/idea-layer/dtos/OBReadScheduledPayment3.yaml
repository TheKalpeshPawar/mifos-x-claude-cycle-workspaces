name: OBReadScheduledPayment3
version: 1.0.0
description: >
  OBIE AIS v4.0 response envelope for GET /accounts/{AccountId}/scheduled-payments.
  Requires ReadScheduledPaymentsDetail permission for Amount fields.
  ScheduledType Execution = payment leaves the account on ScheduledPaymentDateTime;
  Arrival = funds arrive at beneficiary on that date.
source:
  origin: rest
  endpoint: "/accounts/{AccountId}/scheduled-payments"
fields:
  - name: scheduledPayment
    type: { list_of: Json }
    description: >
      OBScheduledPayment3 records from Data.ScheduledPayment[]. Each entry contains:
      AccountId, ScheduledPaymentId (primary key, optional), ScheduledPaymentDateTime,
      ScheduledType (Arrival | Execution), Reference (optional), DebtorReference (optional),
      InstructedAmount (OBActiveOrHistoricCurrencyAndAmount), CreditorAgent (optional),
      CreditorAccount (OBCashAccount3).
    required: true
    source_field: "Data.ScheduledPayment"
  - name: links
    type: { optional: Json }
    source_field: "Links"
  - name: meta
    type: { optional: Json }
    source_field: "Meta"
used_by:
  - feature: scheduled-payments
    kind: response
    api_id: scheduledPaymentsList
    role: body
capabilities_used:
  - has_api
tier: medium
tags:
  - obie
  - scheduled-payment
  - envelope
