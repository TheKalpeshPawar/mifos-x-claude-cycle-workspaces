name: OBReadScheduledPayment3
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/scheduled-payments"
description: "OBIE Account & Transaction API v4.0 scheduled-payments response object (OBScheduledPayment3 items) — read-only one-off future-dated payments on an account, with scheduled date, type, amount and creditor account."
fields:
  - name: Data.ScheduledPayment[].AccountId
    type: String
    required: true
    pii: false
    description: "Account the scheduled payment is on."
    primary_key: false
  - name: Data.ScheduledPayment[].ScheduledPaymentId
    type: String
    required: false
    pii: false
    description: "Unique scheduled-payment identifier."
    primary_key: true
  - name: Data.ScheduledPayment[].ScheduledPaymentDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the payment is scheduled for."
    primary_key: false
  - name: Data.ScheduledPayment[].ScheduledType
    type: String
    required: true
    pii: false
    description: "OBInternalScheduleType1Code: Arrival | Execution."
    primary_key: false
  - name: Data.ScheduledPayment[].Reference
    type: String
    required: false
    pii: false
    description: "Payment reference."
    primary_key: false
  - name: Data.ScheduledPayment[].InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Instructed amount + currency."
    primary_key: false
  - name: Data.ScheduledPayment[].CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Creditor account identification (Detail permission)."
    primary_key: false
used_by:
  - "server/apis/ais.yaml"
