name: OBReadParty3
version: 1.0.0
description: >
  OBIE AIS v4.0 response envelope for GET /accounts/{AccountId}/parties.
  Returns an ARRAY of parties — may include joint account holders in addition to the primary.
  Same OBParty2 item shape as OBReadParty2, but wrapped in an array.
  Requires ReadParty permission. ViewModel merges with /party response and deduplicates by PartyId.
source:
  origin: rest
  endpoint: "/accounts/{AccountId}/parties"
fields:
  - name: party
    type: { list_of: Json }
    description: >
      Array of OBParty2 records from Data.Party[]. Same item shape as OBReadParty2.Data.Party.
      ViewModel deduplicates by PartyId when merging with the /party response.
      Joint account will have 2+ entries; sole account typically 1 entry same as /party.
    required: true
    source_field: "Data.Party"
  - name: links
    type: { optional: Json }
    source_field: "Links"
  - name: meta
    type: { optional: Json }
    source_field: "Meta"
used_by:
  - feature: account-holder
    kind: response
    api_id: parties
    role: body
capabilities_used:
  - has_api
tier: maximum
tags:
  - obie
  - party
  - pii
  - envelope
