name: OBReadParty3
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/parties"
description: "OBIE Account & Transaction API v4.0 parties response object (array of OBParty2) — the account owner(s)/holder(s) and operator(s) for an account, with name, legal name, email and address."
fields:
  - name: Data.Party[].PartyId
    type: String
    required: false
    pii: false
    description: "Unique party identifier (OBParty2)."
    primary_key: true
  - name: Data.Party[].PartyType
    type: String
    required: false
    pii: false
    description: "Sole | Joint | Delegate etc."
    primary_key: false
  - name: Data.Party[].Name
    type: String
    required: false
    pii: true
    description: "Party name."
    primary_key: false
  - name: Data.Party[].FullLegalName
    type: String
    required: false
    pii: true
    description: "Full legal name."
    primary_key: false
  - name: Data.Party[].EmailAddress
    type: String
    required: false
    pii: true
    description: "Party email address."
    primary_key: false
  - name: Data.Party[].Address[].AddressLine
    type:
      list_of: String
    required: false
    pii: true
    description: "Postal address lines."
    primary_key: false
used_by:
  - "screens/account-detail/api.yaml"
  - "screens/pfm-settings/api.yaml"
