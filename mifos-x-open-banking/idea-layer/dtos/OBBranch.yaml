name: OBBranch
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /open-banking/opendata/v2.4.0/branches"
description: "OBIE Open Data v2.4.0 Branch Locator item (data[].Brand[].Branch[]) — UNAUTHENTICATED. A physical or mobile branch with its identification, segments, accessibility, availability, contacts and postal address/geolocation. Branch reference data is not personal PII."
fields:
  - name: Identification
    type: String
    required: true
    pii: false
    description: "Unique branch identifier."
    primary_key: true
  - name: SequenceNumber
    type: String
    required: false
    pii: false
    description: "00 = main branch; 01..n = sub/mobile branch."
    primary_key: false
  - name: Name
    type: String
    required: false
    pii: false
    description: "Branch name."
    primary_key: false
  - name: Type
    type: String
    required: true
    pii: false
    description: "Physical | Mobile."
    primary_key: false
  - name: CustomerSegment
    type:
      list_of: String
    required: false
    pii: false
    description: "Customer segments served by the branch."
    primary_key: false
  - name: Accessibility
    type:
      list_of: String
    required: false
    pii: false
    description: "Accessibility provisions at the branch."
    primary_key: false
  - name: OtherServiceAndFacility
    type:
      list_of: String
    required: false
    pii: false
    description: "Other services/facilities (Code, Name)."
    primary_key: false
  - name: Availability.StandardAvailability.Day
    type:
      list_of: String
    required: false
    pii: false
    description: "Per-day opening hours (Name, OpeningHours[] with OpeningTime/ClosingTime) plus non-standard/seasonal availability."
    primary_key: false
  - name: ContactInfo
    type:
      list_of: String
    required: false
    pii: false
    description: "Contact entries (ContactType, ContactContent)."
    primary_key: false
  - name: PostalAddress
    type: String
    required: true
    pii: false
    description: "AddressLine[], TownName, CountrySubDivision[], Country, PostCode, GeoLocation.GeographicCoordinates.Latitude/Longitude."
    primary_key: false
used_by:
  - "screens/atm-locator/api.yaml"
  - "server/apis/open-data.yaml"
