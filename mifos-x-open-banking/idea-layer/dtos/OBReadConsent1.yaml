name: OBReadConsent1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/aisp/account-access-consents"
description: "OBIE Account & Transaction API v4.0 account-access-consent request object — the data-cluster Permissions, optional expiry and transaction window the PSU will authorise."
fields:
  - name: Data.Permissions
    type:
      list_of: String
    required: true
    pii: false
    description: "Consented data clusters (1..n), enum incl. ReadAccountsBasic/Detail, ReadBalances, ReadBeneficiariesBasic/Detail, ReadDirectDebits, ReadPAN, ReadParty, ReadProducts, ReadScheduledPaymentsBasic/Detail, ReadStandingOrdersBasic/Detail, ReadTransactionsBasic/Credits/Debits/Detail."
    primary_key: false
  - name: Data.ExpirationDateTime
    type: String
    required: false
    pii: false
    description: "ISODateTime consent expiry. Open-ended if absent."
    primary_key: false
  - name: Data.TransactionFromDateTime
    type: String
    required: false
    pii: false
    description: "ISODateTime start of the consented transaction query window."
    primary_key: false
  - name: Data.TransactionToDateTime
    type: String
    required: false
    pii: false
    description: "ISODateTime end of the consented transaction query window."
    primary_key: false
  - name: Risk
    type: String
    required: true
    pii: false
    description: "OBRisk2 section. No fields identified for AIS — sent as an empty object."
    primary_key: false
used_by:
  - "screens/consent-request/api.yaml"
