name: Comment
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
description: "OBP transaction comment — a free-text annotation attached to a transaction by a user via the OBP v1.2.1 metadata API."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier of the comment"
    primary_key: true
  - name: value
    type: String
    required: true
    pii: false
    description: "Comment text content"
    primary_key: false
  - name: date
    type: String
    required: true
    pii: false
    description: "ISO 8601 timestamp when the comment was posted"
    primary_key: false
  - name: user
    type: TagAuthorUser
    required: true
    pii: false
    description: "The OBP user who posted this comment"
    primary_key: false
used_by:
  - feature: transaction-detail
    api_id: obp_get_transaction_detail
enums: []
