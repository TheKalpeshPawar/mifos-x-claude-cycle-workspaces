name: OBReadAccount6
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts"
description: "OBIE Account & Transaction API v4.0 account-list response object (OBAccount6 items) — the authorised AccountId(s) with identification, scheme, type, nickname and servicer."
fields:
  - name: Data.Account[].AccountId
    type: String
    required: true
    pii: false
    description: "Unique account identifier."
    primary_key: true
  - name: Data.Account[].Status
    type: String
    required: false
    pii: false
    description: "OBAccountStatus1Code: Enabled | Disabled | Deleted | Pending | ProForma."
    primary_key: false
  - name: Data.Account[].StatusUpdateDateTime
    type: String
    required: false
    pii: false
    description: "ISODateTime of the last status change."
    primary_key: false
  - name: Data.Account[].Currency
    type: String
    required: false
    pii: false
    description: "ISO 4217 currency (optional for switched accounts)."
    primary_key: false
  - name: Data.Account[].AccountCategory
    type: String
    required: false
    pii: false
    description: "OBInternalAccountType1Code: Business | Personal."
    primary_key: false
  - name: Data.Account[].AccountTypeCode
    type: String
    required: false
    pii: false
    description: "OBExternalCashAccountType1Code (e.g. CurrentAccount, Savings)."
    primary_key: false
  - name: Data.Account[].Nickname
    type: String
    required: false
    pii: true
    description: "PSU-assigned nickname."
    primary_key: false
  - name: Data.Account[].Description
    type: String
    required: false
    pii: false
    description: "Account description."
    primary_key: false
  - name: Data.Account[].OpeningDate
    type: String
    required: false
    pii: false
    description: "Account opening date."
    primary_key: false
  - name: Data.Account[].Account
    type:
      list_of:
        dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Account identification block(s): SchemeName, Identification, Name, SecondaryIdentification."
    primary_key: false
  - name: Data.Account[].Servicer
    type:
      dto_ref: OBBranchAndFinancialInstitutionIdentification
    required: false
    pii: true
    description: "Servicing institution scheme + identification (sort code / BIC)."
    primary_key: false
  - name: Links.Self
    type: String
    required: false
    pii: false
    description: "Self link; Links also carries First/Prev/Next/Last for pagination."
    primary_key: false
  - name: Meta.TotalPages
    type: Number
    required: false
    pii: false
    description: "Total page count (pagination Meta)."
    primary_key: false
used_by:
  - "screens/accounts/api.yaml"
  - "screens/account-detail/api.yaml"
  - "screens/home/api.yaml"
  - "screens/beneficiaries/api.yaml"
  - "screens/pfm-dashboard/api.yaml"
  - "screens/pfm-settings/api.yaml"
  - "screens/business-insights/api.yaml"
