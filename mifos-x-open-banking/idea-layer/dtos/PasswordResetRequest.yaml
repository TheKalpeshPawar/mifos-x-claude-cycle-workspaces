name: PasswordResetRequest
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v7.0.0/users/forgot-password/reset-emails"
description: "Request body for the forgot-password reset-email endpoint. Identifies the account by username or email address."
fields:
  - name: username
    type: String
    required: false
    pii: true
    description: "Account username; one of username or email must be supplied"
    primary_key: false
  - name: email
    type: String
    required: false
    pii: true
    description: "Account email address; one of username or email must be supplied"
    primary_key: false
used_by:
  - api_id: obp_request_password_reset
    feature: forgot-password
    role: request
