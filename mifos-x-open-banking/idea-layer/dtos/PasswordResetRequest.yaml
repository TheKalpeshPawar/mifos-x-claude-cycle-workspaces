name: PasswordResetRequest
version: "1.1.0"
source:
  origin: project
  api_path: "POST /obp/v4.0.0/auth/password/reset/initiate"
description: "Request body for the password reset initiation endpoint (auth-recovery v4.0.0). Sends a time-limited reset token to the user's registered email. Intentionally non-enumerating — does not confirm whether the email exists. Updated in v1.1.0 to align with the new auth-recovery API group (v4.0.0 path) which accepts only email."
fields:
  - name: email
    type: String
    required: true
    pii: true
    description: "Registered account email address (RFC 5321, max 254 chars); PII — used to dispatch the reset link"
    primary_key: false
used_by:
  - feature: forgot-password
    api_id: obp_request_password_reset
pii_fields:
  - email
