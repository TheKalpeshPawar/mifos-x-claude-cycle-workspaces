name: OBReadOffer1
version: 1.0.0
description: >
  OBIE AIS v4.0 response envelope for GET /accounts/{AccountId}/offers.
  Returns promotional offers associated with the account.
  Requires ReadOffers permission. Consumed by the accounts screen.
source:
  origin: rest
  endpoint: "/accounts/{AccountId}/offers"
fields:
  - name: offer
    type: { list_of: Json }
    description: >
      OBOffer1 offer records from Data.Offer[]. Each entry contains:
      AccountId, OfferId (primary key, optional),
      OfferType (BalanceTransfer | LimitIncrease | MoneyTransfer | Other | PromotionalRate),
      Description (optional), StartDateTime (optional), EndDateTime (optional),
      Rate (decimal, optional), Value (integer, optional), Term (optional), URL (optional),
      Amount (OBActiveOrHistoricCurrencyAndAmount, optional), Fee (OBActiveOrHistoricCurrencyAndAmount, optional).
    required: true
    source_field: "Data.Offer"
  - name: links
    type: { optional: Json }
    source_field: "Links"
  - name: meta
    type: { optional: Json }
    source_field: "Meta"
used_by:
  - feature: accounts
    kind: response
    api_id: offers
    role: body
capabilities_used:
  - has_api
tier: medium
tags:
  - obie
  - offers
  - envelope
