name: OBActiveOrHistoricCurrencyAndAmount
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
description: "OBIE shared monetary sub-object — a decimal Amount string paired with its ISO 4217 Currency. Reused across balances, transactions, direct debits, standing orders, scheduled payments and statements."
fields:
  - name: Amount
    type: String
    required: true
    pii: false
    description: "Monetary value as a decimal string."
    primary_key: false
  - name: Currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code."
    primary_key: false
used_by:
  - "screens/accounts/api.yaml"
  - "screens/account-detail/api.yaml"
  - "screens/home/api.yaml"
  - "screens/transactions/api.yaml"
  - "screens/pfm-dashboard/api.yaml"
  - "screens/business-insights/api.yaml"
  - "screens/direct-debits/api.yaml"
  - "screens/standing-orders/api.yaml"
  - "screens/send-money-confirm/api.yaml"
  - "screens/send-money-amount/api.yaml"
  - "screens/payment-authorize-handoff/api.yaml"
  - "screens/auth-callback/api.yaml"
  - "screens/payment-result/api.yaml"
  - "screens/standing-order-create/api.yaml"
  - "screens/standing-order-edit/api.yaml"
  - "server/apis/pisp-domestic-scheduled.yaml"
  - "server/apis/pisp-international.yaml"
  - "server/apis/pisp-international-scheduled.yaml"
  - "server/apis/pisp-international-standing-order.yaml"
  - "server/apis/pisp-file.yaml"
  - "server/apis/pisp-multibill.yaml"
  - "server/apis/vrp.yaml"
