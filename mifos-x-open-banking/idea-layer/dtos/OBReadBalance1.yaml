name: OBReadBalance1
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
description: "OBIE Account & Transaction API v4.0 balance response object (OBReadBalance1) — one or more balances per account, each with type, credit/debit indicator, amount and optional credit line."
fields:
  - name: Data.Balance[].AccountId
    type: String
    required: true
    pii: false
    description: "Account the balance belongs to."
    primary_key: false
  - name: Data.Balance[].CreditDebitIndicator
    type: String
    required: true
    pii: false
    description: "OBInternalCreditDebitCode: Credit | Debit."
    primary_key: false
  - name: Data.Balance[].Type
    type: String
    required: true
    pii: false
    description: "ExternalBalanceType1Code (e.g. InterimAvailable, ClosingBooked)."
    primary_key: false
  - name: Data.Balance[].DateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 date-time of the balance (with timezone)."
    primary_key: false
  - name: Data.Balance[].Amount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Balance amount + ISO 4217 currency."
    primary_key: false
  - name: Data.Balance[].CreditLine[].Included
    type: Boolean
    required: false
    pii: false
    description: "Whether the credit line is included in the balance."
    primary_key: false
  - name: Data.Balance[].CreditLine[].Type
    type: String
    required: false
    pii: false
    description: "OBInternalLimitType1Code (e.g. Available, Credit)."
    primary_key: false
  - name: Data.Balance[].CreditLine[].Amount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Credit-line amount + currency."
    primary_key: false
used_by:
  - "screens/accounts/api.yaml"
  - "screens/account-detail/api.yaml"
  - "screens/home/api.yaml"
  - "screens/pfm-dashboard/api.yaml"
  - "screens/business-insights/api.yaml"
  - "screens/send-money/api.yaml"
  - "screens/send-money-amount/api.yaml"
