  api_path: "GET /obie/open-banking/v4.0/pisp/domestic-payment-consents/{ConsentId}/funds-confirmation"
description: "OBIE funds-confirmation response — reports whether funds are available against an authorised domestic-payment consent. Valid only while consent Status is AUTH; does not change consent status."
fields:
  - name: Data.FundsAvailableResult.FundsAvailable
    type: Boolean
    required: true
    pii: false
    description: "Whether sufficient funds are available for the consented payment."
    primary_key: false
  - name: Data.FundsAvailableResult.FundsAvailableDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the funds availability was confirmed."
    primary_key: false
  - name: Data.SupplementaryData
    type: String
    required: false
    pii: false
    description: "Optional ASPSP supplementary data."
    primary_key: false
used_by:
  - "screens/send-money-amount/api.yaml"
