name: OBWriteFundsConfirmationResponse1
version: 1.0.0
description: >
  OBIE PISP v4.0 RESPONSE for GET /domestic-payment-consents/{ConsentId}/funds-confirmation.
  An optional pre-submit check, callable only once the consent is Authorised because it needs
  the PSU token. A false result blocks submission and surfaces as InsufficientFunds — the
  payment is never sent.
source:
  origin: rest
  endpoint: "/domestic-payment-consents/{ConsentId}/funds-confirmation"
  method: GET
  spec_ref: "specs/hsbc-sandbox/openapi/payment-initiation-4.0-personal.yaml"
fields:
  - name: funds_available
    type: Boolean
    required: true
    source_field: "Data.FundsAvailableResult.FundsAvailable"
  - name: funds_available_date_time
    type: { optional: String }
    source_field: "Data.FundsAvailableResult.FundsAvailableDateTime"
used_by:
  - { feature: send-money, kind: response, api_id: domestic-payment-funds-confirmation, role: body }
capabilities_used: [has_api]
tier: high
tags: [obie, pisp, payment, funds-confirmation, envelope]
source_binding: "not modelled in source — no funds-confirmation DTO ships in core/network"
