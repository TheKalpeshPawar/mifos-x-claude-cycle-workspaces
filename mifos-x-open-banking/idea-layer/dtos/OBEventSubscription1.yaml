name: OBEventSubscription1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/event-subscriptions"
description: "OBIE Event Notification v4.0 subscription request — registers an event-subscription so the ASPSP starts queuing notifications for polling. At HSBC the only allowed EventType is UK.OBIE.Consent-Authorization-Revoked. Sent with a client-credentials token + x-jws-signature."
fields:
  - name: Data.Version
    type: String
    required: true
    pii: false
    description: "Subscription version, 1-10 chars (e.g. 4.0)."
    primary_key: false
  - name: Data.EventTypes
    type:
      list_of: String
    required: true
    pii: false
    description: "Requested event types; HSBC allows only UK.OBIE.Consent-Authorization-Revoked."
    primary_key: false
used_by:
  - "screens/notifications/api.yaml"
  - "server/apis/events.yaml"
