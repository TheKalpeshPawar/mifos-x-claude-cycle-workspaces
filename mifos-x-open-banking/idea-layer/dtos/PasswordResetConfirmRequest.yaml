name: PasswordResetConfirmRequest
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v4.0.0/auth/password/reset/confirm"
description: "Request body for the password reset confirmation step from auth-recovery.yaml. Carries the single-use reset token (delivered by email) and the user's chosen new password. Token is valid for 15 minutes after issue."
fields:
  - name: token
    type: String
    required: true
    pii: true
    description: "Opaque single-use reset token from the reset email; expires 15 minutes after issue; PII — do not log"
    primary_key: false
  - name: new_password
    type: String
    required: true
    pii: true
    description: "New password chosen by the user; min 12 chars, must include uppercase, digit, special char; PII — never log"
    primary_key: false
used_by:
  - api_id: confirm_password_reset
    feature: forgot-password
    role: request
pii_fields:
  - token
  - new_password
enums: []
