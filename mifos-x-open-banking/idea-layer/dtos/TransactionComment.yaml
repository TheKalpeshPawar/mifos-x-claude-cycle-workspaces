name: TransactionComment
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/comments"
description: "Represents a free-text comment posted by a user on a transaction, capturing the comment text and creation timestamp."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier for the comment"
    primary_key: true
  - name: value
    type: String
    required: true
    pii: false
    description: "Text body of the comment"
    primary_key: false
  - name: date
    type: DateTime
    required: true
    pii: false
    description: "ISO-8601 timestamp when the comment was posted"
    primary_key: false
used_by:
  - feature: transaction-tags
    api_id: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/comments"
  - feature: transaction-detail
    api_id: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/comments"
enums: []
