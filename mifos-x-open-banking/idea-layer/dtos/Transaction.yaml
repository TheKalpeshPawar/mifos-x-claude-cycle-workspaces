name: Transaction
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/my/banks/{bankId}/accounts/{accountId}/transactions"
description: "Top-level transaction object returned by the OBP transactions list and single-transaction endpoints. Composes the source account, counterparty, financial details, and metadata sub-objects."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique transaction identifier"
    primary_key: true
  - name: this_account
    type:
      dto_ref: TransactionAccount
    required: true
    pii: false
    description: "The bank account that owns this transaction"
    primary_key: false
  - name: other_account
    type:
      dto_ref: TransactionCounterparty
    required: true
    pii: false
    description: "The counterparty account or payee involved in the transaction"
    primary_key: false
  - name: details
    type:
      dto_ref: TransactionDetails
    required: true
    pii: false
    description: "Financial and temporal details of the transaction (type, amounts, dates)"
    primary_key: false
  - name: metadata
    type:
      dto_ref: TransactionMetadata
    required: true
    pii: false
    description: "User-generated metadata attached to the transaction (narrative, comments, tags)"
    primary_key: false
used_by:
  - feature: consumer-home
    api_id: obp_get_transactions
  - feature: pfm-dashboard
    api_id: obp_transactions_list
enums: []
