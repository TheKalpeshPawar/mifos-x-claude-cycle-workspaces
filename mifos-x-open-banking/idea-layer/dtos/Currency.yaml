name: Currency
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/currencies"
description: "A currency supported by the bank as returned by the OBP currencies endpoint. Includes whether the currency is treated as a bank asset and optional product and country metadata, used to populate the currency picker on the FX rates screen."
fields:
  - name: code
    type: String
    required: true
    pii: false
    description: "ISO 4217 three-letter currency code, unique identifier for this record"
    primary_key: true
  - name: name
    type: String
    required: true
    pii: false
    description: "Human-readable full name of the currency (e.g. Euro)"
    primary_key: false
  - name: is_asset
    type: Boolean
    required: true
    pii: false
    description: "True when this currency is held as a bank asset (e.g. a crypto or commodity currency)"
    primary_key: false
  - name: product
    type:
      optional: String
    required: false
    pii: false
    description: "Optional product code associated with this currency offering"
    primary_key: false
  - name: country
    type:
      optional: String
    required: false
    pii: false
    description: "Optional ISO 3166-1 alpha-2 country code indicating the primary country for this currency"
    primary_key: false
used_by:
  - feature: fx-rates
    api_id: "GET /obp/v5.1.0/banks/{bankId}/currencies"
enums: []
