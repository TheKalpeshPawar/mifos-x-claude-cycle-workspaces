name: CustomerMessage
version: "1.0.0"
pii_fields: [from_person]
source:
  origin: project
  api_path: "GET/POST /obp/v5.1.0/banks/{bankId}/customers/{customerId}/messages"
description: "Represents a message sent to or from a bank customer through the customer service channel, tracking transport method and department origin."
fields:
  - name: id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: date
    type: DateTime
    required: true
    pii: false
    primary_key: false
  - name: description
    type: String
    required: true
    pii: false
    primary_key: false
  - name: transport
    type: String
    required: true
    pii: false
    primary_key: false
  - name: from_department
    type: String
    required: true
    pii: false
    primary_key: false
  - name: from_person
    type: String
    required: true
    pii: true
    primary_key: false
used_by:
  - feature: customer-messages
    api_id: obp_get_customer_messages
