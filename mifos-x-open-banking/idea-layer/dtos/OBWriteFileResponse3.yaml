name: OBWriteFileResponse3
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/file-payments"
description: "OBIE PISP File Payment submission response — the created file-payment resource: FilePaymentId, referenced consent, status (initial RCVD or RJCT), creation/update datetimes, echoed file type, optional charges and optional multi-authorisation status. Same schema returned by the GET payment poll. Also the inferred response shape for the HSBC multi-bill payment (response schema documented-gap on that group)."
fields:
  - name: Data.FilePaymentId
    type: String
    required: true
    pii: false
    description: "Unique file-payment resource identifier."
    primary_key: true
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "The consent this payment was created against."
    primary_key: false
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Payment status — initial RCVD or RJCT."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the file-payment resource was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the status was last updated."
    primary_key: false
  - name: Data.Initiation.FileType
    type: String
    required: false
    pii: false
    description: "Echoes the initiation file type."
    primary_key: false
  - name: Data.Charges
    type:
      list_of:
        dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Charges applicable to the file payment — each charge's Amount/Currency."
    primary_key: false
  - name: Data.MultiAuthorisation.Status
    type: String
    required: false
    pii: false
    description: "Multi-authorisation status, present only when multi-auth applies."
    primary_key: false
used_by:
  - "server/apis/pisp-file.yaml"
  - "server/apis/pisp-multibill.yaml"
