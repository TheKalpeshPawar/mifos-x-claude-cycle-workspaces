name: PasswordResetResponse
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v7.0.0/users/forgot-password/reset-emails"
description: "Response from the forgot-password reset-email endpoint. Deliberately non-enumerating — message is identical whether the account exists or not, to prevent account enumeration attacks."
fields:
  - name: success
    type: Boolean
    required: true
    pii: false
    description: "True if the request was accepted; note success=true does not confirm the account exists"
    primary_key: false
  - name: message
    type: String
    required: false
    pii: false
    description: "Generic confirmation copy, e.g. 'If an account exists, a reset link has been sent'"
    primary_key: false
used_by:
  - feature: forgot-password
    api_id: obp_request_password_reset
