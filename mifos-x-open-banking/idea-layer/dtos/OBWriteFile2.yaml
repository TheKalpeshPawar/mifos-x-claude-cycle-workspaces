name: OBWriteFile2
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/file-payments"
description: "OBIE PISP File Payment submission request — references the authorised file-payment-consent; the file metadata (FileType, FileHash, ControlSum) must match the corresponding consent. Also the request shape for the HSBC multi-bill payment submission, which reuses the file-payment paths."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "References the authorised file-payment-consent."
    primary_key: false
  - name: Data.Initiation.FileType
    type: String
    required: true
    pii: false
    description: "Must match the consent's Initiation.FileType."
    primary_key: false
  - name: Data.Initiation.FileHash
    type: String
    required: true
    pii: false
    description: "Must match the consent's Initiation.FileHash."
    primary_key: false
  - name: Data.Initiation.ControlSum
    type: String
    required: false
    pii: false
    description: "Decimal string — must match the consent's Initiation.ControlSum."
    primary_key: false
used_by:
  - "server/apis/pisp-file.yaml"
  - "server/apis/pisp-multibill.yaml"
