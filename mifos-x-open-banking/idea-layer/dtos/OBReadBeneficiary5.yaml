name: OBReadBeneficiary5
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/beneficiaries"
description: "OBIE Account & Transaction API v4.0 beneficiaries response object (OBBeneficiary5 items) — read-only payees linked to an account, with type, reference and creditor account."
fields:
  - name: Data.Beneficiary[].AccountId
    type: String
    required: false
    pii: false
    description: "Account the beneficiary is linked to."
    primary_key: false
  - name: Data.Beneficiary[].BeneficiaryId
    type: String
    required: false
    pii: false
    description: "Unique beneficiary identifier."
    primary_key: true
  - name: Data.Beneficiary[].BeneficiaryType
    type: String
    required: false
    pii: false
    description: "Trusted | Ordinary."
    primary_key: false
  - name: Data.Beneficiary[].Reference
    type: String
    required: false
    pii: false
    description: "Beneficiary reference."
    primary_key: false
  - name: Data.Beneficiary[].CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Beneficiary account identification: SchemeName, Identification, Name."
    primary_key: false
used_by:
  - "screens/beneficiaries/api.yaml"
