name: KycDocument
version: "1.0.0"
pii_fields: [number, date_of_birth]
source:
  origin: project
  api_path: "GET/PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_documents"
description: "Represents a KYC identity document submitted by a customer for verification, including document type, issuing details, and supporting images."
fields:
  - name: id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: customer_number
    type: String
    required: true
    pii: false
    primary_key: false
  - name: type
    type: String
    required: true
    pii: false
    primary_key: false
    # enum: [PASSPORT, DRIVING_LICENSE, NATIONAL_ID, UTILITY_BILL, BANK_STATEMENT]
  - name: number
    type: String
    required: true
    pii: true
    primary_key: false
  - name: issue_date
    type: Date
    required: true
    pii: false
    primary_key: false
  - name: issue_place
    type: String
    required: true
    pii: false
    primary_key: false
  - name: expiry_date
    type: { optional: Date }
    required: false
    pii: false
    primary_key: false
  - name: image_url1
    type: Url
    required: true
    pii: false
    primary_key: false
  - name: image_url2
    type: { optional: Url }
    required: false
    pii: false
    primary_key: false
  - name: date_of_birth
    type: { optional: Date }
    required: false
    pii: true
    primary_key: false
used_by:
  - feature: kyc-review
    api_id: get-kyc-documents
  - feature: customer-onboarding
    api_id: put-kyc-document
