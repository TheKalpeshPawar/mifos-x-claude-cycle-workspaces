name: TransactionTag
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/tags"
description: "Represents a user-defined tag attached to a transaction for categorisation and search purposes."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier for the tag"
    primary_key: true
  - name: value
    type: String
    required: true
    pii: false
    description: "Text content of the tag (e.g. 'groceries', 'travel')"
    primary_key: false
  - name: date
    type: DateTime
    required: true
    pii: false
    description: "ISO-8601 timestamp when the tag was created"
    primary_key: false
used_by:
  - feature: transaction-tags
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/tags"
  - feature: transaction-tags
    api_id: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/tags"
  - feature: transaction-tags
    api_id: "DELETE /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/tags/{tagId}"
  - feature: transaction-detail
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/{viewId}/transactions/{transactionId}/metadata/tags"
enums: []
