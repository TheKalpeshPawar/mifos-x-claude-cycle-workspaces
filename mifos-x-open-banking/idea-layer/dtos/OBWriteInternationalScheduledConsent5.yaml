name: OBWriteInternationalScheduledConsent5
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-scheduled-payment-consents"
description: "OBIE PISP International Scheduled Payment consent request — stages a one-off future-dated cross-border payment with a requested execution datetime, instructed amount, currency of transfer, optional debtor account, creditor account, remittance, authorisation and SCA-exemption hints."
fields:
  - name: Data.Permission
    type: String
    required: true
    pii: false
    description: "Restricted to Create."
    primary_key: false
  - name: Data.ReadRefundAccount
    type: String
    required: false
    pii: false
    description: "Yes | No — whether the refund account is to be returned."
    primary_key: false
  - name: Data.Initiation.InstructionIdentification
    type: String
    required: true
    pii: false
    description: "Point-to-point reference for the instruction."
    primary_key: false
  - name: Data.Initiation.EndToEndIdentification
    type: String
    required: false
    pii: false
    description: "End-to-end reference carried unchanged through the chain."
    primary_key: false
  - name: Data.Initiation.LocalInstrument
    type: String
    required: false
    pii: false
    description: "Settlement rail, e.g. UK.OBIE.SWIFT."
    primary_key: false
  - name: Data.Initiation.RequestedExecutionDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 future date-time for execution of the scheduled payment."
    primary_key: false
  - name: Data.Initiation.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Instructed amount and currency, regardless of debtor-account currency."
    primary_key: false
  - name: Data.Initiation.CurrencyOfTransfer
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency the funds will be transferred in."
    primary_key: false
  - name: Data.Initiation.DestinationCountryCode
    type: String
    required: false
    pii: false
    description: "ISO 3166 country code of the destination."
    primary_key: false
  - name: Data.Initiation.DebtorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Optional debtor account (the PISP may not know the PSU account)."
    primary_key: false
  - name: Data.Initiation.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor account — scheme, identification and name."
    primary_key: false
  - name: Data.Initiation.RemittanceInformation.Reference
    type: String
    required: false
    pii: false
    description: "Remittance reference for reconciliation."
    primary_key: false
  - name: Data.Authorisation.AuthorisationType
    type: String
    required: false
    pii: false
    description: "e.g. Single."
    primary_key: false
  - name: Data.Authorisation.CompletionDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 authorisation completion deadline."
    primary_key: false
  - name: Data.SCASupportData.RequestedSCAExemptionType
    type: String
    required: false
    pii: false
    description: "Requested SCA exemption, e.g. BillPayment."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: false
    pii: false
    description: "OBIE Risk block — payment context and merchant category code."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international-scheduled.yaml"
