name: OBWriteDomesticConsentResponse5
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-payment-consents"
description: "OBIE domestic-payment-consent response — returns the ASPSP-assigned ConsentId and status (AWAU/AUTH/RJCT/COND) with the echoed Initiation and Risk blocks. Also returned by GET domestic-payment-consents/{ConsentId}."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "ASPSP-assigned consent identifier."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Consent status: AWAU (awaiting authorisation), AUTH, RJCT, COND."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the consent was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime of the last status update."
    primary_key: false
  - name: Data.StatusReason
    type:
      list_of: String
    required: false
    pii: false
    description: "Optional StatusReason[] (StatusReasonCode, StatusReasonDescription, Path)."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomestic2
    required: true
    pii: false
    description: "Echoed Initiation block from the request."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "Echoed Risk block."
    primary_key: false
used_by:
  - "screens/send-money-confirm/api.yaml"
  - "screens/send-money-amount/api.yaml"
  - "screens/payment-authorize-handoff/api.yaml"
