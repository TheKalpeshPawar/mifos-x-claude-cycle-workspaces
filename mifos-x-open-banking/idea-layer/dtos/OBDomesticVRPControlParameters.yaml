name: OBDomesticVRPControlParameters
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-vrp-consents"
description: "OBIE Domestic VRP control-parameters sub-object — the long-lived limits the PSU agrees for a Variable Recurring Payment: per-payment maximum, periodic limits, VRP type and the permitted authentication methods / interaction types."
fields:
  - name: MaximumIndividualAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Per-payment cap (Amount + Currency)."
    primary_key: false
  - name: PeriodicLimits
    type:
      list_of:
        dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Periodic spend caps (each carries Amount + Currency, plus PeriodType Day|Week|Fortnight|Month|Half-year|Year and PeriodAlignment Consent|Calendar)."
    primary_key: false
  - name: VRPType
    type:
      list_of: String
    required: true
    pii: false
    description: "Namespaced VRP type enum, e.g. UK.OBIE.VRPType.Sweeping (1..*)."
    primary_key: false
  - name: PSUAuthenticationMethods
    type:
      list_of: String
    required: true
    pii: false
    description: "Permitted authentication methods, e.g. UK.OBIE.SCANotRequired (1..*)."
    primary_key: false
  - name: PSUInteractionTypes
    type:
      list_of: String
    required: false
    pii: false
    description: "Permitted PSU interaction types, e.g. InSession."
    primary_key: false
used_by:
  - "server/apis/vrp.yaml"
