name: OBWriteDomesticStandingOrder3
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-standing-orders"
description: "OBIE domestic-standing-order submission request — submits the authorised standing order by referencing the authorised ConsentId and re-sending the matching Initiation and Risk blocks."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Must equal the authorised consent ConsentId."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomesticStandingOrder3
    required: true
    pii: false
    description: "Standing-order Initiation block — must match the consent's Initiation."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBRisk block (may be an empty object)."
    primary_key: false
used_by:
  - "screens/standing-order-create/api.yaml"
  - "screens/standing-order-edit/api.yaml"
