name: OBExchangeRate2
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-payment-consents"
description: "OBIE exchange-rate sub-object (Data.ExchangeRateInformation) — the quoted or applied FX rate for a cross-border / cross-currency international payment: the unit currency, the rate value, the rate type and, for agreed rates, the contract identification and expiry."
fields:
  - name: UnitCurrency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency in which the ExchangeRate is expressed (the unit currency of the quote)."
    primary_key: false
  - name: ExchangeRate
    type: Number
    required: true
    pii: false
    description: "The numeric exchange rate applied or quoted between the instructed currency and the currency of transfer."
    primary_key: false
  - name: RateType
    type: String
    required: true
    pii: false
    description: "OBExchangeRateType2Code — Actual, Indicative or Agreed."
    primary_key: false
  - name: ContractIdentification
    type: String
    required: false
    pii: false
    description: "Reference to the FX rate agreement, present when RateType is Agreed."
    primary_key: false
  - name: ExpirationDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 datetime after which the quoted rate is no longer valid."
    primary_key: false
used_by:
  - "server/apis/pisp-international.yaml"
  - "server/apis/pisp-international-scheduled.yaml"
