name: OBEventPollingResponse1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/events"
description: "OBIE Event Notification v4.0 poll response — moreAvailable plus the sets map whose keys are each notification's jti and whose values are the SET delivered as a signed-JWT string in OBEventNotification2 format. The notifications list is built from these SETs."
fields:
  - name: moreAvailable
    type: Boolean
    required: true
    pii: false
    description: "True when more unacknowledged notifications are available."
    primary_key: false
  - name: sets
    type: String
    required: true
    pii: false
    description: "Map keyed by event jti; each value is the SET as a signed-JWT (OBEventNotification2). Empty object when none outstanding."
    primary_key: false
used_by:
  - "screens/notifications/api.yaml"
  - "server/apis/events.yaml"
