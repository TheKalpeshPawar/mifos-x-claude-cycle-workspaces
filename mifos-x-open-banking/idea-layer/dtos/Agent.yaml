name: Agent
version: "1.0.0"
pii_fields: [phone_number]
source:
  origin: project
  api_path: "POST /obp/v5.1.0/banks/{bankId}/agents"
description: "Represents a registered banking agent — a third-party individual or business authorised to offer financial services on behalf of a bank, including their commission rate and supported service types."
fields:
  - name: agent_id
    type: String
    required: true
    pii: false
    description: "Unique identifier for the agent"
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "Identifier of the bank that authorised this agent"
    primary_key: false
  - name: phone_number
    type: String
    required: true
    pii: true
    description: "Contact phone number of the agent; PII — must be masked in logs"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code in which the agent operates (e.g. USD, KES)"
    primary_key: false
  - name: commission_rate
    type: Float
    required: true
    pii: false
    description: "Commission percentage charged by the agent per transaction (e.g. 1.5 for 1.5%)"
    primary_key: false
  - name: services
    type:
      list_of: String
    required: true
    pii: false
    description: "List of service codes offered by this agent (e.g. CASH_IN, CASH_OUT, BILL_PAYMENT)"
    primary_key: false
  - name: active
    type: Boolean
    required: true
    pii: false
    description: "Whether the agent registration is currently active"
    primary_key: false
used_by:
  - feature: agent-registration
    api_id: obp_create_agent
enums: []
