name: Account
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts"
description: "Represents a bank account returned by the OBP accounts list endpoint. Contains the account identifier, display label, product type, current balance, and routing information."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique account identifier within the bank"
    primary_key: true
  - name: label
    type: String
    required: true
    pii: false
    description: "Human-readable display label for the account"
    primary_key: false
  - name: account_type
    type: String
    required: true
    pii: false
    description: "Product type of the account (e.g. CURRENT, SAVINGS)"
    primary_key: false
  - name: balance
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "Current balance of the account expressed as a currency and amount pair"
    primary_key: false
  - name: account_routings
    type:
      list_of:
        dto_ref: AccountRouting
    required: true
    pii: false
    description: "List of routing schemes (IBAN, sort-code/account-number) associated with this account"
    primary_key: false
used_by:
  - feature: consumer-home
    api_id: obp_get_accounts
  - feature: send-money
    api_id: obp_get_sender_accounts
  - feature: customer-detail
    api_id: obp_get_customer_accounts
enums: []
