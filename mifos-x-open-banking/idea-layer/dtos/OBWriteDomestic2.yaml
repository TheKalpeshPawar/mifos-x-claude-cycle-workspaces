name: OBWriteDomestic2
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-payments"
description: "OBIE domestic-payment submission request — submits the authorised payment by referencing the consent's ConsentId and re-sending the matching Initiation and Risk blocks."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Identifier of the authorised consent this payment is created from."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomestic2
    required: true
    pii: false
    description: "Initiation block — must equal the consent's Initiation."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "Risk block — must equal the consent's Risk block."
    primary_key: false
used_by:
  - "screens/auth-callback/api.yaml"
