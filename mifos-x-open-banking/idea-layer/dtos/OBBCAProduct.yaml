name: OBBCAProduct
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /open-banking/opendata/v2.4.0/business-current-accounts"
description: "OBIE Open Data v2.4.0 Business Current Account product (data[].Brand[].BCA[]) — UNAUTHENTICATED reference data. Core product details, marketing states, business overdraft/tariff fees, credit interest, eligibility and other fees/charges. Product reference data, not personal PII."
fields:
  - name: Identification
    type: String
    required: true
    pii: false
    description: "Unique product identifier."
    primary_key: true
  - name: MarketingState
    type:
      list_of: String
    required: false
    pii: false
    description: "Marketing-state sequencing (Promotional|Regular)."
    primary_key: false
  - name: CoreProduct
    type: String
    required: false
    pii: false
    description: "Core fixed/variable product details, channels, charges."
    primary_key: false
  - name: Overdraft
    type: String
    required: false
    pii: false
    description: "Business overdraft/tariff fee blocks."
    primary_key: false
  - name: CreditInterest
    type: String
    required: false
    pii: false
    description: "Credit-interest rates."
    primary_key: false
  - name: Eligibility
    type: String
    required: false
    pii: false
    description: "Eligibility restrictions."
    primary_key: false
  - name: OtherFeesCharges
    type:
      list_of: String
    required: false
    pii: false
    description: "Introductory offers, benefits, and other fees/charges."
    primary_key: false
used_by:
  - "screens/products/api.yaml"
  - "server/apis/open-data.yaml"
