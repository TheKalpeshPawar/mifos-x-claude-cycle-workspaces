name: OBWriteInternationalScheduledResponse6
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-scheduled-payments"
description: "OBIE PISP International Scheduled Payment submission response — the created scheduled-payment resource: payment id, referenced consent, status, creation/update datetimes, expected execution/settlement datetimes and echoed initiation. Same schema returned by the GET payment poll."
fields:
  - name: Data.InternationalScheduledPaymentId
    type: String
    required: true
    pii: false
    description: "Unique scheduled-payment identifier."
    primary_key: true
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "The consent this payment was initiated against."
    primary_key: false
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Payment status — initial RCVD or RJCT; RCVD, CANC, PDNG, ACTC, PATC, ACCP, ACFC, ACSP, ACWC, ACSC, ACWP, ACCC, BLCK, RJCT."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the payment resource was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the status was last updated."
    primary_key: false
  - name: Data.ExpectedExecutionDateTime
    type: String
    required: false
    pii: false
    description: "Expected execution date-time."
    primary_key: false
  - name: Data.ExpectedSettlementDateTime
    type: String
    required: false
    pii: false
    description: "Expected settlement date-time."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international-scheduled.yaml"
