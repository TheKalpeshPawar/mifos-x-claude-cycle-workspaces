name: OBReadTransaction6
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
description: "OBIE Account & Transaction API v4.0 transactions response object (OBTransaction6 items) — booked/pending entries with amount, indicator, merchant, running balance and creditor/debtor accounts."
fields:
  - name: Data.Transaction[].AccountId
    type: String
    required: true
    pii: false
    description: "Account the transaction belongs to."
    primary_key: false
  - name: Data.Transaction[].TransactionId
    type: String
    required: false
    pii: false
    description: "Unique transaction identifier (nullable in OBIE)."
    primary_key: true
  - name: Data.Transaction[].TransactionReference
    type: String
    required: false
    pii: false
    description: "Reference for the transaction."
    primary_key: false
  - name: Data.Transaction[].CreditDebitIndicator
    type: String
    required: true
    pii: false
    description: "OBInternalCreditDebitCode: Credit | Debit."
    primary_key: false
  - name: Data.Transaction[].Status
    type: String
    required: true
    pii: false
    description: "ExternalEntryStatus1Code: Booked | Pending."
    primary_key: false
  - name: Data.Transaction[].BookingDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 date-time the entry was booked."
    primary_key: false
  - name: Data.Transaction[].ValueDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 value date-time."
    primary_key: false
  - name: Data.Transaction[].TransactionInformation
    type: String
    required: false
    pii: false
    description: "Free-text description of the transaction."
    primary_key: false
  - name: Data.Transaction[].Amount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Transaction amount + ISO 4217 currency."
    primary_key: false
  - name: Data.Transaction[].BankTransactionCode.Code
    type: String
    required: false
    pii: false
    description: "OBBankTransactionCodeStructure1 — ISO 20022 domain code."
    primary_key: false
  - name: Data.Transaction[].MerchantDetails.MerchantName
    type: String
    required: false
    pii: true
    description: "Merchant name (OBMerchantDetails1)."
    primary_key: false
  - name: Data.Transaction[].Balance.Amount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Running balance after the entry (OBTransactionCashBalance)."
    primary_key: false
  - name: Data.Transaction[].CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Creditor account identification (OBCashAccount6)."
    primary_key: false
  - name: Data.Transaction[].DebtorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Debtor account identification (OBCashAccount6)."
    primary_key: false
  - name: Links.Next
    type: String
    required: false
    pii: false
    description: "Pagination next-page link."
    primary_key: false
used_by:
  - "screens/home/api.yaml"
  - "screens/transactions/api.yaml"
  - "screens/transaction-detail/api.yaml"
  - "screens/beneficiaries/api.yaml"
  - "screens/standing-order-detail/api.yaml"
  - "screens/pfm-dashboard/api.yaml"
  - "screens/business-insights/api.yaml"
