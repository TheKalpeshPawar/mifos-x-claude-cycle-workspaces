name: AtmDisplayItem
version: 1.0.0
description: >
  ViewModel-level display model for an ATM map pin. Synthesised from OBReadATMResponse1
  ATM entries by the ATM ViewModel. Not a wire type — client-side projection only.
  distance is null until the device location permission is granted.
source:
  origin: synthetic
fields:
  - name: identification
    type: String
    description: "ATM Identification field from the Open Data response — used as map-pin key."
    required: true
    example: "HSBC_ATM_001"
  - name: name
    type: String
    description: "Formatted display name — derived from Identification or nearby branch name."
    required: true
    example: "HSBC ATM — Oxford Street"
  - name: postalAddress
    type: String
    description: "Full formatted postal address string for display in list and bottom sheet."
    required: true
    example: "120 Oxford Street, London"
  - name: postCode
    type: { optional: String }
    description: "Post code extracted from Location.PostalAddress.PostCode for regional filter chip."
    example: "W1D 1LT"
  - name: latitude
    type: Double
    description: "Geographic latitude from GeoLocation.GeographicCoordinates.Latitude."
    required: true
    example: 51.5143
  - name: longitude
    type: Double
    description: "Geographic longitude from GeoLocation.GeographicCoordinates.Longitude."
    required: true
    example: -0.1397
  - name: hasWheelchairAccess
    type: Boolean
    description: "True if 'WheelchairAccess' present in Accessibility[]."
    required: true
    example: true
  - name: hasCashDeposit
    type: Boolean
    description: "True if 'CashDeposit' present in ATMServices[]."
    required: true
    example: false
  - name: minimumAmount
    type: { optional: String }
    description: "Minimum dispensable amount string from MinimumPossibleAmount. Null if field absent."
    example: "10.00"
  - name: distance
    type: { optional: Double }
    description: "Calculated distance from device location in kilometres. Null until location permission granted."
    example: 0.42
used_by:
  - feature: atmLocator
    kind: cache
    role: body
capabilities_used:
  - has_api
tier: medium
tags:
  - client-model
  - atm
  - geo
  - synthetic
