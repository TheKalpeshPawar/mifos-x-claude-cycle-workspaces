name: OBReadStatement2
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/statements"
description: "OBIE Account & Transaction API v4.0 statements response object (OBStatement2 items) — statements for an account, with type, period start/end, creation date and optional statement amounts."
fields:
  - name: Data.Statement[].AccountId
    type: String
    required: true
    pii: false
    description: "Account the statement is for."
    primary_key: false
  - name: Data.Statement[].StatementId
    type: String
    required: false
    pii: false
    description: "Unique statement identifier."
    primary_key: true
  - name: Data.Statement[].StatementReference
    type: String
    required: false
    pii: false
    description: "Statement reference."
    primary_key: false
  - name: Data.Statement[].Type
    type: String
    required: true
    pii: false
    description: "OBInternalStatementType1Code (RegularPeriodic | AccountClosure etc.)."
    primary_key: false
  - name: Data.Statement[].StartDateTime
    type: String
    required: true
    pii: false
    description: "Statement period start."
    primary_key: false
  - name: Data.Statement[].EndDateTime
    type: String
    required: true
    pii: false
    description: "Statement period end."
    primary_key: false
  - name: Data.Statement[].CreationDateTime
    type: String
    required: true
    pii: false
    description: "Statement creation date-time."
    primary_key: false
  - name: Data.Statement[].StatementAmount[].Amount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "A statement amount value (e.g. closing balance / interest) + currency."
    primary_key: false
used_by:
  - "server/apis/ais.yaml"
