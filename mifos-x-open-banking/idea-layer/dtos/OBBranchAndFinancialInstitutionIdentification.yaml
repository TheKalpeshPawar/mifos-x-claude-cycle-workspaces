name: OBBranchAndFinancialInstitutionIdentification
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}"
description: "OBIE shared servicing-institution sub-object (OBBranchAndFinancialInstitutionIdentification5) — identifies the institution servicing the account via a scheme name and identification (sort code / BIC)."
fields:
  - name: SchemeName
    type: String
    required: false
    pii: false
    description: "Servicing institution scheme name."
    primary_key: false
  - name: Identification
    type: String
    required: false
    pii: true
    description: "Servicing institution identification (e.g. sort code or BIC)."
    primary_key: false
used_by:
  - "screens/accounts/api.yaml"
  - "screens/account-detail/api.yaml"
