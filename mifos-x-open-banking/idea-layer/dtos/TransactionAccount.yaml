name: TransactionAccount
version: "1.1.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
description: "Represents the owning bank account on a transaction (the 'this_account' side). Carries the account id, bank id and its associated routing entries for display and deep-linking."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Identifier of the account that owns this transaction"
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "Identifier of the bank that hosts this account — required by OBP wire shape for deep-link routing"
    primary_key: false
  - name: account_routings
    type:
      list_of:
        dto_ref: AccountRouting
    required: true
    pii: false
    description: "Routing entries (IBAN, sort-code, etc.) for the owning account"
    primary_key: false
used_by:
  - feature: transaction-detail
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
enums: []
