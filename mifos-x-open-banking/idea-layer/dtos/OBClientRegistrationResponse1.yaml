name: OBClientRegistrationResponse1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /mock/obie/open-banking/v3.2/oauth2/register"
description: "OBIE/RFC 7591 Dynamic Client Registration response (HTTP 201). The HSBC-issued client credentials and the granted client metadata echoed back to the TPP after a successful registration."
fields:
  - name: client_id
    type: String
    required: true
    pii: false
    description: "OAuth 2.0 client identifier issued by HSBC (maxLength 36)."
    primary_key: true
  - name: client_id_issued_at
    type: Number
    required: false
    pii: false
    description: "Time the client_id was issued, seconds since epoch (UTC)."
    primary_key: false
  - name: grant_types
    type:
      list_of: String
    required: true
    pii: false
    description: "Granted grant types (client_credentials | authorization_code | refresh_token)."
    primary_key: false
  - name: response_types
    type:
      list_of: String
    required: false
    pii: false
    description: "Granted response_type values ('code id_token')."
    primary_key: false
  - name: redirect_uris
    type:
      list_of: String
    required: false
    pii: false
    description: "Registered redirect URIs."
    primary_key: false
  - name: token_endpoint_auth_method
    type: String
    required: true
    pii: false
    description: "private_key_jwt | tls_client_auth."
    primary_key: false
  - name: scope
    type: String
    required: false
    pii: false
    description: "Granted scope list."
    primary_key: false
  - name: software_statement
    type: String
    required: false
    pii: false
    description: "Echoed SSA JWT."
    primary_key: false
  - name: application_type
    type: String
    required: false
    pii: false
    description: "web | native."
    primary_key: false
  - name: token_endpoint_auth_signing_alg
    type: String
    required: true
    pii: false
    description: "PS256."
    primary_key: false
used_by:
  - "screens/bank-authorize-handoff/api.yaml"
  - "screens/auth-callback/api.yaml"
  - "server/apis/auth.yaml"
