name: OBWriteInternationalStandingOrderConsentResponse7
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-standing-order-consents"
description: "OBIE PISP International Standing Order consent response — the staged consent: ConsentId, status (AWAU|RJCT|AUTH|COND), status reason, creation/update datetimes and echoed initiation. Same schema returned by the GET consent poll."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Unique consent identifier assigned by the ASPSP."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Consent status — initial AWAU; AWAU|RJCT|AUTH|COND (v4.0) or AwaitingAuthorisation|Rejected|Authorised|Consumed (v3.1, no Revoked)."
    primary_key: false
  - name: Data.StatusReason
    type: String
    required: false
    pii: false
    description: "Reason associated with the consent status."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the consent resource was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the status was last updated."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international-standing-order.yaml"
