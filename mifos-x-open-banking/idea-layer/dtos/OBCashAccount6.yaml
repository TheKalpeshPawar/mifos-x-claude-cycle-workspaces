name: OBCashAccount6
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}"
description: "OBIE shared cash-account identification sub-object — scheme name, identification (account number/IBAN) and display name. Reused for the account's own identification and for creditor/debtor accounts on transactions, beneficiaries, standing orders and scheduled payments."
fields:
  - name: SchemeName
    type: String
    required: true
    pii: false
    description: "OBInternalAccountIdentification4Code (e.g. UK.OBIE.SortCodeAccountNumber, UK.OBIE.IBAN)."
    primary_key: false
  - name: Identification
    type: String
    required: true
    pii: true
    description: "The account number/identifier (sort-code+account-number or IBAN)."
    primary_key: false
  - name: Name
    type: String
    required: false
    pii: true
    description: "Account name as shown to the PSU."
    primary_key: false
  - name: SecondaryIdentification
    type: String
    required: false
    pii: true
    description: "Secondary identifier, e.g. building-society roll number."
    primary_key: false
used_by:
  - "screens/accounts/api.yaml"
  - "screens/account-detail/api.yaml"
  - "screens/transactions/api.yaml"
  - "screens/beneficiaries/api.yaml"
  - "screens/standing-orders/api.yaml"
  - "screens/send-money-confirm/api.yaml"
  - "screens/send-money-amount/api.yaml"
  - "screens/payment-authorize-handoff/api.yaml"
  - "screens/auth-callback/api.yaml"
  - "screens/standing-order-create/api.yaml"
  - "screens/standing-order-edit/api.yaml"
  - "server/apis/pisp-domestic-scheduled.yaml"
  - "server/apis/pisp-international.yaml"
  - "server/apis/pisp-international-scheduled.yaml"
  - "server/apis/pisp-international-standing-order.yaml"
  - "server/apis/vrp.yaml"
