name: OBReadProduct2
version: 1.0.0
description: >
  OBIE AIS v4.0 response envelope for GET /accounts/{AccountId}/product.
  Returns the product (PCA = Personal Current Account or BCA = Business Current Account)
  associated with the account, including fee tiers, credit interest bands, and overdraft terms.
  Requires ReadProducts permission.
source:
  origin: rest
  endpoint: "/accounts/{AccountId}/product"
fields:
  - name: product
    type: { list_of: Json }
    description: >
      OBProduct2 records from Data.Product[]. Typically a single entry per account.
      Key fields: ProductId (optional), ProductName, ProductType
      (PersonalCurrentAccount | BusinessCurrentAccount | CommercialCreditCard | SMELoan | Other),
      AccountId, MarketingStateId (optional).
      Nested PCA/BCA structures: CreditInterest.TierBandSet[] (interest rates by balance band),
      Overdraft.OverdraftTierBandSet[] (overdraft fees and charges), OtherFeesCharges[].
    required: true
    source_field: "Data.Product"
  - name: links
    type: { optional: Json }
    source_field: "Links"
  - name: meta
    type: { optional: Json }
    source_field: "Meta"
used_by:
  - feature: product
    kind: response
    api_id: product
    role: body
capabilities_used:
  - has_api
tier: medium
tags:
  - obie
  - product
  - envelope
