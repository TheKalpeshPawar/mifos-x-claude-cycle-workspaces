name: OBReadProduct2
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/product"
description: "OBIE Account & Transaction API v4.0 product response object (OBProduct2 items) — the single product associated with an account, with product id/name/type and optional other-product descriptors."
fields:
  - name: Data.Product[].AccountId
    type: String
    required: true
    pii: false
    description: "Account the product is associated with."
    primary_key: false
  - name: Data.Product[].ProductId
    type: String
    required: false
    pii: false
    description: "Institution-internal product identifier."
    primary_key: true
  - name: Data.Product[].ProductName
    type: String
    required: false
    pii: false
    description: "Customer-facing marketing product name."
    primary_key: false
  - name: Data.Product[].ProductType
    type: String
    required: true
    pii: false
    description: "OBInternalProductType1Code (e.g. PersonalCurrentAccount, BusinessCurrentAccount)."
    primary_key: false
  - name: Data.Product[].SecondaryProductId
    type: String
    required: false
    pii: false
    description: "Secondary product identifier."
    primary_key: false
  - name: Data.Product[].MarketingStateId
    type: String
    required: false
    pii: false
    description: "Product Marketing State identifier."
    primary_key: false
  - name: Data.Product[].OtherProductType.Name
    type: String
    required: false
    pii: false
    description: "Long name for an Other product type."
    primary_key: false
  - name: Data.Product[].OtherProductType.Description
    type: String
    required: false
    pii: false
    description: "Description of an Other product type."
    primary_key: false
used_by:
  - "server/apis/ais.yaml"
