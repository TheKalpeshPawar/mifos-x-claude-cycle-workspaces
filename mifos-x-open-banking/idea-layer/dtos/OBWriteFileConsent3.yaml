name: OBWriteFileConsent3
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/file-payment-consents"
description: "OBIE PISP File Payment consent request — stages a bulk/batch payment by declaring the ISO 20022 file metadata (FileType, FileHash, optional ControlSum) before the pain.001 file is uploaded. Also the request shape for the HSBC multi-bill category, which reuses the file-payment paths."
fields:
  - name: Data.Initiation.FileType
    type: String
    required: true
    pii: false
    description: "Payment file type identifier, e.g. UK.OBIE.pain.001.001.08 (UK v4.0) or pain.001.001.03 (CE HSBCnet v3.1)."
    primary_key: false
  - name: Data.Initiation.FileHash
    type: String
    required: true
    pii: false
    description: "Base64 SHA256 hash of the file to be uploaded (Max44Text); must match the uploaded file's contents."
    primary_key: false
  - name: Data.Initiation.ControlSum
    type: String
    required: false
    pii: false
    description: "Decimal string — total of all individual amounts contained in the file group."
    primary_key: false
used_by:
  - "server/apis/pisp-file.yaml"
  - "server/apis/pisp-multibill.yaml"
