name: TransactionCounterparty
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
description: "Represents the counterparty (payee or payer) on a transaction — the 'other_account' side. Contains identifying information, an aliased holder name, routing details, and an optional profile image."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Counterparty account identifier as returned by OBP"
    primary_key: true
  - name: holder_name
    type: String
    required: true
    pii: true
    description: "Display name of the counterparty account holder (PII — may be an alias)"
    primary_key: false
  - name: is_alias
    type: Boolean
    required: true
    pii: false
    description: "True when holder_name is an alias rather than the real name"
    primary_key: false
  - name: account_routings
    type:
      list_of:
        dto_ref: AccountRouting
    required: true
    pii: false
    description: "Routing entries for the counterparty account (IBAN, sort-code, etc.)"
    primary_key: false
  - name: image_url
    type:
      optional: Url
    required: false
    pii: false
    description: "Optional URL of the counterparty's profile or institution logo image"
    primary_key: false
used_by:
  - feature: transaction-detail
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
enums: []
