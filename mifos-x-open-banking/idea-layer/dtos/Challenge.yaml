name: Challenge
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SEPA/transaction-requests"
description: "OBP Strong Customer Authentication (SCA) challenge object returned when a transaction request requires additional authorisation."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier of the SCA challenge"
    primary_key: true
  - name: challenge_type
    type: String
    required: true
    pii: false
    description: "Type of SCA challenge (e.g. OBP_TRANSACTION_REQUEST_CHALLENGE)"
    primary_key: false
  - name: transaction_id
    type: "String?"
    required: false
    pii: false
    description: "Associated transaction request ID, if already created"
    primary_key: false
  - name: link
    type: "String?"
    required: false
    pii: false
    description: "URL for redirect-based SCA challenges (PSD2 redirect flow)"
    primary_key: false
used_by:
  - feature: send-money
    api_id: obp_create_sepa_transfer
  - feature: send-money-confirm
    api_id: obp_confirm_sepa_transfer
enums: []
