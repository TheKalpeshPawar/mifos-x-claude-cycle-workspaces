name: MandateDetail
version: "1.0.0"
pii_fields: [counterparty_name]
source:
  origin: project
  api_path: "GET /obp/v7.0.0/banks/{bankId}/accounts/{accountId}/standing-orders/{standingOrderId}"
description: "Full detail view of a direct debit mandate / standing order as returned by the GET endpoint. Distinct from StandingOrder (create payload) — this shape is the read-side response with display-oriented fields."
fields:
  - name: standing_order_id
    type: String
    required: true
    pii: false
    description: "Unique identifier of this mandate"
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "OBP bank identifier the mandate belongs to"
    primary_key: false
  - name: account_id
    type: String
    required: true
    pii: false
    description: "Account identifier the mandate is drawn from"
    primary_key: false
  - name: counterparty_name
    type: String
    required: true
    pii: true
    description: "Display name of the payee / merchant; PII"
    primary_key: false
  - name: amount_value
    type: String
    required: true
    pii: false
    description: "Mandate amount as a decimal string (e.g. '15.99')"
    primary_key: false
  - name: amount_currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code (e.g. 'GBP', 'KES')"
    primary_key: false
  - name: frequency
    type: String
    required: true
    pii: false
    description: "Human-readable recurrence label (e.g. 'MONTHLY')"
    primary_key: false
  - name: start_date
    type: String
    required: true
    pii: false
    description: "ISO-8601 date on which the mandate first activated"
    primary_key: false
  - name: next_payment_date
    type: String
    required: false
    pii: false
    description: "ISO-8601 date of the next scheduled payment; null when mandate is cancelled"
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    description: "Current mandate status: ACTIVE, PAUSED, or CANCELLED"
    primary_key: false
  - name: reference
    type: String
    required: false
    pii: false
    description: "Mandate reference code used for reconciliation"
    primary_key: false
  - name: recent_payments
    type: "List<String>"
    required: false
    pii: false
    description: "Array of recent payment history records (serialised; see PaymentHistoryItem in ViewModel)"
    primary_key: false
used_by:
  - api_id: obp_get_mandate_detail
    feature: direct-debit-detail
    role: response
enums:
  - field: status
    values: [ACTIVE, PAUSED, CANCELLED]
  - field: frequency
    values: [DAILY, WEEKLY, MONTHLY, YEARLY]
