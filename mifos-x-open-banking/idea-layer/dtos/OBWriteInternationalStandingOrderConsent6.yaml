name: OBWriteInternationalStandingOrderConsent6
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-standing-order-consents"
description: "OBIE PISP International Standing Order consent request — stages a recurring cross-border instruction defined by Frequency, FirstPaymentDateTime and optional NumberOfPayments (flat under Initiation in v3.1; wrapped in OBMandateRelatedInformation1 in v4.0)."
fields:
  - name: Data.Permission
    type: String
    required: true
    pii: false
    description: "Restricted to Create."
    primary_key: false
  - name: Data.Initiation.CurrencyOfTransfer
    type: String
    required: true
    pii: false
    description: "ISO 4217 transfer currency, different from the debtor-account currency."
    primary_key: false
  - name: Data.Initiation.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Amount and currency of each recurring payment."
    primary_key: false
  - name: Data.Initiation.Frequency
    type: String
    required: true
    pii: false
    description: "Regularity pattern, e.g. IntrvlWkDay:IntervalInWeeks:DayInWeek, EvryDay, EvryWorkgDay, IntrvlDay, WkInMnthDay, IntrvlMnthDay, QtrDay."
    primary_key: false
  - name: Data.Initiation.Reference
    type: String
    required: false
    pii: false
    description: "Reference for the standing order."
    primary_key: false
  - name: Data.Initiation.NumberOfPayments
    type: String
    required: false
    pii: false
    description: "Count of payments in the sequence."
    primary_key: false
  - name: Data.Initiation.FirstPaymentDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 date of the first payment."
    primary_key: false
  - name: Data.Initiation.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor account — scheme, identification and name."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBIE Risk block (empty object in the representative body)."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international-standing-order.yaml"
