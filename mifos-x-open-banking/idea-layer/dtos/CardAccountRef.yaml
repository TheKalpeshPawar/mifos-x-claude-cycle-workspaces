name: CardAccountRef
version: "1.0.0"
pii_fields: []
source:
  origin: project
  api_path: "GET /obp/v7.0.0/cards"
description: "Embedded account summary returned inside each Card from GET /obp/v7.0.0/cards. Provides the accountId (account.id) needed to fetch the card's transactions. The full views_available[] permission matrix from the OBP payload is intentionally omitted — the client only needs id, label, and bank_id."
fields:
  - name: id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: label
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: bank_id
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
used_by:
  - feature: cards
    api_id: obp_get_cards
