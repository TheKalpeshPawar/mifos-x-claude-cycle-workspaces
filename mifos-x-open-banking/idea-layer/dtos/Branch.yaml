name: Branch
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/branches"
description: "Bank branch record returned by the OBP branches endpoint. Provides the branch name, address, geo-coordinates, and optional operating hours for lobby and drive-up lanes. Used alongside AtmLocation on the ATM locator screen so users can distinguish between ATMs and full-service branches on the map."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier for this branch within the bank"
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "Identifier of the bank that operates this branch"
    primary_key: false
  - name: name
    type: String
    required: true
    pii: false
    description: "Display name of the branch (e.g. Oxford Street Branch)"
    primary_key: false
  - name: address
    type:
      dto_ref: PostalAddress
    required: true
    pii: false
    description: "Structured postal address of the branch"
    primary_key: false
  - name: location
    type:
      dto_ref: GeoLocation
    required: true
    pii: false
    description: "GPS coordinates used to place the branch pin on the map"
    primary_key: false
  - name: lobby_hours
    type:
      optional: String
    required: false
    pii: false
    description: "Human-readable lobby opening hours string (e.g. Mon-Fri 09:00-17:00)"
    primary_key: false
  - name: drive_up_hours
    type:
      optional: String
    required: false
    pii: false
    description: "Human-readable drive-up lane hours — absent when no drive-up service exists"
    primary_key: false
  - name: branch_type
    type:
      optional: String
    required: false
    pii: false
    description: "Classification of branch type (e.g. FULL_SERVICE, KIOSK, AGENCY) — optional"
    primary_key: false
used_by:
  - feature: atm-locator
    api_id: "GET /obp/v5.1.0/banks/{bankId}/branches"
enums: []
