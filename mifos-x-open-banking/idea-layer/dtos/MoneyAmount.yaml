name: MoneyAmount
version: "1.0.0"
source:
  origin: shared
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts"
description: "Shared value object representing a monetary amount. Used wherever the OBP API returns a currency/amount pair — account balances, transaction values, and new-balance snapshots."
fields:
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code (e.g. EUR, GBP, USD)"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Decimal string representation of the monetary value (e.g. \"1234.56\")"
    primary_key: false
used_by:
  - feature: accounts
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts"
  - feature: transactions
    api_id: "GET /obp/v5.1.0/my/banks/{bankId}/accounts/{accountId}/transactions"
  - feature: transaction-detail
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
  - feature: send-money
    api_id: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SEPA/transaction-requests"
  - feature: send-money-confirm
    api_id: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SEPA/transaction-requests"
enums: []
