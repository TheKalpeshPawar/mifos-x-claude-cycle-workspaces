name: MoneyAmount
version: "1.0.0"
source:
  origin: shared
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts"
description: "Shared value object representing a monetary amount. Used wherever the OBP API returns a currency/amount pair — account balances, transaction values, and new-balance snapshots."
fields:
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code (e.g. EUR, GBP, USD)"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Decimal string representation of the monetary value (e.g. \"1234.56\")"
    primary_key: false
used_by:
  - feature: send-money
    api_id: obp_get_sender_accounts
  - feature: customer-detail
    api_id: obp_get_customer
  - feature: fo-dashboard
    api_id: obp_get_fo_applications
  - feature: standing-order-edit
    api_id: obp_update_standing_order
enums: []
