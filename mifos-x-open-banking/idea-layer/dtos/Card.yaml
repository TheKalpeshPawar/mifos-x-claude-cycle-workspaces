name: Card
version: "2.0.0"
pii_fields: [bank_card_number, name_on_card]
source:
  origin: project
  api_path: "GET /obp/v7.0.0/cards"
description: "A physical or virtual bank card for the current user, as returned by the OBP 'Get cards for the current user' endpoint (GET /obp/v7.0.0/cards). Verified live against apisandbox.openbankproject.com 2026-05-31. Note: the consumer endpoint does NOT expose card_id or customer_id — those are only available via the management endpoints (GET /obp/v3.1.0/management/banks/{bankId}/cards), which require the CanGetCardsForBank / CanUpdateCardsForBank entitlements. Card network is carried in the networks[] array (not a singular card_network field)."
fields:
  - name: bank_id
    type: String
    required: true
    pii: false
    primary_key: false
  - name: bank_card_number
    type: String
    required: true
    pii: true
    primary_key: false
  - name: name_on_card
    type: String
    required: true
    pii: true
    primary_key: false
  - name: card_type
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: networks
    type: { list_of: String }
    required: true
    pii: false
    primary_key: false
  - name: allows
    type: { list_of: String }
    required: true
    pii: false
    primary_key: false
  - name: enabled
    type: Boolean
    required: true
    pii: false
    primary_key: false
  - name: cancelled
    type: Boolean
    required: true
    pii: false
    primary_key: false
  - name: on_hot_list
    type: Boolean
    required: false
    pii: false
    primary_key: false
  - name: technology
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: issue_number
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: serial_number
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: valid_from_date
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: expires_date
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: account
    type: { ref: CardAccountRef }
    required: false
    pii: false
    primary_key: false
    description: "Embedded account summary (id, label, bank_id). card.account.id is the accountId used to fetch the card's transactions via GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions."
used_by:
  - feature: cards
    api_id: obp_get_cards
