name: Card
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/cards"
description: "Represents a physical or virtual bank card issued to a customer, including card type, network, and permitted operations."
fields:
  - name: id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    primary_key: false
  - name: bank_card_number
    type: String
    required: true
    pii: true
    primary_key: false
  - name: name_on_card
    type: String
    required: true
    pii: true
    primary_key: false
  - name: card_type
    type: String
    required: true
    pii: false
    primary_key: false
  - name: card_description
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: card_network
    type: String
    required: true
    pii: false
    primary_key: false
  - name: allows
    type: { list_of: String }
    required: true
    pii: false
    primary_key: false
  - name: enabled
    type: Boolean
    required: true
    pii: false
    primary_key: false
used_by:
  - feature: cards
    api_id: list-cards
  - feature: card-detail
    api_id: get-card-by-id
