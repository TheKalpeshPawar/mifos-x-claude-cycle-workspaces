name: AccountRouting
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/accounts"
description: "A single routing entry for a bank account. Holds the routing scheme name (e.g. IBAN, SortCodeAccountNumber) and the corresponding address value. Nested inside Account and TransactionAccount."
fields:
  - name: scheme
    type: String
    required: true
    pii: false
    description: "Name of the routing scheme (e.g. IBAN, SortCodeAccountNumber, AccountNumber)"
    primary_key: false
  - name: address
    type: String
    required: true
    pii: false
    description: "The routing address value for the given scheme (e.g. the IBAN string)"
    primary_key: false
used_by:
  - feature: accounts
    api_id: obp_get_accounts
  - feature: account-detail
    api_id: obp_get_account_detail
  - feature: home
    api_id: obp_get_home_accounts
  - feature: transaction-detail
    api_id: obp_get_transaction_detail
  - feature: customer-detail
    api_id: obp_get_customer_accounts
enums: []
