name: Counterparty
version: "1.0.0"
pii_fields: [name, other_account_routing_address]
source:
  origin: project
  api_path: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/counterparties"
description: "Represents a third-party payee or beneficiary linked to an account, including routing details for inter-bank transfers and beneficiary eligibility."
fields:
  - name: counterparty_id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: name
    type: String
    required: true
    pii: true
    primary_key: false
  - name: description
    type: { optional: String }
    required: false
    pii: false
    primary_key: false
  - name: other_bank_routing_scheme
    type: String
    required: true
    pii: false
    primary_key: false
  - name: other_bank_routing_address
    type: String
    required: true
    pii: false
    primary_key: false
  - name: other_account_routing_scheme
    type: String
    required: true
    pii: false
    primary_key: false
  - name: other_account_routing_address
    type: String
    required: true
    pii: true
    primary_key: false
  - name: is_beneficiary
    type: Boolean
    required: true
    pii: false
    primary_key: false
used_by:
  - feature: beneficiaries
    api_id: obp_get_counterparties
  - feature: send-money
    api_id: obp_get_beneficiary_counterparties
  - feature: standing-orders
    api_id: obp_create_standing_order
