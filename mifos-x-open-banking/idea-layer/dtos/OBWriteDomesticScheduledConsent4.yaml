name: OBWriteDomesticScheduledConsent4
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-scheduled-payment-consents"
description: "OBIE domestic-scheduled-payment-consent request — stages a future-dated domestic payment for PSU authorisation. Carries a Permission, the scheduled Initiation (with RequestedExecutionDateTime), optional Authorisation and SCASupportData, and the Risk block."
fields:
  - name: Data.Permission
    type: String
    required: true
    pii: false
    description: "Consent permission, e.g. Create."
    primary_key: false
  - name: Data.ReadRefundAccount
    type: String
    required: false
    pii: false
    description: "OBInternalReadRefundAccount1Code (Yes/No)."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomesticScheduled2
    required: true
    pii: false
    description: "Scheduled payment Initiation block including RequestedExecutionDateTime."
    primary_key: false
  - name: Data.Authorisation.AuthorisationType
    type: String
    required: false
    pii: false
    description: "Optional authorisation type, e.g. Single."
    primary_key: false
  - name: Data.Authorisation.CompletionDateTime
    type: String
    required: false
    pii: false
    description: "Optional ISODateTime authorisation completion deadline."
    primary_key: false
  - name: Data.SCASupportData.RequestedSCAExemptionType
    type: String
    required: false
    pii: false
    description: "Optional SCA exemption hint, e.g. BillPayment."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "Risk block with PaymentContextCode and optional DeliveryAddress."
    primary_key: false
used_by:
  - "server/apis/pisp-domestic-scheduled.yaml"
