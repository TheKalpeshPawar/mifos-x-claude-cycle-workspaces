name: OBWriteDomesticScheduledConsentResponse5
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-scheduled-payment-consents"
description: "OBIE domestic-scheduled-payment-consent response — returns the ASPSP-assigned ConsentId and status with expected execution/settlement timings and the echoed scheduled Initiation, Authorisation and Risk. Also returned by GET domestic-scheduled-payment-consents/{ConsentId}."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "ASPSP-assigned consent identifier."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Consent status: AWAU, AUTH, RJCT, COND."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the consent was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime of the last status update."
    primary_key: false
  - name: Data.StatusReason
    type:
      list_of: String
    required: false
    pii: false
    description: "Optional StatusReason[]."
    primary_key: false
  - name: Data.ExpectedExecutionDateTime
    type: String
    required: false
    pii: false
    description: "Expected execution date/time."
    primary_key: false
  - name: Data.ExpectedSettlementDateTime
    type: String
    required: false
    pii: false
    description: "Expected settlement date/time."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomesticScheduled2
    required: true
    pii: false
    description: "Echoed Initiation block including RequestedExecutionDateTime."
    primary_key: false
  - name: Data.Authorisation.AuthorisationType
    type: String
    required: false
    pii: false
    description: "Echoed authorisation type."
    primary_key: false
  - name: Data.Authorisation.CompletionDateTime
    type: String
    required: false
    pii: false
    description: "Echoed authorisation completion deadline."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "Echoed Risk block."
    primary_key: false
used_by:
  - "server/apis/pisp-domestic-scheduled.yaml"
