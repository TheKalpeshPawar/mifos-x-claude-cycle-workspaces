name: OidcToken
version: "1.0.0"
pii_fields: [access_token, id_token, refresh_token]
source:
  origin: project
  api_path: "POST /obp-oidc/token"
description: "Represents the token response from the OBP OIDC token endpoint, containing the access token, optional ID and refresh tokens, token type, and expiry duration in seconds."
fields:
  - name: access_token
    type: String
    required: true
    pii: true
    description: "Bearer access token granting API access; PII — never log or persist in plaintext"
    primary_key: false
  - name: id_token
    type:
      optional: String
    required: false
    pii: true
    description: "JWT ID token carrying identity claims; PII — present only when openid scope was requested"
    primary_key: false
  - name: refresh_token
    type:
      optional: String
    required: false
    pii: true
    description: "Long-lived token used to obtain new access tokens; PII — store in secure keystore only"
    primary_key: false
  - name: token_type
    type: String
    required: true
    pii: false
    description: "Token type string, typically 'Bearer'"
    primary_key: false
  - name: expires_in
    type: Int
    required: true
    pii: false
    description: "Number of seconds until the access token expires"
    primary_key: false
used_by:
  - feature: login
    api_id: obp_oidc_token
enums: []
