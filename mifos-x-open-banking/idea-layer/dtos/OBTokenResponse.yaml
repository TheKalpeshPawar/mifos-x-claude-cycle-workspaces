name: OBTokenResponse
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v1.1/oauth2/token"
description: "OAuth2 / OIDC token-endpoint response from the OBIE authorization server — returned for both the client_credentials grant (bank-authorize-handoff) and the authorization_code grant (auth-callback after the HSBC redirect). Carries the PSU/PISP-bound access token plus optional refresh + id tokens."
fields:
  - name: access_token
    type: String
    required: true
    pii: true
    description: "Bearer access token used as the Authorization header on subsequent AIS/PISP calls. Sensitive credential — never logged or rendered."
    primary_key: false
  - name: token_type
    type: String
    required: true
    pii: false
    description: "Token type, normally 'Bearer'."
    primary_key: false
  - name: expires_in
    type: Int
    required: true
    pii: false
    description: "Access-token lifetime in seconds from issuance."
    primary_key: false
  - name: refresh_token
    type: String
    required: false
    pii: true
    description: "Refresh token used to obtain a new access token without re-authorisation (authorization_code grant only). Sensitive credential."
    primary_key: false
  - name: scope
    type: String
    required: false
    pii: false
    description: "Space-delimited list of granted scopes (e.g. accounts, payments, openid)."
    primary_key: false
  - name: id_token
    type: String
    required: false
    pii: true
    description: "OIDC ID token (JWT) carrying the openbanking_intent_id and PSU identity claims. Sensitive — contains identity assertions."
    primary_key: false
used_by:
  - "screens/auth-callback/data-flow.yaml"
  - "screens/bank-authorize-handoff/data-flow.yaml"
