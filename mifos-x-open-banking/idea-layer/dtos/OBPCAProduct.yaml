name: OBPCAProduct
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /open-banking/opendata/v2.4.0/personal-current-accounts"
description: "OBIE Open Data v2.4.0 Personal Current Account product (data[].Brand[].PCA[]) — UNAUTHENTICATED reference data. Core product details, marketing states, overdraft/credit-interest pricing, eligibility and other fees/charges. Product reference data, not personal PII."
fields:
  - name: Identification
    type: String
    required: true
    pii: false
    description: "Unique product identifier."
    primary_key: true
  - name: ProductName
    type: String
    required: false
    pii: false
    description: "Marketing/product name (Name)."
    primary_key: false
  - name: Segment
    type: String
    required: false
    pii: false
    description: "e.g. basic | regular | premium."
    primary_key: false
  - name: OnSaleIndicator
    type: String
    required: false
    pii: false
    description: "1 = on-sale; 0 = back-book."
    primary_key: false
  - name: MarketingState
    type:
      list_of: String
    required: false
    pii: false
    description: "Identification, PredecessorID, MarketingState (Promotional|Regular), FirstMarketedDate, LastMarketedDate, StateTenureLength/Period."
    primary_key: false
  - name: CoreProduct
    type: String
    required: false
    pii: false
    description: "Product URL, T&Cs URL, sales/servicing access channels, MonthlyMaximumCharge."
    primary_key: false
  - name: Overdraft
    type: String
    required: false
    pii: false
    description: "Tiered/whole-amount overdraft rates, buffer, RepresentativeAPR (added in v2.4.0)."
    primary_key: false
  - name: CreditInterest
    type: String
    required: false
    pii: false
    description: "Credit-interest tiers/rates."
    primary_key: false
  - name: Eligibility
    type: String
    required: false
    pii: false
    description: "Eligibility criteria."
    primary_key: false
  - name: OtherFeesCharges
    type:
      list_of: String
    required: false
    pii: false
    description: "Other fees and charges; plus features/benefits packages."
    primary_key: false
used_by:
  - "screens/products/api.yaml"
  - "server/apis/open-data.yaml"
