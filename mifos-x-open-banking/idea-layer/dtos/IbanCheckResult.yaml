name: IbanCheckResult
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v4.0.0/account/check/scheme/iban"
description: "Result of an IBAN validation check against the OBP account-scheme validator. Indicates whether the IBAN is structurally valid and, when a match is found, returns the bank routing scheme and address so the UI can display the destination bank name before confirming a transfer."
fields:
  - name: valid
    type: Boolean
    required: true
    pii: false
    description: "True when the supplied IBAN passes structural and scheme validation"
    primary_key: false
  - name: bank_routing_scheme
    type:
      optional: String
    required: false
    pii: false
    description: "Routing scheme identifier for the destination bank (e.g. BIC), present only when valid is true"
    primary_key: false
  - name: bank_routing_address
    type:
      optional: String
    required: false
    pii: false
    description: "Routing address value for the destination bank, present only when valid is true"
    primary_key: false
used_by:
  - feature: send-money
    api_id: "POST /obp/v4.0.0/account/check/scheme/iban"
enums: []
