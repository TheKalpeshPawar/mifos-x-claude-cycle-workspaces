name: StandingOrderStatusResponse
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}/pause|resume — DELETE /obp/v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}"
description: "Shared response envelope returned by the standing order lifecycle operations: pause, resume, and cancel (delete). Each action returns the order ID, the new status, and a timestamp field matching the action (paused_at / resumed_at / cancelled_at)."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Standing order identifier"
    primary_key: true
  - name: status
    type: String
    required: true
    pii: false
    description: "New lifecycle status after the operation: PAUSED, ACTIVE, or CANCELLED"
    primary_key: false
  - name: paused_at
    type: "String?"
    required: false
    pii: false
    description: "ISO-8601 Instant at which the order was paused; present only on pause response"
    primary_key: false
  - name: resumed_at
    type: "String?"
    required: false
    pii: false
    description: "ISO-8601 Instant at which the order was resumed; present only on resume response"
    primary_key: false
  - name: next_payment_date
    type: "String?"
    required: false
    pii: false
    description: "ISO-8601 date of next payment after resume; present only on resume response"
    primary_key: false
  - name: cancelled_at
    type: "String?"
    required: false
    pii: false
    description: "ISO-8601 Instant at which the order was cancelled; present only on cancel response"
    primary_key: false
used_by:
  - feature: standing-order-detail
    api_id: pause_standing_order
  - feature: standing-order-detail
    api_id: resume_standing_order
  - feature: standing-order-detail
    api_id: delete_standing_order
enums:
  - field: status
    values: [PAUSED, ACTIVE, CANCELLED]
pii_fields: []
