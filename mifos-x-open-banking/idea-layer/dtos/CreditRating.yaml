name: CreditRating
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/customers/{customerId}"
description: "Credit rating assigned to a customer, including the rating value and the agency or system that produced it."
fields:
  - name: rating
    type: String
    required: true
    pii: false
    description: "Credit rating value (e.g. 'A', 'BBB+', '720')"
    primary_key: false
  - name: source
    type: String
    required: true
    pii: false
    description: "Name of the rating agency or internal scoring system that issued the rating"
    primary_key: false
used_by:
  - feature: customer-detail
    api_id: obp_get_customer
enums: []
