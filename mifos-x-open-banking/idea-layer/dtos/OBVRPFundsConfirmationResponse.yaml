name: OBVRPFundsConfirmationResponse
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-vrp-consents/{ConsentId}/funds-confirmation"
description: "OBIE PISP Domestic VRP funds-confirmation response — the result of confirming funds on the debtor account associated with an authorised VRP consent: confirmation id, consent reference, creation datetime, the funds-available result and the echoed instructed amount."
fields:
  - name: Data.FundsConfirmationId
    type: String
    required: true
    pii: false
    description: "Unique funds-confirmation identifier."
    primary_key: true
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Consent the confirmation relates to."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 confirmation creation timestamp."
    primary_key: false
  - name: Data.FundsAvailableResult
    type:
      dto_ref: OBFundsAvailableResult1
    required: true
    pii: false
    description: "Funds-availability outcome — Available | NotAvailable plus the check datetime."
    primary_key: false
  - name: Data.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Echo of the requested amount and currency."
    primary_key: false
used_by:
  - "server/apis/vrp.yaml"
