name: OBWriteInternationalStandingOrder4
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-standing-orders"
description: "OBIE PISP International Standing Order submission request — references the authorised ConsentId; the Initiation and Risk sections must mirror the consent or the ASPSP returns 400."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "References the authorised consent."
    primary_key: false
  - name: Data.Initiation.CurrencyOfTransfer
    type: String
    required: true
    pii: false
    description: "ISO 4217 transfer currency; must mirror the consent."
    primary_key: false
  - name: Data.Initiation.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Amount and currency of each recurring payment; must mirror the consent."
    primary_key: false
  - name: Data.Initiation.Frequency
    type: String
    required: true
    pii: false
    description: "Recurrence pattern; must mirror the consent."
    primary_key: false
  - name: Data.Initiation.NumberOfPayments
    type: String
    required: false
    pii: false
    description: "Count of payments; must mirror the consent."
    primary_key: false
  - name: Data.Initiation.FirstPaymentDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 first-payment date; must mirror the consent."
    primary_key: false
  - name: Data.Initiation.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor account; must mirror the consent."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBIE Risk block; must mirror the consent (empty object in the representative body)."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international-standing-order.yaml"
