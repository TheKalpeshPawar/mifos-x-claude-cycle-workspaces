name: OBWriteDomesticStandingOrderConsent5
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-standing-order-consents"
description: "OBIE domestic-standing-order-consent request — captures the PSU's recurring GBP-rail standing-order instruction (frequency, first-payment date/amount, creditor) prior to authorisation. Carries a fixed Create Permission, the standing-order Initiation, and the Risk block."
fields:
  - name: Data.Permission
    type: String
    required: true
    pii: false
    description: "Fixed value Create."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomesticStandingOrder3
    required: true
    pii: false
    description: "Standing-order Initiation block (frequency, first-payment date/amount, creditor)."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBRisk block (may be an empty object)."
    primary_key: false
used_by:
  - "screens/standing-order-create/api.yaml"
  - "screens/standing-order-edit/api.yaml"
