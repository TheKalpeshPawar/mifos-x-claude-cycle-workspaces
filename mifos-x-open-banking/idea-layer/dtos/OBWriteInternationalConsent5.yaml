name: OBWriteInternationalConsent5
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-payment-consents"
description: "OBIE PISP International Payment consent request — stages a single cross-border / cross-currency payment instruction (currency of transfer, instructed amount, creditor) before PSU authorisation."
fields:
  - name: Data.Initiation.InstructionIdentification
    type: String
    required: true
    pii: false
    description: "TPP-assigned point-to-point instruction identifier."
    primary_key: false
  - name: Data.Initiation.EndToEndIdentification
    type: String
    required: true
    pii: false
    description: "End-to-end identifier carried unchanged through the payment chain."
    primary_key: false
  - name: Data.Initiation.CurrencyOfTransfer
    type: String
    required: true
    pii: false
    description: "ISO 4217 cross-border currency of transfer, e.g. USD."
    primary_key: false
  - name: Data.Initiation.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Amount and currency to be paid, regardless of the debtor-account currency."
    primary_key: false
  - name: Data.Initiation.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Cross-border creditor account — scheme, identification and name."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBIE Risk block carrying the payment context code."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international.yaml"
