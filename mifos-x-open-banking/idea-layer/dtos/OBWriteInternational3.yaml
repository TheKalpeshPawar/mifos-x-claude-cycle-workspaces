name: OBWriteInternational3
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-payments"
description: "OBIE PISP International Payment submission request — references the authorised ConsentId; the Initiation block must match the consent's or the ASPSP rejects it."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Must equal the authorised consent ConsentId."
    primary_key: false
  - name: Data.Initiation.InstructionIdentification
    type: String
    required: true
    pii: false
    description: "Point-to-point instruction identifier; must match the consent."
    primary_key: false
  - name: Data.Initiation.EndToEndIdentification
    type: String
    required: true
    pii: false
    description: "End-to-end identifier; must match the consent."
    primary_key: false
  - name: Data.Initiation.CurrencyOfTransfer
    type: String
    required: true
    pii: false
    description: "ISO 4217 cross-border currency; must match the consent."
    primary_key: false
  - name: Data.Initiation.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Instructed amount and currency; must match the consent."
    primary_key: false
  - name: Data.Initiation.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor account; must match the consent."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBIE Risk block; must match the consent."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international.yaml"
