name: LobbyHours
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/branches"
description: "Lobby opening hours for a bank branch, keyed by day of week. Each field is optional — absent means the branch lobby is closed that day."
fields:
