    type: { optional: String }
    required: false
    pii: false
    description: "Lobby hours on Monday (e.g. '09:00-17:00'); absent if closed"
    primary_key: false
  - name: tuesday
    type: { optional: String }
    required: false
    pii: false
    description: "Lobby hours on Tuesday; absent if closed"
    primary_key: false
  - name: wednesday
    type: { optional: String }
    required: false
    pii: false
    description: "Lobby hours on Wednesday; absent if closed"
    primary_key: false
  - name: thursday
    type: { optional: String }
    required: false
    pii: false
    description: "Lobby hours on Thursday; absent if closed"
    primary_key: false
  - name: friday
    type: { optional: String }
    required: false
    pii: false
    description: "Lobby hours on Friday; absent if closed"
    primary_key: false
  - name: saturday
    type: { optional: String }
    required: false
    pii: false
    description: "Lobby hours on Saturday; absent if closed"
    primary_key: false
  - name: sunday
    type: { optional: String }
    required: false
    pii: false
    description: "Lobby hours on Sunday; absent if closed"
    primary_key: false
used_by:
  - feature: atm-locator
    api_id: obp_get_branches
