name: OBReadConsentResponse1
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
description: "OBIE Account & Transaction API v4.0 account-access-consent response object — the registered consent resource with its ConsentId, status, timestamps and echoed permissions."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Unique consent id, Max128Text."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "OBInternalConsentStatus1Code: AWAU | AUTH | RJCT | CANC | EXPD. Initial AWAU."
    primary_key: false
  - name: Data.StatusReason
    type:
      list_of: String
    required: false
    pii: false
    description: "Optional status-reason entries (StatusReasonCode, StatusReasonDescription)."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the consent resource was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime of the last status update."
    primary_key: false
  - name: Data.Permissions
    type:
      list_of: String
    required: true
    pii: false
    description: "Echo of the consented permission clusters."
    primary_key: false
  - name: Data.ExpirationDateTime
    type: String
    required: false
    pii: false
    description: "Echo of requested expiry; open-ended if absent."
    primary_key: false
used_by:
  - "screens/consent-request/api.yaml"
  - "screens/consent-manager/api.yaml"
  - "screens/consent-expired/api.yaml"
  - "screens/auth-callback/api.yaml"
