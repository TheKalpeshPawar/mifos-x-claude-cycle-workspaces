name: OBWriteDomesticResponse5
version: 1.0.0
description: >
  OBIE PISP v4.0 RESPONSE for POST /domestic-payments (201) and
  GET /domestic-payments/{DomesticPaymentId}. Carries the payment resource and its settlement
  Status. Status is NOT a success/failure boolean — a successful submit returns
  AcceptedSettlementInProcess, meaning accepted but not yet settled. Consumers must map it
  onto the three-way disposition in design-tokens.yaml#semantic.payment_disposition and must
  never render in-progress as sent.
source:
  origin: rest
  endpoint: "/domestic-payments/{DomesticPaymentId}"
  method: GET
  spec_ref: "specs/hsbc-sandbox/openapi/payment-initiation-4.0-personal.yaml"
fields:
  - name: domestic_payment_id
    type: String
    required: true
    source_field: "Data.DomesticPaymentId"
  - name: consent_id
    type: String
    required: true
    source_field: "Data.ConsentId"
  - name: status
    type: String
    required: true
    source_field: "Data.Status"
    description: >
      in_progress: AcceptedSettlementInProcess | AcceptedWithoutPosting | Pending.
      terminal_success: AcceptedSettlementCompleted | AcceptedCreditSettlementCompleted.
      terminal_failure: Rejected. An unmapped value falls open to in_progress.
  - name: creation_date_time
    type: String
    source_field: "Data.CreationDateTime"
  - name: status_update_date_time
    type: String
    source_field: "Data.StatusUpdateDateTime"
  - name: initiation
    type: Json
    source_field: "Data.Initiation"
    description: "Echo of the submitted Initiation — supplies amount, payee, reference, funding account. PII."
  - name: links
    type: { optional: Json }
    source_field: "Links"
  - name: meta
    type: { optional: Json }
    source_field: "Meta"
used_by:
  - { feature: send-money,     kind: response, api_id: domestic-payment-submit, role: body }
  - { feature: payment-status, kind: response, api_id: domestic-payment-read,   role: body }
capabilities_used: [has_api]
tier: maximum
tags: [obie, pisp, payment, envelope, pii, money-movement]
source_binding: "core/network/model/pisp/domesticPayment/response/DomesticPaymentResponse.kt (ships, unconsumed)"
