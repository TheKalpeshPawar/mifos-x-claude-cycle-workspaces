name: OBWriteDomesticResponse5
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-payments"
description: "OBIE domestic-payment response — returns the ASPSP-assigned DomesticPaymentId and transaction status with execution/settlement timings, optional refund and charges, and the echoed Initiation. Also returned by GET domestic-payments/{DomesticPaymentId}."
fields:
  - name: Data.DomesticPaymentId
    type: String
    required: true
    pii: false
    description: "ASPSP-assigned payment resource identifier."
    primary_key: true
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Identifier of the consent this payment was created from."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the payment resource was created."
    primary_key: false
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "ExternalPaymentTransactionStatus1Code: RCVD, PDNG, ACTC, PATC, ACCP, ACFC, ACSP, ACWC, ACSC, ACWP, ACCC, BLCK, RJCT."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime of the last status update."
    primary_key: false
  - name: Data.StatusReason
    type:
      list_of: String
    required: false
    pii: false
    description: "Optional StatusReason[]."
    primary_key: false
  - name: Data.ExpectedExecutionDateTime
    type: String
    required: false
    pii: false
    description: "Expected execution date/time."
    primary_key: false
  - name: Data.ExpectedSettlementDateTime
    type: String
    required: false
    pii: false
    description: "Expected settlement date/time."
    primary_key: false
  - name: Data.Refund
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Optional refund account details."
    primary_key: false
  - name: Data.Charges
    type:
      list_of:
        dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Optional Charges[] applied to the payment (each an amount + currency)."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomestic2
    required: true
    pii: false
    description: "Echoed Initiation block."
    primary_key: false
used_by:
  - "screens/payment-result/api.yaml"
  - "screens/auth-callback/api.yaml"
