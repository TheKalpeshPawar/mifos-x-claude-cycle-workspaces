name: OBDomesticStandingOrder3
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-standing-order-consents"
description: "OBIE domestic-standing-order Initiation block — the recurring GBP-rail instruction (frequency, first-payment date/amount, optional payment count, creditor) staged in the consent and echoed unchanged on the standing-order submission."
fields:
  - name: Frequency
    type: String
    required: true
    pii: false
    description: "Standing-order schedule code, e.g. IntrvlWkDay:01:05."
    primary_key: false
  - name: Reference
    type: String
    required: false
    pii: false
    description: "Payment reference shown to the payee."
    primary_key: false
  - name: NumberOfPayments
    type: String
    required: false
    pii: false
    description: "Total count of payments in the standing order."
    primary_key: false
  - name: FirstPaymentDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime of the first payment."
    primary_key: false
  - name: FirstPaymentAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Amount + currency of the first standing-order payment."
    primary_key: false
  - name: CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor (payee) account identification — scheme, identification and name."
    primary_key: false
used_by:
  - "screens/standing-order-create/api.yaml"
  - "screens/standing-order-edit/api.yaml"
