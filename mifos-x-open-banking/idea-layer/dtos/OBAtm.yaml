name: OBAtm
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /open-banking/opendata/v2.4.0/atms"
description: "OBIE Open Data v2.4.0 ATM Locator item (data[].Brand[].ATM[]) — UNAUTHENTICATED. An ATM with its services, accessibility, supported languages/currencies, minimum withdrawable amount, parent branch link and location/geolocation. De-duplicated client-side by Identification. ATM reference data is not personal PII."
fields:
  - name: Identification
    type: String
    required: true
    pii: false
    description: "Unique ATM identifier."
    primary_key: true
  - name: SupportedLanguages
    type:
      list_of: String
    required: false
    pii: false
    description: "ISO 639-1 language codes supported."
    primary_key: false
  - name: ATMServices
    type:
      list_of: String
    required: false
    pii: false
    description: "e.g. CashWithdrawal, PINChange, Balance, MiniStatement."
    primary_key: false
  - name: OtherATMServices
    type:
      list_of: String
    required: false
    pii: false
    description: "Proprietary service codes."
    primary_key: false
  - name: Accessibility
    type:
      list_of: String
    required: false
    pii: false
    description: "Accessibility provisions (+ OtherAccessibility[])."
    primary_key: false
  - name: SupportedCurrencies
    type:
      list_of: String
    required: false
    pii: false
    description: "Currently restricted to GBP."
    primary_key: false
  - name: MinimumPossibleAmount
    type: String
    required: false
    pii: false
    description: "Minimum withdrawable amount (distinct from minimum denomination)."
    primary_key: false
  - name: Branch.Identification
    type: String
    required: false
    pii: false
    description: "Parent branch link."
    primary_key: false
  - name: Location.PostalAddress
    type: String
    required: true
    pii: false
    description: "StreetName, TownName, Country, PostCode, GeoLocation.GeographicCoordinates.Latitude/Longitude; plus Location.Site.Name."
    primary_key: false
used_by:
  - "screens/atm-locator/api.yaml"
  - "server/apis/open-data.yaml"
