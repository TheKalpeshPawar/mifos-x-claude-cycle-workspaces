name: CustomerAccountLink
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.0.0/banks/{bankId}/customers/{customerId}/customer-account-links"
description: "Link record associating a customer with a bank account. Captures the relationship type (e.g. OWNER, JOINT) as defined in the OBP customer-account-links endpoint."
fields:
  - name: customer_id
    type: String
    required: true
    pii: false
    description: "OBP customer identifier"
    primary_key: false
  - name: account_id
    type: String
    required: true
    pii: false
    description: "Bank account identifier"
    primary_key: false
  - name: relationship_type
    type: String
    required: true
    pii: false
    description: "Nature of the customer-account relationship (e.g. OWNER, JOINT, BENEFICIARY)"
    primary_key: false
used_by:
  - feature: customer-detail
    api_id: obp_customer_account_links
enums: []
