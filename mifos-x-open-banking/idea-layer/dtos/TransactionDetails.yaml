name: TransactionDetails
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/my/banks/{bankId}/accounts/{accountId}/transactions"
description: "Financial and temporal details nested within a Transaction. Captures the transaction type, human-readable description, posting and completion timestamps, the resulting account balance, and the transaction value."
fields:
  - name: type
    type: String
    required: true
    pii: false
    description: "Transaction type code as returned by OBP (e.g. DEBIT, CREDIT, SEPA_CREDIT_TRANSFERS)"
    primary_key: false
  - name: description
    type: String
    required: true
    pii: false
    description: "Free-text description of the transaction provided by the bank"
    primary_key: false
  - name: posted
    type: DateTime
    required: true
    pii: false
    description: "ISO 8601 timestamp when the transaction was posted to the ledger"
    primary_key: false
  - name: completed
    type: DateTime
    required: true
    pii: false
    description: "ISO 8601 timestamp when the transaction was fully settled/completed"
    primary_key: false
  - name: new_balance
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "Account balance immediately after this transaction was applied"
    primary_key: false
  - name: value
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "The monetary value of this transaction (positive for credits, negative for debits)"
    primary_key: false
used_by:
  - feature: transactions
    api_id: "GET /obp/v5.1.0/my/banks/{bankId}/accounts/{accountId}/transactions"
  - feature: transaction-detail
    api_id: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
enums: []
