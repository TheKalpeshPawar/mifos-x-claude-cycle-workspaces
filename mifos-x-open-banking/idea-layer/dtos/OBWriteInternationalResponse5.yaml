name: OBWriteInternationalResponse5
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-payments"
description: "OBIE PISP International Payment submission response — the created international-payment resource: payment id, referenced consent, status, creation datetime, echoed initiation and optional exchange-rate information. Same schema returned by the GET payment poll."
fields:
  - name: Data.InternationalPaymentId
    type: String
    required: true
    pii: false
    description: "Unique international-payment resource identifier."
    primary_key: true
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Referenced consent identifier."
    primary_key: false
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Payment status, e.g. InitiationPending, InitiationCompleted or Pending."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 creation datetime."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 datetime of the last status change (returned on the payment poll)."
    primary_key: false
  - name: Data.ExchangeRateInformation
    type:
      dto_ref: OBExchangeRate2
    required: false
    pii: false
    description: "Optional applied FX rate information."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international.yaml"
