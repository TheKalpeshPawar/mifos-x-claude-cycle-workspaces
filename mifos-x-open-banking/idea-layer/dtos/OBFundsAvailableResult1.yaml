name: OBFundsAvailableResult1
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/pisp/international-payment-consents/{ConsentId}/funds-confirmation"
description: "OBIE funds-availability result sub-object — the outcome of a PISP funds-confirmation check against a payment consent: whether funds are available and when the check was performed. Shared by the international-payment funds-confirmation and the VRP funds-confirmation responses."
fields:
  - name: FundsAvailable
    type: String
    required: true
    pii: false
    description: "Whether funds are available — Available | NotAvailable (international funds-confirmation returns a Boolean equivalent at the OBIE level)."
    primary_key: false
  - name: FundsAvailableDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 datetime the funds-availability check was performed."
    primary_key: false
used_by:
  - "server/apis/pisp-international.yaml"
  - "server/apis/vrp.yaml"
