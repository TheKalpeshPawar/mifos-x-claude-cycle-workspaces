name: OBClientRegistration1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /mock/obie/open-banking/v3.2/oauth2/register"
description: "OBIE/RFC 7591 Dynamic Client Registration request claims (DCR API v3.2.1). The PS256-signed registration JWS the TPP submits — a Software Statement Assertion plus client metadata — to obtain an HSBC-issued client_id before any token/data call."
fields:
  - name: iss
    type: String
    required: true
    pii: false
    description: "Unique TPP identifier, Base62 GUID (maxLength 22)."
    primary_key: false
  - name: iat
    type: Number
    required: true
    pii: false
    description: "Issued-at, seconds since epoch (UTC)."
    primary_key: false
  - name: exp
    type: Number
    required: true
    pii: false
    description: "Expiry, seconds since epoch (UTC); <=30 min ahead of iat."
    primary_key: false
  - name: aud
    type: String
    required: true
    pii: false
    description: "Audience = the ASPSP unique id (issuer from the brand .well-known)."
    primary_key: false
  - name: jti
    type: String
    required: true
    pii: false
    description: "JWT unique id, UUID v4."
    primary_key: false
  - name: redirect_uris
    type:
      list_of: String
    required: true
    pii: false
    description: "Registered redirect URIs; one must match every authorize request's redirect_uri."
    primary_key: false
  - name: token_endpoint_auth_method
    type: String
    required: true
    pii: false
    description: "enum private_key_jwt | tls_client_auth."
    primary_key: false
  - name: grant_types
    type:
      list_of: String
    required: true
    pii: false
    description: "minItems 1; client_credentials | authorization_code | refresh_token."
    primary_key: false
  - name: response_types
    type:
      list_of: String
    required: false
    pii: false
    description: "'code id_token' (Hybrid flow)."
    primary_key: false
  - name: scope
    type: String
    required: true
    pii: false
    description: "Space-separated scope list (e.g. 'openid accounts')."
    primary_key: false
  - name: software_statement
    type: String
    required: true
    pii: false
    description: "The SSA — a signed JWT asserting TPP metadata, issued by the OBIE Directory / DevHub."
    primary_key: false
  - name: software_id
    type: String
    required: false
    pii: false
    description: "TPP-assigned stable software id."
    primary_key: false
  - name: application_type
    type: String
    required: true
    pii: false
    description: "enum web | native (default web)."
    primary_key: false
  - name: id_token_signed_response_alg
    type: String
    required: true
    pii: false
    description: "SupportedAlgorithms enum: PS256 only."
    primary_key: false
  - name: request_object_signing_alg
    type: String
    required: true
    pii: false
    description: "SupportedAlgorithms enum: PS256 only."
    primary_key: false
  - name: token_endpoint_auth_signing_alg
    type: String
    required: true
    pii: false
    description: "SupportedAlgorithms enum: PS256 only."
    primary_key: false
  - name: tls_client_auth_subject_dn
    type: String
    required: false
    pii: false
    description: "RFC4514 subject DN; mandatory when token_endpoint_auth_method=tls_client_auth."
    primary_key: false
  - name: jwks_uri
    type: String
    required: false
    pii: false
    description: "URI to the OBIE keystore."
    primary_key: false
used_by:
  - "screens/bank-authorize-handoff/api.yaml"
  - "screens/auth-callback/api.yaml"
  - "server/apis/auth.yaml"
