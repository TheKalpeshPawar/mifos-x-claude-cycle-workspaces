name: AmountOfMoney
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v6.0.0/my/accounts/{account_id}/transactions"
description: "Monetary amount value object used in OBP PFM v6 transaction API context. Structurally identical to MoneyAmount but registered separately as a distinct type in the PFM v5/v6 transaction response shape."
fields:
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code (e.g. EUR, GBP, USD)"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Decimal string representation of the monetary value (e.g. \"1234.56\")"
    primary_key: false
used_by:
  - feature: pfm-dashboard
    api_id: obp_transactions_list
enums: []
