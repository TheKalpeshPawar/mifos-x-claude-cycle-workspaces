name: DirectDebit
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/direct-debits"
description: "Represents a direct debit mandate attached to a bank account, including its amount, creation date, optional signing date, and active status."
fields:
  - name: direct_debit_id
    type: String
    required: true
    pii: false
    description: "Unique identifier for the direct debit mandate"
    primary_key: true
  - name: amount
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "Monetary amount and currency of the direct debit"
    primary_key: false
  - name: created
    type: DateTime
    required: true
    pii: false
    description: "ISO-8601 timestamp when the direct debit was created"
    primary_key: false
  - name: date_signed
    type:
      optional: DateTime
    required: false
    pii: false
    description: "ISO-8601 timestamp when the mandate was signed; null if not yet signed"
    primary_key: false
  - name: active
    type: Boolean
    required: true
    pii: false
    description: "Whether the direct debit mandate is currently active"
    primary_key: false
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "Identifier of the bank holding the account"
    primary_key: false
  - name: account_id
    type: String
    required: true
    pii: false
    description: "Identifier of the account to which this direct debit belongs"
    primary_key: false
used_by:
  - feature: direct-debits
    api_id: obp_get_direct_debits
enums: []
