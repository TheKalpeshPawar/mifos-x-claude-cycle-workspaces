name: CardReplacement
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/cards/{cardId}"
description: "Card replacement metadata returned in the card detail response — describes replacement reason, status, and order timestamp."
fields:
  - name: card_id
    type: String
    required: true
    pii: false
    description: "ID of the replacement card"
    primary_key: true
  - name: replacement_reason
    type: String
    required: true
    pii: false
    description: "Reason for replacement (e.g. LOST, STOLEN, DAMAGED, EXPIRED)"
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    description: "Current status of the replacement request (e.g. ORDERED, DISPATCHED, DELIVERED)"
    primary_key: false
  - name: ordered_at
    type: "String?"
    required: false
    pii: false
    description: "ISO 8601 timestamp when the replacement was ordered"
    primary_key: false
used_by:
  - feature: card-detail
    api_id: obp_get_card_detail
enums: []
