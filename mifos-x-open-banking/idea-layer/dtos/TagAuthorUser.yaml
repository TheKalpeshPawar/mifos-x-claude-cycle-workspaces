  - name: provider
    type: String
    required: true
    pii: false
    description: "Authentication provider (e.g. 'OBP')"
    primary_key: false
  - name: display_name
    type: String
    required: true
    pii: true
    description: "Human-readable display name of the author"
    primary_key: false
used_by:
