name: OBReadStandingOrder6
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/standing-orders"
description: "OBIE Account & Transaction API v4.0 standing-orders response object (OBStandingOrder6 items) — read-only standing orders on an account, with next-payment date/amount, status and creditor account."
fields:
  - name: Data.StandingOrder[].AccountId
    type: String
    required: true
    pii: false
    description: "Account the standing order is on."
    primary_key: false
  - name: Data.StandingOrder[].StandingOrderId
    type: String
    required: false
    pii: false
    description: "Unique standing-order identifier."
    primary_key: true
  - name: Data.StandingOrder[].Reference
    type: String
    required: false
    pii: false
    description: "Standing-order reference."
    primary_key: false
  - name: Data.StandingOrder[].NextPaymentDateTime
    type: String
    required: false
    pii: false
    description: "ISODateTime of the next payment."
    primary_key: false
  - name: Data.StandingOrder[].StandingOrderStatusCode
    type: String
    required: false
    pii: false
    description: "ExternalMandateStatus1Code."
    primary_key: false
  - name: Data.StandingOrder[].NextPaymentAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Amount + currency of the next payment."
    primary_key: false
  - name: Data.StandingOrder[].CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Creditor account identification (Detail permission)."
    primary_key: false
used_by:
  - "screens/standing-orders/api.yaml"
  - "screens/standing-order-detail/api.yaml"
