name: OBWriteInternationalConsentResponse6
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-payment-consents"
description: "OBIE PISP International Payment consent response — the staged consent resource: ConsentId, status, creation datetime, echoed initiation and the optional quoted exchange-rate information."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Unique consent identifier assigned by the ASPSP."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Consent status, initial value AwaitingAuthorisation."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the consent resource was created."
    primary_key: false
  - name: Data.ExchangeRateInformation
    type:
      dto_ref: OBExchangeRate2
    required: false
    pii: false
    description: "Optional quoted/applied FX rate — unit currency, rate, rate type, contract identification and expiry."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international.yaml"
