name: OBFundsConfirmationConsent1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/cbpii/funds-confirmation-consents"
description: "OBIE CBPII v4.0 funds-confirmation-consent request — registers a long-lived consent to confirm funds against a DebtorAccount, with an optional open-ended expiry. Sent with a client-credentials token."
fields:
  - name: Data.ExpirationDateTime
    type: String
    required: false
    pii: false
    description: "ISODateTime; consent is open-ended if absent."
    primary_key: false
  - name: Data.DebtorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Account funds are confirmed against (SchemeName, Identification, Name, SecondaryIdentification)."
    primary_key: false
used_by:
  - "screens/send-money-amount/api.yaml"
  - "server/apis/cbpii.yaml"
