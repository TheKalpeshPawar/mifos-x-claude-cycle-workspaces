name: ChangePasswordResponse
version: "1.0.0"
source:
  origin: project
  api_path: "PUT /obp/v7.0.0/users/current/password"
description: "Response body from the change-password endpoint. Confirms whether the operation succeeded and carries a human-readable message."
fields:
  - name: success
    type: Boolean
    required: true
    pii: false
    description: "True if the password was changed successfully; false on server-side failure"
    primary_key: false
  - name: message
    type: String
    required: false
    pii: false
    description: "Optional server message — confirmation copy on success, error detail on failure"
    primary_key: false
used_by:
  - api_id: obp_change_password
    feature: change-password
    role: response
