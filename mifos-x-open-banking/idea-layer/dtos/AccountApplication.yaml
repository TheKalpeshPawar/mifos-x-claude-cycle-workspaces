name: AccountApplication
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/account-applications"
description: "Represents a customer's application to open a new bank account, including product selection, applicant identity references, and approval status."
fields:
  - name: account_application_id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: product_code
    type: String
    required: true
    pii: false
    primary_key: false
  - name: user
    type: Json
    required: true
    pii: false
    primary_key: false
  - name: customer
    type: Json
    required: true
    pii: false
    primary_key: false
  - name: date_of_application
    type: DateTime
    required: true
    pii: false
    primary_key: false
  - name: date_last_modified
    type: DateTime
    required: true
    pii: false
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    primary_key: false
    # enum: [REQUESTED, ACCEPTED, REJECTED]
used_by:
  - feature: fo-dashboard
    api_id: obp_get_fo_applications
