name: OBWriteInternationalStandingOrderResponse7
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/international-standing-orders"
description: "OBIE PISP International Standing Order submission response — the created standing-order resource: standing-order id, referenced consent, status, creation/update datetimes and echoed initiation. Same schema returned by the GET standing-order poll."
fields:
  - name: Data.InternationalStandingOrderId
    type: String
    required: true
    pii: false
    description: "Unique standing-order identifier."
    primary_key: true
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "The consent this standing order was initiated against."
    primary_key: false
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Standing-order status — initial RCVD or RJCT; RCVD, CANC, ACTC, PATC, PDNG, INFA, INCO, RJCT."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the resource was created."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 datetime the status was last updated."
    primary_key: false
used_by:
  - "screens/send-money/api.yaml"
  - "server/apis/pisp-international-standing-order.yaml"
