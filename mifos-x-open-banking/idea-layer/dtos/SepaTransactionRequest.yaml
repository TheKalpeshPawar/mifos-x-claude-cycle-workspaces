name: SepaTransactionRequest
version: "1.0.0"
pii_fields: [to_iban, to_name]
source:
  origin: project
  api_path: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/transaction-request-types/SEPA/transaction-requests"
description: "Represents a SEPA credit transfer transaction request submitted via the OBP transaction-requests endpoint. Carries the charge breakdown, value, counterparty IBAN, free-text description, and the resulting status and linked transaction IDs."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier of the transaction request returned by the API"
    primary_key: true
  - name: type
    type: String
    required: true
    pii: false
    description: "Transaction request type, always SEPA for this DTO"
    primary_key: false
  - name: charge
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "Fee charged by the bank for processing this SEPA transaction"
    primary_key: false
  - name: value
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "Actual amount and currency being transferred to the counterparty"
    primary_key: false
  - name: from_account_id
    type: String
    required: true
    pii: false
    description: "Identifier of the source bank account initiating the transfer"
    primary_key: false
  - name: to_iban
    type: String
    required: true
    pii: true
    description: "Destination IBAN of the beneficiary (PII — masked in logs)"
    primary_key: false
  - name: to_name
    type: String
    required: true
    pii: true
    description: "Full name of the beneficiary account holder (PII)"
    primary_key: false
  - name: description
    type: String
    required: true
    pii: false
    description: "Free-text payment reference or narration supplied by the sender"
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    description: "Current status of the transaction request: COMPLETED, PENDING, or FAILED"
    primary_key: false
  - name: transaction_ids
    type:
      list_of: String
    required: true
    pii: false
    description: "List of core banking transaction IDs created as a result of this request"
    primary_key: false
used_by:
  - feature: send-money
    api_id: obp_create_sepa_transfer
  - feature: send-money-confirm
    api_id: obp_confirm_sepa_transfer
enums:
  - field: status
    values: [COMPLETED, PENDING, FAILED]
