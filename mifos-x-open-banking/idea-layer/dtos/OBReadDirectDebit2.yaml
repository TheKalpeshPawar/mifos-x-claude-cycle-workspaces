name: OBReadDirectDebit2
version: "1.0.0"
source:
  origin: rest
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/direct-debits"
description: "OBIE Account & Transaction API v4.0 direct-debits response object (OBDirectDebit2 items) — read-only direct-debit mandates on an account, with status, originator name, frequency and previous payment."
fields:
  - name: Data.DirectDebit[].AccountId
    type: String
    required: true
    pii: false
    description: "Account the direct debit is on."
    primary_key: false
  - name: Data.DirectDebit[].DirectDebitId
    type: String
    required: false
    pii: false
    description: "Unique direct-debit identifier."
    primary_key: true
  - name: Data.DirectDebit[].DirectDebitStatusCode
    type: String
    required: false
    pii: false
    description: "ExternalMandateStatus1Code (e.g. Active, Inactive)."
    primary_key: false
  - name: Data.DirectDebit[].Name
    type: String
    required: true
    pii: true
    description: "Name of the direct-debit originator."
    primary_key: false
  - name: Data.DirectDebit[].PreviousPaymentDateTime
    type: String
    required: false
    pii: false
    description: "ISODateTime of the previous payment."
    primary_key: false
  - name: Data.DirectDebit[].Frequency
    type: String
    required: false
    pii: false
    description: "UK.OBIE.Monthly | Weekly | Annual | etc."
    primary_key: false
  - name: Data.DirectDebit[].PreviousPaymentAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: false
    pii: false
    description: "Amount + currency of the previous payment."
    primary_key: false
used_by:
  - "screens/direct-debits/api.yaml"
  - "screens/direct-debit-detail/api.yaml"
