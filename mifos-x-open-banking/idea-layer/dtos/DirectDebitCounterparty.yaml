  api_path: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/direct-debit"
description: "Counterparty info for a direct debit mandate — identifies the payee with optional account and bank routing details."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Counterparty identifier"
    primary_key: true
  - name: name
    type: String
    required: true
    pii: false
    description: "Counterparty name (payee)"
    primary_key: false
  - name: account_routing
    type: "AccountRouting?"
    required: false
    pii: false
    description: "Account routing info (scheme + address, e.g. IBAN)"
    primary_key: false
  - name: bank_routing
    type: "BankRouting?"
    required: false
    pii: false
    description: "Bank routing info (scheme + address, e.g. BIC)"
    primary_key: false
used_by:
  - feature: direct-debits
    api_id: obp_create_direct_debit
enums: []
