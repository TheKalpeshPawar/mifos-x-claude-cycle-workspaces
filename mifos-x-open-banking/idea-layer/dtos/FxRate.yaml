name: FxRate
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/fx/{fromCurrencyCode}/{toCurrencyCode}"
description: "Foreign exchange rate pair returned by the OBP FX rates endpoint. Contains both the forward and inverse conversion rates together with the effective date, enabling the send-money flow to display the live exchange rate before the user confirms a cross-currency SEPA transfer."
fields:
  - name: from_currency_code
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code of the source currency (e.g. EUR)"
    primary_key: false
  - name: to_currency_code
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code of the target currency (e.g. GBP)"
    primary_key: false
  - name: conversion_rate
    type: String
    required: true
    pii: false
    description: "Decimal string representing units of to_currency per one unit of from_currency"
    primary_key: false
  - name: inverse_conversion_rate
    type: String
    required: true
    pii: false
    description: "Decimal string representing units of from_currency per one unit of to_currency"
    primary_key: false
  - name: effect_date
    type: DateTime
    required: true
    pii: false
    description: "ISO 8601 timestamp from which this exchange rate is effective"
    primary_key: false
used_by:
  - feature: fx-rates
    api_id: obp_get_fx_rate
enums: []
