name: StandingOrderSchedule
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/standing-order"
description: "Schedule configuration for a standing order — defines execution frequency, start/end dates, and next execution date."
fields:
  - name: start_date
    type: String
    required: true
    pii: false
    description: "ISO 8601 date when the standing order begins execution (YYYY-MM-DD)"
    primary_key: false
  - name: end_date
    type: "String?"
    required: false
    pii: false
    description: "ISO 8601 date when the standing order stops execution. Null = indefinite."
    primary_key: false
  - name: frequency
    type: String
    required: true
    pii: false
    description: "Execution frequency — one of DAILY, WEEKLY, MONTHLY, YEARLY"
    primary_key: false
  - name: next_execution_date
    type: "String?"
    required: false
    pii: false
    description: "ISO 8601 date of the next scheduled execution (read-only, server-computed)"
    primary_key: false
used_by:
  - feature: standing-orders
    api_id: obp_create_standing_order
  - feature: standing-order-edit
    api_id: obp_update_standing_order
enums:
  - field: frequency
    values: [DAILY, WEEKLY, MONTHLY, YEARLY]
