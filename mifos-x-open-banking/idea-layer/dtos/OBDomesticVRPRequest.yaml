name: OBDomesticVRPRequest
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-vrps"
description: "OBIE PISP Domestic VRP payment-order request — submits a single payment under an authorised VRP consent; restates the VRP type and authentication method, the consent's creditor account, and the per-payment Instruction. The payment must satisfy the consent ControlParameters."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Links to the authorised consent."
    primary_key: false
  - name: Data.VRPType
    type: String
    required: true
    pii: false
    description: "Restates the VRP type, e.g. UK.OBIE.VRPType.Sweeping."
    primary_key: false
  - name: Data.PSUAuthenticationMethod
    type: String
    required: true
    pii: false
    description: "Restates the authentication method, e.g. UK.OBIE.SCANotRequired."
    primary_key: false
  - name: Data.Initiation.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor account; must match the consent Initiation."
    primary_key: false
  - name: Data.Instruction.InstructionIdentification
    type: String
    required: true
    pii: false
    description: "Per-payment instruction identifier."
    primary_key: false
  - name: Data.Instruction.EndToEndIdentification
    type: String
    required: true
    pii: false
    description: "End-to-end identifier."
    primary_key: false
  - name: Data.Instruction.InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "This payment's amount and currency (must satisfy ControlParameters)."
    primary_key: false
  - name: Data.Instruction.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Per-instruction creditor account."
    primary_key: false
  - name: Data.Instruction.LocalInstrument
    type: String
    required: false
    pii: false
    description: "Settlement rail, e.g. UK.OBIE.BalanceTransfer."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: false
    pii: false
    description: "OBIE Risk block; must match the consent risk block."
    primary_key: false
used_by:
  - "server/apis/vrp.yaml"
