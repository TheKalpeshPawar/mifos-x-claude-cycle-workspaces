name: Payment
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v7.0.0/banks/{bankId}/accounts/{accountId}/standing-orders/{standingOrderId}"
description: "Payment record for a direct debit execution — represents a single payment made under a direct debit mandate."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique payment identifier"
    primary_key: true
  - name: amount
    type: MoneyAmount
    required: true
    pii: false
    description: "Payment amount including currency"
    primary_key: false
  - name: description
    type: String
    required: true
    pii: false
    description: "Payment description or reference"
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    description: "Payment execution status (e.g. COMPLETED, PENDING, FAILED)"
    primary_key: false
  - name: created_at
    type: String
    required: true
    pii: false
    description: "ISO 8601 timestamp when the payment was created"
    primary_key: false
  - name: counterparty
    type: "DirectDebitCounterparty?"
    required: false
    pii: false
    description: "Counterparty details for this payment"
    primary_key: false
used_by:
  - feature: direct-debit-detail
    api_id: obp_get_mandate_detail
enums: []
