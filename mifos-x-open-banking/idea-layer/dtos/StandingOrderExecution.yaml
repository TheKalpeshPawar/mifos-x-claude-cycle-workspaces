name: StandingOrderExecution
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}"
description: "A single execution record within a standing order's execution_history. Represents one payment attempt — completed or failed — with date, outcome, optional failure reason, and amount at time of execution."
fields:
  - name: execution_date
    type: String
    required: true
    pii: false
    description: "ISO-8601 date on which this execution was attempted"
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    description: "Outcome of this execution attempt: COMPLETED or FAILED"
    primary_key: false
  - name: failure_reason
    type: "String?"
    required: false
    pii: false
    description: "Machine-readable failure reason (e.g. INSUFFICIENT_FUNDS); null when status is COMPLETED"
    primary_key: false
  - name: amount_value
    type: String
    required: true
    pii: false
    description: "Actual amount transferred (or attempted) as a decimal string"
    primary_key: false
used_by:
  - feature: standing-order-detail
    api_id: get_standing_order
enums:
  - field: status
    values: [COMPLETED, FAILED]
pii_fields: []
