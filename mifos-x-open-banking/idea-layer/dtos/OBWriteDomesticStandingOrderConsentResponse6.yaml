name: OBWriteDomesticStandingOrderConsentResponse6
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-standing-order-consents"
description: "OBIE domestic-standing-order-consent response — returns the unique ConsentId in AwaitingAuthorisation with the echoed standing-order Initiation. Also returned by GET domestic-standing-order-consents/{ConsentId} (where Status reflects Authorised/Rejected)."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Unique consent identifier."
    primary_key: true
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "Consent status, e.g. AwaitingAuthorisation, Authorised, Rejected."
    primary_key: false
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISO 8601 consent creation datetime."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: false
    pii: false
    description: "ISO 8601 datetime of the last status change (returned on GET)."
    primary_key: false
  - name: Data.Initiation
    type:
      dto_ref: OBDomesticStandingOrder3
    required: true
    pii: false
    description: "Echoed standing-order Initiation block."
    primary_key: false
used_by:
  - "screens/standing-order-create/api.yaml"
  - "screens/standing-order-edit/api.yaml"
