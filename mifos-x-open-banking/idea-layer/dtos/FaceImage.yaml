name: FaceImage
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/customers/{customerId}"
description: "Customer face image metadata returned by the OBP customer endpoint. Contains the URL of the stored image and the date it was captured or uploaded."
fields:
  - name: url
    type: String
    required: true
    pii: true
    description: "URL pointing to the customer's face image; treated as PII — access-controlled"
    primary_key: false
  - name: date
    type: String
    required: true
    pii: false
    description: "ISO-8601 date string indicating when the image was captured or last updated"
    primary_key: false
used_by:
  - feature: customer-detail
    api_id: obp_get_customer
enums: []
