name: OBEventPolling1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/events"
description: "OBIE Event Notification v4.0 poll request — polls for, acknowledges and receives event notifications (CreateEvents). HSBC supports short polling only, so returnImmediately is always true."
fields:
  - name: maxEvents
    type: Number
    required: true
    pii: false
    description: "Integer 0-10; 0 means return no events even if available."
    primary_key: false
  - name: returnImmediately
    type: Boolean
    required: false
    pii: false
    description: "Always true — only short polling is supported."
    primary_key: false
  - name: ack
    type:
      list_of: String
    required: false
    pii: false
    description: "jti values being positively acknowledged."
    primary_key: false
  - name: setErrs
    type: String
    required: false
    pii: false
    description: "Negative acknowledgements map; each jti carries err + description."
    primary_key: false
used_by:
  - "screens/notifications/api.yaml"
  - "server/apis/events.yaml"
