name: OBFundsConfirmationConsentResponse1
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/cbpii/funds-confirmation-consents"
description: "OBIE CBPII v4.0 funds-confirmation-consent response — the created consent resource with its unique ConsentId, lifecycle Status (AWAU|RJCT|AUTH|CANC|EXPD) and echoed DebtorAccount. Also returned by GET funds-confirmation-consents/{ConsentId}."
fields:
  - name: Data.ConsentId
    type: String
    required: true
    pii: false
    description: "Unique funds-confirmation-consent id, Max128Text."
    primary_key: true
  - name: Data.CreationDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime the consent resource was created."
    primary_key: false
  - name: Data.Status
    type: String
    required: true
    pii: false
    description: "OBInternalConsentStatus1Code; initial AWAU, enum AWAU|RJCT|AUTH|CANC|EXPD."
    primary_key: false
  - name: Data.StatusUpdateDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime of the last status update."
    primary_key: false
  - name: Data.ExpirationDateTime
    type: String
    required: false
    pii: false
    description: "Echo of requested expiry; open-ended if absent."
    primary_key: false
  - name: Data.DebtorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Echoed debtor account (Identification may be masked by the ASPSP)."
    primary_key: false
  - name: Links.Self
    type: String
    required: false
    pii: false
    description: "Self link to the created consent resource."
    primary_key: false
used_by:
  - "screens/send-money-amount/api.yaml"
  - "server/apis/cbpii.yaml"
