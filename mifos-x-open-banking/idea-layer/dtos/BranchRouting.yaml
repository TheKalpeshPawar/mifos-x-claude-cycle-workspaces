name: BranchRouting
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/branches"
description: "Routing information for a bank branch, identifying the routing scheme (e.g. OBP, SORT_CODE) and the corresponding address or identifier value."
fields:
  - name: scheme
    type: String
    required: true
    pii: false
    description: "Routing scheme identifier (e.g. 'OBP', 'SORT_CODE', 'BIC')"
    primary_key: false
  - name: address
    type: String
    required: true
    pii: false
    description: "The routing address or code value for the given scheme"
    primary_key: false
used_by:
  - feature: atm-locator
    api_id: obp_get_branches
enums: []
