name: OBDomesticScheduled2
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-scheduled-payment-consents"
description: "OBIE domestic-scheduled-payment Initiation block — like OBDomestic2 but carries a mandatory RequestedExecutionDateTime fixing the future date the scheduled payment executes."
fields:
  - name: InstructionIdentification
    type: String
    required: true
    pii: false
    description: "PISP-assigned unique instruction identification."
    primary_key: false
  - name: EndToEndIdentification
    type: String
    required: false
    pii: false
    description: "End-to-end identification reference."
    primary_key: false
  - name: LocalInstrument
    type: String
    required: false
    pii: false
    description: "Payment scheme local instrument, e.g. UK.OBIE.CHAPS."
    primary_key: false
  - name: RequestedExecutionDateTime
    type: String
    required: true
    pii: false
    description: "ISODateTime — the future date the scheduled payment is requested to execute."
    primary_key: false
  - name: InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Amount + currency to be paid on the scheduled date."
    primary_key: false
  - name: CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor (payee) account identification — scheme, identification and name."
    primary_key: false
  - name: RemittanceInformation.Reference
    type: String
    required: false
    pii: false
    description: "Remittance reference shown to the payee."
    primary_key: false
used_by:
  - "server/apis/pisp-domestic-scheduled.yaml"
