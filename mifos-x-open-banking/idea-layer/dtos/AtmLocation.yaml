name: AtmLocation
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.1.0/banks/{bankId}/atms"
description: "ATM record returned by the OBP ATMs endpoint. Contains the ATM name, structured postal address, geo-coordinates, optional opening and closing times, accessibility flag, and a list of supported services. Used by the ATM locator screen to render map pins and a detail card for each nearby ATM."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique identifier for the ATM within the bank"
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "Identifier of the bank that operates this ATM"
    primary_key: false
  - name: name
    type: String
    required: true
    pii: false
    description: "Display name or location description of the ATM (e.g. High Street Branch ATM)"
    primary_key: false
  - name: address
    type:
      dto_ref: PostalAddress
    required: true
    pii: false
    description: "Structured postal address of the ATM site"
    primary_key: false
  - name: location
    type:
      dto_ref: GeoLocation
    required: true
    pii: false
    description: "GPS coordinates used to place the ATM pin on the map"
    primary_key: false
  - name: opening_time
    type:
      optional: String
    required: false
    pii: false
    description: "Opening time in HH:mm format — absent when the ATM operates 24 hours"
    primary_key: false
  - name: closing_time
    type:
      optional: String
    required: false
    pii: false
    description: "Closing time in HH:mm format — absent when the ATM operates 24 hours"
    primary_key: false
  - name: is_accessible
    type:
      optional: Boolean
    required: false
    pii: false
    description: "True when the ATM meets accessibility standards (wheelchair, audio guidance) — null if unknown"
    primary_key: false
  - name: services
    type:
      list_of: String
    required: true
    pii: false
    description: "List of service codes offered at this ATM (e.g. CASH_WITHDRAWAL, DEPOSIT, BALANCE_ENQUIRY)"
    primary_key: false
used_by:
  - feature: atm-locator
    api_id: obp_get_atms
enums: []
