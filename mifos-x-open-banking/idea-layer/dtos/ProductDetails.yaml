name: ProductDetails
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obp/v5.0.0/banks/{bankId}/products"
description: "Banking product details — the core product definition including code, name, category hierarchy, description, and owning bank."
fields:
  - name: product_code
    type: String
    required: true
    pii: false
    description: "Unique product code identifier"
    primary_key: true
  - name: name
    type: String
    required: true
    pii: false
    description: "Product display name"
    primary_key: false
  - name: category
    type: String
    required: true
    pii: false
    description: "Product category (SAVINGS, LOANS, CARDS, MORTGAGES, CURRENT)"
    primary_key: false
  - name: family
    type: "String?"
    required: false
    pii: false
    description: "Product family within the category"
    primary_key: false
  - name: description
    type: String
    required: true
    pii: false
    description: "Human-readable product description"
    primary_key: false
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "ID of the bank offering this product"
    primary_key: false
used_by:
  - feature: products
    api_id: obp_products
enums:
  - field: category
    values: [SAVINGS, LOANS, CARDS, MORTGAGES, CURRENT]
