name: OBDomestic2
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-payment-consents"
description: "OBIE domestic-payment Initiation block — the immutable instruction (identification, amount, debtor/creditor accounts, remittance) that is staged in the consent and must be echoed unchanged on the payment submission."
fields:
  - name: InstructionIdentification
    type: String
    required: true
    pii: false
    description: "PISP-assigned unique instruction identification."
    primary_key: false
  - name: EndToEndIdentification
    type: String
    required: false
    pii: false
    description: "End-to-end identification reference carried through settlement."
    primary_key: false
  - name: LocalInstrument
    type: String
    required: false
    pii: false
    description: "Payment scheme local instrument, e.g. UK.OBIE.CHAPS, UK.OBIE.FPS."
    primary_key: false
  - name: InstructedAmount
    type:
      dto_ref: OBActiveOrHistoricCurrencyAndAmount
    required: true
    pii: false
    description: "Amount + currency the PSU instructs to be paid."
    primary_key: false
  - name: DebtorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Optional debtor (source) account identification."
    primary_key: false
  - name: CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor (payee) account identification — scheme, identification and name."
    primary_key: false
  - name: RemittanceInformation.Reference
    type: String
    required: false
    pii: false
    description: "Remittance reference shown to the payee."
    primary_key: false
used_by:
  - "screens/send-money-confirm/api.yaml"
  - "screens/payment-authorize-handoff/api.yaml"
  - "screens/auth-callback/api.yaml"
