name: OBDomesticVRPConsentRequest
version: "1.0.0"
source:
  origin: rest
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-vrp-consents"
description: "OBIE PISP Domestic VRP consent request — stages a long-lived Variable Recurring Payment consent carrying the control parameters (limits) and the immutable per-payment initiation (debtor/creditor account, remittance) plus the Risk block."
fields:
  - name: Data.ReadRefundAccount
    type: String
    required: false
    pii: false
    description: "Yes | No — when Yes the response may include a Refund account."
    primary_key: false
  - name: Data.ControlParameters
    type:
      dto_ref: OBDomesticVRPControlParameters
    required: true
    pii: false
    description: "The agreed VRP limits — maximum individual amount, periodic limits, VRP type and authentication methods."
    primary_key: false
  - name: Data.Initiation.DebtorAccount
    type:
      dto_ref: OBCashAccount6
    required: false
    pii: true
    description: "Optional debtor account."
    primary_key: false
  - name: Data.Initiation.CreditorAccount
    type:
      dto_ref: OBCashAccount6
    required: true
    pii: true
    description: "Creditor account — scheme, identification and (optional) name."
    primary_key: false
  - name: Data.Initiation.RemittanceInformation.Unstructured
    type:
      list_of: String
    required: false
    pii: false
    description: "Free-text remittance information."
    primary_key: false
  - name: Risk
    type:
      dto_ref: OBRisk1
    required: true
    pii: false
    description: "OBIE Risk block — payment context, merchant category and payment purpose codes."
    primary_key: false
used_by:
  - "server/apis/vrp.yaml"
