schema_version: "4.0"
api_group: products
name: "Bank Products API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-05-30"

endpoints:

  - id: list_bank_products
    method: GET
    path: "/v5.0.0/banks/{bank_id}/products"
    description: "Retrieve all banking products offered by the specified bank. Returns the full product catalogue including savings accounts, loans, cards, mortgages, and current accounts with their category hierarchy and metadata links."
    auth_required: true
    request_schema: []
    response_schema:
      - field: products
        type: "List<Product>"
        nullable: false
        description: "Array of all products available at this bank"
      - field: code
        type: String
        nullable: false
        description: "Unique product code identifier (e.g. 'SAVINGS_BASIC', 'LOAN_PERSONAL')"
      - field: name
        type: String
        nullable: false
        description: "Human-readable product name displayed in the product catalogue"
      - field: category
        type: String
        nullable: false
        description: "Top-level product category. Enum: SAVINGS, LOANS, CARDS, MORTGAGES, CURRENT"
      - field: family
        type: String
        nullable: false
        description: "Product family grouping within the category (e.g. 'Everyday Banking', 'SME Lending')"
      - field: super_family
        type: String
        nullable: false
        description: "Highest-level product grouping (e.g. 'Retail', 'Business', 'Wealth')"
      - field: more_info_url
        type: String
        format: URL
        nullable: true
        description: "External URL to detailed product marketing page or terms document"
      - field: details
        type: ProductDetails
        nullable: true
        description: "Structured product details — may include interest rates, fees, minimum balance, and eligibility criteria"
      - field: meta
        type: ProductMeta
        nullable: true
        description: "System metadata for the product record (e.g. license, creation timestamp)"
      - field: parent_product_code
        type: "String?"
        nullable: true
        description: "Code of the parent product if this is a variant or sub-product; null for top-level products"
      - field: bank_id
        type: String
        nullable: false
        description: "Bank identifier confirming which bank owns this product"
      - field: label
        type: String
        nullable: false
        description: "Short display label used in product picker UI (e.g. 'Basic Savings Account')"
      - field: description
        type: "String?"
        nullable: true
        description: "Longer free-text product description for detail view"
    error_codes:
      - code: 400
        message: "INVALID_BANK_ID"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "BANK_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true
