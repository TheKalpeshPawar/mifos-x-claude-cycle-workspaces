schema_version: "4.0"
api_group: standing_orders_detail
name: "Standing Orders Detail API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-05-28"

note: "These endpoints extend the base standing-orders.yaml group with per-order lifecycle operations (view, pause, resume, cancel). All paths require bank_id and account_id path parameters."

endpoints:

  - id: get_standing_order
    method: GET
    path: "/v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}"
    description: "Retrieve full detail of a specific standing order including beneficiary info, schedule, amount, status, and the last 5 execution records."
    auth_required: true
    request_schema:
      - field: bank_id
        type: String
        location: path
        required: true
        validation: "OBP bank identifier (e.g. 'rbs', 'gh.29.uk')"
      - field: account_id
        type: String
        location: path
        required: true
        validation: "Account UUID from accounts list"
      - field: standing_order_id
        type: String
        location: path
        required: true
        validation: "Standing order identifier"
    response_schema:
      - field: id
        type: String
        nullable: false
      - field: bank_id
        type: String
        nullable: false
      - field: account_id
        type: String
        nullable: false
      - field: beneficiary_name
        type: String
        nullable: false
        description: "Full legal name of the payment recipient"
      - field: beneficiary_iban
        type: String
        nullable: false
        description: "IBAN of the recipient account"
      - field: beneficiary_bank
        type: String
        nullable: false
        description: "Name of the beneficiary's bank"
      - field: amount_value
        type: String
        nullable: false
        description: "Payment amount as a decimal string (e.g. '1200.00')"
      - field: amount_currency
        type: String
        nullable: false
        description: "ISO 4217 currency code (e.g. 'GBP', 'KES')"
      - field: frequency
        type: String
        nullable: false
        description: "One of: WEEKLY, MONTHLY, QUARTERLY, ANNUALLY"
      - field: start_date
        type: String
        format: ISO-8601 date
        nullable: false
      - field: next_payment_date
        type: String
        format: ISO-8601 date
        nullable: false
      - field: final_date
        type: "String?"
        format: ISO-8601 date
        nullable: true
        description: "Null if standing order has no end date (ongoing)"
      - field: status
        type: String
        nullable: false
        description: "One of: ACTIVE, PAUSED, CANCELLED"
      - field: execution_history
        type: List<StandingOrderExecution>
        nullable: false
        description: "Last 5 execution records, newest first"
        item_fields:
          - field: execution_date
            type: String
            format: ISO-8601 date
          - field: status
            type: String
            description: "COMPLETED or FAILED"
          - field: failure_reason
            type: "String?"
            description: "e.g. INSUFFICIENT_FUNDS — null if completed"
          - field: amount_value
            type: String
    error_codes:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: pause_standing_order
    method: POST
    path: "/v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}/pause"
    description: "Pause an active standing order. Idempotent — pausing an already-paused order returns 409 but does not fail the user flow. No payments will be executed while paused."
    auth_required: true
    request_schema:
      - field: bank_id
        type: String
        location: path
        required: true
      - field: account_id
        type: String
        location: path
        required: true
      - field: standing_order_id
        type: String
        location: path
        required: true
    response_schema:
      - field: id
        type: String
        nullable: false
      - field: status
        type: String
        nullable: false
        description: "PAUSED"
      - field: paused_at
        type: String
        format: ISO-8601 Instant
        nullable: false
    error_codes:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"
        retry: false
      - code: 409
        message: "STANDING_ORDER_ALREADY_PAUSED"
        description: "Idempotent — treat as success in client code."
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: resume_standing_order
    method: POST
    path: "/v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}/resume"
    description: "Resume a paused standing order. Idempotent — resuming an already-active order returns 409. Next payment will be scheduled from next_payment_date."
    auth_required: true
    request_schema:
      - field: bank_id
        type: String
        location: path
        required: true
      - field: account_id
        type: String
        location: path
        required: true
      - field: standing_order_id
        type: String
        location: path
        required: true
    response_schema:
      - field: id
        type: String
        nullable: false
      - field: status
        type: String
        nullable: false
        description: "ACTIVE"
      - field: resumed_at
        type: String
        format: ISO-8601 Instant
        nullable: false
      - field: next_payment_date
        type: String
        format: ISO-8601 date
        nullable: false
    error_codes:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"
        retry: false
      - code: 409
        message: "STANDING_ORDER_NOT_PAUSED"
        description: "Idempotent — treat as success in client code."
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: delete_standing_order
    method: DELETE
    path: "/v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}"
    description: "Soft-delete (cancel) a standing order. Status transitions to CANCELLED. No further payments will be initiated. The record remains accessible in read-only mode for audit purposes."
    auth_required: true
    request_schema:
      - field: bank_id
        type: String
        location: path
        required: true
      - field: account_id
        type: String
        location: path
        required: true
      - field: standing_order_id
        type: String
        location: path
        required: true
    response_schema:
      - field: id
        type: String
        nullable: false
      - field: status
        type: String
        nullable: false
        description: "CANCELLED"
      - field: cancelled_at
        type: String
        format: ISO-8601 Instant
        nullable: false
    error_codes:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"
        retry: false
      - code: 409
        message: "STANDING_ORDER_ALREADY_CANCELLED"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true
