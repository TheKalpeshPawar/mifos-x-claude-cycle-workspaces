schema_version: "4.0"
api_group: profile
name: "User Profile API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-05-28"

endpoints:

  - id: get_current_user
    method: GET
    path: "/v4.0.0/users/current"
    description: "Retrieve the authenticated user's profile including entitlements and login metadata."
    auth_required: true
    request_schema: {}
    response_schema:
      - field: user_id
        type: String
        format: UUID
        nullable: false
        description: "Unique OBP user identifier"
      - field: username
        type: String
        nullable: false
        description: "DirectLogin username"
      - field: email
        type: String
        format: email
        nullable: false
        description: "Registered email address"
      - field: provider
        type: String
        nullable: false
        description: "Auth provider — typically 'obp_consumer_key'"
      - field: entitlements
        type: List<String>
        nullable: false
        description: "List of OBP role/entitlement identifiers granted to this user"
      - field: date_joined
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Account creation timestamp"
      - field: last_login_at
        type: "String?"
        format: ISO-8601 Instant
        nullable: true
        description: "Most recent successful login timestamp; null on first login"
    error_codes:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: update_current_user
    method: PUT
    path: "/v4.0.0/users/current"
    description: "Update mutable profile fields for the authenticated user."
    auth_required: true
    request_schema:
      - field: email
        type: String
        required: false
        validation: "Must be a valid RFC 5321 email address. Max 254 characters."
      - field: language_preference
        type: String
        required: false
        validation: "Must be a valid ISO 639-1 two-letter language code (e.g. 'en', 'sw', 'fr'). Defaults to 'en'."
    response_schema:
      - field: user_id
        type: String
        nullable: false
      - field: username
        type: String
        nullable: false
      - field: email
        type: String
        nullable: false
      - field: language_preference
        type: String
        nullable: false
      - field: updated_at
        type: String
        format: ISO-8601 Instant
        nullable: false
    error_codes:
      - code: 400
        message: "INVALID_EMAIL_FORMAT"
        retry: false
      - code: 400
        message: "INVALID_LANGUAGE_CODE"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 409
        message: "EMAIL_ALREADY_IN_USE"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true
