schema_version: "4.0"
api_group: pisp-domestic-standing-order
name: "PISP Domestic Standing Order API"
base_url: "https://secure.sandbox.ob.hsbc.co.uk"
auth_scheme: OAuth2-FAPI
api_version: v4.0
generated_at: "2026-06-11"
source: "HSBC UK/CE Open Banking sandbox (OBIE Read/Write v4.0); UK Personal v4.0 canonical paths, CE HSBCnet on v3.1 (/ce prefix); PISP payment narrative + response schemas from T2 OBIE PISP v4.0 (HSBC portal unreachable — 429); generic OAuth2 token/authorize endpoints live in the auth group. Per-brand hosts in HSBC_Sandbox/docs/06-domestic-standing-order.md"
endpoints:
  - id: create_domestic_standing_order_consent
    method: POST
    path: "/obie/open-banking/v4.0/pisp/domestic-standing-order-consents"
    description: "Create a domestic-standing-order-consent capturing the PSU's recurring GBP-rail standing-order instruction (frequency, first/recurring/final amounts, creditor) prior to authorisation; bank returns a ConsentId in AwaitingAuthorisation. CE HSBCnet uses v3.1 at /ce/obie/open-banking/v3.1/pisp/domestic-standing-order-consents."
    auth_required: true
    scopes: [payments]
    request_schema:
      - field: Data.Permission
        type: String
        required: true
        validation: "Fixed value Create."
      - field: Data.Initiation.Frequency
        type: String
        required: true
        validation: "Standing-order schedule code, e.g. IntrvlWkDay:01:05."
      - field: Data.Initiation.Reference
        type: String
        required: false
        validation: "Payment reference."
      - field: Data.Initiation.NumberOfPayments
        type: String
        required: false
        validation: "Total count of payments in the standing order."
      - field: Data.Initiation.FirstPaymentDateTime
        type: String
        required: true
        validation: "ISO 8601 datetime of the first payment."
      - field: Data.Initiation.FirstPaymentAmount.Amount
        type: String
        required: true
        validation: "Decimal string."
      - field: Data.Initiation.FirstPaymentAmount.Currency
        type: String
        required: true
        validation: "ISO 4217 currency code."
      - field: Data.Initiation.CreditorAccount.SchemeName
        type: String
        required: true
        validation: "Account scheme, e.g. UK.OBIE.IBAN or UK.OBIE.SortCodeAccountNumber."
      - field: Data.Initiation.CreditorAccount.Identification
        type: String
        required: true
        validation: "Account identification per scheme."
      - field: Data.Initiation.CreditorAccount.Name
        type: String
        required: true
        validation: "Creditor account name."
      - field: Risk
        type: Object
        required: true
        validation: "OBRisk block (may be empty {})."
    response_schema:
      - field: Data.ConsentId
        type: String
        nullable: false
        description: "Unique consent identifier (OBWriteDomesticStandingOrderConsentResponse)."
      - field: Data.Status
        type: String
        nullable: false
        description: "Consent status, e.g. AwaitingAuthorisation."
      - field: Data.CreationDateTime
        type: String
        nullable: false
        description: "ISO 8601 consent creation datetime."
      - field: Data.Initiation
        type: Object
        nullable: false
        description: "Echoed standing-order initiation block."
      - field: Links
        type: Object
        nullable: true
        description: "OBIE Links block."
      - field: Meta
        type: Object
        nullable: true
        description: "OBIE Meta block."
    error_codes:
      - code: 400
        message: "OB.Field.Invalid"
        retry: false
      - code: 401
        message: "UNAUTHORIZED"
        retry: false
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
        retry: false
      - code: 429
        message: "TOO_MANY_REQUESTS"
        retry: true
      - code: 500
        message: "OB.UnexpectedError"
        retry: true

  - id: get_domestic_standing_order_consent
    method: GET
    path: "/obie/open-banking/v4.0/pisp/domestic-standing-order-consents/{ConsentId}"
    description: "Retrieve the current status of a previously created standing-order consent; confirm Authorised before submitting the payment. CE HSBCnet uses v3.1 at /ce/obie/open-banking/v3.1/pisp/domestic-standing-order-consents/{ConsentId}."
    auth_required: true
    scopes: [payments]
    request_schema: []
    response_schema:
      - field: Data.ConsentId
        type: String
        nullable: false
        description: "Consent identifier."
      - field: Data.Status
        type: String
        nullable: false
        description: "Consent status, e.g. Authorised or Rejected."
      - field: Data.StatusUpdateDateTime
        type: String
        nullable: false
        description: "ISO 8601 datetime of the last status change."
      - field: Data.Initiation
        type: Object
        nullable: false
        description: "Echoed standing-order initiation block."
    error_codes:
      - code: 400
        message: "OB.Field.Invalid"
        retry: false
      - code: 401
        message: "UNAUTHORIZED"
        retry: false
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
        retry: false
      - code: 404
        message: "OB.Resource.NotFound"
        retry: false
      - code: 429
        message: "TOO_MANY_REQUESTS"
        retry: true
      - code: 500
        message: "OB.UnexpectedError"
        retry: true

  - id: create_domestic_standing_order
    method: POST
    path: "/obie/open-banking/v4.0/pisp/domestic-standing-orders"
    description: "Submit the authorised domestic standing order referencing the authorised ConsentId; Data.Initiation must match the consent's initiation or the ASPSP rejects it. CE HSBCnet uses v3.1 at /ce/obie/open-banking/v3.1/pisp/domestic-standing-orders."
    auth_required: true
    scopes: [payments]
    request_schema:
      - field: Data.ConsentId
        type: String
        required: true
        validation: "Must equal the authorised consent ConsentId."
      - field: Data.Initiation.Frequency
        type: String
        required: true
        validation: "Must match the consent's initiation, e.g. IntrvlWkDay:01:05."
      - field: Data.Initiation.Reference
        type: String
        required: false
        validation: "Payment reference matching the consent."
      - field: Data.Initiation.NumberOfPayments
        type: String
        required: false
        validation: "Total count of payments, matching the consent."
      - field: Data.Initiation.FirstPaymentDateTime
        type: String
        required: true
        validation: "ISO 8601 datetime matching the consent."
      - field: Data.Initiation.FirstPaymentAmount.Amount
        type: String
        required: true
        validation: "Decimal string matching the consent."
      - field: Data.Initiation.FirstPaymentAmount.Currency
        type: String
        required: true
        validation: "ISO 4217 currency code matching the consent."
      - field: Data.Initiation.CreditorAccount.SchemeName
        type: String
        required: true
        validation: "Account scheme matching the consent."
      - field: Data.Initiation.CreditorAccount.Identification
        type: String
        required: true
        validation: "Account identification matching the consent."
      - field: Data.Initiation.CreditorAccount.Name
        type: String
        required: true
        validation: "Creditor account name matching the consent."
      - field: Risk
        type: Object
        required: true
        validation: "OBRisk block (may be empty {})."
    response_schema:
      - field: Data.DomesticStandingOrderId
        type: String
        nullable: false
        description: "Unique standing-order resource identifier."
      - field: Data.ConsentId
        type: String
        nullable: false
        description: "Referenced consent identifier."
      - field: Data.Status
        type: String
        nullable: false
        description: "Standing-order status, e.g. InitiationPending or InitiationCompleted."
      - field: Data.CreationDateTime
        type: String
        nullable: false
        description: "ISO 8601 creation datetime."
      - field: Data.Initiation
        type: Object
        nullable: false
        description: "Echoed standing-order initiation block."
    error_codes:
      - code: 400
        message: "OB.Field.Invalid"
        retry: false
      - code: 401
        message: "UNAUTHORIZED"
        retry: false
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
        retry: false
      - code: 429
        message: "TOO_MANY_REQUESTS"
        retry: true
      - code: 500
        message: "OB.UnexpectedError"
        retry: true

  - id: get_domestic_standing_order
    method: GET
    path: "/obie/open-banking/v4.0/pisp/domestic-standing-orders/{DomesticStandingOrderId}"
    description: "Poll the status of a submitted domestic standing order. CE HSBCnet uses v3.1 at /ce/obie/open-banking/v3.1/pisp/domestic-standing-orders/{DomesticStandingOrderId}."
    auth_required: true
    scopes: [payments]
    request_schema: []
    response_schema:
      - field: Data.DomesticStandingOrderId
        type: String
        nullable: false
        description: "Standing-order resource identifier."
      - field: Data.Status
        type: String
        nullable: false
        description: "Current standing-order status."
      - field: Data.StatusUpdateDateTime
        type: String
        nullable: false
        description: "ISO 8601 datetime of the last status change."
    error_codes:
      - code: 400
        message: "OB.Field.Invalid"
        retry: false
      - code: 401
