source: "HSBC UK/CE Open Banking sandbox — paths/methods/brands T1 (inventory/by-category/account-information-sharing.json, 22 distinct endpoints); semantics + response objects T2 OBIE AISP v4.0 resources + T3 HSBC OpenAPI _downloads/portal/openapi/account-info-4.0-dbb.yaml (PREFERRED for field-level schemas) and docs/01-account-information-sharing.md. Paths are UK Personal v4.0 (canonical). Brand variance (noted per-endpoint, NOT duplicated): CE HSBCnet + Malta Personal run AIS on v3.1; CE HSBCnet + CE MiVision add a /ce path prefix; all other brands on v4.0. The 4 generic OAuth2 endpoints present in this inventory slice (Get CC Token, Get Access Token, Refresh Access Token, Initiate Consent Authorization — shared v1.1 /oauth2/token + /oauth2/authorize) are EXCLUDED here and live in the auth group; consent management here (POST/GET/DELETE account-access-consents) uses a Client Credentials token, all data-resource GETs use an Authorization Code token. Scope: accounts. CROSS-CUTTING (from auth group): mutual TLS on every call; detached-JWS x-jws-signature applies to write requests; x-fapi-financial-id header on every call. Most reads return data 200; an account with no matching resources returns 200 with an empty array (a non-existent AccountId returns 400, not 404)."
endpoints:
  - id: create_consent
    method: POST
    path: "/obie/open-banking/v4.0/aisp/account-access-consents"
    description: "Register an account-access-consent: the data-cluster Permissions, optional expiry and transaction window the PSU will authorise. ASPSP returns a ConsentId with initial Status AWAU (awaiting authorisation). Uses a client-credentials token. CE HSBCnet + Malta use /[ce/]obie/open-banking/v3.1/aisp/account-access-consents. OBIE objects: OBReadConsent1 (request) / OBReadConsentResponse1 (HTTP 201)."
    auth_required: true
    scopes: [accounts]
    request_schema:
      - field: Data.Permissions
        type: Array
        required: true
        validation: "1..n. Consented data clusters, enum incl. ReadAccountsBasic, ReadAccountsDetail, ReadBalances, ReadBeneficiariesBasic/Detail, ReadDirectDebits, ReadPAN, ReadParty, ReadProducts, ReadScheduledPaymentsBasic/Detail, ReadStandingOrdersBasic/Detail, ReadTransactionsBasic/Credits/Debits/Detail."
      - field: Data.ExpirationDateTime
        type: String
        required: false
        validation: "0..1 ISODateTime. Consent is open-ended if absent."
      - field: Data.TransactionFromDateTime
        type: String
        required: false
        validation: "0..1 ISODateTime. Start of the consented transaction query window."
      - field: Data.TransactionToDateTime
        type: String
        required: false
        validation: "0..1 ISODateTime. End of the consented transaction query window."
      - field: Risk
        type: Object
        required: true
        validation: "1..1 OBRisk2. No fields identified for the Risk section in AIS — sent as empty object {}."
    response_schema:
      - field: Data.ConsentId
        type: String
        nullable: false
        description: "Unique consent id, Max128Text (OBReadConsentResponse1)."
      - field: Data.Status
        type: String
        nullable: false
        description: "OBInternalConsentStatus1Code. Initial AWAU; enum AWAU|AUTH|RJCT|CANC|EXPD."
      - field: Data.StatusReason
        type: Array
        nullable: true
        description: "Optional status-reason entries (StatusReasonCode, StatusReasonDescription)."
      - field: Data.CreationDateTime
        type: String
        nullable: false
        description: "ISODateTime the consent resource was created."
      - field: Data.StatusUpdateDateTime
        type: String
        nullable: false
        description: "ISODateTime of the last status update."
      - field: Data.Permissions
        type: Array
        nullable: false
        description: "Echo of the consented permission clusters."
      - field: Data.ExpirationDateTime
        type: String
        nullable: true
        description: "Echo of requested expiry; open-ended if absent."
    error_codes:
      - code: 400
        message: "OB.Field.Invalid"
        retry: false
      - code: 401
        message: "UNAUTHORIZED"
        retry: false
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
        retry: false
      - code: 429
        message: "TOO_MANY_REQUESTS"
        retry: true
      - code: 500
        message: "OB.UnexpectedError"
        retry: true
