schema_version: "4.0"
api_group: kyc
name: "KYC API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-05-30"

endpoints:

  - id: get_kyc_documents
    method: GET
    path: "/v3.0.0/banks/{bank_id}/customers/{customer_id}/kyc_documents"
    description: "List all KYC identity documents submitted for a customer. Used on kyc-review screen to display document inventory with status and validity."
    auth_required: true
    request_schema: []
    response_schema:
      - field: kyc_document_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned unique KYC document identifier."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Parent customer identifier."
      - field: type
        type: String
        nullable: false
        description: "Document type — PASSPORT | NATIONAL_ID | DRIVING_LICENCE | BIRTH_CERTIFICATE | UTILITY_BILL."
      - field: number
        type: String
        nullable: false
        description: "Document reference number (e.g. passport number)."
      - field: issue_date
        type: String
        format: ISO-8601 date
        nullable: true
        description: "Document issue date (YYYY-MM-DD)."
      - field: issue_place
        type: String
        nullable: true
        description: "Issuing authority or place."
      - field: expiry_date
        type: String
        format: ISO-8601 date
        nullable: true
        description: "Document expiry date (YYYY-MM-DD). Null for non-expiring documents."
      - field: status
        type: String
        nullable: false
        description: "Review status — PENDING | VERIFIED | REJECTED | EXPIRED."
      - field: date_added
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Timestamp the document was submitted."
      - field: is_valid
        type: Boolean
        nullable: false
        description: "True if document is current, verified, and not expired."
    error_codes:
      - code: 400
        message: "BAD_REQUEST"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: upload_kyc_document
    method: PUT
    path: "/v2.0.0/banks/{bank_id}/customers/{customer_id}/kyc_documents/{kyc_document_id}"
    description: "Create or update a KYC document record for a customer. Caller supplies the kyc_document_id (PUT-idempotent). Used in customer-onboarding step 4 and kyc-review for document replacement."
    auth_required: true
    request_schema:
      - field: customer_number
        type: String
        required: true
        validation: "Bank-assigned customer reference number. Must match the customer at {customer_id}."
      - field: type
        type: String
        required: true
        validation: "Document type — one of: PASSPORT | NATIONAL_ID | DRIVING_LICENCE | BIRTH_CERTIFICATE | UTILITY_BILL."
      - field: number
        type: String
        required: true
        validation: "Document reference number. Max 100 characters."
      - field: issue_date
        type: String
        required: true
        validation: "ISO-8601 date (YYYY-MM-DD). Must not be in the future."
      - field: issue_place
        type: String
        required: false
        validation: "Issuing authority. Max 255 characters."
      - field: expiry_date
        type: String
        required: false
        validation: "ISO-8601 date (YYYY-MM-DD). Must be in the future if supplied."
    response_schema:
      - field: kyc_document_id
        type: String
        format: UUID
        nullable: false
        description: "Stored document identifier (caller-supplied)."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Parent customer identifier."
      - field: status
        type: String
        nullable: false
        description: "Review status after update."
      - field: is_valid
        type: Boolean
        nullable: false
        description: "Validity flag after update."
      - field: last_updated
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Timestamp of this update."
    error_codes:
      - code: 400
        message: "VALIDATION_FAILED"
        retry: false
      - code: 400
        message: "INVALID_DOCUMENT_TYPE"
        retry: false
      - code: 400
        message: "INVALID_DATE_FORMAT"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: get_kyc_checks
    method: GET
    path: "/v3.0.0/banks/{bank_id}/customers/{customer_id}/kyc_checks"
    description: "List all recorded KYC verification checks for a customer. Used on kyc-review screen to show check history and current verification status."
    auth_required: true
    request_schema: []
    response_schema:
      - field: id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned KYC check identifier."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Parent customer identifier."
      - field: customer_number
        type: String
        nullable: false
        description: "Bank customer reference number."
      - field: date
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Timestamp when the check was performed."
      - field: how
        type: String
        nullable: false
        description: "Verification method — in_person | online | postal."
      - field: staff_user_id
        type: String
        nullable: false
        description: "OBP user_id of the staff member who performed the check."
      - field: staff_name
        type: String
        nullable: false
        description: "Display name of the staff member."
      - field: satisfied
        type: Boolean
        nullable: false
        description: "True if the KYC check was passed."
      - field: comments
        type: String
        nullable: true
        description: "Free-text notes from the staff member."
    error_codes:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: record_kyc_check
    method: PUT
    path: "/v2.0.0/banks/{bank_id}/customers/{customer_id}/kyc_check/{kyc_check_id}"
    description: "Record a KYC verification check result. Caller supplies the kyc_check_id (PUT-idempotent). Used in customer-onboarding step 5 and kyc-review for submitting check outcomes."
    auth_required: true
    request_schema:
      - field: customer_number
        type: String
        required: true
        validation: "Bank-assigned customer reference number."
      - field: date
        type: String
        required: true
        validation: "ISO-8601 Instant when the check was performed."
      - field: how
        type: String
        required: true
        validation: "Verification method — one of: in_person | online | postal."
      - field: staff_user_id
        type: String
        required: true
        validation: "OBP user_id of the performing staff member."
      - field: staff_name
        type: String
        required: true
        validation: "Display name of the staff member. Max 255 characters."
      - field: satisfied
        type: Boolean
        required: true
        validation: "True if the customer passed the KYC check; false if rejected."
      - field: comments
        type: String
        required: false
        validation: "Optional reviewer notes. Max 1000 characters."
    response_schema:
      - field: id
        type: String
        format: UUID
        nullable: false
        description: "Stored check identifier (caller-supplied)."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Parent customer identifier."
      - field: satisfied
        type: Boolean
        nullable: false
        description: "Recorded pass/fail result."
    error_codes:
      - code: 400
        message: "VALIDATION_FAILED"
        retry: false
      - code: 400
        message: "INVALID_VERIFICATION_METHOD"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: set_kyc_status
    method: PUT
    path: "/v2.0.0/banks/{bank_id}/customers/{customer_id}/kyc_statuses"
    description: "Append a KYC status timeline entry for a customer. No caller-supplied ID — OBP auto-assigns. Used in customer-onboarding step 6 and kyc-review to finalize overall KYC status."
    auth_required: true
    request_schema:
      - field: customer_number
        type: String
        required: true
        validation: "Bank-assigned customer reference number."
      - field: ok
        type: Boolean
        required: true
        validation: "True to mark KYC complete and verified; false to mark failed or revoked."
      - field: date
        type: String
        required: true
        validation: "ISO-8601 Instant of the status change."
    response_schema:
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Customer identifier."
      - field: ok
        type: Boolean
        nullable: false
        description: "Stored KYC status value."
      - field: date
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Effective timestamp of this status entry."
    error_codes:
      - code: 400
        message: "INVALID_KYC_STATUS"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true
