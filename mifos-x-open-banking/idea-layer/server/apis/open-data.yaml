schema_version: "4.0"
api_group: open-data
name: "Open Data API"
base_url: "https://<brand-open-data-host>/open-banking/opendata/v2.4.0"
auth_scheme: none
api_version: v2.4.0
generated_at: "2026-06-11"
source: "[NOT IN POSTMAN + PORTAL UNREACHABLE — T2 OBIE Open Data v2.4.0; HSBC-specific base URL/availability not confirmed]. Open Data is not part of the consent-based Postman collection and the HSBC developer portal returned 429, so HSBC-specific Open Data hostnames and per-brand availability are NOT confirmed from a primary HSBC source. base_url is the OBIE Open Data standard pattern (per-brand host not invented). All endpoints are unauthenticated GET requests — no OAuth2 token, no /authorize, no TPP role or registration. Common response envelope: top-level meta (LastUpdated, TotalResults, Agreement, License, TermsOfUse) + data[].Brand[] (each Brand has BrandName + the product/resource array). Media type application/prs.openbanking.opendata.v2.x+json."
endpoints:
  - id: get_branches
    method: GET
    path: "/branches"
    description: "Branch Locator — return all branches per brand for a banking group. A branch may be Physical or Mobile; geolocation is the recommended primary locator. (T2 OBIE Open Data v2.4.0 branchlocator/branch-locator.html)."
    auth_required: false
    request_schema: []
    response_schema:
      - field: meta.LastUpdated
        type: String
        nullable: false
        description: "ISODateTime the dataset was last updated."
      - field: meta.TotalResults
        type: Integer
        nullable: false
        description: "Total number of results in the response."
      - field: data[].Brand[].BrandName
        type: String
        nullable: false
        description: "Brand name owning the branches."
      - field: data[].Brand[].Branch[].Identification
        type: String
        nullable: false
        description: "Unique branch identifier."
      - field: data[].Brand[].Branch[].SequenceNumber
        type: String
        nullable: true
        description: "00 = main branch; 01..n = sub/mobile branch."
      - field: data[].Brand[].Branch[].Name
        type: String
        nullable: true
        description: "Branch name."
      - field: data[].Brand[].Branch[].Type
        type: String
        nullable: false
        description: "Physical | Mobile."
      - field: data[].Brand[].Branch[].CustomerSegment
        type: Array
        nullable: true
        description: "Customer segments served by the branch."
      - field: data[].Brand[].Branch[].Accessibility
        type: Array
        nullable: true
        description: "Accessibility provisions at the branch."
      - field: data[].Brand[].Branch[].OtherServiceAndFacility
        type: Array
        nullable: true
        description: "Other services/facilities (Code, Name)."
      - field: data[].Brand[].Branch[].Availability.StandardAvailability.Day
        type: Array
        nullable: true
        description: "Per-day opening hours (Name, OpeningHours[] with OpeningTime/ClosingTime) plus non-standard/seasonal availability."
      - field: data[].Brand[].Branch[].ContactInfo
        type: Array
        nullable: true
        description: "Contact entries (ContactType, ContactContent)."
      - field: data[].Brand[].Branch[].PostalAddress
        type: Object
        nullable: false
        description: "AddressLine[], TownName, CountrySubDivision[], Country, PostCode, GeoLocation.GeographicCoordinates.Latitude/Longitude."
    error_codes:
      - code: 400
        message: "Bad Request"
        retry: false
      - code: 429
        message: "TOO_MANY_REQUESTS"
        retry: true
      - code: 500
        message: "Internal Server Error"
        retry: true
  - id: get_atms
    method: GET
    path: "/atms"
    description: "ATM Locator — return all ATMs per brand for a banking group, with services, accessibility, supported languages, location, base currency and minimum withdrawable amount. (T2 OBIE Open Data v2.4.0 atmlocator/atm-locator.html)."
    auth_required: false
    request_schema: []
    response_schema:
      - field: meta.LastUpdated
        type: String
        nullable: false
        description: "ISODateTime the dataset was last updated."
      - field: meta.TotalResults
        type: Integer
        nullable: false
        description: "Total number of results in the response."
      - field: data[].Brand[].BrandName
        type: String
        nullable: false
        description: "Brand name owning the ATMs."
      - field: data[].Brand[].ATM[].Identification
        type: String
        nullable: false
        description: "Unique ATM identifier."
      - field: data[].Brand[].ATM[].SupportedLanguages
        type: Array
        nullable: true
        description: "ISO 639-1 language codes supported."
      - field: data[].Brand[].ATM[].ATMServices
        type: Array
        nullable: true
        description: "e.g. CashWithdrawal, PINChange, Balance, MiniStatement."
      - field: data[].Brand[].ATM[].OtherATMServices
        type: Array
        nullable: true
        description: "Proprietary service codes."
      - field: data[].Brand[].ATM[].Accessibility
        type: Array
        nullable: true
        description: "Accessibility provisions (+ OtherAccessibility[])."
      - field: data[].Brand[].ATM[].SupportedCurrencies
        type: Array
        nullable: true
        description: "Currently restricted to GBP."
      - field: data[].Brand[].ATM[].MinimumPossibleAmount
        type: String
        nullable: true
        description: "Minimum withdrawable amount (distinct from minimum denomination)."
      - field: data[].Brand[].ATM[].Branch.Identification
        type: String
        nullable: true
        description: "Parent branch link."
      - field: data[].Brand[].ATM[].Location.PostalAddress
        type: Object
        nullable: false
        description: "StreetName, TownName, Country, PostCode, GeoLocation.GeographicCoordinates.Latitude/Longitude; plus Location.Site.Name."
    error_codes:
      - code: 400
        message: "Bad Request"
        retry: false
      - code: 429
        message: "TOO_MANY_REQUESTS"
        retry: true
      - code: 500
        message: "Internal Server Error"
        retry: true
