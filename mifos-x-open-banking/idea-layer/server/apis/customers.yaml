  - id: add_customer_attribute
    method: POST
    path: "/v4.0.0/banks/{bank_id}/customers/{customer_id}/attribute"
    description: "Add a custom attribute to a customer record (step 7 of customer-onboarding). Used for extended profile fields not in the core schema."
    auth_required: true
    request_schema:
      - field: name
        type: String
        required: true
        validation: "Attribute key name. Must be unique per customer. Max 50 characters, snake_case."
      - field: type
        type: String
        required: true
        validation: "One of: STRING | INTEGER | DOUBLE | DATE_WITH_DAY | BOOLEAN."
      - field: value
        type: String
        required: true
        validation: "Attribute value serialized as string. Must match declared type."
    response_schema:
      - field: customer_attribute_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned attribute identifier."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Parent customer identifier."
      - field: name
        type: String
        nullable: false
        description: "Attribute key name."
      - field: type
        type: String
        nullable: false
        description: "Data type."
      - field: value
        type: String
        nullable: false
        description: "Stored value."
    error_codes:
      - code: 400
        message: "INVALID_CUSTOMER_ATTRIBUTE"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: link_user_to_customer
    method: POST
    path: "/v4.0.0/banks/{bank_id}/user_customer_links"
    description: "Link an OBP user account to a customer record (step 8 of customer-onboarding). Grants the user access to this customer's accounts."
    auth_required: true
    request_schema:
      - field: user_id
        type: String
        required: true
        validation: "OBP user_id (UUID) of the user to link."
      - field: customer_id
        type: String
        required: true
        validation: "OBP customer_id (UUID) of the target customer."
    response_schema:
      - field: user_customer_link_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned link identifier."
      - field: user_id
        type: String
