        type: String
        format: UUID
        nullable: false
        description: "Parent customer identifier."
      - field: domain
        type: String
        nullable: false
        description: "Tax jurisdiction."
      - field: tax_number
        type: String
        nullable: false
        description: "Tax identification number."
