        nullable: false
        description: "Bank identifier (e.g. 'rbs')."
      - field: customer_number
        type: String
        nullable: false
        description: "Bank-assigned customer reference number."
      - field: legal_name
        type: String
        nullable: false
        description: "Full legal name."
      - field: title
        type: String
        nullable: true
        description: "Salutation title — Mr, Mrs, Dr, etc."
      - field: name_suffix
        type: String
        nullable: true
