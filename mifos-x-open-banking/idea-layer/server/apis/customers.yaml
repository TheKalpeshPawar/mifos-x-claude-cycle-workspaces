        type: Address
        nullable: true
        description: "Object containing line1, line2, city, county, state, postcode, country_code."
      - field: employment_details
        type: EmploymentDetails
        nullable: true
        description: "Object containing employer_name, title, employment_type, start_date."
      - field: kyc_status
        type: Boolean
