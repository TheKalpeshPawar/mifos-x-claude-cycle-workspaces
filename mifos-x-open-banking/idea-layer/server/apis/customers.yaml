schema_version: "4.0"
api_group: customers
name: "Customers (Field Officer) API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-05-30"

endpoints:

  - id: search_customers
    method: GET
    path: "/v3.0.0/banks/{bank_id}/customers"
    description: "Search customers by query parameters — supports name, phone, email, customer number, or status filter. Used on customer-search screen roster."
    auth_required: true
    request_schema:
      - field: query
        type: String
        required: false
        validation: "Free-text search term matched against legal_name and customer_number."
      - field: status
        type: String
        required: false
        validation: "Filter by KYC status — e.g. 'VERIFIED', 'PENDING', 'REJECTED'."
      - field: customer_number
        type: String
        required: false
        validation: "Exact match on customer_number field."
      - field: email
        type: String
        required: false
        validation: "Exact match on email — must be valid RFC 5321 format."
      - field: mobile_phone_number
        type: String
        required: false
        validation: "E.164 format preferred (e.g. +254712345678)."
      - field: legal_name
        type: String
        required: false
        validation: "Partial match allowed. Max 255 characters."
    response_schema:
      - field: customers
        type: "List<Customer>"
        nullable: false
        description: "Ordered list of matching customer records."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned unique customer identifier."
      - field: legal_name
        type: String
        nullable: false
        description: "Full legal name of the customer."
      - field: kyc_status
        type: String
        nullable: false
        description: "Current KYC status — VERIFIED | PENDING | REJECTED | INCOMPLETE."
      - field: customer_number
        type: String
        nullable: false
        description: "Bank-assigned customer reference number."
      - field: mobile_phone_number
        type: String
        nullable: true
        description: "Primary mobile number in E.164 format."
      - field: email
        type: String
        format: email
        nullable: true
        description: "Registered email address."
      - field: date_of_birth
        type: String
        format: ISO-8601 date
        nullable: true
        description: "Customer date of birth (YYYY-MM-DD)."
      - field: last_ok_date
        type: String
        format: ISO-8601 Instant
        nullable: true
        description: "Timestamp of last successful KYC verification."
    error_codes:
      - code: 400
        message: "INVALID_SEARCH_PARAMETERS"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: search_customers_by_phone
    method: POST
    path: "/v4.0.0/banks/{bank_id}/search/customers/mobile-phone-number"
    description: "Search customer by exact mobile phone number match. Returns list of matching customers."
    auth_required: true
    request_schema:
      - field: mobile_phone_number
        type: String
        required: true
        validation: "E.164 format required (e.g. +254712345678). Exact match only."
    response_schema:
      - field: customers
        type: "List<Customer>"
        nullable: false
        description: "Customers matching the provided mobile number."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned unique customer identifier."
      - field: legal_name
        type: String
        nullable: false
        description: "Full legal name of the customer."
    error_codes:
      - code: 400
        message: "INVALID_PHONE_NUMBER"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

