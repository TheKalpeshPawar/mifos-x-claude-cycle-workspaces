  - id: create_customer
    method: POST
    path: "/v5.0.0/banks/{bank_id}/customers"
    description: "Create a new individual customer record (step 1 of customer-onboarding flow). Returns the new customer_id for subsequent onboarding steps."
    auth_required: true
    request_schema:
      - field: legal_name
        type: String
        required: true
        validation: "Full legal name. Min 2, max 255 characters."
      - field: mobile_phone_number
        type: String
        required: true
        validation: "E.164 format (e.g. +254712345678). Must be unique per bank."
      - field: email
        type: String
        required: false
        validation: "Valid RFC 5321 email. Max 254 characters."
      - field: date_of_birth
        type: String
        required: true
        validation: "ISO-8601 date (YYYY-MM-DD). Must be ≥18 years ago."
      - field: title
        type: String
        required: false
        validation: "One of: Mr | Mrs | Ms | Dr | Prof | Rev."
      - field: relationship_status
        type: String
        required: false
        validation: "One of: SINGLE | MARRIED | DIVORCED | WIDOWED."
      - field: employment_status
        type: String
        required: false
        validation: "One of: EMPLOYED | SELF_EMPLOYED | UNEMPLOYED | RETIRED | STUDENT."
      - field: credit_rating
        type: CreditRating
        required: false
        validation: "Object with rating (String) and source (String)."
      - field: credit_limit
        type: Amount
        required: false
        validation: "Object with amount (String, numeric) and currency (ISO-4217 3-letter code)."
      - field: face_image
        type: FaceImage
        required: false
        validation: "Object with url (HTTPS) and date (ISO-8601)."
      - field: branch_id
        type: String
        required: false
        validation: "Valid branch identifier within the bank."
    response_schema:
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned unique customer identifier — required for subsequent onboarding steps."
      - field: legal_name
        type: String
        nullable: false
        description: "Confirmed legal name stored."
      - field: customer_number
        type: String
        nullable: false
        description: "Bank-assigned customer reference number."
      - field: customer_type
        type: String
        nullable: false
        description: "INDIVIDUAL for this endpoint."
      - field: kyc_status
        type: Boolean
        nullable: false
        description: "False on creation — KYC steps complete this."
    error_codes:
      - code: 400
        message: "INVALID_CUSTOMER_DATA"
        retry: false
      - code: 400
        message: "INVALID_DATE_OF_BIRTH"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 409
        message: "CUSTOMER_ALREADY_EXISTS"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: create_corporate_customer
    method: POST
    path: "/v3.0.0/banks/{bank_id}/customers"
    description: "Create a new corporate/business customer record (corporate-onboarding screen). Variant of create_customer with corporate type payload."
    auth_required: true
    request_schema:
      - field: legal_name
        type: String
        required: true
        validation: "Registered company legal name. Max 255 characters."
      - field: mobile_phone_number
        type: String
        required: true
        validation: "Corporate contact number in E.164 format."
      - field: email
        type: String
        required: false
        validation: "Corporate email. Valid RFC 5321. Max 254 characters."
      - field: customer_type
        type: String
        required: true
        validation: "Must be CORPORATE."
      - field: title
        type: String
        required: false
        validation: "Corporate designation e.g. Ltd, Inc, PLC."
      - field: employment_status
        type: String
        required: false
        validation: "For corporate: INCORPORATED | PARTNERSHIP | SOLE_TRADER."
      - field: credit_rating
        type: CreditRating
        required: false
        validation: "Object with rating and source."
      - field: credit_limit
        type: Amount
        required: false
        validation: "Object with amount and ISO-4217 currency."
      - field: branch_id
        type: String
        required: false
        validation: "Assigned branch identifier."
    response_schema:
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned unique customer identifier."
      - field: legal_name
        type: String
        nullable: false
        description: "Confirmed legal name stored."
      - field: customer_number
        type: String
        nullable: false
        description: "Bank-assigned customer reference number."
      - field: customer_type
        type: String
        nullable: false
        description: "CORPORATE for this endpoint."
      - field: kyc_status
        type: Boolean
        nullable: false
        description: "False on creation."
    error_codes:
      - code: 400
        message: "VALIDATION_FAILED"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 409
        message: "CUSTOMER_ALREADY_EXISTS"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: update_customer
    method: PUT
    path: "/v3.0.0/banks/{bank_id}/customers/{customer_id}"
    description: "Update mutable customer fields on customer-profile screen. Returns the updated customer record."
    auth_required: true
    request_schema:
      - field: legal_name
        type: String
        required: false
        validation: "Full legal name. Min 2, max 255 characters."
      - field: mobile_phone_number
        type: String
        required: false
        validation: "E.164 format. Must be unique per bank."
      - field: email
        type: String
        required: false
        validation: "Valid RFC 5321 email. Max 254 characters."
      - field: title
        type: String
        required: false
        validation: "One of: Mr | Mrs | Ms | Dr | Prof | Rev."
      - field: relationship_status
        type: String
        required: false
        validation: "One of: SINGLE | MARRIED | DIVORCED | WIDOWED."
      - field: dependants
        type: Int
        required: false
        validation: "Non-negative integer. Max 20."
      - field: highest_education_attained
        type: String
        required: false
        validation: "Free text. Max 100 characters."
      - field: employment_status
        type: String
        required: false
        validation: "One of: EMPLOYED | SELF_EMPLOYED | UNEMPLOYED | RETIRED | STUDENT."
      - field: credit_rating
        type: CreditRating
        required: false
        validation: "Object with rating and source."
      - field: credit_limit
        type: Amount
        required: false
        validation: "Object with amount (String) and currency (ISO-4217)."
      - field: face_image
        type: FaceImage
        required: false
        validation: "Object with url (HTTPS) and date (ISO-8601)."
      - field: branch_id
        type: String
        required: false
        validation: "Valid branch identifier."
    response_schema:
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Customer identifier (unchanged)."
      - field: legal_name
        type: String
        nullable: false
        description: "Updated legal name."
      - field: last_ok_date
        type: String
        format: ISO-8601 Instant
        nullable: true
        description: "Updated last-ok timestamp."
    error_codes:
      - code: 400
        message: "VALIDATION_FAILED"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: add_customer_address
    method: POST
    path: "/v3.1.0/banks/{bank_id}/customers/{customer_id}/address"
    description: "Add a physical address to a customer record (step 2 of customer-onboarding flow)."
    auth_required: true
    request_schema:
      - field: line_1
        type: String
        required: true
        validation: "Street address line 1. Max 255 characters."
      - field: line_2
        type: String
        required: false
        validation: "Street address line 2. Max 255 characters."
      - field: line_3
        type: String
        required: false
        validation: "Street address line 3. Max 255 characters."
      - field: city
        type: String
        required: true
        validation: "City name. Max 100 characters."
      - field: county
        type: String
        required: false
        validation: "County or district. Max 100 characters."
      - field: state
        type: String
        required: false
        validation: "State or province. Max 100 characters."
      - field: postcode
        type: String
        required: true
        validation: "Postal code. Max 20 characters."
      - field: country_code
        type: String
        required: true
        validation: "ISO-3166-1 alpha-2 country code (e.g. 'KE', 'GB')."
      - field: tags
        type: "List<String>"
        required: false
        validation: "Address tags — HOME | WORK | CORRESPONDENCE. At least one required if specified."
      - field: status
        type: String
        required: false
        validation: "One of: VERIFIED | UNVERIFIED. Defaults to UNVERIFIED."
    response_schema:
      - field: customer_address_id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned address identifier."
      - field: customer_id
        type: String
        format: UUID
        nullable: false
        description: "Parent customer identifier."
      - field: line_1
        type: String
        nullable: false
        description: "Stored address line 1."
      - field: city
        type: String
        nullable: false
        description: "Stored city."
      - field: country_code
        type: String
        nullable: false
        description: "ISO-3166-1 alpha-2 code."
      - field: status
        type: String
        nullable: false
        description: "VERIFIED or UNVERIFIED."
      - field: insert_date
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Timestamp address was added."
    error_codes:
