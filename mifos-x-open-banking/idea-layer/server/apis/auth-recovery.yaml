schema_version: "4.0"
api_group: auth_recovery
name: "Auth Recovery API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-05-28"

endpoints:

  - id: initiate_password_reset
    method: POST
    path: "/v4.0.0/auth/password/reset/initiate"
    description: "Initiate a password reset flow. Sends a time-limited reset token to the user's registered email. Does not confirm whether the email exists to prevent enumeration."
    auth_required: false
    request_schema:
      - field: email
        type: String
        required: true
        validation: "Must be a valid RFC 5321 email address. Max 254 characters."
    response_schema:
      - field: message
        type: String
        nullable: false
        description: "Always 'If this email is registered, a reset link has been sent.' — intentionally non-committal to prevent user enumeration."
    error_codes:
      - code: 400
        message: "INVALID_EMAIL"
        description: "Email field is missing or malformed."
        retry: false
      - code: 404
        message: "USER_NOT_FOUND"
        description: "No user is registered with this email. Returned only in internal logs — client receives generic message."
        retry: false
      - code: 429
        message: "RATE_LIMIT_EXCEEDED"
        description: "Too many reset requests from this IP. Retry after 60 seconds."
        retry: true
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: confirm_password_reset
    method: POST
    path: "/v4.0.0/auth/password/reset/confirm"
    description: "Complete the password reset flow using the token delivered by email. Token is single-use and expires after 15 minutes."
    auth_required: false
    request_schema:
      - field: token
        type: String
        required: true
        validation: "Opaque reset token from the reset email. Single-use. Expires 15 minutes after issue."
      - field: new_password
        type: String
        required: true
        validation: "Minimum 12 characters. Must contain at least one uppercase letter, one digit, and one special character."
    response_schema:
      - field: message
        type: String
        nullable: false
        description: "Success confirmation message — 'Password reset successfully. Please log in with your new credentials.'"
    error_codes:
      - code: 400
        message: "INVALID_TOKEN"
        description: "Token format is invalid or was already used."
        retry: false
      - code: 400
        message: "WEAK_PASSWORD"
        description: "New password does not meet complexity requirements."
        retry: false
      - code: 410
        message: "TOKEN_EXPIRED"
        description: "Reset token has expired (15-minute window). Initiate a new reset."
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: change_password
    method: POST
    path: "/v4.0.0/users/current/password"
    description: "Change the authenticated user's password. Requires the current password for re-verification. Invalidates all existing DirectLogin tokens on success."
    auth_required: true
    request_schema:
      - field: current_password
        type: String
        required: true
        validation: "Current DirectLogin password for the authenticated user."
      - field: new_password
        type: String
        required: true
        validation: "Minimum 12 characters. Must contain at least one uppercase letter, one digit, and one special character. Must differ from current_password."
    response_schema:
      - field: message
        type: String
        nullable: false
        description: "Success message — 'Password changed successfully. All sessions have been invalidated.'"
    error_codes:
      - code: 400
        message: "WEAK_PASSWORD"
        description: "New password does not meet complexity requirements."
        retry: false
      - code: 400
        message: "SAME_AS_CURRENT"
        description: "New password must differ from the current password."
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 401
        message: "INVALID_CURRENT_PASSWORD"
        description: "The supplied current_password does not match the account password."
        retry: false
      - code: 429
        message: "RATE_LIMIT_EXCEEDED"
        description: "Too many failed attempts. Account temporarily locked. Retry after 300 seconds."
        retry: true
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true
