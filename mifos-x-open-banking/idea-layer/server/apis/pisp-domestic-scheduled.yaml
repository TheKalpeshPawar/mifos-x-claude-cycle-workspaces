  - id: create_domestic_scheduled_payment
    method: POST
    path: "/obie/open-banking/v4.0/pisp/domestic-scheduled-payments"
    description: "Submits the authorised scheduled payment for processing. Creatable only when the consent Status is AUTH; Initiation/Risk must match the consent or ASPSP returns 400. Initial Status is RCVD or RJCT. Authorization Code grant. CE HSBCnet: POST /ce/obie/open-banking/v3.1/pisp/domestic-scheduled-payments."
    auth_required: true
    scopes: [payments]
    request_schema:
      - field: Data.ConsentId
        type: String
        required: true
        validation: "Identifier of the authorised consent (OBWriteDomesticScheduled2). Ties the payment to the consent."
      - field: Data.Initiation.InstructionIdentification
        type: String
        required: true
        validation: "Must equal the consent Initiation."
      - field: Data.Initiation.LocalInstrument
        type: String
        required: false
        validation: "Payment scheme, e.g. UK.OBIE.CHAPS."
      - field: Data.Initiation.RequestedExecutionDateTime
        type: String
        required: true
        validation: "ISODateTime. Must equal the consent."
      - field: Data.Initiation.InstructedAmount.Amount
        type: String
        required: true
        validation: "Decimal string. Must equal the consent."
      - field: Data.Initiation.InstructedAmount.Currency
        type: String
        required: true
        validation: "ISO 4217 currency code. Must equal the consent."
      - field: Data.Initiation.CreditorAccount.Identification
        type: String
        required: true
        validation: "Creditor account identification. Must equal the consent."
      - field: Data.Initiation.CreditorAccount.Name
        type: String
        required: true
        validation: "Creditor account name."
      - field: Data.Initiation.RemittanceInformation.Reference
        type: String
        required: false
        validation: "Remittance reference."
      - field: Risk.PaymentContextCode
        type: String
        required: true
        validation: "Must equal the consent Risk block."
    response_schema:
      - field: Data.DomesticScheduledPaymentId
        type: String
        nullable: false
        description: "ASPSP-assigned scheduled-payment resource id (OBWriteDomesticScheduledResponse5)."
      - field: Data.ConsentId
        type: String
        nullable: false
        description: "Identifier of the consent this payment was created from."
      - field: Data.CreationDateTime
        type: String
        nullable: false
        description: "ISODateTime the payment resource was created."
      - field: Data.Status
        type: String
        nullable: false
        description: "Initial status RCVD or RJCT."
      - field: Data.StatusUpdateDateTime
        type: String
        nullable: false
        description: "ISODateTime of the last status update."
      - field: Data.StatusReason
        type: Array
        nullable: true
        description: "Optional StatusReason[]."
      - field: Data.ExpectedExecutionDateTime
        type: String
        nullable: true
        description: "Expected execution date/time."
      - field: Data.ExpectedSettlementDateTime
