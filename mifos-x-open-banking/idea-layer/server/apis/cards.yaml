schema_version: "4.0"
api_group: cards
name: "Cards API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-06-02"

endpoints:

  - id: list_my_cards
    method: GET
    path: "/v7.0.0/cards"
    description: "List every payment card belonging to the authenticated user across all accounts. Source-added (getCardsForCurrentUser) as the primary feed for the My Cards hub — the account-scoped v3 list_cards remains for per-account drill-down."
    auth_required: true
    request_schema: []
    response_schema:
      - field: cards
        type: "List<Card>"
        nullable: false
        description: "All cards for the current user."
      - field: cards[].id
        type: String
        nullable: false
        description: "Unique card identifier within OBP."
      - field: cards[].bank_id
        type: String
        nullable: false
        description: "Issuing bank identifier."
      - field: cards[].bank_card_number
        type: String
        nullable: false
        description: "Masked card PAN — full PAN never returned."
      - field: cards[].name_on_card
        type: String
        nullable: false
        description: "Cardholder name embossed on the card."
      - field: cards[].expires_date
        type: String
        format: ISO-8601 Date
        nullable: false
        description: "Card expiry date (YYYY-MM-DD)."
      - field: cards[].enabled
        type: Boolean
        nullable: false
        description: "True if the card is currently active."
      - field: cards[].card_type
        type: String
        nullable: true
        description: "Card product type — 'DEBIT', 'CREDIT', 'PREPAID'."
      - field: cards[].card_network
        type: String
        nullable: true
        description: "Primary payment network — e.g. 'VISA', 'MASTERCARD'."
    error_codes:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: list_cards
    method: GET
    path: "/v3.0.0/banks/{bank_id}/accounts/{account_id}/cards"
    description: "List all payment cards linked to an account. Powers the cards screen card grid showing each card's number, type, network, and enabled status."
    auth_required: true
    request_schema: []
    response_schema:
      - field: id
        type: String
        nullable: false
        description: "Unique card identifier within OBP."
      - field: bank_id
        type: String
        nullable: false
        description: "Bank identifier for the issuing bank."
      - field: bank_card_number
        type: String
        nullable: false
        description: "Masked card PAN — e.g. '**** **** **** 4242'. Full PAN is never returned."
      - field: name_on_card
        type: String
        nullable: false
        description: "Cardholder name embossed on the card."
      - field: issue_number
        type: String
        nullable: true
        description: "Card issue number (used by some UK schemes)."
      - field: serial_number
        type: String
        nullable: true
        description: "Physical card serial number for device-binding."
      - field: valid_from_date
        type: String
        format: ISO-8601 Date
        nullable: true
        description: "Card validity start date (YYYY-MM-DD). Null for some card types."
      - field: expires_date
        type: String
        format: ISO-8601 Date
        nullable: false
        description: "Card expiry date (YYYY-MM-DD)."
      - field: enabled
        type: Boolean
        nullable: false
        description: "True if the card is currently active and can be used for transactions."
      - field: cancelled
        type: Boolean
        nullable: false
        description: "True if the card has been permanently cancelled."
      - field: card_type
        type: String
        nullable: true
        description: "Card product type — e.g. 'DEBIT', 'CREDIT', 'PREPAID'."
      - field: card_description
        type: String
        nullable: true
        description: "Human-readable product description for the card."
      - field: card_network
        type: String
        nullable: true
        description: "Payment network — e.g. 'VISA', 'MASTERCARD'."
      - field: technology_type
        type: String
        nullable: true
        description: "Card technology — e.g. 'CHIP_AND_PIN', 'CONTACTLESS'."
      - field: networks
        type: "List<String>"
        nullable: true
        description: "All payment networks this card is enrolled in (may include multiple for co-badged cards)."
      - field: allows
        type: "List<String>"
        nullable: false
        description: "Capabilities enabled on this card — e.g. ['credit', 'debit', 'cash', 'deposit', 'foreign_exchange']."
    error_codes:
      - code: 400
        message: "INVALID_BANK_ID"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: get_card_detail
    method: GET
    path: "/v3.0.0/banks/{bank_id}/accounts/{account_id}/cards/{card_id}"
    description: "Get full detail for a single card. Powers the card-detail screen showing all card metadata, limits, capability flags, and status controls."
    auth_required: true
    request_schema: []
    response_schema:
      - field: id
        type: String
        nullable: false
        description: "Unique card identifier."
      - field: bank_id
        type: String
        nullable: false
        description: "Issuing bank identifier."
      - field: bank_card_number
        type: String
        nullable: false
        description: "Masked card PAN."
      - field: name_on_card
        type: String
        nullable: false
        description: "Cardholder name as printed on the card."
      - field: issue_number
        type: String
        nullable: true
        description: "Card issue sequence number."
      - field: serial_number
        type: String
        nullable: true
        description: "Physical card serial number."
      - field: valid_from_date
        type: String
        format: ISO-8601 Date
        nullable: true
        description: "Card valid-from date (YYYY-MM-DD)."
      - field: expires_date
        type: String
        format: ISO-8601 Date
        nullable: false
        description: "Card expiry date (YYYY-MM-DD). Displayed on card-detail header."
      - field: enabled
        type: Boolean
        nullable: false
        description: "Whether the card can currently be used for payments."
      - field: cancelled
        type: Boolean
        nullable: false
        description: "True if the card is permanently cancelled and cannot be re-enabled."
      - field: card_type
        type: String
        nullable: true
        description: "Card product type — 'DEBIT', 'CREDIT', or 'PREPAID'."
      - field: card_description
        type: String
        nullable: true
        description: "Full product description text for display on card-detail."
      - field: card_network
        type: String
        nullable: true
        description: "Primary payment network (e.g. 'VISA', 'MASTERCARD')."
      - field: technology_type
        type: String
        nullable: true
        description: "Physical / digital card technology identifier."
      - field: networks
        type: "List<String>"
        nullable: true
        description: "All networks this card is co-badged with."
      - field: allows
        type: "List<String>"
        nullable: false
        description: "Enabled capabilities list — subset of ['credit', 'debit', 'cash', 'deposit', 'foreign_exchange', 'online', 'contactless']."
      - field: replacement_date
        type: "String?"
        format: ISO-8601 Date
        nullable: true
        description: "Date a replacement card was or will be issued; null if no replacement in progress."
      - field: pin_reset_url
        type: "String?"
        nullable: true
        description: "Deep-link URL for PIN reset flow if supported by the bank."
    error_codes:
      - code: 400
        message: "INVALID_BANK_ID"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"
        retry: false
      - code: 404
        message: "CARD_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true
