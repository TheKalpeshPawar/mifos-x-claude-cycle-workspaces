source: "HSBC UK/CE Open Banking sandbox — paths/methods/brands T1 (inventory/by-category/confirmation-of-funds.json); semantics/schemas T2 OBIE CBPII v4.0 (no HSBC develop.hsbc.com portal capture for Confirmation of Funds). 9 brands offer CBPII (Malta Personal does NOT). CE HSBCnet uses v3.1 + a /ce path prefix; CE MiVision uses v4.0 + /ce; all other brands use v4.0. Generic OAuth2 endpoints (Get CC Token, Get Access Token, Refresh Access Token, Initiate Consent Authorization — shared v1.1 /oauth2/token + /oauth2/authorize) belong to the auth group and are excluded here. Grant types: consent management (POST/GET/DELETE funds-confirmation-consents) uses Client Credentials; POST funds-confirmations uses Authorization Code. Scope: fundsconfirmations. Message signing: No. Idempotency key: No."
endpoints:
  - id: create_funds_confirmation_consent
    method: POST
    path: "/obie/open-banking/v4.0/cbpii/funds-confirmation-consents"
    description: "CBPII registers a long-lived funds-confirmation-consent (DebtorAccount + optional expiry); the ASPSP returns a unique ConsentId with initial Status AWAU. Uses a client-credentials token. CE HSBCnet uses /ce/obie/open-banking/v3.1/cbpii/funds-confirmation-consents; CE MiVision uses /ce/obie/open-banking/v4.0/.... OBIE object: OBFundsConfirmationConsent1 (request) / OBFundsConfirmationConsentResponse1 (response)."
    auth_required: true
    scopes: [fundsconfirmations]
    request_schema:
      - field: Data.ExpirationDateTime
        type: String
        required: false
        validation: "ISODateTime. Open-ended consent if absent (0..1)."
      - field: Data.DebtorAccount.SchemeName
        type: String
        required: true
        validation: "OBInternalAccountIdentification4Code, e.g. UK.OBIE.IBAN (1..1)."
      - field: Data.DebtorAccount.Identification
        type: String
        required: true
        validation: "Max256Text — account identifier funds are confirmed against (1..1)."
      - field: Data.DebtorAccount.Name
        type: String
        required: false
        validation: "Max350Text (0..1)."
      - field: Data.DebtorAccount.SecondaryIdentification
        type: String
        required: false
        validation: "Max34Text — e.g. building-society roll number (0..1)."
      - field: Data.DebtorAccount.Proxy
        type: Object
        required: false
        validation: "OBProxy1 (0..1)."
    response_schema:
      - field: Data.ConsentId
        type: String
        nullable: false
        description: "Unique funds-confirmation-consent id, Max128Text (OBFundsConfirmationConsentResponse1)."
      - field: Data.CreationDateTime
        type: String
        nullable: false
        description: "ISODateTime the consent resource was created."
      - field: Data.Status
        type: String
        nullable: false
        description: "OBInternalConsentStatus1Code. Initial value AWAU; enum AWAU|RJCT|AUTH|CANC|EXPD."
      - field: Data.StatusReason
        type: Array
        nullable: true
        description: "Optional status-reason entries (StatusReasonCode, StatusReasonDescription)."
      - field: Data.StatusUpdateDateTime
        type: String
        nullable: false
        description: "ISODateTime of the last status update."
      - field: Data.ExpirationDateTime
        type: String
        nullable: true
        description: "Echo of requested expiry; open-ended if absent."
      - field: Data.DebtorAccount.SchemeName
        type: String
        nullable: false
        description: "Echoed account scheme name (OBCashAccountDebtor4)."
      - field: Data.DebtorAccount.Identification
        type: String
        nullable: false
        description: "Echoed account identification (may be masked by the ASPSP)."
      - field: Data.DebtorAccount.Name
        type: String
        nullable: true
        description: "Echoed account name."
      - field: Links.Self
        type: String
        nullable: true
        description: "Self link to the created consent resource."
    error_codes:
      - code: 400
        message: "OB.Field.Invalid"
        retry: false
