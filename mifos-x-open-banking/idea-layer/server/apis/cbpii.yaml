  - id: create_funds_confirmation
    method: POST
    path: "/obie/open-banking/v4.0/cbpii/funds-confirmations"
    description: "CBPII confirms whether funds are available in the payment account; the ASPSP returns a unique FundsConfirmationId and a FundsAvailable boolean. Requires an authorization-code-grant token, must specify the ConsentId in the payload, and the InstructedAmount must be in the currency of the underlying account (otherwise the ASPSP rejects). CE HSBCnet uses /ce/obie/open-banking/v3.1/cbpii/funds-confirmations; CE MiVision uses /ce/obie/open-banking/v4.0/.... OBIE object: OBFundsConfirmation1 (request) / OBFundsConfirmationResponse1 (response)."
    auth_required: true
    scopes: [fundsconfirmations]
    request_schema:
      - field: Data.ConsentId
        type: String
        required: true
        validation: "Max128Text — must match the funds-confirmation-consent (1..1)."
      - field: Data.Reference
        type: String
        required: true
        validation: "Max35Text — CBPII's unique reference for the check (1..1)."
      - field: Data.InstructedAmount.Amount
        type: String
        required: true
        validation: "Decimal string, pattern ^\\d{1,13}$|^\\d{1,13}\\.\\d{1,5}$ (1..1)."
      - field: Data.InstructedAmount.Currency
        type: String
        required: true
        validation: "ISO 4217, pattern ^[A-Z]{3,3}$; must match the account currency (1..1)."
    response_schema:
      - field: Data.FundsConfirmationId
        type: String
        nullable: false
        description: "Unique funds-confirmation resource id, Max40Text (OBFundsConfirmationResponse1)."
      - field: Data.FundsAvailable
        type: Boolean
        nullable: false
        description: "Result of the funds-availability check."
      - field: Data.ConsentId
        type: String
        nullable: false
        description: "Echoed funds-confirmation-consent id."
      - field: Data.CreationDateTime
        type: String
        nullable: false
        description: "ISODateTime the funds-confirmation was created."
      - field: Data.Reference
        type: String
        nullable: false
        description: "Echoed CBPII reference."
      - field: Data.InstructedAmount.Amount
        type: String
        nullable: false
        description: "Echoed instructed amount."
      - field: Data.InstructedAmount.Currency
        type: String
        nullable: false
        description: "Echoed instructed currency."
      - field: Links.Self
        type: String
        nullable: true
        description: "Self link to the funds-confirmation resource."
    error_codes:
