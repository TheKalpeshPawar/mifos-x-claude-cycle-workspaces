schema_version: "4.0"
api_group: customer_messages
name: "Customer Messages API"
base_url: "https://apisandbox.openbankproject.com/obp"
auth_scheme: DirectLogin
generated_at: "2026-05-30"

endpoints:

  - id: get_customer_messages
    method: GET
    path: "/v3.0.0/banks/{bank_id}/customers/{customer_id}/messages"
    description: "List all messages sent to a customer by bank staff. Used on customer-messages screen to render the message thread and history view."
    auth_required: true
    request_schema: []
    response_schema:
      - field: id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned unique message identifier."
      - field: date
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Timestamp the message was sent."
      - field: description
        type: String
        nullable: true
        description: "Short subject/summary line for the message."
      - field: message
        type: String
        nullable: false
        description: "Full message body text. May contain newlines."
      - field: transport
        type: String
        nullable: false
        description: "Delivery channel — sms | email | ftp | post."
      - field: from_department
        type: String
        nullable: false
        description: "Originating bank department (e.g. 'Customer Support', 'Loans', 'Compliance')."
      - field: from_person
        type: String
        nullable: false
        description: "Name of the staff member who sent the message."
    error_codes:
      - code: 400
        message: "BAD_REQUEST"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true

  - id: send_customer_message
    method: POST
    path: "/v4.0.0/banks/{bank_id}/customers/{customer_id}/messages"
    description: "Send a message to a customer from a bank department. Used on customer-messages screen compose action and from customer-detail quick-send. Message is delivered via the specified transport channel."
    auth_required: true
    request_schema:
      - field: message
        type: String
        required: true
        validation: "Message body text. Min 1, max 4000 characters. May contain newlines."
      - field: from_department
        type: String
        required: true
        validation: "Originating bank department. Max 100 characters (e.g. 'Customer Support', 'Loans')."
      - field: from_person
        type: String
        required: true
        validation: "Name of the sending staff member. Max 255 characters."
      - field: transport
        type: String
        required: true
        validation: "Delivery channel — one of: sms | email | ftp | post. 'sms' requires the customer to have a mobile_phone_number; 'email' requires a registered email address."
    response_schema:
      - field: id
        type: String
        format: UUID
        nullable: false
        description: "OBP-assigned unique message identifier."
      - field: date
        type: String
        format: ISO-8601 Instant
        nullable: false
        description: "Timestamp the message was sent."
      - field: message
        type: String
        nullable: false
        description: "Stored message body."
      - field: transport
        type: String
        nullable: false
        description: "Delivery channel used."
      - field: from_department
        type: String
        nullable: false
        description: "Originating department stored."
      - field: from_person
        type: String
        nullable: false
        description: "Sender name stored."
    error_codes:
      - code: 400
        message: "INVALID_MESSAGE_TRANSPORT"
        retry: false
      - code: 400
        message: "INVALID_MESSAGE_CONTENT"
        retry: false
      - code: 400
        message: "MISSING_CUSTOMER_CONTACT"
        retry: false
      - code: 401
        message: "USER_NOT_LOGGED_IN"
        retry: false
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
        retry: false
      - code: 404
        message: "CUSTOMER_NOT_FOUND"
        retry: false
      - code: 500
        message: "OBP_SERVER_ERROR"
        retry: true
