# server/api_manifest.yaml — HSBC UK/CE Open Banking API manifest for mifos-x-open-banking
# Generated 2026-06-11 by /idea import-api — MIGRATION OBP → HSBC (replace-everything).
# Bindings reconciled 2026-06-12 by /idea sync STEP 4g — removed deleted-screen refs
#   (login, change-password, forgot-password, sca-challenge, cards, card-detail, fx-rates +
#   the 12 field-officer screens); screens:[] groups are step-G new-capability candidates.
# API: HSBC UK/CE Open Banking sandbox — OBIE Read/Write Standard v4.0 (v3.1 on CE HSBCnet + Malta).
# Full reference + 625-endpoint catalogue: /home/kalpesh/OpenBankingProject/HSBC_Sandbox/docs/
#
# Source tiers (every contract traces to one): T1 deterministic (Postman inventory),
# T2 OBIE v4.0 standard (cited), T3 HSBC OpenAPI/portal. Per-group spec_file holds full schemas.
#
# `screens:` per group = consumer screen bindings (39-screen roster). Groups with screens:[]
# are integrated at the contract level but have no consumer screen yet (step-G candidates).

schema_version: "1.0"
generated_at: "2026-06-12"
standard: "obie-uk-open-banking"
base_url: "https://secure.sandbox.ob.hsbc.co.uk"   # UK Personal mTLS resource host (default brand)
authorize_base_url: "https://sandbox.ob.hsbc.co.uk"
default_version: "v4.0"
version_policy: multi          # v4.0 baseline; CE HSBCnet + Malta Personal use v3.1
auth_scheme: "OAuth2-FAPI"     # FAPI 1.0 Advanced: mTLS (QWAC+QSEAL) + OAuth2 + detached JWS (x-jws-signature) + DCR
default_brand: uk-personal
brands: [uk-personal, firstdirect, kinetic, m-and-s-bank, uk-business, uk-hsbcnet, ce-hsbcnet, uk-mivision, ce-mivision, malta-personal]
endpoint_count: 85
group_count: 14

api_groups:
  - id: auth
    name: Authentication & Onboarding (FAPI / OAuth2 / DCR)
    obie_role: security
    spec_file: "server/apis/auth.yaml"
    screens: [splash, consent-intro, consent-request, bank-authorize-handoff, auth-callback, consent-declined, consent-expired, payment-authorize-handoff]
    endpoints:
      - { method: POST, path: "/register", description: "Dynamic Client Registration — signed SSA → client credentials (T3 dcr-uk.yaml)" }
      - { method: POST, path: "/obie/open-banking/v1.1/oauth2/token", description: "Token endpoint — client_credentials | authorization_code | refresh_token grants" }
      - { method: GET,  path: "/obie/open-banking/v1.1/oauth2/authorize", description: "PSU authorisation redirect (authorization_code + PKCE S256, signed request object)" }

  - id: ais
    name: Account Information (AISP)
    obie_role: aisp
    spec_file: "server/apis/ais.yaml"
    screens: [home, accounts, account-detail, transactions, transaction-detail, transaction-tags, beneficiaries, direct-debits, direct-debit-detail, standing-orders, standing-order-detail, pfm-dashboard, pfm-settings, business-insights]
    endpoints:
      - { method: POST,   path: "/obie/open-banking/v4.0/aisp/account-access-consents", description: "Create account-access consent" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/accounts", description: "List authorised accounts" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/accounts/{AccountId}", description: "Account detail" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/balances", description: "Balances (all authorised accounts)" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/transactions", description: "Transactions" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/beneficiaries", description: "Beneficiaries (read-only)" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/direct-debits", description: "Direct debits (read-only)" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/standing-orders", description: "Standing orders (read-only)" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/scheduled-payments", description: "Scheduled payments (read-only)" }
      - { method: GET,    path: "/obie/open-banking/v4.0/aisp/party", description: "Account-holder party / parties / product / statements (see spec_file for full 18-endpoint set)" }
      - { method: DELETE, path: "/obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}", description: "Delete consent" }
    note: "18 endpoints total — full read surface (statements, statement-transactions, offers, etc.) in spec_file. Schemas T3 account-info-4.0-dbb.yaml + T2 AISP v4.0."

  - id: cbpii
    name: Confirmation of Funds (CBPII)
    obie_role: cbpii
    spec_file: "server/apis/cbpii.yaml"
    screens: [send-money-amount]     # funds check (FR-041)
    endpoints:
      - { method: POST,   path: "/obie/open-banking/v4.0/cbpii/funds-confirmation-consents", description: "Create funds-confirmation consent" }
      - { method: GET,    path: "/obie/open-banking/v4.0/cbpii/funds-confirmation-consents/{ConsentId}", description: "Get consent status" }
      - { method: DELETE, path: "/obie/open-banking/v4.0/cbpii/funds-confirmation-consents/{ConsentId}", description: "Delete consent" }
      - { method: POST,   path: "/obie/open-banking/v4.0/cbpii/funds-confirmations", description: "Check funds → FundsAvailable" }
    note: "9 brands (Malta excluded). Schemas T2 OBIE CBPII v4.0 (no HSBC portal capture)."

  - id: vrp
    name: Variable Recurring Payments (VRP)
    obie_role: pisp
    spec_file: "server/apis/vrp.yaml"
    screens: []     # NEW capability — no screen yet (step-D candidate: recurring/sweeping payments)
    endpoints:
      - { method: POST,   path: "/obie/open-banking/v4.0/pisp/domestic-vrp-consents", description: "Create VRP consent" }
      - { method: POST,   path: "/obie/open-banking/v4.0/pisp/domestic-vrp-consents/{ConsentId}/funds-confirmation", description: "VRP funds confirmation" }
      - { method: POST,   path: "/obie/open-banking/v4.0/pisp/domestic-vrps", description: "Initiate VRP payment" }
      - { method: GET,    path: "/obie/open-banking/v4.0/pisp/domestic-vrps/{DomesticVRPId}", description: "VRP payment status" }
    note: "6 endpoints (incl. get/delete consent). Schemas T2 OBIE VRP v4.0."

  - id: pisp-domestic
    name: Domestic Payment (PISP)
    obie_role: pisp
    spec_file: "server/apis/pisp-domestic.yaml"
    screens: [send-money, send-money-amount, send-money-confirm, payment-authorize-handoff, payment-result, payment-declined]
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/domestic-payment-consents", description: "Create payment consent" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/domestic-payment-consents/{ConsentId}/funds-confirmation", description: "Check funds" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/domestic-payments", description: "Initiate payment" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/domestic-payments/{DomesticPaymentId}", description: "Payment status" }
    note: "Schemas T2 OBIE PISP v4.0 (portal Payments narrative was 429-unreachable)."

  - id: pisp-domestic-scheduled
    name: Domestic Scheduled Payment (PISP)
    obie_role: pisp
    spec_file: "server/apis/pisp-domestic-scheduled.yaml"
    screens: [send-money]     # scheduled option
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/domestic-scheduled-payment-consents", description: "Create scheduled consent (no funds-confirmation op)" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/domestic-scheduled-payments", description: "Initiate scheduled payment" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/domestic-scheduled-payments/{DomesticScheduledPaymentId}", description: "Status (CANC enum)" }

  - id: pisp-domestic-standing-order
    name: Domestic Standing Order (PISP)
    obie_role: pisp
    spec_file: "server/apis/pisp-domestic-standing-order.yaml"
    screens: [standing-order-create, standing-order-edit, standing-order-detail]
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/domestic-standing-order-consents", description: "Create standing-order consent" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/domestic-standing-orders", description: "Initiate standing order" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/domestic-standing-orders/{DomesticStandingOrderId}", description: "Status" }

  - id: pisp-international
    name: International Payment (PISP)
    obie_role: pisp
    spec_file: "server/apis/pisp-international.yaml"
    screens: [send-money]     # international option (NEW vs OBP)
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/international-payment-consents", description: "Create consent (CurrencyOfTransfer, ExchangeRateInformation)" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/international-payment-consents/{ConsentId}/funds-confirmation", description: "Check funds" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/international-payments", description: "Initiate payment" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/international-payments/{InternationalPaymentId}", description: "Status" }

  - id: pisp-international-scheduled
    name: International Scheduled Payment (PISP)
    obie_role: pisp
    spec_file: "server/apis/pisp-international-scheduled.yaml"
    screens: []     # NEW capability candidate
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/international-scheduled-payment-consents", description: "Create consent" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/international-scheduled-payments", description: "Initiate" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/international-scheduled-payments/{InternationalScheduledPaymentId}", description: "Status" }

  - id: pisp-international-standing-order
    name: International Standing Order (PISP)
    obie_role: pisp
    spec_file: "server/apis/pisp-international-standing-order.yaml"
    screens: []     # NEW capability candidate
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/international-standing-order-consents", description: "Create consent (v3.1 flat vs v4.0 OBMandateRelatedInformation1)" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/international-standing-orders", description: "Initiate" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/international-standing-orders/{InternationalStandingOrderPaymentId}", description: "Status" }

  - id: pisp-file
    name: File Payment / bulk (PISP)
    obie_role: pisp
    spec_file: "server/apis/pisp-file.yaml"
    screens: []     # NEW capability candidate (business bulk; ISO20022 pain.001 upload)
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/file-payment-consents", description: "Create consent (FileType/FileHash/ControlSum)" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/file-payment-consents/{ConsentId}/file", description: "Upload payment file" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/file-payment-consents/{ConsentId}/file", description: "Download file" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/file-payments", description: "Submit file payment" }
      - { method: GET,  path: "/obie/open-banking/v4.0/pisp/file-payments/{FilePaymentId}", description: "Status" }

  - id: pisp-multibill
    name: Multi-Bill Payment (HSBC-specific, UK Business only)
    obie_role: pisp-hsbc-specific
    spec_file: "server/apis/pisp-multibill.yaml"
    screens: []     # NEW capability candidate (UK Business bulk bill pay)
    note: "HSBC-specific — no OBIE standard equivalent; response schemas documented-gap (portal 429), shapes from T1 Postman bodies. UK Business brand only."
    endpoints:
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/file-payment-consents", description: "Create consent (multi-bill pain.001.001.08 file)" }
      - { method: POST, path: "/obie/open-banking/v4.0/pisp/file-payments", description: "Submit multi-bill payment" }

  - id: events
    name: Event Notification
    obie_role: events
    spec_file: "server/apis/events.yaml"
    screens: [notifications, consent-manager]
    endpoints:
      - { method: POST,   path: "/obie/open-banking/v4.0/event-subscriptions", description: "Create event subscription" }
      - { method: GET,    path: "/obie/open-banking/v4.0/event-subscriptions", description: "Read subscriptions" }
      - { method: DELETE, path: "/obie/open-banking/v4.0/event-subscriptions/{EventSubscriptionId}", description: "Delete subscription" }
      - { method: POST,   path: "/obie/open-banking/v4.0/events", description: "Poll events (short-poll, maxEvents; UK.OBIE.Consent-Authorization-Revoked)" }
    note: "Schemas T3 event-notification-4.0.yaml. callback-urls absent from spec — documented gap."

  - id: open-data
    name: Open Data (unauthenticated reference data)
    obie_role: opendata
    spec_file: "server/apis/open-data.yaml"
    screens: [atm-locator, products]
    auth_required: false
    endpoints:
      - { method: GET, path: "/branches", description: "Branch locator" }
      - { method: GET, path: "/atms", description: "ATM locator" }
      - { method: GET, path: "/personal-current-accounts", description: "PCA product reference" }
      - { method: GET, path: "/business-current-accounts", description: "BCA product reference" }
      - { method: GET, path: "/unsecured-sme-loans", description: "SME loan reference" }
      - { method: GET, path: "/commercial-credit-cards", description: "SME credit-card reference" }
    note: "T2 OBIE Open Data v2.4.0 only (not in Postman, portal 429). HSBC-specific base URL/availability unconfirmed."

# ─── OBIE groups integrated at the contract level with NO consumer screen yet ──
# step-G new-capability candidates (goal track): each has a full spec_file + endpoints,
# but no screen binding. /goal-analysis-project would decide whether to surface them.
unbound_obie_groups:
  - vrp                              # Variable Recurring Payments (recurring/sweeping)
  - pisp-international-scheduled     # International Scheduled Payment
  - pisp-international-standing-order # International Standing Order
  - pisp-file                       # File Payment / bulk (ISO 20022 pain.001)
  - pisp-multibill                  # Multi-Bill (HSBC-specific, UK Business)

# Note: the OBP-era field-officer screens, cards, card-detail, and fx-rates were DELETED in the
# OBP → HSBC migration (commit 8fbb3bdc) — no longer in the 39-screen roster, so not listed here.
# beneficiaries remains in the roster but is READ-ONLY under AISP (add/edit/delete unsupported).
