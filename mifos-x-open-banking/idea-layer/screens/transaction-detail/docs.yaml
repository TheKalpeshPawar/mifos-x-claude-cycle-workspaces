screen_id: transaction-detail
feature: transactions
archetype: detail_screen
cluster: transactions
acceptance_refs: [FR-005]
flow_ref: transaction-review
scaffolded_by: "/idea-heal"
status: enriched

i18n_ready: true
cache_strategy: cache-first

description: >
  Displays the full detail for a single transaction. Shows a large colour-coded
  amount header (credit = primary, debit = error) with ISO 4217 currency label,
  merchant name (fallback to TransactionInformation for non-card credits), Booked/Pending
  status badge, booking and value dates, client-derived Category, conditionally rendered
  MerchantCategoryCode (MCC), running balance after the transaction, copyable free-text
  reference, and proprietary bank transaction code.
  No payment initiation — read-only AISP view only.
  Retry gated by error.recoverable; non-recoverable errors (403, TransactionNotFound)
  show Go Back instead of Retry.

has_ui: true
has_server: true

permissions_required:
  - ReadTransactionsDetail

obie_resources:
  - OBReadTransaction6

notes: >
  The transactions list endpoint is reused — client filters by transactionId from
  the cache (TTL 300 s) or freshly-fetched list when cache absent. No single-transaction
  endpoint exists in OBIE v4.0 AIS. Empty state is not applicable for this screen:
  a missing transaction is modelled as a non-recoverable error (TransactionNotFoundError).
  MerchantCategoryCode row conditionally hidden when null (e.g. direct credits, bank transfers).

impl_notes: >
  Use ClipboardManager (Android) / UIPasteboard (iOS) via expect/actual for copy_to_clipboard
  side-effect in TransactionDetailViewModel. Show a one-shot snackbar after clipboard write.
  i18n strings defined in transaction_detail_* namespace (19 keys — see new_string_keys in
  enrichment report). MCC lookup table (MCC→category string) lives in
  TransactionCategoryMapper.kt and is pure-Kotlin common code.

metadata:
  category: transaction-detail
  implementation_ready: true
  impl_ready_at: "2026-06-29"
  impl_ready_schema: "v3"
  enrichment_quality: 94

contracts: []

libraries:
  - capability: rest-client
    library: ktorfit
    version: "latest"
    targets: [android, ios, desktop, web]

vm_actions:
  - name: LoadTransactionDetail
    signature: "suspend fun loadTransactionDetail(transactionId: String, accountId: String)"
    state_mutations:
      - "uiState = TransactionDetailUiState.Loading"
      - "uiState = TransactionDetailUiState.Content(transaction) on success"
      - "uiState = TransactionDetailUiState.Error(message, recoverable) on failure or not-found"
    side_effects:
      - "Checks in-memory cache (transactions_{accountId}) first; fetches OBReadTransaction6 via GET /accounts/{accountId}/transactions on cache miss; filters result list by transactionId; maps to TransactionDetailUiModel including client-derived Category from MCC lookup"
    error_handling:
      on_401: "emit TokenExpiredError(recoverable=true); surface error state with Retry"
      on_403: "emit ConsentWithdrawnError(recoverable=false); surface error state with Go Back"
      on_not_found: "emit TransactionNotFoundError(recoverable=false) when transactionId absent in response list; surface error state with Go Back"
      on_network: "emit NetworkError(recoverable=true); surface error state with Retry"

  - name: NavigateBack
    signature: "fun navigateBack()"
    state_mutations: []
    side_effects: ["Pop screen off nav stack returning to transactions list; accountId retained by nav back-stack"]
    error_handling: {}

  - name: RetryLoad
    signature: "fun retryLoad()"
    state_mutations:
      - "delegates to LoadTransactionDetail with current transactionId and accountId"
    side_effects: []
    error_handling:
      guard: "only invokable when uiState is Error with recoverable=true"

  - name: CopyTransactionReference
    signature: "fun copyTransactionReference(reference: String)"
    state_mutations:
      - "sideEffectChannel.send(CopyToClipboard(reference))"
    side_effects:
      - "Writes reference string to system ClipboardManager (Android) / UIPasteboard (iOS) via platform ClipboardService expect/actual"
      - "Emits one-shot snackbar event: strings.transaction_detail_copy_success"
    error_handling:
      on_failure: "silently ignore; clipboard write failure is non-critical"

error_cases:
  - id: TokenExpiredError
    http_status: 401
    user_message: "Session expired. Please log in again."
    recoverable: true
    recovery_action: retry_load
  - id: ConsentWithdrawnError
    http_status: 403
    user_message: "Access to transactions has been withdrawn."
    recoverable: false
    recovery_action: navigate_back
  - id: TransactionNotFoundError
    http_status: null
    user_message: "Transaction not found. It may have been removed or the reference is invalid."
    recoverable: false
    recovery_action: navigate_back
  - id: NetworkError
    http_status: null
    user_message: "No network connection. Please check your connection and retry."
    recoverable: true
    recovery_action: retry_load

test_fixtures:
  source: "HSBC sandbox — TX-20260626-0001 (Tesco Stores, Debit, Booked, MCC 5411), TX-20260625-0001 (ACME LTD, Credit, Booked, MCC null), TX-20260629-0001 (Pret A Manger, Pending, MCC 5812)"
  scenario_count: 9
  priority_distribution:
    critical: 4
    high: 3
    medium: 2
