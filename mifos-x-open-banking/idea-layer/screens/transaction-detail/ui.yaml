                style:
                  typography: "Outfit/body_medium"
                  color: "#1A1C16"
                  font_weight: 500
                a11y:
                  role: text
                test_context:
                  tag: detail_from_account_name
                  assert_content: "Primary Checking"

              - type: text
                id: detail_from_iban
                content: "...0130"
                style:
                  typography: "Outfit/body_small"
                  color: "#44483D"
                  font_family: monospace
                a11y:
                  role: text
                  label: "Account ending 0130"
                test_context:
                  tag: detail_from_iban

      - type: divider
        id: detail_div_4
        style:
          color: "#F9FAEF"
          margin_bottom: spacing.md
        a11y:
