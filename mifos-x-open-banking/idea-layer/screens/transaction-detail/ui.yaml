id: transaction-detail
name: Transaction Detail
feature: transaction-detail
flavor: consumer
status: approved
quality_score: 82
contract_version: "1.1.0"
approve_hash: "sha256:07af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []


shell:
  bottom_nav: false
  top_app_bar:
    show: true
    title: "Transaction Details"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: share
        action: share_transaction
        label: "Share transaction"

screens:
  - id: transaction_detail_content
    label: Transaction Detail
    route: /transactions/{transactionId}
    scroll: vertical

components:
  - type: box
    id: amount_hero_section
    style:
      background: "#1800B1"
      padding_horizontal: 24
      padding_top: 28
      padding_bottom: 36
      align: center
    a11y:
      role: region
      label: "Transaction amount summary"
    test_context:
      tag: amount_hero_section
      assert_visible: true
    children:
      - type: text
        id: amount_hero_value
        content: "-£42.50"
        style:
          typography: display_large
          color: "#FF8A80"
          font_weight: 700
          text_align: center
        a11y:
          role: text
          label: "Debit: forty-two pounds fifty"
        test_context:
          tag: amount_hero_value
          assert_content: "-£42.50"

      - type: stack
        id: status_badge_row
        style:
          direction: horizontal
          justify: center
          padding_top: 12
        children:
          - type: box
            id: status_badge
            style:
              background: "#4CAF5033"
              border_radius: 20
              padding_horizontal: 16
              padding_vertical: 6
            children:
              - type: stack
                id: status_badge_inner
                style:
                  direction: horizontal
                  align: center
                  spacing: 6
                children:
                  - type: icon
                    id: status_icon
                    content: "check_circle"
                    style:
                      size: 14
                      color: "#69F0AE"
                    a11y:
                      role: img
                      label: "Completed status icon"
                    test_context:
                      tag: status_icon

                  - type: text
                    id: status_label
                    content: "Completed"
                    style:
                      typography: label_medium
                      color: "#69F0AE"
                    a11y:
                      role: text
                      label: "Status: Completed"
                    test_context:
                      tag: status_label
                      assert_content: "Completed"

  - type: box
    id: merchant_card
    style:
      background: "#FFFFFF"
      border_radius: 20
      padding: 20
      margin_horizontal: 20
      margin_top: -20
      margin_bottom: 16
      elevation: 4
    a11y:
      role: region
      label: "Merchant information"
    test_context:
      tag: merchant_card
    children:
      - type: stack
        id: merchant_row
        style:
          direction: horizontal
          align: center
          spacing: 16
        children:
          - type: image
            id: merchant_logo
            content: "merchant_tesco_large"
            style:
              width: 56
              height: 56
              border_radius: 28
              background: "#E8F5E9"
            a11y:
              role: img
              label: "Tesco Supermarket logo"
            test_context:
              tag: merchant_logo

          - type: stack
            id: merchant_info
            style:
              direction: vertical
              flex: 1
            children:
              - type: text
                id: merchant_name
                content: "Tesco Supermarket"
                style:
                  typography: title_large
                  color: "#1A1A1A"
                  font_weight: 600
                a11y:
                  role: heading
                  level: 2
                  label: "Merchant: Tesco Supermarket"
                test_context:
                  tag: merchant_name
                  assert_content: "Tesco Supermarket"

              - type: box
                id: category_badge
                style:
                  background: "#E8F5E9"
                  border_radius: 6
                  padding_horizontal: 8
                  padding_vertical: 4
                  align_self: flex_start
                  margin_top: 4
                children:
                  - type: text
                    id: category_label
                    content: "Groceries"
                    style:
                      typography: label_small
                      color: "#2E7D32"
                    a11y:
                      role: text
                      label: "Category: Groceries"
                    test_context:
                      tag: category_label
                      assert_content: "Groceries"

  - type: box
    id: details_card
    style:
      background: "#FFFFFF"
      border_radius: 16
      padding: 20
      margin_horizontal: 20
      margin_bottom: 16
      elevation: 1
    a11y:
      role: region
      label: "Transaction details"
    test_context:
      tag: details_card
    children:
      - type: stack
        id: detail_date_row
        style:
          direction: horizontal
          align: center
          justify: space_between
          padding_bottom: 16
        children:
          - type: text
            id: detail_date_label
            content: "Date & Time"
            style:
              typography: label_small
              color: "#666666"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_date_label

          - type: text
            id: detail_date_value
            content: "25 May 2026, 14:32"
            style:
              typography: body_medium
              color: "#1A1A1A"
              font_weight: 500
            a11y:
              role: text
              label: "Transaction date: 25 May 2026, 14:32"
            test_context:
              tag: detail_date_value
              assert_content: "25 May 2026, 14:32"

      - type: divider
        id: detail_div_1
        style:
          color: "#F0F0F0"
          margin_bottom: 16
        a11y:
          role: separator
        test_context:
          tag: detail_div_1

      - type: stack
        id: detail_reference_row
        style:
          direction: horizontal
          align: center
          justify: space_between
          padding_bottom: 16
        children:
          - type: text
            id: detail_reference_label
            content: "Reference"
            style:
              typography: label_small
              color: "#666666"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_reference_label

          - type: stack
            id: reference_value_row
            style:
              direction: horizontal
              align: center
              spacing: 6
            children:
              - type: text
                id: detail_reference_value
                content: "SEPA-2026051500123"
                style:
                  typography: body_small
                  color: "#1A1A1A"
                  font_family: monospace
                a11y:
                  role: text
                  label: "Reference: SEPA-2026051500123"
                test_context:
                  tag: detail_reference_value
                  assert_content: "SEPA-2026051500123"

              - type: icon
                id: copy_reference_icon
                content: "content_copy"
                style:
                  size: 16
                  color: "#1800B1"
                on_click:
                  action: copy_reference
                a11y:
                  role: button
                  label: "Copy reference number"
                test_context:
                  tag: copy_reference_icon
                  assert_clickable: true

      - type: divider
        id: detail_div_2
        style:
          color: "#F0F0F0"
          margin_bottom: 16
        a11y:
          role: separator
        test_context:
          tag: detail_div_2

      - type: stack
        id: detail_type_row
        style:
          direction: horizontal
          align: center
          justify: space_between
          padding_bottom: 16
        children:
          - type: text
            id: detail_type_label
            content: "Transaction Type"
            style:
              typography: label_small
              color: "#666666"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_type_label

          - type: text
            id: detail_type_value
            content: "SEPA Credit Transfer"
            style:
              typography: body_medium
              color: "#1A1A1A"
              font_weight: 500
            a11y:
              role: text
              label: "Transaction type: SEPA Credit Transfer"
            test_context:
              tag: detail_type_value
              assert_content: "SEPA Credit Transfer"

      - type: divider
        id: detail_div_3
        style:
          color: "#F0F0F0"
          margin_bottom: 16
        a11y:
          role: separator
        test_context:
          tag: detail_div_3

      - type: stack
        id: detail_from_row
        style:
          direction: horizontal
          align: flex_start
          justify: space_between
          padding_bottom: 16
        children:
          - type: text
            id: detail_from_label
            content: "From Account"
            style:
              typography: label_small
              color: "#666666"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_from_label

          - type: stack
            id: detail_from_value_col
            style:
              direction: vertical
              align: flex_end
            children:
              - type: text
                id: detail_from_account_name
                content: "Primary Checking"
                style:
                  typography: body_medium
                  color: "#1A1A1A"
                  font_weight: 500
                a11y:
                  role: text
                test_context:
                  tag: detail_from_account_name
                  assert_content: "Primary Checking"

              - type: text
                id: detail_from_iban
                content: "...0130"
                style:
                  typography: body_small
                  color: "#888888"
                  font_family: monospace
                a11y:
                  role: text
                  label: "Account ending 0130"
                test_context:
                  tag: detail_from_iban

      - type: divider
        id: detail_div_4
        style:
          color: "#F0F0F0"
          margin_bottom: 16
        a11y:
          role: separator
        test_context:
          tag: detail_div_4

      - type: stack
        id: detail_to_row
        style:
          direction: horizontal
          align: flex_start
          justify: space_between
        children:
          - type: text
            id: detail_to_label
            content: "To Beneficiary"
            style:
              typography: label_small
              color: "#666666"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_to_label

          - type: stack
            id: detail_to_value_col
            style:
              direction: vertical
              align: flex_end
            children:
              - type: text
                id: detail_to_name
                content: "Tesco PLC"
                style:
                  typography: body_medium
                  color: "#1A1A1A"
                  font_weight: 500
                a11y:
                  role: text
                test_context:
                  tag: detail_to_name
                  assert_content: "Tesco PLC"

              - type: text
                id: detail_to_iban
                content: "DE89 3704...0044"
                style:
                  typography: body_small
                  color: "#888888"
                  font_family: monospace
                a11y:
                  role: text
                  label: "Beneficiary IBAN ending 0044"
                test_context:
                  tag: detail_to_iban

  - type: button
    id: download_receipt_button
    label: "Download Receipt"
    style:
      variant: outlined
      border_color: "#1800B1"
      text_color: "#1800B1"
      border_radius: 12
      padding_vertical: 14
      typography: label_large
      margin_horizontal: 20
      margin_bottom: 12
      icon: download
    on_click:
      action: download_receipt
    a11y:
      role: button
      label: "Download transaction receipt as PDF"
      hint: "Downloads a PDF receipt for this transaction"
    test_context:
      tag: download_receipt_button
      assert_clickable: true

  - type: stack
    id: report_issue_row
    style:
      direction: horizontal
      align: center
      justify: center
      padding_bottom: 24
    a11y:
      role: group
    test_context:
      tag: report_issue_row
    children:
      - type: icon
        id: report_issue_icon
        content: "flag"
        style:
          size: 16
          color: "#FF5252"
          padding_right: 6
        a11y:
          role: img
          label: "Report icon"
        test_context:
          tag: report_issue_icon

      - type: link
        id: report_issue_link
        content: "Report an Issue"
        style:
          typography: label_medium
          color: "#FF5252"
        on_click:
          action: open_dispute_form
        a11y:
          role: link
          label: "Report an issue with this transaction"
          hint: "Opens the dispute form for this transaction"
        test_context:
          tag: report_issue_link
          assert_clickable: true

  - type: spacer
    id: bottom_spacer
    style:
      height: 16

states:
  loading:
    layout:
      components_visible: []
      skeleton:
        - id: skel_hero
          type: box
          style:
            background: "#1800B1"
            height: 160
        - id: skel_merchant
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 20
            height: 100
            margin_horizontal: 20
            margin_top: -20
        - id: skel_details
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 16
            height: 300
            margin_horizontal: 20
            margin_top: 16
        - id: skel_actions
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 12
            height: 52
            margin_horizontal: 20
            margin_top: 16

  content:
    layout:
      components_visible:
        - amount_hero_section
        - merchant_card
        - details_card
        - download_receipt_button
        - report_issue_row

  error:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Transaction not found"
        message: "We could not load this transaction. It may have been removed or there may be a connection issue."
        action_label: "Go Back"
        action: navigate_back
        icon: error_outline

state_model:
  view_model: TransactionDetailViewModel
  screen_state: TransactionDetailScreenState
  state_fields:
    - name: isLoading
      type: Boolean
      default: "true"
    - name: transaction
      type: "TransactionDetail?"
      default: "null"
    - name: error
      type: "UiError?"
      default: "null"
    - name: isDownloadingReceipt
      type: Boolean
      default: "false"
    - name: referenceCopied
      type: Boolean
      default: "false"
  errors:
    - id: not_found
      message: "This transaction could not be found."
    - id: network_error
      message: "Network unavailable. Please check your connection."
    - id: receipt_download_failed
      message: "Receipt download failed. Please try again."
    - id: dispute_unavailable
      message: "Dispute form is temporarily unavailable."
  events:
    - RetryLoad
    - DownloadReceipt
    - OpenDisputeForm
    - CopyReference
    - ShareTransaction
    - NavigateBack
  actions:
    - name: loadTransactionDetail
      param: transactionId
      triggers: [ScreenOpened, RetryLoad]
    - name: downloadReceipt
    - name: copyReferenceToClipboard
    - name: openDisputeForm
    - name: shareTransaction
  di:
    - TransactionsRepository
    - ClipboardManager
    - ReceiptDownloader
    - DisputeFormLauncher

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
      - name: accountId
        type: path
      - name: transactionId
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: this_account
          type: object
          children:
            - name: id
              type: String
            - name: account_routings
              type: "List<AccountRouting>"
        - name: other_account
          type: object
          children:
            - name: id
              type: String
            - name: holder
              type: object
              children:
                - name: name
                  type: String
                - name: is_alias
                  type: Boolean
            - name: account_routings
              type: "List<AccountRouting>"
            - name: metadata
              type: object
              children:
                - name: image_url
                  type: "String?"
        - name: details
          type: object
          children:
            - name: type
              type: String
            - name: description
              type: String
            - name: posted
              type: String
            - name: completed
              type: String
            - name: new_balance
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
            - name: value
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
        - name: metadata
          type: object
          children:
            - name: narrative
              type: "String?"
            - name: comments
              type: "List<Comment>"
            - name: tags
              type: "List<Tag>"
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Transaction not found"
      - code: 500
        message: "OBP server error"

dependencies:
  tier: feature
  features:
    - transactions
    - account-detail
