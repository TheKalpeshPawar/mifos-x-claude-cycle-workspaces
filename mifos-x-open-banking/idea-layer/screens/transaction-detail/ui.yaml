                test_context:
                  tag: copy_reference_icon
                  assert_clickable: true

      - type: divider
        id: detail_div_2
        style:
          color: "#F9FAEF"
          margin_bottom: spacing.md
        a11y:
          role: separator
        test_context:
          tag: detail_div_2

      - type: stack
