              color: "#44483D"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_type_label

          - type: text
            id: detail_type_value
            content: "SEPA Credit Transfer"
            style:
              typography: "Outfit/body_medium"
              color: "#1A1C16"
              font_weight: 500
            a11y:
              role: text
              label: "Transaction type: SEPA Credit Transfer"
            test_context:
              tag: detail_type_value
              assert_content: "SEPA Credit Transfer"

      - type: divider
