      # Shipped: label is "To" when isDebit else "From"; value is content.counterpartyName
      # (NOT a separate beneficiary name); secondary line = content.toDetail and is only
      # populated for pending payments (SEPA iban / counterparty id / sandbox-tan accountId) —
      # booked transactions have toDetail = "" so no secondary line renders.
      - type: stack
        id: detail_to_row
        style:
          direction: horizontal
          align: flex_start
          justify: space_between
        children:
          - type: text
            id: detail_to_label
            content: "To"
            dynamic_label: "isDebit ? 'To' : 'From'"
            style:
              typography: "Outfit/label_small"
              color: "#44483D"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_to_label

          - type: stack
            id: detail_to_value_col
            style:
              direction: vertical
              align: flex_end
            children:
              - type: text
                id: detail_to_name
                content: "Tesco PLC"
                bound_field: counterpartyName
                style:
                  typography: "Outfit/body_medium"
                  color: "#1A1C16"
                  font_weight: 500
                a11y:
                  role: text
                test_context:
                  tag: detail_to_name
                  assert_content: "Tesco PLC"

              # Secondary line — content.toDetail. Pending only; blank for booked transactions.
              - type: text
                id: detail_to_iban
                content: "DE89 3704...0044"
                bound_field: toDetail
                visible_when: "toDetail.isNotBlank()"
                style:
                  typography: "Outfit/body_small"
                  color: "#44483D"
                  font_family: monospace
                a11y:
                  role: text
                  label: "Beneficiary IBAN ending 0044"
                test_context:
                  tag: detail_to_iban

  # DEFERRED (shipped as placeholder): no consumer OBP receipt-download endpoint, so tapping
  # surfaces a 'Receipt download is coming soon' snackbar instead of generating a PDF. Only
  # rendered for booked transactions (hidden when isPending).
  - type: button
    id: download_receipt_button
    deferred: true
    deferred_reason: "No OBP receipt-download endpoint; shipped surfaces a 'coming soon' snackbar."
    visible_when: "!isPending"
    label: "Download Receipt"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#4C662B"
      text_color: "#4C662B"
      border_radius: 12
      padding_vertical: 14
      typography: "Outfit/label_large"
      margin_horizontal: 20
      margin_bottom: spacing.sm
      icon: download
    on_click:
      action: notify_coming_soon
    a11y:
      role: button
      label: "Download transaction receipt as PDF"
      hint: "Downloads a PDF receipt for this transaction"
    keyboard:
      focusable: true
    test_context:
      tag: download_receipt_button
      assert_clickable: true

  - type: stack
    id: report_issue_row
    style:
      direction: horizontal
      align: center
      justify: center
      padding_bottom: spacing.lg
    a11y:
      role: group
    test_context:
      tag: report_issue_row
    children:
      - type: icon
        id: report_issue_icon
        content: "flag"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          size: 16
          color: "#BA1A1A"
          padding_right: 6
        a11y:
          role: img
          label: "Report icon"
        test_context:
          tag: report_issue_icon

      # DEFERRED (shipped as placeholder): no OBP dispute endpoint, so tapping surfaces a
      # 'Disputes are coming soon' snackbar instead of opening a dispute form.
      - type: link
        id: report_issue_link
        deferred: true
        deferred_reason: "No OBP dispute endpoint; shipped surfaces a 'coming soon' snackbar."
        content: "Report an Issue"
        style:
          typography: "Outfit/label_medium"
          color: "#BA1A1A"
        on_click:
          action: notify_coming_soon
        a11y:
          role: link
          label: "Report an issue with this transaction"
          hint: "Opens the dispute form for this transaction"
        keyboard:
          focusable: true
        test_context:
          tag: report_issue_link
          assert_clickable: true

  - type: list_item
    id: manage_tags_row
    style:
      direction: horizontal
      align: center
      padding_horizontal: 20
      padding_vertical: 14
      background: "colors.surface_variant"
      border_radius: 12
      margin_horizontal: 20
      margin_bottom: spacing.sm
    content:
      leading_icon: label
      text: "Tags & Notes"
      supporting_text: "Add tags or notes to this transaction"
      trailing_icon: chevron_right
    on_click:
      target: transaction-tags
    a11y:
      role: button
      label: "Manage tags and notes for this transaction"
      hint: "Opens the Tags & Notes screen"
    keyboard:
      focusable: true
    test_context:
      tag: manage_tags_row
      assert_clickable: true
      assert_nav_target: transaction-tags

  - type: spacer
    id: bottom_spacer
    style:
      height: 16

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout:
      components_visible: []
      skeleton:
        - id: skel_hero
          type: box
          style:
            background: "#4C662B"
            height: 160
        - id: skel_merchant
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 20
            height: 100
            margin_horizontal: 20
            margin_top: -20
        - id: skel_details
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 300
            margin_horizontal: 20
            margin_top: spacing.md
        - id: skel_actions
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 52
            margin_horizontal: 20
            margin_top: spacing.md

  content:
    # Booked: all rows render. Pending (isPending): download_receipt_button + manage_tags_row
    # are hidden (nothing booked yet — no receipt, no tags); report_issue_row still renders.
    layout:
      components_visible:
        - amount_hero_section
        - merchant_card
        - details_card
        - download_receipt_button
        - manage_tags_row
        - report_issue_row
      pending_hidden:
        - download_receipt_button
        - manage_tags_row

  error:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Transaction not found"
        message: "We could not load this transaction. It may have been removed or there may be a connection issue."
        action_label: "Retry"
        action: retry_load
        icon: cloud_off

  # ScreenState.NoNetwork / Unauthenticated fold into the same 'Transaction not found' card
  # as error in the shipped composable.
  no_network:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Transaction not found"
        message: "We could not load this transaction. It may have been removed or there may be a connection issue."
        action_label: "Retry"
        action: retry_load
        icon: cloud_off

  unauthenticated:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Transaction not found"
        message: "We could not load this transaction. It may have been removed or there may be a connection issue."
        action_label: "Retry"
        action: retry_load
        icon: cloud_off

  empty:
    layout:
      components_visible: []
      empty_card:
        id: empty_state_card
        title: "Transaction details not available"
        message: "No details are available for this transaction. It may have been archived or the record is no longer accessible."
        action_label: "Go Back"
        action: navigate_back
        icon: receipt_long

state_model:
  view_model: TransactionDetailViewModel
  # Shipped: a single StateFlow<ScreenState<TransactionDetailContent>>. load() dispatches on the
  # constructor args — transactionId non-blank → booked path (getTransaction); else requestId
  # non-blank → pending path (listTransactionRequests, find by id); else ScreenState.Empty.
  screen_state: "ScreenState<TransactionDetailContent>"
  state_wrapper: ScreenState
  screen_states: [Loading, Content, Empty, Error, NoNetwork, Unauthenticated]
  content_class: TransactionDetailContent
  content_fields:
    - name: amount
      type: String
      note: "Signed for booked (formatSigned), unsigned for pending (formatUnsigned — money not yet debited)"
    - name: isDebit
      type: Boolean
    - name: isPending
      type: Boolean
    - name: statusLabel
      type: String
      note: "'Completed' (booked) or 'Awaiting confirmation' (pending)"
    - name: counterpartyName
      type: String
      note: "counterpartyDisplayName(...).ifBlank{'Payment'} — never the raw login-username holder"
    - name: category
      type: String
      note: "categoryLabel(txn) for booked; 'Pending' for pending"
    - name: dateTime
      type: String
      note: "formatDateTime — '25 May 2026, 14:32'"
    - name: reference
      type: String
      note: "txId for booked; request id for pending"
    - name: typeLabel
      type: String
      note: "typeLabel(details.type) — see type_label_map"
    - name: fromAccountLabel
      type: String
    - name: fromAccountTail
      type: String
      note: "'...' + last 4 of the account id"
    - name: toDetail
      type: String
      note: "pending only (SEPA iban / counterparty id / sandbox-tan accountId); '' for booked"
    - name: narrative
      type: String
      note: "metadata.narrative for booked; '' for pending"
  load_modes:
    booked:
      trigger: "transactionId.isNotBlank()"
      source: "TransactionsRepository.getTransaction(bankId, accountId, transactionId)"
    pending:
      trigger: "requestId.isNotBlank()"
      source: "PaymentsRepository.listTransactionRequests(bankId, accountId) → first { it.id == requestId }"
      note: "No per-request OBP read endpoint, so the request is found in the account's list."
    empty:
      trigger: "both blank"
      result: "ScreenState.Empty"
  type_label_map:
    SEPA: "SEPA Credit Transfer"
    SANDBOX_TAN: "Transfer"
    COUNTERPARTY: "Counterparty Transfer"
    DIRECT_DEBIT: "Direct Debit"
    STANDING_ORDER: "Standing Order"
    default: "type or 'Payment'"
  errors:
    - id: not_found
      message: "We could not load this transaction. It may have been removed or there may be a connection issue."
  events:
    - RetryLoad
    - CopyReference
  methods:
    - name: onRetry
      note: "re-runs load() (booked or pending per the same constructor args)"
  side_effects:
    - name: copy_reference
      note: "ClipboardManager.setText(reference) + 'Reference copied' snackbar — UI-side, not a VM event"
    - name: notify_coming_soon
      note: "Receipt download + Report-an-issue surface 'coming soon' snackbars (no consumer endpoint)"
  di:
    - TransactionsRepository
    - PaymentsRepository
    - CounterpartyNameResolver

# Counterparty display — HARD RULE (workspaces/mifos-x/CLAUDE.md): counterpartyName comes from
# counterpartyDisplayName(txn, resolvedNames, placeholder).ifBlank{"Payment"}; the raw
# other_account.holder.name (OBP login-username placeholder) is never shown.

api:
  # Booked path — single-transaction read. v3.0.0; no attributes inline, so category falls back
  # to the detail type when the row was opened without a TXN_TYPE.
  - id: obp_get_transaction_detail
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
    tag: Transactions
    auth: DirectLogin
    used_for: booked
    params:
      - name: bankId
        type: path
      - name: accountId
        type: path
      - name: transactionId
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: this_account
          type: object
        - name: other_account
          type: object
          children:
            - name: id
              type: String
            - name: holder
              type: object
        - name: details
          type: object
          children:
            - name: type
              type: String
            - name: description
              type: String
            - name: posted
              type: String
            - name: completed
              type: String
            - name: value
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
        - name: metadata
          type: object
          children:
            - name: narrative
              type: "String?"
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Transaction not found"
      - code: 500
        message: "OBP server error"

  # Pending path — no per-request read endpoint exists, so the request is located in the
  # account's transaction-request list by requestId.
  - id: obp_list_transaction_requests
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-requests"
    tag: Transaction-Requests
    auth: DirectLogin
    used_for: pending
    params:
      - name: bankId
        type: path
      - name: accountId
        type: path
    response:
      fields:
        - name: transaction_requests
          type: "List<TransactionRequestSummary>"
          children:
            - name: id
              type: String
            - name: type
              type: String
            - name: status
              type: String
            - name: start_date
              type: String
            - name: details
              type: object
              children:
                - name: description
                  type: String
                - name: to_sepa
                  type: "object?"
                - name: to_counterparty
                  type: "object?"
                - name: to_sandbox_tan
                  type: "object?"
                - name: value
                  type: object
                  children:
                    - name: currency
                      type: String
                    - name: amount
                      type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

dependencies:
  tier: feature
  features:
    - transactions
    - account-detail
