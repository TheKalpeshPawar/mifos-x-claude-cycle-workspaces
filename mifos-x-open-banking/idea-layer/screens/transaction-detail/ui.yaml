              color: "#44483D"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_reference_label

          - type: stack
            id: reference_value_row
            style:
              direction: horizontal
              align: center
              spacing: 6
            children:
              - type: text
                id: detail_reference_value
                content: "SEPA-2026051500123"
                style:
                  typography: "Outfit/body_small"
                  color: "#1A1C16"
                  font_family: monospace
                a11y:
                  role: text
                  label: "Reference: SEPA-2026051500123"
