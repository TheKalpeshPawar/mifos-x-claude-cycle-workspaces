id: transaction-detail
name: Transaction Detail
feature: transaction-detail
flavor: consumer
status: enriched
quality_score: 93
contract_version: "1.1.0"
approve_hash: "sha256:07af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-06-06T16:30:00Z"
    by: "/kmp-implement transaction-detail"
    contract_version: "1.1.0"
    note: "Implemented inside feature/transactions (same module as the list — send-money multi-screen pattern, no new gradle module). TransactionDetailViewModel loads via the existing TransactionsRepository.getTransaction (v3.0.0 single-transaction endpoint, already in the client layer); content projects display fields (signed amount + currency symbol, debit=error/credit=primary colors, category from TXN_TYPE fallback detail type, '25 May 2026, 14:32' date-time, reference = transaction UUID). Screen: amount hero on primaryContainer + Completed badge, counterparty card (initial-letter avatar — sandbox has no merchant logos), details card with house 0-elevation style, copy-reference to clipboard with snackbar. Deviations: share top-bar action omitted; download_receipt_button + report_issue_link surface 'coming soon' snackbars (no consumer OBP receipt/dispute endpoint); manage_tags_row navigates to the transaction-tags Phase-2 placeholder as specced; skeleton loading = centered progress indicator (house pattern). Pending payments (transaction-requests INITIATED, SCA challenge unanswered) ALSO open this screen: PendingRow is clickable → requestId load path (no per-request OBP read endpoint, so the request is found in the account's transaction-request list); pending detail shows muted amount, Schedule badge 'Awaiting confirmation', category 'Pending', To row with SEPA IBAN/counterparty, reference = request id; receipt + tags hidden (nothing booked yet). TransactionDetailRoute(bankId, accountId, transactionId, requestId) replaced the arg-less placeholder; wired from transactions rows (booked + pending) AND cards-screen recent-transaction rows (this_account routing from the v6 payload). 11 VM tests (field derivation, credit sign, holder fallback, unparseable date, error, retry, blank-ids empty without API call, pending derivation, request-not-found, list failure, booked-path-not-called)."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    note: "Reconciled spec to shipped Kotlin. Dual-mode load made explicit: booked path (transactionId → getTransaction v3.0.0) vs pending path (requestId → found in PaymentsRepository.listTransactionRequests). uiState = ScreenState<TransactionDetailContent>; added no_network + unauthenticated states (fold into the same 'Transaction not found' card as error). state_model rewritten to the shipped TransactionDetailContent projection (amount/isDebit/isPending/statusLabel/counterpartyName/category/dateTime/reference/typeLabel/fromAccountLabel/fromAccountTail/toDetail/narrative); statusLabel 'Completed' vs 'Awaiting confirmation'; pending amount unsigned; typeLabel() maps SEPA/SANDBOX_TAN/COUNTERPARTY/DIRECT_DEBIT/STANDING_ORDER; counterpartyName via counterpartyDisplayName(...).ifBlank{'Payment'}; toDetail only populated for pending (SEPA iban/counterparty/sandbox-tan), booked toDetail = ''. Marked deferred: download_receipt_button (no real download — 'coming soon' snackbar), report_issue_link/open_dispute_form (no dispute endpoint), share_transaction top-bar action (omitted). Receipt/tags rows hidden for pending. api.yaml: single-transaction GET (v3.0.0) + added PaymentsRepository.listTransactionRequests (v4.0.0) for the pending path. Counterparty hard-rule documented. Pending re-render + re-approve."


shell:
  bottom_nav: false
  top_app_bar:
    show: true
    title: "Transaction Details"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    # Shipped TopAppBar has no actions — the share action was omitted (no share endpoint/intent).
    actions: []

screens:
  - id: transaction_detail_content
    label: Transaction Detail
    route: /transactions/{transactionId}
    scroll: vertical

archetype: detail_screen

components:
  - type: box
    id: amount_hero_section
    style:
      background: "#4C662B"
      padding_horizontal: spacing.lg
      padding_top: 28
      padding_bottom: 36
      align: center
    a11y:
      role: region
      label: "Transaction amount summary"
    test_context:
      tag: amount_hero_section
      assert_visible: true
    children:
      - type: text
        id: amount_hero_value
        content: "-£42.50"
        style:
          typography: "Outfit/display_large"
          color: "#BA1A1A"
          font_weight: 700
          text_align: center
        a11y:
          role: text
          label: "Debit: forty-two pounds fifty"
        test_context:
          tag: amount_hero_value
          assert_content: "-£42.50"

      - type: stack
        id: status_badge_row
        style:
          direction: horizontal
          justify: center
          padding_top: spacing.sm
        children:
          - type: box
            id: status_badge
            style:
              background: "#4C662B33"
              border_radius: 20
              padding_horizontal: spacing.md
              padding_vertical: 6
            children:
              - type: stack
                id: status_badge_inner
                style:
                  direction: horizontal
                  align: center
                  spacing: 6
                children:
                  - type: icon
                    id: status_icon
                    content: "check_circle"
                    style:
                      size: 14
                      color: "#4C662B"
                    a11y:
                      role: img
                      label: "Completed status icon"
                    test_context:
                      tag: status_icon

                  # content.statusLabel — "Completed" (booked, check_circle icon) or
                  # "Awaiting confirmation" (pending, schedule icon, muted color).
                  - type: text
                    id: status_label
                    content: "Completed"
                    bound_field: statusLabel
                    style:
                      typography: "Outfit/label_medium"
                      color: "#4C662B"
                    a11y:
                      role: text
                      label: "Status: Completed"
                    test_context:
                      tag: status_label
                      assert_content: "Completed"

  - type: box
    id: merchant_card
    style:
      background: "#FFFFFF"
      border_radius: 20
      padding: 20
      margin_horizontal: 20
      margin_top: -20
      margin_bottom: spacing.md
      elevation: 4
    a11y:
      role: region
      label: "Merchant information"
    test_context:
      tag: merchant_card
    children:
      - type: stack
        id: merchant_row
        style:
          direction: horizontal
          align: center
          spacing: 16
        children:
          - type: image
            id: merchant_logo
            content: "merchant_tesco_large"
            style:
              width: 56
              height: 56
              border_radius: 28
              background: "#CDEDA3"
            a11y:
              role: img
              label: "Tesco Supermarket logo"
            test_context:
              tag: merchant_logo

          - type: stack
            id: merchant_info
            style:
              direction: vertical
              flex: 1
            children:
              # content.counterpartyName — resolved via counterpartyDisplayName(...).ifBlank{"Payment"}.
              # NEVER the raw other_account.holder.name (that's the OBP login-username placeholder).
              # Avatar shows the first letter of this name; sandbox has no merchant logos.
              - type: text
                id: merchant_name
                content: "Tesco Supermarket"
                bound_field: counterpartyName
                style:
                  typography: "Outfit/title_large"
                  color: "#1A1C16"
                  font_weight: 600
                a11y:
                  role: heading
                  level: 2
                  label: "Merchant: Tesco Supermarket"
                test_context:
                  tag: merchant_name
