        style:
          direction: horizontal
          align: flex_start
          justify: space_between
          padding_bottom: spacing.md
        children:
          - type: text
            id: detail_from_label
            content: "From Account"
            style:
              typography: "Outfit/label_small"
              color: "#44483D"
              letter_spacing: 0.4
            a11y:
              role: text
            test_context:
              tag: detail_from_label

          - type: stack
            id: detail_from_value_col
            style:
              direction: vertical
              align: flex_end
            children:
