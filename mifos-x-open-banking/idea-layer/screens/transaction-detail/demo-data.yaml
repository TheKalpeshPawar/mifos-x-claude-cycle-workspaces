  # OBErrorResponse1 envelope for the 400/403/500 error state.
  error:
    dto: OBErrorResponse1
    description: "Representative 400 OBErrorResponse1 driving the detail error state (e.g. TransactionId not found in the window)."
    item:
      Code: "400 Bad Request"
      Id: "d774-err-2b08"
      Message: "Invalid request"
      Errors:
        - ErrorCode: "UK.OBIE.Field.Invalid"
          Message: "No transaction matches the supplied TransactionId for this account."
