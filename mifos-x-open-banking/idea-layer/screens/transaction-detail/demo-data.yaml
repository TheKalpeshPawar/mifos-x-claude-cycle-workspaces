sibling: demo-data
schema_version: "4.0"
feature_id: transaction-detail

# OBIE AISP fixtures backing the transaction-detail screen. OBIE has no single-transaction-by-id
# GET — detail is the Data.Transaction[] item selected by TransactionId from the same
# ais_get_transactions resource the list screen fetches (OBReadTransaction6). These TransactionIds
# match the transactions list fixture so detail-by-id reuse is coherent. Full detail fields:
# Creditor/Debtor SchemeName+Identification+Name, BankTransactionCode.Code (-> Transaction Type label),
# Pending status (-> 'Awaiting confirmation'). Same James Whitfield persona / sort-code 30-00-00.
# Counterparty display: MerchantDetails.MerchantName then TransactionInformation — never raw Identification.
collections:
  ais_get_transactions:
    dto: OBReadTransaction6
    description: "200 OK — the transaction set the detail screen selects from by TransactionId (Debit booked, Credit booked, and a Pending row)."
    item:
      Data:
        Transaction:
          - AccountId: "acc-jw-current-0001"
            TransactionId: "txn-jw-0002"
            TransactionReference: "TESCO-20260611-1327"
            CreditDebitIndicator: "Debit"
            Status: "Booked"
            BookingDateTime: "2026-06-11T13:27:09.000Z"
            ValueDateTime: "2026-06-11T13:27:09.000Z"
            TransactionInformation: "TESCO STORES 3411 LONDON"
            Amount:
              Amount: "42.16"
              Currency: "GBP"
            MerchantDetails:
              MerchantName: "Tesco Stores"
            BankTransactionCode:
              Code: "PMNT"
            CreditorAccount:
              SchemeName: "UK.OBIE.SortCodeAccountNumber"
              Identification: "20453388112299"
              Name: "Tesco Stores Ltd"
            DebtorAccount:
              SchemeName: "UK.OBIE.SortCodeAccountNumber"
              Identification: "30000012345678"
          - AccountId: "acc-jw-current-0001"
            TransactionId: "txn-jw-0004"
            TransactionReference: "SAL-20260610-0005"
            CreditDebitIndicator: "Credit"
            Status: "Booked"
            BookingDateTime: "2026-06-10T00:05:00.000Z"
            ValueDateTime: "2026-06-10T00:05:00.000Z"
            TransactionInformation: "SALARY ACME DIGITAL LTD"
            Amount:
              Amount: "3120.00"
              Currency: "GBP"
            MerchantDetails:
              MerchantName: "Acme Digital Ltd"
            BankTransactionCode:
              Code: "PMNT"
            CreditorAccount:
              SchemeName: "UK.OBIE.SortCodeAccountNumber"
              Identification: "30000012345678"
              Name: "James Whitfield"
            DebtorAccount:
              SchemeName: "UK.OBIE.SortCodeAccountNumber"
