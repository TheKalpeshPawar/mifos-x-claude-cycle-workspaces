          - AccountId: "acc-jw-current-0001"
            TransactionId: "txn-jw-0001"
            TransactionReference: "TFL-20260612-0812"
            CreditDebitIndicator: "Debit"
            Status: "Pending"
            BookingDateTime: "2026-06-12T08:12:44.000Z"
