<!doctype html>
<html lang="en" data-screen="transaction-detail" data-state="error">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Transaction Detail — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --error:#BA1A1A;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;gap:16px;text-align:center;min-height:calc(844px - 56px);}
.error-card{background:var(--surface);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.error-icon{width:72px;height:72px;background:#FFDAD6;border-radius:36px;display:flex;align-items:center;justify-content:center;}
.error-icon .mi{font-size:36px;color:var(--error);}
.error-title{font-size:18px;font-weight:600;color:var(--text-primary);}
.error-msg{font-size:13px;color:var(--outline);line-height:1.5;text-align:center;}
.back-btn{padding:14px 32px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;width:100%;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="transactions">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Transaction Detail</span>
</header>

<main>
  <div class="error-card">
    <div class="error-icon">
      <span class="mi">error_outline</span>
    </div>
    <h2 class="error-title">Transaction not found</h2>
    <p class="error-msg">We could not load this transaction. It may have been removed or there may be a connection issue.</p>
    <button class="back-btn" data-nav-to="transactions">Go Back</button>
  </div>
</main>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
