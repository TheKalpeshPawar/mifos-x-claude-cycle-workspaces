<!doctype html>
<!-- render-hash: transaction-detail-error-obie -->
<html lang="en" data-screen="transaction-detail" data-state="error" data-feature="transaction-detail" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction Details</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
  --font-display:'Outfit',system-ui,sans-serif;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-2xl:48px;
  --shadow:rgba(26,28,22,0.10);
}
[data-theme="light"] {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
  --shadow:rgba(26,28,22,0.10);
}
[data-theme="dark"] {
  --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
  --secondary:#A0CFCB;--on-secondary:#003735;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB;--on-tertiary:#003735;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
  --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
  --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
  --shadow:rgba(0,0,0,0.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
  --secondary:#A0CFCB;--on-secondary:#003735;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB;--on-tertiary:#003735;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
  --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
  --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
  --shadow:rgba(0,0,0,0.4);
}}
* { margin:0; padding:0; box-sizing:border-box; }
.material-symbols-outlined { font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; }
body { font-family:var(--font-display); background:var(--background); color:var(--on-background); display:flex; flex-direction:column; min-height:100vh; }
main { flex:1; display:flex; flex-direction:column; }
.top-bar { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--background); position:sticky; top:0; z-index:10; }
.top-bar .material-symbols-outlined { font-size:var(--icon-md); color:var(--on-surface-variant); cursor:pointer; }
.top-bar h1 { font-size:20px; font-weight:600; flex:1; color:var(--on-background); }
.state-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px var(--sp-lg) 96px; gap:var(--sp-md); }
.state-icon-wrap { width:96px; height:96px; border-radius:48px; background:var(--error-container); display:flex; align-items:center; justify-content:center; }
.state-icon-wrap .material-symbols-outlined { font-size:var(--icon-2xl); color:var(--error); }
.state-title { font-size:20px; font-weight:600; color:var(--on-background); }
.state-message { font-size:14px; font-weight:400; color:var(--on-surface-variant); line-height:1.5; max-width:300px; }
.state-btn { margin-top:var(--sp-sm); display:flex; align-items:center; gap:8px; padding:12px 24px; border:none; background:var(--primary); color:var(--on-primary); border-radius:var(--radius-pill); font-family:var(--font-display); font-size:14px; font-weight:500; cursor:pointer; }
.state-btn .material-symbols-outlined { font-size:var(--icon-sm); }
.bottom-nav { position:sticky; bottom:0; left:0; right:0; display:flex; background:var(--surface); border-top:1px solid var(--outline-variant); padding:6px 0 8px; z-index:20; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; cursor:pointer; color:var(--on-surface-variant); }
.nav-item.active { color:var(--primary); }
.nav-item.active .nav-indicator { background:var(--nav-active-indicator); border-radius:16px; padding:2px 16px; }
.nav-item .material-symbols-outlined { font-size:var(--icon-sm); }
.nav-item .nav-label { font-size:11px; font-weight:500; }
</style>
</head>
<body>
<main data-component-type="screen" data-component-id="transaction_detail_error">
  <div class="top-bar" data-component-type="top-app-bar" data-component-id="top_app_bar">
    <span class="material-symbols-outlined" data-component-type="icon" data-component-id="back_button" data-nav-to="transactions" data-nav-type="pop" tabindex="0" role="button" aria-label="Back">arrow_back</span>
    <h1>Transaction Details</h1>
  </div>

  <div class="state-wrap" data-component-type="box" data-component-id="error_state_card" role="alert" aria-label="Couldn't load transaction">
    <div class="state-icon-wrap" data-component-type="box" data-component-id="error_state_icon_wrap">
      <span class="material-symbols-outlined" data-component-type="icon" data-component-id="error_state_icon" role="img" aria-label="Connection error">cloud_off</span>
    </div>
    <div class="state-title" data-component-type="text" data-component-id="error_state_title">Couldn't load transaction</div>
    <div class="state-message" data-component-type="text" data-component-id="error_state_message">We could not load this transaction. It may have been removed or there may be a connection issue.</div>
    <button class="state-btn" data-component-type="button" data-component-id="error_state_action" data-action="retry_load" tabindex="0" role="button" aria-label="Retry loading transaction">
      <span class="material-symbols-outlined">refresh</span>Retry
    </button>
  </div>
</main>

<nav class="bottom-nav" data-component-type="bottom-nav" data-component-id="bottom_nav" role="navigation" aria-label="Primary">
  <div class="nav-item" data-component-type="box" data-component-id="nav_home" data-nav-to="home" tabindex="0" role="button" aria-label="Home"><span class="material-symbols-outlined">home</span><span class="nav-label">Home</span></div>
  <div class="nav-item active" data-component-type="box" data-component-id="nav_accounts" data-nav-to="accounts" tabindex="0" role="button" aria-label="Accounts" aria-current="page"><div class="nav-indicator"><span class="material-symbols-outlined">account_balance</span></div><span class="nav-label">Accounts</span></div>
  <div class="nav-item" data-component-type="box" data-component-id="nav_pay" data-nav-to="send-money" tabindex="0" role="button" aria-label="Pay"><span class="material-symbols-outlined">send</span><span class="nav-label">Pay</span></div>
  <div class="nav-item" data-component-type="box" data-component-id="nav_insights" data-nav-to="pfm-dashboard" tabindex="0" role="button" aria-label="Insights"><span class="material-symbols-outlined">insights</span><span class="nav-label">Insights</span></div>
  <div class="nav-item" data-component-type="box" data-component-id="nav_more" data-nav-to="settings" tabindex="0" role="button" aria-label="More"><span class="material-symbols-outlined">more_horiz</span><span class="nav-label">More</span></div>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
