<!doctype html>
<!-- render-hash: 2c9a4e7b1f3d -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="screen-id" content="transaction-detail">
  <meta name="screen-state" content="error">
  <title>Transaction Detail — Error</title>
  <!-- Demo fixture: error_token_expired — recoverable=true → Retry visible; Go back hidden -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    /* ── Design tokens: Open Banking — Trust Blue (light) ───────────────── */
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      /* Typography */
      --md-sys-typescale-headline-small-size: 24px;
      --md-sys-typescale-headline-small-line-height: 32px;
      --md-sys-typescale-body-medium-size: 14px;
      --md-sys-typescale-body-medium-line-height: 20px;
      --md-sys-typescale-label-large-size: 14px;
      --md-sys-typescale-label-large-line-height: 20px;
      /* Spacing */
      --spacing-screen: 16px;
      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-full: 9999px;
      --page-backdrop: #2B2D30;
    }

    /* ── Dark palette (RV-023) ───────────────────────────────────────── */
    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #95CDF7;
        --md-sys-color-on-primary: #00344E;
        --md-sys-color-primary-container: #004B6F;
        --md-sys-color-on-primary-container: #C9E6FF;
        --md-sys-color-secondary: #B7C9D9;
        --md-sys-color-on-secondary: #22323F;
        --md-sys-color-secondary-container: #384956;
        --md-sys-color-on-secondary-container: #D3E5F5;
        --md-sys-color-error: #FFB4AB;
        --md-sys-color-on-error: #690005;
        --md-sys-color-error-container: #93000A;
        --md-sys-color-on-error-container: #FFDAD6;
        --md-sys-color-background: #101417;
        --md-sys-color-on-background: #E0E3E8;
        --md-sys-color-surface: #101417;
        --md-sys-color-on-surface: #E0E3E8;
        --md-sys-color-surface-variant: #41474D;
        --md-sys-color-on-surface-variant: #C1C7CE;
        --md-sys-color-surface-container: #1C2024;
        --md-sys-color-surface-container-low: #181C20;
        --md-sys-color-outline: #8B9198;
        --md-sys-color-outline-variant: #41474D;
      }
    }

    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: var(--page-backdrop);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Device frame ───────────────────────────────────────────── */
    .device-frame {
      width: 390px;
      height: 844px;
      background: var(--md-sys-color-background);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
      position: relative;
    }

    /* ── Status bar ─────────────────────────────────────────────── */
    .status-bar {
      height: 44px;
      background: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .status-bar-time {
      font-size: 15px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      letter-spacing: -0.3px;
    }
    .status-bar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--md-sys-color-on-surface);
    }
    .status-bar-icons .material-symbols-outlined { font-size: 16px; }

    /* ── Top app bar (sub-screen: back arrow, no active bottom nav tab) ── */
    .top-app-bar {
      height: 64px;
      background: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .top-app-bar-leading {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--md-sys-color-on-surface);
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .top-app-bar-leading:active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--md-sys-color-on-surface);
      opacity: 0.08;
      border-radius: var(--radius-full);
    }
    .top-app-bar-leading .material-symbols-outlined { font-size: 24px; }
    .top-app-bar-title {
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      margin-left: 4px;
      flex: 1;
    }

    /* ── Screen content ─────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      background: var(--md-sys-color-background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-screen);
    }

    /* ── Error empty state ──────────────────────────────────────── */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      max-width: 300px;
      padding: 24px 0;
    }

    .error-icon-container {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-full);
      background: var(--md-sys-color-error-container);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .error-icon-container .material-symbols-outlined {
      font-size: 36px;
      color: var(--md-sys-color-on-error-container);
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 36;
    }

    .error-title {
      /* headlineSmall — 24px/32px */
      font-size: var(--md-sys-typescale-headline-small-size);
      line-height: var(--md-sys-typescale-headline-small-line-height);
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
    }

    .error-body {
      /* bodyMedium — 14px/20px */
      font-size: var(--md-sys-typescale-body-medium-size);
      line-height: var(--md-sys-typescale-body-medium-line-height);
      font-weight: 400;
      color: var(--md-sys-color-on-surface-variant);
    }

    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    /* M3 filled button (Retry — shown when error.recoverable = true) */
    .btn-filled {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 24px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-family: 'Roboto', sans-serif;
      font-size: var(--md-sys-typescale-label-large-size);
      line-height: var(--md-sys-typescale-label-large-line-height);
      font-weight: 500;
      letter-spacing: 0.1px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      min-width: 48px;
      user-select: none;
    }
    .btn-filled:active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--md-sys-color-on-primary);
      opacity: 0.08;
      border-radius: var(--radius-full);
    }

    /* M3 outlined button (Go back — shown when error.recoverable = false)  */
    /* Fixture: error_token_expired → recoverable=true → Go back hidden     */
    .btn-outlined {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 24px;
      border-radius: var(--radius-full);
      border: 1px solid var(--md-sys-color-outline);
      background: transparent;
      color: var(--md-sys-color-primary);
      font-family: 'Roboto', sans-serif;
      font-size: var(--md-sys-typescale-label-large-size);
      line-height: var(--md-sys-typescale-label-large-line-height);
      font-weight: 500;
      letter-spacing: 0.1px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Hidden in this fixture (recoverable=true) */
    .btn-outlined[aria-hidden="true"] { display: none; }

    /* ── Home indicator ─────────────────────────────────────────── */
    .home-indicator {
      height: 34px;
      background: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .home-indicator-bar {
      width: 134px;
      height: 5px;
      background: var(--md-sys-color-on-surface);
      border-radius: 3px;
      opacity: 0.18;
    }
  </style>
</head>
<body>
  <div class="device-frame">

    <!-- Status bar -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar-time">9:41</span>
      <div class="status-bar-icons">
        <span class="material-symbols-outlined">signal_cellular_alt</span>
        <span class="material-symbols-outlined">wifi</span>
        <span class="material-symbols-outlined">battery_full</span>
      </div>
    </div>

    <!-- Top app bar: sub-screen → back arrow; no active bottom nav tab (bottom_navigation_visible=false) -->
    <header
      class="top-app-bar"
      data-component-type="top_app_bar"
      data-component-variant="small"
      role="banner"
    >
      <button
        class="top-app-bar-leading"
        data-component-type="icon_button"
        data-component-id="back_button"
        data-component-variant="standard"
        aria-label="Navigate back to Transactions"
        data-nav-to="transactions"
      >
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <span class="top-app-bar-title">Transaction</span>
    </header>

    <!--
      Error state — fixture: error_token_expired
        error_type: TokenExpiredError | http_status: 401
        message: "Session expired. Please log in again."
        recoverable: true
      → retry_button VISIBLE (filled), go_back_button HIDDEN (aria-hidden)
    -->
    <main
      class="screen-content"
      data-state="error"
      role="main"
    >
      <div
        class="error-state"
        data-component-type="empty_state"
        data-component-id="error_state"
        data-component-variant="error"
        aria-label="Could not load transaction"
        role="alert"
      >

        <!-- Error icon in error-container circle -->
        <div class="error-icon-container" aria-hidden="true">
          <span class="material-symbols-outlined">error_outline</span>
        </div>

        <!-- Error title -->
        <h1
          class="error-title"
          data-component-type="text"
          data-component-id="error_title"
        >Could not load transaction</h1>

        <!-- Error body — fixture: error_token_expired.message -->
        <p
          class="error-body"
          data-component-type="text"
          data-component-id="error_body"
        >Session expired. Please log in again.</p>

        <!-- Action buttons -->
        <div class="error-actions">

          <!-- Retry button: visible when error.recoverable = true (fixture: TokenExpiredError) -->
          <button
            class="btn-filled"
            data-component-type="button"
            data-component-id="retry_button"
            data-component-variant="filled"
            aria-label="Retry"
            data-action="retry_load"
          >Retry</button>

          <!-- Go back button: hidden when error.recoverable = true; visible for 403/404 non-recoverable -->
          <button
            class="btn-outlined"
            data-component-type="button"
            data-component-id="go_back_button"
            data-component-variant="outlined"
            aria-label="Go back"
            aria-hidden="true"
            data-nav-to="transactions"
          >Go back</button>

        </div>
      </div>
    </main>

    <!-- No bottom navigation: shell.bottom_navigation_visible = false (sub-screen of transactions) -->

    <!-- Home indicator -->
    <div class="home-indicator" aria-hidden="true">
      <div class="home-indicator-bar"></div>
    </div>

  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
