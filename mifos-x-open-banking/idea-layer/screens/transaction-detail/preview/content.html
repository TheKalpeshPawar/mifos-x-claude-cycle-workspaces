<!doctype html>
<html lang="en" data-screen="transaction-detail" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      min-height: 100vh;
    }
    .screen-root {
      max-width: 390px;
      margin: 0 auto;
      background: var(--background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-app-bar {
      display: flex; align-items: center;
      padding: 12px 16px;
      background: var(--primary);
      gap: 12px;
    }
    .top-app-bar .nav-icon { cursor: pointer; color: var(--on-primary); font-size: 24px; }
    .top-app-bar .bar-title { font-size: 20px; font-weight: 600; color: var(--on-primary); flex: 1; }
    .top-app-bar .action-icon { cursor: pointer; color: var(--on-primary); font-size: 24px; }
    .scroll-content { flex: 1; overflow-y: auto; }
    /* Hero section */
    .amount-hero {
      background: var(--primary);
      padding: 28px 24px 48px;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px;
    }
    .hero-amount {
      font-size: 48px; font-weight: 700;
      color: var(--error);
      text-align: center;
    }
    .status-badge-row {
      display: flex; justify-content: center;
    }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(76,102,43,0.2);
      border-radius: 20px;
      padding: 6px 16px;
    }
    .status-pill .material-icons { font-size: 14px; color: var(--primary-container); }
    .status-pill-text { font-size: 13px; color: var(--primary-container); font-weight: 500; }
    /* Merchant card — overlaps hero */
    .merchant-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      margin: -20px 20px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      position: relative;
      z-index: 2;
    }
    .merchant-row { display: flex; align-items: center; gap: 16px; }
    .merchant-logo {
      width: 56px; height: 56px;
      border-radius: 28px;
      background: var(--primary-container);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: var(--primary);
      flex-shrink: 0;
    }
    .merchant-info { flex: 1; }
    .merchant-name { font-size: 18px; font-weight: 600; color: var(--on-surface); }
    .category-badge {
      display: inline-block;
      background: var(--primary-container);
      border-radius: 6px;
      padding: 4px 8px;
      margin-top: 4px;
    }
    .category-text { font-size: 11px; color: var(--primary); font-weight: 500; }
    /* Details card */
    .details-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
      margin: 0 20px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .detail-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 16px;
    }
    .detail-label {
      font-size: 11px; color: var(--on-surface-variant);
      letter-spacing: 0.4px; font-weight: 500;
      text-transform: uppercase;
    }
    .detail-value { font-size: 14px; color: var(--on-surface); font-weight: 500; text-align: right; max-width: 55%; }
    .detail-value.mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .detail-value-col { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .detail-value-sub { font-size: 12px; color: var(--outline); font-family: 'Courier New', monospace; }
    .copy-row { display: flex; align-items: center; gap: 6px; }
    .copy-icon {
      cursor: pointer; background: none; border: none;
      display: flex; align-items: center;
      color: var(--primary);
      padding: 0;
    }
    .copy-icon .material-icons { font-size: 16px; }
    .det-divider { height: 1px; background: var(--background); margin-bottom: 16px; }
    /* Action buttons area */
    .actions-area { padding: 0 20px 12px; }
    .btn-outlined {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: transparent; color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: 12px; padding: 14px;
      width: 100%; font-size: 15px; font-weight: 600;
      font-family: 'Outfit', sans-serif; cursor: pointer;
    }
    .btn-outlined:hover { background: var(--primary-container); }
    .btn-outlined .material-icons { font-size: 18px; }
    .report-row {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 16px 20px 24px;
    }
    .report-icon { font-size: 16px; color: var(--error); }
    .report-link {
      font-size: 13px; font-weight: 500; color: var(--error);
      cursor: pointer; background: none; border: none;
      font-family: 'Outfit', sans-serif;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
<div class="screen-root">
  <div class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar_txn_detail">
    <span class="material-icons nav-icon"
          role="button" tabindex="0"
          aria-label="Go back"
          data-action="navigate_back">arrow_back</span>
    <span class="bar-title">Transaction Details</span>
    <span class="material-icons action-icon"
          role="button" tabindex="0"
          aria-label="Share transaction"
          data-action="share_transaction">share</span>
  </div>

  <div class="scroll-content">
    <!-- Hero -->
    <div class="amount-hero"
         data-component-type="box"
         data-component-id="amount_hero_section"
         role="region"
         aria-label="Transaction amount summary">
      <div class="hero-amount"
           data-component-type="text"
           data-component-id="amount_hero_value"
           aria-label="Debit: forty-two pounds fifty">-£42.50</div>
      <div class="status-badge-row"
           data-component-type="stack"
           data-component-id="status_badge_row">
        <div class="status-pill"
             data-component-type="box"
             data-component-id="status_badge">
          <span class="material-icons"
                data-component-type="icon"
                data-component-id="status_icon"
                aria-label="Completed status icon">check_circle</span>
          <span class="status-pill-text"
                data-component-type="text"
                data-component-id="status_label"
                aria-label="Status: Completed">Completed</span>
        </div>
      </div>
    </div>

    <!-- Merchant Card -->
    <div class="merchant-card"
         data-component-type="box"
         data-component-id="merchant_card"
         role="region"
         aria-label="Merchant information">
      <div class="merchant-row"
           data-component-type="stack"
           data-component-id="merchant_row">
        <div class="merchant-logo"
             data-component-type="image"
             data-component-id="merchant_logo"
             role="img"
             aria-label="Tesco Supermarket logo">T</div>
        <div class="merchant-info"
             data-component-type="stack"
             data-component-id="merchant_info">
          <div class="merchant-name"
               data-component-type="text"
               data-component-id="merchant_name"
               role="heading"
               aria-level="2"
               aria-label="Merchant: Tesco Supermarket">Tesco Supermarket</div>
          <div class="category-badge"
               data-component-type="box"
               data-component-id="category_badge">
            <span class="category-text"
                  data-component-type="text"
                  data-component-id="category_label"
                  aria-label="Category: Groceries">Groceries</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Details Card -->
    <div class="details-card"
         data-component-type="box"
         data-component-id="details_card"
         role="region"
         aria-label="Transaction details">

      <div class="detail-row"
           data-component-type="stack"
           data-component-id="detail_date_row">
        <span class="detail-label"
              data-component-type="text"
              data-component-id="detail_date_label">Date &amp; Time</span>
        <span class="detail-value"
              data-component-type="text"
              data-component-id="detail_date_value"
              aria-label="Transaction date: 25 May 2026, 14:32">25 May 2026, 14:32</span>
      </div>
      <div class="det-divider" data-component-type="divider" data-component-id="detail_div_1" role="separator"></div>

      <div class="detail-row"
           data-component-type="stack"
           data-component-id="detail_reference_row">
        <span class="detail-label"
              data-component-type="text"
              data-component-id="detail_reference_label">Reference</span>
        <div class="copy-row"
             data-component-type="stack"
             data-component-id="reference_value_row">
          <span class="detail-value mono"
                data-component-type="text"
                data-component-id="detail_reference_value"
                aria-label="Reference: SEPA-2026051500123">SEPA-2026051500123</span>
          <button class="copy-icon"
                  data-component-type="icon"
                  data-component-id="copy_reference_icon"
                  role="button" tabindex="0"
                  aria-label="Copy reference number"
                  data-action="copy_reference">
            <span class="material-icons">content_copy</span>
          </button>
        </div>
      </div>
      <div class="det-divider" data-component-type="divider" data-component-id="detail_div_2" role="separator"></div>

      <div class="detail-row"
           data-component-type="stack"
           data-component-id="detail_type_row">
        <span class="detail-label"
              data-component-type="text"
              data-component-id="detail_type_label">Transaction Type</span>
        <span class="detail-value"
              data-component-type="text"
              data-component-id="detail_type_value"
              aria-label="Transaction type: SEPA Credit Transfer">SEPA Credit Transfer</span>
      </div>
      <div class="det-divider" data-component-type="divider" data-component-id="detail_div_3" role="separator"></div>

      <div class="detail-row"
           data-component-type="stack"
           data-component-id="detail_from_row">
        <span class="detail-label"
              data-component-type="text"
              data-component-id="detail_from_label">From Account</span>
        <div class="detail-value-col"
             data-component-type="stack"
             data-component-id="detail_from_value_col">
          <span class="detail-value"
                data-component-type="text"
                data-component-id="detail_from_account_name">Primary Checking</span>
          <span class="detail-value-sub"
                data-component-type="text"
                data-component-id="detail_from_iban"
                aria-label="Account ending 0130">...0130</span>
        </div>
      </div>
      <div class="det-divider" data-component-type="divider" data-component-id="detail_div_4" role="separator"></div>

      <div class="detail-row"
           data-component-type="stack"
           data-component-id="detail_to_row"
           style="padding-bottom: 0;">
        <span class="detail-label"
              data-component-type="text"
              data-component-id="detail_to_label">To Beneficiary</span>
        <div class="detail-value-col"
             data-component-type="stack"
             data-component-id="detail_to_value_col">
          <span class="detail-value"
                data-component-type="text"
                data-component-id="detail_to_name">Tesco PLC</span>
          <span class="detail-value-sub"
                data-component-type="text"
                data-component-id="detail_to_iban"
                aria-label="Beneficiary IBAN ending 0044">DE89 3704...0044</span>
        </div>
      </div>
    </div>

    <!-- Download Receipt -->
    <div class="actions-area">
      <button class="btn-outlined"
              data-component-type="button"
              data-component-id="download_receipt_button"
              role="button" tabindex="0"
              aria-label="Download transaction receipt as PDF"
              data-action="download_receipt">
        <span class="material-icons">download</span>
        Download Receipt
      </button>
    </div>

    <!-- Report Issue -->
    <div class="report-row"
         data-component-type="stack"
         data-component-id="report_issue_row"
         role="group">
      <span class="material-icons report-icon"
            data-component-type="icon"
            data-component-id="report_issue_icon"
            aria-label="Report icon">flag</span>
      <button class="report-link"
              data-component-type="link"
              data-component-id="report_issue_link"
              role="button" tabindex="0"
              aria-label="Report an issue with this transaction"
              data-action="open_dispute_form">Report an Issue</button>
    </div>

    <div style="height:16px;" data-component-type="spacer" data-component-id="bottom_spacer"></div>
  </div>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
