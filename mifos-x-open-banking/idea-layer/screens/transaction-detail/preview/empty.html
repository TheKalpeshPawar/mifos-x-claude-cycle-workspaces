<html lang="en">

    [data-theme="dark"] {

      --md-on-primary: #00344E;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    }
    .app-frame {

      position: sticky;
      top: 0;

      font-weight: var(--fw-title-medium);

  <div class="app-frame" data-screen="transaction-detail" data-component-type="screen" data-component-id="transaction-detail" data-component-variant="empty">

    <header class="top-app-bar" role="banner">
      <button class="back-button" data-action="navigate_back" aria-label="Navigate back" type="button">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>

    </header>

      class="screen-content"
      id="main-content"
      aria-label="Transaction not found"
      data-component-type="empty_state"
      data-component-id="transaction_empty_state"
      data-component-variant="empty"
    >
      <span class="material-symbols-outlined empty-icon" aria-hidden="true">receipt_long</span>
      <h2 class="empty-title">Transaction not found</h2>
      <p class="empty-body">This transaction is no longer available. It may have been removed or your consent has expired.</p>
      <button
        class="btn-outlined"
        data-nav-to="transactions"
        aria-label="Go back to transactions"
        type="button"
        data-component-type="button"
        data-component-id="transaction_empty_back_button"
      >
        Go back
      </button>
    </main>

  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
