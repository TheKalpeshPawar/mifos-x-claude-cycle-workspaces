<style>
:root {
  --primary: #4C662B; --on-primary: #FFFFFF;

  --skel-base: #E1E4D5; --skel-shine: #EFF2E3;
  --skel-hero-base: #3C521F; --skel-hero-shine: #557530;
}
[data-theme="dark"] {
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;

@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--on-secondary:#003735;--error:#FFB4AB;--on-error:#690005;--background:#12140E;--on-background:#E3E3D8;--surface:#1A1C16;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--shadow:rgba(0,0,0,0.5);--skel-base:#2A2C25;--skel-shine:#3A3D33;--skel-hero-base:#2C4011;--skel-hero-shine:#3A5418}}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
.top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--primary); color: var(--on-primary); }
.top-bar .material-icons { font-size: 24px; color: var(--on-primary); cursor: pointer; }
.top-bar h1 { font-size: 18px; font-weight: 600; flex: 1; color: var(--on-primary); }
.skel { background: linear-gradient(90deg, var(--skel-base) 0%, var(--skel-shine) 50%, var(--skel-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
.skel-hero { background: linear-gradient(90deg, var(--skel-hero-base) 0%, var(--skel-hero-shine) 50%, var(--skel-hero-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; height: 160px; padding: 16px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.skel-hero-amount { width: 220px; height: 44px; border-radius: 8px; background: rgba(255,255,255,0.22); }
.skel-hero-badge { width: 120px; height: 30px; border-radius: 15px; background: rgba(255,255,255,0.22); }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-merchant { height: 100px; margin: -32px 20px 16px; border-radius: 20px; box-shadow: 0 4px 12px var(--shadow); }
.skel-details { height: 300px; margin: 0 20px 16px; border-radius: 16px; box-shadow: 0 1px 2px var(--shadow); }
.skel-action { height: 52px; margin: 0 20px 12px; border-radius: 12px; }
</style>
