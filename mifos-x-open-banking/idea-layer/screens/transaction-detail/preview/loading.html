<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Transaction Details — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
  background:var(--background);
  font-family:var(--font);
}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{
  width:390px;height:56px;
  background:var(--primary);
  display:flex;align-items:center;padding:0 8px;gap:4px;
}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--on-primary);}
.top-bar-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.screen-content{
  height:calc(844px - 56px);
  overflow-y:auto;scrollbar-width:none;padding-bottom:24px;
}
.screen-content::-webkit-scrollbar{display:none;}
@keyframes shimmer{
  0%{background-position:-390px 0}
  100%{background-position:390px 0}
}
.shimmer{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--background) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:8px;
}
/* Hero skeleton (primary bg) */
.skel-hero-area{
  background:var(--primary);
  padding:28px 24px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.skel-amount{height:44px;width:150px;background:rgba(255,255,255,0.3);border-radius:10px;}
.skel-status-badge{height:30px;width:120px;background:rgba(255,255,255,0.2);border-radius:15px;}
/* Merchant card skeleton */
.skel-merchant-card{
  background:var(--surface);
  border-radius:20px;
  padding:20px;
  margin:0 20px;
  margin-top:-20px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.1);
  display:flex;align-items:center;gap:16px;
}
.skel-merchant-logo{width:56px;height:56px;border-radius:28px;flex-shrink:0;}
.skel-merchant-info{flex:1;display:flex;flex-direction:column;gap:8px;}
.skel-merchant-name{height:18px;width:150px;border-radius:6px;}
.skel-merchant-cat{height:22px;width:80px;border-radius:6px;}
/* Details card skeleton */
.skel-details-card{
  background:var(--surface);
  border-radius:16px;
  padding:20px;
  margin:0 20px 16px;
  display:flex;flex-direction:column;gap:0;
}
.skel-detail-row{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:16px;
}
.skel-detail-label{height:10px;width:80px;border-radius:4px;}
.skel-detail-value{height:14px;width:130px;border-radius:6px;}
.skel-divider{height:1px;background:var(--background);margin-bottom:16px;}
/* Action button skeletons */
.skel-action-btn{
  height:52px;
  border-radius:12px;
  margin:0 20px 12px;
}
.skel-report-row{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;
}
.skel-report{height:12px;width:120px;border-radius:5px;}
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-bar-back">
    <span class="mi" style="font-size:24px;color:var(--on-primary);opacity:0.7;">arrow_back</span>
  </div>
  <span class="top-bar-title">Transaction Details</span>
  <div class="top-bar-action">
    <span class="mi" style="font-size:24px;color:var(--on-primary);opacity:0.7;">share</span>
  </div>
</header>

<main data-screen="transaction-detail" data-state="loading" role="main" aria-busy="true" aria-label="Loading transaction details">
  <div class="screen-content">

    <!-- Hero skeleton -->
    <div class="skel-hero-area">
      <div class="skel-amount"></div>
      <div class="skel-status-badge"></div>
    </div>

    <!-- Merchant card skeleton -->
    <div class="skel-merchant-card">
      <div class="shimmer skel-merchant-logo"></div>
      <div class="skel-merchant-info">
        <div class="shimmer skel-merchant-name"></div>
        <div class="shimmer skel-merchant-cat"></div>
      </div>
    </div>

    <!-- Details card skeleton -->
    <div class="skel-details-card">
      <div class="skel-detail-row">
        <div class="shimmer skel-detail-label"></div>
        <div class="shimmer skel-detail-value" style="width:150px;"></div>
      </div>
      <div class="skel-divider"></div>

      <div class="skel-detail-row">
        <div class="shimmer skel-detail-label"></div>
        <div class="shimmer skel-detail-value" style="width:170px;"></div>
      </div>
      <div class="skel-divider"></div>

      <div class="skel-detail-row">
        <div class="shimmer skel-detail-label" style="width:120px;"></div>
        <div class="shimmer skel-detail-value" style="width:140px;"></div>
      </div>
      <div class="skel-divider"></div>

      <div class="skel-detail-row" style="align-items:flex-start;">
        <div class="shimmer skel-detail-label" style="width:100px;"></div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
          <div class="shimmer skel-detail-value" style="width:120px;"></div>
          <div class="shimmer skel-detail-value" style="width:60px;height:12px;"></div>
        </div>
      </div>
      <div class="skel-divider"></div>

      <div class="skel-detail-row" style="align-items:flex-start;">
        <div class="shimmer skel-detail-label" style="width:100px;"></div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
          <div class="shimmer skel-detail-value" style="width:80px;"></div>
          <div class="shimmer skel-detail-value" style="width:110px;height:12px;"></div>
        </div>
      </div>
    </div>

    <!-- Button skeleton -->
    <div class="shimmer skel-action-btn"></div>

    <!-- Report issue skeleton -->
    <div class="skel-report-row">
      <div class="shimmer" style="width:16px;height:16px;border-radius:50%;"></div>
      <div class="shimmer skel-report"></div>
    </div>

  </div>
</main>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
