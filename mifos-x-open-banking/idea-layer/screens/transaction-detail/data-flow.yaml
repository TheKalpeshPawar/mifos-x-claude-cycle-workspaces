sibling: data-flow
schema_version: "4.0"
feature_id: transaction-detail
entries:
  - screen_id: transaction-detail
    trigger: on_mount
    endpoints:
      - obp_get_transaction_detail
    direction: read
    dtos:
      - name: Transaction
        role: response
        api_id: obp_get_transaction_detail
      - name: TransactionMetadata
        role: response
        api_id: obp_get_transaction_detail
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: error_state
      - error_code: 500
        behavior: error_state
