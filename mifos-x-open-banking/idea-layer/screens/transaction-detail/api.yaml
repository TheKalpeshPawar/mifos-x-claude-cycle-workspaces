sibling: api
schema_version: "4.0"
feature_id: transaction-detail
api:
  - id: obp_get_transaction_detail
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/transaction"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
      - name: accountId
        type: path
      - name: transactionId
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: this_account
          type: object
          children:
            - name: id
              type: String
            - name: account_routings
              type: "List<AccountRouting>"
        - name: other_account
          type: object
          children:
            - name: id
              type: String
            - name: holder
              type: object
              children:
                - name: name
                  type: String
                - name: is_alias
                  type: Boolean
            - name: account_routings
              type: "List<AccountRouting>"
            - name: metadata
              type: object
              children:
                - name: image_url
                  type: "String?"
        - name: details
          type: object
          children:
            - name: type
              type: String
            - name: description
              type: String
            - name: posted
              type: String
            - name: completed
              type: String
            - name: new_balance
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
            - name: value
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
        - name: metadata
          type: object
          children:
            - name: narrative
              type: "String?"
            - name: comments
              type: "List<Comment>"
            - name: tags
              type: "List<Tag>"
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Transaction not found"
      - code: 500
        message: "OBP server error"
