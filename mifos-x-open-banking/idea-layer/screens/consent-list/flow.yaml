feature: consent-dashboard
flow_ref: consent-management

entry_points:
  - source: app_shell_more_menu
    label: "More / Settings → Consents"

transitions:
  - from: consent-list
    to: consent-detail
    trigger: "Tap a consent card (active or history)"
    params: [consentId]
  - from: consent-list
    to: user-onboarding
    trigger: "Tap 'Connect HSBC' on empty state"
  - from: consent-list
    to: login
    trigger: "Tap 'Sign in again' on auth error state (401 PSU session expired)"
