<!doctype html>

<!-- nav-update: 4-tab (Home/Accounts/Transactions/More), no active tab, back arrow — 2026-06-30 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connected Banks — loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container: #EBEEF3;
      --fs-title-large: 22px; --lh-title-large: 28px; --fw-title-large: 400;
      --fs-label-medium: 12px; --lh-label-medium: 16px; --fw-label-medium: 500;
    }
    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container: #1C2024;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      -webkit-font-smoothing: antialiased;
    }
    .app-frame {
      max-width: 390px;
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: var(--md-background);
      position: relative;
    }
    /* Top App Bar — back arrow (pushed screen) */
    .top-app-bar {
      height: 64px;
      background-color: var(--md-surface);
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .back-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--md-on-surface);
      flex-shrink: 0;
    }
    .top-app-bar-title {
      font-size: var(--fs-title-large);
      font-weight: var(--fw-title-large);
      line-height: var(--lh-title-large);
      color: var(--md-on-surface);
      flex: 1;
    }
    /* Loading state — centred circular progress */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .circular-progress {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid var(--md-surface-container);
      border-top-color: var(--md-primary);
      animation: spin 1s linear infinite;
    }
    /* Bottom Navigation — 4 tabs, NONE active */
    .bottom-nav {
      height: 80px;
      background-color: var(--md-surface-container);
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      display: flex;
      align-items: flex-start;
      padding: 12px 8px 0;
      border-top: 1px solid var(--md-outline-variant);
      z-index: 20;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--md-on-surface-variant);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-medium);
      font-weight: var(--fw-label-medium);
      line-height: var(--lh-label-medium);
      min-height: 48px;
      padding: 0 4px;
      text-decoration: none;
    }
    .nav-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: 9999px;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="app-frame" data-screen="consent-list" data-component-type="screen" data-component-id="consent-list" data-component-variant="loading">

    <!-- Top App Bar — back arrow -->
    <header class="top-app-bar" role="banner">
      <button
        class="back-button"
        data-action="navigate_back"
        aria-label="Navigate back"
        type="button"
      >
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar-title">Connected Banks</h1>
    </header>

    <!-- Loading State -->
    <main class="screen-content" id="main-content">
      <div
        class="circular-progress"
        role="progressbar"
        aria-label="Loading connected banks"
        aria-valuemin="0"
        aria-valuemax="100"
        data-component-type="progress_indicator"
        data-component-id="loading_progress"
        data-component-variant="circular"
      ></div>
    </main>

    <!-- Bottom Navigation — 4 tabs: Home · Accounts · Transactions · More, NONE active -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
      <a class="nav-item" href="#" data-nav-to="home" aria-label="Home">
        <div class="nav-indicator">
          <span class="material-symbols-outlined" aria-hidden="true">home</span>
        </div>
        <span>Home</span>
      </a>
      <a class="nav-item" href="#" data-nav-to="accounts" aria-label="Accounts">
        <div class="nav-indicator">
          <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
        </div>
        <span>Accounts</span>
      </a>
      <a class="nav-item" href="#" data-nav-to="transactions" aria-label="Transactions">
        <div class="nav-indicator">
          <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
        </div>
        <span>Transactions</span>
      </a>
      <a class="nav-item" href="#" data-nav-to="settings" aria-label="More">
        <div class="nav-indicator">
          <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
        </div>
        <span>More</span>
      </a>
    </nav>

  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
