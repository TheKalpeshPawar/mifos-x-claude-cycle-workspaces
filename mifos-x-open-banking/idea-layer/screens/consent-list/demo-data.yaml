screen_id: consent-list
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-style OBReadConsentResponse1 data only. Three fixtures cover every OBIE consent status (Authorised / Authorised-near-expiry / Expired) to exercise all content-state rendering paths."

# ── Fixture 1: Authorised — 89 days until expiry ─────────────────────────────
# Full 10-permission consent granted yesterday; well inside the 90-day window.
# Renders: active section, normal expiry colour, no reconfirm chip.
consents:
  - Data:
      ConsentId: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
      Status: "Authorised"
      CreationDateTime: "2026-06-28T18:25:00Z"
      StatusUpdateDateTime: "2026-06-28T18:25:43Z"
      Permissions:
        - ReadAccountsDetail
        - ReadBalances
        - ReadTransactionsDetail
        - ReadBeneficiariesDetail
        - ReadStandingOrdersDetail
        - ReadDirectDebits
        - ReadScheduledPaymentsDetail
        - ReadStatementsDetail
        - ReadProducts
        - ReadParty
      ExpirationDateTime: "2026-09-26T00:00:00Z"
      TransactionFromDateTime: "2026-03-30T00:00:00Z"
      TransactionToDateTime: "2026-06-28T23:59:59Z"
    permission_count: 10
    days_until_expiry: 89
    status_icon: "check_circle"
    status_color: "primary"
    expiry_color: "on-surface-variant"
    formatted_creation_date: "28 Jun 2026"
    formatted_expiry_date: "26 Sep 2026"

  # ── Fixture 2: Authorised — 7 days until expiry (triggers reconfirm warning) ─
  # PSU granted this consent 83 days ago with a narrower 4-permission set.
  # Renders: reconfirm_urgency_chip on card + reconfirm_banner at top, expiry text in error colour.
  - Data:
      ConsentId: "aac-d4e5f6a7-8b9c-4d0e-1f2a-3b4c5d6e7f08"
      Status: "Authorised"
      CreationDateTime: "2026-04-07T10:00:00Z"
      StatusUpdateDateTime: "2026-04-07T10:00:35Z"
      Permissions:
        - ReadAccountsDetail
        - ReadBalances
        - ReadTransactionsDetail
        - ReadStatementsDetail
      ExpirationDateTime: "2026-07-06T00:00:00Z"
      TransactionFromDateTime: "2026-01-07T00:00:00Z"
      TransactionToDateTime: "2026-04-06T23:59:59Z"
    permission_count: 4
    days_until_expiry: 7
    status_icon: "check_circle"
    status_color: "primary"
    expiry_color: "error"
    formatted_creation_date: "7 Apr 2026"
    formatted_expiry_date: "6 Jul 2026"

  # ── Fixture 3: Expired — 3 days past expiry ───────────────────────────────
  # Consent that naturally reached its ExpirationDateTime 3 days ago.
  # Renders: History section below divider, muted status chip, schedule icon.
  # PSU can view the consent detail but cannot access AIS data until they re-consent.
  - Data:
      ConsentId: "aac-a1b2c3d4-e5f6-4789-0abc-def012345678"
      Status: "Expired"
      CreationDateTime: "2026-03-12T09:15:00Z"
      StatusUpdateDateTime: "2026-06-26T00:00:01Z"
      Permissions:
        - ReadAccountsDetail
        - ReadBalances
        - ReadTransactionsDetail
      ExpirationDateTime: "2026-06-26T00:00:00Z"
      TransactionFromDateTime: "2025-12-12T00:00:00Z"
      TransactionToDateTime: "2026-03-11T23:59:59Z"
    permission_count: 3
    days_until_expiry: 0
    status_icon: "schedule"
    status_color: "on-surface-variant"
    expiry_color: "on-surface-variant"
    formatted_creation_date: "12 Mar 2026"
    formatted_expiry_date: "26 Jun 2026"

# ── ViewModel-computed groupings ─────────────────────────────────────────────
# These mirror what ConsentListViewModel partitions from consents[].
active_consents:
  - ref: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"   # 89 days left
  - ref: "aac-d4e5f6a7-8b9c-4d0e-1f2a-3b4c5d6e7f08"   # 7 days left — near-expiry

history_consents:
  - ref: "aac-a1b2c3d4-e5f6-4789-0abc-def012345678"    # Expired 26 Jun 2026

has_active_consents: true
has_history_consents: true
has_near_expiry_consents: true    # fixture 2 has days_until_expiry=7 which is ≤ 14

Links:
  Self: "https://api.hsbc.com/open-banking/v4.0/account-access-consents"
Meta:
