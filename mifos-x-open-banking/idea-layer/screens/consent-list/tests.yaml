screen_id: consent-list

scenarios:
  - id: TC-CLIST-001
    description: "Authorised consent card renders with all required fields"
    state: content
    given: "One Authorised consent (aac-fb2c4e8a) with 89 days_until_expiry in local store; consent-status returns Authorised"
    when: "Screen mounts"
    then:
      - "Card visible under 'Active' section label"
      - "HSBC logo visible with accessibility_label 'HSBC'"
      - "Status chip shows 'Authorised' in primary colour with check_circle icon"
      - "'11 data types shared' text visible"
      - "'Expires in 89 days' text visible in on-surface-variant colour"
      - "'Connected 28 Jun 2026' label visible"
      - "reconfirm_urgency_chip NOT visible (89 days > 14)"
    priority: high

  - id: TC-CLIST-002
    description: "Loading state shown while consent-status is being fetched"
    state: loading
    given: "Consent-status GET in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible with accessibility_label matching {strings.consent_list_loading}"
      - "Consent list not rendered; Active section label not visible"
    priority: high

  - id: TC-CLIST-003
    description: "Empty state shown when no local consent IDs found"
    state: empty
    given: "No ConsentIds in local storage"
    when: "Screen mounts"
    then:
      - "link_off icon visible"
      - "Title matching {strings.consent_list_empty_title} visible"
      - "Body matching {strings.consent_list_empty_body} visible"
      - "'Connect HSBC' button visible; tap navigates to user-onboarding"
      - "'Active' and 'History' section labels NOT rendered"
    priority: high

  - id: TC-CLIST-004
    description: "Generic error state shown on non-auth API failure"
    state: error
    given: "consent-status GET returns HTTP 500"
    when: "Screen mounts"
    then:
      - "error_outline icon visible"
      - "Title matching {strings.consent_list_error_title} visible"
      - "Retry button visible; tap triggers retry_load action"
      - "Auth error state (lock_open icon / 'Sign in again' button) NOT shown"
    priority: medium

  - id: TC-CLIST-005
    description: "Tapping an active consent card navigates to consent-detail"
    state: content
    given: "Authorised consent aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01 rendered in Active section"
    when: "User taps the consent card"
    then: "App navigates to consent-detail with consentId=aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    priority: high

  - id: TC-CLIST-006
    description: "Near-expiry consent (≤14 days) shows reconfirm urgency chip and top banner"
    state: content
    given: "Two active consents — one with 89 days_until_expiry, one with 7 days_until_expiry (aac-d4e5f6a7)"
    when: "Screen renders"
    then:
      - "reconfirm_banner visible at top of content area (has_near_expiry_consents=true)"
      - "reconfirm_urgency_chip with warning_amber icon visible on the 7-day card"
      - "Expiry text 'Expires in 7 days' renders in error colour on the 7-day card"
      - "89-day card does NOT show reconfirm_urgency_chip"
      - "89-day card expiry text renders in on-surface-variant colour"
    priority: high

  - id: TC-CLIST-007
    description: "Expired consent appears in History section below divider"
    state: content
    given: "Two Authorised consents in active_consents and one Expired consent (aac-a1b2c3d4) in history_consents"
    when: "Screen renders"
    then:
      - "'Active' section label and two active cards visible at top"
      - "Horizontal divider visible between active and history sections"
      - "'History' section label visible below divider"
      - "Expired consent card visible with 'Expired' status chip in on-surface-variant colour and schedule icon"
      - "History card shows 'Expired on 26 Jun 2026' and 'Connected 12 Mar 2026'"
      - "History card has elevation=0 (flat, visually subordinate)"
    priority: medium

  - id: TC-CLIST-008
    description: "HTTP 401 on consent-status shows dedicated auth error state with re-auth CTA"
    state: error_auth
    given: "consent-status GET returns HTTP 401 Unauthorized (PSU access token expired)"
    when: "Screen mounts"
    then:
      - "lock_open icon visible"
      - "Title matching {strings.consent_list_auth_error_title} visible"
      - "Body matching {strings.consent_list_auth_error_body} visible"
      - "'Sign in again' button visible; tap triggers navigate_reauth → navigates to login"
      - "Generic Retry button NOT shown (avoids misleading retry of an auth-expired session)"
    priority: medium
