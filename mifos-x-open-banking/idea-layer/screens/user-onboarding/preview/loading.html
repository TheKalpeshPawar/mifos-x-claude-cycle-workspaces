<!doctype html>
<!-- render-hash: e8b9fa0bec2d -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get started — loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-primary: #266489;
      --md-primary-container: #C9E6FF;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-on-surface-variant: #41474D;
      --fs-body-medium: 14px; --lh-body-medium: 20px; --fw-body-medium: 400;
    }
    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-primary-container: #004B6F;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-on-surface-variant: #C1C7CE;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      -webkit-font-smoothing: antialiased;
    }
    .app-frame {
      max-width: 390px;
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: var(--md-background);
    }
    .screen-content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid var(--md-primary-container);
      border-top-color: var(--md-primary);
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label {
      font-size: var(--fs-body-medium);
      font-weight: var(--fw-body-medium);
      line-height: var(--lh-body-medium);
      color: var(--md-on-surface-variant);
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2400ms; }
    }
  </style>
</head>
<body>
  <div class="app-frame" data-screen="user-onboarding" data-component-type="screen" data-component-id="user-onboarding" data-component-variant="loading">

    <main
      class="screen-content"
      id="main-content"
      role="status"
      aria-live="polite"
      aria-label="Loading onboarding steps, please wait"
      data-component-type="progress_indicator"
      data-component-id="onboarding_loading_indicator"
      data-component-variant="loading"
    >
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-label">Loading onboarding steps, please wait</p>
    </main>

  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
