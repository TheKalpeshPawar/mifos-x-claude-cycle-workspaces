<!doctype html>
<!-- render-hash: e6f7d8e9ca0b -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get started — empty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --fs-title-medium: 16px; --lh-title-medium: 24px; --fw-title-medium: 500;
      --fs-body-medium: 14px; --lh-body-medium: 20px; --fw-body-medium: 400;
      --fs-label-large: 14px; --lh-label-large: 20px; --fw-label-large: 500;
    }
    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      -webkit-font-smoothing: antialiased;
    }
    .app-frame {
      max-width: 390px;
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: var(--md-background);
      position: relative;
    }
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }
    .empty-icon {
      color: var(--md-primary);
      font-size: 64px !important;
    }
    .empty-title {
      font-size: var(--fs-title-medium);
      font-weight: var(--fw-title-medium);
      line-height: var(--lh-title-medium);
      color: var(--md-on-surface);
    }
    .empty-body {
      font-size: var(--fs-body-medium);
      font-weight: var(--fw-body-medium);
      line-height: var(--lh-body-medium);
      color: var(--md-on-surface-variant);
      max-width: 280px;
    }
    .btn-filled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 9999px;
      background-color: var(--md-primary);
      color: var(--md-on-primary);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-large);
      font-weight: var(--fw-label-large);
      line-height: var(--lh-label-large);
      border: none;
      cursor: pointer;
      min-height: 48px;
      margin-top: 8px;
      transition: opacity 150ms;
    }
    .btn-filled:hover { opacity: 0.92; }
    .btn-filled:active { opacity: 0.82; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="app-frame" data-screen="user-onboarding" data-component-type="screen" data-component-id="user-onboarding" data-component-variant="empty">

    <main
      class="screen-content"
      id="main-content"
      aria-label="Onboarding not completed"
      data-component-type="empty_state"
      data-component-id="onboarding_empty_state"
      data-component-variant="empty"
    >
      <span class="material-symbols-outlined empty-icon" aria-hidden="true">info</span>
      <h2 class="empty-title">Setup incomplete</h2>
      <p class="empty-body">The onboarding steps did not complete. You can skip setup and connect your account later.</p>
      <button
        class="btn-filled"
        data-nav-to="login"
        aria-label="Skip onboarding and continue to the app"
        type="button"
        data-component-type="button"
        data-component-id="onboarding_empty_skip_button"
      >
        Skip for now
      </button>
    </main>

  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
