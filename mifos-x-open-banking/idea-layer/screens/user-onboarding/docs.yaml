description: >-
  Three-step onboarding pager that educates Priya Sharma (PSU) about AISP consent before she connects her HSBC account.
  Step 1 (intro) establishes UK Open Banking as FCA-regulated and FAPI 1.0 Advanced-secured. Step 2
  (permissions_overview) shows all six OBIE ReadX scopes requested in OBReadConsent1. Step 3 (consent_explainer)
  provides AIS-only trust guarantees and the primary Connect CTA. An ob_explainer_open state shows a FAPI journey
  walkthrough in plain English. No API calls — pure educational content leading to the login/consent-staging screen.
