vm_actions:
  - name: StepNext
    signature: fun stepNext() -> Unit
    state_mutations:
      - currentStep = min(currentStep + 1, 3)
    side_effects: []
    error_handling: {}
    note: 'Maps currentStep to UI state: 1→intro, 2→permissions_overview, 3→consent_explainer'
  - name: StepBack
    signature: fun stepBack() -> Unit
    state_mutations:
      - currentStep = max(currentStep - 1, 1)
    side_effects: []
    error_handling: {}
    note: 'No-op guard: currentStep already 1 → does nothing'
  - name: OpenObExplainer
    signature: fun openObExplainer() -> Unit
    state_mutations:
      - showObExplainerSheet = true
    side_effects: []
    error_handling: {}
  - name: CloseObExplainer
    signature: fun closeObExplainer() -> Unit
    state_mutations:
      - showObExplainerSheet = false
    side_effects: []
    error_handling: {}
  - name: NavigateToLogin
    signature: fun navigateToLogin() -> Unit
    state_mutations: []
    side_effects:
      - Navigator.navigate(Route.Login)
    error_handling: {}
    note: Only callable from consent_explainer state (step 3)
