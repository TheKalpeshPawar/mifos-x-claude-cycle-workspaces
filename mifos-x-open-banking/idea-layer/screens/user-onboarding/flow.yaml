feature: consent-onboarding
flow_ref: onboarding-consent

entry_points:
  - source: app_launch_no_consent
    label: "App launched with no active consent — first-run or post-revoke"
  - source: post_revoke_redirect
    label: "Consent revoked from consent dashboard — PSU returned to start of onboarding"

transitions:
  # ─── Step navigation (within screen) ──────────────────────────────
  - from: user-onboarding[intro]
    to: user-onboarding[permissions_overview]
    trigger: "Tap 'Next' on intro step"
    action: step_next

  - from: user-onboarding[permissions_overview]
    to: user-onboarding[intro]
    trigger: "Tap 'Back' on permissions step"
    action: step_back

  - from: user-onboarding[permissions_overview]
    to: user-onboarding[consent_explainer]
    trigger: "Tap 'Next' on permissions step"
    action: step_next

  - from: user-onboarding[consent_explainer]
    to: user-onboarding[permissions_overview]
    trigger: "Tap 'Back' on consent step"
    action: step_back

  # ─── OB explainer sheet ───────────────────────────────────────────
  - from: user-onboarding[consent_explainer]
    to: user-onboarding[ob_explainer_open]
    trigger: "Tap 'How Open Banking works'"
    action: open_ob_explainer

  - from: user-onboarding[ob_explainer_open]
    to: user-onboarding[consent_explainer]
    trigger: "Tap 'Got it' / dismiss sheet"
    action: close_ob_explainer

  # ─── Screen-level navigation ──────────────────────────────────────
  - from: user-onboarding
    to: login
    trigger: "Tap 'Connect with HSBC' on step 3 (consent_explainer)"
    action: navigate_to_login
    requires_state: consent_explainer
