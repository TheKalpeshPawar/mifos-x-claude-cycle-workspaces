screen_id: user-onboarding

scenarios:

  # ─── Step 1: intro ────────────────────────────────────────────────

  - id: TC-ONBOARD-001
    description: "Intro step renders hero, headline, body, FAPI chip, FCA chip, and Next button"
    state: intro
    given: "App launched with no active consent; screen is in initial intro state"
    when: "Screen mounts"
    then:
      - "Step indicator shows step 1 of 3"
      - "Hero illustration (ic_open_banking_hero) is visible"
      - "Headline renders from {strings.onboarding_intro_headline}"
      - "Body copy renders from {strings.onboarding_intro_body}"
      - "FAPI 1.0 Advanced assist chip is visible"
      - "FCA Regulated assist chip is visible"
      - "'Next' button is visible and enabled"
    priority: high

  - id: TC-ONBOARD-002
    description: "Tapping Next on intro navigates to permissions_overview step"
    state: intro
    given: "Onboarding screen is in intro state"
    when: "PSU taps 'Next'"
    then:
      - "Screen transitions to permissions_overview state"
      - "Step indicator shows step 2 of 3"
      - "Section header 'What we'll read' is visible"
    priority: high

  # ─── Step 2: permissions_overview ─────────────────────────────────

  - id: TC-ONBOARD-003
    description: "Permissions overview renders all six OBIE ReadX categories and consent duration note"
    state: permissions_overview
    given: "Onboarding screen is in permissions_overview state"
    when: "Step 2 is displayed"
    then:
      - "Step indicator shows step 2 of 3"
      - "Section header 'What we'll read' is visible"
      - "Six permission list items render: account details, balances, transaction history, standing orders, direct debits, statements"
      - "ReadAccountsDetail item (account details) is present as first permission"
      - "Consent duration note (90 days, revocable) is visible"
      - "Back button is visible and enabled"
      - "Next button is visible and enabled"
    priority: high

  - id: TC-ONBOARD-004
    description: "ReadAccountsDetail is the first permission shown (sort codes and IBANs detail)"
    state: permissions_overview
    given: "Permissions overview step is displayed"
    when: "Step 2 renders"
    then:
      - "First list item headline renders {strings.onboarding_perm_accounts}"
      - "Supporting text includes sort codes and IBANs reference"
      - "manage_accounts icon is visible"
    priority: medium

  - id: TC-ONBOARD-005
    description: "Tapping Back on permissions_overview returns to intro"
    state: permissions_overview
    given: "Onboarding screen is in permissions_overview state"
    when: "PSU taps 'Back'"
    then:
      - "Screen transitions to intro state"
      - "Step indicator shows step 1 of 3"
    priority: medium

  - id: TC-ONBOARD-006
    description: "Tapping Next on permissions_overview advances to consent_explainer"
    state: permissions_overview
    given: "Onboarding screen is in permissions_overview state"
    when: "PSU taps 'Next'"
    then:
      - "Screen transitions to consent_explainer state"
      - "Step indicator shows step 3 of 3"
      - "Section header 'What we never do' is visible"
    priority: high

  # ─── Step 3: consent_explainer ────────────────────────────────────

  - id: TC-ONBOARD-007
    description: "Consent explainer step renders trust guarantees, legal footer, and Connect CTA"
    state: consent_explainer
    given: "Onboarding screen is in consent_explainer state"
    when: "Step 3 is displayed"
    then:
      - "Step indicator shows step 3 of 3"
      - "Section header 'What we never do' is visible"
      - "Three reassurance items render: no payments, no password seen, revoke anytime"
      - "Divider is visible before legal footer"
      - "FCA / OBIE v4.0 legal footer text is visible"
      - "'Connect with HSBC' filled button is visible and enabled"
      - "'Back' outlined button is visible"
      - "'How Open Banking works' text button is visible"
    priority: high

  - id: TC-ONBOARD-008
    description: "Tapping 'Connect with HSBC' navigates to login screen"
    state: consent_explainer
    given: "Onboarding screen is in consent_explainer state"
    when: "PSU taps 'Connect with HSBC'"
    then: "App navigates to the login screen to begin FAPI consent staging"
    priority: high

  - id: TC-ONBOARD-009
    description: "Tapping Back on consent_explainer returns to permissions_overview"
    state: consent_explainer
    given: "Onboarding screen is in consent_explainer state"
    when: "PSU taps 'Back'"
    then:
      - "Screen transitions to permissions_overview state"
      - "Step indicator shows step 2 of 3"
    priority: medium

  # ─── OB Explainer bottom sheet ────────────────────────────────────

  - id: TC-ONBOARD-010
    description: "Tapping 'How Open Banking works' opens the OB explainer bottom sheet"
    state: consent_explainer
    given: "Onboarding screen is in consent_explainer state"
    when: "PSU taps 'How Open Banking works'"
    then:
      - "Screen transitions to ob_explainer_open state"
      - "Bottom sheet is visible with title from {strings.ob_explainer_title}"
      - "Three FAPI step items are visible (grant permission, authenticate, secure token)"
      - "Revoke note is visible"
      - "'Got it' close button is visible"
    priority: high

  - id: TC-ONBOARD-011
    description: "OB explainer sheet shows three FAPI consent journey steps with meaningful content"
    state: ob_explainer_open
    given: "OB explainer bottom sheet is open"
    when: "Sheet is displayed"
    then:
      - "Step 1 (grant permission): icon how_to_reg visible, headline and body copy visible"
      - "Step 2 (authenticate with HSBC): icon login visible, body confirms credentials never shared"
      - "Step 3 (secure token): icon shield visible, body references FAPI 1.0 Advanced"
      - "Revoke note text references Settings → Manage consents"
    priority: medium

  - id: TC-ONBOARD-012
    description: "Tapping 'Got it' closes the OB explainer sheet and returns to consent_explainer"
    state: ob_explainer_open
    given: "OB explainer bottom sheet is open"
    when: "PSU taps 'Got it'"
    then:
      - "Bottom sheet dismisses"
      - "Screen returns to consent_explainer state"
      - "Step indicator still shows step 3 of 3"
    priority: medium
