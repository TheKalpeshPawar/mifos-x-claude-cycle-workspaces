<!doctype html>
<html lang="en" data-screen="send-money-confirm" data-state="submitting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Payment — Submitting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
      --secondary: #386663; --background: #F9FAEF;
      --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
    .screen-root { max-width: 390px; margin: 0 auto; background: var(--background); min-height: 100vh; display: flex; flex-direction: column; position: relative; }
    .top-app-bar { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); gap: 12px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--outline-variant); }
    .nav-icon { color: var(--on-surface); font-size: 24px; opacity: 0.5; }
    .bar-title { font-size: 20px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .scroll-content { flex: 1; opacity: 0.45; pointer-events: none; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 12px; }
    .screen-title { font-size: 28px; font-weight: 700; color: var(--primary); }
    .summary-card { background: var(--surface); border-radius: 16px; border: 1px solid var(--primary-container); padding: 20px; }
    .payment-amount { font-size: 40px; font-weight: 700; color: var(--primary); text-align: center; padding: 8px 0 16px; }
    .divider { height: 1px; background: var(--surface-variant); margin: 4px 0; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; }
    .detail-label { font-size: 14px; color: var(--outline); }
    .detail-value { font-size: 14px; color: var(--on-surface); font-weight: 500; }
    /* Overlay */
    .submitting-overlay {
      position: absolute; inset: 0; background: rgba(249,250,239,0.65);
      display: flex; align-items: center; justify-content: center; z-index: 20;
    }
    .overlay-card {
      background: var(--surface); border-radius: 20px; padding: 40px 28px; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.14); display: flex; flex-direction: column; align-items: center; gap: 16px; width: 300px;
    }
    .pulse-ring {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--primary-container); display: flex; align-items: center; justify-content: center; position: relative;
    }
    .pulse-ring::after {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      border: 3px solid var(--primary-container); animation: pulse 1.5s ease-out infinite;
    }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
    .overlay-spinner { width: 36px; height: 36px; border: 3.5px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-title { font-size: 18px; font-weight: 700; color: var(--on-surface); }
    .overlay-amount { font-size: 28px; font-weight: 700; color: var(--primary); }
    .overlay-sub { font-size: 13px; color: var(--outline); }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main>
<div class="screen-root">
  <div class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar_confirm">
    <span class="material-icons nav-icon" aria-hidden="true">arrow_back</span>
    <span class="bar-title">Confirm Payment</span>
  </div>

  <div class="scroll-content">
    <h1 class="screen-title">Confirm Payment</h1>
    <div class="summary-card">
      <div class="payment-amount">£500.00</div>
      <div class="divider"></div>
      <div class="detail-row"><span class="detail-label">To</span><span class="detail-value">John Smith</span></div>
      <div class="detail-row"><span class="detail-label">From</span><span class="detail-value">Primary Checking</span></div>
      <div class="detail-row"><span class="detail-label">Fee</span><span class="detail-value">£0.00</span></div>
    </div>
  </div>

  <div class="submitting-overlay" role="status" aria-live="polite" aria-label="Processing payment"
       data-component-type="box" data-component-id="confirm_submitting_overlay">
    <div class="overlay-card">
      <div class="pulse-ring">
        <div class="overlay-spinner" aria-hidden="true"></div>
      </div>
      <span class="overlay-title">Processing payment</span>
      <span class="overlay-amount">£500.00</span>
      <span class="overlay-sub">Authorising with your bank — don't press back</span>
    </div>
  </div>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
