<!doctype html>
<!-- render-hash: smc-submitting-obie02 -->
<html lang="en" data-screen="send-money-confirm" data-state="submitting" data-feature="send-money-confirm" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm payment</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--icon-md:24px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.overlay{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 40px;gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:56px;height:56px;border:4px solid var(--primary-container);border-top-color:var(--primary);border-radius:50%;animation:spin 0.9s linear infinite;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.s-title{font-size:20px;font-weight:600}.s-sub{font-size:14px;color:var(--on-surface-variant);max-width:280px;line-height:1.5}
.s-amount{font-size:16px;font-weight:600;color:var(--primary);margin-top:6px}
.actions{padding:0 20px 24px;display:flex;flex-direction:column;gap:10px}.btn{height:52px;border-radius:999px;border:none;font-family:inherit;font-size:16px;font-weight:600}.btn-primary{background:var(--primary);color:var(--on-primary);opacity:0.6}.btn-text{background:transparent;color:var(--on-surface-variant);height:44px;font-size:15px;opacity:0.5}
[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><h1>Confirm payment</h1></div>
<div class="overlay">
<div class="spinner" aria-hidden="true"></div>
<div class="s-title">Sending…</div>
<div class="s-sub">Staging your payment with HSBC. This only takes a moment.</div>
<div class="s-amount">£150.00 to James Whitfield</div>
</div>
<div class="actions">
  <button class="btn btn-primary" disabled aria-disabled="true">Sending…</button>
  <button class="btn btn-text" disabled aria-disabled="true">Edit payment</button>
</div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
