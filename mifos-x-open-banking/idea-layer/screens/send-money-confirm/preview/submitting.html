<!doctype html>
<!-- render-hash: smc-submitting-01 -->
<html lang="en" data-screen="send-money-confirm" data-state="submitting" data-feature="send-money-confirm" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sending Payment</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.spinner{width:88px;height:88px;border:4px solid var(--primary-container);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:28px}@keyframes spin{to{transform:rotate(360deg)}}
.title{font-size:22px;font-weight:700;letter-spacing:-0.2px;margin-bottom:8px}.msg{font-size:14px;color:var(--on-surface-variant);max-width:300px;line-height:1.5;margin-bottom:32px}
.summary-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 24px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:18px;margin-bottom:28px}.summary-amount{font-size:32px;font-weight:700;color:var(--primary);letter-spacing:-0.6px}.summary-label{font-size:13px;color:var(--on-surface-variant)}
.dont-close{display:flex;align-items:center;gap:8px;background:var(--secondary-container);color:var(--on-secondary-container);font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px}.dont-close .material-icons{font-size:var(--icon-xs)}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="spinner" role="progressbar" aria-label="Sending payment"></div>
<h1 class="title">Sending your payment…</h1>
<p class="msg">Your bank is processing the transfer to Liam Walker. This usually takes 1–2 seconds.</p>
<div class="summary-chip"><div class="summary-amount">£500.00</div><div class="summary-label">to Liam Walker · ••8842</div></div>
<div class="dont-close"><span class="material-icons">do_not_disturb_on</span>Don't close this screen</div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
