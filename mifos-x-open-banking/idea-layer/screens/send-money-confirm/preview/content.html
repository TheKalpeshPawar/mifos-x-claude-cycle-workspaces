<!doctype html>
<!-- render-hash: smc-content-01 -->
<html lang="en" data-screen="send-money-confirm" data-state="content" data-feature="send-money-confirm" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm Payment</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding:0 0 24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:24px;color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.amount-hero{text-align:center;padding:20px 20px 16px}.amount{font-size:44px;font-weight:700;color:var(--primary);letter-spacing:-1px}.amount-label{font-size:14px;color:var(--on-surface-variant);margin-top:6px}
.section-label{font-size:11px;font-weight:700;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.6px;padding:18px 20px 8px}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 20px 12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:14px 16px;border-bottom:1px solid var(--outline-variant)}.row:last-child{border-bottom:none}.row-label{font-size:13px;color:var(--on-surface-variant);font-weight:500}.row-value{font-size:14px;font-weight:600;text-align:right}
.btn-confirm{margin:8px 20px 0;padding:16px;background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;width:calc(100% - 40px);cursor:pointer}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons" data-nav-to="send-money" tabindex="0" aria-label="Go back">arrow_back</span><h1>Confirm payment</h1></div>
<div class="amount-hero"><div class="amount">£500.00</div><div class="amount-label">to Liam Walker</div></div>
<div class="section-label">Payment details</div>
<div class="card"><div class="row"><span class="row-label">From</span><span class="row-value">Primary Checking</span></div><div class="row"><span class="row-label">Reference</span><span class="row-value">Invoice 2026-05</span></div><div class="row"><span class="row-label">Fee</span><span class="row-value">£0.00</span></div><div class="row"><span class="row-label">Total</span><span class="row-value">£500.00</span></div></div>
<button class="btn-confirm" data-action="confirm_and_send" tabindex="0" aria-label="Confirm and send">Confirm &amp; send</button>
</main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
