<!doctype html>
<html lang="en" data-screen="send-money-confirm" data-state="error">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Confirm Payment — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --error:#BA1A1A;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
.screen-content{padding:20px;display:flex;flex-direction:column;gap:16px;}
.confirm-title{font-size:24px;font-weight:700;color:var(--primary);}
.error-banner{background:#FFDAD6;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.error-banner .mi{font-size:20px;color:var(--error);}
.error-banner-text{font-size:13px;color:var(--error);line-height:1.4;}
.summary-card{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.amount-display{font-size:36px;font-weight:700;color:var(--primary);text-align:center;padding-bottom:12px;border-bottom:1px solid var(--surface-variant);}
.detail-row{display:flex;justify-content:space-between;align-items:center;}
.detail-label{font-size:13px;color:var(--outline);}
.detail-value{font-size:13px;font-weight:600;color:var(--text-primary);}
.confirm-btn{width:100%;padding:16px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
.edit-btn{width:100%;padding:14px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="send-money">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Confirm Payment</span>
</header>

<div class="screen-content">
  <div class="confirm-title">Review Payment</div>

  <div class="error-banner">
    <span class="mi">error_outline</span>
    <p class="error-banner-text">Payment could not be processed. Please try again.</p>
  </div>

  <div class="summary-card">
    <div class="amount-display">£500.00</div>
    <div class="detail-row">
      <span class="detail-label">To</span>
      <span class="detail-value">John Smith</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Fee</span>
      <span class="detail-value">Free</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Total</span>
      <span class="detail-value" style="color:var(--primary);font-size:15px;">£500.00</span>
    </div>
  </div>

  <button class="confirm-btn" data-action="confirm_send_payment">Try Again</button>
  <button class="edit-btn" data-nav-to="send-money">Edit Payment</button>
</div>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
