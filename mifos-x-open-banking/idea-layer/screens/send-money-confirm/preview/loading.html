<!doctype html>
<!-- render-hash: smc-loading-01 -->
<html lang="en" data-screen="send-money-confirm" data-state="loading" data-feature="send-money-confirm" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.amount-hero-skel{padding:20px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}.amount-hero-skel .l-big{height:42px;width:60%;border-radius:12px}.amount-hero-skel .l-small{height:14px;width:35%}.amount-hero-skel .pill{height:32px;width:120px;border-radius:999px;margin-top:8px}
.title-skel{height:11px;width:140px;margin:18px 20px 8px}
.card-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 20px 12px}.card-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--outline-variant)}.card-row:last-child{border-bottom:none}.card-row .a{height:12px;width:80px}.card-row .b{height:14px;width:140px}
.btn-skel{height:54px;margin:8px 20px 0;border-radius:999px}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons">arrow_back</span><h1>Confirm payment</h1></div>
<div class="amount-hero-skel"><div class="skel l-big"></div><div class="skel l-small"></div><div class="skel pill"></div></div>
<div class="skel title-skel"></div>
<div class="card-skel"><div class="card-row"><div class="skel a"></div><div class="skel b"></div></div><div class="card-row"><div class="skel a"></div><div class="skel b"></div></div><div class="card-row"><div class="skel a"></div><div class="skel b"></div></div><div class="card-row"><div class="skel a"></div><div class="skel b"></div></div></div>
<div class="skel title-skel"></div>
<div class="card-skel"><div class="card-row"><div class="skel a"></div><div class="skel b"></div></div><div class="card-row"><div class="skel a"></div><div class="skel b"></div></div><div class="card-row"><div class="skel a"></div><div class="skel b"></div></div></div>
<div class="skel btn-skel"></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
