<!doctype html>
<!-- render-hash: smc-success-01 -->
<html lang="en" data-screen="send-money-confirm" data-state="success" data-feature="send-money-confirm" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Payment Sent</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;padding:32px 20px 24px}
.success-hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px}
.check-circle{width:96px;height:96px;border-radius:48px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pop 420ms cubic-bezier(0.2,0,0,1)}@keyframes pop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}.check-circle .material-icons{font-size:var(--icon-2xl);color:var(--on-primary)}
.success-title{font-size:24px;font-weight:700;letter-spacing:-0.3px;margin-bottom:6px}.success-msg{font-size:14px;color:var(--on-surface-variant);max-width:300px;line-height:1.5}
.amount-card{background:var(--primary-container);color:var(--on-primary-container);border-radius:18px;padding:18px 20px;text-align:center;margin-bottom:18px}.amount-card .v{font-size:32px;font-weight:700;letter-spacing:-0.6px}.amount-card .to{font-size:13px;opacity:0.85;margin-top:4px}
.receipt-card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin-bottom:14px;overflow:hidden}
.receipt-row{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--outline-variant);font-size:13px}.receipt-row:last-child{border-bottom:none}.r-label{color:var(--on-surface-variant)}.r-value{font-weight:600;text-align:right;word-break:break-word;max-width:60%}.r-value.mono{font-family:'Courier New',monospace;font-size:12px}
.actions{display:flex;gap:10px;margin-top:auto}.btn{flex:1;padding:14px;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn .material-icons{font-size:var(--icon-sm)}.btn-secondary{background:transparent;color:var(--primary);border:1px solid var(--outline)}.btn-primary{background:var(--primary);color:var(--on-primary);border:none}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="success-hero"><div class="check-circle"><span class="material-icons">check</span></div><h1 class="success-title">Payment sent</h1><p class="success-msg">Liam Walker will receive the funds within seconds via Faster Payments.</p></div>
<div class="amount-card"><div class="v">£500.00</div><div class="to">sent to Liam Walker</div></div>
<div class="receipt-card">
<div class="receipt-row"><span class="r-label">From</span><span class="r-value">Primary Checking</span></div>
<div class="receipt-row"><span class="r-label">To account</span><span class="r-value mono">GB29 ••• 9268 19</span></div>
<div class="receipt-row"><span class="r-label">Reference</span><span class="r-value">Invoice 2026-05</span></div>
<div class="receipt-row"><span class="r-label">Sent at</span><span class="r-value">28 May 2026 · 14:32</span></div>
<div class="receipt-row"><span class="r-label">Confirmation</span><span class="r-value mono">FP-26-0528-K7Q3</span></div>
</div>
<div class="actions"><button class="btn btn-secondary" data-action="download_receipt" tabindex="0" aria-label="Share receipt"><span class="material-icons">share</span>Share receipt</button><button class="btn btn-primary" data-nav-to="home" tabindex="0" aria-label="Done"><span class="material-icons">check</span>Done</button></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
