<!doctype html>
<html lang="en" data-screen="send-money-confirm" data-state="success">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Sent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
      --secondary: #386663; --background: #F9FAEF;
      --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
    .screen-root { max-width: 390px; margin: 0 auto; background: var(--background); min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px 48px; gap: 16px; text-align: center; }
    .check-ring { width: 100px; height: 100px; border-radius: 50%; background: var(--primary-container); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .check-ring .material-icons { font-size: 52px; color: var(--primary); }
    .success-title { font-size: 28px; font-weight: 700; color: var(--primary); }
    .amount-display { font-size: 40px; font-weight: 700; color: var(--on-surface); }
    .success-sub { font-size: 15px; color: var(--on-surface-variant); line-height: 1.6; }
    .detail-card { background: var(--surface); border-radius: 12px; padding: 16px 20px; width: 100%; border: 1px solid var(--primary-container); }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--surface-variant); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 13px; color: var(--outline); }
    .detail-value { font-size: 13px; color: var(--on-surface); font-weight: 500; }
    .ref-value { font-family: monospace; font-size: 12px; color: var(--primary); font-weight: 600; }
    .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 16px; width: 100%; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; }
    .btn-primary:hover { opacity: 0.92; }
    .btn-text { background: none; border: none; color: var(--secondary); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div class="screen-root">
    <main data-component-type="stack" data-component-id="confirm_success_root">

      <div class="check-ring" data-component-type="image" data-component-id="confirm_success_icon"
           role="img" aria-label="Payment sent successfully">
        <span class="material-icons" aria-hidden="true">check_circle</span>
      </div>

      <h1 class="success-title" data-component-type="text" data-component-id="confirm_success_title">Payment Sent</h1>

      <div class="amount-display" data-component-type="text" data-component-id="confirm_success_amount" aria-label="Amount: five hundred pounds">£500.00</div>

      <p class="success-sub" data-component-type="text" data-component-id="confirm_success_sub">
        Your payment to John Smith has been sent successfully.
      </p>

      <div class="detail-card" data-component-type="box" data-component-id="confirm_success_details"
           role="group" aria-label="Payment confirmation details">
        <div class="detail-row">
          <span class="detail-label">To</span>
          <span class="detail-value">John Smith — Barclays UK</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Date</span>
          <span class="detail-value">27 May 2026, 14:32</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Reference</span>
          <span class="detail-value">Rent August 2026</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Transaction ID</span>
          <span class="ref-value">TXN-2026-094521</span>
        </div>
      </div>

      <button class="btn-primary"
              data-component-type="button" data-component-id="confirm_success_home_button"
              role="button" aria-label="Return to home screen" tabindex="0"
              data-nav-to="home">
        <span class="material-icons" aria-hidden="true">home</span>
        Back to Home
      </button>

      <button class="btn-text"
              data-component-type="button" data-component-id="confirm_success_view_txn_button"
              role="button" aria-label="View transaction details" tabindex="0"
              data-nav-to="transaction-detail">View Transaction</button>

    </main>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
