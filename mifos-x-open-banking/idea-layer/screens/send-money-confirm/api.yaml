sibling: api
schema_version: "4.0"
feature_id: send-money-confirm
api:
  - id: obp_confirm_sepa_transfer
    endpoint: "POST /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SEPA/transaction-requests"
    tag: TransactionRequests
    response:
      fields:
        - name: id
          type: String
        - name: type
          type: String
        - name: status
          type: String
        - name: start_date
          type: DateTime
        - name: charge
          type: Charge
        - name: charge.summary
          type: String
        - name: charge.value.amount
          type: String
        - name: charge.value.currency
          type: String
        - name: challenge
          type: Challenge
        - name: transaction_ids
          type: List<String>
    errors:
      - code: 400
        message: "INVALID_JSON_FORMAT"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"
      - code: 422
        message: "INSUFFICIENT_FUNDS"
      - code: 423
        message: "DAILY_LIMIT_EXCEEDED"
