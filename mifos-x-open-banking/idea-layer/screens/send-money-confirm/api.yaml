sibling: api
schema_version: "4.0"
feature_id: send-money-confirm
api:
  - id: create_domestic_payment_consent
    endpoint: "POST /obie/open-banking/v4.0/pisp/domestic-payment-consents"
    tag: PISP
    description: "On Confirm — stages a domestic-payment-consent with the reviewed Initiation (InstructedAmount, CreditorAccount, RemittanceInformation) + Risk. Client Credentials token (scope payments). ASPSP returns Data.ConsentId with default Data.Status AWAU (awaiting PSU authorisation). CONSENT-FIRST ORDERING: this screen creates the consent ONLY; it does NOT submit the payment. The actual payment POST happens later (in payment-authorize-handoff / after the bank authorise + callback), gated on the consent reaching Status AUTH. SCA is performed AT THE BANK, not in-app. OBIE object OBWriteDomesticConsent4 / OBWriteDomesticConsentResponse5."
    request:
      fields:
        - name: Data.Initiation.InstructionIdentification
          type: String
        - name: Data.Initiation.EndToEndIdentification
          type: String
        - name: Data.Initiation.InstructedAmount.Amount
          type: String
        - name: Data.Initiation.InstructedAmount.Currency
          type: String
        - name: Data.Initiation.DebtorAccount.SchemeName
          type: String
        - name: Data.Initiation.DebtorAccount.Identification
          type: String
        - name: Data.Initiation.CreditorAccount.SchemeName
          type: String
        - name: Data.Initiation.CreditorAccount.Identification
          type: String
        - name: Data.Initiation.CreditorAccount.Name
          type: String
        - name: Data.Initiation.RemittanceInformation.Reference
          type: String
        - name: Risk.PaymentContextCode
          type: String
    response:
      fields:
        - name: Data.ConsentId
          type: String
        - name: Data.Status
          type: String
        - name: Data.CreationDateTime
          type: String
        - name: Data.StatusUpdateDateTime
          type: String
        - name: Data.Initiation
          type: Object
        - name: Risk
          type: Object
        - name: Links
          type: Object
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
      - code: 500
        message: "OB.UnexpectedError"
