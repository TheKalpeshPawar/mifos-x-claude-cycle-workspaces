type: send_money_confirm
title: "Confirm Payment"
flavor: consumer
components:
  - type: payment_review_card
    id: payment_summary
    show_amount: true
    show_fees: true
    show_total: true
  - type: text_field
    id: otp_input
    label: "OTP (if required)"
    placeholder: "Enter OTP"
  - type: button
    id: confirm_button
    label: "Confirm Payment"
    variant: contained
  - type: button
    id: edit_button
    label: "Edit"
    variant: outlined
states:
  - review
  - submitting
  - success
  - error
navigation:
  - target: home
    label: "home"
