approve_hash: "sha256:09af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []

screens:
  - id: send-money-confirm
    name: Confirm Payment
    archetype: detail_screen
    shell:
      top_bar:
        title: "Confirm Payment"
        navigation_icon: arrow_back
        actions: []
      bottom_nav: false

archetype: detail_screen

components:
  - type: text
    id: confirm_title
    label: "Confirm Payment"
    style:
      typography: "Outfit/headline_large"
      color: "#4C662B"
      padding_bottom: spacing.xs
    a11y:
      label: "Confirm Payment screen title"
      role: heading
    test_context:
      tag: confirm_title
      assert_text: "Confirm Payment"

  - type: text
    id: review_subtitle
    label: "Please review the payment details before confirming"
    content: "Please review the payment details before confirming"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_bottom: spacing.md
    a11y:
      label: "Review instruction message"
      role: text
    test_context:
      tag: review_subtitle

  - type: box
    id: payment_summary_card
    label: "Payment Summary"
    style:
      background: "#FFFFFF"
      corner_radius: 16
      elevation: 2
      padding_horizontal: 20
      padding_vertical: 20
      border_color: "#CDEDA3"
      border_width: 1
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Payment summary details"
      role: group
    test_context:
      tag: payment_summary_card

  - type: text
    id: payment_amount
    label: "£500.00"
    content: "£500.00"
    style:
      typography: "Outfit/display_medium"
      color: "#4C662B"
      text_align: center
      padding_top: spacing.sm
      padding_bottom: spacing.md
    a11y:
      label: "Payment amount: five hundred pounds"
      role: text
    test_context:
      tag: payment_amount
      assert_text: "£500.00"

  - type: divider
    id: amount_divider
    style:
      color: "#E1E4D5"
      thickness: 1
      padding_vertical: spacing.xs
    a11y:
      label: ""
      role: separator
    test_context:
      tag: amount_divider

  - type: stack
    id: to_row
    label: "To"
    style:
      orientation: horizontal
      spacing: 0
      padding_vertical: 10
      justify: space_between
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Payment destination"
      role: row
    test_context:
      tag: to_row

  - type: text
    id: to_label
    label: "To"
    content: "To"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"  # fix: A11Y-002 — was #75796C (4.46:1 on #FFFFFF FAIL for normal text); #44483D = 9.37:1 PASS
    a11y:
      label: "To label"
      role: text
    test_context:
      tag: to_label

  - type: text
    id: to_value
    label: "John Smith — Barclays Bank UK"
    content: "John Smith — Barclays Bank UK"
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
      font_weight: 500
    a11y:
      label: "Recipient: John Smith at Barclays Bank UK"
      role: text
    test_context:
      tag: to_value
      assert_text: "John Smith — Barclays Bank UK"

  - type: stack
    id: iban_row
    label: "IBAN"
    style:
      orientation: horizontal
      spacing: 0
      padding_vertical: 10
      justify: space_between
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Recipient IBAN"
      role: row
    test_context:
      tag: iban_row

  - type: text
    id: iban_label
    label: "IBAN"
    content: "IBAN"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"  # fix: A11Y-002 — was #75796C (4.46:1 on #FFFFFF FAIL for normal text); #44483D = 9.37:1 PASS
    a11y:
      label: "IBAN label"
      role: text
    test_context:
      tag: iban_label

  - type: text
    id: iban_value
    label: "GB29 NWBK 6016 1331 9268 19"
    content: "GB29 NWBK 6016 1331 9268 19"
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      font_family: monospace
    a11y:
      label: "IBAN number: GB29 NWBK 6016 1331 9268 19"
      role: text
    test_context:
      tag: iban_value

  - type: stack
    id: from_row
    label: "From"
    style:
      orientation: horizontal
      spacing: 0
      padding_vertical: 10
      justify: space_between
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Payment source account"
      role: row
    test_context:
      tag: from_row

  - type: text
    id: from_label
    label: "From"
    content: "From"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"  # fix: A11Y-002 — was #75796C (4.46:1 on #FFFFFF FAIL for normal text); #44483D = 9.37:1 PASS
    a11y:
      label: "From label"
      role: text
    test_context:
      tag: from_label

  - type: text
    id: from_value
    label: "Primary Checking (...0130)"
    content: "Primary Checking (...0130)"
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
    a11y:
      label: "Source account: Primary Checking ending in 0130"
      role: text
    test_context:
      tag: from_value

  - type: stack
    id: reference_row
    label: "Reference"
    style:
      orientation: horizontal
      spacing: 0
      padding_vertical: 10
      justify: space_between
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Payment reference"
      role: row
    test_context:
      tag: reference_row

  - type: text
    id: reference_label
    label: "Reference"
    content: "Reference"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"  # fix: A11Y-002 — was #75796C (4.46:1 on #FFFFFF FAIL for normal text); #44483D = 9.37:1 PASS
    a11y:
      label: "Reference label"
      role: text
    test_context:
      tag: reference_label

  - type: text
    id: reference_value
    label: "Rent August 2026"
    content: "Rent August 2026"
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
    a11y:
      label: "Reference: Rent August 2026"
      role: text
    test_context:
      tag: reference_value

  - type: divider
    id: fee_divider
    style:
      color: "#E1E4D5"
      thickness: 1
      padding_vertical: spacing.xs
    a11y:
      label: ""
      role: separator
    test_context:
      tag: fee_divider

  - type: stack
    id: fee_row
    label: "Fee"
    style:
      orientation: horizontal
      spacing: 0
      padding_vertical: 10
      justify: space_between
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Transaction fee"
      role: row
    test_context:
      tag: fee_row

  - type: text
    id: fee_label
    label: "Fee"
    content: "Fee"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"  # fix: A11Y-002 — was #75796C (4.46:1 on #FFFFFF FAIL for normal text); #44483D = 9.37:1 PASS
    a11y:
      label: "Fee label"
      role: text
    test_context:
      tag: fee_label

  - type: text
    id: fee_value
    label: "£0.00"
    content: "£0.00"
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
    a11y:
      label: "Transaction fee: zero pounds"
      role: text
    test_context:
      tag: fee_value
      assert_text: "£0.00"

  - type: stack
    id: total_row
    label: "Total"
    style:
      orientation: horizontal
      spacing: 0
      padding_vertical: spacing.sm
      justify: space_between
      background: "#F9FAEF"
      corner_radius: 8
      padding_horizontal: spacing.sm
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Total amount to be debited"
      role: row
    test_context:
      tag: total_row

  - type: text
    id: total_label
    label: "Total"
    content: "Total"
    style:
      typography: "Outfit/title_large"
      color: "#1A1C16"
      font_weight: 700
    a11y:
      label: "Total label"
      role: text
    test_context:
      tag: total_label

  - type: text
    id: total_value
    label: "£500.00"
    content: "£500.00"
    style:
      typography: "Outfit/title_large"
      color: "#4C662B"
      font_weight: 700
    a11y:
      label: "Total: five hundred pounds"
      role: text
    test_context:
      tag: total_value
      assert_text: "£500.00"

  - type: input
    id: scheduled_date_selector
    label: "Scheduled for"
    content: "Immediate"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      trailing_icon: calendar_today
      corner_radius: 12
      padding_top: spacing.md
    on_click:
      action: select_schedule_date
      target: ""
    a11y:
      label: "Select payment date. Currently set to immediate"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: scheduled_date_selector
      assert_text: "Immediate"

  - type: text
    id: terms_text
    label: "By confirming you authorise this payment per our Terms of Service"
    content: "By confirming you authorise this payment per our Terms of Service"
    style:
      typography: "Outfit/body_small"
      color: "#44483D"  # fix: A11Y-002 — was #75796C (4.46:1 on #FFFFFF FAIL for normal text); #44483D = 9.37:1 PASS
      text_align: center
      padding_vertical: spacing.sm
    a11y:
      label: "By confirming you authorise this payment per our Terms of Service"
      role: text
    test_context:
      tag: terms_text

  - type: button
    id: confirm_send_button
    label: "Confirm & Send"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      corner_radius: 12
      padding_vertical: spacing.md
      full_width: true
      typography: "Outfit/label_large"
    on_click:
      action: submit
      target: ""
    a11y:
      label: "Confirm and send this payment"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: confirm_send_button
      assert_text: "Confirm & Send"
      assert_enabled: true

  - type: button
    id: edit_payment_button
    label: "Edit Payment"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#4C662B"
      text_color: "#4C662B"
      corner_radius: 12
      padding_vertical: 14
      full_width: true
      typography: "Outfit/label_large"
    on_click:
      action: navigate
      target: send-money
    a11y:
      label: "Go back and edit this payment"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: edit_payment_button
      assert_text: "Edit Payment"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout:
      visible_components:
        - confirm_title
        - payment_summary_card
        - payment_amount
        - amount_divider
        - to_row
        - from_row
        - fee_row
        - total_row
        - scheduled_date_selector
        - confirm_send_button
        - edit_payment_button
      skeleton_shimmer: true
      shimmer_components:
        - payment_amount
        - to_value
        - iban_value
        - from_value
        - reference_value
        - fee_value
        - total_value
      confirm_send_button_enabled: false
      edit_payment_button_enabled: false
      progress_indicator: linear
  review:
    layout:
      visible_components:
        - confirm_title
        - review_subtitle
        - payment_summary_card
        - payment_amount
        - amount_divider
        - to_row
        - to_label
        - to_value
        - iban_row
        - iban_label
        - iban_value
        - from_row
        - from_label
        - from_value
        - reference_row
        - reference_label
        - reference_value
        - fee_divider
        - fee_row
        - fee_label
        - fee_value
        - total_row
        - total_label
        - total_value
        - scheduled_date_selector
        - terms_text
        - confirm_send_button
        - edit_payment_button
      confirm_send_button_enabled: true
  submitting:
    layout:
      visible_components:
        - confirm_title
        - payment_summary_card
        - payment_amount
        - to_value
        - confirm_send_button
        - edit_payment_button
      confirm_send_button_loading: true
      confirm_send_button_enabled: false
      edit_payment_button_enabled: false
      progress_indicator: linear
  success:
    layout:
      visible_components: []
      show_success_snackbar: true
      snackbar_message: "Payment of £500.00 sent to John Smith"
      navigate_to: home
  content:
    layout:
      visible_components:
        - confirm_title
        - review_subtitle
        - payment_summary_card
        - payment_amount
        - amount_divider
        - to_row
        - to_label
        - to_value
        - iban_row
        - iban_label
        - iban_value
        - from_row
        - from_label
        - from_value
        - reference_row
        - reference_label
        - reference_value
        - fee_divider
        - fee_row
        - fee_label
        - fee_value
        - total_row
        - total_label
        - total_value
        - scheduled_date_selector
        - terms_text
        - confirm_send_button
        - edit_payment_button
      confirm_send_button_enabled: true
    note: "Payment details loaded — same layout as review state; default loaded state alias"
  empty:
    layout:
      visible_components:
        - confirm_title
        - edit_payment_button
      showEmptyState: true
      emptyMessage: "No transaction to confirm. Start a new payment."
      confirm_send_button_enabled: false
  error:
    layout:
      visible_components:
        - confirm_title
        - payment_summary_card
        - payment_amount
        - to_value
        - fee_value
        - total_value
        - terms_text
        - confirm_send_button
        - edit_payment_button
      show_error_banner: true
      error_message: "Payment could not be processed. Please try again."
      confirm_send_button_enabled: true

state_model:
  view_model: SendMoneyConfirmViewModel
  state_fields:
    - name: amount
      type: String
      default: ""
    - name: currency
      type: String
      default: "GBP"
    - name: beneficiaryName
      type: String
      default: ""
    - name: beneficiaryBank
      type: String
      default: ""
    - name: iban
      type: String
      default: ""
    - name: fromAccountLabel
      type: String
      default: ""
    - name: reference
      type: String
      default: ""
    - name: fee
      type: String
      default: "£0.00"
    - name: total
      type: String
      default: ""
    - name: scheduledDate
      type: String
      default: "Immediate"
    - name: uiState
      type: ConfirmPaymentUiState
      default: Review
  errors:
    - field: global
      code: PAYMENT_FAILED
      message: "Payment could not be processed. Please try again."
    - field: global
      code: INSUFFICIENT_FUNDS
      message: "Insufficient funds in your account."
    - field: global
      code: INVALID_BENEFICIARY
      message: "The beneficiary account details are invalid."
    - field: global
      code: DAILY_LIMIT_EXCEEDED
      message: "This payment exceeds your daily transfer limit."
  events:
    - ScheduleDateSelected
    - ConfirmClicked
    - EditClicked
    - PaymentSucceeded
    - PaymentFailed
  actions:
    - submit
    - navigate
    - select_schedule_date
  di:
    - PaymentRepository
    - TransactionRequestUseCase
    - AccountRepository

navigation:
  - id: nav_to_home_success
    target: home
    trigger: on_payment_success
    on_click:
      action: navigate
      target: home

api:
  - endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SEPA/transaction-requests"
    tag: TransactionRequests
    response:
      fields:
        - name: id
          type: String
        - name: type
          type: String
        - name: status
          type: String
        - name: start_date
          type: DateTime
        - name: charge
          type: Charge
        - name: charge.summary
          type: String
        - name: charge.value.amount
          type: String
        - name: charge.value.currency
          type: String
        - name: challenge
          type: Challenge
        - name: transaction_ids
          type: List<String>
    errors:
      - code: 400
        message: "INVALID_JSON_FORMAT"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"
      - code: 422
        message: "INSUFFICIENT_FUNDS"
      - code: 423
        message: "DAILY_LIMIT_EXCEEDED"

dependencies:
  tier: feature
  features:
    - send-money
    - home
