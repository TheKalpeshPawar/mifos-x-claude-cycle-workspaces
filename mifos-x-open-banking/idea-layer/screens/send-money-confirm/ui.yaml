responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: review
  review:
    note: "ConfirmUiState.Review — the screen renders the args-driven draft immediately (no load step; data arrives via nav args). iban_row + conversion_note shown only when iban / conversionNote are non-blank; sent_via_value shows 'Internal transfer' when sandboxTan != null."
    layout:
      visible_components:
        - review_subtitle
        - payment_summary_card
        - payment_amount
        - amount_divider
        - to_row
        - to_label
        - to_value
        - iban_row
        - iban_label
        - iban_value
        - from_row
        - from_label
        - from_value
        - reference_row
        - reference_label
        - reference_value
        - sent_via_row
        - sent_via_label
        - sent_via_value
        - fee_divider
        - fee_row
        - fee_label
        - fee_value
        - conversion_note
        - total_row
        - total_label
        - total_value
        - terms_text
        - confirm_send_button
        - edit_payment_button
      confirm_send_button_enabled: true
  submitting:
    note: "ConfirmUiState.Submitting — full-screen progress overlay; both buttons disabled, primary shows 'Sending...'."
    layout:
      visible_components:
        - payment_summary_card
        - payment_amount
        - to_value
        - confirm_send_button
        - edit_payment_button
      confirm_send_button_loading: true
      confirm_send_button_enabled: false
      edit_payment_button_enabled: false
      progress_indicator: circular
  failed:
    note: "ConfirmUiState.Failed — inline error Surface above the terms text; buttons re-enabled for retry. Messages: LIMIT → daily-limit, 40003 → currency-mismatch, INSUFFICIENT → insufficient-funds, else generic."
    layout:
      visible_components:
        - review_subtitle
        - payment_summary_card
        - payment_amount
        - amount_divider
        - to_row
        - to_value
        - from_row
        - from_value
        - sent_via_row
        - sent_via_value
        - fee_row
        - fee_value
        - total_row
        - total_value
        - payment_error
        - terms_text
        - confirm_send_button
        - edit_payment_button
      confirm_send_button_enabled: true

state_model:
  view_model: SendMoneyConfirmViewModel
  ui_state_type: ConfirmUiState
  states:
    - Review
    - Submitting
    - Failed
  nav_args:
    type: PaymentDraft
    fields:
      - { name: fromAccountId, type: "String (Data.Initiation.DebtorAccount.Identification)" }
      - { name: fromAccountScheme, type: "String (Data.Initiation.DebtorAccount.SchemeName, e.g. UK.OBIE.IBAN)" }
      - { name: fromLabel, type: String }
      - { name: amount, type: "String (Data.Initiation.InstructedAmount.Amount)" }
      - { name: currency, type: "String (Data.Initiation.InstructedAmount.Currency, ISO 4217)" }
      - { name: beneficiaryId, type: "String (Data.Beneficiary[].BeneficiaryId)" }
      - { name: beneficiaryName, type: "String (Data.Initiation.CreditorAccount.Name)" }
      - { name: creditorScheme, type: "String (Data.Initiation.CreditorAccount.SchemeName)" }
      - { name: creditorIdentification, type: "String (Data.Initiation.CreditorAccount.Identification)" }
      - { name: reference, type: "String (Data.Initiation.RemittanceInformation.Reference)" }
      - { name: paymentContextCode, type: "String (Risk.PaymentContextCode)", default: TransferToThirdParty }
      - { name: conversionNote, type: "String?", default: "null" }
  consent_result:
    type: OBWriteDomesticConsentResponse5
    fields:
      - { name: consentId, type: "String (Data.ConsentId)" }
      - { name: status, type: "String (Data.Status, e.g. AWAU)" }
      - { name: authorizeUrl, type: "String (Links — bank authorise URL, used by payment-authorize-handoff)" }
  errors:
    - field: global
      code: OB.Field.Invalid
      message: "The bank rejected the payment details. Check the amount and recipient, then try again."
    - field: global
      code: OB.Resource.InvalidConsentStatus
      message: "This payment can't be set up right now. Please try again."
    - field: global
      code: UNAUTHORIZED
      message: "Your session has expired. Sign in again to continue."
    - field: global
      code: GENERIC
      message: "Payment could not be set up. Please try again."
  methods:
    - name: confirm
      signature: "confirm(draft: PaymentDraft, onConsentCreated: (OBWriteDomesticConsentResponse5) -> Unit)"
    - name: reset
      signature: "reset()"
  callbacks:
    - name: onConsentCreated
      signature: "(OBWriteDomesticConsentResponse5) -> Unit"
      consumer: payment-authorize-handoff
    - name: onEdit
      signature: "() -> Unit"
      consumer: send-money-amount
    - name: onBack
      signature: "() -> Unit"
  actions:
    - submit
    - navigate
  di:
    - PaymentsRepository

api:
  - endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SEPA/transaction-requests"
    tag: TransactionRequests
    description: "Rail 1 — SEPA by recipient IBAN (PaymentsRepository.sendSepaPayment), used when paymentType == SEPA && iban not blank. Falls back to COUNTERPARTY on OBP-30012 / OBP-30074 in the response message."
    request:
      fields:
        - name: to.iban
          type: String
        - name: value.currency
          type: String
        - name: value.amount
          type: String
        - name: description
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: type
          type: String
        - name: status
          type: String
        - name: challenge
          type: Challenge
        - name: charge
          type: Charge
        - name: transaction_ids
          type: List<String>
    errors:
      - code: 404
        message: "OBP-30012 / OBP-30074 — IBAN not resolvable; app falls back to COUNTERPARTY"
      - code: 422
        message: "INSUFFICIENT_FUNDS"
  - endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/COUNTERPARTY/transaction-requests"
    tag: TransactionRequests
    description: "Rail 2 — pay a counterparty by id (PaymentsRepository.sendToCounterparty). Used for Domestic / International and as the SEPA fallback."
    request:
      fields:
        - name: to.counterparty_id
          type: String
        - name: value.currency
          type: String
        - name: value.amount
          type: String
        - name: description
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: type
          type: String
        - name: status
          type: String
        - name: challenge
          type: Challenge
        - name: charge
          type: Charge
        - name: transaction_ids
          type: List<String>
    errors:
      - code: 422
        message: "OBP-40003 currency mismatch / LIMIT exceeded / INSUFFICIENT_FUNDS"
  - endpoint: "POST /obp/v2.1.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/SANDBOX_TAN/transaction-requests"
    tag: TransactionRequests
    description: "Rail 3 — sandbox-only internal transfer to an OBP-hosted account (PaymentsRepository.sendToSandboxTan). Self-answerable SCA (no maker/checker)."
    request:
      fields:
        - name: to.bank_id
          type: String
        - name: to.account_id
          type: String
        - name: value.currency
          type: String
        - name: value.amount
          type: String
        - name: description
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: status
          type: String
        - name: challenge
          type: Challenge

dependencies:
  tier: feature
  features:
    - send-money-amount
    - payment-result
