sibling: data-flow
schema_version: "4.0"
feature_id: send-money-confirm
entries:
  - screen_id: send-money-confirm
    trigger: on_interact
    event: ConfirmPayment
    endpoints:
      - obp_confirm_sepa_transfer
    direction: write
    dtos:
      - name: SepaTransactionRequest
        role: response
        api_id: obp_confirm_sepa_transfer
    produces_state: success
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
      - error_code: 500
        behavior: error_state
