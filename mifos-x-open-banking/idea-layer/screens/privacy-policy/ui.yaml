id: privacy-policy
name: "Privacy Policy"
feature: shared
flavor: shared
status: approved
quality_score: 92
schema_version: "3.1"
contract_version: "1.1.0"
approve_hash: "sha256:pp12b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0cd"
approved_at: "2026-05-28T00:00:00Z"
approved_by: "/idea completeness"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-002, privacy, gdpr, legal]
status_history:
  - status: draft
    timestamp: "2026-05-28T00:00:00Z"
  - from: draft
    to: approved
    at: "2026-05-28T00:00:00Z"
    by: "/idea completeness"
    contract_version: "1.1.0"
    bypass_flags: []

screens:
  - id: privacy-policy
    name: "Privacy Policy"
    viewmodel: "PrivacyPolicyViewModel"
    route: /legal/privacy

archetype: settings

shell:
  top_app_bar:
    show: true
    title: "Privacy Policy"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: pp_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - pp_gdpr_banner
      - pp_scroll_content
      - pp_last_updated_text

  # ── GDPR banner ───────────────────────────────────────────────────────────────

  - type: banner
    id: pp_gdpr_banner
    variant: info
    style:
      background: "#CDEDA3"
      border_radius: "8dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_gdpr_banner_text

  - type: text
    id: pp_gdpr_banner_text
    content: "This policy complies with UK GDPR, the Data Protection Act 2018, and EU GDPR (Regulation 2016/679)."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#1A1C16"
    a11y:
      role: text
      label: "GDPR compliance notice"
    test_context:
      purpose: "Prominent GDPR compliance badge at top of privacy policy"
      interaction_type: display
      data_driven: false

  # ── Scrollable sections ───────────────────────────────────────────────────────

  - type: stack
    id: pp_scroll_content
    variant: column
    style:
      padding_bottom: spacing.xl
    children:
      - pp_data_collection_card
      - pp_lawful_basis_card
      - pp_purpose_card
      - pp_third_party_card
      - pp_retention_card
      - pp_user_rights_card
      - pp_dpo_card

  # ── Data Collection ───────────────────────────────────────────────────────────

  - type: card
    id: pp_data_collection_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_data_collection_header
      - pp_data_collection_body

  - type: text
    id: pp_data_collection_header
    content: "Data We Collect"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Data We Collect"
    test_context:
      purpose: "Section header for data collection disclosure"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_data_collection_body
    content: "We collect the following categories of personal data: (a) Identity data — name, date of birth, national ID; (b) Contact data — email address, phone number; (c) Financial data — account numbers, IBAN, transaction history, balances, standing orders, card references; (d) Technical data — device type, OS version, app version, crash logs, and anonymised usage analytics; (e) Authentication data — DirectLogin token (never stored in plaintext, hashed with SHA-256 and time-limited to 1 hour)."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Data collection categories"
    test_context:
      purpose: "Enumerated list of data categories collected"
      interaction_type: display
      data_driven: false

  # ── Lawful Basis ──────────────────────────────────────────────────────────────

  - type: card
    id: pp_lawful_basis_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_lawful_basis_header
      - pp_lawful_basis_body

  - type: text
    id: pp_lawful_basis_header
    content: "Lawful Basis for Processing"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Lawful Basis for Processing"
    test_context:
      purpose: "Section header for GDPR lawful basis"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_lawful_basis_body
    content: "We process your personal data under the following GDPR lawful bases: (a) Contract performance — processing necessary to provide the banking services you have requested; (b) Legal obligation — AML/KYC checks, regulatory reporting to the FCA; (c) Legitimate interests — fraud detection, security monitoring, crash analytics — balanced against your rights; (d) Consent — for optional marketing communications, which you may withdraw at any time via Settings."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Lawful bases for data processing"
    test_context:
      purpose: "GDPR Article 6 lawful basis enumeration"
      interaction_type: display
      data_driven: false

  # ── Purpose ───────────────────────────────────────────────────────────────────

  - type: card
    id: pp_purpose_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_purpose_header
      - pp_purpose_body

  - type: text
    id: pp_purpose_header
    content: "How We Use Your Data"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "How We Use Your Data"
    test_context:
      purpose: "Section header for data purpose specification"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_purpose_body
    content: "Your data is used exclusively to: provide account balance and transaction display; initiate and record payment transactions; manage standing orders and direct debits; facilitate KYC onboarding for field officers; detect and prevent fraudulent activity; deliver in-app push notifications (Firebase Cloud Messaging, Android only); and generate aggregated, anonymised usage reports to improve app performance."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Purposes for data use"
    test_context:
      purpose: "Specific and limited purposes for which data is processed"
      interaction_type: display
      data_driven: false

  # ── Third-Party Sharing ───────────────────────────────────────────────────────

  - type: card
    id: pp_third_party_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_third_party_header
      - pp_third_party_body

  - type: text
    id: pp_third_party_header
    content: "Third-Party Data Sharing"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Third-Party Data Sharing"
    test_context:
      purpose: "Section header for third-party processor disclosure"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_third_party_body
    content: "We share data with the following processors under GDPR-compliant Data Processing Agreements (DPAs): (a) Open Bank Project Limited — acts as data processor for all API-mediated banking data; they operate under their own privacy policy at openbankproject.com/privacy; (b) KYC providers — identity verification partners engaged by partner institutions for field officer onboarding flows; (c) Firebase / Google — crash reporting (Crashlytics) and performance monitoring, on Android only, under anonymised identifiers. We do not sell your personal data to any third party."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Third party data sharing disclosure"
    test_context:
      purpose: "Named third-party processors with DPA basis"
      interaction_type: display
      data_driven: false

  # ── Retention ─────────────────────────────────────────────────────────────────

  - type: card
    id: pp_retention_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_retention_header
      - pp_retention_body

  - type: text
    id: pp_retention_header
    content: "Data Retention"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Data Retention"
    test_context:
      purpose: "Section header for retention schedule"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_retention_body
    content: "Transaction records are retained for 7 years to comply with the UK Money Laundering Regulations 2017. DirectLogin tokens expire after 1 hour and are not persisted. Crash logs and usage analytics are retained for 90 days in Firebase. Account profile data is retained for 30 days after account deletion to allow dispute resolution. After retention periods expire, data is securely deleted or anonymised."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Data retention schedule"
    test_context:
      purpose: "Retention periods per data category"
      interaction_type: display
      data_driven: false

  # ── User Rights ───────────────────────────────────────────────────────────────

  - type: card
    id: pp_user_rights_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_user_rights_header
      - pp_user_rights_body

  - type: text
    id: pp_user_rights_header
    content: "Your Rights Under GDPR"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Your Rights Under GDPR"
    test_context:
      purpose: "Section header for GDPR data subject rights"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_user_rights_body
    content: "Under UK GDPR and EU GDPR you have the right to: (a) Access — request a copy of personal data we hold about you; (b) Rectification — correct inaccurate or incomplete data; (c) Erasure (\"Right to be Forgotten\") — request deletion of data where no legal retention obligation applies; (d) Data Portability — receive your data in a structured, machine-readable format (JSON); (e) Restriction of Processing — pause processing while accuracy is disputed; (f) Objection — object to processing based on legitimate interests; (g) Withdraw Consent — for any processing based solely on consent. Submit requests to privacy@mifos.org. We will respond within 30 days."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "GDPR data subject rights enumeration"
    test_context:
      purpose: "Full enumeration of GDPR Articles 15-22 rights"
      interaction_type: display
      data_driven: false

  # ── DPO Contact ───────────────────────────────────────────────────────────────

  - type: card
    id: pp_dpo_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_dpo_header
      - pp_dpo_controller_text
      - pp_dpo_processor_text
      - pp_dpo_contact_text

  - type: text
    id: pp_dpo_header
    content: "Data Controller & DPO Contact"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Data Controller and DPO Contact"
    test_context:
      purpose: "Section header for data controller and DPO identification"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_dpo_controller_text
    content: "Data Controller: Mifos Initiative, 1 World Trade Center, New York, NY 10007, USA (operating internationally under applicable data protection regimes)."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_bottom: spacing.sm
    a11y:
      role: text
      label: "Data controller identity"
    test_context:
      purpose: "Identifies Mifos Initiative as the data controller"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_dpo_processor_text
    content: "Data Processor (API services): Open Bank Project Limited, 11 Leadenhall Street, London EC3V 1LP, United Kingdom."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_bottom: spacing.sm
    a11y:
      role: text
      label: "Data processor identity"
    test_context:
      purpose: "Identifies OBP Limited as the API data processor"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_dpo_contact_text
    content: "Data Protection Officer: privacy@mifos.org. To exercise your rights or raise a concern, email our DPO. You also have the right to lodge a complaint with the UK Information Commissioner's Office (ICO) at ico.org.uk, or with your local supervisory authority in the EU."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "DPO contact details and ICO complaint right"
    test_context:
      purpose: "DPO email and ICO/supervisory authority escalation path"
      interaction_type: display
      data_driven: false

  # ── Last Updated Footer ───────────────────────────────────────────────────────

  - type: text
    id: pp_last_updated_text
    content: "Last updated: 28 May 2026 — Version 1.0"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#C5C8BA"
      alignment: center
      padding_top: spacing.md
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Privacy policy last updated 28 May 2026 version 1.0"
    test_context:
      purpose: "Version stamp for the privacy policy document"
      interaction_type: display
      data_driven: false

  # ── Loading Skeleton ──────────────────────────────────────────────────────────

  - type: skeleton
    id: pp_loading_skeleton
    variant: settings
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    a11y:
      role: progressbar
      label: "Loading privacy policy"
    test_context:
      purpose: "Shimmer while bundled privacy policy content deserializes"
      interaction_type: display
      data_driven: false

  # ── Error State ───────────────────────────────────────────────────────────────

  - type: stack
    id: pp_error_state
    variant: column
    style:
      alignment: center
      padding: spacing.xl
    children:
      - pp_error_icon
      - pp_error_message
      - pp_retry_button

  - type: icon
    id: pp_error_icon
    content: "policy"
    style:
      color: "#BA1A1A"
      size: "48dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "Error loading privacy policy"
    test_context:
      purpose: "Error icon when privacy policy content cannot be retrieved"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_error_message
    content: "Unable to load Privacy Policy. Please check your connection and try again."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "Unable to load Privacy Policy"
    test_context:
      purpose: "Error message when privacy policy content fails to load"
      interaction_type: display
      data_driven: false

  - type: button
    id: pp_retry_button
    label: "Retry"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#4C662B"
      color: "#4C662B"
      typography: "Outfit/label_large"
      alignment: center
    on_click:
      action: retry_load
      target: privacy-policy
      intent: api
    a11y:
      role: button
      label: "Retry loading Privacy Policy"
    keyboard:
      focusable: true
    test_context:
      purpose: "Retry button to reload privacy policy after failure"
      interaction_type: action
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - pp_gdpr_banner
      - pp_scroll_content
      - pp_last_updated_text
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - pp_loading_skeleton
    note: "Shimmer while bundled privacy policy content deserializes"
  error:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components:
      - pp_error_state
    note: "Shown when bundled asset load fails"
  empty:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - pp_gdpr_banner
      - pp_scroll_content
    show_empty_state: false
    note: "Privacy policy always has static content — empty state not applicable"

state_model:
  PrivacyPolicyViewModel:
    screen_state: PrivacyPolicyUiState
    state:
      - field: policyContent
        type: String
        default: "\"\""
      - field: scrollPosition
        type: Int
        default: "0"
      - field: isLoading
        type: Boolean
        default: "true"
    errors:
      - id: load_failed
        message: "Failed to load Privacy Policy."
    events: [OnBack, OnRetry, OnScrollPositionChanged]
    actions: [onRetry(), onScrollPositionChanged(position: Int)]
    di: [LegalContentRepository]

navigation:
  - id: nav_back
    target: about

dependencies:
  tier: feature
  features: [shared-core]
