sibling: api
schema_version: "4.0"
feature_id: sca-challenge
api:
  - id: obp_answer_challenge
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-request-types/{type}/transaction-requests/{requestId}/challenge"
    tag: TransactionRequests
    description: "PaymentsRepository.answerChallenge(bankId, accountId, type, requestId, challengeId, answer) — submits the entered one-time code against the INITIATED request's challenge. A COMPLETED status books the payment and lets navigation continue to payment-result."
    request:
      fields:
        - { name: id, type: String, note: "challengeId" }
        - { name: answer, type: String, note: "the entered code; sandbox accepts 123" }
    response:
      fields:
        - { name: id, type: String }
        - { name: type, type: String }
        - { name: status, type: String, note: "COMPLETED on success" }
        - { name: transaction_ids, type: List<String> }
        - { name: charge, type: Charge }
    errors:
      - code: 400
        message: "OBP-40014 too many attempts / OBP-40011 no longer confirmable / OBP-40009 payment changed"
      - code: 403
        message: "OBP-30279 needs approval from a different authoriser"
