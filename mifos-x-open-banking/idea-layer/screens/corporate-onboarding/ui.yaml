id: corporate-onboarding
name: "Corporate Customer Onboarding"
feature: corporate-onboarding
flavor: fieldOfficer
status: approved
quality_score: 94
contract_version: "1.1.0"
approve_hash: "sha256:1daf12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []


screens:
  - id: corporate-onboarding-main
    name: "New Corporate Customer"
    archetype: form

components:
  - type: box
    id: progress_stepper
    style:
      layout: horizontal
      padding_vertical: spacing.md
      padding_horizontal: spacing.sm
      background: "#FFFFFF"
      border_bottom_width: 1
      border_bottom_color: "#E1E4D5"
    a11y:
      label: "Corporate onboarding progress"
      role: progressbar
    test_context:
      tag: progress_stepper
    children:
      - type: stack
        id: stepper_stack
        style:
          direction: horizontal
          justify_content: space_between
          align_items: center
          full_width: true
        children:
          - type: box
            id: step1_indicator
            style:
              background: "#4C662B"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 1 Company Information — Current"
            test_context:
              tag: step1_indicator
            children:
              - type: text
                id: step1_number
                content: "1"
                style:
                  color: "#FFFFFF"
                  typography: "Outfit/label_medium"
                  font_weight: 700
                a11y:
                  label: "1"
                test_context:
                  tag: step1_number
          - type: divider
            id: connector_1
            style:
              direction: horizontal
              flex: 1
              height: 2
              background: "#E1E4D5"
              margin_horizontal: spacing.xs
            a11y:
              role: presentation
            test_context:
              tag: connector_1
          - type: box
            id: step2_indicator
            style:
              background: "#E1E4D5"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 2 Beneficial Owners — Upcoming"
            test_context:
              tag: step2_indicator
            children:
              - type: text
                id: step2_number
                content: "2"
                style:
                  color: "#44483D"
                  typography: "Outfit/label_medium"
                  font_weight: 700
                a11y:
                  label: "2"
                test_context:
                  tag: step2_number
          - type: divider
            id: connector_2
            style:
              direction: horizontal
              flex: 1
              height: 2
              background: "#E1E4D5"
              margin_horizontal: spacing.xs
            a11y:
              role: presentation
            test_context:
              tag: connector_2
          - type: box
            id: step3_indicator
            style:
              background: "#E1E4D5"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 3 Documents — Upcoming"
            test_context:
              tag: step3_indicator
            children:
              - type: text
                id: step3_number
                content: "3"
                style:
                  color: "#44483D"
                  typography: "Outfit/label_medium"
                  font_weight: 700
                a11y:
                  label: "3"
                test_context:
                  tag: step3_number
          - type: divider
            id: connector_3
            style:
              direction: horizontal
              flex: 1
              height: 2
              background: "#E1E4D5"
              margin_horizontal: spacing.xs
            a11y:
              role: presentation
            test_context:
              tag: connector_3
          - type: box
            id: step4_indicator
            style:
              background: "#E1E4D5"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 4 Review — Upcoming"
            test_context:
              tag: step4_indicator
            children:
              - type: text
                id: step4_number
                content: "4"
                style:
                  color: "#44483D"
                  typography: "Outfit/label_medium"
                  font_weight: 700
                a11y:
                  label: "4"
                test_context:
                  tag: step4_number

  - type: text
    id: step_label
    content: "Step 1 of 4: Company Information"
    style:
      typography: "Outfit/body_medium"
      color: "#4C662B"
      padding_horizontal: spacing.md
      padding_top: spacing.sm
      padding_bottom: spacing.xs
    a11y:
      label: "Currently on step 1 of 4: Company Information"
    test_context:
      tag: step_label

  # --- STEP 1: Company Information ---
  - type: input
    id: company_name_input
    label: "Legal Company Name"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      required: true
      placeholder: "Kamau Enterprises Limited"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: company_name_input
    a11y:
      label: "Legal company name, required"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: company_name_input
      assert_required: true

  - type: input
    id: registration_number_input
    label: "Business Registration Number"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      required: true
      placeholder: "CPR/2019/123456"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: registration_number_input
    a11y:
      label: "Business registration number, required"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: registration_number_input
      assert_required: true

  - type: input
    id: kra_pin_input
    label: "KRA PIN"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      required: true
      placeholder: "P051234567A"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: kra_pin_input
    a11y:
      label: "KRA Tax PIN, required"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: kra_pin_input
      assert_required: true

  - type: input
    id: industry_select
    label: "Industry"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: select
      options:
        - "Manufacturing"
        - "Retail"
        - "Services"
        - "Agriculture"
        - "Technology"
        - "Finance"
        - "Construction"
        - "Transport & Logistics"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: open_industry_picker
      target: industry_select
    a11y:
      label: "Select business industry"
      role: spinner
    keyboard:
      focusable: true
    test_context:
      tag: industry_select

  - type: input
    id: entity_type_select
    label: "Entity Type"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: select
      options:
        - "Sole Proprietorship"
        - "Partnership"
        - "Limited Company"
        - "NGO"
        - "Co-operative Society"
        - "Public Benefit Organization"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: open_entity_type_picker
      target: entity_type_select
    a11y:
      label: "Select business entity type"
      role: spinner
    keyboard:
      focusable: true
    test_context:
      tag: entity_type_select

  - type: input
    id: year_established_input
    label: "Year Established"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: number
      placeholder: "2019"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: year_established_input
    a11y:
      label: "Year the business was established"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: year_established_input

  # --- STEP 2: Beneficial Owners ---
  - type: box
    id: owner_1_card
    style:
      background: "#FFFFFF"
      border_radius: 10
      padding: 14
      margin_horizontal: spacing.md
      margin_bottom: 10
      elevation: 1
      border_width: 1
      border_color: "#E1E4D5"
    a11y:
      label: "Beneficial owner 1"
    test_context:
      tag: owner_1_card
    children:
      - type: text
        id: owner_1_name
        content: "James Otieno Kamau"
        style:
          typography: "Outfit/body_large"
          color: "#1A1C16"
          weight: 600
          margin_bottom: 2
        a11y:
          label: "Owner: James Otieno Kamau"
        test_context:
          tag: owner_1_name
      - type: text
        id: owner_1_ownership
        content: "Ownership: 60%"
        style:
          typography: "Outfit/body_medium"
          color: "#386663"
          margin_bottom: 2
        a11y:
          label: "Ownership share: 60 percent"
        test_context:
          tag: owner_1_ownership
      - type: text
        id: owner_1_id
        content: "National ID: KE78901234"
        style:
          typography: "Outfit/body_small"
          color: "#44483D"
        a11y:
          label: "National ID: KE78901234"
        test_context:
          tag: owner_1_id

  - type: box
    id: owner_2_card
    style:
      background: "#FFFFFF"
      border_radius: 10
      padding: 14
      margin_horizontal: spacing.md
      margin_bottom: 10
      elevation: 1
      border_width: 1
      border_color: "#E1E4D5"
    a11y:
      label: "Beneficial owner 2"
    test_context:
      tag: owner_2_card
    children:
      - type: text
        id: owner_2_name
        content: "Grace Wanjiku Muthoni"
        style:
          typography: "Outfit/body_large"
          color: "#1A1C16"
          weight: 600
          margin_bottom: 2
        a11y:
          label: "Owner: Grace Wanjiku Muthoni"
        test_context:
          tag: owner_2_name
      - type: text
        id: owner_2_ownership
        content: "Ownership: 25%"
        style:
          typography: "Outfit/body_medium"
          color: "#386663"
          margin_bottom: 2
        a11y:
          label: "Ownership share: 25 percent"
        test_context:
          tag: owner_2_ownership
      - type: text
        id: owner_2_id
        content: "National ID: KE23456789"
        style:
          typography: "Outfit/body_small"
          color: "#44483D"
        a11y:
          label: "National ID: KE23456789"
        test_context:
          tag: owner_2_id

  - type: box
    id: ownership_validator
    style:
      background: "#CDEDA3"
      border_radius: 8
      padding: 12
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      border_width: 1
      border_color: "#E8A317"
    a11y:
      label: "Ownership total validation warning"
      role: alert
    test_context:
      tag: ownership_validator
    children:
      - type: text
        id: ownership_total_text
        content: "Total ownership: 85% — must sum to 100%"
        style:
          typography: "Outfit/body_medium"
          color: "#44483D"  # fix A11Y-002: was #E8A317 (1.68:1 on CDEDA3, FAIL); #44483D = 7.25:1 PASS
          weight: 500
        a11y:
          label: "Warning: total ownership is 85 percent, must reach 100 percent"
        test_context:
          tag: ownership_total_text

  - type: button
    id: add_owner_button
    label: "Add Beneficial Owner"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#4C662B"
      text_color: "#4C662B"
      icon: person_add
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: add_owner
      target: add_owner_sheet
    a11y:
      label: "Add another beneficial owner"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: add_owner_button
      assertClickable: true

  # --- STEP 3: Documents ---
  - type: button
    id: upload_cert_button
    label: "Upload Certificate of Incorporation"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#4C662B"
      text_color: "#4C662B"
      icon: upload_file
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: upload_cert
      target: incorporation_cert
    a11y:
      label: "Upload certificate of incorporation document"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_cert_button
      assertClickable: true

  - type: button
    id: upload_tax_button
    label: "Upload Tax Compliance Certificate"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#4C662B"
      text_color: "#4C662B"
      icon: upload_file
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: upload_tax
      target: tax_compliance_cert
    a11y:
      label: "Upload KRA tax compliance certificate"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_tax_button
      assertClickable: true

  - type: button
    id: upload_directors_id_button
    label: "Upload Directors' ID Documents"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#386663"
      text_color: "#386663"
      icon: badge
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: upload_document
      target: directors_ids
    a11y:
      label: "Upload identity documents for all directors"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_directors_id_button
      assertClickable: true

  # --- STEP 4: Review and Submit ---
  - type: box
    id: corporate_review_card
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding: 16
      margin_horizontal: spacing.md
      margin_bottom: spacing.md
      elevation: 2
    a11y:
      label: "Corporate application review summary"
    test_context:
      tag: corporate_review_card
    children:
      - type: text
        id: review_company_name
        content: "Kamau Enterprises Limited"
        style:
          typography: "Outfit/title_medium"
          color: "#1A1C16"
          weight: 700
          margin_bottom: spacing.xs
        a11y:
          label: "Company: Kamau Enterprises Limited"
        test_context:
          tag: review_company_name
      - type: text
        id: review_reg_number
        content: "Reg: CPR/2019/123456 · KRA: P051234567A"
        style:
          typography: "Outfit/body_medium"
          color: "#44483D"
          margin_bottom: spacing.xs
        a11y:
          label: "Registration CPR/2019/123456, KRA PIN P051234567A"
        test_context:
          tag: review_reg_number
      - type: text
        id: review_entity_type
        content: "Limited Company · Technology · Est. 2019"
        style:
          typography: "Outfit/body_medium"
          color: "#44483D"
          margin_bottom: spacing.xs
        a11y:
          label: "Limited company in technology, established 2019"
        test_context:
          tag: review_entity_type
      - type: text
        id: review_owners_count
        content: "2 Beneficial Owners · 85% accounted"
        style:
          typography: "Outfit/body_medium"
          color: "#44483D"  # fix A11Y-002: was #E8A317 (1.68:1 on CDEDA3, FAIL); #44483D = 7.25:1 PASS
        a11y:
          label: "2 beneficial owners, 85 percent ownership accounted"
        test_context:
          tag: review_owners_count

  - type: button
    id: submit_corporate_button
    label: "Submit Corporate Application"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: submit
      target: account-applications
    a11y:
      label: "Submit corporate customer application"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: submit_corporate_button
      assertClickable: true

  - type: stack
    id: nav_buttons
    style:
      direction: horizontal
      justify_content: space_between
      padding_horizontal: spacing.md
      padding_vertical: spacing.md
      gap: 12
    a11y:
      label: "Step navigation buttons"
    test_context:
      tag: nav_buttons
    children:
      - type: button
        id: back_button
        label: "Back"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: outlined
          border_color: "#4C662B"
          text_color: "#4C662B"
          flex: 1
        on_click:
          action: go_back
          target: previous_step
        a11y:
          label: "Go back to previous step"
          role: button
        keyboard:
          focusable: true
        test_context:
          tag: back_button
          assert_clickable: true
      - type: button
        id: next_button
        label: "Next"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: filled
          background: "#4C662B"
          text_color: "#FFFFFF"
          flex: 1
        on_click:
          action: go_next
          target: next_step
        a11y:
          label: "Proceed to next step"
          role: button
        keyboard:
          focusable: true
        test_context:
          tag: next_button
          assert_clickable: true

responsive:
  mobile_only: true
  baseline_width: 390

states:
  step_1:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - company_name_input
        - registration_number_input
        - kra_pin_input
        - industry_select
        - entity_type_select
        - year_established_input
        - nav_buttons
  step_2:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - owner_1_card
        - owner_2_card
        - ownership_validator
        - add_owner_button
        - nav_buttons
  step_3:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - upload_cert_button
        - upload_tax_button
        - upload_directors_id_button
        - nav_buttons
  step_4:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - corporate_review_card
        - submit_corporate_button
        - nav_buttons
  loading:
    layout:
      scroll: vertical
      padding: 0
      showProgressOverlay: true
      overlayMessage: "Submitting corporate application..."
  submitted:
    layout:
      scroll: vertical
      padding: 16
      showSuccessBanner: true
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true
  content:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - company_name_input
        - registration_number_input
        - kra_pin_input
        - industry_select
        - entity_type_select
        - year_established_input
        - nav_buttons
  empty:
    layout:
      scroll: vertical
      padding: 16
      showEmptyState: true
      emptyStateIcon: business_center
      emptyStateMessage: "Corporate onboarding unavailable. Contact support."

state_model:
  ViewModel: CorporateOnboardingViewModel
  state_fields:
    - name: currentStep
      type: Int
      default: "1"
    - name: companyInfo
      type: CompanyInfoDraft
    - name: beneficialOwners
      type: "List<BeneficialOwnerDraft>"
      default: emptyList
    - name: ownershipTotal
      type: Float
      default: "0.0"
    - name: documents
      type: CorporateDocumentsDraft
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: validationErrors
      type: "Map<String, String>"
      default: emptyMap
  errors:
    - SUBMIT_FAILED
    - OWNERSHIP_NOT_100_PERCENT
    - DOCUMENT_UPLOAD_FAILED
    - VALIDATION_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - StepAdvanced
    - StepBacked
    - OwnerAdded
    - OwnerRemoved
    - DocumentUploaded
    - ApplicationSubmitted
    - RetryLoadEvent
  actions:
    - go_next
    - go_back
    - add_owner
    - upload_cert
    - upload_tax
    - upload_document
    - submit
    - retry_load
  di:
    - CustomerRepository
    - DocumentUploadService
    - FormValidator

api:
  - endpoint: "POST /obp/v5.1.0/banks/{bankId}/customers"
    tag: Customers
    response:
      fields:
        - customer_id
        - legal_name
        - customer_number
        - customer_type
        - kyc_status
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 409: CUSTOMER_ALREADY_EXISTS

dependencies:
  tier: feature
  features:
    - account-applications
    - kyc-review
