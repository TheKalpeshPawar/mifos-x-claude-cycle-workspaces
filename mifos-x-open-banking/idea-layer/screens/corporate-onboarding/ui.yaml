id: corporate-onboarding
name: "Corporate Customer Onboarding"
feature: corporate-onboarding
flavor: fieldOfficer
status: approved
quality_score: 80
contract_version: "1.1.0"
approve_hash: "sha256:1daf12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []


screens:
  - id: corporate-onboarding-main
    name: "New Corporate Customer"
    archetype: form

components:
  - type: box
    id: progress_stepper
    style:
      layout: horizontal
      paddingVertical: 16
      paddingHorizontal: 12
      backgroundColor: "#FFFFFF"
      borderBottomWidth: 1
      borderBottomColor: "#E1E4D5"
    a11y:
      contentDescription: "Corporate onboarding progress"
      role: progressbar
    test_context:
      tag: progress_stepper
    components:
      - type: stack
        id: stepper_stack
        style:
          direction: horizontal
          justifyContent: space_between
          alignItems: center
          fillWidth: true
        components:
          - type: box
            id: step1_indicator
            style:
              backgroundColor: "#4C662B"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 1 Company Information — Current"
            test_context:
              tag: step1_indicator
            components:
              - type: text
                id: step1_number
                content: "1"
                style:
                  color: "#FFFFFF"
                  textStyle: label_medium
                  weight: 700
                a11y:
                  contentDescription: "1"
                test_context:
                  tag: step1_number
          - type: divider
            id: connector_1
            style:
              direction: horizontal
              flex: 1
              height: 2
              backgroundColor: "#E1E4D5"
              marginHorizontal: 4
            a11y:
              role: presentation
            test_context:
              tag: connector_1
          - type: box
            id: step2_indicator
            style:
              backgroundColor: "#E1E4D5"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 2 Beneficial Owners — Upcoming"
            test_context:
              tag: step2_indicator
            components:
              - type: text
                id: step2_number
                content: "2"
                style:
                  color: "#75796C"
                  textStyle: label_medium
                  weight: 700
                a11y:
                  contentDescription: "2"
                test_context:
                  tag: step2_number
          - type: divider
            id: connector_2
            style:
              direction: horizontal
              flex: 1
              height: 2
              backgroundColor: "#E1E4D5"
              marginHorizontal: 4
            a11y:
              role: presentation
            test_context:
              tag: connector_2
          - type: box
            id: step3_indicator
            style:
              backgroundColor: "#E1E4D5"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 3 Documents — Upcoming"
            test_context:
              tag: step3_indicator
            components:
              - type: text
                id: step3_number
                content: "3"
                style:
                  color: "#75796C"
                  textStyle: label_medium
                  weight: 700
                a11y:
                  contentDescription: "3"
                test_context:
                  tag: step3_number
          - type: divider
            id: connector_3
            style:
              direction: horizontal
              flex: 1
              height: 2
              backgroundColor: "#E1E4D5"
              marginHorizontal: 4
            a11y:
              role: presentation
            test_context:
              tag: connector_3
          - type: box
            id: step4_indicator
            style:
              backgroundColor: "#E1E4D5"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 4 Review — Upcoming"
            test_context:
              tag: step4_indicator
            components:
              - type: text
                id: step4_number
                content: "4"
                style:
                  color: "#75796C"
                  textStyle: label_medium
                  weight: 700
                a11y:
                  contentDescription: "4"
                test_context:
                  tag: step4_number

  - type: text
    id: step_label
    content: "Step 1 of 4: Company Information"
    style:
      textStyle: body_medium
      color: "#4C662B"
      paddingHorizontal: 16
      paddingTop: 12
      paddingBottom: 4
    a11y:
      contentDescription: "Currently on step 1 of 4: Company Information"
    test_context:
      tag: step_label

  # --- STEP 1: Company Information ---
  - type: input
    id: company_name_input
    label: "Legal Company Name"
    style:
      variant: outlined
      inputType: text
      required: true
      placeholder: "Kamau Enterprises Limited"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: company_name_input
    a11y:
      contentDescription: "Legal company name, required"
      role: textField
    keyboard:
      focusable: true
    test_context:
      tag: company_name_input
      assertRequired: true

  - type: input
    id: registration_number_input
    label: "Business Registration Number"
    style:
      variant: outlined
      inputType: text
      required: true
      placeholder: "CPR/2019/123456"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: registration_number_input
    a11y:
      contentDescription: "Business registration number, required"
      role: textField
    keyboard:
      focusable: true
    test_context:
      tag: registration_number_input
      assertRequired: true

  - type: input
    id: kra_pin_input
    label: "KRA PIN"
    style:
      variant: outlined
      inputType: text
      required: true
      placeholder: "P051234567A"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: kra_pin_input
    a11y:
      contentDescription: "KRA Tax PIN, required"
      role: textField
    keyboard:
      focusable: true
    test_context:
      tag: kra_pin_input
      assertRequired: true

  - type: input
    id: industry_select
    label: "Industry"
    style:
      variant: outlined
      inputType: select
      options:
        - "Manufacturing"
        - "Retail"
        - "Services"
        - "Agriculture"
        - "Technology"
        - "Finance"
        - "Construction"
        - "Transport & Logistics"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: open_industry_picker
      target: industry_select
    a11y:
      contentDescription: "Select business industry"
      role: spinner
    keyboard:
      focusable: true
    test_context:
      tag: industry_select

  - type: input
    id: entity_type_select
    label: "Entity Type"
    style:
      variant: outlined
      inputType: select
      options:
        - "Sole Proprietorship"
        - "Partnership"
        - "Limited Company"
        - "NGO"
        - "Co-operative Society"
        - "Public Benefit Organization"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: open_entity_type_picker
      target: entity_type_select
    a11y:
      contentDescription: "Select business entity type"
      role: spinner
    keyboard:
      focusable: true
    test_context:
      tag: entity_type_select

  - type: input
    id: year_established_input
    label: "Year Established"
    style:
      variant: outlined
      inputType: number
      placeholder: "2019"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: year_established_input
    a11y:
      contentDescription: "Year the business was established"
      role: textField
    keyboard:
      focusable: true
    test_context:
      tag: year_established_input

  # --- STEP 2: Beneficial Owners ---
  - type: box
    id: owner_1_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 10
      elevation: 1
      borderWidth: 1
      borderColor: "#E1E4D5"
    a11y:
      contentDescription: "Beneficial owner 1"
    test_context:
      tag: owner_1_card
    components:
      - type: text
        id: owner_1_name
        content: "James Otieno Kamau"
        style:
          textStyle: body_large
          color: "#1A1C16"
          weight: 600
          marginBottom: 2
        a11y:
          contentDescription: "Owner: James Otieno Kamau"
        test_context:
          tag: owner_1_name
      - type: text
        id: owner_1_ownership
        content: "Ownership: 60%"
        style:
          textStyle: body_medium
          color: "#386663"
          marginBottom: 2
        a11y:
          contentDescription: "Ownership share: 60 percent"
        test_context:
          tag: owner_1_ownership
      - type: text
        id: owner_1_id
        content: "National ID: KE78901234"
        style:
          textStyle: body_small
          color: "#44483D"
        a11y:
          contentDescription: "National ID: KE78901234"
        test_context:
          tag: owner_1_id

  - type: box
    id: owner_2_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 10
      elevation: 1
      borderWidth: 1
      borderColor: "#E1E4D5"
    a11y:
      contentDescription: "Beneficial owner 2"
    test_context:
      tag: owner_2_card
    components:
      - type: text
        id: owner_2_name
        content: "Grace Wanjiku Muthoni"
        style:
          textStyle: body_large
          color: "#1A1C16"
          weight: 600
          marginBottom: 2
        a11y:
          contentDescription: "Owner: Grace Wanjiku Muthoni"
        test_context:
          tag: owner_2_name
      - type: text
        id: owner_2_ownership
        content: "Ownership: 25%"
        style:
          textStyle: body_medium
          color: "#386663"
          marginBottom: 2
        a11y:
          contentDescription: "Ownership share: 25 percent"
        test_context:
          tag: owner_2_ownership
      - type: text
        id: owner_2_id
        content: "National ID: KE23456789"
        style:
          textStyle: body_small
          color: "#44483D"
        a11y:
          contentDescription: "National ID: KE23456789"
        test_context:
          tag: owner_2_id

  - type: box
    id: ownership_validator
    style:
      backgroundColor: "#CDEDA3"
      borderRadius: 8
      padding: 12
      marginHorizontal: 16
      marginBottom: 8
      borderWidth: 1
      borderColor: "#E8A317"
    a11y:
      contentDescription: "Ownership total validation warning"
      role: alert
    test_context:
      tag: ownership_validator
    components:
      - type: text
        id: ownership_total_text
        content: "Total ownership: 85% — must sum to 100%"
        style:
          textStyle: body_medium
          color: "#E8A317"
          weight: 500
        a11y:
          contentDescription: "Warning: total ownership is 85 percent, must reach 100 percent"
        test_context:
          tag: ownership_total_text

  - type: button
    id: add_owner_button
    label: "Add Beneficial Owner"
    style:
      variant: outlined
      borderColor: "#4C662B"
      textColor: "#4C662B"
      icon: person_add
      marginHorizontal: 16
      marginBottom: 12
      fillWidth: true
    on_click:
      action: add_owner
      target: add_owner_sheet
    a11y:
      contentDescription: "Add another beneficial owner"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: add_owner_button
      assertClickable: true

  # --- STEP 3: Documents ---
  - type: button
    id: upload_cert_button
    label: "Upload Certificate of Incorporation"
    style:
      variant: outlined
      borderColor: "#4C662B"
      textColor: "#4C662B"
      icon: upload_file
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: upload_cert
      target: incorporation_cert
    a11y:
      contentDescription: "Upload certificate of incorporation document"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_cert_button
      assertClickable: true

  - type: button
    id: upload_tax_button
    label: "Upload Tax Compliance Certificate"
    style:
      variant: outlined
      borderColor: "#4C662B"
      textColor: "#4C662B"
      icon: upload_file
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: upload_tax
      target: tax_compliance_cert
    a11y:
      contentDescription: "Upload KRA tax compliance certificate"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_tax_button
      assertClickable: true

  - type: button
    id: upload_directors_id_button
    label: "Upload Directors' ID Documents"
    style:
      variant: outlined
      borderColor: "#386663"
      textColor: "#386663"
      icon: badge
      marginHorizontal: 16
      marginBottom: 12
      fillWidth: true
    on_click:
      action: upload_document
      target: directors_ids
    a11y:
      contentDescription: "Upload identity documents for all directors"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_directors_id_button
      assertClickable: true

  # --- STEP 4: Review and Submit ---
  - type: box
    id: corporate_review_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 12
      padding: 16
      marginHorizontal: 16
      marginBottom: 16
      elevation: 2
    a11y:
      contentDescription: "Corporate application review summary"
    test_context:
      tag: corporate_review_card
    components:
      - type: text
        id: review_company_name
        content: "Kamau Enterprises Limited"
        style:
          textStyle: title_medium
          color: "#1A1C16"
          weight: 700
          marginBottom: 4
        a11y:
          contentDescription: "Company: Kamau Enterprises Limited"
        test_context:
          tag: review_company_name
      - type: text
        id: review_reg_number
        content: "Reg: CPR/2019/123456 · KRA: P051234567A"
        style:
          textStyle: body_medium
          color: "#44483D"
          marginBottom: 4
        a11y:
          contentDescription: "Registration CPR/2019/123456, KRA PIN P051234567A"
        test_context:
          tag: review_reg_number
      - type: text
        id: review_entity_type
        content: "Limited Company · Technology · Est. 2019"
        style:
          textStyle: body_medium
          color: "#44483D"
          marginBottom: 4
        a11y:
          contentDescription: "Limited company in technology, established 2019"
        test_context:
          tag: review_entity_type
      - type: text
        id: review_owners_count
        content: "2 Beneficial Owners · 85% accounted"
        style:
          textStyle: body_medium
          color: "#E8A317"
        a11y:
          contentDescription: "2 beneficial owners, 85 percent ownership accounted"
        test_context:
          tag: review_owners_count

  - type: button
    id: submit_corporate_button
    label: "Submit Corporate Application"
    style:
      variant: filled
      backgroundColor: "#4C662B"
      textColor: "#FFFFFF"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: submit
      target: account-applications
    a11y:
      contentDescription: "Submit corporate customer application"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: submit_corporate_button
      assertClickable: true

  - type: stack
    id: nav_buttons
    style:
      direction: horizontal
      justifyContent: space_between
      paddingHorizontal: 16
      paddingVertical: 16
      gap: 12
    a11y:
      contentDescription: "Step navigation buttons"
    test_context:
      tag: nav_buttons
    components:
      - type: button
        id: back_button
        label: "Back"
        style:
          variant: outlined
          borderColor: "#4C662B"
          textColor: "#4C662B"
          flex: 1
        on_click:
          action: go_back
          target: previous_step
        a11y:
          contentDescription: "Go back to previous step"
          role: button
        keyboard:
          focusable: true
        test_context:
          tag: back_button
          assertClickable: true
      - type: button
        id: next_button
        label: "Next"
        style:
          variant: filled
          backgroundColor: "#4C662B"
          textColor: "#FFFFFF"
          flex: 1
        on_click:
          action: go_next
          target: next_step
        a11y:
          contentDescription: "Proceed to next step"
          role: button
        keyboard:
          focusable: true
        test_context:
          tag: next_button
          assertClickable: true

states:
  step_1:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - company_name_input
        - registration_number_input
        - kra_pin_input
        - industry_select
        - entity_type_select
        - year_established_input
        - nav_buttons
  step_2:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - owner_1_card
        - owner_2_card
        - ownership_validator
        - add_owner_button
        - nav_buttons
  step_3:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - upload_cert_button
        - upload_tax_button
        - upload_directors_id_button
        - nav_buttons
  step_4:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_label
        - corporate_review_card
        - submit_corporate_button
        - nav_buttons
  submitting:
    layout:
      scroll: vertical
      padding: 0
      showProgressOverlay: true
      overlayMessage: "Submitting corporate application..."
  submitted:
    layout:
      scroll: vertical
      padding: 16
      showSuccessBanner: true
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: CorporateOnboardingViewModel
  state_fields:
    - name: currentStep
      type: Int
      default: "1"
    - name: companyInfo
      type: CompanyInfoDraft
    - name: beneficialOwners
      type: "List<BeneficialOwnerDraft>"
      default: emptyList
    - name: ownershipTotal
      type: Float
      default: "0.0"
    - name: documents
      type: CorporateDocumentsDraft
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: validationErrors
      type: "Map<String, String>"
      default: emptyMap
  errors:
    - SUBMIT_FAILED
    - OWNERSHIP_NOT_100_PERCENT
    - DOCUMENT_UPLOAD_FAILED
    - VALIDATION_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - StepAdvanced
    - StepBacked
    - OwnerAdded
    - OwnerRemoved
    - DocumentUploaded
    - ApplicationSubmitted
  actions:
    - go_next
    - go_back
    - add_owner
    - upload_cert
    - upload_tax
    - upload_document
    - submit
  di:
    - CustomerRepository
    - DocumentUploadService
    - FormValidator

api:
  - endpoint: "POST /obp/v5.1.0/banks/{bankId}/customers"
    tag: Customers
    response:
      fields:
        - customer_id
        - legal_name
        - customer_number
        - customer_type
        - kyc_status
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 409: CUSTOMER_ALREADY_EXISTS

dependencies:
  tier: feature
  features:
    - account-applications
    - kyc-review
