<!doctype html>
<html lang="en" data-screen="corporate-onboarding" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Customer Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .top-app-bar {
      display: flex; align-items: center;
      background: var(--surface);
      padding: 0 4px; height: 64px;
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--surface-variant);
    }
    .icon-btn {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; cursor: pointer;
      color: var(--on-surface); background: none; border: none;
    }
    .bar-title { flex: 1; font-size: 20px; font-weight: 600; color: var(--on-surface); padding-left: 4px; }
    .screen-content { padding-bottom: 32px; }
    .stepper {
      display: flex; align-items: center;
      padding: 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-variant);
    }
    .step-circle {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .step-active { background: var(--primary); color: var(--on-primary); }
    .step-inactive { background: var(--surface-variant); color: var(--outline); }
    .step-line { flex: 1; height: 2px; background: var(--surface-variant); margin: 0 4px; }
    .step-label { font-size: 14px; color: var(--primary); padding: 12px 16px 4px; }
    .form-group { margin: 0 16px 12px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--on-surface-variant); margin-bottom: 4px;
    }
    .required { color: var(--error); }
    .form-input, .form-select {
      width: 100%; padding: 14px 12px;
      border: 1.5px solid var(--outline-variant);
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px; color: var(--on-surface);
      background: var(--surface); outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--primary); }
    .nav-row { display: flex; gap: 12px; padding: 16px; }
    .btn-back {
      flex: 1; padding: 14px;
      border: 1.5px solid var(--primary); border-radius: 8px;
      background: transparent; color: var(--primary);
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn-next {
      flex: 1; padding: 14px;
      background: var(--primary); border: none; border-radius: 8px;
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons">arrow_back</span>
    </button>
    <span class="bar-title">New Corporate Customer</span>
  </header>

  <main class="screen-content" role="main">

    <!-- Progress stepper -->
    <div
      data-component-type="box" data-component-id="progress_stepper"
      class="stepper"
      role="progressbar" aria-label="Corporate onboarding progress" aria-valuenow="1" aria-valuemin="1" aria-valuemax="4"
    >
      <div data-component-type="box" data-component-id="step1_indicator" class="step-circle step-active" aria-label="Step 1 Company Information — Current">1</div>
      <div data-component-type="divider" data-component-id="connector_1" class="step-line" role="presentation"></div>
      <div data-component-type="box" data-component-id="step2_indicator" class="step-circle step-inactive" aria-label="Step 2 Beneficial Owners — Upcoming">2</div>
      <div data-component-type="divider" data-component-id="connector_2" class="step-line" role="presentation"></div>
      <div data-component-type="box" data-component-id="step3_indicator" class="step-circle step-inactive" aria-label="Step 3 Documents — Upcoming">3</div>
      <div data-component-type="divider" data-component-id="connector_3" class="step-line" role="presentation"></div>
      <div data-component-type="box" data-component-id="step4_indicator" class="step-circle step-inactive" aria-label="Step 4 Review — Upcoming">4</div>
    </div>

    <p data-component-type="text" data-component-id="step_label" class="step-label" aria-label="Currently on step 1 of 4: Company Information">Step 1 of 4: Company Information</p>

    <!-- Company Information fields -->
    <div data-component-type="input" data-component-id="company_name_input" class="form-group">
      <label class="form-label" for="co_name">Legal Company Name<span class="required">*</span></label>
      <input id="co_name" class="form-input" type="text" placeholder="Kamau Enterprises Limited"
        data-action="focus_field" role="textbox" aria-label="Legal company name, required" aria-required="true" tabindex="0">
    </div>

    <div data-component-type="input" data-component-id="registration_number_input" class="form-group">
      <label class="form-label" for="reg_no">Business Registration Number<span class="required">*</span></label>
      <input id="reg_no" class="form-input" type="text" placeholder="CPR/2019/123456"
        data-action="focus_field" role="textbox" aria-label="Business registration number, required" aria-required="true" tabindex="0">
    </div>

    <div data-component-type="input" data-component-id="kra_pin_input" class="form-group">
      <label class="form-label" for="kra_pin">KRA PIN<span class="required">*</span></label>
      <input id="kra_pin" class="form-input" type="text" placeholder="P051234567A"
        data-action="focus_field" role="textbox" aria-label="KRA Tax PIN, required" aria-required="true" tabindex="0">
    </div>

    <div data-component-type="input" data-component-id="industry_select" class="form-group">
      <label class="form-label" for="industry">Industry</label>
      <select id="industry" class="form-select" data-action="open_industry_picker" aria-label="Select business industry" tabindex="0">
        <option value="">Select industry...</option>
        <option>Manufacturing</option>
        <option>Retail</option>
        <option>Services</option>
        <option>Agriculture</option>
        <option>Technology</option>
        <option>Finance</option>
        <option>Construction</option>
        <option>Transport &amp; Logistics</option>
      </select>
    </div>

    <div data-component-type="input" data-component-id="entity_type_select" class="form-group">
      <label class="form-label" for="entity_type">Entity Type</label>
      <select id="entity_type" class="form-select" data-action="open_entity_type_picker" aria-label="Select business entity type" tabindex="0">
        <option value="">Select entity type...</option>
        <option>Sole Proprietorship</option>
        <option>Partnership</option>
        <option>Limited Company</option>
        <option>NGO</option>
        <option>Co-operative Society</option>
        <option>Public Benefit Organization</option>
      </select>
    </div>

    <div data-component-type="input" data-component-id="year_established_input" class="form-group">
      <label class="form-label" for="year_est">Year Established</label>
      <input id="year_est" class="form-input" type="number" placeholder="2019"
        data-action="focus_field" role="textbox" aria-label="Year the business was established" tabindex="0">
    </div>

    <!-- Navigation buttons -->
    <div data-component-type="stack" data-component-id="nav_buttons" class="nav-row" aria-label="Step navigation buttons">
      <button data-component-type="button" data-component-id="back_button" class="btn-back"
        data-action="go_back" role="button" aria-label="Go back to previous step" tabindex="0">Back</button>
      <button data-component-type="button" data-component-id="next_button" class="btn-next"
        data-action="go_next" role="button" aria-label="Proceed to next step" tabindex="0">Next</button>
    </div>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
