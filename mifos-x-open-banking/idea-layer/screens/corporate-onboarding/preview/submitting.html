<!doctype html>
<html lang="en" data-screen="corporate-onboarding" data-state="submitting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Onboarding — Submitting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
      --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF;
      --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; position: relative; }
    .top-app-bar { display: flex; align-items: center; background: var(--surface); padding: 0 4px; height: 64px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--surface-variant); }
    .icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; color: var(--on-surface); background: none; border: none; opacity: 0.5; }
    .bar-title { flex: 1; font-size: 20px; font-weight: 600; color: var(--on-surface); padding-left: 4px; }
    .form-body { padding: 24px 20px; opacity: 0.45; pointer-events: none; }
    .form-title { font-size: 26px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .form-sub { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 24px; line-height: 1.5; }
    .field-block { margin-bottom: 16px; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; display: block; }
    .field-mock { height: 48px; border: 1px solid var(--outline-variant); border-radius: 12px; background: var(--surface); }
    /* Overlay */
    .submitting-overlay {
      position: fixed; inset: 0; max-width: 390px; margin: 0 auto;
      background: rgba(249,250,239,0.65); display: flex; align-items: center; justify-content: center; z-index: 30;
    }
    .overlay-card {
      background: var(--surface); border-radius: 16px; padding: 36px 28px; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.14); display: flex; flex-direction: column; align-items: center; gap: 16px; width: 280px;
    }
    .overlay-spinner { width: 52px; height: 52px; border: 4px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { font-size: 17px; font-weight: 600; color: var(--on-surface); }
    .overlay-sub { font-size: 13px; color: var(--outline); line-height: 1.5; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" aria-label="Go back" aria-disabled="true">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <span class="bar-title">Corporate Onboarding</span>
  </header>

  <div class="form-body">
    <h1 class="form-title">Business Details</h1>
    <p class="form-sub">Submitting your corporate onboarding application</p>
    <div class="field-block"><label class="field-label">Company Name</label><div class="field-mock"></div></div>
    <div class="field-block"><label class="field-label">Registration Number</label><div class="field-mock"></div></div>
    <div class="field-block"><label class="field-label">Business Type</label><div class="field-mock"></div></div>
    <div class="field-block"><label class="field-label">Primary Contact</label><div class="field-mock"></div></div>
  </div>

  <div class="submitting-overlay" role="status" aria-live="polite" aria-label="Submitting corporate onboarding application"
       data-component-type="box" data-component-id="corp_submitting_overlay">
    <div class="overlay-card">
      <div class="overlay-spinner" aria-hidden="true"></div>
      <span class="overlay-text">Submitting application...</span>
      <span class="overlay-sub">Please wait while we process your corporate details</span>
    </div>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
