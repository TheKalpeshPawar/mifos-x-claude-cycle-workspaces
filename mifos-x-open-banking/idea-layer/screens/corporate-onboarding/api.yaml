sibling: api
schema_version: "4.0"
feature_id: corporate-onboarding
api:
  - id: obp_create_corporate_customer
    endpoint: "POST /obp/v5.1.0/banks/{bankId}/customers"
    tag: Customers
    response:
      fields:
        - customer_id
        - legal_name
        - customer_number
        - customer_type
        - kyc_status
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 409: CUSTOMER_ALREADY_EXISTS
