screen_id: budgets

on_mount:
  - trigger: budgets_load
    description: "Read saved budgets from DataStore and compute current-month spend per category from transaction cache. Screen starts in loading state; transitions to content, empty, or error."
    loading_state: loading
    steps:
      - client_derived:
          description: >
            Load persisted budgets from local DataStore via kotlinx-serialization.
            For each budget, look up the current-month category spend from the
            in-app AIS transaction cache and compute:
              fraction        = min(used / limit, 1.0)  — clamped for display
              percent_label   = "${(fraction * 100).roundToInt()}%"
              is_over_budget  = used > limit
              progress_color  = if (is_over_budget) error else primary
              remaining_label = if (is_over_budget) "£${over} over" else "£${left} left"
              alert_text      = if (is_over_budget) "Over budget by £${over}" else ""
            Also resolve current_month_label = "June 2026" (Month YYYY from kotlinx-datetime).
          store_as: budgets
    on_success: content
    on_empty: empty
    on_error: error

on_user_action:
  - trigger: retry_load
    description: "User taps Retry after error on mount. Re-runs budgets_load from loading state."
    transitions_to: loading
    then: budgets_load

  - trigger: save_budget
    description: >
      Validate form fields (required + numeric + min 0.01).
      If valid: upsert BudgetEntry in DataStore by category key (overwrites duplicate);
      re-run budget-progress computation for the affected category;
      transition list from empty → content if this is the first budget;
      reset form (category default, amount empty).
    on_validation_fail: "Set field-level error messages; remain on current state; do not persist."
    on_write_error: "Show snackbar '{strings.budgets.snackbar_write_error}'; remain on current state."
    on_success: "Refresh budgets list in-place; reset form."

  - trigger: delete_budget
    description: >
      Remove the BudgetEntry matching params.category from DataStore.
      Re-render the budgets list; if the last budget is deleted, transition to empty state.
    on_write_error: "Show snackbar '{strings.budgets.snackbar_write_error}'; entry remains visible."

  - trigger: select_budget_category
    description: "Update form.category with the selected category string."

  - trigger: update_budget_amount_field
    description: "Update form.amount; trigger inline validation (numeric + min 0.01)."

  - trigger: navigate_spending_by_category
    description: "Emit navigation event to spending-by-category screen with category filter param."
