feature: pfm
flow_ref: pfm-review

entry_points:
  - source: pfm-dashboard
    label: "Tap 'Budgets' chip on PFM dashboard"

transitions:
  - from: budgets
    to: pfm-dashboard
    trigger: "System back or tap back arrow in top app bar"
    label: "Return to PFM dashboard"

  - from: budgets
    to: spending-by-category
    trigger: "Tap 'View transactions' button on a budget card"
    params: [category]
