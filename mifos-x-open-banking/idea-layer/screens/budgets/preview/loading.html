<!doctype html>
<!-- render-hash: b2e5a9d3f1c8 -->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgets — loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens — ALL hex values confined here ───────────── */
    :root {
      --color-primary:                  #266489;
      --color-on-primary:               #FFFFFF;
      --color-primary-container:        #C9E6FF;
      --color-on-primary-container:     #004B6F;
      --color-secondary:                #50606E;
      --color-on-secondary:             #FFFFFF;
      --color-secondary-container:      #D3E5F5;
      --color-on-secondary-container:   #384956;
      --color-error:                    #BA1A1A;
      --color-on-error:                 #FFFFFF;
      --color-background:               #F7F9FF;
      --color-on-background:            #181C20;
      --color-surface:                  #F7F9FF;
      --color-on-surface:               #181C20;
      --color-surface-variant:          #DDE3EA;
      --color-on-surface-variant:       #41474D;
      --color-outline:                  #72787E;
      --color-outline-variant:          #C1C7CE;
      --color-surface-container-lowest: #FFFFFF;
      --color-surface-container-low:    #F1F4F9;
      --color-surface-container:        #EBEEF3;
      --color-surface-container-high:   #E5E8ED;
      --color-surface-container-highest:#E0E3E8;
      --color-inverse-surface:          #2D3135;
      --color-inverse-on-surface:       #EEF1F6;
      --color-inverse-primary:          #95CDF7;

      --font-brand: 'Roboto', sans-serif;
      --font-mono:  'Roboto Mono', monospace;

      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-12: 48px;

      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   16px;
      --radius-full: 9999px;

      --dur-short:  150ms;
      --dur-medium: 300ms;
      --ease-emp:   cubic-bezier(0.2, 0.0, 0, 1.0);

      /* Skeleton shimmer colors */
      --skeleton-base:      #E5E8ED;
      --skeleton-highlight: #F1F4F9;
    }

    [data-theme="dark"] {
      --color-primary:                  #95CDF7;
      --color-on-primary:               #00344E;
      --color-primary-container:        #004B6F;
      --color-on-primary-container:     #C9E6FF;
      --color-secondary:                #B7C9D9;
      --color-on-secondary:             #22323F;
      --color-secondary-container:      #384956;
      --color-on-secondary-container:   #D3E5F5;
      --color-error:                    #FFB4AB;
      --color-on-error:                 #690005;
      --color-background:               #101417;
      --color-on-background:            #E0E3E8;
      --color-surface:                  #101417;
      --color-on-surface:               #E0E3E8;
      --color-surface-variant:          #41474D;
      --color-on-surface-variant:       #C1C7CE;
      --color-outline:                  #8B9198;
      --color-outline-variant:          #41474D;
      --color-surface-container-lowest: #0B0F12;
      --color-surface-container-low:    #181C20;
      --color-surface-container:        #1C2024;
      --color-surface-container-high:   #262A2E;
      --color-surface-container-highest:#313539;
      --color-inverse-surface:          #E0E3E8;
      --color-inverse-on-surface:       #2D3135;
      --color-inverse-primary:          #266489;
      --skeleton-base:      #262A2E;
      --skeleton-highlight: #313539;
    }

    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-brand);
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
      background-color: var(--color-background);
      color: var(--color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin: 0 auto;
    }

    /* ── Skeleton shimmer animation ──────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .sk {
      display: block;
      background: linear-gradient(
        90deg,
        var(--skeleton-base) 25%,
        var(--skeleton-highlight) 50%,
        var(--skeleton-base) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.6s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }

    /* ── Top App Bar ─────────────────────────────────────────────── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: var(--color-surface-container);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--sp-1);
      border-bottom: 1px solid var(--color-outline-variant);
    }

    .top-bar__back {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--color-on-surface);
      cursor: default;
      flex-shrink: 0;
    }

    .top-bar__title {
      font-family: var(--font-brand);
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      color: var(--color-on-surface);
      padding-left: var(--sp-1);
    }

    /* ── Scroll area ─────────────────────────────────────────────── */
    .screen-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 var(--sp-4) var(--sp-4);
    }

    /* ── Section header skeleton ─────────────────────────────────── */
    .section-header-sk {
      height: 16px;
      width: 140px;
      margin: var(--sp-4) 0 var(--sp-3) 0;
    }

    /* ── Form card skeleton ──────────────────────────────────────── */
    .card-sk {
      background-color: var(--color-surface-container);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      margin-bottom: var(--sp-3);
    }

    .form-label-sk {
      height: 12px;
      width: 60px;
      margin-bottom: var(--sp-1);
    }

    .form-field-sk {
      height: 48px;
      width: 100%;
      margin-bottom: var(--sp-4);
      border-radius: var(--radius-sm);
    }

    .form-btn-sk {
      height: 40px;
      width: 100%;
      border-radius: var(--radius-full);
    }

    /* ── Budget card skeleton ─────────────────────────────────────── */
    .budget-card-sk {
      background-color: var(--color-surface-container);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      margin-bottom: var(--sp-3);
    }

    .budget-header-sk {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--sp-2);
    }

    .budget-cat-sk {
      height: 16px;
      width: 100px;
    }

    .budget-remaining-sk {
      height: 14px;
      width: 70px;
    }

    .budget-amounts-sk {
      height: 12px;
      width: 120px;
      margin-bottom: var(--sp-2);
    }

    .budget-progress-sk {
      height: 8px;
      width: 100%;
      margin-bottom: var(--sp-3);
      border-radius: var(--radius-full);
    }

    .budget-actions-sk {
      display: flex;
      gap: var(--sp-2);
    }

    .budget-action-btn-sk {
      height: 36px;
      width: 110px;
      border-radius: var(--radius-full);
    }

    /* ── Material icons ──────────────────────────────────────────── */
    .msr {
      font-family: 'Material Symbols Rounded';
      font-weight: 400;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Bottom navigation ───────────────────────────────────────── */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 10;
      background-color: var(--color-surface-container);
      display: flex;
      height: 80px;
      border-top: 1px solid var(--color-outline-variant);
    }

    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      border: none;
      background: transparent;
      cursor: pointer;
      padding: var(--sp-2) var(--sp-1);
      text-decoration: none;
      color: var(--color-on-surface-variant);
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-nav__indicator {
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav__icon { font-size: 24px; }

    .bottom-nav__label {
      font-family: var(--font-brand);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ──────────────────────────────────────────────── -->
  <header class="top-bar" role="banner">
    <div class="top-bar__back" aria-hidden="true">
      <span class="msr">arrow_back</span>

    <h1 class="top-bar__title">Budgets</h1>

  <!-- ── Loading skeleton ────────────────────────────────────────── -->
  <main

    <!-- Form card skeleton -->
    <span class="sk section-header-sk" aria-hidden="true"></span>
    <div class="card-sk" aria-hidden="true">
      <span class="sk form-label-sk"></span>
      <span class="sk form-field-sk"></span>
      <span class="sk form-label-sk"></span>
      <span class="sk form-field-sk"></span>
      <span class="sk form-btn-sk"></span>

        <span class="sk budget-remaining-sk" style="width: 80px;"></span>

        <span class="sk budget-remaining-sk" style="width: 75px;"></span>

      <div class="budget-actions-sk">

      </div>
    </div>

    <!-- Screen-reader announcement -->
    <p class="sr-only" role="status" aria-live="polite" aria-atomic="true">
      Loading budgets

  </main>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">

</body>
