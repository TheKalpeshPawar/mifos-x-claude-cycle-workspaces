<!doctype html>
<!-- render-hash: c7f3b1e9d4a2 -->
<!-- nav-update: Home·Accounts·Transactions·More (Consents removed 2026-06-30) -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgets — empty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens — ALL hex values confined here ───────────── */
    :root {
      --color-primary:                  #266489;
      --color-on-primary:               #FFFFFF;
      --color-primary-container:        #C9E6FF;
      --color-on-primary-container:     #004B6F;
      --color-secondary:                #50606E;
      --color-on-secondary:             #FFFFFF;
      --color-secondary-container:      #D3E5F5;
      --color-on-secondary-container:   #384956;
      --color-tertiary:                 #64597B;
      --color-error:                    #BA1A1A;
      --color-on-error:                 #FFFFFF;
      --color-background:               #F7F9FF;
      --color-on-background:            #181C20;
      --color-surface:                  #F7F9FF;
      --color-on-surface:               #181C20;
      --color-surface-variant:          #DDE3EA;
      --color-on-surface-variant:       #41474D;
      --color-outline:                  #72787E;
      --color-outline-variant:          #C1C7CE;
      --color-surface-container-lowest: #FFFFFF;
      --color-surface-container-low:    #F1F4F9;
      --color-surface-container:        #EBEEF3;
      --color-surface-container-high:   #E5E8ED;
      --color-surface-container-highest:#E0E3E8;
      --color-inverse-surface:          #2D3135;
      --color-inverse-on-surface:       #EEF1F6;
      --color-inverse-primary:          #95CDF7;

      --font-brand: 'Roboto', sans-serif;
      --font-mono:  'Roboto Mono', monospace;

      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-12: 48px;

      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-full: 9999px;

      --dur-short: 150ms;
      --ease-emp:  cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    [data-theme="dark"] {
      --color-primary:                  #95CDF7;
      --color-on-primary:               #00344E;
      --color-primary-container:        #004B6F;
      --color-on-primary-container:     #C9E6FF;
      --color-secondary:                #B7C9D9;
      --color-on-secondary:             #22323F;
      --color-secondary-container:      #384956;
      --color-on-secondary-container:   #D3E5F5;
      --color-tertiary:                 #CFC0E8;
      --color-error:                    #FFB4AB;
      --color-on-error:                 #690005;
      --color-background:               #101417;
      --color-on-background:            #E0E3E8;
      --color-surface:                  #101417;
      --color-on-surface:               #E0E3E8;
      --color-surface-variant:          #41474D;
      --color-on-surface-variant:       #C1C7CE;
      --color-outline:                  #8B9198;
      --color-outline-variant:          #41474D;
      --color-surface-container-lowest: #0B0F12;
      --color-surface-container-low:    #181C20;
      --color-surface-container:        #1C2024;
      --color-surface-container-high:   #262A2E;
      --color-surface-container-highest:#313539;
      --color-inverse-surface:          #E0E3E8;
      --color-inverse-on-surface:       #2D3135;
      --color-inverse-primary:          #266489;
    }

    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-brand);
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
      background-color: var(--color-background);
      color: var(--color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin: 0 auto;
    }

    /* ── Top App Bar ─────────────────────────────────────────────── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: var(--color-surface-container);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--sp-1);
      border-bottom: 1px solid var(--color-outline-variant);
    }

    .top-bar__back {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--color-on-surface);
      cursor: pointer;
      flex-shrink: 0;
    }

    .top-bar__back:hover {
      background-color: color-mix(in srgb, var(--color-on-surface) 8%, transparent);
    }

    .top-bar__title {
      font-family: var(--font-brand);
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      color: var(--color-on-surface);
      padding-left: var(--sp-1);
    }

    /* ── Scroll area ─────────────────────────────────────────────── */
    .screen-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 var(--sp-4) var(--sp-4);
    }

    /* ── Section header ──────────────────────────────────────────── */
    .section-header {
      font-family: var(--font-brand);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: var(--color-on-surface-variant);
      padding: var(--sp-4) 0 var(--sp-2) 0;
    }

    /* ── Card ────────────────────────────────────────────────────── */
    .card {
      background-color: var(--color-surface-container);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      margin-bottom: var(--sp-3);
    }

    /* ── Form group ──────────────────────────────────────────────── */
    .form-group { margin-bottom: var(--sp-4); }

    .form-label {
      display: block;
      font-family: var(--font-brand);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: var(--color-on-surface-variant);
      margin-bottom: var(--sp-1);
    }

    .form-select,
    .form-input {
      width: 100%;
      background-color: var(--color-surface-container-high);
      color: var(--color-on-surface);
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-sm);
      padding: 12px var(--sp-4);
      font-family: var(--font-brand);
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
      -webkit-appearance: none;
      appearance: none;
      min-height: 48px;
      transition: border-color var(--dur-short) var(--ease-emp);
    }

    .form-select:focus, .form-input:focus {
      outline: 2px solid var(--color-primary);
      outline-offset: 0;
      border-color: var(--color-primary);
    }

    .form-select-wrapper { position: relative; }

    .dropdown-icon {
      position: absolute;
      right: var(--sp-3);
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--color-on-surface-variant);
    }

    .btn-filled {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 40px;
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-brand);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
      padding: 0 var(--sp-6);
      transition: opacity var(--dur-short) var(--ease-emp);
    }

    .btn-filled:hover  { opacity: 0.92; }
    .btn-filled:active { opacity: 0.84; }

    /* ── Empty state ─────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-12) var(--sp-6);
      text-align: center;
      gap: var(--sp-3);
    }

    .empty-state__icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background-color: var(--color-surface-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--sp-2);
    }

    .empty-state__icon {
      font-size: 40px;
      color: var(--color-on-surface-variant);
    }

    .empty-state__title {
      font-family: var(--font-brand);
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--color-on-surface);
    }

    .empty-state__body {
      font-family: var(--font-brand);
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      color: var(--color-on-surface-variant);
      max-width: 280px;
    }

    /* ── Material icons ──────────────────────────────────────────── */
    .msr {
      font-family: 'Material Symbols Rounded';
      font-weight: 400;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Bottom navigation ───────────────────────────────────────── */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 10;
      background-color: var(--color-surface-container);
      display: flex;
      height: 80px;
      border-top: 1px solid var(--color-outline-variant);
    }

    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      border: none;
      background: transparent;
      cursor: pointer;
      padding: var(--sp-2) var(--sp-1);
      text-decoration: none;
      color: var(--color-on-surface-variant);
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-nav__indicator {
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav__icon { font-size: 24px; }

    .bottom-nav__label {
      font-family: var(--font-brand);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ──────────────────────────────────────────────── -->
  <header class="top-bar" role="banner">
    <button
      class="top-bar__back"
      aria-label="Navigate back"
      data-action="navigate_back"
    >
      <span class="msr" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-bar__title">Budgets</h1>
  </header>

  <!-- ── Screen content ──────────────────────────────────────────── -->
  <main class="screen-scroll" role="main">

    <!-- Set Monthly Budget form — visible in empty state -->
    <h2 class="section-header" id="set_budget_header">Set Monthly Budget</h2>

    <div class="card" id="set_budget_card" aria-labelledby="set_budget_header">

      <div class="form-group">
        <label class="form-label" for="budget_category_dropdown">Category</label>
        <div class="form-select-wrapper">
          <select
            class="form-select"
            id="budget_category_dropdown"
            aria-label="Select spending category for budget"
            data-action="select_budget_category"
          >
            <option value="Groceries" selected>Groceries</option>
            <option value="Transport">Transport</option>
            <option value="Dining">Dining</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Subscriptions">Subscriptions</option>
            <option value="Income">Income</option>
          </select>
          <span class="msr dropdown-icon" aria-hidden="true">expand_more</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="budget_amount_field">Monthly limit (£)</label>
        <input
          class="form-input"
          id="budget_amount_field"
          type="number"
          step="0.01"
          min="0.01"
          placeholder="e.g. 200.00"
          aria-label="Enter monthly budget limit in GBP"
          data-action="update_budget_amount_field"
        >
      </div>

      <button
        class="btn-filled"
        id="save_budget_button"
        aria-label="Save the budget for the selected category"
        data-action="save_budget"
      >
        Save Budget
      </button>
    </div>

    <!-- Empty state — no budgets set yet -->
    <div
      id="empty_state"
      class="empty-state"
      role="region"
      aria-label="No budgets set yet"
    >
      <div class="empty-state__icon-wrap" aria-hidden="true">
        <span class="msr empty-state__icon">savings</span>
      </div>
      <h2 class="empty-state__title">No budgets set</h2>
      <p class="empty-state__body">
        Set a monthly spending limit per category to track how you're doing.
      </p>
    </div>

  </main>

  <!-- ── Bottom Navigation — Home · Accounts · Transactions · More ── -->
  <!-- budgets is a pushed sub-screen; no tab is active                -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <a
      class="bottom-nav__item"
      href="#"
      aria-label="Home"
      data-nav-to="home"
      data-nav-type="tab"
    >
      <div class="bottom-nav__indicator">
        <span class="msr bottom-nav__icon" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a
      class="bottom-nav__item"
      href="#"
      aria-label="Accounts"
      data-nav-to="accounts"
      data-nav-type="tab"
    >
      <div class="bottom-nav__indicator">
        <span class="msr bottom-nav__icon" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </a>
    <a
      class="bottom-nav__item"
      href="#"
      aria-label="Transactions"
      data-nav-to="transactions"
      data-nav-type="tab"
    >
      <div class="bottom-nav__indicator">
        <span class="msr bottom-nav__icon" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav__label">Transactions</span>
    </a>
    <a
      class="bottom-nav__item"
      href="#"
      aria-label="More"
      data-nav-to="settings"
      data-nav-type="tab"
    >
      <div class="bottom-nav__indicator">
        <span class="msr bottom-nav__icon" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav__label">More</span>
    </a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
