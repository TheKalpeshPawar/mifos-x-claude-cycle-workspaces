screen_id: budgets
archetype: dashboard
name: "Budgets"
status: enriched
initial_state: loading
quality_score: 95

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.budgets.screen_title}"
  top_app_bar_leading: back
  fab_visible: false

business_logic:
  kind: calculation
  description: "Per-category monthly budget tracker persisting limits via kotlinx-serialization to DataStore. BudgetViewModel aggregates current-month AIS debits per category using kotlinx-datetime, computing used/limit fraction clamped to 1.0 and progress_color as error when over budget. Form validates amount is numeric and positive; duplicate category overwrites the existing limit. Users may delete a budget entry; deletion persists immediately to DataStore and refreshes the list."
  external_library_refs:
    - "kotlinx-serialization"
    - "kotlinx-datetime"
  description_author: claude
  description_authored_at: "2026-06-29T12:00:00Z"

states: [loading, content, empty, error]

components:
  # ── Loading state ──────────────────────────────────────────────────────────
  - type: skeleton
    id: budgets_skeleton
    state_binding: [loading]
    accessibility_label: "{strings.budgets.loading_a11y}"
    test_context:
      purpose: "Skeleton placeholder while budgets and transaction cache load from DataStore"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Error state ────────────────────────────────────────────────────────────
  - type: error_state
    id: budgets_error
    state_binding: [error]
    title: "{strings.budgets.error_title}"
    message: "{strings.budgets.error_message}"
    retryable: true
    accessibility_label: "{strings.budgets.error_title}"
    test_context:
      purpose: "Error state when DataStore read fails on mount; retry button triggers budgets_load again"
      required_fields: []
      interaction_type: display
      data_driven: false
    children:
      - type: button
        id: retry_load_button
        variant: tonal
        label: "{strings.budgets.retry_button}"
        accessibility_label: "{strings.budgets.retry_button}"
        test_context:
          purpose: "Retry loading budgets after error; triggers budgets_load action"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: retry_load
          action_contract:
            effect: transform_state
            external_library_refs: [kotlinx-coroutines]
            description: "Re-runs budgets_load from loading state: reads BudgetEntry records from DataStore and recomputes per-category used/limit fractions against the in-memory AIS transaction cache."

  # ── Set budget form ────────────────────────────────────────────────────────
  - type: section_header
    id: set_budget_header
    state_binding: [content, empty]
    label: "{strings.budgets.set_budget_header}"
    test_context:
      purpose: "Section label for budget creation form; visible in both content and empty states"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: card
    id: set_budget_card
    state_binding: [content, empty]
    elevation: 1
    test_context:
      purpose: "Budget creation form card; verify form accessible in both content and empty states"
      required_fields: []
      interaction_type: display
      data_driven: false
    children:
      - type: select
        id: budget_category_dropdown
        label: "{strings.budgets.category_label}"
        options:
          - "Groceries"
          - "Transport"
          - "Dining"
          - "Bills"
          - "Shopping"
          - "Subscriptions"
          - "Income"
        value: "{form.category}"
        accessibility_label: "{strings.budgets.a11y_category_dropdown}"
        test_context:
          purpose: "Category picker for budget; verify options match known categories and value binds to form"
          required_fields: [form.category]
          interaction_type: input
          data_driven: true
        on_click:
          action: select_budget_category
          action_contract:
            effect: transform_state
            external_library_refs: [kotlinx-coroutines]
            description: "Updates form.category with the selected category string from the dropdown options list and re-evaluates the save-enabled state of the form."

      - type: text_field
        id: budget_amount_field
        label: "{strings.budgets.amount_label}"
        value: "{form.amount}"
        keyboard_type: decimal
        placeholder: "{strings.budgets.amount_placeholder}"
        accessibility_label: "{strings.budgets.a11y_amount_field}"
        test_context:
          purpose: "Numeric GBP input for monthly budget limit; verify validation rejects non-numeric and zero"
          required_fields: [form.amount]
          interaction_type: input
          data_driven: true
        validation:
          required: true
          type: numeric
          min: 0.01
          error_messages:
            required: "{strings.budgets.validation_amount_required}"
            numeric: "{strings.budgets.validation_amount_numeric}"
            min: "{strings.budgets.validation_amount_min}"
        on_click:
          action: update_budget_amount_field
          action_contract:
            effect: transform_state
            external_library_refs: [kotlinx-coroutines]
            description: "Updates form.amount with the current text field value and triggers inline validation (numeric, min 0.01); sets field-level error message if validation fails."

      - type: button
        id: save_budget_button
        variant: filled
        label: "{strings.budgets.save_button}"
        accessibility_label: "{strings.budgets.a11y_save_button}"
        test_context:
          purpose: "Submit budget form; verify disabled until valid category + amount; overwrites duplicate category"
          required_fields: [form.category, form.amount]
          interaction_type: action
          data_driven: true
        on_click:
          action: save_budget
          action_contract:
            effect: persist_db
            external_library_refs: [androidx.datastore, kotlinx-serialization]
            description: "Validates form fields then upserts a BudgetEntry keyed by category into DataStore Preferences; overwrites an existing entry for the same category and resets the form on success."

  # ── Storage transparency (CC1 — RULE-IDEA-CAPABILITY-COMPLETENESS-001) ────
  - type: text
    id: budgets_storage_hint
    state_binding: [content, empty]
    value: "{strings.budgets.storage_hint}"
    style: bodySmall
    color: onSurfaceVariant
    accessibility_label: "{strings.budgets.storage_hint}"
    test_context:
      purpose: "Informs user that budget limits persist locally on device only — addresses CC1 storage_location transparency"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Existing budgets ───────────────────────────────────────────────────────
  - type: section_header
    id: budgets_header
    state_binding: [content]
    label: "{current_month_label}"
    test_context:
      purpose: "Period label for active budget list; reflects current month/year from ViewModel (e.g. June 2026)"
      required_fields: [current_month_label]
      interaction_type: display
      data_driven: true

  - type: list
    id: budgets_list
    state_binding: [content]
    items_source: "{budgets}"
    test_context:
      purpose: "List of budget cards with progress; verify each card shows used/limit and correct color"
      required_fields: [budgets]
      interaction_type: display
      data_driven: true
    children:
      - type: card
        id: budget_card
        elevation: 1
        test_context:
          purpose: "Individual budget card; verify progress bar color is error when over budget"
          required_fields: [item.category, item.used, item.limit, item.fraction]
          interaction_type: display
          data_driven: true
        children:
          - type: list_item
            id: budget_row_header
            label: "{item.category}"
            supporting_text: "£{item.used} of £{item.limit}"
            trailing_content: "{item.remaining_label}"
            accessibility_label: "{item.category}: spent £{item.used} of £{item.limit} budget"
            test_context:
              purpose: "Budget summary row; verify used/limit values computed from AIS transaction cache"
              required_fields: [item.category, item.used, item.limit, item.remaining_label]
              interaction_type: display
              data_driven: true

          - type: progress_linear
            id: budget_progress_bar
            value: "{item.fraction}"
            color: "{item.progress_color}"
            accessibility_label: "{item.category} budget: {item.percent_label} used"
            test_context:
              purpose: "Progress bar clamped 0–1; color switches to error at fraction >= 1.0"
              required_fields: [item.fraction, item.progress_color, item.percent_label]
              interaction_type: display
              data_driven: true

          - type: text
            id: over_budget_alert
            value: "{item.alert_text}"
            style: labelSmall
            color: "error"
            visibility: "{item.is_over_budget}"
            accessibility_label: "{item.category} is over budget"
            test_context:
              purpose: "Over-budget warning text; verify only visible when is_over_budget is true"
              required_fields: [item.is_over_budget, item.alert_text]
              interaction_type: display
              data_driven: true

          - type: row
            id: budget_card_actions
            test_context:
              purpose: "Action row for budget card — View Transactions and Delete"
              required_fields: []
              interaction_type: display
              data_driven: false
            children:
              - type: button
                id: view_category_spend_button
                variant: text
                label: "{strings.budgets.view_transactions}"
                accessibility_label: "{strings.budgets.a11y_view_transactions} {item.category}"
                test_context:
                  purpose: "Drills to spending-by-category screen filtered for this budget category"
                  required_fields: [item.category]
                  interaction_type: navigate
                  data_driven: true
                on_click:
                  action: navigate_spending_by_category
                  target: spending-by-category
                  params:
                    category: "{item.category}"
                  action_contract:
                    effect: navigate
                    description: "Navigates to the spending-by-category screen with the budget category pre-selected as a filter parameter to show contributing transactions."

              - type: button
                id: delete_budget_button
                variant: text
                label: "{strings.budgets.delete_button}"
                accessibility_label: "{strings.budgets.a11y_delete_budget} {item.category}"
                test_context:
                  purpose: "Deletes the budget for this category from DataStore; list refreshes immediately"
                  required_fields: [item.category]
                  interaction_type: action
                  data_driven: true
                on_click:
                  action: delete_budget
                  params:
                    category: "{item.category}"
                  action_contract:
                    effect: delete
                    external_library_refs: [androidx.datastore]
                    description: "Removes the BudgetEntry matching the given category from DataStore Preferences, refreshes the budget list, and transitions to empty state if no budgets remain."

  # ── Empty state ────────────────────────────────────────────────────────────
  - type: empty_state
    id: empty_state
    state_binding: [empty]
    icon: savings
    title: "{strings.budgets.empty_title}"
    body: "{strings.budgets.empty_body}"
    accessibility_label: "{strings.budgets.empty_a11y}"
    test_context:
      purpose: "Empty state when no budgets saved; verify budget form is still accessible above this"
      required_fields: []
      interaction_type: display
      data_driven: false

status_history:
  - from: draft
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"
  - from: enriched
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich (quality push — loading/error states, i18n, progress_linear, delete)"
