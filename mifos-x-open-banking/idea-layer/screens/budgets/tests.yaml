screen_id: budgets

scenarios:
  - id: TC-BUD-001
    description: "Loading state shown on mount"
    state: loading
    given: "Screen mounts; DataStore read in progress"
    when: "budgets_load trigger fires"
    then:
      - "Skeleton component visible"
      - "Budget form and list not yet rendered"

  - id: TC-BUD-002
    description: "Content state — budgets render with correct progress and colours"
    state: content
    given: "6 budgets in DataStore; June 2026 transaction cache loaded"
    when: "budgets_load completes successfully"
    then:
      - "Set budget form visible with Category dropdown and Amount field"
      - "6 budget cards rendered (Groceries, Dining, Transport, Bills, Shopping, Subscriptions)"
      - "Groceries shows £198.50 of £400.00 — progress ~50%, primary colour"
      - "Dining shows £168.00 of £150.00 — progress full, error colour, alert 'Over budget by £18.00'"
      - "Bills shows £197.40 of £220.00 — progress 90%, primary colour (near-limit warning not yet triggered)"
      - "Shopping shows £124.99 of £100.00 — progress full, error colour, alert 'Over budget by £24.99'"
      - "period label shows 'June 2026'"

  - id: TC-BUD-003
    description: "Empty state when no budgets set"
    state: empty
    given: "No budgets in DataStore"
    when: "budgets_load completes with empty list"
    then:
      - "Set budget form visible"
      - "Empty state renders with savings icon and title 'No budgets set'"
      - "Budget list not rendered"

  - id: TC-BUD-004
    description: "Error state when DataStore read fails on mount"
    state: error
    given: "DataStore throws IOException on read"
    when: "budgets_load triggers on_error"
    then:
      - "Error state rendered with title 'Couldn't load budgets'"
      - "Retry button visible"
      - "Budget list and form not rendered"

  - id: TC-BUD-005
    description: "Retry after error re-triggers budgets_load"
    state: error
    when: "User taps Retry"
    then:
      - "Screen transitions back to loading state"
      - "budgets_load fires again"
      - "On success: transitions to content or empty state"

  - id: TC-BUD-006
    description: "Saving budget with valid inputs adds a new entry"
    state: content
    given: "6 budgets in DataStore; user selects 'Income', enters '3500.00'"
    when: "User taps Save Budget"
    then:
      - "Form validates successfully"
      - "Budget persisted to DataStore"
      - "New budget card for Income appears in list"
      - "Form resets to default (Groceries selected, amount empty)"

  - id: TC-BUD-007
    description: "Saving a budget for an existing category overwrites the previous limit"
    state: content
    given: "Groceries budget exists at £400.00"
    when: "User selects 'Groceries', enters '350.00', taps Save Budget"
    then:
      - "Form validates successfully"
      - "Groceries budget updated to £350.00 limit in DataStore"
      - "Groceries card refreshes with new limit and recomputed fraction"
      - "Total budget count unchanged"

  - id: TC-BUD-008
    description: "Deleting a budget removes it from the list"
    state: content
    given: "6 budgets in DataStore"
    when: "User taps Delete on the Subscriptions budget card"
    then:
      - "Subscriptions card removed from list"
      - "DataStore updated; 5 budget entries remain"

  - id: TC-BUD-009
    description: "Deleting last budget transitions to empty state"
    state: content
    given: "1 budget (Groceries) in DataStore"
    when: "User taps Delete on the Groceries budget card"
    then:
      - "List empties; screen transitions to empty state"
      - "Empty state rendered with budget form above"

  - id: TC-BUD-010
    description: "Amount field validation — empty amount shows required error"
    state: content
    when: "User taps Save Budget with empty amount field"
    then:
      - "Amount field shows error 'Amount is required'"
      - "No budget persisted"

  - id: TC-BUD-011
    description: "Amount field validation — non-numeric value shows error"
    state: content
    when: "User enters 'abc' in the amount field and taps Save Budget"
    then:
      - "Amount field shows error 'Enter a valid amount'"
      - "No budget persisted"

  - id: TC-BUD-012
    description: "Amount field validation — zero or negative value shows error"
    state: content
    when: "User enters '0' in the amount field and taps Save Budget"
    then:
      - "Amount field shows error 'Budget must be greater than £0'"
      - "No budget persisted"
