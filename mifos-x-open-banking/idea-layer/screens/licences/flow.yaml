feature: licences
flow_ref: settings-and-profile

entry_points:
  - source: settings
    label: "About section -> 'Licences' row"
    source_binding: "settingsScreen(onNavigateToLicences = { navController.navigate(LicencesRoute) })"

transitions:
  - from: licences
    to: settings
    trigger: "Back navigation (top app bar leading icon)"
    source_binding: "licencesScreen(onBack = { navController.popBackStack() })"
