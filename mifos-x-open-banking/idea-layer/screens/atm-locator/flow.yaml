feature: atm-locator
flow_ref: account-browsing
phase_assignment: P2

# atm-locator is a utility screen reached from account-detail within the
# account-browsing flow. The user taps "Nearby ATMs" on an account's detail
# screen to find branches and ATMs relevant to that account.
# Phase P2 (milestone 0.3.0 — Statements, product, party & extras).

entry_points:
  - source: account-detail
    label: "Nearby ATMs chip on account detail screen — Find ATM action"
    trigger: tap_atm_locator

transitions:
  - from: atm-locator
    to: account-detail
    trigger: "Back navigation"
  - from: atm-locator
    to: "{external:maps_app}"
    trigger: "open_atm_directions — OS geo:/maps:// deep-link intent; leaves app"
    note: "Not a back-stack transition; opens external Maps/Directions app."
