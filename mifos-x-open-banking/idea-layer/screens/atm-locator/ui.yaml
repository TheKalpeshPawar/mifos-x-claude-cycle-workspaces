id: atm-locator
name: "ATM & Branch Locator"
feature: atm-locator
flavor: consumer
status: approved
quality_score: 93
contract_version: "1.1.0"
approve_hash: "sha256:0eaf12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []

screens:
  - id: atm_locator_main
    name: "ATM & Branch Locator"
    archetype: index_list
    route: /atm-locator

archetype: index_list

components:
  - type: text
    id: atm_locator_title
    content: "ATM & Branches"
    style:
      typography: headline_large
      color: "#4C662B"
      padding_top: 24
      padding_horizontal: 16
    a11y:
      role: heading
      level: 1
      label: "ATM and Branches screen"
    test_context:
      test_id: atm_locator_title
      assert: text_visible

  - type: input
    id: location_search_input
    label: "Search location"
    content: ""
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: search
      placeholder: "Enter city, postcode or address..."
      background: "#F9FAEF"
      border_radius: 28
      padding_horizontal: 16
      padding_vertical: 12
      margin_horizontal: 16
      margin_top: 12
      icon_leading: "search"
    on_click:
      action: search_location
      target: atm_locator_main
    a11y:
      role: searchbox
      label_source: visible_label
      label: "Search for ATMs and branches by location"
      hint: "Enter city, postcode or address"
    keyboard:
      focusable: true
    test_context:
      test_id: location_search_input
      assert: input_focusable

  - type: box
    id: location_permission_banner
    content: "Use my location for nearby ATMs"
    style:
      background: "#DCE7C8"
      border_color: "#4C662B"
      border_width: 1
      border_radius: 8
      padding: 12
      margin_horizontal: 16
      margin_top: 8
      direction: row
      align_items: center
      conditional: location_not_granted
    a11y:
      role: region
      label: "Location permission request banner"
    test_context:
      test_id: location_permission_banner
      assert: visible_when_location_denied

  - type: button
    id: enable_location_button
    label: "Enable"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: text
      color: "#4C662B"
      typography: label_medium
      padding_horizontal: 8
    on_click:
      action: request_location_permission
      target: atm_locator_main
    a11y:
      role: button
      label: "Enable location access to find nearby ATMs"
    keyboard:
      focusable: true
    test_context:
      test_id: enable_location_button
      assert: triggers_permission_request

  - type: image
    id: atm_map_area
    content: "Map loading..."
    style:
      background: "#E1E4D5"
      height: 240
      margin_horizontal: 16
      margin_top: 12
      border_radius: 12
      object_fit: cover
    a11y:
      role: img
      label: "ATM map showing nearby locations"
      alt: "ATM map showing nearby locations"
    test_context:
      test_id: atm_map_area
      assert: map_renders_when_content

  - type: stack
    id: filter_chips_row
    style:
      direction: horizontal
      spacing: 8
      padding_horizontal: 16
      padding_vertical: 12
      overflow_x: scroll
    a11y:
      role: group
      label: "Filter ATMs and branches by type"
    test_context:
      test_id: filter_chips_row
      assert: all_chips_visible

  - type: input
    id: filter_all
    label: "All"
    content: "all"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: radio
      chip_style: true
      selected: true
      background_selected: "#4C662B"
      color_selected: "#FFFFFF"
      border_radius: 16
      padding_horizontal: 16
      padding_vertical: 8
    on_click:
      action: filter_type
      target: atm_locator_main
    a11y:
      role: radio
      label_source: visible_label
      label: "Show all ATMs and branches"
    keyboard:
      focusable: true
    test_context:
      test_id: filter_all
      assert: default_selected

  - type: input
    id: filter_atms
    label: "ATMs"
    content: "atm"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: radio
      chip_style: true
      border_radius: 16
      padding_horizontal: 16
      padding_vertical: 8
    on_click:
      action: filter_type
      target: atm_locator_main
    a11y:
      role: radio
      label_source: visible_label
      label: "Show ATMs only"
    keyboard:
      focusable: true
    test_context:
      test_id: filter_atms
      assert: filters_to_atm_type

  - type: input
    id: filter_branches
    label: "Branches"
    content: "branch"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: radio
      chip_style: true
      border_radius: 16
      padding_horizontal: 16
      padding_vertical: 8
    on_click:
      action: filter_type
      target: atm_locator_main
    a11y:
      role: radio
      label_source: visible_label
      label: "Show branches only"
    keyboard:
      focusable: true
    test_context:
      test_id: filter_branches
      assert: filters_to_branch_type

  - type: input
    id: filter_24_7
    label: "24/7"
    content: "24_7"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: radio
      chip_style: true
      border_radius: 16
      padding_horizontal: 16
      padding_vertical: 8
    on_click:
      action: filter_type
      target: atm_locator_main
    a11y:
      role: radio
      label_source: visible_label
      label: "Show 24/7 locations only"
    keyboard:
      focusable: true
    test_context:
      test_id: filter_24_7
      assert: filters_to_24_7

  - type: text
    id: nearby_results_header
    content: "3 ATMs found within 500m"
    style:
      typography: title_medium
      color: "#1A1C16"
      padding_horizontal: 16
      padding_top: 8
      padding_bottom: 4
    a11y:
      role: heading
      level: 2
      label: "Nearby results: 3 ATMs found within 500 metres"
    test_context:
      test_id: nearby_results_header
      assert: count_updates_on_filter

  - type: box
    id: atm_result_oxford_street
    content: ""
    style:
      background: "#FFFFFF"
      border_radius: 12
      elevation: 2
      padding: 16
      margin_horizontal: 16
      margin_bottom: 8
    on_click:
      action: view_atm_detail
      target: atm_locator_main
    a11y:
      role: listitem
      label: "Mifos ATM Oxford Street, 0.2 kilometres away, Open 24/7"
    keyboard:
      focusable: true
    test_context:
      test_id: atm_result_oxford_street
      assert: navigates_to_detail_on_tap

  - type: text
    id: atm_oxford_name
    content: "Mifos ATM — Oxford Street"
    style:
      typography: title_small
      color: "#1A1C16"
      font_weight: 600
    a11y:
      role: text
      label: "Mifos ATM Oxford Street"
    test_context:
      test_id: atm_oxford_name
      assert: text_visible

  - type: text
    id: atm_oxford_distance
    content: "0.2km away"
    style:
      typography: body_small
      color: "#44483D"
    a11y:
      role: text
      label: "0.2 kilometres away"
    test_context:
      test_id: atm_oxford_distance
      assert: text_visible

  - type: text
    id: atm_oxford_hours
    content: "Open 24/7"
    style:
      typography: body_small
      color: "#4C662B"
      font_weight: 500
    a11y:
      role: text
      label: "Open 24 hours, 7 days a week"
    test_context:
      test_id: atm_oxford_hours
      assert: text_visible

  - type: text
    id: atm_oxford_limit
    content: "£300 max withdrawal"
    style:
      typography: body_small
      color: "#44483D"
    a11y:
      role: text
      label: "Maximum withdrawal limit £300"
    test_context:
      test_id: atm_oxford_limit
      assert: text_visible

  - type: link
    id: atm_oxford_directions
    label: "Get Directions"
    content: ""
    style:
      color: "#4C662B"
      typography: label_medium
      icon_trailing: "directions"
    on_click:
      action: open_directions
      target: atm_locator_main
    a11y:
      role: link
      label: "Get directions to Mifos ATM Oxford Street"
    keyboard:
      focusable: true
    test_context:
      test_id: atm_oxford_directions
      assert: opens_maps_app

  - type: box
    id: atm_result_bond_street
    content: ""
    style:
      background: "#FFFFFF"
      border_radius: 12
      elevation: 2
      padding: 16
      margin_horizontal: 16
      margin_bottom: 8
    on_click:
      action: view_atm_detail
      target: atm_locator_main
    a11y:
      role: listitem
      label: "Mifos ATM Bond Street Station, 0.5 kilometres away, Open 24/7"
    keyboard:
      focusable: true
    test_context:
      test_id: atm_result_bond_street
      assert: navigates_to_detail_on_tap

  - type: text
    id: atm_bond_name
    content: "Mifos ATM — Bond Street Station"
    style:
      typography: title_small
      color: "#1A1C16"
      font_weight: 600
    a11y:
      role: text
      label: "Mifos ATM Bond Street Station"
    test_context:
      test_id: atm_bond_name
      assert: text_visible

  - type: text
    id: atm_bond_distance
    content: "0.5km away"
    style:
      typography: body_small
      color: "#44483D"
    a11y:
      role: text
      label: "0.5 kilometres away"
    test_context:
      test_id: atm_bond_distance
      assert: text_visible

  - type: text
    id: atm_bond_hours
    content: "Open 24/7"
    style:
      typography: body_small
      color: "#4C662B"
      font_weight: 500
    a11y:
      role: text
      label: "Open 24 hours, 7 days a week"
    test_context:
      test_id: atm_bond_hours
      assert: text_visible

  - type: link
    id: atm_bond_directions
    label: "Get Directions"
    content: ""
    style:
      color: "#4C662B"
      typography: label_medium
      icon_trailing: "directions"
    on_click:
      action: open_directions
