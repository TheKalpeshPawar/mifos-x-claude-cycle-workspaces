screen_id: atm-locator
archetype: index_list
name: "{strings.atm_locator_title}"
status: enriched
quality_score: 95
initial_state: loading

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.atm_locator_title}"
  top_app_bar_leading: back
  fab_visible: false

business_logic:
  kind: crud
  description: "Calls HSBC Open Data GET /atms (unauthenticated, Ktorfit, 15s timeout). ViewModel stores full ATM list in allAtms, applies three client-side predicates in composition: text search on Name + PostCode, service flags (is24h / hasWheelchairAccess / hasCashDeposit toggled by filter chips), and distance sort via GPS expect/actual with postcode-centroid fallback. The resulting filteredAtms stream drives the list. Card tap emits geo:/maps:// deep-link for directions. No OBIE consent scope or FAPI auth flow involved."
  external_library_refs:
    - "hsbc-open-data:atms"
    - "ktorfit"
  description_author: claude
  description_authored_at: "2026-06-29T12:00:00Z"

state_model:
  AtmLocatorViewModel:
    state:
      name: AtmLocatorState
      fields:
        - name: allAtms
          type: "List<AtmDisplayItem>"
        - name: filteredAtms
          type: "List<AtmDisplayItem>"
        - name: filterState
          type: AtmFilterState        # is24h: Boolean, hasWheelchairAccess: Boolean, hasCashDeposit: Boolean
        - name: searchQuery
          type: String
    screen_state:
      sealed_class: AtmLocatorUiState
      members:
        - Loading
        - Content              # filteredAtms: List<AtmDisplayItem>
        - Empty
        - Error                # message: String
    errors:
      types:
        - NetworkError         # IOException / SocketTimeoutException — HSBC Open Data unreachable
        - HttpServerError      # HTTP 5xx — HSBC Open Data service unavailable
    actions:
      members:
        - atmsLoad               # suspend; GET /atms (HSBC Open Data, unauthenticated, 15s timeout)
        - searchAtms             # fun(query: String); client-side filter on Name + PostCode; no API call
        - toggleFilter24h        # fun(); toggles is24h in filterState; re-applies predicates
        - toggleFilterWheelchair # fun(); toggles hasWheelchairAccess in filterState
        - toggleFilterDeposit    # fun(); toggles hasCashDeposit in filterState
        - openAtmDirections      # fun(atm: AtmDisplayItem); fires geo:/maps:// deep-link; no VM state change
        - retryLoad              # suspend; resets filterState to default, delegates to atmsLoad
    di:
      - AtmRepository            # KtorfitAtmService → HSBC Open Data /atms; unauthenticated
      - GpsDistanceCalculator    # expect/actual — GPS distance + postcode centroid fallback

dependencies:
  tier: 0
  features: []
  libraries:
    - id: ktorfit
      purpose: "Suspend-function HTTP client targeting HSBC Open Data /atms endpoint (no auth)"
    - id: kotlinx-serialization
      purpose: "OBReadATMResponse1 JSON deserialization"
    - id: gps-expect-actual
      purpose: "Platform-native geo: intent for directions and GPS-based distance calculation"

screens:
  - id: atm-locator
    name: "{strings.atm_locator_title}"
    viewmodel: AtmLocatorViewModel

i18n_coverage: true

