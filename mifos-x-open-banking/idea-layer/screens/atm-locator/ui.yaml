responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      show_components:
        - atm_locator_title
        - location_search_input
        - filter_chips_row
        - filter_all
        - filter_atms
        - filter_branches
        - filter_24_7
      skeleton_components:
        - atm_map_area
        - nearby_results_header
        - atm_result_oxford_street
        - atm_result_bond_street
        - atm_result_mayfair_branch
      hide_components:
        - location_permission_banner
        - enable_location_button
  content:
    layout:
      show_components:
        - atm_locator_title
        - location_search_input
        - atm_map_area
        - filter_chips_row
        - filter_all
        - filter_atms
        - filter_branches
        - filter_24_7
        - nearby_results_header
        - atm_result_oxford_street
        - atm_oxford_name
        - atm_oxford_distance
        - atm_oxford_hours
        - atm_oxford_limit
        - atm_oxford_directions
        - atm_result_bond_street
        - atm_bond_name
        - atm_bond_distance
        - atm_bond_hours
        - atm_bond_directions
        - atm_result_mayfair_branch
        - branch_mayfair_name
        - branch_mayfair_distance
        - branch_mayfair_hours
        - branch_mayfair_services
        - branch_mayfair_directions
        - results_divider
      hide_components:
        - location_permission_banner
        - enable_location_button
  error:
    layout:
      show_components:
        - atm_locator_title
        - location_search_input
      hide_components:
        - atm_map_area
        - nearby_results_header
        - atm_result_oxford_street
        - atm_result_bond_street
        - atm_result_mayfair_branch
      error_message: "Unable to load ATMs. Check your connection and try again."
  empty:
    layout:
      show_components:
        - atm_locator_title
        - location_search_input
        - filter_chips_row
      hide_components:
        - atm_map_area
        - nearby_results_header
        - atm_result_oxford_street
        - atm_result_bond_street
        - atm_result_mayfair_branch
      empty_message: "No ATMs or branches found in this area"
  location_denied:
    layout:
      show_components:
        - atm_locator_title
        - location_search_input
        - location_permission_banner
        - enable_location_button
        - filter_chips_row
      hide_components:
        - atm_map_area

state_model:
  view_model: AtmLocatorViewModel
  state_fields:
    - name: atmList
      type: "List<AtmLocation>"
      default: "emptyList()"
    - name: searchQuery
      type: String
      default: '""'
    - name: selectedFilter
      type: AtmFilter
      default: "AtmFilter.ALL"
    - name: userLocation
      type: "LatLng?"
      default: "null"
    - name: locationPermissionGranted
      type: Boolean
      default: "false"
    - name: isLoading
      type: Boolean
      default: "true"
    - name: resultCount
      type: Int
      default: "0"
  errors:
    - name: networkError
      type: "String?"
      default: "null"
    - name: locationError
      type: "String?"
      default: "null"
  events:
    - SearchLocationEvent
    - FilterChangedEvent
    - RequestLocationPermissionEvent
    - AtmSelectedEvent
    - DirectionsRequestedEvent
  actions:
    - search_location
    - filter_type
    - request_location_permission
    - view_atm_detail
    - open_directions
  di:
    - AtmRepository
    - LocationService
    - NavigationService

api:
  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/atms"
    tag: ATM
    params:
      - latitude
      - longitude
      - limit: 10
    response:
      fields:
        - id: String
        - name: String
        - address: Address
        - location: LatLng
        - open_24_hours: Boolean
        - cash_withdrawal_national_amount: String
        - supported_languages: "List<String>"
        - services: "List<String>"
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"

  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/branches"
    tag: Branch
    params:
      - latitude
      - longitude
    response:
      fields:
        - id: String
        - name: String
        - address: Address
        - location: LatLng
        - lobby: LobbyHours
        - drive_up: DriveUpHours
        - branch_routings: "List<BranchRouting>"
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"

dependencies:
  tier: consumer
  features:
    - atm-locator
