sibling: api
schema_version: "4.0"
feature_id: atm-locator
api:
  - id: opendata_get_atms
    endpoint: "GET /open-banking/opendata/v2.4.0/atms"
    tag: ATM
    auth_required: false
    note: "OBIE Open Data ATM Locator (server/apis/open-data.yaml#get_atms). Unauthenticated — no OAuth2 token, no account-access consent, no scope. Returns every ATM per brand for the banking group; the response is a meta + data[].Brand[] envelope. ATMs are flattened across data[].Brand[].ATM[] and de-duplicated by Identification client-side; nearest-first sort and great-circle distance are computed on-device in AtmLocatorViewModel from ATM[].Location.PostalAddress.GeoLocation.GeographicCoordinates."
    demo_source: demo-data.yaml#/collections/opendata_atms
    response:
      fields:
        - meta.LastUpdated: String
        - meta.TotalResults: Integer
        - data[].Brand[].BrandName: String
        - data[].Brand[].ATM[].Identification: String
        - data[].Brand[].ATM[].SupportedLanguages: Array
        - data[].Brand[].ATM[].ATMServices: Array
        - data[].Brand[].ATM[].Accessibility: Array
        - data[].Brand[].ATM[].SupportedCurrencies: Array
        - data[].Brand[].ATM[].MinimumPossibleAmount: String
        - data[].Brand[].ATM[].Branch.Identification: String
        - data[].Brand[].ATM[].Location.PostalAddress: Object
        - data[].Brand[].ATM[].Location.PostalAddress.GeoLocation.GeographicCoordinates.Latitude: String
        - data[].Brand[].ATM[].Location.PostalAddress.GeoLocation.GeographicCoordinates.Longitude: String
    errors:
      - 400: "Bad Request"
      - 429: "TOO_MANY_REQUESTS — retryable"
      - 500: "Internal server error"

  - id: opendata_get_branches
    endpoint: "GET /open-banking/opendata/v2.4.0/branches"
    tag: Branch
    status: deferred
    auth_required: false
    note: "DEFERRED — UNUSED by shipped code. The locator feature is ATM-only; no BranchesApi or BranchRepository exists. OBIE Open Data Branch Locator (server/apis/open-data.yaml#get_branches); unauthenticated. Retained as a deferred marker only; data[].Brand[].Branch[] (Identification, Type Physical|Mobile, PostalAddress.GeoLocation) is the OBIE shape it would return if wired."
