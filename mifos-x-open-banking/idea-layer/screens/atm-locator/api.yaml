screen_id: atm-locator

endpoints:
  - id: atms
    method: GET
    path: "/atms"
    response_dto: OBReadATMResponse1
    permission: null
    requires_auth: false
    base_url_override: "https://api.hsbc.com/open-banking/v2.2"
    accept_media_type: "application/prs.openbanking.opendata.v2.2+json"
    request_headers:
      Accept: "application/prs.openbanking.opendata.v2.2+json"   # required — endpoint returns HTTP 406 without it
    notes: |
      HSBC Open Data product-public endpoint — unauthenticated; separate from the
      consent-gated AIS surface (idea-plan gap_strategy: third_party).
      Returns OBReadATMResponse1 with a nested ATM[] where each entry has:
        - Identification (ATM ID)
        - SupportedLanguages []
        - ATMServices [] (CashWithdrawal, CashDeposit, Balance, StatementPrinting, …)
        - Accessibility [] (WheelchairAccess, AudioCashMachine, BrailleInstruction, LevelAccess)
        - SupportedCurrencies []
        - MinimumPossibleAmount
        - Location.PostalAddress (AddressLine[], TownName, PostCode, Country, GeoLocation.GeographicCoordinates)
      ViewModel maps raw response to AtmDisplayItem (Name, PostalAddress, PostCode, Latitude,
      Longitude, OpeningHours, HasWheelchairAccess, HasCashDeposit, Distance).
      No OAuth token, no PKCE, no signed request object required.
    response:
      schema: OBReadATMResponse1
      fields:
        data:
          type: array
          item_schema: ATM
          fields:
            Identification: String
            ATMServices:
              type: array
              items: ["CashWithdrawal", "CashDeposit", "Balance", "StatementPrinting"]
            Accessibility:
              type: array
              items: ["WheelchairAccess", "AudioCashMachine", "BrailleInstruction", "LevelAccess"]
            Location:
              PostalAddress:
                AddressLine: "String[]"
                TownName: String
                PostCode: String
                Country: String
                GeoLocation:
                  GeographicCoordinates:
                    Latitude: String
                    Longitude: String
      vm_mapping:
        dto: AtmDisplayItem
        fields:
          Name: "Identification"
          PostalAddress: "AddressLine.joinToString() + ', ' + PostCode"
          PostCode: "Location.PostalAddress.PostCode"
          HasWheelchairAccess: "Accessibility.contains(WheelchairAccess)"
          HasCashDeposit: "ATMServices.contains(CashDeposit)"
          Latitude: "GeoLocation.GeographicCoordinates.Latitude.toDouble()"
          Longitude: "GeoLocation.GeographicCoordinates.Longitude.toDouble()"
          Distance: "GpsDistanceCalculator.computeDistance(Latitude, Longitude) or postcodecentroid fallback"
    errors:
      network_timeout:
        type: IOException
        trigger: "Ktorfit read/connect timeout (15s) or device offline"
        ui_state: "AtmLocatorUiState.Error"
        user_message: "Could not reach HSBC Open Data. Check your connection."
        action: retry_load
      http_5xx:
        type: HttpException
        trigger: "HSBC Open Data returns HTTP 500-599"
        ui_state: "AtmLocatorUiState.Error"
        user_message: "HSBC Open Data service unavailable. Please try again."
        action: retry_load
      http_4xx:
        type: HttpException
        trigger: "Unexpected HTTP 400-499 from public endpoint (no auth, so 401/403 unexpected)"
        ui_state: "AtmLocatorUiState.Error"
        user_message: "Unexpected error from HSBC Open Data."
        action: retry_load
      empty_response:
        type: EmptyResult
        trigger: "data[0].atm returns empty list or API returns null data"
        ui_state: "AtmLocatorUiState.Empty"
        user_message: null
        note: "Distinct from active-filter empty — this is a true data-empty from the API"
