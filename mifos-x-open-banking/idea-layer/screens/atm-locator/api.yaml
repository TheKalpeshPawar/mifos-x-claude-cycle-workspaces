sibling: api
schema_version: "4.0"
feature_id: atm-locator
api:
  - id: obp_get_atms
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/atms"
    tag: ATM
    params:
      - latitude
      - longitude
      - limit: 10
    response:
      fields:
        - id: String
        - name: String
        - address: Address
        - location: LatLng
        - open_24_hours: Boolean
        - cash_withdrawal_national_amount: String
        - supported_languages: "List<String>"
        - services: "List<String>"
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"

  - id: obp_get_branches
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/branches"
    tag: Branch
    params:
      - latitude
      - longitude
    response:
      fields:
        - id: String
        - name: String
        - address: Address
        - location: LatLng
        - lobby: LobbyHours
        - drive_up: DriveUpHours
        - branch_routings: "List<BranchRouting>"
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"
