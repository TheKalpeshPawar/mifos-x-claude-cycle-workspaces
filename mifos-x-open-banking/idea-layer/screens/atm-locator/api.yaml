sibling: api
schema_version: "4.0"
feature_id: atm-locator
api:
  - id: obp_get_atms
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/atms"
    tag: ATM
    note: "Shipped AtmApi.listAtms(bankId) — path-only, no query params. Called once per bank the user holds an account at (AtmRepository.atmsForBanks), results flattened and de-duplicated by id; nearest-first sort and great-circle distance are computed on-device in AtmLocatorViewModel."
    response:
      fields:
        - id: String
        - bank_id: String
        - name: String
        - address: PostalAddress
        - location: GeoLocation
        - more_info: String
        - is_accessible: String
        - has_deposit_capability: String
        - monday: OpeningHours
        - tuesday: OpeningHours
        - wednesday: OpeningHours
        - thursday: OpeningHours
        - friday: OpeningHours
        - saturday: OpeningHours
        - sunday: OpeningHours
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"

  - id: obp_get_branches
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/branches"
    tag: Branch
    status: deferred
    note: "DEFERRED — UNUSED by shipped code. The locator feature is ATM-only; no BranchesApi or BranchRepository exists. Retained as a deferred marker only; not consumed anywhere. Lat/long query params dropped — the shipped ATM endpoint takes no query params either."
