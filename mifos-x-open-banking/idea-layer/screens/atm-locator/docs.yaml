feature: atm-locator
status: designed
score: 95
cluster: account-extras
acceptance_refs:
  - FR-010
scaffolded_by: /idea-heal
archetype: index_list
description: >-
  Find nearby HSBC ATMs using the HSBC Open Data public endpoint (unauthenticated — no AIS consent required). Shows ATM
  name, address, distance, opening hours, and conditional wheelchair/cash-deposit chips. Includes service filter chips
  (24h, Wheelchair, Cash deposit) and tapping a card opens native maps for directions. Not part of the OBIE AIS surface.
has_ui: true
has_server: false
metadata:
  category: crud
  implementation_ready: true
  impl_ready_at: '2026-06-29'
  impl_ready_schema: v2
  i18n_coverage: true
  quality_score: 95
contracts:
  - id: HSBC-OPEN-DATA-ATMS
    type: public_api
    endpoint: GET /atms
    base_url: https://api.hsbc.com/v2.0/uk/open-banking
    response_dto: OBReadATMResponse1
    auth: none
    sla_note: Public Open Data endpoint; no SLA guarantee; use 15s timeout + retry.
    obie_spec_ref: OBIE Open Data API Specification v2.4
libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
  - capability: maps-deeplink
    library: expect-actual
    version: platform-native
    targets:
      - android
      - ios
    note: geo:/maps:// URL scheme intent; no third-party maps SDK required.
vm_actions:
  - name: atms_load
    signature: suspend fun atmsLoad()
    state_mutations:
      - uiState = AtmLocatorUiState.Loading
      - allAtms = response.data[0].atm.map { it.toDisplayItem() }
      - filteredAtms = allAtms.applyPredicates(filterState)
      - uiState = if (filteredAtms.isEmpty()) Empty else Content(filteredAtms)
      - uiState = AtmLocatorUiState.Error(message)
    side_effects:
      - GET /atms (HSBC Open Data, unauthenticated, no Bearer token)
    error_handling:
      network: emit Error('Could not reach HSBC Open Data. Check your connection.')
      http_5xx: emit Error('HSBC Open Data service unavailable. Please try again.')
  - name: search_atms
    signature: 'fun searchAtms(query: String)'
    state_mutations:
      - searchQuery = query
      - filteredAtms = allAtms.applyPredicates(filterState.copy(searchQuery = query))
      - uiState = if (filteredAtms.isEmpty()) Empty else Content(filteredAtms)
    side_effects: []
    note: Client-side only; does NOT re-call the API.
  - name: toggle_filter_24h
    signature: fun toggleFilter24h()
    state_mutations:
      - filterState = filterState.copy(is24h = !filterState.is24h)
      - filteredAtms = allAtms.applyPredicates(filterState)
      - uiState = if (filteredAtms.isEmpty()) Empty else Content(filteredAtms)
    side_effects: []
  - name: toggle_filter_wheelchair
    signature: fun toggleFilterWheelchair()
    state_mutations:
      - filterState = filterState.copy(hasWheelchairAccess = !filterState.hasWheelchairAccess)
      - filteredAtms = allAtms.applyPredicates(filterState)
      - uiState = if (filteredAtms.isEmpty()) Empty else Content(filteredAtms)
    side_effects: []
  - name: toggle_filter_deposit
    signature: fun toggleFilterDeposit()
    state_mutations:
      - filterState = filterState.copy(hasCashDeposit = !filterState.hasCashDeposit)
      - filteredAtms = allAtms.applyPredicates(filterState)
      - uiState = if (filteredAtms.isEmpty()) Empty else Content(filteredAtms)
    side_effects: []
  - name: open_atm_directions
    signature: 'fun openAtmDirections(atm: AtmDisplayItem)'
    state_mutations: []
    side_effects:
      - Fire platform geo:/maps:// deep-link intent (expect/actual) with atm.Latitude, atm.Longitude, atm.Name
    note: No ViewModel state change; navigates to OS-native Maps app.
  - name: retry_load
    signature: suspend fun retryLoad()
    state_mutations:
      - filterState = FilterState.default
      - delegates to atmsLoad()
    side_effects: []
error_cases:
  - code: NETWORK_ERROR
    description: Device offline; HSBC Open Data endpoint unreachable.
    user_message: Could not reach HSBC Open Data. Check your connection.
  - code: HTTP_5XX
    description: HSBC Open Data service temporarily unavailable.
    user_message: HSBC Open Data service unavailable. Please try again.
  - code: EMPTY_RESULT
    description: Active filter predicates yield zero matches from allAtms.
    ui_state: empty
test_fixtures:
  source: idea-layer/screens/atm-locator/tests.yaml
  scenario_count: 9
  priority_distribution:
    critical: 3
    normal: 6
capability_completeness:
  answered_at: "2026-07-14"
  answered_by: "/idea-enrich"
  CC1_storage_location: "No persistent storage. All ATM data is in-memory only (allAtms + filteredAtms in AtmLocatorViewModel scope); cleared on screen dismissal. The HSBC Open Data endpoint is public and unauthenticated so a Room/SQLDelight disk cache is not warranted — stale cache risk outweighs the latency benefit for a ~200-record list on a fast unauthenticated endpoint."
  CC2_destructive_action_safety: "No destructive actions. Screen is fully read-only: no writes, deletes, or mutations of user data. retryLoad resets filterState to defaults (all-off) which is reversible UI state, not a destructive data action."
  CC3_nav_callback_wiring: "No in-app navigation targets from this screen. open_atm_directions exits via OS geo:/maps:// intent (expect/actual) — this is a one-way OS handoff, not an in-app navigateTo. Back navigation is handled by the top_app_bar_leading back button wired to the host NavController's popBackStack()."
  CC4_user_data_export: "No user data is created, collected, or exported. ATM data is public Open Data with no PII. No GDPR data-export requirement applies."
  CC5_permission_visibility: "No runtime permissions required. GPS location is opportunistically consumed via expect/actual if already granted by the OS (for distance sorting) but no permission request is shown from this screen — the feature degrades gracefully to postcode-centroid distance when GPS is unavailable. No permission gate or Settings deep-link needed."
  CC6_storage_budget_awareness: "Single unauthenticated GET /atms response. Typical payload: ~200 ATM records, estimated 50-100 KB JSON. Decoded into List<AtmDisplayItem> in ViewModel memory only; no disk quota impact. A 15-second Ktorfit timeout prevents indefinite in-flight data accumulation."
  CC7_network_data_policy: "Request is unauthenticated (no Bearer token, no FAPI signed request, no PKCE). Response is NOT cached to disk. Retry is manual (user-initiated via retry_load). Exponential back-off is not applied (single call per mount/retry). No background polling; data is only fetched on screen mount or explicit retry."
  CC8_cache_lifecycle: "No disk cache lifecycle. allAtms is held in AtmLocatorViewModel scope and released when the ViewModel is cleared (screen removed from back-stack). Data refetches on every fresh navigation to this screen. No stale-cache TTL concern."
  CC9_error_recovery: "Two named error paths: NETWORK_ERROR (IOException / SocketTimeoutException) and HTTP_5XX. Both surface the error state with distinct user-readable messages. The Retry filled_button re-triggers atmsLoad and resets filterState to all-off, ensuring the user starts with an unfiltered view. Empty state (zero results after filtering) is distinct from error and offers no retry since the data loaded successfully — the user is expected to adjust filters."

