<!doctype html>
<!-- render-hash: 7d4b0e3f9c12 -->
<html lang="en" data-screen="atm-locator" data-state="empty" data-feature="atm-locator" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATM &amp; Branch Locator — No ATMs</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  .top-bar {
    display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--on-surface-variant);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .page-title {
    font-size: 22px; font-weight: 700; color: var(--primary);
    padding: 8px 16px 12px;
  }
  /* Empty state container */
  .empty-state {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 32px 48px;
    text-align: center;
    gap: 16px;
  }
  .empty-illustration {
    width: 160px; height: 140px;
  }
  .empty-title {
    font-size: 20px; font-weight: 700; color: var(--on-surface); line-height: 1.3;
  }
  .empty-body {
    font-size: 14px; color: var(--on-surface-variant); line-height: 1.55;
    max-width: 280px;
  }
  .cta-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 12px 28px; min-height: 44px;
    border-radius: var(--radius-soft); background: var(--primary);
    color: var(--on-primary); font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 600; border: none; cursor: pointer;
  }
  .cta-btn:hover, .cta-btn:focus-visible { opacity: 0.9; outline: 2px solid var(--primary); outline-offset: 3px; }
  .cta-btn .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
<main role="main">

  <header class="top-bar" data-shell="top-bar" data-component-type="LayoutBox" data-component-id="atm_top_bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
  </header>

  <h1 class="page-title" data-component-type="text" data-component-id="atm_locator_title">ATM &amp; Branches</h1>

  <div class="empty-state" data-component-type="LayoutBox" data-component-id="atm_empty_state">

    <!-- Inline SVG illustration — no external image URL -->
    <svg class="empty-illustration" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="No ATMs illustration" data-component-type="icon" data-component-id="atm_empty_icon">
      <!-- Ground -->
      <ellipse cx="80" cy="122" rx="60" ry="10" fill="#E1E4D5"/>
      <!-- Location pin outline (greyed) -->
      <path d="M80 20 C58 20 40 38 40 58 C40 80 80 112 80 112 C80 112 120 80 120 58 C120 38 102 20 80 20 Z"
            fill="none" stroke="#75796C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner circle -->
      <circle cx="80" cy="58" r="14" fill="none" stroke="#75796C" stroke-width="3.5"/>
      <!-- Strike-through diagonal -->
      <line x1="50" y1="28" x2="115" y2="93" stroke="#BA1A1A" stroke-width="4" stroke-linecap="round"/>
      <!-- Cash symbol inside pin (faded) -->
      <text x="80" y="64" text-anchor="middle" font-family="sans-serif" font-size="13"
            fill="#44483D" opacity="0.5">£</text>
    </svg>

    <h2 class="empty-title"
        data-component-type="text" data-component-id="atm_empty_title"
        role="heading" aria-level="2">No ATMs nearby</h2>

    <p class="empty-body"
       data-component-type="text" data-component-id="atm_empty_message">
      None of your banks have published ATM locations yet.
    </p>

    <button class="cta-btn"
            data-component-type="button" data-component-id="atm_retry_button"
            data-action="retry_load" data-nav-to="atm_locator_main"
            aria-label="Search a different area for ATMs">
      <span class="material-icons" aria-hidden="true">search</span>
      Search a different area
    </button>

  </div>

</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
