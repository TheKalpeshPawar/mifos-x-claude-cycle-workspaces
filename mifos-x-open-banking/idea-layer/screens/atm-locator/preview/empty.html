<!doctype html>
<!-- render-hash: a1d5f3c8e9b2 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Find HSBC ATM — Empty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    /* ── Design Tokens: Light ───────────────────────────────────────── */
    :root {
      --color-primary: #266489;
      --color-on-primary: #FFFFFF;
      --color-primary-container: #C9E6FF;
      --color-on-primary-container: #004B6F;
      --color-secondary: #50606E;
      --color-on-secondary: #FFFFFF;
      --color-secondary-container: #D3E5F5;
      --color-on-secondary-container: #384956;
      --color-error: #BA1A1A;
      --color-on-error: #FFFFFF;
      --color-error-container: #FFDAD6;
      --color-on-error-container: #93000A;
      --color-background: #F7F9FF;
      --color-on-background: #181C20;
      --color-surface: #F7F9FF;
      --color-on-surface: #181C20;
      --color-surface-variant: #DDE3EA;
      --color-on-surface-variant: #41474D;
      --color-surface-container-lowest: #FFFFFF;
      --color-surface-container-low: #F1F4F9;
      --color-surface-container: #EBEEF3;
      --color-surface-container-high: #E5E8ED;
      --color-surface-container-highest: #E0E3E8;
      --color-outline: #72787E;
      --color-outline-variant: #C1C7CE;
      /* Typography */
      --fs-title-large: 1.375rem;
      --fw-title-large: 400;
      --lh-title-large: 1.75rem;
      --fs-headline-small: 1.5rem;
      --fw-headline-small: 400;
      --lh-headline-small: 2rem;
      --fs-title-medium: 1rem;
      --fw-title-medium: 500;
      --lh-title-medium: 1.5rem;
      --fs-body-large: 1rem;
      --fw-body-large: 400;
      --lh-body-large: 1.5rem;
      --fs-body-medium: 0.875rem;
      --fw-body-medium: 400;
      --lh-body-medium: 1.25rem;
      --fs-label-medium: 0.75rem;
      --fw-label-medium: 500;
      --lh-label-medium: 1rem;
      --fs-label-large: 0.875rem;
      --fw-label-large: 500;
      /* Shape / Spacing */
      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-extra-large: 28px;
      --radius-full: 9999px;
      --spacing-4: 4px;
      --spacing-8: 8px;
      --spacing-12: 12px;
      --spacing-16: 16px;
      --spacing-24: 24px;
      --spacing-32: 32px;
      --spacing-48: 48px;
      --min-touch: 48px;
      /* Motion */
      --motion-duration-medium: 300ms;
      --motion-easing-standard: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    /* ── Design Tokens: Dark ────────────────────────────────────────── */
    [data-theme="dark"] {
      --color-primary: #95CDF7;
      --color-on-primary: #00344E;
      --color-primary-container: #004B6F;
      --color-on-primary-container: #C9E6FF;
      --color-secondary: #B7C9D9;
      --color-on-secondary: #22323F;
      --color-secondary-container: #384956;
      --color-on-secondary-container: #D3E5F5;
      --color-error: #FFB4AB;
      --color-on-error: #690005;
      --color-error-container: #93000A;
      --color-on-error-container: #FFDAD6;
      --color-background: #101417;
      --color-on-background: #E0E3E8;
      --color-surface: #101417;
      --color-on-surface: #E0E3E8;
      --color-surface-variant: #41474D;
      --color-on-surface-variant: #C1C7CE;
      --color-surface-container-lowest: #0B0F12;
      --color-surface-container-low: #181C20;
      --color-surface-container: #1C2024;
      --color-surface-container-high: #262A2E;
      --color-surface-container-highest: #313539;
      --color-outline: #8B9198;
      --color-outline-variant: #41474D;
    }

    /* ── Global Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--color-background);
      color: var(--color-on-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      user-select: none;
    }

    /* ── Top App Bar ────────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 8;
      background-color: var(--color-surface);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--spacing-4);
      gap: var(--spacing-4);
      border-bottom: 1px solid var(--color-outline-variant);
    }

    .top-app-bar__nav-btn {
      width: var(--min-touch);
      height: var(--min-touch);
      border: none;
      background: transparent;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-on-surface);
      flex-shrink: 0;
    }

    .top-app-bar__title {
      flex: 1;
      font-size: var(--fs-title-large);
      font-weight: var(--fw-title-large);
      line-height: var(--lh-title-large);
      color: var(--color-on-surface);
    }

    /* ── Screen Content ─────────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* ── Search Field (active, with TR1 9ZZ query) ──────────────────── */
    .search-field {
      margin: var(--spacing-12) var(--spacing-16) 0;
      position: relative;
    }

    .search-field__input-wrap {
      display: flex;
      align-items: center;
      background-color: var(--color-surface-container-high);
      border-radius: var(--radius-extra-large);
      padding: 0 var(--spacing-16);
      height: 56px;
      gap: var(--spacing-8);
      border: 1px solid var(--color-primary);
      background-color: var(--color-surface-container);
    }

    .search-field__icon {
      color: var(--color-primary);
      flex-shrink: 0;
    }

    .search-field__input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-body-large);
      color: var(--color-on-surface);
      outline: none;
      min-width: 0;
    }

    .search-field__clear {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      padding: 0;
    }

    /* ── Filter Chips (visible in empty state per ui.yaml state_binding) */
    .filter-chips {
      display: flex;
      gap: var(--spacing-8);
      padding: var(--spacing-12) var(--spacing-16) 0;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-4);
      height: 32px;
      padding: 0 var(--spacing-12);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-outline);
      background-color: transparent;
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-large);
      font-weight: var(--fw-label-large);
      color: var(--color-on-surface-variant);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: var(--min-touch);
    }

    /* ── Empty State ────────────────────────────────────────────────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-48) var(--spacing-32);
      text-align: center;
      gap: var(--spacing-16);
    }

    .empty-state__icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background-color: var(--color-surface-container);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-state__icon {
      font-size: 40px;
      color: var(--color-on-surface-variant);
    }

    .empty-state__title {
      font-size: var(--fs-title-medium);
      font-weight: var(--fw-title-medium);
      line-height: var(--lh-title-medium);
      color: var(--color-on-surface);
    }

    .empty-state__body {
      font-size: var(--fs-body-medium);
      font-weight: var(--fw-body-medium);
      line-height: var(--lh-body-medium);
      color: var(--color-on-surface-variant);
      max-width: 280px;
    }

    /* ── Bottom Navigation ──────────────────────────────────────────── */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 8;
      background-color: var(--color-surface-container);
      display: flex;
      align-items: center;
      height: 80px;
      border-top: 1px solid var(--color-outline-variant);
      padding: 0 var(--spacing-4);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-4);
      padding: var(--spacing-12) 0 var(--spacing-8);
      min-height: var(--min-touch);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-on-surface-variant);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-medium);
      font-weight: var(--fw-label-medium);
      text-decoration: none;
    }
    .bottom-nav__icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
    }
    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      font-weight: var(--fw-label-medium);
    }
  </style>
</head>
<body data-screen="atm-locator" data-state="empty">

  <!-- Top App Bar -->
  <header class="top-app-bar" role="banner">
    <button
      class="top-app-bar__nav-btn"
      aria-label="Navigate back"
      data-action="navigate_back"
      data-nav-to="account-detail"
    >
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Find HSBC ATM</h1>
  </header>

  <!-- Screen Content -->
  <main class="screen-content" role="main">

    <!-- Search Field: active with query "TR1 9ZZ" (demo empty state) -->
    <div class="search-field">
      <div class="search-field__input-wrap">
        <span class="material-symbols-outlined search-field__icon" aria-hidden="true">search</span>
        <input
          type="search"
          class="search-field__input"
          aria-label="Search for ATMs by postcode or area"
          placeholder="e.g. NW1 0LT or Camden"
          value="TR1 9ZZ"
          data-action="search_atms"
          autocomplete="off"
        >
        <button class="search-field__clear" aria-label="Clear search" type="button" data-action="search_atms">
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:18px;">close</span>
        </button>
      </div>
    </div>

    <!-- Service Filter Chips (visible in empty state) -->
    <div class="filter-chips" role="group" aria-label="ATM service filters">
      <button
        class="filter-chip"
        role="checkbox"
        aria-checked="false"
        aria-label="Filter: 24-hour ATMs only"
        data-action="toggle_filter_24h"
        type="button"
      >24h</button>
      <button
        class="filter-chip"
        role="checkbox"
        aria-checked="false"
        aria-label="Filter: wheelchair-accessible ATMs only"
        data-action="toggle_filter_wheelchair"
        type="button"
      >Wheelchair</button>
      <button
        class="filter-chip"
        role="checkbox"
        aria-checked="false"
        aria-label="Filter: cash deposit ATMs only"
        data-action="toggle_filter_deposit"
        type="button"
      >Cash deposit</button>
    </div>

    <!-- Empty State -->
    <div
      class="empty-state"
      role="status"
      aria-label="No ATMs found near your search location"
    >
      <div class="empty-state__icon-wrap" aria-hidden="true">
        <span class="material-symbols-outlined empty-state__icon">location_off</span>
      </div>
      <p class="empty-state__title">No ATMs found nearby</p>
      <p class="empty-state__body">No HSBC ATMs match your search. Try a different postcode or area name.</p>
    </div>

  </main>

  <!-- Bottom Navigation: Home · Accounts · Transactions · More (no active tab — sub-screen) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#home" class="bottom-nav__item" aria-label="Home" data-nav-to="home">
      <div class="bottom-nav__icon-wrap">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a href="#accounts" class="bottom-nav__item" aria-label="Accounts" data-nav-to="accounts">
      <div class="bottom-nav__icon-wrap">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </a>
    <a href="#transactions" class="bottom-nav__item" aria-label="Transactions" data-nav-to="transactions">
      <div class="bottom-nav__icon-wrap">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav__label">Transactions</span>
    </a>
    <a href="#settings" class="bottom-nav__item" aria-label="More" data-nav-to="settings">
      <div class="bottom-nav__icon-wrap">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav__label">More</span>
    </a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
