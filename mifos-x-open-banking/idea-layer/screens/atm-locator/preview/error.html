<!doctype html>
<!-- render-hash: 2c6a1d8e5b03 -->
<html lang="en" data-screen="atm-locator" data-state="error" data-feature="atm-locator" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATM &amp; Branch Locator — Error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --error-container: #FFDAD6; --on-error-container: #410002;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    --error-container: #93000A; --on-error-container: #FFDAD6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
      --error-container: #93000A; --on-error-container: #FFDAD6;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  .top-bar {
    display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--on-surface-variant);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .page-title {
    font-size: 22px; font-weight: 700; color: var(--primary);
    padding: 8px 16px 12px;
  }
  .error-state {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 32px 48px;
    text-align: center;
    gap: 16px;
  }
  .error-illustration {
    width: 148px; height: 130px;
  }
  .error-title {
    font-size: 20px; font-weight: 700; color: var(--on-surface); line-height: 1.3;
  }
  .error-body {
    font-size: 14px; color: var(--on-surface-variant); line-height: 1.55;
    max-width: 260px;
  }
  .error-cause {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    background: var(--error-container); color: var(--on-error-container);
    font-size: 12px; font-weight: 500;
  }
  .error-cause .material-icons { font-size: 15px; }
  .retry-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 6px; padding: 11px 28px; min-height: 44px;
    border-radius: var(--radius-soft);
    background: transparent; border: none;
    color: var(--primary); font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .retry-btn:hover, .retry-btn:focus-visible {
    background: var(--primary-container); outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .retry-btn .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
<main role="main">

  <header class="top-bar" data-shell="top-bar" data-component-type="LayoutBox" data-component-id="atm_top_bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
  </header>

  <h1 class="page-title" data-component-type="text" data-component-id="atm_locator_title">ATM &amp; Branches</h1>

  <div class="error-state" data-component-type="LayoutBox" data-component-id="atm_error_state">

    <!-- Inline SVG error illustration — no external image URL -->
    <svg class="error-illustration" viewBox="0 0 148 130" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="Connection error illustration"
         data-component-type="icon" data-component-id="atm_error_icon">
      <!-- Cloud body -->
      <ellipse cx="74" cy="68" rx="52" ry="34" fill="#E1E4D5"/>
      <circle cx="44" cy="60" r="26" fill="#E1E4D5"/>
      <circle cx="100" cy="55" r="22" fill="#E1E4D5"/>
      <!-- Dark outline cloud -->
      <path d="M38 88 C18 88 6 74 6 60 C6 46 16 36 30 34 C34 20 46 12 60 12 C72 12 82 18 88 28 C92 25 98 24 104 24 C118 24 130 36 130 50 C130 66 118 78 104 78"
            fill="none" stroke="#75796C" stroke-width="3" stroke-linecap="round"/>
      <!-- Lightning / disconnect bolt -->
      <path d="M78 46 L66 66 L76 66 L62 88" stroke="#BA1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- WiFi off cross-hairs at bottom -->
      <circle cx="74" cy="116" r="4" fill="#75796C"/>
      <path d="M60 106 Q74 98 88 106" fill="none" stroke="#75796C" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 98 Q74 86 98 98" fill="none" stroke="#75796C" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <!-- Diagonal cancel slash -->
      <line x1="40" y1="82" x2="108" y2="40" stroke="#BA1A1A" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    </svg>

    <h2 class="error-title"
        data-component-type="text" data-component-id="atm_error_title"
        role="heading" aria-level="2">Couldn't load ATMs</h2>

    <p class="error-body"
       data-component-type="text" data-component-id="atm_error_message">
      Check your connection and try again
    </p>

    <!-- Error cause badge (rate-limit from demo-data.yaml) -->
    <span class="error-cause" aria-live="polite">
      <span class="material-icons" aria-hidden="true">info_outline</span>
      UK.OBIE.Rate.Limit — retry after a short delay
    </span>

    <button class="retry-btn"
            data-component-type="button" data-component-id="atm_retry_button"
            data-action="retry_load" data-nav-to="atm_locator_main"
            aria-label="Retry loading ATMs">
      <span class="material-icons" aria-hidden="true">refresh</span>
      Retry
    </button>

  </div>

</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
