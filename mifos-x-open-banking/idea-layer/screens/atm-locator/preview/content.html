<!doctype html>
<html lang="en" data-screen="atm-locator" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM &amp; Branches</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 32px;
      overflow-x: hidden;
    }
    .screen-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      padding: 24px 16px 0;
    }
    /* Search input */
    .search-wrap {
      position: relative;
      margin: 12px 16px 0;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--outline);
      font-size: 20px;
    }
    .search-input {
      display: block;
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 28px;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      color: var(--on-surface);
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-input::placeholder { color: var(--outline); }
    /* Map area */
    .map-area {
      background: var(--surface-variant);
      height: 240px;
      margin: 12px 16px 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .map-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--outline);
    }
    .map-placeholder .material-icons { font-size: 40px; }
    .map-placeholder span { font-size: 13px; }
    /* Map pins simulated */
    .map-pin {
      position: absolute;
      background: var(--primary);
      color: var(--on-primary);
      border-radius: 50% 50% 50% 0;
      width: 28px;
      height: 28px;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-pin .material-icons { transform: rotate(45deg); font-size: 14px; }
    .map-pin:nth-child(1) { top: 60px; left: 80px; }
    .map-pin:nth-child(2) { top: 100px; left: 200px; }
    .map-pin:nth-child(3) { top: 140px; left: 120px; }
    /* Filter chips */
    .filter-chips-row {
      display: flex;
      flex-direction: row;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-chips-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      color: var(--on-surface-variant);
      font-family: 'Outfit', sans-serif;
    }
    .filter-chip.selected {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    /* Results header */
    .results-header {
      font-size: 16px;
      font-weight: 600;
      color: var(--on-surface);
      padding: 8px 16px 4px;
    }
    /* ATM result cards */
    .atm-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      margin: 0 16px 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      cursor: pointer;
    }
    .atm-card-inner {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .atm-header-row {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
    }
    .atm-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--on-surface);
      flex: 1;
    }
    .atm-distance {
      font-size: 12px;
      color: var(--outline);
    }
    .atm-hours-open {
      font-size: 12px;
      font-weight: 500;
      color: var(--primary);
    }
    .atm-hours-limited {
      font-size: 12px;
      font-weight: 500;
      color: var(--warning);
    }
    .atm-limit {
      font-size: 12px;
      color: var(--on-surface-variant);
    }
    .atm-services {
      font-size: 12px;
      color: var(--on-surface-variant);
    }
    .atm-card-footer {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .directions-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
    }
    .directions-link .material-icons { font-size: 16px; }
    .results-divider {
      height: 1px;
      background: var(--outline-variant);
      margin: 8px 16px;
    }
  </style>
</head>
<body>

  <!-- Screen Title -->
  <h1 class="screen-title"
      data-component-type="text"
      data-component-id="atm_locator_title"
      role="heading"
      aria-level="1">ATM &amp; Branches</h1>

  <!-- Search Input -->
  <div class="search-wrap">
    <span class="material-icons search-icon" aria-hidden="true">search</span>
    <input class="search-input"
           data-component-type="input"
           data-component-id="location_search_input"
           data-action="search_location"
           type="search"
           placeholder="Enter city, postcode or address..."
           role="searchbox"
           aria-label="Search for ATMs and branches by location"
           tabindex="0">
  </div>

  <!-- Map Area -->
  <div class="map-area"
       data-component-type="image"
       data-component-id="atm_map_area"
       role="img"
       aria-label="ATM map showing nearby locations">
    <div class="map-pin">
      <span class="material-icons" aria-hidden="true">atm</span>
    </div>
    <div class="map-pin">
      <span class="material-icons" aria-hidden="true">atm</span>
    </div>
    <div class="map-pin">
      <span class="material-icons" aria-hidden="true">account_balance</span>
    </div>
    <div class="map-placeholder">
      <span class="material-icons" aria-hidden="true">map</span>
      <span>Map view</span>
    </div>
  </div>

  <!-- Filter Chips -->
  <div class="filter-chips-row"
       data-component-type="stack"
       data-component-id="filter_chips_row"
       role="group"
       aria-label="Filter ATMs and branches by type">
    <button class="filter-chip selected"
            data-component-type="input"
            data-component-id="filter_all"
            data-action="filter_type"
            role="radio"
            aria-checked="true"
            aria-label="Show all ATMs and branches"
            tabindex="0">All</button>
    <button class="filter-chip"
            data-component-type="input"
            data-component-id="filter_atms"
            data-action="filter_type"
            role="radio"
            aria-checked="false"
            aria-label="Show ATMs only"
            tabindex="0">ATMs</button>
    <button class="filter-chip"
            data-component-type="input"
            data-component-id="filter_branches"
            data-action="filter_type"
            role="radio"
            aria-checked="false"
            aria-label="Show branches only"
            tabindex="0">Branches</button>
    <button class="filter-chip"
            data-component-type="input"
            data-component-id="filter_24_7"
            data-action="filter_type"
            role="radio"
            aria-checked="false"
            aria-label="Show 24/7 locations only"
            tabindex="0">24/7</button>
  </div>

  <!-- Results Header -->
  <h2 class="results-header"
      data-component-type="text"
      data-component-id="nearby_results_header"
      role="heading"
      aria-level="2"
      aria-label="Nearby results: 3 ATMs found within 500 metres">3 ATMs found within 500m</h2>

  <!-- ATM: Oxford Street -->
  <div class="atm-card"
       data-component-type="box"
       data-component-id="atm_result_oxford_street"
       data-action="view_atm_detail"
       role="listitem"
       aria-label="Mifos ATM Oxford Street, 0.2 kilometres away, Open 24/7"
       tabindex="0">
    <div class="atm-card-inner">
      <div class="atm-header-row">
        <span class="atm-name"
              data-component-type="text"
              data-component-id="atm_oxford_name">Mifos ATM — Oxford Street</span>
        <span class="atm-distance"
              data-component-type="text"
              data-component-id="atm_oxford_distance"
              aria-label="0.2 kilometres away">0.2km away</span>
      </div>
      <span class="atm-hours-open"
            data-component-type="text"
            data-component-id="atm_oxford_hours"
            aria-label="Open 24 hours, 7 days a week">Open 24/7</span>
      <span class="atm-limit"
            data-component-type="text"
            data-component-id="atm_oxford_limit"
            aria-label="Maximum withdrawal limit £300">£300 max withdrawal</span>
    </div>
    <div class="atm-card-footer">
      <button class="directions-link"
              data-component-type="link"
              data-component-id="atm_oxford_directions"
              data-action="open_directions"
              role="link"
              aria-label="Get directions to Mifos ATM Oxford Street"
              tabindex="0">
        Get Directions
        <span class="material-icons" aria-hidden="true">directions</span>
      </button>
    </div>
  </div>

  <!-- ATM: Bond Street -->
  <div class="atm-card"
       data-component-type="box"
       data-component-id="atm_result_bond_street"
       data-action="view_atm_detail"
       role="listitem"
       aria-label="Mifos ATM Bond Street Station, 0.5 kilometres away, Open 24/7"
       tabindex="0">
    <div class="atm-card-inner">
      <div class="atm-header-row">
        <span class="atm-name"
              data-component-type="text"
              data-component-id="atm_bond_name">Mifos ATM — Bond Street Station</span>
        <span class="atm-distance"
              data-component-type="text"
              data-component-id="atm_bond_distance"
              aria-label="0.5 kilometres away">0.5km away</span>
      </div>
      <span class="atm-hours-open"
            data-component-type="text"
            data-component-id="atm_bond_hours"
            aria-label="Open 24 hours, 7 days a week">Open 24/7</span>
    </div>
    <div class="atm-card-footer">
      <button class="directions-link"
              data-component-type="link"
              data-component-id="atm_bond_directions"
              data-action="open_directions"
              role="link"
              aria-label="Get directions to Mifos ATM Bond Street Station"
              tabindex="0">
        Get Directions
        <span class="material-icons" aria-hidden="true">directions</span>
      </button>
    </div>
  </div>

  <!-- Branch: Mayfair -->
  <div class="atm-card"
       data-component-type="box"
       data-component-id="atm_result_mayfair_branch"
       data-action="view_atm_detail"
       role="listitem"
       aria-label="Mifos Branch Mayfair, 0.8 kilometres away, Monday to Friday 9am to 5pm"
       tabindex="0">
    <div class="atm-card-inner">
      <div class="atm-header-row">
        <span class="atm-name"
              data-component-type="text"
              data-component-id="branch_mayfair_name">Mifos Branch — Mayfair</span>
        <span class="atm-distance"
              data-component-type="text"
              data-component-id="branch_mayfair_distance"
              aria-label="0.8 kilometres away">0.8km away</span>
      </div>
      <span class="atm-hours-limited"
            data-component-type="text"
            data-component-id="branch_mayfair_hours"
            aria-label="Open Monday to Friday 9am to 5pm">Mon–Fri 9am–5pm</span>
      <span class="atm-services"
            data-component-type="text"
            data-component-id="branch_mayfair_services"
            aria-label="Available services: Cashier, Foreign Exchange, Safe Deposit">Services: Cashier · FX · Safe Deposit</span>
    </div>
    <div class="atm-card-footer">
      <button class="directions-link"
              data-component-type="link"
              data-component-id="branch_mayfair_directions"
              data-action="open_directions"
              role="link"
              aria-label="Get directions to Mifos Branch Mayfair"
              tabindex="0">
        Get Directions
        <span class="material-icons" aria-hidden="true">directions</span>
      </button>
    </div>
  </div>

  <div class="results-divider"
       data-component-type="divider"
       data-component-id="results_divider"
       role="separator"
       aria-hidden="true"></div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
