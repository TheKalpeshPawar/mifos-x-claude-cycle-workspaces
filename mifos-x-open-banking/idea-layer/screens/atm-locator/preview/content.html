<!doctype html>
<!-- render-hash: 9b2e5f1c4a07 -->
<html lang="en" data-screen="atm-locator" data-state="content" data-feature="atm-locator" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATM &amp; Branch Locator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  .top-bar {
    display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--on-surface-variant);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .page-title {
    font-size: 22px; font-weight: 700; color: var(--primary);
    padding: 8px 16px 12px;
  }
  /* Map area — inline SVG placeholder, no external tile URLs */
  .map-area {
    width: 100%; height: 200px; overflow: hidden;
    background: var(--surface-variant); position: relative;
  }
  .map-area svg { width: 100%; height: 100%; }
  /* Search row */
  .search-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 4px;
  }
  .search-field {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--background); border: 1px solid var(--outline-variant);
    border-radius: var(--radius-soft); padding: 0 14px;
    height: 46px; min-height: 44px;
  }
  .search-field .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); flex-shrink: 0; }
  .search-field input {
    flex: 1; border: none; background: transparent; font-family: 'Outfit', sans-serif;
    font-size: 15px; color: var(--on-surface); outline: none;
  }
  .search-field input::placeholder { color: var(--on-surface-variant); }
  .loc-btn {
    width: 44px; height: 44px; border-radius: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--primary-container); border: none; cursor: pointer;
    color: var(--on-primary-container); flex-shrink: 0;
  }
  .loc-btn:hover, .loc-btn:focus-visible { opacity: 0.85; outline: 2px solid var(--primary); outline-offset: 2px; }
  /* Results header */
  .results-header {
    font-size: 14px; font-weight: 600; color: var(--on-surface-variant);
    padding: 12px 16px 4px;
  }
  /* ATM card */
  .atm-card {
    background: var(--surface);
    border-radius: var(--radius-soft);
    margin: 4px 16px;
    box-shadow: var(--shadow-1);
    overflow: hidden;
    cursor: pointer;
  }
  .atm-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .atm-card-summary {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 14px 16px 12px;
  }
  .atm-card-info { flex: 1; min-width: 0; }
  .atm-name {
    font-size: 15px; font-weight: 600; color: var(--on-surface); line-height: 1.3;
    margin-bottom: 2px;
  }
  .atm-hours {
    font-size: 13px; color: var(--on-surface-variant); line-height: 1.4;
  }
  .dist-badge {
    display: inline-flex; align-items: center; padding: 3px 9px;
    background: var(--secondary-container); color: var(--on-secondary-container);
    border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
  }
  /* Expanded detail (first card shown open) */
  .atm-detail {
    padding: 0 16px 14px; border-top: 1px solid var(--outline-variant);
    margin-top: 2px;
  }
  .atm-address {
    font-size: 13px; color: var(--on-surface); line-height: 1.45;
    padding: 10px 0 10px;
  }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
  }
  .chip .material-icons { font-size: 14px; }
  .chip-accessible { background: #FFD8E4; color: #31111D; }
  .chip-deposits   { background: var(--primary-container); color: var(--on-primary-container); }
  .dir-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 12px; min-height: 44px;
    border: 1.5px solid var(--primary); background: transparent;
    color: var(--primary); font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .dir-btn:hover, .dir-btn:focus-visible { background: var(--primary-container); outline: none; }
  .dir-btn .material-icons { font-size: var(--icon-sm); }
  /* HSBC colour for list ATMs 2 & 3 */
  .atm-card + .atm-card { margin-top: 0; }
</style>
</head>
<body>
<main role="main">

  <header class="top-bar" data-shell="top-bar" data-component-type="LayoutBox" data-component-id="atm_top_bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
  </header>

  <h1 class="page-title" data-component-type="text" data-component-id="atm_locator_title">ATM &amp; Branches</h1>

  <!-- Map area — inline SVG placeholder only, no tile URL -->
  <div class="map-area" data-component-type="image" data-component-id="atm_map_area"
       role="img" aria-label="Map showing nearby ATMs across your banks">
    <svg viewBox="0 0 390 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <!-- Abstract map grid -->
      <rect width="390" height="200" fill="#C8D8B0"/>
      <!-- Roads -->
      <rect x="0" y="88" width="390" height="10" fill="#EAEED8" rx="2"/>
      <rect x="0" y="130" width="390" height="7" fill="#EAEED8" rx="2"/>
      <rect x="80" y="0" width="9" height="200" fill="#EAEED8" rx="2"/>
      <rect x="200" y="0" width="7" height="200" fill="#EAEED8" rx="2"/>
      <rect x="310" y="0" width="9" height="200" fill="#EAEED8" rx="2"/>
      <!-- Blocks -->
      <rect x="0" y="0" width="76" height="84" fill="#B7CCAA" rx="4"/>
      <rect x="93" y="0" width="103" height="84" fill="#B7CCAA" rx="4"/>
      <rect x="213" y="0" width="93" height="84" fill="#B7CCAA" rx="4"/>
      <rect x="323" y="0" width="67" height="84" fill="#B7CCAA" rx="4"/>
      <rect x="0" y="102" width="76" height="90" fill="#B7CCAA" rx="4"/>
      <rect x="93" y="102" width="103" height="90" fill="#B7CCAA" rx="4"/>
      <rect x="213" y="102" width="93" height="90" fill="#B7CCAA" rx="4"/>
      <rect x="323" y="102" width="67" height="90" fill="#B7CCAA" rx="4"/>
      <!-- ATM pin 1 (Canary Wharf) -->
      <g transform="translate(110,70)">
        <circle cx="0" cy="0" r="14" fill="#4C662B"/>
        <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-family="sans-serif">⊕</text>
      </g>
      <!-- ATM pin 2 (Oxford St) -->
      <g transform="translate(230,48)">
        <circle cx="0" cy="0" r="11" fill="#4C662B" opacity="0.75"/>
        <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="sans-serif">⊕</text>
      </g>
      <!-- ATM pin 3 (King's Cross) -->
      <g transform="translate(340,112)">
        <circle cx="0" cy="0" r="11" fill="#4C662B" opacity="0.75"/>
        <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="sans-serif">⊕</text>
      </g>
      <!-- My-location pulse -->
      <circle cx="195" cy="93" r="18" fill="#4C662B" opacity="0.15"/>
      <circle cx="195" cy="93" r="8" fill="#4C662B" opacity="0.35"/>
      <circle cx="195" cy="93" r="4" fill="#4C662B"/>
    </svg>
  </div>

  <!-- Search row -->
  <div class="search-row" data-component-type="LayoutBox" data-component-id="atm_search_row"
       role="group" aria-label="Search ATMs by location and use my location">
    <label class="search-field" data-component-type="input" data-component-id="location_search_input">
      <span class="material-icons" aria-hidden="true">search</span>
      <input
        type="search"
        role="searchbox"
        aria-label="Search for ATMs by city, postcode or address"
        placeholder="Search city, postcode or address"
        data-action="query_changed"
        data-nav-to="atm_locator_main"
      >
    </label>
    <button class="loc-btn" data-component-type="icon_button" data-component-id="use_my_location_button"
            data-action="request_user_location" data-nav-to="atm_locator_main"
            aria-label="Use my location" title="Use my location">
      <span class="material-icons" aria-hidden="true">my_location</span>
    </button>
  </div>

  <!-- Results header -->
  <p class="results-header" data-component-type="text" data-component-id="nearby_results_header"
     role="heading" aria-level="2">5 ATMs near you</p>

  <!-- ATM result 1 — HSBC UK Canary Wharf (expanded with full detail) -->
  <article class="atm-card" tabindex="0" role="listitem"
           data-component-type="box" data-component-id="atm_result_kcb_westlands"
           data-action="select_atm" data-nav-to="atm_locator_main"
           aria-label="HSBC UK Canary Wharf ATM, 320 m away. Tap to collapse details.">
    <div class="atm-card-summary">
      <div class="atm-card-info">
        <div class="atm-name" data-component-type="text" data-component-id="atm_kcb_name">HSBC UK Canary Wharf</div>
        <div class="atm-hours" data-component-type="text" data-component-id="atm_kcb_hours">Open 24 hours</div>
      </div>
      <span class="dist-badge" data-component-type="badge" data-component-id="atm_kcb_distance"
            aria-label="320 metres away">320 m</span>
    </div>
    <div class="atm-detail">
      <div class="atm-address" data-component-type="text" data-component-id="atm_kcb_address">
        8 Canada Square, London, E14 5HQ
      </div>
      <div class="chip-row">
        <span class="chip chip-accessible"
              data-component-type="chip" data-component-id="atm_kcb_accessible_chip"
              aria-label="Wheelchair accessible">
          <span class="material-icons" aria-hidden="true">accessible</span>Accessible
        </span>
        <span class="chip chip-deposits"
              data-component-type="chip" data-component-id="atm_kcb_deposits_chip"
              aria-label="Audio cash machine">
          <span class="material-icons" aria-hidden="true">headphones</span>Audio
        </span>
      </div>
      <button class="dir-btn"
              data-component-type="button" data-component-id="atm_kcb_directions"
              data-action="open_directions" data-nav-to="atm_locator_main"
              aria-label="Get directions to HSBC UK Canary Wharf ATM">
        <span class="material-icons" aria-hidden="true">navigation</span>Directions
      </button>
    </div>
  </article>

  <!-- ATM result 2 — HSBC UK Oxford Street -->
  <article class="atm-card" tabindex="0" role="listitem"
           data-component-type="box" data-component-id="atm_result_equity_cbd"
           data-action="select_atm" data-nav-to="atm_locator_main"
           aria-label="HSBC UK Oxford Street ATM, 1.2 km away. Tap to expand details.">
    <div class="atm-card-summary">
      <div class="atm-card-info">
        <div class="atm-name" data-component-type="text" data-component-id="atm_equity_name">HSBC UK Oxford Street</div>
        <div class="atm-hours" data-component-type="text" data-component-id="atm_equity_hours">Open 24 hours</div>
      </div>
      <span class="dist-badge" data-component-type="badge" data-component-id="atm_equity_distance"
            aria-label="1.2 kilometres away">1.2 km</span>
    </div>
  </article>

  <!-- ATM result 3 — HSBC UK King's Cross -->
  <article class="atm-card" tabindex="0" role="listitem"
           data-component-type="box" data-component-id="atm_result_coop_karen"
           data-action="select_atm" data-nav-to="atm_locator_main"
           aria-label="HSBC UK King's Cross ATM, 6.4 km away. Tap to expand details.">
    <div class="atm-card-summary">
      <div class="atm-card-info">
        <div class="atm-name" data-component-type="text" data-component-id="atm_coop_name">HSBC UK King's Cross</div>
        <div class="atm-hours" data-component-type="text" data-component-id="atm_coop_hours">Open 24 hours</div>
      </div>
      <span class="dist-badge" data-component-type="badge" data-component-id="atm_coop_distance"
            aria-label="6.4 kilometres away">6.4 km</span>
    </div>
  </article>

</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
