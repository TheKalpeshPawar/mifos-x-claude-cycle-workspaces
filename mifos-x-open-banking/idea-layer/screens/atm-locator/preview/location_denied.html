<!doctype html>
<html lang="en" data-screen="atm-locator" data-state="location_denied">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM Locator — Location Denied</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--outline-variant); padding: 14px 16px; }
    .top-bar-left { display: flex; align-items: center; gap: 8px; }
    .back-btn { background: none; border: none; color: var(--on-surface); cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .screen-title { font-size: 18px; font-weight: 600; color: var(--on-surface); }
    /* Greyed map placeholder */
    .map-area { flex: 0 0 260px; background: #D0D8C8; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .map-grid { position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.04) 0, rgba(0,0,0,0.04) 1px, transparent 1px, transparent 40px), repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0, rgba(0,0,0,0.04) 1px, transparent 1px, transparent 40px); }
    .map-blocked-msg { background: rgba(255,255,255,0.85); border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2; }
    .map-blocked-msg .material-icons { font-size: 32px; color: var(--outline); }
    .map-blocked-text { font-size: 13px; color: var(--on-surface-variant); font-weight: 500; }
    /* Bottom prompt card */
    .prompt-card { flex: 1; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .location-icon-ring { width: 72px; height: 72px; border-radius: 50%; background: #FFF8E7; border: 2px solid var(--warning); display: flex; align-items: center; justify-content: center; }
    .location-icon-ring .material-icons { font-size: 36px; color: var(--warning); }
    .prompt-title { font-size: 20px; font-weight: 700; color: var(--on-surface); }
    .prompt-sub { font-size: 14px; color: var(--on-surface-variant); line-height: 1.6; }
    .steps-card { background: var(--surface); border-radius: 12px; padding: 14px 16px; width: 100%; border: 1px solid var(--outline-variant); text-align: left; }
    .step-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--primary-container); color: var(--primary); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-text { font-size: 13px; color: var(--on-surface-variant); }
    .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 15px; width: 100%; font-size: 15px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; }
    .btn-text { background: none; border: none; color: var(--secondary); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div class="top-bar" data-component-type="top_app_bar" data-component-id="atm_top_bar">
    <div class="top-bar-left">
      <button class="back-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <span class="screen-title">ATM Locator</span>
    </div>
    <button class="back-btn" data-action="open_filter" aria-label="Filter ATMs" tabindex="0">
      <span class="material-icons" aria-hidden="true">tune</span>
    </button>
  </div>

  <div class="map-area" role="img" aria-label="Map unavailable — location access required"
       data-component-type="image" data-component-id="atm_map_area">
    <div class="map-grid" aria-hidden="true"></div>
    <div class="map-blocked-msg">
      <span class="material-icons" aria-hidden="true">location_off</span>
      <span class="map-blocked-text">Location access denied</span>
    </div>
  </div>

  <main class="prompt-card" data-component-type="stack" data-component-id="location_denied_state">

    <div class="location-icon-ring" aria-hidden="true">
      <span class="material-icons">location_off</span>
    </div>

    <h1 class="prompt-title" data-component-type="text" data-component-id="denied_title">Enable Location Access</h1>

    <p class="prompt-sub" data-component-type="text" data-component-id="denied_sub">
      To find ATMs near you, the app needs permission to access your device location.
    </p>

    <div class="steps-card" data-component-type="box" data-component-id="denied_steps_card">
      <div class="step-row">
        <div class="step-num">1</div>
        <span class="step-text">Open your device Settings</span>
      </div>
      <div class="step-row">
        <div class="step-num">2</div>
        <span class="step-text">Find "Mifos" in App Permissions</span>
      </div>
      <div class="step-row">
        <div class="step-num">3</div>
        <span class="step-text">Enable "Location" → "While using app"</span>
      </div>
    </div>

    <button class="btn-primary"
            data-component-type="button" data-component-id="open_settings_button"
            data-action="open_device_settings" aria-label="Open device settings to enable location" tabindex="0">
      <span class="material-icons" aria-hidden="true">settings</span>
      Open Settings
    </button>

    <button class="btn-text"
            data-component-type="button" data-component-id="search_manually_button"
            data-action="search_atm_manually" aria-label="Search for ATMs by city or postcode" tabindex="0">
      Search by City or Postcode
    </button>

  </main>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
