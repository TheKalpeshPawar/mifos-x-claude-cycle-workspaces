<!doctype html>
<!-- render-hash: atm-locator-location_denied-provisional -->
<html lang="en" data-screen="atm-locator" data-state="location_denied" data-feature="atm-locator" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ATM — Location Denied</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; } .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; width: 100%; } .top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; }
    .denied-icon { width: 80px; height: 80px; border-radius: 40px; background: var(--surface-variant); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; } .denied-icon .material-icons { font-size: var(--icon-xl); color: var(--warning); }
    .denied-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; } .denied-msg { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; margin-bottom: 24px; }
    .enable-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 14px 32px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .search-link { font-size: 14px; font-weight: 600; color: var(--primary); cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>ATM & Branches</h1></div><main>
