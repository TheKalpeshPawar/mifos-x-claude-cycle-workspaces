<!doctype html>
<!-- render-hash: f2c4e7a1b6d8 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Find HSBC ATM — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    /* ── Design Tokens: Light ───────────────────────────────────────── */
    :root {
      --color-primary: #266489;
      --color-on-primary: #FFFFFF;
      --color-primary-container: #C9E6FF;
      --color-on-primary-container: #004B6F;
      --color-secondary: #50606E;
      --color-on-secondary: #FFFFFF;
      --color-secondary-container: #D3E5F5;
      --color-on-secondary-container: #384956;
      --color-error: #BA1A1A;
      --color-on-error: #FFFFFF;
      --color-error-container: #FFDAD6;
      --color-on-error-container: #93000A;
      --color-background: #F7F9FF;
      --color-on-background: #181C20;
      --color-surface: #F7F9FF;
      --color-on-surface: #181C20;
      --color-surface-variant: #DDE3EA;
      --color-on-surface-variant: #41474D;
      --color-surface-container-lowest: #FFFFFF;
      --color-surface-container-low: #F1F4F9;
      --color-surface-container: #EBEEF3;
      --color-surface-container-high: #E5E8ED;
      --color-surface-container-highest: #E0E3E8;
      --color-outline: #72787E;
      --color-outline-variant: #C1C7CE;
      /* Typography */
      --fs-title-large: 1.375rem;
      --fw-title-large: 400;
      --lh-title-large: 1.75rem;
      --fs-body-large: 1rem;
      --fw-body-large: 400;
      --fs-label-medium: 0.75rem;
      --fw-label-medium: 500;
      --lh-label-medium: 1rem;
      --fs-label-large: 0.875rem;
      --fw-label-large: 500;
      /* Shape / Spacing */
      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-large: 16px;
      --radius-extra-large: 28px;
      --radius-full: 9999px;
      --spacing-4: 4px;
      --spacing-8: 8px;
      --spacing-12: 12px;
      --spacing-16: 16px;
      --spacing-24: 24px;
      --min-touch: 48px;
      /* Skeleton / Progress */
      --shimmer-base: #E0E3E8;
      --shimmer-highlight: #F1F4F9;
      /* Motion */
      --motion-duration-medium: 300ms;
      --motion-easing-standard: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    /* ── Design Tokens: Dark ────────────────────────────────────────── */
    [data-theme="dark"] {
      --color-primary: #95CDF7;
      --color-on-primary: #00344E;
      --color-primary-container: #004B6F;
      --color-on-primary-container: #C9E6FF;
      --color-secondary: #B7C9D9;
      --color-on-secondary: #22323F;
      --color-secondary-container: #384956;
      --color-on-secondary-container: #D3E5F5;
      --color-error: #FFB4AB;
      --color-on-error: #690005;
      --color-error-container: #93000A;
      --color-on-error-container: #FFDAD6;
      --color-background: #101417;
      --color-on-background: #E0E3E8;
      --color-surface: #101417;
      --color-on-surface: #E0E3E8;
      --color-surface-variant: #41474D;
      --color-on-surface-variant: #C1C7CE;
      --color-surface-container-lowest: #0B0F12;
      --color-surface-container-low: #181C20;
      --color-surface-container: #1C2024;
      --color-surface-container-high: #262A2E;
      --color-surface-container-highest: #313539;
      --color-outline: #8B9198;
      --color-outline-variant: #41474D;
      --shimmer-base: #262A2E;
      --shimmer-highlight: #313539;
    }

    /* ── Global Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--color-background);
      color: var(--color-on-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      user-select: none;
    }

    /* ── Top App Bar ────────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 8;
      background-color: var(--color-surface);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--spacing-4);
      gap: var(--spacing-4);
      border-bottom: 1px solid var(--color-outline-variant);
    }

    .top-app-bar__nav-btn {
      width: var(--min-touch);
      height: var(--min-touch);
      border: none;
      background: transparent;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-on-surface);
      flex-shrink: 0;
    }

    .top-app-bar__title {
      flex: 1;
      font-size: var(--fs-title-large);
      font-weight: var(--fw-title-large);
      line-height: var(--lh-title-large);
      color: var(--color-on-surface);
    }

    /* ── Linear Progress ────────────────────────────────────────────── */
    .linear-progress {
      width: 100%;
      height: 4px;
      background-color: var(--color-primary-container);
      overflow: hidden;
      position: relative;
    }

    .linear-progress__track {
      position: absolute;
      inset: 0;
      background-color: var(--color-primary);
      transform-origin: left center;
      animation: linear-progress-indeterminate 2s infinite linear;
    }

    @keyframes linear-progress-indeterminate {
      0%   { transform: scaleX(0.1) translateX(-100%); }
      50%  { transform: scaleX(0.6) translateX(100%); }
      100% { transform: scaleX(0.1) translateX(300%); }
    }

    /* ── Screen Content ─────────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ── Skeleton Search Field (mirrors content layout) ─────────────── */
    .skeleton-search {
      margin: var(--spacing-12) var(--spacing-16) 0;
      height: 56px;
      border-radius: var(--radius-extra-large);
      background-color: var(--shimmer-base);
      animation: shimmer 1.4s infinite;
    }

    /* ── Skeleton Chip Row ──────────────────────────────────────────── */
    .skeleton-chips {
      display: flex;
      gap: var(--spacing-8);
      padding: var(--spacing-12) var(--spacing-16) 0;
    }

    .skeleton-chip {
      height: 32px;
      width: 72px;
      border-radius: var(--radius-full);
      background-color: var(--shimmer-base);
      animation: shimmer 1.4s infinite;
      flex-shrink: 0;
    }
    .skeleton-chip:nth-child(2) { animation-delay: 0.1s; width: 96px; }
    .skeleton-chip:nth-child(3) { animation-delay: 0.2s; width: 110px; }

    /* ── Skeleton Count ─────────────────────────────────────────────── */
    .skeleton-count {
      margin: var(--spacing-12) var(--spacing-16) var(--spacing-8);
      height: 16px;
      width: 100px;
      border-radius: var(--radius-small);
      background-color: var(--shimmer-base);
      animation: shimmer 1.4s infinite;
    }

    /* ── Skeleton ATM Cards ─────────────────────────────────────────── */
    .skeleton-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-8);
      padding: 0 var(--spacing-16);
    }

    .skeleton-card {
      background-color: var(--color-surface-container-low);
      border-radius: var(--radius-medium);
      padding: var(--spacing-16);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-8);
      box-shadow: 0 1px 2px color-mix(in srgb, var(--color-on-surface) 8%, transparent);
    }

    .skeleton-line {
      height: 16px;
      border-radius: var(--radius-small);
      background-color: var(--shimmer-base);
      animation: shimmer 1.4s infinite;
    }
    .skeleton-line--title { width: 60%; height: 20px; }
    .skeleton-line--distance { width: 20%; height: 14px; }
    .skeleton-line--address { width: 85%; height: 14px; animation-delay: 0.05s; }
    .skeleton-line--chip { width: 80px; height: 28px; border-radius: var(--radius-full); }

    .skeleton-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--spacing-8);
    }

    .skeleton-card__chips {
      display: flex;
      gap: var(--spacing-4);
    }

    .skeleton-card:nth-child(2) .skeleton-line { animation-delay: 0.15s; }
    .skeleton-card:nth-child(3) .skeleton-line { animation-delay: 0.3s; }
    .skeleton-card:nth-child(4) .skeleton-line { animation-delay: 0.45s; }

    @keyframes shimmer {
      0%   { background-color: var(--shimmer-base); }
      50%  { background-color: var(--shimmer-highlight); }
      100% { background-color: var(--shimmer-base); }
    }

    /* ── Bottom Navigation ──────────────────────────────────────────── */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 8;
      background-color: var(--color-surface-container);
      display: flex;
      align-items: center;
      height: 80px;
      border-top: 1px solid var(--color-outline-variant);
      padding: 0 var(--spacing-4);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-4);
      padding: var(--spacing-12) 0 var(--spacing-8);
      min-height: var(--min-touch);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-on-surface-variant);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-medium);
      font-weight: var(--fw-label-medium);
      text-decoration: none;
    }
    .bottom-nav__icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
    }
    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      font-weight: var(--fw-label-medium);
    }
  </style>
</head>
