<!doctype html>

<html lang="en" data-screen="atm-locator" data-state="loading" data-feature="atm-locator" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATM &amp; Branch Locator — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    --skel-base: #E1E4D5; --skel-hi: #F0F3E8;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    --skel-base: #2A2D24; --skel-hi: #353830;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
      --skel-base: #2A2D24; --skel-hi: #353830;
    }
  }
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position: 600px 0; }
  }
  .skel {
    background: linear-gradient(90deg, var(--skel-base) 25%, var(--skel-hi) 50%, var(--skel-base) 75%);
    background-size: 1200px 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: 6px;
    display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  .top-bar {
    display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px;
  }
  .icon-btn {
    width: 40px; height: 40px; min-height: 44px; min-width: 44px;
    border-radius: 20px; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--on-surface-variant); cursor: default;
  }
  .page-title {
    font-size: 22px; font-weight: 700; color: var(--primary);
    padding: 8px 16px 12px;
  }
  .map-placeholder {
    width: 100%; height: 200px;
  }
  .search-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 4px;
  }
  .search-skel { height: 46px; border-radius: 12px; flex: 1; }
  .icon-skel { width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; }
  .results-header-skel { height: 15px; width: 130px; border-radius: 6px; margin: 12px 16px 8px; }
  .atm-card {
    background: var(--surface);
    border-radius: 12px;
    margin: 4px 16px;
    padding: 16px;
    box-shadow: var(--shadow-1);
  }
  .card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .name-skel { height: 15px; flex: 1; max-width: 60%; border-radius: 5px; }
  .dist-skel { height: 22px; width: 54px; border-radius: 8px; margin-left: auto; }
  .hours-skel { height: 12px; width: 38%; border-radius: 5px; margin-bottom: 8px; }
  .addr-skel { height: 12px; width: 75%; border-radius: 5px; }
</style>
</head>
<body>

    <button class="icon-btn" aria-label="Go back" disabled>
      <span class="material-icons" aria-hidden="true">arrow_back</span>

  <h1 class="page-title" data-component-type="text" data-component-id="atm_locator_title">ATM &amp; Branches</h1>

  <!-- Map skeleton -->

  <!-- Search row skeleton -->
  <div class="search-row" data-component-type="LayoutBox" data-component-id="atm_search_row" aria-hidden="true">
    <span class="search-skel skel"></span>
    <span class="icon-skel skel"></span>
  </div>

  <!-- Section header skeleton -->
  <span class="results-header-skel skel" data-component-type="LayoutBox" data-component-id="nearby_results_header"
        aria-hidden="true"></span>

  <!-- ATM card skeleton 1 -->
  <div class="atm-card" data-component-type="LayoutBox" data-component-id="atm_result_kcb_westlands" aria-hidden="true">
    <div class="card-row">
      <span class="name-skel skel" style="max-width:55%"></span>
      <span class="dist-skel skel"></span>
    </div>
    <span class="hours-skel skel" style="width:34%"></span>
    <span class="addr-skel skel" style="width:70%"></span>
  </div>

  <!-- ATM card skeleton 2 -->
  <div class="atm-card" data-component-type="LayoutBox" data-component-id="atm_result_equity_cbd" aria-hidden="true">
    <div class="card-row">
      <span class="name-skel skel" style="max-width:48%"></span>
      <span class="dist-skel skel"></span>
    </div>
    <span class="hours-skel skel" style="width:30%"></span>
    <span class="addr-skel skel" style="width:65%"></span>
  </div>

  <!-- ATM card skeleton 3 -->
  <div class="atm-card" data-component-type="LayoutBox" data-component-id="atm_result_coop_karen" aria-hidden="true">
    <div class="card-row">
      <span class="name-skel skel" style="max-width:43%"></span>
      <span class="dist-skel skel"></span>
    </div>
    <span class="hours-skel skel" style="width:38%"></span>
    <span class="addr-skel skel" style="width:60%"></span>
  </div>

</main>
