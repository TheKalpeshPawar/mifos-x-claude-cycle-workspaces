sibling: demo-data
schema_version: "4.0"
feature_id: atm-locator

# UNAUTHENTICATED OBIE Open Data v2.4.0 ATM Locator (OBOpenDataResponse envelope:
# meta + data[].Brand[].ATM[]). ATMs are flattened across data[].Brand[].ATM[] and de-duplicated
# by Identification client-side; great-circle distance + nearest-first sort are computed on-device
# from Location.PostalAddress.GeoLocation.GeographicCoordinates. Real-looking HSBC UK locations
# across London, Manchester and Edinburgh with valid UK postcodes. No token, no consent.
collections:
  opendata_atms:
    dto: OBOpenDataResponse
    description: "200 OK — HSBC UK ATM Locator reference data, OBIE Open Data envelope. Backs the on-mount load and SearchLocation."
    item:
      meta:
        LastUpdated: "2026-06-01T00:00:00+01:00"
        TotalResults: 5
        Agreement: "Use of the APIs and any related data is subject to the Open Licence at https://www.openbanking.org.uk/open-licence"
        License: "https://www.openbanking.org.uk/open-licence"
        TermsOfUse: "https://www.openbanking.org.uk/terms"
      data:
        - Brand:
            - BrandName: "HSBC UK"
              ATM:
                - Identification: "HSBC-ATM-LDN-001"
                  SupportedLanguages:
                    - "en"
                  ATMServices:
