sibling: data-flow
schema_version: "4.0"
feature_id: atm-locator
entries:
  - screen_id: atm-locator
    trigger: on_mount
    endpoints:
      - obp_get_atms
      - obp_get_branches
    direction: read
    dtos:
      - name: AtmLocation
        role: response
        api_id: obp_get_atms
      - name: Branch
        role: response
        api_id: obp_get_branches
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: empty_state
      - error_code: 500
        behavior: error_state

  - screen_id: atm-locator
    trigger: on_interact
    event: SearchLocation
    endpoints:
      - obp_get_atms
      - obp_get_branches
    direction: read
    dtos:
      - name: AtmLocation
        role: response
        api_id: obp_get_atms
      - name: Branch
        role: response
        api_id: obp_get_branches
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 500
        behavior: error_state
