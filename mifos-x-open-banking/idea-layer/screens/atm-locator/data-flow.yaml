sibling: data-flow
schema_version: "4.0"
feature_id: atm-locator
entries:
  - screen_id: atm-locator
    trigger: on_mount
    endpoints:
      - opendata_get_atms
      - opendata_get_branches
    direction: read
    dtos:
      - name: OpenDataAtm
        role: response
        api_id: opendata_get_atms
      - name: OpenDataBranch
        role: response
        api_id: opendata_get_branches
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 429
        behavior: error_state
      - error_code: 500
        behavior: error_state

  - screen_id: atm-locator
    trigger: on_interact
    event: SearchLocation
    endpoints:
      - opendata_get_atms
      - opendata_get_branches
    direction: read
    dtos:
      - name: OpenDataAtm
        role: response
        api_id: opendata_get_atms
      - name: OpenDataBranch
        role: response
        api_id: opendata_get_branches
    produces_state: content
    error_paths:
      - error_code: 429
        behavior: error_state
      - error_code: 500
        behavior: error_state
