screen_id: atm-locator

on_mount:
  - trigger: atms_load
    description: "Load HSBC Open Data ATM list (unauthenticated GET /atms). No AccountId or consent token required. Stores full list as allAtms; initialises filteredAtms = allAtms."
    steps:
      - call: atms
        store_as: allAtms
      - derive: filteredAtms
        from: allAtms
        apply: [search_predicate, service_filter_predicate]
        sort_by: distance_asc
    on_loading: loading
    on_success: content
    on_empty: empty     # API returned data[].atm empty list — distinct from active-filter empty
    on_error:
      # Typed error routing reflecting api.yaml errors block (enriched 2026-07-14)
      error_type_routing:
        - type: IOException
          trigger: "Ktorfit read/connect timeout (15s) or device offline"
          error_id: NetworkTimeout
          userMessage: "Could not reach HSBC Open Data. Check your connection."
          isRetriable: true
          state: error
        - type: "HttpException(5xx)"
          trigger: "HSBC Open Data returns HTTP 500-599"
          error_id: ServiceUnavailable
          userMessage: "HSBC Open Data service unavailable. Please try again."
          isRetriable: true
          state: error
        - type: "HttpException(4xx)"
          trigger: "Unexpected HTTP 400-499 from public endpoint (no auth — 401/403 not expected)"
          error_id: UnexpectedClientError
          userMessage: "Unexpected error from HSBC Open Data."
          isRetriable: false
          state: error

on_user_action:
  - trigger: search_atms
    description: "Client-side text filter: substring-match query against Name + PostCode on allAtms. Does NOT re-call the API."
    client_side: true
    steps:
      - filter: allAtms
        predicate: "it.Name.contains(query, ignoreCase=true) || it.PostCode.contains(query, ignoreCase=true)"
        store_as: filteredAtms
      - apply: service_filter_predicate
        to: filteredAtms
    on_empty: empty
    on_non_empty: content

  - trigger: toggle_filter_24h
    description: "Toggle is24h filter flag. Re-applies search + service predicates on allAtms client-side. No API call."
    client_side: true
    steps:
      - toggle: filterState.is24h
      - reapply: [search_predicate, service_filter_predicate]
        on: allAtms
        store_as: filteredAtms
    on_empty: empty
    on_non_empty: content

  - trigger: toggle_filter_wheelchair
    description: "Toggle hasWheelchairAccess filter flag. Client-side predicate re-apply."
    client_side: true
    steps:
      - toggle: filterState.hasWheelchairAccess
      - reapply: [search_predicate, service_filter_predicate]
        on: allAtms
        store_as: filteredAtms
    on_empty: empty
    on_non_empty: content

  - trigger: toggle_filter_deposit
    description: "Toggle hasCashDeposit filter flag. Client-side predicate re-apply."
    client_side: true
    steps:
      - toggle: filterState.hasCashDeposit
      - reapply: [search_predicate, service_filter_predicate]
        on: allAtms
        store_as: filteredAtms
    on_empty: empty
    on_non_empty: content

  - trigger: open_atm_directions
    description: "Open device native maps app via geo:{Latitude},{Longitude}?q={Name} (Android) or maps://?q={Name}&ll={Latitude},{Longitude} (iOS). Leaves the app via OS intent; no in-app navigation."
    client_side: true
    side_effects:
      - "OS geo: intent / maps:// URL scheme with item.Latitude, item.Longitude, item.Name"
    note: "expect/actual platform implementation; no state mutation in ViewModel."

  - trigger: retry_load
    description: "Re-triggers atms_load (same as on_mount). Resets filterState to all-off."
    re_runs: [atms_load]
