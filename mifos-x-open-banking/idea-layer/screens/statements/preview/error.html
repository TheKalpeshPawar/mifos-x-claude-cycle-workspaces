<!doctype html>
<!-- render-hash: 9d4e7f1b8a2c -->
<html lang="en" data-screen="statements" data-state="error">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Statements — Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    /* ── Design tokens — light scheme ──────────────────────────────── */
    :root {
      --color-primary: #266489;
      --color-on-primary: #FFFFFF;
      --color-primary-container: #C9E6FF;
      --color-on-primary-container: #004B6F;
      --color-secondary: #50606E;
      --color-on-secondary: #FFFFFF;
      --color-secondary-container: #D3E5F5;
      --color-on-secondary-container: #384956;
      --color-tertiary: #64597B;
      --color-tertiary-container: #EADDFF;
      --color-on-tertiary-container: #4C4162;
      --color-error: #BA1A1A;
      --color-on-error: #FFFFFF;
      --color-error-container: #FFDAD6;
      --color-on-error-container: #93000A;
      --color-background: #F7F9FF;
      --color-on-background: #181C20;
      --color-surface: #F7F9FF;
      --color-on-surface: #181C20;
      --color-surface-variant: #DDE3EA;
      --color-on-surface-variant: #41474D;
      --color-outline: #72787E;
      --color-outline-variant: #C1C7CE;
      --color-scrim: #000000;
      --color-inverse-primary: #95CDF7;
      --color-surface-container-lowest: #FFFFFF;
      --color-surface-container-low: #F1F4F9;
      --color-surface-container: #EBEEF3;
      --color-surface-container-high: #E5E8ED;
      --color-surface-container-highest: #E0E3E8;

      /* Shape */
      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-large: 16px;
      --radius-extra-large: 28px;
      --radius-full: 9999px;

      /* Spacing */
      --sp-4: 4px;
      --sp-8: 8px;
      --sp-12: 12px;
      --sp-16: 16px;
      --sp-24: 24px;
      --sp-48: 48px;

      /* Typography */
      --type-title-large: 22px;
      --type-headline-small: 24px;
      --type-body-large-size: 16px;
      --type-body-large-line: 24px;
      --type-body-medium-size: 14px;
      --type-body-medium-line: 20px;
      --type-label-large-size: 14px;
      --type-label-large-weight: 500;
      --type-label-medium-size: 12px;
      --type-label-medium-weight: 500;

      /* Motion */
      --motion-short: 150ms;
      --motion-easing: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    /* ── Dark scheme ────────────────────────────────────────────────── */
    [data-theme="dark"] {
      --color-primary: #95CDF7;
      --color-on-primary: #00344E;
      --color-primary-container: #004B6F;
      --color-on-primary-container: #C9E6FF;
      --color-secondary: #B7C9D9;
      --color-on-secondary: #22323F;
      --color-secondary-container: #384956;
      --color-on-secondary-container: #D3E5F5;
      --color-tertiary: #CFC0E8;
      --color-tertiary-container: #4C4162;
      --color-on-tertiary-container: #EADDFF;
      --color-error: #FFB4AB;
      --color-on-error: #690005;
      --color-error-container: #93000A;
      --color-on-error-container: #FFDAD6;
      --color-background: #101417;
      --color-on-background: #E0E3E8;
      --color-surface: #101417;
      --color-on-surface: #E0E3E8;
      --color-surface-variant: #41474D;
      --color-on-surface-variant: #C1C7CE;
      --color-outline: #8B9198;
      --color-outline-variant: #41474D;
      --color-scrim: #000000;
      --color-inverse-primary: #266489;
      --color-surface-container-lowest: #0B0F12;
      --color-surface-container-low: #181C20;
      --color-surface-container: #1C2024;
      --color-surface-container-high: #262A2E;
      --color-surface-container-highest: #313539;
    }

    /* ── Reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; background: var(--color-surface-container-highest); }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--color-background);
      color: var(--color-on-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 412px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Skip link ──────────────────────────────────────────────────── */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--color-primary);
      color: var(--color-on-primary);
      padding: var(--sp-8) var(--sp-16);
      z-index: 100;
      font-size: var(--type-body-medium-size);
      border-radius: var(--radius-small);
      text-decoration: none;
    }
    .skip-link:focus { top: 8px; }

    /* ── Material Symbols ───────────────────────────────────────────── */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Icon button ────────────────────────────────────────────────── */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: var(--radius-full);
      color: var(--color-on-surface);
      flex-shrink: 0;
      transition: background-color var(--motion-short) var(--motion-easing);
    }
    .icon-btn:hover  { background-color: var(--color-surface-container); }
    .icon-btn:active { background-color: var(--color-surface-container-high); }
    .icon-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* ── Top App Bar ────────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--color-surface-container-low);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--sp-4);
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .top-app-bar__title {
      flex: 1;
      font-size: var(--type-title-large);
      font-weight: 400;
      line-height: 28px;
      color: var(--color-on-surface);
      padding: 0 var(--sp-4);
    }

    /* ── Screen content ─────────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Error state ────────────────────────────────────────────────── */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-48) var(--sp-24);
      max-width: 320px;
    }

    .error-state__icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background-color: var(--color-error-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--sp-24);
    }

    .error-state__icon-wrap .material-symbols-outlined {
      font-size: 40px;
      color: var(--color-on-error-container);
    }

    .error-state__title {
      font-size: var(--type-headline-small);
      font-weight: 400;
      line-height: 32px;
      color: var(--color-on-surface);
      margin-bottom: var(--sp-8);
    }

    .error-state__body {
      font-size: var(--type-body-medium-size);
      line-height: var(--type-body-medium-line);
      color: var(--color-on-surface-variant);
      margin-bottom: var(--sp-24);
    }

    /* ── Filled button (Retry) ──────────────────────────────────────── */
    .btn-filled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      min-width: 48px;
      padding: 0 var(--sp-24);
      border: none;
      border-radius: var(--radius-full);
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      font-family: 'Roboto', sans-serif;
      font-size: var(--type-label-large-size);
      font-weight: var(--type-label-large-weight);
      line-height: 20px;
      cursor: pointer;
      transition: background-color var(--motion-short) var(--motion-easing);
      text-decoration: none;
    }
    .btn-filled:hover  { background-color: var(--color-on-primary-container); }
    .btn-filled:active { background-color: var(--color-primary-container); color: var(--color-on-primary-container); }
    .btn-filled:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* ── Bottom navigation ──────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 412px;
      height: 80px;
      background-color: var(--color-surface-container);
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      z-index: 20;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-top: 1px solid var(--color-outline-variant);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      padding: var(--sp-12) var(--sp-4) var(--sp-8);
      color: var(--color-on-surface-variant);
      border: none;
      background: transparent;
      flex: 1;
      transition: color var(--motion-short) var(--motion-easing);
    }
    .nav-item:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: -2px;
    }
    .nav-icon-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
    }
    .nav-item.active { color: var(--color-on-secondary-container); }
    .nav-item.active .nav-icon-pill {
      background-color: var(--color-secondary-container);
    }
    .nav-label {
      font-size: var(--type-label-medium-size);
      font-weight: var(--type-label-medium-weight);
      line-height: 16px;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ── Top App Bar ────────────────────────────────────────────────── -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn"
            aria-label="Navigate back to accounts list"
            data-action="navigate_back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Statements</h1>
  </header>

  <!-- ── Main content: error state ─────────────────────────────────── -->
  <main class="screen-content" role="main" id="main-content">
    <section class="error-state"
             aria-label="Could not load statements"
             role="alert"
             data-component-type="empty_state"
             data-component-id="error_state"
             data-component-variant="error">
      <div class="error-state__icon-wrap" aria-hidden="true">
        <span class="material-symbols-outlined">error_outline</span>
      </div>
      <h2 class="error-state__title">Could not load statements</h2>
      <p class="error-state__body">Session expired. Please re-authenticate.</p>
      <button class="btn-filled"
              aria-label="Retry loading statements"
              data-action="retry_load"
              data-component-type="button"
              data-component-id="retry_button"
              data-component-variant="filled">
        Retry
      </button>
    </section>
  </main>

  <!-- ── Bottom Navigation — Home·Accounts·Transactions·More (no active: sub-screen) ── -->
  <nav class="bottom-nav" aria-label="Main navigation" role="navigation">
    <button class="nav-item"
            aria-label="Home"
            data-nav-to="home">
      <div class="nav-icon-pill" aria-hidden="true">
        <span class="material-symbols-outlined">home</span>
      </div>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item"
            aria-label="Accounts"
            data-nav-to="accounts">
      <div class="nav-icon-pill" aria-hidden="true">
        <span class="material-symbols-outlined">account_balance</span>
      </div>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-item"
            aria-label="Transactions"
            data-nav-to="transactions">
      <div class="nav-icon-pill" aria-hidden="true">
        <span class="material-symbols-outlined">receipt_long</span>
      </div>
      <span class="nav-label">Transactions</span>
    </button>
    <button class="nav-item"
            aria-label="More"
            data-nav-to="settings">
      <div class="nav-icon-pill" aria-hidden="true">
        <span class="material-symbols-outlined">more_horiz</span>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
