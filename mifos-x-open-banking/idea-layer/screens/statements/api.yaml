screen_id: statements

endpoints:
  - id: statements
    method: GET
    path: "/accounts/{AccountId}/statements"
    response_dto: OBReadStatement2
    permission: ReadStatementsDetail
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns all statements for the account. Uses ReadStatementsDetail permission so StatementAmount (OpeningBalance, ClosingBalance) is included in each OBStatement2 record."

  - id: statement_file
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}/file"
    response_dto: null
    permission: ReadStatementsDetail
    requires_auth: true
    path_params:
      AccountId: string
      StatementId: string
    headers:
      Accept: "application/pdf, text/csv"
    notes: "Downloads the statement document as PDF or CSV. HSBC sandbox may return 501 Not Implemented for certain account types — surface as statements.download.toast_unavailable toast and do not retry automatically."
