<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>New Customer Onboarding — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
}
main{display:flex;flex-direction:column;min-height:844px;}

.stepper{background:var(--surface);border-bottom:1px solid var(--surface-variant);padding:16px 12px;}
.stepper-row{display:flex;align-items:center;justify-content:space-between;}
.step-circle{width:28px;height:28px;border-radius:14px;background:var(--surface-variant);flex-shrink:0;}
.step-line{flex:1;height:2px;margin:0 4px;background:var(--surface-variant);}

@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
.skel{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:8px;
}
.skel-label{height:14px;width:120px;margin:10px 16px 4px;border-radius:4px;}
.skel-field{height:48px;margin:0 16px 12px;border-radius:10px;}
.skel-nav{height:52px;border-radius:10px;flex:1;}

.nav-bar{background:var(--surface);border-top:1px solid var(--surface-variant);padding:16px;display:flex;gap:12px;margin-top:auto;}
</style>
</head>
<body>
<main data-screen="customer-onboarding" data-state="loading" role="main">

  <div class="stepper" aria-hidden="true">
    <div class="stepper-row">
      <div class="step-circle"></div>
      <div class="step-line"></div>
      <div class="step-circle"></div>
      <div class="step-line"></div>
      <div class="step-circle"></div>
      <div class="step-line"></div>
      <div class="step-circle"></div>
    </div>
  </div>

  <div class="skel skel-label" aria-hidden="true"></div>
  <div class="skel skel-field" aria-hidden="true"></div>
  <div class="skel skel-label" aria-hidden="true"></div>
  <div class="skel skel-field" aria-hidden="true"></div>
  <div class="skel skel-label" aria-hidden="true"></div>
  <div class="skel skel-field" aria-hidden="true"></div>
  <div class="skel skel-label" aria-hidden="true"></div>
  <div class="skel skel-field" aria-hidden="true"></div>

  <div class="nav-bar" aria-hidden="true">
    <div class="skel skel-nav"></div>
    <div class="skel skel-nav"></div>
  </div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
