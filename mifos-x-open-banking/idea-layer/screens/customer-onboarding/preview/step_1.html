<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Onboarding · Step 1</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:24px;color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:18px;font-weight:600;flex:1}

.step-label{font-size:11px;font-weight:700;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.5px;padding:0 20px}.step-title{font-size:22px;font-weight:700;letter-spacing:-0.3px;padding:6px 20px 4px}.step-sub{font-size:14px;color:var(--on-surface-variant);padding:0 20px 18px;line-height:1.5}

.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 14px}.row-2 .input{margin:0}
.actions{display:flex;gap:10px;padding:16px 20px 0}.btn{flex:1;padding:14px;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn-secondary{background:transparent;color:var(--primary);border:1px solid var(--outline)}.btn-primary{background:var(--primary);color:var(--on-primary);border:none}

<body><main>
<div class="top-bar"><span class="material-icons" data-nav-to="fo-dashboard" tabindex="0" aria-label="Close">close</span><h1>Customer onboarding</h1><span style="font-size:12px;color:var(--on-surface-variant);font-weight:600">1 / 4</span></div>
<div class="stepper"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="step-label">Step 1 of 4</div>
<h2 class="step-title">Personal details</h2>
<p class="step-sub">Capture the customer's identity as it appears on their ID document.</p>

<div class="field-label">Full legal name</div>
<div class="input"><span class="material-icons">person</span><input type="text" value="Sarah Achieng Otieno" aria-label="Full legal name" tabindex="0"></div>

<div class="row-2"><div><div class="field-label">Date of birth</div><div class="input"><input type="text" value="14 Feb 1992" aria-label="Date of birth" tabindex="0"></div></div><div><div class="field-label">Nationality</div><div class="input"><select aria-label="Nationality" tabindex="0"><option>Kenyan</option><option>Ugandan</option><option>British</option></select></div></div></div>
