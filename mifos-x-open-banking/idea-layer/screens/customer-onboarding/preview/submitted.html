<!doctype html>
<html lang="en" data-screen="customer-onboarding" data-state="submitted">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Onboarding — Created</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
      --secondary: #386663; --background: #F9FAEF;
      --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .top-app-bar { display: flex; align-items: center; background: var(--surface); padding: 0 4px; height: 64px; border-bottom: 1px solid var(--surface-variant); }
    .icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; color: var(--on-surface); background: none; border: none; }
    .bar-title { flex: 1; font-size: 20px; font-weight: 600; color: var(--on-surface); padding-left: 4px; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 48px; gap: 16px; text-align: center; }
    .success-icon-wrap { width: 96px; height: 96px; border-radius: 50%; background: var(--primary-container); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .success-icon-wrap .material-icons { font-size: 48px; color: var(--primary); }
    .success-title { font-size: 26px; font-weight: 700; color: var(--primary); }
    .success-sub { font-size: 15px; color: var(--on-surface-variant); line-height: 1.6; max-width: 300px; }
    .customer-card {
      background: var(--surface); border-radius: 12px; padding: 16px 20px; width: 100%;
      border: 1px solid var(--primary-container); display: flex; align-items: center; gap: 14px;
    }
    .customer-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--on-primary); flex-shrink: 0; }
    .customer-info { flex: 1; }
    .customer-name { font-size: 16px; font-weight: 700; color: var(--on-surface); }
    .customer-id { font-size: 12px; color: var(--outline); font-family: monospace; }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 52px; background: var(--primary); border: none; border-radius: 12px;
      color: var(--on-primary); font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outlined {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 48px; background: transparent; border: 1.5px solid var(--primary); border-radius: 12px;
      color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <span class="bar-title">New Customer</span>
  </header>

  <main data-component-type="stack" data-component-id="cust_onboard_submitted_root">
    <div class="success-icon-wrap" data-component-type="image" data-component-id="cust_success_icon"
         role="img" aria-label="Customer created successfully">
      <span class="material-icons" aria-hidden="true">person_add_alt_1</span>
    </div>

    <h1 class="success-title" data-component-type="text" data-component-id="cust_success_title">Customer Created</h1>

    <p class="success-sub" data-component-type="text" data-component-id="cust_success_sub">
      The customer profile has been created successfully. You can now proceed with KYC verification.
    </p>

    <div class="customer-card" data-component-type="box" data-component-id="cust_summary_card"
         role="group" aria-label="New customer summary">
      <div class="customer-avatar" data-component-type="box" data-component-id="cust_avatar" role="img" aria-label="Customer initials">PK</div>
      <div class="customer-info">
        <div class="customer-name" data-component-type="text" data-component-id="cust_name">Peter Kamau</div>
        <div class="customer-id" data-component-type="text" data-component-id="cust_id">ID: CUST-2026-04821</div>
      </div>
    </div>

    <button class="btn-primary"
            data-component-type="button" data-component-id="cust_view_profile_button"
            role="button" aria-label="View customer profile" tabindex="0"
            data-nav-to="customer-detail">View Customer Profile</button>

    <button class="btn-outlined"
            data-component-type="button" data-component-id="cust_add_another_button"
            role="button" aria-label="Add another customer" tabindex="0"
            data-nav-to="customer-search">Back to Search</button>
  </main>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
