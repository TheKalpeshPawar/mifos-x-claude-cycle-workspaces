<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:18px;font-weight:600;flex:1}
.stepper{display:flex;align-items:center;gap:6px;padding:0 20px 16px}.stepper .dot{flex:1;height:6px;border-radius:3px;background:var(--surface-variant)}.stepper .dot.active{background:var(--primary)}.stepper .dot.done{background:var(--primary-container)}
.step-label{font-size:11px;font-weight:700;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.5px;padding:0 20px}.step-title{font-size:22px;font-weight:700;letter-spacing:-0.3px;padding:6px 20px 4px}.step-sub{font-size:14px;color:var(--on-surface-variant);padding:0 20px 18px;line-height:1.5}
.selfie-frame{margin:0 20px 18px;aspect-ratio:1;background:linear-gradient(180deg,var(--secondary-container) 0%,var(--surface-variant) 100%);border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.selfie-oval{width:65%;aspect-ratio:0.8;background:radial-gradient(circle at center,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0) 70%);border:3px solid var(--primary);border-radius:50%/55%;display:flex;align-items:center;justify-content:center}.selfie-oval .material-icons{font-size:var(--icon-2xl);color:rgba(76,102,43,0.45)}.selfie-corners::before,.selfie-corners::after{content:'';position:absolute;width:36px;height:36px;border:3px solid var(--primary)}.selfie-corners::before{top:24px;left:24px;border-right:none;border-bottom:none;border-top-left-radius:8px}.selfie-corners::after{bottom:24px;right:24px;border-left:none;border-top:none;border-bottom-right-radius:8px}
.guidance{margin:0 20px 14px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}.g-row{display:flex;align-items:center;gap:10px;font-size:13px}.g-row .material-icons{font-size:var(--icon-sm);color:var(--primary)}

[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}.selfie-frame{background:linear-gradient(180deg,var(--secondary-container) 0%,#1E201A 100%)}}</style>

<body><main>
