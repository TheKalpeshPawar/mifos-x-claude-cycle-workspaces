<!doctype html>
<html lang="en" data-screen="customer-onboarding" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Customer Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .top-app-bar {
      display: flex; align-items: center;
      background: var(--surface); padding: 0 4px; height: 64px;
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--surface-variant);
    }
    .icon-btn {
      width: 48px; height: 48px; display: flex; align-items: center;
      justify-content: center; border-radius: 50%; cursor: pointer;
      color: var(--on-surface); background: none; border: none;
    }
    .bar-title { flex: 1; font-size: 20px; font-weight: 600; color: var(--on-surface); padding-left: 4px; }
    .screen-content { padding-bottom: 32px; }
    .stepper {
      display: flex; align-items: center;
      padding: 16px 12px; background: var(--surface);
      border-bottom: 1px solid var(--surface-variant);
    }
    .step-circle {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .step-done { background: var(--primary); color: var(--on-primary); }
    .step-active { background: var(--primary); color: var(--on-primary); }
    .step-inactive { background: var(--surface-variant); color: var(--outline); }
    .step-line-done { flex: 1; height: 2px; background: var(--primary); margin: 0 4px; }
    .step-line { flex: 1; height: 2px; background: var(--surface-variant); margin: 0 4px; }
    .step-label { font-size: 14px; color: var(--primary); padding: 12px 16px 4px; }
    .form-group { margin: 0 16px 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: 4px; }
    .required { color: var(--error); }
    .form-input, .form-select {
      width: 100%; padding: 14px 12px;
      border: 1.5px solid var(--outline-variant); border-radius: 8px;
      font-family: 'Outfit', sans-serif; font-size: 14px;
      color: var(--on-surface); background: var(--surface); outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--primary); }
    .phone-wrap { display: flex; gap: 0; }
    .phone-prefix {
      padding: 14px 12px; background: var(--surface-variant);
      border: 1.5px solid var(--outline-variant); border-right: none;
      border-radius: 8px 0 0 8px; font-size: 14px; font-weight: 600;
      color: var(--on-surface-variant); white-space: nowrap;
    }
    .phone-input {
      flex: 1; padding: 14px 12px;
      border: 1.5px solid var(--outline-variant); border-left: none;
      border-radius: 0 8px 8px 0;
      font-family: 'Outfit', sans-serif; font-size: 14px;
      color: var(--on-surface); background: var(--surface); outline: none;
    }
    .nav-row { display: flex; gap: 12px; padding: 16px; }
    .btn-back {
      flex: 1; padding: 14px;
      border: 1.5px solid var(--primary); border-radius: 8px;
      background: transparent; color: var(--primary);
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn-next {
      flex: 1; padding: 14px;
      background: var(--primary); border: none; border-radius: 8px;
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons">arrow_back</span>
    </button>
    <span class="bar-title">New Customer Onboarding</span>
  </header>

  <main class="screen-content" role="main">

    <!-- Progress stepper — showing step 2 (Address) as current, step 1 done -->
    <div data-component-type="box" data-component-id="progress_stepper" class="stepper"
      role="progressbar" aria-label="Onboarding progress stepper" aria-valuenow="2" aria-valuemin="1" aria-valuemax="4">
      <div data-component-type="box" data-component-id="step1_indicator" class="step-circle step-done" aria-label="Step 1 Personal Information — Completed">
        <span class="material-icons" style="font-size:14px;color:var(--on-primary);">check</span>
      </div>
      <div data-component-type="divider" data-component-id="step_connector_1" class="step-line-done" role="presentation"></div>
      <div data-component-type="box" data-component-id="step2_indicator" class="step-circle step-active" aria-label="Step 2 Address — Current">2</div>
      <div data-component-type="divider" data-component-id="step_connector_2" class="step-line" role="presentation"></div>
      <div data-component-type="box" data-component-id="step3_indicator" class="step-circle step-inactive" aria-label="Step 3 KYC — Upcoming">3</div>
      <div data-component-type="divider" data-component-id="step_connector_3" class="step-line" role="presentation"></div>
      <div data-component-type="box" data-component-id="step4_indicator" class="step-circle step-inactive" aria-label="Step 4 Review — Upcoming">4</div>
    </div>

    <p data-component-type="text" data-component-id="step_indicator_text" class="step-label"
      aria-label="Currently on step 2 of 4: Address Information">Step 2 of 4: Address Information</p>

    <!-- Step 2: Address fields (content state shows this step) -->
    <div data-component-type="input" data-component-id="street_input" class="form-group">
      <label class="form-label" for="street">Street Address</label>
      <input id="street" class="form-input" type="text" placeholder="123 Moi Avenue"
        data-action="focus_field" role="textbox" aria-label="Street address" tabindex="0">
    </div>

    <div data-component-type="input" data-component-id="city_input" class="form-group">
      <label class="form-label" for="city">City</label>
      <input id="city" class="form-input" type="text" placeholder="Nairobi"
        data-action="focus_field" role="textbox" aria-label="City" tabindex="0">
    </div>

    <div data-component-type="input" data-component-id="county_select" class="form-group">
      <label class="form-label" for="county">County</label>
      <select id="county" class="form-select" data-action="open_county_picker" aria-label="County selector, choose your county" tabindex="0">
        <option value="">Select county...</option>
        <option>Nairobi</option>
        <option>Mombasa</option>
        <option>Kisumu</option>
        <option>Nakuru</option>
        <option>Eldoret</option>
        <option>Nyeri</option>
        <option>Thika</option>
        <option>Kitale</option>
      </select>
    </div>

    <div data-component-type="input" data-component-id="postcode_input" class="form-group">
      <label class="form-label" for="postcode">Postcode</label>
      <input id="postcode" class="form-input" type="text" placeholder="00100"
        data-action="focus_field" role="textbox" aria-label="Postal code" tabindex="0">
    </div>

    <!-- Navigation buttons -->
    <div data-component-type="stack" data-component-id="nav_button_row" class="nav-row" aria-label="Navigation controls">
      <button data-component-type="button" data-component-id="back_button" class="btn-back"
        data-action="go_back" role="button" aria-label="Go back to previous step" tabindex="0">Back</button>
      <button data-component-type="button" data-component-id="next_button" class="btn-next"
        data-action="go_next" role="button" aria-label="Continue to next step" tabindex="0">Next</button>
    </div>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
