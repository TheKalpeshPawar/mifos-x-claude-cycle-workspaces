sibling: data-flow
schema_version: "4.0"
feature_id: customer-onboarding
entries:
  - screen_id: customer-onboarding
    trigger: on_interact
    event: ApplicationSubmitted
    endpoints:
      - obp_create_customer
    direction: write
    dtos:
      - name: Customer
        role: request
        api_id: obp_create_customer
    produces_state: submitting
    error_paths:
      - error_code: 400
        behavior: show_validation_error
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 500
        behavior: show_error_banner

  - screen_id: customer-onboarding
    trigger: on_interact
    event: StepAdvanced
    endpoints:
