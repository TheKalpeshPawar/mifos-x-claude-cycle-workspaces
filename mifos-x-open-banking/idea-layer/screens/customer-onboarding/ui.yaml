id: customer-onboarding
name: "New Customer Onboarding"
feature: customer-onboarding
flavor: fieldOfficer
status: enriched
quality_score: 80

screens:
  - id: customer-onboarding-main
    name: "New Customer Onboarding"
    archetype: form

components:
  - type: box
    id: progress_stepper
    style:
      layout: horizontal
      paddingVertical: 16
      paddingHorizontal: 12
      backgroundColor: "#FFFFFF"
      borderBottomWidth: 1
      borderBottomColor: "#E0E0E0"
    a11y:
      contentDescription: "Onboarding progress stepper"
      role: progressbar
    test_context:
      tag: progress_stepper
    components:
      - type: stack
        id: stepper_stack
        style:
          direction: horizontal
          justifyContent: space_between
          alignItems: center
          fillWidth: true
        components:
          - type: box
            id: step1_indicator
            style:
              backgroundColor: "#4CAF50"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 1 Personal Information — Completed"
            test_context:
              tag: step1_indicator
            components:
              - type: icon
                id: step1_check
                content: "check"
                style:
                  color: "#FFFFFF"
                  size: 16
                a11y:
                  contentDescription: "Completed"
                test_context:
                  tag: step1_check
          - type: divider
            id: step_connector_1
            style:
              direction: horizontal
              flex: 1
              height: 2
              backgroundColor: "#4CAF50"
              marginHorizontal: 4
            a11y:
              role: presentation
            test_context:
              tag: step_connector_1
          - type: box
            id: step2_indicator
            style:
              backgroundColor: "#1800B1"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 2 Address — Current"
            test_context:
              tag: step2_indicator
            components:
              - type: text
                id: step2_number
                content: "2"
                style:
                  color: "#FFFFFF"
                  textStyle: label_medium
                  weight: 700
                a11y:
                  contentDescription: "2"
                test_context:
                  tag: step2_number
          - type: divider
            id: step_connector_2
            style:
              direction: horizontal
              flex: 1
              height: 2
              backgroundColor: "#E0E0E0"
              marginHorizontal: 4
            a11y:
              role: presentation
            test_context:
              tag: step_connector_2
          - type: box
            id: step3_indicator
            style:
              backgroundColor: "#E0E0E0"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 3 KYC — Upcoming"
            test_context:
              tag: step3_indicator
            components:
              - type: text
                id: step3_number
                content: "3"
                style:
                  color: "#999999"
                  textStyle: label_medium
                  weight: 700
                a11y:
                  contentDescription: "3"
                test_context:
                  tag: step3_number
          - type: divider
            id: step_connector_3
            style:
              direction: horizontal
              flex: 1
              height: 2
              backgroundColor: "#E0E0E0"
              marginHorizontal: 4
            a11y:
              role: presentation
            test_context:
              tag: step_connector_3
          - type: box
            id: step4_indicator
            style:
              backgroundColor: "#E0E0E0"
              borderRadius: 20
              width: 28
              height: 28
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Step 4 Review — Upcoming"
            test_context:
              tag: step4_indicator
            components:
              - type: text
                id: step4_number
                content: "4"
                style:
                  color: "#999999"
                  textStyle: label_medium
                  weight: 700
                a11y:
                  contentDescription: "4"
                test_context:
                  tag: step4_number

  - type: text
    id: step_indicator_text
    content: "Step 2 of 4: Address Information"
    style:
      textStyle: body_medium
      color: "#1800B1"
      paddingHorizontal: 16
      paddingTop: 12
      paddingBottom: 4
    a11y:
      contentDescription: "Currently on step 2 of 4: Address Information"
    test_context:
      tag: step_indicator_text

  # --- STEP 1: Personal Information fields ---
  - type: input
    id: first_name_input
    label: "First Name"
    style:
      variant: outlined
      inputType: text
      required: true
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: first_name_input
    a11y:
      contentDescription: "First Name, required"
      role: textField
    test_context:
      tag: first_name_input
      assertRequired: true

  - type: input
    id: last_name_input
    label: "Last Name"
    style:
      variant: outlined
      inputType: text
      required: true
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: last_name_input
    a11y:
      contentDescription: "Last Name, required"
      role: textField
    test_context:
      tag: last_name_input
      assertRequired: true

  - type: input
    id: dob_input
    label: "Date of Birth (DD/MM/YYYY)"
    style:
      variant: outlined
      inputType: text
      placeholder: "14/03/1985"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: open_date_picker
      target: dob_input
    a11y:
      contentDescription: "Date of Birth in day month year format"
      role: textField
    test_context:
      tag: dob_input

  - type: input
    id: national_id_input
    label: "National ID Number"
    style:
      variant: outlined
      inputType: text
      required: true
      placeholder: "KE12345678"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: national_id_input
    a11y:
      contentDescription: "National ID Number, required"
      role: textField
    test_context:
      tag: national_id_input
      assertRequired: true

  - type: input
    id: phone_input
    label: "Mobile Phone"
    style:
      variant: outlined
      inputType: text
      prefix: "+254"
      placeholder: "722 123 456"
      required: true
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: phone_input
    a11y:
      contentDescription: "Mobile phone number with Kenya country code +254"
      role: textField
    test_context:
      tag: phone_input

  - type: input
    id: email_input
    label: "Email Address"
    style:
      variant: outlined
      inputType: email
      placeholder: "john.mwangi@gmail.com"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: email_input
    a11y:
      contentDescription: "Email address, optional"
      role: textField
    test_context:
      tag: email_input

  # --- STEP 2: Address ---
  - type: input
    id: street_input
    label: "Street Address"
    style:
      variant: outlined
      inputType: text
      placeholder: "123 Moi Avenue"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: street_input
    a11y:
      contentDescription: "Street address"
      role: textField
    test_context:
      tag: street_input

  - type: input
    id: city_input
    label: "City"
    style:
      variant: outlined
      inputType: text
      placeholder: "Nairobi"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: city_input
    a11y:
      contentDescription: "City"
      role: textField
    test_context:
      tag: city_input

  - type: input
    id: county_select
    label: "County"
    style:
      variant: outlined
      inputType: select
      options:
        - "Nairobi"
        - "Mombasa"
        - "Kisumu"
        - "Nakuru"
        - "Eldoret"
        - "Nyeri"
        - "Thika"
        - "Kitale"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: open_county_picker
      target: county_select
    a11y:
      contentDescription: "County selector, choose your county"
      role: spinner
    test_context:
      tag: county_select

  - type: input
    id: postcode_input
    label: "Postcode"
    style:
      variant: outlined
      inputType: text
      placeholder: "00100"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: focus_field
      target: postcode_input
    a11y:
      contentDescription: "Postal code"
      role: textField
    test_context:
      tag: postcode_input

  # --- STEP 3: KYC Documents ---
  - type: input
    id: id_type_select
    label: "ID Document Type"
    style:
      variant: outlined
      inputType: select
      options:
        - "National ID"
        - "Passport"
        - "Driver's License"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: open_id_type_picker
      target: id_type_select
    a11y:
      contentDescription: "Select ID document type"
      role: spinner
    test_context:
      tag: id_type_select

  - type: button
    id: upload_id_front_button
    label: "Upload ID — Front Side"
    style:
      variant: outlined
      icon: camera
      borderColor: "#1800B1"
      textColor: "#1800B1"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: upload_document
      target: id_front
    a11y:
      contentDescription: "Upload front side of identity document"
      role: button
    test_context:
      tag: upload_id_front_button
      assertClickable: true

  - type: button
    id: upload_id_back_button
    label: "Upload ID — Back Side"
    style:
      variant: outlined
      icon: camera
      borderColor: "#1800B1"
      textColor: "#1800B1"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: upload_document
      target: id_back
    a11y:
      contentDescription: "Upload back side of identity document"
      role: button
    test_context:
      tag: upload_id_back_button
      assertClickable: true

  - type: button
    id: capture_selfie_button
    label: "Capture Selfie / Liveness Check"
    style:
      variant: outlined
      icon: face
      borderColor: "#008B8B"
      textColor: "#008B8B"
      marginHorizontal: 16
      marginBottom: 12
      fillWidth: true
    on_click:
      action: capture_selfie
      target: liveness_check
    a11y:
      contentDescription: "Capture selfie for liveness verification"
      role: button
    test_context:
      tag: capture_selfie_button
      assertClickable: true

  # --- STEP 4: Review ---
  - type: box
    id: review_summary_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 12
      padding: 16
      marginHorizontal: 16
      marginBottom: 16
      elevation: 2
    a11y:
      contentDescription: "Application summary review card"
    test_context:
      tag: review_summary_card
    components:
      - type: text
        id: review_name
        content: "John Kamau Mwangi"
        style:
          textStyle: title_medium
          color: "#1A1A1A"
          weight: 600
          marginBottom: 4
        a11y:
          contentDescription: "Applicant name: John Kamau Mwangi"
        test_context:
          tag: review_name
      - type: text
        id: review_id
        content: "National ID: KE12345678"
        style:
          textStyle: body_medium
          color: "#666666"
          marginBottom: 2
        a11y:
          contentDescription: "National ID KE12345678"
        test_context:
          tag: review_id
      - type: text
        id: review_phone
        content: "Phone: +254 722 123 456"
        style:
          textStyle: body_medium
          color: "#666666"
          marginBottom: 2
        a11y:
          contentDescription: "Phone +254 722 123 456"
        test_context:
          tag: review_phone
      - type: text
        id: review_address
        content: "123 Moi Avenue, Nairobi, 00100"
        style:
          textStyle: body_medium
          color: "#666666"
        a11y:
          contentDescription: "Address 123 Moi Avenue Nairobi"
        test_context:
          tag: review_address

  - type: button
    id: submit_button
    label: "Submit Application"
    style:
      variant: filled
      backgroundColor: "#1800B1"
      textColor: "#FFFFFF"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: submit
      target: kyc-review
    a11y:
      contentDescription: "Submit customer application"
      role: button
    test_context:
      tag: submit_button
      assertClickable: true

  # --- Navigation Buttons ---
  - type: stack
    id: nav_button_row
    style:
      direction: horizontal
      justifyContent: space_between
      paddingHorizontal: 16
      paddingVertical: 16
      gap: 12
    a11y:
      contentDescription: "Navigation controls"
    test_context:
      tag: nav_button_row
    components:
      - type: button
        id: back_button
        label: "Back"
        style:
          variant: outlined
          borderColor: "#1800B1"
          textColor: "#1800B1"
          flex: 1
        on_click:
          action: go_back
          target: previous_step
        a11y:
          contentDescription: "Go back to previous step"
          role: button
        test_context:
          tag: back_button
          assertClickable: true
      - type: button
        id: next_button
        label: "Next"
        style:
          variant: filled
          backgroundColor: "#1800B1"
          textColor: "#FFFFFF"
          flex: 1
        on_click:
          action: go_next
          target: next_step
        a11y:
          contentDescription: "Continue to next step"
          role: button
        test_context:
          tag: next_button
          assertClickable: true

states:
  step_1:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - first_name_input
        - last_name_input
        - dob_input
        - national_id_input
        - phone_input
        - email_input
        - nav_button_row
  step_2:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - street_input
        - city_input
        - county_select
        - postcode_input
        - nav_button_row
  step_3:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - id_type_select
        - upload_id_front_button
        - upload_id_back_button
        - capture_selfie_button
        - nav_button_row
  step_4:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - review_summary_card
        - submit_button
        - nav_button_row
  submitting:
    layout:
      scroll: vertical
      padding: 0
      showProgressOverlay: true
      overlayMessage: "Submitting application..."
  submitted:
    layout:
      scroll: vertical
      padding: 16
      showSuccessBanner: true
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: CustomerOnboardingViewModel
  state_fields:
    - name: currentStep
      type: Int
      default: "1"
    - name: personalInfo
      type: PersonalInfoDraft
    - name: addressInfo
      type: AddressDraft
    - name: kycDraft
      type: KycDraft
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: validationErrors
      type: "Map<String, String>"
      default: emptyMap
  errors:
    - SUBMIT_FAILED
    - VALIDATION_FAILED
    - UPLOAD_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - StepAdvanced
    - StepBacked
    - DocumentUploaded
    - SelfieCaptured
    - ApplicationSubmitted
  actions:
    - go_next
    - go_back
    - upload_document
    - capture_selfie
    - submit
    - open_date_picker
    - open_county_picker
  di:
    - CustomerRepository
    - DocumentUploadService
    - FormValidator

api:
  - id: obp_create_customer
    endpoint: "POST /obp/v5.0.0/banks/{bankId}/customers"
    tag: Customer
    description: "Step 1: Create customer record"
  - id: obp_customer_address
    endpoint: "POST /obp/v3.1.0/banks/{bankId}/customers/{customerId}/address"
    tag: Customer
    description: "Step 2: Add customer address (singular path)"
  - id: obp_tax_residence
    endpoint: "POST /obp/v3.1.0/banks/{bankId}/customers/{customerId}/tax-residence"
    tag: Customer
    description: "Step 3: Add tax residence"
  - id: obp_kyc_document
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_documents/{kycDocumentId}"
    tag: KYC
    description: "Step 4: Upload KYC document (caller-supplied ID)"
  - id: obp_kyc_check
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_check/{kycCheckId}"
    tag: KYC
    description: "Step 5: Record KYC check result"
  - id: obp_kyc_status
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_statuses"
    tag: KYC
    description: "Step 6: Set KYC status (no ID, appends)"
  - id: obp_customer_attribute
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/customers/{customerId}/attribute"
    tag: Customer-Attribute
    description: "Step 7: Add customer attribute (singular path!)"
  - id: obp_user_customer_link
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/user_customer_links"
    tag: Customer
    description: "Step 8: Link user to customer (underscore path)"
  - id: obp_account_application
    endpoint: "POST /obp/v3.1.0/banks/{bankId}/account-applications"
    tag: Account-Application
    description: "Step 9: Create account application"
  - id: obp_customer_account_link
    endpoint: "POST /obp/v5.0.0/banks/{bankId}/customer-account-links"
    tag: Customer
    description: "Step 10: Link customer to account (hyphen path)"

dependencies:
  tier: feature
  features:
    - kyc-review
    - customer-list
