approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []

screens:
  - id: customer-onboarding-main
    name: "New Customer Onboarding"
    archetype: form

archetype: form

components:
  - type: box
    id: progress_stepper
    style:
      layout: horizontal
      padding_vertical: spacing.md
      padding_horizontal: spacing.sm
      background: "#FFFFFF"
      border_bottom_width: 1
      border_bottom_color: "#E1E4D5"
    a11y:
      label: "Onboarding progress stepper"
      role: progressbar
    test_context:
      tag: progress_stepper
    children:
      - type: stack
        id: stepper_stack
        style:
          direction: horizontal
          justify_content: space_between
          align_items: center
          full_width: true
        children:
          - type: box
            id: step1_indicator
            style:
              background: "#4C662B"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 1 Personal Information — Completed"
            test_context:
              tag: step1_indicator
            children:
              - type: icon
                id: step1_check
                content: "check"
                style:
                  color: "#FFFFFF"
                  size: 16
                a11y:
                  label: "Completed"
                test_context:
                  tag: step1_check
          - type: divider
            id: step_connector_1
            style:
              direction: horizontal
              flex: 1
              height: 2
              background: "#4C662B"
              margin_horizontal: spacing.xs
            a11y:
              role: presentation
            test_context:
              tag: step_connector_1
          - type: box
            id: step2_indicator
            style:
              background: "#4C662B"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 2 Address — Current"
            test_context:
              tag: step2_indicator
            children:
              - type: text
                id: step2_number
                content: "2"
                style:
                  color: "#FFFFFF"
                  typography: "Outfit/label_medium"
                  font_weight: 700
                a11y:
                  label: "2"
                test_context:
                  tag: step2_number
          - type: divider
            id: step_connector_2
            style:
              direction: horizontal
              flex: 1
              height: 2
              background: "#E1E4D5"
              margin_horizontal: spacing.xs
            a11y:
              role: presentation
            test_context:
              tag: step_connector_2
          - type: box
            id: step3_indicator
            style:
              background: "#E1E4D5"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 3 KYC — Upcoming"
            test_context:
              tag: step3_indicator
            children:
              - type: text
                id: step3_number
                content: "3"
                style:
                  color: "#44483D"
                  typography: "Outfit/label_medium"
                  font_weight: 700
                a11y:
                  label: "3"
                test_context:
                  tag: step3_number
          - type: divider
            id: step_connector_3
            style:
              direction: horizontal
              flex: 1
              height: 2
              background: "#E1E4D5"
              margin_horizontal: spacing.xs
            a11y:
              role: presentation
            test_context:
              tag: step_connector_3
          - type: box
            id: step4_indicator
            style:
              background: "#E1E4D5"
              border_radius: 20
              width: 28
              height: 28
              align_items: center
              justify_content: center
            a11y:
              label: "Step 4 Review — Upcoming"
            test_context:
              tag: step4_indicator
            children:
              - type: text
                id: step4_number
                content: "4"
                style:
                  color: "#44483D"
                  typography: "Outfit/label_medium"
                  font_weight: 700
                a11y:
                  label: "4"
                test_context:
                  tag: step4_number

  - type: text
    id: step_indicator_text
    content: "Step 2 of 4: Address Information"
    style:
      typography: "Outfit/body_medium"
      color: "#4C662B"
      padding_horizontal: spacing.md
      padding_top: spacing.sm
      padding_bottom: spacing.xs
    a11y:
      label: "Currently on step 2 of 4: Address Information"
    test_context:
      tag: step_indicator_text

  # --- STEP 1: Personal Information fields ---
  - type: input
    id: first_name_input
    label: "First Name"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      required: true
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: first_name_input
    a11y:
      label: "First Name, required"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: first_name_input
      assert_required: true

  - type: input
    id: last_name_input
    label: "Last Name"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      required: true
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: last_name_input
    a11y:
      label: "Last Name, required"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: last_name_input
      assert_required: true

  - type: input
    id: dob_input
    label: "Date of Birth (DD/MM/YYYY)"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      placeholder: "14/03/1985"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: open_date_picker
      target: dob_input
    a11y:
      label: "Date of Birth in day month year format"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: dob_input

  - type: input
    id: national_id_input
    label: "National ID Number"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      required: true
      placeholder: "KE12345678"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: national_id_input
    a11y:
      label: "National ID Number, required"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: national_id_input
      assert_required: true

  - type: input
    id: phone_input
    label: "Mobile Phone"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      prefix: "+254"
      placeholder: "722 123 456"
      required: true
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: phone_input
    a11y:
      label: "Mobile phone number with Kenya country code +254"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: phone_input

  - type: input
    id: email_input
    label: "Email Address"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: email
      placeholder: "john.mwangi@gmail.com"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: email_input
    a11y:
      label: "Email address, optional"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: email_input

  # --- STEP 2: Address ---
  - type: input
    id: street_input
    label: "Street Address"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      placeholder: "123 Moi Avenue"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: street_input
    a11y:
      label: "Street address"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: street_input

  - type: input
    id: city_input
    label: "City"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      placeholder: "Nairobi"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: city_input
    a11y:
      label: "City"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: city_input

  - type: input
    id: county_select
    label: "County"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: select
      options:
        - "Nairobi"
        - "Mombasa"
        - "Kisumu"
        - "Nakuru"
        - "Eldoret"
        - "Nyeri"
        - "Thika"
        - "Kitale"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: open_county_picker
      target: county_select
    a11y:
      label: "County selector, choose your county"
      role: spinner
    keyboard:
      focusable: true
    test_context:
      tag: county_select

  - type: input
    id: postcode_input
    label: "Postcode"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: text
      placeholder: "00100"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: focus_field
      target: postcode_input
    a11y:
      label: "Postal code"
      role: textField
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: postcode_input

  # --- STEP 3: KYC Documents ---
  - type: input
    id: id_type_select
    label: "ID Document Type"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: select
      options:
        - "National ID"
        - "Passport"
        - "Driver's License"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
    on_click:
      action: open_id_type_picker
      target: id_type_select
    a11y:
      label: "Select ID document type"
      role: spinner
    keyboard:
      focusable: true
    test_context:
      tag: id_type_select

  - type: button
    id: upload_id_front_button
    label: "Upload ID — Front Side"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      icon: camera
      border_color: "#4C662B"
      text_color: "#4C662B"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: upload_document
      target: id_front
    a11y:
      label: "Upload front side of identity document"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_id_front_button
      assertClickable: true

  - type: button
    id: upload_id_back_button
    label: "Upload ID — Back Side"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      icon: camera
      border_color: "#4C662B"
      text_color: "#4C662B"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: upload_document
      target: id_back
    a11y:
      label: "Upload back side of identity document"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: upload_id_back_button
      assertClickable: true

  - type: button
    id: capture_selfie_button
    label: "Capture Selfie / Liveness Check"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      icon: face
      border_color: "#386663"
      text_color: "#386663"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: capture_selfie
      target: liveness_check
    a11y:
      label: "Capture selfie for liveness verification"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: capture_selfie_button
      assertClickable: true

  # --- STEP 4: Review ---
  - type: box
    id: review_summary_card
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding: 16
      margin_horizontal: spacing.md
      margin_bottom: spacing.md
      elevation: 2
    a11y:
      label: "Application summary review card"
    test_context:
      tag: review_summary_card
    children:
      - type: text
        id: review_name
        content: "John Kamau Mwangi"
        style:
          typography: "Outfit/title_medium"
          color: "#1A1C16"
          weight: 600
          margin_bottom: spacing.xs
        a11y:
          label: "Applicant name: John Kamau Mwangi"
        test_context:
          tag: review_name
      - type: text
        id: review_id
        content: "National ID: KE12345678"
        style:
          typography: "Outfit/body_medium"
          color: "#44483D"
          margin_bottom: 2
        a11y:
          label: "National ID KE12345678"
        test_context:
          tag: review_id
      - type: text
        id: review_phone
        content: "Phone: +254 722 123 456"
        style:
          typography: "Outfit/body_medium"
          color: "#44483D"
          margin_bottom: 2
        a11y:
          label: "Phone +254 722 123 456"
        test_context:
          tag: review_phone
      - type: text
        id: review_address
        content: "123 Moi Avenue, Nairobi, 00100"
        style:
          typography: "Outfit/body_medium"
          color: "#44483D"
        a11y:
          label: "Address 123 Moi Avenue Nairobi"
        test_context:
          tag: review_address

  - type: button
    id: submit_button
    label: "Submit Application"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: submit
      target: kyc-review
    a11y:
      label: "Submit customer application"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: submit_button
      assertClickable: true

  # --- Navigation Buttons ---
  - type: stack
    id: nav_button_row
    style:
      direction: horizontal
      justify_content: space_between
      padding_horizontal: spacing.md
      padding_vertical: spacing.md
      gap: 12
    a11y:
      label: "Navigation controls"
    test_context:
      tag: nav_button_row
    children:
      - type: button
        id: back_button
        label: "Back"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: outlined
          border_color: "#4C662B"
          text_color: "#4C662B"
          flex: 1
        on_click:
          action: go_back
          target: previous_step
        a11y:
          label: "Go back to previous step"
          role: button
        keyboard:
          focusable: true
        test_context:
          tag: back_button
          assert_clickable: true
      - type: button
        id: next_button
        label: "Next"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: filled
          background: "#4C662B"
          text_color: "#FFFFFF"
          flex: 1
        on_click:
          action: go_next
          target: next_step
        a11y:
          label: "Continue to next step"
          role: button
        keyboard:
          focusable: true
        test_context:
          tag: next_button
          assert_clickable: true

responsive:
  mobile_only: true
  baseline_width: 390

states:
  step_1:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - first_name_input
        - last_name_input
        - dob_input
        - national_id_input
        - phone_input
        - email_input
        - nav_button_row
  step_2:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - street_input
        - city_input
        - county_select
        - postcode_input
        - nav_button_row
  step_3:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - id_type_select
        - upload_id_front_button
        - upload_id_back_button
        - capture_selfie_button
        - nav_button_row
  step_4:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - review_summary_card
        - submit_button
        - nav_button_row
  loading:
    layout:
      scroll: vertical
      padding: 0
      showProgressOverlay: true
      overlayMessage: "Submitting application..."
  submitted:
    layout:
      scroll: vertical
      padding: 16
      showSuccessBanner: true
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true
  content:
    layout:
      scroll: vertical
      padding: 0
      showComponents:
        - progress_stepper
        - step_indicator_text
        - first_name_input
        - last_name_input
        - dob_input
        - national_id_input
        - phone_input
        - email_input
        - nav_button_row
  empty:
    layout:
      scroll: vertical
      padding: 16
      showEmptyState: true
      emptyStateIcon: person_off
      emptyStateMessage: "Customer onboarding unavailable. Contact support."

state_model:
  ViewModel: CustomerOnboardingViewModel
  state_fields:
    - name: currentStep
      type: Int
      default: "1"
    - name: personalInfo
      type: PersonalInfoDraft
    - name: addressInfo
      type: AddressDraft
    - name: kycDraft
      type: KycDraft
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: validationErrors
      type: "Map<String, String>"
      default: emptyMap
  errors:
    - SUBMIT_FAILED
    - VALIDATION_FAILED
    - UPLOAD_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - StepAdvanced
    - StepBacked
    - DocumentUploaded
    - SelfieCaptured
    - ApplicationSubmitted
  actions:
    - go_next
    - go_back
    - upload_document
    - capture_selfie
    - submit
    - open_date_picker
    - open_county_picker
  di:
    - CustomerRepository
    - DocumentUploadService
    - FormValidator

api:
  - id: obp_create_customer
    endpoint: "POST /obp/v5.0.0/banks/{bankId}/customers"
    tag: Customer
    description: "Step 1: Create customer record"
  - id: obp_customer_address
    endpoint: "POST /obp/v3.1.0/banks/{bankId}/customers/{customerId}/address"
    tag: Customer
    description: "Step 2: Add customer address (singular path)"
  - id: obp_tax_residence
    endpoint: "POST /obp/v3.1.0/banks/{bankId}/customers/{customerId}/tax-residence"
    tag: Customer
    description: "Step 3: Add tax residence"
  - id: obp_kyc_document
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_documents/{kycDocumentId}"
    tag: KYC
    description: "Step 4: Upload KYC document (caller-supplied ID)"
  - id: obp_kyc_check
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_check/{kycCheckId}"
    tag: KYC
    description: "Step 5: Record KYC check result"
  - id: obp_kyc_status
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_statuses"
    tag: KYC
    description: "Step 6: Set KYC status (no ID, appends)"
  - id: obp_customer_attribute
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/customers/{customerId}/attribute"
    tag: Customer-Attribute
    description: "Step 7: Add customer attribute (singular path!)"
  - id: obp_user_customer_link
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/user_customer_links"
    tag: Customer
    description: "Step 8: Link user to customer (underscore path)"
  - id: obp_account_application
    endpoint: "POST /obp/v3.1.0/banks/{bankId}/account-applications"
    tag: Account-Application
    description: "Step 9: Create account application"
  - id: obp_customer_account_link
    endpoint: "POST /obp/v5.0.0/banks/{bankId}/customer-account-links"
    tag: Customer
    description: "Step 10: Link customer to account (hyphen path)"

dependencies:
  tier: feature
  features:
    - kyc-review
    - customer-list
