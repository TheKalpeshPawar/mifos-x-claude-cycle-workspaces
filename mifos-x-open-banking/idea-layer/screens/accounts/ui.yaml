    a11y:
      role: button
      label: "Request a new account"
      hint: "Opens the account request form"
    keyboard:
      focusable: true
    test_context:
      tag: add_account_fab
      assert_clickable: true

states:
  loading:
    layout:
      components_visible:
        - accounts_header
        - account_type_tabs
      skeleton:
        - id: skeleton_card_1
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 120
            margin_horizontal: 20
            margin_bottom: 12
        - id: skeleton_card_2
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 120
            margin_horizontal: 20
            margin_bottom: 12
        - id: skeleton_card_3
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 120
            margin_horizontal: 20
            margin_bottom: 12

  content:
    layout:
      components_visible:
        - accounts_header
        - account_type_tabs
        - account_card_1
        - account_card_2
        - account_card_3
        - footer_divider
        - total_balance_footer
        - add_account_fab

  empty:
    layout:
      components_visible:
        - accounts_header
      empty_card:
        id: empty_state_card
        illustration: no_accounts
        title: "No accounts found"
        message: "You don't have any accounts matching this filter. Try a different category or request a new account."
        action_label: "Request Account"
        action: request_new_account

  error:
    layout:
      components_visible:
        - accounts_header
      error_card:
        id: error_state_card
        title: "Could not load accounts"
        message: "We were unable to fetch your account list. Please check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

state_model:
  view_model: AccountsViewModel
  screen_state: AccountsScreenState
  state_fields:
    - name: isLoading
      type: Boolean
      default: "true"
    - name: accounts
      type: "List<BankAccount>"
      default: "emptyList()"
    - name: filteredAccounts
      type: "List<BankAccount>"
      default: "emptyList()"
    - name: activeFilter
      type: AccountTypeFilter
      default: AccountTypeFilter.ALL
    - name: totalBalance
      type: "BigDecimal"
      default: "BigDecimal.ZERO"
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - id: network_error
      message: "Network unavailable. Please try again."
    - id: auth_error
      message: "Session expired. Please log in again."
  events:
    - RetryLoad
    - "FilterChanged(filter: AccountTypeFilter)"
    - "AccountSelected(accountId: String)"
    - RequestNewAccount
  actions:
    - name: loadAccounts
      triggers: [ScreenOpened, RetryLoad]
    - name: filterAccounts
      param: AccountTypeFilter
    - name: navigateToDetail
      param: accountId
  di:
    - AccountsRepository
    - SessionManager

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/accounts"
    tag: Accounts
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
          children:
            - name: scheme
              type: String
            - name: address
              type: String
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Bank not found"
      - code: 500
        message: "OBP server error"

dependencies:
  tier: feature
  features:
    - account-detail
