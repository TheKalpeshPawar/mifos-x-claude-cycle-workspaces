id: accounts
name: My Accounts
feature: accounts
flavor: consumer
status: approved
quality_score: 80
contract_version: "1.1.0"
approve_hash: "sha256:04af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []

shell:
  bottom_nav: true
  nav_items:
    - id: nav_home
      label: Home
      icon: home
      target: home
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
      active: true
    - id: nav_pay
      label: Pay
      icon: send
      target: send-money
    - id: nav_cards
      label: Cards
      icon: credit_card
      target: cards
    - id: nav_more
      label: More
      icon: more_horiz
      target: settings

screens:
  - id: accounts_content
    label: My Accounts
    route: /accounts
    scroll: vertical

archetype: index_list

components:
  - type: stack
    id: accounts_header
    style:
      direction: horizontal
      align: center
      justify: space_between
      padding_horizontal: 20
      padding_top: 24
      padding_bottom: 8
    a11y:
      role: group
    test_context:
      tag: accounts_header
    children:
      - type: text
        id: accounts_title
        content: "My Accounts"
        style:
          typography: headline_large
          color: "#1A1C16"
        a11y:
          role: heading
          level: 1
          label: "My Accounts"
        test_context:
          tag: accounts_title
          assert_content: "My Accounts"

      - type: icon
        id: accounts_help_icon
        content: "help_outline"
        style:
          size: 24
          color: "#44483D"
        on_click:
          action: open_account_help
        a11y:
          role: button
          label: "Help with accounts"
        keyboard:
          focusable: true
        test_context:
          tag: accounts_help_icon

  - type: stack
