            a11y:
              role: text
              label: "IBAN: DE89 3704 0044 0532 0131 00"
            test_context:
              tag: acct2_iban

  - type: box
    id: account_card_3
    style:
      background: "#FFFFFF"
      border_radius: 16
      padding: 20
      margin_horizontal: 20
      margin_bottom: 12
      elevation: 2
      border_left_width: 4
      border_left_color: "#E8A317"
    on_click:
      action: navigate
      target: account-detail
      params:
