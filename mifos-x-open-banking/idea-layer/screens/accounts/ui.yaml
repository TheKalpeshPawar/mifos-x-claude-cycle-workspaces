responsive:
  mobile_only: false
  baseline_width: 390
  tablet:
    min_width: 600
    columns: 2

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      components_visible:
        - accounts_header
        - accounts_search
      skeleton:
        - id: skeleton_card_1
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 120
            margin_horizontal: 20
            margin_bottom: spacing.md
        - id: skeleton_card_2
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 120
            margin_horizontal: 20
            margin_bottom: spacing.md
        - id: skeleton_card_3
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 120
            margin_horizontal: 20
            margin_bottom: spacing.md

  content:
    layout:
      components_visible:
        - accounts_header
        - accounts_search
        - bank_group_1_header
        - account_card_1
        - account_card_2
        - bank_group_2_header
        - account_card_3

  empty:
    layout:
      components_visible: []
      empty_card:
        id: empty_state_card
        icon: account_balance_wallet
        title: "No accounts found"
        message: "Your accounts will appear here once your profile is set up."

  error:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Could not load accounts"
        message: "We were unable to fetch your account list. Please check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

  no_network:
    layout:
      components_visible: []
      error_card:
        id: no_network_state_card
        title: "Could not load accounts"
        message: "We were unable to fetch your account list. Please check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

  unauthenticated:
    layout:
      components_visible: []
      error_card:
        id: unauthenticated_state_card
        title: "Could not load accounts"
        message: "We were unable to fetch your account list. Please check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

state_model:
  view_model: AccountsViewModel
  screen_state: "ScreenState<AccountsContent>"
  state_wrapper: ScreenState
  state_wrapper_states: [Loading, Content, Empty, Error, NoNetwork, Unauthenticated]
  content_class: AccountsContent
  content_fields:
    - name: filteredAccounts
      type: "List<ObieAccount>"
      note: "client-side search result over the authorised OBIE account list (get_accounts + per-account get_balances merged)"
      obie_shape:
        account_id: "Data.Account[].AccountId"            # String
        account_type: "Data.Account[].AccountTypeCode"    # String
        nickname: "Data.Account[].Nickname"               # String (card label, falls back to Account[].Name)
        scheme_name: "Data.Account[].Account[].SchemeName"      # String
        identification: "Data.Account[].Account[].Identification"  # String (the IBAN/account number shown)
        name: "Data.Account[].Account[].Name"             # String
        balance_amount: "Data.Balance[].Amount.Amount"    # String (from get_balances, InterimAvailable)
        balance_currency: "Data.Balance[].Amount.Currency"  # String
    - name: query
      type: String
    - name: accountCount
      type: Int
      note: "total accounts before search filter; Empty when 0"
  dto: org.mifosx.openbanking.core.model.obie.ObieAccount
  data_source:
    pattern: ScreenDataStream
    stream: "aisRepository.accountsStream(viewModelScope)"
    note: "get_accounts then per-AccountId get_balances, merged into ObieAccount rows; cache-then-network, auto-refresh on reconnect. Search re-derives Content without a network call. A search matching nothing stays Content (search bar operable) with an empty list; Empty means zero authorised accounts. All calls require an AUTH account-access-consent + authorization-code token."
  events:
    - "onSearchQueryChanged(query: String)"
    - onRetry
    - onRefresh
  nav_callbacks:
    - "onAccountClick(accountId: String)"
  di:
    - AisRepository
    - ConsentRepository

# HSBC OBIE AIS. Reads require an authorised account-access-consent (AUTH) + a scoped
# authorization-code token (scope accounts). get_balances is fanned out per AccountId.
consent:
  required: true
  type: account-access-consent
  permissions: [ReadAccountsBasic, ReadAccountsDetail, ReadBalances]
  token: authorization-code
api:
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: Accounts
    auth: OAuth2-FAPI
    consent_required: true
    note: "Authorised account list — drives the account cards, search and bank grouping. OBIE OBReadAccount6; supports pagination."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountCategory
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].SchemeName
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
        - name: Data.Account[].Servicer.Identification
          type: String
        - name: Meta.TotalPages
          type: Integer
    errors:
      - code: 401
        message: "UNAUTHORIZED — token missing or expired"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus — consent not AUTH"
      - code: 500
        message: "OB.UnexpectedError"

  - id: get_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: Balances
    auth: OAuth2-FAPI
    consent_required: true
    note: "Per-card balance amount. Requires ReadBalances. Called per AccountId; card surfaces the InterimAvailable Type. OBIE OBReadBalance1."
    params:
      - name: AccountId
        type: path
    response:
      fields:
        - name: Data.Balance[].AccountId
          type: String
        - name: Data.Balance[].Type
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus — missing ReadBalances"
      - code: 500
        message: "OB.UnexpectedError"

dependencies:
  tier: feature
  features:
    - account-detail
