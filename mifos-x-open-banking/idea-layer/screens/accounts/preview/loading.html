<!doctype html>
<!-- render-hash: c4e7f910ab23 -->
<html lang="en" data-screen="accounts" data-state="loading" data-feature="accounts" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Accounts — Loading — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
      --icon-xs: 16px; --icon-sm: 20px; --icon-md: 24px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --surface-container: #1E201A; --surface-container-high: #282A24;
        --outline: #8F9285; --outline-variant: #44483D;
        --nav-active-indicator: #354E16;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-display);
      background: var(--background);
      color: var(--on-surface);
      display: flex; flex-direction: column; min-height: 100vh;
    }
    main { flex: 1; overflow-y: auto; padding-bottom: 96px; }

    /* ── App Bar ── */
    .app-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 20px 8px; background: var(--background);
    }
    .app-bar-title { font-size: 32px; font-weight: 400; line-height: 40px; color: var(--on-surface); }
    .help-btn {
      width: 40px; height: 40px; border-radius: 20px; border: 0;
      background: transparent; color: var(--on-surface-variant);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .help-btn .material-symbols-outlined { font-size: var(--icon-md); }

    /* ── Search Bar (visible during loading) ── */
    .search-bar-wrap { padding: 8px 20px 0; }
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: 28px; padding: 12px 16px; min-height: 56px;
    }
    .search-bar .material-symbols-outlined { font-size: var(--icon-sm); color: var(--on-surface-variant); }
    .search-bar .material-symbols-outlined.trail { margin-left: auto; }
    .search-placeholder { font-size: 14px; font-weight: 400; color: var(--on-surface-variant); flex: 1; }

    /* ── Skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(
        90deg,
        var(--surface-container-high) 25%,
        var(--surface-variant) 50%,
        var(--surface-container-high) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; background: var(--surface-container-high); }
    }
    .skeleton-card {
      border-radius: 16px;
      height: 120px;
      margin: 16px 20px 12px;
    }
    .skeleton-card.stagger-2 { animation-delay: 0.2s; margin-top: 0; }
    .skeleton-card.stagger-3 { animation-delay: 0.4s; margin-top: 0; }
    .skeleton-footer {
      border-radius: 12px;
      height: 48px;
      margin: 4px 20px 80px;
      animation-delay: 0.6s;
    }

    /* ── Bottom Nav ── */
    nav[data-shell="bottom-nav"] {
      position: sticky; bottom: 0;
      background: var(--background);
      border-top: 1px solid var(--outline-variant);
      display: flex; justify-content: space-around;
      padding: 8px 0 10px; height: 64px; z-index: 20;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 4px 12px; border-radius: 16px; min-width: 56px;
      text-decoration: none; cursor: pointer; border: 0; background: transparent;
      font-family: var(--font-display);
    }
    .nav-item .material-symbols-outlined { font-size: var(--icon-md); color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active { background: var(--nav-active-indicator); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
  </style>
</head>
<body>
  <main data-component-type="screen" data-component-id="accounts_content" aria-busy="true" aria-label="Loading accounts">

    <!-- App Bar (visible during loading per ui.yaml states.loading.layout.components_visible) -->
    <header class="app-bar" data-component-type="stack" data-component-id="accounts_header" role="group">
      <h1 class="app-bar-title" data-component-type="text" data-component-id="accounts_title" role="heading" aria-level="1">My Accounts</h1>
      <button class="help-btn" type="button"
              data-component-type="icon" data-component-id="accounts_help_icon"
              data-action="open_account_help"
              aria-label="Help with accounts">
        <span class="material-symbols-outlined" aria-hidden="true">help_outline</span>
      </button>
    </header>

    <!-- Search Bar (visible and interactive during loading per ui.yaml) -->
    <div class="search-bar-wrap">
      <div class="search-bar"
           data-component-type="text_field" data-component-id="accounts_search" data-component-variant="outlined"
           data-action="search_accounts"
           role="searchbox" aria-label="Search accounts by name, number or label"
           tabindex="0">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <span class="search-placeholder">Search by name, number or label</span>
        <span class="material-symbols-outlined trail" aria-hidden="true">close</span>
      </div>
    </div>

    <!-- Skeleton Cards (3 card placeholders matching content layout) -->
    <div class="skeleton skeleton-card"
         data-component-type="box" data-component-id="skeleton_card_1"
         role="status" aria-label="Loading account"></div>

    <div class="skeleton skeleton-card stagger-2"
         data-component-type="box" data-component-id="skeleton_card_2"
         role="status" aria-label="Loading account"></div>

    <div class="skeleton skeleton-card stagger-3"
         data-component-type="box" data-component-id="skeleton_card_3"
         role="status" aria-label="Loading account"></div>

    <!-- Skeleton Total Footer -->
    <div class="skeleton skeleton-footer"
         data-component-type="box" data-component-id="skeleton_total_footer"
         role="status" aria-label="Loading totals"></div>

  </main>

  <!-- Bottom Navigation -->
  <nav data-shell="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" data-nav-to="home" aria-label="Home">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item active" type="button" data-nav-to="accounts" aria-label="Accounts" aria-current="page">
      <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-item" type="button" data-nav-to="send-money" aria-label="Pay">
      <span class="material-symbols-outlined" aria-hidden="true">send</span>
      <span class="nav-label">Pay</span>
    </button>
    <button class="nav-item" type="button" data-nav-to="cards" aria-label="Cards">
      <span class="material-symbols-outlined" aria-hidden="true">credit_card</span>
      <span class="nav-label">Cards</span>
    </button>
    <button class="nav-item" type="button" data-nav-to="settings" aria-label="More">
      <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <script src="../../preview-runtime.js"></script>
</body>
</html>
