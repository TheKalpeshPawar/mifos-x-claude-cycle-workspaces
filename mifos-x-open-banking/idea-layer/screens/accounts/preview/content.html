  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--surface);color:var(--on-surface);

  .title{font-size:22px}

  .card{background:var(--surface-container);border-radius:var(--r-md);padding:12px;

  .card:hover{background:var(--surface-container-high)}
  .ic{width:24px;height:24px;color:var(--primary);flex:none}
  .col{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
  .sub{font-size:11px;font-weight:500;color:var(--secondary)}
