<!doctype html>
<!-- render-hash: accounts-empty-obie -->
<html lang="en" data-screen="accounts" data-state="empty" data-feature="accounts" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Accounts — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
      --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
      --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
      --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
      --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
      --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
      --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
      --font-display:'Outfit',system-ui,sans-serif;
      --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
      --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
      --icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-2xl:48px;
    }
    [data-theme="light"] {
      --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
      --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
      --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
      --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
      --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
      --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
      --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
    }
    [data-theme="dark"] {
      --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
      --secondary:#A0CFCB;--on-secondary:#003735;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
      --tertiary:#A0CFCB;--on-tertiary:#003735;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
      --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
      --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
      --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
      --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
        --secondary:#A0CFCB;--on-secondary:#003735;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
        --tertiary:#A0CFCB;--on-tertiary:#003735;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
        --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
        --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
        --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
        --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
      }
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:var(--font-display);
      background:var(--background);
      color:var(--on-surface);
      display:flex; flex-direction:column; min-height:100vh;
    }
    main { flex:1; overflow-y:auto; display:flex; flex-direction:column; }

    .app-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:var(--sp-lg) 20px var(--sp-sm);
      background:var(--background);
    }
    .app-bar-title { font-size:32px; font-weight:400; line-height:40px; color:var(--on-surface); }
    .help-btn {
      display:flex; align-items:center; justify-content:center;
      width:40px; height:40px; border:none; background:transparent;
      color:var(--on-surface-variant); cursor:pointer; border-radius:var(--radius-pill);
    }
    .help-btn .material-symbols-outlined { font-size:var(--icon-md); }

    .empty-wrap {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:var(--sp-xl) 32px;
    }
    .empty-icon-circle {
      display:flex; align-items:center; justify-content:center;
      width:96px; height:96px; border-radius:var(--radius-pill);
      background:var(--primary-container); margin-bottom:var(--sp-lg);
    }
    .empty-icon-circle .material-symbols-outlined { font-size:var(--icon-2xl); color:var(--on-primary-container); }
    .empty-title { font-size:22px; font-weight:600; line-height:28px; color:var(--on-surface); margin-bottom:var(--sp-sm); }
    .empty-message {
      font-size:14px; font-weight:400; line-height:20px;
      color:var(--on-surface-variant); max-width:280px; margin-bottom:var(--sp-xl);
    }
    .empty-cta {
      display:inline-flex; align-items:center; gap:var(--sp-sm);
      background:var(--primary); color:var(--on-primary);
      border:none; border-radius:var(--radius-pill);
      padding:var(--sp-md) var(--sp-lg); font-family:var(--font-display);
      font-size:14px; font-weight:600; cursor:pointer;
    }
    .empty-cta .material-symbols-outlined { font-size:var(--icon-sm); }

    .bottom-nav {
      position:sticky; bottom:0; margin-top:auto;
      display:flex; align-items:stretch; justify-content:space-around;
      background:var(--surface-container);
      border-top:1px solid var(--outline-variant);
      padding:var(--sp-sm) 0 var(--sp-md);
    }
    .nav-item {
      flex:1; display:flex; flex-direction:column; align-items:center; gap:var(--sp-xs);
      text-decoration:none; color:var(--on-surface-variant); cursor:pointer; padding:var(--sp-xs) 0;
    }
    .nav-item .material-symbols-outlined { font-size:var(--icon-md); }
    .nav-icon-pill {
      display:flex; align-items:center; justify-content:center;
      width:56px; height:30px; border-radius:var(--radius-pill); background:transparent;
    }
    .nav-item.active { color:var(--on-surface); }
    .nav-item.active .nav-icon-pill { background:var(--nav-active-indicator); }
    .nav-item.active .material-symbols-outlined { color:var(--on-surface); }
    .nav-label { font-size:12px; font-weight:500; line-height:16px; }
  </style>
</head>
<body data-theme="light">
  <main data-component-type="box" data-component-id="accounts_root">
    <header class="app-bar" data-component-type="stack" data-component-id="accounts_header">
      <h1 class="app-bar-title" data-component-type="text" data-component-id="accounts_title">My Accounts</h1>
      <button class="help-btn" data-component-type="icon" data-component-id="accounts_help_icon" data-action="open_account_help" aria-label="Account help">
        <span class="material-symbols-outlined">help_outline</span>
      </button>
    </header>

    <section class="empty-wrap" data-component-type="box" data-component-id="empty_state_card" role="status">
      <div class="empty-icon-circle" data-component-type="icon" data-component-id="empty_state_icon" aria-hidden="true">
        <span class="material-symbols-outlined">account_balance_wallet</span>
      </div>
      <h2 class="empty-title" data-component-type="text" data-component-id="empty_state_title">No accounts found</h2>
      <p class="empty-message" data-component-type="text" data-component-id="empty_state_message">Your accounts will appear here once your profile is set up.</p>
      <button class="empty-cta" data-component-type="box" data-component-id="empty_state_cta" data-action="connect_account" aria-label="Connect a bank account">
        <span class="material-symbols-outlined">add</span>
        Connect an account
      </button>
    </section>
  </main>

  <nav class="bottom-nav" data-component-type="nav" data-component-id="bottom_nav">
    <a class="nav-item" data-nav-to="home" data-component-type="nav-item" data-component-id="nav_home" aria-label="Home">
      <span class="nav-icon-pill"><span class="material-symbols-outlined">home</span></span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item active" data-nav-to="accounts" data-component-type="nav-item" data-component-id="nav_accounts" aria-label="Accounts" aria-current="page">
      <span class="nav-icon-pill"><span class="material-symbols-outlined">account_balance</span></span>
      <span class="nav-label">Accounts</span>
    </a>
    <a class="nav-item" data-nav-to="send-money" data-component-type="nav-item" data-component-id="nav_pay" aria-label="Pay">
      <span class="nav-icon-pill"><span class="material-symbols-outlined">send</span></span>
      <span class="nav-label">Pay</span>
    </a>
    <a class="nav-item" data-nav-to="cards" data-component-type="nav-item" data-component-id="nav_cards" aria-label="Cards">
      <span class="nav-icon-pill"><span class="material-symbols-outlined">credit_card</span></span>
      <span class="nav-label">Cards</span>
    </a>
    <a class="nav-item" data-nav-to="settings" data-component-type="nav-item" data-component-id="nav_more" aria-label="More">
      <span class="nav-icon-pill"><span class="material-symbols-outlined">more_horiz</span></span>
      <span class="nav-label">More</span>
    </a>
  </nav>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
