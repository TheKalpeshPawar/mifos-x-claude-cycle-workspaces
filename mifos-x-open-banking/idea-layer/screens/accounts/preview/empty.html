<!doctype html>
<html lang="en" data-screen="accounts" data-state="empty">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Accounts — Empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.accounts-header{padding:24px 20px 16px;}
.accounts-title{font-size:28px;font-weight:700;color:var(--primary);}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;gap:16px;text-align:center;min-height:calc(844px - 80px - 80px);}
.empty-card{background:var(--surface);border-radius:16px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.empty-icon{width:96px;height:96px;background:var(--primary-container);border-radius:48px;display:flex;align-items:center;justify-content:center;}
.empty-icon .mi{font-size:48px;color:var(--primary);}
h2.empty-title{font-size:20px;font-weight:600;color:var(--text-primary);}
p.empty-msg{font-size:14px;color:var(--outline);line-height:1.5;text-align:center;}
.cta-btn{padding:14px 32px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.bottom-nav{position:absolute;bottom:0;left:0;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--surface-variant);display:flex;align-items:flex-start;padding:12px 12px 16px;gap:8px;}
.nav-tab{display:flex;flex-direction:column;align-items:center;width:70px;gap:4px;text-decoration:none;}
.nav-pill{display:flex;align-items:center;justify-content:center;width:64px;height:28px;border-radius:14px;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-icon{font-size:22px;color:var(--outline);font-family:'Material Icons';font-style:normal;}
.nav-tab.active .nav-icon{color:var(--primary);}
.nav-label{font-size:11px;color:var(--outline);font-family:var(--font);}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<div class="accounts-header">
  <div class="accounts-title">Accounts</div>
</div>

<main>
  <div class="empty-card">
    <div class="empty-icon">
      <span class="mi">account_balance</span>
    </div>
    <h2 class="empty-title">No accounts found</h2>
    <p class="empty-msg">You don't have any accounts matching this filter. Try a different category or request a new account.</p>
    <button class="cta-btn" data-action="request_new_account">Request Account</button>
  </div>
</main>

<nav class="bottom-nav" aria-label="Main navigation">
  <a class="nav-tab" data-nav-to="home">
    <div class="nav-pill"><span class="nav-icon">home</span></div>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-tab active" data-nav-to="accounts">
    <div class="nav-pill"><span class="nav-icon">account_balance</span></div>
    <span class="nav-label">Accounts</span>
  </a>
  <a class="nav-tab" data-nav-to="send-money">
    <div class="nav-pill"><span class="nav-icon">send</span></div>
    <span class="nav-label">Pay</span>
  </a>
  <a class="nav-tab" data-nav-to="cards">
    <div class="nav-pill"><span class="nav-icon">credit_card</span></div>
    <span class="nav-label">Cards</span>
  </a>
  <a class="nav-tab" data-nav-to="more">
    <div class="nav-pill"><span class="nav-icon">more_horiz</span></div>
    <span class="nav-label">More</span>
  </a>
</nav>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
