<!doctype html>
<!-- render-hash: e6a1b4c9d207 -->
<html lang="en" data-screen="accounts" data-state="error" data-feature="accounts" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Accounts — Error — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
      --icon-xs: 16px; --icon-sm: 20px; --icon-md: 24px; --icon-2xl: 48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
        --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --surface-container: #1E201A; --surface-container-high: #282A24;
        --outline: #8F9285; --outline-variant: #44483D;
        --nav-active-indicator: #354E16;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-display);
      background: var(--background);
      color: var(--on-surface);
      display: flex; flex-direction: column; min-height: 100vh;
    }
    main { flex: 1; display: flex; flex-direction: column; }

    /* ── App Bar ── */
    .app-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 20px 8px; background: var(--background);
    }
    .app-bar-title { font-size: 32px; font-weight: 400; line-height: 40px; color: var(--on-surface); }
    .help-btn {
      width: 40px; height: 40px; border-radius: 20px; border: 0;
      background: transparent; color: var(--on-surface-variant);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .help-btn .material-symbols-outlined { font-size: var(--icon-md); }

    /* ── Error State Body ── */
    .error-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 40px 80px;
      text-align: center;
    }
    .error-illustration {
      width: 140px; height: 140px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 70px;
      background: var(--surface-variant);
      margin-bottom: 24px;
    }
    .error-illustration .material-symbols-outlined {
      font-size: var(--icon-2xl);
      color: var(--on-surface-variant);
    }
    .error-heading {
      font-size: 22px; font-weight: 600; line-height: 28px;
      color: var(--on-surface); text-align: center;
      margin-bottom: 8px;
    }
    .error-body-text {
      font-size: 14px; font-weight: 400; line-height: 20px;
      color: var(--on-surface-variant); text-align: center;
      margin-bottom: 32px;
    }
    .retry-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: var(--on-primary);
      border: 0;
      border-radius: 24px;
      padding: 14px 24px;
      min-height: 48px;
      width: calc(100% - 64px);
      max-width: 320px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
      cursor: pointer;
      letter-spacing: 0.15px;
    }
    .retry-button .material-symbols-outlined { font-size: var(--icon-sm); }
    .retry-button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ── Bottom Nav ── */
    nav[data-shell="bottom-nav"] {
      position: sticky; bottom: 0;
      background: var(--background);
      border-top: 1px solid var(--outline-variant);
      display: flex; justify-content: space-around;
      padding: 8px 0 10px; height: 64px; z-index: 20;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 4px 12px; border-radius: 16px; min-width: 56px;
      text-decoration: none; cursor: pointer; border: 0; background: transparent;
      font-family: var(--font-display);
    }
    .nav-item .material-symbols-outlined { font-size: var(--icon-md); color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active { background: var(--nav-active-indicator); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
  </style>
</head>
<body>
  <main data-component-type="screen" data-component-id="accounts_content">

    <!-- App Bar (only visible component in error state per ui.yaml) -->
    <header class="app-bar" data-component-type="stack" data-component-id="accounts_header" role="group">
      <h1 class="app-bar-title" data-component-type="text" data-component-id="accounts_title" role="heading" aria-level="1">My Accounts</h1>
      <button class="help-btn" type="button"
              data-component-type="icon" data-component-id="accounts_help_icon"
              data-action="open_account_help"
              aria-label="Help with accounts">
        <span class="material-symbols-outlined" aria-hidden="true">help_outline</span>
      </button>
    </header>

    <!-- Error State Card -->
    <div class="error-body" data-component-type="box" data-component-id="error_state_card"
         role="alert" aria-live="assertive">

      <!-- Illustration: disconnected / error -->
      <div class="error-illustration" aria-hidden="true">
        <span class="material-symbols-outlined">error_outline</span>
      </div>

      <!-- Heading -->
      <h2 class="error-heading" data-component-type="text" data-component-id="error_state_title">Could not load accounts</h2>

      <!-- Body -->
      <p class="error-body-text" data-component-type="text" data-component-id="error_state_message">
        We were unable to fetch your account list. Please check your connection and try again.
      </p>

      <!-- Retry Button -->
      <button class="retry-button" type="button"
              data-component-type="button" data-component-id="error_state_action"
              data-action="retry_load"
              aria-label="Retry loading accounts">
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
        Retry
      </button>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav data-shell="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" data-nav-to="home" aria-label="Home">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item active" type="button" data-nav-to="accounts" aria-label="Accounts" aria-current="page">
      <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-item" type="button" data-nav-to="send-money" aria-label="Pay">
      <span class="material-symbols-outlined" aria-hidden="true">send</span>
      <span class="nav-label">Pay</span>
    </button>
    <button class="nav-item" type="button" data-nav-to="cards" aria-label="Cards">
      <span class="material-symbols-outlined" aria-hidden="true">credit_card</span>
      <span class="nav-label">Cards</span>
    </button>
    <button class="nav-item" type="button" data-nav-to="settings" aria-label="More">
      <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <script src="../../preview-runtime.js"></script>
</body>
</html>
