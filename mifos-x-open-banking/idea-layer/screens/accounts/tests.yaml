screen_id: accounts

scenarios:
  - id: TC-ACCTS-001
    description: "Accounts list loads and renders balance preview for each account"
    state: content
    given: "Valid PSU access token; HSBC sandbox returns 5 accounts and their balances"
    when: "Screen mounts"
    then:
      - "Five account cards render (Everyday Current, ISA Saver, Platinum Mastercard, Global Money, Global Wallet — USD)"
      - "Each card shows account subtype, masked/formatted account identifier, and InterimAvailable balance"
      - "Total balance stat_block shows £15,797.63 (GBP accounts only)"
      - "Balance amounts match demo-data values"

  - id: TC-ACCTS-002
    description: "Loading state shows shimmer skeleton cards during fetch"
    state: loading
    given: "Slow network; API calls in flight"
    when: "Screen mounts"
    then:
      - "Three shimmer skeleton card placeholders visible with pulsing animation"
      - "Account list, filter chips and total balance stat NOT rendered"

  - id: TC-ACCTS-003
    description: "Error state with Retry button on 401 token expired"
    state: error
    given: "Access token is expired; accounts-list returns 401"
    when: "Screen mounts"
    then:
      - "Error state renders with error icon and 'Your session has expired. Please sign in again.' message"
      - "Retry button visible with accessibility label 'Retry loading accounts'"
      - "Tapping Retry re-triggers accounts_and_balances_load"

  - id: TC-ACCTS-004
    description: "Empty state when no accounts returned"
    state: empty
    given: "HSBC returns OBReadAccount6 with empty Data.Account[] (PSU selected no accounts during consent)"
    when: "Screen mounts"
    then:
      - "Empty state renders with account_balance_wallet icon"
      - "Title 'No accounts found' and body directing PSU to revoke and re-authorise"

  - id: TC-ACCTS-005
    description: "Tap account card navigates to account-detail with accountId param"
    state: content
    when: "User taps 'Everyday Current' card"
    then: "Navigates to account-detail screen with accountId=40051512345678"

  - id: TC-ACCTS-006
    description: "GlobalMoney and GlobalWallet multi-currency cards render correctly"
    state: content
    given: "HSBC sandbox returns 5 accounts including GlobalMoney (GBP) and GlobalWallet (USD)"
    when: "Screen mounts and content state renders"
    then:
      - "GlobalMoney card shows 'Global Money' nickname, public icon, and £500.00 balance"
      - "GlobalWallet card shows 'Global Wallet — USD' nickname, currency_exchange icon, and 'USD 250.00'"
      - "GlobalWallet balance displays native currency code (USD), not GBP"
      - "Both cards are excluded from GBP total balance calculation (totalBalanceFormatted remains £15,797.63 for GBP accounts)"

  - id: TC-ACCTS-007
    description: "Consent expiry banner shown when consent expires within 30 days"
    state: consent_expiring
    given: "Consent ExpirationDateTime is 14 days from now; accounts loaded successfully"
    when: "Screen mounts and accounts load"
    then:
      - "consent_expiring state active — full account list and filter chips visible"
      - "Warning banner visible at bottom with 'Consent expiring soon' title"
      - "Banner body text references 14 days remaining"
      - "'Reconfirm access' button navigates to consent-detail with activeConsentId param"

  - id: TC-ACCTS-008
    description: "CreditCard account displays 'Balance owed' badge in error colour"
    state: content
    given: "Platinum Mastercard in content state (CreditDebitIndicator=Debit, £342.18)"
    when: "Accounts list renders"
    then:
      - "Platinum Mastercard balance £342.18 renders in error colour (not default on_surface)"
      - "'Balance owed' tonal badge visible on the card"
      - "Other accounts (CurrentAccount, Savings) show no badge and use default colour"

  - id: TC-ACCTS-009
    description: "Account type filter chip narrows visible account cards"
    state: content
    given: "All 5 accounts loaded (CurrentAccount, Savings, CreditCard, GlobalMoney, GlobalWallet)"
    when: "User taps 'Savings' chip filter"
    then:
      - "Only 'ISA Saver' card is visible"
      - "CurrentAccount, CreditCard, GlobalMoney and GlobalWallet cards not rendered"
      - "'All' chip is deselected; 'Savings' chip is selected"

  - id: TC-ACCTS-010
    description: "Partial balance failure — account card shown without balance when ReadBalances permission absent"
    state: content
    given: "accounts-list returns 5 accounts; balances call for ISA Saver returns 403 (ReadBalances not in consent)"
    when: "Screen mounts"
    then:
      - "ISA Saver card renders with account details but without balance row"
      - "Other accounts with successful balance calls show balances normally"
      - "Screen does not enter error state (partial failure is handled gracefully)"
