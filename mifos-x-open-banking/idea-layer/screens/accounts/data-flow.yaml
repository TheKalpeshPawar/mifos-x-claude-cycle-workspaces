sibling: data-flow
schema_version: "4.0"
feature_id: accounts
entries:
  - screen_id: accounts
    trigger: on_mount
    endpoints:
      - get_accounts
      - get_balances
    direction: read
    consent_required: true
    dtos:
      - name: ObieAccount
        role: response
        api_id: get_accounts
      - name: ObieBalance
        role: response
        api_id: get_balances
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 500
        behavior: error_state

  - screen_id: accounts
    trigger: on_interact
    event: RetryLoad
    endpoints:
      - get_accounts
      - get_balances
    direction: read
    consent_required: true
    dtos:
      - name: ObieAccount
        role: response
        api_id: get_accounts
      - name: ObieBalance
        role: response
        api_id: get_balances
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 500
        behavior: error_state

  - screen_id: accounts
    trigger: on_interact
    event: FilterChanged
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Client-side filter on the loaded OBIE account list; no network call"

  - screen_id: accounts
    trigger: on_interact
    event: AccountSelected
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to account-detail keyed on AccountId; no network call"

  - screen_id: accounts
    trigger: on_interact
    event: RequestNewAccount
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to account-applications; no network call"
