feature: accounts
flow_ref: account-browsing

entry_points:
  - source: app_shell_bottom_nav
    label: "Accounts tab (bottom nav order 0)"
  - source: consent-callback
    label: "Successful OAuth callback → land on Accounts"
  - source: back_stack_pop
    label: "Back from account-detail → return to Accounts"

transitions:
  - from: accounts
    to: account-detail
    trigger: "Tap account card"
    params: [accountId]

  - from: accounts
    to: login
    trigger: "401 — access token expired or no active consent"
    guard: "error.code == 401"

  - from: accounts
    to: consent-detail
    trigger: "Tap 'Reconfirm access' in consent_expiring banner"
    params: [consentId]
    guard: "state == consent_expiring"

  - from: accounts
    to: consent-list
    trigger: "403 — consent revoked mid-session"
    guard: "error.code == 403"
