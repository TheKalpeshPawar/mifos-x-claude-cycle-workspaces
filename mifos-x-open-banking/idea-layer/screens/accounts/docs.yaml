  - FR-003
  - FR-004
  # FR-009 dropped 2026-07-30 (/idea-sync) — the requirement was removed as orphaned when
  # the multi-currency feature was deleted. Global Money / Global Wallet rendering is not
  # lost, it is covered by FR-003 as part of the ordinary accounts list.
scaffolded_by: /idea-add
archetype: index_list
# ── Description corrected 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# Was "Primary bottom-nav anchor (tab order 0)" — Home is order 0, Accounts is 1. The
# multi-currency clause implied a dedicated surface; what ships is list rendering.
description: >-
  Authorised accounts list with a balance preview per account. Accounts tab, bottom-nav order 1
  (Home is 0). Entry point to account-detail. Global Money / Global Wallet accounts render in
  this list under the Current filter — there is deliberately no Global filter chip, because such
  a wallet reports AccountTypeCode CACC and is indistinguishable here from an ordinary current
  account. Shows a consent expiry warning when under 30 days remain.
has_ui: true
has_server: false
impl_notes:
  viewmodel: 'AccountsViewModel : BaseViewModel<AccountsState, AccountsEvent, AccountsAction>'
  state_model: |
    data class AccountsState(
      val accounts: List<AccountWithBalance> = emptyList(),
      val filteredAccounts: List<AccountWithBalance> = emptyList(),
      val activeFilter: AccountSubType? = null,
      val totalBalanceFormatted: String = "",
      val totalBalanceAccountCount: Int = 0,
      val activeConsentId: String = "",
      val consentDaysRemaining: Int = Int.MAX_VALUE,
      val isConsentExpiring: Boolean = false,
      val uiState: UiState = UiState.Loading
    )
    // UiState ∈ { Loading, Content, ConsentExpiring, Empty, Error(cause) }
  dto_refs:
    - OBReadAccount6
    - OBReadAccount6Data
    - OBAccount6
    - OBCashAccount3
    - OBReadBalance1
    - OBReadBalance1Data
    - OBCashBalance3
    - OBActiveOrHistoricCurrencyAndAmount
  api_calls:
    - 'GET /accounts → OBReadAccount6 (permission: ReadAccountsDetail)'
    - 'GET /accounts/{AccountId}/balances → OBReadBalance1 (permission: ReadBalances) — parallel per AccountId'
  parallelism: coroutineScope { accounts.map { async { apiService.getBalances(it.AccountId) } }.awaitAll() }
  consent_expiry_check: |
    val daysRemaining = ChronoUnit.DAYS.between(Instant.now(), consent.ExpirationDateTime)
    isConsentExpiring = daysRemaining < 30
    uiState = if (isConsentExpiring) UiState.ConsentExpiring else UiState.Content
  balance_display_rules:
    - Use InterimAvailable balance type preferentially; fallback to InterimBooked.
    - >-
      CreditCard + CreditDebitIndicator=Debit → balanceColor=error, showBalanceBadge=true,
      balanceTypeLabel=strings.accounts.card.balance.owed_label
    - All other accounts → balanceColor=on_surface, showBalanceBadge=false
    - Non-GBP currencies (GlobalWallet) → display native currency code (e.g. USD 250.00)
  account_type_icon_map:
    CurrentAccount: account_balance
    Savings: savings
    CreditCard: credit_card
    GlobalMoney: public
    GlobalWallet: currency_exchange
  navigation:
    - 'accounts → account-detail (param: AccountId)'
    - 'accounts → consent-detail (param: ConsentId) — reconfirm path when consent_expiring'
    - accounts → login — on 401 / no active consent
  i18n_keys_prefix: accounts.*
  i18n_keys_file: idea-layer/_strings/strings.yaml
