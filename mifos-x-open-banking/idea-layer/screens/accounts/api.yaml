sibling: api
schema_version: "4.0"
feature_id: accounts
api:
  - id: obp_get_accounts
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/accounts"
    tag: Accounts
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
          children:
            - name: scheme
              type: String
            - name: address
              type: String
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Bank not found"
      - code: 500
        message: "OBP server error"
