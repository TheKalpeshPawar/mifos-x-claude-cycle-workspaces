sibling: data-flow
schema_version: "4.0"
feature_id: direct-debit-detail
entries:
  - screen_id: direct-debit-detail
    trigger: on_mount
    event: LoadMandate
    endpoints:
      - obp_get_mandate_detail
    direction: read
    dtos:
      - name: StandingOrder
        role: response
        api_id: obp_get_mandate_detail
    produces_state: loading
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_error_state
      - error_code: 404
        behavior: show_not_found_state

  - screen_id: direct-debit-detail
    trigger: on_interact
    event: OnCancelClicked
    endpoints:
      - obp_cancel_mandate
    direction: write
    dtos:
      - name: CancelMandateResponse
        role: response
        api_id: obp_cancel_mandate
    produces_state: submitting
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_error_banner
      - error_code: 404
        behavior: show_not_found_state
      - error_code: 500
        behavior: show_cancel_failed_error

  - screen_id: direct-debit-detail
    trigger: on_interact
    event: OnEditClicked
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: direct-debit-detail
    trigger: on_interact
    event: OnRetryClicked
    endpoints:
      - obp_get_mandate_detail
    direction: read
    dtos:
      - name: StandingOrder
        role: response
        api_id: obp_get_mandate_detail
    produces_state: loading
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_error_state
      - error_code: 404
        behavior: show_not_found_state
