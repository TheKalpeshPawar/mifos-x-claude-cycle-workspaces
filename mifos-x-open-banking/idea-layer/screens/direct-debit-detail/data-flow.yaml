sibling: data-flow
schema_version: "4.0"
feature_id: direct-debit-detail
entries:
  - screen_id: direct-debit-detail
    trigger: on_mount
    event: LoadMandate
    endpoints:
      - get_direct_debits
    direction: read
    dtos:
      - name: OBReadDirectDebit2
        role: response
        api_id: get_direct_debits
    produces_state: loading
    notes: "Loads the account's direct-debits list, then selects the Data.DirectDebit[] item whose DirectDebitId == route mandateId (OBIE has no per-mandate GET). No match renders the empty state."
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_error_state
      - error_code: 400
        behavior: show_not_found_state

  - screen_id: direct-debit-detail
    trigger: on_interact
    event: OnCancelClicked
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: "UNSUPPORTED on OBIE — no cancel-direct-debit endpoint. The Cancel Mandate CTA + confirm dialog have no server backing and are hidden/disabled; direct debits are merchant-initiated."

  - screen_id: direct-debit-detail
    trigger: on_interact
    event: OnRetryClicked
    endpoints:
      - get_direct_debits
    direction: read
    dtos:
      - name: OBReadDirectDebit2
        role: response
        api_id: get_direct_debits
    produces_state: loading
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_error_state
      - error_code: 400
        behavior: show_not_found_state
