<!doctype html>
<!-- render-hash: ddd-loading-llm -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Direct Debit Detail — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--tertiary:#386663;--tertiary-container:#BCEBE7;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;
  --surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;
  --surface-container:#F0F1E6;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --scrim:#000000;--pending:#E8A317;
  --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
}
@media (prefers-color-scheme:dark){
  :root {
    --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
    --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
    --background:#12140E;--on-background:#E3E3D8;
    --surface:#1E201A;--on-surface:#E3E3D8;
    --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
    --surface-container:#1E201A;
    --outline:#8F9285;--outline-variant:#44483D;
    --scrim:#000000;--pending:#E8A317;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-app-bar{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--background);border-bottom:1px solid var(--outline-variant);flex-shrink:0}
.nav-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--primary);font-family:'Material Symbols Outlined';font-size:var(--icon-md);font-weight:400;line-height:1;font-style:normal;letter-spacing:normal}
.bar-title{flex:1;text-align:center;font-size:18px;font-weight:500;color:var(--on-background)}
.spacer{min-width:44px}
main{flex:1;overflow-y:auto;padding:0 16px 32px;display:flex;flex-direction:column}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--surface-container) 25%,var(--surface-variant) 50%,var(--surface-container) 75%);background-size:1200px 100%;animation:shimmer 1.2s infinite linear}
.hero-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:24px;padding:0 16px}
.sk-circle{width:64px;height:64px;border-radius:50%}
.sk-name{width:160px;height:20px}
.sk-badge{width:64px;height:24px;border-radius:999px}
.sk-amount{width:88px;height:32px;border-radius:4px}
.sk-freq{width:64px;height:14px}
.details-card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;padding:16px;margin-top:24px}
.history-card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;padding:16px;margin-top:16px}
.sk-card-header{height:15px;width:128px;margin-bottom:12px}
.card-row{display:flex;justify-content:space-between;align-items:center;height:52px;border-top:1px solid var(--outline-variant)}
.card-row:first-of-type{border-top:none}
.sk-label{width:80px;height:12px}
.sk-value{width:120px;height:14px}
.hist-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sk-hist-title{width:128px;height:15px}
.sk-viewall{width:52px;height:12px}
.hist-row{display:flex;justify-content:space-between;align-items:center;height:56px;border-top:1px solid var(--outline-variant)}
.hist-row:first-of-type{border-top:none}
.sk-date{width:72px;height:12px}
.sk-hist-amount{width:52px;height:14px}
.btn-area{margin-top:24px}
.sk-btn{width:100%;height:48px;border-radius:12px}
</style>
</head>
<body data-shell data-screen-id="direct-debit-detail" data-state="loading">

<header class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar" data-component-variant="standard" data-shell-top-app-bar role="banner">
  <button class="nav-btn" aria-label="Back to direct debits" data-nav-to="direct-debits">arrow_back</button>
  <span class="bar-title">Direct Debit</span>
  <div class="spacer"></div>
</header>

<main data-shell-content data-component-type="skeleton" data-component-id="ddd_loading_skeleton" data-component-variant="detail" role="progressbar" aria-label="Loading mandate details" aria-live="polite">

  <div class="hero-area" data-component-type="stack" data-component-id="ddd_merchant_hero" data-component-variant="column" aria-hidden="true">
    <div class="skel sk-circle"></div>
    <div class="skel sk-name"></div>
    <div class="skel sk-badge"></div>
    <div class="skel sk-amount"></div>
    <div class="skel sk-freq"></div>
  </div>

  <div class="details-card" data-component-type="card" data-component-id="ddd_mandate_details_card" data-component-variant="outlined" aria-hidden="true">
    <div class="skel sk-card-header" data-component-type="text" data-component-id="ddd_details_header" data-component-variant="title_medium"></div>
    <div class="card-row" data-component-type="stack" data-component-id="ddd_next_payment_row" data-component-variant="row">
      <div class="skel sk-label"></div><div class="skel sk-value"></div>
    </div>
    <div class="card-row" data-component-type="stack" data-component-id="ddd_account_row" data-component-variant="row">
      <div class="skel sk-label"></div><div class="skel sk-value"></div>
    </div>
    <div class="card-row" data-component-type="stack" data-component-id="ddd_mandate_ref_row" data-component-variant="row">
      <div class="skel sk-label"></div><div class="skel sk-value"></div>
    </div>
    <div class="card-row" data-component-type="stack" data-component-id="ddd_start_date_row" data-component-variant="row">
      <div class="skel sk-label"></div><div class="skel sk-value"></div>
    </div>
  </div>

  <div class="history-card" data-component-type="card" data-component-id="ddd_payment_history_card" data-component-variant="outlined" aria-hidden="true">
    <div class="hist-header-row" data-component-type="stack" data-component-id="ddd_history_header_row" data-component-variant="row">
      <div class="skel sk-hist-title" data-component-type="text" data-component-id="ddd_history_header" data-component-variant="title_medium"></div>
      <div class="skel sk-viewall" data-component-type="link" data-component-id="ddd_history_view_all_link" data-component-variant="inline"></div>
    </div>
    <div class="hist-row" data-component-type="list_item" data-component-id="ddd_history_row" data-component-variant="row">
      <div class="skel sk-date" data-component-type="text" data-component-id="ddd_history_row_date" data-component-variant="body_medium"></div>
      <div class="skel sk-hist-amount" data-component-type="text" data-component-id="ddd_history_row_amount" data-component-variant="body_medium"></div>
    </div>
    <div class="hist-row" aria-hidden="true">
      <div class="skel sk-date"></div>
      <div class="skel sk-hist-amount"></div>
    </div>
    <div class="hist-row" aria-hidden="true">
      <div class="skel sk-date"></div>
      <div class="skel sk-hist-amount"></div>
    </div>
  </div>

  <div class="btn-area" aria-hidden="true">
    <div class="skel sk-btn" data-component-type="button" data-component-id="ddd_cancel_button" data-component-variant="outlined"></div>
  </div>

</main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
