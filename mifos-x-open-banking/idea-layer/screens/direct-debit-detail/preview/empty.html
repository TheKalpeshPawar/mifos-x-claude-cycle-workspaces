<!doctype html>
<!-- render-hash: ddd-empty-llm -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Direct Debit Detail — Empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--tertiary:#386663;--tertiary-container:#BCEBE7;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;
  --surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;
  --surface-container:#F0F1E6;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --scrim:#000000;--pending:#E8A317;
  --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
}
@media (prefers-color-scheme:dark){
  :root {
    --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
    --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
    --background:#12140E;--on-background:#E3E3D8;
    --surface:#1E201A;--on-surface:#E3E3D8;
    --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
    --surface-container:#1E201A;
    --outline:#8F9285;--outline-variant:#44483D;
    --scrim:#000000;--pending:#E8A317;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-app-bar{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--background);border-bottom:1px solid var(--outline-variant);flex-shrink:0}
.nav-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--primary);font-family:'Material Symbols Outlined';font-size:var(--icon-md);font-weight:400;line-height:1;font-style:normal;letter-spacing:normal}
.bar-title{flex:1;text-align:center;font-size:18px;font-weight:500;color:var(--on-background)}
.spacer{min-width:44px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.empty-icon-wrap{margin-bottom:24px}
.empty-title{font-size:22px;font-weight:600;color:var(--on-background);margin-bottom:8px;line-height:1.3}
.empty-message{font-size:14px;font-weight:400;color:var(--on-surface-variant);line-height:1.5;max-width:300px;margin:0 auto}
.back-btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 32px;border-radius:12px;border:none;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;margin-top:40px;min-width:200px;letter-spacing:.02em}
.back-btn:hover{opacity:.9}
.back-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
</head>
<body data-shell data-screen-id="direct-debit-detail" data-state="empty">

<header class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar" data-component-variant="standard" data-shell-top-app-bar role="banner">
  <button class="nav-btn" aria-label="Back to direct debits" data-nav-to="direct-debits">arrow_back</button>
  <span class="bar-title">Direct Debit</span>
  <div class="spacer"></div>
</header>

<main data-shell-content>

  <section data-component-type="stack" data-component-id="ddd_empty_state" data-component-variant="column" style="display:contents">

    <div class="empty-icon-wrap" data-component-type="icon" data-component-id="ddd_empty_icon" data-component-variant="standard" role="img" aria-label="Mandate not available">
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <circle cx="48" cy="48" r="48" fill="var(--surface-variant)" fill-opacity=".4"/>
        <g transform="translate(24,24)">
          <rect x="6" y="8" width="36" height="34" rx="3" fill="none" stroke="var(--outline)" stroke-width="2"/>
          <line x1="6" y1="16" x2="42" y2="16" stroke="var(--outline)" stroke-width="2"/>
          <line x1="15" y1="4" x2="15" y2="12" stroke="var(--outline)" stroke-width="2" stroke-linecap="round"/>
          <line x1="33" y1="4" x2="33" y2="12" stroke="var(--outline)" stroke-width="2" stroke-linecap="round"/>
          <line x1="20" y1="25" x2="28" y2="33" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="28" y1="25" x2="20" y2="33" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <h1 class="empty-title" data-component-type="text" data-component-id="ddd_empty_title" data-component-variant="title_large" role="heading" aria-label="Mandate not available">Mandate not available</h1>

    <p class="empty-message" data-component-type="text" data-component-id="ddd_empty_message" data-component-variant="body_medium" aria-label="Empty-state message">This direct debit could not be found. It may have already been cancelled or expired.</p>

    <button class="back-btn" data-component-type="button" data-component-id="ddd_empty_back_button" data-component-variant="filled" role="button" aria-label="Back to direct debits list" data-nav-to="direct-debits">
      Back to Direct Debits
    </button>

  </section>

</main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
