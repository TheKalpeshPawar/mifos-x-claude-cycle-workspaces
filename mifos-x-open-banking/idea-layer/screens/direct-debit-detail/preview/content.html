<!doctype html>
<!-- render-hash: ddd-content-llm -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Direct Debit Detail — British Gas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--tertiary:#386663;--tertiary-container:#BCEBE7;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;
  --surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;
  --surface-container:#F0F1E6;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --scrim:#000000;--pending:#E8A317;
  --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
}
@media (prefers-color-scheme:dark){
  :root {
    --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
    --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
    --background:#12140E;--on-background:#E3E3D8;
    --surface:#1E201A;--on-surface:#E3E3D8;
    --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
    --surface-container:#1E201A;
    --outline:#8F9285;--outline-variant:#44483D;
    --scrim:#000000;--pending:#E8A317;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-app-bar{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--background);border-bottom:1px solid var(--outline-variant);flex-shrink:0}
.nav-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--primary);font-family:'Material Symbols Outlined';font-size:var(--icon-md);font-weight:400;line-height:1;font-style:normal;letter-spacing:normal}
.bar-title{flex:1;text-align:center;font-size:18px;font-weight:500;color:var(--on-background)}
.spacer{min-width:44px}
main{flex:1;overflow-y:auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:0}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:8px;padding-bottom:4px}
.merchant-initial{width:64px;height:64px;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--on-primary-container)}
.merchant-name{font-size:20px;font-weight:600;color:var(--on-background);text-align:center;margin-top:4px}
.status-badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;background:var(--primary-container);color:var(--on-primary-container);font-size:12px;font-weight:500;letter-spacing:.02em}
.amount-value{font-size:36px;font-weight:700;color:var(--on-background);text-align:center;margin-top:4px;letter-spacing:-.5px}
.freq-text{font-size:14px;font-weight:400;color:var(--on-surface-variant);text-align:center}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;padding:16px;margin-top:24px}
.card-title{font-size:15px;font-weight:600;color:var(--on-background);margin-bottom:4px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--outline-variant)}
.detail-row:first-of-type{border-top:none}
.row-label{font-size:13px;font-weight:400;color:var(--on-surface-variant)}
.row-value{font-size:14px;font-weight:600;color:var(--on-surface);text-align:right}
.row-value.mono{font-family:'Roboto Mono',ui-monospace,monospace}
.acct-group{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.acct-name{font-size:14px;font-weight:600;color:var(--on-surface)}
.acct-masked{font-size:12px;font-weight:400;color:var(--on-surface-variant)}
.history-card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;padding:16px;margin-top:16px}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.history-title{font-size:15px;font-weight:600;color:var(--on-background)}
.view-all-link{font-size:13px;font-weight:500;color:var(--primary);text-decoration:none;min-height:44px;min-width:44px;display:inline-flex;align-items:center;cursor:pointer}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--outline-variant)}
.history-row:first-of-type{border-top:none}
.hist-date{font-size:13px;font-weight:400;color:var(--on-surface)}
.hist-amount{font-size:14px;font-weight:600;color:var(--on-surface)}
.cancel-btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;margin-top:24px;border-radius:12px;border:1.5px solid var(--outline);background:transparent;color:var(--on-surface-variant);font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:default;min-height:48px;letter-spacing:.02em;opacity:0.5}
</style>
</head>
<body data-shell data-screen-id="direct-debit-detail" data-state="content">

<header class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar" data-component-variant="standard" data-shell-top-app-bar role="banner">
  <button class="nav-btn" aria-label="Back to direct debits" data-nav-to="direct-debits">arrow_back</button>
  <span class="bar-title">Direct Debit</span>
  <div class="spacer"></div>
</header>

<main data-component-type="stack" data-component-id="ddd_root" data-component-variant="column" data-shell-content>

  <section class="hero" data-component-type="stack" data-component-id="ddd_merchant_hero" data-component-variant="column" role="region" aria-label="Mandate merchant summary">
    <div class="merchant-initial" aria-hidden="true">B</div>
    <div class="merchant-name" data-component-type="text" data-component-id="ddd_merchant_name" data-component-variant="headline_small" role="heading" aria-label="Merchant name">British Gas</div>
    <span class="status-badge" data-component-type="badge" data-component-id="ddd_mandate_status_badge" data-component-variant="tonal" role="status" aria-label="Mandate status: Active">Active</span>
    <div class="amount-value" data-component-type="text" data-component-id="ddd_mandate_amount_value" data-component-variant="display_small" aria-label="Mandate amount">&#163;78.50</div>
    <div class="freq-text" data-component-type="text" data-component-id="ddd_mandate_frequency_text" data-component-variant="body_medium" aria-label="Payment frequency">Monthly</div>
  </section>

  <div class="card" data-component-type="card" data-component-id="ddd_mandate_details_card" data-component-variant="outlined">
    <div class="card-title" data-component-type="text" data-component-id="ddd_details_header" data-component-variant="title_medium" role="heading" aria-label="Mandate details section">Mandate Details</div>

    <div class="detail-row" data-component-type="stack" data-component-id="ddd_next_payment_row" data-component-variant="row">
      <span class="row-label" data-component-type="text" data-component-id="ddd_next_payment_label" data-component-variant="body_medium">Next Payment</span>
      <span class="row-value" data-component-type="text" data-component-id="ddd_next_payment_value" data-component-variant="body_medium" aria-label="Next payment date">15 Jun 2026</span>
    </div>
    <hr role="separator" data-component-type="divider" data-component-id="ddd_divider_1" style="border:none;border-top:1px solid var(--outline-variant)"/>

    <div class="detail-row" data-component-type="stack" data-component-id="ddd_account_row" data-component-variant="row">
      <span class="row-label" data-component-type="text" data-component-id="ddd_account_label" data-component-variant="body_medium">Account</span>
      <div class="acct-group" data-component-type="stack" data-component-id="ddd_account_value_group" data-component-variant="column">
        <span class="acct-name" data-component-type="text" data-component-id="ddd_account_name" data-component-variant="body_medium" aria-label="Linked account name">HSBC Advance Current Account</span>
        <span class="acct-masked" data-component-type="text" data-component-id="ddd_account_number" data-component-variant="body_small" aria-label="Masked account number">&#x2022;&#x2022;&#x2022;&#x2022;0007</span>
      </div>
    </div>
    <hr role="separator" data-component-type="divider" data-component-id="ddd_divider_2" style="border:none;border-top:1px solid var(--outline-variant)"/>

    <div class="detail-row" data-component-type="stack" data-component-id="ddd_mandate_ref_row" data-component-variant="row">
      <span class="row-label" data-component-type="text" data-component-id="ddd_mandate_ref_label" data-component-variant="body_medium">Mandate Ref</span>
      <span class="row-value mono" data-component-type="text" data-component-id="ddd_mandate_ref_value" data-component-variant="body_medium" aria-label="Mandate reference">BRGAS-7741920</span>
    </div>
    <hr role="separator" data-component-type="divider" data-component-id="ddd_divider_3" style="border:none;border-top:1px solid var(--outline-variant)"/>

    <div class="detail-row" data-component-type="stack" data-component-id="ddd_start_date_row" data-component-variant="row">
      <span class="row-label" data-component-type="text" data-component-id="ddd_start_date_label" data-component-variant="body_medium">Start Date</span>
      <span class="row-value" data-component-type="text" data-component-id="ddd_start_date_value" data-component-variant="body_medium" aria-label="Start date">14 May 2026</span>
    </div>
  </div>

  <div class="history-card" data-component-type="card" data-component-id="ddd_payment_history_card" data-component-variant="outlined">
    <div class="history-header" data-component-type="stack" data-component-id="ddd_history_header_row" data-component-variant="row">
      <span class="history-title" data-component-type="text" data-component-id="ddd_history_header" data-component-variant="title_medium" role="heading" aria-label="Recent payments section">Recent Payments</span>
      <a class="view-all-link" data-component-type="link" data-component-id="ddd_history_view_all_link" data-component-variant="inline" role="link" aria-label="View all payments" data-nav-to="transactions" tabindex="0">View all</a>
    </div>
    <ul data-component-type="list" data-component-id="ddd_history_list" data-component-variant="column" role="list" aria-label="Recent collected payments" style="list-style:none;padding:0">
      <li class="history-row" data-component-type="list_item" data-component-id="ddd_history_row" data-component-variant="row" role="listitem" aria-label="Collected payment">
        <span class="hist-date" data-component-type="text" data-component-id="ddd_history_row_date" data-component-variant="body_medium" aria-label="Payment date">14 May 2026</span>
        <span class="hist-amount" data-component-type="text" data-component-id="ddd_history_row_amount" data-component-variant="body_medium" aria-label="Amount collected">&#8722;&#163;78.50</span>
      </li>
    </ul>
  </div>

  <!-- Cancel is UNSUPPORTED via OBIE — affordance shown as disabled/view-only -->
  <button class="cancel-btn" disabled aria-disabled="true" data-component-type="button" data-component-id="ddd_cancel_button" data-component-variant="outlined" aria-label="Cancel mandate (not supported)" data-action="cancel_unsupported">
    Cancel Mandate
  </button>

</main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
