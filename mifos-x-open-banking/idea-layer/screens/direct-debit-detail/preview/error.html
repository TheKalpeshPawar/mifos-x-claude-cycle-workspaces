<!doctype html>
<!-- render-hash: ddd-error-llm -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Direct Debit Detail — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--tertiary:#386663;--tertiary-container:#BCEBE7;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;
  --surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;
  --surface-container:#F0F1E6;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --scrim:#000000;--pending:#E8A317;
  --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
}
@media (prefers-color-scheme:dark){
  :root {
    --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
    --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
    --background:#12140E;--on-background:#E3E3D8;
    --surface:#1E201A;--on-surface:#E3E3D8;
    --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
    --surface-container:#1E201A;
    --outline:#8F9285;--outline-variant:#44483D;
    --scrim:#000000;--pending:#E8A317;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-app-bar{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--background);border-bottom:1px solid var(--outline-variant);flex-shrink:0}
.nav-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--primary);font-family:'Material Symbols Outlined';font-size:var(--icon-md);font-weight:400;line-height:1;font-style:normal;letter-spacing:normal}
.bar-title{flex:1;text-align:center;font-size:18px;font-weight:500;color:var(--on-background)}
.spacer{min-width:44px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.error-icon-wrap{margin-bottom:24px}
.error-title{font-size:22px;font-weight:600;color:var(--on-background);margin-bottom:8px;line-height:1.3;max-width:280px;margin-left:auto;margin-right:auto}
.error-message{font-size:14px;font-weight:400;color:var(--on-surface-variant);line-height:1.5;max-width:280px;margin:0 auto}
.retry-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 32px;border-radius:12px;border:none;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;margin-top:32px;min-width:200px;letter-spacing:.02em}
.retry-btn:hover{opacity:.9}
.retry-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.retry-icon{font-family:'Material Symbols Outlined';font-size:var(--icon-sm);font-weight:400;line-height:1;font-style:normal;letter-spacing:normal}
</style>
</head>
<body data-shell data-screen-id="direct-debit-detail" data-state="error">

<header class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar" data-component-variant="standard" data-shell-top-app-bar role="banner">
  <button class="nav-btn" aria-label="Back to direct debits" data-nav-to="direct-debits">arrow_back</button>
  <span class="bar-title">Direct Debit</span>
  <div class="spacer"></div>
</header>

<main data-shell-content>

  <section data-component-type="stack" data-component-id="ddd_error_state" data-component-variant="column" style="display:contents">

    <div class="error-icon-wrap" data-component-type="icon" data-component-id="ddd_error_icon" data-component-variant="standard" role="img" aria-label="Error loading mandate">
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <circle cx="48" cy="48" r="48" fill="var(--surface-variant)" fill-opacity=".4"/>
        <g transform="translate(24,24)">
          <path d="M8 28 C8 20 14 14 22 14 C22.6 14 23.2 14.1 23.8 14.2" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M28 14.6 C31.2 15.6 34 17.8 35.6 20.8 C38.2 21.2 40 23.4 40 26 C40 29.3 37.3 32 34 32 L14 32 C10.7 32 8 29.3 8 26" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <line x1="6" y1="6" x2="42" y2="42" stroke="var(--outline-variant)" stroke-width="2" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <h1 class="error-title" data-component-type="text" data-component-id="ddd_error_title" data-component-variant="title_large" role="heading" aria-label="Unable to load mandate">Unable to load mandate</h1>

    <p class="error-message" data-component-type="text" data-component-id="ddd_error_message" data-component-variant="body_medium" aria-label="Error description">Check your connection and try again</p>

    <button class="retry-btn" data-component-type="button" data-component-id="ddd_retry_button" data-component-variant="filled" role="button" aria-label="Retry loading mandate" data-action="onRetry">
      <span class="retry-icon" aria-hidden="true">refresh</span>
      Retry
    </button>

  </section>

</main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
