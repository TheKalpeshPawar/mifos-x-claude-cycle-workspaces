sibling: demo-data
schema_version: "4.0"
feature_id: direct-debit-detail

# OBIE has NO per-mandate GET — the detail screen is the single Data.DirectDebit[] item
# (OBReadDirectDebit2) drawn from the account's direct-debits list whose DirectDebitId matches
# the route mandateId. This fixture is that selected mandate (British Gas), shown as the single
# item in the OBIE envelope. OBIE has no cancel endpoint, so cancel is view-only/unsupported.
collections:
  direct_debit_detail:
    dto: OBReadDirectDebit2
    description: "200 OK — the selected direct-debit mandate (DirectDebitId == route mandateId), projected from the account's direct-debits list."
    item:
      Data:
        DirectDebit:
          - AccountId: "acc-22289-0007"
            DirectDebitId: "dd-1a90f7c3-0b21"
            MandateIdentification: "BRGAS-7741920"
            DirectDebitStatusCode: "Active"
            Name: "British Gas"
            PreviousPaymentDateTime: "2026-05-14T06:00:00+01:00"
            Frequency: "UK.OBIE.Monthly"
            PreviousPaymentAmount:
              Amount: "78.50"
              Currency: "GBP"
      Links:
        Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts/acc-22289-0007/direct-debits"
      Meta:
        TotalPages: 1

  # Best-effort funding-account display name (resolve_linked_account_name). Non-blocking — the
  # mandate still renders with its fallback name if this resolution fails.
  linked_account_name:
    description: "Resolved funding-account display values from get_account_details (Data.Account[].Nickname / .Account[].Name)."
    item:
      linked_account_name: "HSBC Advance Current Account"
      linked_account_masked: "****0007"

  # Empty-state path: no Data.DirectDebit[] item matches the route mandateId (400 not-found).
  direct_debit_detail.error:
    description: "Representative 400 OBErrorResponse1 — no mandate on the account matches the requested DirectDebitId."
    item:
      Code: "400 Bad Request"
      Id: "ddd-err-1c8045"
      Message: "Invalid request"
      Errors:
        - ErrorCode: "UK.OBIE.Field.Invalid"
          Message: "No direct-debit mandate with the supplied DirectDebitId exists on this account."
