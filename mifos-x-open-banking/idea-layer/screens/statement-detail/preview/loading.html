<!doctype html>
<!-- render-hash: 4taba8e2f04b -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Statement Detail — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-tertiary: #64597B;
      --md-sys-color-on-tertiary: #FFFFFF;
      --md-sys-color-tertiary-container: #EADDFF;
      --md-sys-color-on-tertiary-container: #4C4162;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      --md-sys-color-inverse-surface: #2D3135;
      --md-sys-color-inverse-on-surface: #EEF1F6;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-high: #E5E8ED;
      --md-sys-color-surface-container-highest: #E0E3E8;
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;
    }
    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-tertiary: #CFC0E8;
      --md-sys-color-on-tertiary: #352B4B;
      --md-sys-color-tertiary-container: #4C4162;
      --md-sys-color-on-tertiary-container: #EADDFF;
      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
      --md-sys-color-inverse-surface: #E0E3E8;
      --md-sys-color-inverse-on-surface: #2D3135;
      --md-sys-color-surface-container-lowest: #0B0F12;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-high: #262A2E;
      --md-sys-color-surface-container-highest: #313539;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top App Bar ── */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px;
      background-color: var(--md-sys-color-surface);
      flex-shrink: 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
    }
    .app-bar-title {
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      flex: 1;
      margin-left: 4px;
    }
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      user-select: none;
      line-height: 1;
    }

    /* ── Scrollable body ── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 100px;
    }

    /* ── Shimmer skeleton ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skel {
      background: linear-gradient(
        90deg,
        var(--md-sys-color-surface-container-high) 25%,
        var(--md-sys-color-surface-container-highest) 50%,
        var(--md-sys-color-surface-container-high) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }

    /* Period card skeleton */
    .skel-period-card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-medium);
      padding: 16px;
      margin-bottom: 4px;
    }
    .skel-period-card .skel { margin-bottom: 8px; }
    .skel-period-card .skel:last-child { margin-bottom: 0; }

    /* Section header skeleton */
    .skel-section-hdr {
      margin: 20px 0 10px;
    }

    /* List card skeleton */
    .list-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-medium);
      padding: 0 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .skel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 10px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .skel-row:last-child { border-bottom: none; }
    .skel-row__body { flex: 1; }

    /* Download button skeleton */
    .skel-btn-area {
      margin-top: 24px;
    }

    /* ── Loading indicator (centered, beneath skeleton) ── */
    .loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px 0 16px;
    }
    .circular-progress {
      width: 36px;
      height: 36px;
      border: 3px solid var(--md-sys-color-surface-container-highest);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label {
      font-size: 14px;
      line-height: 20px;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ── Bottom navigation ── */
    .bottom-nav {
      height: 80px;
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: flex-start;
      padding-top: 12px;
      flex-shrink: 0;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
    }
    .nav-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--md-shape-corner-full);
    }
    .nav-item .material-symbols-rounded { color: var(--md-sys-color-on-surface-variant); }
    .nav-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ── -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" aria-label="Navigate back" data-action="navigate_back">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <h1 class="app-bar-title">Statement</h1>
  </header>

  <!-- ── Scrollable content ── -->
  <main class="screen-content"
        data-screen="statement-detail"
        data-state="loading"
        aria-label="Loading statement"
        aria-busy="true">

    <!-- Loading indicator (circular progress, full-screen) -->
    <div class="loading-indicator"
         role="status"
         aria-label="Loading statement">
      <div class="circular-progress" aria-hidden="true"></div>
      <p class="loading-label">Loading statement</p>
    </div>

    <!-- Period card skeleton -->
    <div class="skel-period-card" aria-hidden="true">
      <div class="skel" style="width:44%;height:12px;"></div>
      <div class="skel" style="width:72%;height:16px;margin-top:10px;"></div>
      <div class="skel" style="width:36%;height:12px;margin-top:8px;"></div>
      <div class="skel" style="width:52%;height:11px;margin-top:6px;"></div>
    </div>

    <!-- Balances section skeleton -->
    <div class="skel-section-hdr" aria-hidden="true">
      <div class="skel" style="width:72px;height:14px;"></div>
    </div>
    <div class="list-card" aria-hidden="true">
      <div class="skel-row">
        <div class="skel-row__body">
          <div class="skel" style="width:56%;height:14px;"></div>
        </div>
        <div class="skel" style="width:72px;height:16px;"></div>
      </div>
      <div class="skel-row">
        <div class="skel-row__body">
          <div class="skel" style="width:52%;height:14px;"></div>
        </div>
        <div class="skel" style="width:72px;height:16px;"></div>
      </div>
    </div>

    <!-- Fees section skeleton -->
    <div class="skel-section-hdr" aria-hidden="true">
      <div class="skel" style="width:40px;height:14px;"></div>
    </div>
    <div class="list-card" aria-hidden="true">
      <div class="skel-row">
        <div class="skel-row__body">
          <div class="skel" style="width:64%;height:14px;"></div>
        </div>
        <div class="skel" style="width:48px;height:16px;"></div>
      </div>
    </div>

    <!-- Transactions section skeleton -->
    <div class="skel-section-hdr" aria-hidden="true">
      <div class="skel" style="width:100px;height:14px;"></div>
    </div>
    <div class="list-card" aria-hidden="true">
      <!-- 4 skeleton transaction rows -->
      <div class="skel-row">
        <div class="skel-row__body">
          <div class="skel" style="width:80px;height:11px;margin-bottom:5px;"></div>
          <div class="skel" style="width:68%;height:14px;"></div>
        </div>
        <div class="skel" style="width:56px;height:14px;"></div>
      </div>
      <div class="skel-row">
        <div class="skel-row__body">
          <div class="skel" style="width:80px;height:11px;margin-bottom:5px;"></div>
          <div class="skel" style="width:80%;height:14px;"></div>
        </div>
        <div class="skel" style="width:64px;height:14px;"></div>
      </div>
      <div class="skel-row">
        <div class="skel-row__body">
          <div class="skel" style="width:80px;height:11px;margin-bottom:5px;"></div>
          <div class="skel" style="width:56%;height:14px;"></div>
        </div>
        <div class="skel" style="width:56px;height:14px;"></div>
      </div>
      <div class="skel-row">
        <div class="skel-row__body">
          <div class="skel" style="width:80px;height:11px;margin-bottom:5px;"></div>
          <div class="skel" style="width:72%;height:14px;"></div>
        </div>
        <div class="skel" style="width:64px;height:14px;"></div>
      </div>
    </div>

    <!-- Download button skeleton -->
    <div class="skel-btn-area" aria-hidden="true">
      <div class="skel" style="width:100%;height:40px;border-radius:9999px;"></div>
    </div>

  </main>

  <!-- ── Bottom navigation — Home · Accounts · Transactions · More ── -->
  <!-- Sub-screen: statement-detail is a pushed destination; no active tab highlighted. -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" aria-label="Home" data-nav-to="home">
      <div class="nav-pill">
        <span class="material-symbols-rounded">home</span>
      </div>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" aria-label="Accounts" data-nav-to="accounts">
      <div class="nav-pill">
        <span class="material-symbols-rounded">account_balance</span>
      </div>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-item" aria-label="Transactions" data-nav-to="transactions">
      <div class="nav-pill">
        <span class="material-symbols-rounded">receipt_long</span>
      </div>
      <span class="nav-label">Transactions</span>
    </button>
    <button class="nav-item" aria-label="More" data-nav-to="settings">
      <div class="nav-pill">
        <span class="material-symbols-rounded">more_horiz</span>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
