<!doctype html>
<!-- render-hash: 4tabb6f3e18a -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Statement Detail — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-tertiary: #64597B;
      --md-sys-color-on-tertiary: #FFFFFF;
      --md-sys-color-tertiary-container: #EADDFF;
      --md-sys-color-on-tertiary-container: #4C4162;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      --md-sys-color-inverse-surface: #2D3135;
      --md-sys-color-inverse-on-surface: #EEF1F6;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-high: #E5E8ED;
      --md-sys-color-surface-container-highest: #E0E3E8;
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;
    }
    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-tertiary: #CFC0E8;
      --md-sys-color-on-tertiary: #352B4B;
      --md-sys-color-tertiary-container: #4C4162;
      --md-sys-color-on-tertiary-container: #EADDFF;
      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
      --md-sys-color-inverse-surface: #E0E3E8;
      --md-sys-color-inverse-on-surface: #2D3135;
      --md-sys-color-surface-container-lowest: #0B0F12;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-high: #262A2E;
      --md-sys-color-surface-container-highest: #313539;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top App Bar ── */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px;
      background-color: var(--md-sys-color-surface);
      flex-shrink: 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
    }
    .icon-btn:hover { background-color: rgba(24,28,32,0.08); }
    .app-bar-title {
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      flex: 1;
      margin-left: 4px;
    }
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      user-select: none;
      line-height: 1;
    }

    /* ── Scrollable body ── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 0 16px 100px;
    }

    /* ── Error state (full-screen) ── */
    .error-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      gap: 0;
    }
    .error-icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: var(--md-sys-color-error-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .error-icon-wrap .material-symbols-rounded {
      font-size: 40px;
      color: var(--md-sys-color-on-error-container);
    }
    .error-title {
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 12px;
    }
    .error-body {
      font-size: 14px;
      line-height: 20px;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 280px;
      margin-bottom: 32px;
    }
    .error-code-chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: var(--md-shape-corner-full);
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }

    /* ── Retry button (filled) ── */
    .btn-filled {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 24px;
      border: none;
      border-radius: var(--md-shape-corner-full);
      background-color: var(--md-sys-color-primary);
      font-family: 'Roboto', system-ui;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      letter-spacing: 0.1px;
      color: var(--md-sys-color-on-primary);
      cursor: pointer;
      min-width: 160px;
    }
    .btn-filled:hover { opacity: 0.92; }
    .btn-filled:active { opacity: 0.84; }

    /* ── Bottom navigation ── */
    .bottom-nav {
      height: 80px;
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: flex-start;
      padding-top: 12px;
      flex-shrink: 0;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
    }
    .nav-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--md-shape-corner-full);
    }
    .nav-item .material-symbols-rounded { color: var(--md-sys-color-on-surface-variant); }
    .nav-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ── -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" aria-label="Navigate back" data-action="navigate_back">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <h1 class="app-bar-title">Statement</h1>
  </header>

  <!-- ── Error content ── -->
  <main class="screen-content"
        data-screen="statement-detail"
        data-state="error"
        aria-label="Error loading statement detail">

    <div class="error-state"
         role="alert"
         aria-label="Error loading statement detail">

      <!-- Error icon -->
      <div class="error-icon-wrap" aria-hidden="true">
        <span class="material-symbols-rounded">error_outline</span>
      </div>

      <!-- Error title -->
      <h2 class="error-title">Could not load statement</h2>

      <!-- Error detail — from error.message (representative 403 scenario) -->
      <p class="error-body">
        Your consent does not include ReadStatementsDetail permission.
        Please revoke and reauthorise to access statement data.
      </p>

      <!-- Error code chip -->
      <span class="error-code-chip">HTTP 403 · Consent scope insufficient</span>

      <!-- Retry button -->
      <button class="btn-filled"
              aria-label="Retry loading statement detail"
              data-action="retry_load">
        Retry
      </button>

    </div>

  </main>

  <!-- ── Bottom navigation — Home · Accounts · Transactions · More ── -->
  <!-- Sub-screen: statement-detail is a pushed destination; no active tab highlighted. -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" aria-label="Home" data-nav-to="home">
      <div class="nav-pill">
        <span class="material-symbols-rounded">home</span>
      </div>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" aria-label="Accounts" data-nav-to="accounts">
      <div class="nav-pill">
        <span class="material-symbols-rounded">account_balance</span>
      </div>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-item" aria-label="Transactions" data-nav-to="transactions">
      <div class="nav-pill">
        <span class="material-symbols-rounded">receipt_long</span>
      </div>
      <span class="nav-label">Transactions</span>
    </button>
    <button class="nav-item" aria-label="More" data-nav-to="settings">
      <div class="nav-pill">
        <span class="material-symbols-rounded">more_horiz</span>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
