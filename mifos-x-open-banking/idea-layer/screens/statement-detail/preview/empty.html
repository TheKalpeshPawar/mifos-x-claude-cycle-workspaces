<!doctype html>
<!-- render-hash: 4tabe5d7c2a9 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Statement Detail — Empty</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-tertiary: #64597B;
      --md-sys-color-on-tertiary: #FFFFFF;
      --md-sys-color-tertiary-container: #EADDFF;
      --md-sys-color-on-tertiary-container: #4C4162;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      --md-sys-color-inverse-surface: #2D3135;
      --md-sys-color-inverse-on-surface: #EEF1F6;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-high: #E5E8ED;
      --md-sys-color-surface-container-highest: #E0E3E8;
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;
    }
    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-tertiary: #CFC0E8;
      --md-sys-color-on-tertiary: #352B4B;
      --md-sys-color-tertiary-container: #4C4162;
      --md-sys-color-on-tertiary-container: #EADDFF;
      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
      --md-sys-color-inverse-surface: #E0E3E8;
      --md-sys-color-inverse-on-surface: #2D3135;
      --md-sys-color-surface-container-lowest: #0B0F12;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-high: #262A2E;
      --md-sys-color-surface-container-highest: #313539;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top App Bar ── */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px;
      background-color: var(--md-sys-color-surface);
      flex-shrink: 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
    }
    .icon-btn:hover { background-color: rgba(24,28,32,0.08); }
    .app-bar-title {
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      flex: 1;
      margin-left: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      user-select: none;
      line-height: 1;
    }

    /* ── Scrollable body ── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 100px;
    }

    /* ── Period header card ── */
    .period-card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-medium);
      padding: 16px;
      margin-bottom: 4px;
    }
    .period-ref {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--md-sys-color-secondary);
      margin-bottom: 4px;
    }
    .period-range {
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 4px;
    }
    .period-type {
      font-size: 12px;
      line-height: 16px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 2px;
    }
    .period-created {
      font-size: 11px;
      line-height: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ── Section header ── */
    .section-header {
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      padding: 20px 0 8px;
    }

    /* ── List container ── */
    .list-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-medium);
      padding: 0 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 10px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .list-item:last-child { border-bottom: none; }
    .list-item__body { flex: 1; }
    .list-item__primary {
      font-size: 16px;
      line-height: 24px;
      color: var(--md-sys-color-on-surface);
    }
    .list-item__trailing {
      font-family: 'Roboto Mono', monospace;
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
      margin-left: 12px;
    }
    .color-tertiary { color: var(--md-sys-color-tertiary); }
    .color-surface  { color: var(--md-sys-color-on-surface); }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px 24px;
    }
    .empty-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .empty-icon-wrap .material-symbols-rounded {
      font-size: 36px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .empty-title {
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 8px;
    }
    .empty-body {
      font-size: 14px;
      line-height: 20px;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ── Download button ── */
    .download-area { margin-top: 24px; }
    .btn-outlined {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 40px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-full);
      background: transparent;
      font-family: 'Roboto', system-ui;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      letter-spacing: 0.1px;
      color: var(--md-sys-color-primary);
      cursor: pointer;
    }
    .btn-outlined .material-symbols-rounded { font-size: 18px; }

    /* ── Bottom navigation ── */
    .bottom-nav {
      height: 80px;
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: flex-start;
      padding-top: 12px;
      flex-shrink: 0;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
    }
    .nav-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--md-shape-corner-full);
    }
    .nav-item .material-symbols-rounded { color: var(--md-sys-color-on-surface-variant); }
    .nav-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ── -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" aria-label="Navigate back" data-action="navigate_back">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <h1 class="app-bar-title">MAY-2026-NEW</h1>
  </header>

  <!-- ── Scrollable content ── -->
  <main class="screen-content"
        data-screen="statement-detail"
        data-state="empty"
        aria-label="Statement detail — no transactions">

    <!-- Period header card (balances still load for empty transactions scenario) -->
    <article class="period-card"
             aria-label="Statement details for MAY-2026-NEW">
      <p class="period-ref">MAY-2026-NEW</p>
      <p class="period-range">1 May 2026 – 31 May 2026</p>
      <p class="period-type">RegularPeriodic</p>
      <p class="period-created">Created 1 Jun 2026</p>
    </article>

    <!-- ── Balances ── (loaded; empty transactions is the edge case, not empty account) -->
    <h2 class="section-header">Balances</h2>
    <div class="list-card" role="list" aria-label="Balances">
      <div class="list-item"
           role="listitem"
           aria-label="Opening Balance: 500.00 GBP Credit">
        <div class="list-item__body">
          <p class="list-item__primary">Opening Balance</p>
        </div>
        <span class="list-item__trailing color-tertiary">£500.00</span>
      </div>
      <div class="list-item"
           role="listitem"
           aria-label="Closing Balance: 500.00 GBP Credit">
        <div class="list-item__body">
          <p class="list-item__primary">Closing Balance</p>
        </div>
        <span class="list-item__trailing color-tertiary">£500.00</span>
      </div>
    </div>

    <!-- ── Transactions section header (always shown) ── -->
    <h2 class="section-header">Transactions</h2>

    <!-- ── Empty transactions state ── -->
    <div class="empty-state"
         role="status"
         aria-label="No transactions">
      <div class="empty-icon-wrap" aria-hidden="true">
        <span class="material-symbols-rounded">receipt_long</span>
      </div>
      <p class="empty-title">No transactions</p>
      <p class="empty-body">No transactions recorded in this statement period</p>
    </div>

    <!-- ── Download PDF button ── (enabled — PDF still available even with no transactions) -->
    <div class="download-area">
      <button class="btn-outlined"
              aria-label="Download statement as PDF"
              data-action="download_statement_pdf">
        <span class="material-symbols-rounded">download</span>
        Download PDF
      </button>
    </div>

  </main>

  <!-- ── Bottom navigation — Home · Accounts · Transactions · More ── -->
  <!-- Sub-screen: statement-detail is a pushed destination; no active tab highlighted. -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" aria-label="Home" data-nav-to="home">
      <div class="nav-pill">
        <span class="material-symbols-rounded">home</span>
      </div>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" aria-label="Accounts" data-nav-to="accounts">
      <div class="nav-pill">
        <span class="material-symbols-rounded">account_balance</span>
      </div>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-item" aria-label="Transactions" data-nav-to="transactions">
      <div class="nav-pill">
        <span class="material-symbols-rounded">receipt_long</span>
      </div>
      <span class="nav-label">Transactions</span>
    </button>
    <button class="nav-item" aria-label="More" data-nav-to="settings">
      <div class="nav-pill">
        <span class="material-symbols-rounded">more_horiz</span>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
