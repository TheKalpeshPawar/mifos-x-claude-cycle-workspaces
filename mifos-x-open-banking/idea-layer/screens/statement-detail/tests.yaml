screen_id: statement-detail

scenarios:
  - id: TC-STMTD-001
    description: "Statement detail loads with period, balances, fees, interest, and 6 transactions"
    state: content
    priority: critical
    given: "Valid PSU access token; HSBC sandbox returns MAY-2026-STMT with 6 transactions"
    when: "Screen mounts with accountId=40051512345678 and statementId=STMT-2026-05-40051512345678"
    then:
      - "Top app bar title shows statement reference MAY-2026-STMT"
      - "Period header shows 1 May 2026 – 31 May 2026"
      - "Statement type 'RegularPeriodic' visible"
      - "Balances section: Opening Balance £2,610.40 (neutral), Closing Balance £2,847.63 (green/tertiary)"
      - "Fees section: 'Monthly maintenance fee £0.00' renders"
      - "Interest section: 'In-credit interest £0.21' renders in green/tertiary"
      - "6 transaction rows render with date overline, description, and sign-prefixed amount"
      - "Credit transactions show '+' and tertiary color; debit show '-' and error color"
      - "Download PDF button visible and enabled"

  - id: TC-STMTD-002
    description: "Loading state shown during parallel fetch"
    state: loading
    priority: critical
    given: "Slow network; both API calls (statement-detail and statement-txns) in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible with accessible label"
      - "Content sections not rendered"
      - "Top app bar title falls back to localized 'Statement'"

  - id: TC-STMTD-003
    description: "Error state with Retry button on 404 statement not found"
    state: error
    priority: critical
    given: "StatementId does not exist; statement-detail endpoint returns HTTP 404"
    when: "Screen mounts"
    then:
      - "Error icon and localized 'Could not load statement' title render"
      - "Error body shows 'Statement not found.' message"
      - "Retry button visible with correct accessible label"
      - "Tapping Retry re-triggers statementDetailLoad"

  - id: TC-STMTD-004
    description: "Download PDF triggers statement-file call, shows linear progress, then snackbar on success"
    state: content
    priority: critical
    when: "User taps Download PDF"
    then:
      - "statement-file endpoint called with correct AccountId and StatementId"
      - "Download PDF button becomes disabled while Downloading"
      - "Linear progress indicator appears beneath the button"
      - "On success: downloadState=Downloaded; snackbar 'Statement PDF saved' appears and auto-dismisses after 4s"
      - "Native share/save sheet presented with PDF binary"

  - id: TC-STMTD-005
    description: "Back navigation returns to statements list"
    state: content
    priority: normal
    when: "User taps back button in top app bar"
    then: "Navigates back to statements screen"

  - id: TC-STMTD-006
    description: "Error state with specific message on 403 consent scope missing"
    state: error
    priority: critical
    given: "PSU consent does not include ReadStatementsDetail permission"
    when: "Screen mounts and statement-detail endpoint returns HTTP 403"
    then:
      - "Error state renders with 'Could not load statement' title"
      - "Body shows 'Consent does not include ReadStatements.'"
      - "Retry button visible"

  - id: TC-STMTD-007
    description: "Empty state shown when statement has no transactions in period"
    state: empty
    priority: normal
    given: "Valid HSBC sandbox response: OBStatement2 with balances returned, statement-txns returns empty Data.Transaction array"
    when: "Screen mounts"
    then:
      - "Period header card and Balances section render as normal"
      - "Transactions section header visible"
      - "Empty state component renders with 'No transactions' title and explanatory body"
      - "Download PDF button still visible and enabled"

  - id: TC-STMTD-008
    description: "Download error snackbar on statement-file 404"
    state: content
    priority: normal
    given: "Statement PDF file not yet generated by HSBC (HTTP 404 on statement-file endpoint)"
    when: "User taps Download PDF"
    then:
      - "Linear progress appears briefly"
      - "downloadState transitions to DownloadError"
      - "Snackbar 'Download failed' appears and auto-dismisses"
      - "Download PDF button re-enabled"

  - id: TC-STMTD-009
    description: "Error state with session-expired message on 401 unauthorized"
    state: error
    priority: critical
    given: "PSU access token has expired; statement-detail endpoint returns HTTP 401"
    when: "Screen mounts with valid accountId and statementId"
    then:
      - "Error icon and localized 'Could not load statement' title render"
      - "Error body shows 'Session expired. Please re-authenticate.'"
      - "Retry button visible with accessible label matching stmt_detail.a11y.retry"
      - "Tapping Retry re-triggers statementDetailLoad"
