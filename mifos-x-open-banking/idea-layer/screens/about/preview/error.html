<!doctype html>
<!-- render-hash: ab0r3r2z526a1 -->
<html lang="en" data-screen="about" data-state="error" data-feature="about" data-flavor="shared">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About — Error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF;
    --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701;
    --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; }
  .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 20px; background: transparent; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--on-surface-variant); }
  .top-bar h1 { font-size: 20px; font-weight: 700; }
  .error-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 32px 48px; }
  .error-icon { width: 96px; height: 96px; border-radius: 48px; background: var(--error-container); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .error-icon .material-icons { font-size: 48px; color: var(--error); }
  .error-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; }
  .error-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 28px; line-height: 1.45; max-width: 300px; }
  .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn.filled { background: var(--primary); color: var(--on-primary); }
  .btn.outlined { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn .material-icons { font-size: 18px; }
</style>
</head>
<body>
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back"><span class="material-icons">arrow_back</span></button>
    <h1>About</h1>
  </header>

  <main class="error-wrap" role="region" aria-live="assertive">
    <div class="error-icon" aria-hidden="true"><span class="material-icons">info_outline</span></div>
    <h2 class="error-title">Unable to load app information</h2>
    <p class="error-msg">We couldn't read the build metadata. Please restart the app — if the issue persists, reinstall from your app store.</p>
    <div class="actions">
      <button class="btn filled" data-action="restart_app" aria-label="Restart the app"><span class="material-icons">restart_alt</span>Restart App</button>
      <button class="btn outlined" data-action="open_external" data-target="help-center" aria-label="Open the Help Center"><span class="material-icons">help_outline</span>Get Help</button>
    </div>
  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
