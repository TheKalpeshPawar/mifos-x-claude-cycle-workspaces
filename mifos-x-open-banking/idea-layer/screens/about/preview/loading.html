<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline-variant: #C5C8BA;
    --radius-soft: 12px;
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline-variant: #44483D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline-variant: #44483D;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; }
  .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .top-bar .material-icons { font-size: var(--icon-sm); color: var(--on-surface-variant); }
  .top-bar h1 { font-size: 20px; font-weight: 700; color: var(--on-background); }
  .shim { background: linear-gradient(90deg, var(--surface-variant) 0%, var(--outline-variant) 50%, var(--surface-variant) 100%); background-size: 200% 100%; animation: shim 1.4s ease-in-out infinite; border-radius: 6px; }
  @keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .logo-skel { display: flex; flex-direction: column; align-items: center; padding: 24px 24px 32px; }
  .skel-logo { width: 96px; height: 96px; border-radius: 28px; margin-bottom: 16px; }
  .skel-app-name { height: 22px; width: 60%; margin-bottom: 8px; }
  .skel-tagline { height: 14px; width: 40%; }
  .card-skel { background: var(--surface); border-radius: var(--radius-soft); margin: 0 16px 12px; padding: 8px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .skel-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--surface-variant); }
  .skel-row:first-child { border-top: none; }
  .skel-row-label { height: 14px; width: 40%; }
  .skel-row-value { height: 12px; width: 25%; }
  .skel-header { height: 11px; width: 30%; margin: 4px 0 4px; }
  .skel-btn { height: 48px; border-radius: 12px; margin: 16px 16px 12px; }
</style>
</head>
