<!doctype html>
<html lang="en" data-screen="about" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Mifos X Open Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      min-height: 100vh;
    }

    .device-frame {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--background);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top App Bar */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--spacing-sm);
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-app-bar__nav-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--on-background);
      flex-shrink: 0;
    }

    .top-app-bar__nav-btn:hover {
      background: rgba(0,0,0,0.08);
    }

    .top-app-bar__title {
      font-size: 22px;
      font-weight: 500;
      color: var(--on-background);
      flex: 1;
      padding-left: var(--spacing-sm);
    }

    /* Main content */
    main {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-lg);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    /* Logo Section */
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: var(--spacing-xl);
      padding-bottom: var(--spacing-xl);
      gap: var(--spacing-sm);
    }

    .logo-icon-wrapper {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--spacing-sm);
    }

    .logo-icon-wrapper .material-icons {
      font-size: 64px;
      color: var(--primary);
    }

    .app-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
    }

    .app-tagline {
      font-size: 14px;
      font-weight: 400;
      color: var(--outline);
      text-align: center;
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: var(--spacing-md);
    }

    /* Card section header */
    .card-section-header {
      font-size: 16px;
      font-weight: 600;
      color: var(--primary);
      padding-bottom: var(--spacing-sm);
    }

    /* Info Row */
    .info-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding-top: var(--spacing-sm);
      padding-bottom: var(--spacing-sm);
    }

    .info-row__label {
      font-size: 16px;
      font-weight: 400;
      color: var(--on-surface);
    }

    .info-row__value {
      font-size: 14px;
      font-weight: 400;
      color: var(--outline);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--surface-variant);
      margin-top: var(--spacing-xs);
      margin-bottom: var(--spacing-xs);
    }

    /* Link row */
    .link-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding-top: var(--spacing-sm);
      padding-bottom: var(--spacing-sm);
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .link-row:hover {
      background: rgba(76, 102, 43, 0.04);
    }

    .link-row__label {
      font-size: 16px;
      font-weight: 400;
      color: var(--on-surface);
      text-decoration: none;
    }

    .link-row__icon {
      color: var(--outline-variant);
      font-size: 18px;
    }

    /* Rate button */
    .btn-outlined {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px var(--spacing-xl);
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      background: transparent;
      color: var(--primary);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: var(--spacing-lg);
      transition: background 0.15s;
    }

    .btn-outlined:hover {
      background: rgba(76, 102, 43, 0.08);
    }

    .material-icons {
      font-family: 'Material Icons';
      font-style: normal;
      font-weight: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <!-- Top App Bar -->
    <nav class="top-app-bar" role="navigation" aria-label="Screen navigation">
      <button
        class="top-app-bar__nav-btn"
        aria-label="Navigate back"
        data-action="navigate_back"
        data-component-type="icon_button"
        data-component-id="top_app_bar_back"
      >
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar__title">About</h1>
    </nav>

    <!-- Main Content -->
    <main id="about_root" data-component-type="stack" data-component-id="about_root">

      <!-- Logo / Identity Section -->
      <section
        class="logo-section"
        data-component-type="stack"
        data-component-id="about_logo_section"
        aria-label="App identity"
      >
        <div
          class="logo-icon-wrapper"
          data-component-type="image"
          data-component-id="about_logo_image"
          role="img"
          aria-label="Mifos X Open Banking logo"
        >
          <span class="material-icons" aria-hidden="true" style="color: var(--primary); font-size: 64px;">account_balance</span>
        </div>
        <h2
          class="app-name"
          data-component-type="text"
          data-component-id="about_app_name_text"
          role="heading"
          aria-label="Mifos X Open Banking"
        >
          Mifos X Open Banking
        </h2>
        <p
          class="app-tagline"
          data-component-type="text"
          data-component-id="about_tagline_text"
          role="text"
          aria-label="Open Banking for Everyone"
        >
          Open Banking for Everyone
        </p>
      </section>

      <!-- App Info Card -->
      <div
        class="card"
        data-component-type="card"
        data-component-id="about_app_info_card"
        role="region"
        aria-label="Application information"
      >
        <!-- Version row -->
        <div
          class="info-row"
          data-component-type="stack"
          data-component-id="about_version_row"
        >
          <span
            class="info-row__label"
            data-component-type="text"
            data-component-id="about_version_label"
            role="text"
            aria-label="Version"
          >Version</span>
          <span
            class="info-row__value"
            data-component-type="text"
            data-component-id="about_version_value"
            role="text"
            aria-label="Version 1.0.0"
          >1.0.0</span>
        </div>

        <hr
          class="divider"
          data-component-type="divider"
          data-component-id="about_divider_1"
          role="separator"
          aria-hidden="true"
        >

        <!-- Build row -->
        <div
          class="info-row"
          data-component-type="stack"
          data-component-id="about_build_row"
        >
          <span
            class="info-row__label"
            data-component-type="text"
            data-component-id="about_build_label"
            role="text"
            aria-label="Build number"
          >Build</span>
          <span
            class="info-row__value"
            data-component-type="text"
            data-component-id="about_build_value"
            role="text"
            aria-label="Build 2026.05.001"
          >2026.05.001</span>
        </div>
      </div>

      <!-- Legal / Links Card -->
      <div
        class="card"
        data-component-type="card"
        data-component-id="about_legal_card"
        role="region"
        aria-label="Legal information"
      >
        <h3
          class="card-section-header"
          data-component-type="text"
          data-component-id="about_legal_header"
          role="heading"
          aria-label="Legal section"
        >Legal</h3>

        <!-- Terms of Service -->
        <div
          class="link-row"
          data-component-type="stack"
          data-component-id="about_tos_row"
        >
          <a
            class="link-row__label"
            data-component-type="link"
            data-component-id="about_tos_link"
            href="#"
            role="link"
            aria-label="Open Terms of Service"
            tabindex="0"
            data-action="open_terms_of_service"
          >Terms of Service</a>
          <span
            class="material-icons link-row__icon"
            data-component-type="icon"
            data-component-id="about_tos_chevron"
            aria-hidden="true"
          >open_in_new</span>
        </div>

        <hr
          class="divider"
          data-component-type="divider"
          data-component-id="about_divider_2"
          role="separator"
          aria-hidden="true"
        >

        <!-- Privacy Policy -->
        <div
          class="link-row"
          data-component-type="stack"
          data-component-id="about_privacy_row"
        >
          <a
            class="link-row__label"
            data-component-type="link"
            data-component-id="about_privacy_link"
            href="#"
            role="link"
            aria-label="Open Privacy Policy"
            tabindex="0"
            data-action="open_privacy_policy"
          >Privacy Policy</a>
          <span
            class="material-icons link-row__icon"
            data-component-type="icon"
            data-component-id="about_privacy_chevron"
            aria-hidden="true"
          >open_in_new</span>
        </div>

        <hr
          class="divider"
          data-component-type="divider"
          data-component-id="about_divider_3"
          role="separator"
          aria-hidden="true"
        >

        <!-- Open Source Licenses -->
        <div
          class="link-row"
          data-component-type="stack"
          data-component-id="about_licenses_row"
        >
          <a
            class="link-row__label"
            data-component-type="link"
            data-component-id="about_licenses_link"
            href="#"
            role="link"
            aria-label="View Open Source Licenses"
            tabindex="0"
            data-action="open_licenses"
          >Open Source Licenses</a>
          <span
            class="material-icons link-row__icon"
            data-component-type="icon"
            data-component-id="about_licenses_chevron"
            aria-hidden="true"
          >chevron_right</span>
        </div>
      </div>

      <!-- Rate App Button -->
      <button
        class="btn-outlined"
        data-component-type="button"
        data-component-id="about_rate_button"
        role="button"
        aria-label="Rate Mifos X Open Banking on the app store"
        tabindex="0"
        data-action="rate_app"
      >
        Rate This App
      </button>

    </main>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
