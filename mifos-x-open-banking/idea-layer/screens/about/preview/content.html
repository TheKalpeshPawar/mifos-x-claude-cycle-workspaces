<!doctype html>
<html lang="en" data-screen="about" data-state="content" data-feature="about" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .logo-section { text-align: center; padding: 32px 24px 24px; }
    .logo-icon { width: 80px; height: 80px; background: var(--primary-container); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .logo-icon .material-icons { font-size: 40px; color: var(--primary); }
    .app-name { font-size: 20px; font-weight: 700; color: var(--primary); }
    .version { font-size: 13px; color: var(--on-surface-variant); margin-top: 4px; }
    .link-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); cursor: pointer; }
    .link-row .label { font-size: 15px; color: var(--on-background); }
    .link-row .material-icons { font-size: 20px; color: var(--on-surface-variant); }
    .rate-btn { margin: 24px 20px; padding: 14px; background: transparent; border: 1px solid var(--primary); border-radius: 12px; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span>
      <h1 data-component-type="text">About</h1>
    </div>
    <div class="logo-section" data-component-type="stack" data-component-id="about_logo_section">
      <div class="logo-icon" data-component-type="image" data-component-id="about_logo_image" role="img" aria-label="Mifos X logo"><span class="material-icons">account_balance</span></div>
      <div class="app-name" data-component-type="text" data-component-id="about_app_name_text">Mifos X Open Banking</div>
      <div class="version" data-component-type="text" data-component-id="about_version_value">Version 1.0.0 · Build 1</div>
    </div>
    <div class="link-row" data-action="open_external" data-component-type="link" data-component-id="about_tos_link" tabindex="0" aria-label="Terms of Service">
      <span class="label">Terms of Service</span>
      <span class="material-icons">open_in_new</span>
    </div>
    <div class="link-row" data-action="open_external" data-component-type="link" data-component-id="about_privacy_link" tabindex="0" aria-label="Privacy Policy">
      <span class="label">Privacy Policy</span>
      <span class="material-icons">open_in_new</span>
    </div>
    <div class="link-row" data-action="open_external" data-component-type="link" data-component-id="about_licenses_link" tabindex="0" aria-label="Open Source Licenses">
      <span class="label">Open Source Licenses</span>
      <span class="material-icons">chevron_right</span>
    </div>
    <button class="rate-btn" data-action="rate_app" data-component-type="button" data-component-id="about_rate_button" tabindex="0" aria-label="Rate this app">Rate This App</button>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
