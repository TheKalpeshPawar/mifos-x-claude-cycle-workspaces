responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - about_logo_section
      - about_app_info_card
      - about_project_card
      - about_legal_card
      - about_attribution

state_model:
  type: static_content
  note: "Static @Composable AboutScreen(onBack, modifier, appVersion: String = \"1.0.0\"). No ViewModel, no DI, no repository, no events, no loading/error/empty states. All content is compile-time constant; the only input is the appVersion string supplied by the host. Legal & resources rows open external web URLs via LocalUriHandler.openUri; the back navigation icon invokes the onBack lambda."

navigation:
  - id: nav_back
    target: settings
    note: "Back navigation icon → onBack lambda (returns to Settings, the entry point)"

dependencies:
  tier: feature
  features: [shared-core]
