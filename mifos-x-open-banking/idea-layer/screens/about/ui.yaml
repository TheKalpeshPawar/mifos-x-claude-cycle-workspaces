id: about
name: "About"
feature: about
flavor: shared
status: approved
quality_score: 95
contract_version: "1.1.0"
approve_hash: "sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
approved_at: "2026-05-28T14:30:00Z"
approved_by: "/idea approve (via /idea sync)"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-005, about, info]

screens:
  - id: about
    name: "About"
    viewmodel: "AboutViewModel"

archetype: settings

shell:
  top_app_bar:
    show: true
    title: "About"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: about_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - about_logo_section
      - about_app_info_card
      - about_legal_card
      - about_rate_button

  # ── Logo / Identity Section ──────────────────────────────────────────────────

  - type: stack
    id: about_logo_section
    variant: column
    style:
      alignment: center
      padding_top: spacing.xl
      padding_bottom: spacing.xl
    children:
      - about_logo_image
      - about_app_name_text
      - about_tagline_text

  - type: image
    id: about_logo_image
    content: "mifos_logo"
    label: "Mifos X logo"
    style:
      width: "80dp"
      height: "80dp"
      tint: "#4C662B"
      alignment: center
      padding_bottom: spacing.sm
    a11y:
      role: image
      label: "Mifos X Open Banking logo"
    test_context:
      purpose: "App brand logo displayed at top of About screen"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_app_name_text
    content: "Mifos X Open Banking"
    variant: headline_small
    style:
      typography: "Outfit/headline_small"
      color: "#4C662B"
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "Mifos X Open Banking"
    test_context:
      purpose: "App name displayed below logo for identity context"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_tagline_text
    content: "Open Banking for Everyone"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
    a11y:
      role: text
      label: "Open Banking for Everyone"
    test_context:
      purpose: "App tagline beneath the name for brand identity"
      interaction_type: display
      data_driven: false

  # ── App Info Card ─────────────────────────────────────────────────────────────

  - type: card
    id: about_app_info_card
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - about_version_row
      - about_divider_1
      - about_build_row

  - type: stack
    id: about_version_row
    variant: row
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_version_label
      - about_version_value

  - type: text
    id: about_version_label
    content: "Version"
    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    a11y:
      role: text
      label: "Version"
    test_context:
      purpose: "Label for the current app version row"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_version_value
    content: "1.0.0"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    a11y:
      role: text
      label: "Version 1.0.0"
    test_context:
      purpose: "Displays BuildConfig.VERSION_NAME from the app build"
      interaction_type: display
      data_driven: true

  - type: divider
    id: about_divider_1
    style:
      color: "#E1E4D5"
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between version and build number rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_build_row
    variant: row
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_build_label
      - about_build_value

  - type: text
    id: about_build_label
    content: "Build"
    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    a11y:
      role: text
      label: "Build number"
    test_context:
      purpose: "Label for the build identifier row"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_build_value
    content: "2026.05.001"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    a11y:
      role: text
      label: "Build 2026.05.001"
    test_context:
      purpose: "Displays BuildConfig.VERSION_CODE as a human-readable build stamp"
      interaction_type: display
      data_driven: true

  # ── Legal / Links Card ────────────────────────────────────────────────────────

  - type: card
    id: about_legal_card
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - about_legal_header
      - about_tos_row
      - about_divider_2
      - about_privacy_row
      - about_divider_3
      - about_licenses_row

  - type: text
    id: about_legal_header
    content: "Legal"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Legal section"
    test_context:
      purpose: "Section header grouping terms, privacy, and license links"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_tos_row
    variant: row
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_tos_link
      - about_tos_chevron

  - type: link
    id: about_tos_link
    label: "Terms of Service"
    variant: inline
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    on_click:
      action: open_external
      target: terms-of-service
    a11y:
      role: link
      label: "Open Terms of Service"
    keyboard:
      focusable: true
    test_context:
      purpose: "Opens Terms of Service in an in-app WebView or external browser"
      interaction_type: navigate
      data_driven: false

  - type: icon
    id: about_tos_chevron
    content: "open_in_new"
    variant: default
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      color: "#C5C8BA"
      size: "18dp"
    a11y:
      role: image
      label: ""
    test_context:
      purpose: "Trailing icon indicating external link behaviour for Terms of Service"
      interaction_type: display
      data_driven: false

  - type: divider
    id: about_divider_2
    style:
      color: "#E1E4D5"
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between Terms of Service and Privacy Policy rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_privacy_row
    variant: row
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_privacy_link
      - about_privacy_chevron

  - type: link
    id: about_privacy_link
    label: "Privacy Policy"
    variant: inline
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    on_click:
      action: open_external
      target: privacy-policy
    a11y:
      role: link
      label: "Open Privacy Policy"
    keyboard:
      focusable: true
    test_context:
      purpose: "Opens Privacy Policy in an in-app WebView or external browser"
      interaction_type: navigate
      data_driven: false

  - type: icon
    id: about_privacy_chevron
    content: "open_in_new"
    variant: default
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      color: "#C5C8BA"
      size: "18dp"
    a11y:
      role: image
      label: ""
    test_context:
      purpose: "Trailing icon indicating external link behaviour for Privacy Policy"
      interaction_type: display
      data_driven: false

  - type: divider
    id: about_divider_3
    style:
      color: "#E1E4D5"
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between Privacy Policy and Open Source Licenses rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_licenses_row
    variant: row
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_licenses_link
      - about_licenses_chevron

  - type: link
    id: about_licenses_link
    label: "Open Source Licenses"
    variant: inline
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    on_click:
      action: open_external
      target: licenses
    a11y:
      role: link
      label: "View Open Source Licenses"
    keyboard:
      focusable: true
    test_context:
      purpose: "Opens the OSS license screen generated by the Gradle license plugin"
      interaction_type: navigate
      data_driven: false

  - type: icon
    id: about_licenses_chevron
    content: "chevron_right"
    variant: default
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      color: "#C5C8BA"
      size: "20dp"
    a11y:
      role: image
      label: ""
    test_context:
      purpose: "Trailing affordance icon indicating the Licenses row is tappable"
      interaction_type: display
      data_driven: false

  # ── Rate App Button ───────────────────────────────────────────────────────────

  - type: button
    id: about_rate_button
    label: "Rate This App"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#4C662B"
      color: "#4C662B"
      typography: "Outfit/label_large"
      padding_horizontal: spacing.xl
      alignment: center
      margin_top: spacing.lg
    on_click:
      action: rate_app
      target: about
    a11y:
      role: button
      label: "Rate Mifos X Open Banking on the app store"
    keyboard:
      focusable: true
    test_context:
      purpose: "Launches the Google Play / App Store rating flow via ReviewManager API"
      interaction_type: action
      data_driven: false

  # ── Loading Skeleton ───────────────────────────────────────────────────────

  - type: skeleton
    id: about_loading_skeleton
    variant: settings
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    a11y:
      role: progressbar
      label: "Loading app information"
    test_context:
      purpose: "Shimmer placeholder while BuildConfig values resolve on cold start"
      interaction_type: display
      data_driven: false

  # ── Error State ───────────────────────────────────────────────────────────

  - type: stack
    id: about_error_state
    variant: column
    style:
      alignment: center
      padding: spacing.xl
    children:
      - about_error_icon
      - about_error_message

  - type: icon
    id: about_error_icon
    content: "info_outline"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      color: "#BA1A1A"
      size: "48dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "Error loading app info"
    test_context:
      purpose: "Error icon when BuildConfig version data is unavailable"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_error_message
    content: "Unable to load app information. Please restart the app."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
    a11y:
      role: text
      label: "Unable to load app information"
    test_context:
      purpose: "User-facing error message when version info retrieval fails"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - about_logo_section
      - about_app_info_card
      - about_legal_card
      - about_rate_button
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - about_loading_skeleton
    note: "Brief skeleton while BuildConfig values resolve on cold start"
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - about_error_state
    note: "Shown if version info retrieval fails (e.g. corrupted build metadata)"
  empty:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - about_logo_section
      - about_legal_card
    show_empty_state: false
    note: "About never truly empty — logo and legal links always shown; version card hidden if data unavailable"

state_model:
  AboutViewModel:
    screen_state: AboutUiState
    state:
      - field: appVersion
        type: String
        default: "\"1.0.0\""
      - field: buildNumber
        type: String
        default: "\"2026.05.001\""
    errors: []
    events: [OnRateAppClicked, OnTermsClicked, OnPrivacyClicked, OnLicensesClicked]
    actions: [onRateAppClicked(), onTermsClicked(), onPrivacyClicked(), onLicensesClicked()]
    di: [AppInfoProvider, ReviewManager]

navigation:
  - id: nav_tos
    target: terms-of-service
    on_click:
      action: open_external
      target: terms-of-service
  - id: nav_privacy
    target: privacy-policy
    on_click:
      action: open_external
      target: privacy-policy
  - id: nav_licenses
    target: licenses
    on_click:
      action: open_external
      target: licenses

dependencies:
  tier: feature
  features: [shared-core]
