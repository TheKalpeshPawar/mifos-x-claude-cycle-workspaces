status_history:
  - from: approved
    to: approved
    at: "2026-06-08T00:30:00Z"
    by: "/kmp-implement about (legal batch)"
    contract_version: "1.1.0"
    note: "Implemented in feature/legal (shared module for the four info screens). Static screen — no ViewModel/DI: identity block (icon mark, app name, tagline, version row via appVersion parameter), app-info card (version/build/license/platform), about-this-app prose with Mifos Initiative + OBP sandbox attribution, and a Legal & Resources card whose rows open real external links (mifos.org, openbankproject.com, github.com/openMF, MPL-2.0) via LocalUriHandler. Deviations: loading/error states + AboutViewModel dropped (content is compile-time constant); Rate-This-App omitted (needs platform ReviewManager); in-app legal links replaced by the Settings → About/Terms/Privacy/Licenses rows which now navigate to the real sibling screens. Entry: Settings → About (row was disabled until this landed)."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.1.0"
    note: "SOURCE→SPEC reconciliation to shipped AboutScreen.kt (static @Composable, no ViewModel, single appVersion:String param). Replaced invented app-info build row with shipped Version/License(MPL-2.0)/Platform(Kotlin Multiplatform) rows. Added shipped AboutProjectCard (about-this-app prose + Mifos Initiative + OBP sandbox subsections) and attribution footer. Legal card rows now open REAL external web URLs (mifos.org, openbankproject.com, github.com/openMF, mozilla.org/MPL/2.0) via LocalUriHandler — they do NOT navigate to in-app sibling legal screens (that nav lives in Settings). Removed: about_build_row, about_rate_button, loading skeleton, error state, AboutViewModel state_model."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

