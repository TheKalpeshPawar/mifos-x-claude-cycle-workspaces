<!doctype html>
<!-- render-hash: settings-empty-01 -->
<html lang="en" data-screen="settings" data-state="empty" data-feature="settings" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--error:#BA1A1A;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);border-radius:8px;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.profile-skel{height:72px;background:var(--primary-container);border-radius:16px;margin:8px 20px 20px;animation:pulse 1.5s ease-in-out infinite;opacity:0.6}
.section-title{font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:0.6px;padding:20px 20px 8px}
.group{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 20px;overflow:hidden}
.skel-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--outline-variant)}.skel-row:last-child{border-bottom:none}
.skel-icon{width:36px;height:36px;border-radius:10px;flex-shrink:0}
.skel-body{flex:1}.skel-label{height:14px;width:55%;margin-bottom:6px}.skel-sub{height:11px;width:75%}
.skel-toggle{width:48px;height:28px;border-radius:14px;flex-shrink:0}
.skel-chev{width:20px;height:20px;border-radius:4px;flex-shrink:0}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--error:#BA1A1A;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--error:#FFB4AB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--error:#FFB4AB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main aria-busy="true" aria-label="Loading settings">
<div class="top-bar"><span class="material-icons" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Settings</h1></div>
<!-- skeleton shimmer: profile card -->
<div class="profile-skel" aria-hidden="true"></div>
<!-- Appearance skeleton -->
<div class="section-title" aria-hidden="true">Appearance</div>
<div class="group" aria-hidden="true">
  <div class="skel-row"><div class="skel skel-icon"></div><div class="skel-body"><div class="skel skel-label"></div><div class="skel skel-sub"></div></div><div class="skel skel-toggle"></div></div>
  <div class="skel-row"><div class="skel skel-icon"></div><div class="skel-body"><div class="skel skel-label"></div><div class="skel skel-sub"></div></div><div class="skel skel-chev"></div></div>
</div>
<!-- Notifications skeleton -->
<div class="section-title" aria-hidden="true">Notifications</div>
<div class="group" aria-hidden="true">
  <div class="skel-row"><div class="skel skel-icon"></div><div class="skel-body"><div class="skel skel-label"></div><div class="skel skel-sub"></div></div><div class="skel skel-toggle"></div></div>
  <div class="skel-row"><div class="skel skel-icon"></div><div class="skel-body"><div class="skel skel-label"></div><div class="skel skel-sub"></div></div><div class="skel skel-toggle"></div></div>
  <div class="skel-row"><div class="skel skel-icon"></div><div class="skel-body"><div class="skel skel-label"></div><div class="skel skel-sub"></div></div><div class="skel skel-toggle"></div></div>
</div>
<!-- Security skeleton -->
<div class="section-title" aria-hidden="true">Security</div>
<div class="group" aria-hidden="true">
  <div class="skel-row"><div class="skel skel-icon"></div><div class="skel-body"><div class="skel skel-label"></div><div class="skel skel-sub"></div></div><div class="skel skel-toggle"></div></div>
  <div class="skel-row"><div class="skel skel-icon"></div><div class="skel-body"><div class="skel skel-label"></div><div class="skel skel-sub"></div></div><div class="skel skel-chev"></div></div>
</div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
