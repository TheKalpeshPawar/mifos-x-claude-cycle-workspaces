<!doctype html>

<!-- feature: settings · state: content -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings — content</title><style>
:root{--p:#266489;--s:#F7F9FF;--o:#181C20;--ov:#41474D;--sc:#EBEEF3;--sch:#E5E8ED;--out:#C1C7CE;--rf:9999px}
@media(prefers-color-scheme:dark){:root{--p:#95CDF7;--s:#101417;--o:#E0E3E8;--ov:#C1C7CE;--sc:#1C2024;--sch:#262A2E;--out:#41474D}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s);color:var(--o);font:16px/1.5 Roboto,sans-serif;display:flex;justify-content:center}
.d{width:393px;min-height:852px;display:flex;flex-direction:column}
.sb{height:54px}.ab{height:56px;display:flex;align-items:center;padding:0 16px}.t{font-size:22px}
.sc{flex:1;overflow-y:auto}
.h{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ov);padding:24px 16px 8px}
.rw{min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:16px;cursor:pointer}
.rw:hover{background:var(--sch)}
.rw.na{cursor:default}.rw.na:hover{background:transparent}
.ic{width:24px;height:24px;color:var(--ov);flex:none}
.col{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ti{font-size:16px}.su{font-size:14px;color:var(--ov)}
.tr{display:flex;align-items:center;gap:4px;color:var(--ov)}
.tr svg{width:24px;height:24px}.tv{font-size:16px}
.nb{height:80px;display:flex;background:var(--sc);border-top:1px solid var(--out)}
.tb{flex:1;display:grid;place-items:center;font-size:12px;color:var(--ov);cursor:pointer}.tb.a{color:var(--p);font-weight:500}
.bt{height:34px;background:var(--sc)}</style></head>
<body><div class="d" data-screen="settings" data-state="content">
<div class="sb"></div><div class="ab"><div class="t">Settings</div></div>
<div class="sc">
  <div class="h">Appearance</div>
  <!-- only SelectTheme persists (persist_db -> user_preferences.darkThemeConfig);
       opening/dismissing the menu is local UI state -->
  <div class="rw" data-action="ToggleThemeMenu" role="button" tabindex="0">
    <div class="col"><span class="ti">Theme</span></div>
    <div class="tr"><span class="tv">System</span>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5H7Z"/></svg></div></div>

  <div class="h">Account</div>
  <div class="rw" data-nav-to="consent-list" role="button" tabindex="0">
    <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4Z"/></svg>
    <div class="col"><span class="ti">Manage consents</span><span class="su">Review and revoke access</span></div>
    <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6 8.6 7.4 13.2 12l-4.6 4.6L10 18l6-6-6-6Z"/></svg></div>

  <div class="h">About &amp; legal</div>
  <!-- trailing glyph tells the truth about destination: open_in_new = LEAVES for the browser -->
  <div class="rw" data-action="open_privacy_url" role="button" tabindex="0">
    <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4Zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Z"/></svg>
    <div class="col"><span class="ti">Privacy policy</span></div>
    <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7ZM14 3v2h3.6l-9.8 9.8 1.4 1.4L19 6.4V10h2V3h-7Z"/></svg></div>
  <div class="rw" data-nav-to="licences" role="button" tabindex="0">
    <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-6h2v6Zm0-8h-2V7h2v2Z"/></svg>
    <div class="col"><span class="ti">Open-source licences</span></div>
    <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6 8.6 7.4 13.2 12l-4.6 4.6L10 18l6-6-6-6Z"/></svg></div>
  <!-- app_version_row is INERT by design: no icon, no trailing, no click. A chevron would
       promise a screen that does not exist.
       KNOWN GAP: no accessibility_label (one of two in the project). -->
  <div class="rw na"><div class="col"><span class="ti">App version</span><span class="su">1.0.0 (142)</span></div></div>
</div>
<div class="nb"><div class="tb" data-nav-to="home">Home</div><div class="tb" data-nav-to="accounts">Accounts</div>
<div class="tb" data-nav-to="send-money">Pay</div><div class="tb a">More</div></div>
<div class="bt"></div></div></body></html>
