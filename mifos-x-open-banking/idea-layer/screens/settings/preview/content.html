<!doctype html>
<!-- render-hash: 7d1f3a9c0b48 -->
<html lang="en" data-screen="settings" data-state="content" data-feature="settings" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 72px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .scroll { flex: 1; padding: 0 16px 8px; }

  .profile-card { display: flex; align-items: center; gap: 14px; background: var(--primary-container); color: var(--on-primary-container); border-radius: var(--radius-lg); padding: 16px; margin: 8px 0 16px; box-shadow: var(--shadow-1); cursor: pointer; border: none; width: 100%; text-align: left; font-family: 'Outfit', sans-serif; }
  .profile-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .profile-initials { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .profile-body { flex: 1; min-width: 0; }
  .profile-name { display: block; font-size: 16px; font-weight: 600; color: var(--on-surface); }
  .profile-email { display: block; font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }
  .profile-card .chev { color: var(--on-surface-variant); font-size: var(--icon-sm); }

  .section-header { font-size: 12px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 4px 6px; }

  .group-card { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-soft); padding: 4px 14px; margin-bottom: 16px; box-shadow: var(--shadow-1); }
  .nav-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-soft); padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow-1); cursor: pointer; width: 100%; text-align: left; font-family: 'Outfit', sans-serif; }
  .nav-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .nav-card.consent { padding: 16px; margin-bottom: 16px; }
  .nav-card .lead { color: var(--primary); font-size: var(--icon-sm); flex-shrink: 0; }
  .nav-card .nc-body { flex: 1; min-width: 0; }
  .nav-card .nc-title { display: block; font-size: 15px; color: var(--on-surface); }
  .nav-card .nc-sub { display: block; font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }
  .nav-card .chev { color: var(--outline-variant); font-size: var(--icon-sm); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; }
  .row + .row { border-top: 1px solid var(--surface-variant); }
  .row-label { font-size: 15px; color: var(--on-surface); }
  .row[aria-disabled="true"] .row-label { color: var(--on-surface-variant); opacity: 0.6; }

  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--outline); display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; flex-shrink: 0; padding: 0; }
  .radio:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .radio.selected { border-color: var(--primary); }
  .radio.selected::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }

  .select-disabled { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--on-surface-variant); opacity: 0.6; }
  .select-disabled .material-icons { font-size: var(--icon-sm); color: var(--outline-variant); }

  .switch { width: 44px; height: 26px; border-radius: 13px; background: var(--surface-variant); position: relative; flex-shrink: 0; border: none; cursor: pointer; }
  .switch[aria-disabled="true"] { opacity: 0.5; cursor: default; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--outline); }

  .reset-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; cursor: pointer; width: 100%; background: transparent; border: none; font-family: 'Outfit', sans-serif; text-align: left; }
  .reset-row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .reset-row .chev { color: var(--outline-variant); font-size: var(--icon-sm); }

  .sign-out { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1px solid var(--error); color: var(--error); background: transparent; border-radius: var(--radius-soft); padding: 14px; font-size: 15px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; margin-top: 8px; }
  .sign-out:focus-visible { outline: 2px solid var(--error); outline-offset: 2px; }
  .sign-out .material-icons { font-size: var(--icon-sm); }

  .footer { text-align: center; font-size: 12px; color: var(--on-surface-variant); padding: 16px 0 24px; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--outline-variant); padding: 6px 0 10px; z-index: 8; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-shell="top-bar">
    <h1>Settings</h1>
  </header>

  <div class="scroll" data-component-type="LayoutBox" data-component-id="settings_root">

    <button class="profile-card" data-component-type="card" data-component-id="settings_profile_header_card" data-nav-to="profile" aria-label="Open your profile">
      <span class="profile-initials" data-component-type="box" data-component-id="settings_profile_initials" aria-label="Your initials">AC</span>
      <span class="profile-body">
        <span class="profile-name" data-component-type="text" data-component-id="settings_profile_name">Amina Chebet</span>
        <span class="profile-email" data-component-type="text" data-component-id="settings_profile_email">amina.chebet@gmail.com</span>
      </span>
      <span class="material-icons chev" aria-hidden="true">chevron_right</span>
    </button>

    <div class="section-header" data-component-type="text" data-component-id="settings_appearance_header" role="heading" aria-level="2">Appearance</div>

    <div class="group-card" data-component-type="card" data-component-id="settings_appearance_group">
      <div class="row" data-component-type="LayoutBox" data-component-id="settings_theme_follow_system_row">
        <span class="row-label" data-component-type="text" data-component-id="settings_theme_follow_system_label">Follow System</span>
        <button class="radio selected" role="radio" aria-checked="true" data-component-type="input" data-component-id="settings_theme_follow_system_toggle" data-action="onThemeConfigSelected" data-action-params="FOLLOW_SYSTEM" aria-label="Use the system theme"></button>
      </div>
      <div class="row" data-component-type="LayoutBox" data-component-id="settings_theme_light_row">
        <span class="row-label" data-component-type="text" data-component-id="settings_theme_light_label">Light Mode</span>
        <button class="radio" role="radio" aria-checked="false" data-component-type="input" data-component-id="settings_theme_light_toggle" data-action="onThemeConfigSelected" data-action-params="LIGHT" aria-label="Always use the light theme"></button>
      </div>
      <div class="row" data-component-type="LayoutBox" data-component-id="settings_theme_dark_row">
        <span class="row-label" data-component-type="text" data-component-id="settings_theme_dark_label">Dark Mode</span>
        <button class="radio" role="radio" aria-checked="false" data-component-type="input" data-component-id="settings_theme_dark_toggle" data-action="onThemeConfigSelected" data-action-params="DARK" aria-label="Always use the dark theme"></button>
      </div>
      <div class="row" data-component-type="LayoutBox" data-component-id="settings_language_row" aria-disabled="true">
        <span class="row-label" data-component-type="text" data-component-id="settings_language_label">Language</span>
        <span class="select-disabled" data-component-type="input" data-component-id="settings_language_select" aria-disabled="true" aria-label="Select language (not yet available)">English<span class="material-icons" aria-hidden="true">expand_more</span></span>
      </div>
    </div>

    <div class="section-header" data-component-type="text" data-component-id="settings_security_header" role="heading" aria-level="2">Security</div>

    <div class="group-card" data-component-type="card" data-component-id="settings_security_group">
      <div class="row" data-component-type="LayoutBox" data-component-id="settings_biometric_row" aria-disabled="true">
        <span class="row-label" data-component-type="text" data-component-id="settings_biometric_label">Biometric Login</span>
        <button class="switch" data-component-type="input" data-component-id="settings_biometric_toggle" data-action="onBiometricToggled" aria-disabled="true" aria-label="Toggle biometric login (not yet available)" disabled></button>
      </div>
      <button class="reset-row" data-component-type="LayoutBox" data-component-id="settings_reset_password_row" data-action="onResetPassword" aria-label="Email yourself a password reset link">
        <span class="row-label" data-component-type="text" data-component-id="settings_reset_password_label">Reset Password</span>
        <span class="material-icons chev" data-component-type="icon" data-component-id="settings_reset_password_chevron" aria-hidden="true">chevron_right</span>
      </button>
    </div>

    <button class="nav-card consent" data-component-type="card" data-component-id="settings_data_consent_card" data-nav-to="consent-manager" aria-label="Data and Consent — review and revoke account access you've granted">
      <span class="material-icons lead" data-component-type="icon" data-component-id="settings_data_consent_icon" aria-hidden="true">shield</span>
      <span class="nc-body">
        <span class="nc-title" data-component-type="text" data-component-id="settings_data_consent_label">Data &amp; Consent</span>
        <span class="nc-sub" data-component-type="text" data-component-id="settings_data_consent_subtitle">Review and revoke account access you've granted</span>
      </span>
      <span class="material-icons chev" aria-hidden="true">chevron_right</span>
    </button>

    <div class="section-header" data-component-type="text" data-component-id="settings_about_header" role="heading" aria-level="2">About</div>

    <button class="nav-card" data-component-type="card" data-component-id="settings_about_about_card" data-nav-to="about" aria-label="About Mifos X Open Banking">
      <span class="material-icons lead" data-component-type="icon" data-component-id="settings_about_about_icon" aria-hidden="true">info</span>
      <span class="nc-body"><span class="nc-title" data-component-type="text" data-component-id="settings_about_about_label">About Mifos X Open Banking</span></span>
      <span class="material-icons chev" aria-hidden="true">chevron_right</span>
    </button>

    <button class="nav-card" data-component-type="card" data-component-id="settings_about_terms_card" data-nav-to="terms-of-service" aria-label="Terms of Service">
      <span class="material-icons lead" data-component-type="icon" data-component-id="settings_about_terms_icon" aria-hidden="true">article</span>
      <span class="nc-body"><span class="nc-title" data-component-type="text" data-component-id="settings_about_terms_label">Terms of Service</span></span>
      <span class="material-icons chev" aria-hidden="true">chevron_right</span>
    </button>

    <button class="nav-card" data-component-type="card" data-component-id="settings_about_privacy_card" data-nav-to="privacy-policy" aria-label="Privacy Policy">
      <span class="material-icons lead" data-component-type="icon" data-component-id="settings_about_privacy_icon" aria-hidden="true">privacy_tip</span>
      <span class="nc-body"><span class="nc-title" data-component-type="text" data-component-id="settings_about_privacy_label">Privacy Policy</span></span>
      <span class="material-icons chev" aria-hidden="true">chevron_right</span>
    </button>

    <button class="nav-card" data-component-type="card" data-component-id="settings_about_licenses_card" data-nav-to="licenses" aria-label="Open-source Licences">
      <span class="material-icons lead" data-component-type="icon" data-component-id="settings_about_licenses_icon" aria-hidden="true">gavel</span>
      <span class="nc-body"><span class="nc-title" data-component-type="text" data-component-id="settings_about_licenses_label">Open-source Licences</span></span>
      <span class="material-icons chev" aria-hidden="true">chevron_right</span>
    </button>

    <button class="sign-out" data-component-type="button" data-component-id="settings_sign_out_button" data-action="onSignOut" aria-label="Sign out of your account">
      <span class="material-icons" aria-hidden="true">logout</span>Sign out
    </button>

    <div class="footer" data-component-type="text" data-component-id="settings_footer" aria-label="Mifos X Open Banking version 1.0.0">Mifos X Open Banking &nbsp;·&nbsp; v1.0.0</div>

  </div>
</main>

  <nav class="bottom-nav" data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item" data-nav-to="home" tabindex="0"><span class="material-icons">home</span>Home</a>
    <a class="nav-item" data-nav-to="accounts" tabindex="0"><span class="material-icons">account_balance</span>Accounts</a>
    <a class="nav-item" data-nav-to="pay" tabindex="0"><span class="material-icons">send</span>Pay</a>
    <a class="nav-item" data-nav-to="pfm-dashboard" tabindex="0"><span class="material-icons">insights</span>Insights</a>
    <a class="nav-item active" data-nav-selected="true" data-nav-to="settings" tabindex="0"><span class="material-icons">more_horiz</span>More</a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
