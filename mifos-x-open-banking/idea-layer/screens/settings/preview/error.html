<!doctype html>
<!-- render-hash: settings-error-01 -->
<html lang="en" data-screen="settings" data-state="error" data-feature="settings" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.error-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.error-icon-bg{width:80px;height:80px;background:var(--error-container);border-radius:40px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.error-icon-bg .material-icons{font-size:var(--icon-xl);color:var(--error)}
.error-title{font-size:20px;font-weight:700;color:var(--on-background);margin-bottom:10px}
.error-message{font-size:14px;color:var(--on-surface-variant);line-height:1.55;max-width:300px;margin-bottom:28px}
.retry-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:600;padding:14px 28px;border-radius:999px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:0.2px;margin-bottom:12px;width:100%;max-width:260px}
.retry-btn .material-icons{font-size:var(--icon-sm)}
.secondary-action{font-size:13px;color:var(--secondary);font-weight:500;cursor:pointer;text-decoration:none}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Settings</h1></div>
<div class="error-body" role="alert" aria-live="assertive">
  <div class="error-icon-bg" aria-hidden="true"><span class="material-icons">cloud_off</span></div>
  <h2 class="error-title" data-component-type="text" data-component-id="settings_error_title">Couldn't load settings</h2>
  <p class="error-message" data-component-type="text" data-component-id="settings_error_message">Your preferences are stored on the Mifos X server. Check your connection and try again. Any locally cached settings remain active.</p>
  <button class="retry-btn" data-component-type="button" data-component-id="settings_retry_button" data-action="onLoadSettings" tabindex="0" aria-label="Retry loading your settings"><span class="material-icons" aria-hidden="true">refresh</span>Retry</button>
  <a class="secondary-action" data-nav-to="home" tabindex="0" data-component-type="link" data-component-id="settings_go_home_link" aria-label="Go to home screen">Go to Home</a>
</div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
