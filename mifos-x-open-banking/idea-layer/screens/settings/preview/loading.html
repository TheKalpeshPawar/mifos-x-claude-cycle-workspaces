     Bottom nav: Home(0) · Accounts(1) · Transactions(2) · More(3 — ACTIVE)

<html lang="en" data-screen="settings" data-state="loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0">
  <title>Settings — Loading · Mifos Open Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens (light mode, Trust Blue) ── */
    :root {
      --primary:                 #266489;
      --on-primary:              #FFFFFF;
      --primary-container:       #C9E6FF;
      --on-primary-container:    #004B6F;
      --background:              #F7F9FF;
      --surface:                 #F7F9FF;
      --surface-container-low:   #F1F4F9;
      --surface-container:       #EBEEF3;
      --surface-container-high:  #E5E8ED;
      --on-surface:              #181C20;
      --on-surface-variant:      #41474D;
      --outline:                 #72787E;
      --outline-variant:         #C1C7CE;
      --error:                   #BA1A1A;
      --radius-small:            8px;
      --radius-medium:           12px;
      --radius-large:            16px;
      --radius-xl:               28px;
      --radius-full:             9999px;
    }

    [data-theme="dark"] {
      --primary:              #95CDF7;
      --on-primary:           #00344E;
      --primary-container:    #004B6F;
      --on-primary-container: #C9E6FF;
      --background:           #101417;
      --surface:              #101417;
      --surface-container-low:  #181C20;
      --surface-container:      #1C2024;
      --surface-container-high: #262A2E;
      --on-surface:           #E0E3E8;
      --on-surface-variant:   #C1C7CE;
      --outline:              #8B9198;
      --outline-variant:      #41474D;
      --error:                #FFB4AB;
    }

    html, body {
      width: 390px;
      height: 844px;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
      background: var(--background);
      color: var(--on-surface);
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
    }

    .screen {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ── Top App Bar ── */
    .top-app-bar {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }
    .top-app-bar__title {
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--on-surface);
    }

    /* ── Scrollable content area ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding-top: 4px;
      padding-bottom: 8px;
    }

    /* ── Shimmer skeleton ── */
    @keyframes shimmer {
      0%   { background-position: -390px 0; }
      100% { background-position:  390px 0; }
    }

    .skel {
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        var(--surface-container)     0%,
        var(--surface-container-low) 40%,
        var(--surface-container)     80%
      );
      background-size: 780px 100%;
      animation: shimmer 1.5s infinite ease-in-out;
    }

    .skel-section-hdr {
      height: 12px;
      width: 88px;
      margin: 20px 16px 10px;
    }

    .skel-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      min-height: 72px;
    }
    .skel-row__body { flex: 1; }
    .skel-row__line-a {
      height: 14px;
      width: 58%;
      margin-bottom: 8px;
    }
    .skel-row__line-b {
      height: 12px;
      width: 75%;
    }
    .skel-row__trailing {
      width: 40px;
      height: 22px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      margin-left: 12px;
    }

    .skel-divider {
      height: 1px;
      background: var(--outline-variant);
    }

    /* ── Bottom Navigation (M3) ── */
    .bottom-nav {
      display: flex;
      height: 80px;
      background: var(--surface-container);
      border-top: 1px solid var(--outline-variant);
      padding: 0 0 8px;
      flex-shrink: 0;
    }
    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 4px;
      gap: 2px;
      text-decoration: none;
      cursor: pointer;
      background: transparent;
      border: none;
    }
    .bottom-nav__pill {
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms;
    }
    .bottom-nav__item--active .bottom-nav__pill {
      background: var(--primary-container);
    }
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .bottom-nav__icon {
      color: var(--on-surface-variant);
    }
    .bottom-nav__item--active .bottom-nav__icon {
      color: var(--primary);
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .bottom-nav__label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: var(--on-surface-variant);
    }
    .bottom-nav__item--active .bottom-nav__label {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <main class="screen">

    <!-- ── Top App Bar ── -->
    <header class="top-app-bar" role="banner">
      <h1 class="top-app-bar__title">Settings</h1>
    </header>

    <!-- ── Skeleton content (8 rows) ── -->
    <div
      class="content"
      role="status"
      aria-label="Loading settings, please wait"
      aria-busy="true"
      aria-live="polite"
    >
      <!-- Appearance section -->
      <div class="skel skel-section-hdr" aria-hidden="true"></div>
      <div class="skel-row" aria-hidden="true">
        <div class="skel-row__body">
          <div class="skel skel-row__line-a"></div>

        </div>
        <div class="skel skel-row__trailing"></div>
      </div>
      <div class="skel-divider" aria-hidden="true"></div>

      <!-- Security section -->
      <div class="skel skel-section-hdr" aria-hidden="true"></div>
      <div class="skel-row" aria-hidden="true">
        <div class="skel-row__body">
          <div class="skel skel-row__line-a"></div>
          <div class="skel skel-row__line-b"></div>
        </div>
        <div class="skel skel-row__trailing"></div>
      </div>
      <div class="skel-divider" aria-hidden="true"></div>
      <div class="skel-row" aria-hidden="true">
        <div class="skel-row__body">
          <div class="skel skel-row__line-a"></div>
          <div class="skel skel-row__line-b"></div>
        </div>
        <div class="skel skel-row__trailing"></div>
      </div>
      <div class="skel-divider" aria-hidden="true"></div>

      <!-- Notifications section -->
      <div class="skel skel-section-hdr" aria-hidden="true"></div>
      <div class="skel-row" aria-hidden="true">
        <div class="skel-row__body">
          <div class="skel skel-row__line-a"></div>
          <div class="skel skel-row__line-b"></div>
        </div>
        <div class="skel skel-row__trailing"></div>
      </div>
      <div class="skel-divider" aria-hidden="true"></div>
      <div class="skel-row" aria-hidden="true">
        <div class="skel-row__body">
          <div class="skel skel-row__line-a"></div>
          <div class="skel skel-row__line-b"></div>
        </div>
        <div class="skel skel-row__trailing"></div>
      </div>
      <div class="skel-divider" aria-hidden="true"></div>

      <!-- Account section (2 rows) -->
      <div class="skel skel-section-hdr" aria-hidden="true"></div>
      <div class="skel-row" aria-hidden="true">
        <div class="skel-row__body">
          <div class="skel skel-row__line-a"></div>
          <div class="skel skel-row__line-b"></div>
        </div>
        <div class="skel skel-row__trailing" style="width:20px;height:20px;border-radius:50%;"></div>
      </div>
      <div class="skel-divider" aria-hidden="true"></div>
      <div class="skel-row" aria-hidden="true">
        <div class="skel-row__body">
          <div class="skel skel-row__line-a"></div>
          <div class="skel skel-row__line-b"></div>
        </div>
        <div class="skel skel-row__trailing" style="width:20px;height:20px;border-radius:50%;"></div>
      </div>
    </div>

    <!-- ── Bottom Navigation — Home(0) · Accounts(1) · Transactions(2) · More(3 ACTIVE) ── -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="bottom-nav__item" href="#" data-nav-to="home" aria-label="Home">
        <div class="bottom-nav__pill">
          <span class="material-symbols-rounded bottom-nav__icon" aria-hidden="true">home</span>
        </div>
        <span class="bottom-nav__label">Home</span>
      </a>
      <a class="bottom-nav__item" href="#" data-nav-to="accounts" aria-label="Accounts">
        <div class="bottom-nav__pill">
          <span class="material-symbols-rounded bottom-nav__icon" aria-hidden="true">account_balance</span>
        </div>
        <span class="bottom-nav__label">Accounts</span>

      <a class="bottom-nav__item" href="#" data-nav-to="transactions" aria-label="Transactions">
        <div class="bottom-nav__pill">
          <span class="material-symbols-rounded bottom-nav__icon" aria-hidden="true">receipt_long</span>
        </div>
        <span class="bottom-nav__label">Transactions</span>

      <a class="bottom-nav__item bottom-nav__item--active" href="#" data-nav-to="settings" aria-label="More" aria-current="page">
        <div class="bottom-nav__pill">
          <span class="material-symbols-rounded bottom-nav__icon" aria-hidden="true">more_horiz</span>
        </div>
        <span class="bottom-nav__label">More</span>
      </a>
    </nav>
  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
