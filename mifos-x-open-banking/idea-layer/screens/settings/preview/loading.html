<!doctype html>
<!-- render-hash: a3f7c2d91e40 -->
<html lang="en" data-screen="settings" data-state="loading" data-feature="settings" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 16px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    --skel-base: #E8EBD8; --skel-shine: #F3F5E9;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    --skel-base: #2A2D22; --skel-shine: #363930;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
      --skel-base: #2A2D22; --skel-shine: #363930;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .top-bar {
    display: flex; align-items: center; gap: 4px;
    padding: 12px 8px 8px;
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--on-surface-variant);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .top-bar-title { font-size: 22px; font-weight: 700; color: var(--on-background); }
  .scroll-area {
    flex: 1; padding: 16px 16px 32px;
    display: flex; flex-direction: column;
  }
  @keyframes shimmer {
    0%   { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skel {
    background: linear-gradient(90deg, var(--skel-base) 25%, var(--skel-shine) 50%, var(--skel-base) 75%);
    background-size: 800px 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 6px;
    display: block;
  }
  .skel-card {
    background: var(--surface);
    border: 1px solid var(--outline-variant);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-1);
  }
  .skel-section-hdr { height: 13px; width: 28%; margin-top: 8px; margin-bottom: 10px; }
  /* profile card */
  .skel-profile { display: flex; align-items: center; gap: 14px; }
  .skel-avatar { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
  .skel-profile-text { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skel-name { height: 18px; width: 52%; }
  .skel-email { height: 13px; width: 68%; }
  .skel-chev { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; }
  /* setting rows */
  .skel-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; min-height: 44px; }
  .skel-row-lbl { height: 16px; border-radius: 6px; }
  .skel-toggle { width: 52px; height: 28px; border-radius: 14px; flex-shrink: 0; }
  .skel-select { height: 16px; width: 22%; }
  .skel-divider { height: 1px; background: var(--outline-variant); animation: none; border-radius: 0; }
  /* consent card */
  .skel-consent-row { display: flex; align-items: flex-start; gap: 12px; }
  .skel-icon-block { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; margin-top: 2px; }
  .skel-consent-txt { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .skel-consent-title { height: 16px; width: 44%; }
  .skel-consent-sub { height: 12px; width: 78%; }
  /* sign-out */
  .skel-btn-full { height: 48px; border-radius: var(--radius-soft); margin-top: 8px; margin-bottom: 12px; width: 100%; }
  /* footer */
  .skel-footer { height: 13px; width: 44%; margin: 0 auto 24px; }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back">
      <span class="material-icons">arrow_back</span>
    </button>
    <span class="top-bar-title">Settings</span>
  </header>

  <div class="scroll-area" aria-busy="true" aria-label="Loading settings">

    <!-- Skeleton card 1: profile header -->
    <div class="skel-card" data-component-type="card" data-component-id="settings_profile_header_card" aria-hidden="true">
      <div class="skel-profile">
        <div class="skel skel-avatar"></div>
        <div class="skel-profile-text">
          <div class="skel skel-name"></div>
          <div class="skel skel-email"></div>
        </div>
        <div class="skel skel-chev"></div>
      </div>
    </div>

    <!-- Section header: Appearance -->
    <div class="skel skel-section-hdr" data-component-type="text" data-component-id="settings_appearance_header" aria-hidden="true"></div>

    <!-- Skeleton card 2: appearance group (Follow System / Light / Dark / Language) -->
    <div class="skel-card" data-component-type="card" data-component-id="settings_appearance_group" aria-hidden="true">
      <div class="skel-row">
        <div class="skel skel-row-lbl" style="width:44%;"></div>
        <div class="skel skel-toggle" data-component-id="settings_theme_follow_system_toggle"></div>
      </div>
      <div class="skel skel-divider" data-component-id="settings_divider_theme_1"></div>
      <div class="skel-row">
        <div class="skel skel-row-lbl" style="width:36%;"></div>
        <div class="skel skel-toggle" data-component-id="settings_theme_light_toggle"></div>
      </div>
      <div class="skel skel-divider" data-component-id="settings_divider_theme_2"></div>
      <div class="skel-row">
        <div class="skel skel-row-lbl" style="width:36%;"></div>
        <div class="skel skel-toggle" data-component-id="settings_theme_dark_toggle"></div>
      </div>
      <div class="skel skel-divider" data-component-id="settings_divider_appearance"></div>
      <div class="skel-row" data-component-id="settings_language_row">
        <div class="skel skel-row-lbl" style="width:30%;"></div>
        <div class="skel skel-select" data-component-id="settings_language_select"></div>
      </div>
    </div>

    <!-- Section header: Security -->
    <div class="skel skel-section-hdr" data-component-type="text" data-component-id="settings_security_header" aria-hidden="true"></div>

    <!-- Skeleton card 3: security group (Biometric / Reset Password) -->
    <div class="skel-card" data-component-type="card" data-component-id="settings_security_group" aria-hidden="true">
      <div class="skel-row">
        <div class="skel skel-row-lbl" style="width:46%;"></div>
        <div class="skel skel-toggle" data-component-id="settings_biometric_toggle"></div>
      </div>
      <div class="skel skel-divider" data-component-id="settings_divider_security"></div>
      <div class="skel-row" data-component-id="settings_reset_password_row">
        <div class="skel skel-row-lbl" style="width:40%;"></div>
        <div class="skel skel-icon-block" data-component-id="settings_reset_password_chevron"></div>
      </div>
    </div>

    <!-- Skeleton card 4: Data & Consent -->
    <div class="skel-card" data-component-type="card" data-component-id="settings_data_consent_card" aria-hidden="true">
      <div class="skel-consent-row">
        <div class="skel skel-icon-block" data-component-id="settings_data_consent_icon"></div>
        <div class="skel-consent-txt">
          <div class="skel skel-consent-title" data-component-id="settings_data_consent_label"></div>
          <div class="skel skel-consent-sub" data-component-id="settings_data_consent_subtitle"></div>
        </div>
      </div>
    </div>

    <!-- Sign-out button skeleton -->
    <div class="skel skel-btn-full" data-component-type="button" data-component-id="settings_sign_out_button" aria-hidden="true"></div>

    <!-- Footer skeleton -->
    <div class="skel skel-footer" data-component-type="text" data-component-id="settings_footer" aria-hidden="true"></div>

  </div>
</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
