<!doctype html>
<!-- render-hash: settings-loading-01 -->
<html lang="en" data-screen="settings" data-state="loading" data-feature="settings" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:24px;color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.profile-skel{display:flex;align-items:center;gap:14px;margin:8px 20px 20px;padding:16px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px}.profile-skel .avatar{width:48px;height:48px;border-radius:24px}.profile-skel .info{flex:1;display:flex;flex-direction:column;gap:6px}.profile-skel .l1{height:14px;width:60%}.profile-skel .l2{height:12px;width:80%}
.title-skel{height:11px;width:120px;margin:20px 20px 8px}
.group-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 20px}
.row-skel{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--outline-variant)}.row-skel:last-child{border-bottom:none}.row-skel .lead{width:36px;height:36px;border-radius:10px}.row-skel .body{flex:1;display:flex;flex-direction:column;gap:6px}.row-skel .l1{height:14px;width:50%}.row-skel .l2{height:11px;width:80%}.row-skel .toggle{width:48px;height:28px;border-radius:14px}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons">arrow_back</span><h1>Settings</h1></div>
<div class="profile-skel"><div class="skel avatar"></div><div class="info"><div class="skel l1"></div><div class="skel l2"></div></div></div>
<div class="skel title-skel"></div>
<div class="group-skel"><div class="row-skel"><div class="skel lead"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel toggle"></div></div><div class="row-skel"><div class="skel lead"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel toggle"></div></div></div>
<div class="skel title-skel"></div>
<div class="group-skel"><div class="row-skel"><div class="skel lead"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel toggle"></div></div><div class="row-skel"><div class="skel lead"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel toggle"></div></div><div class="row-skel"><div class="skel lead"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel toggle"></div></div></div>
</main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
