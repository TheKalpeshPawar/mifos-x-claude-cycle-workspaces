      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
      padding_top: spacing.lg
    a11y:
      role: heading
      label: "Appearance settings section"
    test_context:
      purpose: "Section header grouping display-related preferences"
      interaction_type: display
      data_driven: false

  - type: card
    id: settings_appearance_group
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
