  # ── Profile Header ──────────────────────────────────────────────────────────

  - type: card
    id: settings_profile_header_card
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: "#CDEDA3"
      border_radius: "16dp"
      padding: spacing.md
      margin_bottom: spacing.md
    on_click:
      action: navigate
      target: profile
    children:
      - settings_profile_initials
      - settings_profile_name
      - settings_profile_email
    a11y:
      role: button
      label: "Open your profile"
    test_context:
      purpose: "Tappable header card showing the signed-in user's initials, name, and email; navigates to Profile. Data from ProfileRepository.current() merged into SettingsUiState (profileName/profileEmail/profileInitials)."
      interaction_type: navigate
      data_driven: true

  - type: box
    id: settings_profile_initials
    content: "M"
    style:
      width: "48dp"
      height: "48dp"
      shape: circle
      background: "#4C662B"
      color: "#FFFFFF"
      typography: "Outfit/title_medium"
      font_weight: 700
      alignment: center
    a11y:
      role: image
      label: "Your initials"
    test_context:
      purpose: "Circular initials badge in the profile header (SettingsUiState.profileInitials; 'M' fallback)"
      interaction_type: display
      data_driven: true

  - type: text
    id: settings_profile_name
    content: "Mifos User"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: 600
    a11y:
      role: text
      label: "Your name"
    test_context:
      purpose: "Profile display name in the header (SettingsUiState.profileName; 'Mifos User' fallback)"
      interaction_type: display
      data_driven: true

  - type: text
    id: settings_profile_email
    content: "user@example.com"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
    a11y:
      role: text
      label: "Your email"
    test_context:
      purpose: "Profile email in the header (SettingsUiState.profileEmail); hidden when blank"
      interaction_type: display
      data_driven: true

