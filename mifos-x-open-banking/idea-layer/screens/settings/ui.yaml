      data_driven: false

  # ── Reset Password dialogs (in-screen) ───────────────────────────────────────

  - type: dialog
    id: settings_reset_password_dialog
    variant: alert
    style:
      title: "Reset password?"
    visible_when: "showResetDialog"
    children:
