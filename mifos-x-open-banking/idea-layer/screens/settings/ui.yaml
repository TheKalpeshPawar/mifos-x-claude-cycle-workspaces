      - settings_reset_password_dialog_cancel
    a11y:
      role: dialog
      label: "Reset password confirmation"
    test_context:
      purpose: "AlertDialog asking to confirm sending a reset link. Body: 'We'll email a password reset link to {email}.' (or generic copy when email is blank)."
      interaction_type: display
      data_driven: true

  - type: text
    id: settings_reset_password_dialog_body
    content: "We'll email a password reset link to your registered address."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    a11y:
      role: text
      label: "Reset link will be emailed"
    test_context:
