      interaction_type: display
      data_driven: true

  - type: button
    id: settings_reset_password_dialog_confirm
    label: "Send link"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      color: "#4C662B"
    on_click:
      action: confirm_reset_password
    a11y:
      role: button
      label: "Send the password reset link"
    keyboard:
      focusable: true
    test_context:
      purpose: "Confirm button — dismisses the dialog and calls onResetPassword()"
      interaction_type: action
      data_driven: false

  - type: button
    id: settings_reset_password_dialog_cancel
    label: "Cancel"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      color: "#44483D"
    on_click:
      action: dismiss_reset_password_dialog
    a11y:
      role: button
      label: "Cancel password reset"
    keyboard:
      focusable: true
    test_context:
      purpose: "Dismisses the ResetPasswordDialog without sending"
      interaction_type: action
      data_driven: false

  - type: dialog
    id: settings_reset_message_dialog
    variant: alert
    style:
      title: "Password reset"
    visible_when: "resetMessage != null"
    children:
      - settings_reset_message_body
      - settings_reset_message_ok
    a11y:
      role: dialog
      label: "Password reset result"
    test_context:
