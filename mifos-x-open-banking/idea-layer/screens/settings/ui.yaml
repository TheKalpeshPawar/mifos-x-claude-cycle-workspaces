responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components: []
    note: "Skeleton shimmer shown while preferences load from DataStore"
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [settings_appearance_group, settings_notifications_group, settings_security_group, settings_about_group]

state_model:
  SettingsViewModel:
    screen_state: SettingsUiState
    state:
      - field: isDarkModeEnabled
        type: Boolean
        default: "false"
      - field: selectedLanguage
        type: String
        default: "\"en\""
      - field: isPushNotificationsEnabled
        type: Boolean
        default: "true"
      - field: isTransactionAlertsEnabled
        type: Boolean
        default: "true"
      - field: isMarketingEnabled
        type: Boolean
        default: "false"
      - field: isBiometricLoginEnabled
        type: Boolean
        default: "false"
      - field: isBiometricAvailableOnDevice
        type: Boolean
        default: "false"
      - field: appVersion
        type: String
        default: "\"v1.0.0\""
      - field: isLoading
        type: Boolean
        default: "true"
    errors: [NETWORK_ERROR]
    events: [LoadSettings, OnDarkModeToggled, OnLanguageSelected, OnPushNotificationsToggled, OnTransactionAlertsToggled, OnMarketingToggled, OnBiometricToggled, OnAboutClicked]
    actions: [onLoadSettings(), onDarkModeToggled(), onLanguageSelected(language: String), onPushNotificationsToggled(), onTransactionAlertsToggled(), onMarketingToggled(), onBiometricToggled(), onAboutClicked()]
    di: [SettingsRepository, BiometricManager, NotificationManager, LocaleManager]

navigation:
  - id: nav_to_about
    target: about
    on_click:
      action: navigate
      target: about
  - id: nav_to_consent_manager
    target: consent-manager
    on_click:
      action: navigate
      target: consent-manager
  - id: nav_to_change_password
    target: change-password
    on_click:
      action: navigate
      target: change-password
  - id: nav_to_terms_of_service
    target: terms-of-service
    on_click:
      action: navigate
      target: terms-of-service
  - id: nav_to_privacy_policy
    target: privacy-policy
    on_click:
      action: navigate
      target: privacy-policy
  - id: nav_to_licenses
    target: licenses
    on_click:
      action: navigate
      target: licenses

api: []

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
