    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    note: "SOURCE→SPEC reconciliation to shipped SettingsScreen.kt + SettingsViewModel.kt. Major divergence. ADDED shipped surfaces: a tappable Profile header card (name/email/initials → Profile); THREE mutually-exclusive theme-mode toggle rows (Follow System / Light / Dark) bound to DarkThemeConfig (replacing the single dark-mode boolean); a Security 'Reset Password' row that opens an in-screen AlertDialog (ResetPasswordDialog → authRecoveryRepository.initiateReset, then a result AlertDialog) instead of navigating; a Sign-out OutlinedButton at the bottom that CLEARS the session (obpAuthRepository.logout() + userDataRepository.clearUserData()); the About entries rendered as individual tappable cards (About/Terms/Privacy/Licenses); and a centered footer 'Mifos X Open Banking · v1.0.0'. REMOVED never-built surfaces: the ENTIRE Notifications section (group + push/transaction-alerts/marketing toggles + their dividers), settings_change_password_row (replaced by the Reset Password dialog), settings_consent_manager_row (Data & Consent → consent-manager), the single settings_dark_mode_toggle boolean, and the App Version row (replaced by the footer text). LanguageRow and the Biometric toggle ARE rendered but DISABLED (enabled=false) — kept and marked disabled_until. state_model rewritten to ScreenState<SettingsUiState>{profileName, profileEmail, profileInitials, themeConfig:DarkThemeConfig, selectedLanguage, isBiometricLoginEnabled, isBiometricAvailableOnDevice, appVersion, isLoading} — the three notification booleans removed. actions = onThemeConfigSelected/onLanguageSelected/onBiometricToggled/onSignOut/onResetPassword/onResetMessageConsumed. DI = UserDataRepository, ProfileRepository, AuthRecoveryRepository, ObpAuthRepository. api: was []; shipped has no fetch endpoints but performs runtime auth side-effects (logout token revoke + AuthRecoveryRepository.initiateReset password-reset email) — noted."

screens:
  - id: settings
    name: "Settings"
    viewmodel: "SettingsViewModel"
    impl_status: implemented
    impl_at: "2026-06-03"
    impl_notes: "Reuses UserDataRepository as the single source of truth for theme/language/biometric prefs; profile header from ProfileRepository.current(); reset-password via AuthRecoveryRepository; sign-out via ObpAuthRepository.logout() + clearUserData(). Notification prefs were never built. Nav targets default no-op pending destination screens; Language + Biometric rows render disabled."

archetype: settings

