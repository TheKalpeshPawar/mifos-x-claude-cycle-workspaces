    id: settings_about_privacy_label
    content: "Privacy Policy"
    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    a11y:
      role: text
      label: "Privacy Policy"
    test_context:
      purpose: "Label for the Privacy Policy card"
      interaction_type: display
      data_driven: false

  - type: card
    id: settings_about_licenses_card
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    on_click:
      action: navigate
      target: licenses
    children:
      - settings_about_licenses_icon
      - settings_about_licenses_label
    a11y:
      role: button
      label: "Open-source Licences"
    test_context:
      purpose: "Tappable card (gavel icon + label) navigating to Open-source Licences"
      interaction_type: navigate
      data_driven: false

  - type: icon
    id: settings_about_licenses_icon
    content: "gavel"
    variant: default
    style:
      color: "#4C662B"
      size: "20dp"
    a11y:
      role: image
      label: ""
    test_context:
      purpose: "Leading icon for the Open-source Licences card"
      interaction_type: display
      data_driven: false

  - type: text
    id: settings_about_licenses_label
    content: "Open-source Licences"
    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    a11y:
      role: text
      label: "Open-source Licences"
    test_context:
      purpose: "Label for the Open-source Licences card"
      interaction_type: display
      data_driven: false

  # ── Sign out + footer ────────────────────────────────────────────────────────

  - type: button
    id: settings_sign_out_button
    label: "Sign out"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      border_color: "#BA1A1A"
      color: "#BA1A1A"
      typography: "Outfit/label_large"
      font_weight: 600
      border_radius: "12dp"
      padding: spacing.md
      width: "match_parent"
      icon_start: "logout"
      margin_top: spacing.sm
    on_click:
      action: sign_out
    a11y:
      role: button
      label: "Sign out of your account"
    keyboard:
      focusable: true
    test_context:
      purpose: "OutlinedButton at the bottom. Calls onSignOut() → obpAuthRepository.logout() (revokes/clears the held token) + userDataRepository.clearUserData(). REACTIVE: RootNavViewModel observes userData and routes back to auth. No imperative nav."
      interaction_type: action
      data_driven: false

  - type: text
    id: settings_footer
    content: "Mifos X Open Banking  ·  v1.0.0"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_top: spacing.md
      padding_bottom: spacing.lg
    a11y:
      role: text
      label: "Mifos X Open Banking version 1.0.0"
    test_context:
      purpose: "Centered footer combining the app name and version (SettingsUiState.appVersion). Replaces the old App Version row."
      interaction_type: display
      data_driven: true

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components: []
    note: "ScreenState.Loading — four skeleton cards while UserData + profile load."
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [settings_profile_header_card, settings_appearance_header, settings_appearance_group, settings_security_header, settings_security_group, settings_about_header, settings_about_about_card, settings_about_terms_card, settings_about_privacy_card, settings_about_licenses_card, settings_sign_out_button, settings_footer]
    note: "ScreenState.Content — profile header + Appearance/Security/About + Sign out + footer. The two Reset Password dialogs overlay this state when triggered."

state_model:
  SettingsViewModel:
    screen_state: "ScreenState<SettingsUiState>"
    content_type: SettingsUiState
    state:
      - field: profileName
        type: String
        default: "\"\""
      - field: profileEmail
        type: String
        default: "\"\""
      - field: profileInitials
        type: String
        default: "\"\""
      - field: themeConfig
        type: DarkThemeConfig
        default: "DarkThemeConfig.FOLLOW_SYSTEM"
        note: "enum DarkThemeConfig { FOLLOW_SYSTEM, LIGHT, DARK } — drives the three theme-mode switches"
      - field: selectedLanguage
        type: String
        default: "\"en\""
      - field: isBiometricLoginEnabled
        type: Boolean
        default: "false"
      - field: isBiometricAvailableOnDevice
        type: Boolean
        default: "false"
      - field: appVersion
        type: String
        default: "\"v1.0.0\""
      - field: isLoading
        type: Boolean
        default: "false"
    side_effect_state:
      - field: resetMessage
        type: "String?"
        default: "null"
        note: "separate StateFlow<String?> — drives the result AlertDialog after a password-reset request"
    state_wrapper:
      type: "ScreenState<SettingsUiState>"
      variants: [Loading, "Content(SettingsUiState, DataFreshness)"]
      note: "Error variant unused — profile load failure falls back to a 'Mifos User' header rather than an error screen."
    actions:
      - "onThemeConfigSelected(config: DarkThemeConfig)"
      - "onLanguageSelected(language: String)"
      - "onBiometricToggled()"
      - "onSignOut() — obpAuthRepository.logout() + userDataRepository.clearUserData()"
      - "onResetPassword() — authRecoveryRepository.initiateReset(username, email)"
      - "onResetMessageConsumed()"
    di: [UserDataRepository, ProfileRepository, AuthRecoveryRepository, ObpAuthRepository]
    base: "androidx.lifecycle.ViewModel (exposes StateFlow<ScreenState<SettingsUiState>> + StateFlow<String?> resetMessage)"
    note: "Preference state is the single source of truth in UserDataRepository.userData; UI state is derived reactively (combine), so toggles persist and flow straight back. Profile header is loaded once from ProfileRepository.current(). Sign-out + theme/language/biometric persistence all go through the repositories; RootNavViewModel observes UserData for post-logout routing."

navigation:
  - id: nav_to_profile
    target: profile
    trigger: profile_header_click
    on_click:
      action: navigate
      target: profile
  - id: nav_to_about
    target: about
    on_click:
      action: navigate
      target: about
  - id: nav_to_terms_of_service
    target: terms-of-service
    on_click:
      action: navigate
      target: terms-of-service
  - id: nav_to_privacy_policy
    target: privacy-policy
    on_click:
      action: navigate
      target: privacy-policy
  - id: nav_to_licenses
    target: licenses
    on_click:
      action: navigate
      target: licenses
  - id: sign_out_reactive
    trigger: on_sign_out
    note: "No imperative nav. onSignOut() clears the session (obpAuthRepository.logout() + userDataRepository.clearUserData()); RootNavViewModel observes UserData and routes back to the auth graph."

api:
  - id: settings_runtime_auth_side_effects
    status: runtime-side-effect
    description: "Settings has no fetch endpoints, but two user actions trigger auth-repository calls at runtime:"
    operations:
      - id: obp_initiate_password_reset
        endpoint: "POST /obp/v6.0.0/users/password-reset-url"
        trigger: on_reset_password_confirmed
        via: "AuthRecoveryRepository.initiateReset(username, email)"
        note: "Emails a password-reset link for the signed-in user; result surfaced via resetMessage dialog."
      - id: obp_logout_revoke
        endpoint: "POST /obp/v5.1.0/logout (or OIDC revoke)"
        trigger: on_sign_out
        via: "ObpAuthRepository.logout()"
        note: "Clears/revokes the held OBP token on sign-out; exact endpoint depends on the auth method (DirectLogin vs OIDC)."

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
