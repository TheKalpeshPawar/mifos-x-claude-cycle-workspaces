    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
    a11y:
      role: text
      label: "Dark Mode"
    test_context:
      purpose: "Row label for the dark mode theme toggle"
      interaction_type: display
      data_driven: false

  - type: text
    id: settings_dark_mode_description
    content: "Switch to a darker color scheme"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
    a11y:
      role: text
      label: "Switch to a darker color scheme"
    test_context:
      purpose: "Supplemental description below dark mode label"
      interaction_type: display
      data_driven: false

  - type: input
    id: settings_dark_mode_toggle
    label: "Dark Mode"
    variant: switch
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      color_active: "#4C662B"
      color_inactive: "#C5C8BA"
    prefill: "isDarkModeEnabled"
    on_click:
      action: toggle
      target: settings
    a11y:
      role: switch
      label: "Toggle dark mode"
    keyboard:
      focusable: true
    test_context:
      purpose: "Persists dark mode preference to DataStore; triggers app-wide theme recomposition"
      interaction_type: action
      data_driven: true

  - type: divider
    id: settings_divider_1
