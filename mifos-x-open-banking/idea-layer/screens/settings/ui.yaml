screen_id: settings
archetype: settings
name: "{strings.settings.title}"
status: implemented
initial_state: content
quality_score: 95

# ─────────────────────────────────────────────────────────────────────
# SOURCE BINDING — reverse-synced from source 2026-07-28
#
# The former `ui_source_override: preview` pin is removed: the rendered previews
# were deleted in this pass and SOURCE is now the sole design truth for this screen.
# ─────────────────────────────────────────────────────────────────────
implementation:
  status: implemented
  source_module: "feature/settings"
  package: "org.mifosx.openbanking.feature.settings"
  route: "SettingsRoute (data object)"
  viewmodel: SettingsViewModel
  screen: SettingsScreen
  test_tags_object: SettingsTestTags
  bottom_nav_tab: "MoreTab (order 3) — graphRoute == startDestinationRoute == SettingsRoute"
  sibling_screen: "licences (LicencesRoute) — lives in the same module, modelled as screens/licences/"
  nav_callbacks:
    - "onNavigateToConsents -> navigate(ConsentListRoute)"
    - "onNavigateToLicences -> navigate(LicencesRoute)"
    - "onOpenUrl -> LocalUriHandler.openUri(url)"
  synced_from_source_at: "2026-07-28"
  removed_in_sync:
    - "loading state — SettingsUiState declares only Content, Empty and Error"
    - "clear_confirm state and the clearLocalDataConfirm / dismissClearLocalData / executeClearLocalData actions — no destructive cache-erasure surface exists in source"
    - "toggleBiometricLock, updateSessionTimeout — no Security section is rendered"
    - "toggleConsentExpiryNotification, toggleSecurityAlertsNotification — no Notifications section is rendered"
    - "navigateProfile — the profile screen was never built and no such callback exists"
    - "openAppSystemSettings, clearPfmCache — no such rows or actions"
    - "SettingsPreferences / gpsPermissionState state fields — SettingsState carries only uiState"
  note_unused_prefs: "UserData carries isBiometricsEnabled, isPasscodeEnabled, passcode, enableScreenCapture and appLanguage, but the settings screen exposes none of them — they are template-inherited fields with no UI surface."

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.settings.title}"
  top_app_bar_leading: null
  fab_visible: false

business_logic:
  kind: nav_only
  description: "Settings hub over UserDataRepository. SettingsViewModel maps the user-data stream into SettingsUiState.Content carrying themeConfig (DarkThemeConfig), a resolved themeLabel StringResource, appVersionLabel from the injected SettingsAppVersion, and isThemeMenuExpanded. The only persisted mutation is SelectTheme, which writes DarkThemeConfig back through UserDataRepository; ToggleThemeMenu and DismissThemeMenu are pure local UI state for the dropdown. Three sections render: Appearance (theme dropdown), Account (a single consents row) and About (privacy link opening a browser, licences opening in-app, and a static app-version readout with no click handler). A preferences read failure surfaces SettingsErrorKind.PreferencesUnavailable; both error kinds are retriable."
  external_library_refs:
    - "androidx.datastore"
    - "kotlinx-serialization"
  description_author: claude
  description_authored_at: "2026-07-28T00:00:00Z"

# ─────────────────────────────────────────────────────────────────────
# STATE MODEL — SettingsViewModel contract
# Mirrors ui/SettingsState.kt verbatim.
# ─────────────────────────────────────────────────────────────────────
state_model:
  SettingsViewModel:
    state:
      name: SettingsState
      fields:
        - name: uiState
          type: SettingsUiState
    screen_state:
      sealed_class: SettingsUiState
      members:
        - Content   # themeConfig, themeLabel, appVersionLabel, isThemeMenuExpanded
        - Empty
        - Error     # kind: SettingsErrorKind
    errors:
      types:
        - SettingsErrorKind.PreferencesUnavailable  # isRetriable = true
        - SettingsErrorKind.Unknown                 # isRetriable = true
    actions:
      members:
        - SelectTheme        # data class(config: DarkThemeConfig) — persists via UserDataRepository
        - ToggleThemeMenu    # local dropdown expand
        - DismissThemeMenu   # local dropdown collapse
        - RetryLoad
    di:
      - UserDataRepository   # Koin single; theme + user preference stream and writes
      - SettingsAppVersion   # supplies appVersionLabel

status_history:
  - from: enriched
    to: implemented
    at: "2026-07-28"
    by: "/gap-analysis-project (reverse sync from source)"
    note: "11 of 15 declared actions had no source implementation and were removed; loading and clear_confirm states removed; ui_source_override: preview pin dropped with the previews."

states: [content, empty, error]

components:

  # ══ APPEARANCE SECTION ═════════════════════════════════════════════
  - type: section_header
    id: appearance_header
    state_binding: [content]
    label: "{strings.settings.section.appearance}"
    test_tag: "settings:section:appearance"
    accessibility_label: "{strings.settings.section.appearance.a11y}"
    test_context:
      purpose: "SettingsSection title for the appearance group"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: select
    id: theme_row
    state_binding: [content]
    label: "{strings.settings.theme.label}"
    value: "{themeLabel}"
    test_tag: "settings:row:theme"
    value_test_tag: "settings:themeValue"
    menu_test_tag: "settings:themeMenu"
    expanded_binding: "{isThemeMenuExpanded}"
    options:
      - { id: FOLLOW_SYSTEM, label: "{strings.settings.theme.option_system}" }
      - { id: LIGHT,         label: "{strings.settings.theme.option_light}" }
      - { id: DARK,          label: "{strings.settings.theme.option_dark}" }
    accessibility_label: "{strings.settings.theme.select_a11y}"
    test_context:
      purpose: "ThemeDropdownRow — the only persisted preference on this screen"
      required_fields: [themeConfig, themeLabel, isThemeMenuExpanded]
      interaction_type: action
      data_driven: true
    on_click:
      action: ToggleThemeMenu
      action_contract:
        effect: transform_state
        description: "Dispatches SettingsAction.ToggleThemeMenu, flipping isThemeMenuExpanded on the Content state. Purely local UI state — nothing is persisted."
    on_dismiss:
      action: DismissThemeMenu
      action_contract:
        effect: transform_state
        description: "Dispatches SettingsAction.DismissThemeMenu, collapsing the dropdown without changing the selected theme."
    on_select:
      action: SelectTheme
      params:
        config: "{option.id}"
      action_contract:
        effect: persist_db
        writes_to: ["user_preferences.darkThemeConfig"]
        external_library_refs: ["androidx.datastore"]
        description: "Dispatches SettingsAction.SelectTheme(config), writing the chosen DarkThemeConfig back through UserDataRepository. The stream re-emits and the whole app retints."

  # ══ ACCOUNT SECTION ════════════════════════════════════════════════
  - type: section_header
    id: account_header
    state_binding: [content]
    label: "{strings.settings.section.account}"
    test_tag: "settings:section:account"
    accessibility_label: "{strings.settings.section.account.a11y}"
    test_context:
      purpose: "SettingsSection title for the account group"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: list_item
    id: consents_row
    state_binding: [content]
    title: "{strings.settings.consents.title}"
    subtitle: "{strings.settings.consents.subtitle}"
    leading_icon: policy
    trailing: chevron
    test_tag: "settings:row:consents"
    trailing_test_tag: "settings:row:consents:chevron"
    accessibility_label: "{strings.settings.opens_in_app.a11y}"
    test_context:
      purpose: "Only outbound in-app navigation from the account group"
      required_fields: []
      interaction_type: action
      data_driven: false
    on_click:
      action: navigate_consent_list
      target: consent-list
      action_contract:
        effect: navigate
        description: "Invokes the settingsScreen onNavigateToConsents callback, which navigates to ConsentListRoute. A nav-host callback, not a SettingsAction member."

  # ══ ABOUT SECTION ══════════════════════════════════════════════════
  - type: section_header
    id: about_header
    state_binding: [content]
    label: "{strings.settings.section.about_legal}"
    test_tag: "settings:section:about"
    accessibility_label: "{strings.settings.section.about_legal.a11y}"
    test_context:
      purpose: "SettingsSection title for the about group"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: list_item
    id: privacy_row
    state_binding: [content]
    title: "{strings.settings.privacy.title}"
    leading_icon: privacy_tip
    trailing: external_link
    test_tag: "settings:row:privacy"
    trailing_test_tag: "settings:row:privacy:externalLink"
    accessibility_label: "{strings.settings.opens_externally.a11y}"
    test_context:
      purpose: "Leaves the app for a browser; carries the external-link glyph rather than a chevron"
      required_fields: []
      interaction_type: action
      data_driven: false
    on_click:
      action: open_privacy_url
      action_contract:
        effect: share_external
        external_library_refs: ["compose.ui.platform.LocalUriHandler"]
        description: "Invokes the settingsScreen onOpenUrl callback, which calls LocalUriHandler.openUri(url) to open the privacy policy in the platform browser."

  - type: list_item
    id: licences_row
    state_binding: [content]
    title: "{strings.settings.licences.title}"
    leading_icon: info
    trailing: chevron
    test_tag: "settings:row:licences"
    trailing_test_tag: "settings:row:licences:chevron"
    accessibility_label: "{strings.settings.opens_in_app.a11y}"
    test_context:
      purpose: "Opens the in-app OSS licences screen"
      required_fields: []
      interaction_type: action
      data_driven: false
    on_click:
      action: navigate_licences
      target: licences
      action_contract:
        effect: navigate
        description: "Invokes the settingsScreen onNavigateToLicences callback, which navigates to LicencesRoute — a sibling destination in the same feature module."

  - type: list_item
    id: app_version_row
    state_binding: [content]
    title: "{strings.settings.app_version.title}"
    subtitle: "{appVersionLabel}"
    test_tag: "settings:row:appVersion"
    subtitle_test_tag: "settings:appVersionValue"
    test_context:
      purpose: "Static build-identity readout — deliberately no icon, no trailing affordance and no click handler"
      required_fields: [appVersionLabel]
      interaction_type: display
      data_driven: true

  # ══ EMPTY STATE ════════════════════════════════════════════════════
  - type: empty_state
    id: settings_empty
    state_binding: [empty]
    title: "{strings.settings.empty.title}"
    body: "{strings.settings.empty.body}"
    test_tag: "settings:emptyState"
    accessibility_label: "{strings.settings.empty.title}"
    test_context:
      purpose: "SettingsUiState.Empty — no preferences resolved"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ══ ERROR STATE ════════════════════════════════════════════════════
  - type: error_state
    id: settings_error
    state_binding: [error]
    icon: error_outline
    title: "{strings.settings.error.title}"
    body: "{strings.settings.error.body}"
    test_tag: "settings:errorState"
    accessibility_label: "{strings.settings.error.title}"
    test_context:
      purpose: "Both SettingsErrorKind values render here; both are retriable"
      required_fields: [uiState.kind]
      interaction_type: display
      data_driven: true
    children:
      - type: button
        id: retry_button
        variant: filled
        label: "{strings.settings.error.retry}"
        test_tag: "settings:retryButton"
        accessibility_label: "{strings.settings.error.retry.a11y}"
        on_click:
          action: RetryLoad
          action_contract:
            effect: transform_state
            external_library_refs: ["androidx.datastore"]
            description: "Dispatches SettingsAction.RetryLoad, re-reading the UserDataRepository preference stream to rebuild Content."
