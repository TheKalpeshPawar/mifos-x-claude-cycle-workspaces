screen_id: settings
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; realistic preference values only."

settings:
  theme: "System"
  biometric_lock_enabled: true
  session_timeout: "5 minutes"
  notify_consent_expiry: true
  notify_security_alerts: true
  # Dynamic at runtime — sourced from BuildConfig.VERSION_NAME + VERSION_CODE.
  # Shown in About & Legal section; never hard-coded in UI layer.
  app_version: "0.1.0 (build 1)"
