# ── Description corrected 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# Listed security (biometric lock + session timeout), notifications, a Profile row and a
# Clear Local Data row. None ships: components are appearance_header/theme_row,
# account_header/consents_row, about_header/privacy_row/licences_row/app_version_row.
# idea-plan.yaml already recorded the reverse-sync note ("biometric app-lock, session
# timeout and notification preferences were specified but never built"); this prose was
# not updated to match. The Profile row was deleted when profile became account-holder.
description: >-
  App settings hub — appearance (theme dropdown), a Manage Consents shortcut, and About &
  Legal (privacy policy in a browser, in-app open-source licences, static app version).
  Client-only: no store, no core/data banking layer, no external API. SettingsViewModel reads
  and writes UserDataRepository and is the first production caller of setDarkThemeConfig.
  It *is* the More tab — MoreTab points at SettingsRoute, replacing the former MoreRoute
  placeholder.
has_ui: true
has_server: false
metadata:
  category: settings
  implementation_ready: true
  impl_ready_at: '2026-07-14T20:00:00Z'
  impl_ready_schema: v2
contracts: []
libraries:
  - name: multiplatform-settings
    module: com.russhwolf:multiplatform-settings-no-arg (+ -coroutines)
    purpose: >-
      Preference storage. Consume the EXISTING core/datastore UserPreferencesRepository — this feature
      adds NO new preference keys and NO new persistence code. Its only persisted setting is the theme,
      already served by observeDarkThemeConfig: Flow<DarkThemeConfig> / setDarkThemeConfig(...).
      (The keys that would have been new — session_timeout, notify_consent_expiry,
      notify_security_alerts — belonged to the Security and Notifications sections, which are out of
      scope per the 2026-07-22 scope cut.) androidx.datastore is not in the version catalog and must
      not be introduced.
  - name: app design system
    module: core/ui (KptScaffold) + core-base/designsystem (KptTheme)
    purpose: >-
      Settings rows are composed from the app's own design system under the one-state-per-file
      Screen/Content/Skeleton/Empty/Error convention. No third-party settings-UI dependency —
      com.github.alorma:compose-settings-ui-m3 is not in the version catalog.
  - name: kotlinx-serialization
    module: org.jetbrains.kotlinx:kotlinx-serialization-json
    purpose: Serialization for structured preference types held in preferences
vm_actions:
  - name: updateTheme
    signature: 'suspend fun updateTheme(theme: String)'
    state_mutations:
      - settings.theme
    side_effects:
      - Writes theme key to DataStore preferences atomically
      - Dynamic theming reacts via collectAsStateWithLifecycle in AppTheme
    error_handling:
      on_error: log_only
  - name: toggleBiometricLock
    signature: suspend fun toggleBiometricLock()
    state_mutations:
      - settings.biometric_lock_enabled
    side_effects:
      - Flips biometric_lock_enabled in DataStore atomically
      - If no enrolled biometrics detected, emits BiometricUnavailable event — no DataStore write
    error_handling:
      on_error: show_informational_dialog
  - name: updateSessionTimeout
    signature: 'suspend fun updateSessionTimeout(duration: String)'
    state_mutations:
      - settings.session_timeout
    side_effects:
      - Writes session_timeout key to DataStore; value must be one of [2 minutes, 5 minutes, 10 minutes, 30 minutes]
    error_handling:
      on_error: log_only
  - name: toggleConsentExpiryNotification
    signature: suspend fun toggleConsentExpiryNotification()
    state_mutations:
      - settings.notify_consent_expiry
    side_effects:
      - Persists notify_consent_expiry flag to DataStore atomically
    error_handling:
      on_error: log_only
  - name: toggleSecurityAlertsNotification
    signature: suspend fun toggleSecurityAlertsNotification()
    state_mutations:
      - settings.notify_security_alerts
    side_effects:
      - Persists notify_security_alerts flag to DataStore atomically
    error_handling:
      on_error: log_only
  - name: navigateConsentList
    signature: fun navigateConsentList()
    state_mutations: []
    side_effects:
      - Emits navigation event to consent-list route
    error_handling: {}
  - name: navigateProfile
    signature: fun navigateProfile()
    state_mutations: []
    side_effects:
      - Emits navigation event to profile route
    error_handling: {}
  - name: clearLocalDataConfirm
    signature: fun clearLocalDataConfirm()
    state_mutations:
      - state = clear_confirm
    side_effects:
      - Emits ShowClearDataConfirmation event; SettingsScreen observes, sets state to clear_confirm, and reveals clear_local_data_sheet
    error_handling: {}
  - name: dismissClearLocalData
    signature: fun dismissClearLocalData()
    state_mutations:
      - state = content
    side_effects:
      - Dismisses clear_local_data_sheet bottom-sheet; screen returns to content state; no data erased
    error_handling: {}
  - name: executeClearLocalData
    signature: suspend fun executeClearLocalData()
    state_mutations:
      - state = content
    side_effects:
      - Deletes all locally cached account and transaction rows from Room/SQLDelight (transactional delete)
      - Resets DataStore cached-at timestamp keys to null (only after Room delete succeeds)
      - Emits LocalDataCleared event; UI shows success snackbar
      - Open Banking consent authorisations on the server are NOT affected
    error_handling:
      on_room_delete_failure: show_error_snackbar_with_retry
      on_error: DataStore timestamps NOT reset until Room deletion succeeds (transactional ordering)
  - name: openExternalUrl
    signature: 'fun openExternalUrl(url: String)'
    state_mutations: []
    side_effects:
      - Fires platform intent / openURL to system browser with provided URL
    error_handling:
      on_no_browser: show_snackbar
  - name: openOssLicences
    signature: fun openOssLicences()
    state_mutations: []
    side_effects:
      - Emits navigation event to AboutLibraries OSS licences destination
    error_handling: {}
error_cases:
  - trigger: load_settings_on_mount
    condition: DataStore preferences Flow throws IOException on initial collection (storage corruption, disk full)
    handling: >-
      Transition screen to Error state. Display error_outline icon, title, body, and a Retry button. Retry re-triggers
      Flow collection (Loading → Content on recovery, or Error again on repeat failure).
    severity: error
  - trigger: open_external_url
    condition: No browser app installed on device (ActivityNotFoundException on Android)
    handling: >-
      Show snackbar — URL not opened silently; no crash. Snackbar offers no retry (no viable action available without a
      browser).
    severity: warning
  - trigger: toggle_biometric_lock
    condition: >-
      Device has no biometric hardware or no enrolled biometrics (BiometricManager.BIOMETRIC_ERROR_NONE_ENROLLED /
      NO_HARDWARE)
    handling: >-
      Emit BiometricUnavailable event; Settings screen shows informational AlertDialog explaining unavailability.
      DataStore not written; switch remains Off.
    severity: info
  - trigger: clear_local_data
    condition: Room/SQLDelight delete transaction fails (IOException, disk full)
    handling: >-
      Show error snackbar with Retry action. DataStore timestamps are not reset until Room deletion succeeds
      (transactional ordering preserved).
    severity: error
