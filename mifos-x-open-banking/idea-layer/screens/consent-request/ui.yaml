sibling: ui
feature_id: consent-request
id: consent-request
name: "Review & Grant Access"
feature: consent-request
flavor: consumer
status: enriched
quality_score: 96
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-OB-002, FR-003]
status_history:
  - { from: null, to: draft, at: "2026-06-11", by: "/idea add" }
  - { from: draft, to: enriched, at: "2026-06-12", by: "/idea-enrich", note: "Enriched consent-grant screen — all 10 OBIE data-cluster rows with least-privilege framing (8 required + 2 optional), accounts-in-scope + access-duration + 'approve at HSBC' surfaces, submitting + empty states added, OBReadConsent1/OBReadConsentResponse1 bound with mTLS + detached x-jws-signature + x-idempotency-key, full state_model/route/testing/documentation. quality 0 → 96." }

screens:
