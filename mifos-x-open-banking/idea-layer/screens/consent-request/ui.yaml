responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [consent_title, consent_subtitle, consent_scope_card, consent_clusters_card, consent_expiry_note, consent_grant_button, consent_cancel_button, consent_footer]
  submitting:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [consent_submitting_spinner, consent_submitting_message]
    note: "Shown after Grant access while POST account-access-consents is in flight and the signed authorise request is built; the grant button also shows its inline loading spinner."
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components: [consent_title, consent_subtitle, consent_scope_card, consent_clusters_card, consent_expiry_note, consent_error_banner, consent_grant_button, consent_cancel_button, consent_footer]
  empty:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [consent_empty_icon, consent_empty_title, consent_empty_message, consent_cancel_button]
    note: "Rare — no shareable HSBC accounts were found; the PSU can only go back, there is nothing to consent to."

state_model:
  ConsentRequestViewModel:
    screen_state: ConsentRequestUiState
    state:
      - field: uiState
        type: ConsentRequestScreenState
        default: "ConsentRequestScreenState.Content"
        note: "Content | Submitting | Error | Empty — the form has interactive review-then-submit, so it starts in Content (no on-mount data load)."
      - field: permissions
        type: "List<String>"
        default: "DEFAULT_AIS_PERMISSIONS"
        note: "The OBIE permission clusters to request. Required floor: ReadAccountsDetail, ReadBalances, ReadTransactionsDetail. Optional (included by default, least-privilege framing): ReadBeneficiariesDetail, ReadStandingOrdersDetail, ReadDirectDebits, ReadScheduledPaymentsDetail, ReadParty, ReadProducts, ReadStatementsDetail. Sent as Data.Permissions in OBReadConsent1."
      - field: expirationDateTime
        type: "String?"
        default: "null"
        note: "Optional Data.ExpirationDateTime (ISODateTime); defaults to creation + 90 days. null = open-ended consent."
      - field: consentId
        type: "String?"
        default: "null"
        note: "Populated from Data.ConsentId on a 201; becomes the openbanking_intent_id for the authorise request."
      - field: consentStatus
        type: "String?"
        default: "null"
        note: "Data.Status from OBReadConsentResponse1; expected AWAU before authorisation."
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isSubmitting
        type: Boolean
        default: "false"
    derived: []
    errors: [BAD_REQUEST, UNAUTHORIZED, INVALID_CONSENT_STATUS, TOO_MANY_REQUESTS, SERVER_ERROR, UNKNOWN]
    events:
      - "ConsentRequestEvent.NavigateToBankAuthorize(consentId: String)"
      - ConsentRequestEvent.NavigateToConsentIntro
    actions:
      - ConsentRequestAction.GrantClicked
      - ConsentRequestAction.CancelClicked
      - "ConsentRequestAction.Internal.CreateConsentResultReceive(result) — internal async result from ObpAuthRepository.createAccountAccessConsent"
    di: [ObpAuthRepository]
    base: "template.core.base.ui.viewmodel.BaseViewModel<ConsentRequestUiState, ConsentRequestEvent, ConsentRequestAction>"
    note: "GrantClicked sets uiState=Submitting, acquires a client-credentials token and POSTs /aisp/account-access-consents via ObpAuthRepository (consent returns AWAU). On success it emits NavigateToBankAuthorize(consentId) so the next screen builds the signed authorise request with openbanking_intent_id = ConsentId. PKCE verifier + CSRF state + client-assertion JWT live inside ObpAuthRepository, not in UI state. mTLS (QWAC) + detached x-jws-signature + x-idempotency-key are applied by the network layer, not surfaced in UI state."

navigation:
  - id: nav_to_bank_authorize
    target: bank-authorize-handoff
    trigger: grant_success
    on_click:
      action: navigate
      target: bank-authorize-handoff
    note: "Forward nav after a successful create-consent (AWAU). One-shot ConsentRequestEvent.NavigateToBankAuthorize(consentId) — the handoff screen runs the external HSBC authorise redirect."
  - id: nav_to_consent_intro
    target: consent-intro
    trigger: cancel_click
    on_click:
      action: navigate
      target: consent-intro
    note: "Back nav — Cancel returns to consent-intro without creating a consent."

api:
  - id: create_account_access_consent
    endpoint: "POST /obie/open-banking/v4.0/aisp/account-access-consents"
    method: POST
    path: "/obie/open-banking/v4.0/aisp/account-access-consents"
    tag: AccountInformation
    trigger: on_grant_clicked
    request_dto: OBReadConsent1
    returns: OBReadConsentResponse1
    inputs: [permissions, expirationDateTime]
    description: "Register an account-access-consent with the PSU-selected Permissions[]. Uses a client-credentials token (acquired by ObpAuthRepository). ASPSP returns ConsentId + Status AWAU (awaiting authorisation). The ConsentId becomes the openbanking_intent_id for the subsequent authorise redirect. FAPI 1.0 Advanced: mTLS (QWAC) transport + detached x-jws-signature on this write + x-idempotency-key for safe retry."
    request:
      content_type: "application/json"
      dto: OBReadConsent1
      headers:
        Authorization: "Bearer {cc_access_token}"
        x-fapi-financial-id: "{fapi_financial_id}"
        x-fapi-interaction-id: "{uuid}"
        x-jws-signature: "{detached_jws}"
        x-idempotency-key: "{idempotency_key}"
        Content-Type: "application/json"
      body:
        Data:
          Permissions:
            - ReadAccountsDetail
            - ReadBalances
            - ReadTransactionsDetail
            - ReadBeneficiariesDetail
            - ReadStandingOrdersDetail
            - ReadDirectDebits
            - ReadScheduledPaymentsDetail
            - ReadParty
            - ReadProducts
            - ReadStatementsDetail
          ExpirationDateTime: "{optional_expiry_iso}"
        Risk: {}
    response:
      status: 201
      dto: OBReadConsentResponse1
      fields:
        - name: Data.ConsentId
          type: String
          stored_as: consent_id
        - name: Data.Status
          type: String
          note: "Initial AWAU; enum AWAU|AUTH|RJCT|CANC|EXPD."
        - name: Data.CreationDateTime
          type: String
        - name: Data.StatusUpdateDateTime
          type: String
        - name: Data.Permissions
          type: Array
          note: "Echo of the requested permission clusters."
        - name: Data.ExpirationDateTime
          type: String
          note: "Echo of requested expiry; open-ended if absent."
    errors:
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "We couldn't start your connection. Please check your network and try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "We couldn't authorise this connection. Please try again."
      - code: 403
        name: OB_INVALID_CONSENT_STATUS
        ui_message: "This connection is no longer valid. Please start again."
      - code: 429
        name: TOO_MANY_REQUESTS
        ui_message: "Too many attempts. Please wait a moment and try again."
      - code: 500
        name: OB_UNEXPECTED_ERROR
        ui_message: "Something went wrong on our end. Please try again in a moment."

testing:
  scenarios:
    - { id: TC-CONSENT-REQUEST-001, scenario: "Content state renders the scope card + all 10 permission cluster rows", priority: P0 }
    - { id: TC-CONSENT-REQUEST-002, scenario: "Grant access POSTs account-access-consents and shows the submitting state", priority: P0 }
    - { id: TC-CONSENT-REQUEST-003, scenario: "Successful 201 (Status AWAU) emits NavigateToBankAuthorize with the ConsentId", priority: P0 }
    - { id: TC-CONSENT-REQUEST-004, scenario: "Create-consent failure (400/401/403/429/500) shows the error banner with the mapped message", priority: P0 }
    - { id: TC-CONSENT-REQUEST-005, scenario: "Empty state shows when no shareable HSBC accounts are found", priority: P1 }
    - { id: TC-CONSENT-REQUEST-006, scenario: "Cancel navigates back to consent-intro without creating a consent", priority: P1 }
    - { id: TC-CONSENT-REQUEST-007, scenario: "Required clusters carry the Required badge; optional clusters carry the Optional badge", priority: P1 }
    - { id: TC-CONSENT-REQUEST-008, scenario: "Scope card renders the accounts-in-scope text and the 90-day expiry date", priority: P1 }
  coverage_target: 80

documentation:
  user_stories:
    - { actor: PSU, action: "review exactly which data clusters an app will read from my HSBC account", benefit: "I can give informed, least-privilege consent before anything is shared" }
    - { actor: PSU, action: "see which accounts are shared and how long access lasts", benefit: "I understand the scope and duration before I authorise" }
    - { actor: PSU, action: "grant access and be taken to HSBC to approve", benefit: "I authenticate at my bank and never type my bank password into a third-party app" }
  success_metrics:
    - { metric: consent_grant_rate, target: "75%" }
    - { metric: consent_create_to_awau_latency_p95, target: "< 2s" }
  feature_flags: []
  references:
    - "OBIE Account & Transaction API v4.0 — account-access-consents (OBReadConsent1 / OBReadConsentResponse1)"
    - "FAPI 1.0 Advanced — mTLS, detached JWS request signing, x-idempotency-key"

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
  services: [ObpAuthRepository]
  shared_entities: [AccountAccessConsent, Permission]
