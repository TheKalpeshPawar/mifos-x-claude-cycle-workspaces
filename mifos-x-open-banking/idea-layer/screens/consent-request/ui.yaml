      color: "#1A1C16"
      padding_bottom: spacing.xs
    a11y:
      role: heading
      level: 1
      label: "Review what you'll share"
    test_context:
      purpose: "Headline of the consent-grant screen where the PSU reviews the data clusters before authorising"
      interaction_type: display
      data_driven: false

  - type: text
