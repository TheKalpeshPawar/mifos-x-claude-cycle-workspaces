id: consent-request
name: "Review & Grant Access"
feature: consent-request
flavor: consumer
status: draft
quality_score: 0
contract_version: "1.1.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-OB-002]
status_history:
  - { from: null, to: draft, at: "2026-06-11", by: "/idea add" }

screens:
