responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: idle
  idle:
    layout: { type: column, padding: spacing.lg }
    visible_components: [consent_title, consent_subtitle, consent_clusters_card, consent_expiry_note, consent_grant_button, consent_cancel_button, consent_footer]
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [consent_title, consent_subtitle, consent_clusters_card, consent_expiry_note, consent_grant_button, consent_cancel_button, consent_footer]
  loading:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [consent_grant_spinner, consent_loading_message]
    note: "Shown while POST account-access-consents is in flight and the signed authorise request is built; grant button shows its loading spinner, full-screen takeover variant uses the centered spinner + message."
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components: [consent_title, consent_subtitle, consent_clusters_card, consent_expiry_note, consent_error_banner, consent_grant_button, consent_cancel_button, consent_footer]

state_model:
  ConsentRequestViewModel:
    screen_state: ConsentRequestUiState
    state:
      - field: permissions
        type: "List<String>"
        default: "DEFAULT_AIS_PERMISSIONS"
        note: "The OBIE permission clusters to request: ReadAccountsDetail, ReadBalances, ReadTransactionsDetail, ReadStandingOrdersDetail, ReadDirectDebits, ReadBeneficiariesDetail, ReadParty, ReadProducts. Sent as Data.Permissions in the create-consent body."
      - field: expirationDateTime
        type: "String?"
        default: "null"
        note: "Optional Data.ExpirationDateTime (ISODateTime); null = open-ended consent."
      - field: consentId
        type: "String?"
        default: "null"
        note: "Populated from Data.ConsentId after a 201; becomes the openbanking_intent_id for the authorise request."
      - field: consentStatus
        type: "String?"
        default: "null"
        note: "Data.Status from the create-consent response; expected AWAU before authorisation."
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isCreatingConsent
        type: Boolean
        default: "false"
    derived: []
    errors: [BAD_REQUEST, UNAUTHORIZED, TOO_MANY_REQUESTS, SERVER_ERROR, UNKNOWN]
    events:
      - "ConsentRequestEvent.NavigateToBankAuthorize(consentId: String)"
      - ConsentRequestEvent.NavigateToConsentIntro
    actions:
      - ConsentRequestAction.GrantClicked
      - ConsentRequestAction.CancelClicked
      - "ConsentRequestAction.Internal.CreateConsentResultReceive(result) — internal async result from ObpAuthRepository.createAccountAccessConsent"
    di: [ObpAuthRepository]
    base: "template.core.base.ui.viewmodel.BaseViewModel<ConsentRequestUiState, ConsentRequestEvent, ConsentRequestAction>"
    note: "GrantClicked acquires a client-credentials token and POSTs /aisp/account-access-consents via ObpAuthRepository (consent returns AWAU); on success it emits NavigateToBankAuthorize(consentId) so the next screen builds the signed authorise request with openbanking_intent_id = ConsentId. PKCE verifier + CSRF state + client-assertion JWT live inside ObpAuthRepository, not in UI state."

navigation:
  - id: nav_to_bank_authorize
    target: bank-authorize-handoff
    trigger: grant_success
    on_click:
      action: navigate
      target: bank-authorize-handoff
    note: "Forward nav after a successful create-consent (AWAU). One-shot ConsentRequestEvent.NavigateToBankAuthorize(consentId) — the handoff screen runs the external HSBC authorise redirect."
  - id: nav_to_consent_intro
    target: consent-intro
    trigger: cancel_click
    on_click:
      action: navigate
      target: consent-intro
    note: "Back nav — Cancel returns to consent-intro without creating a consent."

api:
  - id: create_account_access_consent
    endpoint: "POST /obie/open-banking/v4.0/aisp/account-access-consents"
    tag: AccountInformation
    trigger: on_grant_clicked
    description: "Register an account-access-consent with the PSU-selected Permissions[]. Uses a client-credentials token (acquired by ObpAuthRepository). ASPSP returns ConsentId + Status AWAU (awaiting authorisation). The ConsentId becomes the openbanking_intent_id for the subsequent authorise redirect."
    request:
      content_type: "application/json"
      headers:
        Authorization: "Bearer {cc_access_token}"
        x-fapi-financial-id: "{fapi_financial_id}"
      body:
        Data:
          Permissions:
            - ReadAccountsDetail
            - ReadBalances
            - ReadTransactionsDetail
            - ReadStandingOrdersDetail
            - ReadDirectDebits
            - ReadBeneficiariesDetail
            - ReadParty
            - ReadProducts
          ExpirationDateTime: "{optional_expiry_iso}"
        Risk: {}
    response:
      fields:
        - name: Data.ConsentId
          type: String
          stored_as: consent_id
        - name: Data.Status
          type: String
          note: "Initial AWAU; enum AWAU|AUTH|RJCT|CANC|EXPD."
        - name: Data.CreationDateTime
          type: String
        - name: Data.StatusUpdateDateTime
          type: String
        - name: Data.Permissions
          type: Array
          note: "Echo of the requested permission clusters."
        - name: Data.ExpirationDateTime
          type: String
          note: "Echo of requested expiry; open-ended if absent."
    errors:
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "We couldn't start your connection. Please check your network and try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "We couldn't authorise this connection. Please try again."
      - code: 429
        name: TOO_MANY_REQUESTS
        ui_message: "Too many attempts. Please wait a moment and try again."
      - code: 500
        name: OB_UNEXPECTED_ERROR
        ui_message: "Something went wrong on our end. Please try again in a moment."

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
