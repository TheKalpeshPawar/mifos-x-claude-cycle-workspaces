    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - consent_title
      - consent_subtitle
      - consent_scope_card
      - consent_clusters_card
      - consent_expiry_note
      - consent_error_banner
      - consent_grant_button
      - consent_cancel_button
      - consent_footer

  - type: text
    id: consent_title
    content: "Review what you'll share"
    variant: headline_large
    style:
      typography: "Outfit/headline_medium"
      color: "#1A1C16"
      padding_bottom: spacing.xs
    a11y:
      role: heading
      level: 1
      contentDescription: "Review what you'll share"
      label: "Review what you'll share"
    test_context:
      purpose: "Headline of the consent-grant screen where the PSU reviews the data clusters before authorising"
      interaction_type: display
      data_driven: false

  - type: text
    id: consent_subtitle
    content: "This app is asking to read the following information from your HSBC account. Tap Grant access to continue to HSBC's secure sign-in."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_bottom: spacing.lg
    a11y:
      role: text
      contentDescription: "This app is asking to read the following information from your HSBC account. Grant access continues to HSBC's secure sign-in."
      label: "This app is asking to read the following information from your HSBC account. Grant access continues to HSBC's secure sign-in."
    test_context:
      purpose: "Supporting copy describing the consent request and the next step (HSBC redirect)"
      interaction_type: display
      data_driven: false

  - type: card
