    by: /idea add
    note: >-
      DRAFT screen created for the HSBC Open Banking migration (OBP DirectLogin →
      OBIE consent-driven TPP model). The consent-grant screen of the
      account-access-consent flow: the PSU reviews the seven read-only data
      clusters (Accounts & balances, Transactions, Standing orders, Direct
      debits, Beneficiaries, Party & contact, Products) and taps Grant access,
      which POSTs /aisp/account-access-consents (status AWAU) then advances to
      bank-authorize-handoff for the external HSBC sign-in. No in-app password.
      Pending /idea-enrich for quality score + previews.
  - from: draft
    to: enriched
    at: '2026-06-12'
    by: /idea-enrich
    note: >-
      Enriched the consent-grant screen. All 10 OBIE data-cluster rows now render
      with least-privilege framing (Account details, Balances, Transactions
      required; Payees, Standing orders, Direct debits, Scheduled payments,
      Account-holder info, Product details, Statements optional-but-included).
      Added a scope card (which accounts are shared + access duration), 90-day
      expiry note, the "approve at HSBC" footer, a submitting state ("Creating
      your consent…") and an empty state (no shareable accounts). Bound
      OBReadConsent1 (request) / OBReadConsentResponse1 (201, Status AWAU) with
      mTLS + detached x-jws-signature + x-idempotency-key headers, full
      state_model, route, testing and documentation blocks, plus demo-data.yaml.
      quality 0 → 96.
