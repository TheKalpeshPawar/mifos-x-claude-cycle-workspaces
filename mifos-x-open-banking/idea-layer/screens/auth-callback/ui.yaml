id: auth-callback
name: "Completing Connection"
feature: account-access-consent
flavor: consumer
status: draft
quality_score: 0
contract_version: "1.1.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-OBIE-AUTH-CALLBACK]
status_history:
  - status: draft
    at: "2026-06-11"
    by: "/idea-add (manual draft authoring)"
    note: "Deep-link callback takeover authored for the OBIE redirect return. Receives org.mifos.openbanking://oauth/callback, exchanges the authorization code for an access token (POST /oauth2/token), then routes onward by consent context: home for AIS consent, payment-result for payment consent; consent-declined / payment-declined on error. SHARED between account-access-consent and payment-initiation flows. Modelled on login/ui.yaml's oauth_exchanging takeover. Awaiting /idea-enrich."

screens:
  - id: auth-callback
    name: "Completing Connection"
    viewmodel: "AuthCallbackViewModel"

archetype: status

components:
  - type: stack
    id: callback_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
      align: center
      justify: center
    children:
      - callback_bank_icon
      - callback_title
      - callback_message
      - callback_spinner
      - callback_security_note
      - callback_error_card
      - callback_retry_button
      - callback_cancel_link

  - type: icon
    id: callback_bank_icon
    content: "verified_user"
    variant: default
    style:
      color: "#4C662B"
      size: "80dp"
      alignment: center
    a11y:
      role: image
      label: "Secure connection"
    test_context:
      purpose: "Shield icon shown at the top of the full-screen callback takeover while the code is exchanged for a token"
      interaction_type: display
      data_driven: false

  - type: text
    id: callback_title
    content: "Completing connection…"
    variant: headline_small
    style:
      typography: "Outfit/headline_small"
      color: "#1A1C16"
      alignment: center
      padding_top: spacing.lg
    a11y:
      role: heading
      level: 1
      label: "Completing connection"
    test_context:
      purpose: "Primary heading during code-for-token exchange; AIS context shows 'Completing connection…', payment context shows 'Finalising your payment…'"
      interaction_type: display
      data_driven: true

  - type: text
    id: callback_message
    content: "Securely finishing your authorisation with HSBC. This only takes a moment."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: text
      label: "Securely finishing your authorisation with HSBC. This only takes a moment."
    test_context:
      purpose: "Supporting copy describing the token exchange in progress"
      interaction_type: display
      data_driven: false

  - type: loading_indicator
    id: callback_spinner
    variant: circular_indeterminate
    style:
      color: "#4C662B"
      size: "32dp"
      alignment: center
      padding_top: spacing.lg
    a11y:
      role: progressbar
      label: "Completing connection"
    test_context:
      purpose: "Indeterminate spinner shown while the authorization code is exchanged for an access token"
      interaction_type: display
      data_driven: false

  - type: text
    id: callback_security_note
    content: "Verifying your authorisation · Encrypted connection"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#74796D"
      alignment: center
      padding_top: spacing.md
    a11y:
      role: text
      label: "Verifying your authorisation over an encrypted connection."
    test_context:
      purpose: "Reassurance caption beneath the spinner"
      interaction_type: display
      data_driven: false

  - type: card
    id: callback_error_card
    variant: filled
    style:
      background: "#FFDAD6"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
    visible_when: "uiState == Error"
    children:
      - callback_error_icon
      - callback_error_message

  - type: icon
    id: callback_error_icon
    content: "error"
    variant: default
    style:
      color: "#BA1A1A"
      size: "20dp"
    a11y:
      role: image
      label: "Error"
    test_context:
      purpose: "Error icon shown when the callback carries an error or the token exchange fails"
      interaction_type: display
      data_driven: false

  - type: text
    id: callback_error_message
    content: "We couldn't complete your authorisation with HSBC. You can try again."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#410002"
      padding_start: spacing.sm
    a11y:
      role: alert
      label: "Authorisation error message"
    test_context:
      purpose: "Error copy for declined consent, mismatched state, or a failed token exchange"
      interaction_type: display
      data_driven: true

  - type: button
    id: callback_retry_button
    label: "Try again"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
      width: "match_parent"
    visible_when: "uiState == Error"
    on_click:
      action: retry
      target: bank-authorize-handoff
    a11y:
      role: button
      label: "Retry the authorisation by restarting the secure redirect"
    keyboard:
      focusable: true
    test_context:
      purpose: "Restarts the authorise handoff to obtain a fresh code after a failed exchange"
      interaction_type: action
      data_driven: false

  - type: button
    id: callback_cancel_link
    label: "Cancel"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      typography: "Outfit/label_large"
      color: "#386663"
      alignment: center
      min_height: 44
      padding_vertical: spacing.sm
    on_click:
      action: navigate
      target: consent-declined
    a11y:
      role: button
      label: "Cancel and see why the connection could not be completed"
    keyboard:
      focusable: true
    test_context:
      purpose: "Dismisses the error and routes to the declined screen for the active flow"
      interaction_type: navigate
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: exchanging
  exchanging:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [callback_bank_icon, callback_title, callback_message, callback_spinner, callback_security_note]
    note: "Full-screen takeover. Deep-link org.mifos.openbanking://oauth/callback received with code + id_token + state. App verifies state against the stored CSRF value, then POSTs /oauth2/token (grant_type=authorization_code, mTLS, client-assertion, PKCE code_verifier) to obtain the PSU-bound access token. On success: AIS consent → poll consent AUTH → home; payment consent → submit payment + poll → payment-result."
  loading:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [callback_bank_icon, callback_title, callback_message, callback_spinner, callback_security_note]
    note: "Canonical loading alias — same composition as exchanging."
  error:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [callback_bank_icon, callback_title, callback_error_card, callback_retry_button, callback_cancel_link]
    note: "Callback carried an error param, state mismatch (CSRF), PSU declined, or the token exchange returned invalid_grant / 400. Offers retry (restart handoff) or cancel to the declined screen for the active flow."

state_model:
  AuthCallbackViewModel:
    screen_state: AuthCallbackUiState
    state:
      - field: phase
        type: "CallbackPhase"
        default: "CallbackPhase.EXCHANGING"
        note: "enum CallbackPhase { EXCHANGING, FINALISING, SUCCESS, ERROR } — drives the full-screen takeover. code / state / code_verifier are read from the deep-link + ObpAuthRepository, never held in UI state."
      - field: consentContext
        type: "ConsentContext"
        default: "ConsentContext.AIS"
        note: "enum ConsentContext { AIS, PAYMENT } — propagated from bank-authorize-handoff via OidcCallbackBus. AIS routes onward to home; PAYMENT routes to payment-result. Errors route to consent-declined (AIS) / payment-declined (PAYMENT)."
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isError
        type: Boolean
        default: "false"
    errors: [INVALID_GRANT, STATE_MISMATCH, CONSENT_DECLINED, REQUEST_TIMEOUT, TOO_MANY_REQUESTS, UNKNOWN]
    events:
      - "AuthCallbackEvent.NavigateToHome"
      - "AuthCallbackEvent.NavigateToPaymentResult(domesticPaymentId: String)"
      - AuthCallbackEvent.NavigateToConsentDeclined
      - AuthCallbackEvent.NavigateToPaymentDeclined
      - AuthCallbackEvent.RestartHandoff
    actions:
      - "AuthCallbackAction.DeepLinkReceived(code: String, state: String, error: String?)"
      - AuthCallbackAction.RetryClicked
      - AuthCallbackAction.CancelClicked
      - "AuthCallbackAction.Internal.TokenExchanged(accessToken: String)"
      - "AuthCallbackAction.Internal.ConsentAuthorised(consentId: String)"
      - "AuthCallbackAction.Internal.PaymentSubmitted(domesticPaymentId: String)"
      - "AuthCallbackAction.Internal.ExchangeFailed(error)"
    di: [ObpAuthRepository, OidcCallbackBus]
    base: "template.core.base.ui.viewmodel.BaseViewModel<AuthCallbackUiState, AuthCallbackEvent, AuthCallbackAction>"
    note: "OidcCallbackBus delivers the deep-link to this ViewModel. After TokenExchanged, the ViewModel branches on consentContext: AIS → poll consent AUTH then emit NavigateToHome; PAYMENT → submit the domestic-payment, poll terminal status, then emit NavigateToPaymentResult. Any error emits NavigateToConsentDeclined (AIS) or NavigateToPaymentDeclined (PAYMENT). The screen never shows credential entry — SCA already happened at HSBC."

navigation:
  - id: nav_to_home
    target: home
    trigger: ais_consent_authorised
    note: "AIS context only — after the access token is obtained and the account-access-consent reaches Status AUTH, route to home (replace). One-shot AuthCallbackEvent.NavigateToHome."
  - id: nav_to_payment_result
    target: payment-result
    trigger: payment_submitted
    note: "PAYMENT context only — after the access token is obtained, the domestic-payment is submitted and polled to a terminal status, then route to payment-result (replace). One-shot AuthCallbackEvent.NavigateToPaymentResult."
  - id: nav_to_consent_declined
    target: consent-declined
    trigger: ais_callback_error
    on_click:
      action: navigate
      target: consent-declined
    note: "AIS context error path — callback error / state mismatch / PSU declined / token exchange failed."
  - id: nav_to_payment_declined
    target: payment-declined
    trigger: payment_callback_error
    note: "PAYMENT context error path — callback error / PSU declined / consent RJCT / token exchange failed."

api:
  - id: obie_exchange_code
    endpoint: "POST https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/token"
    tag: Authentication
    trigger: on_deep_link_received
    description: "Exchange the authorization code from the deep-link for a PSU-bound access token (grant_type=authorization_code). Form-encoded (code, redirect_uri, code_verifier, client_assertion) over mTLS; returns the access token (+ refresh token) used for all resource calls. SHARED by AIS and payment flows — only the downstream routing differs."
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: grant_type
          type: String
          value: "authorization_code"
        - name: code
          type: String
          source: deep_link_code
        - name: redirect_uri
          type: String
          value: "org.mifos.openbanking://oauth/callback"
        - name: code_verifier
          type: String
          source: pkce_code_verifier
        - name: client_assertion_type
          type: String
          value: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
        - name: client_assertion
          type: String
          source: ps256_client_assertion_jwt
    response:
      fields:
        - name: access_token
          type: String
          stored_as: psu_access_token
        - name: refresh_token
          type: String
          stored_as: refresh_token
        - name: id_token
          type: String
          note: "JWT carrying PSU/consent binding + refresh_token_expires_at claim."
        - name: token_type
          type: String
          example: "Bearer"
        - name: expires_in
          type: Int
          example: 3600
    errors:
      - code: 400
        name: INVALID_GRANT
        ui_message: "We couldn't complete your authorisation with HSBC. You can try again."
      - code: 401
        name: INVALID_CLIENT
        ui_message: "Your authorisation could not be verified. Please try again."
      - code: 429
        name: TOO_MANY_REQUESTS
        ui_message: "Too many attempts. Please wait a moment and try again."

  - id: obie_poll_consent_status
    endpoint: "GET https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
    tag: Authentication
    trigger: after_token_exchange_ais
    description: "AIS context only — poll the account-access-consent until Status is AUTH (Authorised) before reading any account resource. Bearer = PSU access token."
    request:
      headers:
        Authorization: "Bearer {psu_access_token}"
        x-fapi-financial-id: "{hsbc_financial_id}"
    response:
      fields:
        - name: ConsentId
          type: String
        - name: Status
          type: String
          example: "Authorised"
    errors:
      - code: 400
        name: CONSENT_NOT_AUTHORISED
        ui_message: "We couldn't complete your authorisation with HSBC. You can try again."

  - id: obie_submit_domestic_payment
    endpoint: "POST https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/pisp/domestic-payments"
    tag: Authentication
    trigger: after_token_exchange_payment
    description: "PAYMENT context only — submit the authorised domestic-payment (ConsentId + Risk + Initiation block byte-matching the authorised consent). Bearer = PSU access token; signed with x-jws-signature + x-idempotency-key. Returns DomesticPaymentId, polled to a terminal status before routing to payment-result."
    request:
      headers:
        Authorization: "Bearer {psu_access_token}"
        x-jws-signature: "{detached_jws}"
        x-idempotency-key: "{idempotency_key}"
      content_type: "application/json"
    response:
      fields:
        - name: DomesticPaymentId
          type: String
          stored_as: domestic_payment_id
        - name: Status
          type: String
          example: "AcceptedSettlementInProcess"
    errors:
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "We couldn't submit your payment. Please try again."
      - code: 403
        name: CONSENT_REJECTED
        ui_message: "Your payment authorisation was declined. Please try again."

dependencies:
  tier: feature
  features: [shared-core, obp-auth, account-access-consent, payment-initiation]
