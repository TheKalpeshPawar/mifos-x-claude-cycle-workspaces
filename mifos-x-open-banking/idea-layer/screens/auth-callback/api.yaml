sibling: api
schema_version: "4.0"
feature_id: auth-callback
api:
  - id: obie_exchange_code
    endpoint: "POST https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/token"
    tag: Authentication
    trigger: on_deep_link_received
    description: "Exchange the authorization code from the deep-link (org.mifos.openbanking://oauth/callback) for a PSU-bound access token (grant_type=authorization_code). Form-encoded (code, redirect_uri, code_verifier, client_assertion) over mTLS; authenticated with a PS256 client-assertion JWT. Returns the access token (+ refresh token) used for all resource calls. SHARED by AIS account-access-consent and PISP payment-consent — only the downstream routing differs."
    auth_required: true
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: grant_type
          type: String
          value: "authorization_code"
        - name: code
          type: String
          source: deep_link_code
        - name: redirect_uri
          type: String
          value: "org.mifos.openbanking://oauth/callback"
        - name: code_verifier
          type: String
          source: pkce_code_verifier
        - name: client_assertion_type
          type: String
          value: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
        - name: client_assertion
          type: String
          source: ps256_client_assertion_jwt
    response:
      fields:
        - name: access_token
          type: String
          stored_as: psu_access_token
        - name: refresh_token
          type: String
          stored_as: refresh_token
        - name: id_token
          type: String
          note: "JWT carrying PSU/consent binding + refresh_token_expires_at claim."
        - name: token_type
          type: String
          example: "Bearer"
        - name: expires_in
          type: Int
          example: 3600
        - name: scope
          type: String
          example: "accounts"
          note: "AIS context → 'accounts'; PAYMENT context → 'payments'. Echoes the authorise scope."
    errors:
      - code: 400
        name: INVALID_GRANT
        ui_message: "We couldn't complete your authorisation with HSBC. You can try again."
      - code: 401
        name: INVALID_CLIENT
        ui_message: "Your authorisation could not be verified. Please try again."
      - code: 429
        name: TOO_MANY_REQUESTS
        ui_message: "Too many attempts. Please wait a moment and try again."
      - code: 500
        name: SERVER_ERROR
        ui_message: "Something went wrong on HSBC's end. Please try again in a moment."

  - id: obie_poll_consent_status
    endpoint: "GET https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
    tag: Authentication
    trigger: after_token_exchange_ais
    description: "AIS context only — poll the account-access-consent until Status is AUTH (Authorised) before reading any account resource. Bearer = PSU access token. On AUTH the callback routes to home."
    auth_required: true
    request:
      headers:
        Authorization: "Bearer {psu_access_token}"
        x-fapi-financial-id: "{hsbc_financial_id}"
    response:
      fields:
        - name: ConsentId
          type: String
        - name: Status
          type: String
          example: "Authorised"
    errors:
      - code: 400
        name: CONSENT_NOT_AUTHORISED
        ui_message: "We couldn't complete your authorisation with HSBC. You can try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "Your authorisation could not be verified. Please try again."

  - id: obie_submit_domestic_payment
    endpoint: "POST https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/pisp/domestic-payments"
    tag: Authentication
    trigger: after_token_exchange_payment
    description: "PAYMENT context only — submit the authorised domestic-payment (ConsentId + Risk + Initiation block byte-matching the authorised consent). Bearer = PSU access token; signed detached x-jws-signature + x-idempotency-key. Returns DomesticPaymentId, polled to a terminal status before routing to payment-result."
    auth_required: true
    request:
      headers:
        Authorization: "Bearer {psu_access_token}"
        x-jws-signature: "{detached_jws}"
        x-idempotency-key: "{idempotency_key}"
      content_type: "application/json"
    response:
      fields:
        - name: DomesticPaymentId
          type: String
          stored_as: domestic_payment_id
        - name: Status
          type: String
          example: "AcceptedSettlementInProcess"
    errors:
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "We couldn't submit your payment. Please try again."
      - code: 403
        name: CONSENT_REJECTED
        ui_message: "Your payment authorisation was declined. Please try again."
