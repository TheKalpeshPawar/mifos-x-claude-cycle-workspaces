<!doctype html>
<!-- render-hash: auth-callback-error -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Completing Connection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #4C662B;
  --on-primary: #FFFFFF;
  --primary-container: #CDEDA3;
  --on-primary-container: #102000;
  --secondary: #386663;
  --tertiary: #386663;
  --error: #BA1A1A;
  --on-error: #FFFFFF;
  --error-container: #FFDAD6;
  --on-error-container: #410002;
  --background: #F9FAEF;
  --on-background: #1A1C16;
  --surface: #FFFFFF;
  --on-surface: #1A1C16;
  --surface-variant: #E1E4D5;
  --on-surface-variant: #44483D;
  --surface-container: #F0F1E6;
  --outline: #75796C;
  --outline-variant: #C5C8BA;
  --scrim: #000000;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-body: 'Outfit', system-ui, sans-serif;
  --fs-headline-sm: 24px; --lh-headline-sm: 32px;
  --fs-body-md: 14px;     --lh-body-md: 20px;
  --fs-body-sm: 12px;     --lh-body-sm: 16px;
  --fs-label-lg: 14px;    --lh-label-lg: 20px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
  --radius-sm: 8px;
  --icon-hero: 80px; --icon-sm: 20px; --icon-md: 24px;
  --touch-min: 48px;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #B2D188;
    --on-primary: #1F3701;
    --primary-container: #354E16;
    --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB;
    --tertiary: #A0CFCB;
    --error: #FFB4AB;
    --on-error: #690005;
    --error-container: #93000A;
    --on-error-container: #FFDAD6;
    --background: #12140E;
    --on-background: #E3E3D8;
    --surface: #1E201A;
    --on-surface: #E3E3D8;
    --surface-variant: #44483D;
    --on-surface-variant: #C5C8BA;
    --surface-container: #1E201A;
    --outline: #8F9285;
    --outline-variant: #44483D;
    --scrim: #000000;
  }
}
:root[data-theme="dark"] {
  --primary: #B2D188;
  --on-primary: #1F3701;
  --primary-container: #354E16;
  --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB;
  --tertiary: #A0CFCB;
  --error: #FFB4AB;
  --on-error: #690005;
  --error-container: #93000A;
  --on-error-container: #FFDAD6;
  --background: #12140E;
  --on-background: #E3E3D8;
  --surface: #1E201A;
  --on-surface: #E3E3D8;
  --surface-variant: #44483D;
  --on-surface-variant: #C5C8BA;
  --surface-container: #1E201A;
  --outline: #8F9285;
  --outline-variant: #44483D;
  --scrim: #000000;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; }
body {
  font-family: var(--font-body); background: var(--background); color: var(--on-background);
  display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
  -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
}
[data-shell="root"] { display: flex; flex-direction: column; min-height: 100vh; }
[data-shell="content"] {
  flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: var(--sp-lg); background: var(--background); text-align: center;
}
.bank-icon .material-symbols-outlined { font-size: var(--icon-hero); color: var(--primary); }
.title {
  font-size: var(--fs-headline-sm); line-height: var(--lh-headline-sm);
  font-weight: var(--fw-semibold); color: var(--on-surface); padding-top: var(--sp-lg); max-width: 320px;
}
.error-card {
  display: flex; gap: var(--sp-sm); align-items: flex-start; text-align: left;
  background: var(--error-container); border-radius: var(--radius-sm);
  padding: var(--sp-md); margin-top: var(--sp-lg); width: 100%; max-width: 340px;
}
.error-card .material-symbols-outlined { font-size: var(--icon-sm); color: var(--error); flex-shrink: 0; }
.error-message {
  font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--on-error-container);
}
.btn-filled {
  appearance: none; border: none; background: var(--primary); color: var(--on-primary);
  font-family: var(--font-body); font-size: var(--fs-label-lg); line-height: var(--lh-label-lg);
  font-weight: var(--fw-medium); border-radius: var(--radius-sm); padding: var(--sp-md);
  min-height: var(--touch-min); width: 100%; max-width: 340px; margin-top: var(--sp-lg);
  cursor: pointer; transition: filter var(--easing-standard) 150ms;
}
.btn-filled:hover { filter: brightness(0.94); }
.btn-text {
  appearance: none; border: none; background: transparent; color: var(--tertiary);
  font-family: var(--font-body); font-size: var(--fs-label-lg); line-height: var(--lh-label-lg);
  font-weight: var(--fw-medium); padding: var(--sp-sm) var(--sp-md); min-height: 44px;
  cursor: pointer; margin-top: var(--sp-sm);
}
.btn-text:hover { text-decoration: underline; }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="auth-callback" data-state="error">
  <main data-shell="content" data-state="error">
    <div data-component-type="LayoutBox" data-component-id="callback_root" role="region" aria-label="Completing your secure connection with HSBC" style="display:flex;flex-direction:column;align-items:center;">

      <div class="bank-icon" data-component-type="Icon" data-component-id="callback_bank_icon">
        <span class="material-symbols-outlined" role="img" aria-label="Secure connection with HSBC">verified_user</span>
      </div>

      <h1 class="title" data-component-type="Text" data-component-id="callback_title">We couldn't connect your account</h1>

      <div class="error-card" data-component-type="Card" data-component-variant="filled" data-component-id="callback_error_card" role="alert" aria-label="Authorisation could not be completed">
        <span class="material-symbols-outlined" role="img" aria-label="Error" data-component-type="Icon" data-component-id="callback_error_icon">error</span>
        <p class="error-message" data-component-type="Text" data-component-id="callback_error_message">We couldn't complete your authorisation with HSBC. You can try again.</p>
      </div>

      <button class="btn-filled" data-component-type="Button" data-component-variant="filled" data-component-id="callback_retry_button" data-nav-to="authorise-handoff" data-action-id="RetryClicked" role="button" aria-label="Try again — restart the secure HSBC authorisation">Try again</button>

      <button class="btn-text" data-component-type="Button" data-component-variant="text" data-component-id="callback_cancel_link" data-nav-to="consent-declined" data-action-id="CancelClicked" role="button" aria-label="Cancel and see why the connection could not be completed">Cancel</button>

    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
