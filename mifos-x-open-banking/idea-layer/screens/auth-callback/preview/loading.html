<!doctype html>
<!-- render-hash: auth-callback-loading -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Completing Connection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #4C662B;
  --on-primary: #FFFFFF;
  --primary-container: #CDEDA3;
  --on-primary-container: #102000;
  --secondary: #386663;
  --tertiary: #386663;
  --error: #BA1A1A;
  --on-error: #FFFFFF;
  --error-container: #FFDAD6;
  --on-error-container: #410002;
  --background: #F9FAEF;
  --on-background: #1A1C16;
  --surface: #FFFFFF;
  --on-surface: #1A1C16;
  --surface-variant: #E1E4D5;
  --on-surface-variant: #44483D;
  --surface-container: #F0F1E6;
  --outline: #75796C;
  --outline-variant: #C5C8BA;
  --scrim: #000000;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-body: 'Outfit', system-ui, sans-serif;
  --fs-headline-sm: 24px; --lh-headline-sm: 32px;
  --fs-body-md: 14px;     --lh-body-md: 20px;
  --fs-body-sm: 12px;     --lh-body-sm: 16px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
  --radius-sm: 8px;
  --icon-hero: 80px;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #B2D188;
    --on-primary: #1F3701;
    --primary-container: #354E16;
    --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB;
    --tertiary: #A0CFCB;
    --error: #FFB4AB;
    --on-error: #690005;
    --error-container: #93000A;
    --on-error-container: #FFDAD6;
    --background: #12140E;
    --on-background: #E3E3D8;
    --surface: #1E201A;
    --on-surface: #E3E3D8;
    --surface-variant: #44483D;
    --on-surface-variant: #C5C8BA;
    --surface-container: #1E201A;
    --outline: #8F9285;
    --outline-variant: #44483D;
    --scrim: #000000;
  }
}
:root[data-theme="dark"] {
  --primary: #B2D188;
  --on-primary: #1F3701;
  --primary-container: #354E16;
  --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB;
  --tertiary: #A0CFCB;
  --error: #FFB4AB;
  --on-error: #690005;
  --error-container: #93000A;
  --on-error-container: #FFDAD6;
  --background: #12140E;
  --on-background: #E3E3D8;
  --surface: #1E201A;
  --on-surface: #E3E3D8;
  --surface-variant: #44483D;
  --on-surface-variant: #C5C8BA;
  --surface-container: #1E201A;
  --outline: #8F9285;
  --outline-variant: #44483D;
  --scrim: #000000;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; }
body {
  font-family: var(--font-body); background: var(--background); color: var(--on-background);
  display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
  -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
}
[data-shell="root"] { display: flex; flex-direction: column; min-height: 100vh; }
[data-shell="content"] {
  flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: var(--sp-lg); background: var(--background); text-align: center;
}
.bank-icon .material-symbols-outlined { font-size: var(--icon-hero); color: var(--primary); }
.title {
  font-size: var(--fs-headline-sm); line-height: var(--lh-headline-sm);
  font-weight: var(--fw-semibold); color: var(--on-surface); padding-top: var(--sp-lg); max-width: 320px;
}
.message {
  font-size: var(--fs-body-md); line-height: var(--lh-body-md);
  color: var(--on-surface-variant); padding-top: var(--sp-sm); max-width: 320px;
}
.spinner {
  width: 32px; height: 32px; border-radius: 50%;
  border: 3px solid var(--primary); border-top-color: transparent;
  animation: spin 800ms linear infinite; margin-top: var(--sp-lg);
}
@keyframes spin { to { transform: rotate(360deg); } }
.security-note {
  display: flex; align-items: center; gap: var(--sp-xs);
  font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--outline); padding-top: var(--sp-md);
}
.security-note .material-symbols-outlined { font-size: var(--fs-body-md); }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="auth-callback" data-state="loading">
  <main data-shell="content" data-state="loading">
    <div data-component-type="LayoutBox" data-component-id="callback_root" role="region" aria-label="Completing your secure connection with HSBC" style="display:flex;flex-direction:column;align-items:center;">

      <div class="bank-icon" data-component-type="Icon" data-component-id="callback_bank_icon">
        <span class="material-symbols-outlined" role="img" aria-label="Secure connection with HSBC">verified_user</span>
      </div>

      <h1 class="title" data-component-type="Text" data-component-id="callback_title">Finishing secure connection…</h1>

      <p class="message" data-component-type="Text" data-component-id="callback_message">Securely finishing your authorisation with HSBC. This only takes a moment.</p>

      <div class="spinner" data-component-type="LoadingIndicator" data-component-variant="circular_indeterminate" data-component-id="callback_spinner" role="progressbar" aria-label="Completing connection in progress"></div>

      <p class="security-note" data-component-type="Text" data-component-id="callback_security_note"><span class="material-symbols-outlined" aria-hidden="true">lock</span>Verifying your authorisation · Encrypted connection</p>

    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
