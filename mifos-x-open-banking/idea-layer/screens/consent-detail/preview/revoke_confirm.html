<!doctype html>
<!-- render-hash: 6e2b8c41a95d3f07b1ca2748d5e930f6c2a1b3e87d504f96a1c2e7d380b45619 -->
<!-- feature: consent-detail · state: revoke_confirm -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consent — revoke confirm</title><style>
:root{--p:#266489;--s:#F7F9FF;--o:#181C20;--ov:#41474D;--sc:#EBEEF3;--sch:#E5E8ED;--out:#C1C7CE;
--e:#BA1A1A;--r:12px;--rl:16px;--rf:9999px}
@media(prefers-color-scheme:dark){:root{--p:#95CDF7;--s:#101417;--o:#E0E3E8;--ov:#C1C7CE;--sc:#1C2024;
--sch:#262A2E;--out:#41474D;--e:#FFB4AB}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s);color:var(--o);font:16px/1.5 Roboto,sans-serif;display:flex;justify-content:center}
.d{width:393px;min-height:852px;display:flex;flex-direction:column;position:relative}
.sb{height:54px}.ab{height:56px;display:flex;align-items:center;padding:0 16px}.t{font-size:22px}
.dim{flex:1;opacity:.38;padding:12px;display:flex;flex-direction:column;gap:16px}
.c{background:var(--sc);border-radius:var(--r);padding:16px;height:120px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;padding:24px}
.dlg{width:100%;max-width:320px;background:var(--sch);border-radius:var(--rl);padding:24px;
display:flex;flex-direction:column;gap:16px}
.dt{font-size:24px;line-height:32px}
.db{font-size:14px;color:var(--ov)}
.ar{display:flex;justify-content:flex-end;gap:8px}
.btn{min-height:40px;padding:8px 12px;border-radius:var(--rf);font-size:14px;font-weight:500;cursor:pointer}
.cancel{color:var(--p)}.confirm{color:var(--e)}
.nb{height:80px;display:flex;background:var(--sc);border-top:1px solid var(--out);opacity:.38}
.tb{flex:1;display:grid;place-items:center;font-size:12px;color:var(--ov)}
.bt{height:34px;background:var(--sc)}</style></head>
<body><div class="d" data-screen="consent-detail" data-state="revoke_confirm">
<div class="sb"></div><div class="ab"><div class="t">Consent</div></div>
<div class="dim"><div class="c"></div><div class="c"></div></div>
<div class="nb"><div class="tb">Home</div><div class="tb">Accounts</div><div class="tb">Pay</div><div class="tb">More</div></div>
<div class="bt"></div>
<!--
  A GATE — no API call has been made. Satisfies the irreversible_action contract:
   1. distinct surface stating exactly what will be committed
   2. confirm NAMES the action ("Remove access", not "OK")
   3. SAME-WEIGHT escape adjacent — Cancel is the same size, type and emphasis
   4. confirming locks the UI (see revoking.html)
  Body names BOTH consequences and states the reversibility — the honest difference from a
  payment: consent revocation is destructive but REVERSIBLE. Do not cut that clause.
  No warning glyph: it would add alarm the copy already carries precisely.
-->
<div class="scrim">
  <div class="dlg">
    <div class="dt">Remove access?</div>
    <div class="db">This signs you out and stops this app seeing your HSBC account information.
      You can reconnect at any time.</div>
    <div class="ar">
      <div class="btn cancel" data-action="DismissRevokeConfirm" role="button" tabindex="0">Cancel</div>
      <div class="btn confirm" data-action="ConfirmRevoke" role="button" tabindex="0">Remove access</div></div>
  </div>
</div>
</div></body></html>
