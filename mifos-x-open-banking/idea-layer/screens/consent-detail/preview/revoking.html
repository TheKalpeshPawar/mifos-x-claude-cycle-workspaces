<!doctype html>

<!-- feature: consent-detail · state: revoking -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consent — revoking</title><style>
:root{--p:#266489;--s:#F7F9FF;--o:#181C20;--ov:#41474D;--sc:#EBEEF3;--out:#C1C7CE;--rf:9999px}
@media(prefers-color-scheme:dark){:root{--p:#95CDF7;--s:#101417;--o:#E0E3E8;--ov:#C1C7CE;--sc:#1C2024;--out:#41474D}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s);color:var(--o);font:16px/1.5 Roboto,sans-serif;display:flex;justify-content:center}
.d{width:393px;min-height:852px;display:flex;flex-direction:column}
.sb{height:54px}
/* back arrow DISABLED along with everything else */
.ab{height:56px;display:flex;align-items:center;padding:0 16px;opacity:.38;pointer-events:none}
.t{font-size:22px}
.b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.sp{width:48px;height:48px;border-radius:var(--rf);border:4px solid color-mix(in srgb,var(--p) 24%,transparent);
border-top-color:var(--p);animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
.cp{font-size:14px;color:var(--ov)}
/* bottom nav LOCKED too — a tab tap mid-revoke would strand the session between states */
.nb{height:80px;display:flex;background:var(--sc);border-top:1px solid var(--out);opacity:.38;pointer-events:none}
.tb{flex:1;display:grid;place-items:center;font-size:12px;color:var(--ov)}
.bt{height:34px;background:var(--sc)}</style></head>
<body><div class="d" data-screen="consent-detail" data-state="revoking">
<div class="sb"></div><div class="ab"><div class="t">Consent</div></div>
<div class="b"><div class="sp" role="progressbar" aria-label="Removing access"></div>
<div class="cp">Removing access…</div></div>
<!--
  AppLogout.logOut() runs THREE steps IN ORDER, and the order cannot be rearranged:
   1. best-effort revokeConsent(consentId()) wrapped in runCatching — an expired/revoked/
      404/network-failed consent still proceeds, so a PSU can sign out when the bank is
      unreachable
   2. consentSession.forgetAll() — THE ACTUAL LOGOUT. PSU tokens live in secure Settings via
      SettingsConsentSession, NOT the DataStore UserData, so clearUserData() alone could
      never sign anyone out
   3. userDataRepository.clearUserData() + storeCacheManager.clearAll()
  On completion the ViewModel raises ConsentDetailEvent.LoggedOut.
-->
<div class="nb"><div class="tb">Home</div><div class="tb">Accounts</div><div class="tb">Pay</div><div class="tb">More</div></div>
<div class="bt"></div></div></body></html>
