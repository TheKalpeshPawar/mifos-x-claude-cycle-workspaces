<html lang="en" data-theme="light" data-screen="consent-detail" data-state="revoking">
<head>

      --color-tertiary-container: #EADDFF;
      --color-on-tertiary-container: #4C4162;
      --color-error: #BA1A1A;
      --color-on-error: #FFFFFF;
      --color-error-container: #FFDAD6;
      --color-on-error-container: #93000A;
      --color-background: #F7F9FF;

      --radius-small: 8px;

    [data-theme="dark"] {

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      display: flex;
      justify-content: center;
    }
    .screen {
      width: 390px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-background);
    }
    .icon {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      text-transform: none;
      display: inline-flex;
      white-space: nowrap;
      user-select: none;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Top App Bar */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 4px;
      background: var(--color-surface-container);
    }
    .top-bar-back {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-on-surface);
      opacity: 0.38;
      flex-shrink: 0;
    }
    .top-bar-title {
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--color-on-surface);
      margin-left: 4px;
    }
    /* Main content: centered progress + label */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 16px;
    }
    .progress-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .circular-progress {
      width: 48px;
      height: 48px;
      border: 4px solid var(--color-surface-container-highest);
      border-top-color: var(--color-error);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .revoking-label {
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: var(--color-on-surface-variant);
      text-align: center;
    }
    .revoking-hint {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-on-surface-variant);
      text-align: center;
      opacity: 0.8;
      max-width: 280px;
    }
    /* Bottom nav */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 10;
      height: 80px;
      background: var(--color-surface-container-high);
      display: flex;
      align-items: flex-start;
      padding-top: 12px;
      border-top: 1px solid var(--color-outline-variant);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      padding: 0;
      opacity: 0.38;
    }
    .nav-item.active { opacity: 1; }
    .nav-indicator {
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-item.active .nav-indicator { background: var(--color-secondary-container); }
    .nav-item .icon { font-size: 24px; color: var(--color-on-surface-variant); }
    .nav-item.active .icon {
      color: var(--color-on-surface);
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .nav-label { font-size: 12px; font-weight: 500; line-height: 16px; color: var(--color-on-surface-variant); }
    .nav-item.active .nav-label { color: var(--color-on-surface); }
  </style>
</head>
<body>
<div class="screen">

  <!-- Top App Bar (back button disabled during revoking) -->
  <header class="top-app-bar" role="banner">
    <button class="top-bar-back" aria-label="Navigate back (disabled during revoke)" disabled>
      <span class="icon" aria-hidden="true">arrow_back</span>
    </button>
    <span class="top-bar-title">HSBC Connection</span>
  </header>

  <!-- Revoking state: labelled circular progress, no consent content -->
  <main class="content"
        role="main"
        aria-label="Revoking HSBC access, please wait"
        aria-busy="true">

    <div class="progress-wrapper"
         data-component-type="progress_indicator"
         data-component-id="revoke_progress"
         role="progressbar"
         aria-label="Revoking HSBC access, please wait"
         aria-valuemin="0"
         aria-valuemax="100">
      <div class="circular-progress" aria-hidden="true"></div>
      <p class="revoking-label">Revoking access…</p>
    </div>

    <p class="revoking-hint">
      Removing your HSBC connection. Please do not close the app.
    </p>

  </main>

  <!-- Bottom Navigation (disabled during revoking — no tab active) -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation" aria-disabled="true">
    <div class="nav-item" aria-hidden="true">
      <div class="nav-indicator">
        <span class="icon">home</span>

    <div class="nav-item" aria-hidden="true">

    <div class="nav-item" aria-hidden="true">

      </div>

    </div>
    <div class="nav-item" aria-hidden="true">
      <div class="nav-indicator">
        <span class="icon">more_horiz</span>
      </div>
      <span class="nav-label">More</span>
    </div>
  </nav>

</div>
