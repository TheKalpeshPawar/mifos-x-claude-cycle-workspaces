    body {

      justify-content: center;
    }
    .screen {

      flex-direction: column;
      background: var(--color-background);

      flex: 1;

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    /* Skeleton shimmer */
    .skeleton {
      background: linear-gradient(
        90deg,
        var(--color-surface-container) 25%,
        var(--color-surface-container-high) 50%,
        var(--color-surface-container) 75%

      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--radius-small);
    }
    .skel-card {
      border-radius: var(--radius-medium);
      padding: 16px;
      margin-bottom: 12px;
      background: var(--color-surface-container-low);
      box-shadow: 0 1px 2px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.12);
    }
    .skel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .skel-logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-small);
    }
    .skel-chip {
      width: 110px;
      height: 28px;
      border-radius: var(--radius-full);
    }
    .skel-line {
      height: 11px;
      border-radius: var(--radius-small);
    }
    .skel-section-title {
      height: 14px;
      width: 100px;
      margin: 16px 0 12px;
    }
    .skel-list-item {
      display: flex;
      align-items: flex-start;
      padding: 12px 0;
      gap: 16px;
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .skel-list-item:last-child { border-bottom: none; }
    .skel-icon {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }
    .skel-text-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skel-headline { height: 14px; width: 80%; }
    .skel-supporting { height: 11px; width: 55%; }
    .skel-btn {
      height: 40px;
      width: 100%;
      border-radius: var(--radius-full);
      margin-bottom: 8px;
    }
    /* Circular progress for the component */
    .progress-center {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 0;
    }
    .circular-progress {
      width: 48px;
      height: 48px;
      border: 4px solid var(--color-surface-container-highest);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    /* Bottom nav */
    .bottom-nav {

      bottom: 0;
      z-index: 10;

    }
    .nav-item {

      border: none;
      cursor: pointer;

    }
    .nav-indicator {
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-item.active .nav-indicator { background: var(--color-secondary-container); }
    .nav-item .icon { font-size: 24px; color: var(--color-on-surface-variant); }
    .nav-item.active .icon {

    .nav-label { font-size: 12px; font-weight: 500; line-height: 16px; color: var(--color-on-surface-variant); }
    .nav-item.active .nav-label { color: var(--color-on-surface); }
  </style>
