feature: consent-dashboard
flow_ref: consent-management

entry_points:
  - source: consent-list
    label: "Tap a consent card in the Connected Banks list"
    params: [consentId]

transitions:
  - from: consent-detail
    to: consent-list
    trigger: "Consent successfully revoked — back to list after clearing local token"
  - from: consent-detail
    to: login
    trigger: "Tap 'Reconfirm before expiry' — initiates a fresh consent staging flow"
