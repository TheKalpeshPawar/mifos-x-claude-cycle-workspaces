<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Account Detail — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
  <style>
    /* ── Design tokens: mifos-x-open-banking Trust Blue (light + dark) ───── */
    :root {
      --primary:              #266489;
      --on-primary:           #FFFFFF;
      --primary-container:    #C9E6FF;
      --secondary:            #50606E;
      --background:           #F7F9FF;
      --on-background:        #181C20;
      --surface:              #F7F9FF;
      --on-surface:           #181C20;
      --surface-variant:      #DDE3EA;
      --on-surface-variant:   #41474D;
      --surface-container:    #EBEEF3;
      --surface-container-high: #E5E8ED;
      --outline:              #72787E;
      --outline-variant:      #C1C7CE;
      --radius-full: 9999px;
      --screen-pad:  16px;
      --top-bar-h:   64px;
      --bottom-nav-h: 80px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary:              #95CDF7;
        --on-primary:           #00344E;
        --primary-container:    #004B6F;
        --secondary:            #B7C9D9;
        --background:           #101417;
        --on-background:        #E0E3E8;
        --surface:              #101417;
        --on-surface:           #E0E3E8;
        --surface-variant:      #41474D;
        --on-surface-variant:   #C1C7CE;
        --surface-container:    #1C2024;
        --surface-container-high: #262A2E;
        --outline:              #8B9198;
        --outline-variant:      #41474D;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--background);
      color: var(--on-surface);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
      display: inline-block;
    }

    /* ── Top App Bar ─────────────────────────────────────────────────── */
    .top-app-bar {
      height: var(--top-bar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--outline-variant);
      display: flex;
      align-items: center;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--on-surface);
      background: none;
      border: none;
      flex-shrink: 0;
      transition: background 150ms;
    }
    .icon-btn:hover  { background: rgba(24,28,32,0.08); }
    .icon-btn:active { background: rgba(24,28,32,0.12); }

    /* Title placeholder skeleton during load */
    .top-bar-title-skeleton {
      flex: 1;
      height: 20px;
      background: var(--surface-variant);
      border-radius: 4px;
      margin: 0 12px 0 8px;
      max-width: 160px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    /* ── Content area (loading = centered spinner) ──────────────────── */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--screen-pad);
      padding-bottom: calc(var(--bottom-nav-h) + 16px);
      gap: 16px;
    }

    /* ── M3 circular progress indicator ────────────────────────────── */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--surface-variant);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loading-label {
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      color: var(--on-surface-variant);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* Skeleton cards beneath spinner for structural context */
    .skeleton-cards {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 24px;
    }

    .skeleton-block {
      background: var(--surface-container);
      border-radius: 12px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    /* ── Bottom Navigation ─────────────────────────────────────────── */
    .bottom-nav {
      height: var(--bottom-nav-h);
      background: var(--surface-container);
      border-top: 1px solid var(--outline-variant);
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--on-surface-variant);
      padding: 8px 0 12px 0;
      text-decoration: none;
    }
    .nav-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    /* No active tab — pushed sub-screen */
    .nav-indicator {
      width: 64px;
      height: 32px;
      background: transparent;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- ═══ TOP APP BAR ════════════════════════════════════════════════════ -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn"
            type="button"
            aria-label="Navigate back to accounts list"
            data-component-id="back_button"
            data-component-type="icon_button"
            data-nav-to="accounts"
            data-nav-type="pop">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <!-- Skeleton title (account name not yet loaded) -->
    <div class="top-bar-title-skeleton" aria-hidden="true"></div>
  </header>

  <!-- ═══ CONTENT (loading state) ════════════════════════════════════════ -->
  <main class="content-area"
        role="main"
        aria-label="Loading account detail"
        aria-live="polite"
        aria-busy="true">

    <div class="spinner"
         data-component-type="progress_indicator"
         data-component-id="loading_spinner"
         data-component-variant="circular"
         role="progressbar"
         aria-label="Loading account detail"></div>

    <p class="loading-label">Loading account detail</p>

    <!-- Skeleton cards to hint layout while loading -->
    <div class="skeleton-cards" aria-hidden="true">
      <div class="skeleton-block" style="height:120px;"></div>
      <div class="skeleton-block" style="height:32px;width:60%;"></div>
      <div class="skeleton-block" style="height:160px;"></div>
    </div>

  </main>

  <!-- ═══ BOTTOM NAVIGATION — 4 tabs (Home · Accounts · Transactions · More) ═══
       Loading: no active tab (sub-screen, account not yet identified). -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">

    <span class="nav-item"
          role="link"
          tabindex="0"
          aria-label="Home"
          data-nav-to="home"
          data-nav-type="tab">
      <span class="nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </span>
      <span class="nav-label">Home</span>
    </span>

    <span class="nav-item"
          role="link"
          tabindex="0"
          aria-label="Accounts"
          data-nav-to="accounts"
          data-nav-type="tab">
      <span class="nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </span>
      <span class="nav-label">Accounts</span>
    </span>

    <span class="nav-item"
          role="link"
          tabindex="0"
          aria-label="Transactions"
          data-nav-to="transactions"
          data-nav-type="tab">
      <span class="nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
      </span>
      <span class="nav-label">Transactions</span>
    </span>

    <span class="nav-item"
          role="link"
          tabindex="0"
          aria-label="More"
          data-nav-to="settings"
          data-nav-type="tab">
      <span class="nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      </span>
      <span class="nav-label">More</span>
    </span>

  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>

</body>
</html>
