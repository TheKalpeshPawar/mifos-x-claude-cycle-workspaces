<!doctype html>
<!-- render-hash: account-detail-content-obie -->
<html lang="en" data-screen="account-detail" data-state="content" data-feature="account-detail" data-flavor="consumer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
  --font-display:'Outfit',system-ui,sans-serif;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-2xl:48px;
}
[data-theme="light"] {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
    --secondary:#A0CFCB;--on-secondary:#00201E;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
    --tertiary:#A0CFCB;--on-tertiary:#00201E;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
    --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
    --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
    --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
  }
}
[data-theme="dark"] {
  --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
  --secondary:#A0CFCB;--on-secondary:#00201E;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB;--on-tertiary:#00201E;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
  --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
  --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  display:flex; flex-direction:column; min-height:100vh;
  font-family:var(--font-display); background:var(--background); color:var(--on-background);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined { font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; }
.top-bar {
  display:flex; align-items:center; gap:var(--sp-sm);
  padding:var(--sp-md); background:var(--background); color:var(--on-background);
  position:sticky; top:0; z-index:10;
}
.top-bar .back-btn {
  display:flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:var(--radius-pill);
  background:transparent; border:none; color:var(--on-background); cursor:pointer;
}
.top-bar .back-btn .material-symbols-outlined { font-size:var(--icon-md); }
.top-bar .title { font-size:1.25rem; font-weight:600; }
.scroll-area { flex:1; overflow-y:auto; padding-bottom:var(--sp-md); }
.hero-card {
  background:var(--primary);
  background-image:linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
  color:var(--on-primary);
  border-radius:var(--radius-xl);
  margin:0 var(--sp-lg);
  padding:var(--sp-lg) var(--sp-lg) var(--sp-xl);
}
.hero-label { font-size:0.9rem; font-weight:500; opacity:0.88; padding-bottom:var(--sp-xs); }
.hero-balance { font-size:2.25rem; font-weight:700; padding-bottom:var(--sp-xs); }
.hero-sub { font-size:0.85rem; opacity:0.85; padding-bottom:var(--sp-md); }
.currency-badge {
  display:inline-flex; align-items:center;
  background:var(--surface-variant); color:var(--on-surface-variant);
  border-radius:var(--radius-sm); padding:var(--sp-xs) var(--sp-sm);
  font-size:0.75rem; font-weight:600; letter-spacing:0.5px;
}
.group-label {
  font-size:0.75rem; font-weight:600; letter-spacing:0.6px;
  color:var(--on-surface-variant); text-transform:uppercase;
  padding:var(--sp-lg) var(--sp-lg) var(--sp-sm);
}
.row-card {
  display:flex; align-items:center; gap:var(--sp-md);
  background:var(--surface-container); color:var(--on-surface);
  border:1px solid var(--outline-variant); border-radius:var(--radius-lg);
  padding:var(--sp-md) var(--sp-lg); margin:0 var(--sp-lg) var(--sp-sm);
  cursor:pointer; width:calc(100% - 2*var(--sp-lg));
  text-align:left; font-family:inherit;
}
.row-card:last-of-type { margin-bottom:var(--sp-md); }
.row-card .row-icon-lead {
  display:flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:var(--radius-md);
  background:var(--primary-container); color:var(--on-primary-container);
}
.row-card .row-icon-lead .material-symbols-outlined { font-size:var(--icon-md); }
.row-text { flex:1; display:flex; flex-direction:column; gap:2px; }
.row-title { font-size:1rem; font-weight:500; color:var(--on-surface); }
.row-sub { font-size:0.8rem; color:var(--on-surface-variant); }
.row-chevron { color:var(--on-surface-variant); }
.row-chevron .material-symbols-outlined { font-size:var(--icon-md); }
.info-card {
  background:var(--surface-container); color:var(--on-surface);
  border:1px solid var(--outline-variant); border-radius:var(--radius-lg);
  padding:var(--sp-lg); margin:0 var(--sp-lg) var(--sp-md);
}
.info-row { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-md); }
.info-col { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
.info-label { font-size:0.72rem; font-weight:500; color:var(--on-surface-variant); letter-spacing:0.4px; }
.info-value { font-size:0.95rem; color:var(--on-surface); word-break:break-word; }
.info-value.mono { font-family:'Outfit',monospace; letter-spacing:0.5px; }
.copy-btn {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:var(--radius-pill);
  background:transparent; border:none; color:var(--primary); cursor:pointer; flex-shrink:0;
}
.copy-btn .material-symbols-outlined { font-size:var(--icon-sm); }
.divider { height:1px; background:var(--outline-variant); margin:var(--sp-md) 0; border:none; }
.spacer { height:var(--sp-xl); }
.bottom-nav {
  display:flex; align-items:stretch; justify-content:space-around;
  background:var(--surface-container); border-top:1px solid var(--outline-variant);
  position:sticky; bottom:0; z-index:10; padding:var(--sp-sm) 0;
}
.nav-item {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  flex:1; background:transparent; border:none; cursor:pointer;
  color:var(--on-surface-variant); font-family:inherit; padding:var(--sp-xs) 0;
}
.nav-item .nav-pill {
  display:flex; align-items:center; justify-content:center;
  width:56px; height:30px; border-radius:var(--radius-pill); transition:background .15s;
}
.nav-item .material-symbols-outlined { font-size:var(--icon-md); }
.nav-item .nav-label { font-size:0.68rem; font-weight:500; }
.nav-item[data-active="true"] { color:var(--on-surface); }
.nav-item[data-active="true"] .nav-pill { background:var(--nav-active-indicator); }
.nav-item[data-active="true"] .nav-label { font-weight:600; }
</style>
</head>
<body data-component-type="screen" data-component-id="account_detail_screen">
  <header class="top-bar" data-component-type="app_bar" data-component-id="top_app_bar">
    <button class="back-btn" data-component-type="icon_button" data-component-id="back_button" data-nav-to="accounts" data-nav-type="pop" aria-label="Back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <span class="title" data-component-type="text" data-component-id="top_app_bar_title">Account Details</span>
  </header>

  <main class="scroll-area" data-component-type="scroll_container" data-component-id="account_detail_scroll">
    <section class="hero-card" data-component-type="box" data-component-id="account_header_card" role="region" aria-label="Account summary">
      <div class="hero-label" data-component-type="text" data-component-id="account_header_label">Everyday Current</div>
      <div class="hero-balance" data-component-type="text" data-component-id="account_header_balance">£2,483.17</div>
      <div class="hero-sub" data-component-type="text" data-component-id="account_header_booked">£2,611.92 booked balance</div>
      <span class="currency-badge" data-component-type="box" data-component-id="account_currency_badge">
        <span data-component-type="text" data-component-id="account_currency_label">GBP</span>
      </span>
    </section>

    <div class="group-label" data-component-type="text" data-component-id="activity_group_label" role="heading" aria-level="2">Activity</div>

    <button class="row-card" data-component-type="box" data-component-id="activity_transactions_row" data-nav-to="transactions" aria-label="Transaction history, booked and pending payments, tap to view">
      <span class="row-icon-lead" data-component-type="icon" data-component-id="activity_txn_icon"><span class="material-symbols-outlined">receipt_long</span></span>
      <span class="row-text" data-component-type="stack" data-component-id="activity_txn_text_col">
        <span class="row-title" data-component-type="text" data-component-id="activity_txn_title">Transaction history</span>
        <span class="row-sub" data-component-type="text" data-component-id="activity_txn_subtitle">Booked and pending payments</span>
      </span>
      <span class="row-chevron" data-component-type="icon" data-component-id="activity_txn_chevron" aria-hidden="true"><span class="material-symbols-outlined">chevron_right</span></span>
    </button>

    <button class="row-card" data-component-type="box" data-component-id="activity_direct_debits_row" data-nav-to="direct-debits" aria-label="Direct debits, mandates collecting from this account, tap to view">
      <span class="row-icon-lead" data-component-type="icon" data-component-id="activity_dd_icon"><span class="material-symbols-outlined">sync_alt</span></span>
      <span class="row-text" data-component-type="stack" data-component-id="activity_dd_text_col">
        <span class="row-title" data-component-type="text" data-component-id="activity_dd_title">Direct debits</span>
        <span class="row-sub" data-component-type="text" data-component-id="activity_dd_subtitle">Mandates collecting from this account</span>
      </span>
      <span class="row-chevron" data-component-type="icon" data-component-id="activity_dd_chevron" aria-hidden="true"><span class="material-symbols-outlined">chevron_right</span></span>
    </button>

    <div class="group-label" data-component-type="text" data-component-id="routing_group_label" role="heading" aria-level="2">Account &amp; Routing</div>

    <section class="info-card" data-component-type="box" data-component-id="account_info_card" role="region" aria-label="Account and routing information">
      <div class="info-row" data-component-type="stack" data-component-id="holder_row">
        <div class="info-col" data-component-type="stack" data-component-id="holder_col">
          <span class="info-label" data-component-type="text" data-component-id="holder_label">Account Holder</span>
          <span class="info-value" data-component-type="text" data-component-id="holder_value">James Whitfield</span>
        </div>
      </div>
      <hr class="divider" data-component-type="divider" data-component-id="info_divider_1" aria-hidden="true">
      <div class="info-row" data-component-type="stack" data-component-id="number_row">
        <div class="info-col" data-component-type="stack" data-component-id="number_label_col">
          <span class="info-label" data-component-type="text" data-component-id="number_label">Sort code &amp; Account Number</span>
          <span class="info-value mono" data-component-type="text" data-component-id="number_value">30-00-00 &middot; 12345678</span>
        </div>
        <button class="copy-btn" data-component-type="icon" data-component-id="copy_number_button" data-action="copy_account_number" aria-label="Copy account number to clipboard">
          <span class="material-symbols-outlined">content_copy</span>
        </button>
      </div>
      <hr class="divider" data-component-type="divider" data-component-id="info_divider_2" aria-hidden="true">
      <div class="info-row" data-component-type="stack" data-component-id="iban_row">
        <div class="info-col" data-component-type="stack" data-component-id="iban_label_col">
          <span class="info-label" data-component-type="text" data-component-id="iban_label">IBAN</span>
          <span class="info-value mono" data-component-type="text" data-component-id="iban_value">GB29 HBUK 3000 0012 3456 78</span>
        </div>
        <button class="copy-btn" data-component-type="icon" data-component-id="copy_iban_button" data-action="copy_iban" aria-label="Copy IBAN to clipboard">
          <span class="material-symbols-outlined">content_copy</span>
        </button>
      </div>
      <hr class="divider" data-component-type="divider" data-component-id="info_divider_3" aria-hidden="true">
      <div class="info-row" data-component-type="stack" data-component-id="bank_row">
        <div class="info-col" data-component-type="stack" data-component-id="bank_col">
          <span class="info-label" data-component-type="text" data-component-id="bank_label">Bank</span>
          <span class="info-value" data-component-type="text" data-component-id="bank_value">HSBC UK</span>
        </div>
      </div>
    </section>

    <div class="group-label" data-component-type="text" data-component-id="plan_group_label" role="heading" aria-level="2">Plan &amp; Fees</div>

    <section class="info-card" data-component-type="box" data-component-id="account_plan_card" role="region" aria-label="Plan and fees">
      <div class="info-row" data-component-type="stack" data-component-id="product_row">
        <div class="info-col" data-component-type="stack" data-component-id="product_col">
          <span class="info-label" data-component-type="text" data-component-id="product_label">Product</span>
          <span class="info-value" data-component-type="text" data-component-id="product_value">Current Account</span>
        </div>
      </div>
      <hr class="divider" data-component-type="divider" data-component-id="plan_divider_1" aria-hidden="true">
      <div class="info-row" data-component-type="stack" data-component-id="attribute_row_1">
        <div class="info-col" data-component-type="stack" data-component-id="attribute_1_col">
          <span class="info-label" data-component-type="text" data-component-id="attribute_1_label">Account Category</span>
          <span class="info-value" data-component-type="text" data-component-id="attribute_1_value">Personal</span>
        </div>
      </div>
    </section>

    <div class="spacer" data-component-type="spacer" data-component-id="bottom_spacer"></div>
  </main>

  <nav class="bottom-nav" data-component-type="bottom_nav" data-component-id="bottom_nav">
    <button class="nav-item" data-component-type="nav_item" data-component-id="nav_home" data-nav-to="home" aria-label="Home">
      <span class="nav-pill"><span class="material-symbols-outlined">home</span></span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" data-active="true" data-component-type="nav_item" data-component-id="nav_accounts" data-nav-to="accounts" aria-label="Accounts" aria-current="page">
      <span class="nav-pill"><span class="material-symbols-outlined">account_balance</span></span>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-item" data-component-type="nav_item" data-component-id="nav_pay" data-nav-to="send-money" aria-label="Pay">
      <span class="nav-pill"><span class="material-symbols-outlined">send</span></span>
      <span class="nav-label">Pay</span>
    </button>
    <button class="nav-item" data-component-type="nav_item" data-component-id="nav_insights" data-nav-to="pfm-dashboard" aria-label="Insights">
      <span class="nav-pill"><span class="material-symbols-outlined">insights</span></span>
      <span class="nav-label">Insights</span>
    </button>
    <button class="nav-item" data-component-type="nav_item" data-component-id="nav_more" data-nav-to="settings" aria-label="More">
      <span class="nav-pill"><span class="material-symbols-outlined">more_horiz</span></span>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
