<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s);color:var(--o);font:16px/1.5 Roboto,-apple-system,sans-serif;display:flex;justify-content:center}

.ch{display:flex;gap:8px;flex-wrap:wrap;padding:4px}

.nb{height:80px;display:flex;background:var(--sc);border-top:1px solid var(--out)}
