<!doctype html>
<html lang="en" data-screen="account-detail" data-state="error" data-feature="account-detail" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Detail — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 72px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    .top-bar .material-icons { color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .error-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; }
    .error-icon { width: 80px; height: 80px; border-radius: 40px; background: rgba(186,26,26,0.08); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .error-icon .material-icons { font-size: 40px; color: var(--error); }
    .error-title { font-size: 18px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; }
    .error-msg { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; margin-bottom: 24px; }
    .retry-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 12px 32px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 8px 0 12px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; padding: 4px 12px; border-radius: 16px; min-width: 56px; cursor: pointer; }
    .nav-item .material-icons { font-size: 24px; color: var(--on-surface-variant); }
    .nav-item .nav-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); }
    .nav-item.active .material-icons { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 700; }
    .nav-item.active { background: var(--primary-container); }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span>
      <h1>Account Details</h1>
    </div>
    <div class="error-content" data-component-type="box" data-component-id="error_state_card">
      <div class="error-icon"><span class="material-icons">error_outline</span></div>
      <h2 class="error-title">Could not load account</h2>
      <p class="error-msg">We were unable to retrieve account details. Please check your connection and try again.</p>
      <button class="retry-btn" data-action="retry_load" tabindex="0" aria-label="Retry">Retry</button>
    </div>
  </main>
  <nav data-shell="bottom-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-item" data-nav-to="home" aria-label="Home"><span class="material-icons">home</span><span class="nav-label">Home</span></a>
    <a class="nav-item active" data-nav-to="accounts" aria-label="Accounts" aria-current="page"><span class="material-icons">account_balance</span><span class="nav-label">Accounts</span></a>
    <a class="nav-item" data-nav-to="send-money" aria-label="Pay"><span class="material-icons">send</span><span class="nav-label">Pay</span></a>
    <a class="nav-item" data-nav-to="cards" aria-label="Cards"><span class="material-icons">credit_card</span><span class="nav-label">Cards</span></a>
    <a class="nav-item" data-nav-to="settings" aria-label="More"><span class="material-icons">more_horiz</span><span class="nav-label">More</span></a>
  </nav>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
