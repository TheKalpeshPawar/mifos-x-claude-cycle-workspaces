<!doctype html>

<html lang="en" data-screen="account-detail" data-state="error" data-feature="account-detail" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Details — Error — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --nav-active-indicator: #354E16;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-surface); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; padding-bottom: 80px; display: flex; flex-direction: column; }
    .top-app-bar { background: var(--primary-container); display: flex; align-items: center; padding: 12px 16px; gap: 12px; height: 56px; }
    .top-app-bar .back-btn { width: 40px; height: 40px; border-radius: 20px; background: transparent; color: var(--on-primary-container); display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; }
    .top-app-bar .title { font-size: 18px; font-weight: 500; color: var(--on-primary-container); }
    .error-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; }
    .error-illu { width: 96px; height: 96px; border-radius: 48px; background: var(--error-container); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .error-illu .material-symbols-outlined { font-size: 48px; color: var(--on-error-container); }
    .error-title { font-size: 20px; font-weight: 600; color: var(--on-surface); text-align: center; margin-bottom: 8px; }
    .error-message { font-size: 14px; font-weight: 400; color: var(--on-surface-variant); text-align: center; line-height: 1.5; max-width: 320px; margin-bottom: 24px; }
    .error-cta { background: var(--primary); color: var(--on-primary); border: 0; border-radius: 999px; padding: 12px 24px; font-family: var(--font-display); font-size: 14px; font-weight: 500; cursor: pointer; min-height: 48px; display: inline-flex; align-items: center; gap: 8px; }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; background: var(--surface-container); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: 8px 0 10px; height: 64px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 12px; border-radius: 16px; min-width: 56px; text-decoration: none; cursor: pointer; }
    .nav-item .material-symbols-outlined { font-size: 24px; color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
    .nav-item.active { background: var(--nav-active-indicator); }
  </style>
</head>
<body>
  <header class="top-app-bar" data-shell="top-app-bar">
    <button class="back-btn" type="button" data-action="navigate_back" data-component-type="icon" data-component-id="top_bar_back" aria-label="Go back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <span class="title">Account Details</span>
  </header>
  <main>
    <section class="error-wrap" data-component-type="box" data-component-id="error_state_card" role="alert" aria-labelledby="error-title">
      <div class="error-illu" data-component-type="box" data-component-id="error_illustration" aria-hidden="true">
        <span class="material-symbols-outlined">error_outline</span>
      </div>
      <h2 id="error-title" class="error-title" data-component-type="text" data-component-id="error_title">Could not load account</h2>
      <p class="error-message" data-component-type="text" data-component-id="error_message">We were unable to retrieve account details. Please check your connection and try again.</p>
      <button class="error-cta" type="button" data-action="retry_load" data-component-type="button" data-component-id="error_cta" aria-label="Retry loading">
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
        Retry
      </button>
    </section>
  </main>
  <nav data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item" data-nav-to="home" data-component-type="nav-item" data-component-id="nav_home" aria-label="Home"><span class="material-symbols-outlined" aria-hidden="true">home</span><span class="nav-label">Home</span></a>
    <a class="nav-item active" data-nav-to="accounts" data-component-type="nav-item" data-component-id="nav_accounts" aria-current="page" aria-label="Accounts"><span class="material-symbols-outlined" aria-hidden="true">account_balance</span><span class="nav-label">Accounts</span></a>
    <a class="nav-item" data-nav-to="send-money" data-component-type="nav-item" data-component-id="nav_pay" aria-label="Pay"><span class="material-symbols-outlined" aria-hidden="true">send</span><span class="nav-label">Pay</span></a>
    <a class="nav-item" data-nav-to="cards" data-component-type="nav-item" data-component-id="nav_cards" aria-label="Cards"><span class="material-symbols-outlined" aria-hidden="true">credit_card</span><span class="nav-label">Cards</span></a>
    <a class="nav-item" data-nav-to="settings" data-component-type="nav-item" data-component-id="nav_more" aria-label="More"><span class="material-symbols-outlined" aria-hidden="true">more_horiz</span><span class="nav-label">More</span></a>
  </nav>
  <script src="../../../preview/_shared/preview-runtime.js"></script>

</html>
