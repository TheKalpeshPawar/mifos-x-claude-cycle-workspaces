contracts: []
libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
vm_actions:
  - name: LoadAccountDetail
    signature: 'suspend fun loadAccountDetail(accountId: String)'
    state_mutations:
      - uiState = AccountDetailUiState.Loading
      - uiState = AccountDetailUiState.Content(account, balances) when balances.isNotEmpty()
      - uiState = AccountDetailUiState.Empty(account) when balances.isEmpty()
      - uiState = AccountDetailUiState.Error(code, message, recoverable) on failure
    side_effects:
      - 'Parallel coroutines: GET /accounts/{accountId} and GET /accounts/{accountId}/balances via ktorfit'
      - Error typed by HTTP status from HttpResponseException.response.status
    error_handling:
      on_401: emit TokenExpiredError(recoverable=true); surface error state
      on_403: emit ConsentWithdrawnError(recoverable=false); surface error state
      on_404: emit AccountNotFoundError(recoverable=false); surface error state
      on_network: emit NetworkError(recoverable=true); surface error state
      on_default: emit UnexpectedError(recoverable=true); surface error state
  - name: RetryLoad
    signature: fun retryLoad()
    state_mutations:
      - delegates to LoadAccountDetail with current accountId
    side_effects: []
    error_handling: {}
    guard: Only exposed to UI when current error state has recoverable=true
  - name: NavigateBack
    signature: fun navigateBack()
    state_mutations: []
    side_effects:
      - Pop nav stack to accounts screen
    error_handling: {}
  - name: NavigateTransactions
    signature: 'fun navigateTransactions(accountId: String)'
    state_mutations: []
    side_effects:
      - Push transactions route with accountId param
    error_handling: {}
  - name: NavigateStatements
    signature: 'fun navigateStatements(accountId: String)'
    state_mutations: []
    side_effects:
      - Push statements route with accountId param
    error_handling: {}
  - name: NavigateStandingOrders
    signature: 'fun navigateStandingOrders(accountId: String)'
    state_mutations: []
    side_effects:
      - Push standing-orders route with accountId param
    error_handling: {}
  - name: NavigateDirectDebits
    signature: 'fun navigateDirectDebits(accountId: String)'
    state_mutations: []
    side_effects:
      - Push direct-debits route with accountId param
    error_handling: {}
  - name: NavigateScheduledPayments
    signature: 'fun navigateScheduledPayments(accountId: String)'
    state_mutations: []
    side_effects:
      - Push scheduled-payments route with accountId param
    error_handling: {}
  - name: NavigateBeneficiaries
    signature: 'fun navigateBeneficiaries(accountId: String)'
    state_mutations: []
    side_effects:
      - Push beneficiaries route with accountId param
    error_handling: {}
  - name: NavigateAtmLocator
    signature: 'onNavigateToChip(AccountDetailChip.AtmLocator, accountId)'
    state_mutations: []
    side_effects:
      - "navigate(AtmLocatorRoute) — an arg-less PLACEHOLDER route in cmp-navigation that renders PlaceholderScreen. accountId is dropped; no feature module exists."
    error_handling: {}
  - name: NavigateProduct
    signature: 'fun navigateProduct(accountId: String)'
    state_mutations: []
    side_effects:
      - Push product route with accountId param; triggers GET /accounts/{accountId}/product on product screen mount
    error_handling: {}
  - name: NavigateParty
    signature: 'fun navigateParty(accountId: String)'
    state_mutations: []
    side_effects:
      - Push party route with accountId param; triggers GET /accounts/{accountId}/party on party screen mount
    error_handling: {}
error_cases:
  - id: TokenExpiredError
    http_status: 401
    user_message: Session expired. Please log in again.
    recoverable: true
    recovery_action: retry_load
  - id: ConsentWithdrawnError
    http_status: 403
    user_message: Access to this account has been withdrawn.
    recoverable: false
    recovery_action: navigate_back
  - id: AccountNotFoundError
    http_status: 404
    user_message: Account not found in your authorised account set.
    recoverable: false
    recovery_action: navigate_back
  - id: NetworkError
    http_status: null
    user_message: No network connection. Please check your connection and retry.
    recoverable: true
    recovery_action: retry_load
  - id: UnexpectedError
    http_status: null
    user_message: Something went wrong. Please try again.
    recoverable: true
    recovery_action: retry_load
