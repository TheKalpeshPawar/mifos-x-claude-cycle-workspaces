feature: accounts
flow_ref: account-browsing

entry_points:
  - source: accounts
    label: "Tap account card"
    params: [accountId]

transitions:
  - from: account-detail
    to: accounts
    trigger: "Back button"
  - from: account-detail
    to: transactions
    trigger: "Tap Transactions chip"
    params: [accountId]
  - from: account-detail
    to: statements
    trigger: "Tap Statements chip"
    params: [accountId]
  - from: account-detail
    to: standing-orders
    trigger: "Tap Standing Orders chip"
    params: [accountId]
  - from: account-detail
    to: direct-debits
    trigger: "Tap Direct Debits chip"
    params: [accountId]
  - from: account-detail
    to: scheduled-payments
    trigger: "Tap Scheduled chip"
    params: [accountId]
  - from: account-detail
    to: beneficiaries
    trigger: "Tap Beneficiaries chip"
    params: [accountId]
  - from: account-detail
    to: atm-locator
    trigger: "Tap Nearby ATMs chip"
    params: [accountId]

internal_states:
  - id: loading
    description: "Both API calls in flight."
  - id: content
    description: "Account + balances loaded; balances array non-empty."
  - id: empty
    description: "Account loaded; balances array empty (e.g. Global Wallet sub-account)."
  - id: error
    description: "At least one API call failed; typed by HTTP status code."
