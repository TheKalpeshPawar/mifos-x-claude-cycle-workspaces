sibling: api
schema_version: "4.0"
feature_id: account-detail
consent_dependency: >
  All reads require an authorised account-access-consent (Permissions incl. ReadAccountsDetail,
  ReadBalances; ReadTransactionsDetail for the deferred transactions read) and an
  authorization-code (account-scoped) token. AccountId comes from the prior get_accounts call.
api:
  - id: get_account_details
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}"
    tag: Accounts
    auth: OAuth2-FAPI
    note: "OBIE AISP get_account_details (OBReadAccount6). Single AccountId — supplies identity, scheme/identification (number/IBAN), nickname, account type, servicer. Replaces the OBP owner/account read. CE HSBCnet + Malta on v3.1 (+/ce)."
    params:
      - name: AccountId
        type: path
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Status
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].SchemeName
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
        - name: Data.Account[].Servicer.Identification
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid (incl. non-existent AccountId)"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

  - id: get_account_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: Accounts
    auth: OAuth2-FAPI
    note: "OBIE AISP get_account_balances (OBReadBalance1) — balances for THIS AccountId; pick the InterimAvailable/ClosingBooked Type for the hero amount. Requires ReadBalances. Replaces the balance block the OBP owner/account read carried inline."
    params:
      - name: AccountId
        type: path
    response:
      fields:
        - name: Data.Balance[].AccountId
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Type
          type: String
        - name: Data.Balance[].DateTime
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus (e.g. missing ReadBalances)"

  - id: resolve_account_holder
    resolution: account_holder_name
    via: get_account_parties (GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/parties)
    note: "VM-side resolution of the real holder legal name from OBIE Data.Party[].Name/.FullLegalName (requires ReadParty). Falls back to Data.Account[].Account[].Name. Never an obfuscated login username (counterparty rule)."

deferred_apis:
  - id: get_account_transactions
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    reason: "Recent-transactions list removed from shipped account-detail; transaction history reached via the ACTIVITY 'Transaction history' row navigating to the transactions screen (OBIE OBReadTransaction6, requires ReadTransactionsDetail)."
