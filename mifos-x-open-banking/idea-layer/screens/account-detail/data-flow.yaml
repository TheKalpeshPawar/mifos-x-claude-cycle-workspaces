sibling: data-flow
schema_version: "4.0"
feature_id: account-detail
entries:
  - screen_id: account-detail
    trigger: on_mount
    endpoints:
      - get_account_details
      - get_account_balances
    direction: read
    dtos:
      - name: OBReadAccount6
        role: response
        api_id: get_account_details
      - name: OBReadBalance1
        role: response
        api_id: get_account_balances
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 400
        behavior: error_state

  - screen_id: account-detail
    trigger: on_interact
    event: RetryLoad
    endpoints:
      - get_account_details
      - get_account_balances
    direction: read
    dtos:
      - name: OBReadAccount6
        role: response
        api_id: get_account_details
      - name: OBReadBalance1
        role: response
        api_id: get_account_balances
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 400
        behavior: error_state

  - screen_id: account-detail
    trigger: on_interact
    event: CopyIban
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Clipboard write; no network call"

  - screen_id: account-detail
    trigger: on_interact
    event: CopyBic
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Clipboard write; no network call"

  - screen_id: account-detail
    trigger: on_interact
    event: NavigateToSendMoney
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to send-money; no network call"

  - screen_id: account-detail
    trigger: on_interact
    event: NavigateToTransactions
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to transactions; no network call"
