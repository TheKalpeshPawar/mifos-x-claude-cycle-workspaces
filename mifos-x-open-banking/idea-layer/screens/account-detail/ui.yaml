type: account_detail
title: "Account Details"
flavor: consumer
components:
  - type: account_header
    id: account_header
    show_balance: true
    show_iban: true
  - type: button
    id: view_transactions_button
    label: "View Transactions"
    variant: outlined
    on_click:
      target: transactions
  - type: button
    id: download_statement_button
    label: "Download Statement"
    variant: outlined
  - type: section
    id: account_info_section
    title: "Account Information"
  - type: account_details_card
    id: account_details
states:
  - loading
  - content
navigation:
  - target: transactions
    label: "transactions"
