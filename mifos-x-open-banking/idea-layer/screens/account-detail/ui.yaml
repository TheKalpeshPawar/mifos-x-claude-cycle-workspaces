id: account-detail
name: Account Detail
feature: account-detail
flavor: consumer
status: enriched
quality_score: 81

shell:
  bottom_nav: true
  top_app_bar:
    show: true
    title: "Account Details"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  nav_items:
    - id: nav_home
      label: Home
      icon: home
      target: home
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
      active: true
    - id: nav_pay
      label: Pay
      icon: send
      target: send-money
    - id: nav_cards
      label: Cards
      icon: credit_card
      target: cards
    - id: nav_more
      label: More
      icon: more_horiz
      target: more

screens:
  - id: account_detail_content
    label: Account Detail
    route: /accounts/{accountId}
    scroll: vertical

components:
  - type: box
    id: account_header_card
    style:
      background: "#1800B1"
      border_radius: 0
      padding_horizontal: 24
      padding_top: 20
      padding_bottom: 32
    a11y:
      role: region
      label: "Account summary"
    test_context:
      tag: account_header_card
      assert_visible: true
    children:
      - type: text
        id: account_header_label
        content: "Primary Checking"
        style:
          typography: label_large
          color: "#FFFFFFB3"
          padding_bottom: 4
        a11y:
          role: text
          label: "Account: Primary Checking"
        test_context:
          tag: account_header_label
          assert_content: "Primary Checking"

      - type: text
        id: account_header_balance
        content: "£4,250.00"
        style:
          typography: display_large
          color: "#FFFFFF"
          font_weight: 700
          padding_bottom: 4
        a11y:
          role: text
          label: "Balance: four thousand two hundred fifty pounds"
        test_context:
          tag: account_header_balance
          assert_content: "£4,250.00"

      - type: stack
        id: account_header_meta
        style:
          direction: horizontal
          align: center
          spacing: 8
        children:
          - type: box
            id: account_currency_badge
            style:
              background: "#FFFFFF1A"
              border_radius: 6
              padding_horizontal: 8
              padding_vertical: 4
            children:
              - type: text
                id: account_currency_label
                content: "GBP"
                style:
                  typography: label_small
                  color: "#FFFFFF"
                a11y:
                  role: text
                  label: "Currency: British Pounds"
                test_context:
                  tag: account_currency_label

          - type: box
            id: account_type_badge
            style:
              background: "#FFFFFF1A"
              border_radius: 6
              padding_horizontal: 8
              padding_vertical: 4
            children:
              - type: text
                id: account_type_label
                content: "CHECKING"
                style:
                  typography: label_small
                  color: "#FFFFFF"
                a11y:
                  role: text
                  label: "Account type: Checking"
                test_context:
                  tag: account_type_label

  - type: box
    id: account_info_card
    style:
      background: "#FFFFFF"
      border_radius: 16
      padding: 20
      margin_horizontal: 20
      margin_top: -16
      margin_bottom: 16
      elevation: 3
    a11y:
      role: region
      label: "Account routing information"
    test_context:
      tag: account_info_card
    children:
      - type: stack
        id: iban_row
        style:
