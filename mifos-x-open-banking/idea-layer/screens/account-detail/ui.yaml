state_model:
  view_model: AccountDetailViewModel
  screen_state: "ScreenState<AccountDetailContent>"
  state_wrapper: ScreenState
  state_wrapper_states: [Loading, Content, Error, NoNetwork, Unauthenticated, Empty]
  content_class: AccountDetailContent
  content_fields:
    - name: accountLabel
      type: String
    - name: balanceDisplay
      type: String
      note: "formatted, sign-preserving money string from Data.Balance[].Amount.Amount (String) signed by .CreditDebitIndicator; Type=InterimAvailable/ClosingBooked picked"
    - name: currency
      type: String
      note: "Data.Balance[].Amount.Currency (else Data.Account[].Currency)"
    - name: holder
      type: String
      note: "resolved account-holder name from get_account_parties Data.Party[].Name/.FullLegalName, Data.Account[].Account[].Name fallback; never an obfuscated login username"
    - name: accountNumber
      type: String
      note: "Data.Account[].Account[].Identification where SchemeName=UK.OBIE.SortCodeAccountNumber"
    - name: ibanRaw
      type: String
      note: "un-spaced IBAN from Data.Account[].Account[].Identification where SchemeName=UK.OBIE.IBAN; the value copied to clipboard"
    - name: ibanDisplay
      type: String
      note: "IBAN grouped into 4-char blocks for display"
    - name: bankName
      type: String
      note: "servicing institution from Data.Account[].Servicer.Identification (sort code / BIC); no separate banks read"
    - name: productLabel
      type: String
      note: "humanized Data.Account[].AccountTypeCode / Nickname"
    - name: "attributes"
      type: "List<AttributeRow>"
      note: "plan/fee rows; OBIE account detail carries no account_attributes equivalent — populated only if a get_account_product (ReadProducts) read is wired, else empty"
    - name: hasPlanSection
      type: Boolean
      computed: true
      note: "productLabel.isNotBlank() || attributes.isNotEmpty() — gates the PLAN & FEES card"
  nested_classes:
    - name: AttributeRow
      fields:
        - name: label
          type: String
        - name: value
          type: String
  dto: org.mifosx.openbanking.core.model.obie.OBReadAccount6
  data_source:
    pattern: suspend-load
    note: "load(accountId) calls accountsRepository.accountDetails(accountId) (get_account_details) and accountsRepository.balances(accountId) (get_account_balances), then resolves holder via get_account_parties. All reads need an authorised account-access-consent + authorization-code token. No transactions are loaded. Projects only fields OBIE returns."
  events:
    - "load(accountId: String)"
    - onRetry
    - "onCopy(value: String, what: String)"
    - onViewTransactions
    - onViewDirectDebits
  nav_callbacks:
    - "onBack()"
    - "onViewTransactions()"
    - "onViewDirectDebits()"
  side_effects:
    - "copy-to-clipboard via LocalClipboardManager, confirmed with a transient snackbar (\"<what> copied\"); no persisted ibanCopied/bicCopied flags"
  di:
    - AccountsRepository

api:
  - id: get_account_details
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}"
    tag: Accounts
    auth: OAuth2-FAPI
    note: "OBIE AISP get_account_details (OBReadAccount6). Supplies identity, scheme/Identification (account number / IBAN via SchemeName), nickname, account type, servicer. Requires an authorised account-access-consent (ReadAccountsDetail) + authorization-code token; AccountId from the prior get_accounts call. Replaces the OBP owner/account read."
    params:
      - name: AccountId
        type: path
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Status
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].SchemeName
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
        - name: Data.Account[].Servicer.Identification
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid (incl. non-existent AccountId)"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

  - id: get_account_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: Accounts
    auth: OAuth2-FAPI
    note: "OBIE AISP get_account_balances (OBReadBalance1) — balances for THIS AccountId; the hero amount is the InterimAvailable/ClosingBooked Type. Requires ReadBalances. Replaces the inline balance block the OBP owner/account read returned."
    params:
      - name: AccountId
        type: path
    response:
      fields:
        - name: Data.Balance[].Type
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus (e.g. missing ReadBalances)"

  - resolution: account_holder_name
    via: get_account_parties (GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/parties)
    note: "Resolves the real holder legal name from OBIE Data.Party[].Name/.FullLegalName (requires ReadParty); falls back to Data.Account[].Account[].Name. Never renders an obfuscated login username. VM-side resolution call."

deferred_apis:
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    reason: "Recent-transactions list was removed from the shipped screen; account-detail no longer loads transactions. Transaction history is reached via the ACTIVITY 'Transaction history' row navigating to the transactions screen (OBIE OBReadTransaction6, requires ReadTransactionsDetail)."

dependencies:
  tier: feature
  features:
    - transactions
    - direct-debits
    - accounts
