states:
  loading:
    layout:
      components_visible: []
      skeleton:
        - id: skeleton_header
          type: box
          style:
            background: "#1800B1"
            height: 160
        - id: skeleton_info_card
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 16
            height: 120
            margin_horizontal: 20
            margin_top: -16
        - id: skeleton_actions
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 12
            height: 52
            margin_horizontal: 20
            margin_top: 16
        - id: skeleton_txn
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 12
            height: 64
            margin_horizontal: 20
            margin_top: 16

  content:
    layout:
      components_visible:
        - account_header_card
        - account_info_card
        - action_row
        - section_divider
        - transactions_header_row
        - detail_txn_row_1
        - detail_txn_row_2
        - detail_txn_row_3
        - detail_txn_row_4
        - detail_txn_row_5

  error:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Could not load account"
        message: "We were unable to retrieve account details. Please check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

state_model:
  view_model: AccountDetailViewModel
  screen_state: AccountDetailScreenState
  state_fields:
    - name: isLoading
      type: Boolean
      default: "true"
    - name: account
      type: "BankAccount?"
      default: "null"
    - name: recentTransactions
      type: "List<TransactionSummary>"
      default: "emptyList()"
    - name: error
      type: "UiError?"
      default: "null"
    - name: ibanCopied
      type: Boolean
      default: "false"
    - name: bicCopied
      type: Boolean
      default: "false"
    - name: isDownloadingStatement
      type: Boolean
      default: "false"
  errors:
    - id: network_error
      message: "Network unavailable. Please check your connection."
    - id: not_found
      message: "Account no longer available."
    - id: statement_download_failed
      message: "Statement download failed. Please try again."
  events:
    - RetryLoad
    - CopyIban
    - CopyBic
    - RequestPayment
    - DownloadStatement
    - NavigateToSendMoney
    - NavigateToTransactions
  actions:
    - name: loadAccountDetail
      param: accountId
      triggers: [ScreenOpened, RetryLoad]
    - name: copyToClipboard
      param: text
    - name: downloadStatement
    - name: navigateTo
      param: screen_id
  di:
    - AccountsRepository
    - TransactionsRepository
    - ClipboardManager
    - StatementDownloader

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/accounts/{accountId}/owner/account"
    tag: Accounts
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
      - name: accountId
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
          children:
            - name: scheme
              type: String
            - name: address
              type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

  - endpoint: "GET /obp/v5.1.0/my/banks/{bankId}/accounts/{accountId}/transactions"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: accountId
        type: path
      - name: limit
        type: query
        value: "5"
      - name: sort_direction
        type: query
        value: "DESC"
    response:
      fields:
        - name: id
          type: String
        - name: details
          type: object
          children:
            - name: type
              type: String
            - name: description
              type: String
            - name: posted
              type: String
            - name: value
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
        - name: other_account
          type: object
          children:
            - name: holder
              type: object
            - name: metadata
              type: object
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

dependencies:
  tier: feature
  features:
    - send-money
    - transactions
    - accounts
