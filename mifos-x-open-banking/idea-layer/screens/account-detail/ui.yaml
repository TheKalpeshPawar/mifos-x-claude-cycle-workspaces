              assert_clickable: true

  - type: stack
    id: action_row
    style:
      direction: horizontal
      spacing: 10
      padding_horizontal: 20
      padding_bottom: 24
    a11y:
      role: group
      label: "Account actions"
    test_context:
      tag: action_row
    children:
      - type: button
        id: btn_send_money
        label: "Send Money"
        style:
          variant: tonal
          background: "#E8E4FF"
          text_color: "#1800B1"
          border_radius: 12
          padding_horizontal: 12
          padding_vertical: 12
          typography: label_medium
          flex: 1
          icon: send
        on_click:
          action: navigate
          target: send-money
        a11y:
          role: button
          label: "Send money from this account"
          hint: "Opens the send money screen"
        test_context:
          tag: btn_send_money
          assert_clickable: true

      - type: button
        id: btn_request_payment
        label: "Request"
        style:
          variant: outlined
          border_color: "#1800B1"
          text_color: "#1800B1"
          border_radius: 12
          padding_horizontal: 12
          padding_vertical: 12
          typography: label_medium
          flex: 1
          icon: request_quote
        on_click:
          action: request_payment
        a11y:
          role: button
          label: "Request a payment"
          hint: "Generates a payment request link"
        test_context:
          tag: btn_request_payment
          assert_clickable: true

      - type: button
        id: btn_download_statement
        label: "Statement"
        style:
          variant: outlined
          border_color: "#1800B1"
          text_color: "#1800B1"
          border_radius: 12
          padding_horizontal: 12
          padding_vertical: 12
          typography: label_medium
          flex: 1
          icon: download
        on_click:
          action: download_statement
        a11y:
          role: button
          label: "Download account statement"
          hint: "Downloads PDF statement for this account"
        test_context:
          tag: btn_download_statement
          assert_clickable: true

  - type: divider
    id: section_divider
    style:
      margin_horizontal: 20
      color: "#E0E0E0"
    a11y:
      role: separator
    test_context:
      tag: section_divider

  - type: stack
    id: transactions_header_row
    style:
      direction: horizontal
      align: center
