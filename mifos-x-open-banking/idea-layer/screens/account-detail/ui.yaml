responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout:
      components_visible: []
      loading_indicator:
        id: loading_spinner
        type: loading_indicator
        style:
          align: center
          color: "#4C662B"

  content:
    layout:
      components_visible:
        - account_header_card
        - activity_group_label
        - activity_transactions_row
        - activity_direct_debits_row
        - routing_group_label
        - account_info_card
        - plan_group_label
        - account_plan_card
        - bottom_spacer

  error:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Couldn't load account details"
        message: "Check your connection and try again."
        action_label: "Try again"
        action: retry_load
        icon: cloud_off

  no_network:
    layout:
      components_visible: []
      error_card:
        id: no_network_state_card
        title: "Couldn't load account details"
        message: "Check your connection and try again."
        action_label: "Try again"
        action: retry_load
        icon: cloud_off

  unauthenticated:
    layout:
      components_visible: []
      error_card:
        id: unauthenticated_state_card
        title: "Couldn't load account details"
        message: "Check your connection and try again."
        action_label: "Try again"
        action: retry_load
        icon: cloud_off

  empty:
    layout:
      components_visible: []
      error_card:
        id: empty_state_card
        title: "Couldn't load account details"
        message: "Check your connection and try again."
        action_label: "Try again"
        action: retry_load
        icon: cloud_off

state_model:
  view_model: AccountDetailViewModel
  screen_state: "ScreenState<AccountDetailContent>"
  state_wrapper: ScreenState
  state_wrapper_states: [Loading, Content, Error, NoNetwork, Unauthenticated, Empty]
  content_class: AccountDetailContent
  content_fields:
    - name: accountLabel
      type: String
    - name: balanceDisplay
      type: String
      note: "formatted, sign-preserving money string"
    - name: currency
      type: String
    - name: holder
      type: String
      note: "resolved account-holder name (CustomersRepository.accountHolderName, owner displayName fallback); never an OBP login username"
    - name: accountNumber
      type: String
    - name: ibanRaw
      type: String
      note: "un-spaced IBAN, the value copied to clipboard"
    - name: ibanDisplay
      type: String
      note: "IBAN grouped into 4-char blocks for display"
    - name: bankName
      type: String
      note: "resolved via BanksRepository.bankName(account.bankId)"
    - name: productLabel
      type: String
      note: "humanized account_type/product_code"
    - name: "attributes"
      type: "List<AttributeRow>"
      note: "derived from account.account_attributes; DOUBLE-typed values money-formatted"
    - name: hasPlanSection
      type: Boolean
      computed: true
      note: "productLabel.isNotBlank() || attributes.isNotEmpty() — gates the PLAN & FEES card"
  nested_classes:
    - name: AttributeRow
      fields:
        - name: label
          type: String
        - name: value
          type: String
  dto: org.mifosx.openbanking.core.model.obp.Account
  data_source:
    pattern: suspend-load
    note: "load(bankId, accountId) calls accountsRepository.accountDetail(bankId, accountId); then resolves bankName (BanksRepository) and holder (CustomersRepository). No transactions are loaded. Projects only fields OBP returns."
  events:
    - "load(bankId: String, accountId: String)"
    - onRetry
    - "onCopy(value: String, what: String)"
    - onViewTransactions
    - onViewDirectDebits
  nav_callbacks:
    - "onBack()"
    - "onViewTransactions()"
    - "onViewDirectDebits()"
  side_effects:
    - "copy-to-clipboard via LocalClipboardManager, confirmed with a transient snackbar (\"<what> copied\"); no persisted ibanCopied/bicCopied flags"
  di:
    - AccountsRepository
    - BanksRepository
    - CustomersRepository

api:
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/account"
    tag: Accounts
    auth: DirectLogin
    note: "Shipped accountDetail() owner-view endpoint (v4.0.0); the no-view /account path returns OBP-10404, so owner view is fixed in the path. Returns owners, account_attributes, routings, number, balance. bankId defaults to config.bankId when blank."
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
      - name: accountId
        type: path
    response:
      fields:
        - name: account_id
          type: String
        - name: label
          type: String
        - name: product_code
          type: String
        - name: account_type
          type: String
        - name: number
          type: String
        - name: iban
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
          children:
            - name: scheme
              type: String
            - name: address
              type: String
        - name: account_attributes
          type: "List<AccountAttribute>"
          children:
            - name: name
              type: String
            - name: type
              type: String
            - name: value
              type: String
        - name: owners
          type: "List<AccountOwner>"
          children:
            - name: display_name
              type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

  - resolution: bank_name
    via: BanksRepository.bankName(bankId)
    note: "Resolves owning bank display name; backed by the banks list/detail read. Not a screen-owned endpoint — VM-side resolution call."

  - resolution: account_holder_name
    via: CustomersRepository.accountHolderName(bankId, accountId)
    note: "Resolves the real holder legal name (Owner customer-account link); falls back to owners[].display_name. Never renders an OBP login username. VM-side resolution call."

deferred_apis:
  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    reason: "Recent-transactions list was removed from the shipped screen; account-detail no longer loads transactions. Transaction history is reached via the ACTIVITY 'Transaction history' row navigating to the transactions screen."

dependencies:
  tier: feature
  features:
    - transactions
    - direct-debits
    - accounts
