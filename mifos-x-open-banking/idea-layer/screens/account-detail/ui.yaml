        - activity_group_label
        - activity_transactions_row
        - activity_direct_debits_row
        - routing_group_label
        - account_info_card
        - plan_group_label
        - account_plan_card
        - bottom_spacer

  error:
    layout:
      components_visible: []
      error_card:
        id: error_state_card
        title: "Couldn't load account details"
        message: "Check your connection and try again."
        action_label: "Try again"
        action: retry_load
        icon: cloud_off

  no_network:
    layout:
      components_visible: []
      error_card:
        id: no_network_state_card
        title: "Couldn't load account details"
        message: "Check your connection and try again."
