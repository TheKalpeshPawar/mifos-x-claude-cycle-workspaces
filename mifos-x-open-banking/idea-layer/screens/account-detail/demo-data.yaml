sibling: demo-data
schema_version: "4.0"
feature_id: account-detail

# OBIE AISP fixtures backing the account-detail screen for the current account.
# get_account_details -> OBReadAccount6 (single Data.Account[] item by AccountId);
# get_account_balances -> OBReadBalance1 (Data.Balance[] for THIS account, InterimAvailable hero
# + ClosingBooked). Same James Whitfield persona / sort-code 30-00-00 as the accounts + home screens.
collections:
  get_account_details:
    dto: OBReadAccount6
    description: "200 OK — single AccountId identity (scheme/identification/nickname/type/servicer) for the current account."
    item:
      Data:
        Account:
          - AccountId: "acc-jw-current-0001"
            Status: "Enabled"
            StatusUpdateDateTime: "2026-06-12T09:41:18.204Z"
            Currency: "GBP"
            AccountCategory: "Personal"
            AccountTypeCode: "CurrentAccount"
            Nickname: "Everyday Current"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "30000012345678"
                Name: "James Whitfield"
            Servicer:
              SchemeName: "UK.OBIE.BICFI"
              Identification: "HBUKGB4B"
      Links:
        Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts/acc-jw-current-0001"
      Meta:
        TotalPages: 1

  get_account_balances:
    dto: OBReadBalance1
    description: "200 OK — balances for the current account; InterimAvailable drives the hero amount, ClosingBooked the secondary line."
    item:
      Data:
        Balance:
          - AccountId: "acc-jw-current-0001"
            CreditDebitIndicator: "Credit"
            Type: "InterimAvailable"
            DateTime: "2026-06-12T09:41:18.204Z"
            Amount:
              Amount: "2483.17"
              Currency: "GBP"
          - AccountId: "acc-jw-current-0001"
            CreditDebitIndicator: "Credit"
            Type: "ClosingBooked"
            DateTime: "2026-06-11T23:59:59.000Z"
            Amount:
              Amount: "2611.92"
              Currency: "GBP"
      Links:
        Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts/acc-jw-current-0001/balances"
      Meta:
        TotalPages: 1

  # OBErrorResponse1 envelope for the 400/403 error state.
  error:
    dto: OBErrorResponse1
    description: "Representative 400 OBErrorResponse1 driving the error banner (e.g. unknown AccountId)."
    item:
      Code: "400 Bad Request"
      Id: "b318-err-44c1"
      Message: "Invalid request"
      Errors:
        - ErrorCode: "UK.OBIE.Field.Invalid"
          Message: "The supplied AccountId does not match an authorised account."
