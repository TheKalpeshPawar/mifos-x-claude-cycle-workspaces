<!doctype html>
<html lang="en" data-screen="customer-messages" data-state="content" data-feature="customer-messages" data-flavor="fieldOfficer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Messages</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; flex: 1; }
    .badge { background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .search-bar { margin: 8px 20px 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; display: flex; align-items: center; gap: 8px; } .search-bar .material-icons { font-size: 20px; color: var(--outline); } .search-bar input { border: none; outline: none; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); flex: 1; background: transparent; }
    .thread { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--surface-variant); cursor: pointer; }
    .thread.unread { background: var(--primary-container); }
    .thread-avatar { width: 44px; height: 44px; border-radius: 22px; background: var(--surface-variant); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: var(--primary); flex-shrink: 0; }
    .thread-info { flex: 1; }
    .thread-info .name { font-size: 15px; font-weight: 600; }
    .thread-info .preview { font-size: 13px; color: var(--on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-meta { text-align: right; }
    .thread-meta .time { font-size: 12px; color: var(--on-surface-variant); }
    .thread-meta .unread-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--primary); margin-top: 6px; margin-left: auto; }
    .fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(76,102,43,0.35); cursor: pointer; border: none; } .fab .material-icons { font-size: 24px; color: var(--on-primary); }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body><main>
    <div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Messages</h1><span class="badge">5 unread</span></div>
    <div class="search-bar" data-action="search" tabindex="0"><span class="material-icons">search</span><input type="text" placeholder="Search messages" aria-label="Search messages"></div>
    <div class="thread unread" data-action="open_thread" tabindex="0" aria-label="John Mwangi — unread message">
      <div class="thread-avatar">JM</div>
      <div class="thread-info"><div class="name">John Mwangi</div><div class="preview">Please send me the updated KYC documents</div></div>
      <div class="thread-meta"><div class="time">2h ago</div><div class="unread-dot"></div></div>
    </div>
    <div class="thread" data-action="open_thread" tabindex="0" aria-label="Sarah Odhiambo">
      <div class="thread-avatar">SO</div>
      <div class="thread-info"><div class="name">Sarah Odhiambo</div><div class="preview">Thank you for processing my application</div></div>
      <div class="thread-meta"><div class="time">Yesterday</div></div>
    </div>
    <div class="thread" data-action="open_thread" tabindex="0" aria-label="Peter Kamau">
      <div class="thread-avatar">PK</div>
      <div class="thread-info"><div class="name">Peter Kamau</div><div class="preview">When will my business account be ready?</div></div>
      <div class="thread-meta"><div class="time">2 days ago</div></div>
    </div>
    <button class="fab" data-action="new_message" tabindex="0" aria-label="New Message"><span class="material-icons">edit</span></button>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
