<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Customer Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
}
main{padding-bottom:96px;}

.title-row{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 8px;}
.title{font-size:26px;font-weight:700;color:var(--primary);}
.badge{background:var(--error);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--on-primary);}

.search-bar{display:flex;align-items:center;gap:10px;background:var(--background);border:1.5px solid var(--outline-variant);border-radius:28px;padding:10px 16px;margin:0 16px 12px;cursor:text;}
.search-placeholder{flex:1;font-size:14px;color:var(--outline);font-family:var(--font);}

/* Thread cards */
.thread{border-radius:12px;padding:14px;margin:0 16px 8px;cursor:pointer;border:1px solid var(--outline-variant);}
.thread.unread{background:var(--primary-container);border-color:var(--outline-variant);}
.thread.read{background:var(--surface);}
.thread-row{display:flex;align-items:center;gap:12px;}
.avatar{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--on-primary);flex-shrink:0;}
.av-green{background:var(--primary);}
.av-teal{background:var(--tertiary);}
.av-gray{background:var(--outline);}
.thread-body{flex:1;min-width:0;}
.thread-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.thread-name-unread{font-size:14px;font-weight:700;color:var(--text-primary);}
.thread-name-read{font-size:14px;font-weight:600;color:var(--text-primary);}
.thread-time-unread{font-size:12px;font-weight:600;color:var(--primary);}
.thread-time-read{font-size:12px;color:var(--outline-variant);}
.preview-row{display:flex;align-items:center;gap:6px;}
.thread-preview{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;max-width:230px;}
.thread-preview.read-preview{color:var(--text-secondary);}
.unread-dot{width:10px;height:10px;border-radius:5px;background:var(--primary);flex-shrink:0;}

/* FAB */
.fab{position:absolute;bottom:96px;right:16px;width:56px;height:56px;background:var(--primary);border-radius:16px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(76,102,43,0.35);z-index:10;}

.bottom-nav{position:absolute;bottom:0;left:0;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--surface-variant);display:flex;align-items:center;justify-content:space-between;padding:12px 8px 16px;z-index:20;}
.nav-tab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:73px;background:none;border:none;font-family:var(--font);}
.nav-pill{width:56px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-label{font-size:10px;color:var(--text-secondary);font-weight:500;}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<main data-screen="customer-messages" data-state="content" role="main">

  <div class="title-row" data-component-type="box" data-component-id="messages_title_row" data-component-variant="title_row">
    <h1 class="title" data-component-type="text" data-component-id="messages_title" data-component-variant="headline_large">Messages</h1>
    <span class="badge" role="status" aria-label="5 unread messages" data-component-type="box" data-component-id="unread_count_badge" data-component-variant="badge">
      <span data-component-type="text" data-component-id="unread_count_text">5 unread</span>
    </span>
  </div>

  <div class="search-bar" role="search" aria-label="Search through messages" data-action="search" data-component-type="input" data-component-id="search_bar" data-component-variant="search">
    <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" style="fill:var(--outline)"/></svg>
    <span class="search-placeholder">Search messages...</span>
  </div>

  <!-- Thread 1: unread -->
  <div class="thread unread" role="button" aria-label="Unread message from John Mwangi: Please send me the account statement for... 2 minutes ago" data-action="open_thread" data-component-type="box" data-component-id="thread_1" data-component-variant="thread_unread">
    <div class="thread-row">
      <div class="avatar av-green" role="img" aria-label="Avatar for John Mwangi" data-component-type="box" data-component-id="thread_1_avatar">
        <span data-component-type="text" data-component-id="thread_1_initials">JM</span>
      </div>
      <div class="thread-body" data-component-type="box" data-component-id="thread_1_content">
        <div class="thread-header">
          <span class="thread-name-unread" data-component-type="text" data-component-id="thread_1_name">John Mwangi</span>
          <span class="thread-time-unread" data-component-type="text" data-component-id="thread_1_time">2 min ago</span>
        </div>
        <div class="preview-row">
          <span class="thread-preview" data-component-type="text" data-component-id="thread_1_preview">Please send me the account statement for...</span>
          <span class="unread-dot" role="status" aria-label="Unread" data-component-type="box" data-component-id="thread_1_unread_dot"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Thread 2: read -->
  <div class="thread read" role="button" aria-label="Message from Sarah Odhiambo: Thank you for approving my application! 1 hour ago" data-action="open_thread" data-component-type="box" data-component-id="thread_2" data-component-variant="thread_read">
    <div class="thread-row">
      <div class="avatar av-teal" role="img" aria-label="Avatar for Sarah Odhiambo" data-component-type="box" data-component-id="thread_2_avatar">
        <span data-component-type="text" data-component-id="thread_2_initials">SO</span>
      </div>
      <div class="thread-body" data-component-type="box" data-component-id="thread_2_content">
        <div class="thread-header">
          <span class="thread-name-read" data-component-type="text" data-component-id="thread_2_name">Sarah Odhiambo</span>
          <span class="thread-time-read" data-component-type="text" data-component-id="thread_2_time">1 hr ago</span>
        </div>
        <span class="thread-preview read-preview" data-component-type="text" data-component-id="thread_2_preview">Thank you for approving my application!</span>
      </div>
    </div>
  </div>

  <!-- Thread 3: read -->
  <div class="thread read" role="button" aria-label="Message from Peter Kamau: When can I expect my card to arrive? Yesterday" data-action="open_thread" data-component-type="box" data-component-id="thread_3" data-component-variant="thread_read">
    <div class="thread-row">
      <div class="avatar av-gray" role="img" aria-label="Avatar for Peter Kamau" data-component-type="box" data-component-id="thread_3_avatar">
        <span data-component-type="text" data-component-id="thread_3_initials">PK</span>
      </div>
      <div class="thread-body" data-component-type="box" data-component-id="thread_3_content">
        <div class="thread-header">
          <span class="thread-name-read" data-component-type="text" data-component-id="thread_3_name">Peter Kamau</span>
          <span class="thread-time-read" data-component-type="text" data-component-id="thread_3_time">Yesterday</span>
        </div>
        <span class="thread-preview read-preview" data-component-type="text" data-component-id="thread_3_preview">When can I expect my card to arrive?</span>
      </div>
    </div>
  </div>

  <button class="fab" aria-label="Compose a new message" data-action="new_message" data-component-type="button" data-component-id="new_message_fab" data-component-variant="fab">
    <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
  </button>

  <nav class="bottom-nav" aria-label="Field officer navigation" data-component-type="bottom_nav" data-component-id="fo_bottom_nav" data-shell="bottom-nav">
    <button class="nav-tab" aria-label="Dashboard" data-nav-to="fo-dashboard">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Dashboard</span>
    </button>
    <button class="nav-tab" aria-label="Customers" data-nav-to="customer-search">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Customers</span>
    </button>
    <button class="nav-tab" aria-label="Applications" data-nav-to="account-applications">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Applications</span>
    </button>
    <button class="nav-tab active" aria-label="Messages — current" data-nav-to="customer-messages">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" style="fill:var(--primary)"/></svg>
      </div>
      <span class="nav-label">Messages</span>
    </button>
    <button class="nav-tab" aria-label="More options" data-action="open_more_menu">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
