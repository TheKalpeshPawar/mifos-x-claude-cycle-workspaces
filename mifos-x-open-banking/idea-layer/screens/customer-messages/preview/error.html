<!doctype html>
<!-- render-hash: cm-error-h08 -->
<html lang="en" data-screen="customer-messages" data-state="error" data-feature="customer-messages" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages Error — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --radius-soft: 12px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --error: #FFB4AB; --on-error: #690005;
      --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --error: #FFB4AB; --on-error: #690005;
        --error-container: #93000A; --on-error-container: #FFDAD6;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 90px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
    .top-bar h1 { font-size: 28px; font-weight: 700; color: var(--primary); }
    .error-banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; margin: 12px 16px; background: var(--error-container); color: var(--on-error-container); border-left: 4px solid var(--error); border-radius: var(--radius-soft); }
    .error-banner .material-icons { color: var(--error); flex-shrink: 0; }
    .error-banner .text { flex: 1; }
    .error-banner strong { display: block; font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .error-banner span { font-size: 13px; }
    .error-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 28px; text-align: center; gap: 14px; }
    .error-icon { width: 84px; height: 84px; border-radius: 42px; background: var(--error-container); color: var(--error); display: flex; align-items: center; justify-content: center; }
    .error-icon .material-icons { font-size: var(--icon-xl); }
    .error-title { font-size: 19px; font-weight: 700; color: var(--on-surface); margin-top: 4px; }
    .error-sub { font-size: 14px; color: var(--on-surface-variant); max-width: 300px; line-height: 1.5; }
    .err-code { display: inline-block; font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--on-surface-variant); background: var(--surface-variant); padding: 3px 8px; border-radius: 4px; margin-top: 6px; }
    .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; margin-top: 14px; }
    .btn-primary { padding: 14px 16px; background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-outlined { padding: 12px; background: transparent; color: var(--primary); border: 1.5px solid var(--outline); border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 6px 0 8px; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; cursor: pointer; padding: 6px 10px; border-radius: 8px; min-width: 56px; }
    .nav-item .material-icons { font-size: var(--icon-sm); }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <header class="top-bar" role="banner">
      <h1>Messages</h1>
    </header>

    <div class="error-banner" data-component-type="banner" data-component-id="error_banner" role="alert" aria-live="assertive">
      <span class="material-icons" aria-hidden="true">error</span>
      <div class="text">
        <strong>Could not load messages</strong>
        <span>Please check your connection and try again.</span>
      </div>
    </div>

    <section class="error-wrap">
      <div class="error-icon" aria-hidden="true">
        <span class="material-icons">cloud_off</span>
      </div>
      <h2 class="error-title" data-component-type="text" data-component-id="error_title">Messages unavailable</h2>
      <p class="error-sub" data-component-type="text" data-component-id="error_message">We could not reach the messaging service. This is usually temporary.</p>
      <code class="err-code" aria-label="Error code">LOAD_FAILED</code>
      <div class="actions">
        <button class="btn-primary" data-action="retry_load_messages" data-component-type="button" data-component-id="retry_button" aria-label="Retry loading messages" tabindex="0">
          <span class="material-icons" aria-hidden="true">refresh</span> Try Again
        </button>
        <button class="btn-outlined" data-nav-to="fo-dashboard" data-component-type="button" data-component-id="back_to_dashboard_button" aria-label="Back to dashboard" tabindex="0">Back to Dashboard</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" role="navigation" aria-label="Primary">
    <a class="nav-item" data-nav-to="fo-dashboard" tabindex="0" aria-label="Dashboard"><span class="material-icons">dashboard</span><span>Dashboard</span></a>
    <a class="nav-item" data-nav-to="customer-search" tabindex="0" aria-label="Customers"><span class="material-icons">people</span><span>Customers</span></a>
    <a class="nav-item" data-nav-to="account-applications" tabindex="0" aria-label="Applications"><span class="material-icons">description</span><span>Applications</span></a>
    <a class="nav-item active" data-nav-to="customer-messages" tabindex="0" aria-label="Messages, current" aria-current="page"><span class="material-icons">mail</span><span>Messages</span></a>
    <a class="nav-item" data-nav-to="settings" tabindex="0" aria-label="More"><span class="material-icons">more_vert</span><span>More</span></a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
