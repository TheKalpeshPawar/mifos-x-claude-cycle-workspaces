<!doctype html>
<!-- render-hash: cm-empty-g07 -->
<html lang="en" data-screen="customer-messages" data-state="empty" data-feature="customer-messages" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Messages — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --radius-soft: 12px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 90px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
    .top-bar h1 { font-size: 28px; font-weight: 700; color: var(--primary); }
    .empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 28px; text-align: center; gap: 14px; }
    .empty-icon { width: 96px; height: 96px; border-radius: 48px; background: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center; }
    .empty-icon .material-icons { font-size: var(--icon-2xl); }
    .empty-title { font-size: 20px; font-weight: 700; color: var(--on-surface); margin-top: 8px; }
    .empty-sub { font-size: 14px; color: var(--on-surface-variant); max-width: 300px; line-height: 1.5; }
    .btn-primary { padding: 14px 22px; background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 6px 0 8px; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; cursor: pointer; padding: 6px 10px; border-radius: 8px; min-width: 56px; }
    .nav-item .material-icons { font-size: var(--icon-sm); }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <header class="top-bar" role="banner">
      <h1>Messages</h1>
    </header>

    <section class="empty-wrap" data-component-type="box" data-component-id="empty_state" role="status" aria-live="polite">
      <div class="empty-icon" aria-hidden="true">
        <span class="material-icons">forum</span>
      </div>
      <h2 class="empty-title" data-component-type="text" data-component-id="empty_title">No messages yet</h2>
      <p class="empty-sub" data-component-type="text" data-component-id="empty_message">Customer communications will appear here. Start a conversation by composing a new message.</p>
      <button class="btn-primary" data-action="new_message" data-component-type="button" data-component-id="new_message_button" aria-label="Compose a new message" tabindex="0">
        <span class="material-icons" aria-hidden="true">edit</span> New Message
      </button>
    </section>
  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" role="navigation" aria-label="Primary">
    <a class="nav-item" data-nav-to="fo-dashboard" tabindex="0" aria-label="Dashboard"><span class="material-icons">dashboard</span><span>Dashboard</span></a>
    <a class="nav-item" data-nav-to="customer-search" tabindex="0" aria-label="Customers"><span class="material-icons">people</span><span>Customers</span></a>
    <a class="nav-item" data-nav-to="account-applications" tabindex="0" aria-label="Applications"><span class="material-icons">description</span><span>Applications</span></a>
    <a class="nav-item active" data-nav-to="customer-messages" tabindex="0" aria-label="Messages, current" aria-current="page"><span class="material-icons">mail</span><span>Messages</span></a>
    <a class="nav-item" data-nav-to="settings" tabindex="0" aria-label="More"><span class="material-icons">more_vert</span><span>More</span></a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
