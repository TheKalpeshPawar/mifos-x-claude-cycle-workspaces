<!doctype html>

<html lang="en" data-screen="customer-messages" data-state="loading" data-feature="customer-messages" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --skeleton-base: #E1E4D5; --skeleton-shine: #F1F3E5;
      --radius-soft: 12px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285; --outline-variant: #44483D;
      --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285; --outline-variant: #44483D;
        --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; padding-bottom: 90px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
    .top-bar h1 { font-size: 28px; font-weight: 700; color: var(--primary); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .skel { background: linear-gradient(90deg, var(--skeleton-base) 0%, var(--skeleton-shine) 50%, var(--skeleton-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-search { height: 44px; margin: 8px 16px 16px; border-radius: 28px; }
    .skel-thread { display: flex; gap: 12px; align-items: center; padding: 14px; margin: 0 16px 8px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-soft); }
    .skel-avatar { width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; }
    .skel-thread .lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skel-line-1 { height: 12px; width: 50%; }
    .skel-line-2 { height: 11px; width: 82%; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 6px 0 8px; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; padding: 6px 10px; min-width: 56px; }
    .nav-item .material-icons { font-size: 22px; }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
