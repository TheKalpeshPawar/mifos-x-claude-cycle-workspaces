sibling: data-flow
schema_version: "4.0"
feature_id: customer-messages
entries:
  - screen_id: customer-messages
    trigger: on_mount
    endpoints:
      - obp_get_customer_messages
    direction: read
    dtos:
      - name: CustomerMessage
        role: response
        api_id: obp_get_customer_messages
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: show_error_banner
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_empty_state

  - screen_id: customer-messages
    trigger: on_interact
    event: MessageSent
    endpoints:
      - obp_create_message
    direction: write
    dtos:
      - name: CustomerMessage
        role: request
        api_id: obp_create_message
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: show_send_failed_error
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_customer_not_found_error

  - screen_id: customer-messages
    trigger: on_interact
    event: SearchExecuted
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: customer-messages
    trigger: on_interact
    event: ThreadOpened
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: customer-messages
    trigger: on_interact
    event: ComposeOpened
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
