responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      scroll: vertical
      padding: 0
      showShimmer: true
  content:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
  empty:
    layout:
      scroll: vertical
      padding: 32
      showEmptyState: true
      emptyTitle: "No Messages"
      emptySubtitle: "Start a conversation by composing a new message to a customer"
      emptyIcon: message
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: CustomerMessagesViewModel
  state_fields:
    - name: threads
      type: "List<MessageThread>"
      default: emptyList
    - name: searchQuery
      type: String
      default: "''"
    - name: filteredThreads
      type: "List<MessageThread>"
      default: emptyList
    - name: unreadCount
      type: Int
      default: "0"
    - name: isComposeOpen
      type: Boolean
      default: "false"
    - name: composeDraft
      type: MessageComposeDraft
      nullable: true
    - name: isSending
      type: Boolean
      default: "false"
  errors:
    - LOAD_FAILED
    - SEND_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - ThreadOpened
    - MessageSent
    - SearchExecuted
    - ComposeOpened
    - ComposeDismissed
  actions:
    - open_thread
    - new_message
    - send_message
    - search
    - search_customer
  di:
    - CustomerMessagingRepository
    - CustomerSearchService

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/customers/{customerId}/messages"
    tag: Customer-Messages
    response:
      fields:
        - message_id
        - user
        - transport
        - message
        - from_name
        - from_email_address
        - date
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND

  - id: obp_create_message
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/customers/{customerId}/messages"
    tag: Customer-Messages
    description: "Send message to customer (receipt, notification)"
    request:
      fields:
        - name: message
          type: String
        - name: from_department
          type: String
        - name: from_person
          type: String
        - name: transport
          type: String
          note: "Required field: 'sms', 'email', 'ftp', or 'post'"

dependencies:
  tier: feature
  features:
    - customer-detail
    - application-detail
    - kyc-review
