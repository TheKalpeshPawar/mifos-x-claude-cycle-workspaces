sibling: api
schema_version: "4.0"
feature_id: customer-messages
api:
  - id: obp_get_customer_messages
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/customers/{customerId}/messages"
    tag: Customer-Messages
    response:
      dto: CustomerMessage
      demo_source: obp_customer_messages
      fields:
        - id
        - description
        - transport
        - from_department
        - from_person
        - date
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND

  - id: obp_create_message
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/customers/{customerId}/messages"
    tag: Customer-Messages
    description: "Send message to customer (receipt, notification)"
    request:
      fields:
        - name: message
          type: String
        - name: from_department
          type: String
        - name: from_person
          type: String
        - name: transport
          type: String
          note: "Required field: 'sms', 'email', 'ftp', or 'post'"
