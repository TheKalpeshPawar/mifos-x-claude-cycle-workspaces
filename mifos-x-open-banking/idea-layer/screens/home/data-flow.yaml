sibling: data-flow
schema_version: "4.0"
feature_id: home
entries:
  - screen_id: home
    trigger: on_mount
    endpoints:
      - get_accounts
      - get_balances
      - get_transactions
    direction: read
    consent_required: true
    dtos:
      - name: ObieAccount
        role: response
        api_id: get_accounts
      - name: ObieBalance
        role: response
        api_id: get_balances
      - name: ObieTransaction
        role: response
        api_id: get_transactions
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: home
    trigger: on_interact
    event: RetryLoad
    endpoints:
      - get_accounts
      - get_balances
      - get_transactions
    direction: read
    consent_required: true
    dtos:
      - name: ObieAccount
        role: response
        api_id: get_accounts
      - name: ObieBalance
        role: response
        api_id: get_balances
      - name: ObieTransaction
        role: response
        api_id: get_transactions
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: home
    trigger: on_interact
    event: NavigateToTransactions
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToSendMoney
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToAccounts
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToBeneficiaries
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToCards
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
