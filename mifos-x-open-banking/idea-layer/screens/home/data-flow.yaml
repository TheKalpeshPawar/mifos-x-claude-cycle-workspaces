sibling: data-flow
schema_version: "4.0"
feature_id: home
entries:
  - screen_id: home
    trigger: on_mount
    endpoints:
      - obp_get_home_accounts
    direction: read
    dtos:
      - name: Account
        role: response
        api_id: obp_get_home_accounts
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: home
    trigger: on_mount
    endpoints:
      - obp_get_home_transactions
    direction: read
    dtos:
      - name: Transaction
        role: response
        api_id: obp_get_home_transactions
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_error_state

  - screen_id: home
    trigger: on_mount
    endpoints:
      - obp_my_accounts_cross_bank
    direction: read
    dtos:
      - name: Account
        role: response
        api_id: obp_my_accounts_cross_bank
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login

  - screen_id: home
    trigger: on_interact
    event: RetryLoad
    endpoints:
      - obp_get_home_accounts
      - obp_get_home_transactions
    direction: read
    dtos:
      - name: Account
        role: response
        api_id: obp_get_home_accounts
      - name: Transaction
        role: response
        api_id: obp_get_home_transactions
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: home
    trigger: on_interact
    event: NavigateToTransactions
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToSendMoney
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToAccounts
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToBeneficiaries
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: home
    trigger: on_interact
    event: NavigateToCards
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
