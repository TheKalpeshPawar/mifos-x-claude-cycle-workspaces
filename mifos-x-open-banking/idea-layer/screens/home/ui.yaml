# States map 1:1 to the shipped ScreenState<HomeContent> when-branches in HomeScreen.kt.
states:
  initial_state: loading

  loading:
    motion:
      reduced_motion_fallback: static_placeholder
    layout:
      centered: true
      indicator: circular_progress       # ScreenState.Loading → CircularProgressIndicator

  content:
    layout:
      components_visible:
        - primary_account_card
        - services_section_title
        - services_grid

  empty:
    layout:
      empty_card:
        id: empty_state_card
        title: "No accounts yet"
        message: "Your accounts will appear here once your profile is set up."
        action_label: "Set Up Account"
        action: navigate
        action_target: accounts          # onSetUpAccount → onAccounts

  error:
    layout:
      error_card:
        id: error_state_card
        title: "Could not load your account"
        message: "We were unable to fetch your account data. Check your connection and try again."
        action_label: "Retry"
        action: retry_load               # viewModel.onRetry()
        icon: error_outline

  # ScreenState.NoNetwork and .Unauthenticated reuse the same HomeError surface as .Error.
  no_network:
    layout:
      reuses: error

  unauthenticated:
    layout:
      reuses: error

# Reconciled to the shipped HomeViewModel.kt contract: one ScreenState<HomeContent>
# stream, combine(accountsStream, observeDefaultAccountId). No isLoading/error fields —
# the sealed ScreenState carries loading/empty/error/no-network/unauthenticated.
state_model:
  view_model: HomeViewModel
  screen_state: "ScreenState<HomeContent>"   # template.core.base.store.screen.ScreenState
  content_model: HomeContent
  content_fields:
    - name: greetingName
      type: String                            # from Data.Account[].Account[].Name on the primary account (blank → "there")
    - name: primaryAccount
      type: "ObieAccount?"                     # one Data.Account[] element; persisted default → checking-first → first
      obie_shape:
        account_id: "Data.Account[].AccountId"           # String
        account_type: "Data.Account[].AccountTypeCode"   # String
        nickname: "Data.Account[].Nickname"              # String
        scheme_name: "Data.Account[].Account[].SchemeName"     # String
        identification: "Data.Account[].Account[].Identification"  # String
        name: "Data.Account[].Account[].Name"            # String
    - name: primaryBalanceAmount
      type: String                            # Data.Balance[].Amount.Amount (decimal string)
    - name: primaryBalanceCurrency
      type: String                            # Data.Balance[].Amount.Currency (ISO 4217)
    - name: recentTransactions
      type: "List<ObieTransaction>"           # from get_transactions on the primary AccountId
      default: "emptyList()"
      obie_shape:
        transaction_id: "Data.Transaction[].TransactionId"          # String
        credit_debit: "Data.Transaction[].CreditDebitIndicator"     # String (Credit|Debit)
        booking_datetime: "Data.Transaction[].BookingDateTime"      # String (ISO 8601)
        information: "Data.Transaction[].TransactionInformation"    # String
        amount: "Data.Transaction[].Amount.Amount"                  # String
        currency: "Data.Transaction[].Amount.Currency"             # String
        merchant_name: "Data.Transaction[].MerchantDetails.MerchantName"  # String (counterparty display source)
    - name: accounts
      type: "List<ObieAccount>"               # Data.Account[] from get_accounts
      default: "emptyList()"
    - name: totalAccountCount
      type: Int
  screen_states:
    - Loading
    - "Content(HomeContent)"
    - Empty                                    # user has zero accounts
    - Error
    - NoNetwork
    - Unauthenticated
  methods:
    - name: onRetry
      desc: "stream.retry() — re-runs the offline-first fetch"
    - name: onRefresh
      desc: "stream.refresh()"
    - name: onDefaultAccountSelected
      param: "account: Account"
      desc: "Persists UserData.defaultAccountId via UserPreferencesRepository"
  derivation:
    primary_account: "default-id match (Data.Account[].AccountId) → first checking-type (AccountTypeCode CurrentAccount) → first"
    greeting_name: "primaryAccount Data.Account[].Account[].Name"
    primary_balance: "Data.Balance[] for primaryAccount.AccountId, Type=InterimAvailable → Amount.Amount + Amount.Currency"
    counterparty_display: "per transaction: MerchantDetails.MerchantName → TransactionInformation (never a raw CreditorAccount login)"
  nav_callbacks:                               # HomeScreen lambdas (homeGraph wiring)
    - onAccounts
    - onStandingOrders
    - onBusinessInsights
    - onProducts
    - onFindAtm
    - onInsights
  flags:
    - name: showFindAtm
      type: Boolean
      default: "true"                          # gates the Find ATM tile
  di:
    - AisRepository                             # get_accounts + get_balances + get_transactions (OBIE AIS, consent-scoped)
    - ConsentRepository                         # resolves the authorised account-access-consent + authorization-code token
    - UserPreferencesRepository                 # default-account preference (multiplatform-settings)

# HSBC OBIE AIS. Home reads require an authorised account-access-consent (AUTH) plus a
# scoped authorization-code token (scope accounts). Endpoint ids mirror screens/home/api.yaml.
consent:
  required: true
  type: account-access-consent
  permissions: [ReadAccountsBasic, ReadAccountsDetail, ReadBalances, ReadTransactionsBasic, ReadTransactionsDetail]
  token: authorization-code
api:
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: Accounts
    auth: OAuth2-FAPI
    consent_required: true
    description: "Authorised AccountId list — feeds the hero default-account pick and the account count. OBIE OBReadAccount6."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].SchemeName
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED — token missing or expired"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus — consent not AUTH"
      - code: 500
        message: "OB.UnexpectedError"

  - id: get_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: Balances
    auth: OAuth2-FAPI
    consent_required: true
    description: "Available Balance for the hero default account. Requires ReadBalances. OBIE OBReadBalance1; Home surfaces the InterimAvailable Type."
    response:
      fields:
        - name: Data.Balance[].AccountId
          type: String
        - name: Data.Balance[].Type
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus — missing ReadBalances"
      - code: 500
        message: "OB.UnexpectedError"

  - id: get_transactions
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    tag: Transactions
    auth: OAuth2-FAPI
    consent_required: true
    description: "Recent transactions for the hero default account. Requires ReadTransactionsBasic/Detail. OBIE OBReadTransaction6. Counterparty rule: prefer MerchantDetails.MerchantName then TransactionInformation; never render a raw CreditorAccount login."
    response:
      fields:
        - name: Data.Transaction[].TransactionId
          type: String
        - name: Data.Transaction[].CreditDebitIndicator
          type: String
        - name: Data.Transaction[].BookingDateTime
          type: String
        - name: Data.Transaction[].TransactionInformation
          type: String
        - name: Data.Transaction[].Amount.Amount
          type: String
        - name: Data.Transaction[].Amount.Currency
          type: String
        - name: Data.Transaction[].MerchantDetails.MerchantName
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
      - code: 500
        message: "OB.UnexpectedError"

