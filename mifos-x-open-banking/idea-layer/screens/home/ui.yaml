screens:
  - name: TasksList
    archetype: dashboard
    purpose: "Primary dashboard — list and filter all tasks by calendar date"
    composition:
      - TopAppBar           # title + settings icon
      - LazyVerticalGrid    # year/month/day picker grid
      - LazyRow             # day-of-month strip
      - Popup               # year dropdown
      - LazyColumn          # task list
      - Surface             # per-task row container
      - CheckBox            # completion toggle
      - IconButton          # delete action
      - FloatingActionButton  # "+ new task"

    state_model:
      class: TasksViewModel
      kind: MVI
      states: [Loading, Empty, Success]
      action_count: 5
      event_count: 2
      key_actions:
        - updateSelectDayInMonth
        - flagTask
        - deleteTask
        - selectYear
        - selectMonth

    data_dependencies:
      - service: StorageService
        ops: [getTasksByDate, updateTask, deleteTask]

    requirements_covered: [FR-002, FR-003, FR-004, FR-005]

  - name: EditTask
    archetype: form
    purpose: "Create or edit a single task with title, description, date, time, priority"
    composition:
      - Scaffold
      - OutlinedTextField   # title
      - OutlinedTextField   # description
      - FilterChip          # priority chips (low / med / high)
      - DatePickerDialog    # due date
      - TimePicker          # due time
      - AlertDialog         # confirm discard
      - Button              # save
      - TextButton          # cancel

    state_model:
      class: EditTaskViewModel
      kind: MVI
      states: [Loading, Empty, Success]
      action_count: 7
      event_count: 1
      key_actions:
        - updateTitle
        - updateDescription
        - updatePriority
        - updateDate
        - updateTime
        - saveTask
        - cancelEdit

    data_dependencies:
      - service: StorageService
        ops: [addTask, updateTask, getTaskById]

    requirements_covered: [FR-001]

navigation:
  entry: TasksList
  edges:
    - from: TasksList
      to: EditTask
      trigger: tap FloatingActionButton (+)
      args: {mode: create}
    - from: TasksList
      to: EditTask
      trigger: tap task row
      args: {mode: edit, taskId}
    - from: EditTask
      to: TasksList
      trigger: tap Save | Cancel | back

deeplinks: []   # none observed in source
