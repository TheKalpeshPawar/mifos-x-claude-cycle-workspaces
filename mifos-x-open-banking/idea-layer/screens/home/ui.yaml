responsive:
  mobile_only: false
  baseline_width: 390
  tablet:
    min_width: 600
    columns: 2
    content_max_width: 840
  desktop:
    min_width: 840
    columns: 3
    content_max_width: 1200

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      components_visible:
        - greeting_text
        - greeting_date
      skeleton:
        - id: skeleton_account_card
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 20
            height: 200
            margin_horizontal: 20
        - id: skeleton_txn_1
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 72
            margin_horizontal: 20
            margin_top: 8
        - id: skeleton_txn_2
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 72
            margin_horizontal: 20
            margin_top: 8
        - id: skeleton_txn_3
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 72
            margin_horizontal: 20
            margin_top: 8

  content:
    layout:
      components_visible:
        - greeting_text
        - greeting_date
        - primary_account_card
        - total_balance_chip
        - recent_transactions_header
        - transaction_row_1
        - transaction_row_2
        - transaction_row_3
        - view_all_link

  error:
    layout:
      components_visible:
        - greeting_text
        - greeting_date
      error_card:
        id: error_state_card
        title: "Could not load your account"
        message: "We were unable to fetch your account data. Check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

  empty:
    layout:
      components_visible:
        - greeting_text
        - greeting_date
      empty_card:
        id: empty_state_card
        illustration: account_empty
        title: "No accounts yet"
        message: "Your accounts will appear here once your profile is set up."
        action_label: "Set Up Account"
        action: navigate
        action_target: accounts

state_model:
  view_model: HomeViewModel
  screen_state: HomeScreenState
  state_fields:
    - name: isLoading
      type: Boolean
      default: "true"
    - name: primaryAccount
      type: "AccountSummary?"
      default: "null"
    - name: totalBalance
      type: "BigDecimal?"
      default: "null"
    - name: totalAccountCount
      type: Int
      default: "0"
    - name: recentTransactions
      type: "List<TransactionSummary>"
      default: "emptyList()"
    - name: error
      type: "UiError?"
      default: "null"
    - name: greetingName
      type: String
      default: '"Alex"'
  errors:
    - id: network_error
      message: "Could not connect to banking services. Please try again."
    - id: auth_error
      message: "Session expired. Please log in again."
    - id: unknown_error
      message: "Something went wrong. Please try again."
  events:
    - RetryLoad
    - NavigateToTransactions
    - NavigateToSendMoney
    - NavigateToAccounts
    - NavigateToBeneficiaries
    - NavigateToCards
  actions:
    - name: loadDashboardData
      triggers: [RetryLoad, ScreenOpened]
    - name: navigateTo
      param: screen_id
  di:
    - AccountsRepository
    - TransactionsRepository
    - SessionManager

api:
  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts"
    tag: Accounts
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Bank not found"
      - code: 500
        message: "OBP server error"

  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: accountId
        type: path
      - name: limit
        type: query
        value: "5"
      - name: sort_direction
        type: query
        value: "DESC"
    response:
      fields:
        - name: id
          type: String
        - name: this_account
          type: object
        - name: other_account
          type: object
        - name: details
          type: object
          children:
            - name: type
              type: String
            - name: description
              type: String
            - name: posted
              type: String
            - name: value
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

  - id: obp_my_accounts_cross_bank
    endpoint: "GET /obp/v3.0.0/my/accounts"
    tag: Accounts
    description: "Cross-bank account aggregation"

dependencies:
  tier: feature
  features:
    - accounts
    - transactions
    - send-money
    - beneficiaries
    - cards
