              width: 40
              height: 40
              align: center
              justify: center
            children:
              - type: text
                id: hero_avatar_initials
                content: "LC"                # initials({owner display name})
                style:
                  typography: "Outfit/label_medium"
                  color: on_primary
                  font_weight: semibold
                a11y:
                  role: img
                  label: "Account owner avatar"
                test_context:
                  tag: hero_avatar_initials

      - type: text
        id: hero_account_label
        content: "Everyday Current"          # default account.label, "Account" fallback
        style:
          typography: "Outfit/label_medium"
          color: on_primary_85
          padding_top: 20
        a11y:
          role: text
        test_context:
          tag: hero_account_label

      - type: text
        id: hero_account_identifier
        content: "GB29 NWBK 6016 1331 9268 19"  # default account.displayIdentifier, "—" fallback
        style:
          typography: "Outfit/label_small"
          font_family: monospace
          color: on_primary_65
        a11y:
          role: text
          label: "Account identifier"
        test_context:
          tag: hero_account_identifier

      - type: text
        id: hero_balance_label
        content: "Available Balance"
        style:
          typography: "Outfit/label_small"
          color: on_primary_80
          padding_top: 12
        a11y:
          role: text
        test_context:
          tag: hero_balance_label

      - type: text
        id: hero_balance_amount
        content: "£4,250.00"                 # formatMoney(default account.balance)
        style:
          typography: "Outfit/headline_medium"
          color: on_primary
          font_weight: bold
        a11y:
          role: text
          label: "Available balance: four thousand two hundred fifty pounds"
        test_context:
          tag: hero_balance_amount
          assert_content: "£4,250.00"

  # ── Banking Services ─────────────────────────────────────────────────────────
