      label: Home
      icon: home
      target: home
      active: true
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
    - id: nav_pay
      label: Pay
      icon: send
      target: send-money
    - id: nav_cards
      label: Cards
      icon: credit_card
      target: cards
    - id: nav_more
      label: More
      icon: more_horiz
      target: settings

screens:
