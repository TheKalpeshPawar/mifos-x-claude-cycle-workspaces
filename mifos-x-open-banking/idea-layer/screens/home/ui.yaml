# Reconciled to shipped HomeScreen.kt (HomeLoaded) on 2026-06-11. The shipped Home
# renders exactly two regions: a full-bleed gradient hero card (greeting + owner avatar
# + default account + Available Balance, tappable → AccountPickerBottomSheet) and a
# 2×3 Banking Services tile grid. There is NO recent-transactions list and NO total-
# portfolio chip on Home (both removed below as never-built).
components:
  # ── Full-bleed gradient hero (HeroGradientCard, RectangleShape, onPrimary text) ──
  - type: card
    id: primary_account_card
    label: "Home hero card"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      surface: hero_gradient            # core/ui/card/HeroGradientCard — brand gradient
      shape: rectangle                  # RectangleShape — full-bleed, square corners
      full_width: true
      padding_start: 20
      padding_end: 20
      padding_top: 16
      padding_bottom: 24
    on_click:
      action: open_default_account_picker
      target: account_picker_sheet
    a11y:
      role: button
      label: "Account hero. Tap to choose your default account."
    keyboard:
      focusable: true
    test_context:
      tag: primary_account_card
      assert_visible: true
      assert_clickable: true
    children:
      - type: stack
        id: hero_header_row
        style:
          direction: horizontal
          align: flex_start
        children:
          - type: stack
            id: hero_greeting_col
            style:
              direction: vertical
              flex: 1
            children:
              - type: text
                id: hero_greeting_line
                content: "Good morning"      # derived at runtime from time-of-day
                style:
                  typography: "Outfit/label_medium"
                  color: on_primary_85       # onPrimary @ 85% — never hardcoded hex
                a11y:
                  role: text
                test_context:
                  tag: hero_greeting_line

              - type: text
                id: hero_greeting_name
                content: "Hello, Liam Carter"  # "Hello, {account owner displayName}"
                style:
                  typography: "Outfit/headline_small"
                  color: on_primary
                  font_weight: bold
                a11y:
                  role: heading
                  level: 1
                  label: "Greeting: Hello, Liam Carter"
                test_context:
                  tag: hero_greeting_name
                  assert_content: "Hello, Liam Carter"

              - type: text
                id: hero_greeting_date
                content: "Monday, 25 May 2026"
                style:
                  typography: "Outfit/label_small"
                  color: on_primary_70
                a11y:
                  role: text
                test_context:
                  tag: hero_greeting_date

          - type: box
