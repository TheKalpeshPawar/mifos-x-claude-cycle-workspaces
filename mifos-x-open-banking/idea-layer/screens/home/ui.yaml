id: home
name: Home Dashboard
feature: home
flavor: consumer
status: enriched
quality_score: 82

shell:
  bottom_nav: true
  nav_items:
    - id: nav_home
      label: Home
      icon: home
      target: home
      active: true
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
    - id: nav_pay
      label: Pay
      icon: send
      target: send-money
    - id: nav_cards
      label: Cards
      icon: credit_card
      target: cards
    - id: nav_more
      label: More
      icon: more_horiz
      target: more

screens:
  - id: home_content
    label: Home Dashboard
    route: /home
    scroll: vertical

components:
  - type: text
    id: greeting_text
    content: "Good morning, Alex"
    style:
      typography: headline_medium
      color: "#1800B1"
      padding_top: 24
      padding_horizontal: 20
    a11y:
      role: heading
      level: 1
      label: "Greeting: Good morning, Alex"
    test_context:
      tag: greeting_text
      assert_visible: true
      assert_content: "Good morning, Alex"

  - type: text
    id: greeting_date
    content: "Monday, 25 May 2026"
    style:
      typography: body_medium
      color: "#666666"
      padding_horizontal: 20
      padding_bottom: 16
    a11y:
      role: text
      label: "Today's date: Monday, 25 May 2026"
    test_context:
      tag: greeting_date
      assert_visible: true

  - type: box
    id: primary_account_card
    style:
      background: "#1800B1"
      border_radius: 20
      padding: 24
      margin_horizontal: 20
      margin_bottom: 8
      elevation: 4
    a11y:
      role: region
      label: "Primary Checking account card"
    test_context:
      tag: primary_account_card
      assert_visible: true
    children:
      - type: text
        id: account_card_label
        content: "Primary Checking"
        style:
          typography: label_large
          color: "#FFFFFFB3"
        a11y:
          role: text
          label: "Account type: Primary Checking"
        test_context:
          tag: account_card_label

      - type: text
        id: account_card_balance
        content: "£4,250.00"
        style:
          typography: display_small
          color: "#FFFFFF"
          padding_top: 8
          padding_bottom: 4
        a11y:
          role: text
          label: "Account balance: four thousand two hundred fifty pounds"
        test_context:
          tag: account_card_balance
          assert_content: "£4,250.00"

      - type: text
        id: account_card_iban
        content: "•••• •••• •••• 0130"
        style:
          typography: body_medium
          color: "#FFFFFFB3"
          padding_bottom: 20
        a11y:
          role: text
          label: "Account number ending 0130"
        test_context:
          tag: account_card_iban

      - type: stack
        id: quick_actions_row
        style:
          direction: horizontal
          spacing: 8
        a11y:
          role: group
          label: "Quick actions"
        test_context:
          tag: quick_actions_row
        children:
          - type: button
            id: btn_send_money
            label: "Send Money"
            style:
              variant: filled
              background: "#FFFFFF"
              text_color: "#1800B1"
              border_radius: 12
              padding_horizontal: 12
              padding_vertical: 8
              typography: label_medium
              flex: 1
            on_click:
              action: navigate
              target: send-money
            a11y:
              role: button
              label: "Send money"
              hint: "Opens the send money screen"
            test_context:
              tag: btn_send_money
              assert_clickable: true

          - type: button
            id: btn_add_beneficiary
            label: "Beneficiaries"
            style:
              variant: outlined
              border_color: "#FFFFFF"
              text_color: "#FFFFFF"
              border_radius: 12
              padding_horizontal: 12
              padding_vertical: 8
              typography: label_medium
              flex: 1
            on_click:
              action: navigate
              target: beneficiaries
            a11y:
              role: button
              label: "Manage beneficiaries"
              hint: "Opens the beneficiaries screen"
            test_context:
              tag: btn_add_beneficiary
              assert_clickable: true

          - type: button
            id: btn_view_cards
            label: "View Cards"
            style:
              variant: outlined
              border_color: "#FFFFFF"
              text_color: "#FFFFFF"
              border_radius: 12
              padding_horizontal: 12
              padding_vertical: 8
              typography: label_medium
              flex: 1
            on_click:
              action: navigate
              target: cards
            a11y:
              role: button
              label: "View my cards"
              hint: "Opens the cards screen"
            test_context:
              tag: btn_view_cards
              assert_clickable: true

  - type: box
    id: total_balance_chip
    style:
      background: "#E8E4FF"
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 10
      margin_horizontal: 20
      margin_top: 12
      margin_bottom: 8
    a11y:
      role: text
      label: "Total across 3 accounts: twelve thousand four hundred eighty pounds fifty pence"
    test_context:
      tag: total_balance_chip
      assert_visible: true
    children:
      - type: stack
        id: total_balance_row
        style:
          direction: horizontal
          spacing: 4
          align: center
        children:
          - type: icon
            id: total_balance_icon
            content: "account_balance_wallet"
            style:
              size: 16
              color: "#1800B1"
            a11y:
              role: img
              label: "Wallet icon"
            test_context:
              tag: total_balance_icon

          - type: text
            id: total_balance_text
            content: "Total across 3 accounts: £12,480.50"
            style:
              typography: label_medium
              color: "#1800B1"
            a11y:
              role: text
            test_context:
              tag: total_balance_text
              assert_content: "Total across 3 accounts: £12,480.50"

  - type: stack
    id: recent_transactions_header
    style:
      direction: horizontal
      align: center
      justify: space_between
      padding_horizontal: 20
      padding_top: 20
      padding_bottom: 12
    a11y:
      role: group
    test_context:
      tag: recent_transactions_header
    children:
      - type: text
        id: recent_transactions_title
        content: "Recent Transactions"
        style:
          typography: title_large
          color: "#1A1A1A"
        a11y:
          role: heading
          level: 2
          label: "Recent Transactions"
        test_context:
          tag: recent_transactions_title

      - type: link
        id: view_all_link
        content: "View All"
        style:
          typography: label_medium
          color: "#1800B1"
        on_click:
          action: navigate
          target: transactions
        a11y:
          role: link
          label: "View all transactions"
          hint: "Opens the full transactions history"
        test_context:
          tag: view_all_link
          assert_clickable: true

  - type: box
    id: transaction_row_1
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding: 16
      margin_horizontal: 20
      margin_bottom: 8
      elevation: 1
    a11y:
      role: listitem
      label: "Tesco Supermarket, debit forty-two pounds fifty, 23 May 2026"
    test_context:
      tag: transaction_row_1
      assert_visible: true
    children:
      - type: stack
        id: txn1_row
        style:
          direction: horizontal
          align: center
          spacing: 12
        children:
          - type: box
            id: txn1_icon_container
            style:
              background: "#E8F5E9"
              border_radius: 24
              width: 44
              height: 44
              align: center
              justify: center
            children:
              - type: icon
                id: txn1_icon
                content: "shopping_cart"
                style:
                  color: "#4CAF50"
                  size: 22
                a11y:
                  role: img
                  label: "Shopping category icon"
                test_context:
                  tag: txn1_icon

          - type: stack
            id: txn1_details
            style:
              direction: vertical
              flex: 1
            children:
              - type: text
                id: txn1_merchant
                content: "Tesco Supermarket"
                style:
                  typography: body_large
                  color: "#1A1A1A"
                a11y:
                  role: text
                test_context:
                  tag: txn1_merchant
                  assert_content: "Tesco Supermarket"

              - type: text
                id: txn1_date
                content: "23 May 2026 · Groceries"
                style:
                  typography: body_small
                  color: "#666666"
                a11y:
                  role: text
                test_context:
                  tag: txn1_date

          - type: stack
            id: txn1_amount_col
            style:
              direction: vertical
              align: flex_end
            children:
              - type: text
                id: txn1_amount
                content: "-£42.50"
                style:
                  typography: body_large
                  color: "#FF5252"
                  font_weight: 600
                a11y:
                  role: text
                  label: "Debit forty-two pounds fifty"
                test_context:
                  tag: txn1_amount
                  assert_content: "-£42.50"

              - type: box
                id: txn1_badge
                style:
                  background: "#FFEBEE"
                  border_radius: 4
                  padding_horizontal: 6
                  padding_vertical: 2
                children:
                  - type: text
                    id: txn1_badge_label
                    content: "DEBIT"
                    style:
                      typography: label_small
                      color: "#FF5252"
                    a11y:
                      role: text
                      label: "Debit transaction"
                    test_context:
                      tag: txn1_badge_label

  - type: box
    id: transaction_row_2
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding: 16
      margin_horizontal: 20
      margin_bottom: 8
      elevation: 1
    a11y:
      role: listitem
      label: "Salary Payment, credit three thousand two hundred pounds, 22 May 2026"
    test_context:
      tag: transaction_row_2
    children:
      - type: stack
        id: txn2_row
        style:
          direction: horizontal
          align: center
          spacing: 12
        children:
          - type: box
            id: txn2_icon_container
            style:
              background: "#E8F5E9"
              border_radius: 24
              width: 44
              height: 44
              align: center
              justify: center
            children:
              - type: icon
                id: txn2_icon
                content: "payments"
                style:
                  color: "#4CAF50"
                  size: 22
                a11y:
                  role: img
                  label: "Payment category icon"
                test_context:
                  tag: txn2_icon

          - type: stack
            id: txn2_details
            style:
              direction: vertical
              flex: 1
            children:
              - type: text
                id: txn2_merchant
                content: "Salary Payment"
                style:
                  typography: body_large
                  color: "#1A1A1A"
                a11y:
                  role: text
                test_context:
                  tag: txn2_merchant
                  assert_content: "Salary Payment"

              - type: text
                id: txn2_date
                content: "22 May 2026 · Income"
                style:
                  typography: body_small
                  color: "#666666"
                a11y:
                  role: text
                test_context:
                  tag: txn2_date

          - type: stack
            id: txn2_amount_col
            style:
              direction: vertical
              align: flex_end
            children:
              - type: text
                id: txn2_amount
                content: "+£3,200.00"
                style:
                  typography: body_large
                  color: "#4CAF50"
                  font_weight: 600
                a11y:
                  role: text
                  label: "Credit three thousand two hundred pounds"
                test_context:
                  tag: txn2_amount
                  assert_content: "+£3,200.00"

              - type: box
                id: txn2_badge
                style:
                  background: "#E8F5E9"
                  border_radius: 4
                  padding_horizontal: 6
                  padding_vertical: 2
                children:
                  - type: text
                    id: txn2_badge_label
                    content: "CREDIT"
                    style:
                      typography: label_small
                      color: "#4CAF50"
                    a11y:
                      role: text
                      label: "Credit transaction"
                    test_context:
                      tag: txn2_badge_label

  - type: box
    id: transaction_row_3
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding: 16
      margin_horizontal: 20
      margin_bottom: 8
      elevation: 1
    a11y:
      role: listitem
      label: "EDF Energy, debit ninety-four pounds twenty, 20 May 2026"
    test_context:
      tag: transaction_row_3
    children:
      - type: stack
        id: txn3_row
        style:
          direction: horizontal
          align: center
          spacing: 12
        children:
          - type: box
            id: txn3_icon_container
            style:
              background: "#FFF3E0"
              border_radius: 24
              width: 44
              height: 44
              align: center
              justify: center
            children:
              - type: icon
                id: txn3_icon
                content: "bolt"
                style:
                  color: "#FF9800"
                  size: 22
                a11y:
                  role: img
                  label: "Utilities category icon"
                test_context:
                  tag: txn3_icon

          - type: stack
            id: txn3_details
            style:
              direction: vertical
              flex: 1
            children:
              - type: text
                id: txn3_merchant
                content: "EDF Energy"
                style:
                  typography: body_large
                  color: "#1A1A1A"
                a11y:
                  role: text
                test_context:
                  tag: txn3_merchant
                  assert_content: "EDF Energy"

              - type: text
                id: txn3_date
                content: "20 May 2026 · Utilities"
                style:
                  typography: body_small
                  color: "#666666"
                a11y:
                  role: text
                test_context:
                  tag: txn3_date

          - type: stack
            id: txn3_amount_col
            style:
              direction: vertical
              align: flex_end
            children:
              - type: text
                id: txn3_amount
                content: "-£94.20"
                style:
                  typography: body_large
                  color: "#FF5252"
                  font_weight: 600
                a11y:
                  role: text
                  label: "Debit ninety-four pounds twenty"
                test_context:
                  tag: txn3_amount
                  assert_content: "-£94.20"

              - type: box
                id: txn3_badge
                style:
                  background: "#FFEBEE"
                  border_radius: 4
                  padding_horizontal: 6
                  padding_vertical: 2
                children:
                  - type: text
                    id: txn3_badge_label
                    content: "DEBIT"
                    style:
                      typography: label_small
                      color: "#FF5252"
                    a11y:
                      role: text
                      label: "Debit transaction"
                    test_context:
                      tag: txn3_badge_label

  - type: spacer
    id: bottom_spacer
    style:
      height: 24

states:
  loading:
    layout:
      components_visible:
        - greeting_text
        - greeting_date
      skeleton:
        - id: skeleton_account_card
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 20
            height: 180
            margin_horizontal: 20
        - id: skeleton_txn_1
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 12
            height: 72
            margin_horizontal: 20
            margin_top: 8
        - id: skeleton_txn_2
          type: box
          style:
            background: "#E0E0E0"
            border_radius: 12
            height: 72
            margin_horizontal: 20
            margin_top: 8

  content:
    layout:
      components_visible:
        - greeting_text
        - greeting_date
        - primary_account_card
        - total_balance_chip
        - recent_transactions_header
        - transaction_row_1
        - transaction_row_2
        - transaction_row_3
        - view_all_link

  error:
    layout:
      components_visible:
        - greeting_text
        - greeting_date
      error_card:
        id: error_state_card
        title: "Could not load your account"
        message: "We were unable to fetch your account data. Check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

  empty:
    layout:
      components_visible:
        - greeting_text
        - greeting_date
      empty_card:
        id: empty_state_card
        illustration: account_empty
        title: "No accounts yet"
        message: "Your accounts will appear here once your profile is set up."
        action_label: "Set Up Account"
        action: navigate
        action_target: accounts

state_model:
  view_model: HomeViewModel
  screen_state: HomeScreenState
  state_fields:
    - name: isLoading
      type: Boolean
      default: "true"
    - name: primaryAccount
      type: "AccountSummary?"
      default: "null"
    - name: totalBalance
      type: "BigDecimal?"
      default: "null"
    - name: totalAccountCount
      type: Int
      default: "0"
    - name: recentTransactions
      type: "List<TransactionSummary>"
      default: "emptyList()"
    - name: error
      type: "UiError?"
      default: "null"
    - name: greetingName
      type: String
      default: '"Alex"'
  errors:
    - id: network_error
      message: "Could not connect to banking services. Please try again."
    - id: auth_error
      message: "Session expired. Please log in again."
    - id: unknown_error
      message: "Something went wrong. Please try again."
  events:
    - RetryLoad
    - NavigateToTransactions
    - NavigateToSendMoney
    - NavigateToAccounts
    - NavigateToBeneficiaries
    - NavigateToCards
  actions:
    - name: loadDashboardData
      triggers: [RetryLoad, ScreenOpened]
    - name: navigateTo
      param: screen_id
  di:
    - AccountsRepository
    - TransactionsRepository
    - SessionManager

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/accounts"
    tag: Accounts
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Bank not found"
      - code: 500
        message: "OBP server error"

  - endpoint: "GET /obp/v5.1.0/my/accounts/{accountId}/transactions"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: accountId
        type: path
      - name: limit
        type: query
        value: "5"
      - name: sort_direction
        type: query
        value: "DESC"
    response:
      fields:
        - name: id
          type: String
        - name: this_account
          type: object
        - name: other_account
          type: object
        - name: details
          type: object
          children:
            - name: type
              type: String
            - name: description
              type: String
            - name: posted
              type: String
            - name: value
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

dependencies:
  tier: feature
  features:
    - accounts
    - transactions
    - send-money
    - beneficiaries
    - cards
