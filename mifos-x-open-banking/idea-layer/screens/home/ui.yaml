type: home
title: "Home"
flavor: consumer
components:
  - type: greeting
    id: greeting_text
    content: "Welcome back, Alex"
  - type: account_card
    id: primary_account_card
    account_id: "acc_1"
    show_balance: true
    show_actions: true
  - type: section
    id: recent_transactions_section
    title: "Recent Transactions"
  - type: transaction_list
    id: recent_transactions
    limit: 5
  - type: button
    id: view_all_transactions_button
    label: "View All"
    on_click:
      target: transactions
states:
  - loading
  - content
  - error
navigation:
  - target: transactions
    label: "transactions"
  - target: send_money
    label: "send_money"
  - target: accounts
    label: "accounts"
