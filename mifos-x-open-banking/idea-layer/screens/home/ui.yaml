approve_hash: "sha256:03af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-001]
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-06-06T00:00:00Z"
    by: "/kmp-implement home (default-account picker)"
    contract_version: "1.1.0"
    note: "Hero card is now clickable — opens a reusable AccountPickerBottomSheet (core/ui/picker, M3 ModalBottomSheet, horizontal dividers between account rows, check on the selected row) to choose the persistent default account. Persistence: UserData.defaultAccountId via UserPreferencesRepository (multiplatform-settings, plain storage). The hero card and the send-money hub, standing-orders, and beneficiaries screens all preselect the persisted default (priority: session selection → persisted default → checking-first → first); per-screen switching stays session-local and does not rewrite the default. The sheet is intentionally reusable for future account-selection surfaces."
  - from: approved
    to: approved
    at: "2026-06-07T19:00:00Z"
    by: "banking-services grid updates (user directives)"
    contract_version: "1.1.0"
    note: "Banking Services grid is now: row 1 Standing Orders / Business / Statements(deferred snackbar); row 2 FX Rates / Find ATM / Insights. Two slot changes vs the designed grid: (1) Business Insights tile (Storefront icon) took the Transfers slot — Transfers stays reachable via the hero quick action and the Pay tab; (2) FX Rates tile (CurrencyExchange icon) took the Cards slot — Cards stays reachable via the bottom Cards tab. Both tiles push real feature modules (BusinessInsightsRoute, FxRatesRoute)."
  - from: approved
    to: approved
    at: "2026-06-07T22:00:00Z"
    by: "banking-services grid update (user directive)"
    contract_version: "1.1.0"
    note: "Direct Debits tile (AccountBalanceWallet icon) replaced the Statements tile — Statements has no idea-layer screen and was a permanent dead-end snackbar, while Direct Debits is now a real feature module (DirectDebitsRoute, resolves the persisted-default/checking-first account when opened without arguments). The grid now has zero deferred tiles: row 1 Standing Orders / Business / Direct Debits; row 2 FX Rates / Find ATM / Insights."
  - from: approved
    to: approved
    at: "2026-06-07T22:30:00Z"
    by: "hero simplification (user directive)"
    contract_version: "1.1.0"
    note: "Hero card quick-action chips REMOVED (all four: Transfer / Pay Bill / Top-up / Payees) — the hero is now greeting + default account + balance only, still tappable for the default-account picker. Transfer stays reachable via the Pay tab, Payees via the Send Money hub. Banking Services grid updated again: Pay Bill (Receipt icon, deferred coming-soon snackbar) took the Direct Debits slot; Direct Debits is reachable via Account Detail → ACTIVITY only (account-scoped, deliberate). Grid: row 1 Standing Orders / Business / Pay Bill; row 2 FX Rates / Find ATM / Insights."
  - from: approved
    to: approved
    at: "2026-06-07T23:00:00Z"
    by: "/kmp-implement products (grid update, user directive)"
    contract_version: "1.1.0"
    note: "Pay Bill tile REMOVED entirely (no planned feature behind it) — Products tile (Category icon, real feature module ProductsRoute) takes its slot. The home screen now has zero deferred surfaces: every tile and action lands on a real screen. Grid: row 1 Standing Orders / Business / Products; row 2 FX Rates / Find ATM / Insights. The onDeferred snackbar plumbing was removed from the home navigation chain."


shell:
