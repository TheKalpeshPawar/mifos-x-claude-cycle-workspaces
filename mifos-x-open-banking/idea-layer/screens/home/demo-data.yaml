sibling: demo-data
schema_version: "4.0"
feature_id: home

# OBIE AISP fixtures backing the Home dashboard. Aggregates three reads for the hero default
# account (the current account): get_accounts -> OBReadAccount6, get_balances -> OBReadBalance1
# (InterimAvailable), get_transactions -> OBReadTransaction6 (recent rows). Same James Whitfield
# persona / sort-code 30-00-00 as accounts/account-detail/transactions. Counterparty display uses
# MerchantDetails.MerchantName then TransactionInformation — never a raw account identification.
collections:
  get_accounts:
    dto: OBReadAccount6
    description: "200 OK — authorised accounts; the current account is the hero default selection, count drives the accounts chip."
    item:
      Data:
        Account:
          - AccountId: "acc-jw-current-0001"
            Currency: "GBP"
            AccountTypeCode: "CurrentAccount"
            Nickname: "Everyday Current"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "30000012345678"
                Name: "James Whitfield"
          - AccountId: "acc-jw-savings-0002"
            Currency: "GBP"
            AccountTypeCode: "Savings"
            Nickname: "Online Bonus Saver"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "30000087654321"
                Name: "James Whitfield"
          - AccountId: "acc-jw-credit-0003"
            Currency: "GBP"
            AccountTypeCode: "CurrentAccount"
            Nickname: "Premier Credit Card"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "30000045612378"
                Name: "James Whitfield"
      Links:
        Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts"
      Meta:
        TotalPages: 1

  get_balances:
    dto: OBReadBalance1
    description: "200 OK — InterimAvailable balance for the hero current account (Available Balance)."
    item:
      Data:
        Balance:
          - AccountId: "acc-jw-current-0001"
            Type: "InterimAvailable"
            CreditDebitIndicator: "Credit"
            Amount:
              Amount: "2483.17"
              Currency: "GBP"
      Links:
        Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts/acc-jw-current-0001/balances"
      Meta:
        TotalPages: 1

  get_transactions:
    dto: OBReadTransaction6
    description: "200 OK — recent transactions for the hero current account, newest first (Booked + one Pending)."
    item:
      Data:
        Transaction:
          - TransactionId: "txn-jw-0001"
            CreditDebitIndicator: "Debit"
            Status: "Pending"
            BookingDateTime: "2026-06-12T08:12:44.000Z"
            TransactionInformation: "TFL TRAVEL CH PAYG"
            Amount:
              Amount: "6.80"
              Currency: "GBP"
            MerchantDetails:
              MerchantName: "TfL Travel"
          - TransactionId: "txn-jw-0002"
            CreditDebitIndicator: "Debit"
            Status: "Booked"
            BookingDateTime: "2026-06-11T13:27:09.000Z"
            TransactionInformation: "TESCO STORES 3411 LONDON"
            Amount:
              Amount: "42.16"
              Currency: "GBP"
            MerchantDetails:
              MerchantName: "Tesco Stores"
          - TransactionId: "txn-jw-0003"
            CreditDebitIndicator: "Debit"
            Status: "Booked"
            BookingDateTime: "2026-06-11T08:41:55.000Z"
            TransactionInformation: "PRET A MANGER 247 LONDON"
            Amount:
              Amount: "5.45"
              Currency: "GBP"
            MerchantDetails:
              MerchantName: "Pret A Manger"
          - TransactionId: "txn-jw-0004"
            CreditDebitIndicator: "Credit"
            Status: "Booked"
            BookingDateTime: "2026-06-10T00:05:00.000Z"
            TransactionInformation: "SALARY ACME DIGITAL LTD"
            Amount:
              Amount: "3120.00"
              Currency: "GBP"
            MerchantDetails:
              MerchantName: "Acme Digital Ltd"
          - TransactionId: "txn-jw-0005"
            CreditDebitIndicator: "Debit"
            Status: "Booked"
            BookingDateTime: "2026-06-09T07:00:12.000Z"
            TransactionInformation: "BRITISH GAS DD"
            Amount:
              Amount: "88.40"
              Currency: "GBP"
            MerchantDetails:
              MerchantName: "British Gas"
      Links:
        Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts/acc-jw-current-0001/transactions"
      Meta:
        TotalPages: 1

  # OBErrorResponse1 envelope for the 403/500 error state.
  error:
    dto: OBErrorResponse1
    description: "Representative 500 OBErrorResponse1 driving the home error state."
    item:
      Code: "500 Internal Server Error"
      Id: "e201-err-9f3a"
      Message: "Unexpected error"
      Errors:
        - ErrorCode: "UK.OBIE.UnexpectedError"
          Message: "An unexpected error occurred while retrieving account data."
