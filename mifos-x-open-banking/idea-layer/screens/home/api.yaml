sibling: api
schema_version: "4.0"
feature_id: home
# Reconciled to shipped HomeViewModel.kt on 2026-06-11: Home consumes ONLY the cross-bank
# /my/accounts stream (via AccountsRepository). The per-bank accounts endpoint and the
# home-transactions endpoint were never wired — retained below as deferred references.
api:
  - id: obp_my_accounts_cross_bank
    endpoint: "GET /obp/v3.0.0/my/accounts"
    tag: Accounts
    auth: DirectLogin
    description: "Cross-bank account aggregation — the ONLY endpoint shipped Home calls (AccountsRepository.accountsStream, offline-first Store5 cache-then-network)."
    response:
      fields:
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: label
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
        - name: owners
          type: "List<AccountOwner>"
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 500
        message: "OBP server error"

  - id: obp_get_home_accounts
    deferred: true
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts"
    tag: Accounts
    description: "DEFERRED — per-bank accounts endpoint NOT used by shipped Home (it reads cross-bank /my/accounts instead). Kept for traceability."

  - id: obp_get_home_transactions
    deferred: true
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    tag: Transactions
    description: "DEFERRED — UNUSED in shipped Home. The recent-transactions list was never built on Home."
