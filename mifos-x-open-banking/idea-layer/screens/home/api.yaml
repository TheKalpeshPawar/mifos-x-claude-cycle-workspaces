sibling: api
schema_version: "4.0"
feature_id: home
api:
  - id: obp_get_home_accounts
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts"
    tag: Accounts
    auth: DirectLogin
    params:
      - name: bankId
        type: path
        value: "gh.29.uk"
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: account_routings
          type: "List<AccountRouting>"
    errors:
      - code: 401
        message: "Unauthorized — DirectLogin token missing or expired"
      - code: 404
        message: "Bank not found"
      - code: 500
        message: "OBP server error"

  - id: obp_get_home_transactions
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: accountId
        type: path
      - name: limit
        type: query
        value: "5"
      - name: sort_direction
        type: query
        value: "DESC"
    response:
      fields:
        - name: id
          type: String
        - name: this_account
          type: object
        - name: other_account
          type: object
        - name: details
          type: object
          children:
            - name: type
              type: String
            - name: description
              type: String
            - name: posted
              type: String
            - name: value
              type: object
              children:
                - name: currency
                  type: String
                - name: amount
                  type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

  - id: obp_my_accounts_cross_bank
    endpoint: "GET /obp/v3.0.0/my/accounts"
    tag: Accounts
    description: "Cross-bank account aggregation"
