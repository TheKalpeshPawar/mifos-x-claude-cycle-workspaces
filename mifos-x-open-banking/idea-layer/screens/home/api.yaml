sibling: api
schema_version: "4.0"
feature_id: home
consent:
  required: true
  type: account-access-consent
  permissions: [ReadAccountsBasic, ReadAccountsDetail, ReadBalances, ReadTransactionsBasic, ReadTransactionsDetail]
  token: authorization-code
  note: "All Home reads require an authorised account-access-consent (Status AUTH) plus a scoped authorization-code access token (scope accounts). The consent itself is registered/checked with a client-credentials token; data GETs below use the authorization-code token."
api:
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: Accounts
    auth: OAuth2-FAPI
    demo_source: demo-data.yaml#/collections/get_accounts
    description: "List the AccountId(s) the PSU authorised — feeds the hero default-account selection and the account count. Authorization-code token, scope accounts. OBIE object OBReadAccount6."
    consent_required: true
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].SchemeName
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED — token missing/expired"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus — consent not AUTH"
      - code: 500
        message: "OB.UnexpectedError"

  - id: get_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: Balances
    auth: OAuth2-FAPI
    demo_source: demo-data.yaml#/collections/get_balances
    description: "Available balance for the hero default account (Available Balance). Requires ReadBalances. Authorization-code token. OBIE object OBReadBalance1; multiple balances may return, one per Type — Home surfaces InterimAvailable."
    consent_required: true
    params:
      - name: AccountId
        type: path
    response:
      fields:
        - name: Data.Balance[].AccountId
          type: String
        - name: Data.Balance[].Type
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus — missing ReadBalances"
      - code: 500
        message: "OB.UnexpectedError"

  - id: get_transactions
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    tag: Transactions
    auth: OAuth2-FAPI
    demo_source: demo-data.yaml#/collections/get_transactions
    description: "Recent transactions for the hero default account. Requires ReadTransactionsBasic/Detail. Authorization-code token. Supports fromBookingDateTime/toBookingDateTime; BookingDateTime drives pagination. OBIE object OBReadTransaction6. Counterparty display follows the project counterparty rule — never render a raw CreditorAccount login; prefer MerchantDetails.MerchantName then TransactionInformation."
    consent_required: true
    params:
      - name: AccountId
        type: path
      - name: fromBookingDateTime
        type: query
      - name: toBookingDateTime
        type: query
    response:
      fields:
        - name: Data.Transaction[].TransactionId
          type: String
        - name: Data.Transaction[].CreditDebitIndicator
          type: String
        - name: Data.Transaction[].Status
          type: String
        - name: Data.Transaction[].BookingDateTime
          type: String
        - name: Data.Transaction[].TransactionInformation
          type: String
        - name: Data.Transaction[].Amount.Amount
          type: String
        - name: Data.Transaction[].Amount.Currency
          type: String
        - name: Data.Transaction[].MerchantDetails.MerchantName
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
      - code: 500
        message: "OB.UnexpectedError"
