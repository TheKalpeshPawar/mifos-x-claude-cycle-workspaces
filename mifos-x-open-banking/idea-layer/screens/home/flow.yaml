feature: home
flow_ref: home-dashboard

entry_points:
  - source: app_shell_bottom_nav
    label: "Home tab (bottom-nav order 0)"
  - source: post-login
    label: "Successful FAPI consent callback → land on Home"
  - source: consent-callback
    label: "Successful OAuth callback → land on Home"

transitions:
  - from: home
    to: account-detail
    trigger: "Tap hero balance card"
    params: [accountId]

  - from: home
    to: transactions
    trigger: "Tap Transactions quick action OR 'View all' link in recent transactions"
    params: [accountId]

  - from: home
    to: statements
    trigger: "Tap Statements quick action"
    params: [accountId]

  - from: home
    to: consent-list
    trigger: "Tap Manage consents quick action"

  - from: home
    to: spending-by-category
    trigger: "Tap spending snapshot card"

  - from: home
    to: transaction-detail
    trigger: "Tap a recent transaction row"
    params: [transactionId, accountId]

  - from: home
    to: login
    trigger: "401 — access token expired or no active consent"
    guard: "error.code == 401"

  - from: home
    to: login
    trigger: "Empty state CTA — no authorised accounts or no active consent"
    guard: "state == empty"
