<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="screen-id" content="home">
  <meta name="state" content="error">
  <title>Home — Error · Open Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens: Open Banking Trust Blue (M3) ── */
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-high: #E5E8ED;
      --md-sys-color-outline-variant: #C1C7CE;
      --radius-md: 12px;
      --radius-full: 9999px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #95CDF7;
        --md-sys-color-on-primary: #00344E;
        --md-sys-color-error: #FFB4AB;
        --md-sys-color-on-error: #690005;
        --md-sys-color-error-container: #93000A;
        --md-sys-color-on-error-container: #FFDAD6;
        --md-sys-color-secondary: #B7C9D9;
        --md-sys-color-secondary-container: #384956;
        --md-sys-color-on-secondary-container: #D3E5F5;
        --md-sys-color-background: #101417;
        --md-sys-color-surface: #101417;
        --md-sys-color-on-surface: #E0E3E8;
        --md-sys-color-on-surface-variant: #C1C7CE;
        --md-sys-color-surface-container: #1C2024;
        --md-sys-color-surface-container-high: #262A2E;
        --md-sys-color-outline-variant: #41474D;
      }
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* ── Device shell ── */
    .device-shell {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: var(--md-sys-color-background);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .screen-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 32px 80px;
    }

    /* ── Error state ── */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 48px 0;
    }
    .error-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background: var(--md-sys-color-error-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .error-icon {
      font-size: 40px;
      color: var(--md-sys-color-on-error-container);
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 40;
    }
    .error-title {
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
    }
    .error-body {
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 280px;
    }

    /* Error detail card — shows the error code/context clearly */
    .error-detail-card {
      background: var(--md-sys-color-error-container);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      width: 100%;
      max-width: 300px;
    }
    .error-detail-code {
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      color: var(--md-sys-color-on-error-container);
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .error-detail-message {
      font-size: 13px;
      line-height: 18px;
      color: var(--md-sys-color-on-error-container);
    }

    /* Retry button (filled) */
    .btn-filled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      border-radius: var(--radius-full);
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      border: none;
      cursor: pointer;
      min-height: 40px;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-filled .material-symbols-outlined {
      font-size: 18px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }

    /* ── Bottom navigation ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 80px;
      background: var(--md-sys-color-surface-container);
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      z-index: 10;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      min-width: 48px;
      padding: 12px 4px 8px;
      border: none;
      background: none;
    }
    .nav-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 18px;
      border-radius: var(--radius-full);
    }
    .nav-item.active .nav-indicator {
      background: var(--md-sys-color-secondary-container);
    }
    .nav-icon { font-size: 24px; }
    .nav-item .nav-icon {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .nav-item.active .nav-icon {
      color: var(--md-sys-color-primary);
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .nav-label {
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      letter-spacing: 0.5px;
    }
    .nav-item.active .nav-label { color: var(--md-sys-color-primary); }
  </style>
</head>
<body>
<div class="device-shell">
  <main class="screen-content" role="main" aria-label="Home">

    <!-- Error state — 401 session expired (recoverable=true) -->
    <div
      class="error-state"
      data-component-type="error_state"
      data-component-id="error_home"
      aria-label="Could not load your account"
      role="alert"
    >
      <div class="error-icon-wrap" aria-hidden="true">
        <span
          class="material-symbols-outlined error-icon"
          aria-hidden="true"
        >error_outline</span>
      </div>

      <h1 class="error-title">Could not load your account</h1>

      <p class="error-body">
        Your session has expired. Please sign in again.
      </p>

      <!-- Error detail card: HTTP 401 — gives the user precise context -->
      <div
        class="error-detail-card"
        role="status"
        aria-label="Error detail: 401 Unauthorised"
      >
        <div class="error-detail-code">401 Unauthorised</div>
        <div class="error-detail-message">
          Your access token has expired. Sign in again to refresh your HSBC connection.
        </div>
      </div>

      <!-- Retry button (visible_when: error.recoverable = true) -->
      <button
        class="btn-filled"
        aria-label="Retry loading home screen"
        data-action="retry_load"
        data-component-type="button"
        data-component-id="retry_button"
      >
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
        Retry
      </button>

    </div>

  </main>

  <!-- Bottom navigation — Home active -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <button
      class="nav-item active"
      aria-current="page"
      aria-label="Home"
      data-nav-to="home"
      data-component-type="nav_item"
      data-component-id="nav_home"
    >
      <div class="nav-indicator">
        <span class="material-symbols-outlined nav-icon" aria-hidden="true">home</span>
      </div>
      <span class="nav-label">Home</span>
    </button>
    <button
      class="nav-item"
      aria-label="Accounts"
      data-nav-to="accounts"
      data-component-type="nav_item"
      data-component-id="nav_accounts"
    >
      <div class="nav-indicator">
        <span class="material-symbols-outlined nav-icon" aria-hidden="true">account_balance</span>
      </div>
      <span class="nav-label">Accounts</span>
    </button>
    <button
      class="nav-item"
      aria-label="Transactions"
      data-nav-to="transactions"
      data-component-type="nav_item"
      data-component-id="nav_transactions"
    >
      <div class="nav-indicator">
        <span class="material-symbols-outlined nav-icon" aria-hidden="true">receipt_long</span>
      </div>
      <span class="nav-label">Transactions</span>
    </button>
    <button
      class="nav-item"
      aria-label="More"
      data-nav-to="settings"
      data-component-type="nav_item"
      data-component-id="nav_more"
    >
      <div class="nav-indicator">
        <span class="material-symbols-outlined nav-icon" aria-hidden="true">more_horiz</span>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
