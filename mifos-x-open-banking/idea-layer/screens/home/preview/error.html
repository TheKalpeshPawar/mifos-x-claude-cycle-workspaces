<!doctype html>
<html lang="en" data-screen="home" data-state="error">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Home Dashboard — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --error:#BA1A1A;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.greeting{padding:24px 20px 0;}
.greeting-name{font-size:22px;font-weight:600;color:var(--primary);}
.greeting-date{font-size:14px;color:var(--text-secondary);padding-top:4px;padding-bottom:16px;}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:16px;text-align:center;min-height:calc(844px - 80px - 140px);}
.error-card{background:var(--surface);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.error-icon{width:72px;height:72px;background:#FFDAD6;border-radius:36px;display:flex;align-items:center;justify-content:center;}
.error-icon .mi{font-size:36px;color:var(--error);}
.error-title{font-size:18px;font-weight:600;color:var(--text-primary);}
.error-msg{font-size:13px;color:var(--outline);line-height:1.5;text-align:center;}
.retry-btn{padding:14px 32px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.bottom-nav{position:absolute;bottom:0;left:0;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--surface-variant);display:flex;align-items:flex-start;padding:12px 12px 16px;gap:8px;}
.nav-tab{display:flex;flex-direction:column;align-items:center;width:70px;gap:4px;text-decoration:none;}
.nav-pill{display:flex;align-items:center;justify-content:center;width:64px;height:28px;border-radius:14px;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-icon{font-size:22px;color:var(--outline);font-family:'Material Icons';font-style:normal;}
.nav-tab.active .nav-icon{color:var(--primary);}
.nav-label{font-size:11px;color:var(--outline);font-family:var(--font);}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<div class="greeting">
  <div class="greeting-name">Good morning, Alex</div>
  <div class="greeting-date">Monday, 25 May 2026</div>
</div>

<main>
  <div class="error-card">
    <div class="error-icon">
      <span class="mi">error_outline</span>
    </div>
    <h2 class="error-title">Could not load your account</h2>
    <p class="error-msg">We were unable to fetch your account data. Check your connection and try again.</p>
    <button class="retry-btn" data-action="retry_load">Retry</button>
  </div>
</main>

<nav class="bottom-nav" aria-label="Main navigation">
  <a class="nav-tab active" data-nav-to="home">
    <div class="nav-pill"><span class="nav-icon">home</span></div>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-tab" data-nav-to="accounts">
    <div class="nav-pill"><span class="nav-icon">account_balance</span></div>
    <span class="nav-label">Accounts</span>
  </a>
  <a class="nav-tab" data-nav-to="send-money">
    <div class="nav-pill"><span class="nav-icon">send</span></div>
    <span class="nav-label">Pay</span>
  </a>
  <a class="nav-tab" data-nav-to="cards">
    <div class="nav-pill"><span class="nav-icon">credit_card</span></div>
    <span class="nav-label">Cards</span>
  </a>
  <a class="nav-tab" data-nav-to="more">
    <div class="nav-pill"><span class="nav-icon">more_horiz</span></div>
    <span class="nav-label">More</span>
  </a>
</nav>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
