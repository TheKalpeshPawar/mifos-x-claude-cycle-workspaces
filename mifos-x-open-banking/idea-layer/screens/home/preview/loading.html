<!doctype html>
<html lang="en" data-screen="home" data-state="loading" data-feature="home" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 72px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
    .top-bar-title { font-size: 20px; font-weight: 700; color: var(--primary); }
    .greeting { padding: 4px 20px 0; }
    .greeting h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
    .greeting .date { font-size: 14px; color: var(--on-surface-variant); margin-top: 2px; padding-bottom: 16px; }
    .skeleton { background: var(--surface-variant); border-radius: 20px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .skeleton-card { height: 180px; margin: 0 20px 8px; border-radius: 20px; }
    .skeleton-row { height: 72px; margin: 8px 20px 0; border-radius: 12px; }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 8px 0 12px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; padding: 4px 12px; border-radius: 16px; min-width: 56px; }
    .nav-item .material-icons { font-size: 24px; color: var(--on-surface-variant); }
    .nav-item .nav-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); }
    .nav-item.active .material-icons { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 700; }
    .nav-item.active { background: var(--primary-container); }
  </style>
</head>
<body>
  <main>
    <div class="top-bar"><span class="top-bar-title">Mifos X</span></div>
    <section class="greeting" data-component-type="text" data-component-id="greeting_text">
      <h1 role="heading" aria-level="1">Good morning, Alex</h1>
      <p class="date" data-component-type="text" data-component-id="greeting_date">Monday, 25 May 2026</p>
    </section>
    <div class="skeleton skeleton-card" data-component-type="box" data-component-id="skeleton_account_card" role="progressbar" aria-label="Loading account card"></div>
    <div class="skeleton skeleton-row" data-component-type="box" data-component-id="skeleton_txn_1" role="progressbar" aria-label="Loading transaction"></div>
    <div class="skeleton skeleton-row" data-component-type="box" data-component-id="skeleton_txn_2" role="progressbar" aria-label="Loading transaction"></div>
  </main>
  <nav data-shell="bottom-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-item active" data-nav-to="home" aria-label="Home" aria-current="page"><span class="material-icons">home</span><span class="nav-label">Home</span></a>
    <a class="nav-item" data-nav-to="accounts" aria-label="Accounts"><span class="material-icons">account_balance</span><span class="nav-label">Accounts</span></a>
    <a class="nav-item" data-nav-to="send-money" aria-label="Pay"><span class="material-icons">send</span><span class="nav-label">Pay</span></a>
    <a class="nav-item" data-nav-to="cards" aria-label="Cards"><span class="material-icons">credit_card</span><span class="nav-label">Cards</span></a>
    <a class="nav-item" data-nav-to="settings" aria-label="More"><span class="material-icons">more_horiz</span><span class="nav-label">More</span></a>
  </nav>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
