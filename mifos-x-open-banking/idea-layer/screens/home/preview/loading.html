<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home — loading</title>
<style>
  :root{--primary:#266489;--surface:#F7F9FF;--on-surface:#181C20;--on-surface-variant:#41474D;
        --surface-container:#EBEEF3;--surface-container-high:#E5E8ED;--outline-variant:#C1C7CE;
        --r-sm:8px;--r-md:12px;--r-full:9999px}
  @media (prefers-color-scheme:dark){
    :root{--primary:#95CDF7;--surface:#101417;--on-surface:#E0E3E8;--on-surface-variant:#C1C7CE;
          --surface-container:#1C2024;--surface-container-high:#262A2E;--outline-variant:#41474D}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--surface);color:var(--on-surface);
       font:16px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       display:flex;justify-content:center}
  .device{width:393px;min-height:852px;display:flex;flex-direction:column;background:var(--surface)}
  .statusbar{height:54px;flex:none}
  .appbar{height:56px;flex:none;display:flex;align-items:center;padding:0 16px}
  .title{font-size:22px}
  .scroll{flex:1;padding:12px;display:flex;flex-direction:column;gap:16px}
  .sh{background:var(--surface-container);border-radius:var(--r-sm);position:relative;overflow:hidden}
  .sh::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,var(--surface-container-high),transparent);
    transform:translateX(-100%);animation:shim 1.5s infinite}
  @keyframes shim{100%{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){.sh::after{animation:none;opacity:.5;transform:none}}
  .navbar{height:80px;flex:none;display:flex;background:var(--surface-container);
          border-top:1px solid var(--outline-variant)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
       font-size:12px;color:var(--on-surface-variant)}
  .tab.active{color:var(--primary);font-weight:500}
  .dot{width:24px;height:24px;border-radius:var(--r-full);background:currentColor;opacity:.35}
  .tab.active .dot{opacity:1}
  .safebottom{height:34px;flex:none;background:var(--surface-container)}
</style>
</head>
<body>
<div class="device" data-screen="home" data-state="loading">
  <div class="statusbar"></div>
  <div class="appbar"><div class="title">Home</div></div>
  <div class="scroll">
    <!-- shimmer heights match REAL content exactly, so content arrival causes no layout jump -->
    <div class="sh" style="width:160px;height:24px"></div>
    <div class="sh" style="height:132px;border-radius:var(--r-md)"></div>
    <div class="sh" style="width:80px;height:16px"></div>
    <div class="sh" style="height:64px"></div>
    <div class="sh" style="height:64px"></div>
    <div class="sh" style="height:64px"></div>
  </div>
  <div class="navbar">
    <div class="tab active"><div class="dot"></div>Home</div>
    <div class="tab"><div class="dot"></div>Accounts</div>
    <div class="tab"><div class="dot"></div>Pay</div>
    <div class="tab"><div class="dot"></div>More</div>
  </div>
  <div class="safebottom"></div>
</div>
</body>
</html>
