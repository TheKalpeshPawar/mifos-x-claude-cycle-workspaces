<!doctype html>
<!-- render-hash: home-loading-obie -->
<html lang="en" data-screen="home" data-state="loading" data-feature="home" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Dashboard — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --tertiary: #386663; --on-tertiary: #FFFFFF; --tertiary-container: #BCEBE7; --on-tertiary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px;
      --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px;
      --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-2xl:48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --tertiary: #386663; --on-tertiary: #FFFFFF; --tertiary-container: #BCEBE7; --on-tertiary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --tertiary: #A0CFCB; --on-tertiary: #003735; --tertiary-container: #1F4E4B; --on-tertiary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --tertiary: #A0CFCB; --on-tertiary: #003735; --tertiary-container: #1F4E4B; --on-tertiary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #354E16;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-surface); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; }
    .top-bar { display: flex; align-items: center; gap: var(--sp-md); height: 56px; padding: 0 var(--sp-md); background: var(--background); position: sticky; top: 0; z-index: 10; }
    .top-bar h1 { font-size: 20px; font-weight: 600; color: var(--on-surface); }
    .top-bar .top-action { margin-left: auto; width: 40px; height: 40px; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; color: var(--on-surface-variant); }
    .top-bar .top-action .material-symbols-outlined { font-size: var(--icon-md); }
    .content { padding: var(--sp-xs) 0 var(--sp-lg); }
    @keyframes shimmer { 0% { opacity: 0.55; } 50% { opacity: 1; } 100% { opacity: 0.55; } }
    .sk { background: var(--surface-variant); border-radius: var(--radius-sm); animation: shimmer 1.4s ease-in-out infinite; }
    .hero-sk { background: var(--surface-container); padding: var(--sp-md) 20px var(--sp-lg); }
    .hero-sk .hero-header { display: flex; align-items: flex-start; gap: var(--sp-md); }
    .hero-sk .hero-greeting { flex: 1; }
    .sk-line { height: 12px; }
    .sk-line.w30 { width: 30%; }
    .sk-name { height: 22px; width: 60%; margin-top: var(--sp-sm); }
    .sk-date { height: 10px; width: 40%; margin-top: var(--sp-sm); }
    .sk-avatar { width: 40px; height: 40px; border-radius: var(--radius-pill); flex-shrink: 0; }
    .sk-acct-label { height: 12px; width: 45%; margin-top: 20px; }
    .sk-acct-id { height: 10px; width: 55%; margin-top: var(--sp-sm); }
    .sk-bal-label { height: 10px; width: 35%; margin-top: var(--sp-md); }
    .sk-bal { height: 30px; width: 50%; margin-top: var(--sp-sm); }
    .services-title { padding: var(--sp-md) var(--sp-md) var(--sp-sm); }
    .sk-title { height: 16px; width: 40%; }
    .services-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-md) 12px; padding: 0 var(--sp-md) var(--sp-md); }
    .service-tile-sk { background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--radius-md); padding: 12px; min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-sm); }
    .sk-icon { width: 28px; height: 28px; border-radius: var(--radius-pill); }
    .sk-tile-label { height: 10px; width: 70%; }
    .bottom-spacer { height: var(--sp-lg); }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface-container); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: var(--sp-sm) 0 10px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-xs) 12px; border-radius: var(--radius-lg); min-width: 56px; text-decoration: none; cursor: pointer; }
    .nav-item .material-symbols-outlined { font-size: var(--icon-md); color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
    .nav-item.active { background: var(--nav-active-indicator); }
  </style>
</head>
<body>
  <header class="top-bar" data-component-type="box" data-component-id="top_app_bar">
    <h1 data-component-type="text" data-component-id="top_bar_title" role="heading" aria-level="1">Home Dashboard</h1>
    <span class="top-action" data-component-type="icon" data-component-id="top_bar_notifications" aria-hidden="true">
      <span class="material-symbols-outlined">notifications</span>
    </span>
  </header>

  <main id="main-content" class="content" aria-busy="true" aria-label="Loading your account">
    <div class="hero-sk" data-component-type="card" data-component-id="primary_account_card">
      <div class="hero-header" data-component-type="stack" data-component-id="hero_header_row">
        <div class="hero-greeting" data-component-type="stack" data-component-id="hero_greeting_col">
          <div class="sk sk-line w30" data-component-type="box" data-component-id="hero_greeting_line"></div>
          <div class="sk sk-name" data-component-type="box" data-component-id="hero_greeting_name"></div>
          <div class="sk sk-date" data-component-type="box" data-component-id="hero_greeting_date"></div>
        </div>
        <div class="sk sk-avatar" data-component-type="box" data-component-id="hero_avatar"></div>
      </div>
      <div class="sk sk-acct-label" data-component-type="box" data-component-id="hero_account_label"></div>
      <div class="sk sk-acct-id" data-component-type="box" data-component-id="hero_account_identifier"></div>
      <div class="sk sk-bal-label" data-component-type="box" data-component-id="hero_balance_label"></div>
      <div class="sk sk-bal" data-component-type="box" data-component-id="hero_balance_amount"></div>
    </div>

    <div class="services-title" data-component-type="text" data-component-id="services_section_title">
      <div class="sk sk-title" data-component-type="box"></div>
    </div>

    <div class="services-grid" data-component-type="stack" data-component-id="services_grid">
      <div class="service-tile-sk" data-component-type="card" data-component-id="service_standing_orders">
        <div class="sk sk-icon"></div><div class="sk sk-tile-label"></div>
      </div>
      <div class="service-tile-sk" data-component-type="card" data-component-id="service_business">
        <div class="sk sk-icon"></div><div class="sk sk-tile-label"></div>
      </div>
      <div class="service-tile-sk" data-component-type="card" data-component-id="service_products">
        <div class="sk sk-icon"></div><div class="sk sk-tile-label"></div>
      </div>
      <div class="service-tile-sk" data-component-type="card" data-component-id="service_find_atm">
        <div class="sk sk-icon"></div><div class="sk sk-tile-label"></div>
      </div>
      <div class="service-tile-sk" data-component-type="card" data-component-id="service_insights">
        <div class="sk sk-icon"></div><div class="sk sk-tile-label"></div>
      </div>
    </div>

    <div class="bottom-spacer" data-component-type="spacer" data-component-id="bottom_spacer" aria-hidden="true"></div>
  </main>

  <nav data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item active" data-nav-to="home" data-component-type="nav-item" data-component-id="nav_home" aria-current="page" aria-label="Home">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item" data-nav-to="accounts" data-component-type="nav-item" data-component-id="nav_accounts" aria-label="Accounts">
      <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      <span class="nav-label">Accounts</span>
    </a>
    <a class="nav-item" data-nav-to="pay" data-component-type="nav-item" data-component-id="nav_pay" aria-label="Pay">
      <span class="material-symbols-outlined" aria-hidden="true">send</span>
      <span class="nav-label">Pay</span>
    </a>
    <a class="nav-item" data-nav-to="pfm-dashboard" data-component-type="nav-item" data-component-id="nav_insights" aria-label="Insights">
      <span class="material-symbols-outlined" aria-hidden="true">insights</span>
      <span class="nav-label">Insights</span>
    </a>
    <a class="nav-item" data-nav-to="settings" data-component-type="nav-item" data-component-id="nav_more" aria-label="More">
      <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      <span class="nav-label">More</span>
    </a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
