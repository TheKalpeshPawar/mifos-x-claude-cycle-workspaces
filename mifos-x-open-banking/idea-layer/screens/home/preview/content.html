<!doctype html>
<!-- render-hash: home-content-obie -->
<html lang="en" data-screen="home" data-state="content" data-feature="home" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Dashboard — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --tertiary: #386663; --on-tertiary: #FFFFFF; --tertiary-container: #BCEBE7; --on-tertiary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px;
      --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px;
      --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-2xl:48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --tertiary: #386663; --on-tertiary: #FFFFFF; --tertiary-container: #BCEBE7; --on-tertiary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --tertiary: #A0CFCB; --on-tertiary: #003735; --tertiary-container: #1F4E4B; --on-tertiary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --tertiary: #A0CFCB; --on-tertiary: #003735; --tertiary-container: #1F4E4B; --on-tertiary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D; --scrim: #000000;
      --pending: #E8A317; --nav-active-indicator: #354E16;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-surface); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; }
    .top-bar { display: flex; align-items: center; gap: var(--sp-md); height: 56px; padding: 0 var(--sp-md); background: var(--background); position: sticky; top: 0; z-index: 10; }
    .top-bar h1 { font-size: 20px; font-weight: 600; color: var(--on-surface); }
    .top-bar .top-action { margin-left: auto; width: 40px; height: 40px; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; color: var(--on-surface-variant); background: none; border: 0; cursor: pointer; }
    .top-bar .top-action .material-symbols-outlined { font-size: var(--icon-md); }
    .content { padding: var(--sp-xs) 0 var(--sp-lg); }
    .hero { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--on-primary); padding: var(--sp-md) 20px var(--sp-lg); cursor: pointer; display: block; width: 100%; text-align: left; border: 0; font-family: var(--font-display); }
    .hero-header { display: flex; align-items: flex-start; gap: var(--sp-md); }
    .hero-greeting { flex: 1; min-width: 0; }
    .hero-line { font-size: 13px; font-weight: 500; color: var(--on-primary); opacity: 0.85; }
    .hero-name { font-size: 22px; font-weight: 700; color: var(--on-primary); margin-top: 2px; }
    .hero-date { font-size: 12px; font-weight: 400; color: var(--on-primary); opacity: 0.70; margin-top: var(--sp-xs); }
    .hero-avatar { width: 40px; height: 40px; border-radius: var(--radius-pill); background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .hero-avatar span { font-size: 14px; font-weight: 600; color: var(--on-primary); }
    .hero-account-label { font-size: 13px; font-weight: 500; color: var(--on-primary); opacity: 0.85; margin-top: 20px; }
    .hero-account-id { font-size: 12px; font-weight: 400; font-family: 'Outfit', monospace; color: var(--on-primary); opacity: 0.65; margin-top: var(--sp-xs); }
    .hero-balance-label { font-size: 12px; font-weight: 400; color: var(--on-primary); opacity: 0.80; margin-top: var(--sp-md); }
    .hero-balance { font-size: 30px; font-weight: 700; color: var(--on-primary); margin-top: 2px; }
    .services-title { font-size: 16px; font-weight: 600; color: var(--on-surface); padding: var(--sp-md) var(--sp-md) var(--sp-sm); display: flex; align-items: center; }
    .services-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-md) 12px; padding: 0 var(--sp-md) var(--sp-md); }
    .service-tile { background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--radius-md); padding: 12px; min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-sm); cursor: pointer; text-decoration: none; }
    .service-tile .material-symbols-outlined { color: var(--primary); font-size: 28px; }
    .service-tile .label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); text-align: center; }
    .bottom-spacer { height: var(--sp-lg); }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface-container); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: var(--sp-sm) 0 10px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: var(--sp-xs) 12px; border-radius: var(--radius-lg); min-width: 56px; text-decoration: none; }
    .nav-item .material-symbols-outlined { font-size: var(--icon-md); color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
    .nav-item.active { background: var(--nav-active-indicator); }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { left: var(--sp-sm); top: var(--sp-sm); background: var(--primary); color: var(--on-primary); padding: var(--sp-sm); border-radius: var(--radius-sm); z-index: 100; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="top-bar" data-component-type="box" data-component-id="top_app_bar">
    <h1 data-component-type="text" data-component-id="top_bar_title" role="heading" aria-level="1">Home Dashboard</h1>
    <button class="top-action" type="button" data-action="open_notifications" data-component-type="icon" data-component-id="top_bar_notifications" aria-label="Notifications">
      <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
    </button>
  </header>

  <main id="main-content" class="content">
    <button class="hero" type="button" data-action="open_default_account_picker" data-component-type="card" data-component-id="primary_account_card" aria-label="Account hero. Tap to choose your default account.">
      <div class="hero-header" data-component-type="stack" data-component-id="hero_header_row">
        <div class="hero-greeting" data-component-type="stack" data-component-id="hero_greeting_col">
          <div class="hero-line" data-component-type="text" data-component-id="hero_greeting_line">Good morning</div>
          <div class="hero-name" data-component-type="text" data-component-id="hero_greeting_name" role="heading" aria-level="2">Hello, James Whitfield</div>
          <div class="hero-date" data-component-type="text" data-component-id="hero_greeting_date">Friday, 12 June 2026</div>
        </div>
        <div class="hero-avatar" data-component-type="box" data-component-id="hero_avatar" role="img" aria-label="Account owner avatar: James Whitfield">
          <span data-component-type="text" data-component-id="hero_avatar_initials">JW</span>
        </div>
      </div>
      <div class="hero-account-label" data-component-type="text" data-component-id="hero_account_label">Everyday Current</div>
      <div class="hero-account-id" data-component-type="text" data-component-id="hero_account_identifier" aria-label="Account identifier sort code 30-00-00, account ending 5678">30-00-00 · ••••5678</div>
      <div class="hero-balance-label" data-component-type="text" data-component-id="hero_balance_label">Available Balance</div>
      <div class="hero-balance" data-component-type="text" data-component-id="hero_balance_amount" aria-label="Available balance two thousand four hundred eighty three pounds seventeen pence">£2,483.17</div>
    </button>

    <h2 class="services-title" data-component-type="text" data-component-id="services_section_title" role="heading" aria-level="2">Banking Services</h2>

    <div class="services-grid" data-component-type="stack" data-component-id="services_grid" role="list">
      <a class="service-tile" data-nav-to="standing-orders" data-component-type="card" data-component-id="service_standing_orders" role="listitem" aria-label="Standing Orders">
        <span class="material-symbols-outlined" aria-hidden="true" data-component-type="icon" data-component-id="service_standing_orders_icon">event_repeat</span>
        <span class="label" data-component-type="text" data-component-id="service_standing_orders_label">Standing Orders</span>
      </a>
      <a class="service-tile" data-nav-to="business-insights" data-component-type="card" data-component-id="service_business" role="listitem" aria-label="Business">
        <span class="material-symbols-outlined" aria-hidden="true" data-component-type="icon" data-component-id="service_business_icon">storefront</span>
        <span class="label" data-component-type="text" data-component-id="service_business_label">Business</span>
      </a>
      <a class="service-tile" data-nav-to="products" data-component-type="card" data-component-id="service_products" role="listitem" aria-label="Products">
        <span class="material-symbols-outlined" aria-hidden="true" data-component-type="icon" data-component-id="service_products_icon">category</span>
        <span class="label" data-component-type="text" data-component-id="service_products_label">Products</span>
      </a>
      <a class="service-tile" data-nav-to="atm-locator" data-component-type="card" data-component-id="service_find_atm" role="listitem" aria-label="Find ATM">
        <span class="material-symbols-outlined" aria-hidden="true" data-component-type="icon" data-component-id="service_find_atm_icon">location_on</span>
        <span class="label" data-component-type="text" data-component-id="service_find_atm_label">Find ATM</span>
      </a>
      <a class="service-tile" data-nav-to="pfm-dashboard" data-component-type="card" data-component-id="service_insights" role="listitem" aria-label="Insights">
        <span class="material-symbols-outlined" aria-hidden="true" data-component-type="icon" data-component-id="service_insights_icon">pie_chart</span>
        <span class="label" data-component-type="text" data-component-id="service_insights_label">Insights</span>
      </a>
    </div>

    <div class="bottom-spacer" data-component-type="spacer" data-component-id="bottom_spacer" aria-hidden="true"></div>
  </main>

  <nav data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item active" data-nav-to="home" data-component-type="nav-item" data-component-id="nav_home" aria-current="page" aria-label="Home">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item" data-nav-to="accounts" data-component-type="nav-item" data-component-id="nav_accounts" aria-label="Accounts">
      <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      <span class="nav-label">Accounts</span>
    </a>
    <a class="nav-item" data-nav-to="send-money" data-component-type="nav-item" data-component-id="nav_pay" aria-label="Pay">
      <span class="material-symbols-outlined" aria-hidden="true">send</span>
      <span class="nav-label">Pay</span>
    </a>
    <a class="nav-item" data-nav-to="cards" data-component-type="nav-item" data-component-id="nav_cards" aria-label="Cards">
      <span class="material-symbols-outlined" aria-hidden="true">credit_card</span>
      <span class="nav-label">Cards</span>
    </a>
    <a class="nav-item" data-nav-to="settings" data-component-type="nav-item" data-component-id="nav_more" aria-label="More">
      <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      <span class="nav-label">More</span>
    </a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
