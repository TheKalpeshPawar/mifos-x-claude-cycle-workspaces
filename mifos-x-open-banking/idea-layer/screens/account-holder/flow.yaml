feature: account-holder
flow_ref: account-browsing

entry_points:
  - source: account-detail
    label: "Explore chip 'Party' in account-detail -> navigate(AccountHolderRoute(accountId))"
    source_binding: "AccountDetailChip.Party in AuthenticatedNavbarNavigationScreen.navigateFromChip()"

transitions:
  - from: account-holder
    to: account-detail
    trigger: "Back navigation (top_app_bar leading icon)"
    source_binding: "accountHolderScreen(onBack = { navController.popBackStack() })"

# No outbound consent-list transition: source classifies HTTP 403 as
# AccountHolderErrorKind.ConsentMissingParty and renders it on the shared error
# surface with the retry CTA suppressed. There is no re-authorise navigation.
