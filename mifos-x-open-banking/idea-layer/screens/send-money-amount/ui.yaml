sibling: ui
feature_id: send-money-amount
id: send-money-amount
name: Send Money
feature: send-money-amount
flavor: consumer
status: approved
quality_score: 90
contract_version: "2.0.0"
approved_at: "2026-06-11T14:45:00Z"
approved_by: "/idea approve"
capabilities:
  - has_ui
status_history:
  - to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back, new screen from shipped code)"
    note: "Created from shipped SendMoneyScreen.kt + SendMoneyViewModel. Amount/beneficiary/rail-selection form between the hub and confirm: live funds-available pre-flight on Continue, emits a PaymentDraft. Reuses the send-money/api.yaml sibling content (v3 accounts + funds-available + counterparties) which actually described this screen."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

screens:
  - id: send-money-amount
    name: Send Money
    archetype: form
    shell:
      top_bar:
        title: "Send Money"
        navigation_icon: arrow_back
        actions: []
      bottom_nav: false

archetype: form

components:
  - type: list_item
    id: from_account_selector
    label: "From Account"
    content: "Primary Checking — €4,820.00"
    supported_states: [idle, focus_visible, pressed]
    style:
      variant: outlined
      leading_icon: account_balance
      trailing_icon: expand_more
      corner_radius: 12
    on_click:
      action: select_account
      target: ""
    a11y:
      label: "From account. Tap to choose another account."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: from_account

  - type: input
    id: amount_input
    label: "Amount"
    content: ""
    supported_states: [idle, focus_visible, error, disabled]
    style:
      variant: outlined
      prefix: "€"
      placeholder: "0.00"
      keyboard_type: decimal
      corner_radius: 12
    validation:
      required: true
      rule: "amount > 0"
      error_message: "Please enter a valid amount greater than 0"
    a11y:
      label: "Amount to send"
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: amount_input

  - type: text
    id: to_label
    label: "To"
    content: "To"
    style:
      typography: "Outfit/label_large"
      color: "#44483D"
    a11y:
      label: "Beneficiary section"
      role: heading
    test_context:
      tag: to_label

  - type: input
    id: beneficiary_search
    label: "Search beneficiary"
    content: ""
    supported_states: [idle, focus_visible, error]
    style:
      variant: outlined
      leading_icon: search
      placeholder: "Search beneficiary..."
      corner_radius: 12
    validation:
      required: true
      error_message: "Please select a valid beneficiary"
    on_click:
      action: filter_beneficiaries
      target: ""
    a11y:
      label: "Search beneficiaries"
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: beneficiary_search

  - type: list_item
    id: beneficiary_row
    label: "Beneficiary"
    content: "Liam Walker"
    style:
      background: "#FFFFFF"
      border_radius: 12
      border_color: "#E1E4D5"
      border_width: 1
      padding: 12
    on_click:
      action: select_beneficiary
      target: ""
    a11y:
      label: "Select this beneficiary"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: beneficiary_row

  - type: input
    id: reference_input
    label: "Reference"
    content: ""
    supported_states: [idle, focus_visible]
    style:
      variant: outlined
      placeholder: "Payment for invoice #1234"
      supporting_text: "Max 35 characters"
      corner_radius: 12
    validation:
      max_length: 35
    a11y:
      label: "Payment reference, optional"
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: reference_input

  - type: text
    id: schedule_section_label
    label: "When to pay"
    content: "WHEN TO PAY"
    style:
      typography: "Outfit/label_large"
      color: "#44483D"
    a11y:
      label: "When to pay section"
      role: heading
    test_context:
      tag: schedule_section_label

  - type: input
    id: schedule_date_field
    label: "Payment date"
    content: ""
    supported_states: [idle, focus_visible, error]
    style:
      variant: outlined
      leading_icon: event
      placeholder: "Choose a date"
      keyboard_type: date
      corner_radius: 12
    validation:
      required: true
      rule: "date >= today"
      error_message: "Choose today or a future date"
    a11y:
      label: "Payment date. Shown for scheduled and recurring payments."
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: schedule_date_field

  - type: chip_group
    id: recurring_frequency_chips
    label: "Frequency"
    content: "Weekly · Monthly · Quarterly · Yearly"
    supported_states: [idle, selected, disabled]
    style:
      variant: filter
    on_click:
      action: select_frequency
      target: ""
    a11y:
      label: "How often the payment repeats. Shown for recurring payments."
      role: radiogroup
    keyboard:
      focusable: true
    test_context:
      tag: recurring_frequency_chips

  - type: input
    id: recurring_end_field
    label: "Until"
    content: ""
    supported_states: [idle, focus_visible]
    style:
      variant: outlined
      leading_icon: event_repeat
      placeholder: "No end date"
      supporting_text: "Leave blank to repeat until you cancel"
      corner_radius: 12
    a11y:
      label: "Final payment date, optional. Shown for recurring payments."
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: recurring_end_field

  - type: text
    id: payment_type_label
    label: "Payment Type"
    content: "Payment Type"
    style:
      typography: "Outfit/label_large"
      color: "#44483D"
    a11y:
      label: "Payment type section"
      role: heading
    test_context:
      tag: payment_type_label

  - type: chip_group
    id: payment_type_chips
    label: "Payment rail"
    content: "SEPA · Domestic · International"
    supported_states: [idle, selected, disabled]
    style:
      variant: filter
    on_click:
      action: select_payment_type
      target: ""
    a11y:
      label: "Choose payment rail. Ineligible rails are disabled with a reason."
      role: radiogroup
    keyboard:
      focusable: true
    test_context:
      tag: payment_type_chips

  - type: text
    id: rail_ineligible_reason
    label: "Rail unavailable reason"
    content: "International unavailable — no BIC on file for this beneficiary"
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
    a11y:
      label: "Reason a rail is unavailable"
      role: text
    test_context:
      tag: rail_ineligible_reason

  - type: box
    id: fee_banner
    label: "Estimated fee"
    content: "Estimated fee: Free (SEPA)"
    style:
      background: "#CDEDA3"
      corner_radius: 8
      padding_horizontal: 16
      padding_vertical: 12
      leading_icon: info
      text_color: "#102000"
    a11y:
      label: "Estimated fee for the selected rail"
      role: text
    test_context:
      tag: fee_banner

  - type: text
    id: internal_transfer_note
    label: "Internal bank transfer note"
    content: "Internal bank transfer — sent instantly within the bank."
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
    a11y:
      label: "Internal bank transfer, sent instantly within the bank"
      role: text
    test_context:
      tag: internal_transfer_note

  - type: text
    id: sandbox_block_reason
    label: "Sandbox block reason"
    content: "On the sandbox, amounts this large can only be sent to accounts within the bank."
    style:
      typography: "Outfit/body_small"
      color: "#BA1A1A"
    a11y:
      label: "Sandbox payment restriction"
      role: alert
    test_context:
      tag: sandbox_block_reason

  - type: button
    id: continue_button
    label: "Continue"
    supported_states: [idle, focus_visible, pressed, disabled, loading]
    style:
      variant: filled
      corner_radius: 12
      full_width: true
      height: 52
    on_click:
      action: continue
      target: send-money-confirm
    a11y:
      label: "Continue to confirm payment"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: continue_button
      assert_text: "Continue"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout:
      visible_components: []
      show_progress_indicator: true
  content:
    layout:
      visible_components:
        - from_account_selector
        - amount_input
        - to_label
        - beneficiary_search
        - beneficiary_row
        - reference_input
        - schedule_section_label
        - schedule_date_field
        - recurring_frequency_chips
        - recurring_end_field
        - payment_type_label
        - payment_type_chips
        - rail_ineligible_reason
        - fee_banner
        - continue_button
    note: "Default form, kind-aware (nav param `kind` ∈ {now, scheduled, recurring}). kind=now: the WHEN TO PAY block (schedule_section_label + schedule_date_field + recurring_frequency_chips + recurring_end_field) is HIDDEN — amount/beneficiary/rail only. kind=scheduled: schedule_section_label + schedule_date_field shown (single execution date ≥ today); frequency/end hidden. kind=recurring: schedule_section_label + schedule_date_field (first payment) + recurring_frequency_chips + recurring_end_field (optional 'until') shown. When useSandboxTan: payment_type_chips + fee_banner + rail_ineligible_reason are replaced by internal_transfer_note. When the beneficiary is preselected (preselectedCounterpartyId), beneficiary_search is hidden and a single locked beneficiary_row is shown. sandbox_block_reason + the form error line appear only when set. Continue label shows 'Checking...' while the funds check runs and carries `kind` forward in the PaymentDraft to send-money-confirm."
  empty:
    layout:
      visible_components: []
      show_empty_state: true
      empty_state_message: "No accounts available to send from."
  error:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Could not load payment form"
      error_message: "Check your connection and try again"
      show_retry_button: true
  no_network:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Could not load payment form"
      error_message: "Check your connection and try again"
      show_retry_button: true
  unauthenticated:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Could not load payment form"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: SendMoneyViewModel
  ui_state_type: "ScreenState<SendMoneyContent>"
  content_type: SendMoneyContent
  content_fields:
    - { name: accounts, type: "List<OBReadAccount6>" }
    - { name: selectedAccount, type: OBReadAccount6 }
    - { name: beneficiaries, type: "List<OBReadBeneficiary5>" }
    - { name: recentBeneficiaries, type: "List<OBReadBeneficiary5>" }
    - { name: selectedBeneficiary, type: "OBReadBeneficiary5?" }
    - { name: amount, type: "String (Data.InstructedAmount.Amount)" }
    - { name: currency, type: "String (Data.InstructedAmount.Currency, ISO 4217)" }
    - { name: reference, type: String }
    - { name: query, type: String }
    - { name: kind, type: "PaymentKind (now | scheduled | recurring)" }
    - { name: scheduleDate, type: "String? (ISO date; Data.Initiation.RequestedExecutionDateTime for scheduled, FirstPaymentDateTime for recurring)" }
    - { name: frequency, type: "StandingOrderFrequency? (Data.Initiation.Frequency, e.g. EvryWorkgDay/IntrvlMnthDay; recurring only)" }
    - { name: recurringEnd, type: "String? (Data.Initiation.FinalPaymentDateTime; recurring only, optional)" }
    - { name: paymentType, type: PaymentType }
    - { name: railAssessments, type: "Map<PaymentType, RailAssessment>" }
    - { name: fundsAvailable, type: "Boolean? (Data.FundsAvailable)" }
    - { name: amountError, type: "String?" }
    - { name: beneficiaryError, type: "String?" }
    - { name: formError, type: "String?" }
    - { name: submitting, type: Boolean }
    - { name: useSandboxTan, type: Boolean }
    - { name: sandboxBlockReason, type: "String?" }
    - { name: continueEnabled, type: Boolean, derived: true }
  state_field_types:
    - name: balance
      type: "Data.Balance[].Amount.Amount (String) + Data.Balance[].Amount.Currency (String); Type InterimAvailable"
    - name: account.id
      type: "Data.Account[].AccountId (String)"
    - name: account.currency
      type: "Data.Account[].Currency (String)"
    - name: beneficiary.id
      type: "Data.Beneficiary[].BeneficiaryId (String)"
    - name: beneficiary.name
      type: "Data.Beneficiary[].CreditorAccount.Name (String)"
    - name: beneficiary.identification
      type: "Data.Beneficiary[].CreditorAccount.Identification (String)"
    - name: beneficiary.scheme
      type: "Data.Beneficiary[].CreditorAccount.SchemeName (String)"
    - name: fundsAvailable
      type: "Data.FundsAvailable (Boolean) from CBPII; or Data.FundsAvailableResult.FundsAvailable (Boolean) from the PISP domestic-payment-consent funds-confirmation"
  internal_form_state:
    type: FormState
    fields: [accountId, amount, currency, beneficiaryId, reference, query, paymentType, amountError, beneficiaryError, formError, submitting]
  states:
    - Loading
    - Content
    - Empty
    - Error
    - NoNetwork
    - Unauthenticated
  events:
    - setAccount
    - onAmountChanged
    - onBeneficiaryQueryChanged
    - onBeneficiarySelected
    - onReferenceChanged
    - onPaymentTypeChanged
    - onScheduleDateChanged
    - onFrequencyChanged
    - onRecurringEndChanged
    - onRetry
    - onContinue
  actions:
    - select_account
    - select_beneficiary
    - filter_beneficiaries
    - select_payment_type
    - select_frequency
    - continue
  nav_params:
    - { name: kind, type: "PaymentKind", default: "now", note: "enum PaymentKind { now, scheduled, recurring }, carried from the Pay hub kind chooser. Drives which scheduling fields show (none for now; schedule_date for scheduled; recurring_frequency + recurring_start_date + recurring_end for recurring), the screen title, and which payment-consent the downstream authorise-handoff stages (domestic-payment-consent for now; domestic-scheduled-payment-consent for scheduled; domestic-standing-order-consent for recurring)." }
    - { name: preselectedCounterpartyId, type: String, default: "" }
    - { name: accountId, type: String, default: "" }
  callbacks:
    - name: onContinue
      signature: "(PaymentDraft) -> Unit"
      consumer: send-money-confirm
    - name: onBack
      signature: "() -> Unit"
  collaborators:
    - PaymentRailClassifier
  di:
    - AccountsRepository
    - PaymentsRepository
    - BanksRepository
    - "isSandbox (named qualifier)"

api:
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: AISP
    description: "The From Account picker. Requires an authorised account-access-consent (Status AUTH) + an authorization-code token (scope accounts)."
    response:
      fields:
        - { name: "Data.Account[].AccountId", type: String }
        - { name: "Data.Account[].Nickname", type: String }
        - { name: "Data.Account[].Currency", type: String }
        - { name: "Data.Account[].Account[].Identification", type: String }
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: AISP
    description: "Live balance for the selected source account — drives the amount-affordability hint and the amount-entry currency prefix. Requires ReadBalances. Prefer Type InterimAvailable."
    response:
      fields:
        - { name: "Data.Balance[].Amount.Amount", type: String }
        - { name: "Data.Balance[].Amount.Currency", type: String }
        - { name: "Data.Balance[].Type", type: String }
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/beneficiaries"
    tag: AISP
    description: "Beneficiary list for the selected account (reloads on account switch). Requires ReadBeneficiariesBasic/Detail. CreditorAccount.SchemeName drives rail classification."
    response:
      fields:
        - { name: "Data.Beneficiary[].BeneficiaryId", type: String }
        - { name: "Data.Beneficiary[].CreditorAccount.Name", type: String }
        - { name: "Data.Beneficiary[].CreditorAccount.SchemeName", type: String }
        - { name: "Data.Beneficiary[].CreditorAccount.Identification", type: String }
  - endpoint: "POST /obie/open-banking/v4.0/cbpii/funds-confirmations"
    tag: CBPII
    description: "Confirmation-of-Funds check on Continue — confirms the entered amount is available on the source account against a funds-confirmation-consent. Requires an authorization-code token (scope fundsconfirmations) + a ConsentId in the payload; InstructedAmount.Currency must equal the account currency. Surfaces Data.FundsAvailable. ALTERNATIVE when a domestic-payment-consent (Status AUTH) already exists: GET /obie/open-banking/v4.0/pisp/domestic-payment-consents/{ConsentId}/funds-confirmation → Data.FundsAvailableResult.FundsAvailable."
    request:
      fields:
        - { name: Data.ConsentId, type: String }
        - { name: Data.Reference, type: String }
        - { name: Data.InstructedAmount.Amount, type: String }
        - { name: Data.InstructedAmount.Currency, type: String }
    response:
      fields:
        - { name: Data.FundsConfirmationId, type: String }
        - { name: Data.FundsAvailable, type: Boolean }
        - { name: Data.ConsentId, type: String }
    errors:
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries
    - send-money
    - send-money-confirm
