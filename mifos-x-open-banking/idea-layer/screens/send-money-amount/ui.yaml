id: send-money-amount
name: Send Money
feature: send-money-amount
flavor: consumer
status: enriched
quality_score: 90
contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back, new screen from shipped code)"
    note: "Created from shipped SendMoneyScreen.kt + SendMoneyViewModel. Amount/beneficiary/rail-selection form between the hub and confirm: live funds-available pre-flight on Continue, emits a PaymentDraft. Reuses the send-money/api.yaml sibling content (v3 accounts + funds-available + counterparties) which actually described this screen."

screens:
  - id: send-money-amount
    name: Send Money
    archetype: form
    shell:
      top_bar:
        title: "Send Money"
        navigation_icon: arrow_back
        actions: []
      bottom_nav: false

archetype: form

components:
  - type: list_item
    id: from_account_selector
    label: "From Account"
    content: "Primary Checking — €4,820.00"
    supported_states: [idle, focus_visible, pressed]
    style:
      variant: outlined
      leading_icon: account_balance
      trailing_icon: expand_more
      corner_radius: 12
    on_click:
      action: select_account
      target: ""
    a11y:
      label: "From account. Tap to choose another account."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: from_account

  - type: input
    id: amount_input
    label: "Amount"
    content: ""
    supported_states: [idle, focus_visible, error, disabled]
    style:
      variant: outlined
      prefix: "€"
      placeholder: "0.00"
      keyboard_type: decimal
      corner_radius: 12
    validation:
      required: true
      rule: "amount > 0"
      error_message: "Please enter a valid amount greater than 0"
    a11y:
      label: "Amount to send"
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: amount_input

  - type: text
    id: to_label
    label: "To"
    content: "To"
    style:
      typography: "Outfit/label_large"
      color: "#44483D"
    a11y:
      label: "Beneficiary section"
      role: heading
    test_context:
      tag: to_label

  - type: input
    id: beneficiary_search
    label: "Search beneficiary"
    content: ""
    supported_states: [idle, focus_visible, error]
    style:
      variant: outlined
      leading_icon: search
      placeholder: "Search beneficiary..."
      corner_radius: 12
    validation:
      required: true
      error_message: "Please select a valid beneficiary"
    on_click:
      action: filter_beneficiaries
      target: ""
    a11y:
      label: "Search beneficiaries"
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: beneficiary_search

  - type: list_item
    id: beneficiary_row
    label: "Beneficiary"
    content: "Liam Walker"
    style:
      background: "#FFFFFF"
      border_radius: 12
      border_color: "#E1E4D5"
      border_width: 1
      padding: 12
    on_click:
      action: select_beneficiary
      target: ""
    a11y:
      label: "Select this beneficiary"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: beneficiary_row

  - type: input
    id: reference_input
    label: "Reference"
    content: ""
    supported_states: [idle, focus_visible]
    style:
      variant: outlined
      placeholder: "Payment for invoice #1234"
      supporting_text: "Max 35 characters"
      corner_radius: 12
    validation:
      max_length: 35
    a11y:
      label: "Payment reference, optional"
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: reference_input

  - type: text
    id: payment_type_label
    label: "Payment Type"
    content: "Payment Type"
    style:
      typography: "Outfit/label_large"
      color: "#44483D"
    a11y:
      label: "Payment type section"
      role: heading
    test_context:
      tag: payment_type_label

  - type: chip_group
    id: payment_type_chips
    label: "Payment rail"
    content: "SEPA · Domestic · International"
    supported_states: [idle, selected, disabled]
    style:
      variant: filter
    on_click:
      action: select_payment_type
      target: ""
    a11y:
      label: "Choose payment rail. Ineligible rails are disabled with a reason."
      role: radiogroup
    keyboard:
      focusable: true
    test_context:
      tag: payment_type_chips

  - type: text
    id: rail_ineligible_reason
    label: "Rail unavailable reason"
    content: "International unavailable — no BIC on file for this beneficiary"
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
    a11y:
      label: "Reason a rail is unavailable"
      role: text
    test_context:
      tag: rail_ineligible_reason

  - type: box
    id: fee_banner
    label: "Estimated fee"
    content: "Estimated fee: Free (SEPA)"
    style:
      background: "#CDEDA3"
      corner_radius: 8
      padding_horizontal: 16
      padding_vertical: 12
      leading_icon: info
      text_color: "#102000"
    a11y:
      label: "Estimated fee for the selected rail"
      role: text
    test_context:
      tag: fee_banner

  - type: text
    id: internal_transfer_note
    label: "Internal bank transfer note"
    content: "Internal bank transfer — sent instantly within the bank."
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
    a11y:
      label: "Internal bank transfer, sent instantly within the bank"
      role: text
    test_context:
      tag: internal_transfer_note

  - type: text
    id: sandbox_block_reason
    label: "Sandbox block reason"
    content: "On the sandbox, amounts this large can only be sent to accounts within the bank."
    style:
      typography: "Outfit/body_small"
      color: "#BA1A1A"
    a11y:
      label: "Sandbox payment restriction"
      role: alert
    test_context:
      tag: sandbox_block_reason

  - type: button
    id: continue_button
    label: "Continue"
    supported_states: [idle, focus_visible, pressed, disabled, loading]
    style:
      variant: filled
      corner_radius: 12
      full_width: true
      height: 52
    on_click:
      action: continue
      target: send-money-confirm
    a11y:
      label: "Continue to confirm payment"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: continue_button
      assert_text: "Continue"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout:
      visible_components: []
      show_progress_indicator: true
  content:
    layout:
      visible_components:
        - from_account_selector
        - amount_input
        - to_label
        - beneficiary_search
        - beneficiary_row
        - reference_input
        - payment_type_label
        - payment_type_chips
        - rail_ineligible_reason
        - fee_banner
        - continue_button
    note: "Default form. When useSandboxTan: payment_type_chips + fee_banner + rail_ineligible_reason are replaced by internal_transfer_note. When the beneficiary is preselected (preselectedCounterpartyId), beneficiary_search is hidden and a single locked beneficiary_row is shown. sandbox_block_reason + the form error line appear only when set. Continue label shows 'Checking...' while the funds check runs."
  empty:
    layout:
      visible_components: []
      show_empty_state: true
      empty_state_message: "No accounts available to send from."
  error:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Could not load payment form"
      error_message: "Check your connection and try again"
      show_retry_button: true
  no_network:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Could not load payment form"
      error_message: "Check your connection and try again"
      show_retry_button: true
  unauthenticated:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Could not load payment form"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: SendMoneyViewModel
  ui_state_type: "ScreenState<SendMoneyContent>"
  content_type: SendMoneyContent
  content_fields:
    - { name: accounts, type: List<Account> }
    - { name: selectedAccount, type: Account }
    - { name: beneficiaries, type: List<Counterparty> }
    - { name: recentBeneficiaries, type: List<Counterparty> }
    - { name: selectedBeneficiary, type: "Counterparty?" }
    - { name: amount, type: String }
    - { name: currency, type: String }
    - { name: reference, type: String }
    - { name: query, type: String }
    - { name: paymentType, type: PaymentType }
    - { name: railAssessments, type: "Map<PaymentType, RailAssessment>" }
    - { name: amountError, type: "String?" }
    - { name: beneficiaryError, type: "String?" }
    - { name: formError, type: "String?" }
    - { name: submitting, type: Boolean }
    - { name: useSandboxTan, type: Boolean }
    - { name: sandboxBlockReason, type: "String?" }
    - { name: continueEnabled, type: Boolean, derived: true }
  internal_form_state:
    type: FormState
    fields: [accountId, amount, currency, beneficiaryId, reference, query, paymentType, amountError, beneficiaryError, formError, submitting]
  states:
    - Loading
    - Content
    - Empty
    - Error
    - NoNetwork
    - Unauthenticated
  events:
    - setAccount
    - onAmountChanged
    - onBeneficiaryQueryChanged
    - onBeneficiarySelected
    - onReferenceChanged
    - onPaymentTypeChanged
    - onRetry
    - onContinue
  actions:
    - select_account
    - select_beneficiary
    - filter_beneficiaries
    - select_payment_type
    - continue
  nav_params:
    - { name: preselectedCounterpartyId, type: String, default: "" }
    - { name: accountId, type: String, default: "" }
  callbacks:
    - name: onContinue
      signature: "(PaymentDraft) -> Unit"
      consumer: send-money-confirm
    - name: onBack
      signature: "() -> Unit"
  collaborators:
    - PaymentRailClassifier
  di:
    - AccountsRepository
    - PaymentsRepository
    - BanksRepository
    - "isSandbox (named qualifier)"

api:
  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts"
    tag: Accounts
    description: "AccountsRepository.myAccounts() — the From Account picker."
    response:
      fields:
        - { name: accounts, type: List<Account> }
        - { name: id, type: String }
        - { name: label, type: String }
        - { name: balance, type: MoneyAmount }
        - { name: currency, type: String }
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/account"
    tag: Accounts
    description: "AccountsRepository.accountDetail() — resolves the selected account's currency for the amount prefix and SEPA classification."
    response:
      fields:
        - { name: balance.currency, type: String }
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/counterparties"
    tag: Counterparties
    description: "PaymentsRepository.listBeneficiaries(bankId, accountId) — beneficiary list for the selected account (reloads on account switch)."
    response:
      fields:
        - { name: counterparties, type: List<Counterparty> }
        - { name: counterparty_id, type: String }
        - { name: name, type: String }
        - { name: other_account_routing_scheme, type: String }
        - { name: other_account_routing_address, type: String }
        - { name: other_account_secondary_routing_scheme, type: String }
        - { name: other_account_secondary_routing_address, type: String }
        - { name: other_bank_routing_scheme, type: String }
        - { name: other_bank_routing_address, type: String }
  - endpoint: "GET /obp/v3.1.0/banks/{bankId}/accounts/{accountId}/owner/funds-available"
    tag: Account
    description: "PaymentsRepository.fundsAvailable() — live pre-flight funds check on Continue. Maps answer == 'yes' to true."
    request:
      params:
        - { name: amount, type: String }
        - { name: currency, type: String }
    response:
      fields:
        - { name: answer, type: String, note: "'yes' or 'no'" }
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}"
    tag: Banks
    description: "BanksRepository.bank(bankId) — source + destination bank country for PaymentRailClassifier rail eligibility."
    response:
      fields:
        - { name: id, type: String }
        - { name: country_code, type: String }

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries
    - send-money
    - send-money-confirm
