sibling: api
schema_version: "4.0"
feature_id: send-money-amount
api:
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: AISP
    demo_source: demo-data.yaml#/collections/get_accounts
    description: "List the PSU's authorised accounts for the From Account picker. Requires an authorised account-access-consent (Status AUTH) + an authorization-code token (scope accounts). OBIE object OBReadAccount6."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
  - id: get_account_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: AISP
    demo_source: demo-data.yaml#/collections/get_account_balances
    description: "Live balance for the selected source account, used for the amount-affordability hint and the amount-entry currency prefix. Requires ReadBalances. Prefer Type InterimAvailable. OBIE object OBReadBalance1."
    response:
      fields:
        - name: Data.Balance[].AccountId
          type: String
        - name: Data.Balance[].Type
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
  - id: get_account_beneficiaries
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/beneficiaries"
    tag: AISP
    demo_source: demo-data.yaml#/collections/get_account_beneficiaries
    description: "Beneficiary list for the selected account (reloads on account switch). Requires ReadBeneficiariesBasic/Detail. OBIE object OBReadBeneficiary5. The recipient CreditorAccount.SchemeName drives rail classification (UK.OBIE.IBAN vs UK.OBIE.SortCodeAccountNumber)."
    response:
      fields:
        - name: Data.Beneficiary[].BeneficiaryId
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Name
          type: String
        - name: Data.Beneficiary[].CreditorAccount.SchemeName
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Identification
          type: String
  - id: create_funds_confirmation
    endpoint: "POST /obie/open-banking/v4.0/cbpii/funds-confirmations"
    tag: CBPII
    demo_source: demo-data.yaml#/collections/create_funds_confirmation
    description: "Confirmation-of-Funds check on Continue — confirms whether the entered amount is available on the source account against a standing funds-confirmation-consent (DebtorAccount). Requires an authorized-code token (scope fundsconfirmations) + a ConsentId in the payload; InstructedAmount.Currency must match the account currency. ASPSP returns Data.FundsAvailable. OBIE object OBFundsConfirmation1 / OBFundsConfirmationResponse1. ALTERNATIVE: when a domestic-payment-consent already exists and is Status AUTH, use GET /pisp/domestic-payment-consents/{ConsentId}/funds-confirmation which returns Data.FundsAvailableResult.FundsAvailable instead."
    request:
      fields:
        - name: Data.ConsentId
          type: String
        - name: Data.Reference
          type: String
        - name: Data.InstructedAmount.Amount
          type: String
        - name: Data.InstructedAmount.Currency
          type: String
    response:
      fields:
        - name: Data.FundsConfirmationId
          type: String
        - name: Data.FundsAvailable
          type: Boolean
        - name: Data.ConsentId
          type: String
        - name: Data.InstructedAmount.Amount
          type: String
        - name: Data.InstructedAmount.Currency
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
