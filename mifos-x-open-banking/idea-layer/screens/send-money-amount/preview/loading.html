<!doctype html>
<!-- render-hash: sma-loading-obie02 -->
<html lang="en" data-screen="send-money-amount" data-state="loading" data-feature="send-money-amount" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enter amount</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--icon-md:24px;--primary:#4C662B;--background:#F9FAEF;--on-background:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-symbols-outlined{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,var(--surface-variant) 25%,#EDEFE4 50%,var(--surface-variant) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear;border-radius:6px}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.sk-lbl{height:11px;width:110px;margin:16px 20px 6px;border-radius:5px}
.sk-field{height:56px;margin:0 20px;border-radius:6px}
.sk-amt{height:72px;margin:0 20px;border-radius:6px}
.sk-chips{display:flex;gap:8px;padding:20px 20px 0}.sk-chip{height:36px;width:120px;border-radius:8px}
.sk-btn{height:52px;margin:28px 20px 0;border-radius:999px}
[data-theme="dark"]{--background:#12140E;--on-background:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA}@media (prefers-color-scheme:dark){:root{--background:#12140E;--on-background:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-symbols-outlined" aria-label="Go back">arrow_back</span><h1>Enter amount</h1></div>
<div class="sk sk-lbl" aria-hidden="true"></div><div class="sk sk-field" aria-hidden="true"></div>
<div class="sk sk-lbl" aria-hidden="true"></div><div class="sk sk-amt" aria-hidden="true"></div>
<div class="sk sk-lbl" aria-hidden="true"></div><div class="sk sk-field" aria-hidden="true"></div>
<div class="sk-chips" aria-hidden="true"><span class="sk sk-chip"></span><span class="sk sk-chip"></span></div>
<div class="sk sk-btn" aria-hidden="true"></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
