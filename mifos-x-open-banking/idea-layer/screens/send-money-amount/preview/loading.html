<!doctype html>
<!-- render-hash: sma-loading-01 -->
<html lang="en" data-screen="send-money-amount" data-state="loading" data-feature="send-money-amount" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send Money — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.from-skel{margin:8px 20px 18px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px}.from-skel .icon{width:44px;height:44px;border-radius:12px}.from-skel .body{flex:1;display:flex;flex-direction:column;gap:7px}.from-skel .l1{height:10px;width:30%}.from-skel .l2{height:14px;width:70%}
.label-skel{height:11px;width:80px;margin:14px 20px 8px}
.field-skel{height:56px;margin:0 20px 14px;border-radius:12px}
.benef-skel{margin:0 20px 14px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}.benef-skel .av{width:40px;height:40px;border-radius:20px}.benef-skel .body{flex:1;display:flex;flex-direction:column;gap:6px}.benef-skel .l1{height:12px;width:50%}.benef-skel .l2{height:11px;width:65%}
.chip-skel-row{display:flex;gap:8px;padding:0 20px 16px}.chip-skel{height:34px;width:88px;border-radius:8px}
.banner-skel{height:48px;margin:0 20px 16px;border-radius:8px}
.btn-skel{height:52px;margin:8px 20px 0;border-radius:12px}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons">arrow_back</span><h1>Send Money</h1></div>
<div class="from-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div></div>
<div class="skel label-skel"></div><div class="skel field-skel"></div>
<div class="skel label-skel"></div><div class="skel field-skel"></div>
<div class="benef-skel"><div class="skel av"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div></div>
<div class="skel label-skel"></div><div class="skel field-skel"></div>
<div class="skel label-skel"></div>
<div class="chip-skel-row"><div class="skel chip-skel"></div><div class="skel chip-skel"></div><div class="skel chip-skel"></div></div>
<div class="skel banner-skel"></div>
<div class="skel btn-skel"></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
