<!doctype html>
<!-- render-hash: sma-empty-obie02 -->
<html lang="en" data-screen="send-money-amount" data-state="empty" data-feature="send-money-amount" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enter amount</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--icon-md:24px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--background:#F9FAEF;--on-background:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-symbols-outlined{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 40px;gap:6px}.state-glyph{width:96px;height:96px;border-radius:48px;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;margin-bottom:10px}.state-glyph .material-symbols-outlined{font-size:var(--icon-2xl);color:var(--on-surface-variant)}.state-title{font-size:20px;font-weight:600}.state-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:280px}
.btn{height:48px;border-radius:999px;background:var(--primary);color:var(--on-primary);border:none;font-family:inherit;font-size:15px;font-weight:600;padding:0 28px;margin-top:18px;cursor:pointer}
[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-symbols-outlined" data-nav-to="send-money" tabindex="0" aria-label="Go back">arrow_back</span><h1>Enter amount</h1></div>
<div class="state">
<div class="state-glyph"><span class="material-symbols-outlined">account_balance_wallet</span></div>
<div class="state-title">No accounts available</div>
<div class="state-msg">No accounts available to send from.</div>
<button class="btn" data-nav-to="accounts" data-action="manage_accounts" tabindex="0">View accounts</button>
</div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
