    keyboard:
      focusable: true
    test_context:
      tag: services_chip_group
      purpose: "Multi-select chip group listing OBP-supported agent services; at least one must be selected"
      interaction_type: tap
      data_driven: true
      required_fields: [selectedServices]

  # ── Commission rate ─────────────────────────────────────────────
  - type: text
    id: commission_label
