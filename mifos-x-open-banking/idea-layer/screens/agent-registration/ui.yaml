    a11y:
      content_description: "Mobile phone number input. Country code +254 is already applied."
      role: textbox
      hint: "Enter your 9-digit Safaricom or Airtel number"
    keyboard:
      focusable: true
    test_context:
      tag: phone_number_input
      purpose: "9-digit phone number input combined with +254 prefix; full number sent to OBP as +254XXXXXXXXX"
      interaction_type: text_input
      data_driven: false
