    test_context:
      tag: currency_error
      purpose: "Inline validation error shown when currency is not selected before submission"
      interaction_type: none
      data_driven: true
      required_fields: [validationErrors.currency]

  # ── Supported services section ──────────────────────────────────
  - type: text
    id: services_section_label
    label: "Supported Services"
    content: "Supported Services"
    style:
      typography: label_medium
      color: "#44483D"
      font_weight: semibold
