      orientation: vertical
      flex: 1
    a11y:
      content_description: ""
      role: group
    test_context:
      tag: pending_text_col
      purpose: "Vertical column grouping the pending banner title and descriptive message"
      interaction_type: none
      data_driven: false

  - type: text
    id: pending_banner_title
    label: "Pending Approval"
    content: "Pending Approval"
    style:
      typography: body_medium
      color: "#E8A317"
      font_weight: semibold
    a11y:
      content_description: "Status: Pending Approval"
      role: text
    test_context:
      tag: pending_banner_title
      purpose: "Bold status label inside the pending banner"
      interaction_type: none
      data_driven: false
      assert_text: "Pending Approval"

  - type: text
