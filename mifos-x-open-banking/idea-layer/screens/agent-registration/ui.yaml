    label: "Agent Confirmed"
    content: "Agent Confirmed"
    style:
      typography: body_medium
      color: "#4C662B"
      font_weight: semibold
    a11y:
      content_description: "Status: Agent registration confirmed by the bank"
      role: text
    test_context:
      tag: confirmed_banner_title
