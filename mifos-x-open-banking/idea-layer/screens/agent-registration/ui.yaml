    style:
      typography: body_small
      color: "#BA1A1A"
    a11y:
      content_description: "Error message: Registration failed. Review your entered details."
      role: text
    test_context:
      tag: global_error_message
      purpose: "Dynamic error message driven by error.message from OBP API response"
      interaction_type: none
      data_driven: true
      required_fields: [error.message]

  # ── Submit ──────────────────────────────────────────────────────
  - type: button
    id: register_agent_button
    label: "Register as Agent"
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      corner_radius: 14
      padding_horizontal: 24
      padding_vertical: 16
      typography: label_large
      margin_horizontal: 20
      margin_bottom: 12
      width: full
      elevation: 2
    on_click:
      action: submit_registration
      target: ""
    a11y:
      content_description: "Submit agent registration form. Ensure all fields are complete before submitting."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: register_agent_button
      purpose: "Primary submit CTA; triggers OBP POST /banks/{bankId}/agents; disabled during submitting state"
      interaction_type: tap
      data_driven: false
      assert_text: "Register as Agent"

  - type: text
    id: terms_notice
    label: "By registering, you agree to the Mifos Agent Terms and Conditions"
    content: "By registering, you agree to the Mifos Agent Terms and Conditions"
    style:
      typography: body_small
      color: "#75796C"
      align: center
      padding_horizontal: 20
      padding_bottom: 24
    a11y:
      content_description: "Legal notice: Submitting this form confirms acceptance of Mifos Agent Terms and Conditions"
      role: text
    test_context:
      tag: terms_notice
      purpose: "Legal disclaimer linking form submission to acceptance of Mifos agent agreement"
      interaction_type: none
      data_driven: false

states:
  loading:
    description: "Pre-flight OBP status check — querying existing agent record before rendering the form"
    layout:
      visible_components:
        - agent_reg_title
        - registration_loading_spinner
        - loading_label

  idle:
    description: "Empty registration form ready for the field officer to fill in"
    layout:
      visible_components:
        - agent_reg_title
        - agent_reg_subtitle
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
        - services_section_label
        - services_chip_group
        - commission_label
        - commission_rate_input
        - register_agent_button
        - terms_notice

  submitting:
    description: "OBP registration call in flight — inputs disabled, button shows loading indicator"
    layout:
      visible_components:
        - agent_reg_title
        - agent_reg_subtitle
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
        - services_section_label
        - services_chip_group
        - commission_label
        - commission_rate_input
        - register_agent_button
        - terms_notice
      register_agent_button_loading: true
      inputs_enabled: false

  validation_error:
    description: "One or more form fields failed client-side validation — inline error messages shown"
    layout:
      visible_components:
        - agent_reg_title
        - agent_reg_subtitle
        - legal_name_label
        - legal_name_input
        - legal_name_error
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - phone_error
        - agent_number_label
        - agent_number_input
        - agent_number_error
        - currency_label
        - currency_select
        - currency_error
        - services_section_label
        - services_chip_group
        - commission_label
        - commission_rate_input
        - register_agent_button
        - terms_notice
      inputs_enabled: true

  pending_approval:
    description: "OBP returned is_pending_agent=true — form is read-only; banner communicates next steps"
    layout:
      visible_components:
        - agent_reg_title
        - status_banner_pending
        - pending_banner_row
        - pending_icon
        - pending_text_col
        - pending_banner_title
        - pending_banner_message
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
        - services_section_label
        - services_chip_group
        - commission_label
        - commission_rate_input
      inputs_enabled: false
      register_agent_button_visible: false

  confirmed:
    description: "OBP returned is_confirmed_agent=true — registration complete; CTA navigates to FO dashboard"
    layout:
      visible_components:
        - agent_reg_title
        - status_banner_confirmed
        - confirmed_banner_row
        - confirmed_icon
        - confirmed_banner_title
        - confirmed_banner_message
        - go_to_dashboard_button
      inputs_enabled: false
      register_agent_button_visible: false

  error:
    description: "OBP API returned a 4xx/5xx error — global error banner shown above the re-enabled form"
    layout:
      visible_components:
        - agent_reg_title
        - agent_reg_subtitle
        - global_error_banner
        - global_error_row
        - error_icon
        - global_error_message
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
        - services_section_label
        - services_chip_group
        - commission_label
        - commission_rate_input
        - register_agent_button
        - terms_notice
      inputs_enabled: true
      show_error_snackbar: false

state_model:
  view_model: AgentRegistrationViewModel
  state_fields:
    - name: legalName
      type: String
      default: '""'
    - name: phoneNumber
      type: String
      default: '""'
    - name: agentNumber
      type: String
      default: '""'
    - name: currency
      type: String
      default: '"KES"'
    - name: selectedServices
      type: "List<String>"
      default: "emptyList()"
    - name: commissionRate
      type: String
      default: '""'
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: isLoading
      type: Boolean
      default: "true"
    - name: agentId
      type: "String?"
      default: "null"
    - name: isPendingAgent
      type: Boolean
      default: "false"
    - name: isConfirmedAgent
      type: Boolean
      default: "false"
    - name: uiState
      type: AgentRegistrationUiState
      default: Loading
    - name: validationErrors
      type: "Map<String, String>"
      default: "emptyMap()"
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: legal_name
      code: REQUIRED
      message: "Legal name is required"
    - field: phone_number
      code: INVALID_FORMAT
      message: "Enter a valid 9-digit phone number"
    - field: agent_number
      code: REQUIRED
      message: "Agent number is required"
    - field: agent_number
      code: DUPLICATE_AGENT
      message: "An agent with this number already exists"
    - field: currency
      code: REQUIRED
      message: "Select an operating currency"
    - field: services
      code: REQUIRED
      message: "Select at least one supported service"
    - field: global
      code: SUBMIT_FAILED
      message: "Registration failed. Please check your details and try again."
    - field: global
      code: NETWORK_ERROR
      message: "No internet connection. Please check your network and retry."
  events:
    - "LegalNameChanged(value: String)"
    - "PhoneNumberChanged(value: String)"
    - "AgentNumberChanged(value: String)"
    - "CurrencySelected(value: String)"
    - "ServiceToggled(service: String)"
    - "CommissionRateChanged(value: String)"
    - SubmitClicked
    - "RegistrationSuccess(agentId: String, isPending: Boolean)"
    - "RegistrationFailed(error: UiError)"
    - CurrencyPickerOpened
    - "StatusCheckSuccess(isPending: Boolean, isConfirmed: Boolean)"
    - StatusCheckFailed
  actions:
    - focus_legal_name
    - focus_phone
    - focus_agent_number
    - open_currency_picker
    - toggle_service
    - focus_commission_rate
    - submit_registration
    - navigate_to_dashboard
  di:
    - AgentRepository
    - BankRepository
    - ValidationService

api:
  - id: obp_create_agent
    endpoint: "POST /obp/v5.1.0/banks/{bankId}/agents"
    tag: Agent
    description: "Register the field officer as an OBP bank agent"
    request:
      fields:
        - name: legal_name
          type: String
          example: "Priya Chakraborty"
        - name: mobile_phone_number
          type: String
          example: "+254712345678"
        - name: agent_number
          type: String
          example: "AGT-2026-00142"
        - name: currency
          type: String
          values: [EUR, GBP, KES, USD]
          example: "KES"
        - name: supported_services
          type: "List<String>"
          values: [cash_deposit, cash_withdrawal, account_opening, bill_payment, fund_transfer]
        - name: commission_rate
          type: Number
          example: 1.5
    response:
      fields:
        - name: agent_id
          type: String
        - name: is_pending_agent
          type: Boolean
        - name: is_confirmed_agent
          type: Boolean
        - name: legal_name
          type: String
        - name: mobile_phone_number
          type: String
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 400
        message: "INVALID_PHONE_NUMBER"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 409
        message: "AGENT_ALREADY_EXISTS"

dependencies:
  tier: feature
  features:
    - fo-dashboard

navigation:
  - action: navigate_back
    target: fo-dashboard
    description: "Return to field officer dashboard via top app bar back arrow"
  - action: navigate_to_dashboard
    target: fo-dashboard
    description: "Navigate to FO dashboard after confirmed agent status"
  - action: submit_registration
    target: ""
    description: "On success, transition to pending_approval or confirmed state inline; no navigation"
