      assert_text: "Agent Number"

  - type: input
    id: agent_number_input
    label: "Agent number"
    style:
      variant: outlined
      border_color: "#E1E4D5"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 14
      typography: body_medium
      margin_horizontal: 20
      margin_bottom: 4
    placeholder: "e.g. AGT-2026-00142"
    on_click:
      action: focus_agent_number
      target: ""
    a11y:
