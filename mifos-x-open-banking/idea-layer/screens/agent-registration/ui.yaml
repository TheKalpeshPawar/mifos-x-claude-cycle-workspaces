      role: textbox
      hint: "Format: AGT-YYYY-NNNNN"
    keyboard:
      focusable: true
    test_context:
      tag: agent_number_input
      purpose: "Unique agent identifier issued by Mifos admin; validated server-side for uniqueness against OBP AGENT_ALREADY_EXISTS"
