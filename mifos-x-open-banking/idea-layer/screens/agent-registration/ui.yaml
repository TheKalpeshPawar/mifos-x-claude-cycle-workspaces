    placeholder: "Select currency"
    on_click:
      action: open_currency_picker
      target: ""
    a11y:
      content_description: "Operating currency selector. Available options: EUR — Euro, GBP — British Pound, KES — Kenyan Shilling, USD — US Dollar."
      role: combobox
      hint: "Choose the primary currency for your agent transactions"
    keyboard:
      focusable: true
    test_context:
