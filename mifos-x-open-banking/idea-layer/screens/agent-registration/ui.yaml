      interaction_type: none
      data_driven: false
      assert_text: "Agent Confirmed"

  - type: text
    id: confirmed_banner_message
    label: "You are registered as an active Mifos field agent. You can now onboard customers and process transactions."
    content: "You are registered as an active Mifos field agent. You can now onboard customers and process transactions."
    style:
      typography: body_small
      color: "#4C662B"
    a11y:
      content_description: "You are an active OBP field agent authorised to onboard customers and process agent banking transactions"
      role: text
    test_context:
      tag: confirmed_banner_message
