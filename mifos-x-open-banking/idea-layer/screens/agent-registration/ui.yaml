id: agent-registration
name: Agent Registration
feature: agent-registration
flavor: fieldOfficer
status: enriched
quality_score: 78
status_history:
  - status: draft
    timestamp: "2026-05-25T00:00:00Z"
  - status: enriched
    timestamp: "2026-05-25T00:00:00Z"

shell:
  top_app_bar:
    show: true
    title: "Agent Registration"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

screens:
  - id: agent-registration
    name: Agent Registration
    archetype: form
    route: /agent-registration
    scroll: vertical

components:
  - type: text
    id: agent_reg_title
    label: "Agent Registration"
    content: "Agent Registration"
    style:
      typography: headline_large
      color: "#1800B1"
      font_weight: bold
      padding_horizontal: 20
      padding_top: 16
      padding_bottom: 4
    a11y:
      content_description: "Agent Registration screen title"
      role: heading
    test_context:
      tag: agent_reg_title
      assert_text: "Agent Registration"

  - type: text
    id: agent_reg_subtitle
    label: "Register to become an authorised Mifos field agent"
    content: "Register to become an authorised Mifos field agent"
    style:
      typography: body_medium
      color: "#666666"
      padding_horizontal: 20
      padding_bottom: 24
    a11y:
      content_description: "Registration subtitle"
      role: text
    test_context:
      tag: agent_reg_subtitle

  - type: box
    id: status_banner_pending
    label: "Pending Approval status banner"
    content: "Pending Approval status banner"
    style:
      background: "#FFF8E1"
      corner_radius: 14
      padding_horizontal: 16
      padding_vertical: 14
      margin_horizontal: 20
      margin_bottom: 20
      border_color: "#FFD54F"
      border_width: 1
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Status: Registration pending approval. Your application is under review."
      role: status
    test_context:
      tag: status_banner_pending

  - type: stack
    id: pending_banner_row
    label: "Pending banner content"
    style:
      orientation: horizontal
      spacing: 10
      align: center
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: row
    test_context:
      tag: pending_banner_row

  - type: icon
    id: pending_icon
    label: "Pending icon"
    style:
      icon_name: hourglass_empty
      size: 22
      color: "#F57F17"
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: none
    test_context:
      tag: pending_icon

  - type: stack
    id: pending_text_col
    label: "Pending text"
    style:
      orientation: vertical
      flex: 1
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: group
    test_context:
      tag: pending_text_col

  - type: text
    id: pending_banner_title
    label: "Pending Approval"
    content: "Pending Approval"
    style:
      typography: body_medium
      color: "#F57F17"
      font_weight: semibold
    a11y:
      content_description: "Status: Pending Approval"
      role: text
    test_context:
      tag: pending_banner_title
      assert_text: "Pending Approval"

  - type: text
    id: pending_banner_message
    label: "Your agent application is under review. You will be notified once confirmed."
    content: "Your agent application is under review. You will be notified once confirmed."
    style:
      typography: body_small
      color: "#795548"
    a11y:
      content_description: "Application is under review. Notification will be sent upon confirmation."
      role: text
    test_context:
      tag: pending_banner_message

  - type: box
    id: status_banner_confirmed
    label: "Confirmed status banner"
    content: "Confirmed status banner"
    style:
      background: "#E8F5E9"
      corner_radius: 14
      padding_horizontal: 16
      padding_vertical: 14
      margin_horizontal: 20
      margin_bottom: 20
      border_color: "#A5D6A7"
      border_width: 1
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Status: Registration confirmed. You are an active field agent."
      role: status
    test_context:
      tag: status_banner_confirmed

  - type: stack
    id: confirmed_banner_row
    label: "Confirmed banner content"
    style:
      orientation: horizontal
      spacing: 10
      align: center
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: row
    test_context:
      tag: confirmed_banner_row

  - type: icon
    id: confirmed_icon
    label: "Confirmed icon"
    style:
      icon_name: verified_outlined
      size: 22
      color: "#4CAF50"
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: none
    test_context:
      tag: confirmed_icon

  - type: text
    id: confirmed_banner_title
    label: "Agent Confirmed"
    content: "Agent Confirmed"
    style:
      typography: body_medium
      color: "#2E7D32"
      font_weight: semibold
    a11y:
      content_description: "Status: Agent Confirmed"
      role: text
    test_context:
      tag: confirmed_banner_title
      assert_text: "Agent Confirmed"

  - type: text
    id: confirmed_banner_message
    label: "You are registered as an active Mifos field agent. Access all agent features."
    content: "You are registered as an active Mifos field agent. Access all agent features."
    style:
      typography: body_small
      color: "#388E3C"
    a11y:
      content_description: "You are an active Mifos field agent"
      role: text
    test_context:
      tag: confirmed_banner_message

  - type: text
    id: legal_name_label
    label: "Legal Name"
    content: "Legal Name"
    style:
      typography: label_medium
      color: "#444444"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 6
    a11y:
      content_description: "Legal name field label"
      role: text
    test_context:
      tag: legal_name_label
      assert_text: "Legal Name"

  - type: input
    id: legal_name_input
    label: "Legal name"
    style:
      variant: outlined
      border_color: "#CCCCCC"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 14
      typography: body_medium
      margin_horizontal: 20
      margin_bottom: 16
    placeholder: "Enter your full legal name"
    on_click:
      action: focus_legal_name
      target: ""
    a11y:
      content_description: "Legal name input. Enter your full legal name as it appears on your ID."
      role: textbox
      hint: "As it appears on your official ID"
    test_context:
      tag: legal_name_input

  - type: text
    id: phone_label
    label: "Mobile Phone Number"
    content: "Mobile Phone Number"
    style:
      typography: label_medium
      color: "#444444"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 6
    a11y:
      content_description: "Phone number field label"
      role: text
    test_context:
      tag: phone_label
      assert_text: "Mobile Phone Number"

  - type: stack
    id: phone_input_row
    label: "Phone input with prefix"
    style:
      orientation: horizontal
      spacing: 8
      margin_horizontal: 20
      margin_bottom: 16
      align: center
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: row
    test_context:
      tag: phone_input_row

  - type: box
    id: phone_prefix_box
    label: "+254"
    content: "+254"
    style:
      background: "#F5F5F5"
      corner_radius: 12
      padding_horizontal: 14
      padding_vertical: 14
      border_color: "#CCCCCC"
      border_width: 1
      text_color: "#333333"
      typography: body_medium
      font_weight: semibold
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Country code: +254 Kenya"
      role: text
    test_context:
      tag: phone_prefix_box
      assert_text: "+254"

  - type: input
    id: phone_number_input
    label: "Phone number"
    style:
      variant: outlined
      border_color: "#CCCCCC"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 14
      typography: body_medium
      flex: 1
      keyboard_type: phone
    placeholder: "712 345 678"
    on_click:
      action: focus_phone
      target: ""
    a11y:
      content_description: "Phone number input after country code +254"
      role: textbox
      hint: "Enter your 9-digit Safaricom or Airtel number"
    test_context:
      tag: phone_number_input

  - type: text
    id: agent_number_label
    label: "Agent Number"
    content: "Agent Number"
    style:
      typography: label_medium
      color: "#444444"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 6
    a11y:
      content_description: "Agent number field label"
      role: text
    test_context:
      tag: agent_number_label
      assert_text: "Agent Number"

  - type: input
    id: agent_number_input
    label: "Agent number"
    style:
      variant: outlined
      border_color: "#CCCCCC"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 14
      typography: body_medium
      margin_horizontal: 20
      margin_bottom: 16
    placeholder: "e.g. AGT-2026-00142"
    on_click:
      action: focus_agent_number
      target: ""
    a11y:
      content_description: "Agent number input. Enter your assigned agent number."
      role: textbox
      hint: "Your Mifos assigned agent identifier"
    test_context:
      tag: agent_number_input

  - type: text
    id: currency_label
    label: "Operating Currency"
    content: "Operating Currency"
    style:
      typography: label_medium
      color: "#444444"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 6
    a11y:
      content_description: "Operating currency field label"
      role: text
    test_context:
      tag: currency_label
      assert_text: "Operating Currency"

  - type: input
    id: currency_select
    label: "Currency"
    style:
      variant: outlined
      border_color: "#CCCCCC"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 14
      typography: body_medium
      margin_horizontal: 20
      margin_bottom: 28
      trailing_icon: expand_more
      input_type: select
    placeholder: "Select currency"
    on_click:
      action: open_currency_picker
      target: ""
    a11y:
      content_description: "Operating currency selector. Options: EUR, GBP, KES, USD."
      role: combobox
      hint: "Choose your primary transaction currency"
    test_context:
      tag: currency_select

  - type: button
    id: register_agent_button
    label: "Register as Agent"
    style:
      variant: filled
      background: "#1800B1"
      text_color: "#FFFFFF"
      corner_radius: 14
      padding_horizontal: 24
      padding_vertical: 16
      typography: label_large
      margin_horizontal: 20
      margin_bottom: 32
      width: full
      elevation: 2
    on_click:
      action: submit_registration
      target: ""
    a11y:
      content_description: "Submit agent registration form"
      role: button
    test_context:
      tag: register_agent_button
      assert_text: "Register as Agent"

  - type: text
    id: terms_notice
    label: "By registering you agree to the Mifos Agent Terms and Conditions"
    content: "By registering, you agree to the Mifos Agent Terms and Conditions"
    style:
      typography: body_small
      color: "#888888"
      align: center
      padding_horizontal: 20
      padding_bottom: 24
    a11y:
      content_description: "Terms notice: registration subject to Mifos Agent Terms and Conditions"
      role: text
    test_context:
      tag: terms_notice

states:
  idle:
    layout:
      visible_components:
        - agent_reg_title
        - agent_reg_subtitle
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
        - register_agent_button
        - terms_notice
  submitting:
    layout:
      visible_components:
        - agent_reg_title
        - agent_reg_subtitle
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
        - register_agent_button
        - terms_notice
      register_agent_button_loading: true
      inputs_enabled: false
  pending_approval:
    layout:
      visible_components:
        - agent_reg_title
        - status_banner_pending
        - pending_banner_row
        - pending_icon
        - pending_text_col
        - pending_banner_title
        - pending_banner_message
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
      inputs_enabled: false
      register_agent_button_visible: false
  confirmed:
    layout:
      visible_components:
        - agent_reg_title
        - status_banner_confirmed
        - confirmed_banner_row
        - confirmed_icon
        - confirmed_banner_title
        - confirmed_banner_message
      inputs_enabled: false
      register_agent_button_visible: false
  error:
    layout:
      visible_components:
        - agent_reg_title
        - agent_reg_subtitle
        - legal_name_label
        - legal_name_input
        - phone_label
        - phone_input_row
        - phone_prefix_box
        - phone_number_input
        - agent_number_label
        - agent_number_input
        - currency_label
        - currency_select
        - register_agent_button
        - terms_notice
      show_error_snackbar: true
      error_snackbar_message: "Registration failed. Please check your details and try again."

state_model:
  view_model: AgentRegistrationViewModel
  state_fields:
    - name: legalName
      type: String
      default: '""'
    - name: phoneNumber
      type: String
      default: '""'
    - name: agentNumber
      type: String
      default: '""'
    - name: currency
      type: String
      default: '"KES"'
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: agentId
      type: "String?"
      default: "null"
    - name: isPendingAgent
      type: Boolean
      default: "false"
    - name: isConfirmedAgent
      type: Boolean
      default: "false"
    - name: uiState
      type: AgentRegistrationUiState
      default: Idle
    - name: validationErrors
      type: "Map<String, String>"
      default: "emptyMap()"
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: legal_name
      code: REQUIRED
      message: "Legal name is required"
    - field: phone_number
      code: INVALID_FORMAT
      message: "Enter a valid 9-digit phone number"
    - field: agent_number
      code: REQUIRED
      message: "Agent number is required"
    - field: currency
      code: REQUIRED
      message: "Select an operating currency"
    - field: global
      code: SUBMIT_FAILED
      message: "Registration failed. Please check your details and try again."
    - field: global
      code: DUPLICATE_AGENT
      message: "An agent with this number already exists."
  events:
    - LegalNameChanged(value: String)
    - PhoneNumberChanged(value: String)
    - AgentNumberChanged(value: String)
    - CurrencySelected(value: String)
    - SubmitClicked
    - RegistrationSuccess(agentId: String, isPending: Boolean)
    - RegistrationFailed(error: String)
    - CurrencyPickerOpened
  actions:
    - focus_legal_name
    - focus_phone
    - focus_agent_number
    - open_currency_picker
    - submit_registration
  di:
    - AgentRepository
    - BankRepository
    - ValidationService

api:
  - id: obp_create_agent
    endpoint: "POST /obp/v5.1.0/banks/{bankId}/agents"
    tag: Agent
    description: "Register as a field agent"
    request:
      fields:
        - name: legal_name
          type: String
        - name: mobile_phone_number
          type: String
          example: "+254712345678"
        - name: agent_number
          type: String
        - name: currency
          type: String
          values: [EUR, GBP, KES, USD]
    response:
      fields:
        - name: agent_id
          type: String
        - name: is_pending_agent
          type: Boolean
        - name: is_confirmed_agent
          type: Boolean
        - name: legal_name
          type: String
        - name: mobile_phone_number
          type: String
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 400
        message: "INVALID_PHONE_NUMBER"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 409
        message: "AGENT_ALREADY_EXISTS"

dependencies:
  tier: feature
  features:
    - fo-dashboard

navigation:
  - action: navigate_back
    target: fo-dashboard
    description: "Return to field officer dashboard"
  - action: submit_registration
    target: ""
    description: "On success, transition to pending_approval or confirmed state inline"
