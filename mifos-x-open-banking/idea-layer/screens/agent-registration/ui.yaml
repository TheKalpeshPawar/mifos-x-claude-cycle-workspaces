    label: "Agent Registration"
    content: "Agent Registration"
    style:
      typography: headline_large
      color: "#4C662B"
      font_weight: bold
      padding_horizontal: 20
      padding_top: 16
      padding_bottom: 4
    a11y:
      content_description: "Agent Registration screen title"
      role: heading
    test_context:
      tag: agent_reg_title
      purpose: "Screen heading that identifies this as the OBP agent self-registration flow"
      interaction_type: none
      data_driven: false
      assert_text: "Agent Registration"

  - type: text
    id: agent_reg_subtitle
    label: "Register to become an authorised OBP field agent with your bank"
    content: "Register to become an authorised OBP field agent with your bank"
    style:
      typography: body_medium
      color: "#44483D"
      padding_horizontal: 20
      padding_bottom: 24
    a11y:
      content_description: "Subtitle explaining the purpose of this registration screen"
      role: text
    test_context:
      tag: agent_reg_subtitle
      purpose: "Contextual subtitle that sets user expectations before filling the form"
      interaction_type: none
      data_driven: false

  # ── Loading skeleton ────────────────────────────────────────────
  - type: loading_indicator
    id: registration_loading_spinner
    label: "Checking existing agent status…"
    style:
      size: 48
      color: "#4C662B"
      align: center
      margin_top: 80
      margin_bottom: 16
    a11y:
      content_description: "Verifying your existing agent status with the bank. Please wait."
      role: progressbar
      live: polite
    test_context:
      tag: registration_loading_spinner
      purpose: "Full-screen progress indicator shown while the app queries OBP for existing agent record"
      interaction_type: none
      data_driven: false

  - type: text
    id: loading_label
    label: "Checking registration status…"
    content: "Checking registration status…"
    style:
      typography: body_medium
      color: "#75796C"
      align: center
      padding_horizontal: 40
      padding_bottom: 8
    a11y:
      content_description: "Loading status text"
      role: text
      live: polite
    test_context:
      tag: loading_label
      purpose: "Descriptive text beneath the loading spinner during OBP status pre-check"
      interaction_type: none
      data_driven: false

  # ── Status banner: Pending ──────────────────────────────────────
  - type: box
    id: status_banner_pending
    label: "Pending Approval status banner"
    content: "Pending Approval status banner"
    style:
      background: "#CDEDA3"
      corner_radius: 14
      padding_horizontal: 16
      padding_vertical: 14
      margin_horizontal: 20
      margin_bottom: 20
      border_color: "#E8A317"
      border_width: 1
    a11y:
      content_description: "Your agent application is under review by the bank. You will receive a notification once approved."
      role: status
      live: polite
    test_context:
      tag: status_banner_pending
      purpose: "Informational banner shown when OBP returns is_pending_agent=true; blocks re-submission"
      interaction_type: none
      data_driven: true
      required_fields: [is_pending_agent]

  - type: stack
    id: pending_banner_row
    label: "Pending banner icon and text row"
    style:
      orientation: horizontal
      spacing: 10
      align: center
    a11y:
      content_description: ""
      role: row
    test_context:
      tag: pending_banner_row
      purpose: "Layout row that arranges hourglass icon and pending status text horizontally"
      interaction_type: none
      data_driven: false

  - type: icon
    id: pending_icon
    label: "Pending hourglass icon"
    style:
      icon_name: hourglass_empty
      size: 22
      color: "#E8A317"
    a11y:
      content_description: ""
      role: none
    test_context:
      tag: pending_icon
      purpose: "Decorative hourglass icon reinforcing pending state — hidden from accessibility tree"
      interaction_type: none
      data_driven: false

  - type: stack
    id: pending_text_col
    label: "Pending status text column"
