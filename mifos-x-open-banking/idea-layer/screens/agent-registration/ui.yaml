      required_fields: [validationErrors.phone_number]

  - type: text
    id: agent_number_label
    label: "Agent Number"
    content: "Agent Number"
    style:
      typography: label_medium
      color: "#44483D"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 6
    a11y:
