      typography: body_small
      color: "#75796C"
    a11y:
      content_description: "Agent application is under bank review. A push notification will be sent upon confirmation."
      role: text
    test_context:
      tag: pending_banner_message
      purpose: "Supporting message explaining next steps to the field officer while pending"
      interaction_type: none
      data_driven: false

