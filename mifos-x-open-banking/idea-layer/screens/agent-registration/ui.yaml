    style:
      typography: body_small
      color: "#BA1A1A"
      padding_horizontal: 20
      padding_bottom: 12
    a11y:
      content_description: "Validation error: Agent number is required"
      role: alert
      live: assertive
    test_context:
      tag: agent_number_error
      purpose: "Inline validation error for missing agent number; also reused for DUPLICATE_AGENT OBP error"
      interaction_type: none
      data_driven: true
      required_fields: [validationErrors.agent_number]

  - type: text
