      interaction_type: none
      data_driven: true
      required_fields: [validationErrors.legal_name]

  - type: text
    id: phone_label
    label: "Mobile Phone Number"
    content: "Mobile Phone Number"
    style:
      typography: label_medium
      color: "#44483D"
