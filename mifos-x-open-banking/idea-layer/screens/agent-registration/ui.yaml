      corner_radius: 14
      padding_horizontal: 16
      padding_vertical: 14
      margin_horizontal: 20
      margin_bottom: 20
      border_color: "#CDEDA3"
      border_width: 1
    a11y:
      content_description: "Your agent registration is confirmed. You are an active OBP field agent."
      role: status
    test_context:
      tag: status_banner_confirmed
      purpose: "Success banner shown when OBP returns is_confirmed_agent=true"
      interaction_type: none
      data_driven: true
      required_fields: [is_confirmed_agent]

  - type: stack
    id: confirmed_banner_row
    label: "Confirmed banner icon and text row"
    style:
      orientation: horizontal
      spacing: 10
      align: center
    a11y:
      content_description: ""
      role: row
    test_context:
      tag: confirmed_banner_row
      purpose: "Horizontal layout row for the confirmed banner's icon and text"
      interaction_type: none
      data_driven: false

  - type: icon
    id: confirmed_icon
    label: "Verified agent icon"
    style:
      icon_name: verified_outlined
      size: 22
      color: "#4C662B"
    a11y:
      content_description: ""
      role: none
    test_context:
      tag: confirmed_icon
      purpose: "Decorative verified badge icon inside the confirmed banner — decorative only"
      interaction_type: none
      data_driven: false

  - type: text
