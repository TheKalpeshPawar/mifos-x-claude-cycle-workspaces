<!doctype html>
<!-- render-hash: ar-empty-o15 -->
<html lang="en" data-screen="agent-registration" data-state="empty" data-feature="agent-registration" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Unavailable — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --radius-soft: 12px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 28px; text-align: center; gap: 14px; }
    .empty-icon { width: 96px; height: 96px; border-radius: 48px; background: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center; }
    .empty-icon .material-icons { font-size: 48px; }
    .empty-title { font-size: 20px; font-weight: 700; color: var(--on-surface); margin-top: 8px; }
    .empty-sub { font-size: 14px; color: var(--on-surface-variant); max-width: 320px; line-height: 1.5; }
    .empty-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; margin-top: 12px; }
    .btn-primary { padding: 14px 16px; background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-text { padding: 12px; background: transparent; color: var(--primary); border: none; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <header class="top-bar" role="banner">
      <span class="material-icons" data-action="navigate_back" data-nav-to="fo-dashboard" tabindex="0" aria-label="Go back to dashboard" role="button">arrow_back</span>
      <h1>Agent Registration</h1>
    </header>

    <section class="empty-wrap" data-component-type="box" data-component-id="empty_state" role="status" aria-live="polite">
      <div class="empty-icon" aria-hidden="true">
        <span class="material-icons">badge</span>
      </div>
      <h2 class="empty-title" data-component-type="text" data-component-id="empty_title">Registration form not available</h2>
      <p class="empty-sub" data-component-type="text" data-component-id="empty_message">We could not load a valid bank context for your registration. This usually means your account is not linked to a registered Mifos bank. Contact your administrator to confirm your bank assignment.</p>
      <div class="empty-actions">
        <button class="btn-primary" data-action="contact_admin" data-component-type="button" data-component-id="contact_admin_button" aria-label="Contact administrator" tabindex="0">
          <span class="material-icons" aria-hidden="true">support_agent</span> Contact Administrator
        </button>
        <button class="btn-text" data-nav-to="fo-dashboard" data-component-type="button" data-component-id="back_to_dashboard_button" aria-label="Back to dashboard" tabindex="0">Back to Dashboard</button>
      </div>
    </section>
  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
