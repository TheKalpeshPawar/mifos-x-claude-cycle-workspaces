<!doctype html>
<!-- render-hash: ar-content-m13 -->
<html lang="en" data-screen="agent-registration" data-state="content" data-feature="agent-registration" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Registration — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --radius-soft: 12px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735;
        --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285; --outline-variant: #44483D;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; padding-bottom: 24px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .page-title { font-size: 26px; font-weight: 700; color: var(--primary); padding: 20px 20px 4px; letter-spacing: -0.4px; }
    .page-sub { font-size: 14px; color: var(--on-surface-variant); padding: 0 20px 24px; line-height: 1.5; }
    .form-group { padding: 0 20px; margin-bottom: 12px; }
    .field-label { display: block; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; padding-left: 2px; }
    .input { width: 100%; padding: 13px 14px; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); outline: none; }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(76, 102, 43, 0.15); }
    .input::placeholder { color: var(--on-surface-variant); opacity: 0.6; }
    .phone-row { display: flex; gap: 8px; align-items: stretch; }
    .phone-prefix { padding: 13px 14px; background: var(--surface-variant); border: 1px solid var(--outline); border-radius: var(--radius-soft); font-weight: 600; color: var(--on-surface); font-size: 14px; flex-shrink: 0; }
    .phone-row .input { flex: 1; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: "expand_more"; font-family: 'Material Icons'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--on-surface-variant); pointer-events: none; }
    .select { appearance: none; width: 100%; padding: 13px 14px; padding-right: 42px; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); outline: none; cursor: pointer; }
    .select:focus { border-color: var(--primary); }
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 24px; }
    .chip { padding: 8px 14px; background: var(--primary-container); color: var(--on-primary-container); border: 1px solid var(--primary); border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .chip.selected { background: var(--primary); color: var(--on-primary); }
    .chip .material-icons { font-size: var(--icon-xs); }
    .submit-row { padding: 8px 20px 8px; }
    .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .terms-notice { font-size: 12px; color: var(--on-surface-variant); padding: 6px 20px 16px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <header class="top-bar" role="banner">
      <span class="material-icons" data-action="navigate_back" data-nav-to="fo-dashboard" tabindex="0" aria-label="Go back to dashboard" role="button">arrow_back</span>
      <h1>Agent Registration</h1>
    </header>

    <h2 class="page-title" data-component-type="text" data-component-id="agent_reg_title">Agent Registration</h2>
    <p class="page-sub" data-component-type="text" data-component-id="agent_reg_subtitle">Register to become an authorised OBP field agent with your bank.</p>

    <div class="form-group">
      <label class="field-label" for="legal-name" data-component-type="text" data-component-id="legal_name_label">Legal Name</label>
      <input id="legal-name" class="input" type="text" placeholder="e.g. Priya Chakraborty" value="Amina Odhiambo" data-component-type="input" data-component-id="legal_name_input" data-action="focus_legal_name" aria-label="Legal name, as on government ID">
    </div>

    <div class="form-group">
      <label class="field-label" for="phone-num" data-component-type="text" data-component-id="phone_label">Mobile Phone Number</label>
      <div class="phone-row">
        <span class="phone-prefix" data-component-type="box" data-component-id="phone_prefix_box" aria-label="Country code plus 254 Kenya">+254</span>
        <input id="phone-num" class="input" type="tel" placeholder="712 345 678" value="712 345 678" data-component-type="input" data-component-id="phone_number_input" data-action="focus_phone" aria-label="9-digit Kenyan phone number">
      </div>
    </div>

    <div class="form-group">
      <label class="field-label" for="agent-num" data-component-type="text" data-component-id="agent_number_label">Agent Number</label>
      <input id="agent-num" class="input" type="text" placeholder="e.g. AGT-2026-00142" value="AGT-2026-00142" data-component-type="input" data-component-id="agent_number_input" data-action="focus_agent_number" aria-label="Mifos agent number">
    </div>

    <div class="form-group">
      <label class="field-label" for="currency-sel" data-component-type="text" data-component-id="currency_label">Operating Currency</label>
      <div class="select-wrap">
        <select id="currency-sel" class="select" data-component-type="input" data-component-id="currency_select" data-action="open_currency_picker" aria-label="Choose operating currency">
          <option value="KES" selected>KES — Kenyan Shilling</option>
          <option value="USD">USD — US Dollar</option>
          <option value="EUR">EUR — Euro</option>
          <option value="GBP">GBP — British Pound</option>
        </select>
      </div>
    </div>

    <label class="field-label" style="padding: 8px 20px 10px; display: block;" data-component-type="text" data-component-id="services_section_label">Supported Services</label>
    <div class="chip-group" data-component-type="stack" data-component-id="services_chip_group" role="group" aria-label="Select agent banking services">
      <button class="chip selected" data-action="toggle_service" aria-pressed="true" tabindex="0"><span class="material-icons" aria-hidden="true">check</span> Cash Deposit</button>
      <button class="chip selected" data-action="toggle_service" aria-pressed="true" tabindex="0"><span class="material-icons" aria-hidden="true">check</span> Cash Withdrawal</button>
      <button class="chip" data-action="toggle_service" aria-pressed="false" tabindex="0">Account Opening</button>
      <button class="chip" data-action="toggle_service" aria-pressed="false" tabindex="0">Bill Payment</button>
      <button class="chip" data-action="toggle_service" aria-pressed="false" tabindex="0">Fund Transfer</button>
    </div>

    <div class="form-group">
      <label class="field-label" for="commission" data-component-type="text" data-component-id="commission_label">Commission Rate (%)</label>
      <input id="commission" class="input" type="text" inputmode="decimal" placeholder="e.g. 1.5" value="1.5" data-component-type="input" data-component-id="commission_rate_input" data-action="focus_commission_rate" aria-label="Commission rate percentage between 0.5 and 5.0">
    </div>

    <div class="submit-row">
      <button class="btn-submit" data-action="submit_registration" data-component-type="button" data-component-id="register_agent_button" aria-label="Submit agent registration" tabindex="0">
        Register as Agent
      </button>
    </div>
    <p class="terms-notice" data-component-type="text" data-component-id="terms_notice">By registering, you agree to the Mifos Agent Terms and Conditions.</p>
  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
