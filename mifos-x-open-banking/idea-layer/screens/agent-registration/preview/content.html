<!doctype html>
<html lang="en" data-screen="agent-registration" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
    }
    /* Top App Bar */
    .top-app-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--outline-variant);
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--on-surface);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .top-app-bar-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--on-surface);
    }
    /* Form Layout */
    .form-scroll {
      padding-bottom: 32px;
    }
    .screen-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      padding: 16px 20px 4px;
    }
    .screen-subtitle {
      font-size: 14px;
      color: var(--on-surface-variant);
      padding: 0 20px 24px;
      line-height: 1.5;
    }
    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--on-surface-variant);
      padding: 0 20px 6px;
    }
    .field-input {
      display: block;
      width: calc(100% - 40px);
      margin: 0 20px 20px;
      padding: 14px;
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      background: var(--surface);
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      color: var(--on-surface);
      outline: none;
    }
    .field-input:focus { border-color: var(--primary); }
    .field-input::placeholder { color: var(--outline); }
    .phone-row {
      display: flex;
      flex-direction: row;
      gap: 8px;
      margin: 0 20px 20px;
      align-items: stretch;
    }
    .phone-prefix {
      background: var(--background);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .phone-input-field {
      flex: 1;
      padding: 14px;
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      background: var(--surface);
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      color: var(--on-surface);
      outline: none;
    }
    .phone-input-field:focus { border-color: var(--primary); }
    .phone-input-field::placeholder { color: var(--outline); }
    /* Select dropdown simulation */
    .field-select {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      width: calc(100% - 40px);
      margin: 0 20px 20px;
      padding: 14px;
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      background: var(--surface);
      font-size: 14px;
      color: var(--outline);
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
    }
    /* Services chips */
    .services-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--on-surface-variant);
      padding: 8px 20px 10px;
    }
    .services-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 24px;
    }
    .service-chip {
      display: inline-flex;
      align-items: center;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--primary);
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      background: var(--primary-container);
      color: var(--primary);
    }
    .service-chip.selected {
      background: var(--primary);
      color: var(--on-primary);
    }
    /* Commission */
    .commission-wrap {
      position: relative;
      margin: 0 20px 28px;
    }
    .commission-wrap input {
      display: block;
      width: 100%;
      padding: 14px 40px 14px 14px;
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      background: var(--surface);
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      color: var(--on-surface);
      outline: none;
    }
    .commission-wrap input:focus { border-color: var(--primary); }
    .commission-wrap input::placeholder { color: var(--outline); }
    .commission-suffix {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--outline);
      font-size: 18px;
    }
    /* Submit */
    .submit-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 0 20px 12px;
      padding: 16px 24px;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 2px 6px rgba(76,102,43,0.25);
    }
    .terms-notice {
      font-size: 12px;
      color: var(--outline);
      text-align: center;
      padding: 0 20px 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-app-bar" role="banner">
    <button class="back-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <span class="top-app-bar-title">Agent Registration</span>
  </header>

  <div class="form-scroll">
    <h1 class="screen-title"
        data-component-type="text"
        data-component-id="agent_reg_title"
        role="heading"
        aria-level="1">Agent Registration</h1>
    <p class="screen-subtitle"
       data-component-type="text"
       data-component-id="agent_reg_subtitle">Register to become an authorised OBP field agent with your bank</p>

    <!-- Legal Name -->
    <label class="field-label"
           data-component-type="text"
           data-component-id="legal_name_label"
           for="legal_name_input">Legal Name</label>
    <input class="field-input"
           data-component-type="input"
           data-component-id="legal_name_input"
           data-action="focus_legal_name"
           id="legal_name_input"
           type="text"
           placeholder="e.g. Priya Chakraborty"
           role="textbox"
           aria-label="Legal name text field. Enter your full name exactly as it appears on your government-issued ID.">

    <!-- Mobile Phone -->
    <label class="field-label"
           data-component-type="text"
           data-component-id="phone_label">Mobile Phone Number</label>
    <div class="phone-row"
         data-component-type="stack"
         data-component-id="phone_input_row">
      <span class="phone-prefix"
            data-component-type="box"
            data-component-id="phone_prefix_box"
            aria-label="Country dialling code: +254 Kenya">+254</span>
      <input class="phone-input-field"
             data-component-type="input"
             data-component-id="phone_number_input"
             data-action="focus_phone"
             type="tel"
             placeholder="712 345 678"
             aria-label="Mobile phone number input. Country code +254 is already applied."
             tabindex="0">
    </div>

    <!-- Agent Number -->
    <label class="field-label"
           data-component-type="text"
           data-component-id="agent_number_label"
           for="agent_number_input">Agent Number</label>
    <input class="field-input"
           data-component-type="input"
           data-component-id="agent_number_input"
           data-action="focus_agent_number"
           id="agent_number_input"
           type="text"
           placeholder="e.g. AGT-2026-00142"
           role="textbox"
           aria-label="Agent number input. Enter the unique agent identifier assigned to you by Mifos.">

    <!-- Operating Currency -->
    <label class="field-label"
           data-component-type="text"
           data-component-id="currency_label">Operating Currency</label>
    <div class="field-select"
         data-component-type="input"
         data-component-id="currency_select"
         data-action="open_currency_picker"
         role="combobox"
         aria-label="Operating currency selector. Available options: EUR, GBP, KES, USD."
         aria-expanded="false"
         tabindex="0">
      <span>Select currency</span>
      <span class="material-icons" aria-hidden="true" style="font-size: 20px; color: var(--outline);">expand_more</span>
    </div>

    <!-- Supported Services -->
    <span class="services-label"
          data-component-type="text"
          data-component-id="services_section_label"
          role="heading"
          aria-level="2">Supported Services</span>
    <div class="services-chips"
         data-component-type="stack"
         data-component-id="services_chip_group"
         role="group"
         aria-label="Select one or more agent banking services you will provide. At least one service is required.">
      <button class="service-chip selected"
              data-action="toggle_service"
              aria-pressed="true"
              tabindex="0">Cash Deposit</button>
      <button class="service-chip selected"
              data-action="toggle_service"
              aria-pressed="true"
              tabindex="0">Cash Withdrawal</button>
      <button class="service-chip"
              data-action="toggle_service"
              aria-pressed="false"
              tabindex="0">Account Opening</button>
      <button class="service-chip"
              data-action="toggle_service"
              aria-pressed="false"
              tabindex="0">Bill Payment</button>
      <button class="service-chip"
              data-action="toggle_service"
              aria-pressed="false"
              tabindex="0">Fund Transfer</button>
    </div>

    <!-- Commission Rate -->
    <label class="field-label"
           data-component-type="text"
           data-component-id="commission_label"
           for="commission_rate_input">Commission Rate (%)</label>
    <div class="commission-wrap">
      <input data-component-type="input"
             data-component-id="commission_rate_input"
             data-action="focus_commission_rate"
             id="commission_rate_input"
             type="number"
             step="0.1"
             min="0.5"
             max="5.0"
             placeholder="e.g. 1.5"
             aria-label="Commission rate input. Enter a percentage between 0.5 and 5.0."
             tabindex="0">
      <span class="material-icons commission-suffix" aria-hidden="true">percent</span>
    </div>

    <!-- Submit -->
    <button class="submit-btn"
            data-component-type="button"
            data-component-id="register_agent_button"
            data-action="submit_registration"
            role="button"
            aria-label="Submit agent registration form. Ensure all fields are complete before submitting."
            tabindex="0">Register as Agent</button>

    <p class="terms-notice"
       data-component-type="text"
       data-component-id="terms_notice">By registering, you agree to the Mifos Agent Terms and Conditions</p>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
