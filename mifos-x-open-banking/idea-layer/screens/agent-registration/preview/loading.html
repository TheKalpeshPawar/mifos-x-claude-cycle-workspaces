<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Agent Registration — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;
  --background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --text-primary:#1A1C16;--text-secondary:#44483D;
  --tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;
  --nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font)}
main{display:flex;flex-direction:column;min-height:844px;align-items:center;justify-content:flex-start}

@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
.shim{background:linear-gradient(90deg,var(--surface-variant) 25%,#f0f2e8 50%,var(--surface-variant) 75%);background-size:780px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}

/* Top bar shimmer */
.top-bar-shim{
  width:390px;height:52px;background:var(--surface);
  border-bottom:1px solid var(--surface-variant);
  display:flex;align-items:center;gap:12px;padding:14px 16px;flex-shrink:0;
}
.back-shim{width:24px;height:24px;border-radius:4px;background:var(--surface-variant)}
.title-shim-bar{height:16px;width:140px;border-radius:6px}

/* Content */
.content-wrap{width:100%;display:flex;flex-direction:column;align-items:center;padding-top:80px;gap:16px}
.spinner-ring{
  width:48px;height:48px;border-radius:50%;
  border:4px solid var(--surface-variant);
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-text{font-size:14px;color:var(--outline);text-align:center;padding:0 40px;line-height:1.5}

/* Card shimmer below spinner */
.card-shim-wrap{background:var(--surface);border-radius:16px;margin:24px 16px 0;padding:20px;width:calc(100% - 32px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.field-shim{height:14px;border-radius:6px;margin-bottom:8px}
.input-shim{height:48px;border-radius:12px;margin-bottom:16px}
.btn-shim{height:52px;margin:0 20px 12px;border-radius:14px;width:calc(100% - 40px)}
</style>
</head>
<body>
<main data-screen="agent-registration" data-state="loading" role="main" aria-busy="true" aria-label="Checking existing agent status">

  <!-- Top bar -->
  <div class="top-bar-shim">
    <div class="back-shim"></div>
    <div class="shim title-shim-bar"></div>
  </div>

  <!-- Title shimmer -->
  <div class="shim" style="height:32px;width:200px;margin:16px 20px 8px;border-radius:8px;align-self:flex-start"></div>
  <div class="shim" style="height:14px;width:300px;margin:0 20px 24px;border-radius:6px;align-self:flex-start"></div>

  <!-- Spinner (checking agent status) -->
  <div class="content-wrap" aria-label="Checking existing agent status">
    <div class="spinner-ring" role="progressbar" aria-label="Verifying your existing agent status with the bank. Please wait."></div>
    <p class="loading-text" aria-live="polite">Checking registration status…</p>
  </div>

  <!-- Ghost card -->
  <div class="card-shim-wrap">
    <div class="shim field-shim" style="width:100px"></div>
    <div class="shim input-shim"></div>
    <div class="shim field-shim" style="width:140px"></div>
    <div class="shim input-shim"></div>
    <div class="shim field-shim" style="width:90px;margin-bottom:24px"></div>
  </div>

  <div class="shim btn-shim" style="margin-top:16px"></div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
