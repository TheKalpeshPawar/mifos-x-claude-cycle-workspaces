<!doctype html>
<!-- render-hash: ar-loading-n14 -->
<html lang="en" data-screen="agent-registration" data-state="loading" data-feature="agent-registration" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Agent Registration — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --skeleton-base: #E1E4D5; --skeleton-shine: #F1F3E5;
      --radius-soft: 12px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285; --outline-variant: #44483D;
      --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285; --outline-variant: #44483D;
        --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; padding-bottom: 24px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); }
    .top-bar h1 { font-size: 18px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .skel { background: linear-gradient(90deg, var(--skeleton-base) 0%, var(--skeleton-shine) 50%, var(--skeleton-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-title { height: 28px; width: 60%; margin: 20px 20px 6px; border-radius: 8px; }
    .skel-sub { height: 14px; width: 85%; margin: 0 20px 4px; }
    .skel-sub-2 { height: 14px; width: 55%; margin: 0 20px 24px; }
    .skel-label { height: 11px; width: 30%; margin: 0 20px 6px; }
    .skel-input { height: 48px; margin: 0 20px 14px; border-radius: var(--radius-soft); }
    .skel-chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 24px; }
    .skel-chip { height: 34px; width: 100px; border-radius: 17px; }
    .skel-chip.w-1 { width: 120px; }
    .skel-chip.w-2 { width: 110px; }
    .skel-btn { height: 54px; margin: 4px 20px 12px; border-radius: var(--radius-soft); }
    .loading-hint { display: flex; align-items: center; gap: 10px; color: var(--on-surface-variant); padding: 8px 20px; font-size: 13px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--surface-variant); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main aria-busy="true" aria-live="polite">
    <header class="top-bar" role="banner">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back" role="button">arrow_back</span>
      <h1>Agent Registration</h1>
    </header>
    <span class="sr-only">Checking your agent registration status, please wait.</span>

    <div class="skel skel-title" aria-hidden="true"></div>
    <div class="skel skel-sub" aria-hidden="true"></div>
    <div class="skel skel-sub-2" aria-hidden="true"></div>

    <div class="loading-hint" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <span data-component-type="text" data-component-id="loading_label">Checking registration status…</span>
    </div>

    <div class="skel skel-label" aria-hidden="true"></div>
    <div class="skel skel-input" data-component-type="skeleton" data-component-id="legal_name_skel" aria-hidden="true"></div>

    <div class="skel skel-label" aria-hidden="true"></div>
    <div class="skel skel-input" data-component-type="skeleton" data-component-id="phone_skel" aria-hidden="true"></div>

    <div class="skel skel-label" aria-hidden="true"></div>
    <div class="skel skel-input" data-component-type="skeleton" data-component-id="agent_num_skel" aria-hidden="true"></div>

    <div class="skel skel-label" aria-hidden="true"></div>
    <div class="skel skel-input" data-component-type="skeleton" data-component-id="currency_skel" aria-hidden="true"></div>

    <div class="skel skel-label" aria-hidden="true"></div>
    <div class="skel-chip-row" aria-hidden="true">
      <div class="skel skel-chip"></div>
      <div class="skel skel-chip w-1"></div>
      <div class="skel skel-chip w-2"></div>
      <div class="skel skel-chip"></div>
    </div>

    <div class="skel skel-label" aria-hidden="true"></div>
    <div class="skel skel-input" data-component-type="skeleton" data-component-id="commission_skel" aria-hidden="true"></div>

    <div class="skel skel-btn" aria-hidden="true"></div>
  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
