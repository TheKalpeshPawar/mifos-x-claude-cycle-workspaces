<!doctype html>
<html lang="en" data-screen="agent-registration" data-state="validation_error" data-feature="agent-registration" data-flavor="fieldOfficer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent Registration — Validation Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; }
    .error-banner { background: rgba(186,26,26,0.08); border: 1px solid var(--error); border-radius: 12px; padding: 14px 16px; margin: 8px 20px; display: flex; align-items: flex-start; gap: 10px; } .error-banner .material-icons { font-size: 20px; color: var(--error); } .error-banner p { font-size: 13px; color: var(--error); line-height: 1.5; }
    .form { padding: 8px 20px; }
    .input-group { margin-bottom: 16px; } .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; } .input-field { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--on-surface); } .input-field.error { border-color: var(--error); } .field-error { font-size: 12px; color: var(--error); margin-top: 4px; }
    .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Agent Registration</h1></div>
    <div class="error-banner" role="alert"><span class="material-icons">error_outline</span><p>Please fix the errors below to continue.</p></div>
    <div class="form">
      <div class="input-group"><label>Legal Name</label><input type="text" class="input-field error" value="" aria-label="Legal Name" tabindex="0"><div class="field-error">Legal name is required</div></div>
      <div class="input-group"><label>Phone Number</label><input type="tel" class="input-field" value="+254 712 345 678" aria-label="Phone" tabindex="0"></div>
      <div class="input-group"><label>Agent Number</label><input type="text" class="input-field error" value="" aria-label="Agent Number" tabindex="0"><div class="field-error">Agent number is required</div></div>
      <button class="submit-btn" data-action="submit_registration" tabindex="0" aria-label="Register Agent">Register Agent</button>
    </div>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
