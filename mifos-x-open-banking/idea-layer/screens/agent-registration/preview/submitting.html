<!doctype html>
<html lang="en" data-screen="agent-registration" data-state="submitting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Registration — Submitting</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; position: relative; }
    .top-app-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--outline-variant); padding: 14px 16px 10px; opacity: 0.5; }
    .back-btn { background: none; border: none; color: var(--on-surface); padding: 4px; display: flex; align-items: center; }
    .top-app-bar-title { font-size: 18px; font-weight: 600; color: var(--on-surface); }
    .form-scroll { padding: 24px 20px; opacity: 0.4; pointer-events: none; }
    .screen-title { font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .field-mock { height: 48px; border: 1px solid var(--outline-variant); border-radius: 12px; background: var(--surface); margin-bottom: 20px; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; display: block; }
    .submitting-overlay { position: fixed; inset: 0; max-width: 390px; margin: 0 auto; background: rgba(249,250,239,0.65); display: flex; align-items: center; justify-content: center; z-index: 30; }
    .overlay-card { background: var(--surface); border-radius: 16px; padding: 36px 28px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.14); display: flex; flex-direction: column; align-items: center; gap: 16px; width: 280px; }
    .overlay-spinner { width: 52px; height: 52px; border: 4px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { font-size: 17px; font-weight: 600; color: var(--on-surface); }
    .overlay-sub { font-size: 13px; color: var(--outline); }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <header class="top-app-bar" role="banner">
    <button class="back-btn" aria-label="Go back" aria-disabled="true">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <span class="top-app-bar-title">Agent Registration</span>
  </header>

  <div class="form-scroll">
    <h1 class="screen-title">Agent Registration</h1>
    <div style="height:8px;"></div>
    <label class="field-label">Legal Name</label><div class="field-mock"></div>
    <label class="field-label">Mobile Phone Number</label><div class="field-mock"></div>
    <label class="field-label">Agent Number</label><div class="field-mock"></div>
    <label class="field-label">Commission Rate</label><div class="field-mock"></div>
  </div>

  <div class="submitting-overlay" role="status" aria-live="polite" aria-label="Submitting agent registration"
       data-component-type="box" data-component-id="agent_submitting_overlay">
    <div class="overlay-card">
      <div class="overlay-spinner" aria-hidden="true"></div>
      <span class="overlay-text">Submitting registration...</span>
      <span class="overlay-sub">Verifying agent details with the bank</span>
    </div>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
