sibling: api
schema_version: "4.0"
feature_id: agent-registration
api:
  - id: obp_create_agent
    endpoint: "POST /obp/v5.1.0/banks/{bankId}/agents"
    tag: Agent
    description: "Register the field officer as an OBP bank agent"
    request:
      fields:
        - name: legal_name
          type: String
          example: "Priya Chakraborty"
        - name: mobile_phone_number
          type: String
          example: "+254712345678"
        - name: agent_number
          type: String
          example: "AGT-2026-00142"
        - name: currency
          type: String
          values: [EUR, GBP, KES, USD]
          example: "KES"
        - name: supported_services
          type: "List<String>"
          values: [cash_deposit, cash_withdrawal, account_opening, bill_payment, fund_transfer]
        - name: commission_rate
          type: Number
          example: 1.5
    response:
      fields:
        - name: agent_id
          type: String
        - name: is_pending_agent
          type: Boolean
        - name: is_confirmed_agent
          type: Boolean
        - name: legal_name
          type: String
        - name: mobile_phone_number
          type: String
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 400
        message: "INVALID_PHONE_NUMBER"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 409
        message: "AGENT_ALREADY_EXISTS"
