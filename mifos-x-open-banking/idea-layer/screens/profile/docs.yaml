feature: profile
contract_version: "2.0.0"
status: approved
approve_hash: "sha256:a89c948f2a16becd6d18cef960d51a4a0ddfe178e49c3013876374a496789cd0"
approved_at: "2026-07-14T00:00:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "2.0.0"
score: 98
cluster: settings
acceptance_refs:
  - FR-007
scaffolded_by: /idea-heal
archetype: detail_screen
description: >-
  Connected identity from the HSBC AIS party endpoint (name, email, mobile, residential address), full active-consent
  summary (status, expiry, granted permissions), expiry warning for near-expiry consent (≤7 days), and sign-out.
  Requires ReadParty permission. Sign-out clears tokens and consent from the device.
has_ui: true
has_server: false
metadata:
  category: composite
  implementation_ready: true
  impl_ready_at: '2026-06-29T12:00:00Z'
  impl_ready_schema: v2
contracts:
  - endpoint: GET /accounts/{AccountId}/party
    spec: hsbc-obie-ais-v4.0
    required_permission: ReadParty
    response_fields:
      - Name
      - EmailAddress
      - Phone
      - Address
    notes: 'Address is an array; use first entry with AddressType: Residential for display.'
libraries:
  - capability: http-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
vm_actions:
  - name: loadProfile
    signature: suspend fun loadProfile()
    state_mutations:
      - party
      - party.Initials (derived from party.Name)
      - consent (status, expiry_date, consent_id, permissions)
      - consent.days_remaining (computed)
      - uiState (loading → content | content_expiring | error)
    side_effects:
      - Calls PartyApiService.getParty(accountId)
      - Reads active consent record from local token store
      - Computes party.Initials from party.Name (first letter of each word, max 2)
      - Computes consent.days_remaining; if ≤7 emits content_expiring state
    error_handling:
      on_401: Trigger token refresh then retry once; if second 401, call executeSignOut()
      on_403: Show error with ReadParty permission message
      on_404: Show error with party-not-found message
      on_network_error: Show generic network error with Retry button
  - name: navigateConsentDetail
    signature: fun navigateConsentDetail()
    state_mutations: []
    side_effects:
      - Emits navigation event to consent-detail route
    error_handling: {}
  - name: navigateConsentRenew
    signature: fun navigateConsentRenew()
    state_mutations: []
    side_effects:
      - Emits navigation event to consent-detail route with renew=true parameter
    error_handling: {}
  - name: confirmSignOut
    signature: fun confirmSignOut()
    state_mutations:
      - uiState (content | content_expiring → confirm_sign_out)
      - previousState (saved for cancel restore)
    side_effects: []
    error_handling: {}
  - name: dismissSignOutDialog
    signature: fun dismissSignOutDialog()
    state_mutations:
      - uiState (confirm_sign_out → previousState)
    side_effects: []
    error_handling: {}
  - name: executeSignOut
    signature: suspend fun executeSignOut()
    state_mutations:
      - party (cleared)
      - consent (cleared)
    side_effects:
      - Deletes access token from EncryptedSharedPreferences / Keychain
      - Deletes refresh token from EncryptedSharedPreferences / Keychain
      - Deletes consent ID from local store
      - Navigates to login screen
    error_handling:
      on_error: Log and navigate to login regardless
  - name: retryLoad
    signature: suspend fun retryLoad()
    state_mutations:
      - uiState (error → loading)
    side_effects:
      - Re-invokes loadProfile()
    error_handling:
      on_error: Transition back to error state with updated message
  - name: navigateReauth
    signature: fun navigateReauth()
    state_mutations: []
    side_effects:
      - Emits navigation event to login route to re-initiate FAPI auth flow
    error_handling: {}
    notes: >-
      Triggered from the empty state when GET /party returns 200 with empty Party array.
      Navigating to login allows the user to re-authorise and potentially grant ReadParty scope.
error_cases:
  - id: EC-PROF-001
    trigger: HTTP 401 from party endpoint
    handling: Token refresh → retry; if second 401, execute sign out
  - id: EC-PROF-002
    trigger: HTTP 403 — ReadParty scope not granted in consent
    handling: >-
      Error state with message: 'Consent does not include profile access. The ReadParty permission was not granted when
      you authorised this app.'
  - id: EC-PROF-003
    trigger: HTTP 404 — party resource not found for account
    handling: 'Error state with message: ''Profile not found for the linked account. Please contact HSBC if this persists.'''
  - id: EC-PROF-004
    trigger: Network timeout or no connectivity
    handling: Error state with generic network error message; Retry button available
  - id: EC-PROF-005
    trigger: consent.days_remaining <= 7 after successful party load
    handling: State transitions to content_expiring; expiry warning banner and Renew Consent CTA displayed
  - id: EC-PROF-006
    trigger: HTTP 200 from party endpoint but Data.Party array is empty
    handling: >-
      State transitions to empty; empty_state renders with title 'No profile data available' and body
      explaining the consent may not include identity data. Re-authorise button navigates to login to
      re-initiate FAPI flow with ReadParty scope.
