sibling: api
schema_version: "4.0"
feature_id: profile
# MIGRATION OBP -> HSBC (2026-06-11): OBP /users/current has no HSBC Open Banking equivalent.
# The PSU's identity comes from the OBIE AIS Party resource (read-only). There is NO update-profile
# endpoint under Open Banking — account-holder details are owned by the bank and cannot be edited by a
# TPP; the old PUT /users/current is removed. Editable items on this screen (display prefs, disconnect)
# are local or route to consent-manager.
api:
  - id: get_party
    endpoint: "GET /obie/open-banking/v4.0/aisp/party"
    tag: AISP-Party
    trigger: on_screen_load
    description: "OBIE account-holder party (the PSU) for the authorised account-access consent. Requires the ReadParty permission cluster + an AUTH-status consent + scoped access token. CE HSBCnet + Malta use the /ce/.../v3.1 path."
    consent_dependency: "account-access consent (Status AUTH), permission ReadParty"
    demo_source: demo-data.yaml#/collections/get_party_response
    response:
      fields:
        - name: Data.Party.PartyId
          type: String
        - name: Data.Party.Name
          type: String
          pii: true
        - name: Data.Party.FullLegalName
          type: String
          pii: true
        - name: Data.Party.EmailAddress
          type: String
          pii: true
        - name: Data.Party.Phone
          type: String
          pii: true
        - name: Data.Party.PartyType
          type: String
    errors:
      - code: 401
        name: UNAUTHORIZED
        ui_message: "Could not load your profile — reconnect your HSBC account."
      - code: 403
        name: OB_RESOURCE_INVALID_CONSENT
        ui_message: "Your data-sharing consent doesn't include profile details."
      - code: 500
        name: OB_UNEXPECTED_ERROR
        ui_message: "Could not load your profile"

unsupported:
  - capability: update_profile
    reason: "OBIE Open Banking is read-only for account-holder data — a TPP cannot update the PSU's name/email/phone. The OBP PUT /users/current is removed. Account-holder details are managed by HSBC directly."

dependencies:
  disconnect_action: "routes to consent-manager / consent-intro (revoke account-access consent via DELETE /aisp/account-access-consents/{ConsentId}) — there is no password logout"
