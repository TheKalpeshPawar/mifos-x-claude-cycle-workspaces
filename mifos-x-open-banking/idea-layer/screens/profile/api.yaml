sibling: api
schema_version: "4.0"
feature_id: profile
api:
  - id: obp_get_user_profile
    endpoint: "GET /obp/v4.0.0/users/current"
    tag: UserProfile
    trigger: on_screen_load
    description: "Shipped ProfileApi.getCurrentUser — the only endpoint Profile consumes. phone is NOT in the response."
    response:
      fields:
        - name: user_id
          type: String
        - name: username
          type: String
        - name: email
          type: String
    errors:
      - code: 401
        name: AUTH_ERROR
        ui_message: "Could not load your profile"
      - code: 500
        name: NETWORK_ERROR
        ui_message: "Could not load your profile"

  - id: obp_update_user_profile
    endpoint: "PUT /obp/v4.0.0/users/current"
    tag: UserProfile
    trigger: deferred
    status: deferred
    description: "ProfileApi.updateCurrentUser exists but is NOT consumed — Profile is read-only and never calls it. Listed for contract completeness only."
