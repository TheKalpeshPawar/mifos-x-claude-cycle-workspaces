screen_id: profile

endpoints:
  - id: party
    method: GET
    path: "/accounts/{AccountId}/party"
    response_dto: OBReadParty2
    permission: ReadParty
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Fetches the single account holder (OBReadParty2) for the primary authorised account. Used to populate the connected identity section."
