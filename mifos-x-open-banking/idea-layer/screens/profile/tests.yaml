screen_id: profile

scenarios:
  - id: TC-PROF-001
    description: "Profile loads and renders identity, consent summary with permissions, and sign-out"
    state: content
    given: "Valid PSU access token; HSBC sandbox returns party for account 40051512345678; consent expires >7 days away (89 days remaining)"
    when: "Screen mounts"
    then:
      - "Avatar shows initials 'PS' derived from 'Priya Sharma'"
      - "Name row shows 'Priya Sharma'"
      - "Email row shows 'priya.sharma@example.co.uk'"
      - "Mobile row shows '+44 7700 900482'"
      - "Address row shows '12 Baker Street, London W1U 6TZ'"
      - "Consent card shows status 'Authorised' and expiry '26 Sep 2026'"
      - "Permissions list shows ReadAccountsDetail, ReadBalances, ReadTransactionsDetail, ReadParty (and others)"
      - "Sign Out button visible with error colour"
      - "Expiry warning banner NOT visible"

  - id: TC-PROF-002
    description: "Loading state shown while fetching party"
    state: loading
    given: "Party API call in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible"
      - "Identity content not rendered"
      - "Sign Out button not visible"

  - id: TC-PROF-003
    description: "Error state with Retry on 403 — ReadParty permission not granted"
    state: error
    given: "Party endpoint returns 403 — ReadParty scope was not included in the consent"
    when: "Screen mounts"
    then:
      - "Error empty_state renders with title 'Could not load profile'"
      - "Error message explains missing ReadParty permission"
      - "Retry button visible and tapping it re-triggers profile_load (transitions to loading)"

  - id: TC-PROF-004
    description: "Sign Out shows confirmation dialog"
    state: confirm_sign_out
    given: "Screen is in content state"
    when: "User taps 'Sign Out'"
    then:
      - "Dialog visible with title 'Sign out?'"
      - "Dialog body explains token and consent clearing"
      - "Cancel button (text variant) and Sign Out button (filled, error colour) present"

  - id: TC-PROF-005
    description: "Confirming sign out clears tokens and navigates to login"
    state: content
    when: "User taps Sign Out → confirms in dialog"
    then:
      - "Access token deleted from EncryptedSharedPreferences / Keychain"
      - "Refresh token deleted from EncryptedSharedPreferences / Keychain"
      - "Consent ID deleted from local store"
      - "App navigates to login screen"

  - id: TC-PROF-006
    description: "Manage Consent navigates to consent-detail"
    state: content
    when: "User taps 'Manage Consent'"
    then: "Navigates to consent-detail screen"

  - id: TC-PROF-007
    description: "401 triggers token refresh; on second 401 user is signed out"
    state: content
    given: "Access token is expired; refresh token valid; party endpoint returns 401 on first call"
    when: "Screen mounts"
    then:
      - "ViewModel triggers token refresh on first 401"
      - "Party endpoint retried with new access token"
      - "Content rendered if refresh succeeds"
      - "If second 401 received after refresh: tokens cleared and app navigates to login"

  - id: TC-PROF-008
    description: "content_expiring state shows warning banner when consent expires within 7 days"
    state: content_expiring
    given: "Valid PSU access token; party load succeeds; consent expires in 5 days (days_remaining=5)"
    when: "Screen mounts"
    then:
      - "All content from TC-PROF-001 visible (identity card, consent card, sign-out)"
      - "Expiry warning banner visible above consent card"
      - "Warning banner text includes days remaining count"
      - "Renew Consent button visible inside warning banner"
      - "Tapping Renew Consent navigates to consent-detail with renew intent"

  - id: TC-PROF-009
    description: "Address row displays residential address from OBIE party payload"
    state: content
    given: "Party payload includes Address entry with AddressType: Residential"
    when: "Content rendered"
    then:
      - "Address row shows '12 Baker Street, London W1U 6TZ'"
      - "Home icon visible on address row"
      - "Address row accessibility label is set (not empty)"

  - id: TC-PROF-010
    description: "404 from party endpoint shows party-not-found error message"
    state: error
    given: "Party endpoint returns 404 for account 40051512345678"
    when: "Screen mounts"
    then:
      - "Error empty_state renders with title 'Could not load profile'"
      - "Error message indicates profile not found for linked account"
      - "Retry button visible"

  - id: TC-PROF-011
    description: "Cancelling sign-out dialog restores previous state without clearing tokens"
    state: confirm_sign_out
    when: "User taps Cancel in sign-out dialog"
    then:
      - "Dialog dismissed"
      - "Screen returns to content or content_expiring state (whichever preceded the dialog)"
      - "Access token, refresh token, and consent ID remain in secure storage"

  - id: TC-PROF-012
    description: "Permissions list renders only granted permissions from cached consent"
    state: content
    given: "Consent grants ReadAccountsDetail, ReadBalances, ReadTransactionsDetail, ReadParty only (minimal AIS set)"
    when: "Content rendered"
    then:
      - "Permissions list shows exactly 4 items matching the granted set"
      - "Each row shows check_circle icon with success tint"

  - id: TC-PROF-013
    description: "Empty state shown when GET /party returns 200 with empty Party array (EC-PROF-006)"
    state: empty
    given: "Valid PSU access token; HSBC party endpoint returns HTTP 200 with Data.Party = [] (empty array)"
    when: "Screen mounts and loadProfile() processes the empty-party response"
    then:
      - "Empty state component (profile_empty_state) renders"
      - "Icon account_circle_off visible"
      - "Title shows 'No profile data available'"
      - "Body explains Open Banking consent may not include identity data"
      - "Re-authorise button visible with filled variant"
      - "Loading indicator not visible"
      - "Identity card not rendered"
      - "Consent summary card not rendered"
      - "Sign Out button not visible"
      - "Tapping Re-authorise triggers navigateReauth() and navigates to login screen"
