screen_id: profile
name: "Profile"
status: enriched
initial_state: loading
quality_score: 93

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.profile_screen_title}"
  top_app_bar_leading: back
  fab_visible: false

business_logic:
  kind: composite
  description: "Fetches PSU identity via hsbc-obie-ais-v4.0:party using ktorfit then merges it with the cached active-consent record (status, expiry, permissions list). Derives content_expiring state client-side when consent.days_remaining ≤7. Displays name, email, mobile, residential address, consent status, expiry, and the full set of granted OBIE Read permissions. Sign-out clears access token, refresh token, and ConsentId from encrypted storage and navigates to login. A 401 triggers token refresh before retry; if refresh yields a second 401 the user is signed out. A 403 with missing ReadParty scope surfaces a targeted error; a 404 surfaces party-not-found."
  external_library_refs:
    - "ktorfit"
    - "hsbc-obie-ais-v4.0:party"
  description_author: claude
  description_authored_at: "2026-06-29T12:00:00Z"

states: [loading, content, content_expiring, confirm_sign_out, error]

components:
  # ── Loading ──────────────────────────────────────────────────────────
  - type: progress_indicator
    variant: circular
    state_binding: [loading]
    accessibility_label: "{strings.profile_loading_label}"
    test_context:
      purpose: "Shown while party API call is in-flight; verify it disappears on content/error transition"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Identity header ──────────────────────────────────────────────────
  - type: card
    id: identity_header_card
    state_binding: [content, content_expiring, confirm_sign_out]
    elevation: 2
    accessibility_label: "{strings.profile_identity_card_label}"
    test_context:
      purpose: "Identity summary card; verifies card renders in content, content_expiring, and confirm_sign_out states"
      required_fields: [party.Name]
      interaction_type: display
      data_driven: true
    children:
      - type: avatar
        id: user_avatar
        initials: "{party.Initials}"
        size: 72
        color: primary
        accessibility_label: "{strings.profile_avatar_label}"
        test_context:
          purpose: "Avatar with initials derived from party.Name by ViewModel; verify initials match name (e.g. 'PS' for 'Priya Sharma')"
          required_fields: [party.Name]
          interaction_type: display
          data_driven: true

      - type: text
        id: user_full_name
        value: "{party.Name}"
        style: headlineMedium
        role: title
        test_context:
          purpose: "Full name from party endpoint; must not be empty after successful load"
          required_fields: [party.Name]
          interaction_type: display
          data_driven: true

      - type: text
        id: party_type
        value: "{strings.profile_identity_account_type}"
        style: labelMedium
        color: "secondary"
        test_context:
          purpose: "Static label indicating account type; verifies string is present"
          required_fields: []
          interaction_type: display
          data_driven: false

  # ── Identity rows ────────────────────────────────────────────────────
  - type: section_header
    id: identity_section_header
    state_binding: [content, content_expiring, confirm_sign_out]
    label: "{strings.profile_section_identity}"
    accessibility_label: "{strings.profile_section_identity}"
    test_context:
      purpose: "Section label for identity detail rows; visible in content, content_expiring, and confirm_sign_out states"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: list
    id: identity_list
    state_binding: [content, content_expiring, confirm_sign_out]
    test_context:
      purpose: "Container for email, mobile, and address rows from party payload"
      required_fields: []
      interaction_type: display
      data_driven: false
    children:
      - type: list_item
        id: email_row
        label: "{strings.profile_identity_email_label}"
        supporting_text: "{party.EmailAddress}"
        icon: email
        accessibility_label: "{strings.profile_identity_email_a11y}"
        test_context:
          purpose: "Displays PSU email from party.EmailAddress; verify field non-empty after load; row may be hidden if EmailAddress is null"
          required_fields: [party.EmailAddress]
          interaction_type: display
          data_driven: true

      - type: list_item
        id: mobile_row
        label: "{strings.profile_identity_mobile_label}"
        supporting_text: "{party.Phone}"
        icon: phone
        accessibility_label: "{strings.profile_identity_mobile_a11y}"
        test_context:
          purpose: "Displays PSU mobile from party.Phone; verify field non-empty after load"
          required_fields: [party.Phone]
          interaction_type: display
          data_driven: true

      - type: list_item
        id: address_row
        label: "{strings.profile_identity_address_label}"
        supporting_text: "{party.Address.StreetName}, {party.Address.TownName} {party.Address.PostCode}"
        icon: home
        accessibility_label: "{strings.profile_identity_address_a11y}"
        test_context:
          purpose: "Displays residential address from party.Address[0] (AddressType: Residential); verify formatted address non-empty after load; row hidden if Address absent"
          required_fields: [party.Address]
          interaction_type: display
          data_driven: true

  # ── Consent expiry warning banner (content_expiring only) ─────────────
  - type: card
    id: expiry_warning_banner
    state_binding: [content_expiring]
    elevation: 0
    variant: warning
    accessibility_label: "{strings.profile_expiry_warning_label}"
    test_context:
      purpose: "Warning card shown exclusively in content_expiring state (consent.days_remaining ≤7); verify it is absent in standard content state"
      required_fields: [consent.days_remaining]
      interaction_type: display
      data_driven: true
    children:
      - type: icon
        id: warning_icon
        name: warning_amber
        color: warning
        accessibility_label: ""

      - type: text
        id: expiry_warning_text
        value: "{strings.profile_expiry_warning_text}"
        style: bodyMedium
        color: warning
        test_context:
          purpose: "Template string rendered with consent.days_remaining substituted; e.g. 'Your consent expires in 5 days'"
          required_fields: [consent.days_remaining]
          interaction_type: display
          data_driven: true

      - type: button
        id: renew_consent_button
        variant: tonal
        label: "{strings.profile_button_renew_consent}"
        accessibility_label: "{strings.profile_button_renew_consent_a11y}"
        test_context:
          purpose: "Navigates to consent-detail with renew intent to re-authorise expiring consent"
          required_fields: []
          interaction_type: navigate
          data_driven: false
        on_click:
          action: navigate_consent_renew
          target: consent-detail

  # ── Open Banking Connection ──────────────────────────────────────────
  - type: section_header
    id: connection_section_header
    state_binding: [content, content_expiring, confirm_sign_out]
    label: "{strings.profile_section_connection}"
    accessibility_label: "{strings.profile_section_connection}"
    test_context:
      purpose: "Section label for consent summary; visible in content, content_expiring, and confirm_sign_out states"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: card
    id: consent_summary_card
    state_binding: [content, content_expiring, confirm_sign_out]
    elevation: 1
    accessibility_label: "{strings.profile_consent_card_label}"
    test_context:
      purpose: "Consent summary from cached consent record; verify status, expiry, and permissions list populated"
      required_fields: [consent.status, consent.expiry_date, consent.permissions]
      interaction_type: display
      data_driven: true
    children:
      - type: text
        id: bank_label
        value: "{strings.profile_connection_bank_label}"
        style: titleMedium
        icon: account_balance
        test_context:
          purpose: "Static bank connection label; verify it renders when consent present"
          required_fields: []
          interaction_type: display
          data_driven: false

      - type: list_item
        id: consent_status_row
        label: "{strings.profile_connection_status_label}"
        supporting_text: "{consent.status}"
        icon: verified
        accessibility_label: "{strings.profile_connection_status_a11y}"
        test_context:
          purpose: "Displays active-consent status (Authorised/Expired/Revoked) from cached consent record"
          required_fields: [consent.status]
          interaction_type: display
          data_driven: true

      - type: list_item
        id: consent_expiry_row
        label: "{strings.profile_connection_expiry_label}"
        supporting_text: "{consent.expiry_date}"
        icon: schedule
        accessibility_label: "{strings.profile_connection_expiry_a11y}"
        test_context:
          purpose: "Displays human-readable consent expiry date; verify formatted date string non-empty"
          required_fields: [consent.expiry_date]
          interaction_type: display
          data_driven: true

      - type: section_header
        id: permissions_section_header
        label: "{strings.profile_connection_permissions_label}"
        accessibility_label: "{strings.profile_connection_permissions_label}"
        test_context:
          purpose: "Sub-section label for the granted OBIE AIS permissions list"
          required_fields: []
          interaction_type: display
          data_driven: false

      - type: list
        id: permissions_list
        test_context:
          purpose: "Human-readable list of OBIE Read permissions granted in the active consent; each row shows one permission"
          required_fields: [consent.permissions]
          interaction_type: display
          data_driven: true
        children:
          - type: list_item
            id: perm_accounts_detail
            label: "{strings.perm_read_accounts_detail}"
            icon: check_circle
            icon_tint: success
            accessibility_label: "{strings.perm_read_accounts_detail}"
            test_context:
              purpose: "ReadAccountsDetail permission indicator; visible if included in consent.permissions"
              required_fields: [consent.permissions]
              interaction_type: display
              data_driven: true

          - type: list_item
            id: perm_balances
            label: "{strings.perm_read_balances}"
            icon: check_circle
            icon_tint: success
            accessibility_label: "{strings.perm_read_balances}"
            test_context:
              purpose: "ReadBalances permission indicator; visible if included in consent.permissions"
              required_fields: [consent.permissions]
              interaction_type: display
              data_driven: true

          - type: list_item
            id: perm_transactions
            label: "{strings.perm_read_transactions_detail}"
            icon: check_circle
            icon_tint: success
            accessibility_label: "{strings.perm_read_transactions_detail}"
            test_context:
              purpose: "ReadTransactionsDetail permission indicator; visible if included in consent.permissions"
              required_fields: [consent.permissions]
              interaction_type: display
              data_driven: true

          - type: list_item
            id: perm_party
            label: "{strings.perm_read_party}"
            icon: check_circle
            icon_tint: success
            accessibility_label: "{strings.perm_read_party}"
            test_context:
              purpose: "ReadParty permission indicator; visible if included in consent.permissions"
              required_fields: [consent.permissions]
              interaction_type: display
              data_driven: true

      - type: button
        id: manage_consent_button
        variant: tonal
        label: "{strings.profile_button_manage_consent}"
        accessibility_label: "{strings.profile_button_manage_consent_a11y}"
        test_context:
          purpose: "Navigation to consent-detail screen; verify tap navigates in content and content_expiring states"
          required_fields: []
          interaction_type: navigate
          data_driven: false
        on_click:
          action: navigate_consent_detail
          target: consent-detail

  # ── Sign out ─────────────────────────────────────────────────────────
  - type: button
    id: sign_out_button
    state_binding: [content, content_expiring]
    variant: outlined
    label: "{strings.profile_button_sign_out}"
    color: error
    accessibility_label: "{strings.profile_button_sign_out_a11y}"
    test_context:
      purpose: "Destructive action entry; verify error colour applied; visible in content and content_expiring but NOT in loading or error states"
      required_fields: []
      interaction_type: action
      data_driven: false
    on_click:
      action: confirm_sign_out

  # ── Confirm sign-out dialog ──────────────────────────────────────────
  - type: dialog
    id: sign_out_dialog
    state_binding: [confirm_sign_out]
    title: "{strings.profile_dialog_sign_out_title}"
    body: "{strings.profile_dialog_sign_out_body}"
    accessibility_label: "{strings.profile_dialog_sign_out_a11y}"
    test_context:
      purpose: "Destructive confirmation dialog; verify it appears only in confirm_sign_out state"
      required_fields: []
      interaction_type: action
      data_driven: false
    children:
      - type: button
        id: cancel_sign_out_button
        variant: text
        label: "{strings.profile_button_cancel}"
        accessibility_label: "{strings.profile_button_cancel_a11y}"
        test_context:
          purpose: "Dismisses sign-out dialog and returns to content/content_expiring state; tokens remain intact"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: dismiss_sign_out_dialog

      - type: button
        id: confirm_sign_out_button
        variant: filled
        label: "{strings.profile_button_sign_out}"
        color: error
        accessibility_label: "{strings.profile_button_confirm_sign_out_a11y}"
        test_context:
          purpose: "Confirms sign-out: clears access token, refresh token, and consent ID from secure storage; navigates to login"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: execute_sign_out

  # ── Error state ──────────────────────────────────────────────────────
  - type: empty_state
    id: error_state
    variant: error
    state_binding: [error]
    icon: error_outline
    title: "{strings.profile_error_title}"
    body: "{error.message}"
    accessibility_label: "{strings.profile_error_a11y}"
    test_context:
      purpose: "Error surface for 401/403/404/network failures; verify code-specific message populated and retry button visible"
      required_fields: [error.message]
      interaction_type: display
      data_driven: true
    children:
      - type: button
        id: retry_button
        variant: filled
        label: "{strings.profile_button_retry}"
        accessibility_label: "{strings.profile_button_retry_a11y}"
        test_context:
          purpose: "Re-triggers loadProfile coroutine; transitions screen back to loading state"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: retry_load

status_history:
  - from: draft
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"
  - from: enriched
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"
    notes: "Quality pushed 85→93: full i18n coverage (42 keys), content_expiring state + expiry warning banner, address row, permissions list in consent card, accessibility labels on all section headers and cards, sign_out_button state_binding extended to content_expiring, avatar initials data-driven."
