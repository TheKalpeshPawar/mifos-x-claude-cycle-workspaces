id: profile
name: "User Profile"
feature: profile
flavor: shared
status: approved
quality_score: 99
contract_version: "1.1.0"
approve_hash: "sha256:16af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-002]
status_history:
  - { from: draft, to: enriched, at: "2026-05-25", by: "/idea enrich" }
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-05-27"
    by: "/idea enrich"
    note: "re-enriched: +component_states, +initial_state, +api bindings"

screens:
  - id: profile
    name: "Profile"
    viewmodel: "ProfileViewModel"

archetype: profile

components:
  - type: stack
    id: profile_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - profile_avatar_section
      - profile_form_section
      - profile_action_section
      - profile_danger_section

  - type: stack
    id: profile_avatar_section
    variant: column
    style:
      alignment: center
      padding_bottom: spacing.xl
    children:
      - profile_avatar_image
      - profile_avatar_edit_icon
      - profile_display_name

  - type: image
    id: profile_avatar_image
    content: "user_avatar_placeholder"
    label: "Profile avatar"
    variant: circle
    style:
      width: "96dp"
      height: "96dp"
      border_color: "#4C662B"
      border_width: "2dp"
      background: "#CDEDA3"
    a11y:
      role: image
      label: "Your profile photo"
    api:
      endpoint_id: obp_get_user_profile
      field: avatar_url
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        description: "circular shimmer placeholder 96dp matching avatar size"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not load your account photo"
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No profile photo on file — tap to add one"
    test_context:
      purpose: "User avatar fetched from profile data; falls back to initials placeholder"
      interaction_type: display
      data_driven: true

  - type: icon
    id: profile_avatar_edit_icon
    content: "edit_photo"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      color: "#FFFFFF"
      size: "28dp"
      offset: "{ x: 32dp, y: -16dp }"
    on_click:
      action: submit
      target: profile
    a11y:
      role: button
      label: "Change profile photo"
    keyboard:
      focusable: true
    test_context:
      purpose: "Overlaid edit icon on avatar; tapping opens photo picker"
      interaction_type: action
      data_driven: false

  - type: text
    id: profile_display_name
    content: "Maria Santos"
    variant: headline_small
    style:
      typography: "Outfit/headline_small"
      color: "#4C662B"
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: heading
      label: "Profile name"
    api:
      endpoint_id: obp_get_user_profile
      field: username
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        description: "text-line shimmer placeholder matching headline_small width"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Unable to retrieve account holder name"
        retry: true
    test_context:
      purpose: "Displays the current full name from profile state — real data, not placeholder"
      interaction_type: display
      data_driven: true

  - type: stack
    id: profile_form_section
    variant: column
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.lg
      margin_bottom: spacing.md
    children:
      - profile_section_header
      - profile_full_name_input
      - profile_email_input
      - profile_phone_input

  - type: text
    id: profile_section_header
    content: "Personal Information"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.md
    a11y:
      role: heading
      label: "Personal Information section"
    test_context:
      purpose: "Section header to organize the editable profile fields"
      interaction_type: display
      data_driven: false

  - type: input
    id: profile_full_name_input
    label: "Full Name"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#F9FAEF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      padding: spacing.md
      margin_bottom: spacing.md
    placeholder: "e.g. Maria Santos"
    keyboard_type: text
    ime_action: next
    prefill: "fullName"
    a11y:
      role: textbox
      label: "Full Name"
      label_source: visible_label
    keyboard:
      focusable: true
    api:
      endpoint_id: obp_get_user_profile
      field: username
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        description: "input-field shimmer matching full-name field height and width"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not pre-fill your registered name"
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No registered name on file — please enter your full name"
    test_context:
      purpose: "Editable full name field pre-filled from ProfileUiState.fullName"
      interaction_type: input
      data_driven: true

  - type: input
    id: profile_email_input
    label: "Email Address"
    variant: email
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#F9FAEF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      padding: spacing.md
      margin_bottom: spacing.md
    placeholder: "e.g. maria.santos@example.com"
    keyboard_type: email
    ime_action: next
    prefill: "email"
    a11y:
      role: textbox
      label: "Email Address"
      label_source: visible_label
    keyboard:
      focusable: true
    api:
      endpoint_id: obp_get_user_profile
      field: email
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        description: "input-field shimmer matching email field height and width"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not pre-fill your registered email address"
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No email address on record — please enter a valid email"
    test_context:
      purpose: "Editable email field; validated against RFC-5322 format before save"
      interaction_type: input
      data_driven: true

  - type: input
    id: profile_phone_input
    label: "Phone Number"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#F9FAEF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      padding: spacing.md
    placeholder: "e.g. +63 917 123 4567"
    keyboard_type: tel
    ime_action: done
    prefill: "phoneNumber"
    a11y:
      role: textbox
      label: "Phone Number"
      label_source: visible_label
    keyboard:
      focusable: true
    api:
      endpoint_id: obp_get_user_profile
      field: phone_number
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        description: "input-field shimmer matching phone field height and width"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not pre-fill your registered phone number"
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No phone number on record — please enter your contact number"
    test_context:
      purpose: "Editable phone field with tel keyboard; validated for E.164 format"
      interaction_type: input
      data_driven: true

  - type: stack
    id: profile_action_section
    variant: column
    style:
      padding_bottom: spacing.md
    children:
      - profile_save_button
      - profile_change_password_button

  - type: button
    id: profile_save_button
    label: "Save Changes"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_bottom: spacing.sm
      width: "match_parent"
    on_click:
      action: submit
      target: profile
    loading_when: "uiState == Saving"
    disabled_when: "uiState == Viewing || !hasUnsavedChanges"
    a11y:
      role: button
      label: "Save profile changes"
    keyboard:
      focusable: true
    test_context:
      purpose: "Submits edited profile fields to API; enabled only when unsaved changes exist"
      interaction_type: action
      data_driven: false

  - type: button
    id: profile_change_password_button
    label: "Change Password"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#4C662B"
      typography: "Outfit/label_large"
      color: "#4C662B"
      border_radius: "8dp"
      padding: spacing.md
      width: "match_parent"
    on_click:
      action: navigate
      target: change-password
    a11y:
      role: button
      label: "Navigate to change password screen"
    keyboard:
      focusable: true
    test_context:
      purpose: "Secondary CTA to update password separately from profile info"
      interaction_type: navigate
      data_driven: false

  - type: stack
    id: profile_danger_section
    variant: column
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.lg
      margin_top: spacing.md
    children:
      - profile_logout_button

  - type: button
    id: profile_logout_button
    label: "Log Out"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      typography: "Outfit/label_large"
      color: "#BA1A1A"
      padding: spacing.md
      width: "match_parent"
    on_click:
      action: submit
      target: login
    a11y:
      role: button
      label: "Log out of your account"
    keyboard:
      focusable: true
    test_context:
      purpose: "Clears session token and navigates to login; presented in danger zone"
      interaction_type: action
      data_driven: false

  - type: card
    id: profile_save_success_banner
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#CDEDA3"
      border_color: "#4C662B"
      border_radius: "8dp"
      padding: spacing.md
      margin_bottom: spacing.md
    visible_when: "uiState == Saved"
    children:
      - profile_success_icon
      - profile_success_message

  - type: icon
    id: profile_success_icon
    content: "check_circle"
    variant: default
    style:
      color: "#4C662B"
      size: "20dp"
    a11y:
      role: image
      label: "Success"
    test_context:
      purpose: "Success icon in the save confirmation banner"
      interaction_type: display
      data_driven: false

  - type: text
    id: profile_success_message
    content: "Your profile has been updated successfully."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#4C662B"
      padding_start: spacing.sm
    a11y:
      role: alert
      label: "Profile saved successfully"
    test_context:
      purpose: "Inline confirmation after successful profile save API response"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section]
    note: "Skeleton shimmer shown for avatar, display name, and all pre-filled input fields while OBP profile data is fetched"
  viewing:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section, profile_action_section, profile_danger_section]
    note: "Fields are read-only; Save button disabled"
  editing:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section, profile_action_section, profile_danger_section]
    note: "Fields are editable; Save button enabled"
  saving:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section, profile_action_section, profile_danger_section]
    note: "Save button shows loading spinner; inputs disabled"
  saved:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_save_success_banner, profile_avatar_section, profile_form_section, profile_action_section, profile_danger_section]
    note: "Success banner visible at top; auto-transitions to viewing after 2s"
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section, profile_action_section, profile_danger_section]
    note: "Profile data loaded — same layout as viewing state; default loaded state alias"
  empty:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_action_section, profile_danger_section]
    note: "No profile data available. Please update your profile."
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section, profile_action_section, profile_danger_section]

state_model:
  ProfileViewModel:
    screen_state: ProfileUiState
    state:
      - field: fullName
        type: String
        default: "\"\""
      - field: email
        type: String
        default: "\"\""
      - field: phoneNumber
        type: String
        default: "\"\""
      - field: avatarUrl
        type: "String?"
        default: "null"
      - field: hasUnsavedChanges
        type: Boolean
        default: "false"
      - field: isLoading
        type: Boolean
        default: "false"
      - field: errorMessage
        type: "String?"
        default: "null"
    errors: [NETWORK_ERROR, VALIDATION_ERROR, AUTH_ERROR]
    events: [LoadProfile, OnFullNameChanged, OnEmailChanged, OnPhoneChanged, OnSaveClicked, OnChangePasswordClicked, OnLogoutClicked, OnProfileSaved, OnProfileError]
    actions: [onLoadProfile(), onFullNameChanged(value: String), onEmailChanged(value: String), onPhoneChanged(value: String), onSaveClicked(), onChangePasswordClicked(), onLogoutClicked()]
    di: [ObpAuthRepository, UserProfileRepository, SessionManager]

navigation:
  - id: nav_to_change_password
    target: change-password
    on_click:
      action: navigate
      target: change-password
  - id: nav_to_login_on_logout
    target: login
    trigger: on_logout_confirmed
    on_click:
      action: navigate
      target: login

api:
  - id: obp_get_user_profile
    endpoint: "GET /obp/v4.0.0/users/current"
    tag: UserProfile
    trigger: on_screen_load
    response:
      fields:
        - name: user_id
          type: String
        - name: email
          type: String
        - name: username
          type: String
    errors:
      - code: 401
        name: AUTH_ERROR
        ui_message: "Session expired. Please sign in again."
      - code: 500
        name: NETWORK_ERROR
        ui_message: "Could not load your profile. Please check your connection."

  - id: obp_update_user_profile
    endpoint: "PUT /obp/v4.0.0/users/current"
    tag: UserProfile
    trigger: on_save_clicked
    request:
      fields:
        - name: email
          type: String
          source: profile_email_input
        - name: phone_number
          type: String
          source: profile_phone_input
    response:
      fields:
        - name: user_id
          type: String
    errors:
      - code: 400
        name: VALIDATION_ERROR
        ui_message: "Please correct the errors in the form before saving."
      - code: 401
        name: AUTH_ERROR
        ui_message: "Session expired. Please sign in again."

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
