screens:
  - id: profile
    name: "Profile"
    viewmodel: "ProfileViewModel"

archetype: profile

components:
  - type: stack
    id: profile_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - profile_avatar_section
      - profile_form_section
      - profile_change_password_button
      - profile_logout_button

  - type: stack
    id: profile_avatar_section
    variant: column
    style:
      alignment: center
      padding_bottom: spacing.xl
    children:
      - profile_avatar_initials
      - profile_avatar_edit_icon
      - profile_display_name

  - type: box
    id: profile_avatar_initials
    content: "MS"
    style:
      width: "96dp"
      height: "96dp"
      shape: circle
      border_color: "#4C662B"
      border_width: "2dp"
      background: "#CDEDA3"
      typography: "Outfit/headline_medium"
      font_weight: 700
      color: "#4C662B"
      alignment: center
    a11y:
      role: image
      label: "Your profile initials"
    test_context:
      purpose: "Initials avatar — shipped renders a circular primaryContainer box with up to two uppercase initials from the display name (initialsOf). No profile photo; there is no image fetch."
      interaction_type: display
      data_driven: true

  - type: icon
    id: profile_avatar_edit_icon
    content: "edit"
    variant: filled
    style:
      background: "#4C662B"
      color: "#FFFFFF"
      size: "32dp"
      offset: "{ x: 2dp, y: 2dp }"
    a11y:
      role: image
      label: "Edit"
    test_context:
      purpose: "Decorative edit badge overlaid on the initials avatar (contentDescription 'Change profile photo'). NOT interactive in shipped — no photo picker is wired."
      interaction_type: display
      data_driven: false

  - type: text
    id: profile_display_name
    content: "Maria Santos"
    variant: title_large
    style:
      typography: "Outfit/title_large"
      color: "#4C662B"
      font_weight: 600
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: heading
      label: "Profile name"
    test_context:
      purpose: "Display name — shipped uses ProfileContent.displayName (username, or email local-part when username is blank). Real data, not placeholder."
      interaction_type: display
      data_driven: true

  - type: stack
    id: profile_form_section
    variant: column
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.lg
      margin_bottom: spacing.md
    children:
      - profile_section_header
      - profile_full_name_field
      - profile_email_field
      - profile_phone_field

  - type: text
    id: profile_section_header
    content: "Personal Information"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      font_weight: 600
      padding_bottom: spacing.md
    a11y:
      role: heading
      label: "Personal Information section"
    test_context:
      purpose: "Section header above the read-only profile fields"
      interaction_type: display
      data_driven: false

  - type: input
    id: profile_full_name_field
    label: "Full Name"
    variant: text
    supported_states: [disabled]
    style:
      background: "#FFFFFF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      padding: spacing.md
      margin_bottom: spacing.md
    prefill: "fullName"
    a11y:
      role: textbox
      label: "Full Name"
      label_source: visible_label
    test_context:
      purpose: "READ-ONLY full name. Shipped renders a disabled OutlinedTextField bound to ProfileContent.fullName — no editing, no save."
      interaction_type: display
      data_driven: true

  - type: input
    id: profile_email_field
    label: "Email Address"
    variant: email
    supported_states: [disabled]
    style:
      background: "#FFFFFF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      padding: spacing.md
      margin_bottom: spacing.md
    prefill: "email"
    a11y:
      role: textbox
      label: "Email Address"
      label_source: visible_label
    test_context:
      purpose: "READ-ONLY email. Disabled OutlinedTextField bound to ProfileContent.email."
      interaction_type: display
      data_driven: true

  - type: input
    id: profile_phone_field
    label: "Phone Number"
    variant: text
    supported_states: [disabled]
    style:
      background: "#FFFFFF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      padding: spacing.md
    prefill: "phone"
    a11y:
      role: textbox
      label: "Phone Number"
      label_source: visible_label
    test_context:
      purpose: "READ-ONLY phone. Disabled OutlinedTextField bound to ProfileContent.phone, which is hardcoded blank \"\" — OBP UserProfile has no phone field. Renders empty."
      interaction_type: display
      data_driven: true

  - type: button
    id: profile_change_password_button
    label: "Change Password"
    variant: outlined
    enabled: false
    disabled_until: "change-password screen implemented"
    supported_states: [disabled]
    style:
      border_color: "#4C662B"
      typography: "Outfit/label_large"
      color: "#4C662B"
      font_weight: 600
      border_radius: "8dp"
      padding: spacing.md
      width: "match_parent"
      margin_top: spacing.lg
    a11y:
      role: button
      label: "Change Password (not yet available)"
    test_context:
      purpose: "Shipped renders this OutlinedButton DISABLED (enabled = false) with an empty onClick — change-password is not built. Marked deferred; kept so the spec reflects the visible (disabled) control."
      interaction_type: display
      data_driven: false

  - type: button
    id: profile_logout_button
    label: "Log Out"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      typography: "Outfit/label_large"
      color: "#BA1A1A"
      font_weight: 600
      padding: spacing.md
      width: "match_parent"
      margin_top: spacing.md
    on_click:
      action: logout
    a11y:
      role: button
      label: "Log out of your account"
    keyboard:
      focusable: true
    test_context:
      purpose: "Calls ProfileViewModel.onLogout() → UserDataRepository.setIsAuthenticated(false). REACTIVE: RootNavViewModel observes userData and routes back to auth. The screen does NOT navigate to login imperatively."
      interaction_type: action
      data_driven: false

  # ── Error state ──────────────────────────────────────────────────────────────

  - type: icon
    id: profile_error_icon
    content: "error_outline"
    variant: default
    style:
      color: "#BA1A1A"
      size: "40dp"
      alignment: center
    a11y:
      role: image
      label: "Error"
    test_context:
      purpose: "Error icon shown in the full-screen ProfileError state"
      interaction_type: display
      data_driven: false

  - type: text
    id: profile_error_title
    content: "Could not load your profile"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      alignment: center
    a11y:
      role: heading
      label: "Could not load your profile"
    test_context:
      purpose: "Headline of the Profile error state (ScreenState.Error)"
      interaction_type: display
      data_driven: false

  - type: text
    id: profile_error_body
    content: "Check your connection and try again."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
    a11y:
      role: text
      label: "Check your connection and try again."
    test_context:
      purpose: "Supporting copy in the Profile error state"
      interaction_type: display
      data_driven: false

  - type: button
    id: profile_error_retry_button
    label: "Retry"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      typography: "Outfit/label_large"
      color: "#4C662B"
      alignment: center
    on_click:
      action: retry
    a11y:
      role: button
      label: "Retry loading your profile"
    keyboard:
      focusable: true
    test_context:
      purpose: "Calls ProfileViewModel.onRetry() to reload the profile after a network error"
      interaction_type: action
      data_driven: false

  - type: loading_indicator
    id: profile_loading_spinner
    variant: circular_indeterminate
    style:
      color: "#4C662B"
      size: "40dp"
      alignment: center
    a11y:
      role: progressbar
      label: "Loading your profile"
    test_context:
      purpose: "Centered CircularProgressIndicator shown while the OBP profile loads (ScreenState.Loading)"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [profile_loading_spinner]
    note: "ScreenState.Loading — centered CircularProgressIndicator while the OBP profile fetches."
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section, profile_change_password_button, profile_logout_button]
    note: "ScreenState.Content — read-only profile: initials avatar, display name, three disabled fields, disabled Change Password, Log Out."
  error:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [profile_error_icon, profile_error_title, profile_error_body, profile_error_retry_button]
    note: "ScreenState.Error — full-screen error with Retry (onRetry)."

state_model:
  ProfileViewModel:
    screen_state: "ScreenState<ProfileContent>"
    content_type: ProfileContent
    content_fields:
      - field: displayName
        type: String
        note: "username, or email local-part when username is blank"
      - field: initials
        type: String
        note: "up to two uppercase initials from displayName (initialsOf)"
      - field: fullName
        type: String
        note: "same as displayName in shipped — bound to the read-only Full Name field"
      - field: email
        type: String
      - field: phone
        type: String
        note: "hardcoded blank \"\" — OBP UserProfile has no phone field"
    state_wrapper:
      type: "ScreenState<ProfileContent>"
      variants: [Loading, "Content(ProfileContent, DataFreshness)", "Error(throwable, isNetworkError)"]
    actions:
      - "onRetry() — reloads the profile (load())"
      - "onLogout() — UserDataRepository.setIsAuthenticated(false); routing is reactive via RootNavViewModel"
    di: [ProfileRepository, UserDataRepository]
    base: "androidx.lifecycle.ViewModel (exposes StateFlow<ScreenState<ProfileContent>>)"
    note: "READ-ONLY screen. No editing, no save, no avatar upload. Logout is reactive — RootNavViewModel observes UserDataRepository.userData and routes to the auth graph; the screen never navigates to login imperatively. ProfileApi.updateCurrentUser (PUT v4.0.0/users/current) is NOT consumed."

navigation:
  - id: profile_logout_reactive
    trigger: on_logout_clicked
    note: "No imperative navigation. onLogout() flips UserDataRepository.setIsAuthenticated(false); RootNavViewModel observes the session and routes back to the auth graph. change-password is NOT reachable — its button is rendered disabled."

api:
  - id: get_party
    endpoint: "GET /obie/open-banking/v4.0/aisp/party"
    tag: AISP-Party
    trigger: on_screen_load
    description: "OBIE account-holder party (the PSU) for the authorised account-access consent. Requires ReadParty + an AUTH-status consent + scoped token. CE HSBCnet + Malta use /ce/.../v3.1."
    response:
      fields:
        - name: Data.Party.PartyId
          type: String
        - name: Data.Party.Name
          type: String
        - name: Data.Party.FullLegalName
          type: String
        - name: Data.Party.EmailAddress
          type: String
        - name: Data.Party.Phone
          type: String
    errors:
      - code: 401
        name: UNAUTHORIZED
        ui_message: "Could not load your profile — reconnect your HSBC account."
      - code: 403
        name: OB_RESOURCE_INVALID_CONSENT
        ui_message: "Your data-sharing consent doesn't include profile details."
      - code: 500
        name: OB_UNEXPECTED_ERROR
        ui_message: "Could not load your profile"

unsupported:
  - capability: update_profile
    reason: "OBIE Open Banking is read-only for account-holder data — a TPP cannot update the PSU's name/email/phone. The OBP PUT /users/current is removed."

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
