<!doctype html>
<!-- render-hash: e5b27d communauté -->
<html lang="en" data-screen="profile" data-state="empty" data-feature="profile" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 72px; }
  .top-bar { display: flex; align-items: center; gap: 8px; padding: 14px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--on-surface-variant); }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 32px 48px; }
  .empty-icon { width: 96px; height: 96px; border-radius: 50%; background: var(--surface-variant); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .empty-icon .material-icons { font-size: var(--icon-2xl); color: var(--on-surface-variant); }
  .empty-title { font-size: 22px; font-weight: 600; color: var(--on-background); margin-bottom: 10px; max-width: 300px; }
  .empty-body { font-size: 14px; font-weight: 400; color: var(--on-surface-variant); line-height: 1.45; max-width: 320px; margin-bottom: 28px; }
  .btn-filled { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 999px; padding: 14px 28px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; min-width: 200px; }
  .btn-filled:hover, .btn-filled:focus-visible { box-shadow: var(--shadow-2); outline: none; }
  .btn-filled .material-icons { font-size: var(--icon-sm); }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--outline-variant); padding: 6px 0 10px; z-index: 8; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" data-nav-to="settings" aria-label="Back"><span class="material-icons">arrow_back</span></button>
    <h1 data-component-type="text" data-component-id="profile_section_header">Profile</h1>
  </header>

  <div class="empty-wrap" data-component-type="stack" data-component-id="profile_avatar_section">
    <div class="empty-icon" data-component-type="icon" data-component-id="profile_avatar_initials"><span class="material-icons" aria-hidden="true">no_accounts</span></div>
    <div class="empty-title" data-component-type="text" data-component-id="profile_display_name">No profile to show yet</div>
    <div class="empty-body" data-component-type="text" data-component-id="profile_error_body">Your account-sharing consent doesn't include your profile details, or it hasn't been set up. Connect your bank to view your name and contact details here.</div>
    <button class="btn-filled" data-component-type="button" data-component-id="profile_logout_button" data-nav-to="consent-manager" aria-label="Manage data sharing">
      <span class="material-icons" aria-hidden="true">link</span>
      Manage data sharing
    </button>
  </div>
</main>
  <nav class="bottom-nav" data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item" data-nav-to="home" tabindex="0"><span class="material-icons">home</span>Home</a>
    <a class="nav-item" data-nav-to="accounts" tabindex="0"><span class="material-icons">account_balance</span>Accounts</a>
    <a class="nav-item" data-nav-to="send-money" tabindex="0"><span class="material-icons">send</span>Pay</a>
    <a class="nav-item" data-nav-to="pfm-dashboard" tabindex="0"><span class="material-icons">insights</span>Insights</a>
    <a class="nav-item active" data-nav-to="settings" tabindex="0"><span class="material-icons">more_horiz</span>More</a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
