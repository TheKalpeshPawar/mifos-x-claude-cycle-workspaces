<style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --outline: #75796C; --outline-variant: #C5C8BA; }
[data-theme="dark"] { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --secondary: #A0CFCB; --error: #FFB4AB; --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline: #8F9285; --outline-variant: #44483D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --secondary: #A0CFCB; --error: #FFB4AB; --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline: #8F9285; --outline-variant: #44483D; } }
* { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; }
.top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 20px; font-weight: 600; flex: 1; }
.avatar-section { text-align: center; padding: 24px 20px 12px; } .avatar-wrap { position: relative; display: inline-block; }
.avatar { width: 96px; height: 96px; border-radius: 48px; background: var(--surface-variant); border: 2px dashed var(--outline-variant); display: inline-flex; align-items: center; justify-content: center; } .avatar .material-icons { font-size: 40px; color: var(--on-surface-variant); }
.avatar-edit { position: absolute; bottom: 0; right: 0; width: 32px; height: 32px; border-radius: 16px; background: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--background); } .avatar-edit .material-icons { font-size: 16px; color: var(--on-primary); }
.empty-hint { background: var(--primary-container); border-radius: 8px; margin: 8px 20px 16px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.empty-hint .material-icons { color: var(--primary); font-size: 20px; }
.empty-hint-text { font-size: 13px; color: var(--on-primary-container, var(--primary)); font-weight: 500; line-height: 1.4; }
.btn-section { padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.btn { padding: 14px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; border: none; width: 100%; }
.btn.start { background: var(--primary); color: var(--on-primary); }
.danger-section { background: var(--surface); border-radius: 12px; margin: 0 20px 24px; padding: 16px 20px; }
.btn.logout { background: transparent; color: var(--error); padding: 6px 0; }</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons" data-action="navigate_back" data-nav-to="home" tabindex="0" aria-label="Go back to home" role="button">arrow_back</span><h1>Profile</h1></div>

<section class="avatar-section" data-component-type="stack" data-component-id="profile_avatar_section">

</div>
</section>

</div>

</section>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
