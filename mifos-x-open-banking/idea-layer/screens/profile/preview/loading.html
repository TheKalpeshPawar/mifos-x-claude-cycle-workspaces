<!doctype html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Profile — Loading</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Roboto:wght@400;500&display=swap">
<style>
:root {
  --md-primary: #266489;
  --md-on-primary: #FFFFFF;
  --md-primary-container: #C9E6FF;
  --md-on-primary-container: #004B6F;
  --md-secondary: #50606E;
  --md-on-secondary: #FFFFFF;
  --md-secondary-container: #D3E5F5;
  --md-on-secondary-container: #384956;
  --md-error: #BA1A1A;
  --md-on-error: #FFFFFF;
  --md-background: #F7F9FF;
  --md-on-background: #181C20;
  --md-surface: #F7F9FF;
  --md-on-surface: #181C20;
  --md-surface-variant: #DDE3EA;
  --md-on-surface-variant: #41474D;
  --md-outline: #72787E;
  --md-outline-variant: #C1C7CE;
  --md-surface-container-lowest: #FFFFFF;
  --md-surface-container-low: #F1F4F9;
  --md-surface-container: #EBEEF3;
  --md-surface-container-high: #E5E8ED;
  --md-surface-container-highest: #E0E3E8;

  --radius-full: 9999px;
  --sp-4: 4px;
  --sp-8: 8px;
  --sp-12: 12px;
  --sp-16: 16px;
  --sp-24: 24px;

  --type-title-large-size: 22px;
  --type-title-large-line: 28px;
  --type-body-medium-size: 14px;
  --type-body-medium-line: 20px;
  --type-label-medium-size: 12px;
  --type-label-medium-line: 16px;
}

[data-theme="dark"] {
  --md-primary: #95CDF7;
  --md-on-primary: #00344E;
  --md-primary-container: #004B6F;
  --md-on-primary-container: #C9E6FF;
  --md-secondary: #B7C9D9;
  --md-on-secondary: #22323F;
  --md-secondary-container: #384956;
  --md-on-secondary-container: #D3E5F5;
  --md-error: #FFB4AB;
  --md-on-error: #690005;
  --md-background: #101417;
  --md-on-background: #E0E3E8;
  --md-surface: #101417;
  --md-on-surface: #E0E3E8;
  --md-surface-variant: #41474D;
  --md-on-surface-variant: #C1C7CE;
  --md-outline: #8B9198;
  --md-outline-variant: #41474D;
  --md-surface-container-lowest: #0B0F12;
  --md-surface-container-low: #181C20;
  --md-surface-container: #1C2024;
  --md-surface-container-high: #262A2E;
  --md-surface-container-highest: #313539;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Roboto', sans-serif;
  background: var(--md-background);
  color: var(--md-on-background);
  width: 390px;
  height: 844px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  font-size: 24px;
  line-height: 1;
  display: inline-block;
  user-select: none;
}

/* Top App Bar */
.top-app-bar {
  height: 64px;
  background: var(--md-surface);
  display: flex;
  align-items: center;
  padding: 0 var(--sp-4);
  flex-shrink: 0;
  border-bottom: 1px solid var(--md-outline-variant);
}
.top-bar-icon-btn {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-full);
  border: none;
  background: transparent;
  color: var(--md-on-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.top-bar-title {
  flex: 1;
  font-size: var(--type-title-large-size);
  line-height: var(--type-title-large-line);
  font-weight: 400;
  color: var(--md-on-surface);
  padding-left: var(--sp-4);
}

/* Screen Content */
.screen-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--md-background);
  gap: var(--sp-16);
}

/* Circular Progress */
.progress-ring {
  width: 48px;
  height: 48px;
  animation: rotate-ring 1.4s linear infinite;
}
.progress-ring-track {
  fill: none;
  stroke: var(--md-surface-container-high);
  stroke-width: 4;
}
.progress-ring-arc {
  fill: none;
  stroke: var(--md-primary);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 105;
  stroke-dashoffset: 26;
  transform-origin: 24px 24px;
  animation: dash-ring 1.4s ease-in-out infinite;
}

@keyframes rotate-ring {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes dash-ring {
  0% { stroke-dashoffset: 94; }
  50% { stroke-dashoffset: 26; }
  100% { stroke-dashoffset: 94; transform: rotate(270deg); }
}

.loading-text {
  font-size: var(--type-body-medium-size);
  line-height: var(--type-body-medium-line);
  color: var(--md-on-surface-variant);
}

/* Bottom Navigation */
.bottom-nav {
  height: 80px;
  background: var(--md-surface-container);
  display: flex;
  align-items: flex-start;
  padding-top: 12px;
  flex-shrink: 0;
  border-top: 1px solid var(--md-outline-variant);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-4);
  cursor: pointer;
  color: var(--md-on-surface-variant);
  text-decoration: none;
}
.nav-item.active { color: var(--md-primary); }
.nav-icon-pill {
  width: 64px;
  height: 32px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-item.active .nav-icon-pill { background: var(--md-secondary-container); }
.nav-label {
  font-size: var(--type-label-medium-size);
  line-height: var(--type-label-medium-line);
  font-weight: 500;
}
</style>
</head>
<body>

<!-- Top App Bar -->
<header class="top-app-bar" role="banner">
  <button class="top-bar-icon-btn" aria-label="Navigate back" data-action="navigate_back">
    <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
  </button>
  <h1 class="top-bar-title">Profile</h1>
</header>

<!-- Screen Content: loading state -->
<main
  class="screen-content"
  data-screen-state="loading"
  aria-label="Loading profile"
  aria-busy="true"
  aria-live="polite"
>
  <svg
    class="progress-ring"
    viewBox="0 0 48 48"
    role="progressbar"
    aria-label="Loading profile"
    aria-valuetext="Fetching party details from HSBC AIS and reading cached consent summary"
  >
    <circle class="progress-ring-track" cx="24" cy="24" r="20"/>
    <circle class="progress-ring-arc" cx="24" cy="24" r="20"/>
  </svg>
  <p class="loading-text">Loading profile</p>
</main>

<!-- Bottom Navigation — profile is a pushed screen; no active tab -->
<nav class="bottom-nav" aria-label="Main navigation">
  <a class="nav-item" href="#" aria-label="Home" data-nav-to="home">
    <span class="nav-icon-pill">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
    </span>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-item" href="#" aria-label="Accounts" data-nav-to="accounts">
    <span class="nav-icon-pill">
      <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
    </span>
    <span class="nav-label">Accounts</span>
  </a>
  <a class="nav-item" href="#" aria-label="Transactions" data-nav-to="transactions">
    <span class="nav-icon-pill">
      <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
    </span>
    <span class="nav-label">Transactions</span>
  </a>
  <a class="nav-item" href="#" aria-label="More" data-nav-to="settings">
    <span class="nav-icon-pill">
      <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
    </span>
    <span class="nav-label">More</span>
  </a>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
