<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Profile — Loading — Mifos Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --background: #F9FAEF;
      --surface: #FFFFFF;
      --surface-variant: #E1E4D5;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --text-primary: #1A1C16;
      --text-secondary: #44483D;
      --nav-active: #DCE7C8;
      --font: 'Outfit', system-ui, sans-serif;
      --bottom-nav-h: 80px;
      --skel-base: #E1E4D5;
      --skel-shine: #F9FAEF;
    }

    html, body {
      width: 390px;
      min-height: 844px;
      background: var(--background);
      font-family: var(--font);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      display: flex;
      flex-direction: column;
      width: 390px;
      min-height: 844px;
      background: var(--background);
    }

    /* ── Top Bar (real chrome) ─────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-bar__title {
      font-size: 22px;
      font-weight: 400;
      color: var(--text-primary);
      font-family: var(--font);
    }

    /* ── Shimmer animation ─────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -390px 0; }
      100% { background-position: 390px 0; }
    }

    .skel {
      background: var(--skel-base);
      background-image: linear-gradient(
        90deg,
        var(--skel-base) 0%,
        var(--skel-shine) 45%,
        var(--skel-shine) 55%,
        var(--skel-base) 100%
      );
      background-size: 780px 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 6px;
    }

    /* ── Scrollable content ────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px calc(var(--bottom-nav-h) + 16px);
      display: flex;
      flex-direction: column;
    }

    /* ── Avatar skeleton ───────────────────────────── */
    .avatar-section-skel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
      gap: 12px;
    }

    .skel-avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }

    .skel-name {
      width: 140px;
      height: 22px;
    }

    .skel-email {
      width: 190px;
      height: 14px;
    }

    .skel-badge {
      width: 80px;
      height: 24px;
      border-radius: 12px;
    }

    /* ── Section label skeleton ────────────────────── */
    .skel-section-label {
      margin-top: 24px;
      margin-bottom: 8px;
      width: 140px;
      height: 12px;
    }

    /* ── Card skeleton ─────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── Row skeleton ──────────────────────────────── */
    .row-skel {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 14px;
    }

    .row-skel + .row-skel {
      border-top: 1px solid var(--surface-variant);
    }

    .skel-row-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .skel-row-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .skel-row-label {
      height: 12px;
      border-radius: 4px;
    }

    .skel-row-value {
      height: 16px;
      border-radius: 4px;
    }

    .skel-row-end {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* ── Button skeleton ───────────────────────────── */
    .skel-btn {
      margin-top: 24px;
      margin-bottom: 16px;
      width: 100%;
      height: 40px;
      border-radius: 20px;
    }

    /* ── Bottom Nav (real chrome) ──────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 390px;
      height: var(--bottom-nav-h);
      background: var(--background);
      border-top: 1px solid var(--outline-variant);
      display: flex;
      align-items: stretch;
      z-index: 20;
    }

    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px 10px;
      border: none;
      background: transparent;
      font-family: var(--font);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: default;
    }

    .nav-tab.active { color: var(--primary); }

    .nav-tab__pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 28px;
      border-radius: 14px;
    }

    .nav-tab.active .nav-tab__pill {
      background: var(--nav-active);
    }

    .nav-tab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-tab__label { letter-spacing: 0.01em; }
  </style>
</head>
<body>
<div class="screen" data-screen="profile" data-state="loading">

  <!-- Top Bar (real) -->
  <header class="top-bar">
    <span class="top-bar__title">Profile</span>
    <!-- icon button slot stays empty during load -->
    <div style="width:40px;height:40px;"></div>
  </header>

  <!-- Skeleton Content -->
  <main class="content" aria-busy="true" aria-label="Loading profile">

    <!-- Avatar skeleton -->
    <div class="avatar-section-skel" aria-hidden="true">
      <div class="skel skel-avatar-circle"></div>
      <div class="skel skel-name"></div>
      <div class="skel skel-email"></div>
      <div class="skel skel-badge"></div>
    </div>

    <!-- Personal Information card skeleton -->
    <div class="skel skel-section-label" aria-hidden="true"></div>
    <div class="card" aria-hidden="true">
      <div class="row-skel">
        <div class="skel skel-row-icon"></div>
        <div class="skel-row-text">
          <div class="skel skel-row-label" style="width:70px;"></div>
          <div class="skel skel-row-value" style="width:110px;"></div>
        </div>
        <div class="skel skel-row-end"></div>
      </div>
      <div class="row-skel">
        <div class="skel skel-row-icon"></div>
        <div class="skel-row-text">
          <div class="skel skel-row-label" style="width:50px;"></div>
          <div class="skel skel-row-value" style="width:180px;"></div>
        </div>
        <div class="skel skel-row-end"></div>
      </div>
      <div class="row-skel">
        <div class="skel skel-row-icon"></div>
        <div class="skel-row-text">
          <div class="skel skel-row-label" style="width:60px;"></div>
          <div class="skel skel-row-value" style="width:120px;"></div>
        </div>
        <div class="skel skel-row-end"></div>
      </div>
    </div>

    <!-- Security card skeleton -->
    <div class="skel skel-section-label" style="width:80px;" aria-hidden="true"></div>
    <div class="card" aria-hidden="true">
      <div class="row-skel">
        <div class="skel skel-row-icon"></div>
        <div class="skel-row-text">
          <div class="skel skel-row-label" style="width:60px;"></div>
          <div class="skel skel-row-value" style="width:140px;"></div>
        </div>
        <div class="skel skel-row-end"></div>
      </div>
      <div class="row-skel">
        <div class="skel skel-row-icon"></div>
        <div class="skel-row-text">
          <div class="skel skel-row-value" style="width:130px; margin-top:2px;"></div>
        </div>
        <div class="skel skel-row-end" style="width:48px;height:28px;border-radius:14px;"></div>
      </div>
      <div class="row-skel">
        <div class="skel skel-row-icon"></div>
        <div class="skel-row-text">
          <div class="skel skel-row-value" style="width:120px; margin-top:2px;"></div>
        </div>
        <div class="skel skel-row-end" style="width:48px;height:28px;border-radius:14px;"></div>
      </div>
    </div>

    <!-- Sign Out button skeleton -->
    <div class="skel skel-btn" aria-hidden="true"></div>

  </main>

  <!-- Bottom Navigation (real) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-tab" aria-label="Home" disabled>
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Home</span>
    </button>

    <button class="nav-tab" aria-label="Accounts" disabled>
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10h3v7H4zm6.5 0h3v7h-3zM2 19h20v3H2zm15-9h3v7h-3zM12 1L2 6v2h20V6L12 1z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Accounts</span>
    </button>

    <button class="nav-tab" aria-label="Payments" disabled>
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Payments</span>
    </button>

    <button class="nav-tab active" aria-label="Profile (current)" aria-current="page" disabled>
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Profile</span>
    </button>
  </nav>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
