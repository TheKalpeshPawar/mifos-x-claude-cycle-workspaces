<!doctype html>
<html lang="en" data-screen="profile" data-state="viewing" data-feature="profile" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    .avatar-section { text-align: center; padding: 32px 20px 24px; } .avatar { width: 80px; height: 80px; border-radius: 40px; background: var(--primary-container); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: var(--primary); position: relative; } .avatar-edit { position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; border-radius: 14px; background: var(--primary); display: flex; align-items: center; justify-content: center; } .avatar-edit .material-icons { font-size: 16px; color: var(--on-primary); }
    .section-title { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; padding: 16px 20px 8px; }
    .field-row { display: flex; justify-content: space-between; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); } .field-label { font-size: 13px; color: var(--on-surface-variant); } .field-value { font-size: 14px; font-weight: 500; }
    .btn-section { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .btn { padding: 14px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; border: none; width: 100%; }
    .btn.save { background: var(--primary); color: var(--on-primary); opacity: 0.5; pointer-events: none; }
    .btn.password { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .danger-section { padding: 20px; } .btn.logout { background: transparent; border: 1px solid var(--error); color: var(--error); padding: 14px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; width: 100%; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <div class="avatar-section"><div class="avatar">AW<div class="avatar-edit"><span class="material-icons">edit</span></div></div></div>
    <div class="section-title">Personal Information</div>
    <div class="field-row"><span class="field-label">Full Name</span><span class="field-value">Alex Wanjiru</span></div>
    <div class="field-row"><span class="field-label">Email</span><span class="field-value">alex.wanjiru@email.co.ke</span></div>
    <div class="field-row"><span class="field-label">Phone</span><span class="field-value">+254 712 345 678</span></div>
    <div class="btn-section">
      <button class="btn save" disabled>Save Changes</button>
      <button class="btn password" data-nav-to="change-password" tabindex="0" aria-label="Change Password">Change Password</button>
    </div>
    <div class="danger-section"><button class="btn logout" data-nav-to="login" tabindex="0" aria-label="Log Out">Log Out</button></div>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
