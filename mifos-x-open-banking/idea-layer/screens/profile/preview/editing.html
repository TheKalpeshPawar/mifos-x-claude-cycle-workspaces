<!doctype html>
<html lang="en" data-screen="profile" data-state="editing" data-feature="profile" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile — Editing</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; padding: 20px 20px 8px; }
    .input-group { padding: 8px 20px; } .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 4px; } .input-field { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); }
    .btn-row { display: flex; gap: 12px; padding: 24px 20px; } .btn-cancel { flex: 1; padding: 12px; background: transparent; border: 1px solid var(--outline-variant); border-radius: 12px; color: var(--on-surface-variant); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; } .btn-save { flex: 1; padding: 12px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <div class="section-title">Edit Profile</div>
    <div class="input-group"><label>Full Name</label><input type="text" class="input-field" value="Alex Wanjiru" aria-label="Full Name" tabindex="0"></div>
    <div class="input-group"><label>Email</label><input type="email" class="input-field" value="alex.wanjiru@email.co.ke" aria-label="Email" tabindex="0"></div>
    <div class="input-group"><label>Phone</label><input type="tel" class="input-field" value="+254 712 345 678" aria-label="Phone" tabindex="0"></div>
    <div class="btn-row"><button class="btn-cancel" data-action="navigate" tabindex="0">Cancel</button><button class="btn-save" data-action="submit" tabindex="0">Save</button></div>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
