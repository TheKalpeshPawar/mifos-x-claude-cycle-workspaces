<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Profile — Mifos Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --background: #F9FAEF;
      --surface: #FFFFFF;
      --surface-variant: #E1E4D5;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --text-primary: #1A1C16;
      --text-secondary: #44483D;
      --tertiary: #386663;
      --error: #BA1A1A;
      --nav-active: #DCE7C8;
      --font: 'Outfit', system-ui, sans-serif;
      --bottom-nav-h: 80px;
    }

    html, body {
      width: 390px;
    position: relative;
      min-height: 844px;
      background: var(--background);
      font-family: var(--font);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen layout ─────────────────────────────── */
    .screen {
      display: flex;
      flex-direction: column;
      width: 390px;
      min-height: 844px;
      background: var(--background);
    }

    /* ── Top Bar ───────────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-bar__title {
      font-size: 22px;
      font-weight: 400;
      color: var(--text-primary);
      font-family: var(--font);
    }

    .top-bar__icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .top-bar__icon-btn svg {
      width: 22px;
      height: 22px;
      stroke: var(--text-secondary);
      fill: none;
    }

    /* ── Scrollable content ────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px calc(var(--bottom-nav-h) + 16px);
      display: flex;
      flex-direction: column;
    }

    /* ── Profile header ────────────────────────────── */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
      padding-bottom: 0;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: var(--primary);
      font-family: var(--font);
      user-select: none;
      flex-shrink: 0;
    }

    .profile-name {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: var(--font);
      text-align: center;
    }

    .profile-email {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-secondary);
      font-family: var(--font);
      text-align: center;
    }

    .verified-badge {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--primary-container);
      color: var(--primary);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      height: 24px;
      padding: 0 8px;
      border-radius: 12px;
    }

    .verified-badge svg {
      width: 14px;
      height: 14px;
      fill: var(--primary);
      flex-shrink: 0;
    }

    /* ── Section label ─────────────────────────────── */
    .section-label {
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--outline);
      font-family: var(--font);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-label + .section-label {
      margin-top: 16px;
    }

    /* ── Card ──────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── Info Row ──────────────────────────────────── */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      background: var(--surface);
    }

    .info-row + .info-row {
      border-top: 1px solid var(--surface-variant);
    }

    .info-row__left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .info-row__icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-row__icon svg {
      width: 20px;
      height: 20px;
      fill: var(--primary);
    }

    .info-row__text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .info-row__label {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
      font-family: var(--font);
    }

    .info-row__value {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      font-family: var(--font);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-row__chevron {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .info-row__chevron svg {
      width: 20px;
      height: 20px;
      fill: var(--outline-variant);
    }

    /* ── Toggle row ────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface);
    }

    .toggle-row + .toggle-row,
    .info-row + .toggle-row,
    .toggle-row + .info-row {
      border-top: 1px solid var(--surface-variant);
    }

    .toggle-row__left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toggle-row__icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toggle-row__icon svg {
      width: 20px;
      height: 20px;
      fill: var(--primary);
    }

    .toggle-row__label {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      font-family: var(--font);
    }

    /* ── Toggle switch ─────────────────────────────── */
    .toggle {
      width: 48px;
      height: 28px;
      border-radius: 14px;
      background: var(--primary);
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
      border: none;
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--on-primary);
      transition: right 0.2s;
    }

    /* ── Sign Out button ───────────────────────────── */
    .signout-btn {
      margin-top: 24px;
      margin-bottom: 16px;
      width: 100%;
      height: 40px;
      border: 1px solid var(--error);
      border-radius: 20px;
      background: transparent;
      color: var(--error);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Bottom Nav ────────────────────────────────── */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 390px;
      height: var(--bottom-nav-h);
      background: var(--background);
      border-top: 1px solid var(--outline-variant);
      display: flex;
      align-items: stretch;
      z-index: 20;
    }

    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      padding: 8px 4px 10px;
      border: none;
      background: transparent;
      font-family: var(--font);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
    }

    .nav-tab.active { color: var(--primary); }

    .nav-tab__pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 28px;
      border-radius: 14px;
    }

    .nav-tab.active .nav-tab__pill {
      background: var(--nav-active);
    }

    .nav-tab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-tab__label { letter-spacing: 0.01em; }
  </style>
</head>
<body>
<div class="screen" data-screen="profile" data-state="content">

  <!-- Top Bar -->
  <header class="top-bar">
    <span class="top-bar__title">Profile</span>
    <button class="top-bar__icon-btn" aria-label="Edit profile" data-action="edit_profile">
      <!-- pencil / edit icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
  </header>

  <!-- Scrollable Content -->
  <main class="content">

    <!-- Profile header -->
    <div class="profile-header">
      <div class="avatar-circle" aria-label="Initials FS">FS</div>
      <p class="profile-name">Felix Smith</p>
      <p class="profile-email">felixsmith@openbank.com</p>
      <div class="verified-badge" aria-label="Account verified">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
        </svg>
        Verified
      </div>
    </div>

    <!-- Personal Information section -->
    <p class="section-label">Personal Information</p>
    <div class="card" role="region" aria-label="Personal Information">

      <div class="info-row" role="button" tabindex="0" aria-label="Edit full name" data-action="edit_full_name">
        <div class="info-row__left">
          <div class="info-row__icon" aria-hidden="true">
            <!-- person icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
          <div class="info-row__text">
            <span class="info-row__label">Full Name</span>
            <span class="info-row__value">Felix Smith</span>
          </div>
        </div>
        <span class="info-row__chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.29 6.71a1 1 0 0 0 0 1.42L13.17 12l-3.88 3.88a1 1 0 1 0 1.42 1.41l4.59-4.59a1 1 0 0 0 0-1.41L10.7 6.71a1 1 0 0 0-1.41 0z"/>
          </svg>
        </span>
      </div>

      <div class="info-row" role="button" tabindex="0" aria-label="Edit email address" data-action="edit_email">
        <div class="info-row__left">
          <div class="info-row__icon" aria-hidden="true">
            <!-- email icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </div>
          <div class="info-row__text">
            <span class="info-row__label">Email</span>
            <span class="info-row__value">felixsmith@openbank.com</span>
          </div>
        </div>
        <span class="info-row__chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.29 6.71a1 1 0 0 0 0 1.42L13.17 12l-3.88 3.88a1 1 0 1 0 1.42 1.41l4.59-4.59a1 1 0 0 0 0-1.41L10.7 6.71a1 1 0 0 0-1.41 0z"/>
          </svg>
        </span>
      </div>

      <div class="info-row" role="button" tabindex="0" aria-label="Edit phone number" data-action="edit_phone">
        <div class="info-row__left">
          <div class="info-row__icon" aria-hidden="true">
            <!-- phone icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.36 11.36 0 0 0 3.56.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C9.61 21 3 14.39 3 6.5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.01l-2.2 2.2v.01z"/>
            </svg>
          </div>
          <div class="info-row__text">
            <span class="info-row__label">Phone</span>
            <span class="info-row__value">+1 555-0123</span>
          </div>
        </div>
        <span class="info-row__chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.29 6.71a1 1 0 0 0 0 1.42L13.17 12l-3.88 3.88a1 1 0 1 0 1.42 1.41l4.59-4.59a1 1 0 0 0 0-1.41L10.7 6.71a1 1 0 0 0-1.41 0z"/>
          </svg>
        </span>
      </div>

    </div>

    <!-- Security section -->
    <p class="section-label">Security</p>
    <div class="card" role="region" aria-label="Security">

      <div class="info-row" role="button" tabindex="0" aria-label="Change password" data-nav-to="change-password">
        <div class="info-row__left">
          <div class="info-row__icon" aria-hidden="true">
            <!-- lock icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </div>
          <div class="info-row__text">
            <span class="info-row__label">Change Password</span>
            <span class="info-row__value">Change Password</span>
          </div>
        </div>
        <span class="info-row__chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.29 6.71a1 1 0 0 0 0 1.42L13.17 12l-3.88 3.88a1 1 0 1 0 1.42 1.41l4.59-4.59a1 1 0 0 0 0-1.41L10.7 6.71a1 1 0 0 0-1.41 0z"/>
          </svg>
        </span>
      </div>

      <div class="toggle-row" aria-label="Biometric login toggle">
        <div class="toggle-row__left">
          <div class="toggle-row__icon" aria-hidden="true">
            <!-- fingerprint icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28zM3.5 9.72a.499.499 0 0 1-.41-.79c.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 14 4.03 17.15 5.65c1.5.77 2.76 1.86 3.75 3.25a.5.5 0 0 1-.12.7.503.503 0 0 1-.7-.12 9.27 9.27 0 0 0-3.39-2.94c-2.87-1.47-6.54-1.47-9.4.01-1.36.7-2.52 1.7-3.4 2.96-.08.14-.23.21-.39.21zm6.25 12.07a.47.47 0 0 1-.35-.15 7.92 7.92 0 0 1-2.08-7.34c.34-1.61 1.39-2.75 2.93-3.3 3.43-1.23 7.03 1.21 7.03 4.85 0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.84-2.95-4.85-5.7-3.87-1.21.43-2.01 1.3-2.28 2.55a6.93 6.93 0 0 0 1.81 6.43c.19.19.19.51 0 .7a.47.47 0 0 1-.36.13zm7.92.54c-2.9 0-5.15-2.15-5.15-4.9 0-.28.22-.5.5-.5s.5.22.5.5c0 2.17 1.83 3.9 4.15 3.9 2.32 0 4.15-1.73 4.15-3.9 0-2.7-2.2-4.8-4.9-4.8-1.39 0-2.75.6-3.74 1.65-.19.2-.51.21-.71.02-.2-.2-.21-.51-.02-.71C13.72 13.02 15.32 12.3 17 12.3c3.11 0 5.5 2.31 5.5 5.12 0 2.75-2.25 4.91-5.33 4.91zM12 10.52c-.28 0-.5-.22-.5-.5s.22-.5.5-.5c3.59 0 6.5 2.89 6.5 6.44 0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-3-.68-5.44-5.5-5.44z"/>
            </svg>
          </div>
          <span class="toggle-row__label">Biometric Login</span>
        </div>
        <button class="toggle" aria-label="Biometric login is on" data-action="toggle_biometric" aria-checked="true" role="switch"></button>
      </div>

      <div class="toggle-row" aria-label="Two-factor auth toggle">
        <div class="toggle-row__left">
          <div class="toggle-row__icon" aria-hidden="true">
            <!-- shield icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
            </svg>
          </div>
          <span class="toggle-row__label">Two-Factor Auth</span>
        </div>
        <button class="toggle" aria-label="Two-factor auth is on" data-action="toggle_2fa" aria-checked="true" role="switch"></button>
      </div>

    </div>

    <!-- Sign Out -->
    <button class="signout-btn" aria-label="Sign out of your account" data-action="sign_out">
      Sign Out
    </button>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-tab" aria-label="Home" data-nav-to="home">
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Home</span>
    </button>

    <button class="nav-tab" aria-label="Accounts" data-nav-to="accounts">
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10h3v7H4zm6.5 0h3v7h-3zM2 19h20v3H2zm15-9h3v7h-3zM12 1L2 6v2h20V6L12 1z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Accounts</span>
    </button>

    <button class="nav-tab" aria-label="Payments" data-nav-to="payments">
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Payments</span>
    </button>

    <button class="nav-tab active" aria-label="Profile (current)" aria-current="page" data-nav-to="profile">
      <div class="nav-tab__pill">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <span class="nav-tab__label">Profile</span>
    </button>
  </nav>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
