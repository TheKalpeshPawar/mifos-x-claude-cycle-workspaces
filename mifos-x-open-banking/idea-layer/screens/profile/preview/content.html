<!doctype html>
<!-- render-hash: d4c8f2e01a96 -->
<html lang="en" data-screen="profile" data-state="content" data-feature="profile" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 72px;
  }
  .top-bar { display: flex; align-items: center; gap: 8px; padding: 14px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .icon-btn {
    width: 40px; height: 40px; min-width: 44px; min-height: 44px;
    border-radius: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--on-surface-variant);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .scroll { flex: 1; overflow-y: auto; padding: 0 16px; }

  .avatar-section {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0 28px;
  }
  .avatar-wrap { position: relative; width: 96px; height: 96px; }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: var(--primary-container);
    color: #102000;
    border: 2px solid var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; letter-spacing: 1px;
    font-family: 'Outfit', sans-serif;
  }
  .avatar-edit-badge {
    position: absolute; bottom: 0; right: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .avatar-edit-badge .material-icons { font-size: 16px; color: #FFFFFF; }
  .display-name {
    font-size: 22px; font-weight: 600;
    color: var(--primary);
    margin-top: 14px; text-align: center;
  }

  .section-title {
    font-size: 15px; font-weight: 600;
    color: var(--primary);
    padding-bottom: 16px;
  }
  .form-card {
    background: var(--surface);
    border-radius: var(--radius-soft);
    box-shadow: var(--shadow-1);
    padding: 20px;
    margin-bottom: 16px;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field-label {
    font-size: 12px; font-weight: 500;
    color: var(--on-surface-variant);
    margin-bottom: 4px;
  }
  .field-input {
    background: var(--surface-variant);
    border: 1px solid var(--outline-variant);
    border-radius: 6px;
    padding: 12px 14px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    color: var(--on-surface-variant);
    width: 100%;
    opacity: 0.72;
    cursor: not-allowed;
  }
  .field-input:focus { outline: none; }

  .btn-change-password {
    display: block; width: 100%;
    padding: 14px;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 600;
    text-align: center;
    background: transparent;
    border: 1.5px solid var(--outline-variant);
    color: var(--outline);
    cursor: not-allowed;
    opacity: 0.55;
    margin-bottom: 10px;
    min-height: 44px;
  }

  .btn-logout {
    display: block; width: 100%;
    padding: 14px;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 600;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--error);
    cursor: pointer;
    min-height: 44px;
  }
  .btn-logout:hover, .btn-logout:focus-visible {
    background: rgba(186,26,26,0.08);
    outline: none;
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--outline-variant);
    padding: 6px 0 10px; z-index: 8;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px 0; color: var(--on-surface-variant);
    font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer;
  }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" aria-label="Go back"><span class="material-icons" aria-hidden="true">arrow_back</span></button>
    <h1 data-component-type="text" data-component-id="profile_section_header">Profile</h1>
  </header>

  <div class="scroll" data-component-type="LayoutBox" data-component-id="profile_root">

    <section class="avatar-section" data-component-type="stack" data-component-id="profile_avatar_section">
      <div class="avatar-wrap">
        <div class="avatar"
             data-component-type="box"
             data-component-id="profile_avatar_initials"
             role="img"
             aria-label="Your profile initials">JW</div>
        <div class="avatar-edit-badge"
             data-component-type="icon"
             data-component-id="profile_avatar_edit_icon"
             aria-label="Edit" aria-hidden="true">
          <span class="material-icons" aria-hidden="true">edit</span>
        </div>
      </div>
      <div class="display-name"
           data-component-type="text"
           data-component-id="profile_display_name">James Whitfield</div>
    </section>

    <div class="form-card" data-component-type="stack" data-component-id="profile_form_section">
      <div class="section-title"
           data-component-type="text"
           data-component-id="profile_section_header">Personal Information</div>

      <div class="field" data-component-type="input" data-component-id="profile_full_name_field">
        <div class="field-label">Full Name</div>
        <input class="field-input"
               type="text"
               value="James Edward Whitfield"
               disabled
               aria-disabled="true"
               aria-label="Full Name"
               readonly />
      </div>

      <div class="field" data-component-type="input" data-component-id="profile_email_field">
        <div class="field-label">Email Address</div>
        <input class="field-input"
               type="email"
               value="j.whitfield@example.co.uk"
               disabled
               aria-disabled="true"
               aria-label="Email Address"
               readonly />
      </div>

      <div class="field" data-component-type="input" data-component-id="profile_phone_field">
        <div class="field-label">Phone Number</div>
        <input class="field-input"
               type="tel"
               value=""
               disabled
               aria-disabled="true"
               aria-label="Phone Number"
               readonly
               placeholder="—" />
      </div>
    </div>

    <button class="btn-change-password"
            data-component-type="button"
            data-component-id="profile_change_password_button"
            disabled
            aria-disabled="true"
            aria-label="Change Password (not yet available)">Change Password</button>

    <button class="btn-logout"
            data-component-type="button"
            data-component-id="profile_logout_button"
            data-action="onLogout"
            aria-label="Log out of your account">Log Out</button>

  </div>
</main>

<nav class="bottom-nav" data-shell="bottom-nav" aria-label="Primary navigation">
  <a class="nav-item" data-nav-to="home" tabindex="0"><span class="material-icons" aria-hidden="true">home</span>Home</a>
  <a class="nav-item" data-nav-to="accounts" tabindex="0"><span class="material-icons" aria-hidden="true">account_balance</span>Accounts</a>
  <a class="nav-item" data-nav-to="send-money" tabindex="0"><span class="material-icons" aria-hidden="true">send</span>Pay</a>
  <a class="nav-item" data-nav-to="pfm-dashboard" tabindex="0"><span class="material-icons" aria-hidden="true">insights</span>Insights</a>
  <a class="nav-item active" data-nav-to="settings" tabindex="0"><span class="material-icons" aria-hidden="true">more_horiz</span>More</a>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
