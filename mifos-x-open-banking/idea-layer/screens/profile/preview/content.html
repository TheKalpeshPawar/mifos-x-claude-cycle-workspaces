<!doctype html>
<html lang="en" data-screen="profile" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      min-height: 100vh;
    }

    .screen-frame {
      max-width: 390px;
      margin: 0 auto;
      background: var(--background);
      min-height: 100vh;
    }

    .content {
      padding: 24px 16px 32px 16px;
    }

    /* Avatar Section */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 32px;
    }

    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 12px;
    }

    .avatar-image {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--primary-container);
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: var(--primary);
      user-select: none;
    }

    .avatar-edit-icon {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--on-primary);
    }

    .avatar-edit-icon .material-icons { font-size: 16px; }

    .display-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
    }

    /* Form Section */
    .form-section {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 12px;
    }

    .section-header {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
    }

    /* Input Field */
    .input-field {
      margin-bottom: 14px;
    }

    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface-variant);
      margin-bottom: 6px;
      display: block;
    }

    .input-wrap {
      position: relative;
    }

    .input-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--background);
      border: 1.5px solid var(--outline-variant);
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--on-surface);
      outline: none;
      transition: border-color 0.15s;
    }

    .input-control:focus {
      border-color: var(--primary);
    }

    .input-control::placeholder {
      color: var(--outline);
    }

    /* Action Section */
    .action-section {
      padding-bottom: 12px;
    }

    .btn-filled {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-filled:hover { opacity: 0.9; }

    .btn-filled:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-outlined {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--primary);
      border-radius: 8px;
      background: transparent;
      color: var(--primary);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .btn-outlined:hover { background: var(--primary-container); }

    /* Danger Section */
    .danger-section {
      background: var(--surface);
      border-radius: 12px;
      padding: 4px 0;
      margin-top: 12px;
    }

    .btn-logout {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--error);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .btn-logout:hover { background: #FFEAEA; }
  </style>
</head>
<body>
<div class="screen-frame">
  <div class="content">

    <!-- Avatar Section -->
    <div class="avatar-section"
         data-component-type="stack"
         data-component-id="profile_avatar_section">

      <div class="avatar-wrap"
           data-component-type="stack"
           data-component-id="profile_avatar_wrap">
        <div class="avatar-image"
             data-component-type="image"
             data-component-id="profile_avatar_image"
             role="img"
             aria-label="Your profile photo">MS</div>
        <div class="avatar-edit-icon"
             data-component-type="icon"
             data-component-id="profile_avatar_edit_icon"
             data-action="change_avatar"
             role="button"
             aria-label="Change profile photo"
             tabindex="0">
          <span class="material-icons">edit</span>
        </div>
      </div>

      <div class="display-name"
           data-component-type="text"
           data-component-id="profile_display_name"
           role="heading"
           aria-level="1">Maria Santos</div>
    </div>

    <!-- Form Section -->
    <div class="form-section"
         data-component-type="stack"
         data-component-id="profile_form_section">

      <div class="section-header"
           data-component-type="text"
           data-component-id="profile_section_header"
           role="heading"
           aria-level="2">Personal Information</div>

      <!-- Full Name -->
      <div class="input-field"
           data-component-type="input"
           data-component-id="profile_full_name_input">
        <label class="input-label" for="input-full-name">Full Name</label>
        <div class="input-wrap">
          <input class="input-control"
                 id="input-full-name"
                 type="text"
                 value="Maria Santos"
                 placeholder="e.g. Maria Santos"
                 data-action="on_full_name_changed"
                 aria-label="Full Name">
        </div>
      </div>

      <!-- Email -->
      <div class="input-field"
           data-component-type="input"
           data-component-id="profile_email_input">
        <label class="input-label" for="input-email">Email Address</label>
        <div class="input-wrap">
          <input class="input-control"
                 id="input-email"
                 type="email"
                 value="maria.santos@example.com"
                 placeholder="e.g. maria.santos@example.com"
                 data-action="on_email_changed"
                 aria-label="Email Address">
        </div>
      </div>

      <!-- Phone -->
      <div class="input-field"
           data-component-type="input"
           data-component-id="profile_phone_input"
           style="margin-bottom: 0;">
        <label class="input-label" for="input-phone">Phone Number</label>
        <div class="input-wrap">
          <input class="input-control"
                 id="input-phone"
                 type="tel"
                 value="+63 917 123 4567"
                 placeholder="e.g. +63 917 123 4567"
                 data-action="on_phone_changed"
                 aria-label="Phone Number">
        </div>
      </div>

    </div>

    <!-- Action Section -->
    <div class="action-section"
         data-component-type="stack"
         data-component-id="profile_action_section">

      <button class="btn-filled"
              data-component-type="button"
              data-component-id="profile_save_button"
              data-action="save_profile"
              disabled
              aria-label="Save profile changes"
              aria-disabled="true"
              tabindex="0">Save Changes</button>

      <button class="btn-outlined"
              data-component-type="button"
              data-component-id="profile_change_password_button"
              data-nav-to="change-password"
              aria-label="Navigate to change password screen"
              tabindex="0">Change Password</button>

    </div>

    <!-- Danger Section -->
    <div class="danger-section"
         data-component-type="stack"
         data-component-id="profile_danger_section">
      <button class="btn-logout"
              data-component-type="button"
              data-component-id="profile_logout_button"
              data-nav-to="login"
              aria-label="Log out of your account"
              tabindex="0">Log Out</button>
    </div>

  </div>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
