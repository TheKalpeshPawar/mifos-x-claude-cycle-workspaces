<!doctype html>
<!-- render-hash: e7d3b0a2c851 -->
<html lang="en" data-screen="profile" data-state="error" data-feature="profile" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — Error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 72px;
  }
  .top-bar { display: flex; align-items: center; gap: 8px; padding: 14px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .icon-btn {
    width: 40px; height: 40px; min-width: 44px; min-height: 44px;
    border-radius: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--on-surface-variant);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }

  .error-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    gap: 0;
  }
  .error-icon-wrap {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(186,26,26,0.10);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .error-icon-wrap .material-icons {
    font-size: 40px;
    color: var(--error);
  }
  .error-title {
    font-size: 20px; font-weight: 600;
    color: var(--on-surface);
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .error-message {
    font-size: 14px; font-weight: 400;
    color: var(--on-surface-variant);
    line-height: 1.5;
    margin-bottom: 28px;
    max-width: 280px;
  }
  .btn-retry {
    padding: 12px 28px;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 600;
    color: var(--primary);
    background: transparent;
    border: none;
    cursor: pointer;
    min-height: 44px;
  }
  .btn-retry:hover, .btn-retry:focus-visible {
    background: rgba(76,102,43,0.08);
    outline: none;
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--outline-variant);
    padding: 6px 0 10px; z-index: 8;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px 0; color: var(--on-surface-variant);
    font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer;
  }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" aria-label="Go back"><span class="material-icons" aria-hidden="true">arrow_back</span></button>
    <h1 data-component-type="text" data-component-id="profile_section_header">Profile</h1>
  </header>

  <div class="error-body" data-component-type="LayoutBox" data-component-id="profile_root" role="alert">

    <div class="error-icon-wrap"
         data-component-type="icon"
         data-component-id="profile_error_icon"
         aria-label="Error">
      <span class="material-icons" aria-hidden="true">error_outline</span>
    </div>

    <div class="error-title"
         data-component-type="text"
         data-component-id="profile_error_title"
         role="heading"
         aria-level="2">Could not load your profile</div>

    <div class="error-message"
         data-component-type="text"
         data-component-id="profile_error_body">Check your connection and try again.</div>

    <button class="btn-retry"
            data-component-type="button"
            data-component-id="profile_error_retry_button"
            data-action="onRetry"
            aria-label="Retry loading your profile">Retry</button>

  </div>
</main>

<nav class="bottom-nav" data-shell="bottom-nav" aria-label="Primary navigation">
  <a class="nav-item" data-nav-to="home" tabindex="0"><span class="material-icons" aria-hidden="true">home</span>Home</a>
  <a class="nav-item" data-nav-to="accounts" tabindex="0"><span class="material-icons" aria-hidden="true">account_balance</span>Accounts</a>
  <a class="nav-item" data-nav-to="pay" tabindex="0"><span class="material-icons" aria-hidden="true">send</span>Pay</a>
  <a class="nav-item" data-nav-to="pfm-dashboard" tabindex="0"><span class="material-icons" aria-hidden="true">insights</span>Insights</a>
  <a class="nav-item active" data-nav-to="settings" tabindex="0"><span class="material-icons" aria-hidden="true">more_horiz</span>More</a>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
