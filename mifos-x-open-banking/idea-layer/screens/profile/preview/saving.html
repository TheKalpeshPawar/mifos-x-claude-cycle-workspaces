<!doctype html>
<html lang="en" data-screen="profile" data-state="saving">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — Saving</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; position: relative; }
    .screen-frame { max-width: 390px; margin: 0 auto; background: var(--background); min-height: 100vh; }
    .content { padding: 24px 16px 32px; opacity: 0.4; pointer-events: none; }
    /* Avatar */
    .avatar-section { display: flex; flex-direction: column; align-items: center; padding-bottom: 28px; }
    .avatar-image { width: 96px; height: 96px; border-radius: 50%; background: var(--primary-container); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .display-name { font-size: 20px; font-weight: 700; color: var(--primary); }
    .form-section { background: var(--surface); border-radius: 12px; padding: 20px 16px; margin-bottom: 12px; }
    .section-header { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
    .field-mock { height: 46px; border: 1.5px solid var(--outline-variant); border-radius: 8px; background: var(--background); margin-bottom: 14px; }
    .field-lbl { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }
    .btn-mock { height: 46px; border-radius: 8px; background: var(--primary); opacity: 0.6; margin-bottom: 8px; }
    /* Overlay */
    .saving-overlay { position: fixed; inset: 0; max-width: 390px; margin: 0 auto; background: rgba(249,250,239,0.7); display: flex; align-items: center; justify-content: center; z-index: 30; }
    .overlay-card { background: var(--surface); border-radius: 20px; padding: 36px 28px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.14); display: flex; flex-direction: column; align-items: center; gap: 14px; width: 270px; }
    .overlay-spinner { width: 48px; height: 48px; border: 4px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-title { font-size: 17px; font-weight: 700; color: var(--on-surface); }
    .overlay-sub { font-size: 13px; color: var(--outline); }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div class="screen-frame">
    <div class="content" aria-hidden="true">
      <div class="avatar-section">
        <div class="avatar-image">MS</div>
        <div class="display-name">Maria Santos</div>
      </div>
      <div class="form-section">
        <div class="section-header">Personal Information</div>
        <div class="field-lbl">Full Name</div><div class="field-mock"></div>
        <div class="field-lbl">Email Address</div><div class="field-mock"></div>
        <div class="field-lbl">Phone Number</div><div class="field-mock" style="margin-bottom:0;"></div>
      </div>
      <div class="btn-mock"></div>
    </div>
  </div>

  <div class="saving-overlay" role="status" aria-live="polite" aria-label="Saving profile changes"
       data-component-type="box" data-component-id="profile_saving_overlay">
    <div class="overlay-card">
      <div class="overlay-spinner" aria-hidden="true"></div>
      <span class="overlay-title" data-component-type="text" data-component-id="saving_overlay_title">Saving changes…</span>
      <span class="overlay-sub" data-component-type="text" data-component-id="saving_overlay_sub">Updating your profile</span>
    </div>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
