id: consent-intro
name: "Connect Your HSBC Account"
feature: consent-intro
flavor: consumer
status: enriched
quality_score: 95
contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-002]
status_history:
  - { from: null, to: draft, at: "2026-06-11", by: "/idea add" }
  - { from: draft, to: enriched, at: "2026-06-12", by: "/idea-enrich", note: "Enriched the HSBC Open Banking connect-intro: added the four explicit trust pillars (approve at HSBC, choose what to share, read-only until you authorise a payment, revoke anytime), split the legal handoffs into distinct Terms of Service + Privacy Policy links, declared the no-bottom-nav onboarding shell, and added MVI state_model + testing + documentation blocks. No API — static onboarding entry of the account-access-consent journey; authentication and SCA happen at HSBC during the later redirect." }

screens:
  - id: consent-intro
    name: "Connect Your HSBC Account"
    viewmodel: "ConsentIntroViewModel"
    archetype: onboarding
    shell:
      top_bar: false
      bottom_nav: false

archetype: onboarding

components:
  - type: stack
    id: intro_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - intro_hero_icon
      - intro_title
      - intro_subtitle
      - intro_trust_card
      - intro_access_card
      - intro_redirect_card
      - intro_security_note
      - intro_connect_button
      - intro_legal_links
      - intro_footer

  - type: icon
    id: intro_hero_icon
    content: "account_balance"
    variant: default
    style:
      color: "#4C662B"
      size: "72dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      contentDescription: "Secure HSBC Open Banking connection"
      label: "Open Banking connection"
    test_context:
      purpose: "Large bank icon at the top of the consent intro, signalling a secure HSBC Open Banking connection"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_title
    content: "Connect your HSBC account"
    variant: headline_medium
    style:
      typography: "Outfit/headline_medium"
      color: "#1A1C16"
      font_weight: 700
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: heading
      level: 1
      label: "Connect your HSBC account"
    test_context:
      purpose: "Primary headline introducing the Open Banking account-connection journey"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_subtitle
    content: "Link your HSBC account securely through Open Banking to see your balances, transactions and payees — and to make payments when you choose to. Your HSBC password is never entered in this app."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.lg
    a11y:
      role: text
      label: "Link your HSBC account securely through Open Banking to see your balances, transactions and payees, and to make payments when you choose to. Your HSBC password is never entered in this app."
    test_context:
      purpose: "Supporting subtitle explaining the value of connecting and the no-in-app-password reassurance"
      interaction_type: display
      data_driven: false

  - type: card
    id: intro_trust_card
    variant: outlined
    style:
      background: "#FFFFFF"
      border_color: "#C5C8BA"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
      width: "match_parent"
    children:
      - intro_trust_heading
      - intro_trust_point_one
      - intro_trust_point_two
      - intro_trust_point_three
      - intro_trust_point_four
    a11y:
      role: group
      label: "How Open Banking protects you"
    test_context:
      purpose: "Trust card holding the four core reassurance pillars before any data is requested"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_trust_heading
    content: "You stay in control"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: 700
      padding_bottom: spacing.sm
    a11y:
      role: heading
      level: 2
      label: "You stay in control"
    test_context:
      purpose: "Heading of the trust-pillars card"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_trust_point_one
    content: "You approve access at HSBC — not here. Sign-in and approval happen on HSBC's own secure pages."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      padding_bottom: spacing.sm
    a11y:
      role: text
      label: "You approve access at HSBC, not here. Sign-in and approval happen on HSBC's own secure pages."
    test_context:
      purpose: "Trust pillar one — authentication and approval happen at the bank"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_trust_point_two
    content: "You choose exactly what to share. Pick which accounts and details to connect on the next screen."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      padding_bottom: spacing.sm
    a11y:
      role: text
      label: "You choose exactly what to share. Pick which accounts and details to connect on the next screen."
    test_context:
      purpose: "Trust pillar two — the PSU selects the data clusters to share"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_trust_point_three
    content: "Read-only unless you authorise a payment. We can view your data; money only moves when you approve a payment at HSBC."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      padding_bottom: spacing.sm
    a11y:
      role: text
      label: "Read-only unless you authorise a payment. We can view your data; money only moves when you approve a payment at HSBC."
    test_context:
      purpose: "Trust pillar three — read-only by default, payments require separate authorisation"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_trust_point_four
    content: "Revoke access any time in Settings — disconnecting takes effect immediately."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
    a11y:
      role: text
      label: "Revoke access any time in Settings. Disconnecting takes effect immediately."
    test_context:
      purpose: "Trust pillar four — access is revocable at any time from Settings"
      interaction_type: display
      data_driven: false

  - type: card
    id: intro_access_card
    variant: outlined
    style:
      background: "#FFFFFF"
      border_color: "#C5C8BA"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
      width: "match_parent"
    children:
      - intro_access_heading
      - intro_access_list
    a11y:
      role: group
      label: "What this app will read"
    test_context:
      purpose: "Read-only data summary card listing the account data the app will access"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_access_heading
    content: "What we'll read"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: 700
      padding_bottom: spacing.sm
    a11y:
      role: heading
      level: 2
      label: "What we'll read"
    test_context:
      purpose: "Heading of the read-only data summary card"
      interaction_type: display
      data_driven: false

  - type: list
    id: intro_access_list
    variant: bulleted
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    items:
      - "Your account names, numbers and balances"
      - "Your transaction history and statements"
      - "Standing orders, direct debits and payees"
    a11y:
      role: list
      label: "Read-only access: account details and balances, transactions and statements, standing orders, direct debits and payees"
    test_context:
      purpose: "Bulleted summary of the read-only account data the app will access via Open Banking"
      interaction_type: display
      data_driven: false

  - type: card
    id: intro_redirect_card
    variant: filled
    style:
      background: "#CDEDA3"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
      width: "match_parent"
    children:
      - intro_redirect_icon
      - intro_redirect_text
    a11y:
      role: group
      label: "You'll be taken to HSBC to sign in"
    test_context:
      purpose: "Highlighted card explaining the redirect-to-bank authentication step"
      interaction_type: display
      data_driven: false

  - type: icon
    id: intro_redirect_icon
    content: "open_in_browser"
    variant: default
    style:
      color: "#4C662B"
      size: "24dp"
    a11y:
      role: image
      contentDescription: "Secure redirect to HSBC sign-in"
      label: "Secure redirect"
    test_context:
      purpose: "Icon in the redirect-explainer card indicating the PSU will be taken to HSBC to sign in"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_redirect_text
    content: "Next, you'll be taken to HSBC's own secure sign-in to approve this connection. We never see your HSBC username or password."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#1A1C16"
      padding_start: spacing.sm
    a11y:
      role: text
      label: "Next, you'll be taken to HSBC's own secure sign-in to approve this connection. We never see your HSBC username or password."
    test_context:
      purpose: "Explains the redirect-to-bank authentication model so the PSU knows authentication happens at HSBC"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_security_note
    content: "You can review exactly what you're sharing on the next screen before anything is connected."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "You can review exactly what you're sharing on the next screen before anything is connected."
    test_context:
      purpose: "Final reassurance before the CTA — nothing is shared until the PSU reviews and grants on the next screen"
      interaction_type: display
      data_driven: false

  - type: button
    id: intro_connect_button
    label: "Connect your HSBC account"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.sm
      width: "match_parent"
    on_click:
      action: navigate
      target: consent-request
    a11y:
      role: button
      contentDescription: "Connect your HSBC account — continue to choose what you'll share"
      label: "Connect your HSBC account — continue to review what you'll share"
    keyboard:
      focusable: true
    test_context:
      purpose: "Primary CTA that advances to the consent-request screen to review and grant data clusters"
      interaction_type: navigate
      data_driven: false

  - type: stack
    id: intro_legal_links
    variant: horizontal
    style:
      justify: center
      gap: spacing.md
      padding_top: spacing.md
    children:
      - intro_terms_link
      - intro_privacy_link
    a11y:
      role: group
      label: "Legal links"
    test_context:
      purpose: "Row holding the Terms of Service and Privacy Policy links beneath the primary CTA"
      interaction_type: display
      data_driven: false

  - type: link
    id: intro_terms_link
    label: "Terms of Service"
    variant: inline
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      alignment: center
      min_height: 44
      padding_vertical: spacing.sm
    on_click:
      action: navigate
      target: terms-of-service
    a11y:
      role: link
      contentDescription: "Read the Terms of Service"
      label: "Terms of Service — opens the terms of service"
    keyboard:
      focusable: true
    test_context:
      purpose: "Legal link opening the Terms of Service screen"
      interaction_type: navigate
      data_driven: false

  - type: link
    id: intro_privacy_link
    label: "Privacy Policy"
    variant: inline
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      alignment: center
      min_height: 44
      padding_vertical: spacing.sm
    on_click:
      action: navigate
      target: privacy-policy
    a11y:
      role: link
      contentDescription: "Read the Privacy Policy"
      label: "Privacy Policy — opens the privacy policy and Open Banking safeguards"
    keyboard:
      focusable: true
    test_context:
      purpose: "Legal link opening the Privacy Policy screen, which explains the Open Banking safeguards"
      interaction_type: navigate
      data_driven: false

  - type: text
    id: intro_footer
    content: "Powered by Open Banking"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_top: spacing.md
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Powered by Open Banking"
    test_context:
      purpose: "Muted attribution footer indicating the connection is built on the Open Banking standard"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [intro_hero_icon, intro_title, intro_subtitle, intro_trust_card, intro_access_card, intro_redirect_card, intro_security_note, intro_connect_button, intro_legal_links, intro_footer]
    note: "The only render of this static onboarding screen — no async load. All copy is shown immediately as the entry screen of the account-access-consent journey."
  idle:
    layout: { type: column, padding: spacing.lg }
    visible_components: [intro_hero_icon, intro_title, intro_subtitle, intro_trust_card, intro_access_card, intro_redirect_card, intro_security_note, intro_connect_button, intro_legal_links, intro_footer]
    note: "Alias of content — the screen has no data fetch, so its initial and resting render are identical."

state_model:
  ConsentIntroViewModel:
    screen_state: ConsentIntroUiState
    pattern: MVI
    state:
      - field: hasExistingConsent
        type: Boolean
        default: "false"
        note: "True when a prior AUTH-status consent already exists; the CTA may relabel to 'Manage your connection' so a returning PSU can skip re-granting."
    derived: []
    errors: []
    events:
      - ConsentIntroEvent.NavigateToConsentRequest
      - ConsentIntroEvent.NavigateToTermsOfService
      - ConsentIntroEvent.NavigateToPrivacyPolicy
    actions:
      - ConsentIntroAction.ConnectClicked
      - ConsentIntroAction.TermsClicked
      - ConsentIntroAction.PrivacyClicked
    di: [ConsentRepository]
    base: "template.core.base.ui.viewmodel.BaseViewModel<ConsentIntroUiState, ConsentIntroEvent, ConsentIntroAction>"
    note: "Informational onboarding screen — no network calls. ConnectClicked emits NavigateToConsentRequest; TermsClicked and PrivacyClicked open the legal screens. ConsentRepository is read only to detect an existing AUTH consent so a returning PSU can skip re-granting."

navigation:
  - id: nav_to_consent_request
    target: consent-request
    trigger: connect_click
    on_click:
      action: navigate
      target: consent-request
    note: "Primary forward nav — 'Connect your HSBC account' advances to the consent-request grant screen."
  - id: nav_to_terms_of_service
    target: terms-of-service
    trigger: terms_click
    on_click:
      action: navigate
      target: terms-of-service
    note: "Legal nav to the Terms of Service screen."
  - id: nav_to_privacy_policy
    target: privacy-policy
    trigger: privacy_click
    on_click:
      action: navigate
      target: privacy-policy
    note: "Legal nav to the Privacy Policy / Open Banking safety explainer."

api:
  endpoints: []
  note: "No live OBIE call from this onboarding screen — it is purely informational. The account-access-consent (POST /aisp/account-access-consents → AWAU) is created on the next screen (consent-request); authentication and SCA happen at HSBC during the later bank-authorize-handoff redirect."

testing:
  scenarios:
    - { id: TC-CONSENTINTRO-001, scenario: "Screen renders headline, subtitle, trust card, read-only access card, and redirect card", priority: P0 }
    - { id: TC-CONSENTINTRO-002, scenario: "All four trust pillars are visible (approve at HSBC, choose what to share, read-only until payment, revoke in Settings)", priority: P0 }
    - { id: TC-CONSENTINTRO-003, scenario: "Tap 'Connect your HSBC account' navigates to consent-request", priority: P0 }
    - { id: TC-CONSENTINTRO-004, scenario: "Tap 'Terms of Service' navigates to terms-of-service", priority: P1 }
    - { id: TC-CONSENTINTRO-005, scenario: "Tap 'Privacy Policy' navigates to privacy-policy", priority: P1 }
    - { id: TC-CONSENTINTRO-006, scenario: "No password field is present anywhere on the screen (authentication happens at HSBC)", priority: P0 }
  coverage_target: 80

documentation:
  user_stories:
    - { actor: PSU, action: "understand what connecting my HSBC account via Open Banking means", benefit: "I can decide to share data with confidence and without entering my bank password" }
    - { actor: PSU, action: "see that access is read-only and revocable before I start", benefit: "I trust that money only moves when I explicitly authorise a payment at HSBC" }
    - { actor: PSU, action: "start the connection journey", benefit: "I can link my account and see my finances in one place" }
  success_metrics:
    - { metric: connect_cta_tap_rate, target: "70%" }
    - { metric: intro_to_consent_request_completion, target: "85%" }
  feature_flags: []

dependencies:
  tier: feature
  features: [shared-core, obie-consent]
