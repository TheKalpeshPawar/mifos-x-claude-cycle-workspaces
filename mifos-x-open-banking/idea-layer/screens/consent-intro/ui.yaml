id: consent-intro
name: "Connect Your HSBC Account"
feature: consent-intro
flavor: consumer
status: draft
quality_score: 0
contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-OB-001]
status_history:
  - { from: null, to: draft, at: "2026-06-11", by: "/idea add" }

screens:
  - id: consent-intro
    name: "Connect Your HSBC Account"
    viewmodel: "ConsentIntroViewModel"

archetype: onboarding

components:
  - type: stack
    id: intro_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - intro_hero_icon
      - intro_title
      - intro_subtitle
      - intro_access_card
      - intro_redirect_card
      - intro_security_note
      - intro_connect_button
      - intro_terms_link
      - intro_footer

  - type: icon
    id: intro_hero_icon
    content: "account_balance"
    variant: default
    style:
      color: "#4C662B"
      size: "72dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "Open Banking connection"
    test_context:
      purpose: "Large bank icon at the top of the consent intro, signalling a secure HSBC Open Banking connection"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_title
    content: "Connect your HSBC account"
    variant: headline_large
    style:
      typography: "Outfit/headline_medium"
      color: "#1A1C16"
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: heading
      level: 1
      label: "Connect your HSBC account"
    test_context:
      purpose: "Primary headline introducing the Open Banking account-connection journey"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_subtitle
    content: "Link your HSBC account securely through Open Banking to see your balances, transactions and payees — all in one place. No HSBC password is ever entered here."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.lg
    a11y:
      role: text
      label: "Link your HSBC account securely through Open Banking. No HSBC password is ever entered in this app."
    test_context:
      purpose: "Supporting subtitle explaining the value of connecting and the no-in-app-password reassurance"
      interaction_type: display
      data_driven: false

  - type: card
    id: intro_access_card
    variant: outlined
    style:
      background: "#FFFFFF"
      border_color: "#C5C8BA"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - intro_access_heading
      - intro_access_list

  - type: text
    id: intro_access_heading
    content: "What we'll read"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: 700
      padding_bottom: spacing.sm
    a11y:
      role: heading
      level: 2
      label: "What we'll read"
    test_context:
      purpose: "Heading of the read-only data summary card"
      interaction_type: display
      data_driven: false

  - type: list
    id: intro_access_list
    variant: bulleted
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    items:
      - "Your account names, numbers and balances"
      - "Your transaction history and statements"
      - "Standing orders, direct debits and payees"
    a11y:
      role: list
      label: "Read-only access: account details and balances, transactions and statements, standing orders, direct debits and payees"
    test_context:
      purpose: "Bulleted summary of the read-only account data the app will access via Open Banking"
      interaction_type: display
      data_driven: false

  - type: card
    id: intro_redirect_card
    variant: filled
    style:
      background: "#CDEDA3"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - intro_redirect_icon
      - intro_redirect_text

  - type: icon
    id: intro_redirect_icon
    content: "open_in_browser"
    variant: default
    style:
      color: "#4C662B"
      size: "24dp"
    a11y:
      role: image
      label: "Secure redirect"
    test_context:
      purpose: "Icon in the redirect-explainer card indicating the PSU will be taken to HSBC to sign in"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_redirect_text
    content: "You'll be taken to HSBC's own secure sign-in to approve this connection. We never see your HSBC username or password."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#1A1C16"
      padding_start: spacing.sm
    a11y:
      role: text
      label: "You'll be taken to HSBC's own secure sign-in to approve this connection. We never see your HSBC username or password."
    test_context:
      purpose: "Explains the redirect-to-bank authentication model so the PSU knows authentication happens at HSBC"
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_security_note
    content: "Read-only access. You can review exactly what you're sharing on the next screen and revoke it any time."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "Read-only access. You can review what you share on the next screen and revoke it at any time."
    test_context:
      purpose: "Trust framing reinforcing read-only scope and revocability before the PSU continues"
      interaction_type: display
      data_driven: false

  - type: button
    id: intro_connect_button
    label: "Connect your HSBC account"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.sm
      width: "match_parent"
    on_click:
      action: navigate
      target: consent-request
    a11y:
      role: button
      label: "Connect your HSBC account — continue to review what you'll share"
    keyboard:
      focusable: true
    test_context:
      purpose: "Primary CTA that advances to the consent-request screen to review and grant data clusters"
      interaction_type: navigate
      data_driven: false

  - type: link
    id: intro_terms_link
    label: "How Open Banking keeps you safe"
    variant: inline
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      alignment: center
      min_height: 44
      padding_vertical: spacing.sm
    on_click:
      action: navigate
      target: privacy-policy
    a11y:
      role: link
      label: "Learn how Open Banking keeps you safe — opens the privacy policy"
    keyboard:
      focusable: true
    test_context:
      purpose: "Secondary link to the privacy policy explaining Open Banking safeguards"
      interaction_type: navigate
      data_driven: false

  - type: text
    id: intro_footer
    content: "Powered by Open Banking"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_top: spacing.md
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Powered by Open Banking"
    test_context:
      purpose: "Muted attribution footer indicating the connection is built on the Open Banking standard"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: idle
  idle:
    layout: { type: column, padding: spacing.lg }
    visible_components: [intro_hero_icon, intro_title, intro_subtitle, intro_access_card, intro_redirect_card, intro_security_note, intro_connect_button, intro_terms_link, intro_footer]
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [intro_hero_icon, intro_title, intro_subtitle, intro_access_card, intro_redirect_card, intro_security_note, intro_connect_button, intro_terms_link, intro_footer]

state_model:
  ConsentIntroViewModel:
    screen_state: ConsentIntroUiState
    state:
      - field: hasExistingConsent
        type: Boolean
        default: "false"
        note: "True when a prior AUTH-status consent already exists; UI may relabel the CTA to 'Manage your connection'."
    derived: []
    errors: []
    events:
      - ConsentIntroEvent.NavigateToConsentRequest
      - ConsentIntroEvent.NavigateToPrivacyPolicy
    actions:
      - ConsentIntroAction.ConnectClicked
      - ConsentIntroAction.LearnMoreClicked
    di: [ObpAuthRepository]
    base: "template.core.base.ui.viewmodel.BaseViewModel<ConsentIntroUiState, ConsentIntroEvent, ConsentIntroAction>"
    note: "Informational onboarding screen — no network calls. ConnectClicked emits NavigateToConsentRequest; ObpAuthRepository is read only to detect an existing consent so a returning PSU can skip re-granting."

navigation:
  - id: nav_to_consent_request
    target: consent-request
    trigger: connect_click
    on_click:
      action: navigate
      target: consent-request
    note: "Primary forward nav — 'Connect your HSBC account' advances to the consent-request grant screen."
  - id: nav_to_privacy_policy
    target: privacy-policy
    trigger: learn_more_click
    on_click:
      action: navigate
      target: privacy-policy
    note: "Secondary nav to the Open Banking safety / privacy explainer."

api: []

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
