# ─────────────────────────────────────────────────────────────────────────
# Staged consent — the CONSUMER body shape.
# Note what is absent: MerchantCategoryCode, MerchantCustomerIdentification and
# DeliveryAddress. HSBC's Postman example sends all three plus
# PaymentContextCode: EcommerceMerchantInitiatedPayment; that is the merchant shape and
# is wrong for this app. See docs.yaml#consumer_context_constraint.
# ─────────────────────────────────────────────────────────────────────────
staged_consent_request:
  Data:
    Initiation:
      InstructionIdentification: "MFX20260730T1042330001"
      EndToEndIdentification: "E2E-RENT-FLAT12-202607"
      InstructedAmount:
        Amount: "850.00"
        Currency: "GBP"
      DebtorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "80200110203349"
        Name: "Mr Nico"
      CreditorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "40120965872310"
        Name: "Jameson Lettings"
      RemittanceInformation:
        Unstructured:
          - "RENT-FLAT12"
  Risk:
    PaymentContextCode: "TransferToThirdParty"

staged_consent_response:
  Data:
    ConsentId: "812774903"
    Status: "AWAU"
    CreationDateTime: "2026-07-30T10:42:33+00:00"
    StatusUpdateDateTime: "2026-07-30T10:42:33+00:00"
    Initiation:
      InstructionIdentification: "MFX20260730T1042330001"
      EndToEndIdentification: "E2E-RENT-FLAT12-202607"
      InstructedAmount:
        Amount: "850.00"
        Currency: "GBP"
      DebtorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "80200110203349"
        Name: "Mr Nico"
      CreditorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "40120965872310"
        Name: "Jameson Lettings"
      RemittanceInformation:
        Unstructured:
          - "RENT-FLAT12"
  Links:
    Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/pisp/domestic-payment-consents/812774903"
  Meta:
    TotalPages: 1

funds_confirmation_response:
