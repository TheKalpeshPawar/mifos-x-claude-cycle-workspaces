# ─────────────────────────────────────────────────────────────────────────
# Error fixtures — real OB envelope shapes, captured or spec-derived.
# ─────────────────────────────────────────────────────────────────────────
error_fixtures:
  signature_missing:
    # Captured live: this is what the sandbox returns for an unsigned PISP write.
    http_status: 400
    body:
      Code: "400"
      Id: "ecbfbaf1-7673-492d-9de6-019dec3ea9fb"
      Message: "Bad Request"
      Errors:
        - ErrorCode: "U019"
          Message: "Missing information related to signature"

  consent_not_authorised:
    http_status: 400
    body:
      Code: "400"
      Id: "3f21c0a7-9d54-4c11-b7e2-6a1d0f8e4b92"
      Message: "Bad Request"
      Errors:
        - ErrorCode: "U009"
          Message: "Unexpected consent status"

  outside_control_parameters:
    http_status: 400
    body:
      Code: "400"
      Id: "9b7e4d20-1a6c-4f88-9d3a-2c5b7e10f4a6"
      Message: "Bad Request"
      Errors:
        - ErrorCode: "U014"
          Message: "Payment outside control parameters"
          Path: "Data.Initiation.InstructedAmount.Amount"

  consent_mismatch:
    http_status: 400
    body:
      Code: "400"
      Id: "c40a8f16-73b2-4e59-8f01-d6b3a9c27e58"
      Message: "Bad Request"
      Errors:
        - ErrorCode: "U008"
          Message: "Mismatch between staged consent and payment order request"
          Path: "Data.Initiation"

  insufficient_funds:
    http_status: 200
    body:
      Data:
        FundsAvailableResult:
          FundsAvailable: false
          FundsAvailableDateTime: "2026-07-30T10:44:02+00:00"

_test_fixtures:
  amount_exceeds_balance:
    debtor_account_id: "1123456841"       # £482.10 available
    input_amount_minor_units: "85000"      # £850.00
    expected_validation_error: "ExceedsAvailableBalance"
  amount_not_positive:
    input_amount_minor_units: "0"
    expected_validation_error: "AmountNotPositive"
  own_account_transfer_context:
    debtor_account_id: "123456791"
    creditor_account_id: "1123456841"      # both belong to the PSU
    expected_payment_context_code: "TransferToSelf"
  third_party_context:
    debtor_account_id: "123456791"
    creditor_beneficiary_id: "BEN-001"
    expected_payment_context_code: "TransferToThirdParty"
  idempotency_key_reuse:
    description: "Retry after a network drop must reuse the key generated at consent-stage time."
    expected_behaviour: "identical x-idempotency-key on both the failed and retried submit"
