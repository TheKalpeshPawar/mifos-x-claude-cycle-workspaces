sibling: data-flow
schema_version: "4.0"
feature_id: send-money
entries:
  - screen_id: send-money
    trigger: on_mount
    endpoints:
      - get_accounts
      - get_account_beneficiaries
    direction: read
    dtos:
      - name: OBReadAccount6
        role: response
        api_id: get_accounts
      - name: OBReadBeneficiary5
        role: response
        api_id: get_account_beneficiaries
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 500
        behavior: error_state

  - screen_id: send-money
    trigger: on_interact
    event: AccountSelected
    endpoints:
      - get_account_balances
      - get_account_beneficiaries
    direction: read
    dtos:
      - name: OBReadBalance1
        role: response
        api_id: get_account_balances
      - name: OBReadBeneficiary5
        role: response
        api_id: get_account_beneficiaries
    produces_state: content
    error_paths:
      - error_code: 403
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
