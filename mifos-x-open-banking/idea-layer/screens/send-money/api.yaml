sibling: api
schema_version: "4.0"
feature_id: send-money
api:
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: AISP
    demo_source: demo-data.yaml#/collections/get_accounts
    description: "List the PSU's authorised accounts to populate the FROM ACCOUNT selector. Requires an authorised account-access-consent (Status AUTH) + an authorization-code token (scope accounts). OBIE object OBReadAccount6."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].Account[].SchemeName
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
  - id: get_account_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: AISP
    demo_source: demo-data.yaml#/collections/get_account_balances
    description: "Available balance for the selected source account, shown in the FROM ACCOUNT row. Requires ReadBalances on the account-access-consent + an authorization-code token. OBIE object OBReadBalance1; prefer Type InterimAvailable."
    response:
      fields:
        - name: Data.Balance[].AccountId
          type: String
        - name: Data.Balance[].Type
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
  - id: get_account_beneficiaries
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/beneficiaries"
    tag: AISP
    demo_source: demo-data.yaml#/collections/get_account_beneficiaries
    description: "Saved beneficiaries linked to the selected account — populates recent recipients + all beneficiaries lists. Requires ReadBeneficiariesBasic/Detail on the account-access-consent + an authorization-code token. OBIE object OBReadBeneficiary5. NOTE: OBIE AIS exposes no payee-recency timeline; 'recent recipients' is a client-side ordering over the returned beneficiaries (no separate transaction-requests endpoint exists under OBIE)."
    response:
      fields:
        - name: Data.Beneficiary[].BeneficiaryId
          type: String
        - name: Data.Beneficiary[].BeneficiaryType
          type: String
        - name: Data.Beneficiary[].Reference
          type: String
        - name: Data.Beneficiary[].CreditorAccount.SchemeName
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Identification
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Name
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
