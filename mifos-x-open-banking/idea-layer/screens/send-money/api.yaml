sibling: api
schema_version: "4.0"
feature_id: send-money
api:
  - id: obp_get_sender_accounts
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts"
    tag: Accounts
    description: "List the user's accounts to populate the FROM ACCOUNT selector. AccountsRepository.myAccounts()."
    response:
      fields:
        - name: accounts
          type: List<Account>
        - name: id
          type: String
        - name: label
          type: String
        - name: balance
          type: MoneyAmount
        - name: currency
          type: String
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "BANK_NOT_FOUND"
  - id: obp_get_beneficiary_counterparties
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/counterparties"
    tag: Counterparties
    description: "Selected account's beneficiaries (filtered is_beneficiary). PaymentsRepository.listBeneficiaries(bankId, accountId). viewId fixed to owner in shipped path."
    response:
      fields:
        - name: counterparties
          type: List<Counterparty>
        - name: counterparty_id
          type: String
        - name: name
          type: String
        - name: other_bank_routing_scheme
          type: String
        - name: other_bank_routing_address
          type: String
        - name: other_account_routing_scheme
          type: String
        - name: other_account_routing_address
          type: String
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_list_transaction_requests
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-requests"
    tag: TransactionRequests
    description: "Past transaction-requests — recency source for 'recent recipients'. PaymentsRepository.listTransactionRequests(bankId, accountId)."
    response:
      fields:
        - name: transaction_requests
          type: List<TransactionRequestSummary>
        - name: start_date
          type: DateTime
        - name: details.to_counterparty.counterparty_id
          type: String
        - name: details.to_sepa.iban
          type: String
        - name: details.to_sandbox_tan.account_id
          type: String
  - id: obp_get_bank
    endpoint: "GET /obp/v4.0.0/banks/{bankId}"
    tag: Banks
    description: "Resolve a beneficiary's bank display name for the subtitle. BanksRepository.bankName(routingAddress) when other_bank_routing_scheme == OBP."
    response:
      fields:
        - name: id
          type: String
        - name: full_name
          type: String
        - name: short_name
          type: String
