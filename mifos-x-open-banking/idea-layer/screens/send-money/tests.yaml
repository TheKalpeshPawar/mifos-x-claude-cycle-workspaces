sibling: tests
schema_version: "4.0"
feature_id: send-money

screen_id: send-money

scenarios:
  - id: TC-SEND-001
    description: "Recipient step renders the PSU's own accounts as debtor candidates and saved payees as creditors"
    state: content
    priority: p0
    given: "Valid PSU access token; two authorised accounts and three saved payees resolve from the shipped repositories"
    when: "Screen mounts from the Pay tab"
    then:
      - "Two debtor account rows render (Current account ·· 3349, BMM ACCOUNT ·· 3695) with available-balance labels"
      - "Three creditor rows render (Jameson Lettings, John Sharma, EDF Energy) with scheme label and identification"
      - "An Enter manually affordance is visible for payees that are not saved"
      - "Data matches demo-data values"

  - id: TC-SEND-002
    description: "Loading state shown while debtor accounts and payees are fetched"
    state: loading
    priority: p0
    given: "Slow network; both source streams in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible and labelled"
      - "Neither the debtor selector nor the creditor selector is rendered"

  - id: TC-SEND-003
    description: "Amount validation blocks advance when the amount exceeds the selected account's available balance"
    state: content
    priority: p0
    given: "Debtor account 1123456841 selected, available balance £482.10"
    when: "PSU enters £850.00 (85000 minor units)"
    then:
      - "validationError is ExceedsAvailableBalance"
      - "The amount field shows the validation message as error text"
      - "The Review button is disabled"

  - id: TC-SEND-004
    description: "Amount validation rejects a zero or negative amount"
    state: content
    priority: p1
    given: "A debtor account and creditor are selected"
    when: "PSU enters 0"
    then:
      - "validationError is AmountNotPositive"
      - "The Review button is disabled"

  - id: TC-SEND-005
    description: "Staged consent carries the CONSUMER Risk shape and omits every merchant field"
    state: submitting
    priority: p0
    given: "Debtor 123456791, creditor BEN-001 (Jameson Lettings), amount £850.00, reference RENT-FLAT12"
    when: "PSU taps Confirm on the review step"
    then:
      - "POST /domestic-payment-consents is sent with Risk.PaymentContextCode = TransferToThirdParty"
      - "Risk contains NO MerchantCategoryCode, NO MerchantCustomerIdentification and NO DeliveryAddress"
      - "Data.Initiation.DebtorAccount is populated from the PSU's own selected account"
      - "Data.Initiation carries InstructionIdentification, EndToEndIdentification, InstructedAmount and CreditorAccount"
      - "An x-jws-signature header is present"
      - "An x-idempotency-key header is present and at most 40 characters"

  - id: TC-SEND-006
    description: "Own-account transfer is classified as TransferToSelf, not TransferToThirdParty"
    state: submitting
    priority: p1
    given: "Debtor 123456791 and creditor 1123456841 both belong to the PSU"
    when: "PSU confirms the payment"
    then:
      - "Risk.PaymentContextCode = TransferToSelf"
      - "Risk still contains no merchant fields"

  - id: TC-SEND-007
    description: "Missing detached JWS signature surfaces U019 as a non-recoverable error with a support reference"
    state: error
    priority: p0
    given: "The signer is misconfigured; HSBC returns 400 with Errors[].ErrorCode U019"
    when: "PSU confirms the payment"
    then:
      - "Error state renders with the SignatureMissing message"
      - "The support reference shows the OB envelope Id ecbfbaf1-7673-492d-9de6-019dec3ea9fb"
      - "NO Retry button is visible — this is an implementation fault, not a transient failure"
      - "NO Re-authorise button is visible"

  - id: TC-SEND-008
    description: "U009 unexpected consent status offers Re-authorise, not Retry"
    state: error
    priority: p0
    given: "The PSU abandoned the authorise leg; HSBC returns 400 U009 on submit"
    when: "The app attempts to submit the payment"
    then:
      - "Error state renders with the ConsentNotAuthorised message"
      - "Re-authorise button is visible and routes to payment-consent"
      - "Retry button is NOT visible"

  - id: TC-SEND-009
    description: "U014 outside control parameters returns the PSU to the amount step with selections preserved"
    state: error
    priority: p1
    given: "Amount exceeds an HSBC payment limit; HSBC returns 400 U014"
    when: "PSU confirms the payment"
    then:
      - "Error state renders with the OutsideControlParameters message"
      - "Edit amount button is visible"
      - "Tapping it returns the form to the amount step with the debtor and creditor still selected"

  - id: TC-SEND-010
    description: "Retry after a network failure reuses the original idempotency key"
    state: error
    priority: p0
    given: "The submit call failed with a socket timeout after the consent was authorised"
    when: "PSU taps Retry"
    then:
      - "The retried POST /domestic-payments carries the SAME x-idempotency-key as the failed attempt"
      - "The same Data.Initiation is resent byte-identically"
      - "No second payment is created"

  - id: TC-SEND-011
    description: "Funds-confirmation returning FundsAvailable=false blocks submission"
    state: error
    priority: p1
    given: "The consent is Authorised but funds-confirmation reports FundsAvailable=false"
    when: "The app attempts to submit"
    then:
      - "Error state renders with the InsufficientFunds message"
      - "POST /domestic-payments is NOT sent"
      - "Edit amount button is visible"

  - id: TC-SEND-012
    description: "Successful submission renders the success state and hands the payment id to payment-status"
    state: success
    priority: p1
    given: "Consent 812774903 is Authorised and funds are available"
    when: "The app submits the payment"
    then:
      - "Success state renders with amount £850.00 and payee Jameson Lettings"
      - "Status label reflects AcceptedSettlementInProcess"
      - "View status button navigates to payment-status with paymentId PMT-812774903-01"

  - id: TC-SEND-013
    description: "A PSU with no saved payees sees the no-payees affordance and can still pay manually"
    state: content
    priority: p2
    given: "The PSU is on the recipient step and Data.Beneficiary[] returns an empty array"
    when: "The recipient step renders"
    then:
      - "no_saved_payees empty_state renders inside the content state, not a screen-level empty state"
      - "manual_creditor_button remains visible and enabled"
      - "Tapping it reveals manual_sort_code and manual_account_number"
      - "The screen is never replaced by a dead-end empty screen"

  - id: TC-SEND-014
    description: "The review step renders every payment fact as a labelled row inside the trust-critical review card"
    state: content
    priority: p1
    given: "The PSU has chosen a debtor account, a creditor, an amount and a reference"
    when: "The form advances to the review step"
    then:
      - "review_summary renders as review_card, not a generic card"
      - "Four info_row children render: From, To, Amount, Reference"
      - "The Amount row carries emphasis so it reads as the primary fact"
      - "A blank reference renders the explicit 'None' string, never an empty row"
      - "form_step_indicator reads Step 3 of 3"

coverage_notes:
  review_surface: >-
    TC-SEND-014 pins the review card as the trust-critical surface. Before 2026-07-31 this
    was a bare `card` with no children at all — it declared required_fields but rendered no
    structure, so the last screen before an irreversible transfer had nothing on it.
  first_time_payer: >-
    TC-SEND-013 pins the deliberate choice that an empty payee list is an INLINE affordance,
    not a screen state. manual_creditor_button is visible for the whole recipient step, so a
    first-time payer already has a working path; promoting the empty list to a screen-level
    `empty` state would replace a usable screen with a dead end.
  consumer_context: >-
    TC-SEND-005 and TC-SEND-006 are the regression guard for the single most reversible
    mistake in this feature — copying HSBC's merchant-shaped Postman body. They assert both
    the correct PaymentContextCode and the ABSENCE of the three merchant fields.
  idempotency: >-
    TC-SEND-010 is the duplicate-payment guard. Without it a retry path regression would be
    invisible until it charged a PSU twice.
  signature: >-
    TC-SEND-007 pins the deliberate choice that U019 gets no Retry CTA. Offering one would
    invite the PSU to hammer a call that cannot succeed until the client is fixed.
