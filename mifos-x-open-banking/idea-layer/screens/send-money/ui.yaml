responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - from_account_header
      show_progress_indicator: true
  content:
    layout:
      visible_components:
        - from_account_header
        - account_selector
        - recent_recipients_header
        - recipient_new
        - recent_recipient_item
        - all_beneficiaries_header
        - beneficiary_item
        - beneficiary_subtitle
        - no_beneficiaries_note
  empty:
    layout:
      visible_components: []
      show_empty_state: true
      empty_state_title: "No recipients yet"
      empty_state_message: "People you pay will appear here."
      empty_state_cta: "New transfer"
  error:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Couldn't load recipients"
      error_message: "We couldn't load this account's recipients. Try again, or switch to another account."
      show_retry_button: true
  no_network:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "You're offline"
      error_message: "We can't reach your bank right now. Check your connection and try again."
      show_retry_button: true
  unauthenticated:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Session expired"
      error_message: "Your sign-in has expired. Sign in again to load your recipients."
      show_retry_button: true

state_model:
  view_model: SendMoneyHubViewModel
  ui_state_type: "ScreenState<SendMoneyHubContent>"
  content_type: SendMoneyHubContent
  content_fields:
    - name: accounts
      type: List<Account>
    - name: selectedAccountId
      type: String
    - name: recentRecipients
      type: List<HubRecipient>
    - name: allBeneficiaries
      type: List<HubRecipient>
  states:
    - Loading
    - Content
    - Empty
    - Error
    - NoNetwork
    - Unauthenticated
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Couldn't load recipients."
  events:
    - onRefresh
    - onRetry
    - onAccountSelected
  actions:
    - select_recipient
    - new_recipient
    - select_account
  callbacks:
    - name: onRecipientSelected
      signature: "(accountId: String, counterpartyId: String) -> Unit"
      consumer: send-money-amount
    - name: onNewTransfer
      signature: "(accountId: String) -> Unit"
      consumer: send-money-amount
    - name: onBack
      signature: "() -> Unit"
  di:
    - AccountsRepository
    - PaymentsRepository
    - BanksRepository
    - UserPreferencesRepository

api:
  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts"
    tag: Accounts
    description: "List the user's accounts to populate the FROM ACCOUNT selector; default account from UserPreferencesRepository."
    response:
      fields:
        - name: accounts
          type: List<Account>
        - name: id
          type: String
        - name: label
          type: String
        - name: balance
          type: MoneyAmount
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/counterparties"
    tag: Counterparties
    description: "Selected account's beneficiaries (filtered is_beneficiary). Used to build recent recipients + all beneficiaries lists. viewId fixed to owner in the shipped path."
    response:
      fields:
        - name: counterparties
          type: List<Counterparty>
        - name: counterparty_id
          type: String
        - name: name
          type: String
        - name: other_account_routing_scheme
          type: String
        - name: other_account_routing_address
          type: String
        - name: other_bank_routing_scheme
          type: String
        - name: other_bank_routing_address
          type: String
    errors:
      - code: 401
        message: "OBP-20001: User not logged in"
      - code: 404
        message: "OBP-30018: Bank Account not found"
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-requests"
    tag: TransactionRequests
    description: "Past transaction-requests for the account — the authoritative record of which counterparty/IBAN/sandbox-account was paid and when. Recent-recipients recency is derived from this (OBP transactions do not reliably identify the payee)."
    response:
      fields:
        - name: transaction_requests
          type: List<TransactionRequestSummary>
        - name: start_date
          type: DateTime
        - name: details.to_counterparty.counterparty_id
          type: String
        - name: details.to_sepa.iban
          type: String
        - name: details.to_sandbox_tan.account_id
          type: String
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}"
    tag: Banks
    description: "Bank directory entry (cached) used to resolve each beneficiary's bank display name (BanksRepository.bankName) for the 'SEPA · BankName ·· last4' subtitle when the routing scheme is OBP."
    response:
      fields:
        - name: full_name
          type: String
        - name: bank_routings
          type: List<AccountRouting>
        - name: attributes
          type: List<BankAttribute>

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries
    - send-money-amount
