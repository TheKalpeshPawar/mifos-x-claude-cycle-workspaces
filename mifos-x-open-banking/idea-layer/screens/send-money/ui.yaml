screen_id: send-money
archetype: form
name: "{strings.send_money.screen_title}"
status: enriched
quality_score: 88
initial_state: loading

capability_tags:
  - rest-client
  - form-input
  - multi-step-form
  - error-recovery
  - jws-signing

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.send_money.screen_title}"
  top_app_bar_leading: none
  fab_visible: false

states: [loading, content, submitting, success, error]

business_logic:
  kind: form
  description: >-
    Three-step consumer payment form backed by the HSBC PISP domestic-payment endpoints.
    Step 1 (Recipient) lists the PSU's own authorised accounts as debtor candidates (from the
    shipped AccountsRepository) and their saved payees as creditor candidates (from the shipped
    BeneficiariesRepository), with a manual sort-code plus account-number entry as the fallback.
    Step 2 (Amount) captures the amount in minor units and an optional unstructured remittance
    reference, validating locally against the selected account's available balance before the
    PSU can advance. Step 3 (Review) renders the finished payment for confirmation and, on
    confirm, stages a domestic-payment-consent via POST /domestic-payment-consents using a
    payments-scope client-credentials token with a detached PS256 JWS over the body and a
    stable idempotency key. Risk carries PaymentContextCode TransferToThirdParty (or
    TransferToSelf when debtor and creditor are both the PSU's) and NO merchant fields — this
    is a consumer payment, not a merchant checkout. The app-to-app authorise leg is delegated
    to the payment-consent feature; on return the payment is submitted via POST
    /domestic-payments reusing the same idempotency key, and the resulting DomesticPaymentId is
    handed to payment-status. All money formatting happens in the ViewModel via core/common
    FormatMoney so composables receive finished label strings.
  external_library_refs:
    - "ktorfit"
    - "hsbc-obie-pisp-v4.0:domestic-payments"
  description_author: claude
  description_authored_at: "2026-07-30T00:00:00Z"

state_model:
  SendMoneyViewModel:
    state:
      name: SendMoneyState
      fields:
        - name: uiState
          type: SendMoneyUiState
        - name: idempotencyKey
          type: String
          notes: "Generated once when the form is first completed; reused across every retry."
    screen_state:
      sealed_class: SendMoneyUiState
      members:
        - Loading
        - Content      # step: Step(Recipient|Amount|Review), debtorAccounts: List<BankAccount>, beneficiaries: List<BeneficiaryItem>, debtorAccountId: String?, creditor: CreditorSelection?, amountMinorUnits: String, amountLabel: String, reference: String?, validationError: ValidationError?
        - Submitting   # stage: Stage(StagingConsent|AwaitingAuthorisation|SubmittingPayment), consentId: String?
        - Success      # paymentId: String, statusLabel: String, amountLabel: String, creditorName: String
        - Error        # type: SendMoneyErrorKind, message: String, supportReference: String?
    errors:
      types:
        - SignatureMissing         # 400 U019 — implementation fault, not user-recoverable
        - ConsentNotAuthorised     # 400 U009 — re-authorise
        - ConsentMismatch          # 400 U008 — discard and restart
        - OutsideControlParameters # 400 U014 — lower the amount
        - InvalidField             # 400 U002 — fix the recipient field
        - ConsentRevoked           # 403 — view consents
        - TokenExpired             # 401 — retry after refresh
        - RateLimited              # 429 — retry with back-off
        - InsufficientFunds        # funds-confirmation FundsAvailable=false
        - NetworkError             # IOException / timeout
    actions:
      members:
        - SelectDebtorAccount   # data class — accountId
        - SelectCreditor        # data class — saved beneficiary or manual entry
        - EnterAmount           # data class — minorUnits + optional reference
        - ReviewPayment
        - ConfirmAndStageConsent
        - SubmitPayment         # data class — consentId
        - RetrySubmit
        - CancelPayment
        - BackStep
    events:
      sealed_class: SendMoneyEvent
      members:
        - LaunchAuthorisation   # data class — authorisation URL; the Screen opens the browser
        - PaymentSucceeded      # data class — paymentId; host navigates to payment-status
      notes: >-
        Non-Nothing event type. The authorise leg leaves the app, so the ViewModel emits an
        event and the Screen performs the browser launch — matching how transaction-detail
        emits CopyToClipboard rather than touching the platform itself.
    di:
      - SendMoneyRepository        # Koin single — stages consent, submits payment
      - AccountsRepository         # already shipped — debtor candidates
      - BeneficiariesRepository    # already shipped — creditor candidates

dependencies:
  tier: feature
  features:
    - name: accounts
      relation: data-source
      params: []
      notes: "Supplies the debtor account list — the PSU's own authorised accounts."
    - name: beneficiaries
      relation: data-source
      params: [accountId]
      notes: "Supplies saved payees as creditor candidates."
    - name: payment-consent
      relation: child
      params: [consentId]
      notes: "Owns the app-to-app authorise leg on scope=payments."
    - name: payment-status
      relation: child
      params: [paymentId]
      notes: "Receives DomesticPaymentId after a successful submit."
    - name: consent-list
      relation: error-recovery
      condition: "error.type == ConsentRevoked"
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for the HSBC PISP domestic-payment endpoints"

components:
  - type: progress_indicator
    variant: circular
    state_binding: [loading]
    accessibility_label: "{strings.send_money.loading_label}"
    test_context:
      purpose: "Indicate the initial fetch of debtor accounts and saved payees"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Step 1 — Recipient ────────────────────────────────────────────────
  - type: list
    id: debtor_account_selector
    state_binding: [content]
    visibility_condition: "{content.step | isRecipient}"
    scroll_direction: vertical
    items_source: "{content.debtorAccounts}"
    accessibility_label: "{strings.send_money.debtor_list_label}"
    test_context:
      purpose: "Choose which of the PSU's own authorised accounts funds the payment"
      required_fields: ["content.debtorAccounts"]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        id: debtor_account_row
        variant: two_line
        headline: "{item.displayName}"
        supporting_text: "{item.availableBalanceLabel}"
        accessibility_label: "{item.displayName}, available {item.availableBalanceLabel}"
        on_click:
          action: select_debtor_account
          param: accountId
          action_contract:
            effect: transform_state
            external_library_refs: [kotlinx-coroutines]
            description: >-
              Records the chosen debtor account id on the form state without any network call;
              the account list was already loaded, so this is a pure in-memory selection that
              unlocks the creditor picker below it.
        test_context:
          purpose: "Select the funding account"
          required_fields: ["item.displayName", "item.availableBalanceLabel"]
          interaction_type: action
          data_driven: true

  - type: list
    id: creditor_selector
    state_binding: [content]
    visibility_condition: "{content.step | isRecipient}"
    scroll_direction: vertical
    items_source: "{content.beneficiaries}"
    accessibility_label: "{strings.send_money.creditor_list_label}"
    test_context:
      purpose: "Choose a saved payee as the creditor"
      required_fields: ["content.beneficiaries"]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        id: creditor_row
        variant: two_line
        headline: "{item.name}"
        supporting_text: "{item.schemeLabel} · {item.identification}"
        accessibility_label: "{item.name}, {item.schemeLabel} {item.identification}"
        on_click:
          action: select_creditor
          param: beneficiaryId
          action_contract:
            effect: transform_state
            external_library_refs: [kotlinx-coroutines]
            description: >-
              Records the chosen saved payee as the payment creditor on form state and advances
              the form to the amount step; no network call, the payee list is already resident.
        test_context:
          purpose: "Select a saved payee as creditor"
          required_fields: ["item.name", "item.identification", "item.schemeLabel"]
          interaction_type: action
          data_driven: true

  - type: button
    id: manual_creditor_button
    variant: text
    state_binding: [content]
    visibility_condition: "{content.step | isRecipient}"
    label: "{strings.send_money.enter_manually}"
    accessibility_label: "{strings.send_money.enter_manually_a11y}"
    on_click:
      action: show_manual_creditor_entry
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Reveals the manual sort-code and account-number fields so the PSU can pay someone who
          is not in their saved-payee list; a pure form-state toggle with no network effect.
    test_context:
      purpose: "Reveal manual creditor entry for an unsaved payee"
      required_fields: []
      interaction_type: action
      data_driven: false

  - type: text_field
    id: manual_sort_code
    state_binding: [content]
    visibility_condition: "{content.manualEntryVisible}"
    label: "{strings.send_money.sort_code_label}"
    placeholder: "{strings.send_money.sort_code_placeholder}"
    accessibility_label: "{strings.send_money.sort_code_a11y}"
    input_type: number
    max_length: 8
    on_change:
      action: update_manual_sort_code
      param: sortCode
    test_context:
      purpose: "Capture a six-digit UK sort code for a manual payee"
      required_fields: []
      interaction_type: action
      data_driven: false

  - type: text_field
    id: manual_account_number
    state_binding: [content]
    visibility_condition: "{content.manualEntryVisible}"
    label: "{strings.send_money.account_number_label}"
    placeholder: "{strings.send_money.account_number_placeholder}"
    accessibility_label: "{strings.send_money.account_number_a11y}"
    input_type: number
    max_length: 8
    on_change:
      action: update_manual_account_number
      param: accountNumber
    test_context:
      purpose: "Capture an eight-digit UK account number for a manual payee"
      required_fields: []
      interaction_type: action
      data_driven: false

  # ── Step 2 — Amount ───────────────────────────────────────────────────
  - type: text_field
    id: amount_field
    state_binding: [content]
    visibility_condition: "{content.step | isAmount}"
    label: "{strings.send_money.amount_label}"
    placeholder: "{strings.send_money.amount_placeholder}"
    accessibility_label: "{strings.send_money.amount_a11y}"
    input_type: currency
    error_text: "{content.validationError.message}"
    on_change:
      action: enter_amount
      param: minorUnits
    test_context:
      purpose: "Capture the payment amount, held as minor units and validated against available balance"
      required_fields: ["content.validationError"]
      interaction_type: action
      data_driven: true

  - type: text_field
    id: reference_field
    state_binding: [content]
    visibility_condition: "{content.step | isAmount}"
    label: "{strings.send_money.reference_label}"
    placeholder: "{strings.send_money.reference_placeholder}"
    accessibility_label: "{strings.send_money.reference_a11y}"
    input_type: text
    max_length: 35
    on_change:
      action: enter_reference
      param: reference
    test_context:
      purpose: "Capture the optional unstructured remittance reference shown on the payee's statement"
      required_fields: []
      interaction_type: action
      data_driven: false

  - type: button
    id: review_button
    variant: filled
    state_binding: [content]
    visibility_condition: "{content.step | isAmount}"
    enabled_condition: "{content.validationError | isNull}"
    label: "{strings.send_money.review_cta}"
    accessibility_label: "{strings.send_money.review_cta_a11y}"
    on_click:
      action: review_payment
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Advances the form from the amount step to the review step once local validation passes;
          no funds are moved and no request is sent, the PSU still has to confirm.
    test_context:
      purpose: "Advance to the review step; disabled while a validation error is present"
      required_fields: ["content.validationError"]
      interaction_type: action
      data_driven: true

  # ── Step 3 — Review ───────────────────────────────────────────────────
  - type: card
    id: review_summary
    state_binding: [content]
    visibility_condition: "{content.step | isReview}"
    accessibility_label: "{strings.send_money.review_summary_a11y}"
    test_context:
      purpose: "Render the finished payment — debtor, creditor, amount and reference — for confirmation"
      required_fields: ["content.debtorAccountId", "content.creditor", "content.amountLabel"]
      interaction_type: display
      data_driven: true

  - type: button
    id: confirm_button
    variant: filled
    state_binding: [content]
    visibility_condition: "{content.step | isReview}"
    label: "{strings.send_money.confirm_cta}"
    accessibility_label: "{strings.send_money.confirm_cta_a11y}"
    on_click:
      action: confirm_and_stage_consent
      action_contract:
        effect: call_api
        external_library_refs: [ktorfit, "hsbc-obie-pisp-v4.0:domestic-payment-consents"]
        description: >-
          Stages the payment by POSTing a domestic-payment-consent with a payments-scope
          client-credentials token, a detached PS256 JWS over the request body and a stable
          idempotency key, sending Risk.PaymentContextCode TransferToThirdParty with no merchant
          fields; then emits LaunchAuthorisation so the Screen can open the bank's authorise page.
    test_context:
      purpose: "Stage the payment consent and hand off to the app-to-app authorise leg"
      required_fields: []
      interaction_type: action
      data_driven: false

  - type: button
    id: cancel_button
    variant: text
    state_binding: [content]
    visibility_condition: "{content.step | isReview}"
    label: "{strings.send_money.cancel_cta}"
    accessibility_label: "{strings.send_money.cancel_cta_a11y}"
    on_click:
      action: cancel_payment
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Discards the staged payment and returns the form to the recipient step; nothing has been
          sent to the bank at this point so no revocation call is needed.
    test_context:
      purpose: "Abandon the payment before any consent is staged"
      required_fields: []
      interaction_type: action
      data_driven: false

  # ── Submitting ────────────────────────────────────────────────────────
  - type: progress_indicator
    id: submitting_indicator
    variant: circular
    state_binding: [submitting]
    accessibility_label: "{strings.send_money.submitting_label}"
    test_context:
      purpose: "Indicate consent staging, authorisation wait, or payment submission in flight"
      required_fields: ["submitting.stage"]
      interaction_type: display
      data_driven: true

  # ── Success ───────────────────────────────────────────────────────────
  - type: empty_state
    id: payment_success
    variant: success
    state_binding: [success]
    icon: check_circle
    title: "{strings.send_money.success_title}"
    body: "{strings.send_money.success_body}"
    accessibility_label: "{strings.send_money.success_title}"
    test_context:
      purpose: "Confirm the payment was accepted, showing amount, payee and the returned status"
      required_fields: ["success.paymentId", "success.statusLabel", "success.amountLabel", "success.creditorName"]
      interaction_type: display
      data_driven: true
    children:
      - type: button
        id: view_payment_status_button
        variant: filled
        label: "{strings.send_money.view_status_cta}"
        accessibility_label: "{strings.send_money.view_status_cta_a11y}"
        on_click:
          action: navigate
          target: payment-status
          action_contract:
            effect: navigate
            description: >-
              Opens the payment-status screen for the returned DomesticPaymentId so the PSU can
              track settlement, since the initial status is usually AcceptedSettlementInProcess
              rather than a completed settlement.
        test_context:
          purpose: "Navigate to payment-status with the returned DomesticPaymentId"
          required_fields: ["success.paymentId"]
          interaction_type: navigate
          data_driven: true

  # ── Error ─────────────────────────────────────────────────────────────
  - type: empty_state
    id: error_state
    variant: error
    state_binding: [error]
    icon: error_outline
    title: "{strings.send_money.error_title}"
    body: "{error.message}"
    accessibility_label: "{strings.send_money.error_title}"
    test_context:
      purpose: "Surface typed PISP errors with recovery differentiated by OBIE error code"
      required_fields: ["error.message", "error.type"]
      interaction_type: display
      data_driven: true
    children:
      - type: button
        id: retry_button
        variant: filled
        label: "{strings.send_money.retry}"
        visibility_condition: "{error.type | isRetryable}"
        accessibility_label: "{strings.send_money.retry_a11y}"
        on_click:
          action: retry_submit
          action_contract:
            effect: call_api
            external_library_refs: [ktorfit, "hsbc-obie-pisp-v4.0:domestic-payments"]
            description: >-
              Re-sends the failed PISP call reusing the SAME idempotency key, so a retry after a
              network drop or token refresh returns the original result rather than creating a
              second payment; offered only for TokenExpired, RateLimited and NetworkError.
        test_context:
          purpose: "Retry a transient failure safely via the reused idempotency key"
          required_fields: []
          interaction_type: action
          data_driven: false

      - type: button
        id: reauthorise_button
        variant: tonal
        label: "{strings.send_money.reauthorise}"
        visibility_condition: "{error.type | isConsentNotAuthorised}"
        accessibility_label: "{strings.send_money.reauthorise_a11y}"
        on_click:
          action: navigate
          target: payment-consent
          action_contract:
            effect: navigate
            description: >-
              Restarts the app-to-app authorise leg when the bank reports U009 unexpected consent
              status, which means the PSU never completed or already exhausted the authorisation.
        test_context:
          purpose: "Restart the authorise leg after U009"
          required_fields: []
          interaction_type: navigate
          data_driven: false

      - type: button
        id: view_consents_button
        variant: tonal
        label: "{strings.send_money.view_consents}"
        visibility_condition: "{error.type | isConsentRevoked}"
        accessibility_label: "{strings.send_money.view_consents_a11y}"
        on_click:
          action: navigate
          target: consent-list
          action_contract:
            effect: navigate
            description: >-
              Navigates to consent-list on HTTP 403 so the PSU can review and re-authorise the
              revoked or expired payment consent.
        test_context:
          purpose: "Route to consent-list when the payment consent is revoked"
          required_fields: []
          interaction_type: navigate
          data_driven: false

      - type: button
        id: edit_amount_button
        variant: tonal
        label: "{strings.send_money.edit_amount}"
        visibility_condition: "{error.type | isOutsideControlParameters}"
        accessibility_label: "{strings.send_money.edit_amount_a11y}"
        on_click:
          action: back_step
          action_contract:
            effect: transform_state
            external_library_refs: [kotlinx-coroutines]
            description: >-
              Returns the form to the amount step after a U014 limit rejection or an insufficient
              funds result, preserving the already-chosen debtor and creditor so only the amount
              has to change.
        test_context:
          purpose: "Return to the amount step after U014 or InsufficientFunds"
          required_fields: []
          interaction_type: action
          data_driven: false

status_history:
  - from: null
    to: draft
    at: "2026-07-30"
    by: "/idea-evolve -> /idea-plan-add add-feature"
