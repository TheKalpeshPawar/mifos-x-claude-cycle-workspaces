responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - recent_recipients_header
      show_skeleton_list: true
      skeleton_count: 4
  content:
    layout:
      visible_components:
        - recent_recipients_header
        - recipient_new
        - recent_recipient_item
        - ways_to_send_header
        - way_local_transfer
        - way_local_transfer_subtitle
        - all_beneficiaries_header
        - beneficiary_item
  empty:
    layout:
      visible_components:
        - recent_recipients_header
        - recipient_new
        - ways_to_send_header
        - way_local_transfer
        - way_local_transfer_subtitle
      show_empty_state: true
      empty_state_icon: person_off
      empty_state_title: "No recipients yet"
      empty_state_message: "Add a beneficiary, then send money to them in a tap."
  error:
    layout:
      visible_components:
        - recent_recipients_header
      show_error_state: true
      error_icon: cloud_off
      error_title: "Could not load recipients"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: SendMoneyHubViewModel
  state_fields:
    - name: recentRecipients
      type: List<HubRecipient>
      default: "emptyList()"
    - name: allBeneficiaries
      type: List<HubRecipient>
      default: "emptyList()"
    - name: uiState
      type: ScreenState<SendMoneyHubContent>
      default: Loading
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Could not load recipients."
  events:
    - RecipientSelected
    - NewTransferClicked
    - RefreshTriggered
  actions:
    - select_recipient
    - new_recipient
  di:
    - AccountsRepository
    - PaymentsRepository
    - BanksRepository
    - TransactionsRepository

api:
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/{viewId}/counterparties"
    tag: Counterparties
    response:
      fields:
        - name: counterparties
          type: List<Counterparty>
        - name: counterparty_id
          type: String
        - name: name
          type: String
        - name: other_account_routing_scheme
          type: String
        - name: other_account_routing_address
          type: String
        - name: other_bank_routing_address
          type: String
    errors:
      - code: 401
        message: "OBP-20001: User not logged in"
      - code: 404
        message: "OBP-30018: Bank Account not found"
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}"
    tag: Banks
    description: "Bank directory entry (cached). bank_routings + the SWIFT_BIC attribute drive Bank.countryCode (BIC chars 5-6), which feeds PaymentRailClassifier (domestic = same bank country; OBP-routed payees resolve destination country here)."
    response:
      fields:
        - name: full_name
          type: String
        - name: bank_routings
          type: List<AccountRouting>
        - name: attributes
          type: List<BankAttribute>
  - endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/{viewId}/transaction-request-types/SEPA/transaction-requests"
    tag: TransactionRequests
    description: "Execute SEPA-classified payments (on send-money-confirm) by recipient IBAN. Sandbox: resolves only when the counterparty carries the IBAN in other_account_secondary_routing_address and its primary routing maps to a hosted account; OBP-30012/OBP-30074 trigger automatic COUNTERPARTY fallback. Cross-currency from non-EUR accounts accepted (verified 2026-06-06)."
    request:
      fields:
        - name: to.iban
          type: String
        - name: value.currency
          type: String
        - name: value.amount
          type: String
        - name: description
          type: String
        - name: charge_policy
          type: String
    errors:
      - code: 404
        message: "OBP-30012: Counterparty not found (IBAN not in secondary routing) — app falls back to COUNTERPARTY"
      - code: 404
        message: "OBP-30074: Bank Account not found for IBAN — app falls back to COUNTERPARTY"
  - endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/{viewId}/transaction-request-types/COUNTERPARTY/transaction-requests"
    tag: TransactionRequests
    description: "Execute Domestic/International payments (and SEPA fallback) on send-money-confirm. Pays a counterparty by id — works for any beneficiary regardless of routing scheme. viewId is owner."
    request:
      fields:
        - name: to.counterparty_id
          type: String
        - name: value.currency
          type: String
        - name: value.amount
          type: String
        - name: description
          type: String
        - name: charge_policy
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: status
          type: String
        - name: transaction_ids
          type: List<String>
        - name: charge
          type: Charge
    errors:
      - code: 400
        message: "OBP-10001: Incorrect json format"
      - code: 422
        message: "OBP-40008: Can't send a payment with a value of 0 or less"

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries
    - send-money-confirm
