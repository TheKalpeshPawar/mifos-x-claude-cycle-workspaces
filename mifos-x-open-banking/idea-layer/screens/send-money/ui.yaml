type: send_money
title: "Send Money"
flavor: consumer
components:
  - type: text_field
    id: amount_input
    label: "Amount"
    input_type: decimal
  - type: select
    id: account_select
    label: "From Account"
  - type: autocomplete
    id: beneficiary_autocomplete
    label: "To (Beneficiary)"
    on_select:
      target: send_money_confirm
  - type: text_field
    id: reference_input
    label: "Reference/Description"
  - type: button
    id: continue_button
    label: "Continue"
    variant: contained
    on_click:
      target: send_money_confirm
states:
  - draft
  - validating
  - error
navigation:
  - target: send_money_confirm
    label: "send_money_confirm"
