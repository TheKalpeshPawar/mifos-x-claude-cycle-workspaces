status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-06-04T00:00:00Z"
    by: "/kmp-implement send-money"
    contract_version: "1.2.0"
    note: "Reconciled ui.yaml to the hub design (recent recipients + ways to send + all beneficiaries). The amount-entry + review live on send-money-confirm flow. Send executes via OBP COUNTERPARTY transaction-request (by counterparty_id) — works for any beneficiary."
  - from: approved
    to: approved
    at: "2026-06-06T00:00:00Z"
    by: "/kmp-implement send-money (payment-rail classification)"
    contract_version: "1.2.0"
    note: "Payment type chips (SEPA/Domestic/International) are now derived per (account, beneficiary) pair by PaymentRailClassifier instead of free user choice: recipient country from IBAN prefix / BIC chars 5-6 / OBP bank lookup (Bank.countryCode via SWIFT_BIC attribute); DOMESTIC = same bank country, SEPA = recipient IBAN in SEPA zone (source may be non-EUR — conversion note shown, FX fee label), INTERNATIONAL = BIC/OBP-routed fallback. Recommended rail auto-selected; ineligible chips disabled with reason. Confirm screen routes SEPA-classified payments to the OBP SEPA transaction-request (by IBAN); sandbox deviation: SEPA-by-IBAN resolves only when the counterparty carries the IBAN in other_account_secondary_routing_address AND its primary routing maps to a hosted account (OBP-30012/30074 otherwise) — confirm VM falls back to COUNTERPARTY on those two codes. Cross-currency SEPA (GBP account → EUR value) verified working on apisandbox 2026-06-06."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.2.0"
    note: "Reconciled hub spec to shipped SendMoneyHubScreen + SendMoneyHubViewModel. Added FROM ACCOUNT selector (AccountPickerBottomSheet), recent-recipient initials avatars, beneficiary initials avatar + 'SEPA · Bank ·· last4' subtitle, top-bar person_search new-recipient action. Removed the never-built 'CHOOSE A WAY TO SEND' section (ways_to_send_header / way_local_transfer / way_local_transfer_subtitle) — shipped hub has no way-to-send cards. Fixed empty/error copy to shipped strings ('No recipients yet' / 'People you pay will appear here.' / 'Couldn't load recipients') and dropped the person_off empty-icon (shipped EmptyHub uses no icon; ErrorHub uses cloud_off). Added no_network + unauthenticated states (ScreenState<SendMoneyHubContent>). state_model rewritten: SendMoneyHubContent (accounts/selectedAccountId/recentRecipients/allBeneficiaries), onAccountSelected event, DI = UserPreferencesRepository + AccountsRepository + PaymentsRepository.listTransactionRequests + BanksRepository (TransactionsRepository removed — recency comes from PaymentsRepository.listTransactionRequests). Moved SEPA/COUNTERPARTY POST endpoints out of the hub api block (they belong to send-money-amount + send-money-confirm); hub now only READS counterparties + banks + accounts + transaction-requests."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.2.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

