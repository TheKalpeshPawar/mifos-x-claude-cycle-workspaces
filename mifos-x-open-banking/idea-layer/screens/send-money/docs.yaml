archetype: form
flow_ref: send-money-payment
description: >-
  Consumer-initiated domestic payment (PISP) against the HSBC UK Personal sandbox. The PSU pays a
  person — this is NOT a merchant checkout. Fills the Pay bottom-nav tab, which today renders
  PlaceholderScreen("Pay") via the SendMoneyRoute placeholder. Three-step form: choose the debtor
  account from the PSU's own authorised AIS accounts, choose a creditor from the already-shipped
  beneficiaries list or enter a sort code + account number manually, then enter amount and an
  optional reference. A review step stages a domestic-payment-consent and hands off to the
  payment-consent feature for the app-to-app authorise leg; on return the payment is submitted and
  the result handed to payment-status. Every PISP write carries a detached JWS signature and an
  idempotency key.
has_ui: true
has_server: false
# has_form_input: four text_fields (manual sort code + account number, amount, reference)
# with validation and a submit path. has_system_integration: app-to-app authorise leg.
# NOT has_payments — that is in-app-purchase / store-billing compliance (SKUs, receipts,
# restore-purchases, App Store subscription rules), not bank payment initiation. Declaring
# it would raise eight inapplicable errors and make /kmp-client-gen emit StoreKit boilerplate.
capabilities: [has_ui, has_api, has_flow, has_form_input, has_system_integration]
# V1. V2/V3 N/A — zero device permissions app-wide (see login/docs.yaml).
system_capabilities:
  - kind: deep_link
    detail: "Hands off to payment-consent for the app-to-app authorise leg, then resumes to submit."
# RULE-CAP-HAS-FORM-INPUT-001 V4 (submit has a loading state + disable-while-submitting)
# is satisfied by STATE TRANSITION rather than a `disabled:` flag. confirm_button binds to
# `content` only; confirming moves the screen to `submitting`, which unmounts the button and
# renders submitting_indicator. The control cannot be tapped twice because it no longer
# exists — a stronger guarantee than a disabled attribute, and the mechanism TC-SEND-010's
# idempotency-key assertion depends on. Recorded because a reader looking for `disabled:`
# will not find one and could mistake that for the check failing.
form_submit_guard: state-transition-unmount

