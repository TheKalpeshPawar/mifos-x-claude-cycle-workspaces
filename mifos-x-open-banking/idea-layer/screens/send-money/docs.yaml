  # declares requirement_refs [FR-012, FR-015, FR-016, FR-017]; only FR-012 was traced here,
  # so three of the four read as uncovered project-wide. All three ARE implemented in this
  # feature's api.yaml — the gap was traceability, not coverage:
  #   FR-015 consumer payment context -> api.yaml Risk.PaymentContextCode + _forbidden merchant fields
  #   FR-016 detached JWS on every write -> api.yaml write_header_contract.x-jws-signature
