# ─────────────────────────────────────────────────────────────────────────
# CONSUMER-CONTEXT CONSTRAINT — the design decision this feature turns on
# ─────────────────────────────────────────────────────────────────────────
# Verified against specs/hsbc-sandbox/openapi/payment-initiation-4.0-personal.yaml:
#
#   OBInternalPaymentContext1Code (:2281-2299) enumerates six payment contexts.
#   Two are PSU-owned and are the ONLY ones valid for this app:
#     TransferToThirdParty  - "between two accounts belonging to two different persons"
#     TransferToSelf        - "between two accounts belonging to the same person"
#   The other four (EcommerceMerchantInitiatedPayment, BillingGoodsAndServicesInAdvance,
#   BillingGoodsAndServicesInArrears, FaceToFacePointOfSale) are MERCHANT contexts and
#   MUST NOT be sent by this app.
#
#   OBRisk1 (:2244-2280) declares NO required properties, so the merchant fields
#   MerchantCategoryCode, MerchantCustomerIdentification and DeliveryAddress are all
#   optional and MUST be omitted. HSBC's own standing-order sandbox body sends "Risk": {}.
#
#   OBWriteDomestic2DataInitiation (:2387-2391) requires only InstructionIdentification,
#   EndToEndIdentification, InstructedAmount and CreditorAccount. DebtorAccount is
#   OPTIONAL - but this app always supplies it, from the PSU's own authorised accounts,
#   because the PSU has already selected the account in step 1.
#
# The HSBC Postman collection's example bodies use the MERCHANT shape. They are a
# reference for wire format only; copying their Risk block would model the wrong app.
consumer_context_constraint:
  allowed_payment_context_codes: [TransferToThirdParty, TransferToSelf]
  forbidden_payment_context_codes:
    - EcommerceMerchantInitiatedPayment
    - BillingGoodsAndServicesInAdvance
    - BillingGoodsAndServicesInArrears
    - FaceToFacePointOfSale
  forbidden_risk_fields: [MerchantCategoryCode, MerchantCustomerIdentification, DeliveryAddress]
  debtor_account_source: "PSU's own AIS /accounts list (feature: accounts)"
  spec_ref: "specs/hsbc-sandbox/openapi/payment-initiation-4.0-personal.yaml#OBInternalPaymentContext1Code"

# ─────────────────────────────────────────────────────────────────────────
# REGULATORY NOTE
# ─────────────────────────────────────────────────────────────────────────
regulatory:
  note: >-
    PISP is a distinct FCA permission from AISP. This app currently ships as an AISP
    reference client; initiating payments for real PSUs in production requires
    payment-initiation authorisation, which AISP permission alone does not grant.
    Sandbox operation is unaffected. Captured as an ADR rather than a blocker.
  affects_production: true
  affects_sandbox: false
  adr_required: true

contracts: []

libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets: [android, ios, desktop, web]
  - capability: jws-detached-signature
    library: "core/network:BuildClientAssertion.signPs256"
    version: in-repo
    targets: [android, ios, desktop, web]
    notes: >-
      signPs256 already exists and is used for the FAPI private_key_jwt client assertion.
      The detached-JWS variant reuses it with b64:false plus the crit header claim; this is
      an extension of an existing primitive, not a new signer.

vm_actions:
  - name: LoadPaymentSources
    signature: 'suspend fun loadPaymentSources()'
    state_mutations:
      - uiState = Loading
      - uiState = Content(step = Recipient, debtorAccounts = accounts, beneficiaries = beneficiaries)
    side_effects:
      - "GET /accounts via the shipped AccountsRepository (debtor candidates)"
      - "GET /accounts/{AccountId}/beneficiaries via the shipped BeneficiariesRepository (creditor candidates)"
    error_handling:
      on_401: uiState = Error(type=TokenExpired, message=strings.error.send_money.token_expired)
      on_403: uiState = Error(type=ConsentRevoked, message=strings.error.send_money.consent_revoked)
      on_network: uiState = Error(type=NetworkError, message=strings.error.send_money.network_error)

  - name: SelectDebtorAccount
    signature: 'fun selectDebtorAccount(accountId: String)'
    state_mutations:
      - "content.debtorAccountId = accountId; content.step = Recipient"
    side_effects: []
    error_handling: {}
    notes: "Pure in-memory selection from the PSU's own authorised accounts."

  - name: SelectCreditor
    signature: 'fun selectCreditor(creditor: CreditorSelection)'
    state_mutations:
      - "content.creditor = creditor; content.step = Amount"
    side_effects: []
    error_handling: {}
    notes: >-
      CreditorSelection is either a saved beneficiary (BeneficiaryId) or a manual entry
      (sort code + account number + name). Manual entry is validated locally before advance.

  - name: EnterAmount
    signature: 'fun enterAmount(minorUnits: String, reference: String?)'
    state_mutations:
      - "content.amountMinorUnits = minorUnits; content.reference = reference"
      - "content.validationError = validateAmount(minorUnits, selectedAccountBalance)"
    side_effects: []
    error_handling: {}
    notes: >-
      Amount is held as minor units (pence) per core/common FormatMoney; formatting happens
      in the ViewModel so composables receive finished label strings.

  - name: ReviewPayment
    signature: 'fun reviewPayment()'
    state_mutations:
      - "content.step = Review"
    side_effects: []
    error_handling: {}

  - name: ConfirmAndStageConsent
    signature: 'suspend fun confirmAndStageConsent()'
    state_mutations:
      - uiState = Submitting(stage = StagingConsent)
      - uiState = Submitting(stage = AwaitingAuthorisation, consentId = response.Data.ConsentId)
    side_effects:
      - "POST /domestic-payment-consents with a client-credentials payments-scope token"
      - "Attaches x-jws-signature (detached PS256, b64:false + crit) over the request body"
      - "Attaches x-idempotency-key derived from the staged payment, stable across retries"
      - "Hands off to the payment-consent feature for the app-to-app authorise leg"
    error_handling:
      on_400_U019: uiState = Error(type=SignatureMissing, message=strings.error.send_money.signature_missing)
      on_400_U014: uiState = Error(type=OutsideControlParameters, message=strings.error.send_money.outside_limits)
      on_401: uiState = Error(type=TokenExpired, message=strings.error.send_money.token_expired)
      on_network: uiState = Error(type=NetworkError, message=strings.error.send_money.network_error)

  - name: SubmitPayment
    signature: 'suspend fun submitPayment(consentId: String)'
    state_mutations:
      - uiState = Submitting(stage = SubmittingPayment)
      - uiState = Success(paymentId = response.Data.DomesticPaymentId, status = response.Data.Status)
    side_effects:
      - "POST /domestic-payments with the PSU access token obtained from the authorise leg"
      - "Attaches x-jws-signature and the SAME x-idempotency-key used for the consent"
    error_handling:
      on_400_U009: uiState = Error(type=ConsentNotAuthorised, message=strings.error.send_money.consent_not_authorised)
      on_400_U019: uiState = Error(type=SignatureMissing, message=strings.error.send_money.signature_missing)
      on_403: uiState = Error(type=ConsentRevoked, message=strings.error.send_money.consent_revoked)
      on_network: uiState = Error(type=NetworkError, message=strings.error.send_money.network_error)

  - name: RetrySubmit
    signature: 'fun retrySubmit()'
    state_mutations:
      - re-invokes SubmitPayment with the same consentId and idempotency key
    side_effects: []
    error_handling: {}
    visibility_condition: "error.type in {NetworkError, TokenExpired}"
    notes: >-
      Retry is idempotency-key-safe: the same key plus the same body returns the original
      result rather than creating a second payment.

  - name: CancelPayment
    signature: fun cancelPayment()
    state_mutations:
      - "uiState = Content(step = Recipient) with the staged consent discarded"
    side_effects: []
    error_handling: {}

error_cases:
  - id: SignatureMissing
    trigger: "HTTP 400 with Errors[].ErrorCode U019 — missing/invalid x-jws-signature"
    user_message: '{strings.error.send_money.signature_missing}'
    recovery: >-
      Not user-recoverable — an implementation fault, not a PSU fault. Surfaced with a
      support-reference (the OB envelope Id) rather than a Retry CTA.
  - id: ConsentNotAuthorised
    trigger: "HTTP 400 with ErrorCode U009 — consent is not in Authorised status"
    user_message: '{strings.error.send_money.consent_not_authorised}'
    recovery: "Re-authorise CTA restarts the app-to-app authorise leg via payment-consent"
  - id: OutsideControlParameters
    trigger: "HTTP 400 with ErrorCode U014 — payment outside control parameters (limits)"
    user_message: '{strings.error.send_money.outside_limits}'
    recovery: "Return to the amount step so the PSU can lower the amount"
  - id: ConsentRevoked
    trigger: "HTTP 403 — payment consent revoked or expired"
    user_message: '{strings.error.send_money.consent_revoked}'
    recovery: "View Consents CTA navigates to consent-list"
  - id: TokenExpired
    trigger: HTTP 401 from HSBC PISP
    user_message: '{strings.error.send_money.token_expired}'
    recovery: "Retry CTA re-runs the failed call after refreshing the token"
  - id: NetworkError
    trigger: IOException / timeout
    user_message: '{strings.error.send_money.network_error}'
    recovery: "Retry CTA — safe because the idempotency key is reused"
  - id: InsufficientFunds
    trigger: "funds-confirmation returns FundsAvailable=false"
    user_message: '{strings.error.send_money.insufficient_funds}'
    recovery: "Return to the amount step; the payment is not staged"

