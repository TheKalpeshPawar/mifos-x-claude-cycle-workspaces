<!doctype html>
<!-- render-hash: sm-draft-01 -->
<html lang="en" data-screen="send-money" data-state="draft" data-feature="send-money" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send Money</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--error:#BA1A1A;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:24px;color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.from-card{margin:8px 20px 20px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}.from-card .icon{width:40px;height:40px;border-radius:12px;background:var(--primary-container);display:flex;align-items:center;justify-content:center}.from-card .icon .material-icons{font-size:20px;color:var(--on-primary-container)}.from-card .info{flex:1;min-width:0}.from-label{font-size:11px;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.5px;font-weight:600}.from-name{font-size:14px;font-weight:600;margin-top:2px}.from-balance{font-size:13px;color:var(--on-surface-variant);margin-top:2px}.from-card .chev{color:var(--on-surface-variant)}
.amount-section{padding:0 20px 20px;text-align:center}.amount-label{font-size:11px;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:12px}
.amount-display{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-bottom:8px}.currency-prefix{font-size:24px;font-weight:600;color:var(--on-surface-variant)}.amount-value{font-size:48px;font-weight:700;color:var(--primary);letter-spacing:-1px;font-family:'Outfit',sans-serif;border:none;background:transparent;width:auto;max-width:280px;text-align:center;outline:none}.amount-value:focus{outline:none}
.amount-meta{font-size:13px;color:var(--on-surface-variant)}
.quick-amounts{display:flex;gap:8px;justify-content:center;margin-top:14px}.quick-chip{padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--outline-variant);font-size:13px;font-weight:600;color:var(--on-surface-variant);cursor:pointer}
.field-label{font-size:11px;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;padding:0 20px 6px}
.beneficiary-card{margin:0 20px 14px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}.benef-avatar{width:40px;height:40px;border-radius:20px;background:var(--secondary-container);color:var(--on-secondary-container);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}.benef-info{flex:1;min-width:0}.benef-name{font-size:14px;font-weight:600}.benef-acc{font-size:12px;color:var(--on-surface-variant);margin-top:2px}.benef-card .chev{color:var(--on-surface-variant)}
.input-field{width:calc(100% - 40px);margin:0 20px 16px;padding:14px 16px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:14px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--on-surface)}.input-field::placeholder{color:var(--outline)}.input-field:focus{outline:2px solid var(--primary);outline-offset:-2px;border-color:transparent}
.summary{margin:0 20px 16px;background:var(--surface-container);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px}.summary .row{display:flex;justify-content:space-between}.summary .label{color:var(--on-surface-variant)}.summary .value{font-weight:600}.summary .total{padding-top:8px;border-top:1px solid var(--outline-variant);font-size:14px}
.continue-btn{margin:0 20px;padding:16px;background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer}.continue-btn:disabled{opacity:0.5}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--error:#BA1A1A;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;--error:#FFB4AB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;--error:#FFB4AB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Send money</h1><span class="material-icons" data-action="open_help" tabindex="0" aria-label="Help">help_outline</span></div>

<div class="from-card" data-action="open_account_picker" tabindex="0" aria-label="Choose source account"><div class="icon"><span class="material-icons">account_balance_wallet</span></div><div class="info"><div class="from-label">From</div><div class="from-name">Primary Checking · ••3421</div><div class="from-balance">£4,250.00 available</div></div><span class="material-icons chev">expand_more</span></div>

<div class="amount-section">
<div class="amount-label">You're sending</div>
<div class="amount-display"><span class="currency-prefix">£</span><input class="amount-value" type="text" value="500" inputmode="decimal" aria-label="Amount" tabindex="0"></div>
<div class="amount-meta">≈ €585.42 EUR</div>
<div class="quick-amounts"><button class="quick-chip" data-action="set_amount" data-amount="100" tabindex="0">£100</button><button class="quick-chip" data-action="set_amount" data-amount="250" tabindex="0">£250</button><button class="quick-chip" data-action="set_amount" data-amount="500" tabindex="0">£500</button><button class="quick-chip" data-action="set_amount" data-amount="1000" tabindex="0">£1,000</button></div>
</div>

<div class="field-label">To</div>
<div class="beneficiary-card" data-nav-to="beneficiaries" tabindex="0" aria-label="Choose beneficiary"><div class="benef-avatar">LW</div><div class="benef-info"><div class="benef-name">Liam Walker</div><div class="benef-acc">SEPA · ••8842 · NatWest UK</div></div><span class="material-icons chev">expand_more</span></div>

<div class="field-label">Reference (optional)</div>
<input type="text" class="input-field" placeholder="What's it for?" aria-label="Reference" tabindex="0">

<div class="summary"><div class="row"><span class="label">Amount</span><span class="value">£500.00</span></div><div class="row"><span class="label">Transfer fee</span><span class="value">£0.00</span></div><div class="row total"><span class="label">Total to debit</span><span class="value">£500.00</span></div></div>

<button class="continue-btn" data-nav-to="send-money-confirm" tabindex="0" aria-label="Continue to review">Continue to review</button>
</main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
