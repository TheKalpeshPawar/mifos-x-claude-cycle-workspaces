<!doctype html>
<html lang="en" data-screen="send-money" data-state="draft" data-feature="send-money" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send Money</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; }
    .form { padding: 16px 20px; flex: 1; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }
    .selector { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--on-surface); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; } .selector .material-icons { font-size: 20px; color: var(--on-surface-variant); }
    .amount-row { display: flex; gap: 8px; margin-bottom: 16px; } .amount-input { flex: 1; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: var(--on-surface); } .currency-chip { padding: 14px 16px; background: var(--primary-container); border-radius: 12px; color: var(--primary); font-weight: 600; }
    .search-field { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); margin-bottom: 16px; } .search-field::placeholder { color: var(--outline); }
    .input-field { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); margin-bottom: 16px; }
    .fee-banner { background: var(--primary-container); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--primary); display: flex; align-items: center; gap: 8px; } .fee-banner .material-icons { font-size: 18px; }
    .continue-btn { width: 100%; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Send Money</h1></div>
    <div class="form">
      <div class="field-label">From Account</div>
      <div class="selector" tabindex="0">Primary Checking · £4,250.00<span class="material-icons">expand_more</span></div>
      <div class="field-label">Amount</div>
      <div class="amount-row"><input type="text" class="amount-input" value="500.00" aria-label="Amount" tabindex="0"><span class="currency-chip">GBP</span></div>
      <div class="field-label">To Beneficiary</div>
      <input type="text" class="search-field" placeholder="Search or enter IBAN" aria-label="Search beneficiary" tabindex="0">
      <div class="field-label">Reference</div>
      <input type="text" class="input-field" placeholder="Payment reference (optional)" aria-label="Reference" tabindex="0">
      <div class="fee-banner"><span class="material-icons">info</span>Estimated fee: £0.00 (SEPA transfer)</div>
      <button class="continue-btn" data-nav-to="send-money-confirm" tabindex="0" aria-label="Continue">Continue</button>
    </div>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
