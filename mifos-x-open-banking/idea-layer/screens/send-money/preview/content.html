<!doctype html>
<!-- render-hash: send-money-content-obie -->
<html lang="en" data-screen="send-money" data-state="content" data-feature="send-money" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send money — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;
      --icon-md: 24px; --icon-lg: 32px; --icon-2xl: 48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --pending: #E8A317; --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --pending: #E8A317; --nav-active-indicator: #354E16;
    }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: var(--font-display); background: var(--background); color: var(--on-background);
      display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .skip-link { position: absolute; left: -999px; top: 0; background: var(--primary); color: var(--on-primary); padding: var(--sp-sm) var(--sp-md); z-index: 10; border-radius: 0 0 var(--r-sm) var(--r-sm); }
    .skip-link:focus { left: var(--sp-sm); }
    .topbar {
      display: flex; align-items: center; gap: var(--sp-sm); height: 56px; padding: 0 var(--sp-sm);
      background: var(--background); position: sticky; top: 0; z-index: 5;
    }
    .topbar .icon-btn {
      width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--r-pill);
      background: transparent; border: none; color: var(--on-surface); cursor: pointer;
    }
    .topbar .icon-btn:active { background: var(--surface-variant); }
    .topbar .title { flex: 1; font-size: 22px; line-height: 28px; font-weight: 500; }
    .material-symbols-outlined { font-size: var(--icon-md); line-height: 1; }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: var(--sp-sm) var(--sp-md) var(--sp-xl); gap: var(--sp-lg); }
    .section-label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-surface-variant); text-transform: uppercase; margin-bottom: var(--sp-sm); }
    .account-row {
      display: flex; align-items: center; gap: var(--sp-md); width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--r-md);
      padding: 14px var(--sp-md); cursor: pointer; color: var(--on-surface); font-family: inherit;
    }
    .account-row:active { background: var(--surface-container); }
    .account-row .lead { width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; flex-shrink: 0; }
    .account-row .body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .account-row .name { font-size: 16px; font-weight: 500; }
    .account-row .meta { font-size: 13px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
    .account-row .bal { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .recipients-rail { display: flex; gap: var(--sp-md); overflow-x: auto; padding-bottom: var(--sp-xs); }
    .recipient { display: flex; flex-direction: column; align-items: center; gap: var(--sp-sm); width: 68px; flex-shrink: 0; background: transparent; border: none; cursor: pointer; font-family: inherit; }
    .avatar { width: 60px; height: 60px; border-radius: var(--r-pill); display: grid; place-items: center; font-size: 18px; font-weight: 600; }
    .avatar.new { background: var(--primary-container); color: var(--on-primary-container); }
    .avatar.recent { background: var(--secondary); color: var(--on-secondary); }
    .recipient .rname { font-size: 12px; color: var(--on-surface); text-align: center; line-height: 14px; }
    .beneficiary {
      display: flex; align-items: center; gap: var(--sp-md); width: 100%; text-align: left;
      background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--r-md);
      padding: 14px var(--sp-md); cursor: pointer; color: var(--on-surface); font-family: inherit; margin-bottom: var(--sp-sm);
    }
    .beneficiary:active { background: var(--surface-container-high); }
    .beneficiary .bavatar { width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--secondary); color: var(--on-secondary); display: grid; place-items: center; font-size: 15px; font-weight: 600; flex-shrink: 0; }
    .beneficiary .bbody { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .beneficiary .bname { font-size: 16px; font-weight: 500; }
    .beneficiary .bsub { font-size: 12px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
    .beneficiary .material-symbols-outlined { color: var(--on-surface-variant); }
    .group-label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-surface-variant); text-transform: uppercase; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div data-shell="root" data-screen-id="send-money" data-state="content">
    <header data-shell="top-app-bar" data-variant="small" class="topbar">
      <button class="icon-btn" data-component-type="button" data-component-id="topbar_back" data-action="navigate_back" aria-label="Go back">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <span class="title" data-component-type="text" data-component-id="topbar_title" role="heading" aria-level="1">Send money</span>
      <button class="icon-btn" data-component-type="button" data-component-id="topbar_new_recipient" data-nav-to="send-money-amount" data-action-id="new_recipient" aria-label="Add a new recipient">
        <span class="material-symbols-outlined" aria-hidden="true">person_search</span>
      </button>
    </header>

    <main id="main-content" data-shell="content" data-state="content">
      <section data-component-type="LayoutBox" data-component-id="from_account_section" aria-labelledby="from-account-label">
        <div class="section-label" id="from-account-label" data-component-type="text" data-component-id="from_account_header">From account</div>
        <button class="account-row" data-component-type="list_item" data-component-id="account_selector" data-action="select_account" aria-label="From account: Everyday Current, available balance £2,483.57. Tap to choose another account.">
          <span class="lead" aria-hidden="true"><span class="material-symbols-outlined">account_balance</span></span>
          <span class="body">
            <span class="name">Everyday Current</span>
            <span class="meta">30-00-00 · ****5678</span>
          </span>
          <span class="bal">£2,483.57</span>
          <span class="material-symbols-outlined" aria-hidden="true">arrow_drop_down</span>
        </button>
      </section>

      <section data-component-type="LayoutBox" data-component-id="recent_recipients_section" aria-labelledby="recent-label">
        <div class="section-label" id="recent-label" data-component-type="text" data-component-id="recent_recipients_header">Recent recipients</div>
        <div class="recipients-rail" data-component-type="stack" data-component-id="recent_recipients_rail" role="list">
          <button class="recipient" data-component-type="box" data-component-id="recipient_new" data-nav-to="send-money-amount" data-action-id="new_recipient" role="listitem" aria-label="Start a new transfer">
            <span class="avatar new" aria-hidden="true"><span class="material-symbols-outlined">add</span></span>
            <span class="rname">New</span>
          </button>
          <button class="recipient" data-component-type="box" data-component-id="recent_recipient_jw" data-nav-to="send-money-amount" data-action-id="select_recipient" role="listitem" aria-label="Send money to James Whitfield">
            <span class="avatar recent" aria-hidden="true">JW</span>
            <span class="rname">James W.</span>
          </button>
          <button class="recipient" data-component-type="box" data-component-id="recent_recipient_bg" data-nav-to="send-money-amount" data-action-id="select_recipient" role="listitem" aria-label="Send money to British Gas">
            <span class="avatar recent" aria-hidden="true">BG</span>
            <span class="rname">British Gas</span>
          </button>
          <button class="recipient" data-component-type="box" data-component-id="recent_recipient_tw" data-nav-to="send-money-amount" data-action-id="select_recipient" role="listitem" aria-label="Send money to Thames Water">
            <span class="avatar recent" aria-hidden="true">TW</span>
            <span class="rname">Thames W.</span>
          </button>
        </div>
      </section>

      <section data-component-type="LayoutBox" data-component-id="all_beneficiaries_section" aria-labelledby="all-label">
        <div class="group-label" id="all-label" data-component-type="text" data-component-id="all_beneficiaries_header" style="margin-bottom:var(--sp-sm)">All beneficiaries</div>

        <button class="beneficiary" data-component-type="list_item" data-component-id="beneficiary_james_whitfield" data-nav-to="send-money-amount" data-action-id="select_recipient" aria-label="Send money to James Whitfield, sort code account ending 4190">
          <span class="bavatar" aria-hidden="true">JW</span>
          <span class="bbody">
            <span class="bname">James Whitfield</span>
            <span class="bsub" data-component-type="text" data-component-id="beneficiary_subtitle">Faster Payments · 20-41-55 ·· 4190</span>
          </span>
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>

        <button class="beneficiary" data-component-type="list_item" data-component-id="beneficiary_british_gas" data-nav-to="send-money-amount" data-action-id="select_recipient" aria-label="Send money to British Gas, sort code account ending 9988">
          <span class="bavatar" aria-hidden="true">BG</span>
          <span class="bbody">
            <span class="bname">British Gas</span>
            <span class="bsub">Faster Payments · 60-00-04 ·· 9988</span>
          </span>
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>

        <button class="beneficiary" data-component-type="list_item" data-component-id="beneficiary_thames_water" data-nav-to="send-money-amount" data-action-id="select_recipient" aria-label="Send money to Thames Water, sort code account ending 3210">
          <span class="bavatar" aria-hidden="true">TW</span>
          <span class="bbody">
            <span class="bname">Thames Water</span>
            <span class="bsub">Faster Payments · 40-02-07 ·· 3210</span>
          </span>
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>

        <button class="beneficiary" data-component-type="list_item" data-component-id="beneficiary_vodafone_uk" data-nav-to="send-money-amount" data-action-id="select_recipient" aria-label="Send money to Vodafone UK, sort code account ending 3471">
          <span class="bavatar" aria-hidden="true">VU</span>
          <span class="bbody">
            <span class="bname">Vodafone UK</span>
            <span class="bsub">Faster Payments · 08-32-01 ·· 3471</span>
          </span>
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>
      </section>
    </main>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
