<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Send Money — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
}
.top-bar{
  display:flex;align-items:center;padding:0 4px;height:56px;
  background:var(--surface);border-bottom:1px solid var(--surface-variant);
}
.top-bar-btn{
  width:48px;height:48px;border:none;background:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:var(--text-primary);flex-shrink:0;
}
.top-bar-btn:hover{background:var(--surface-variant);}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);padding-left:4px;}
.content-scroll{overflow-y:auto;padding:20px 20px 32px;}
.screen-title{font-size:26px;font-weight:700;color:var(--primary);margin-bottom:20px;}
/* Form fields */
.field-label{font-size:12px;font-weight:500;color:var(--outline);margin-bottom:6px;margin-top:16px;}
.field-label:first-of-type{margin-top:0;}
.outlined-field{
  width:100%;border:1.5px solid var(--surface-variant);border-radius:12px;
  padding:13px 14px;font-family:var(--font);font-size:14px;
  background:var(--surface);color:var(--text-primary);outline:none;
  display:flex;align-items:center;gap:8px;cursor:text;
}
.outlined-field input{
  flex:1;border:none;background:none;font-family:var(--font);
  font-size:14px;color:var(--text-primary);outline:none;
}
.outlined-field input::placeholder{color:var(--outline-variant);}
.outlined-field:focus-within{border-color:var(--primary);}
.field-icon{color:var(--outline);flex-shrink:0;display:flex;}
.field-trailing{color:var(--outline);flex-shrink:0;}
/* Amount row */
.amount-row{display:flex;gap:8px;align-items:flex-start;}
.amount-field-wrap{flex:1;}
.currency-chip{
  display:inline-flex;align-items:center;gap:4px;
  border:1.5px solid var(--surface-variant);border-radius:8px;
  padding:13px 12px;background:var(--surface);
  font-family:var(--font);font-size:14px;font-weight:500;
  color:var(--text-primary);cursor:pointer;white-space:nowrap;
  align-self:flex-end;height:50px;
}
.currency-chip:hover{background:var(--surface-variant);}
/* Recent beneficiaries */
.recent-row{
  display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;
}
.recent-chip{
  display:flex;flex-direction:column;
  border-radius:12px;background:var(--primary-container);
  padding:10px 12px;cursor:pointer;border:none;
  font-family:var(--font);flex-shrink:0;
  border:1px solid var(--primary-container);min-width:110px;
}
.recent-chip:hover{opacity:.85;}
.recent-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px;}
.recent-bank{font-size:11px;color:var(--outline);}
/* Payment type chips */
.payment-type-row{display:flex;gap:8px;padding:4px 0;}
.pay-type-chip{
  border-radius:20px;padding:8px 16px;
  font-family:var(--font);font-size:13px;font-weight:500;
  cursor:pointer;border:1.5px solid var(--surface-variant);
  background:var(--surface);color:var(--text-secondary);
}
.pay-type-chip.selected{
  background:var(--primary);color:var(--on-primary);border-color:var(--primary);
}
.pay-type-chip:hover:not(.selected){background:var(--surface-variant);}
/* Fee banner */
.fee-banner{
  display:flex;align-items:center;gap:8px;
  background:var(--primary-container);border-radius:8px;
  padding:12px 16px;border:1px solid var(--primary);
  margin-top:16px;
}
.fee-banner-text{font-size:14px;color:var(--text-primary);}
/* Continue button */
.continue-btn{
  display:block;width:100%;
  background:var(--primary);color:var(--on-primary);border:none;
  border-radius:12px;padding:16px;font-family:var(--font);
  font-size:15px;font-weight:600;cursor:pointer;text-align:center;
  margin-top:24px;
}
.continue-btn:hover{opacity:.88;}
.helper-text{font-size:12px;color:var(--outline);margin-top:4px;}
</style>
</head>
<body>
<main data-screen="send-money" data-state="content" role="main">

  <div class="top-bar">
    <button class="top-bar-btn" aria-label="Back" data-action="navigate_back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="top-bar-title">Send Money</span>
  </div>

  <div class="content-scroll">

    <h1 class="screen-title" data-component-type="text" data-component-id="send_money_title" role="heading" aria-level="1">Send Money</h1>

    <!-- From Account -->
    <div class="field-label">From Account</div>
    <div class="outlined-field"
         data-component-type="input" data-component-id="from_account_selector"
         data-action="select_account"
         role="button" tabindex="0"
         aria-label="Select source account. Currently: Primary Checking with £4,250.00 available">
      <span class="field-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline)" aria-hidden="true"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zm-9 9h22v-3H1v3zm15-9v7h3v-7h-3zM12 1L1 6v2h22V6L12 1z"/></svg>
      </span>
      <span style="flex:1;font-size:14px;color:var(--text-primary)">Primary Checking — £4,250.00 available</span>
      <span class="field-trailing">
        <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline)" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </span>
    </div>

    <!-- Amount -->
    <div class="field-label">Amount</div>
    <div class="amount-row">
      <div class="amount-field-wrap">
        <div class="outlined-field"
             data-component-type="input" data-component-id="amount_input"
             data-action="focus_amount"
             aria-label="Enter payment amount in pounds">
          <span style="font-size:14px;color:var(--outline);font-weight:500;">£</span>
          <input type="number" placeholder="0.00" aria-label="Amount in pounds" inputmode="decimal">
        </div>
      </div>
      <button class="currency-chip"
              data-component-type="input" data-component-id="currency_selector"
              data-action="select_currency"
              aria-label="Select currency. Currently: British Pound Sterling">
        GBP
        <svg width="16" height="16" viewBox="0 0 24 24" style="fill:var(--outline)" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
    </div>

    <!-- To / Beneficiary -->
    <div class="field-label">To</div>
    <div class="outlined-field"
         data-component-type="input" data-component-id="beneficiary_search"
         data-action="search_beneficiary"
         aria-label="Search for a beneficiary by name or enter an account number">
      <span class="field-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline)" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5a6.5 6.5 0 1 0-6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </span>
      <input type="search" placeholder="Search beneficiary or enter account..." aria-label="Beneficiary search">
    </div>

    <!-- Recent beneficiaries -->
    <div class="field-label" style="margin-top:10px;">Recent</div>
    <div class="recent-row"
         data-component-type="stack" data-component-id="recent_beneficiaries_row"
         role="list" aria-label="Recently used beneficiaries">
      <button class="recent-chip"
              data-component-type="box" data-component-id="recent_beneficiary_john" data-component-variant="beneficiary-chip"
              data-action="select_beneficiary"
              role="listitem"
              aria-label="Select John Smith at Barclays UK as beneficiary">
        <span class="recent-name">John Smith</span>
        <span class="recent-bank">Barclays UK</span>
      </button>
      <button class="recent-chip"
              data-component-type="box" data-component-id="recent_beneficiary_sarah" data-component-variant="beneficiary-chip"
              data-action="select_beneficiary"
              role="listitem"
              aria-label="Select Sarah Williams at HSBC UK as beneficiary">
        <span class="recent-name">Sarah Williams</span>
        <span class="recent-bank">HSBC UK</span>
      </button>
    </div>

    <!-- Reference -->
    <div class="field-label">Reference</div>
    <div class="outlined-field"
         data-component-type="input" data-component-id="reference_input"
         data-action="focus_reference"
         aria-label="Enter payment reference, maximum 35 characters">
      <input type="text" placeholder="Payment for invoice #1234" maxlength="35" aria-label="Payment reference">
    </div>
    <div class="helper-text">Max 35 characters</div>

    <!-- Payment Type -->
    <div class="field-label">Payment Type</div>
    <div class="payment-type-row"
         data-component-type="stack" data-component-id="payment_type_selector"
         role="radiogroup" aria-label="Select payment type">
      <button class="pay-type-chip selected"
              data-component-type="input" data-component-id="payment_type_sepa" data-component-variant="chip-selected"
              data-action="select_payment_type_sepa"
              role="radio" aria-checked="true">SEPA</button>
      <button class="pay-type-chip"
              data-component-type="input" data-component-id="payment_type_domestic"
              data-action="select_payment_type_domestic"
              role="radio" aria-checked="false">Domestic</button>
      <button class="pay-type-chip"
              data-component-type="input" data-component-id="payment_type_international"
              data-action="select_payment_type_international"
              role="radio" aria-checked="false">International</button>
    </div>

    <!-- Fee estimate -->
    <div class="fee-banner"
         data-component-type="box" data-component-id="fee_estimate_banner" data-component-variant="info-banner"
         data-action="view_fee_details"
         role="status"
         aria-label="Fee information: Estimated fee is Free for SEPA payments">
      <svg width="18" height="18" viewBox="0 0 24 24" style="fill:var(--primary);flex-shrink:0" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      <span class="fee-banner-text">Estimated fee: Free (SEPA)</span>
    </div>

    <!-- Continue button -->
    <button class="continue-btn"
            data-component-type="button" data-component-id="continue_button" data-component-variant="filled-primary"
            data-nav-to="send-money-confirm"
            aria-label="Continue to payment confirmation">Continue</button>

  </div>
</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
