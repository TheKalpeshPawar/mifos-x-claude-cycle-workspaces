<!doctype html>
<!-- render-hash: sm-loading-obie02 -->
<html lang="en" data-screen="send-money" data-state="loading" data-feature="send-money" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send money</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--icon-md:24px;--primary:#4C662B;--primary-container:#CDEDA3;--on-primary-container:#102000;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-symbols-outlined{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,var(--surface-variant) 25%,#EDEFE4 50%,var(--surface-variant) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.sk-acct{height:72px;margin:4px 20px 8px;border-radius:16px}
.sk-label{height:12px;width:140px;margin:18px 20px 10px;border-radius:6px}
.sk-recents{display:flex;gap:14px;padding:0 20px 16px}.sk-recent{width:60px;height:60px;border-radius:30px}
.sk-benef{height:68px;margin:0 20px 8px;border-radius:16px}
[data-theme="dark"]{--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-symbols-outlined" aria-label="Go back">arrow_back</span><h1>Send money</h1></div>
<div class="sk sk-acct" aria-hidden="true"></div>
<div class="sk sk-label" aria-hidden="true"></div>
<div class="sk-recents" aria-hidden="true"><span class="sk sk-recent"></span><span class="sk sk-recent"></span><span class="sk sk-recent"></span><span class="sk sk-recent"></span></div>
<div class="sk sk-label" aria-hidden="true"></div>
<div class="sk sk-benef" aria-hidden="true"></div>
<div class="sk sk-benef" aria-hidden="true"></div>
<div class="sk sk-benef" aria-hidden="true"></div>
<div class="sk sk-benef" aria-hidden="true"></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
