<!doctype html>
<!-- render-hash: sm-loading-01 -->
<html lang="en" data-screen="send-money" data-state="loading" data-feature="send-money" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send Money — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.from-skel{margin:8px 20px 20px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}.from-skel .icon{width:40px;height:40px;border-radius:12px}.from-skel .body{flex:1;display:flex;flex-direction:column;gap:6px}.from-skel .l1{height:10px;width:30%}.from-skel .l2{height:14px;width:70%}.from-skel .l3{height:12px;width:50%}
.amount-skel{padding:8px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}.amount-skel .l-tiny{height:10px;width:120px}.amount-skel .l-big{height:48px;width:60%}.amount-skel .l-small{height:12px;width:30%}
.label-skel{height:11px;width:80px;margin:14px 20px 8px}
.field-skel{height:50px;margin:0 20px 14px;border-radius:14px}
.summary-skel{margin:0 20px 16px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.summary-skel .row{display:flex;justify-content:space-between;gap:10px}.summary-skel .row .a{height:13px;width:80px}.summary-skel .row .b{height:13px;width:60px}
.btn-skel{height:52px;margin:0 20px;border-radius:999px}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons">arrow_back</span><h1>Send money</h1></div>
<div class="from-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div></div></div>
<div class="amount-skel"><div class="skel l-tiny"></div><div class="skel l-big"></div><div class="skel l-small"></div></div>
<div class="skel label-skel"></div><div class="skel field-skel"></div>
<div class="skel label-skel"></div><div class="skel field-skel"></div>
<div class="summary-skel"><div class="row"><div class="skel a"></div><div class="skel b"></div></div><div class="row"><div class="skel a"></div><div class="skel b"></div></div><div class="row"><div class="skel a"></div><div class="skel b"></div></div></div>
<div class="skel btn-skel"></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
