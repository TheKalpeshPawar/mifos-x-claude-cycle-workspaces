<!doctype html>
<html lang="en" data-screen="send-money" data-state="error">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Send Money — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --error:#BA1A1A;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
.screen-content{padding:20px;}
.screen-title{font-size:24px;font-weight:700;color:var(--primary);margin-bottom:20px;}
.input-wrapper{margin-bottom:16px;}
.input-label{font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;display:block;}
.input-field{width:100%;padding:14px 12px;border:1px solid var(--surface-variant);border-radius:8px;font-family:var(--font);font-size:14px;background:var(--surface);color:var(--text-primary);}
.input-field.error{border-color:var(--error);}
.input-error-text{font-size:11px;color:var(--error);margin-top:4px;}
.continue-btn{width:100%;padding:16px;background:var(--surface-variant);color:var(--outline);border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:not-allowed;margin-top:8px;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="home">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Send Money</span>
</header>

<div class="screen-content">
  <div class="screen-title">Send Money</div>

  <div class="input-wrapper">
    <span class="input-label">From Account</span>
    <div class="input-field" style="color:var(--outline);">Primary Checking — £4,250.00</div>
  </div>

  <div class="input-wrapper">
    <span class="input-label">Amount</span>
    <input class="input-field error" type="text" placeholder="0.00" aria-label="Amount to send">
    <div class="input-error-text">Please enter a valid amount greater than £0.01</div>
  </div>

  <div class="input-wrapper">
    <span class="input-label">Beneficiary</span>
    <input class="input-field error" type="text" placeholder="Search beneficiary" aria-label="Search beneficiary">
    <div class="input-error-text">Please select a valid beneficiary</div>
  </div>

  <div class="input-wrapper">
    <span class="input-label">Payment Reference</span>
    <input class="input-field" type="text" placeholder="Optional reference" aria-label="Payment reference">
  </div>

  <button class="continue-btn" disabled>Continue</button>
</div>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
