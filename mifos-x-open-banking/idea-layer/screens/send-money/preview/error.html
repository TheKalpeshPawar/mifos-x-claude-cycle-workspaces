<!doctype html>
<!-- render-hash: sm-error-01 -->
<html lang="en" data-screen="send-money" data-state="error" data-feature="send-money" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send Money — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:24px;color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.error-icon{width:96px;height:96px;border-radius:48px;background:var(--error-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.error-icon .material-icons{font-size:48px;color:var(--error)}
.error-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.error-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;margin-bottom:16px;max-width:320px}
.error-card{background:var(--error-container);color:var(--on-error-container);border-radius:14px;padding:12px 16px;margin-bottom:24px;font-size:13px;text-align:left;max-width:320px;display:flex;gap:10px;align-items:flex-start}.error-card .material-icons{font-size:18px;flex-shrink:0;margin-top:1px}.error-card strong{display:block;font-weight:600;margin-bottom:2px}
.actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}.btn{padding:14px 22px;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn .material-icons{font-size:18px}.btn-primary{background:var(--primary);color:var(--on-primary);border:none}.btn-secondary{background:transparent;color:var(--primary);border:1px solid var(--outline)}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Send money</h1></div>
<div class="center"><div class="error-icon"><span class="material-icons">error_outline</span></div><h2 class="error-title">Transfer couldn't be sent</h2><p class="error-msg">Your account is unaffected. Please try again or use a different payment method.</p><div class="error-card"><span class="material-icons">info</span><div><strong>Daily limit reached</strong>You've sent £4,800 of your £5,000 daily limit. Resets at midnight.</div></div><div class="actions"><button class="btn btn-primary" data-action="adjust_amount" tabindex="0" aria-label="Adjust amount"><span class="material-icons">edit</span>Adjust amount</button><button class="btn btn-secondary" data-nav-to="home" tabindex="0" aria-label="Back to home">Back to home</button></div></div>
</main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
