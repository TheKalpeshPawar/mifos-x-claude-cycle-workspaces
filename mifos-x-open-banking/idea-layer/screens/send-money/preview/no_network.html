<!doctype html>
<!-- render-hash: sm-nonet-obie02 -->
<html lang="en" data-screen="send-money" data-state="no_network" data-feature="send-money" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send money</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--icon-md:24px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--error:#BA1A1A;--error-container:#FFDAD6}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-symbols-outlined{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 40px;gap:6px}.state-glyph{width:96px;height:96px;border-radius:48px;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;margin-bottom:10px}.state-glyph .material-symbols-outlined{font-size:var(--icon-2xl);color:var(--on-surface-variant)}.state-title{font-size:20px;font-weight:600}.state-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:300px}
.btn{height:48px;border-radius:999px;background:var(--primary);color:var(--on-primary);border:none;font-family:inherit;font-size:15px;font-weight:600;padding:0 28px;margin-top:18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.btn .material-symbols-outlined{font-size:20px}
[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--error:#FFB4AB;--error-container:#93000A}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--error:#FFB4AB;--error-container:#93000A}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-symbols-outlined" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Send money</h1></div>
<div class="state">
<div class="state-glyph"><span class="material-symbols-outlined">cloud_off</span></div>
<div class="state-title">You're offline</div>
<div class="state-msg">We can't reach your bank right now. Check your connection and try again.</div>
<button class="btn" data-action="retry" tabindex="0"><span class="material-symbols-outlined">refresh</span>Try again</button>
</div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
