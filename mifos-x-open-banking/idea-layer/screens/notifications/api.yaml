sibling: api
schema_version: "4.0"
feature_id: notifications
api:
  - id: obp_signal_channels
    endpoint: "GET /obp/v6.0.0/signal/channels"
    tag: Signal
    description: "List real-time push notification channels (FCM)"
    response:
      fields:
        - name: channels
          type: "List<SignalChannel>"
        - name: channel_id
          type: String
        - name: name
          type: String
        - name: description
          type: String
        - name: created_at
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
