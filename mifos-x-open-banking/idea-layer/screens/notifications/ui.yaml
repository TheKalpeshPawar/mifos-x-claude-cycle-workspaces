id: notifications
name: Notifications
feature: notifications
flavor: consumer
status: designed
quality_score: 78
status_history:
  - status: draft
    timestamp: "2026-05-25T00:00:00Z"
  - status: enriched
    timestamp: "2026-05-25T00:00:00Z"
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
