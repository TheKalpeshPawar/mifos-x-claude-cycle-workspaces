states:
  loading:
    layout:
      visible_components:
        - title_action_row
        - notifications_title
      show_skeleton_list: true
      skeleton_count: 4

  populated:
    description: "Mixed read/unread notifications with section headers"
    layout:
      visible_components:
        - title_action_row
        - notifications_title
        - mark_all_read_button
        - section_today_label
        # Unread: payment from James Wilson
        - notification_payment_james
        - payment_james_row
        - payment_james_icon_bg
        - payment_james_icon
        - payment_james_text_col
        - payment_james_title
        - payment_james_message
        - payment_james_time
        - unread_dot_payment_james
        # Unread: KYC approved
        - notification_kyc_approved
        - kyc_approved_row
        - kyc_approved_icon_bg
        - kyc_approved_icon
        - kyc_approved_text_col
        - kyc_approved_title
        - kyc_approved_message
        - kyc_approved_time
        - unread_dot_kyc
        - section_earlier_label
        # Read: Netflix mandate
        - notification_netflix_mandate
        - netflix_mandate_row
        - netflix_mandate_icon_bg
        - netflix_mandate_icon
        - netflix_mandate_text_col
        - netflix_mandate_title
        - netflix_mandate_message
        - netflix_mandate_time
        # Read: Salary credited
        - notification_salary_credited
        - salary_credited_row
        - salary_credited_icon_bg
        - salary_credited_icon
        - salary_credited_text_col
        - salary_credited_title
        - salary_credited_message
        - salary_credited_time
        - bottom_spacer

  empty:
    layout:
      visible_components:
        - title_action_row
        - notifications_title
      show_empty_state: true
      empty_state_icon: notifications_none_outlined
      empty_state_title: "You're all caught up"
      empty_state_message: "No new notifications. We'll let you know about payments, alerts and updates."

  error:
    layout:
      visible_components:
        - title_action_row
        - notifications_title
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load notifications"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: NotificationsViewModel
  state_fields:
    - name: notifications
      type: "List<NotificationItem>"
      default: "emptyList()"
    - name: unreadCount
      type: Int
      default: 0
    - name: uiState
      type: NotificationsUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load notifications. Please try again."
  events:
    - NotificationsLoaded
    - "NotificationOpened(notificationId: String, category: NotificationCategory)"
    - MarkAllReadClicked
    - MarkAllReadComplete
    - RetryLoad
    - NotificationSettingsOpened
  actions:
    - open_notification
    - mark_all_read
    - open_notification_settings
  di:
    - NotificationRepository
    - SignalRepository

api:
  - id: obp_signal_channels
    endpoint: "GET /obp/v6.0.0/signal/channels"
    tag: Signal
    description: "List real-time push notification channels (FCM)"
    response:
      fields:
        - name: channels
          type: "List<SignalChannel>"
        - name: channel_id
          type: String
        - name: name
          type: String
        - name: description
          type: String
        - name: created_at
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"

dependencies:
  tier: feature
  features:
    - transactions
    - accounts
    - transaction-detail
    - kyc-review

navigation:
  - action: open_notification
    target: transaction-detail
    description: "Navigate to transaction detail for payment-category notifications"
    category: payment
  - action: open_notification
    target: kyc-review
    description: "Navigate to KYC review screen for security/identity notifications (cross-persona deep link)"
    category: security
  - action: open_notification
    target: accounts
    description: "Navigate to accounts for system notifications (mandates, direct debits)"
    category: system
  - action: open_notification_settings
    target: settings
    description: "Open notification preferences screen"
  - action: navigate_back
    target: home
    description: "Return to home screen"
