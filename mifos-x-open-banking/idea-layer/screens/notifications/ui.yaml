states:
  loading:
    layout:
      visible_components:
        - title_action_row
        - notifications_title
      show_skeleton_list: true
      skeleton_count: 4
  content:
    layout:
      visible_components:
        - title_action_row
        - notifications_title
        - mark_all_read_button
        - notification_payment_received
        - payment_received_row
        - payment_received_icon_bg
        - payment_received_icon
        - payment_received_text_col
        - payment_received_title
        - payment_received_message
        - payment_received_time
        - unread_dot_payment
        - notification_direct_debit
        - direct_debit_notif_row
        - direct_debit_icon_bg
        - direct_debit_notif_icon
        - direct_debit_text_col
        - direct_debit_notif_title
        - direct_debit_notif_message
        - direct_debit_notif_time
        - notification_budget_alert
        - budget_alert_notif_row
        - budget_alert_icon_bg
        - budget_alert_icon
        - budget_alert_text_col
        - budget_alert_title
        - budget_alert_message
        - budget_alert_time
        - bottom_spacer
  empty:
    layout:
      visible_components:
        - title_action_row
        - notifications_title
      show_empty_state: true
      empty_state_icon: notifications_none_outlined
      empty_state_title: "You're all caught up"
      empty_state_message: "No new notifications. We'll let you know about payments, alerts and updates."
  error:
    layout:
      visible_components:
        - title_action_row
        - notifications_title
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load notifications"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: NotificationsViewModel
  state_fields:
    - name: notifications
      type: "List<NotificationItem>"
      default: "emptyList()"
    - name: unreadCount
      type: Int
      default: 0
    - name: uiState
      type: NotificationsUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load notifications. Please try again."
  events:
    - NotificationsLoaded
    - NotificationOpened(notificationId: String)
    - MarkAllReadClicked
    - MarkAllReadComplete
    - RetryLoad
  actions:
    - open_notification
    - mark_all_read
    - open_notification_settings
  di:
    - NotificationRepository
    - SignalRepository

api:
  - id: obp_signal_channels
    endpoint: "GET /obp/v6.0.0/signal/channels"
    tag: Signal
    description: "List real-time push notification channels"
    response:
      fields:
        - name: channels
          type: "List<SignalChannel>"
        - name: channel_id
          type: String
        - name: name
          type: String
        - name: description
          type: String
        - name: created_at
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"

dependencies:
  tier: feature
  features:
    - transactions
    - direct-debits
    - pfm-dashboard

navigation:
  - action: open_notification
    target: transactions
    description: "Navigate to transactions for payment notification"
  - action: open_notification
    target: direct-debits
    description: "Navigate to direct debits for payment reminder"
  - action: open_notification
    target: pfm-dashboard
    description: "Navigate to spending insights for budget alert"
  - action: open_notification_settings
    target: settings
    description: "Open notification preferences"
  - action: navigate_back
    target: home
    description: "Return to home screen"
