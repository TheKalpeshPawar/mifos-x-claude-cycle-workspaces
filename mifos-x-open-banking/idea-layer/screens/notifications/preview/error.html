<!doctype html>

<html lang="en" data-screen="notifications" data-state="error" data-feature="notifications" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications — Error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 24px; }
  .top-bar { display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); flex: 1; margin-left: 6px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--on-surface-variant); }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .error-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 32px; }
  .error-icon-container { width: 96px; height: 96px; border-radius: 48px; background: var(--error-container); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .error-icon-container .material-icons { font-size: var(--icon-2xl); color: var(--on-error-container); }
  .error-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 10px; }
  .error-message { font-size: 14px; color: var(--on-surface-variant); line-height: 1.55; max-width: 284px; margin-bottom: 28px; }
  .retry-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-soft); padding: 12px 24px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .retry-btn:focus-visible { outline: 2px solid var(--on-background); outline-offset: 2px; }
  .retry-btn .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
<main role="main">

  <header class="top-bar" data-component-type="stack" data-component-id="title_action_row" aria-label="Notifications header">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <h1 data-component-type="text" data-component-id="notifications_title" role="heading" aria-level="1">Notifications</h1>
  </header>

  <section class="error-wrap" role="alert" aria-live="assertive">
    <div class="error-icon-container" aria-hidden="true">
      <span class="material-icons" aria-hidden="true">cloud_off</span>
    </div>
    <h2 class="error-title">Unable to load notifications</h2>
    <p class="error-message">Check your connection and try again.</p>
    <button class="retry-btn" data-action="retry_load" aria-label="Retry loading notifications">
      <span class="material-icons" aria-hidden="true">refresh</span>Try again
    </button>
  </section>

</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
