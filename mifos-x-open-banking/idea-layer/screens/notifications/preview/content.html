<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px,initial-scale=1">
<title>Notifications — Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:390px;min-height:844px;position:relative;overflow-x:hidden;
  background:var(--background);font-family:var(--font);
}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;height:56px;background:var(--surface);
  position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--surface-variant);
}
.top-bar-left{display:flex;align-items:center;gap:4px;}
.icon-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:none;background:transparent;cursor:pointer;
}
.top-bar-title{font-size:20px;font-weight:500;color:var(--text-primary);margin-left:4px;}
.top-bar-actions{display:flex;gap:0;}
.scroll-area{overflow-y:auto;height:calc(844px - 56px);padding-bottom:24px;}
/* Header row */
.header-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 8px;
}
.screen-title{font-size:28px;font-weight:700;color:var(--primary);}
.mark-all-btn{
  background:transparent;border:none;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:500;color:var(--tertiary);
  padding:0;
}
/* Section labels */
.section-label{
  font-size:12px;font-weight:600;color:var(--outline);text-transform:uppercase;
  letter-spacing:0.5px;padding:8px 20px 4px;
}
/* Notification item */
.notif-item{
  border-radius:16px;padding:14px 16px;
  margin:0 20px 8px;cursor:pointer;border:none;width:calc(100% - 40px);
  display:block;text-align:left;font-family:var(--font);
}
.notif-unread{background:var(--primary-container);}
.notif-read{background:var(--surface);}
.notif-inner{display:flex;align-items:flex-start;gap:12px;}
.notif-icon-wrap{
  width:44px;height:44px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.notif-icon-primary{background:var(--primary);}
.notif-icon-tertiary{background:var(--tertiary);}
.notif-text-col{flex:1;min-width:0;}
.notif-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:2px;}
.notif-read-text .notif-title{color:var(--text-secondary);}
.notif-msg{font-size:13px;color:var(--text-secondary);line-height:1.4;margin-bottom:4px;}
.notif-read-text .notif-msg{color:var(--outline);}
.notif-time{font-size:11px;color:var(--outline);}
.notif-read-text .notif-time{color:var(--outline-variant);}
.unread-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--primary);flex-shrink:0;margin-top:4px;
}
/* Bottom spacer */
.bottom-spacer{height:24px;}
</style>
</head>
<body>
<main data-screen="notifications" data-state="content" role="main">

  <!-- Top App Bar -->
  <header class="top-bar" role="banner">
    <div class="top-bar-left">
      <button class="icon-btn" aria-label="Go back" data-action="navigate_back">
        <span class="material-symbols-rounded" style="font-size:24px;color:var(--text-primary);" aria-hidden="true">arrow_back</span>
      </button>
      <span class="top-bar-title">Notifications</span>
    </div>
    <div class="top-bar-actions">
      <button class="icon-btn" aria-label="Mark all as read" data-action="mark_all_read">
        <span class="material-symbols-rounded" style="font-size:24px;color:var(--text-primary);" aria-hidden="true">done_all</span>
      </button>
      <button class="icon-btn" aria-label="Notification settings" data-action="open_notification_settings">
        <span class="material-symbols-rounded" style="font-size:24px;color:var(--text-primary);" aria-hidden="true">tune</span>
      </button>
    </div>
  </header>

  <div class="scroll-area">

    <!-- Title row -->
    <div class="header-row"
         data-component-type="stack"
         data-component-id="title_action_row"
         data-component-variant="horizontal"
         role="banner"
         aria-label="Notifications header">
      <h1 class="screen-title"
          data-component-type="text"
          data-component-id="notifications_title"
          data-component-variant="headline_large"
          role="heading"
          aria-level="1">Notifications</h1>
      <button class="mark-all-btn"
              data-component-type="button"
              data-component-id="mark_all_read_button"
              data-component-variant="text"
              data-action="mark_all_read"
              aria-label="Mark all notifications as read">Mark All Read</button>
    </div>

    <!-- Section: Today -->
    <div class="section-label"
         data-component-type="text"
         data-component-id="section_today_label"
         data-component-variant="label_medium"
         role="heading"
         aria-level="2"
         aria-label="Today's notifications">Today</div>

    <!-- Notification 1: Payment from James Wilson (UNREAD) -->
    <button class="notif-item notif-unread"
            data-component-type="box"
            data-component-id="notification_payment_james"
            data-component-variant="default"
            data-nav-to="transaction-detail"
            aria-label="Unread payment notification: Payment of £50.00 received from James Wilson. 10 minutes ago.">
      <div class="notif-inner"
           data-component-type="stack"
           data-component-id="payment_james_row"
           data-component-variant="horizontal">
        <div class="notif-icon-wrap notif-icon-primary"
             data-component-type="box"
             data-component-id="payment_james_icon_bg"
             data-component-variant="default"
             aria-hidden="true">
          <span class="material-symbols-rounded"
                data-component-type="icon"
                data-component-id="payment_james_icon"
                data-component-variant="default"
                style="font-size:22px;color:var(--on-primary);" aria-hidden="true">arrow_downward</span>
        </div>
        <div class="notif-text-col"
             data-component-type="stack"
             data-component-id="payment_james_text_col"
             data-component-variant="vertical">
          <div class="notif-title"
               data-component-type="text"
               data-component-id="payment_james_title"
               data-component-variant="body_medium">Payment received</div>
          <div class="notif-msg"
               data-component-type="text"
               data-component-id="payment_james_message"
               data-component-variant="body_small">Payment of £50.00 received from James Wilson</div>
          <div class="notif-time"
               data-component-type="text"
               data-component-id="payment_james_time"
               data-component-variant="label_small">10 min ago</div>
        </div>
        <div class="unread-dot"
             data-component-type="box"
             data-component-id="unread_dot_payment_james"
             data-component-variant="default"
             role="status"
             aria-label="Unread notification"></div>
      </div>
    </button>

    <!-- Notification 2: KYC Approved (UNREAD) -->
    <button class="notif-item notif-unread"
            data-component-type="box"
            data-component-id="notification_kyc_approved"
            data-component-variant="default"
            data-nav-to="kyc-review"
            aria-label="Unread security notification: KYC verification approved. Your identity has been verified. 1 hour ago.">
      <div class="notif-inner"
           data-component-type="stack"
           data-component-id="kyc_approved_row"
           data-component-variant="horizontal">
        <div class="notif-icon-wrap notif-icon-primary"
             data-component-type="box"
             data-component-id="kyc_approved_icon_bg"
             data-component-variant="default"
             aria-hidden="true">
          <span class="material-symbols-rounded"
                data-component-type="icon"
                data-component-id="kyc_approved_icon"
                data-component-variant="default"
                style="font-size:22px;color:var(--on-primary);" aria-hidden="true">verified_user</span>
        </div>
        <div class="notif-text-col"
             data-component-type="stack"
             data-component-id="kyc_approved_text_col"
             data-component-variant="vertical">
          <div class="notif-title"
               data-component-type="text"
               data-component-id="kyc_approved_title"
               data-component-variant="body_medium">KYC verification approved</div>
          <div class="notif-msg"
               data-component-type="text"
               data-component-id="kyc_approved_message"
               data-component-variant="body_small">Your identity has been verified. You now have full access to all account features.</div>
          <div class="notif-time"
               data-component-type="text"
               data-component-id="kyc_approved_time"
               data-component-variant="label_small">1 hr ago</div>
        </div>
        <div class="unread-dot"
             data-component-type="box"
             data-component-id="unread_dot_kyc"
             data-component-variant="default"
             role="status"
             aria-label="Unread notification"></div>
      </div>
    </button>

    <!-- Section: Earlier -->
    <div class="section-label"
         data-component-type="text"
         data-component-id="section_earlier_label"
         data-component-variant="label_medium"
         role="heading"
         aria-level="2"
         style="padding-top:12px;"
         aria-label="Earlier notifications">Earlier</div>

    <!-- Notification 3: Netflix mandate (READ) -->
    <button class="notif-item notif-read"
            data-component-type="box"
            data-component-id="notification_netflix_mandate"
            data-component-variant="default"
            data-nav-to="accounts"
            aria-label="Read system notification: Direct debit mandate created for Netflix. £15.99 per month from Current Account. 3 hours ago.">
      <div class="notif-inner notif-read-text"
           data-component-type="stack"
           data-component-id="netflix_mandate_row"
           data-component-variant="horizontal">
        <div class="notif-icon-wrap notif-icon-tertiary"
             data-component-type="box"
             data-component-id="netflix_mandate_icon_bg"
             data-component-variant="default"
             aria-hidden="true">
          <span class="material-symbols-rounded"
                data-component-type="icon"
                data-component-id="netflix_mandate_icon"
                data-component-variant="default"
                style="font-size:22px;color:var(--on-primary);" aria-hidden="true">autorenew</span>
        </div>
        <div class="notif-text-col"
             data-component-type="stack"
             data-component-id="netflix_mandate_text_col"
             data-component-variant="vertical">
          <div class="notif-title"
               data-component-type="text"
               data-component-id="netflix_mandate_title"
               data-component-variant="body_medium"
               style="color:var(--text-secondary);">Direct debit mandate created</div>
          <div class="notif-msg"
               data-component-type="text"
               data-component-id="netflix_mandate_message"
               data-component-variant="body_small"
               style="color:var(--outline);">Direct debit mandate created for Netflix — £15.99/month from your Current Account.</div>
          <div class="notif-time"
               data-component-type="text"
               data-component-id="netflix_mandate_time"
               data-component-variant="label_small"
               style="color:var(--outline-variant);">3 hr ago</div>
        </div>
      </div>
    </button>

    <!-- Notification 4: Salary credited (READ) -->
    <button class="notif-item notif-read"
            data-component-type="box"
            data-component-id="notification_salary_credited"
            data-component-variant="default"
            data-nav-to="transaction-detail"
            aria-label="Read payment notification: Salary credited. £3,200.00 from Acme Ltd has been credited to your account. Yesterday.">
      <div class="notif-inner notif-read-text"
           data-component-type="stack"
           data-component-id="salary_credited_row"
           data-component-variant="horizontal">
        <div class="notif-icon-wrap notif-icon-primary"
             data-component-type="box"
             data-component-id="salary_credited_icon_bg"
             data-component-variant="default"
             aria-hidden="true">
          <span class="material-symbols-rounded"
                data-component-type="icon"
                data-component-id="salary_credited_icon"
                data-component-variant="default"
                style="font-size:22px;color:var(--on-primary);" aria-hidden="true">arrow_downward</span>
        </div>
        <div class="notif-text-col"
             data-component-type="stack"
             data-component-id="salary_credited_text_col"
             data-component-variant="vertical">
          <div class="notif-title"
               data-component-type="text"
               data-component-id="salary_credited_title"
               data-component-variant="body_medium"
               style="color:var(--text-secondary);">Salary credited</div>
          <div class="notif-msg"
               data-component-type="text"
               data-component-id="salary_credited_message"
               data-component-variant="body_small"
               style="color:var(--outline);">£3,200.00 from Acme Ltd has been credited to your Current Account.</div>
          <div class="notif-time"
               data-component-type="text"
               data-component-id="salary_credited_time"
               data-component-variant="label_small"
               style="color:var(--outline-variant);">Yesterday</div>
        </div>
      </div>
    </button>

    <div class="bottom-spacer"
         data-component-type="spacer"
         data-component-id="bottom_spacer"
         data-component-variant="default"
         aria-hidden="true"></div>

  </div>
</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
