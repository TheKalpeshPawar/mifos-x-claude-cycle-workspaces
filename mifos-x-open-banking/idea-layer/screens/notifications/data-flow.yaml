sibling: data-flow
schema_version: "4.0"
feature_id: notifications

entries:
  - screen_id: notifications
    trigger: on_mount
    endpoints:
      - poll_events
    direction: read
    dtos:
      - name: EventNotification
        role: response
        api_id: poll_events
    produces_state: populated
    error_paths:
      - error_code: "401"
        behavior: show_error_state_with_retry
      - error_code: "403"
        behavior: show_error_state_with_retry

  - screen_id: notifications
    trigger: on_interact
    event: MarkAllReadClicked
    endpoints:
      - poll_events
    direction: write
    dtos: []
    produces_state: populated
    error_paths:
      - error_code: LOAD_FAILED
        behavior: show_error_state_with_retry

  - screen_id: notifications
    trigger: on_interact
    event: NotificationSettingsOpened
    endpoints:
      - get_event_subscriptions
      - create_event_subscription
      - delete_event_subscription
    direction: read
    dtos:
      - name: EventSubscription
        role: response
        api_id: get_event_subscriptions
    produces_state: populated
    error_paths: []

  - screen_id: notifications
    trigger: on_interact
    event: NotificationOpened
    endpoints: []
    direction: read
    dtos: []
    produces_state: populated
    error_paths: []
