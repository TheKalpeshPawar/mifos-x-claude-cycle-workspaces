sibling: data-flow
schema_version: "4.0"
feature_id: notifications

entries:
  - screen_id: notifications
    trigger: on_mount
    endpoints:
      - obp_signal_channels
    direction: read
    dtos:
      - name: SignalChannel
        role: response
        api_id: obp_signal_channels
    produces_state: populated
    error_paths:
      - error_code: "401"
        behavior: show_error_state_with_retry
      - error_code: "403"
        behavior: show_error_state_with_retry

  - screen_id: notifications
    trigger: on_interact
    event: MarkAllReadClicked
    endpoints: []
    direction: write
    dtos: []
    produces_state: populated
    error_paths:
      - error_code: LOAD_FAILED
        behavior: show_error_state_with_retry

  - screen_id: notifications
    trigger: on_interact
    event: NotificationOpened
    endpoints: []
    direction: read
    dtos: []
    produces_state: populated
    error_paths: []
