screen_id: party

scenarios:
  - id: TC-PARTY-001
    description: "Account holder details load and render Priya Sharma's full profile including dual addresses"
    state: content
    priority: critical
    given: "Valid PSU access token with ReadParty in consent; HSBC sandbox returns OBReadParty2 + OBReadParty3 data for account 40051512345678"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Name 'Priya Sharma' renders in headline in identity header card"
      - "Full legal name 'Priya Anjali Sharma' visible as subtitle in body colour on-surface-variant"
      - "PartyType 'Sole' shown as labelMedium overline in secondary colour"
      - "Contact section header visible"
      - "Email priya.sharma@example.co.uk renders in Contact section with email icon"
      - "Mobile +44 7700 900482 renders in Contact section with phone_android icon"
      - "Phone +44 20 7946 0301 renders in Contact section with phone icon"
      - "Address section header visible"
      - "Residential address card: Flat 12, 48 Camden High Street, NW1 0LT, London renders"
      - "Business address card: Suite 400, 1 Canada Square, E14 5AB, London renders"

  - id: TC-PARTY-002
    description: "Loading state shown while party and parties calls are in flight"
    state: loading
    priority: critical
    given: "Slow network; both API calls in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible with accessibility label 'Loading account holder details'"
      - "Identity header card, Contact section, and Address section not rendered"

  - id: TC-PARTY-003
    description: "Error state with Retry shown when access token is expired (401)"
    state: error
    priority: critical
    given: "PSU access token expired; /party endpoint returns 401 Unauthorized"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Error empty_state renders with error_outline icon"
      - "Title 'Could not load account holder' visible"
      - "Error message from server rendered as body"
      - "Retry button visible and accessible"
      - "Tapping Retry re-triggers party_load ViewModel action"

  - id: TC-PARTY-004
    description: "Back navigation returns to account-detail screen"
    state: content
    priority: normal
    given: "Content state rendered for account 40051512345678"
    when: "User taps the leading back icon in the top app bar"
    then: "Navigates to account-detail screen passing accountId=40051512345678"

  - id: TC-PARTY-005
    description: "Empty state shown when HSBC returns 200 with no party records"
    state: empty
    priority: normal
    given: "HSBC sandbox responds 200 but OBReadParty2.Data.Party is absent and OBReadParty3.Data.Party[] is empty for business account 40051999000001"
    when: "Screen mounts with accountId=40051999000001"
    then:
      - "Empty state renders with person_off icon"
      - "Title 'No account holder data' visible"
      - "Body text 'No party information is available for this account.' visible"
      - "No Retry or Re-authorise CTA present"

  - id: TC-PARTY-006
    description: "Consent required state shown with Re-authorise CTA when ReadParty permission is missing (403)"
    state: consent_required
    priority: critical
    given: "Active consent does not include ReadParty; /party returns 403 PermissionNotGranted"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Consent required state renders with lock_person icon"
      - "Title 'Permission Required' visible"
      - "Body explains ReadParty consent requirement"
      - "Re-authorise button visible and accessible"
      - "Tapping Re-authorise navigates to the consent-list (Manage consents) screen"
