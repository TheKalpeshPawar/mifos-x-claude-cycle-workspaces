screen_id: party

endpoints:
  - id: party
    method: GET
    path: "/accounts/{AccountId}/party"
    response_dto: OBReadParty2
    permission: ReadParty
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns single party (OBReadParty2.Data.Party) — the account holder linked to the account. Requires ReadParty permission in consent."
    response:
      status: 200
      schema: OBReadParty2
      data_path: "Data.Party"
      fields:
        - "PartyId: string — unique identifier for deduplication"
        - "Name: string — display name of the PSU"
        - "FullLegalName: string (optional) — full registered legal name"
        - "PartyType: OBExternalPartyType1Code — enum: Sole, JointSole, JointMortgagor"
        - "EmailAddress: string (optional)"
        - "Phone: string (optional)"
        - "Mobile: string (optional)"
        - "Address[]: OBPostalAddress8 (optional) — AddressType, BuildingNumber, StreetName, AddressLine[], TownName, PostCode, Country"
    errors:
      http_401: "Unauthorized — PSU access token expired; emit PartyUiState.Error(message, PartyErrorCode.AUTH)"
      http_403: "PermissionNotGranted — ReadParty not in active consent; emit PartyUiState.ConsentRequired"
      http_404: "Not Found — no OBParty2 record for this AccountId; emit PartyUiState.Empty"
      http_200_empty: "200 OK but Data.Party absent; emit PartyUiState.Empty"
      http_500: "Internal server error — retry; emit PartyUiState.Error(message, PartyErrorCode.NETWORK)"
      network: "Connection failure — device offline or AIS unreachable; emit PartyUiState.Error(e.localizedMessage, PartyErrorCode.NETWORK)"

  - id: parties
    method: GET
    path: "/accounts/{AccountId}/parties"
    response_dto: OBReadParty3
    permission: ReadParty
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns array of parties (OBReadParty3.Data.Party[]) — may include joint account holders. Merge with /party response, de-duplicating by PartyId."
    response:
      status: 200
      schema: OBReadParty3
      data_path: "Data.Party[]"
      fields:
        - "PartyId: string — unique identifier for deduplication with /party response"
        - "Name: string"
        - "FullLegalName: string (optional)"
        - "PartyType: OBExternalPartyType1Code"
        - "EmailAddress: string (optional)"
        - "Phone: string (optional)"
        - "Mobile: string (optional)"
        - "Address[]: OBPostalAddress8 (optional)"
    errors:
      http_401: "Unauthorized — PSU access token expired; emit PartyUiState.Error(message, PartyErrorCode.AUTH)"
      http_403: "PermissionNotGranted — ReadParty not in active consent; emit PartyUiState.ConsentRequired"
      http_404: "Not Found — no OBParty3 records for this AccountId; emit PartyUiState.Empty"
      http_200_empty: "200 OK but Data.Party[] is empty; emit PartyUiState.Empty"
      http_500: "Internal server error — retry; emit PartyUiState.Error(message, PartyErrorCode.NETWORK)"
      network: "Connection failure — device offline or AIS unreachable; emit PartyUiState.Error(e.localizedMessage, PartyErrorCode.NETWORK)"
