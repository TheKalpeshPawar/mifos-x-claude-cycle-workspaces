screen_id: party

endpoints:
  - id: party
    method: GET
    path: "/accounts/{AccountId}/party"
    response_dto: OBReadParty2
    permission: ReadParty
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns single party (OBReadParty2.Data.Party) — the account holder linked to the account. Requires ReadParty permission in consent."

  - id: parties
    method: GET
    path: "/accounts/{AccountId}/parties"
    response_dto: OBReadParty3
    permission: ReadParty
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns array of parties (OBReadParty3.Data.Party[]) — may include joint account holders. Merge with /party response, de-duplicating by PartyId."
