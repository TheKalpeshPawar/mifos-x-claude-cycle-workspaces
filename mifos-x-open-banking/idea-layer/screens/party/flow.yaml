feature: party
flow_ref: account-browsing

entry_points:
  - source: account-detail
    label: "Account Holder entry in account-detail (gated by ReadParty in consent)"

transitions:
  - from: party
    to: account-detail
    trigger: "Back navigation (top_app_bar leading icon)"

  - from: party
    to: consent-list
    trigger: "Re-authorise tapped in consent_required state"
    condition: "PartyUiState.ConsentRequired — 403 PermissionNotGranted received from /party or /parties"
