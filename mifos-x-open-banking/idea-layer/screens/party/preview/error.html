<!doctype html>

<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Account Holder — error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
:root {
  --md-primary: #266489;
  --md-on-primary: #FFFFFF;
  --md-primary-container: #C9E6FF;
  --md-on-primary-container: #004B6F;
  --md-secondary: #50606E;
  --md-on-secondary: #FFFFFF;
  --md-secondary-container: #D3E5F5;
  --md-on-secondary-container: #384956;
  --md-error: #BA1A1A;
  --md-on-error: #FFFFFF;
  --md-error-container: #FFDAD6;
  --md-on-error-container: #93000A;
  --md-background: #F7F9FF;
  --md-on-background: #181C20;
  --md-surface: #F7F9FF;
  --md-on-surface: #181C20;
  --md-surface-variant: #DDE3EA;
  --md-on-surface-variant: #41474D;
  --md-outline: #72787E;
  --md-outline-variant: #C1C7CE;
  --md-surface-container-low: #F1F4F9;
  --md-surface-container: #EBEEF3;
  --md-surface-container-high: #E5E8ED;
  --md-inverse-primary: #95CDF7;

  --fs-headline-small: 24px; --lh-headline-small: 32px;
  --fs-title-large: 22px; --lh-title-large: 28px;
  --fs-body-medium: 14px; --lh-body-medium: 20px;
  --fs-label-large: 14px; --lh-label-large: 20px; --fw-label-large: 500;
  --fs-label-medium: 12px; --lh-label-medium: 16px; --fw-label-medium: 500;
  --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px; --sp-32: 32px; --sp-48: 48px;
  --radius-full: 9999px; --radius-medium: 12px;
  --nav-height: 80px; --top-bar-height: 64px;
  --motion-short: 150ms; --emphasis-ease: cubic-bezier(0.2,0.0,0,1.0);
}

[data-theme="dark"] {
  --md-primary: #95CDF7;
  --md-on-primary: #00344E;
  --md-primary-container: #004B6F;
  --md-on-primary-container: #C9E6FF;
  --md-secondary: #B7C9D9;
  --md-on-secondary: #22323F;
  --md-secondary-container: #384956;
  --md-on-secondary-container: #D3E5F5;
  --md-error: #FFB4AB;
  --md-on-error: #690005;
  --md-error-container: #93000A;
  --md-on-error-container: #FFDAD6;
  --md-background: #101417;
  --md-on-background: #E0E3E8;
  --md-surface: #101417;
  --md-on-surface: #E0E3E8;
  --md-surface-variant: #41474D;
  --md-on-surface-variant: #C1C7CE;
  --md-outline: #8B9198;
  --md-outline-variant: #41474D;
  --md-surface-container-low: #181C20;
  --md-surface-container: #1C2024;
  --md-surface-container-high: #262A2E;
  --md-inverse-primary: #266489;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--md-background); color: var(--md-on-background); font-family: 'Roboto', sans-serif; -webkit-font-smoothing: antialiased; }

.screen-root { display: flex; flex-direction: column; height: 100%; max-width: 412px; margin: 0 auto; background: var(--md-background); position: relative; overflow: hidden; }

.top-app-bar { display: flex; align-items: center; height: var(--top-bar-height); padding: 0 var(--sp-4); background: var(--md-surface-container); flex-shrink: 0; border-bottom: 1px solid var(--md-outline-variant); }
.icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: transparent; cursor: pointer; flex-shrink: 0; }
.icon-btn svg { fill: var(--md-on-surface); }
.bar-title { font-size: var(--fs-title-large); line-height: var(--lh-title-large); font-weight: 400; color: var(--md-on-surface); flex: 1; padding-left: var(--sp-4); }

.screen-content { flex: 1; overflow-y: auto; padding: var(--sp-16); padding-bottom: calc(var(--nav-height) + var(--sp-24)); display: flex; align-items: center; justify-content: center; }

/* Error state */
.error-state { display: flex; flex-direction: column; align-items: center; gap: var(--sp-16); padding: var(--sp-32); text-align: center; max-width: 320px; }
.error-icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: var(--md-error-container); display: flex; align-items: center; justify-content: center; }
.error-icon-wrap svg { fill: var(--md-on-error-container); }
.error-title { font-size: var(--fs-headline-small); line-height: var(--lh-headline-small); font-weight: 400; color: var(--md-on-surface); }
.error-body { font-size: var(--fs-body-medium); line-height: var(--lh-body-medium); color: var(--md-on-surface-variant); }

/* Filled button */
.btn-filled { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 var(--sp-24); border-radius: var(--radius-full); border: none; background: var(--md-primary); color: var(--md-on-primary); font-size: var(--fs-label-large); font-weight: var(--fw-label-large); line-height: var(--lh-label-large); cursor: pointer; min-width: 48px; transition: box-shadow var(--motion-short) var(--emphasis-ease), background var(--motion-short) var(--emphasis-ease); margin-top: var(--sp-8); }
.btn-filled:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.btn-filled:active { background: color-mix(in srgb, var(--md-primary) 88%, black 12%); }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 412px; height: var(--nav-height); background: var(--md-surface-container); border-top: 1px solid var(--md-outline-variant); display: flex; align-items: flex-start; padding-top: var(--sp-12); z-index: 20; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nav-indicator { width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.nav-icon-svg { fill: var(--md-on-surface-variant); }
.nav-label { font-size: var(--fs-label-medium); line-height: 1; font-weight: var(--fw-label-medium); color: var(--md-on-surface-variant); }
</style>
</head>
<body>
<div class="screen-root" data-screen="party" data-state="error">

  <header class="top-app-bar" role="banner">
    <button class="icon-btn" aria-label="Navigate back to account details" data-action="navigate_back">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="bar-title">Account Holder</span>
  </header>

  <main class="screen-content" role="main">
    <div class="error-state" data-component-type="empty_state" data-component-id="error_state" data-component-variant="error" aria-label="Error loading account holder details" role="alert">
      <div class="error-icon-wrap" aria-hidden="true">
        <!-- error_outline icon -->
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
        </svg>
      </div>
      <h1 class="error-title">Could not load account holder</h1>
      <p class="error-body">Request timed out. Please check your connection and try again.</p>
      <button class="btn-filled" aria-label="Retry loading account holder details" data-action="retry_load">
        Retry
      </button>
    </div>
  </main>

  <!-- Bottom nav: Home · Accounts · Transactions · More — NO active tab -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-item" role="button" tabindex="0" aria-label="Home" data-action="navigate" data-nav-to="home">
      <div class="nav-indicator">
        <svg class="nav-icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      <span class="nav-label">Home</span>
    </div>
    <div class="nav-item" role="button" tabindex="0" aria-label="Accounts" data-action="navigate" data-nav-to="accounts">
      <div class="nav-indicator">
        <svg class="nav-icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zM11.5 1L2 6v2h19V6l-9.5-5z"/></svg>
      </div>
      <span class="nav-label">Accounts</span>
    </div>
    <div class="nav-item" role="button" tabindex="0" aria-label="Transactions" data-action="navigate" data-nav-to="transactions">
      <div class="nav-indicator">
        <svg class="nav-icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
      </div>
      <span class="nav-label">Transactions</span>
    </div>
    <div class="nav-item" role="button" tabindex="0" aria-label="More" data-action="navigate" data-nav-to="settings">
      <div class="nav-indicator">
        <svg class="nav-icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </div>
      <span class="nav-label">More</span>
    </div>
  </nav>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
