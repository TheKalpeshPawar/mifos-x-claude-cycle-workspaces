<!doctype html>

<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Account Holder — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
:root {
  --md-primary: #266489;
  --md-on-primary: #FFFFFF;
  --md-primary-container: #C9E6FF;
  --md-on-primary-container: #004B6F;
  --md-secondary: #50606E;
  --md-on-secondary: #FFFFFF;
  --md-secondary-container: #D3E5F5;
  --md-on-secondary-container: #384956;
  --md-background: #F7F9FF;
  --md-on-background: #181C20;
  --md-surface: #F7F9FF;
  --md-on-surface: #181C20;
  --md-surface-variant: #DDE3EA;
  --md-on-surface-variant: #41474D;
  --md-outline: #72787E;
  --md-outline-variant: #C1C7CE;
  --md-surface-container-lowest: #FFFFFF;
  --md-surface-container-low: #F1F4F9;
  --md-surface-container: #EBEEF3;
  --md-surface-container-high: #E5E8ED;
  --md-surface-container-highest: #E0E3E8;
  --md-inverse-primary: #95CDF7;

  --fs-title-large: 22px; --lh-title-large: 28px;
  --fs-label-medium: 12px; --lh-label-medium: 16px; --fw-label-medium: 500;
  --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px;
  --radius-medium: 12px;
  --nav-height: 80px; --top-bar-height: 64px;
  --motion-short: 150ms; --emphasis-ease: cubic-bezier(0.2,0.0,0,1.0);
}

[data-theme="dark"] {
  --md-primary: #95CDF7;
  --md-on-primary: #00344E;
  --md-primary-container: #004B6F;
  --md-on-primary-container: #C9E6FF;
  --md-secondary: #B7C9D9;
  --md-on-secondary: #22323F;
  --md-secondary-container: #384956;
  --md-on-secondary-container: #D3E5F5;
  --md-background: #101417;
  --md-on-background: #E0E3E8;
  --md-surface: #101417;
  --md-on-surface: #E0E3E8;
  --md-surface-variant: #41474D;
  --md-on-surface-variant: #C1C7CE;
  --md-outline: #8B9198;
  --md-outline-variant: #41474D;
  --md-surface-container-lowest: #0B0F12;
  --md-surface-container-low: #181C20;
  --md-surface-container: #1C2024;
  --md-surface-container-high: #262A2E;
  --md-surface-container-highest: #313539;
  --md-inverse-primary: #266489;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--md-background); color: var(--md-on-background); font-family: 'Roboto', sans-serif; -webkit-font-smoothing: antialiased; }

.screen-root { display: flex; flex-direction: column; height: 100%; max-width: 412px; margin: 0 auto; background: var(--md-background); position: relative; overflow: hidden; }

.top-app-bar { display: flex; align-items: center; height: var(--top-bar-height); padding: 0 var(--sp-4); background: var(--md-surface-container); flex-shrink: 0; border-bottom: 1px solid var(--md-outline-variant); }
.icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: transparent; cursor: pointer; flex-shrink: 0; }
.icon-btn svg { fill: var(--md-on-surface); }
.bar-title { font-size: var(--fs-title-large); line-height: var(--lh-title-large); font-weight: 400; color: var(--md-on-surface); flex: 1; padding-left: var(--sp-4); }

.screen-content { flex: 1; overflow-y: auto; padding: var(--sp-16); padding-bottom: calc(var(--nav-height) + var(--sp-24)); display: flex; flex-direction: column; gap: var(--sp-16); }

/* Shimmer skeleton */
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skel {
  background: linear-gradient(90deg, var(--md-surface-container) 25%, var(--md-surface-container-high) 50%, var(--md-surface-container) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: var(--radius-medium);
}
.skel-card { background: var(--md-surface-container-low); border-radius: var(--radius-medium); padding: var(--sp-16); box-shadow: 0 1px 2px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: var(--sp-12); }
.skel-row { height: 12px; border-radius: 6px; }
.skel-row.w60 { width: 60%; }
.skel-row.w80 { width: 80%; }
.skel-row.w40 { width: 40%; }
.skel-row.h20 { height: 20px; }
.skel-row.h28 { height: 28px; }

.skel-section-header { height: 12px; width: 30%; border-radius: 6px; }

.skel-list { background: var(--md-surface-container-low); border-radius: var(--radius-medium); overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
.skel-list-row { display: flex; align-items: center; gap: var(--sp-16); padding: var(--sp-12) var(--sp-16); min-height: 56px; }
.skel-list-row + .skel-list-row { border-top: 1px solid var(--md-outline-variant); }
.skel-icon { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
.skel-text-group { flex: 1; display: flex; flex-direction: column; gap: var(--sp-4); }
.skel-text { height: 11px; border-radius: 4px; }
.skel-text.w50 { width: 50%; }
.skel-text.w70 { width: 70%; }
.skel-text.w35 { width: 35%; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 412px; height: var(--nav-height); background: var(--md-surface-container); border-top: 1px solid var(--md-outline-variant); display: flex; align-items: flex-start; padding-top: var(--sp-12); z-index: 20; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nav-indicator { width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.nav-icon-svg { fill: var(--md-on-surface-variant); }
.nav-label { font-size: var(--fs-label-medium); line-height: 1; font-weight: var(--fw-label-medium); color: var(--md-on-surface-variant); }
</style>
</head>
<body>
<div class="screen-root" data-screen="party" data-state="loading">

    </button>

  </header>

  <main class="screen-content" role="main" aria-label="Loading account holder details" aria-busy="true">

    <!-- Skeleton: identity header card -->
    <div class="skel-card" aria-hidden="true">
      <div class="skel skel-row w40"></div>
      <div class="skel skel-row h28 w80"></div>
      <div class="skel skel-row w60"></div>

    <div class="skel skel-section-header" aria-hidden="true"></div>

        <div class="skel-text-group">
          <div class="skel skel-text w35"></div>
          <div class="skel skel-text w50"></div>
        </div>
      </div>
      <div class="skel-list-row">
        <div class="skel skel-icon"></div>
        <div class="skel-text-group">
          <div class="skel skel-text w35"></div>
          <div class="skel skel-text w50"></div>
        </div>
      </div>
    </div>

    <!-- Skeleton: address section header -->
    <div class="skel skel-section-header" aria-hidden="true"></div>

    <!-- Skeleton: address card 1 -->
    <div class="skel-card" aria-hidden="true">
      <div class="skel skel-row w40"></div>
      <div class="skel skel-row w80"></div>
      <div class="skel skel-row w60"></div>

    <p class="sr-only" aria-live="polite">Loading account holder details</p>

  </main>

  <!-- Bottom nav: Home · Accounts · Transactions · More — NO active tab -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-item" role="button" tabindex="0" aria-label="Home" data-action="navigate" data-nav-to="home">
      <div class="nav-indicator">
        <svg class="nav-icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      <span class="nav-label">Home</span>
    </div>
    <div class="nav-item" role="button" tabindex="0" aria-label="Accounts" data-action="navigate" data-nav-to="accounts">
      <div class="nav-indicator">
        <svg class="nav-icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zM11.5 1L2 6v2h19V6l-9.5-5z"/></svg>
      </div>
      <span class="nav-label">Accounts</span>
    </div>
    <div class="nav-item" role="button" tabindex="0" aria-label="Transactions" data-action="navigate" data-nav-to="transactions">
      <div class="nav-indicator">
        <svg class="nav-icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>

      </div>
      <span class="nav-label">More</span>
    </div>
  </nav>

</div>
