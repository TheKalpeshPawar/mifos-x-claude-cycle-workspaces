screen_id: party

on_mount:
  - trigger: party_load
    description: "Load /party and /parties in parallel for the given accountId, then merge by PartyId."
    steps:
      - call: party
        path_params:
          AccountId: "{accountId}"
        store_as: partyResult
      - call: parties
        path_params:
          AccountId: "{accountId}"
        store_as: partiesResult
      - merge:
          from: [partyResult, partiesResult]
          deduplicate_by: PartyId
          store_as: party
          pick_first: true
    on_loading: loading
    on_success: content
    on_empty: empty
    on_error: error
    error_routing:
      http_403_PermissionNotGranted: consent_required
      http_401: error
      http_404: empty
      http_200_empty_party_array: empty
      network_error: error

on_user_action:
  - trigger: retry_load
    re_runs: [party_load]
    available_in_states: [error]

  - trigger: reauthorise
    navigate_to: consent-list
    available_in_states: [consent_required]
