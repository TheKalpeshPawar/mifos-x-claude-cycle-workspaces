approved_at: "2026-07-14T00:00:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "2.0.0"
score: 96
cluster: account-extras
acceptance_refs: [FR-007]
scaffolded_by: "/idea-heal"
enriched_by: "/idea-enrich"
enriched_at: "2026-06-29"
archetype: detail_screen
description: "Account holder / PSU details screen, gated by ReadParty permission. Shows name, full legal name, party type (Sole/JointSole), one or more OBPostalAddress8 entries, email, phone, and mobile. Calls both /party (OBReadParty2) and /parties (OBReadParty3) in parallel via ktorfit and merges results by PartyId. Five distinct states: loading (in-flight), content (merged party rendered), empty (200 but no party records), error (401/network — Retry CTA), consent_required (403 PermissionNotGranted — Re-authorise CTA navigating to the consent-list (Manage consents) screen to reconfirm the consent)."
has_ui: true
has_server: false

metadata:
  category: crud
  implementation_ready: true
  impl_ready_at: "2026-06-29"
  impl_ready_schema: "v2"

contracts:
  - endpoint_id: party
    permission: ReadParty
    response_dto: OBReadParty2
    merge_strategy: "deduplicate by PartyId with parties endpoint; pick_first on conflict"
  - endpoint_id: parties
    permission: ReadParty
    response_dto: OBReadParty3
    merge_strategy: "deduplicate by PartyId with party endpoint; pick_first on conflict"

libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets: [android, ios, desktop, web]

dependencies:
  tier: 1
  features:
    - "consent-list — re-authorisation navigation target when ReadParty permission missing"
    - "account-detail — parent screen; supplies accountId as navigation argument"
  external:
    - "hsbc-obie-ais-v4.0 GET /accounts/{AccountId}/party — requires ReadParty in active consent"
    - "hsbc-obie-ais-v4.0 GET /accounts/{AccountId}/parties — requires ReadParty in active consent"

screens:
  - id: party
    name: "Account Holder"
    viewmodel: PartyViewModel
    entry_points:
      - from: account-detail
        via: nav_chip_party

capability_completeness:
  storage_location: "No local storage — party data is read-only and not cached on device. Both endpoints fetched fresh on every screen mount."
  destructive_action_safety: "No destructive actions — screen is read-only AISP data view."
  nav_callback_wiring: "reauthorise_button navigates to consent-list screen. Back icon uses system back navigation returning to account-detail."
  user_data_export: "Party data (name, address, contact) is displayed on-screen only; no download or copy mechanism needed for AISP read-only access."
  permission_visibility: "ReadParty missing from consent → consent_required state with explicit lock_person icon, explanatory body text, and Re-authorise CTA navigating to consent-list."
  storage_budget_awareness: "No local caching; zero device storage impact from this screen."
  network_data_policy: "Parallel fetch on mount only (party + parties in parallel). No prefetch, no background refresh, no pagination."
  cache_lifecycle: "No cache — all data sourced from live AIS API calls on every mount."
  error_recovery: "HTTP 401 → error state (PartyErrorCode.AUTH) + Retry CTA. HTTP 403 PermissionNotGranted → consent_required state + Re-authorise CTA. HTTP 404 / 200-empty → empty state. Network error → error state (PartyErrorCode.NETWORK) + Retry CTA."

vm_actions:
  - name: party_load
    signature: "suspend fun partyLoad(accountId: String)"
    state_mutations:
      - "uiState = PartyUiState.Loading"
      - "uiState = PartyUiState.Content(party)"
      - "uiState = PartyUiState.Error(message, PartyErrorCode.AUTH)"
      - "uiState = PartyUiState.Error(message, PartyErrorCode.NETWORK)"
      - "uiState = PartyUiState.Empty"
      - "uiState = PartyUiState.ConsentRequired"
    side_effects:
      - "GET /accounts/{accountId}/party → OBReadParty2 (parallel)"
      - "GET /accounts/{accountId}/parties → OBReadParty3 (parallel)"
      - "Merge results by PartyId into unified OBParty2; pick first on conflict"
    error_handling:
      http_401: "emit PartyUiState.Error('Session expired. Please re-authenticate.', PartyErrorCode.AUTH)"
      http_403: "emit PartyUiState.ConsentRequired"
      http_404: "emit PartyUiState.Empty"
      http_200_empty: "emit PartyUiState.Empty when Data.Party absent and Data.Party[] is empty"
      network: "emit PartyUiState.Error(e.localizedMessage, PartyErrorCode.NETWORK)"

  - name: retry_load
    signature: "suspend fun retryLoad(accountId: String)"
    state_mutations:
      - "delegates to partyLoad(accountId)"
    side_effects: []
    error_handling: {}

  - name: reauthorise
    signature: "fun navigateToConsent()"
    state_mutations: []
    side_effects:
      - "Navigate to consent-list (Manage consents) screen"
    error_handling: {}

error_cases:
  - code: HTTP_401
    description: "PSU access token expired; re-authentication required."
  - code: HTTP_403_PERMISSION_NOT_GRANTED
    description: "Consent scope does not include ReadParty; guide user to re-consent flow via the consent-list (Manage consents) screen."
  - code: HTTP_404
    description: "No OBParty2/OBParty3 data associated with this AccountId."
  - code: HTTP_200_EMPTY
    description: "HSBC returned 200 but OBReadParty2.Data.Party is absent and OBReadParty3.Data.Party[] is empty."
  - code: NETWORK_ERROR
    description: "Device offline or AIS endpoint unreachable."
  - code: MERGE_CONFLICT
    description: "Parallel party + parties responses return conflicting PartyId; surface first result per pick_first: true."

test_fixtures:
