sibling: flow
schema_version: "4.0"
feature_id: consumer-home
flow_ids:
  - consumer-banking
navigates_to:
  - accounts
  - transactions
  - send-money
  - standing-orders
  - cards
  - notifications
  - transaction-detail
flow_logic:
  - trigger: ch_notification_icon.tap
    condition: "always"
    action: navigate
    target: notifications
  - trigger: ch_see_all_link.tap
    condition: "always"
    action: navigate
    target: transactions
  - trigger: ch_see_all_button.tap
    condition: "always"
    action: navigate
    target: transactions
  - trigger: ch_transaction_item.tap
    condition: "transaction selected"
    action: navigate
    target: transaction-detail
  - trigger: ch_action_send.tap
    condition: "always"
    action: navigate
    target: send-money
  - trigger: ch_action_accounts.tap
    condition: "always"
    action: navigate
    target: accounts
  - trigger: ch_action_standing_orders.tap
    condition: "always"
    action: navigate
    target: standing-orders
  - trigger: ch_action_cards.tap
    condition: "always"
    action: navigate
    target: cards
  - trigger: ch_retry_button.tap
    condition: "state == error"
    action: retry_load
    target: consumer-home
journey_ids:
  - consumer-accounts-payments
  - consumer-insights-utilities
