sibling: flow
schema_version: "4.0"
feature_id: consumer-home
flow_ids:
  - consumer-banking
navigates_to:
  - accounts
  - transactions
  - send-money
  - standing-orders
  - cards
  - notifications
  - transaction-detail
flow_logic:
  - trigger: open_notifications
    action: navigate_to_notifications
  - trigger: see_all_transactions
    action: navigate_to_transactions
  - trigger: transaction_item_tap
    action: navigate_to_transaction_detail
  - trigger: quick_action_send
    action: navigate_to_send_money
  - trigger: quick_action_accounts
    action: navigate_to_accounts
  - trigger: quick_action_standing_orders
    action: navigate_to_standing_orders
  - trigger: quick_action_cards
    action: navigate_to_cards
  - trigger: retry_load
    action: reload_accounts_and_transactions
journey_ids:
  - consumer-accounts-payments
  - consumer-insights-utilities
