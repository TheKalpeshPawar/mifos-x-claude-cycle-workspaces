sibling: ui
schema_version: "4.0"
feature_id: consumer-home
id: consumer-home
name: "Consumer Home"
feature: consumer-home
flavor: consumer
status: enriched
quality_score: 96
contract_version: "1.0.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-019, home, dashboard, consumer]
status_history:
  - status: draft
    timestamp: "2026-05-29T00:00:00Z"
    by: "/idea add"
  - from: draft
    to: enriched
    at: "2026-05-29"
    by: "/idea enrich"

screens:
  - id: consumer-home
    name: "Consumer Home"
    archetype: dashboard
    route: /consumer/home
    scroll: vertical
    viewmodel: "ConsumerHomeViewModel"
    shell:
      top_app_bar:
        show: false
      bottom_nav: true
      nav_items:
        - id: nav_home
          label: Home
          icon: home
          target: consumer-home
          active: true
        - id: nav_accounts
          label: Accounts
          icon: account_balance
          target: accounts
        - id: nav_pay
          label: Pay
          icon: send
          target: send-money
        - id: nav_cards
          label: Cards
          icon: credit_card
          target: cards
        - id: nav_more
          label: More
          icon: more_horiz
          target: settings

components:
  - type: stack
    id: ch_root
    variant: column
    supported_states: [loading, content, error, empty]
    style:
      background: "#F9FAEF"
    children:
      - ch_header_band
      - ch_balance_card
      - ch_quick_actions_row
      - ch_recent_transactions_section
      - ch_error_state
      - ch_empty_state
      - ch_loading_shimmer

  # ── Header Band ───────────────────────────────────────────────────────

  - type: stack
    id: ch_header_band
    variant: row
    supported_states: [content, loading]
    style:
      orientation: horizontal
      background: "#4C662B"
      padding_horizontal: spacing.md
      padding_top: spacing.xl
      padding_bottom: spacing.lg
      align: center
    children:
      - ch_greeting_text
      - ch_notification_icon

  - type: text
    id: ch_greeting_text
    content: "Good morning, Alex"
    style:
      typography: "Outfit/headline_medium"
      color: "#FFFFFF"
      flex: 1
    a11y:
      role: heading
      level: 1
      label: "Good morning, Alex"
    test_context:
      tag: ch_greeting_text
      assert_text: "Good morning, Alex"
      data_driven: true

  - type: button
    id: ch_notification_icon
    label: ""
    variant: text
    badge: true
    icon_start: "notifications"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: transparent
      color: "#FFFFFF"
      icon_size: 28
      min_height: 48
      min_width: 48
    on_click:
      action: navigate
      target: notifications
    a11y:
      label: "Notifications — 3 unread"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_notification_icon
      interaction_type: action

  # ── Balance Card ──────────────────────────────────────────────────────

  - type: card
    id: ch_balance_card
    variant: elevated
    supported_states: [content]
    style:
      background: "#FFFFFF"
      border_radius: 20
      elevation: 4
      margin_horizontal: spacing.md
      margin_top: "-24dp"
      padding_horizontal: spacing.lg
      padding_vertical: spacing.lg
    children:
      - ch_balance_label
      - ch_balance_amount
      - ch_account_name_chip
      - ch_balance_divider
      - ch_balance_sub_row

  - type: text
    id: ch_balance_label
    content: "Total Balance"
    style:
      typography: "Outfit/label_medium"
      color: "#757575"
    a11y:
      label: "Total balance label"
      role: none
    test_context:
      tag: ch_balance_label
      assert_text: "Total Balance"

  - type: text
    id: ch_balance_amount
    content: "£4,250.00"
    style:
      typography: "Outfit/display_small"
      color: "#4C662B"
      font_weight: bold
      padding_top: spacing.xs
    a11y:
      label: "Total balance: £4,250.00"
      role: text
    test_context:
      tag: ch_balance_amount
      assert_text: "£4,250.00"
      data_driven: true

  - type: box
    id: ch_account_name_chip
    content: "Primary Checking"
    variant: status
    style:
      background: "#CDEDA3"
      border_radius: 12
      padding_horizontal: 10
      padding_vertical: 4
      text_color: "#4C662B"
      typography: "Outfit/label_small"
      margin_top: spacing.xs
      align_self: start
    a11y:
      label: "Account: Primary Checking"
      role: text
    test_context:
      tag: ch_account_name_chip
      assert_text: "Primary Checking"
      data_driven: true

  - type: divider
    id: ch_balance_divider
    style:
      margin_vertical: spacing.md
      color: "#E8E8E8"

  - type: stack
    id: ch_balance_sub_row
    variant: row
    style:
      orientation: horizontal
      justify: space_between
    children:
      - ch_income_block
      - ch_expense_block

  - type: stack
    id: ch_income_block
    variant: column
    children:
      - ch_income_label
      - ch_income_amount

  - type: text
    id: ch_income_label
    content: "Income this month"
    style:
      typography: "Outfit/label_small"
      color: "#757575"
    a11y:
      role: none
    test_context:
      tag: ch_income_label
      assert_text: "Income this month"

  - type: text
    id: ch_income_amount
    content: "+ £3,200.00"
    style:
      typography: "Outfit/body_large"
      color: "#2E7D32"
      font_weight: medium
    a11y:
      label: "Income this month: £3,200"
      role: text
    test_context:
      tag: ch_income_amount
      data_driven: true

  - type: stack
    id: ch_expense_block
    variant: column
    children:
      - ch_expense_label
      - ch_expense_amount

  - type: text
    id: ch_expense_label
    content: "Spent this month"
    style:
      typography: "Outfit/label_small"
      color: "#757575"
    a11y:
      role: none
    test_context:
      tag: ch_expense_label
      assert_text: "Spent this month"

  - type: text
    id: ch_expense_amount
    content: "- £1,840.00"
    style:
      typography: "Outfit/body_large"
      color: "#C62828"
      font_weight: medium
    a11y:
      label: "Spent this month: £1,840"
      role: text
    test_context:
      tag: ch_expense_amount
      data_driven: true

  # ── Quick Actions ─────────────────────────────────────────────────────

  - type: stack
    id: ch_quick_actions_row
    variant: row
    supported_states: [content]
    style:
      orientation: horizontal
      justify: space_evenly
      padding_horizontal: spacing.md
      padding_vertical: spacing.lg
      background: "#F9FAEF"
    a11y:
      label: "Quick actions"
      role: group
    children:
      - ch_action_send
      - ch_action_accounts
      - ch_action_standing_orders
      - ch_action_cards

  - type: stack
    id: ch_action_send
    variant: column
    style:
      align: center
      spacing: spacing.xs
    on_click:
      action: navigate
      target: send-money
    a11y:
      label: "Send money"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_action_send
      interaction_type: action

  - type: stack
    id: ch_action_accounts
    variant: column
    style:
      align: center
      spacing: spacing.xs
    on_click:
      action: navigate
      target: accounts
    a11y:
      label: "View accounts"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_action_accounts
      interaction_type: action

  - type: stack
    id: ch_action_standing_orders
    variant: column
    style:
      align: center
      spacing: spacing.xs
    on_click:
      action: navigate
      target: standing-orders
    a11y:
      label: "Standing orders"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_action_standing_orders
      interaction_type: action

  - type: stack
    id: ch_action_cards
    variant: column
    style:
      align: center
      spacing: spacing.xs
    on_click:
      action: navigate
      target: cards
    a11y:
      label: "My cards"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_action_cards
      interaction_type: action

  # ── Recent Transactions ───────────────────────────────────────────────

  - type: stack
    id: ch_recent_transactions_section
    variant: column
    supported_states: [content]
    style:
      padding_horizontal: spacing.md
      padding_top: spacing.sm
    children:
      - ch_transactions_header_row
      - ch_transaction_item_1
      - ch_transaction_item_2
      - ch_transaction_item_3
      - ch_see_all_button

  - type: stack
    id: ch_transactions_header_row
    variant: row
    style:
      orientation: horizontal
      align: center
      justify: space_between
      padding_bottom: spacing.sm
    children:
      - ch_transactions_title
      - ch_see_all_link

  - type: text
    id: ch_transactions_title
    content: "Recent Transactions"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
    a11y:
      role: heading
      level: 2
      label: "Recent Transactions"
    test_context:
      tag: ch_transactions_title
      assert_text: "Recent Transactions"

  - type: text
    id: ch_see_all_link
    content: "See all"
    style:
      typography: "Outfit/label_medium"
      color: "#4C662B"
    on_click:
      action: navigate
      target: transactions
    a11y:
      label: "See all transactions"
      role: link
    keyboard:
      focusable: true
    test_context:
      tag: ch_see_all_link
      interaction_type: action

  - type: box
    id: ch_transaction_item_1
    content: "Coffee Shop — £3.50"
    variant: list_item
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding_horizontal: spacing.md
      padding_vertical: spacing.md
      margin_bottom: spacing.xs
      elevation: 1
    on_click:
      action: navigate
      target: transaction-detail
    a11y:
      label: "Coffee Shop. £3.50 debit. Today."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_transaction_item_1
      data_driven: true
      interaction_type: action

  - type: box
    id: ch_transaction_item_2
    content: "Salary — £3,200.00"
    variant: list_item
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding_horizontal: spacing.md
      padding_vertical: spacing.md
      margin_bottom: spacing.xs
      elevation: 1
    on_click:
      action: navigate
      target: transaction-detail
    a11y:
      label: "Salary credit. £3,200. Yesterday."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_transaction_item_2
      data_driven: true
      interaction_type: action

  - type: box
    id: ch_transaction_item_3
    content: "Supermarket — £42.80"
    variant: list_item
    style:
      background: "#FFFFFF"
      border_radius: 12
      padding_horizontal: spacing.md
      padding_vertical: spacing.md
      margin_bottom: spacing.xs
      elevation: 1
    on_click:
      action: navigate
      target: transaction-detail
    a11y:
      label: "Supermarket. £42.80 debit. 2 days ago."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_transaction_item_3
      data_driven: true
      interaction_type: action

  - type: button
    id: ch_see_all_button
    label: "View All Transactions"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      variant: outlined
      border_color: "#4C662B"
      text_color: "#4C662B"
      border_radius: 24
      min_height: 48
      width: fill
      margin_top: spacing.sm
    on_click:
      action: navigate
      target: transactions
    a11y:
      label: "View all transactions"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_see_all_button
      assert_text: "View All Transactions"
      interaction_type: action

  # ── Error State ───────────────────────────────────────────────────────

  - type: stack
    id: ch_error_state
    variant: column
    supported_states: [error]
    visible_in_states: [error]
    style:
      align: center
      padding_horizontal: spacing.xl
      padding_top: spacing.xxl
    children:
      - ch_error_icon
      - ch_error_text
      - ch_retry_button

  - type: icon
    id: ch_error_icon
    content: "error_outline"
    style:
      color: "#D32F2F"
      size: 48
    a11y:
      label: ""
      role: presentation

  - type: text
    id: ch_error_text
    content: "Could not load your account. Check your connection and try again."
    style:
      typography: "Outfit/body_medium"
      color: "#757575"
      text_align: center
      margin_top: spacing.sm
    a11y:
      label: "Could not load your account. Check your connection and try again."
      role: alert
    test_context:
      tag: ch_error_text
      assert_visible_in: [error]

  - type: button
    id: ch_retry_button
    label: "Retry"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      border_radius: 24
      min_height: 48
      padding_horizontal: spacing.xl
      margin_top: spacing.md
    on_click:
      action: retry_load
    a11y:
      label: "Retry loading account data"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: ch_retry_button
      assert_text: "Retry"
      interaction_type: action

  # ── Empty State ───────────────────────────────────────────────────────

  - type: stack
    id: ch_empty_state
    variant: column
    supported_states: [empty]
    visible_in_states: [empty]
    style:
      align: center
      padding_horizontal: spacing.xl
      padding_top: spacing.xxl
    children:
      - ch_empty_icon
      - ch_empty_text

  - type: icon
    id: ch_empty_icon
    content: "account_balance_wallet"
    style:
      color: "#CDEDA3"
      size: 64
    a11y:
      label: ""
      role: presentation

  - type: text
    id: ch_empty_text
    content: "No accounts found. Contact your bank to set up your account."
    style:
      typography: "Outfit/body_medium"
      color: "#757575"
      text_align: center
      margin_top: spacing.md
    a11y:
      label: "No accounts found. Contact your bank to set up your account."
      role: text
    test_context:
      tag: ch_empty_text
      assert_visible_in: [empty]

  # ── Loading Shimmer ───────────────────────────────────────────────────

  - type: box
    id: ch_loading_shimmer
    content: ""
    supported_states: [loading]
    visible_in_states: [loading]
    variant: shimmer
    style:
      height: 200
      border_radius: 20
      margin_horizontal: spacing.md
      margin_top: spacing.md
    a11y:
      label: "Loading account data"
      role: progressbar
    test_context:
      tag: ch_loading_shimmer
      assert_visible_in: [loading]

# ── States ──────────────────────────────────────────────────────────────
states:
  loading:
    label: "Loading accounts and transactions"
    layout:
      components_visible:
        - ch_header_band
        - ch_greeting_text
      skeleton:
        - id: skeleton_balance_card
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 20
            height: 200
            margin_horizontal: 16
            margin_top: 24
        - id: skeleton_quick_actions
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 72
            margin_horizontal: 16
            margin_top: 16
        - id: skeleton_txn_1
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 64
            margin_horizontal: 16
            margin_top: 8
        - id: skeleton_txn_2
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 64
            margin_horizontal: 16
            margin_top: 8

  content:
    label: "Accounts and recent transactions loaded"
    layout:
      components_visible:
        - ch_header_band
        - ch_greeting_text
        - ch_notification_icon
        - ch_balance_card
        - ch_balance_label
        - ch_balance_amount
        - ch_account_name_chip
        - ch_balance_sub_row
        - ch_income_amount
        - ch_expense_amount
        - ch_quick_actions_row
        - ch_action_send
        - ch_action_accounts
        - ch_action_standing_orders
        - ch_action_cards
        - ch_recent_transactions_section
        - ch_transactions_title
        - ch_see_all_link
        - ch_transaction_item_1
        - ch_transaction_item_2
        - ch_transaction_item_3
        - ch_see_all_button

  error:
    label: "Failed to load — retry shown"
    layout:
      components_visible:
        - ch_header_band
        - ch_greeting_text
      error_card:
        id: ch_error_state
        icon: error_outline
        title: "Could not load your account"
        message: "Could not load your account. Check your connection and try again."
        action_label: "Retry"
        action: retry_load

  empty:
    label: "No accounts found"
    layout:
      components_visible:
        - ch_header_band
        - ch_greeting_text
      empty_card:
        id: ch_empty_state
        illustration: account_balance_wallet
        title: "No accounts found"
        message: "No accounts found. Contact your bank to set up your account."

# ── Responsive ──────────────────────────────────────────────────────────
responsive:
  mobile_only: false
  baseline_width: 390
  tablet:
    min_width: 600
    columns: 2
    content_max_width: 840
  desktop:
    min_width: 840
    columns: 3
    content_max_width: 1200

# ── State Model (MVI v3) ──────────────────────────────────────────────────
state_model:
  view_model: ConsumerHomeViewModel
  screen_state: ConsumerHomeScreenState
  initial_state: loading
  state_fields:
    - name: isLoading
      type: Boolean
      default: "true"
    - name: greetingName
      type: String
      default: '"Alex"'
    - name: totalBalance
      type: "BigDecimal?"
      default: "null"
    - name: primaryAccount
      type: "AccountSummary?"
      default: "null"
    - name: incomeThisMonth
      type: "BigDecimal?"
      default: "null"
    - name: spentThisMonth
      type: "BigDecimal?"
      default: "null"
    - name: recentTransactions
      type: "List<TransactionSummary>"
      default: "emptyList()"
    - name: unreadNotifications
      type: Int
      default: "0"
    - name: error
      type: "UiError?"
      default: "null"
  screen_state_members:
    - Loading
    - Content
    - Empty
    - Error
  errors:
    - id: network_error
      message: "Could not load your account. Check your connection and try again."
    - id: auth_error
      message: "Session expired. Please log in again."
    - id: unknown_error
      message: "Something went wrong. Please try again."
  events:
    - ScreenOpened
    - RetryLoad
    - OpenNotifications
    - NavigateToSendMoney
    - NavigateToAccounts
    - NavigateToStandingOrders
    - NavigateToCards
    - NavigateToTransactions
    - SelectTransaction
  actions:
    - name: loadConsumerHome
      triggers: [ScreenOpened, RetryLoad]
    - name: navigateTo
      param: screen_id
  di:
    - AccountsRepository
    - TransactionsRepository
    - NotificationsRepository
    - SessionManager

# ── Route ─────────────────────────────────────────────────────────────────
route:
  path: /consumer/home
  params: []

# ── Dependencies ────────────────────────────────────────────────────────
dependencies:
  tier: 1
  features:
    - login
    - accounts
    - transactions
    - send-money
    - standing-orders
    - cards
    - notifications

# ── Testing ─────────────────────────────────────────────────────────────
testing:
  scenarios:
    - { id: TC-CONSUMER-HOME-001, scenario: "Initial load shows loading shimmer", priority: P0 }
    - { id: TC-CONSUMER-HOME-002, scenario: "Successful load shows balance card and recent transactions", priority: P0 }
    - { id: TC-CONSUMER-HOME-003, scenario: "Load error shows retry button", priority: P0 }
    - { id: TC-CONSUMER-HOME-004, scenario: "Empty state shows no-accounts message", priority: P1 }
    - { id: TC-CONSUMER-HOME-005, scenario: "Tap transaction row navigates to transaction-detail", priority: P1 }
    - { id: TC-CONSUMER-HOME-006, scenario: "Tap See all navigates to transactions list", priority: P1 }
    - { id: TC-CONSUMER-HOME-007, scenario: "Quick action Send navigates to send-money", priority: P1 }
    - { id: TC-CONSUMER-HOME-008, scenario: "Tap notification icon navigates to notifications", priority: P1 }
    - { id: TC-CONSUMER-HOME-009, scenario: "401 on load redirects to login", priority: P0 }
  coverage_target: 80

# ── Documentation ─────────────────────────────────────────────────────────
documentation:
  user_stories:
    - { actor: consumer, action: "see a personalised greeting and total balance at a glance", benefit: "I immediately know my financial position when I open the app" }
    - { actor: consumer, action: "tap quick-action tiles for send / accounts / standing orders / cards", benefit: "I reach common tasks in one tap from home" }
    - { actor: consumer, action: "view my most recent transactions on the home screen", benefit: "I spot unexpected activity without opening the full list" }
  success_metrics:
    - { metric: quick_action_tap_rate, target: "55%" }
    - { metric: transaction_drilldown_rate, target: "40%" }
    - { metric: home_load_p95_ms, target: "1200" }
