<!doctype html>
<!-- render-hash: ch-content-01 -->
<html lang="en" data-screen="consumer-home" data-state="content" data-feature="consumer-home" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer Home — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --income: #2E7D32; --spend: #C62828; --pending: #E8A317; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --income: #2E7D32; --spend: #C62828; --pending: #E8A317; --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --income: #B2D188; --spend: #FFB4AB; --pending: #E8A317; --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --income: #B2D188; --spend: #FFB4AB; --pending: #E8A317; --nav-active-indicator: #354E16;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-surface); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; padding-bottom: 96px; }
    .header-band { background: var(--primary); padding: 40px 16px 36px; display: flex; align-items: center; gap: 12px; }
    .header-band .greeting { flex: 1; font-size: 24px; font-weight: 600; color: var(--on-primary); }
    .notif-btn { position: relative; width: 48px; height: 48px; border: 0; background: transparent; color: var(--on-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 24px; }
    .notif-btn .material-symbols-outlined { font-size: 28px; }
    .notif-btn .badge { position: absolute; top: 8px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--error); color: var(--on-error); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .balance-card { background: var(--surface); border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.10); margin: -24px 16px 0; padding: 20px; }
    .balance-card .label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
    .balance-card .amount { font-size: 36px; font-weight: 700; color: var(--primary); margin-top: 4px; letter-spacing: -0.5px; }
    .account-chip { display: inline-block; margin-top: 8px; background: var(--primary-container); color: var(--on-primary-container); border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: 500; }
    .balance-divider { height: 1px; background: var(--outline-variant); margin: 16px 0; }
    .balance-sub { display: flex; justify-content: space-between; }
    .sub-block .sub-label { font-size: 12px; font-weight: 400; color: var(--on-surface-variant); }
    .sub-block .sub-amount { font-size: 16px; font-weight: 500; margin-top: 2px; }
    .sub-amount.income { color: var(--income); }
    .sub-amount.spend { color: var(--spend); }
    .quick-actions { display: flex; justify-content: space-evenly; padding: 20px 8px; }
    .qa-tile { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; font-family: var(--font-display); }
    .qa-icon { width: 56px; height: 56px; border-radius: 18px; background: var(--surface-container-high); display: flex; align-items: center; justify-content: center; }
    .qa-icon .material-symbols-outlined { font-size: 26px; color: var(--primary); }
    .qa-tile .qa-label { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); }
    .txn-section { padding: 4px 16px 0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
    .section-header h2 { font-size: 17px; font-weight: 600; color: var(--on-surface); }
    .section-header .link { font-size: 13px; font-weight: 500; color: var(--primary); background: none; border: 0; cursor: pointer; font-family: var(--font-display); }
    .txn-row { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; width: 100%; font-family: var(--font-display); }
    .txn-icon { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .txn-icon.debit { background: var(--surface-variant); color: var(--on-surface-variant); }
    .txn-icon.credit { background: var(--secondary-container); color: var(--on-secondary-container); }
    .txn-icon .material-symbols-outlined { font-size: 20px; }
    .txn-body { flex: 1; min-width: 0; }
    .txn-merchant { font-size: 14px; font-weight: 500; color: var(--on-surface); }
    .txn-when { font-size: 12px; font-weight: 400; color: var(--outline); margin-top: 2px; }
    .txn-amount { font-size: 14px; font-weight: 600; }
    .txn-amount.debit { color: var(--spend); }
    .txn-amount.credit { color: var(--income); }
    .see-all-btn { width: 100%; min-height: 48px; margin-top: 8px; border: 1px solid var(--primary); border-radius: 24px; background: transparent; color: var(--primary); font-family: var(--font-display); font-size: 14px; font-weight: 500; cursor: pointer; }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; background: var(--surface-container); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: 8px 0 10px; height: 64px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 4px 12px; border-radius: 16px; min-width: 56px; text-decoration: none; }
    .nav-item .material-symbols-outlined { font-size: 24px; color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
    .nav-item.active { background: var(--nav-active-indicator); }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { left: 8px; top: 8px; background: var(--primary); color: var(--on-primary); padding: 8px; border-radius: 6px; z-index: 100; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content">
    <header class="header-band" data-component-type="stack" data-component-id="ch_header_band" style="padding-top:40px">
      <h1 class="greeting" data-component-type="text" data-component-id="ch_greeting_text" role="heading" aria-level="1">Good morning, Alex</h1>
      <button class="notif-btn" type="button" data-nav-to="notifications" data-component-type="button" data-component-id="ch_notification_icon" aria-label="Notifications — 3 unread">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        <span class="badge" aria-hidden="true">3</span>
      </button>
    </header>

    <section class="balance-card" data-component-type="card" data-component-id="ch_balance_card" role="region" aria-label="Total balance: £4,250.00, Primary Checking">
      <div class="label" data-component-type="text" data-component-id="ch_balance_label">Total Balance</div>
      <div class="amount" data-component-type="text" data-component-id="ch_balance_amount">£4,250.00</div>
      <span class="account-chip" data-component-type="box" data-component-id="ch_account_name_chip">Primary Checking</span>
      <div class="balance-divider" data-component-type="divider" data-component-id="ch_balance_divider" aria-hidden="true"></div>
      <div class="balance-sub" data-component-type="stack" data-component-id="ch_balance_sub_row">
        <div class="sub-block" data-component-type="stack" data-component-id="ch_income_block">
          <div class="sub-label" data-component-type="text" data-component-id="ch_income_label">Income this month</div>
          <div class="sub-amount income" data-component-type="text" data-component-id="ch_income_amount" aria-label="Income this month: £3,200">+ £3,200.00</div>
        </div>
        <div class="sub-block" data-component-type="stack" data-component-id="ch_expense_block">
          <div class="sub-label" data-component-type="text" data-component-id="ch_expense_label">Spent this month</div>
          <div class="sub-amount spend" data-component-type="text" data-component-id="ch_expense_amount" aria-label="Spent this month: £1,840">- £1,840.00</div>
        </div>
      </div>
    </section>

    <section class="quick-actions" data-component-type="stack" data-component-id="ch_quick_actions_row" role="group" aria-label="Quick actions">
      <button class="qa-tile" type="button" data-nav-to="send-money" data-component-type="stack" data-component-id="ch_action_send" aria-label="Send money">
        <span class="qa-icon"><span class="material-symbols-outlined" aria-hidden="true">send</span></span>
        <span class="qa-label">Send</span>
      </button>
      <button class="qa-tile" type="button" data-nav-to="accounts" data-component-type="stack" data-component-id="ch_action_accounts" aria-label="View accounts">
        <span class="qa-icon"><span class="material-symbols-outlined" aria-hidden="true">account_balance</span></span>
        <span class="qa-label">Accounts</span>
      </button>
      <button class="qa-tile" type="button" data-nav-to="standing-orders" data-component-type="stack" data-component-id="ch_action_standing_orders" aria-label="Standing orders">
        <span class="qa-icon"><span class="material-symbols-outlined" aria-hidden="true">repeat</span></span>
        <span class="qa-label">Standing</span>
      </button>
      <button class="qa-tile" type="button" data-nav-to="cards" data-component-type="stack" data-component-id="ch_action_cards" aria-label="My cards">
        <span class="qa-icon"><span class="material-symbols-outlined" aria-hidden="true">credit_card</span></span>
        <span class="qa-label">Cards</span>
      </button>
    </section>

    <section class="txn-section" data-component-type="stack" data-component-id="ch_recent_transactions_section">
      <div class="section-header" data-component-type="stack" data-component-id="ch_transactions_header_row">
        <h2 data-component-type="text" data-component-id="ch_transactions_title" role="heading" aria-level="2">Recent Transactions</h2>
        <button class="link" type="button" data-nav-to="transactions" data-component-type="text" data-component-id="ch_see_all_link" aria-label="See all transactions">See all</button>
      </div>

      <button class="txn-row" type="button" data-nav-to="transaction-detail" data-component-type="box" data-component-id="ch_transaction_item_1" aria-label="Coffee Shop. £3.50 debit. Today.">
        <span class="txn-icon debit"><span class="material-symbols-outlined" aria-hidden="true">local_cafe</span></span>
        <span class="txn-body">
          <span class="txn-merchant">Coffee Shop</span>
          <span class="txn-when">Today</span>
        </span>
        <span class="txn-amount debit">− £3.50</span>
      </button>

      <button class="txn-row" type="button" data-nav-to="transaction-detail" data-component-type="box" data-component-id="ch_transaction_item_2" aria-label="Salary credit. £3,200. Yesterday.">
        <span class="txn-icon credit"><span class="material-symbols-outlined" aria-hidden="true">payments</span></span>
        <span class="txn-body">
          <span class="txn-merchant">Salary</span>
          <span class="txn-when">Yesterday</span>
        </span>
        <span class="txn-amount credit">+ £3,200.00</span>
      </button>

      <button class="txn-row" type="button" data-nav-to="transaction-detail" data-component-type="box" data-component-id="ch_transaction_item_3" aria-label="Supermarket. £42.80 debit. 2 days ago.">
        <span class="txn-icon debit"><span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span></span>
        <span class="txn-body">
          <span class="txn-merchant">Supermarket</span>
          <span class="txn-when">2 days ago</span>
        </span>
        <span class="txn-amount debit">− £42.80</span>
      </button>

      <button class="see-all-btn" type="button" data-nav-to="transactions" data-component-type="button" data-component-id="ch_see_all_button" aria-label="View all transactions">View All Transactions</button>
    </section>
  </main>

  <nav data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item active" data-nav-to="consumer-home" data-component-type="nav-item" data-component-id="nav_home" aria-current="page" aria-label="Home">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item" data-nav-to="accounts" data-component-type="nav-item" data-component-id="nav_accounts" aria-label="Accounts">
      <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      <span class="nav-label">Accounts</span>
    </a>
    <a class="nav-item" data-nav-to="send-money" data-component-type="nav-item" data-component-id="nav_pay" aria-label="Pay">
      <span class="material-symbols-outlined" aria-hidden="true">send</span>
      <span class="nav-label">Pay</span>
    </a>
    <a class="nav-item" data-nav-to="cards" data-component-type="nav-item" data-component-id="nav_cards" aria-label="Cards">
      <span class="material-symbols-outlined" aria-hidden="true">credit_card</span>
      <span class="nav-label">Cards</span>
    </a>
    <a class="nav-item" data-nav-to="settings" data-component-type="nav-item" data-component-id="nav_more" aria-label="More">
      <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      <span class="nav-label">More</span>
    </a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
