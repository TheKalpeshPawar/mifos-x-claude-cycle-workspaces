sibling: data-flow
schema_version: "4.0"
feature_id: consumer-home
entries:
  - screen_id: consumer-home
    trigger: on_mount
    endpoints:
      - obp_get_accounts
      - obp_get_transactions
    direction: read
    dtos:
      - name: Account
        role: response
        api_id: obp_get_accounts
      - name: Transaction
        role: response
        api_id: obp_get_transactions
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: error_state
      - error_code: 500
        behavior: error_state

  - screen_id: consumer-home
    trigger: on_interact
    event: RetryLoad
    endpoints:
      - obp_get_accounts
      - obp_get_transactions
    direction: read
    dtos:
      - name: Account
        role: response
        api_id: obp_get_accounts
      - name: Transaction
        role: response
        api_id: obp_get_transactions
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: error_state
      - error_code: 500
        behavior: error_state

  - screen_id: consumer-home
    trigger: on_interact
    event: OpenNotifications
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to notifications; no network call"

  - screen_id: consumer-home
    trigger: on_interact
    event: QuickActionSelected
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to send-money / accounts / standing-orders / cards; no network call"

  - screen_id: consumer-home
    trigger: on_interact
    event: TransactionSelected
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to transaction-detail; no network call"

  - screen_id: consumer-home
    trigger: on_interact
    event: SeeAllTransactions
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to transactions list; no network call"
