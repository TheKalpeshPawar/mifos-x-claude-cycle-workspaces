<!doctype html>
<!-- render-hash: sod-error-llm -->
<html lang="en" data-screen="standing-order-detail" data-state="error" data-feature="standing-orders" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing Order — Error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root {
  --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
  --secondary:#386663; --tertiary:#386663; --tertiary-container:#BCEBE7;
  --error:#BA1A1A; --error-container:#FFDAD6;
  --background:#F9FAEF; --on-background:#1A1C16;
  --surface:#FFFFFF; --on-surface:#1A1C16;
  --surface-variant:#E1E4D5; --on-surface-variant:#44483D;
  --surface-container:#F0F1E6;
  --outline:#75796C; --outline-variant:#C5C8BA;
  --pending:#E8A317;
}
:root[data-theme="dark"] {
  --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
  --secondary:#A0CFCB; --tertiary:#A0CFCB; --tertiary-container:#1F4F4B;
  --error:#FFB4AB; --error-container:#93000A;
  --background:#12140E; --on-background:#E3E3D8;
  --surface:#1E201A; --on-surface:#E3E3D8;
  --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
  --surface-container:#252720;
  --outline:#8F9285; --outline-variant:#44483D;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
    --secondary:#A0CFCB; --tertiary:#A0CFCB; --tertiary-container:#1F4F4B;
    --error:#FFB4AB; --error-container:#93000A;
    --background:#12140E; --on-background:#E3E3D8;
    --surface:#1E201A; --on-surface:#E3E3D8;
    --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
    --surface-container:#252720;
    --outline:#8F9285; --outline-variant:#44483D;
  }
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:var(--icon-md);line-height:1;vertical-align:middle;user-select:none}
header[data-shell="top-app-bar"]{display:flex;align-items:center;gap:4px;padding:10px 4px 10px 4px;background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10}
.top-bar-back{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;cursor:pointer;border:none;background:transparent;color:var(--on-surface-variant);flex-shrink:0}
.top-bar-back .material-symbols-outlined{font-size:var(--icon-md)}
.top-bar-title{font-size:22px;font-weight:600;color:var(--on-surface);letter-spacing:-0.2px;flex:1}
main[data-shell="content"]{flex:1;display:flex;flex-direction:column;padding-top:8px;padding-bottom:32px}
.error-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 32px;gap:16px}
.error-icon-circle{width:96px;height:96px;border-radius:48px;background:var(--error-container);display:flex;align-items:center;justify-content:center}
.error-icon-circle .material-symbols-outlined{font-size:var(--icon-2xl) !important;color:var(--error)}
.error-title{font-size:20px;font-weight:600;color:var(--on-surface)}
.error-message{font-size:14px;color:var(--on-surface-variant);max-width:292px;line-height:1.55}
.btn-retry{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 32px;border-radius:12px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--primary);min-height:48px;margin-top:4px}
.btn-retry:hover,.btn-retry:focus-visible{background:var(--primary-container);outline:none}
.btn-retry .material-symbols-outlined{font-size:var(--icon-sm) !important}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="standing-order-detail" data-state="error">

  <header data-shell="top-app-bar">
    <button class="top-bar-back" data-nav-to="standing-orders" aria-label="Go back to standing orders" tabindex="0">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <span class="top-bar-title">Standing Order</span>
  </header>

  <main data-shell="content" data-state="error">

    <div class="error-wrap" data-component-type="stack" data-component-id="sod_error_state" data-component-variant="column" role="alert" aria-live="assertive">

      <div class="error-icon-circle" data-component-type="LayoutBox" data-component-id="sod_error_icon_wrap">
        <span class="material-symbols-outlined" data-component-type="icon" data-component-id="sod_error_icon" aria-hidden="true">cloud_off</span>
      </div>

      <span class="error-title" data-component-type="text" data-component-id="sod_error_title">
        Standing Order Not Found
      </span>

      <p class="error-message" data-component-type="text" data-component-id="sod_error_message">
        We could not load this standing order. It may have been cancelled or there may be a connection issue.
      </p>

      <button class="btn-retry"
              data-component-type="button" data-component-id="sod_retry_button" data-component-variant="text"
              data-action="onRetry"
              aria-label="Retry loading standing order"
              tabindex="0">
        <span class="material-symbols-outlined">refresh</span>
        Retry
      </button>

    </div>

  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
