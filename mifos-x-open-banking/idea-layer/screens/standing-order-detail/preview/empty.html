<!doctype html>
<!-- render-hash: sod-empty-llm -->
<html lang="en" data-screen="standing-order-detail" data-state="empty" data-feature="standing-orders" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing Order — Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root {
  --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
  --secondary:#386663; --tertiary:#386663; --tertiary-container:#BCEBE7;
  --error:#BA1A1A; --error-container:#FFDAD6;
  --background:#F9FAEF; --on-background:#1A1C16;
  --surface:#FFFFFF; --on-surface:#1A1C16;
  --surface-variant:#E1E4D5; --on-surface-variant:#44483D;
  --surface-container:#F0F1E6;
  --outline:#75796C; --outline-variant:#C5C8BA;
  --pending:#E8A317;
}
:root[data-theme="dark"] {
  --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
  --secondary:#A0CFCB; --tertiary:#A0CFCB; --tertiary-container:#1F4F4B;
  --error:#FFB4AB; --error-container:#93000A;
  --background:#12140E; --on-background:#E3E3D8;
  --surface:#1E201A; --on-surface:#E3E3D8;
  --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
  --surface-container:#252720;
  --outline:#8F9285; --outline-variant:#44483D;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
    --secondary:#A0CFCB; --tertiary:#A0CFCB; --tertiary-container:#1F4F4B;
    --error:#FFB4AB; --error-container:#93000A;
    --background:#12140E; --on-background:#E3E3D8;
    --surface:#1E201A; --on-surface:#E3E3D8;
    --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
    --surface-container:#252720;
    --outline:#8F9285; --outline-variant:#44483D;
  }
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:var(--icon-md);line-height:1;vertical-align:middle;user-select:none}
header[data-shell="top-app-bar"]{display:flex;align-items:center;gap:4px;padding:10px 4px 10px 4px;background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10}
.top-bar-back{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;cursor:pointer;border:none;background:transparent;color:var(--on-surface-variant);flex-shrink:0}
.top-bar-back .material-symbols-outlined{font-size:var(--icon-md)}
.top-bar-title{font-size:22px;font-weight:600;color:var(--on-surface);letter-spacing:-0.2px;flex:1}
main[data-shell="content"]{flex:1;display:flex;flex-direction:column;padding-top:8px;padding-bottom:32px}
.empty-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 32px;gap:20px}
.empty-illustration{width:96px;height:96px}
.empty-headline{font-size:18px;font-weight:600;color:var(--on-surface);letter-spacing:-0.2px}
.empty-msg{font-size:15px;color:var(--on-surface-variant);max-width:272px;line-height:1.55}
.btn-back{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 28px;border-radius:12px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--primary);min-height:48px}
.btn-back:hover,.btn-back:focus-visible{background:var(--primary-container);outline:none}
.btn-back .material-symbols-outlined{font-size:var(--icon-sm) !important}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="standing-order-detail" data-state="empty">

  <header data-shell="top-app-bar">
    <button class="top-bar-back" data-nav-to="standing-orders" aria-label="Go back to standing orders" tabindex="0">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <span class="top-bar-title">Standing Order</span>
  </header>

  <main data-shell="content" data-state="empty">

    <div class="empty-wrap" data-component-type="stack" data-component-id="sod_empty_state" data-component-variant="column" role="region" aria-label="Standing order not found">

      <svg class="empty-illustration" data-component-type="icon" data-component-id="sod_empty_icon" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="No standing order found" role="img">
        <circle cx="48" cy="48" r="44" fill="var(--surface-variant)" opacity="0.6"/>
        <rect x="26" y="30" width="44" height="36" rx="8" fill="var(--outline-variant)"/>
        <rect x="32" y="39" width="20" height="4" rx="2" fill="var(--outline)"/>
        <rect x="32" y="48" width="14" height="3" rx="1.5" fill="var(--outline)" opacity="0.6"/>
        <rect x="32" y="56" width="24" height="3" rx="1.5" fill="var(--outline)" opacity="0.4"/>
        <circle cx="72" cy="72" r="14" fill="var(--error-container)"/>
        <path d="M66 72h12M72 66v12" stroke="var(--error)" stroke-width="2.5" stroke-linecap="round" transform="rotate(45 72 72)"/>
      </svg>

      <span class="empty-headline" data-component-type="text" data-component-id="sod_empty_title">Order Not Found</span>

      <p class="empty-msg" data-component-type="text" data-component-id="sod_empty_message">
        No details are available for this standing order. The mandate may have been cancelled or is no longer accessible.
      </p>

      <button class="btn-back"
              data-component-type="button" data-component-id="sod_back_to_list_button" data-component-variant="text"
              data-nav-to="standing-orders"
              aria-label="Go back to standing orders list"
              tabindex="0">
        <span class="material-symbols-outlined">arrow_back</span>
        Go Back
      </button>

    </div>

  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
