<!doctype html>
<!-- render-hash: sod-loading-llm -->
<html lang="en" data-theme="dark" data-screen="standing-order-detail" data-state="loading" data-feature="standing-orders" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing Order — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root {
  --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
  --secondary:#386663; --tertiary:#386663; --tertiary-container:#BCEBE7;
  --error:#BA1A1A; --error-container:#FFDAD6;
  --background:#F9FAEF; --on-background:#1A1C16;
  --surface:#FFFFFF; --on-surface:#1A1C16;
  --surface-variant:#E1E4D5; --on-surface-variant:#44483D;
  --surface-container:#F0F1E6;
  --outline:#75796C; --outline-variant:#C5C8BA;
  --pending:#E8A317;
}
:root[data-theme="dark"] {
  --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
  --secondary:#A0CFCB; --tertiary:#A0CFCB; --tertiary-container:#1F4F4B;
  --error:#FFB4AB; --error-container:#93000A;
  --background:#12140E; --on-background:#E3E3D8;
  --surface:#1E201A; --on-surface:#E3E3D8;
  --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
  --surface-container:#252720;
  --outline:#8F9285; --outline-variant:#44483D;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
    --secondary:#A0CFCB; --tertiary:#A0CFCB; --tertiary-container:#1F4F4B;
    --error:#FFB4AB; --error-container:#93000A;
    --background:#12140E; --on-background:#E3E3D8;
    --surface:#1E201A; --on-surface:#E3E3D8;
    --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
    --surface-container:#252720;
    --outline:#8F9285; --outline-variant:#44483D;
  }
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:var(--icon-md);line-height:1;vertical-align:middle;user-select:none}
header[data-shell="top-app-bar"]{display:flex;align-items:center;gap:4px;padding:10px 4px 10px 4px;background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10}
.top-bar-back{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:none;background:transparent;color:var(--on-surface-variant);flex-shrink:0}
.top-bar-back .material-symbols-outlined{font-size:var(--icon-md)}
.top-bar-title{font-size:22px;font-weight:600;color:var(--on-surface);letter-spacing:-0.2px;flex:1}
main[data-shell="content"]{flex:1;display:flex;flex-direction:column;padding-top:8px;padding-bottom:32px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,var(--surface-variant) 25%,var(--surface-container) 50%,var(--surface-variant) 75%);background-size:200% 100%;animation:shimmer 1.5s linear infinite;border-radius:8px}
.sk-card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 16px 12px;padding:16px}
.sk-section-label{height:11px;width:100px;margin-bottom:14px}
.sk-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.sk-row+.sk-row{border-top:1px solid var(--surface-variant)}
.sk-label{height:13px;width:90px;border-radius:6px}
.sk-val-md{height:13px;width:120px;border-radius:6px}
.sk-val-sm{height:13px;width:80px;border-radius:6px}
.sk-amount-big{height:34px;width:140px;margin-top:6px;border-radius:10px}
.sk-currency{height:24px;width:48px;border-radius:6px;margin-top:6px;margin-left:10px}
.amount-skeleton-row{display:flex;align-items:center}
.sk-hist-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;min-height:60px}
.sk-hist-row+.sk-hist-row{border-top:1px solid var(--surface-variant)}
.sk-hist-left{display:flex;flex-direction:column;gap:6px}
.sk-hist-date{height:13px;width:88px;border-radius:6px}
.sk-hist-status{height:11px;width:60px;border-radius:6px}
.sk-hist-amount{height:13px;width:72px;border-radius:6px}
.sk-btn-row{display:flex;gap:10px;padding:4px 16px 8px}
.sk-btn{flex:1;height:48px;border-radius:12px}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="standing-order-detail" data-state="loading">

  <header data-shell="top-app-bar">
    <button class="top-bar-back" aria-label="Back" tabindex="-1" aria-hidden="true">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <span class="top-bar-title">Standing Order</span>
  </header>

  <main data-shell="content" data-state="loading" aria-busy="true" aria-label="Loading standing order details">

    <!-- Skeleton: Recipient Card -->
    <div class="sk-card" data-component-type="skeleton" data-component-id="sod_loading_skeleton" data-component-variant="detail" aria-hidden="true">
      <div class="sk sk-section-label"></div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-md"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-sm"></div>
      </div>
    </div>

    <!-- Skeleton: Schedule Card -->
    <div class="sk-card" data-component-type="skeleton" data-component-id="sod_loading_skeleton_schedule" data-component-variant="detail" aria-hidden="true">
      <div class="sk sk-section-label"></div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-sm"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-md"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-md"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-md"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-md"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-label"></div>
        <div class="sk sk-val-sm"></div>
      </div>
    </div>

    <!-- Skeleton: Amount Card -->
    <div class="sk-card" data-component-type="skeleton" data-component-id="sod_loading_skeleton_amount" data-component-variant="detail" aria-hidden="true">
      <div class="sk sk-section-label"></div>
      <div class="amount-skeleton-row">
        <div class="sk sk-amount-big"></div>
        <div class="sk sk-currency"></div>
      </div>
    </div>

    <!-- Skeleton: Recent Executions Card -->
    <div class="sk-card" data-component-type="skeleton" data-component-id="sod_loading_skeleton_history" data-component-variant="detail" aria-hidden="true">
      <div class="sk sk-section-label"></div>
      <div class="sk-hist-row">
        <div class="sk-hist-left">
          <div class="sk sk-hist-date"></div>
          <div class="sk sk-hist-status"></div>
        </div>
        <div class="sk sk-hist-amount"></div>
      </div>
      <div class="sk-hist-row">
        <div class="sk-hist-left">
          <div class="sk sk-hist-date"></div>
          <div class="sk sk-hist-status"></div>
        </div>
        <div class="sk sk-hist-amount"></div>
      </div>
      <div class="sk-hist-row">
        <div class="sk-hist-left">
          <div class="sk sk-hist-date"></div>
          <div class="sk sk-hist-status"></div>
        </div>
        <div class="sk sk-hist-amount"></div>
      </div>
    </div>

    <!-- Skeleton: Action Buttons -->
    <div class="sk-btn-row" data-component-type="LayoutBox" data-component-id="sod_sk_action_row" aria-hidden="true">
      <div class="sk sk-btn" data-component-type="LayoutBox" data-component-id="sod_sk_pause_btn"></div>
      <div class="sk sk-btn" data-component-type="LayoutBox" data-component-id="sod_sk_cancel_btn"></div>
    </div>

    <div data-component-type="spacer" data-component-id="sod_bottom_spacer" style="height:24px;"></div>

  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
