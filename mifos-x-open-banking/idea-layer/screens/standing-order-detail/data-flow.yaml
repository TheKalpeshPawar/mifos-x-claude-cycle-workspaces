sibling: data-flow
schema_version: "4.0"
feature_id: standing-order-detail

entries:
  - screen_id: standing-order-detail
    trigger: on_mount
    event: LoadStandingOrder
    endpoints:
      - get_account_standing_orders
      - get_account_transactions
    direction: read
    dtos:
      - name: OBReadStandingOrder6
        role: response
        api_id: get_account_standing_orders
      - name: OBReadTransaction6
        role: response
        api_id: get_account_transactions
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 500
        behavior: error_state
    notes: >
      OBIE has no per-item GET — the detail is selected from the list (Data.StandingOrder[] where
      StandingOrderId == route param). Recent Executions are this order's transactions, newest first,
      capped at 5. An unresolved StandingOrderId renders the empty/error state.

  - screen_id: standing-order-detail
    trigger: on_interact
    event: RetryClicked
    endpoints:
      - get_account_standing_orders
      - get_account_transactions
    direction: read
    dtos:
      - name: OBReadStandingOrder6
        role: response
        api_id: get_account_standing_orders
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: standing-order-detail
    trigger: on_interact
    event: PauseResumeClicked
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: "Unsupported — OBIE AISP has no pause/resume endpoint (mutations are PISP). Surfaces a coming-soon snackbar."

  - screen_id: standing-order-detail
    trigger: on_interact
    event: CancelClicked
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: "Unsupported — OBIE AISP has no cancel/delete endpoint. Surfaces a coming-soon snackbar."
