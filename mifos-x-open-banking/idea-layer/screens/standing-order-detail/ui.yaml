    test_context:
      purpose: "Failed execution shown in error color to signal attention needed"
      interaction_type: display
      data_driven: true

  - type: text
    id: sod_history_item_4_amount
    content: "£1,200.00"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#BA1A1A"
      font_weight: "600"
      text_align: end
    a11y:
      role: text
      label: "Amount: £1,200.00 — payment failed"
    test_context:
      purpose: "Amount in error color to signal failed payment"
      interaction_type: display
      data_driven: true

  - type: divider
    id: sod_history_divider_4
    style: { color: "#F9FAEF", margin_vertical: spacing.xs }
    a11y: { role: separator, label: "" }
    test_context: { purpose: "Separator", interaction_type: display, data_driven: false }

  - type: list_item
    id: sod_history_item_5
    variant: two_line
    style:
      padding_vertical: spacing.sm
    children:
      - sod_history_item_5_date
      - sod_history_item_5_status
      - sod_history_item_5_amount

  - type: text
    id: sod_history_item_5_date
    content: "1 Jan 2026"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      font_weight: "500"
    a11y:
      role: text
      label: "Execution date: 1 January 2026"
    test_context:
      purpose: "Oldest of the last 5 executions"
      interaction_type: display
      data_driven: true

  - type: text
    id: sod_history_item_5_status
    content: "Completed"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#4C662B"
    a11y:
      role: text
      label: "Status: Completed"
    test_context:
      purpose: "Execution result status"
      interaction_type: display
      data_driven: true

  - type: text
    id: sod_history_item_5_amount
    content: "£1,200.00"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      font_weight: "600"
      text_align: end
    a11y:
      role: text
      label: "Amount paid: £1,200.00"
    test_context:
      purpose: "Amount for first execution"
      interaction_type: display
      data_driven: true

  # ── Action Row ────────────────────────────────────────────────────────────────

  - type: stack
    id: sod_action_row
    variant: column
    style:
      padding_horizontal: spacing.lg
      padding_bottom: spacing.md
      spacing: spacing.sm
    children:
      - sod_pause_resume_button
      - sod_delete_button

  - type: button
    id: sod_pause_resume_button
    label: "Pause Standing Order"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#4C662B"
      color: "#4C662B"
      typography: "Outfit/label_large"
      border_radius: "12dp"
      padding_vertical: "14dp"
      leading_icon: pause_circle
    on_click:
      action: pause_standing_order
      target: standing-order-detail
      intent: api
    a11y:
      role: button
      label: "Pause this standing order — no payments will be taken while paused"
    keyboard:
      focusable: true
    test_context:
      purpose: "Pauses the standing order via POST .../{id}/pause. Label toggles to 'Resume' when status=PAUSED"
      interaction_type: action
      data_driven: true

  - type: button
    id: sod_delete_button
    label: "Cancel Standing Order"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#BA1A1A"
      color: "#BA1A1A"
      typography: "Outfit/label_large"
      border_radius: "12dp"
      padding_vertical: "14dp"
      leading_icon: delete_outline
    on_click:
      action: show_delete_dialog
      target: sod_delete_dialog
      intent: dialog
    a11y:
      role: button
      label: "Cancel and delete this standing order permanently"
    keyboard:
      focusable: true
    test_context:
      purpose: "Triggers confirmation dialog before soft-deleting the standing order"
      interaction_type: action
      data_driven: false

  # ── Delete Confirmation Dialog ────────────────────────────────────────────────

  - type: dialog
    id: sod_delete_dialog
    variant: alert
    title: "Cancel Standing Order?"
    message: "This will permanently cancel the standing order for Rent Payment. No further payments will be made. This action cannot be undone."
    supported_states: [idle, visible, dismissed]
    style:
      background: "#FFFFFF"
      border_radius: "28dp"
      padding: spacing.lg
    children:
      - sod_delete_dialog_cancel_btn
      - sod_delete_dialog_confirm_btn
    on_click:
      action: dismiss
      intent: dismiss
    a11y:
      role: dialog
      label: "Confirm cancellation of standing order"
    test_context:
      purpose: "Confirmation dialog shown before DELETE API call to prevent accidental cancellation"
      interaction_type: action
      data_driven: false

  - type: button
    id: sod_delete_dialog_cancel_btn
    label: "Keep"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      color: "#4C662B"
      typography: "Outfit/label_large"
    on_click:
      action: dismiss_dialog
      target: sod_delete_dialog
      intent: dismiss
    a11y:
      role: button
      label: "Keep the standing order — dismiss dialog"
    keyboard:
      focusable: true
    test_context:
      purpose: "Dismiss the delete dialog without taking action"
      interaction_type: action
      data_driven: false

  - type: button
    id: sod_delete_dialog_confirm_btn
    label: "Cancel Order"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#BA1A1A"
      color: "#FFFFFF"
      typography: "Outfit/label_large"
      border_radius: "8dp"
    on_click:
      action: confirm_delete_standing_order
      target: standing-orders
      intent: api
    a11y:
      role: button
      label: "Confirm: permanently cancel this standing order"
    keyboard:
      focusable: true
    test_context:
      purpose: "Confirms soft-delete of standing order via DELETE API — navigates back to list on success"
      interaction_type: action
      data_driven: false

  # ── Bottom Spacer ─────────────────────────────────────────────────────────────

  - type: spacer
    id: sod_bottom_spacer
    style:
      height: "24dp"

  # ── Loading Skeleton ──────────────────────────────────────────────────────────

  - type: skeleton
    id: sod_loading_skeleton
    variant: detail
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    a11y:
      role: progressbar
      label: "Loading standing order details"
    test_context:
      purpose: "Shimmer while standing order data loads from API"
      interaction_type: display
      data_driven: false

  # ── Error State ───────────────────────────────────────────────────────────────

  - type: stack
    id: sod_error_state
    variant: column
    style:
      alignment: center
      padding: spacing.xl
    children:
      - sod_error_icon
      - sod_error_title
      - sod_error_message
      - sod_retry_button

  - type: icon
    id: sod_error_icon
    content: "sync_problem"
    style:
      color: "#BA1A1A"
      size: "48dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "Error loading standing order"
    test_context:
      purpose: "Error icon when detail API call fails"
      interaction_type: display
      data_driven: false

  - type: text
    id: sod_error_title
    content: "Standing Order Not Found"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: text
      label: "Standing order not found"
    test_context:
      purpose: "Error heading when standing order cannot be loaded"
      interaction_type: display
      data_driven: false

  - type: text
    id: sod_error_message
    content: "We could not load this standing order. It may have been cancelled or there may be a connection issue."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "Standing order load error message"
    test_context:
      purpose: "User-facing error description"
      interaction_type: display
      data_driven: false

  - type: button
    id: sod_retry_button
    label: "Retry"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#4C662B"
      color: "#4C662B"
      typography: "Outfit/label_large"
      alignment: center
    on_click:
      action: retry_load
      target: standing-order-detail
      intent: api
    a11y:
      role: button
      label: "Retry loading standing order"
    keyboard:
      focusable: true
    test_context:
      purpose: "Retry fetching standing order detail"
      interaction_type: action
      data_driven: false

  # ── Empty State ───────────────────────────────────────────────────────────────

  - type: stack
    id: sod_empty_state
    variant: column
    style:
      alignment: center
      padding: spacing.xl
    children:
      - sod_empty_icon
      - sod_empty_message
      - sod_back_to_list_button

  - type: icon
    id: sod_empty_icon
    content: "repeat_off"
    style:
      color: "#C5C8BA"
      size: "48dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "No standing order detail available"
    test_context:
      purpose: "Empty icon when no standing order data is returned"
      interaction_type: display
      data_driven: false

  - type: text
    id: sod_empty_message
    content: "No details are available for this standing order."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "No standing order details available"
    test_context:
      purpose: "Empty state message"
      interaction_type: display
      data_driven: false

  - type: button
    id: sod_back_to_list_button
    label: "Back to Standing Orders"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      border_color: "#4C662B"
      color: "#4C662B"
      typography: "Outfit/label_large"
      alignment: center
    on_click:
      action: navigate_back
      intent: target
      target: standing-orders
    a11y:
      role: button
      label: "Go back to standing orders list"
    keyboard:
      focusable: true
    test_context:
      purpose: "Navigation back to list when no detail is available"
      interaction_type: action
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  content:
    layout: { type: column, scroll: vertical }
    visible_components:
      - sod_header_card
      - sod_beneficiary_card
      - sod_schedule_card
      - sod_amount_card
      - sod_history_card
      - sod_action_row
      - sod_bottom_spacer
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout: { type: column }
    visible_components:
      - sod_loading_skeleton
    note: "Shimmer matching content block structure while API call resolves"
  error:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components:
      - sod_error_state
    note: "Shown on API 404 or network failure"
  empty:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components:
      - sod_empty_state
    note: "Shown when API returns 200 but empty/null standing order body"

state_model:
  StandingOrderDetailViewModel:
    screen_state: StandingOrderDetailUiState
    state:
      - field: standingOrderId
        type: String
        default: "\"\""
      - field: beneficiaryName
        type: String
        default: "\"\""
      - field: beneficiaryIban
        type: String
        default: "\"\""
      - field: beneficiaryBankName
        type: String
        default: "\"\""
      - field: amount
        type: BigDecimal
        default: "BigDecimal.ZERO"
      - field: currency
        type: String
        default: "\"GBP\""
      - field: frequency
        type: StandingOrderFrequency
        default: "StandingOrderFrequency.MONTHLY"
      - field: startDate
        type: LocalDate
        default: "LocalDate.now()"
      - field: nextPaymentDate
        type: LocalDate
        default: "LocalDate.now()"
      - field: finalDate
        type: "LocalDate?"
        default: "null"
      - field: status
        type: StandingOrderStatus
        default: "StandingOrderStatus.ACTIVE"
      - field: executionHistory
        type: List<StandingOrderExecution>
        default: "emptyList()"
      - field: uiState
        type: StandingOrderDetailUiState
        default: "StandingOrderDetailUiState.Loading"
      - field: isDeleteDialogVisible
        type: Boolean
        default: "false"
      - field: isActionInProgress
        type: Boolean
        default: "false"
    errors:
      - id: not_found
        message: "This standing order could not be found."
      - id: network_error
        message: "Network unavailable. Please check your connection."
      - id: pause_failed
        message: "Could not pause this standing order. Please try again."
      - id: resume_failed
        message: "Could not resume this standing order. Please try again."
      - id: delete_failed
        message: "Could not cancel this standing order. Please try again."
    events:
      - RetryLoad
      - PauseClicked
      - ResumeClicked
      - DeleteClicked
      - DeleteConfirmed
      - DeleteDismissed
      - EditClicked
      - NavigateBack
    actions:
      - name: loadDetail
        param: standingOrderId
        triggers: [ScreenOpened, RetryLoad]
      - name: pauseStandingOrder
      - name: resumeStandingOrder
      - name: deleteStandingOrder
      - name: showDeleteDialog
      - name: dismissDeleteDialog
    di:
      - StandingOrderRepository
      - AccountRepository

api:
  - endpoint: "GET /v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}"
    tag: Standing-Orders
    auth_required: true
    auth_scheme: DirectLogin
    params:
      - name: bank_id
        type: path
        value: "rbs"
      - name: account_id
        type: path
      - name: standing_order_id
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: account_id
          type: String
        - name: beneficiary_name
          type: String
        - name: beneficiary_iban
          type: String
        - name: beneficiary_bank
          type: String
        - name: amount_value
          type: String
        - name: amount_currency
          type: String
        - name: frequency
          type: String
        - name: start_date
          type: String
        - name: next_payment_date
          type: String
        - name: final_date
          type: "String?"
        - name: status
          type: String
        - name: execution_history
          type: "List<StandingOrderExecution>"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"

  - endpoint: "POST /v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}/pause"
    tag: Standing-Orders
    auth_required: true
    auth_scheme: DirectLogin
    description: "Pause a standing order — idempotent. Returns updated standing order."
    params:
      - name: bank_id
        type: path
      - name: account_id
        type: path
      - name: standing_order_id
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: status
          type: String
          value: "PAUSED"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"
      - code: 409
        message: "STANDING_ORDER_ALREADY_PAUSED"

  - endpoint: "POST /v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}/resume"
    tag: Standing-Orders
    auth_required: true
    auth_scheme: DirectLogin
    description: "Resume a paused standing order — idempotent."
    params:
      - name: bank_id
        type: path
      - name: account_id
        type: path
      - name: standing_order_id
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: status
          type: String
          value: "ACTIVE"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"
      - code: 409
        message: "STANDING_ORDER_NOT_PAUSED"

  - endpoint: "DELETE /v4.0.0/banks/{bank_id}/accounts/{account_id}/standing-orders/{standing_order_id}"
    tag: Standing-Orders
    auth_required: true
    auth_scheme: DirectLogin
    description: "Soft-delete (cancel) a standing order. No further payments will be initiated."
    params:
      - name: bank_id
        type: path
      - name: account_id
        type: path
      - name: standing_order_id
        type: path
    response:
      fields:
        - name: id
          type: String
        - name: status
          type: String
          value: "CANCELLED"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "STANDING_ORDER_NOT_FOUND"

navigation:
  - id: nav_back
    target: standing-orders
    on_click:
      action: navigate_back
  - id: nav_edit
    target: standing-order-edit
    on_click:
      action: edit_standing_order
      intent: target
      note: "Edit action in the top app bar navigates to standing-order-edit, passing standingOrderId + accountId"

dependencies:
  tier: feature
  features: [standing-orders, accounts]
