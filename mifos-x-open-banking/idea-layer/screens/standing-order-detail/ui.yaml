id: standing-order-detail
name: "Standing Order Detail"
feature: standing-orders
flavor: consumer
status: approved
quality_score: 93
schema_version: "3.1"
contract_version: "1.1.0"
approve_hash: "sha256:sod4b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0gh"
approved_at: "2026-06-11T14:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-018, standing-orders, payments, detail]
status_history:
  - status: draft
    timestamp: "2026-05-28T00:00:00Z"
  - from: draft
    to: approved
    at: "2026-05-28T00:00:00Z"
    by: "/idea completeness"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-06-06T17:10:00Z"
    by: "/kmp-implement standing-order-detail"
    contract_version: "1.1.0"
    note: "Implemented inside feature/standing-orders (same module as the list). Data comes from the derived/created order set; Recent Executions recovered from booked TXN_TYPE=SO transactions, each row navigating to transaction-detail. Pause/Resume + Cancel surface 'coming soon' snackbars; top-bar Edit omitted; no delete dialog (nothing to delete on OBP)."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.1.0"
    note: >
      SOURCE→SPEC reconciliation to shipped Kotlin (code = truth). Single uiState
      ScreenState<StandingOrderDetailContent> (display-ready label strings, no typed enums,
      no dialog/action-in-progress state, only onRetry; ctor bankId/accountId/standingOrderId).
      REMOVED: beneficiary IBAN + bank rows (not observable in derived data), top-bar Edit
      action (→ standing-order-edit), functional Pause/Resume + Cancel (now "coming soon"
      snackbars), delete confirmation dialog, execution status labels (each row is "Completed"),
      finalDate (shipped hardcodes "Ongoing"). ADDED: Recent Executions rows clickable →
      transaction-detail (ExecutionRow.transactionId); isCreated flag distinguishes
      "hasn't made a payment yet" from "No payments observed yet". api.yaml: GET/pause/resume/
      DELETE do not exist on OBP — dropped; uses StandingOrdersRepository.detail() + derived executions.
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

screens:
  - id: standing-order-detail
    name: "Standing Order Detail"
    viewmodel: "StandingOrderDetailViewModel"
    route: /standing-orders/{standingOrderId}

archetype: detail_screen

shell:
  top_app_bar:
    show: true
    title: "Standing Order"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions: []
  bottom_nav: false

components:
  - type: stack
    id: sod_root
    variant: column
    style:
      background: "#F9FAEF"
    children:
      - sod_recipient_card
      - sod_schedule_card
      - sod_amount_card
      - sod_history_card
      - sod_action_row
      - sod_bottom_spacer

  # ── Recipient Card (name + masked account only) ───────────────────────────────
  - type: card
    id: sod_recipient_card
    variant: outlined
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "16dp"
      border_color: "#E1E4D5"
      border_width: 1
      padding: spacing.md
      margin_horizontal: spacing.lg
      margin_top: spacing.md
      margin_bottom: spacing.md
    children:
      - sod_recipient_header
      - sod_recipient_name_row
      - sod_recipient_account_row

  - type: text
    id: sod_recipient_header
    content: "RECIPIENT"
    variant: label_small
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
      text_transform: uppercase
    a11y: { role: text, label: "Recipient section" }
    test_context: { purpose: "Section label for the recipient block", interaction_type: display, data_driven: false }

  - type: stack
    id: sod_recipient_name_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_recipient_name_label, sod_recipient_name_value]

  - type: text
    id: sod_recipient_name_label
    content: "Name"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "Recipient name label" }
    test_context: { purpose: "Label for recipient name", interaction_type: display, data_driven: false }

  - type: text
    id: sod_recipient_name_value
    content: "Landlord Holdings Ltd"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#1A1C16", font_weight: "500" }
    a11y: { role: text, label: "Recipient name" }
    test_context:
      purpose: "Recipient name — counterparty name, else order name, else 'Recipient' (never the login username)"
      interaction_type: display
      data_driven: true

  - type: stack
    id: sod_recipient_account_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_recipient_account_label, sod_recipient_account_value]
    note: "Rendered only when a masked counterparty account is available."

  - type: text
    id: sod_recipient_account_label
    content: "Account"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "Recipient account label" }
    test_context: { purpose: "Label for masked recipient account", interaction_type: display, data_driven: false }

  - type: text
    id: sod_recipient_account_value
    content: "····s001"
    variant: body_small
    style: { typography: "Outfit/body_small", color: "#1A1C16", font_family: monospace }
    a11y: { role: text, label: "Masked recipient account" }
    test_context:
      purpose: "Masked counterparty account (last 4 alphanumerics). IBAN + bank rows are NOT observable in derived data and were removed."
      interaction_type: display
      data_driven: true

  # ── Schedule Card ─────────────────────────────────────────────────────────────
  - type: card
    id: sod_schedule_card
    variant: outlined
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "16dp"
      border_color: "#E1E4D5"
      border_width: 1
      padding: spacing.md
      margin_horizontal: spacing.lg
      margin_bottom: spacing.md
    children:
      - sod_schedule_header
      - sod_status_row
      - sod_frequency_row
      - sod_first_payment_row
      - sod_last_payment_row
      - sod_next_payment_row
      - sod_final_date_row

  - type: text
    id: sod_schedule_header
    content: "SCHEDULE"
    variant: label_small
    style: { typography: "Outfit/label_small", color: "#44483D", text_transform: uppercase }
    a11y: { role: text, label: "Schedule section" }
    test_context: { purpose: "Section label for schedule block", interaction_type: display, data_driven: false }

  - type: stack
    id: sod_status_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_status_label, sod_status_value]

  - type: text
    id: sod_status_label
    content: "Status"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "Status label" }
    test_context: { purpose: "Label for status row", interaction_type: display, data_driven: false }

  - type: text
    id: sod_status_value
    content: "Active"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#4C662B", font_weight: "600" }
    a11y: { role: text, label: "Status value" }
    test_context:
      purpose: "Status label string (Active/Paused/Cancelled). Highlighted green when active."
      interaction_type: display
      data_driven: true

  - type: stack
    id: sod_frequency_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_frequency_label, sod_frequency_value]

  - type: text
    id: sod_frequency_label
    content: "Frequency"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "Frequency label" }
    test_context: { purpose: "Label for frequency", interaction_type: display, data_driven: false }

  - type: text
    id: sod_frequency_value
    content: "Monthly"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#1A1C16", font_weight: "500" }
    a11y: { role: text, label: "Frequency value" }
    test_context:
      purpose: "Human frequency (Daily/Weekly/Every 2 weeks/Monthly/Yearly)"
      interaction_type: display
      data_driven: true

  - type: stack
    id: sod_first_payment_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_first_payment_label, sod_first_payment_value]
    note: "Rendered only when the order has observed executions (derived from oldest execution)."

  - type: text
    id: sod_first_payment_label
    content: "First Payment"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "First payment label" }
    test_context: { purpose: "Label for first observed payment", interaction_type: display, data_driven: false }

  - type: text
    id: sod_first_payment_value
    content: "1 Jan 2026"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#1A1C16", font_weight: "500" }
    a11y: { role: text, label: "First payment date" }
    test_context:
      purpose: "Date of the oldest observed execution (startedOn)"
      interaction_type: display
      data_driven: true

  - type: stack
    id: sod_last_payment_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_last_payment_label, sod_last_payment_value]
    note: "Rendered only when lastPaymentDate is non-blank."

  - type: text
    id: sod_last_payment_label
    content: "Last Payment"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "Last payment label" }
    test_context: { purpose: "Label for last payment", interaction_type: display, data_driven: false }

  - type: text
    id: sod_last_payment_value
    content: "1 May 2026"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#1A1C16", font_weight: "500" }
    a11y: { role: text, label: "Last payment date" }
    test_context: { purpose: "Most recent observed payment date", interaction_type: display, data_driven: true }

  - type: stack
    id: sod_next_payment_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_next_payment_label, sod_next_payment_value]
    note: "Rendered only when nextPaymentDate is non-blank."

  - type: text
    id: sod_next_payment_label
    content: "Next Payment"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "Next payment label" }
    test_context: { purpose: "Label for next payment", interaction_type: display, data_driven: false }

  - type: text
    id: sod_next_payment_value
    content: "1 Jun 2026"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#4C662B", font_weight: "600" }
    a11y: { role: text, label: "Next payment date" }
    test_context:
      purpose: "Upcoming payment date, highlighted green when active"
      interaction_type: display
      data_driven: true

  - type: stack
    id: sod_final_date_row
    variant: row
    style: { alignment: center_space_between }
    children: [sod_final_date_label, sod_final_date_value]

  - type: text
    id: sod_final_date_label
    content: "Final Date"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D" }
    a11y: { role: text, label: "Final date label" }
    test_context: { purpose: "Label for final date", interaction_type: display, data_driven: false }

  - type: text
    id: sod_final_date_value
    content: "Ongoing"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#1A1C16", font_weight: "500" }
    a11y: { role: text, label: "Final date" }
    test_context:
      purpose: "Shipped hardcodes 'Ongoing' — OBP derived data exposes no end date."
      interaction_type: display
      data_driven: false

  # ── Amount Card ───────────────────────────────────────────────────────────────
  - type: card
    id: sod_amount_card
    variant: outlined
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "16dp"
      border_color: "#E1E4D5"
      border_width: 1
      padding: spacing.md
      margin_horizontal: spacing.lg
      margin_bottom: spacing.md
    children: [sod_amount_header, sod_amount_value_row]

  - type: text
    id: sod_amount_header
    content: "PAYMENT AMOUNT"
    variant: label_small
    style: { typography: "Outfit/label_small", color: "#44483D", text_transform: uppercase }
    a11y: { role: text, label: "Payment amount section" }
    test_context: { purpose: "Section label for amount block", interaction_type: display, data_driven: false }

  - type: stack
    id: sod_amount_value_row
    variant: row
    style: { alignment: center_start, spacing: spacing.sm }
    children: [sod_amount_value, sod_currency_badge]

  - type: text
    id: sod_amount_value
    content: "£1,200.00"
    variant: display_small
    style: { typography: "Outfit/display_small", color: "#1A1C16", font_weight: "700" }
    a11y: { role: text, label: "Payment amount" }
    test_context: { purpose: "Formatted payment amount", interaction_type: display, data_driven: true }

  - type: badge
    id: sod_currency_badge
    content: "GBP"
    variant: tonal
    style:
      background: "#CDEDA3"
      border_radius: "6dp"
      padding_horizontal: spacing.sm
      padding_vertical: "4dp"
      text_color: "#4C662B"
      typography: "Outfit/label_medium"
    a11y: { role: text, label: "Currency" }
    test_context: { purpose: "Currency code badge beside the amount", interaction_type: display, data_driven: true }

  # ── Recent Executions Card (rows → transaction-detail) ────────────────────────
  - type: card
    id: sod_history_card
    variant: outlined
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "16dp"
      border_color: "#E1E4D5"
      border_width: 1
      padding: "4dp"
      margin_horizontal: spacing.lg
      margin_bottom: spacing.md
    children: [sod_history_header, sod_history_list]

  - type: text
    id: sod_history_header
    content: "RECENT EXECUTIONS"
    variant: label_small
    style: { typography: "Outfit/label_small", color: "#44483D", text_transform: uppercase }
    a11y: { role: text, label: "Recent executions section — up to 5 payments" }
    test_context: { purpose: "Section label for execution history", interaction_type: display, data_driven: false }

  - type: list
    id: sod_history_list
    variant: column
    style: { padding: 0 }
    a11y: { role: list, label: "Recent executions" }
    test_context:
      purpose: "Up to 5 booked TXN_TYPE=SO executions, newest first. Empty → 'This order hasn't made a payment yet.' (isCreated) or 'No payments observed yet.'"
      interaction_type: display
      data_driven: true

  - type: list_item
    id: sod_history_row
    variant: two_line
    style: { padding_horizontal: "12dp", padding_vertical: "12dp" }
    on_click:
      action: navigate
      target: transaction-detail
    a11y: { role: button, label: "Execution. Tap to view the underlying transaction." }
    keyboard: { focusable: true }
    test_context:
      tag: sod_history_row
      purpose: "One execution row: date label + 'Completed' + amount. Clickable → transaction-detail via ExecutionRow.transactionId (passes bankId/accountId/transactionId)."
      interaction_type: action
      data_driven: true

  - type: text
    id: sod_history_row_date
    content: "1 May 2026"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#1A1C16", font_weight: "500" }
    a11y: { role: text, label: "Execution date" }
    test_context: { purpose: "Execution date label", interaction_type: display, data_driven: true }

  - type: text
    id: sod_history_row_status
    content: "Completed"
    variant: body_small
    style: { typography: "Outfit/body_small", color: "#4C662B" }
    a11y: { role: text, label: "Status: Completed" }
    test_context:
      purpose: "Every observed execution is 'Completed' (booked TXN_TYPE=SO). Failed/insufficient-funds statuses are NOT observable and were removed."
      interaction_type: display
      data_driven: false

  - type: text
    id: sod_history_row_amount
    content: "£1,200.00"
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#1A1C16", font_weight: "600" }
    a11y: { role: text, label: "Amount paid" }
    test_context: { purpose: "Execution amount", interaction_type: display, data_driven: true }

  # ── Action Row — both surface "coming soon" snackbars ─────────────────────────
  - type: stack
    id: sod_action_row
    variant: row
    style:
      padding_horizontal: spacing.lg
      padding_bottom: spacing.md
      spacing: spacing.sm
    children: [sod_pause_resume_button, sod_cancel_button]

  - type: button
    id: sod_pause_resume_button
    label: "Pause"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      border_color: "#4C662B"
      color: "#4C662B"
      typography: "Outfit/label_large"
      border_radius: "12dp"
      padding_vertical: "14dp"
      leading_icon: pause_circle
    on_click:
      action: show_coming_soon_snackbar
      target: ""
      intent: snackbar
    a11y:
      role: button
      label: "Pause or resume this standing order — coming soon"
    keyboard: { focusable: true }
    test_context:
      tag: sod_pause_resume_button
      purpose: "Label toggles Pause/Resume by status. Tapping shows 'Pausing standing orders is coming soon' — OBP has no pause/resume endpoint."
      interaction_type: action
      data_driven: true

  - type: button
    id: sod_cancel_button
    label: "Cancel"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      border_color: "#BA1A1A"
      color: "#BA1A1A"
      typography: "Outfit/label_large"
      border_radius: "12dp"
      padding_vertical: "14dp"
      leading_icon: delete_outline
    on_click:
      action: show_coming_soon_snackbar
      target: ""
      intent: snackbar
    a11y:
      role: button
      label: "Cancel this standing order — coming soon"
    keyboard: { focusable: true }
    test_context:
      tag: sod_cancel_button
      purpose: "Shows 'Cancelling standing orders is coming soon' — OBP has no delete endpoint, so there is no confirmation dialog."
      interaction_type: action
      data_driven: false

  - type: spacer
    id: sod_bottom_spacer
    style: { height: "24dp" }

  # ── Loading / Error / Empty ───────────────────────────────────────────────────
  - type: skeleton
    id: sod_loading_skeleton
    variant: detail
    style: { background: "#F9FAEF", padding: spacing.lg }
    a11y: { role: progressbar, label: "Loading standing order details" }
    test_context: { purpose: "Centered progress while detail loads", interaction_type: display, data_driven: false }

  - type: stack
    id: sod_error_state
    variant: column
    style: { alignment: center, padding: spacing.xl }
    children: [sod_error_icon, sod_error_title, sod_error_message, sod_retry_button]

  - type: icon
    id: sod_error_icon
    content: "cloud_off"
    style: { color: "#44483D", size: "48dp", alignment: center }
    a11y: { role: image, label: "Error loading standing order" }
    test_context: { purpose: "Error icon", interaction_type: display, data_driven: false }

  - type: text
    id: sod_error_title
    content: "Standing Order Not Found"
    variant: title_medium
    style: { typography: "Outfit/title_medium", color: "#1A1C16", alignment: center }
    a11y: { role: text, label: "Standing order not found" }
    test_context: { purpose: "Error/no-network/unauthenticated heading", interaction_type: display, data_driven: false }

  - type: text
    id: sod_error_message
    content: "We could not load this standing order. It may have been cancelled or there may be a connection issue."
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D", alignment: center }
    a11y: { role: text, label: "Error message" }
    test_context: { purpose: "Error description", interaction_type: display, data_driven: false }

  - type: button
    id: sod_retry_button
    label: "Retry"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style: { color: "#4C662B", typography: "Outfit/label_large", alignment: center }
    on_click:
      action: retry
      target: standing-order-detail
    a11y: { role: button, label: "Retry loading standing order" }
    keyboard: { focusable: true }
    test_context: { purpose: "Re-runs StandingOrderDetailViewModel.onRetry()", interaction_type: action, data_driven: false }

  - type: stack
    id: sod_empty_state
    variant: column
    style: { alignment: center, padding: spacing.xl }
    children: [sod_empty_icon, sod_empty_message, sod_back_to_list_button]

  - type: icon
    id: sod_empty_icon
    content: "cloud_off"
    style: { color: "#C5C8BA", size: "48dp", alignment: center }
    a11y: { role: image, label: "No detail available" }
    test_context: { purpose: "Empty-state icon", interaction_type: display, data_driven: false }

  - type: text
    id: sod_empty_message
    content: "No details are available for this standing order."
    variant: body_medium
    style: { typography: "Outfit/body_medium", color: "#44483D", alignment: center }
    a11y: { role: text, label: "No details available" }
    test_context: { purpose: "Empty-state message", interaction_type: display, data_driven: false }

  - type: button
    id: sod_back_to_list_button
    label: "Go Back"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style: { color: "#4C662B", typography: "Outfit/label_large", alignment: center }
    on_click:
      action: navigate_back
      target: standing-orders
      intent: target
    a11y: { role: button, label: "Go back to standing orders list" }
    keyboard: { focusable: true }
    test_context: { purpose: "Back navigation on empty state", interaction_type: action, data_driven: false }

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  content:
    layout: { type: column, scroll: vertical }
    visible_components:
      - sod_recipient_card
      - sod_schedule_card
      - sod_amount_card
      - sod_history_card
      - sod_action_row
      - sod_bottom_spacer
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout: { type: column }
    visible_components: [sod_loading_skeleton]
    note: "Centered CircularProgressIndicator while StandingOrdersRepository.detail() resolves."
  error:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_error_state]
    note: "ScreenState.Error / NoNetwork / Unauthenticated all render this message + Retry."
  no_network:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_error_state]
  unauthenticated:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_error_state]
  empty:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_empty_state]
    note: "ScreenState.Empty — no detail body."

state_model:
  view_model: StandingOrderDetailViewModel
  constructor:
    - { name: bankId, type: String }
    - { name: accountId, type: String }
    - { name: standingOrderId, type: String }
  flows:
    - name: uiState
      type: "StateFlow<ScreenState<StandingOrderDetailContent>>"
      default: "ScreenState.Loading"
  content_type:
    name: StandingOrderDetailContent
    note: "Display-ready label strings only — no typed enums, no dialog/action-in-progress flags."
    fields:
      - { name: name, type: String }
      - { name: statusLabel, type: String }
      - { name: isActive, type: Boolean }
      - { name: isCreated, type: Boolean }
      - { name: recipientName, type: String }
      - { name: recipientAccount, type: String, note: "masked; '' when unknown" }
      - { name: amount, type: String }
      - { name: currency, type: String }
      - { name: frequencyLabel, type: String }
      - { name: startedOn, type: String }
      - { name: lastPayment, type: String }
      - { name: nextPayment, type: String }
      - { name: finalDate, type: String, note: "always 'Ongoing'" }
      - { name: executions, type: "List<ExecutionRow>" }
  supporting_types:
    - name: ExecutionRow
      fields:
        - { name: transactionId, type: String }
        - { name: dateLabel, type: String }
        - { name: amountLabel, type: String }
  methods:
    - onRetry
  constants:
    - { name: MAX_EXECUTIONS, value: 5 }
  di:
    - StandingOrdersRepository

api:
  note: >
    NONE of the originally specified standing-order detail endpoints exist on OBP
    (GET detail / POST pause / POST resume / DELETE — all live-verified 404). They are
    dropped. Detail is sourced via StandingOrdersRepository.detail() (find order by series
    id in the derived/created set) and executions via deriveExecutions over TXN_TYPE=SO history.
    See api.yaml.

navigation:
  - id: nav_back
    target: standing-orders
    on_click: { action: navigate_back }
  - id: nav_execution
    target: transaction-detail
    on_click:
      action: navigate
      note: "Each Recent Executions row drills into transaction-detail via the underlying transactionId."

dependencies:
  tier: feature
  features: [standing-orders, accounts, transactions]
