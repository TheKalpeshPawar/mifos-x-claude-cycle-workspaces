<!doctype html>
<!-- render-hash: pfmset-populated-01 -->
<html lang="en" data-screen="pfm-settings" data-state="populated" data-feature="pfm-settings" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PFM Settings</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-md:24px;--primary:#4C662B;--on-primary:#FFFFFF;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.section-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--on-surface-variant);padding:8px 20px 4px}
.section-help{font-size:13px;color:var(--on-surface-variant);padding:0 20px 8px;line-height:1.5}
.radio-row{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;min-height:48px}.radio-row .material-icons{font-size:var(--icon-md);color:var(--outline)}.radio-row.selected .material-icons{color:var(--primary)}.radio-row .label{font-size:16px;font-weight:500;color:var(--on-surface)}.radio-row.selected .label{color:var(--on-surface)}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>PFM Settings</h1></div>
<div class="section-label" data-component-id="settings_section_label" role="heading" aria-level="2">Base Currency</div>
<div class="section-help" data-component-id="settings_section_help">Spending across all personal accounts is converted into this currency.</div>
<div class="radio-row selected" data-component-type="list_item" data-component-id="currency_option_eur" data-action="select_base_currency" data-currency="EUR" role="radio" aria-checked="true" tabindex="0"><span class="material-icons" aria-hidden="true">radio_button_checked</span><span class="label">EUR</span></div>
<div class="radio-row" data-component-type="list_item" data-component-id="currency_option_gbp" data-action="select_base_currency" data-currency="GBP" role="radio" aria-checked="false" tabindex="0"><span class="material-icons" aria-hidden="true">radio_button_unchecked</span><span class="label">GBP</span></div>
</main>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
