<!doctype html>
<!-- render-hash: 7c804a4d2a7b -->
<html lang="en" data-screen="pfm-settings" data-state="populated" data-feature="pfm-settings" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFM Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs: 16px; --icon-sm: 20px; --icon-md: 24px; --icon-lg: 32px; --icon-xl: 40px; --icon-2xl: 48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  .top-bar { display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--on-background); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer; color: var(--on-surface-variant);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }

  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--on-surface-variant);
    padding: 20px 20px 6px;
  }
  .section-help {
    font-size: 12px; font-weight: 400; line-height: 1.5;
    color: var(--on-surface-variant);
    padding: 0 20px 12px;
  }

  .currency-list {
    background: var(--surface);
    border: 1px solid var(--outline-variant);
    border-radius: var(--radius-soft);
    margin: 0 16px 16px;
    overflow: hidden;
    box-shadow: var(--shadow-1);
  }
  .currency-row {
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px; min-height: 56px;
    background: transparent; border: none; width: 100%;
    text-align: left; cursor: pointer; font-family: 'Outfit', sans-serif;
    transition: background 0.12s;
  }
  .currency-row:hover, .currency-row:focus-visible {
    background: var(--surface-variant);
    outline: none;
  }
  .currency-row + .currency-row {
    border-top: 1px solid var(--outline-variant);
  }
  .currency-row.selected {
    background: color-mix(in srgb, var(--primary-container) 30%, transparent);
  }
  .currency-row.selected:hover, .currency-row.selected:focus-visible {
    background: color-mix(in srgb, var(--primary-container) 45%, transparent);
  }

  .radio-indicator {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--outline); display: flex; align-items: center; justify-content: center;
    color: var(--primary);
  }
  .currency-row.selected .radio-indicator {
    border-color: var(--primary);
  }
  .radio-inner {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--primary); display: none;
  }
  .currency-row.selected .radio-inner { display: block; }

  .currency-info { flex: 1; min-width: 0; }
  .currency-code {
    font-size: 15px; font-weight: 700; color: var(--on-surface); line-height: 1.2;
  }
  .currency-row.selected .currency-code { color: var(--primary); }
  .currency-name {
    font-size: 12px; color: var(--on-surface-variant); margin-top: 1px;
  }

  .check-icon { color: var(--primary); font-size: var(--icon-md); display: none; }
  .currency-row.selected .check-icon { display: block; }

  .snackbar {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--on-surface); color: var(--surface);
    font-size: 14px; font-weight: 500; padding: 14px 20px;
    border-radius: 6px; box-shadow: var(--shadow-2);
    max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: none;
  }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-component-type="LayoutBox" data-component-id="top_bar" data-shell="top-bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Back to spending insights">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <h1>PFM Settings</h1>
  </header>

  <div data-component-type="LayoutBox" data-component-id="settings_content">

    <p class="section-label"
       data-component-type="text" data-component-id="settings_section_label"
       role="heading" aria-level="2" aria-label="Base currency section">
      BASE CURRENCY
    </p>

    <p class="section-help"
       data-component-type="text" data-component-id="settings_section_help"
       aria-label="Base currency explanation">
      Spending across all your personal accounts is converted into this currency on your spending insights dashboard, using live exchange rates.
    </p>

    <div class="currency-list" role="radiogroup" aria-label="Select your base currency">

      <button class="currency-row selected"
              role="radio" aria-checked="true"
              data-component-type="list_item" data-component-id="currency_option_gbp"
              data-action="SelectBaseCurrency" data-action-params="GBP"
              aria-label="Set GBP as base currency">
        <div class="radio-indicator" aria-hidden="true">
          <div class="radio-inner"></div>
        </div>
        <div class="currency-info">
          <div class="currency-code">GBP</div>
          <div class="currency-name">British Pound Sterling</div>
        </div>
        <span class="material-icons check-icon" aria-hidden="true">check</span>
      </button>

      <button class="currency-row"
              role="radio" aria-checked="false"
              data-component-type="list_item" data-component-id="currency_option_eur"
              data-action="SelectBaseCurrency" data-action-params="EUR"
              aria-label="Set EUR as base currency">
        <div class="radio-indicator" aria-hidden="true">
          <div class="radio-inner"></div>
        </div>
        <div class="currency-info">
          <div class="currency-code">EUR</div>
          <div class="currency-name">Euro</div>
        </div>
        <span class="material-icons check-icon" aria-hidden="true">check</span>
      </button>

    </div>

  </div>
</main>

<div class="snackbar" role="status" aria-live="polite" aria-atomic="true">
  Base currency updated. Your spending insights will now show in GBP.
</div>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
