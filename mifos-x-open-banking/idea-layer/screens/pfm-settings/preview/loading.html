<style>:root{--icon-md:24px;--background:#F9FAEF;--on-background:#1A1C16;--on-surface-variant:#44483D;--skeleton:#E1E4D5}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);min-height:100vh}

.sk{background:var(--skeleton);border-radius:12px;position:relative;overflow:hidden;height:48px;margin:8px 20px}.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.45),transparent);animation:shimmer 1.4s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
[data-theme="light"]{--background:#F9FAEF;--on-background:#1A1C16;--on-surface-variant:#44483D;--skeleton:#E1E4D5}[data-theme="dark"]{--background:#12140E;--on-background:#E3E3D8;--on-surface-variant:#C5C8BA;--skeleton:#2A2D24}@media (prefers-color-scheme:dark){:root{--background:#12140E;--on-background:#E3E3D8;--on-surface-variant:#C5C8BA;--skeleton:#2A2D24}}</style>
</head>
