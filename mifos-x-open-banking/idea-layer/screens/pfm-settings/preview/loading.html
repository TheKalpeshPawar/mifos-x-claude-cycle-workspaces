  }

  .icon-btn {

  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }

  @keyframes shimmer {
    0%   { background-position: -600px 0; }

  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton { animation: none !important; background: var(--skeleton-base) !important; }

  .skeleton {
    background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%);

    animation: shimmer 1.4s ease-in-out infinite;

  .sk-row-sub { height: 11px; width: 120px; border-radius: 4px; margin-top: 4px; }
  .sk-row-body { flex: 1; min-width: 0; }

  .skeleton-divider { height: 1px; background: var(--outline-variant); margin: 0 20px; }
