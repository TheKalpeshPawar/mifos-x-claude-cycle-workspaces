shell:
  top_app_bar:
    show: true
    title: "PFM Settings"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    navigation_a11y_label: "Back to spending insights"
  bottom_nav: false

screens:
  - id: pfm-settings
    name: PFM Settings
    archetype: settings
    route: /pfm-settings
    scroll: vertical

archetype: settings

components:
  - type: text
    id: settings_section_label
    label: "Base currency section label"
    content: "BASE CURRENCY"
    style:
      typography: "Outfit/label_medium"
      color: "#5C6057"
      padding_horizontal: 20
      padding_top: 8
    a11y:
      label: "Base currency section"
      role: heading
      level: 2
    test_context:
      tag: settings_section_label
      assert_text: "BASE CURRENCY"

  - type: text
    id: settings_section_help
    label: "Base currency explanation"
    content: "Spending across all your personal accounts is converted into this currency on your spending insights dashboard, using live exchange rates."
    style:
      typography: "Outfit/body_small"
      color: "#5C6057"
      padding_horizontal: 20
      padding_bottom: 8
    a11y:
      label: "Base currency explanation"
    test_context:
      tag: settings_section_help

  - type: list_item
    id: currency_option_eur
    label: "EUR option"
    content: "EUR"
    style:
      leading: radio_button
      selected: true
      padding_horizontal: 20
    on_click:
      action: select_base_currency
    a11y:
      label: "Set EUR as base currency"
      role: radio
    test_context:
      tag: pfm_settings_currency_EUR
      assert_text: "EUR"

  - type: list_item
    id: currency_option_gbp
    label: "GBP option"
    content: "GBP"
    style:
      leading: radio_button
      selected: false
      padding_horizontal: 20
    on_click:
      action: select_base_currency
    a11y:
      label: "Set GBP as base currency"
      role: radio
    test_context:
      tag: pfm_settings_currency_GBP
      assert_text: "GBP"

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components: []
      show_skeleton_list: true
      skeleton_count: 3
      skeleton_height: 48

  populated:
    layout:
      visible_components:
        - settings_section_label
        - settings_section_help
        - currency_option_eur
        - currency_option_gbp
      snackbar_on_save: "Base currency updated. Your spending insights will now show in {selected_currency}."
      snackbar_on_save_error: "Couldn't save your base currency. Please try again."

  error:
    layout:
      visible_components: []
      error_message: "Could not load settings"
      retry_action: retry_load

state_model:
  pattern: MVI
  ui_state:
    fields:
      - name: isLoading
        type: Boolean
        notes: "True while reading the persisted base currency and the account currency set."
      - name: currencyOptions
        type: "List<String>"
        notes: "Distinct Data.Account[].Currency values across the PSU's authorised accounts (e.g. EUR, GBP). Drives the radio rows."
      - name: selectedCurrency
        type: String
        notes: "Currently persisted base-currency preference (local; OBIE has no preferences endpoint); seeded from the default account's Data.Account[].Currency when never set."
      - name: isSaving
        type: Boolean
        notes: "True while persisting the new base currency to the local preference store is in flight."
      - name: loadError
        type: "String?"
        notes: "Non-null when the initial load failed → error state."
    intents:
      - name: Load
        notes: "Fired on screen entry; reads the local base-currency preference + derives the currency option set from get_accounts (Data.Account[].Currency). get_party supplies the account-holder name for the header."
      - name: SelectBaseCurrency
        payload: currency
        notes: "User taps a radio row (on_click action select_base_currency); persists immediately to the local preference store."
      - name: RetryLoad
        notes: "Retry after a failed initial load (error-state retry_action)."
    transitions:
      - on: Load
        from: loading
        to: populated
        notes: "Success — radio list rendered with the persisted (or seeded) selection."
      - on: Load
        from: loading
        to: error
        notes: "Initial read failed (e.g. 401 → re-auth, other → error_message)."
      - on: SelectBaseCurrency
        from: populated
        to: populated
        notes: "Optimistic selection; writes the base-currency preference to the local store (OBIE has no preferences endpoint). On success shows snackbar_on_save; on failure reverts selectedCurrency and shows snackbar_on_save_error."
      - on: RetryLoad
        from: error
        to: loading
  effects:
    - name: PersistBaseCurrency
      api: local_base_currency_pref
      notes: "Writes name=pfm_base_currency, value=selectedCurrency to the local preference store. OBIE Account Information has no preferences endpoint, so this is client-side only."
    - name: ShowSaveSnackbar
      notes: "Confirms the new base currency and that the unified spending insights dashboard now re-denominates into it."
