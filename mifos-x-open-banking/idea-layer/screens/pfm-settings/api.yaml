sibling: api
schema_version: "4.0"
feature_id: pfm-settings
api:
  - id: get_party
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/party"
    tag: AISP
    description: "Account-holder identity for the settings header — single account owner/holder for the AccountId. Requires an authorised account-access consent with ReadParty + an authorization-code token (OBIE OBReadParty2). Use /parties (account-level) for joint/multi-holder accounts."
    consent: "Requires an authorised account-access consent (Status AUTH) carrying ReadParty, plus a scoped authorization-code token."
    response:
      fields:
        - name: Data.Party.PartyId
          type: String
        - name: Data.Party.Name
          type: String
        - name: Data.Party.FullLegalName
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: AISP
    description: "The authorised account list — drives the distinct base-currency option set from Data.Account[].Currency across the PSU's personal accounts. Requires an authorised account-access consent + an authorization-code token (OBIE OBReadAccount6)."
    consent: "Requires an authorised account-access consent (Status AUTH), plus a scoped authorization-code token."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
  - id: local_base_currency_pref
    endpoint: "LOCAL (no OBIE endpoint)"
    tag: LocalPreference
    description: "Base currency + display preferences are LOCAL settings — OBIE Account Information has no preferences/personal-data endpoint, so the chosen base currency and display prefs persist client-side (device store), seeded from the default account's Data.Account[].Currency when never set."
    request:
      fields:
        - name: name
          type: String
          example: "pfm_base_currency"
        - name: value
          type: String
          example: "GBP"
    response:
      fields:
        - name: name
          type: String
        - name: value
          type: String
