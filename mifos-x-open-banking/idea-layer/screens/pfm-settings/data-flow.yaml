sibling: data-flow
schema_version: "4.0"
feature_id: pfm-settings
entries:
  - screen_id: pfm-settings
    trigger: on_mount
    endpoints:
      - get_accounts
      - get_party
      - local_base_currency_pref
    direction: read
    dtos:
      - name: OBReadAccount6
        role: response
        api_id: get_accounts
      - name: OBReadParty3
        role: response
        api_id: get_party
    produces_state: populated
    notes: >-
      Derives the currency option set from Data.Account[].Currency across the authorised
      accounts (get_accounts), and the header holder name from Data.Party.Name (get_party,
      with counterparty precedence: resolved holder name over raw login). The persisted base
      currency is read from the LOCAL preference store (OBIE has no preferences endpoint);
      when no value exists the selection is seeded from the default account's currency.
      All reads require an authorised account-access consent (Status AUTH) + an
      authorization-code token.
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: pfm-settings
    trigger: on_interact
    event: SelectBaseCurrency
    endpoints:
      - local_base_currency_pref
    direction: write
    dtos: []
    produces_state: populated
    notes: >-
      Persists the chosen base currency to the LOCAL preference store
      (name=pfm_base_currency, value=selected currency) — OBIE Account Information has no
      preferences endpoint. Optimistic UI selection; on success a confirmation snackbar
      appears, on failure the selection reverts.
    error_paths:
      - error_code: 500
        behavior: revert_and_toast
