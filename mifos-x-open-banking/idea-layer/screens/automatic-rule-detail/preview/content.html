<!doctype html>
<!-- render-hash: automatic-rule-detail-content-obie -->
<html lang="en" data-screen="automatic-rule-detail" data-state="content" data-feature="automatic-rule-detail" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automatic rule — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px; --icon-md: 24px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --outline-variant: #C5C8BA;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --error: #FFB4AB; --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --error: #FFB4AB; --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline-variant: #44483D;
    }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .topbar { display: flex; align-items: center; gap: var(--sp-sm); height: 56px; padding: 0 var(--sp-sm); background: var(--background); position: sticky; top: 0; z-index: 5; }
    .topbar .icon-btn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--radius-pill); background: transparent; border: none; color: var(--on-surface); cursor: pointer; }
    .topbar .title { flex: 1; font-size: 22px; line-height: 28px; font-weight: 500; }
    .material-symbols-outlined { font-size: var(--icon-md); line-height: 1; }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: var(--sp-sm) var(--sp-md) var(--sp-xl); gap: var(--sp-md); }
    .rule-name { font-size: 24px; font-weight: 700; }
    .pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; background: var(--primary-container); color: var(--on-primary-container); border-radius: var(--radius-pill); padding: 4px 12px; font-size: 13px; font-weight: 600; }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
    .limits { display: flex; align-items: center; gap: var(--sp-md); background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); padding: 16px; }
    .limits .material-symbols-outlined { color: var(--primary); }
    .limits .ltext { font-size: 14px; font-weight: 500; }
    .section-label { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-surface-variant); text-transform: uppercase; }
    .activity { display: flex; align-items: center; gap: var(--sp-md); background: var(--surface-container); border-radius: var(--radius-md); padding: 12px var(--sp-md); }
    .activity .lead { width: 40px; height: 40px; border-radius: var(--radius-pill); background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; }
    .activity .body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .activity .a-amt { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .activity .a-sub { font-size: 12px; color: var(--on-surface-variant); }
    .revoke { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm); width: 100%; margin-top: var(--sp-sm); background: transparent; color: var(--error); border: 1px solid var(--error); border-radius: var(--radius-md); height: 52px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
    .revoke-note { font-size: 12px; color: var(--on-surface-variant); line-height: 1.5; }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="automatic-rule-detail" data-state="content">
    <header data-shell="top-app-bar" data-variant="small" class="topbar">
      <button class="icon-btn" data-component-type="button" data-action="navigate_back" aria-label="Go back"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></button>
      <span class="title" role="heading" aria-level="1">Automatic rule</span>
    </header>
    <main id="main-content" data-shell="content" data-state="content">
      <div class="rule-name" data-component-type="text" data-component-id="rule_name">Round-up to Rainy Day Saver</div>
      <span class="pill" data-component-type="badge" data-component-id="status_pill"><span class="dot" aria-hidden="true"></span>ACTIVE</span>

      <div class="limits" data-component-type="box" data-component-id="limits_card">
        <span class="material-symbols-outlined" aria-hidden="true">shield</span>
        <span class="ltext">Max £50 per payment · £200 per month · Valid until 20 May 2027</span>
      </div>

      <div class="section-label" data-component-id="activity_header">Recent payments</div>
      <div class="activity" data-component-type="list_item" data-component-id="activity_row">
        <span class="lead" aria-hidden="true"><span class="material-symbols-outlined">savings</span></span>
        <span class="body"><span class="a-amt">£12.40 to Rainy Day Saver</span><span class="a-sub" data-component-id="activity_subtitle">12 June · Round-up</span></span>
      </div>

      <button class="revoke" data-component-type="button" data-component-id="revoke_button" data-action="revoke_vrp"><span class="material-symbols-outlined" aria-hidden="true">block</span>Revoke rule</button>
      <p class="revoke-note" data-component-type="text" data-component-id="revoke_note">Revoking stops all future automatic payments immediately. Money already moved stays in your savings.</p>
    </main>
  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
