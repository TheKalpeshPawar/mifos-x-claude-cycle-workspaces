<!doctype html>
<html lang="en" data-screen="cards" data-state="content" data-feature="cards" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Cards — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 72px; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .card-carousel { display: flex; gap: 16px; padding: 12px 20px; overflow-x: auto; scroll-snap-type: x mandatory; }
    .card-item { min-width: 280px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 16px; padding: 20px; color: var(--on-primary); scroll-snap-align: start; cursor: pointer; }
    .card-item .network { font-size: 16px; font-weight: 700; opacity: 0.9; text-align: right; }
    .card-item .number { font-size: 16px; font-weight: 600; letter-spacing: 2px; margin: 20px 0 8px; }
    .card-item .name { font-size: 13px; opacity: 0.8; }
    .card-item .expiry { font-size: 13px; opacity: 0.8; text-align: right; }
    .card-item .bottom { display: flex; justify-content: space-between; }
    .card-item.frozen { background: var(--outline-variant); opacity: 0.6; }
    .actions-row { display: flex; gap: 8px; padding: 8px 20px 16px; }
    .action-chip { flex: 1; padding: 10px; border-radius: 10px; border: none; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .action-chip .material-icons { font-size: 20px; }
    .action-chip.tonal { background: var(--primary-container); color: var(--primary); }
    .section-title { font-size: 16px; font-weight: 700; padding: 8px 20px; }
    .txn-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; }
    .txn-icon { width: 40px; height: 40px; border-radius: 20px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .txn-icon .material-icons { font-size: 20px; color: var(--primary); }
    .txn-info { flex: 1; }
    .txn-info .merchant { font-size: 14px; font-weight: 500; }
    .txn-info .date { font-size: 12px; color: var(--on-surface-variant); }
    .txn-amount { font-size: 14px; font-weight: 600; color: var(--error); }
    .order-btn { margin: 16px 20px; padding: 14px; background: transparent; border: 1px solid var(--primary); border-radius: 12px; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 8px 0 12px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; padding: 4px 12px; border-radius: 16px; min-width: 56px; cursor: pointer; }
    .nav-item .material-icons { font-size: 24px; color: var(--on-surface-variant); }
    .nav-item .nav-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); }
    .nav-item.active .material-icons { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 700; }
    .nav-item.active { background: var(--primary-container); }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <main>
    <div class="header"><h1 role="heading" aria-level="1">My Cards</h1></div>
    <div class="card-carousel">
      <div class="card-item" data-nav-to="card-detail" tabindex="0" aria-label="Visa Debit ending 4521">
        <div class="network">VISA</div>
        <div class="number">•••• •••• •••• 4521</div>
        <div class="bottom"><div><div class="name">ALEX WANJIRU</div></div><div class="expiry">12/28</div></div>
      </div>
      <div class="card-item frozen" data-nav-to="card-detail" tabindex="0" aria-label="Mastercard Business ending 8834 — Frozen">
        <div class="network">MC</div>
        <div class="number">•••• •••• •••• 8834</div>
        <div class="bottom"><div><div class="name">ALEX WANJIRU</div></div><div class="expiry">FROZEN</div></div>
      </div>
    </div>
    <div class="actions-row">
      <button class="action-chip tonal" data-action="toggle_freeze_card" tabindex="0"><span class="material-icons">ac_unit</span>Freeze</button>
      <button class="action-chip tonal" data-action="open_set_limit_sheet" tabindex="0"><span class="material-icons">tune</span>Limits</button>
      <button class="action-chip tonal" data-action="reveal_pin" tabindex="0"><span class="material-icons">visibility</span>PIN</button>
      <button class="action-chip tonal" data-action="report_card_lost" tabindex="0"><span class="material-icons">report</span>Lost</button>
    </div>
    <div class="section-title">Recent Transactions</div>
    <div class="txn-row" data-nav-to="transaction-detail" tabindex="0">
      <div class="txn-icon"><span class="material-icons">shopping_cart</span></div>
      <div class="txn-info"><div class="merchant">Tesco</div><div class="date">23 May · Groceries</div></div>
      <span class="txn-amount">-£42.50</span>
    </div>
    <div class="txn-row" data-nav-to="transaction-detail" tabindex="0">
      <div class="txn-icon"><span class="material-icons">local_cafe</span></div>
      <div class="txn-info"><div class="merchant">Costa Coffee</div><div class="date">22 May · Dining</div></div>
      <span class="txn-amount">-£4.80</span>
    </div>
    <button class="order-btn" data-action="order_card" tabindex="0" aria-label="Order New Card">Order New Card</button>
  </main>
  <nav data-shell="bottom-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-item" data-nav-to="home"><span class="material-icons">home</span><span class="nav-label">Home</span></a>
    <a class="nav-item" data-nav-to="accounts"><span class="material-icons">account_balance</span><span class="nav-label">Accounts</span></a>
    <a class="nav-item" data-nav-to="send-money"><span class="material-icons">send</span><span class="nav-label">Pay</span></a>
    <a class="nav-item active" data-nav-to="cards" aria-current="page"><span class="material-icons">credit_card</span><span class="nav-label">Cards</span></a>
    <a class="nav-item" data-nav-to="settings"><span class="material-icons">more_horiz</span><span class="nav-label">More</span></a>
  </nav>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
