<!doctype html>
<!-- render-hash: 8176d097e29e -->
<html lang="en" data-screen="cards" data-state="error" data-feature="cards" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Cards — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; --nav-active-indicator: #DCE7C8; }
    [data-theme="dark"] { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --secondary: #A0CFCB; --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --nav-active-indicator: #354E16; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --secondary: #A0CFCB; --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --nav-active-indicator: #354E16; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    .top-app-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .top-app-bar h1 { font-size: 24px; font-weight: 700; color: var(--primary); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 32px 120px; text-align: center; }
    .error-illust { width: 120px; height: 120px; border-radius: 60px; background: var(--error-container); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .error-illust .material-icons { font-size: 56px; color: var(--error); }
    .error-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--on-background); }
    .error-msg { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; max-width: 320px; margin-bottom: 24px; }
    .retry-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 24px; padding: 12px 32px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    .help-link { margin-top: 16px; background: transparent; border: none; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; }
    nav[data-shell="bottom-nav"] { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: 8px 0 12px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 12px; border-radius: 16px; min-width: 56px; background: transparent; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; }
    .nav-item .material-icons { font-size: 24px; color: var(--on-surface-variant); }
    .nav-item .nav-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); }
    .nav-item.active .material-icons, .nav-item.active .nav-label { color: var(--primary); }
    .nav-item.active .nav-label { font-weight: 700; }
    .nav-item.active { background: var(--nav-active-indicator); }
  </style>
</head>
<body>
  <header class="top-app-bar" data-component-type="app_bar" data-component-id="top_app_bar">
    <h1 data-component-type="text" data-component-id="cards_title" role="heading" aria-level="1">My Cards</h1>
  </header>
  <main>
    <div class="error-illust" data-component-type="box" data-component-id="error_illustration" aria-hidden="true"><span class="material-icons">cloud_off</span></div>
    <h2 class="error-title" data-component-type="text" data-component-id="error_title">Unable to load cards</h2>
    <p class="error-msg" data-component-type="text" data-component-id="error_message">Check your network connection and try again. If the problem continues, contact support from the help center.</p>
    <button class="retry-btn" data-action="retry_load_cards" data-component-type="button" data-component-id="retry_btn" tabindex="0" aria-label="Retry">Retry</button>
    <button class="help-link" data-nav-to="settings" data-component-type="button" data-component-id="help_link" tabindex="0" aria-label="Contact support">Contact Support</button>
  </main>
  <nav data-shell="bottom-nav" role="navigation" aria-label="Main navigation" data-component-type="bottom_nav" data-component-id="bottom_nav">
    <button class="nav-item" data-nav-to="home"><span class="material-icons">home</span><span class="nav-label">Home</span></button>
    <button class="nav-item" data-nav-to="accounts"><span class="material-icons">account_balance</span><span class="nav-label">Accounts</span></button>
    <button class="nav-item" data-nav-to="send-money"><span class="material-icons">send</span><span class="nav-label">Pay</span></button>
    <button class="nav-item active" data-nav-to="cards" aria-current="page"><span class="material-icons">credit_card</span><span class="nav-label">Cards</span></button>
    <button class="nav-item" data-nav-to="settings"><span class="material-icons">more_horiz</span><span class="nav-label">More</span></button>
  </nav>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
