<!doctype html>

<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Cards — error</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --color-primary:#4C662B;--color-on-primary:#FFFFFF;--color-error:#BA1A1A;--color-on-error:#FFFFFF;--color-error-container:#FFDAD6;--color-background:#F9FAEF;--color-on-background:#1A1C16;--color-on-surface:#1A1C16;--color-on-surface-variant:#44483D;--color-outline-variant:#C5C8BA;--color-nav-active-indicator:#DCE7C8;
      --font-body:'Outfit',system-ui,sans-serif;
      --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
      --radius-md:12px;--radius-pill:999px;
    }
    :root[data-theme="dark"] {
      --color-primary:#B2D188;--color-on-primary:#1F3701;--color-error:#FFB4AB;--color-on-error:#690005;--color-error-container:#93000A;--color-background:#12140E;--color-on-background:#E3E3D8;--color-on-surface:#E3E3D8;--color-on-surface-variant:#C5C8BA;--color-surface-container:#1E201A;--color-outline-variant:#44483D;--color-nav-active-indicator:#354E16;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; }
    body { background: var(--color-background); color: var(--color-on-background); font-family: var(--font-body); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
    [data-shell="root"] { display: flex; flex-direction: column; min-height: 100vh; background: var(--color-background); }
    [data-shell="top-app-bar"] { flex: 0 0 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-sm) 0 var(--sp-md); background: var(--color-background); }
    .top-bar-title { font-size: 22px; font-weight: 400; color: var(--color-on-surface); }
    .icon-btn { width: 48px; height: 48px; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--color-on-surface-variant); }
    [data-shell="content"] { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    [data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; display: flex; align-items: stretch; background: var(--color-background); border-top: 1px solid var(--color-outline-variant); height: 80px; z-index: 10; }
    [data-shell="bottom-nav"] a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--color-on-surface-variant); font-size: 11px; font-weight: 500; padding: var(--sp-sm) var(--sp-xs); position: relative; cursor: pointer; }
    [data-shell="bottom-nav"] a .nav-indicator { position: absolute; top: 6px; width: 64px; height: 32px; border-radius: var(--radius-pill); background: transparent; }
    [data-shell="bottom-nav"] a[data-nav-selected="true"] { color: var(--color-on-surface); }
    [data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-indicator { background: var(--color-nav-active-indicator); }
    [data-shell="bottom-nav"] a .material-symbols-outlined { font-size: 24px; position: relative; z-index: 1; }
    [data-shell="bottom-nav"] a span:last-child { position: relative; z-index: 1; }
    .screen-title { font-size: 32px; font-weight: 400; color: var(--color-primary); padding: var(--sp-lg) var(--sp-md) var(--sp-xs); }
    .error-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--sp-xl); text-align: center; gap: 0; }
    .error-illustration { width: 120px; height: 120px; margin-bottom: var(--sp-lg); }
    .error-title { font-size: 22px; font-weight: 600; color: var(--color-on-surface); line-height: 28px; margin-bottom: var(--sp-sm); }
    .error-message { font-size: 14px; font-weight: 400; color: var(--color-on-surface-variant); line-height: 20px; max-width: 280px; margin-bottom: var(--sp-xl); }
    .retry-btn { display: flex; align-items: center; justify-content: center; gap: var(--sp-sm); height: 48px; padding: 0 var(--sp-xl); border-radius: var(--radius-pill); border: none; background: var(--color-primary); color: var(--color-on-primary); font-size: 14px; font-weight: 600; font-family: var(--font-body); cursor: pointer; min-width: 140px; }
    .retry-btn .material-symbols-outlined { font-size: 20px; }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="cards" data-state="error">
    <header data-shell="top-app-bar" data-variant="default">
      <span class="top-bar-title">My Cards</span>
      <div>
        <button class="icon-btn" data-action="open_notifications" aria-label="Open notifications">
          <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        </button>
      </div>
    </header>
    <main data-shell="content" data-state="error" role="main">
      <h1 class="screen-title" data-component-type="text" data-component-id="cards_title">My Cards</h1>
      <div class="error-body">
        <!-- Inline SVG — card with cloud-off symbol -->
        <svg class="error-illustration" viewBox="0 0 120 120" fill="none" aria-label="Unable to load cards illustration" role="img">
          <rect x="16" y="40" width="88" height="52" rx="12" fill="#1E201A" stroke="#44483D" stroke-width="2"/>
          <rect x="16" y="54" width="88" height="12" fill="#282A24"/>
          <circle cx="74" cy="78" r="20" fill="#12140E" stroke="#44483D" stroke-width="1.5"/>
          <path d="M67 71 L81 85 M81 71 L67 85" stroke="#FFB4AB" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M56 28 C48 28 42 34 42 42 L44 42 C44 35 49 30 56 30" stroke="#8F9285" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <line x1="40" y1="26" x2="62" y2="48" stroke="#8F9285" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h2 class="error-title" data-component-type="text" data-component-id="error_title" aria-live="assertive">Unable to load cards</h2>
        <p class="error-message" data-component-type="text" data-component-id="error_message">Check your connection and try again. Your cards and account data are safe.</p>
        <button class="retry-btn" data-component-type="button" data-component-id="retry_button" data-action="RetryLoad" aria-label="Retry loading cards">
          <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
          Retry
        </button>
      </div>
    </main>
    <nav data-shell="bottom-nav" data-shell-source="app-shell.yaml" aria-label="Main navigation">
      <a data-nav-item="nav_home" data-nav-to="home" data-nav-type="tab" data-nav-selected="false" aria-label="Home"><div class="nav-indicator" aria-hidden="true"></div><span class="material-symbols-outlined" aria-hidden="true">home</span><span>Home</span></a>
      <a data-nav-item="nav_accounts" data-nav-to="accounts" data-nav-type="tab" data-nav-selected="false" aria-label="Accounts"><div class="nav-indicator" aria-hidden="true"></div><span class="material-symbols-outlined" aria-hidden="true">account_balance</span><span>Accounts</span></a>
      <a data-nav-item="nav_pay" data-nav-to="send-money" data-nav-type="tab" data-nav-selected="false" aria-label="Pay"><div class="nav-indicator" aria-hidden="true"></div><span class="material-symbols-outlined" aria-hidden="true">send</span><span>Pay</span></a>
      <a data-nav-item="nav_cards" data-nav-to="cards" data-nav-type="tab" data-nav-selected="true" aria-label="Cards" aria-current="page"><div class="nav-indicator" aria-hidden="true"></div><span class="material-symbols-outlined" aria-hidden="true">credit_card</span><span>Cards</span></a>
      <a data-nav-item="nav_more" data-nav-to="settings" data-nav-type="tab" data-nav-selected="false" aria-label="More"><div class="nav-indicator" aria-hidden="true"></div><span class="material-symbols-outlined" aria-hidden="true">more_horiz</span><span>More</span></a>
    </nav>
  </div>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
