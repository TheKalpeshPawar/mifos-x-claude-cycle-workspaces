        - set_limit_action
        - view_pin_action
        - report_lost_action
        - card_transactions_header
        - card_tx_netflix
        - card_tx_netflix_amount
        - card_tx_netflix_date
        - card_tx_tesco
        - card_tx_tesco_amount
        - card_tx_tesco_date
        - card_tx_uber
        - card_tx_uber_amount
        - card_tx_uber_date
        - card_tx_amazon
        - card_tx_amazon_amount
        - card_tx_amazon_date
        - card_tx_starbucks
        - card_tx_starbucks_amount
        - card_tx_starbucks_date
        - order_new_card_button
  empty:
    layout:
      visible_components:
        - cards_title
        - order_new_card_button
      show_empty_state: true
      empty_state_icon: credit_card_off
      empty_state_title: "No cards yet"
      empty_state_message: "Order your first Mifos card to start making payments"
  error:
    layout:
      visible_components:
        - cards_title
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load cards"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: CardsViewModel
  state_fields:
    - name: cards
      type: List<Card>
      default: "emptyList()"
    - name: selectedCardId
      type: String
      default: ""
    - name: cardTransactions
      type: List<Transaction>
      default: "emptyList()"
    - name: uiState
      type: CardsUiState
      default: Loading
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load your cards. Please try again."
    - field: freeze
      code: FREEZE_FAILED
      message: "Card freeze operation failed. Please contact support."
  events:
    - CardSelected
    - FreezeCardClicked
    - SetLimitClicked
    - ViewPinClicked
    - ReportLostClicked
    - OrderNewCardClicked
    - TransactionClicked
  actions:
    - navigate
    - toggle_freeze_card
    - open_set_limit_sheet
    - reveal_pin
    - report_card_lost
    - order_card
  di:
    - CardRepository
    - TransactionRepository
    - BiometricAuthUseCase

api:
  # Carousel data source — verified 200, consumer DirectLogin, 2026-05-31
  - id: obp_get_cards
    endpoint: "GET /obp/v7.0.0/cards"
    tag: Card
    summary: "Get cards for the current user"
    auth: DirectLogin
    trigger: "on screen entry / RetryLoad"
    response:
      wrapper: cards
      dto: Card
      fields:
        - name: cards
          type: List<Card>
        - name: bank_id
          type: String
        - name: bank_card_number
          type: String
        - name: name_on_card
          type: String
        - name: card_type
          type: String
        - name: networks
          type: List<String>
        - name: allows
          type: List<String>
        - name: enabled
          type: Boolean
        - name: cancelled
          type: Boolean
        - name: on_hot_list
          type: Boolean
        - name: account
          type: CardAccountRef
    errors:
      - code: 401
        message: "OBP-20001: User not logged in. Authentication is required!"
  # Card transactions — fetched by account.id of selected card, verified 200, 2026-05-31
  - id: obp_get_card_transactions
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    tag: Transaction
    summary: "Recent transactions for the account that owns a card"
    auth: DirectLogin
    trigger: "after cards load — accountId = card.account.id of the first/selected card"
    response:
      wrapper: transactions
      dto: Transaction
      fields:
        - name: transactions
          type: List<Transaction>
    errors:
      - code: 401
        message: "OBP-20001: User not logged in. Authentication is required!"

dependencies:
  tier: feature
  features:
    - card-detail
    - transaction-detail
