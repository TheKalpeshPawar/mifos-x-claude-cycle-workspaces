    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - cards_title
      show_skeleton_carousel: true
      show_skeleton_actions: true
      show_skeleton_list: true
      skeleton_count: 3
  content:
    layout:
      visible_components:
        - cards_title
        - card_carousel
        - card_debit_visa
        - card_debit_number
        - card_debit_name
        - card_debit_active_chip
        - visa_logo_debit
        - card_business_mastercard
        - card_business_number
