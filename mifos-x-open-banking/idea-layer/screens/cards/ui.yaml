screens:
  - id: cards
    name: My Cards
    viewmodel: CardsViewModel
    archetype: index_list
    states_handled: [loading, content, empty, error, no_network, unauthenticated]
    shell:
      top_bar:
        title: "My Cards"
        navigation_icon: null
        actions:
          - icon: notifications_outlined
            action: open_notifications
      bottom_nav: true

archetype: index_list

components:
  - type: text
    id: cards_title
    label: "My Cards"
    style:
      typography: headline_large
      color: "#4C662B"
      padding_bottom: 4
    a11y:
      label: "My Cards screen title"
      role: heading
    test_context:
      test_id: cards_title
      purpose: "Screen heading identifying the My Cards view"
      interaction_type: display
      data_driven: false
      required_fields: []
      assert_text: "My Cards"

  # Card carousel — HorizontalPager over List<Card>; swiping selects the card whose details show below.
  - type: stack
    id: card_carousel
    label: "Cards Carousel"
    style:
      orientation: horizontal
      spacing: 16
      overflow: scroll_horizontal
      padding_vertical: 8
      padding_horizontal: 20
      min_item_width: 280
      snap_alignment: start
      auto_scroll: false
    on_click:
      action: state_change
      target: selectedCardId
    a11y:
      label: "Your payment cards, swipe to see more"
      role: list
    api:
      endpoint_id: obp_get_cards
      binds: cards
    test_context:
      test_id: card_carousel
      purpose: "Horizontally paged carousel of the user's payment cards from OBP; swiping selects the active card"
      interaction_type: action
      data_driven: true
      required_fields: [cards, selectedCardId]

  # Per-card carousel tile (PaymentCard). Tapping opens card-detail (onCardClick).
  # Face gradient + content color derived from theme: Visa→primary, Mastercard→secondary.
  - type: box
    id: payment_card_tile
    variant: elevated
    label: "Payment card tile"
    content: "Payment card"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background_gradient:
        start: "#4C662B"
        end: "#3A4F21"
        direction: diagonal
      border_radius: 20
      elevation: 8
      width: 320
      height: 200
      padding: 24
    on_click:
      action: navigate
      target: card-detail
    a11y:
      label: "Payment card. Tap for card details."
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: payment_card_tile
      purpose: "Single carousel card face (PaymentCard); opens card detail on tap"
      interaction_type: navigate
      data_driven: true
      required_fields: [name_on_card, bank_card_number, network, enabled, cancelled]

  - type: text
    id: payment_card_number
    label: "•••• •••• •••• 0000"
    content: "•••• •••• •••• 0000"
    style:
      typography: title_large
      color: "#FFFFFF"
      font_family: monospace
    a11y:
      label: "Masked card number"
      role: text
    test_context:
      test_id: payment_card_number
      purpose: "Masked PAN on the carousel card face, last four digits visible (maskedNumber)"
      interaction_type: display
      data_driven: true
      required_fields: [bank_card_number]
      assert: text_visible

  - type: text
    id: payment_card_name
    label: "Cardholder name"
    content: "Cardholder name"
    style:
      typography: body_medium
      color: "#FFFFFF"
      text_transform: uppercase
    a11y:
      label: "Cardholder name"
      role: text
    test_context:
      test_id: payment_card_name
      purpose: "Cardholder name on the carousel card face"
      interaction_type: display
      data_driven: true
      required_fields: [name_on_card]
      assert: text_visible

  - type: text
    id: payment_card_network
    label: "VISA"
    content: "VISA"
    style:
      typography: label_small
      color: "#FFFFFF"
      font_weight: 700
      text_transform: uppercase
    a11y:
      label: "Card network"
      role: text
    test_context:
      test_id: payment_card_network
      purpose: "Card network label (uppercased) on the carousel card face"
      interaction_type: display
      data_driven: true
      required_fields: [network]
      assert: text_visible

  # Active/Frozen status chip on the card face (StatusChip — binary: active = enabled && !cancelled).
  - type: badge
    id: payment_card_status_chip
    label: "Active"
    content: "Active"
    style:
      border_radius: 12
      padding_horizontal: 10
      padding_vertical: 4
      text_color: "#FFFFFF"
      typography: label_small
    a11y:
      label: "Card status"
      role: status
    test_context:
      test_id: payment_card_status_chip
      purpose: "Binary Active/Frozen chip on the card face, derived from enabled && !cancelled"
      interaction_type: display
      data_driven: true
      required_fields: [enabled, cancelled]

  # Card Details card for the currently-selected card — 7 label/value rows, no dividers (CardDetailsCard).
  - type: card
    id: card_details_card
    label: "Card Details"
    content: "Card Details"
    style:
      background: "#F0F1E5"
      border_radius: 16
      border_color: "#C5C8BA"
      border_width: 1
      padding: 20
      margin_horizontal: 20
      margin_vertical: 8
    a11y:
      label: "Details for the selected card"
      role: group
    test_context:
      test_id: card_details_card
      purpose: "Label/value details block for the currently-selected card (7 rows)"
      interaction_type: display
      data_driven: true
      required_fields: [name_on_card, bank_card_number, expires_date, card_type, network, enabled, cancelled, on_hot_list, account]

  - type: text
    id: card_details_holder
    label: "Card Holder"
    content: "Card Holder"
    style:
      typography: body_medium
      color: "#1A1C16"
    a11y:
      label: "Card holder name"
      role: text
    test_context:
      test_id: card_details_holder
      purpose: "Card Holder row — selected card's nameOnCard"
      interaction_type: display
      data_driven: true
      required_fields: [name_on_card]
      assert_text: "Card Holder"

  - type: text
    id: card_details_number
    label: "Card Number"
    content: "Card Number"
    style:
      typography: body_medium
      color: "#1A1C16"
    a11y:
      label: "Masked card number"
      role: text
    test_context:
      test_id: card_details_number
      purpose: "Card Number row — masked PAN of the selected card"
      interaction_type: display
      data_driven: true
      required_fields: [bank_card_number]
      assert_text: "Card Number"

  - type: text
    id: card_details_expires
    label: "Expires"
    content: "Expires"
    style:
      typography: body_medium
      color: "#1A1C16"
    a11y:
      label: "Expiry date"
      role: text
    test_context:
      test_id: card_details_expires
      purpose: "Expires row — selected card's expiresDate"
      interaction_type: display
      data_driven: true
      required_fields: [expires_date]
      assert_text: "Expires"

  - type: text
    id: card_details_type
    label: "Card Type"
    content: "Card Type"
    style:
      typography: body_medium
      color: "#1A1C16"
    a11y:
      label: "Card type"
      role: text
    test_context:
      test_id: card_details_type
      purpose: "Card Type row — selected card's cardType"
      interaction_type: display
      data_driven: true
      required_fields: [card_type]
      assert_text: "Card Type"

  - type: text
    id: card_details_network
    label: "Network"
    content: "Network"
    style:
      typography: body_medium
      color: "#1A1C16"
    a11y:
      label: "Card network"
      role: text
    test_context:
      test_id: card_details_network
      purpose: "Network row — selected card's network"
      interaction_type: display
      data_driven: true
      required_fields: [network]
      assert_text: "Network"

  - type: text
    id: card_details_status
    label: "Status"
    content: "Status"
    style:
      typography: body_medium
      color: "#1A1C16"
    a11y:
      label: "Card status"
      role: text
    test_context:
      test_id: card_details_status
      purpose: "Status row — cardStatusLabel() 4-state (Cancelled / Reported lost / Active / Frozen)"
      interaction_type: display
      data_driven: true
      required_fields: [cancelled, on_hot_list, enabled]
      assert_text: "Status"

  - type: text
    id: card_details_linked_account
    label: "Linked Account"
    content: "Linked Account"
    style:
      typography: body_medium
      color: "#1A1C16"
    a11y:
      label: "Linked account"
      role: text
    test_context:
      test_id: card_details_linked_account
      purpose: "Linked Account row — selected card's account.label"
      interaction_type: display
      data_driven: true
      required_fields: [account]
      assert_text: "Linked Account"

  # Order New Card — shipped ONLY in the EMPTY state (no cards), surfaces a "coming soon" snackbar.
  - type: button
    id: order_new_card_button
    label: "Order New Card"
    deferred: true
    deferred_reason: "Card creation is POST management/banks/{bankId}/cards (management role) — belongs to a dedicated order flow. Shipped only in the EMPTY state; tapping emits a 'coming soon' snackbar via onDeferredAction (verified shipped 2026-06-11)."
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#4C662B"
      text_color: "#4C662B"
      border_radius: 12
      padding_vertical: 14
      leading_icon: add_card
      typography: label_large
    on_click:
      action: onDeferredAction
      target: ""
    a11y:
      label: "Order a new payment card"
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: order_new_card_button
      purpose: "Order a new card; empty-state only — handler shows a coming-soon snackbar"
      interaction_type: action
      data_driven: false
      required_fields: []
      assert_text: "Order New Card"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components: []
      show_loading_icon: true
      loading_icon: credit_card
  content:
    layout:
      visible_components:
        - cards_title
        - card_carousel
        - payment_card_tile
        - payment_card_number
        - payment_card_name
        - payment_card_network
        - payment_card_status_chip
        - card_details_card
        - card_details_holder
        - card_details_number
        - card_details_expires
        - card_details_type
        - card_details_network
        - card_details_status
        - card_details_linked_account
  empty:
    layout:
      visible_components:
        - order_new_card_button
      show_empty_state: true
      empty_state_icon: credit_card_off
      empty_state_title: "No cards yet"
      empty_state_message: "Order your first Mifos card to start making payments."
  error:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load cards"
      error_message: "Check your connection and try again. Your cards are safe."
      show_retry_button: true
  no_network:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load cards"
      error_message: "Check your connection and try again. Your cards are safe."
      show_retry_button: true
  unauthenticated:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load cards"
      error_message: "Check your connection and try again. Your cards are safe."
      show_retry_button: true

state_model:
  view_model: CardsViewModel
  screen_state: "ScreenState<CardsContent>"
  content_type: CardsContent
  content_fields:
    - name: cards
      type: List<Card>
      default: "emptyList()"
    - name: selectedCardId
      type: String
      default: ""
  selection:
    field: selectedCardId
    keyed_by: bank_card_number
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load your cards. Please try again."
  events:
    - selectCard
    - onDeferredAction
    - onRetry
    - onRefresh
  actions:
    - selectCard
    - onDeferredAction
    - navigate
  states_handled: [loading, content, empty, error, no_network, unauthenticated]
  di:
    - CardsRepository

api:
  # Carousel data source — verified 200, consumer DirectLogin, 2026-05-31
  - id: obp_get_cards
    endpoint: "GET /obp/v7.0.0/cards"
    tag: Card
    summary: "Get cards for the current user"
    auth: DirectLogin
    trigger: "on screen entry / RetryLoad — CardsRepository.userCardsStream"
    response:
      wrapper: cards
      dto: Card
      fields:
        - name: cards
          type: List<Card>
        - name: bank_id
          type: String
        - name: bank_card_number
          type: String
        - name: name_on_card
          type: String
        - name: card_type
          type: String
        - name: expires_date
          type: String
        - name: network
          type: String
        - name: networks
          type: List<String>
        - name: allows
          type: List<String>
        - name: enabled
          type: Boolean
        - name: cancelled
          type: Boolean
        - name: on_hot_list
          type: Boolean
        - name: account
          type: CardAccountRef
    errors:
      - code: 401
        message: "OBP-20001: User not logged in. Authentication is required!"
  # DEFERRED — NOT wired in the shipped Cards screen. The card-transactions list was removed
  # from the screen; CardsViewModel injects only CardsRepository. Endpoint exists + verified but
  # is not called by this screen. Retained as a deferred reference for a future card-transactions view.
  - id: obp_get_card_transactions
    deferred: true
    deferred_reason: "Card-transactions list never shipped on the Cards screen — CardsViewModel has no TransactionRepository. Endpoint verified live but unused by this screen (verified shipped 2026-06-11)."
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    tag: Transaction
    summary: "Recent transactions for the account that owns a card (NOT wired)"
    auth: DirectLogin
    response:
      wrapper: transactions
      dto: Transaction
      fields:
        - name: transactions
          type: List<Transaction>

dependencies:
  tier: feature
  features:
    - card-detail
