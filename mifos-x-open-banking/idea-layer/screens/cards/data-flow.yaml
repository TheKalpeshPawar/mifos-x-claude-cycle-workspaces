sibling: data-flow
schema_version: "4.0"
feature_id: cards
entries:
  - screen_id: cards
    trigger: on_mount
    endpoints:
      - obp_get_cards
    direction: read
    dtos:
      - name: Card
        role: response
        api_id: obp_get_cards
