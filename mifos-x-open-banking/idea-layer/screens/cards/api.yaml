sibling: api
schema_version: "4.0"
feature_id: cards
api:
  - id: obp_get_cards
    endpoint: "GET /obp/v5.1.0/cards"
    tag: Cards
    response:
      fields:
        - name: cards
          type: List<Card>
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: bank_card_number
          type: String
        - name: name_on_card
          type: String
        - name: card_type
          type: String
        - name: card_description
          type: String
        - name: card_network
          type: String
        - name: allows
          type: List<String>
        - name: enabled
          type: Boolean
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
