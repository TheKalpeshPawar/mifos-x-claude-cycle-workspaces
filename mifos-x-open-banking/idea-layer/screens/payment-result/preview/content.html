<!doctype html>
<!-- render-hash: payresult-cnt-obie02 -->
<html lang="en" data-screen="payment-result" data-state="content" data-feature="payment-result" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Payment sent</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA;--hero-from:#4C662B;--hero-to:#385219;--hero-on:#FFFFFF;--hero-sub:#F5FFE6;--success-dot:#B6F2C0}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;padding:0 0 24px}
.hero{background:linear-gradient(160deg,var(--hero-from),var(--hero-to));color:var(--hero-on);border-bottom-left-radius:28px;border-bottom-right-radius:28px;padding:72px 24px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.hero-check{width:92px;height:92px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.18)}.hero-check .material-symbols-outlined{font-size:56px;color:var(--primary)}
.hero-title{font-size:30px;font-weight:700;letter-spacing:-0.4px}.hero-summary{font-size:16px;color:var(--hero-sub);font-weight:500}
.status-pill{display:inline-flex;align-items:center;gap:7px;margin-top:2px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,0.18);font-size:12px;font-weight:600;letter-spacing:0.4px}.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--success-dot)}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:20px 16px 0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--surface-variant)}.row:last-child{border-bottom:none}.row-label{font-size:13px;color:var(--on-surface-variant);font-weight:500}.row-value{font-size:14px;font-weight:600;text-align:right}
.actions{margin-top:auto;padding:24px 20px 0;display:flex;flex-direction:column;gap:10px}
.btn-primary{padding:0 16px;height:52px;background:var(--primary);color:var(--on-primary);border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.btn-primary .material-symbols-outlined{font-size:var(--icon-sm)}
.btn-text{padding:14px 16px;background:none;color:var(--primary);border:none;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;width:100%;cursor:pointer}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA;--hero-from:#4C662B;--hero-to:#385219;--hero-on:#FFFFFF;--hero-sub:#F5FFE6;--success-dot:#B6F2C0}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D;--hero-from:#354E16;--hero-to:#22330A;--hero-on:#E3E3D8;--hero-sub:#CDEDA3;--success-dot:#B6F2C0}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D;--hero-from:#354E16;--hero-to:#22330A;--hero-on:#E3E3D8;--hero-sub:#CDEDA3;--success-dot:#B6F2C0}}</style>
</head>
<body><main>
<section class="hero" role="group" aria-label="Payment sent successfully">
<div class="hero-check" role="img" aria-label="Payment confirmed"><span class="material-symbols-outlined" aria-hidden="true">check_circle</span></div>
<h1 class="hero-title">Payment sent</h1>
<p class="hero-summary">£150.00 to James Whitfield</p>
<span class="status-pill" aria-label="Status: completed"><span class="dot" aria-hidden="true"></span>COMPLETED</span>
</section>
<div class="card" role="group" aria-label="Transaction details">
<div class="row"><span class="row-label">Transaction ID</span><span class="row-value">dp-7a21c9f4-3b…</span></div>
<div class="row"><span class="row-label">From</span><span class="row-value">Everyday Current</span></div>
<div class="row"><span class="row-label">Reference</span><span class="row-value">Rent June</span></div>
<div class="row"><span class="row-label">Charge</span><span class="row-value">£0.00</span></div>
<div class="row"><span class="row-label">Posted</span><span class="row-value">Just now</span></div>
</div>
<div class="actions">
<button class="btn-primary" data-nav-to="transaction-detail" tabindex="0" aria-label="View this transaction"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>View transaction</button>
<button class="btn-text" data-nav-to="home" tabindex="0" aria-label="Done, return home">Done</button>
</div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
