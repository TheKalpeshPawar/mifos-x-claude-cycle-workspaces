sibling: data-flow
schema_version: "4.0"
feature_id: transaction-tags
entries:
  - screen_id: transaction-tags
    trigger: on_mount
    endpoints: []
    direction: read
    transport: local_store
    store: TransactionEnrichmentStore
    dtos: []
    produces_state: content
    notes: >-
      OBIE Account Information has no transaction-metadata endpoint (no tags, notes,
      or receipt images). Transaction tagging + notes are LOCAL personal-finance features,
      stored in the on-device TransactionEnrichmentStore keyed by OBIE TransactionId +
      AccountId scope. Reads current tags and note for the given transaction on mount.

  - screen_id: transaction-tags
    trigger: on_interact
    event: TagAdded
    endpoints: []
    direction: write
    transport: local_store
    store: TransactionEnrichmentStore
    dtos: []
    produces_state: content
    notes: "Appends tag to the local enrichment store for this TransactionId. No network call."

  - screen_id: transaction-tags
    trigger: on_interact
    event: TagRemoved
    endpoints: []
    direction: write
    transport: local_store
    store: TransactionEnrichmentStore
    dtos: []
    produces_state: content
    notes: "Removes tag from the local enrichment store. No network call."

  - screen_id: transaction-tags
    trigger: on_interact
    event: NoteChanged
    endpoints: []
    direction: write
    transport: local_store
    store: TransactionEnrichmentStore
    dtos: []
    produces_state: content
    notes: "Replaces the canonical single note (newest-wins) in the local store. No network call."

  - screen_id: transaction-tags
    trigger: on_interact
    event: ImageAdded
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: >-
      UNSUPPORTED — receipt image upload was previously a coming-soon placeholder;
      OBIE has no equivalent and the feature is out of scope under Open Banking.
