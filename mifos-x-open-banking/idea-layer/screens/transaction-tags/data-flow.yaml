sibling: data-flow
schema_version: "4.0"
feature_id: transaction-tags
entries:
  - screen_id: transaction-tags
    trigger: on_mount
    endpoints:
      - obp_transaction_tags_get
    direction: read
    dtos:
      - name: TransactionTag
        role: response
        api_id: obp_transaction_tags_get
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: empty_state

  - screen_id: transaction-tags
    trigger: on_interact
    event: TagAdded
    endpoints:
      - obp_transaction_tag_add
    direction: write
    dtos:
      - name: TransactionTag
        role: response
        api_id: obp_transaction_tag_add
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login

  - screen_id: transaction-tags
    trigger: on_interact
    event: TagRemoved
    endpoints:
      - obp_transaction_tag_delete
    direction: write
    dtos:
      - name: TransactionTag
        role: response
        api_id: obp_transaction_tag_delete
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: error_state

  - screen_id: transaction-tags
    trigger: on_interact
    event: CommentAdded
    endpoints:
      - obp_transaction_comment_add
    direction: write
    dtos:
      - name: TransactionComment
        role: response
        api_id: obp_transaction_comment_add
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login

  - screen_id: transaction-tags
    trigger: on_interact
    event: ImageAdded
    endpoints:
      - obp_transaction_image_add
    direction: write
    dtos:
      - name: TransactionComment
        role: response
        api_id: obp_transaction_image_add
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
