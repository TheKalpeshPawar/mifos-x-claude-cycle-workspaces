sibling: api
schema_version: "4.0"
feature_id: transaction-tags
# MIGRATION OBP -> HSBC (2026-06-11): HSBC Open Banking (OBIE AIS) exposes NO transaction-metadata
# API — there is no endpoint to read/write tags, notes/comments, or receipt images against a
# transaction. Under OBP these were /metadata/{tags,comments,images}. Under Open Banking, transaction
# tagging + notes are a LOCAL personal-finance feature: stored in the on-device store and keyed by the
# OBIE Data.Transaction[].TransactionId. No network calls.
api: []

local_store:
  rationale: "OBIE Account Information is read-only; transaction enrichment (tags/notes) is client-owned."
  key: "Data.Transaction[].TransactionId (OBIE) + AccountId scope"
  operations:
    - id: local_tags_get
      kind: read
      store: TransactionEnrichmentStore
      returns: "List<String> tags for the transaction"
    - id: local_tag_add
      kind: write
      store: TransactionEnrichmentStore
      params: [transactionId, tag]
    - id: local_tag_remove
      kind: write
      store: TransactionEnrichmentStore
      params: [transactionId, tag]
    - id: local_note_get
      kind: read
      store: TransactionEnrichmentStore
      returns: "String? note (single canonical note per transaction)"
    - id: local_note_set
      kind: write
      store: TransactionEnrichmentStore
      params: [transactionId, note]
      note: "Replaces the existing note (canonical single value), mirroring the old replaceNote semantics locally."

unsupported:
  - capability: receipt_image_upload
    reason: "OBP /metadata/images had no real device-hosted upload path and OBIE has no equivalent; the receipt/image feature is out of scope under Open Banking. Was already a 'coming soon' placeholder."

dependencies:
  reads_transaction_from: "ais group (the transaction itself comes from GET /aisp/transactions; this screen only adds local enrichment)"
