sibling: api
schema_version: "4.0"
feature_id: transaction-tags
api:
  - id: obp_transaction_tags_get
    endpoint: "GET /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
    tag: Transaction-Metadata
    response:
      fields:
        - name: tags
          type: "List<TransactionTag>"
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
        - name: user
          type: User
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "TRANSACTION_NOT_FOUND"
  - id: obp_transaction_tag_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
    tag: Transaction-Metadata
    request:
      fields:
        - name: value
          type: String
          example: "#groceries"
    response:
      fields:
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_TAG_VALUE"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transaction_tag_delete
    endpoint: "DELETE /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags/{tagId}"
    tag: Transaction-Metadata
    response:
      fields:
        - name: result
          type: String
          example: "Success"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "TAG_NOT_FOUND"
  - id: obp_transaction_comment_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/comments"
    tag: Transaction-Metadata
    request:
      fields:
        - name: value
          type: String
          example: "Weekly shop — bought extra for bank holiday"
    response:
      fields:
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_COMMENT_VALUE"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transaction_image_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/images"
    tag: Transaction-Metadata
    request:
      fields:
        - name: label
          type: String
          example: "Whole Foods receipt 23-May-2026"
        - name: URL
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: URL
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_IMAGE_URL"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
