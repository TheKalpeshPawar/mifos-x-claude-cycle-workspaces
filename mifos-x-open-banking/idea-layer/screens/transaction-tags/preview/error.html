* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }

.top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); cursor: pointer; }

.txn-amount { font-size: 32px; font-weight: 700; color: var(--on-primary); padding-bottom: 4px; letter-spacing: -0.5px; }
.txn-date { font-size: 13px; color: var(--hero-sub); }
.error-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 32px; text-align: center; }
.error-illu { width: 88px; height: 88px; border-radius: 44px; background: var(--error-container); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }

.error-title { font-size: 18px; font-weight: 600; color: var(--on-background); }
.error-msg { font-size: 14px; color: var(--on-surface-variant); max-width: 280px; line-height: 1.5; }
.retry-btn { margin-top: 12px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 12px 28px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
