<!doctype html>
<html lang="en" data-screen="transaction-tags" data-state="save_success">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags &amp; Notes — Saved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
    .screen-root { max-width: 390px; margin: 0 auto; background: var(--background); min-height: 100vh; display: flex; flex-direction: column; }
    .top-app-bar { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); gap: 12px; border-bottom: 1px solid var(--outline-variant); }
    .nav-icon { cursor: pointer; color: var(--on-surface); font-size: 24px; }
    .bar-title { font-size: 20px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .scroll-content { flex: 1; overflow-y: auto; }
    .txn-header-card { background: var(--primary); border-radius: 20px; padding: 20px; margin: 16px 20px 20px; }
    .txn-merchant-name { font-size: 18px; font-weight: 600; color: var(--on-primary); margin-bottom: 8px; }
    .txn-amount { font-size: 34px; font-weight: 700; color: var(--on-primary); margin-bottom: 4px; }
    .txn-date { font-size: 14px; color: var(--primary-container); }
    /* Success banner */
    .success-banner { display: flex; align-items: center; gap: 10px; background: var(--primary-container); border-radius: 12px; padding: 14px 16px; margin: 0 20px 16px; }
    .success-banner .material-icons { color: var(--primary); font-size: 22px; flex-shrink: 0; }
    .success-text { font-size: 14px; color: var(--primary); font-weight: 600; }
    .section-heading { font-size: 16px; font-weight: 600; color: var(--on-surface); padding: 4px 20px 10px; }
    .tags-scroll { display: flex; gap: 8px; padding: 0 20px 16px; overflow-x: auto; scrollbar-width: none; }
    .tags-scroll::-webkit-scrollbar { display: none; }
    .tag-chip { border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; font-family: 'Outfit', sans-serif; flex-shrink: 0; border: none; cursor: default; }
    .section-divider { height: 1px; background: var(--background); margin: 0 20px 16px; }
    .note-display { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 14px; margin: 0 20px 20px; font-size: 14px; color: var(--on-surface); line-height: 1.5; }
    .back-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 14px; padding: 16px 24px; width: calc(100% - 40px); margin: 16px 20px 32px; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main>
<div class="screen-root">
  <div class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar_tags">
    <span class="material-icons nav-icon" role="button" tabindex="0" aria-label="Go back" data-action="navigate_back">arrow_back</span>
    <span class="bar-title">Tags &amp; Notes</span>
  </div>

  <div class="scroll-content">
    <div class="txn-header-card" data-component-type="box" data-component-id="transaction_header_card"
         role="region" aria-label="Whole Foods Market, -£67.84, 23 May 2026">
      <div class="txn-merchant-name" data-component-type="text" data-component-id="txn_merchant">Whole Foods Market</div>
      <div class="txn-amount" data-component-type="text" data-component-id="txn_amount">-£67.84</div>
      <div class="txn-date" data-component-type="text" data-component-id="txn_date">23 May 2026 · 14:32</div>
    </div>

    <div class="success-banner" role="status" aria-live="polite"
         data-component-type="box" data-component-id="save_success_banner">
      <span class="material-icons" aria-hidden="true">check_circle</span>
      <span class="success-text" data-component-type="text" data-component-id="save_success_text">Tags saved successfully</span>
    </div>

    <div class="section-heading" role="heading">Tags</div>
    <div class="tags-scroll" data-component-type="stack" data-component-id="tags_chips_row" role="list" aria-label="Saved tags">
      <span class="tag-chip" style="background: var(--primary-container); color: var(--primary);" role="listitem">#groceries</span>
      <span class="tag-chip" style="background: #DCE7C8; color: var(--secondary);" role="listitem">#work-expense</span>
      <span class="tag-chip" style="background: var(--primary-container); color: var(--warning);" role="listitem">#rent</span>
    </div>

    <div class="section-divider" aria-hidden="true"></div>

    <div class="section-heading" role="heading">Notes</div>
    <div class="note-display" data-component-type="text" data-component-id="notes_display">
      Weekly grocery shop — includes items for home office lunch prep.
    </div>

    <button class="back-btn"
            data-component-type="button" data-component-id="back_to_transaction_button"
            data-nav-to="transaction-detail" aria-label="Back to transaction" tabindex="0">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
      Back to Transaction
    </button>
  </div>
</div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
