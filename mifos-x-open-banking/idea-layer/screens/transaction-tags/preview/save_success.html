<!doctype html>
<!-- render-hash: ttgs26052901e -->
<html lang="en" data-screen="transaction-tags" data-state="save_success" data-feature="transaction-tags" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tags &amp; Notes — Saved</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root {
  --primary: #4C662B; --on-primary: #FFFFFF;
  --primary-container: #CDEDA3; --on-primary-container: #102000;
  --secondary: #386663; --on-secondary: #FFFFFF;
  --error: #BA1A1A; --on-error: #FFFFFF;
  --background: #F9FAEF; --on-background: #1A1C16;
  --surface: #FFFFFF; --on-surface: #1A1C16;
  --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
  --outline: #75796C; --outline-variant: #C5C8BA;
  --hero-sub: #CDEDA3;
  --success-bg: #CDEDA3;
  --success-fg: #4C662B;
}
[data-theme="dark"] {
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;
  --background: #12140E; --on-background: #E3E3D8;
  --surface: #1A1C16; --on-surface: #E3E3D8;
  --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
  --outline: #8F9285; --outline-variant: #44483D;
  --hero-sub: #B2D188;
  --success-bg: #354E16;
  --success-fg: #B2D188;
}
@media (prefers-color-scheme:dark){:root{
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;
  --background: #12140E; --on-background: #E3E3D8;
  --surface: #1A1C16; --on-surface: #E3E3D8;
  --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
  --outline: #8F9285; --outline-variant: #44483D;
  --hero-sub: #B2D188;
  --success-bg: #354E16;
  --success-fg: #B2D188;
}}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
.top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--background); }
.top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
.top-bar h1 { font-size: 18px; font-weight: 600; flex: 1; color: var(--on-background); }
.txn-header { background: var(--primary); color: var(--on-primary); border-radius: 20px; padding: 20px; margin: 16px 20px 16px; }
.txn-merchant { font-size: 18px; font-weight: 600; color: var(--on-primary); padding-bottom: 8px; }
.txn-amount { font-size: 32px; font-weight: 700; color: var(--on-primary); padding-bottom: 4px; letter-spacing: -0.5px; }
.txn-date { font-size: 13px; color: var(--hero-sub); }
.success-banner { display: flex; align-items: center; gap: 10px; background: var(--success-bg); color: var(--success-fg); border-radius: 12px; padding: 14px 16px; margin: 0 20px 16px; font-size: 14px; font-weight: 600; animation: slide-in 0.3s ease-out; }
.success-banner .material-icons { font-size: 22px; color: var(--success-fg); }
@keyframes slide-in { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.section-label { font-size: 16px; font-weight: 600; color: var(--on-background); padding: 0 20px 10px; }
.section-hint { font-size: 12px; color: var(--on-surface-variant); padding: 0 20px 8px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
.tag-chip { background: var(--primary-container); color: var(--primary); border: none; border-radius: 20px; padding: 6px 12px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; }
.tag-chip.alt { color: var(--secondary); background: #DCE7C8; }
.tag-chip.muted { color: var(--on-surface-variant); }
.divider { height: 1px; background: var(--outline-variant); margin: 16px 20px 20px; }
.note-area { display: flex; align-items: flex-start; background: transparent; border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 14px; margin: 0 20px 24px; min-height: 80px; }
.note-area .note-text { font-size: 14px; color: var(--on-background); line-height: 1.5; }
.redirect-hint { text-align: center; font-size: 12px; color: var(--on-surface-variant); padding: 8px 20px 32px; }
</style>
</head>
<body>
<div class="top-bar" data-component-type="top-app-bar" data-component-id="top_app_bar">
  <span class="material-icons" data-action="navigate_back" tabindex="0" role="button" aria-label="Go back">arrow_back</span>
  <h1>Tags &amp; Notes</h1>
  <span class="material-icons" aria-hidden="true">delete_outline</span>
</div>

<main data-component-type="screen" data-component-id="transaction_tags_save_success">
  <div class="txn-header" data-component-type="box" data-component-id="transaction_header_card" role="region" aria-label="Transaction: Whole Foods Market, debit £67.84, 23 May 2026">
    <div class="txn-merchant" data-component-id="txn_merchant">Whole Foods Market</div>
    <div class="txn-amount" data-component-id="txn_amount" aria-label="Amount: debit sixty-seven pounds eighty-four">&minus;&pound;67.84</div>
    <div class="txn-date" data-component-id="txn_date">23 May 2026 &middot; 14:32</div>
  </div>

  <div class="success-banner" data-component-type="box" data-component-id="save_success_banner" role="status" aria-live="polite" aria-label="Tags and notes saved successfully">
    <span class="material-icons" data-component-type="icon" data-component-id="save_success_icon" aria-hidden="true">check_circle_outline</span>
    <span>Tags and notes saved</span>
  </div>

  <h3 class="section-label" data-component-type="text" data-component-id="tags_section_label">Tags</h3>
  <p class="section-hint" data-component-type="text" data-component-id="tags_hint_text">Tap a tag to remove it</p>
  <div class="chips-row" data-component-type="stack" data-component-id="tags_chips_row" role="list" aria-label="Saved tags">
    <span class="tag-chip" data-component-id="tag_chip_groceries" aria-label="Tag: #groceries">#groceries</span>
    <span class="tag-chip alt" data-component-id="tag_chip_work_expense" aria-label="Tag: #work-expense">#work-expense</span>
    <span class="tag-chip muted" data-component-id="tag_chip_rent" aria-label="Tag: #rent">#rent</span>
  </div>

  <div class="divider" data-component-type="divider" data-component-id="notes_divider" role="separator" aria-hidden="true"></div>

  <h3 class="section-label" data-component-type="text" data-component-id="notes_section_label">Notes</h3>
  <div class="note-area" data-component-type="input" data-component-id="notes_text_area">
    <span class="note-text">Weekly shop, bought extra for bank holiday weekend.</span>
  </div>

  <p class="redirect-hint" role="status" aria-live="polite">Returning to transaction details...</p>
</main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
