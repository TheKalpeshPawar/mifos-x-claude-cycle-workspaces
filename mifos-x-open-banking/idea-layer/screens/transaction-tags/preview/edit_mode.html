<!doctype html>
<html lang="en" data-screen="transaction-tags" data-state="edit_mode" data-feature="transaction-tags" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tags — Edit Mode</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--on-surface-variant); text-transform: uppercase; padding: 16px 20px 8px; }
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 16px; } .tag { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 16px; background: var(--primary-container); color: var(--primary); font-size: 13px; font-weight: 600; } .tag .material-icons { font-size: 16px; cursor: pointer; }
    .add-row { display: flex; gap: 8px; padding: 0 20px 16px; } .add-input { flex: 1; padding: 10px 14px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; } .add-btn { padding: 10px 16px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    .notes-area { margin: 0 20px 12px; padding: 12px; border: 1px solid var(--outline-variant); border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); resize: vertical; width: calc(100% - 40px); }
    .save-btn { margin: 16px 20px; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <div class="top-bar"><span class="material-icons" data-action="navigate_to_transaction_detail" tabindex="0" aria-label="Go back">arrow_back</span><h1>Edit Tags</h1></div>
    <div class="section-title">Tags</div>
    <div class="tags-wrap"><span class="tag">Groceries <span class="material-icons" data-action="remove_tag" tabindex="0" aria-label="Remove Groceries tag">close</span></span><span class="tag">Work Expense <span class="material-icons" data-action="remove_tag" tabindex="0" aria-label="Remove Work Expense tag">close</span></span><span class="tag">Rent <span class="material-icons" data-action="remove_tag" tabindex="0" aria-label="Remove Rent tag">close</span></span></div>
    <div class="add-row"><input type="text" class="add-input" placeholder="Add a tag" data-action="focus_tag_input" aria-label="New tag" tabindex="0"><button class="add-btn" data-action="add_tag" tabindex="0">Add</button></div>
    <div class="section-title">Notes</div>
    <textarea class="notes-area" rows="3" data-action="focus_notes" placeholder="Add a note..." aria-label="Notes" tabindex="0">Weekly grocery shopping for the house.</textarea>
    <button class="save-btn" data-action="save_metadata" tabindex="0" aria-label="Save Changes">Save Changes</button>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
