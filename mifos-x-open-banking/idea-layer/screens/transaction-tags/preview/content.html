<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Tags &amp; Notes — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
}
.top-bar{
  display:flex;align-items:center;
  padding:0 4px;height:56px;
  background:var(--surface);
  border-bottom:1px solid var(--surface-variant);
}
.top-bar-btn{
  width:48px;height:48px;border:none;background:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:var(--text-primary);flex-shrink:0;
}
.top-bar-btn:hover{background:var(--surface-variant);}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);padding-left:4px;}
.scroll-area{overflow-y:auto;padding-bottom:24px;}
.txn-card{
  margin:16px 20px 20px;
  background:var(--primary);border-radius:20px;padding:20px;cursor:pointer;
}
.txn-card:hover{opacity:.92;}
.txn-merchant{font-size:20px;font-weight:600;color:var(--on-primary);margin-bottom:8px;}
.txn-amount{font-size:28px;font-weight:700;color:var(--on-primary);margin-bottom:4px;}
.txn-date{font-size:14px;color:var(--primary-container);}
.section-label{font-size:16px;font-weight:600;color:var(--text-primary);padding:0 20px 10px;}
.section-hint{font-size:12px;color:var(--outline);padding:0 20px 8px;}
.tags-row{display:flex;gap:8px;padding:0 20px 12px;flex-wrap:wrap;}
.tag-chip{
  display:inline-flex;align-items:center;border-radius:20px;
  padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;
  white-space:nowrap;border:none;font-family:var(--font);
}
.tag-green{background:var(--primary-container);color:var(--primary);}
.tag-teal{background:var(--primary-container);color:var(--tertiary);}
.tag-amber{background:var(--primary-container);color:var(--pending);}
.tag-red{background:var(--primary-container);color:var(--error);}
.add-tag-row{display:flex;gap:8px;align-items:center;padding:0 20px 20px;}
.add-tag-input{
  flex:1;border:1.5px solid var(--surface-variant);border-radius:12px;
  padding:12px 14px;font-family:var(--font);font-size:14px;
  background:var(--surface);color:var(--text-primary);outline:none;
}
.add-tag-input:focus{border-color:var(--primary);border-width:2px;}
.add-tag-input::placeholder{color:var(--outline-variant);}
.add-btn{
  padding:12px 16px;background:var(--primary);color:var(--on-primary);
  border:none;border-radius:12px;font-family:var(--font);
  font-size:13px;font-weight:500;cursor:pointer;
}
.add-btn:hover{opacity:.88;}
.section-divider{height:1px;background:var(--surface-variant);margin:0 20px 20px;}
.notes-textarea{
  display:block;width:calc(100% - 40px);margin:0 20px 20px;
  border:1.5px solid var(--surface-variant);border-radius:12px;
  padding:12px 14px;font-family:var(--font);font-size:14px;
  background:var(--surface);color:var(--text-primary);min-height:100px;
  resize:none;outline:none;
}
.notes-textarea:focus{border-color:var(--primary);}
.notes-textarea::placeholder{color:var(--outline-variant);}
.receipt-area{
  margin:0 20px 12px;background:var(--background);
  border-radius:16px;border:1.5px dashed var(--surface-variant);
  padding:24px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;
}
.receipt-area:hover{background:var(--primary-container);opacity:.8;}
.receipt-placeholder-text{font-size:14px;color:var(--outline-variant);text-align:center;}
.camera-btn{
  display:flex;align-items:center;gap:8px;
  margin:0 20px 24px;border:1.5px solid var(--tertiary);border-radius:12px;
  padding:12px 20px;background:none;font-family:var(--font);
  font-size:13px;font-weight:500;color:var(--tertiary);cursor:pointer;
}
.camera-btn:hover{background:rgba(56,102,99,.08);}
.save-btn{
  display:block;width:calc(100% - 40px);margin:0 20px 32px;
  background:var(--primary);color:var(--on-primary);border:none;
  border-radius:14px;padding:16px 24px;font-family:var(--font);
  font-size:15px;font-weight:600;cursor:pointer;text-align:center;
}
.save-btn:hover{opacity:.88;}
</style>
</head>
<body>
<main data-screen="transaction-tags" data-state="content" role="main">

  <div class="top-bar">
    <button class="top-bar-btn" aria-label="Back" data-action="navigate_back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="top-bar-title">Tags &amp; Notes</span>
    <button class="top-bar-btn" aria-label="Clear all" data-action="clear_all_metadata">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>

  <div class="scroll-area">

    <div class="txn-card"
         data-component-type="box"
         data-component-id="transaction_header_card"
         data-component-variant="primary-card"
         data-nav-to="transaction-detail"
         role="region"
         aria-label="Transaction: Whole Foods Market, debit £67.84, 23 May 2026">
      <div class="txn-merchant" data-component-type="text" data-component-id="txn_merchant">Whole Foods Market</div>
      <div class="txn-amount" data-component-type="text" data-component-id="txn_amount">-£67.84</div>
      <div class="txn-date" data-component-type="text" data-component-id="txn_date">23 May 2026 · 14:32</div>
    </div>

    <div class="section-label" data-component-type="text" data-component-id="tags_section_label" role="heading" aria-level="2">Tags</div>
    <div class="section-hint" data-component-type="text" data-component-id="tags_hint_text">Tap a tag to remove it</div>

    <div class="tags-row" data-component-type="stack" data-component-id="tags_chips_row" role="list" aria-label="Current tags">
      <button class="tag-chip tag-green"
              data-component-type="box" data-component-id="tag_chip_groceries" data-component-variant="tag"
              data-action="remove_tag" aria-label="Tag: #groceries. Tap to remove.">#groceries</button>
      <button class="tag-chip tag-teal"
              data-component-type="box" data-component-id="tag_chip_work_expense" data-component-variant="tag"
              data-action="remove_tag" aria-label="Tag: #work-expense. Tap to remove.">#work-expense</button>
      <button class="tag-chip tag-amber"
              data-component-type="box" data-component-id="tag_chip_rent" data-component-variant="tag"
              data-action="remove_tag" aria-label="Tag: #rent. Tap to remove.">#rent</button>
      <button class="tag-chip tag-green"
              data-component-type="box" data-component-id="tag_chip_holiday" data-component-variant="tag"
              data-action="remove_tag" aria-label="Tag: #holiday. Tap to remove.">#holiday</button>
      <button class="tag-chip tag-red"
              data-component-type="box" data-component-id="tag_chip_gym" data-component-variant="tag"
              data-action="remove_tag" aria-label="Tag: #gym. Tap to remove.">#gym</button>
    </div>

    <div class="add-tag-row" data-component-type="stack" data-component-id="add_tag_row" role="group" aria-label="Add a new tag">
      <input class="add-tag-input"
             type="text"
             data-component-type="input" data-component-id="add_tag_input"
             data-action="focus_tag_input"
             placeholder="#groceries, #holiday…"
             aria-label="Tag input field. Type a tag starting with # and tap Add">
      <button class="add-btn"
              data-component-type="button" data-component-id="add_tag_button"
              data-action="add_tag"
              aria-label="Add the typed tag to this transaction">Add</button>
    </div>

    <div class="section-divider" data-component-type="divider" data-component-id="notes_divider" role="separator"></div>
    <div class="section-label" data-component-type="text" data-component-id="notes_section_label" role="heading" aria-level="2">Notes</div>
    <textarea class="notes-textarea"
              data-component-type="input" data-component-id="notes_text_area"
              data-action="focus_notes"
              placeholder="e.g. Weekly shop — bought extra for bank holiday"
              aria-label="Notes text area. Enter a private note for this transaction." rows="4"></textarea>

    <div class="section-divider" data-component-type="divider" data-component-id="receipt_divider" role="separator"></div>
    <div class="section-label" data-component-type="text" data-component-id="receipt_section_label" role="heading" aria-level="2">Receipt</div>

    <div class="receipt-area"
         data-component-type="box" data-component-id="receipt_attachment_area" data-component-variant="dashed-upload"
         data-action="pick_image_from_gallery"
         role="button" tabindex="0"
         aria-label="Receipt image attachment area. No images attached. Tap to choose from gallery.">
      <svg width="36" height="36" viewBox="0 0 24 24" style="fill:var(--outline-variant);margin-bottom:8px"
           data-component-type="icon" data-component-id="receipt_placeholder_icon" aria-hidden="true">
        <path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/>
      </svg>
      <div class="receipt-placeholder-text" data-component-type="text" data-component-id="receipt_placeholder_text">Tap to attach a receipt image</div>
    </div>

    <button class="camera-btn"
            data-component-type="button" data-component-id="camera_button"
            data-action="open_camera"
            aria-label="Take a photo of the receipt with camera">
      <svg width="18" height="18" viewBox="0 0 24 24" style="fill:var(--tertiary)" aria-hidden="true">
        <path d="M9 2L7.17 4H4C2.9 4 2 4.9 2 6v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
      </svg>
      Take Photo
    </button>

    <button class="save-btn"
            data-component-type="button" data-component-id="save_button" data-component-variant="filled-primary"
            data-nav-to="transaction-detail"
            aria-label="Save tags, notes and receipt for this transaction">Save</button>

  </div>
</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
