<!doctype html>
<html lang="en" data-screen="transaction-tags" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags &amp; Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      min-height: 100vh;
    }
    .screen-root {
      max-width: 390px;
      margin: 0 auto;
      background: var(--background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-app-bar {
      display: flex; align-items: center;
      padding: 12px 16px;
      background: var(--surface);
      gap: 12px;
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--outline-variant);
    }
    .top-app-bar .nav-icon { cursor: pointer; color: var(--on-surface); font-size: 24px; }
    .top-app-bar .bar-title { font-size: 20px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .top-app-bar .action-icon { cursor: pointer; color: var(--on-surface); font-size: 24px; }
    .scroll-content { flex: 1; overflow-y: auto; }
    /* Transaction header card */
    .txn-header-card {
      background: var(--primary);
      border-radius: 20px;
      padding: 20px;
      margin: 16px 20px 20px;
      cursor: pointer;
    }
    .txn-merchant-name {
      font-size: 18px; font-weight: 600;
      color: var(--on-primary);
      margin-bottom: 8px;
    }
    .txn-amount {
      font-size: 34px; font-weight: 700;
      color: var(--on-primary);
      margin-bottom: 4px;
    }
    .txn-date {
      font-size: 14px;
      color: var(--primary-container);
    }
    /* Section heading */
    .section-heading {
      font-size: 16px; font-weight: 600;
      color: var(--on-surface);
      padding: 0 20px 10px;
    }
    .section-hint {
      font-size: 12px; color: var(--outline);
      padding: 0 20px 8px;
    }
    /* Tags chips row */
    .tags-scroll {
      display: flex; gap: 8px;
      padding: 0 20px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tags-scroll::-webkit-scrollbar { display: none; }
    .tag-chip {
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
      flex-shrink: 0;
    }
    /* Add tag row */
    .add-tag-row {
      display: flex; align-items: center; gap: 8px;
      padding: 0 20px 20px;
    }
    .tag-input-wrap {
      flex: 1;
      display: flex; align-items: center;
      border: 1.5px solid var(--outline-variant);
      border-radius: 12px;
      background: var(--surface);
      padding: 12px 14px;
      gap: 8px;
    }
    .tag-input-wrap .material-icons { font-size: 18px; color: var(--outline); }
    .tag-input-placeholder { font-size: 14px; color: var(--outline); }
    .add-btn {
      background: var(--primary); color: var(--on-primary);
      border: none; border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px; font-weight: 500;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }
    /* Divider */
    .section-divider {
      height: 1px; background: var(--background);
      margin: 0 20px 20px;
    }
    /* Notes textarea */
    .notes-area {
      border: 1.5px solid var(--outline-variant);
      border-radius: 12px;
      background: var(--surface);
      padding: 12px 14px;
      margin: 0 20px 20px;
      font-size: 14px; color: var(--on-surface);
      font-family: 'Outfit', sans-serif;
      min-height: 100px;
      cursor: text;
      color: var(--outline);
    }
    /* Receipt area */
    .receipt-dashed {
      border: 1.5px dashed var(--outline-variant);
      border-radius: 16px;
      background: var(--background);
      padding: 24px;
      margin: 0 20px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer;
    }
    .receipt-icon { font-size: 36px; color: var(--outline); }
    .receipt-placeholder-text { font-size: 14px; color: var(--outline); text-align: center; }
    /* Camera button */
    .btn-outlined {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: transparent; color: var(--secondary);
      border: 1.5px solid var(--secondary);
      border-radius: 12px; padding: 12px 20px;
      font-size: 14px; font-weight: 500;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      align-self: center;
      margin: 0 20px 24px;
    }
    .btn-outlined .material-icons { font-size: 18px; }
    /* Save button */
    .save-btn {
      background: var(--primary); color: var(--on-primary);
      border: none; border-radius: 14px;
      padding: 16px 24px;
      width: calc(100% - 40px);
      margin: 0 20px 32px;
      font-size: 16px; font-weight: 600;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
    }
    .save-btn:hover { opacity: 0.92; }
    /* Success banner */
    .success-banner {
      display: flex; align-items: center; gap: 8px;
      background: var(--primary-container);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 0 20px 16px;
    }
    .success-banner .material-icons { color: var(--primary); font-size: 20px; }
    .success-text { font-size: 14px; color: var(--on-surface); font-weight: 500; }
  </style>
</head>
<body>
<div class="screen-root">
  <div class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar_tags">
    <span class="material-icons nav-icon"
          role="button" tabindex="0"
          aria-label="Go back to transaction detail"
          data-action="navigate_back">arrow_back</span>
    <span class="bar-title">Tags &amp; Notes</span>
    <span class="material-icons action-icon"
          role="button" tabindex="0"
          aria-label="Clear all metadata"
          data-action="clear_all_metadata">delete_outline</span>
  </div>

  <div class="scroll-content">
    <!-- Transaction Header Card -->
    <div class="txn-header-card"
         data-component-type="box"
         data-component-id="transaction_header_card"
         role="region"
         tabindex="0"
         aria-label="Transaction: Whole Foods Market, debit £67.84, 23 May 2026"
         data-nav-to="transaction-detail">
      <div class="txn-merchant-name"
           data-component-type="text"
           data-component-id="txn_merchant"
           aria-label="Merchant: Whole Foods Market">Whole Foods Market</div>
      <div class="txn-amount"
           data-component-type="text"
           data-component-id="txn_amount"
           aria-label="Amount: debit sixty-seven pounds eighty-four">-£67.84</div>
      <div class="txn-date"
           data-component-type="text"
           data-component-id="txn_date"
           aria-label="Transaction date: 23 May 2026 at 14:32">23 May 2026 · 14:32</div>
    </div>

    <!-- Tags Section -->
    <div class="section-heading"
         data-component-type="text"
         data-component-id="tags_section_label"
         role="heading"
         aria-label="Tags section">Tags</div>
    <div class="section-hint"
         data-component-type="text"
         data-component-id="tags_hint_text">Tap a tag to remove it</div>

    <!-- Tag chips -->
    <div class="tags-scroll"
         data-component-type="stack"
         data-component-id="tags_chips_row"
         role="list"
         aria-label="Current tags on this transaction">
      <button class="tag-chip"
              data-component-type="box"
              data-component-id="tag_chip_groceries"
              role="button" tabindex="0"
              aria-label="Tag: #groceries. Tap to remove."
              style="background: var(--primary-container); color: var(--primary);"
              data-action="remove_tag">#groceries</button>
      <button class="tag-chip"
              data-component-type="box"
              data-component-id="tag_chip_work_expense"
              role="button" tabindex="0"
              aria-label="Tag: #work-expense. Tap to remove."
              style="background: #DCE7C8; color: var(--secondary);"
              data-action="remove_tag">#work-expense</button>
      <button class="tag-chip"
              data-component-type="box"
              data-component-id="tag_chip_rent"
              role="button" tabindex="0"
              aria-label="Tag: #rent. Tap to remove."
              style="background: var(--primary-container); color: var(--warning);"
              data-action="remove_tag">#rent</button>
      <button class="tag-chip"
              data-component-type="box"
              data-component-id="tag_chip_holiday"
              role="button" tabindex="0"
              aria-label="Tag: #holiday. Tap to remove."
              style="background: var(--primary-container); color: var(--primary);"
              data-action="remove_tag">#holiday</button>
      <button class="tag-chip"
              data-component-type="box"
              data-component-id="tag_chip_gym"
              role="button" tabindex="0"
              aria-label="Tag: #gym. Tap to remove."
              style="background: var(--primary-container); color: var(--error);"
              data-action="remove_tag">#gym</button>
    </div>

    <!-- Add tag row -->
    <div class="add-tag-row"
         data-component-type="stack"
         data-component-id="add_tag_row"
         role="row"
         aria-label="Add a new tag">
      <div class="tag-input-wrap"
           data-component-type="input"
           data-component-id="add_tag_input"
           role="textbox" tabindex="0"
           aria-label="Tag input field. Type a tag starting with # and tap Add"
           data-action="focus_tag_input">
        <span class="material-icons">label_outline</span>
        <span class="tag-input-placeholder">#groceries, #holiday…</span>
      </div>
      <button class="add-btn"
              data-component-type="button"
              data-component-id="add_tag_button"
              role="button" tabindex="0"
              aria-label="Add the typed tag to this transaction"
              data-action="add_tag">Add</button>
    </div>

    <!-- Notes Section -->
    <div class="section-divider"
         data-component-type="divider"
         data-component-id="notes_divider"
         role="none"></div>
    <div class="section-heading"
         data-component-type="text"
         data-component-id="notes_section_label"
         role="heading"
         aria-label="Notes section">Notes</div>
    <div class="notes-area"
         data-component-type="input"
         data-component-id="notes_text_area"
         role="textbox"
         tabindex="0"
         aria-label="Notes text area. Enter a private note for this transaction."
         aria-multiline="true"
         data-action="focus_notes">e.g. Weekly shop — bought extra for bank holiday</div>

    <!-- Receipt Section -->
    <div class="section-divider"
         data-component-type="divider"
         data-component-id="receipt_divider"
         role="none"></div>
    <div class="section-heading"
         data-component-type="text"
         data-component-id="receipt_section_label"
         role="heading"
         aria-label="Receipt attachments section">Receipt</div>

    <div class="receipt-dashed"
         data-component-type="box"
         data-component-id="receipt_attachment_area"
         role="button" tabindex="0"
         aria-label="Receipt image attachment area. No images attached. Tap to choose from gallery."
         data-action="pick_image_from_gallery">
      <span class="material-icons receipt-icon"
            data-component-type="icon"
            data-component-id="receipt_placeholder_icon"
            aria-hidden="true">receipt_long</span>
      <span class="receipt-placeholder-text"
            data-component-type="text"
            data-component-id="receipt_placeholder_text">Tap to attach a receipt image</span>
    </div>

    <button class="btn-outlined"
            data-component-type="button"
            data-component-id="camera_button"
            role="button" tabindex="0"
            aria-label="Take a photo of the receipt with camera"
            data-action="open_camera">
      <span class="material-icons">camera_alt</span>
      Take Photo
    </button>

    <!-- Save Button -->
    <button class="save-btn"
            data-component-type="button"
            data-component-id="save_button"
            role="button" tabindex="0"
            aria-label="Save tags, notes and receipt for this transaction"
            data-nav-to="transaction-detail"
            data-action="save_metadata">Save</button>
  </div>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
