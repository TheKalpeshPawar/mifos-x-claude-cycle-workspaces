<!doctype html>
<!-- render-hash: ttgc26052901f -->
<html lang="en" data-screen="transaction-tags" data-state="content" data-feature="transaction-tags" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tags &amp; Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root {
  --primary: #4C662B; --on-primary: #FFFFFF;
  --primary-container: #CDEDA3; --on-primary-container: #102000;
  --secondary: #386663; --on-secondary: #FFFFFF;
  --error: #BA1A1A; --on-error: #FFFFFF;
  --background: #F9FAEF; --on-background: #1A1C16;
  --surface: #FFFFFF; --on-surface: #1A1C16;
  --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
  --outline: #75796C; --outline-variant: #C5C8BA;
  --hero-sub: #CDEDA3;
  --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
}
[data-theme="dark"] {
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;
  --background: #12140E; --on-background: #E3E3D8;
  --surface: #1A1C16; --on-surface: #E3E3D8;
  --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
  --outline: #8F9285; --outline-variant: #44483D;
  --hero-sub: #B2D188;
}
@media (prefers-color-scheme:dark){:root{
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;
  --background: #12140E; --on-background: #E3E3D8;
  --surface: #1A1C16; --on-surface: #E3E3D8;
  --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
  --outline: #8F9285; --outline-variant: #44483D;
  --hero-sub: #B2D188;
}}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
.top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--background); }
.top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); cursor: pointer; }
.top-bar h1 { font-size: 18px; font-weight: 600; flex: 1; color: var(--on-background); }
.txn-header { background: var(--primary); color: var(--on-primary); border-radius: 20px; padding: 20px; margin: 16px 20px 20px; cursor: pointer; }
.txn-merchant { font-size: 18px; font-weight: 600; color: var(--on-primary); padding-bottom: 8px; }
.txn-amount { font-size: 32px; font-weight: 700; color: var(--on-primary); padding-bottom: 4px; letter-spacing: -0.5px; }
.txn-date { font-size: 13px; color: var(--hero-sub); }
.section-label { font-size: 16px; font-weight: 600; color: var(--on-background); padding: 0 20px 10px; }
.section-hint { font-size: 12px; color: var(--on-surface-variant); padding: 0 20px 8px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
.tag-chip { background: var(--primary-container); color: var(--primary); border: none; border-radius: 20px; padding: 6px 12px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.tag-chip.alt { color: var(--secondary); background: #DCE7C8; }
.add-row { display: flex; gap: 8px; align-items: center; padding: 0 20px 20px; }
.input { flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 14px; }
.input .material-icons { font-size: var(--icon-sm); color: var(--on-surface-variant); }
.input input { flex: 1; border: none; outline: none; background: transparent; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-background); }
.input input::placeholder { color: var(--on-surface-variant); }
.add-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 12px 16px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
.divider { height: 1px; background: var(--outline-variant); margin: 0 20px 20px; }
.note-area { display: flex; align-items: flex-start; border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 14px; margin: 0 20px 20px; min-height: 100px; }
.note-area textarea { flex: 1; border: none; outline: none; background: transparent; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-background); resize: none; min-height: 80px; }
.receipt-area { display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--background); border: 1px dashed var(--outline-variant); border-radius: 16px; padding: 24px; margin: 0 20px 12px; cursor: pointer; }
.receipt-area .material-icons { font-size: var(--icon-lg); color: var(--on-surface-variant); }
.receipt-placeholder { font-size: 14px; color: var(--on-surface-variant); }
.cam-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; color: var(--secondary); border: 1.5px solid var(--secondary); border-radius: 12px; padding: 12px 20px; margin: 0 auto 24px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.cam-btn .material-icons { font-size: var(--icon-sm); }
.save-btn { display: block; width: calc(100% - 40px); margin: 0 20px 32px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 14px; padding: 16px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="top-bar" data-component-type="top-app-bar" data-component-id="top_app_bar">
  <span class="material-icons" data-action="navigate_back" tabindex="0" role="button" aria-label="Go back">arrow_back</span>
  <h1>Tags &amp; Notes</h1>
  <span class="material-icons" data-action="clear_all_metadata" tabindex="0" role="button" aria-label="Clear all">delete_outline</span>
</div>

<main data-component-type="screen" data-component-id="transaction_tags_content">
  <div class="txn-header" data-component-type="box" data-component-id="transaction_header_card" data-nav-to="transaction-detail" tabindex="0" role="region" aria-label="Transaction: Whole Foods Market, debit £67.84, 23 May 2026">
    <div class="txn-merchant" data-component-id="txn_merchant">Whole Foods Market</div>
    <div class="txn-amount" data-component-id="txn_amount" aria-label="Amount: debit sixty-seven pounds eighty-four">&minus;&pound;67.84</div>
    <div class="txn-date" data-component-id="txn_date">23 May 2026 &middot; 14:32</div>
  </div>

  <h3 class="section-label" data-component-type="text" data-component-id="tags_section_label">Tags</h3>
  <p class="section-hint" data-component-type="text" data-component-id="tags_hint_text">Tap a tag to remove it</p>
  <div class="chips-row" data-component-type="stack" data-component-id="tags_chips_row" role="list" aria-label="Current tags on this transaction">
    <button class="tag-chip" data-component-type="box" data-component-id="tag_chip_groceries" data-action="remove_tag" tabindex="0" aria-label="Tag: #groceries. Tap to remove.">#groceries</button>
    <button class="tag-chip alt" data-component-type="box" data-component-id="tag_chip_work_expense" data-action="remove_tag" tabindex="0" aria-label="Tag: #work-expense. Tap to remove.">#work-expense</button>
  </div>

  <div class="add-row" data-component-type="stack" data-component-id="add_tag_row" role="group" aria-label="Add a new tag">
    <label class="input" data-component-type="input" data-component-id="add_tag_input">
      <span class="material-icons" aria-hidden="true">label_outline</span>
      <input type="text" placeholder="#groceries, #holiday..." aria-label="Tag input field">
    </label>
    <button class="add-btn" data-component-type="button" data-component-id="add_tag_button" data-action="add_tag" tabindex="0" aria-label="Add the typed tag to this transaction">Add</button>
  </div>

  <div class="divider" data-component-type="divider" data-component-id="notes_divider" role="separator" aria-hidden="true"></div>

  <h3 class="section-label" data-component-type="text" data-component-id="notes_section_label">Notes</h3>
  <label class="note-area" data-component-type="input" data-component-id="notes_text_area">
    <textarea placeholder="e.g. Weekly shop, bought extra for bank holiday" aria-label="Notes text area"></textarea>
  </label>

  <div class="divider" data-component-type="divider" data-component-id="receipt_divider" role="separator" aria-hidden="true"></div>

  <h3 class="section-label" data-component-type="text" data-component-id="receipt_section_label">Receipt</h3>
  <div class="receipt-area" data-component-type="box" data-component-id="receipt_attachment_area" data-action="pick_image_from_gallery" tabindex="0" role="button" aria-label="Receipt image attachment area. No images attached. Tap to choose from gallery.">
    <span class="material-icons" data-component-type="icon" data-component-id="receipt_placeholder_icon" aria-hidden="true">receipt_long</span>
    <p class="receipt-placeholder" data-component-type="text" data-component-id="receipt_placeholder_text">Tap to attach a receipt image</p>
  </div>
  <button class="cam-btn" data-component-type="button" data-component-id="camera_button" data-action="open_camera" tabindex="0" aria-label="Take a photo of the receipt with camera">
    <span class="material-icons" aria-hidden="true">camera_alt</span>
    <span>Take Photo</span>
  </button>

  <button class="save-btn" data-component-type="button" data-component-id="save_button" data-action="save_metadata" tabindex="0" aria-label="Save tags, notes and receipt for this transaction">Save</button>
</main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
