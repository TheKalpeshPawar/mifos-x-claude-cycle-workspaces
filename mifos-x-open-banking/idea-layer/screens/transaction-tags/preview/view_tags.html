<!doctype html>
<html lang="en" data-screen="transaction-tags" data-state="view_tags">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags &amp; Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
    .screen-root { max-width: 390px; margin: 0 auto; background: var(--background); min-height: 100vh; display: flex; flex-direction: column; }
    .top-app-bar { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); gap: 12px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--outline-variant); }
    .top-app-bar .nav-icon { cursor: pointer; color: var(--on-surface); font-size: 24px; }
    .top-app-bar .bar-title { font-size: 20px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .top-app-bar .action-icon { cursor: pointer; color: var(--on-surface); font-size: 24px; }
    .scroll-content { flex: 1; overflow-y: auto; }
    .txn-header-card { background: var(--primary); border-radius: 20px; padding: 20px; margin: 16px 20px 20px; cursor: pointer; }
    .txn-merchant-name { font-size: 18px; font-weight: 600; color: var(--on-primary); margin-bottom: 8px; }
    .txn-amount { font-size: 34px; font-weight: 700; color: var(--on-primary); margin-bottom: 4px; }
    .txn-date { font-size: 14px; color: var(--primary-container); }
    .section-heading { font-size: 16px; font-weight: 600; color: var(--on-surface); padding: 0 20px 10px; }
    .section-hint { font-size: 12px; color: var(--outline); padding: 0 20px 8px; }
    .tags-scroll { display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto; scrollbar-width: none; }
    .tags-scroll::-webkit-scrollbar { display: none; }
    .tag-chip { border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; font-family: 'Outfit', sans-serif; flex-shrink: 0; border: none; }
    .add-tag-row { display: flex; align-items: center; gap: 8px; padding: 0 20px 20px; }
    .tag-input-wrap { flex: 1; display: flex; align-items: center; border: 1.5px solid var(--outline-variant); border-radius: 12px; background: var(--surface); padding: 12px 14px; gap: 8px; }
    .tag-input-wrap .material-icons { font-size: 18px; color: var(--outline); }
    .tag-input-placeholder { font-size: 14px; color: var(--outline); }
    .add-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 500; font-family: 'Outfit', sans-serif; cursor: pointer; white-space: nowrap; }
    .section-divider { height: 1px; background: var(--background); margin: 0 20px 20px; }
    .notes-area { border: 1.5px solid var(--outline-variant); border-radius: 12px; background: var(--surface); padding: 12px 14px; margin: 0 20px 20px; font-size: 14px; color: var(--outline); font-family: 'Outfit', sans-serif; min-height: 100px; cursor: text; }
    .receipt-dashed { border: 1.5px dashed var(--outline-variant); border-radius: 16px; background: var(--background); padding: 24px; margin: 0 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
    .receipt-icon { font-size: 36px; color: var(--outline); }
    .receipt-placeholder-text { font-size: 14px; color: var(--outline); text-align: center; }
    .btn-outlined { display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; color: var(--secondary); border: 1.5px solid var(--secondary); border-radius: 12px; padding: 12px 20px; font-size: 14px; font-weight: 500; font-family: 'Outfit', sans-serif; cursor: pointer; align-self: center; margin: 0 20px 24px; }
    .save-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 14px; padding: 16px 24px; width: calc(100% - 40px); margin: 0 20px 32px; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main>
<div class="screen-root">
  <div class="top-app-bar" data-component-type="top_app_bar" data-component-id="top_app_bar_tags">
    <span class="material-icons nav-icon" role="button" tabindex="0" aria-label="Go back" data-action="navigate_back">arrow_back</span>
    <span class="bar-title">Tags &amp; Notes</span>
    <span class="material-icons action-icon" role="button" tabindex="0" aria-label="Clear all" data-action="clear_all_metadata">delete_outline</span>
  </div>

  <div class="scroll-content">
    <div class="txn-header-card" data-component-type="box" data-component-id="transaction_header_card"
         role="region" tabindex="0" aria-label="Whole Foods Market, -£67.84, 23 May 2026" data-nav-to="transaction-detail">
      <div class="txn-merchant-name" data-component-type="text" data-component-id="txn_merchant">Whole Foods Market</div>
      <div class="txn-amount" data-component-type="text" data-component-id="txn_amount">-£67.84</div>
      <div class="txn-date" data-component-type="text" data-component-id="txn_date">23 May 2026 · 14:32</div>
    </div>

    <div class="section-heading" data-component-type="text" data-component-id="tags_section_label" role="heading">Tags</div>
    <div class="section-hint" data-component-type="text" data-component-id="tags_hint_text">Tap a tag to remove it</div>

    <div class="tags-scroll" data-component-type="stack" data-component-id="tags_chips_row" role="list" aria-label="Tags on this transaction">
      <button class="tag-chip" data-component-type="box" data-component-id="tag_chip_groceries" tabindex="0" aria-label="Tag: #groceries" style="background: var(--primary-container); color: var(--primary);" data-action="remove_tag">#groceries</button>
      <button class="tag-chip" data-component-type="box" data-component-id="tag_chip_work_expense" tabindex="0" aria-label="Tag: #work-expense" style="background: #DCE7C8; color: var(--secondary);" data-action="remove_tag">#work-expense</button>
      <button class="tag-chip" data-component-type="box" data-component-id="tag_chip_rent" tabindex="0" aria-label="Tag: #rent" style="background: var(--primary-container); color: var(--warning);" data-action="remove_tag">#rent</button>
    </div>

    <div class="add-tag-row" data-component-type="stack" data-component-id="add_tag_row">
      <div class="tag-input-wrap" data-component-type="input" data-component-id="tag_input_field" role="textbox" aria-label="Add a tag" tabindex="0">
        <span class="material-icons" aria-hidden="true">tag</span>
        <span class="tag-input-placeholder">Add a tag…</span>
      </div>
      <button class="add-btn" data-component-type="button" data-component-id="add_tag_button" data-action="add_tag" aria-label="Add tag" tabindex="0">Add</button>
    </div>

    <div class="section-divider" aria-hidden="true"></div>

    <div class="section-heading" data-component-type="text" data-component-id="notes_section_label" role="heading">Notes</div>
    <div class="notes-area" data-component-type="input" data-component-id="notes_input" role="textbox" aria-label="Add a note" tabindex="0" aria-multiline="true">Add a note…</div>

    <div class="section-heading" data-component-type="text" data-component-id="receipt_section_label" role="heading">Receipt</div>
    <div class="receipt-dashed" data-component-type="box" data-component-id="receipt_upload_area" role="button" aria-label="Upload receipt photo" tabindex="0" data-action="upload_receipt">
      <span class="material-icons receipt-icon" aria-hidden="true">receipt_long</span>
      <span class="receipt-placeholder-text">Tap to upload a receipt photo</span>
    </div>
    <button class="btn-outlined" data-component-type="button" data-component-id="take_photo_button" data-action="take_receipt_photo" aria-label="Take a photo of receipt" tabindex="0">
      <span class="material-icons" aria-hidden="true">photo_camera</span>
      Take Photo
    </button>

    <button class="save-btn" data-component-type="button" data-component-id="save_tags_button" data-action="save_tags_and_notes" aria-label="Save tags and notes" tabindex="0">Save Tags &amp; Notes</button>
  </div>
</div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
