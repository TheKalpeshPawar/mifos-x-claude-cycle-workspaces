<!doctype html>
<!-- render-hash: transaction-tags-loading-obie -->
<html lang="en" data-screen="transaction-tags" data-state="loading" data-feature="transaction-tags" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tags &amp; Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
  --font-display:'Outfit',system-ui,sans-serif;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-2xl:48px;
}
[data-theme="light"] {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
}
[data-theme="dark"] {
  --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
  --secondary:#A0CFCB;--on-secondary:#00201E;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB;--on-tertiary:#00201E;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
  --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
  --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
  --secondary:#A0CFCB;--on-secondary:#00201E;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB;--on-tertiary:#00201E;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
  --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
  --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
}}
* { margin:0; padding:0; box-sizing:border-box; }
.material-symbols-outlined { font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; }
body { font-family:var(--font-display); background:var(--background); color:var(--on-background); display:flex; flex-direction:column; min-height:100vh; }
.top-bar { display:flex; align-items:center; gap:var(--sp-md); padding:14px var(--sp-lg); background:var(--primary); color:var(--on-primary); position:sticky; top:0; z-index:10; }
.top-bar .nav-icon { font-size:var(--icon-md); color:var(--on-primary); cursor:pointer; }
.top-bar h1 { font-size:18px; font-weight:600; flex:1; color:var(--on-primary); }
.scroll-area { flex:1; overflow-y:auto; padding-bottom:var(--sp-md); }
.txn-card { background:var(--primary); color:var(--on-primary); border-radius:var(--radius-xl); padding:20px; margin:var(--sp-md) var(--sp-lg) var(--sp-lg); }
.txn-merchant { font-size:22px; font-weight:600; color:var(--on-primary); padding-bottom:var(--sp-sm); }
.txn-amount { font-size:34px; font-weight:700; color:var(--on-primary); padding-bottom:var(--sp-xs); letter-spacing:-0.5px; }
.txn-date { font-size:14px; color:var(--primary-container); }
.section-label { font-size:16px; font-weight:600; color:var(--on-surface); padding:0 var(--sp-lg) 10px; }
@keyframes shimmer { 0% { opacity:0.55; } 50% { opacity:1; } 100% { opacity:0.55; } }
.sk { background:var(--surface-variant); border-radius:var(--radius-sm); animation:shimmer 1.3s ease-in-out infinite; }
@media (prefers-reduced-motion:reduce){ .sk { animation:none; } }
.sk-chips { display:flex; flex-wrap:wrap; gap:var(--sp-sm); padding:0 var(--sp-lg) 16px; }
.sk-chip { height:30px; border-radius:var(--radius-xl); }
.sk-chip.w1 { width:108px; } .sk-chip.w2 { width:96px; } .sk-chip.w3 { width:124px; }
.sk-row { display:flex; align-items:center; gap:var(--sp-sm); padding:0 var(--sp-lg) var(--sp-lg); }
.sk-input { flex:1; height:48px; border-radius:var(--radius-md); }
.sk-btn { width:64px; height:48px; border-radius:var(--radius-md); }
.sk-note { height:96px; border-radius:var(--radius-md); margin:0 var(--sp-lg) var(--sp-lg); }
.divider { height:1px; background:var(--outline-variant); margin:0 var(--sp-lg) var(--sp-lg); }
.bottom-nav { position:sticky; bottom:0; display:flex; justify-content:space-around; align-items:center; background:var(--surface); border-top:1px solid var(--outline-variant); padding:8px 0 12px; z-index:10; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; cursor:pointer; color:var(--on-surface-variant); }
.nav-item .icon-pill { display:flex; align-items:center; justify-content:center; width:56px; height:30px; border-radius:var(--radius-xl); }
.nav-item.active { color:var(--primary); }
.nav-item.active .icon-pill { background:var(--nav-active-indicator); }
.nav-item .material-symbols-outlined { font-size:var(--icon-md); }
.nav-item span.lbl { font-size:11px; font-weight:500; }
</style>
</head>
<body>
  <header class="top-bar" data-component-type="top_app_bar" data-component-id="top_app_bar">
    <span class="material-symbols-outlined nav-icon" data-component-type="icon" data-component-id="back_button" data-nav-to="transaction-detail" data-nav-type="pop" role="button" aria-label="Back" tabindex="0">arrow_back</span>
    <h1 data-component-type="text" data-component-id="top_bar_title">Tags &amp; Notes</h1>
  </header>

  <main class="scroll-area" data-component-type="stack" data-component-id="scroll_area" aria-busy="true">
    <div class="txn-card" data-component-type="box" data-component-id="transaction_header_card" role="region" aria-label="Transaction: Tesco, debit £67.84, 23 May 2026">
      <div class="txn-merchant" data-component-type="text" data-component-id="txn_merchant">Tesco</div>
      <div class="txn-amount" data-component-type="text" data-component-id="txn_amount">-£67.84</div>
      <div class="txn-date" data-component-type="text" data-component-id="txn_date">23 May 2026 · 14:32</div>
    </div>

    <div class="section-label" data-component-type="text" data-component-id="tags_section_label" role="heading" aria-level="2">Tags</div>
    <div class="sk-chips" data-component-type="stack" data-component-id="tags_chips_row" aria-label="Loading tags">
      <div class="sk sk-chip w1" data-component-type="box" data-component-id="skeleton_chip_1"></div>
      <div class="sk sk-chip w2" data-component-type="box" data-component-id="skeleton_chip_2"></div>
      <div class="sk sk-chip w3" data-component-type="box" data-component-id="skeleton_chip_3"></div>
    </div>

    <div class="sk-row" data-component-type="stack" data-component-id="add_tag_row">
      <div class="sk sk-input" data-component-type="input" data-component-id="add_tag_input"></div>
      <div class="sk sk-btn" data-component-type="button" data-component-id="add_tag_button"></div>
    </div>

    <div class="divider" data-component-type="divider" data-component-id="notes_divider"></div>
    <div class="section-label" data-component-type="text" data-component-id="notes_section_label" role="heading" aria-level="2">Notes</div>
    <div class="sk sk-note" data-component-type="input" data-component-id="notes_text_area"></div>
  </main>

  <nav class="bottom-nav" data-component-type="bottom_nav" data-component-id="bottom_nav">
    <div class="nav-item" data-component-type="box" data-component-id="nav_home" data-nav-to="home" role="button" aria-label="Home" tabindex="0"><span class="icon-pill"><span class="material-symbols-outlined">home</span></span><span class="lbl">Home</span></div>
    <div class="nav-item active" data-component-type="box" data-component-id="nav_accounts" data-nav-to="accounts" role="button" aria-label="Accounts" tabindex="0"><span class="icon-pill"><span class="material-symbols-outlined">account_balance</span></span><span class="lbl">Accounts</span></div>
    <div class="nav-item" data-component-type="box" data-component-id="nav_pay" data-nav-to="pay" role="button" aria-label="Pay" tabindex="0"><span class="icon-pill"><span class="material-symbols-outlined">send</span></span><span class="lbl">Pay</span></div>
    <div class="nav-item" data-component-type="box" data-component-id="nav_insights" data-nav-to="pfm-dashboard" role="button" aria-label="Insights" tabindex="0"><span class="icon-pill"><span class="material-symbols-outlined">insights</span></span><span class="lbl">Insights</span></div>
    <div class="nav-item" data-component-type="box" data-component-id="nav_more" data-nav-to="settings" role="button" aria-label="More" tabindex="0"><span class="icon-pill"><span class="material-symbols-outlined">more_horiz</span></span><span class="lbl">More</span></div>
  </nav>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
