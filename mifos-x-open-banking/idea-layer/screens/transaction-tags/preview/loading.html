<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Tags &amp; Notes — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
}
.top-bar{
  display:flex;align-items:center;padding:0 4px;height:56px;
  background:var(--surface);border-bottom:1px solid var(--surface-variant);
}
.top-bar-btn{
  width:48px;height:48px;border:none;background:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:var(--text-primary);flex-shrink:0;
}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);padding-left:4px;}
/* Skeleton shimmer */
@keyframes shimmer{
  0%{background-position:-390px 0}
  100%{background-position:390px 0}
}
.skeleton{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}
.txn-card-skel{
  margin:16px 20px 20px;height:112px;border-radius:20px;
}
.skeleton-row{display:flex;gap:8px;padding:0 20px;margin-bottom:12px;}
.skel-tag{height:32px;border-radius:20px;flex:0 0 90px;}
.skel-tag-wide{height:32px;border-radius:20px;flex:0 0 130px;}
.skel-input{height:48px;border-radius:12px;flex:1;margin:0 20px 20px;}
.skel-section-label{height:20px;width:60px;border-radius:6px;margin:0 20px 10px;}
.skel-textarea{height:100px;border-radius:12px;margin:0 20px 20px;}
.skel-receipt{height:120px;border-radius:16px;margin:0 20px 20px;}
</style>
</head>
<body>
<main data-screen="transaction-tags" data-state="loading" role="main" aria-busy="true" aria-label="Loading tags and notes">

  <div class="top-bar">
    <button class="top-bar-btn" aria-label="Back" data-action="navigate_back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="top-bar-title">Tags &amp; Notes</span>
  </div>

  <!-- Transaction header card skeleton -->
  <div class="skeleton txn-card-skel" aria-hidden="true"></div>

  <!-- Tags label skeleton -->
  <div class="skeleton skel-section-label" aria-hidden="true"></div>

  <!-- Tag chip skeletons -->
  <div class="skeleton-row" aria-hidden="true">
    <div class="skeleton skel-tag"></div>
    <div class="skeleton skel-tag-wide"></div>
    <div class="skeleton skel-tag"></div>
  </div>

  <!-- Add tag input skeleton -->
  <div class="skeleton skel-input" aria-hidden="true"></div>

  <!-- Notes label skeleton -->
  <div class="skeleton skel-section-label" aria-hidden="true"></div>

  <!-- Notes textarea skeleton -->
  <div class="skeleton skel-textarea" aria-hidden="true"></div>

  <!-- Receipt skeleton -->
  <div class="skeleton skel-section-label" aria-hidden="true"></div>
  <div class="skeleton skel-receipt" aria-hidden="true"></div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
