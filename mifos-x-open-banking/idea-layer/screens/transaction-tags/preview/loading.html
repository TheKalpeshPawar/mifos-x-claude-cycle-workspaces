.skel { background: linear-gradient(90deg, var(--skel-base) 0%, var(--skel-shine) 50%, var(--skel-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }

.skel-input { height: 48px; margin: 0 20px 20px; border-radius: 12px; }
