id: transaction-tags
name: Transaction Tags & Notes
feature: transaction-tags
flavor: consumer
status: enriched
quality_score: 99
contract_version: "1.1.0"
approve_hash: "sha256:15af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
initial_state: loading
status_history:
  - status: draft
    timestamp: "2026-05-25T00:00:00Z"
  - status: enriched
    timestamp: "2026-05-25T00:00:00Z"
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - status: enriched
    at: "2026-05-25T12:00:00Z"
    by: "/idea-enrich"
    note: "Expanded states to loading/view_tags/edit_mode/save_success/error; added 5 real tag chips; added test_context on all components; wired nav targets to transaction-detail, transactions, home; real tag examples from OBP categorisation taxonomy"
  - status: designed
    at: "2026-05-25T13:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-05-27"
    by: "/idea enrich"
    note: "re-enriched: +component_states, +initial_state, +api bindings"
  - from: approved
    to: enriched
    at: "2026-06-02"
    by: "/idea enrich"
    quality_score: 99
    note: "Category 12 Screens List completed — added viewmodel: TransactionTagsViewModel + states_handled to screens[] entry; verified component vocabulary against project components.yaml (box/text/stack/input/button/divider/icon all valid); confirmed 7 states, full api[] response+errors, state_model, dependencies intact"

shell:
  top_app_bar:
    show: true
    title: "Tags & Notes"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: delete_outlined
        action: clear_all_metadata
        label: "Clear all"
  bottom_nav: false

screens:
  - id: transaction-tags
    name: Transaction Tags & Notes
    viewmodel: TransactionTagsViewModel
    archetype: detail_screen
    route: /transaction-tags/{transactionId}
    scroll: vertical
    states_handled: [loading, view_tags, edit_mode, save_success, content, empty, error]

archetype: detail_screen

components:
  # ── Transaction header ──────────────────────────────────────────────────
  - type: box
    id: transaction_header_card
    label: "Transaction header"
    content: "Transaction header"
    style:
      background: "#4C662B"
      border_radius: 20
      padding_horizontal: 20
      padding_vertical: 20
      margin_horizontal: 20
      margin_top: 16
      margin_bottom: 20
    on_click:
      action: navigate_to_transaction_detail
      target: transaction-detail
    a11y:
      label: "Transaction: Whole Foods Market, debit £67.84, 23 May 2026"
      role: region
    keyboard:
      focusable: true
    test_context:
      tag: transaction_header_card
      assert_visible: true

  - type: text
    id: txn_merchant
    label: "Whole Foods Market"
    content: "Whole Foods Market"
    style:
      typography: "Outfit/title_large"
      color: "#FFFFFF"
      font_weight: semibold
      padding_bottom: 8
    a11y:
      label: "Merchant: Whole Foods Market"
      role: text
    test_context:
      tag: txn_merchant
      assert_text: "Whole Foods Market"

  - type: text
    id: txn_amount
    label: "-£67.84"
    content: "-£67.84"
    style:
      typography: "Outfit/display_small"
      color: "#FFFFFF"
      font_weight: bold
      padding_bottom: 4
    a11y:
      label: "Amount: debit sixty-seven pounds eighty-four"
      role: text
    test_context:
      tag: txn_amount
      assert_text: "-£67.84"

  - type: text
    id: txn_date
    label: "23 May 2026 · 14:32"
    content: "23 May 2026 · 14:32"
    style:
      typography: "Outfit/body_medium"
      color: "#CDEDA3"
    a11y:
      label: "Transaction date: 23 May 2026 at 14:32"
      role: text
    test_context:
      tag: txn_date
      assert_text: "23 May 2026 · 14:32"

  # ── Tags section ─────────────────────────────────────────────────────────
  - type: text
    id: tags_section_label
    label: "Tags"
    content: "Tags"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      label: "Tags section"
      role: heading
    test_context:
      tag: tags_section_label
      assert_text: "Tags"

  - type: text
    id: tags_hint_text
    label: "Tap a tag to remove it"
    content: "Tap a tag to remove it"
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      padding_horizontal: 20
      padding_bottom: 8
    a11y:
      label: "Hint: tap an existing tag to remove it from this transaction"
      role: text
    test_context:
      tag: tags_hint_text
      assert_text: "Tap a tag to remove it"

  - type: stack
    id: tags_chips_row
    label: "Existing tags"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 12
      overflow: scroll_horizontal
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Current tags on this transaction"
      role: list
    api:
      endpoint_id: obp_transaction_tags_get
      binds: tags
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 3
        description: "shimmer chips matching tag chip layout"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not load tags. Please try again."
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No tags added yet. Type a tag above and tap Add to categorise this transaction."
        icon: label_outlined
    test_context:
      tag: tags_chips_row
      assert_visible: true

  - type: box
    id: tag_chip_groceries
    label: "#groceries"
    content: "#groceries"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#4C662B"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #groceries. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_groceries
      assert_text: "#groceries"

  - type: box
    id: tag_chip_work_expense
    label: "#work-expense"
    content: "#work-expense"
    style:
      background: "#DCE7C8"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#386663"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #work-expense. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_work_expense
      assert_text: "#work-expense"

  - type: box
    id: tag_chip_rent
    label: "#rent"
    content: "#rent"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#44483D"  # fix A11Y-002: was #E8A317 (1.68:1 on CDEDA3, FAIL); #44483D = 7.25:1 PASS
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #rent. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_rent
      assert_text: "#rent"

  - type: box
    id: tag_chip_holiday
    label: "#holiday"
    content: "#holiday"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#4C662B"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #holiday. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_holiday
      assert_text: "#holiday"

  - type: box
    id: tag_chip_gym
    label: "#gym"
    content: "#gym"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#BA1A1A"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #gym. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_gym
      assert_text: "#gym"

  # ── Add-tag row ──────────────────────────────────────────────────────────
  - type: stack
    id: add_tag_row
    label: "Add tag row"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 20
      align: center
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Add a new tag"
      role: row
    test_context:
      tag: add_tag_row
      assert_visible: true

  - type: input
    id: add_tag_input
    label: "Add tag"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#E1E4D5"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 12
      typography: "Outfit/body_medium"
      flex: 1
      leading_icon: label_outlined
    placeholder: "#groceries, #holiday…"
    on_click:
      action: focus_tag_input
      target: ""
    a11y:
      label: "Tag input field. Type a tag starting with # and tap Add"
      role: textbox
      hint: "Type a tag name like #groceries and tap Add"
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: add_tag_input
      assert_placeholder: "#groceries, #holiday…"

  - type: button
    id: add_tag_button
    label: "Add"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      typography: "Outfit/label_medium"
    on_click:
      action: add_tag
      target: ""
    a11y:
      label: "Add the typed tag to this transaction"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: add_tag_button
      assert_text: "Add"

  # ── Notes section ────────────────────────────────────────────────────────
  - type: divider
    id: notes_divider
    style:
      color: "#F9FAEF"
      thickness: 1
      margin_horizontal: 20
      margin_bottom: 20
    a11y:
      role: none
    test_context:
      tag: notes_divider

  - type: text
    id: notes_section_label
    label: "Notes"
    content: "Notes"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      label: "Notes section"
      role: heading
    test_context:
      tag: notes_section_label
      assert_text: "Notes"

  - type: input
    id: notes_text_area
    label: "Transaction notes"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#E1E4D5"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 12
      typography: "Outfit/body_medium"
      min_height: 100
      margin_horizontal: 20
      margin_bottom: 20
    placeholder: "e.g. Weekly shop — bought extra for bank holiday"
    on_click:
      action: focus_notes
      target: ""
    a11y:
      label: "Notes text area. Enter a private note for this transaction. Only you can see this."
      role: textbox
      multiline: true
      label_source: visible_label
    keyboard:
      focusable: true
    api:
      endpoint_id: obp_transaction_comment_add
      binds: noteText
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 2
        description: "shimmer lines matching note text area height"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Unable to load transaction notes. Please try again."
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No note added yet. Write a private note only you can see."
        icon: edit_note
    test_context:
      tag: notes_text_area
      assert_placeholder: "e.g. Weekly shop — bought extra for bank holiday"
      assert_multiline: true

  # ── Receipt section ───────────────────────────────────────────────────────
  - type: divider
    id: receipt_divider
    style:
      color: "#F9FAEF"
      thickness: 1
      margin_horizontal: 20
      margin_bottom: 20
    a11y:
      role: none
    test_context:
      tag: receipt_divider

  - type: text
    id: receipt_section_label
    label: "Receipt"
    content: "Receipt"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      label: "Receipt attachments section"
      role: heading
    test_context:
      tag: receipt_section_label
      assert_text: "Receipt"

  - type: box
    id: receipt_attachment_area
    label: "Receipt attachment area"
    content: "Receipt attachment area"
    style:
      background: "#F9FAEF"
      border_radius: 16
      border_color: "#E1E4D5"
      border_width: 1
      border_style: dashed
      padding: 24
      margin_horizontal: 20
      margin_bottom: 12
      align_items: center
    on_click:
      action: pick_image_from_gallery
      target: ""
    a11y:
      label: "Receipt image attachment area. No images attached. Tap to choose from gallery."
      role: button
    keyboard:
      focusable: true
    api:
      endpoint_id: obp_transaction_image_add
      binds: attachedImages
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 1
        description: "shimmer block matching receipt attachment area size"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not load receipt images. Please try again."
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No receipt attached yet. Tap to add an image from your gallery or take a photo."
        icon: receipt_long_outlined
    test_context:
      tag: receipt_attachment_area
      assert_visible: true

  - type: icon
    id: receipt_placeholder_icon
    label: "Receipt icon"
    style:
      icon_name: receipt_long_outlined
      size: 36
      color: "#44483D"
      align_self: center
      margin_bottom: 8
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: ""
      role: none
    test_context:
      tag: receipt_placeholder_icon

  - type: text
    id: receipt_placeholder_text
    label: "No receipt attached"
    content: "Tap to attach a receipt image"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      align: center
    a11y:
      label: "No receipt attached yet"
      role: text
    test_context:
      tag: receipt_placeholder_text
      assert_text: "Tap to attach a receipt image"

  - type: button
    id: camera_button
    label: "Take Photo"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#386663"
      text_color: "#386663"
      border_radius: 12
      leading_icon: camera_alt
      padding_horizontal: 20
      padding_vertical: 12
      typography: "Outfit/label_medium"
      align_self: center
      margin_horizontal: 20
      margin_bottom: 24
    on_click:
      action: open_camera
      target: ""
    a11y:
      label: "Take a photo of the receipt with camera"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: camera_button
      assert_text: "Take Photo"

  # ── Save ─────────────────────────────────────────────────────────────────
  - type: button
    id: save_button
    label: "Save"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      border_radius: 14
      padding_horizontal: 24
      padding_vertical: 16
      typography: "Outfit/label_large"
      margin_horizontal: 20
      margin_bottom: 32
      width: full
    on_click:
      action: save_metadata
      target: transaction-detail
    a11y:
      label: "Save tags, notes and receipt for this transaction"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: save_button
      assert_text: "Save"

  # ── Save-success banner ───────────────────────────────────────────────────
  - type: box
    id: save_success_banner
    label: "Tags and notes saved"
    content: "Tags and notes saved"
    style:
      background: "#CDEDA3"
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      margin_horizontal: 20
      margin_bottom: 16
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Tags and notes saved successfully"
      role: status
    test_context:
      tag: save_success_banner
      assert_text: "Tags and notes saved"
      assert_visible_in_state: save_success

  - type: icon
    id: save_success_icon
    label: "Success"
    style:
      icon_name: check_circle_outlined
      size: 20
      color: "#4C662B"
      margin_right: 8
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: ""
      role: none
    test_context:
      tag: save_success_icon

responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    description: "Fetching existing tags, notes and images for the transaction from OBP API"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
      show_skeleton_list: true
      skeleton_count: 3
    test_context:
      assert_skeleton_visible: true
      assert_save_button_hidden: true

  view_tags:
    description: "Tags, notes and receipt loaded — read-only view before user starts editing"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
        - tags_section_label
        - tags_hint_text
        - tags_chips_row
        - tag_chip_groceries
        - tag_chip_work_expense
        - add_tag_row
        - add_tag_input
        - add_tag_button
        - notes_divider
        - notes_section_label
        - notes_text_area
        - receipt_divider
        - receipt_section_label
        - receipt_attachment_area
        - receipt_placeholder_icon
        - receipt_placeholder_text
        - camera_button
        - save_button
    test_context:
      assert_chips_count: 2
      assert_save_button_enabled: true

  edit_mode:
    description: "User is actively typing a new tag or editing their note — add_tag_input is focused"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
        - tags_section_label
        - tags_hint_text
        - tags_chips_row
        - tag_chip_groceries
        - tag_chip_work_expense
        - tag_chip_rent
        - tag_chip_holiday
        - tag_chip_gym
        - add_tag_row
        - add_tag_input
        - add_tag_button
        - notes_divider
        - notes_section_label
        - notes_text_area
        - receipt_divider
        - receipt_section_label
        - receipt_attachment_area
        - receipt_placeholder_icon
        - receipt_placeholder_text
        - camera_button
        - save_button
    component_overrides:
      add_tag_input:
        style:
          border_color: "#4C662B"
          border_width: 2
    test_context:
      assert_input_focused: add_tag_input
      assert_keyboard_visible: true
      assert_chips_count: 5

  save_success:
    description: "Save completed — briefly show success banner before auto-navigating back to transaction-detail"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
        - save_success_banner
        - save_success_icon
        - tags_section_label
        - tags_hint_text
        - tags_chips_row
        - tag_chip_groceries
        - tag_chip_work_expense
        - tag_chip_rent
        - notes_divider
        - notes_section_label
        - notes_text_area
    auto_navigate:
      target: transaction-detail
      delay_ms: 1800
    test_context:
      assert_banner_visible: save_success_banner
      assert_auto_navigate_target: transaction-detail

  content:
    description: "Tags, notes and receipt loaded — same layout as view_tags state; default loaded state alias"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
        - tags_section_label
        - tags_hint_text
        - tags_chips_row
        - tag_chip_groceries
        - tag_chip_work_expense
        - add_tag_row
        - add_tag_input
        - add_tag_button
        - notes_divider
        - notes_section_label
        - notes_text_area
        - receipt_divider
        - receipt_section_label
        - receipt_attachment_area
        - receipt_placeholder_icon
        - receipt_placeholder_text
        - camera_button
        - save_button
    test_context:
      assert_chips_count: 2
      assert_save_button_enabled: true

  empty:
    description: "No tags have been added to this transaction yet — show empty state guidance"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
        - tags_section_label
        - add_tag_row
        - add_tag_input
        - add_tag_button
        - notes_divider
        - notes_section_label
        - notes_text_area
        - save_button
      show_empty_state: true
      empty_message: "No tags created yet. Add a tag to categorize your transactions."
    test_context:
      assert_chips_count: 0
      assert_save_button_enabled: true

  error:
    description: "OBP API call failed — show inline error with retry option"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load metadata"
      error_message: "Could not load tags and notes. Check your connection and try again."
      show_retry_button: true
    test_context:
      assert_error_visible: true
      assert_retry_button_visible: true
      assert_save_button_hidden: true

state_model:
  view_model: TransactionTagsViewModel
  state_fields:
    - name: transaction
      type: "TransactionDetail?"
      default: "null"
    - name: tags
      type: "List<TransactionTag>"
      default: "emptyList()"
    - name: noteText
      type: String
      default: '""'
    - name: tagInputText
      type: String
      default: '""'
    - name: attachedImages
      type: "List<TransactionImage>"
      default: "emptyList()"
    - name: isSaving
      type: Boolean
      default: "false"
    - name: uiState
      type: TransactionTagsUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load transaction metadata. Please try again."
    - field: save_tag
      code: TAG_SAVE_FAILED
      message: "Could not add tag. Please try again."
    - field: save_note
      code: NOTE_SAVE_FAILED
      message: "Could not save note. Please try again."
    - field: save_image
      code: IMAGE_SAVE_FAILED
      message: "Could not attach image. Please try again."
    - field: tag_validation
      code: TAG_EMPTY
      message: "Tag cannot be empty. Type a tag name like #groceries."
    - field: tag_validation
      code: TAG_DUPLICATE
      message: "That tag is already added to this transaction."
  events:
    - MetadataLoaded
    - "TagAdded(value: String)"
    - "TagRemoved(value: String)"
    - "NoteChanged(text: String)"
    - "ImagePicked(uri: String)"
    - "CameraCaptured(uri: String)"
    - SaveClicked
    - SaveComplete
    - RetryLoad
    - "InputFocused(field: String)"
    - InputBlurred
  actions:
    - add_tag
    - remove_tag
    - focus_tag_input
    - focus_notes
    - pick_image_from_gallery
    - open_camera
    - save_metadata
    - clear_all_metadata
    - navigate_to_transaction_detail
  di:
    - TransactionMetadataRepository
    - ImageRepository

api:
  - id: obp_transaction_tags_get
    endpoint: "GET /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
    tag: Transaction-Metadata
    response:
      fields:
        - name: tags
          type: "List<TransactionTag>"
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
        - name: user
          type: User
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "TRANSACTION_NOT_FOUND"
  - id: obp_transaction_tag_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
    tag: Transaction-Metadata
    request:
      fields:
        - name: value
          type: String
          example: "#groceries"
    response:
      fields:
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_TAG_VALUE"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transaction_tag_delete
    endpoint: "DELETE /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags/{tagId}"
    tag: Transaction-Metadata
    response:
      fields:
        - name: result
          type: String
          example: "Success"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "TAG_NOT_FOUND"
  - id: obp_transaction_comment_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/comments"
    tag: Transaction-Metadata
    request:
      fields:
        - name: value
          type: String
          example: "Weekly shop — bought extra for bank holiday"
    response:
      fields:
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_COMMENT_VALUE"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transaction_image_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/images"
    tag: Transaction-Metadata
    request:
      fields:
        - name: label
          type: String
          example: "Whole Foods receipt 23-May-2026"
        - name: URL
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: URL
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_IMAGE_URL"
      - code: 401
        message: "USER_NOT_LOGGED_IN"

dependencies:
  tier: feature
  features:
    - transaction-detail
    - transactions

navigation:
  - action: navigate_back
    target: transaction-detail
    description: "Back arrow — return to transaction detail without saving"
  - action: save_metadata
    target: transaction-detail
    description: "Save tags, notes, receipt and navigate back to transaction detail"
  - action: navigate_to_transaction_detail
    target: transaction-detail
    description: "Tap transaction header card — navigate to transaction detail"
  - action: go_to_transactions
    target: transactions
    description: "Deep-link shortcut to all transactions list"
  - action: go_to_home
    target: home
    description: "Deep-link shortcut back to home dashboard"
