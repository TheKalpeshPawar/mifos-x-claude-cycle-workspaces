    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

shell:
  top_app_bar:
    show: true
    title: "Tags & Notes"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    # Shipped TopAppBar has no actions — the clear-all action was omitted (destructive, low value).
    actions: []
  bottom_nav: false

screens:
  - id: transaction-tags
    name: Transaction Tags & Notes
    viewmodel: TransactionTagsViewModel
    archetype: detail_screen
    route: /transaction-tags/{transactionId}
    scroll: vertical
    # Shipped ScreenState set. The spec's view_tags/edit_mode/save_success are realized as one
    # content state + isSaving + notice/saved side flows; empty routes to the error/retry card.
    states_handled: [loading, content, empty, error, no_network, unauthenticated]

archetype: detail_screen

components:
  # ── Transaction header ──────────────────────────────────────────────────
  - type: box
    id: transaction_header_card
    label: "Transaction header"
    content: "Transaction header"
    style:
      background: "#4C662B"
      border_radius: 20
      padding_horizontal: 20
      padding_vertical: 20
      margin_horizontal: 20
      margin_top: 16
      margin_bottom: 20
    on_click:
      action: navigate_to_transaction_detail
      target: transaction-detail
    a11y:
      label: "Transaction: Whole Foods Market, debit £67.84, 23 May 2026"
      role: region
    keyboard:
      focusable: true
    test_context:
      tag: transaction_header_card
      assert_visible: true

  # content.merchant — counterpartyDisplayName(transaction, names, placeholder).ifBlank{"Transaction"}.
  # NEVER the raw other_account.holder.name (OBP login-username placeholder). HARD RULE:
  # workspaces/mifos-x/CLAUDE.md.
  - type: text
    id: txn_merchant
    label: "Whole Foods Market"
    content: "Whole Foods Market"
    bound_field: merchant
    style:
      typography: "Outfit/title_large"
      color: "#FFFFFF"
      font_weight: semibold
      padding_bottom: 8
    a11y:
      label: "Merchant: Whole Foods Market"
      role: text
    test_context:
      tag: txn_merchant
      assert_text: "Whole Foods Market"

  - type: text
    id: txn_amount
    label: "-£67.84"
    content: "-£67.84"
    style:
      typography: "Outfit/display_small"
      color: "#FFFFFF"
      font_weight: bold
      padding_bottom: 4
    a11y:
      label: "Amount: debit sixty-seven pounds eighty-four"
      role: text
    test_context:
      tag: txn_amount
      assert_text: "-£67.84"

  - type: text
    id: txn_date
    label: "23 May 2026 · 14:32"
    content: "23 May 2026 · 14:32"
    style:
      typography: "Outfit/body_medium"
      color: "#CDEDA3"
    a11y:
      label: "Transaction date: 23 May 2026 at 14:32"
      role: text
    test_context:
      tag: txn_date
      assert_text: "23 May 2026 · 14:32"

  # ── Tags section ─────────────────────────────────────────────────────────
  - type: text
    id: tags_section_label
    label: "Tags"
    content: "Tags"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      label: "Tags section"
      role: heading
    test_context:
      tag: tags_section_label
      assert_text: "Tags"

  - type: text
    id: tags_hint_text
    label: "Tap a tag to remove it"
    content: "Tap a tag to remove it"
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      padding_horizontal: 20
      padding_bottom: 8
    a11y:
      label: "Hint: tap an existing tag to remove it from this transaction"
      role: text
    test_context:
      tag: tags_hint_text
      assert_text: "Tap a tag to remove it"

  - type: stack
    id: tags_chips_row
    label: "Existing tags"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 12
      overflow: scroll_horizontal
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Current tags on this transaction"
      role: list
    local_store:
      operation_id: local_tags_get
      binds: tags
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 3
        description: "shimmer chips matching tag chip layout"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not load tags. Please try again."
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No tags added yet. Type a tag above and tap Add to categorise this transaction."
        icon: label_outlined
    test_context:
      tag: tags_chips_row
      assert_visible: true

  - type: box
    id: tag_chip_groceries
    label: "#groceries"
    content: "#groceries"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#4C662B"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #groceries. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_groceries
      assert_text: "#groceries"

  - type: box
    id: tag_chip_work_expense
    label: "#work-expense"
    content: "#work-expense"
    style:
      background: "#DCE7C8"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#386663"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #work-expense. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_work_expense
      assert_text: "#work-expense"

  - type: box
    id: tag_chip_rent
    label: "#rent"
    content: "#rent"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#44483D"  # fix A11Y-002: was #E8A317 (1.68:1 on CDEDA3, FAIL); #44483D = 7.25:1 PASS
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #rent. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_rent
      assert_text: "#rent"

  - type: box
    id: tag_chip_holiday
    label: "#holiday"
    content: "#holiday"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#4C662B"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #holiday. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_holiday
      assert_text: "#holiday"

  - type: box
    id: tag_chip_gym
    label: "#gym"
    content: "#gym"
    style:
      background: "#CDEDA3"
      border_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#BA1A1A"
      typography: "Outfit/label_medium"
    on_click:
      action: remove_tag
      target: ""
    a11y:
      label: "Tag: #gym. Tap to remove."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: tag_chip_gym
      assert_text: "#gym"

  # ── Add-tag row ──────────────────────────────────────────────────────────
  - type: stack
    id: add_tag_row
    label: "Add tag row"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 20
      align: center
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Add a new tag"
      role: row
    test_context:
      tag: add_tag_row
      assert_visible: true

  - type: input
    id: add_tag_input
    label: "Add tag"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#E1E4D5"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 12
      typography: "Outfit/body_medium"
      flex: 1
      leading_icon: label_outlined
    placeholder: "#groceries, #holiday…"
    on_click:
      action: focus_tag_input
      target: ""
    a11y:
      label: "Tag input field. Type a tag starting with # and tap Add"
      role: textbox
      hint: "Type a tag name like #groceries and tap Add"
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: add_tag_input
      assert_placeholder: "#groceries, #holiday…"

  - type: button
    id: add_tag_button
    label: "Add"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      typography: "Outfit/label_medium"
    on_click:
      action: add_tag
      target: ""
    a11y:
      label: "Add the typed tag to this transaction"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: add_tag_button
      assert_text: "Add"

  # ── Notes section ────────────────────────────────────────────────────────
  - type: divider
    id: notes_divider
    style:
      color: "#F9FAEF"
      thickness: 1
      margin_horizontal: 20
      margin_bottom: 20
    a11y:
      role: none
    test_context:
      tag: notes_divider

  - type: text
    id: notes_section_label
    label: "Notes"
    content: "Notes"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      label: "Notes section"
      role: heading
    test_context:
      tag: notes_section_label
      assert_text: "Notes"

  - type: input
    id: notes_text_area
    label: "Transaction notes"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#E1E4D5"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 12
      typography: "Outfit/body_medium"
      min_height: 100
      margin_horizontal: 20
      margin_bottom: 20
    placeholder: "e.g. Weekly shop — bought extra for bank holiday"
    on_click:
      action: focus_notes
      target: ""
    a11y:
      label: "Notes text area. Enter a private note for this transaction. Only you can see this."
      role: textbox
      multiline: true
      label_source: visible_label
    keyboard:
      focusable: true
    local_store:
      operation_id: local_note_set
      binds: note
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 2
        description: "shimmer lines matching note text area height"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Unable to load transaction notes. Please try again."
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No note added yet. Write a private note only you can see."
        icon: edit_note
    test_context:
      tag: notes_text_area
      assert_placeholder: "e.g. Weekly shop — bought extra for bank holiday"
      assert_multiline: true

  # ── Receipt section ───────────────────────────────────────────────────────
  - type: divider
    id: receipt_divider
    style:
      color: "#F9FAEF"
      thickness: 1
      margin_horizontal: 20
      margin_bottom: 20
    a11y:
      role: none
    test_context:
      tag: receipt_divider

  - type: text
    id: receipt_section_label
    label: "Receipt"
    content: "Receipt"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      label: "Receipt attachments section"
      role: heading
    test_context:
      tag: receipt_section_label
      assert_text: "Receipt"

  - type: box
    id: receipt_attachment_area
    label: "Receipt attachment area"
    content: "Receipt attachment area"
    style:
      background: "#F9FAEF"
      border_radius: 16
      border_color: "#E1E4D5"
      border_width: 1
      border_style: dashed
      padding: 24
      margin_horizontal: 20
      margin_bottom: 12
      align_items: center
    on_click:
      action: pick_image_from_gallery
      target: ""
    a11y:
      label: "Receipt image attachment area. No images attached. Tap to choose from gallery."
      role: button
    keyboard:
      focusable: true
    unsupported:
      capability: receipt_image_upload
      reason: "OBIE has no transaction-image API and no device upload host — 'coming soon' placeholder. No local store op (mirrors api.yaml#/unsupported)."
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 1
        description: "shimmer block matching receipt attachment area size"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not load receipt images. Please try again."
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No receipt attached yet. Tap to add an image from your gallery or take a photo."
        icon: receipt_long_outlined
    test_context:
      tag: receipt_attachment_area
      assert_visible: true

  - type: icon
    id: receipt_placeholder_icon
    label: "Receipt icon"
    style:
      icon_name: receipt_long_outlined
      size: 36
      color: "#44483D"
      align_self: center
      margin_bottom: 8
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: ""
      role: none
    test_context:
      tag: receipt_placeholder_icon

  - type: text
    id: receipt_placeholder_text
    label: "No receipt attached"
    content: "Tap to attach a receipt image"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      align: center
    a11y:
      label: "No receipt attached yet"
      role: text
    test_context:
      tag: receipt_placeholder_text
      assert_text: "Tap to attach a receipt image"

  - type: button
    id: camera_button
    label: "Take Photo"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#386663"
      text_color: "#386663"
      border_radius: 12
      leading_icon: camera_alt
      padding_horizontal: 20
      padding_vertical: 12
      typography: "Outfit/label_medium"
      align_self: center
      margin_horizontal: 20
      margin_bottom: 24
    on_click:
      action: open_camera
      target: ""
    a11y:
      label: "Take a photo of the receipt with camera"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: camera_button
      assert_text: "Take Photo"

  # ── Save ─────────────────────────────────────────────────────────────────
  - type: button
    id: save_button
    label: "Save"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      border_radius: 14
      padding_horizontal: 24
      padding_vertical: 16
      typography: "Outfit/label_large"
      margin_horizontal: 20
      margin_bottom: 32
      width: full
    on_click:
      action: save_metadata
      target: transaction-detail
    a11y:
      label: "Save tags, notes and receipt for this transaction"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: save_button
      assert_text: "Save"

  # ── Save-success banner ───────────────────────────────────────────────────
  - type: box
    id: save_success_banner
    label: "Tags and notes saved"
    content: "Tags and notes saved"
    style:
      background: "#CDEDA3"
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      margin_horizontal: 20
      margin_bottom: 16
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "Tags and notes saved successfully"
      role: status
    test_context:
      tag: save_success_banner
      assert_text: "Tags and notes saved"
      assert_visible_in_state: save_success

  - type: icon
    id: save_success_icon
    label: "Success"
    style:
      icon_name: check_circle_outlined
      size: 20
      color: "#4C662B"
      margin_right: 8
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: ""
      role: none
    test_context:
      tag: save_success_icon

responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    description: "Loading the transaction (AIS) and its on-device tags and note from the local enrichment store"
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
      show_skeleton_list: true
      skeleton_count: 3
    test_context:
      assert_skeleton_visible: true
      assert_save_button_hidden: true

  view_tags:
    description: "Tags, notes and receipt loaded — read-only view before user starts editing"
    layout:
      visible_components:
