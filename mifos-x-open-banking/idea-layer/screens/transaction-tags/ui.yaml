id: transaction-tags
name: Transaction Tags & Notes
feature: transaction-tags
flavor: consumer
status: enriched
quality_score: 78
status_history:
  - status: draft
    timestamp: "2026-05-25T00:00:00Z"
  - status: enriched
    timestamp: "2026-05-25T00:00:00Z"

shell:
  top_app_bar:
    show: true
    title: "Tags & Notes"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: delete_outlined
        action: clear_all_metadata
        label: "Clear all"
  bottom_nav: false

screens:
  - id: transaction-tags
    name: Transaction Tags & Notes
    archetype: detail_screen
    route: /transaction-tags/{transactionId}
    scroll: vertical

components:
  - type: box
    id: transaction_header_card
    label: "Transaction header"
    content: "Transaction header"
    style:
      background: "#1800B1"
      corner_radius: 20
      padding_horizontal: 20
      padding_vertical: 20
      margin_horizontal: 20
      margin_top: 16
      margin_bottom: 20
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Transaction: Whole Foods Market, debit £67.84, 23 May 2026"
      role: region
    test_context:
      tag: transaction_header_card

  - type: text
    id: txn_merchant
    label: "Whole Foods Market"
    content: "Whole Foods Market"
    style:
      typography: title_large
      color: "#FFFFFF"
      font_weight: semibold
      padding_bottom: 8
    a11y:
      content_description: "Merchant: Whole Foods Market"
      role: text
    test_context:
      tag: txn_merchant
      assert_text: "Whole Foods Market"

  - type: text
    id: txn_amount
    label: "-£67.84"
    content: "-£67.84"
    style:
      typography: display_small
      color: "#FFFFFF"
      font_weight: bold
      padding_bottom: 4
    a11y:
      content_description: "Amount: debit sixty-seven pounds eighty-four"
      role: text
    test_context:
      tag: txn_amount
      assert_text: "-£67.84"

  - type: text
    id: txn_date
    label: "23 May 2026 · 14:32"
    content: "23 May 2026 · 14:32"
    style:
      typography: body_medium
      color: "#C5B8FF"
    a11y:
      content_description: "Transaction date: 23 May 2026 at 14:32"
      role: text
    test_context:
      tag: txn_date
      assert_text: "23 May 2026 · 14:32"

  - type: text
    id: tags_section_label
    label: "Tags"
    content: "Tags"
    style:
      typography: title_medium
      color: "#111111"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      content_description: "Tags section"
      role: heading
    test_context:
      tag: tags_section_label
      assert_text: "Tags"

  - type: stack
    id: tags_chips_row
    label: "Existing tags"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 12
      overflow: scroll_horizontal
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Current tags on this transaction"
      role: list
    test_context:
      tag: tags_chips_row

  - type: box
    id: tag_chip_groceries
    label: "Groceries"
    content: "Groceries"
    style:
      background: "#E8F5E9"
      corner_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#2E7D32"
      typography: label_medium
    on_click:
      action: remove_tag
      target: ""
    a11y:
      content_description: "Tag: Groceries. Tap to remove."
      role: button
    test_context:
      tag: tag_chip_groceries
      assert_text: "Groceries"

  - type: box
    id: tag_chip_organic
    label: "Organic"
    content: "Organic"
    style:
      background: "#E8F5E9"
      corner_radius: 20
      padding_horizontal: 12
      padding_vertical: 6
      text_color: "#2E7D32"
      typography: label_medium
    on_click:
      action: remove_tag
      target: ""
    a11y:
      content_description: "Tag: Organic. Tap to remove."
      role: button
    test_context:
      tag: tag_chip_organic
      assert_text: "Organic"

  - type: stack
    id: add_tag_row
    label: "Add tag row"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 20
      align: center
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Add a new tag"
      role: row
    test_context:
      tag: add_tag_row

  - type: input
    id: add_tag_input
    label: "Add tag"
    style:
      variant: outlined
      border_color: "#CCCCCC"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 12
      typography: body_medium
      flex: 1
      leading_icon: label_outlined
    placeholder: "Add a tag..."
    on_click:
      action: focus_tag_input
      target: ""
    a11y:
      content_description: "Tag input field"
      role: textbox
      hint: "Type a tag name and tap Add"
    test_context:
      tag: add_tag_input

  - type: button
    id: add_tag_button
    label: "Add"
    style:
      variant: filled
      background: "#1800B1"
      text_color: "#FFFFFF"
      corner_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      typography: label_medium
    on_click:
      action: add_tag
      target: ""
    a11y:
      content_description: "Add the typed tag to this transaction"
      role: button
    test_context:
      tag: add_tag_button
      assert_text: "Add"

  - type: divider
    id: notes_divider
    style:
      color: "#F0F0F0"
      thickness: 1
      margin_horizontal: 20
      margin_bottom: 20

  - type: text
    id: notes_section_label
    label: "Notes"
    content: "Notes"
    style:
      typography: title_medium
      color: "#111111"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      content_description: "Notes section"
      role: heading
    test_context:
      tag: notes_section_label
      assert_text: "Notes"

  - type: input
    id: notes_text_area
    label: "Transaction notes"
    style:
      variant: outlined
      border_color: "#CCCCCC"
      border_radius: 12
      padding_horizontal: 14
      padding_vertical: 12
      typography: body_medium
      min_height: 100
      margin_horizontal: 20
      margin_bottom: 20
    placeholder: "Add a private note about this transaction..."
    on_click:
      action: focus_notes
      target: ""
    a11y:
      content_description: "Notes text area. Enter a private note for this transaction."
      role: textbox
      multiline: true
    test_context:
      tag: notes_text_area

  - type: divider
    id: receipt_divider
    style:
      color: "#F0F0F0"
      thickness: 1
      margin_horizontal: 20
      margin_bottom: 20

  - type: text
    id: receipt_section_label
    label: "Receipt"
    content: "Receipt"
    style:
      typography: title_medium
      color: "#111111"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      content_description: "Receipt attachments section"
      role: heading
    test_context:
      tag: receipt_section_label
      assert_text: "Receipt"

  - type: box
    id: receipt_attachment_area
    label: "Receipt attachment area"
    content: "Receipt attachment area"
    style:
      background: "#F8F8F8"
      corner_radius: 16
      border_color: "#DDDDDD"
      border_width: 1
      border_style: dashed
      padding: 24
      margin_horizontal: 20
      margin_bottom: 12
      align_items: center
    on_click:
      action: pick_image_from_gallery
      target: ""
    a11y:
      content_description: "Receipt image attachment area. No images attached. Tap to choose from gallery."
      role: button
    test_context:
      tag: receipt_attachment_area

  - type: icon
    id: receipt_placeholder_icon
    label: "Receipt icon"
    style:
      icon_name: receipt_long_outlined
      size: 36
      color: "#BBBBBB"
      align_self: center
      margin_bottom: 8
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: none
    test_context:
      tag: receipt_placeholder_icon

  - type: text
    id: receipt_placeholder_text
    label: "No receipt attached"
    content: "Tap to attach a receipt image"
    style:
      typography: body_medium
      color: "#AAAAAA"
      align: center
    a11y:
      content_description: "No receipt attached yet"
      role: text
    test_context:
      tag: receipt_placeholder_text

  - type: button
    id: camera_button
    label: "Take Photo"
    style:
      variant: outlined
      border_color: "#008B8B"
      text_color: "#008B8B"
      corner_radius: 12
      leading_icon: camera_alt
      padding_horizontal: 20
      padding_vertical: 12
      typography: label_medium
      align_self: center
      margin_horizontal: 20
      margin_bottom: 24
    on_click:
      action: open_camera
      target: ""
    a11y:
      content_description: "Take a photo of the receipt with camera"
      role: button
    test_context:
      tag: camera_button
      assert_text: "Take Photo"

  - type: button
    id: save_button
    label: "Save"
    style:
      variant: filled
      background: "#1800B1"
      text_color: "#FFFFFF"
      corner_radius: 14
      padding_horizontal: 24
      padding_vertical: 16
      typography: label_large
      margin_horizontal: 20
      margin_bottom: 32
      width: full
    on_click:
      action: save_metadata
      target: ""
    a11y:
      content_description: "Save tags, notes and receipt for this transaction"
      role: button
    test_context:
      tag: save_button
      assert_text: "Save"

states:
  loading:
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
      show_skeleton_list: true
      skeleton_count: 3
  content:
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
        - tags_section_label
        - tags_chips_row
        - tag_chip_groceries
        - tag_chip_organic
        - add_tag_row
        - add_tag_input
        - add_tag_button
        - notes_divider
        - notes_section_label
        - notes_text_area
        - receipt_divider
        - receipt_section_label
        - receipt_attachment_area
        - receipt_placeholder_icon
        - receipt_placeholder_text
        - camera_button
        - save_button
  error:
    layout:
      visible_components:
        - transaction_header_card
        - txn_merchant
        - txn_amount
        - txn_date
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load metadata"
      error_message: "Could not load tags and notes for this transaction"
      show_retry_button: true

state_model:
  view_model: TransactionTagsViewModel
  state_fields:
    - name: transaction
      type: "TransactionDetail?"
      default: "null"
    - name: tags
      type: "List<String>"
      default: "emptyList()"
    - name: noteText
      type: String
      default: '""'
    - name: tagInputText
      type: String
      default: '""'
    - name: attachedImages
      type: "List<TransactionImage>"
      default: "emptyList()"
    - name: isSaving
      type: Boolean
      default: "false"
    - name: uiState
      type: TransactionTagsUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load transaction metadata. Please try again."
    - field: save_tag
      code: TAG_SAVE_FAILED
      message: "Could not add tag. Please try again."
    - field: save_note
      code: NOTE_SAVE_FAILED
      message: "Could not save note. Please try again."
    - field: save_image
      code: IMAGE_SAVE_FAILED
      message: "Could not attach image. Please try again."
  events:
    - MetadataLoaded
    - TagAdded(value: String)
    - TagRemoved(value: String)
    - NoteChanged(text: String)
    - ImagePicked(uri: String)
    - CameraCaptured(uri: String)
    - SaveClicked
    - SaveComplete
    - RetryLoad
  actions:
    - add_tag
    - remove_tag
    - focus_tag_input
    - focus_notes
    - pick_image_from_gallery
    - open_camera
    - save_metadata
    - clear_all_metadata
  di:
    - TransactionMetadataRepository
    - ImageRepository

api:
  - id: obp_transaction_tags_get
    endpoint: "GET /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
    tag: Transaction-Metadata
    response:
      fields:
        - name: tags
          type: "List<TransactionTag>"
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
        - name: user
          type: User
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "TRANSACTION_NOT_FOUND"
  - id: obp_transaction_tag_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/tags"
    tag: Transaction-Metadata
    request:
      fields:
        - name: value
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_TAG_VALUE"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transaction_comment_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/comments"
    tag: Transaction-Metadata
    request:
      fields:
        - name: value
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: value
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_COMMENT_VALUE"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transaction_image_add
    endpoint: "POST /obp/v1.2.1/banks/{bankId}/accounts/{accountId}/owner/transactions/{transactionId}/metadata/images"
    tag: Transaction-Metadata
    request:
      fields:
        - name: label
          type: String
        - name: URL
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: label
          type: String
        - name: URL
          type: String
        - name: date
          type: String
    errors:
      - code: 400
        message: "INVALID_IMAGE_URL"
      - code: 401
        message: "USER_NOT_LOGGED_IN"

dependencies:
  tier: feature
  features:
    - transaction-detail
    - transactions

navigation:
  - action: navigate_back
    target: transaction-detail
    description: "Return to transaction detail screen"
  - action: save_metadata
    target: ""
    description: "Save and dismiss to transaction detail"
