state_model:
  view_model: TransactionTagsViewModel
  # Shipped: a single StateFlow<ScreenState<TransactionTagsContent>> plus two side StateFlows.
  # No flat TransactionTagsUiState / attachedImages was built — the receipt/image feature is a
  # deferred 'coming soon' placeholder (unsupported under OBIE, no local store op).
  screen_state: "ScreenState<TransactionTagsContent>"
  state_wrapper: ScreenState
  # ScreenState.NoNetwork / Unauthenticated / Empty all render the shipped error/retry card.
  states_handled: [loading, content, empty, error, no_network, unauthenticated]
  content_class: TransactionTagsContent
  content_fields:
    - name: merchant
      type: String
      note: "counterpartyDisplayName(transaction, names, placeholder).ifBlank{'Transaction'} — never the raw OBP login-username holder"
    - name: amount
      type: String
      note: "formatSigned(value, currency) — debit < 0 is signed; isDebit drives colour"
    - name: isDebit
      type: Boolean
    - name: dateTime
      type: String
    - name: tags
      type: "List<TagChip>"
      note: "TagChip(id, value); tap removes immediately via local_tag_remove (on-device store)"
    - name: tagInput
      type: String
      default: '""'
    - name: note
      type: "String?"
      note: "single canonical note for the transaction; loaded via local_note_get, saved on Save via local_note_set (on-device store)"
    - name: isSaving
      type: Boolean
      default: "false"
    - name: suggestions
      type: "List<String>"
      note: "PREDEFINED_TAGS minus already-applied (case-insensitive), recomputed via withSuggestions() on every content change"
  side_flows:
    - name: notice
      type: "String?"
      note: "transient error string shown as a snackbar (add/remove/save failures, tag-validation messages); consumed via onNoticeConsumed()"
    - name: saved
      type: Boolean
      note: "set true on successful save → screen auto-pops back. NO 1800ms banner/timer (the spec save_success_banner was not built)."
  value_objects:
    - name: TagChip
      fields: [id, value]
    - name: PREDEFINED_TAGS
      note: "27-tag curated spend taxonomy in TransactionTagsViewModel.kt (groceries/rent/utilities/eating-out/coffee/takeaway/fuel/public-transport/parking/shopping/clothing/gifts/subscriptions/entertainment/health/gym/holiday/kids/pets/education/insurance/savings/charity/work-expense/internet/salary/refund); rendered as a flat SUGGESTED FlowRow of M3 SuggestionChips"
  validation:
    note: "normalizeTag trims + strips/re-adds leading '#'; null when blank."
    rules:
      - guard: empty
        message: "Tag cannot be empty. Type a tag name like #groceries."
      - guard: duplicate
        message: "That tag is already added to this transaction."
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load this transaction. Please try again."
      note: "transaction lookup (AIS) failure → ScreenState.Error (error/retry card); covers no_network + unauthenticated. Local tag/note reads from TransactionEnrichmentStore do not hit the network."
    - field: save_tag
      code: TAG_ADD_FAILED
      message: "Could not add tag. Please try again."
      note: "notice snackbar, not a state; local store write failure"
    - field: remove_tag
      code: TAG_REMOVE_FAILED
      message: "Could not remove tag. Please try again."
      note: "notice snackbar; local store write failure"
    - field: save_note
      code: NOTE_SAVE_FAILED
      message: "Could not save note. Please try again."
      note: "notice snackbar; isSaving reset to false, stays on screen; local store write failure"
  methods:
    - "load() — getTransaction (AIS) + local_tags_get + local_note_get + counterparty resolve → ScreenState.Content(withSuggestions())"
    - "onRetry() — re-run load()"
    - "onTagInputChanged(text) / onNoteChanged(text)"
    - "onAddTag() — normalize + empty/duplicate guard → local_tag_add (immediate)"
    - "onSuggestionClick(value) — one-tap local_tag_add of a pre-normalized suggestion"
    - "onRemoveTag(tagId) — local_tag_remove (immediate)"
    - "onSave() — local_note_set(note) → saved=true (auto-pop)"
    - "onNoticeConsumed()"
  actions:
    # Shipped action surface only. Receipt/image (pick_image_from_gallery, open_camera) and
    # clear_all_metadata were NOT built — see deferred note above.
    - add_tag
    - add_suggested_tag
    - remove_tag
    - change_tag_input
    - change_note
    - save_metadata
    - retry_load
    - navigate_back
  di:
    - TransactionEnrichmentStore
    - TransactionsRepository
    - CounterpartyNameResolver

# MIGRATION OBP -> HSBC (2026-06-11): the per-screen contract lives in the sibling api.yaml, which
# is now api: [] + a local_store block. HSBC Open Banking (OBIE AIS) exposes NO transaction-metadata
# API, so tags and notes are a LOCAL on-device feature keyed by OBIE Data.Transaction[].TransactionId.
# No network endpoints. The local_store block below mirrors api.yaml for spec readers.
api: []

local_store:
  rationale: "OBIE Account Information is read-only; transaction enrichment (tags/notes) is client-owned, stored on-device."
  key: "Data.Transaction[].TransactionId (OBIE) + AccountId scope"
  store: TransactionEnrichmentStore
  operations:
    - id: local_tags_get
      kind: read
      returns: "List<String> tags for the transaction"
    - id: local_tag_add
      kind: write
      params: [transactionId, tag]
    - id: local_tag_remove
      kind: write
      params: [transactionId, tag]
    - id: local_note_get
      kind: read
      returns: "String? note (single canonical note per transaction)"
    - id: local_note_set
      kind: write
      params: [transactionId, note]
      note: "Replaces the existing note (canonical single value), mirroring the old replaceNote semantics locally."

unsupported:
  - capability: receipt_image_upload
    reason: "OBIE has no transaction-image API and OBP /metadata/images had no real device upload host; receipt feature is out of scope under Open Banking — 'coming soon' placeholder."

dependencies:
  tier: feature
  features:
    - transaction-detail
    - transactions

# Shipped nav surface only. The go_to_transactions / go_to_home deep-link shortcuts were never
# built; tag adds/removes apply in-place (no nav). Reached only from transaction-detail's
# Tags & Notes row (booked transactions — pending payments never reach this screen).
navigation:
  - action: navigate_back
    target: transaction-detail
    description: "Back arrow — return to transaction detail without saving"
  - action: save_metadata
    target: transaction-detail
    description: "Save the note (local_note_set) then auto-pop back to transaction detail via the saved StateFlow"
  - action: navigate_to_transaction_detail
    target: transaction-detail
    description: "Tap transaction header card — navigate to transaction detail"
