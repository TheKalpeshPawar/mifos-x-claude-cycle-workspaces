    at: "2026-06-06T18:45:00Z"
    by: "/kmp-implement transaction-tags"
    contract_version: "1.1.0"
    note: "Implemented FULL E2E — this feature got a real client layer, unlike the derived/deferred siblings: the OBP v1.2.1 transaction-metadata endpoints were verified live on apisandbox first (GET/POST/DELETE tags, GET/POST/DELETE comments all work; DELETE returns an empty body). New TransactionTag/TransactionComment models + TransactionMetadataApi (Ktorfit, @Headers content-type on POSTs) + TransactionMetadataRepository (note = newest comment; replaceNote deletes existing comments then posts so the note stays canonical instead of an append-only pile). Screen lives in feature/transactions: green header card (merchant/amount/date via getTransaction), tag chips as M3 InputChips (tap = immediate DELETE), add-tag input with normalization (auto-# prefix, blank + case-insensitive-duplicate validation → snackbar), notes field saved on Save then auto-pop back (ui.yaml save_success banner+auto_navigate realized as snackbar-free pop). Deviations: receipt section rendered but deferred ('coming soon' snackbar — OBP image-add stores a URL, the device has nowhere to host an upload); top-bar clear_all omitted (destructive, low value); tag chips use theme InputChip styling not per-tag hex colors. TransactionTagsRoute(bankId, accountId, transactionId) replaced the arg-less placeholder; transaction-detail's Tags & Notes row passes its route args (pending payments never reach it — tags row hidden for pending). Tests: 6 repository + 9 VM (header derivation, add normalize/clear, blank + duplicate guard without API call, remove, save→saved flag, save failure stays with notice, notice consume, error→retry recovery)."
  - from: approved
    to: approved
    at: "2026-06-07T05:30:00Z"
    by: "/plan predefined-tags (follow-up to /kmp-implement transaction-tags)"
    contract_version: "1.1.0"
    note: "Predefined suggested tags added: curated ~27-tag spend taxonomy (housing/bills, food, transport, shopping, health, entertainment, travel, family, money admin, work, income) rendered as a flat SUGGESTED FlowRow of M3 SuggestionChips below the add-tag input — user chose flat over grouped. Tap = one-tap add via the existing immediate-POST path; suggestions exclude already-added tags (case-insensitive) and restore when a tag is removed. PREDEFINED_TAGS lives in TransactionTagsViewModel.kt. +3 VM tests (12 total)."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    note: "Reconciled spec to shipped Kotlin. uiState = ScreenState<TransactionTagsContent>; added no_network + unauthenticated states (fold into the error/retry card) and routed empty → the same error card. Folded the spec's view_tags/edit_mode/save_success states into a single content state + isSaving + two side StateFlows: notice (transient-error string, snackbar) and saved (auto-pop-back on save, NO 1800ms banner). Added the 27-tag PREDEFINED_TAGS taxonomy as a SUGGESTED FlowRow of suggestion chips (withSuggestions() excludes applied, case-insensitive). Tag validation: normalizeTag auto-# prefix + trim, blank guard ('Tag cannot be empty…'), case-insensitive duplicate guard ('That tag is already added…'). merchant via counterpartyDisplayName(...).ifBlank{'Transaction'}. REMOVED/marked deferred: the entire receipt/image feature (receipt_attachment_area, receipt_placeholder_icon/text, camera_button) — shipped is a 'coming soon' placeholder and the obp_transaction_image_add POST is NOT consumed (endpoint marked deferred); the clear_all top-bar action; the save_success_banner + 1800ms auto-navigate timer (shipped saves via immediate `saved` StateFlow → onBack). state_model rewritten to TransactionTagsContent (merchant/amount/isDebit/dateTime/tags/tagInput/note/isSaving/suggestions) + TagChip + notice/saved flows; no images field. api.yaml: tags get/add/delete + note via comments (replaceNote = delete-existing-then-post so the note stays canonical); image-add marked deferred. Counterparty hard-rule documented. Pending re-render + re-approve. (Re-run 2026-06-11: completed the prior partial write-back — the embedded state_model block was still the pre-reconcile flat TransactionTagsUiState/attachedImages/ImageRepository shape and the embedded+sibling api blocks were missing comment-get/comment-delete and had image-add un-deferred. Now rewritten to the shipped ScreenState<TransactionTagsContent> + TagChip + notice/saved flows + PREDEFINED_TAGS suggestions; 6 consumed metadata endpoints (tags get/add/delete, comments get/add/delete) + deferred image-add; navigation pruned to the shipped back/save/header-card targets — go_to_transactions/go_to_home deep-links were never built.)"
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
