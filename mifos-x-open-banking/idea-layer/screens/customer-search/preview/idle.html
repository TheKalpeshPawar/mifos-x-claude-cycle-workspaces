<!doctype html>
<html lang="en" data-screen="customer-search" data-state="idle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Customer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .screen-content { padding-bottom: 32px; }
    .screen-title {
      font-size: 32px; font-weight: 700; color: var(--primary);
      padding: 24px 16px 0;
    }
    /* Search input */
    .search-wrap { padding: 12px 16px; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--background);
      border-radius: 28px; padding: 12px 16px;
      border: 1.5px solid var(--outline-variant);
    }
    .search-icon { color: var(--outline); font-size: 20px; }
    .search-box input {
      flex: 1; border: none; background: transparent;
      font-family: 'Outfit', sans-serif; font-size: 14px;
      color: var(--on-surface); outline: none;
    }
    .search-box input::placeholder { color: var(--outline); }
    /* Filter chips */
    .filter-row {
      display: flex; gap: 8px;
      padding: 4px 16px 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .chip {
      padding: 8px 16px; border-radius: 16px; font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap; border: 1.5px solid var(--outline-variant);
      background: transparent; color: var(--outline);
      font-family: 'Outfit', sans-serif;
    }
    .chip.selected { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    /* Scan button */
    .btn-scan {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 8px 16px; padding: 10px 16px;
      border: 1.5px solid var(--primary); border-radius: 12px;
      background: transparent; color: var(--primary);
      font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    /* Customer result cards */
    .result-card {
      display: flex; align-items: center; gap: 0;
      background: var(--surface); border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      padding: 14px; margin: 0 16px 8px; cursor: pointer;
    }
    .c-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--on-primary);
      flex-shrink: 0; margin-right: 12px;
    }
    .c-info { flex: 1; min-width: 0; }
    .c-name { font-size: 14px; font-weight: 600; color: var(--on-surface); margin-bottom: 2px; }
    .c-status-green { font-size: 12px; color: var(--primary); font-weight: 500; }
    .c-status-amber { font-size: 12px; color: var(--warning); font-weight: 500; }
    .c-status-teal { font-size: 12px; color: var(--secondary); font-weight: 500; }
    .c-account { font-size: 12px; color: var(--on-surface-variant); }
    .c-time { font-size: 12px; color: var(--outline); align-self: flex-start; white-space: nowrap; }
    .c-time-today { font-size: 12px; color: var(--primary); font-weight: 500; align-self: flex-start; white-space: nowrap; }
    /* CTA buttons */
    .btn-onboard-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: calc(100% - 32px); margin: 8px 16px 4px;
      padding: 14px 16px;
      background: var(--primary); border: none; border-radius: 12px;
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-onboard-secondary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: calc(100% - 32px); margin: 0 16px 24px;
      padding: 14px 16px;
      background: transparent;
      border: 1.5px solid var(--secondary); border-radius: 8px;
      color: var(--secondary);
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="screen-content" role="main">

    <h1 data-component-type="text" data-component-id="customer_search_title" class="screen-title"
      role="heading" aria-level="1">Find Customer</h1>

    <!-- Search input -->
    <div class="search-wrap">
      <div data-component-type="input" data-component-id="customer_search_input" class="search-box"
        data-action="search" role="searchbox"
        aria-label="Search customers by name, ID, phone or email"
        aria-placeholder="Enter at least 2 characters to start searching">
        <span class="material-icons search-icon">search</span>
        <input type="search" placeholder="Search by name, ID, phone or email..." tabindex="0">
      </div>
    </div>

    <!-- Filter chips -->
    <div data-component-type="stack" data-component-id="filter_chips_row" class="filter-row"
      role="group" aria-label="Filter customers by status">
      <button data-component-type="input" data-component-id="filter_all" class="chip selected"
        data-action="filter" role="radio" aria-checked="true" aria-label="Show all customers" tabindex="0">All</button>
      <button data-component-type="input" data-component-id="filter_active" class="chip"
        data-action="filter" role="radio" aria-checked="false" aria-label="Show active customers only" tabindex="0">Active</button>
      <button data-component-type="input" data-component-id="filter_prospect" class="chip"
        data-action="filter" role="radio" aria-checked="false" aria-label="Show prospect customers only" tabindex="0">Prospect</button>
      <button data-component-type="input" data-component-id="filter_dormant" class="chip"
        data-action="filter" role="radio" aria-checked="false" aria-label="Show dormant customers only" tabindex="0">Dormant</button>
    </div>

    <!-- Scan QR button -->
    <button data-component-type="button" data-component-id="scan_qr_button" class="btn-scan"
      data-action="scan_qr" role="button" aria-label="Scan customer ID QR code" tabindex="0">
      <span class="material-icons" style="font-size:18px;">qr_code</span>
      Scan Customer ID
    </button>

    <!-- Result: John Mwangi -->
    <div data-component-type="box" data-component-id="customer_result_john_mwangi" class="result-card"
      data-nav-to="customer-detail" role="listitem"
      aria-label="John Mwangi, KYC verified, checking account, last interaction 3 days ago"
      tabindex="0">
      <div data-component-type="box" data-component-id="avatar_john" class="c-avatar"
        style="background:var(--primary);" role="img" aria-label="John Mwangi initials">JM</div>
      <div class="c-info">
        <div data-component-type="text" data-component-id="customer_john_name" class="c-name">John Mwangi</div>
        <div data-component-type="text" data-component-id="customer_john_kyc_status" class="c-status-green">KYC Verified ✓</div>
        <div data-component-type="text" data-component-id="customer_john_account" class="c-account">Checking Account · KES 45,200</div>
      </div>
      <div data-component-type="text" data-component-id="customer_john_last_interaction" class="c-time">3 days ago</div>
    </div>

    <!-- Result: Sarah Odhiambo -->
    <div data-component-type="box" data-component-id="customer_result_sarah_odhiambo" class="result-card"
      data-nav-to="customer-detail" role="listitem"
      aria-label="Sarah Odhiambo, KYC pending, application in review, last interaction 7 days ago"
      tabindex="0">
      <div data-component-type="box" data-component-id="avatar_sarah" class="c-avatar"
        style="background:var(--warning);" role="img" aria-label="Sarah Odhiambo initials">SO</div>
      <div class="c-info">
        <div data-component-type="text" data-component-id="customer_sarah_name" class="c-name">Sarah Odhiambo</div>
        <div data-component-type="text" data-component-id="customer_sarah_kyc_status" class="c-status-amber">KYC Pending ⚠</div>
        <div data-component-type="text" data-component-id="customer_sarah_account" class="c-account">Application in Review</div>
      </div>
      <div data-component-type="text" data-component-id="customer_sarah_last_interaction" class="c-time">7 days ago</div>
    </div>

    <!-- Result: Peter Kamau -->
    <div data-component-type="box" data-component-id="customer_result_peter_kamau" class="result-card"
      data-nav-to="customer-detail" role="listitem"
      aria-label="Peter Kamau, new prospect, no account yet, added today"
      tabindex="0">
      <div data-component-type="box" data-component-id="avatar_peter" class="c-avatar"
        style="background:var(--secondary);" role="img" aria-label="Peter Kamau initials">PK</div>
      <div class="c-info">
        <div data-component-type="text" data-component-id="customer_peter_name" class="c-name">Peter Kamau</div>
        <div data-component-type="text" data-component-id="customer_peter_kyc_status" class="c-status-teal">New Prospect</div>
        <div data-component-type="text" data-component-id="customer_peter_account" class="c-account">No account yet</div>
      </div>
      <div data-component-type="text" data-component-id="customer_peter_last_interaction" class="c-time-today">Today</div>
    </div>

    <!-- CTA buttons -->
    <button data-component-type="button" data-component-id="onboard_new_customer_button" class="btn-onboard-primary"
      data-nav-to="customer-onboarding" role="button" aria-label="Onboard a new customer — start customer registration" tabindex="0">
      <span class="material-icons" style="font-size:18px;">person_add</span>
      Onboard New Customer
    </button>

    <button data-component-type="button" data-component-id="onboard_corporate_button" class="btn-onboard-secondary"
      data-nav-to="corporate-onboarding" role="button" aria-label="Onboard a new business or corporate customer" tabindex="0">
      <span class="material-icons" style="font-size:18px;">business</span>
      Onboard Business Customer
    </button>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
