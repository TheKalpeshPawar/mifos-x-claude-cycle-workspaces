<!doctype html>
<html lang="en" data-screen="customer-search" data-state="idle" data-feature="customer-search" data-flavor="fieldOfficer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Search</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    h1 { font-size: 24px; font-weight: 700; padding: 20px 20px 8px; }
    .search-bar { margin: 8px 20px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; display: flex; align-items: center; gap: 8px; } .search-bar .material-icons { font-size: 20px; color: var(--outline); } .search-bar input { border: none; outline: none; font-family: 'Outfit', sans-serif; font-size: 14px; flex: 1; background: transparent; }
    .filter-chips { display: flex; gap: 8px; padding: 8px 20px; } .chip { padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: 'Outfit', sans-serif; } .chip.active { background: var(--primary); color: var(--on-primary); } .chip.inactive { background: var(--surface-variant); color: var(--on-surface-variant); }
    .scan-btn { margin: 8px 20px; padding: 12px; background: var(--primary-container); color: var(--primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; } .scan-btn .material-icons { font-size: 20px; }
    .hint { text-align: center; padding: 40px 32px; font-size: 14px; color: var(--on-surface-variant); }
    .cta-row { padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
    .btn-fill { padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-outline { padding: 14px; background: transparent; border: 1px solid var(--primary); border-radius: 12px; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <h1 role="heading" aria-level="1">Find Customer</h1>
    <div class="search-bar" data-action="search" tabindex="0"><span class="material-icons">search</span><input type="text" placeholder="Search by name, ID, or phone" aria-label="Search customers"></div>
    <div class="filter-chips"><button class="chip active" data-action="filter" tabindex="0">All</button><button class="chip inactive" data-action="filter" tabindex="0">Active</button><button class="chip inactive" data-action="filter" tabindex="0">Prospect</button><button class="chip inactive" data-action="filter" tabindex="0">Dormant</button></div>
    <button class="scan-btn" data-action="scan_qr" tabindex="0"><span class="material-icons">qr_code_scanner</span>Scan Customer ID</button>
    <p class="hint">Search for a customer by name, national ID, or phone number to get started.</p>
    <div class="cta-row">
      <button class="btn-fill" data-nav-to="customer-onboarding" tabindex="0" aria-label="Onboard New Customer">Onboard New Customer</button>
      <button class="btn-outline" data-nav-to="corporate-onboarding" tabindex="0" aria-label="Onboard Business">Onboard Business</button>
    </div>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
