<!doctype html>
<html lang="en" data-screen="customer-search" data-state="no_results">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Search — No Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 32px; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--outline-variant); padding: 14px 16px 10px; }
    .back-btn { background: none; border: none; color: var(--on-surface); cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .screen-title { font-size: 22px; font-weight: 700; color: var(--on-surface); }
    .search-wrap { margin: 16px 16px 8px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 14px; }
    .search-wrap .material-icons { color: var(--outline); font-size: 20px; }
    .search-input { flex: 1; background: none; border: none; outline: none; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--on-surface); }
    .clear-btn { background: none; border: none; color: var(--outline); cursor: pointer; padding: 2px; display: flex; align-items: center; }
    .chips-row { display: flex; gap: 8px; padding: 4px 16px 12px; overflow-x: auto; }
    .chip { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid var(--outline-variant); background: var(--surface); color: var(--on-surface-variant); white-space: nowrap; cursor: pointer; font-family: 'Outfit', sans-serif; }
    .chip.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    /* Empty state */
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; gap: 14px; }
    .empty-icon-ring { width: 80px; height: 80px; border-radius: 50%; background: var(--surface-variant); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
    .empty-icon-ring .material-icons { font-size: 40px; color: var(--outline); }
    .empty-title { font-size: 20px; font-weight: 700; color: var(--on-surface); }
    .empty-sub { font-size: 14px; color: var(--on-surface-variant); line-height: 1.6; }
    .query-chip { background: var(--surface-variant); border-radius: 8px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--on-surface); font-family: monospace; }
    .suggestions-card { background: var(--surface); border-radius: 12px; padding: 16px; width: 100%; border: 1px solid var(--outline-variant); text-align: left; }
    .suggestions-title { font-size: 12px; font-weight: 700; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
    .suggestion-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--surface-variant); }
    .suggestion-row:last-child { border-bottom: none; }
    .suggestion-row .material-icons { font-size: 18px; color: var(--outline); }
    .suggestion-text { font-size: 13px; color: var(--on-surface-variant); }
    .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 14px; width: 100%; font-size: 15px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <header class="top-bar" role="banner" data-component-type="top_app_bar" data-component-id="customer_search_top_bar">
    <button class="back-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <span class="screen-title">Customer Search</span>
  </header>

  <div class="search-wrap" role="search"
       data-component-type="stack" data-component-id="search_box_row">
    <span class="material-icons" aria-hidden="true">search</span>
    <input class="search-input" data-component-type="input" data-component-id="customer_search_input"
           type="search" value="Zxqrtmno" aria-label="Search customers" tabindex="0">
    <button class="clear-btn" data-action="clear_search" aria-label="Clear search" tabindex="0">
      <span class="material-icons" style="font-size:18px;" aria-hidden="true">close</span>
    </button>
  </div>

  <div class="chips-row" data-component-type="stack" data-component-id="filter_chips_row" role="group" aria-label="Filter customers">
    <button class="chip active" data-action="filter_all" aria-pressed="true" tabindex="0">All</button>
    <button class="chip" data-action="filter_active" aria-pressed="false" tabindex="0">Active</button>
    <button class="chip" data-action="filter_pending" aria-pressed="false" tabindex="0">Pending KYC</button>
    <button class="chip" data-action="filter_business" aria-pressed="false" tabindex="0">Business</button>
  </div>

  <main class="empty-state" role="main"
        data-component-type="stack" data-component-id="no_results_state">

    <div class="empty-icon-ring" aria-hidden="true">
      <span class="material-icons">person_search</span>
    </div>

    <h1 class="empty-title" data-component-type="text" data-component-id="no_results_title">No Customers Found</h1>

    <p class="empty-sub" data-component-type="text" data-component-id="no_results_sub">
      No customers match
    </p>
    <span class="query-chip" aria-label="Search query: Zxqrtmno">"Zxqrtmno"</span>

    <div class="suggestions-card" data-component-type="box" data-component-id="no_results_suggestions">
      <p class="suggestions-title">Try these instead</p>
      <div class="suggestion-row">
        <span class="material-icons" aria-hidden="true">search</span>
        <span class="suggestion-text">Search by phone number</span>
      </div>
      <div class="suggestion-row">
        <span class="material-icons" aria-hidden="true">badge</span>
        <span class="suggestion-text">Search by national ID</span>
      </div>
      <div class="suggestion-row">
        <span class="material-icons" aria-hidden="true">qr_code_scanner</span>
        <span class="suggestion-text">Scan customer QR code</span>
      </div>
    </div>

    <button class="btn-primary"
            data-component-type="button" data-component-id="onboard_new_customer_button"
            data-nav-to="customer-onboarding" aria-label="Onboard a new customer" tabindex="0">
      <span class="material-icons" aria-hidden="true">person_add</span>
      Onboard New Customer
    </button>

  </main>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
