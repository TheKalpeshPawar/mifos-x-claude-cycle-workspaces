<!doctype html>
<html lang="en" data-screen="customer-search" data-state="no_results" data-feature="customer-search" data-flavor="fieldOfficer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Search — No Results</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; }
    h1 { font-size: 24px; font-weight: 700; padding: 20px 20px 8px; width: 100%; text-align: left; }
    .search-bar { margin: 8px 20px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; display: flex; align-items: center; gap: 8px; width: calc(100% - 40px); } .search-bar .material-icons { font-size: 20px; color: var(--outline); } .search-bar input { border: none; outline: none; font-family: 'Outfit', sans-serif; font-size: 14px; flex: 1; background: transparent; }
    .empty-icon { width: 80px; height: 80px; border-radius: 40px; background: var(--surface-variant); display: flex; align-items: center; justify-content: center; margin: 24px 0 20px; } .empty-icon .material-icons { font-size: 40px; color: var(--outline); }
    .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; } .empty-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 24px; }
    .btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 14px 32px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><h1>Find Customer</h1><div class="search-bar"><span class="material-icons">search</span><input type="text" value="xyz12345" aria-label="Search"><span class="material-icons" data-action="clear_search" tabindex="0" style="cursor:pointer;color:var(--on-surface-variant)">close</span></div><main><div class="empty-icon"><span class="material-icons">person_search</span></div><h2 class="empty-title">No customers found</h2><p class="empty-msg">Try a different name, ID number, or phone.</p><button class="btn" data-nav-to="customer-onboarding" tabindex="0" aria-label="Onboard New Customer">Onboard New Customer</button></main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
