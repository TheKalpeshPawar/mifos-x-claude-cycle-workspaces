<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Find Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
}
main{padding-bottom:96px;}

.page-title{font-size:26px;font-weight:700;color:var(--primary);padding:24px 16px 0;}

.search-bar{display:flex;align-items:center;gap:10px;background:var(--background);border:1.5px solid var(--outline-variant);border-radius:28px;padding:10px 16px;margin:12px 16px 0;cursor:text;}
.search-bar svg{flex-shrink:0;}
.search-placeholder{flex:1;font-size:14px;color:var(--outline);font-family:var(--font);}

.chip-row{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{padding:6px 16px;border-radius:16px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--outline-variant);color:var(--text-secondary);background:transparent;font-family:var(--font);white-space:nowrap;}
.chip.selected{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

.scan-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--primary);color:var(--primary);background:none;border-radius:12px;padding:8px 14px;margin:8px 16px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;}

.customer-card{background:var(--surface);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:14px;margin:0 16px 8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.avatar{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--on-primary);flex-shrink:0;}
.av-green{background:var(--primary);}
.av-amber{background:var(--pending);}
.av-teal{background:var(--tertiary);}
.card-body{flex:1;min-width:0;}
.card-name{font-size:14px;font-weight:600;color:var(--text-primary);}
.card-kyc{font-size:12px;font-weight:500;margin-top:2px;}
.kyc-green{color:var(--primary);}
.kyc-amber{color:var(--pending);}
.kyc-teal{color:var(--tertiary);}
.card-account{font-size:12px;color:var(--text-secondary);margin-top:1px;}
.card-time{font-size:12px;align-self:flex-start;margin-top:2px;flex-shrink:0;}
.time-muted{color:var(--outline-variant);}
.time-today{color:var(--primary);font-weight:500;}

.btn-full{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:8px 16px 8px;padding:14px;border-radius:12px;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;border:none;}
.btn-filled{background:var(--primary);color:var(--on-primary);}
.btn-outlined{background:none;border:1.5px solid var(--tertiary);color:var(--tertiary);}
.last-btn{margin-bottom:24px;}

.fab{position:absolute;bottom:96px;right:16px;width:56px;height:56px;background:var(--primary);border-radius:16px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(76,102,43,0.35);z-index:10;}

.bottom-nav{position:absolute;bottom:0;left:0;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--surface-variant);display:flex;align-items:center;justify-content:space-between;padding:12px 8px 16px;z-index:20;}
.nav-tab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:73px;background:none;border:none;font-family:var(--font);}
.nav-pill{width:56px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-label{font-size:10px;color:var(--text-secondary);font-weight:500;}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<main data-screen="customer-search" data-state="content" role="main">

  <h1 class="page-title" data-component-type="text" data-component-id="customer_search_title" data-component-variant="headline_large">Find Customer</h1>

  <div class="search-bar" role="searchbox" aria-label="Search customers by name, ID, phone or email" data-action="focus_search" data-component-type="input" data-component-id="customer_search_input" data-component-variant="search">
    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" style="fill:var(--outline)"/></svg>
    <span class="search-placeholder">Search by name, ID, phone or email...</span>
  </div>

  <div class="chip-row" role="group" aria-label="Filter customers by status" data-component-type="stack" data-component-id="filter_chips_row" data-component-variant="chip_row">
    <button class="chip selected" role="radio" aria-checked="true" aria-label="Show all customers" data-action="filter" data-component-type="input" data-component-id="filter_all" data-component-variant="chip">All</button>
    <button class="chip" role="radio" aria-checked="false" aria-label="Show active customers only" data-action="filter" data-component-type="input" data-component-id="filter_active" data-component-variant="chip">Active</button>
    <button class="chip" role="radio" aria-checked="false" aria-label="Show prospect customers only" data-action="filter" data-component-type="input" data-component-id="filter_prospect" data-component-variant="chip">Prospect</button>
    <button class="chip" role="radio" aria-checked="false" aria-label="Show dormant customers only" data-action="filter" data-component-type="input" data-component-id="filter_dormant" data-component-variant="chip">Dormant</button>
  </div>

  <button class="scan-btn" aria-label="Scan customer ID QR code" data-action="scan_qr" data-component-type="button" data-component-id="scan_qr_button" data-component-variant="outlined">
    <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM22 7h-2V4h-3V2h5v5zm0 15v-5h-2v3h-3v2h5zM2 22h5v-2H4v-3H2v5zM2 2v5h2V4h3V2H2z" style="fill:var(--primary)"/></svg>
    Scan Customer ID
  </button>

  <div class="customer-card" role="listitem" aria-label="John Mwangi, KYC verified, checking account, last interaction 3 days ago" data-nav-to="customer-detail" data-component-type="box" data-component-id="customer_result_john_mwangi" data-component-variant="customer_card">
    <div class="avatar av-green" role="img" aria-label="John Mwangi initials" data-component-type="box" data-component-id="avatar_john">JM</div>
    <div class="card-body">
      <div class="card-name" data-component-type="text" data-component-id="customer_john_name">John Mwangi</div>
      <div class="card-kyc kyc-green" data-component-type="text" data-component-id="customer_john_kyc_status">KYC Verified ✓</div>
      <div class="card-account" data-component-type="text" data-component-id="customer_john_account">Checking Account · KES 45,200</div>
    </div>
    <span class="card-time time-muted" data-component-type="text" data-component-id="customer_john_last_interaction">3 days ago</span>
  </div>

  <div class="customer-card" role="listitem" aria-label="Sarah Odhiambo, KYC pending, application in review, last interaction 7 days ago" data-nav-to="customer-detail" data-component-type="box" data-component-id="customer_result_sarah_odhiambo" data-component-variant="customer_card">
    <div class="avatar av-amber" role="img" aria-label="Sarah Odhiambo initials" data-component-type="box" data-component-id="avatar_sarah">SO</div>
    <div class="card-body">
      <div class="card-name" data-component-type="text" data-component-id="customer_sarah_name">Sarah Odhiambo</div>
      <div class="card-kyc kyc-amber" data-component-type="text" data-component-id="customer_sarah_kyc_status">KYC Pending ⚠</div>
      <div class="card-account" data-component-type="text" data-component-id="customer_sarah_account">Application in Review</div>
    </div>
    <span class="card-time time-muted" data-component-type="text" data-component-id="customer_sarah_last_interaction">7 days ago</span>
  </div>

  <div class="customer-card" role="listitem" aria-label="Peter Kamau, new prospect, no account yet, added today" data-nav-to="customer-detail" data-component-type="box" data-component-id="customer_result_peter_kamau" data-component-variant="customer_card">
    <div class="avatar av-teal" role="img" aria-label="Peter Kamau initials" data-component-type="box" data-component-id="avatar_peter">PK</div>
    <div class="card-body">
      <div class="card-name" data-component-type="text" data-component-id="customer_peter_name">Peter Kamau</div>
      <div class="card-kyc kyc-teal" data-component-type="text" data-component-id="customer_peter_kyc_status">New Prospect</div>
      <div class="card-account" data-component-type="text" data-component-id="customer_peter_account" style="color:var(--outline-variant)">No account yet</div>
    </div>
    <span class="card-time time-today" data-component-type="text" data-component-id="customer_peter_last_interaction">Today</span>
  </div>

  <button class="btn-full btn-filled" aria-label="Onboard a new customer — start customer registration" data-nav-to="customer-onboarding" data-component-type="button" data-component-id="onboard_new_customer_button" data-component-variant="filled">
    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/></svg>
    Onboard New Customer
  </button>

  <button class="btn-full btn-outlined last-btn" aria-label="Onboard a new business or corporate customer" data-nav-to="corporate-onboarding" data-component-type="button" data-component-id="onboard_corporate_button" data-component-variant="outlined">
    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z" style="fill:var(--tertiary)"/></svg>
    Onboard Business Customer
  </button>

  <button class="fab" aria-label="New customer" data-nav-to="customer-onboarding" data-component-type="button" data-component-id="fab_add_customer" data-component-variant="fab">
    <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
  </button>

  <nav class="bottom-nav" aria-label="Field officer navigation" data-component-type="bottom_nav" data-component-id="fo_bottom_nav" data-shell="bottom-nav">
    <button class="nav-tab" aria-label="Dashboard" data-nav-to="fo-dashboard">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Dashboard</span>
    </button>
    <button class="nav-tab active" aria-label="Customers — current" data-nav-to="customer-search">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" style="fill:var(--primary)"/></svg>
      </div>
      <span class="nav-label">Customers</span>
    </button>
    <button class="nav-tab" aria-label="Applications" data-nav-to="account-applications">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Applications</span>
    </button>
    <button class="nav-tab" aria-label="Messages" data-nav-to="customer-messages">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Messages</span>
    </button>
    <button class="nav-tab" aria-label="More options" data-action="open_more_menu">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
