<!doctype html>
<html lang="en" data-screen="customer-search" data-state="searching">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Search — Searching</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 32px; }
    .top-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--outline-variant); padding: 14px 16px 10px; }
    .back-btn { background: none; border: none; color: var(--on-surface); cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .screen-title { font-size: 22px; font-weight: 700; color: var(--on-surface); }
    .search-wrap { margin: 16px 16px 8px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--primary); border-radius: 12px; padding: 12px 14px; }
    .search-wrap .material-icons { color: var(--primary); font-size: 20px; }
    .search-input { flex: 1; background: none; border: none; outline: none; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--on-surface); }
    .spinner-inline { width: 18px; height: 18px; border: 2px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chips-row { display: flex; gap: 8px; padding: 4px 16px 12px; overflow-x: auto; }
    .chip { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid var(--outline-variant); background: var(--surface); color: var(--on-surface-variant); white-space: nowrap; cursor: pointer; font-family: 'Outfit', sans-serif; }
    .chip.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .search-hint { font-size: 12px; color: var(--primary); padding: 2px 16px 14px; }
    .section-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); padding: 4px 16px 8px; text-transform: uppercase; letter-spacing: 0.6px; }
    /* Skeleton cards */
    .skel-card { background: var(--surface); border-radius: 12px; margin: 0 16px 8px; padding: 14px; display: flex; align-items: center; gap: 12px; }
    .skel-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-variant); flex-shrink: 0; animation: shimmer 1.4s ease-in-out infinite; }
    .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .skel-line { border-radius: 6px; background: var(--surface-variant); animation: shimmer 1.4s ease-in-out infinite; }
    .skel-btn { width: 70px; height: 32px; border-radius: 8px; background: var(--surface-variant); animation: shimmer 1.4s ease-in-out infinite; flex-shrink: 0; }
    @keyframes shimmer { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main>

  <header class="top-bar" role="banner" data-component-type="top_app_bar" data-component-id="customer_search_top_bar">
    <button class="back-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <span class="screen-title">Customer Search</span>
  </header>

  <div class="search-wrap" role="search" aria-label="Searching customers"
       data-component-type="stack" data-component-id="search_box_row">
    <span class="material-icons" aria-hidden="true">search</span>
    <input class="search-input" data-component-type="input" data-component-id="customer_search_input"
           type="search" value="Amara" aria-label="Search customers" tabindex="0">
    <div class="spinner-inline" aria-live="polite" aria-label="Searching..."></div>
  </div>

  <div class="chips-row" data-component-type="stack" data-component-id="filter_chips_row" role="group" aria-label="Filter customers">
    <button class="chip active" data-action="filter_all" aria-pressed="true" tabindex="0">All</button>
    <button class="chip" data-action="filter_active" aria-pressed="false" tabindex="0">Active</button>
    <button class="chip" data-action="filter_pending" aria-pressed="false" tabindex="0">Pending KYC</button>
    <button class="chip" data-action="filter_business" aria-pressed="false" tabindex="0">Business</button>
  </div>

  <p class="search-hint" aria-live="polite">Searching for "Amara"…</p>

  <p class="section-label">Results</p>

  <div role="list" aria-label="Search results loading" data-component-type="stack" data-component-id="customer_results_list">
    <div class="skel-card" role="listitem" aria-hidden="true">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line" style="height:13px;width:65%;"></div>
        <div class="skel-line" style="height:10px;width:40%;"></div>
      </div>
      <div class="skel-btn"></div>
    </div>
    <div class="skel-card" role="listitem" aria-hidden="true">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line" style="height:13px;width:55%;"></div>
        <div class="skel-line" style="height:10px;width:35%;"></div>
      </div>
      <div class="skel-btn"></div>
    </div>
    <div class="skel-card" role="listitem" aria-hidden="true">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line" style="height:13px;width:70%;"></div>
        <div class="skel-line" style="height:10px;width:50%;"></div>
      </div>
      <div class="skel-btn"></div>
    </div>
  </div>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
