type: customer_search
title: "Search Customers"
flavor: fieldOfficer
components:
  - type: search_field
    id: customer_search_input
    placeholder: "Search by name, email, or ID..."
  - type: filter_chip_group
    id: customer_filters
    options: ["All", "Active", "Prospect", "Dormant"]
  - type: customer_list
    id: search_results
    on_item_click:
      target: customer_detail
states:
  - idle
  - searching
  - results
  - no_results
navigation:
  - target: customer_detail
    label: "customer_detail"
