sibling: data-flow
schema_version: "4.0"
feature_id: customer-search
entries:
  - screen_id: customer-search
    trigger: on_interact
    event: SearchQueryChangedEvent
    endpoints:
      - obp_get_customers
    direction: read
    dtos:
      - name: Customer
        role: response
        api_id: obp_get_customers
    produces_state: results
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 400
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: customer-search
    trigger: on_interact
    event: SearchQueryChangedEvent
    endpoints:
      - obp_search_by_phone
    direction: write
    dtos:
      - name: Customer
        role: request
        api_id: obp_search_by_phone
      - name: Customer
        role: response
        api_id: obp_search_by_phone
    produces_state: results
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 400
        behavior: show_error_state

  - screen_id: customer-search
    trigger: on_interact
    event: FilterSelectedEvent
    endpoints:
      - obp_get_customers
    direction: read
    dtos:
      - name: Customer
        role: response
        api_id: obp_get_customers
    produces_state: results
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 400
        behavior: show_error_state

  - screen_id: customer-search
    trigger: on_interact
    event: CustomerSelectedEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: results

  - screen_id: customer-search
    trigger: on_interact
    event: ClearSearchEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: idle

  - screen_id: customer-search
    trigger: on_interact
    event: OnboardNewCustomerEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: idle
