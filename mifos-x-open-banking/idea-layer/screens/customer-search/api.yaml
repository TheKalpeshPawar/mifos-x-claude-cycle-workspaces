sibling: api
schema_version: "4.0"
feature_id: customer-search
api:
  - id: obp_get_customers
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/customers"
    tag: Customers
    params:
      - query: String
      - status: String
    response:
      fields:
        - customers: "List<Customer>"
        - customer_id: String
        - legal_name: String
        - kyc_status: String
        - customer_number: String
        - mobile_phone_number: String
        - email: String
        - date_of_birth: String
        - last_ok_date: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 400: "Invalid search parameters"
      - 500: "Internal server error"

  - id: obp_search_by_phone
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/search/customers/mobile-phone-number"
    tag: Customer
    description: "Search customer by mobile phone number"
    request:
      fields:
        - name: mobile_phone_number
          type: String
    response:
      fields:
        - name: customers
          type: "List<Customer>"
