sibling: ui
schema_version: "4.0"
feature_id: standing-order-create
id: standing-order-create
name: "New Standing Order"
feature: standing-orders
flavor: consumer
status: enriched
quality_score: 90
contract_version: "1.1.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-019, standing-orders, payments, form, create]
status_history:
  - status: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.1.0"
    note: >
      SOURCE→SPEC creation from shipped Kotlin (code = truth). New idea-layer screen authored to
      match the already-shipped CreateStandingOrderScreen + CreateStandingOrderViewModel in
      feature/standing-orders. Distinct from standing-order-edit (PUT, unimplemented): this screen
      authors a NEW standing order via the ONLY OBP endpoint that exists — POST .../owner/standing-order
      (live-verified: no GET/PUT/DELETE/pause/resume). Reached from the list FAB (onCreate(accountId)
      after CreateGate.Ready), gated by a no-payees check on the source account. Real-world scheduling
      model: source account + existing payee + amount + frequency (DAILY/WEEKLY/BI-WEEKLY/MONTHLY/YEARLY)
      + first payment date (the recurrence anchor, with a human "Repeats every …" hint) + optional end
      date. Validation: account + payee present, amount > 0, start strictly after today, end after start.

screens:
  - id: standing-order-create
    name: "New Standing Order"
    viewmodel: "CreateStandingOrderViewModel"
    route: /standing-orders/create

archetype: form_screen

shell:
  top_app_bar:
    show: true
    title: "New Standing Order"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions: []
  bottom_nav: false

components:
  - type: stack
    id: soc_root
    variant: column
    style:
      background: "#F9FAEF"
      padding_horizontal: 16
      scroll: vertical
    children:
      - soc_source_account_field
      - soc_payee_field
      - soc_amount_field
      - soc_frequency_label
      - soc_frequency_chips
      - soc_start_date_field
      - soc_recurrence_hint
      - soc_end_date_field
      - soc_error_text
      - soc_submit_button

  # ── Source account (multi-account picker; reloads payees on switch) ────────────
  - type: input
    id: soc_source_account_field
    label: "From account"
    variant: outlined_readonly
    supported_states: [idle, focus_visible, pressed]
    style:
      trailing_icon: expand_more
      full_width: true
    on_click:
      action: open_account_picker
      target: soc_account_picker_sheet
    a11y:
      label: "Source account. Tap to change which account this standing order pays from."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soc_source_account_field
      purpose: "Read-only field opening AccountPickerBottomSheet. Switching the account reloads the payee list — a standing order pays a counterparty of its source account. Hidden until the account loads."
      interaction_type: action
      data_driven: true

  - type: bottom_sheet
    id: soc_account_picker_sheet
    label: "Choose account"
    variant: account_picker
    supported_states: [idle, visible, dismissed]
    style:
      background: "#FFFFFF"
      border_radius_top: 24
    on_click:
      action: source_account_selected
      target: soc_source_account_field
    a11y:
      label: "Account picker"
      role: dialog
    test_context:
      tag: soc_account_picker_sheet
      purpose: "Shared AccountPickerBottomSheet listing every account the user can pay from (CreateStandingOrderViewModel.onSourceAccountSelected)."
      interaction_type: action
      data_driven: true

  # ── Payee (existing beneficiary) ──────────────────────────────────────────────
  - type: input
    id: soc_payee_field
    label: "Pay to"
    variant: outlined_readonly
    supported_states: [idle, focus_visible, pressed]
    style:
      trailing_icon: expand_more
      full_width: true
      margin_top: 12
    on_click:
      action: open_payee_menu
      target: soc_payee_menu
    a11y:
      label: "Payee. Tap to choose an existing beneficiary to pay."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soc_payee_field
      purpose: "Read-only field opening the payee dropdown. Shows 'Select payee' until chosen. When the account has no beneficiaries it is replaced by the no-payees hint."
      interaction_type: action
      data_driven: true

  - type: menu
    id: soc_payee_menu
    label: "Payee list"
    variant: dropdown
    supported_states: [idle, expanded, dismissed]
    on_click:
      action: payee_selected
      target: soc_payee_field
    a11y:
      label: "Choose a payee"
      role: listbox
    test_context:
      tag: soc_payee_menu
      purpose: "DropdownMenu of the source account's beneficiaries (counterpartyId → name); onPayeeSelected keeps the selection only if the new account also owns it."
      interaction_type: action
      data_driven: true

  - type: text
    id: soc_no_payees_hint
    label: "No payees hint"
    content: "Add a beneficiary first — standing orders pay an existing payee."
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    a11y:
      label: "This account has no beneficiaries"
      role: text
    test_context:
      tag: soc_no_payees_hint
      purpose: "Replaces the payee field when the source account has no beneficiaries (defensive — the FAB gate normally blocks navigation here via CreateGate.NoPayees)."
      interaction_type: display
      data_driven: true

  # ── Amount ────────────────────────────────────────────────────────────────────
  - type: text_field
    id: soc_amount_field
    label: "Amount"
    variant: outlined
    supported_states: [idle, focus_visible, error]
    style:
      suffix: currency_code
      supporting_text: "Amount taken on each payment date"
      full_width: true
      margin_top: 12
    validation:
      required: true
      rule: "amount > 0"
      message: "Enter a valid amount"
    on_change:
      action: amount_changed
      target: soc_amount_field
    a11y:
      label: "Payment amount"
      role: textbox
    keyboard:
      focusable: true
    test_context:
      tag: soc_amount_field
      purpose: "Single-line amount input with the source account's currency as suffix (onAmountChanged). Comma normalised to dot; must parse > 0."
      interaction_type: input
      data_driven: true

  # ── Frequency ─────────────────────────────────────────────────────────────────
  - type: text
    id: soc_frequency_label
    label: "Repeats"
    content: "Repeats"
    style:
      typography: "Outfit/label_large"
      color: "#44483D"
      margin_top: 12
    a11y:
      label: "Repeat frequency"
      role: text
    test_context:
      tag: soc_frequency_label
      purpose: "Caption above the frequency chips"
      interaction_type: display
      data_driven: false

  - type: chip_group
    id: soc_frequency_chips
    label: "Frequency chips"
    variant: filter
    style:
      orientation: horizontal
      spacing: spacing.sm
      scroll: horizontal
      margin_top: 6
    on_click:
      action: frequency_selected
      target: soc_frequency_chips
    a11y:
      label: "Repeat frequency: Daily, Weekly, Fortnightly, Monthly, Yearly"
      role: tablist
    test_context:
      tag: soc_frequency_chips
      purpose: "FilterChips over STANDING_ORDER_FREQUENCIES (DAILY/WEEKLY/BI-WEEKLY/MONTHLY/YEARLY; BI-WEEKLY shown as 'Fortnightly'). Default MONTHLY. onFrequencySelected."
      interaction_type: action
      data_driven: true

  # ── First payment date (recurrence anchor) ────────────────────────────────────
  - type: input
    id: soc_start_date_field
    label: "First payment date"
    variant: outlined_readonly
    supported_states: [idle, focus_visible, pressed, error]
    style:
      trailing_icon: calendar_today
      supporting_text: "First payment runs on this date"
      full_width: true
      margin_top: 12
    validation:
      required: true
      rule: "start strictly after today"
      message: "Start date must be after today"
    on_click:
      action: open_start_date_picker
      target: soc_start_date_picker
    a11y:
      label: "First payment date. Tap to pick the recurrence anchor date."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soc_start_date_field
      purpose: "Read-only date field opening a DatePickerDialog restricted to dates strictly after today. This is the recurrence anchor (weekly repeats on that weekday, monthly on that day, yearly on that day+month). onStartDateSelected."
      interaction_type: action
      data_driven: true

  - type: date_picker
    id: soc_start_date_picker
    label: "Pick first payment date"
    variant: dialog
    supported_states: [idle, visible, dismissed]
    on_click:
      action: start_date_selected
      target: soc_start_date_field
    a11y:
      label: "First payment date picker"
      role: dialog
    test_context:
      tag: soc_start_date_picker
      purpose: "M3 DatePickerDialog; selectable dates restricted to strictly after today."
      interaction_type: action
      data_driven: false

  - type: text
    id: soc_recurrence_hint
    label: "Recurrence hint"
    content: "Repeats every Monday"
    style:
      typography: "Outfit/body_small"
      color: "#4C662B"
      margin_top: 4
    a11y:
      label: "Recurrence summary"
      role: text
    test_context:
      tag: soc_recurrence_hint
      purpose: "Human recurrence hint derived from frequency + chosen first-payment date (recurrenceHint): 'Repeats every Monday' / 'Repeats on the 5th of each month' / 'Repeats every 1 March'. Hidden until a start date is chosen."
      interaction_type: display
      data_driven: true

  # ── Optional end date ─────────────────────────────────────────────────────────
  - type: input
    id: soc_end_date_field
    label: "End date (optional)"
    variant: outlined_readonly
    supported_states: [idle, focus_visible, pressed, error]
    style:
      trailing_icon: calendar_today
      supporting_text: "Leave empty to pay until cancelled"
      full_width: true
      margin_top: 12
    validation:
      required: false
      rule: "end after start"
      message: "End date must be after the start date"
    on_click:
      action: open_end_date_picker
      target: soc_end_date_picker
    a11y:
      label: "End date, optional. Tap to pick or clear."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soc_end_date_field
      purpose: "Optional read-only date field. Clearable (trailing close icon when set → onEndDateSelected(null)); picker restricted to dates after the start date. onEndDateSelected."
      interaction_type: action
      data_driven: true

  - type: date_picker
    id: soc_end_date_picker
    label: "Pick end date"
    variant: dialog
    supported_states: [idle, visible, dismissed]
    on_click:
      action: end_date_selected
      target: soc_end_date_field
    a11y:
      label: "End date picker"
      role: dialog
    test_context:
      tag: soc_end_date_picker
      purpose: "M3 DatePickerDialog; selectable dates restricted to strictly after the chosen start date."
      interaction_type: action
      data_driven: false

  # ── Inline error + submit ─────────────────────────────────────────────────────
  - type: text
    id: soc_error_text
    label: "Validation / submit error"
    content: "Start date must be after today"
    style:
      typography: "Outfit/body_small"
      color: "#BA1A1A"
      margin_top: 8
    a11y:
      label: "Error"
      role: alert
    test_context:
      tag: soc_error_text
      purpose: "Inline error message (form.error) — validation failure or a failed POST. Also surfaced as a toast. Hidden when error is null."
      interaction_type: display
      data_driven: true

  - type: button
    id: soc_submit_button
    label: "Create standing order"
    content: "Create standing order"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled, loading]
    style:
      background: "#4C662B"
      text_color: "#FFFFFF"
      border_radius: 12
      full_width: true
      margin_top: 20
    on_click:
      action: submit
      target: standing-order-create
    a11y:
      label: "Create the standing order"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soc_submit_button
      assert_text: "Create standing order"
      purpose: "Validates then POSTs the OBP create endpoint (onSubmit). Disabled while submitting (label 'Creating…'). On success a toast fires and the screen navigates back to the list."
      interaction_type: action
      data_driven: true

  # ── Loading (resolving account + payees) ──────────────────────────────────────
  - type: skeleton
    id: soc_loading
    label: "Loading payees"
    variant: progress
    style: { background: "#F9FAEF", padding: spacing.xl, alignment: center }
    a11y:
      label: "Loading accounts and payees"
      role: progressbar
    test_context:
      tag: soc_loading
      purpose: "Centered CircularProgressIndicator while the source account + its beneficiaries load (form.loadingPayees)."
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout: { type: column, alignment: center, padding: spacing.xl }
    visible_components: [soc_loading]
    note: "form.loadingPayees — account + beneficiaries resolving."
  content:
    layout: { type: column, scroll: vertical, padding_horizontal: 16 }
    visible_components:
      - soc_source_account_field
      - soc_payee_field
      - soc_amount_field
      - soc_frequency_label
      - soc_frequency_chips
      - soc_start_date_field
      - soc_recurrence_hint
      - soc_end_date_field
      - soc_submit_button
    note: "The default form. soc_no_payees_hint replaces soc_payee_field when the source account has no beneficiaries; soc_recurrence_hint and soc_error_text appear conditionally."
  submitting:
    layout: { type: column, scroll: vertical, padding_horizontal: 16 }
    visible_components:
      - soc_source_account_field
      - soc_payee_field
      - soc_amount_field
      - soc_frequency_label
      - soc_frequency_chips
      - soc_start_date_field
      - soc_recurrence_hint
      - soc_end_date_field
      - soc_submit_button
    note: "form.submitting — submit button disabled with label 'Creating…' while the POST is in flight."
  error:
    layout: { type: column, scroll: vertical, padding_horizontal: 16 }
    visible_components:
      - soc_source_account_field
      - soc_payee_field
      - soc_amount_field
      - soc_frequency_label
      - soc_frequency_chips
      - soc_start_date_field
      - soc_recurrence_hint
      - soc_end_date_field
      - soc_error_text
      - soc_submit_button
    note: "form.error non-null — inline error text shown above the button and a toast fired. The form stays editable."
  created:
    layout: { type: column }
    visible_components: []
    note: "form.created flips true after a successful POST → a 'Standing order created' toast fires and the screen navigates back to standing-orders. No standalone success surface."

state_model:
  view_model: CreateStandingOrderViewModel
  constructor:
    - { name: initialAccountId, type: String, default: "\"\"", note: "account chosen on the list FAB; blank falls back to checking-first" }
    - { name: todayProvider, type: "() -> LocalDate", note: "injectable for tests; defaults to today" }
  flows:
    - name: form
      type: "StateFlow<CreateStandingOrderForm>"
      default: "CreateStandingOrderForm()"
  content_type:
    name: CreateStandingOrderForm
    fields:
      - { name: accounts, type: "List<Account>", default: "emptyList()" }
      - { name: selectedAccountId, type: String, default: "\"\"" }
      - { name: sourceAccountName, type: String, default: "\"\"" }
      - { name: loadingPayees, type: Boolean, default: "true" }
      - { name: payees, type: "List<Counterparty>", default: "emptyList()" }
      - { name: selectedPayeeId, type: String, default: "\"\"" }
      - { name: amount, type: String, default: "\"\"" }
      - { name: currency, type: String, default: "\"EUR\"" }
      - { name: frequency, type: String, default: "\"MONTHLY\"" }
      - { name: startDate, type: "LocalDate?", default: "null" }
      - { name: endDate, type: "LocalDate?", default: "null" }
      - { name: submitting, type: Boolean, default: "false" }
      - { name: error, type: "String?", default: "null" }
      - { name: created, type: Boolean, default: "false", note: "true after a successful POST → navigate back" }
  constants:
    - { name: STANDING_ORDER_FREQUENCIES, value: "[DAILY, WEEKLY, BI-WEEKLY, MONTHLY, YEARLY]" }
  validation:
    - "account present"
    - "payee present"
    - "amount parses > 0"
    - "startDate present and strictly after today"
    - "endDate, when set, after startDate"
  methods:
    - onPayeeSelected
    - onSourceAccountSelected
    - onAmountChanged
    - onFrequencySelected
    - onStartDateSelected
    - onEndDateSelected
    - onSubmit
  di:
    - StandingOrdersRepository
    - AccountsRepository
    - PaymentsRepository
    - ProfileRepository
    - CustomersRepository

api:
  - endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/standing-order"
    note: >
      The ONLY OBP standing-order endpoint (no GET/PUT/DELETE/pause/resume at any version).
      Body = CreateStandingOrderRequest{customer_id, user_id, counterparty_id, amount,
      when (StandingOrderSchedule{frequency}), date_signed, date_starts, date_expires?}.
      See api.yaml.
    tag: Standing-Orders

dependencies:
  tier: feature
  features:
    - standing-orders
    - accounts
    - beneficiaries
    - customers
    - profile
