<!doctype html>
<!-- render-hash: soc-created-obie -->
<html lang="en" data-screen="standing-order-create" data-state="created" data-feature="standing-order-create" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New standing order — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root{
      --icon-md:24px; --icon-2xl:48px;
      --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
      --secondary:#386663; --on-secondary:#FFFFFF;
      --background:#F9FAEF; --on-background:#1A1C16; --surface:#FFFFFF; --on-surface:#1A1C16;
      --surface-variant:#E1E4D5; --on-surface-variant:#44483D; --surface-container:#F0F1E6;
      --outline:#75796C; --outline-variant:#C5C8BA;
    }
    [data-theme="light"]{
      --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
      --secondary:#386663; --on-secondary:#FFFFFF;
      --background:#F9FAEF; --on-background:#1A1C16; --surface:#FFFFFF; --on-surface:#1A1C16;
      --surface-variant:#E1E4D5; --on-surface-variant:#44483D; --surface-container:#F0F1E6;
      --outline:#75796C; --outline-variant:#C5C8BA;
    }
    [data-theme="dark"]{
      --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
      --secondary:#A0CFCB; --on-secondary:#003735;
      --background:#12140E; --on-background:#E3E3D8; --surface:#1E201A; --on-surface:#E3E3D8;
      --surface-variant:#44483D; --on-surface-variant:#C5C8BA; --surface-container:#1E201A;
      --outline:#8F9285; --outline-variant:#44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
      --secondary:#A0CFCB; --on-secondary:#003735;
      --background:#12140E; --on-background:#E3E3D8; --surface:#1E201A; --on-surface:#E3E3D8;
      --surface-variant:#44483D; --on-surface-variant:#C5C8BA; --surface-container:#1E201A;
      --outline:#8F9285; --outline-variant:#44483D;
    }}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%}
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
    .top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}
    .top-bar .material-symbols-outlined{font-size:var(--icon-md);color:var(--on-surface-variant)}
    .top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px;gap:6px}
    .check{width:88px;height:88px;border-radius:44px;background:var(--primary-container);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
    .check .material-symbols-outlined{font-size:var(--icon-2xl);color:var(--on-primary-container)}
    .title{font-size:22px;font-weight:600}
    .msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:300px;margin-top:4px}
    .summary{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:16px 18px;margin-top:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;text-align:left}
    .summary .row{display:flex;justify-content:space-between;gap:16px;font-size:14px}
    .summary .row .k{color:var(--on-surface-variant)}
    .summary .row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
    .progress{display:flex;align-items:center;gap:10px;margin-top:26px;color:var(--secondary);font-size:13px;font-weight:500}
    .spinner{width:20px;height:20px;border:2px solid var(--outline-variant);border-top-color:var(--primary);border-radius:50%;animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="standing-order-create" data-state="created">
    <header data-shell="top-app-bar" data-variant="small" class="top-bar">
      <span class="material-symbols-outlined" data-component-type="icon" data-component-id="topbar_back" aria-hidden="true">arrow_back</span>
      <h1 data-component-type="text" data-component-id="topbar_title" role="heading" aria-level="1">New standing order</h1>
    </header>

    <main data-shell="content" data-state="created">
      <div class="check" data-component-type="LayoutBox" data-component-id="created_glyph" aria-hidden="true">
        <span class="material-symbols-outlined">task_alt</span>
      </div>
      <div class="title" data-component-type="text" data-component-id="created_title">Standing order ready</div>
      <p class="msg" data-component-type="text" data-component-id="created_message">
        We've set up your recurring payment. Continue to your bank to authorise it securely.
      </p>

      <div class="summary" data-component-type="card" data-component-variant="outlined" data-component-id="created_summary" role="group" aria-label="Standing order summary">
        <div class="row"><span class="k">Pay to</span><span class="v">British Gas</span></div>
        <div class="row"><span class="k">Amount</span><span class="v">£92.00</span></div>
        <div class="row"><span class="k">Repeats</span><span class="v">Monthly · 12 payments</span></div>
        <div class="row"><span class="k">First payment</span><span class="v">5 Jul 2026</span></div>
        <div class="row"><span class="k">From</span><span class="v">Everyday Current</span></div>
      </div>

      <div class="progress" data-component-type="loading_indicator" data-component-id="created_progress" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Taking you to your bank to authorise…</span>
      </div>
    </main>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
