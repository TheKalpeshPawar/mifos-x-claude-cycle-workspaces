<!doctype html>
<!-- render-hash: soc-loading-0611 -->
<html lang="en" data-screen="standing-order-create" data-state="loading" data-feature="standing-orders" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Standing Order</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
      --warning: #E8A317; --success-bg: #D8EED0; --error-bg: #FFDAD6;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --warning: #FFCB46; --success-bg: #354E16; --error-bg: #690005;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8; --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
        --warning: #FFCB46; --success-bg: #354E16; --error-bg: #690005;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; padding: 0 var(--sp-md); display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--background); border-bottom: 1px solid var(--outline-variant); margin: 0 calc(-1 * var(--sp-md)) 0; }
    .top-bar .material-symbols-outlined { color: var(--on-surface-variant); cursor: pointer; font-size: var(--icon-md); }
    .top-bar h1 { font-size: 20px; font-weight: 600; color: var(--on-surface); }
    .loading-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-md); padding: var(--sp-xl); }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--surface-variant); border-top-color: var(--primary); border-radius: 50%; animation: soc-spin 900ms linear infinite; }
    @keyframes soc-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--surface-variant); } }
    .loading-caption { font-size: 14px; color: var(--on-surface-variant); }
  </style>
</head>
<body>
  <main>
    <div class="top-bar" data-component-type="box" data-component-id="soc_top_app_bar">
      <span class="material-symbols-outlined" data-nav-to="standing-orders" tabindex="0" role="button" aria-label="Cancel and go back">arrow_back</span>
      <h1>New Standing Order</h1>
    </div>
    <div class="loading-wrap" data-component-type="skeleton" data-component-id="soc_loading" role="progressbar" aria-label="Loading accounts and payees">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-caption" data-component-type="text" data-component-id="soc_loading_caption">Loading accounts and payees</div>
    </div>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
