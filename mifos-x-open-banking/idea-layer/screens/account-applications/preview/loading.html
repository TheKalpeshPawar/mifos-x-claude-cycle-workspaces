<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Account Applications — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;
  --background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --text-primary:#1A1C16;--text-secondary:#44483D;
  --tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;
  --nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font)}
main{display:flex;flex-direction:column;min-height:844px;padding-bottom:80px}

@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
.shim{background:linear-gradient(90deg,var(--surface-variant) 25%,#f0f2e8 50%,var(--surface-variant) 75%);background-size:780px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}

.title-shim{height:32px;width:220px;margin:20px 16px 4px;border-radius:8px}
.tab-row{display:flex;gap:8px;padding:10px 16px}
.tab-shim{height:34px;border-radius:20px}
.card-shim{height:96px;margin:0 16px 10px;border-radius:12px}

.bottom-nav{
  position:absolute;bottom:0;left:0;width:390px;height:80px;
  background:var(--surface);border-top:1px solid var(--surface-variant);
  display:flex;align-items:flex-start;padding:12px 8px 16px;
}
.nav-tab{width:73px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0}
.nav-pill{width:56px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.nav-pill-active{background:var(--nav-active)}
.nav-pill svg{width:20px;height:20px}
.nav-label{font-size:11px;font-weight:500;color:var(--outline);text-align:center}
.nav-label-active{color:var(--primary);font-weight:600}
</style>
</head>
<body>
<main data-screen="account-applications" data-state="loading" role="main" aria-busy="true" aria-label="Loading account applications">

  <div class="shim title-shim"></div>

  <div class="tab-row">
    <div class="shim tab-shim" style="width:70px"></div>
    <div class="shim tab-shim" style="width:90px"></div>
    <div class="shim tab-shim" style="width:90px"></div>
    <div class="shim tab-shim" style="width:80px"></div>
  </div>

  <div class="shim card-shim"></div>
  <div class="shim card-shim"></div>
  <div class="shim card-shim"></div>
  <div class="shim card-shim" style="opacity:.7"></div>

  <!-- Bottom Navigation (static during load) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-tab">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      </div>
      <span class="nav-label">Dashboard</span>
    </div>
    <div class="nav-tab">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <span class="nav-label">Customers</span>
    </div>
    <div class="nav-tab">
      <div class="nav-pill nav-pill-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--primary)" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      </div>
      <span class="nav-label nav-label-active">Applications</span>
    </div>
    <div class="nav-tab">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      </div>
      <span class="nav-label">Messages</span>
    </div>
    <div class="nav-tab">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </div>
      <span class="nav-label">More</span>
    </div>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
