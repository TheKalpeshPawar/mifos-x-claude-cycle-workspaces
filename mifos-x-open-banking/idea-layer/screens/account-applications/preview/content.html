<!doctype html>

<html lang="en" data-screen="account-applications" data-state="content" data-feature="account-applications" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Applications — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --warning: #E8A317; --nav-active-indicator: #DCE7C8;
      --shadow-rgb: 0,0,0; --error-tint: rgba(186,26,26,0.08);
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
      --warning: #E8A317; --nav-active-indicator: #354E16;
      --shadow-rgb: 0,0,0; --error-tint: rgba(255,180,171,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B;
        --error: #FFB4AB; --on-error: #690005; --error-container: #93000A;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --surface-container: #1E201A; --surface-container-high: #282A24;
        --outline: #8F9285; --outline-variant: #44483D;
        --warning: #E8A317; --nav-active-indicator: #354E16;
        --error-tint: rgba(255,180,171,0.12);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    .top-app-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--background); border-bottom: 1px solid var(--outline-variant); }
    .top-app-bar .title { font-size: 20px; font-weight: 600; color: var(--on-background); }
    .top-app-bar .actions { display: flex; gap: 8px; }
    .top-app-bar .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--on-surface-variant); }
    .top-app-bar .icon-btn .material-icons { font-size: 22px; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 96px; }
    .page-title { font-size: 24px; font-weight: 700; color: var(--primary); padding: 16px 20px 4px; }
    .filter-tabs { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; }
    .tab { border: 1px solid var(--outline-variant); border-radius: 20px; padding: 6px 14px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--background); color: var(--on-surface-variant); white-space: nowrap; }
    .tab.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .app-card { background: var(--surface); border-radius: 12px; padding: 14px; margin: 0 16px 10px; box-shadow: 0 2px 6px rgba(var(--shadow-rgb), 0.06); cursor: pointer; border: 1px solid var(--outline-variant); }
    .app-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .app-card-name { font-size: 16px; font-weight: 700; color: var(--on-surface); }
    .status-chip { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--primary-container); }
    .status-chip.pending { color: var(--on-surface-variant); border: 1px solid var(--warning); }
    .status-chip.approved { color: var(--primary); border: 1px solid var(--primary); }
    .status-chip.rejected { color: var(--error); border: 1px solid var(--error); background: var(--error-container); }
    .app-product { font-size: 14px; color: var(--primary); margin-bottom: 4px; }
    .app-footer { display: flex; justify-content: space-between; align-items: center; }
    .app-date { font-size: 13px; color: var(--on-surface-variant); }
    .review-btn { padding: 6px 16px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .reason-link { font-size: 13px; font-weight: 600; color: var(--error); text-decoration: underline; cursor: pointer; }
    .fab { position: fixed; bottom: 96px; right: 24px; width: 56px; height: 56px; background: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(var(--shadow-rgb), 0.25); cursor: pointer; border: none; }
    .fab .material-icons { font-size: 24px; color: var(--on-primary); }
    nav[data-shell="bottom-nav"] { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: 8px 0 12px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; padding: 4px 12px; border-radius: 16px; min-width: 56px; cursor: pointer; background: transparent; border: none; font-family: 'Outfit', sans-serif; }
    .nav-item .material-icons { font-size: 24px; color: var(--on-surface-variant); }
    .nav-item .nav-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); }
    .nav-item.active .material-icons { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 700; }
    .nav-item.active { background: var(--nav-active-indicator); }
    .nav-badge { position: relative; }
    .nav-badge::after { content: ''; position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; border-radius: 4px; background: var(--error); }
  </style>
</head>
