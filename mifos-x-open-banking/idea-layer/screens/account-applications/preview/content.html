<!doctype html>
<html lang="en" data-screen="account-applications" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Applications</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 96px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      padding: 20px 16px 4px;
    }
    .filter-tabs {
      display: flex;
      flex-direction: row;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      font-family: 'Outfit', sans-serif;
    }
    .chip-all { background: var(--primary); color: var(--on-primary); }
    .chip-unselected { background: var(--background); color: var(--on-surface-variant); border-color: var(--outline-variant); }
    .app-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 14px;
      margin: 0 16px 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .app-card:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .app-card-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .app-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--on-surface);
    }
    .status-chip {
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-pending { background: var(--primary-container); color: var(--warning); border: 1px solid var(--warning); }
    .status-approved { background: var(--primary-container); color: var(--primary); border: 1px solid var(--primary); }
    .status-rejected { background: var(--primary-container); color: var(--error); border: 1px solid var(--error); }
    .app-product {
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .app-card-footer {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
    .app-date {
      font-size: 12px;
      color: var(--outline);
    }
    .btn-review {
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
    }
    .btn-reason-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--error);
      text-decoration: underline;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
    }
    .fab-container {
      position: fixed;
      bottom: 24px;
      right: max(16px, calc(50vw - 179px));
    }
    .fab {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(76,102,43,0.3);
      font-family: 'Outfit', sans-serif;
    }
    .fab .material-icons { font-size: 20px; }
  </style>
</head>
<body>
  <main>
  <h1 class="page-title"
      data-component-type="text"
      data-component-id="page_title"
      role="heading"
      aria-level="1">Account Applications</h1>

  <!-- Filter Tabs -->
  <div class="filter-tabs"
       data-component-type="stack"
       data-component-id="status_filter_tabs"
       role="tablist"
       aria-label="Filter applications by status">
    <button class="chip chip-all"
            data-component-type="input"
            data-component-id="filter_all"
            data-action="filter"
            role="tab"
            aria-selected="true"
            aria-label="Show all applications, 8 total"
            tabindex="0">All (8)</button>
    <button class="chip chip-unselected"
            data-component-type="input"
            data-component-id="filter_pending"
            data-action="filter"
            role="tab"
            aria-selected="false"
            aria-label="Show pending applications, 3 total"
            tabindex="0">Pending (3)</button>
    <button class="chip chip-unselected"
            data-component-type="input"
            data-component-id="filter_approved"
            data-action="filter"
            role="tab"
            aria-selected="false"
            aria-label="Show approved applications, 3 total"
            tabindex="0">Approved (3)</button>
    <button class="chip chip-unselected"
            data-component-type="input"
            data-component-id="filter_rejected"
            data-action="filter"
            role="tab"
            aria-selected="false"
            aria-label="Show rejected applications, 2 total"
            tabindex="0">Rejected (2)</button>
  </div>

  <!-- App Card 1: Pending -->
  <div class="app-card"
       data-component-type="box"
       data-component-id="app_card_1"
       data-nav-to="application-detail"
       role="button"
       aria-label="Application: John Mwangi, KCB Savings Account, Pending Review"
       tabindex="0">
    <div class="app-card-header">
      <span class="app-name"
            data-component-type="text"
            data-component-id="app_card_1_name">John Mwangi</span>
      <span class="status-chip status-pending"
            data-component-type="box"
            data-component-id="app_card_1_status_chip"
            role="status"
            aria-label="Status: Pending Review">Pending Review</span>
    </div>
    <div class="app-product"
         data-component-type="text"
         data-component-id="app_card_1_product">KCB Savings Account</div>
    <div class="app-card-footer">
      <span class="app-date"
            data-component-type="text"
            data-component-id="app_card_1_date">Submitted: 20 May 2026</span>
      <button class="btn-review"
              data-component-type="button"
              data-component-id="app_card_1_review_btn"
              data-nav-to="application-detail"
              role="button"
              aria-label="Review John Mwangi's application"
              tabindex="0">Review</button>
    </div>
  </div>

  <!-- App Card 2: Approved -->
  <div class="app-card"
       data-component-type="box"
       data-component-id="app_card_2"
       data-nav-to="application-detail"
       role="button"
       aria-label="Application: Sarah Odhiambo, M-Shwari Checking, Approved"
       tabindex="0">
    <div class="app-card-header">
      <span class="app-name"
            data-component-type="text"
            data-component-id="app_card_2_name">Sarah Odhiambo</span>
      <span class="status-chip status-approved"
            data-component-type="box"
            data-component-id="app_card_2_status_chip"
            role="status"
            aria-label="Status: Approved">Approved ✓</span>
    </div>
    <div class="app-product"
         data-component-type="text"
         data-component-id="app_card_2_product">M-Shwari Checking Account</div>
    <div class="app-date"
         data-component-type="text"
         data-component-id="app_card_2_date">Submitted: 18 May 2026</div>
  </div>

  <!-- App Card 3: Rejected -->
  <div class="app-card"
       data-component-type="box"
       data-component-id="app_card_3"
       data-nav-to="application-detail"
       role="button"
       aria-label="Application: Peter Kamau, Business Current Account, Rejected"
       tabindex="0">
    <div class="app-card-header">
      <span class="app-name"
            data-component-type="text"
            data-component-id="app_card_3_name">Peter Kamau</span>
      <span class="status-chip status-rejected"
            data-component-type="box"
            data-component-id="app_card_3_status_chip"
            role="status"
            aria-label="Status: Rejected">Rejected ✗</span>
    </div>
    <div class="app-product"
         data-component-type="text"
         data-component-id="app_card_3_product">Business Current Account</div>
    <div class="app-card-footer">
      <span class="app-date"
            data-component-type="text"
            data-component-id="app_card_3_date">Submitted: 12 May 2026</span>
      <button class="btn-reason-link"
              data-component-type="link"
              data-component-id="app_card_3_reason_link"
              data-nav-to="application-detail"
              role="button"
              aria-label="View rejection reason for Peter Kamau's application"
              tabindex="0">View Reason</button>
    </div>
  </div>

  <!-- Extended FAB -->
  <div class="fab-container">
    <button class="fab"
            data-component-type="button"
            data-component-id="new_application_fab"
            data-action="new_application"
            role="button"
            aria-label="Start a new account application"
            tabindex="0">
      <span class="material-icons" aria-hidden="true">add</span>
      New Application
    </button>
  </div>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
