<!doctype html>
<html lang="en" data-screen="account-applications" data-state="content" data-feature="account-applications" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Applications — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .page-title { font-size: 24px; font-weight: 700; color: var(--primary); padding: 20px 20px 4px; }
    .filter-tabs { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; }
    .tab { border: none; border-radius: 20px; padding: 6px 14px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tab.active { background: var(--primary); color: var(--on-primary); }
    .tab.inactive { background: var(--background); border: 1px solid var(--surface-variant); color: var(--on-surface-variant); }
    .app-card { background: var(--surface); border-radius: 12px; padding: 14px; margin: 0 16px 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer; }
    .app-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .app-card-name { font-size: 16px; font-weight: 700; color: var(--on-background); }
    .status-chip { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .status-chip.pending { background: var(--primary-container); color: var(--warning); border: 1px solid var(--warning); }
    .status-chip.approved { background: var(--primary-container); color: var(--primary); border: 1px solid var(--primary); }
    .status-chip.rejected { background: var(--primary-container); color: var(--error); border: 1px solid var(--error); }
    .app-product { font-size: 14px; color: var(--primary); margin-bottom: 4px; }
    .app-footer { display: flex; justify-content: space-between; align-items: center; }
    .app-date { font-size: 13px; color: var(--outline); }
    .review-btn { padding: 6px 16px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(76,102,43,0.35); cursor: pointer; border: none; }
    .fab .material-icons { font-size: 24px; color: var(--on-primary); }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <main>
    <h1 class="page-title" data-component-type="text" data-component-id="page_title" role="heading" aria-level="1">Account Applications</h1>
    <div class="filter-tabs" data-component-type="stack" data-component-id="status_filter_tabs" role="tablist" aria-label="Filter applications by status">
      <button class="tab active" data-action="filter" data-component-type="input" data-component-id="filter_all" role="tab" aria-selected="true" tabindex="0">All (8)</button>
      <button class="tab inactive" data-action="filter" data-component-type="input" data-component-id="filter_pending" role="tab" aria-selected="false" tabindex="0">Pending (3)</button>
      <button class="tab inactive" data-action="filter" data-component-type="input" data-component-id="filter_approved" role="tab" aria-selected="false" tabindex="0">Approved (3)</button>
      <button class="tab inactive" data-action="filter" data-component-type="input" data-component-id="filter_rejected" role="tab" aria-selected="false" tabindex="0">Rejected (2)</button>
    </div>
    <div class="app-card" data-nav-to="application-detail" data-component-type="box" data-component-id="app_card_1" tabindex="0" aria-label="John Mwangi, KCB Savings, Pending Review">
      <div class="app-card-header"><span class="app-card-name">John Mwangi</span><span class="status-chip pending">Pending Review</span></div>
      <div class="app-product">KCB Savings Account</div>
      <div class="app-footer"><span class="app-date">Submitted: 20 May 2026</span><button class="review-btn" data-nav-to="application-detail" tabindex="0">Review</button></div>
    </div>
    <div class="app-card" data-nav-to="application-detail" data-component-type="box" data-component-id="app_card_2" tabindex="0" aria-label="Sarah Odhiambo, M-Shwari Checking, Approved">
      <div class="app-card-header"><span class="app-card-name">Sarah Odhiambo</span><span class="status-chip approved">Approved</span></div>
      <div class="app-product">M-Shwari Checking Account</div>
      <div class="app-footer"><span class="app-date">Submitted: 18 May 2026</span></div>
    </div>
    <div class="app-card" data-nav-to="application-detail" data-component-type="box" data-component-id="app_card_3" tabindex="0" aria-label="Peter Kamau, Business Current, Rejected">
      <div class="app-card-header"><span class="app-card-name">Peter Kamau</span><span class="status-chip rejected">Rejected</span></div>
      <div class="app-product">Business Current Account</div>
      <div class="app-footer"><span class="app-date">Submitted: 12 May 2026</span></div>
    </div>
    <button class="fab" data-action="new_application" data-nav-to="customer-onboarding" data-component-type="button" data-component-id="new_application_fab" tabindex="0" aria-label="New Application"><span class="material-icons">add</span></button>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
