<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Account Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;
  --background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --text-primary:#1A1C16;--text-secondary:#44483D;
  --tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;
  --nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font)}
main{display:flex;flex-direction:column;min-height:844px;padding-bottom:100px}

/* Page title */
.page-title{font-size:28px;font-weight:700;color:var(--primary);padding:20px 16px 4px}

/* Filter tabs */
.filter-tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.chip{border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);flex-shrink:0}
.chip-active{background:var(--primary);color:var(--on-primary)}
.chip-pending{background:var(--background);color:var(--text-secondary);border:1px solid var(--surface-variant)}
.chip-approved{background:var(--background);color:var(--text-secondary);border:1px solid var(--surface-variant)}
.chip-rejected{background:var(--background);color:var(--text-secondary);border:1px solid var(--surface-variant)}

/* App cards */
.app-card{background:var(--surface);border-radius:12px;padding:14px;margin:0 16px 10px;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-name{font-size:16px;font-weight:700;color:var(--text-primary)}
.status-chip{border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600}
.chip-pend-status{background:var(--primary-container);border:1px solid var(--pending);color:var(--pending)}
.chip-approved-status{background:var(--primary-container);border:1px solid var(--primary);color:var(--primary)}
.chip-rejected-status{background:var(--primary-container);border:1px solid var(--error);color:var(--error)}
.card-product{font-size:14px;color:var(--primary);margin-bottom:4px}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.card-date{font-size:12px;color:var(--outline-variant)}
.btn-review{background:var(--primary);color:var(--on-primary);border:none;border-radius:8px;padding:6px 16px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer}
.link-reason{font-size:13px;font-weight:600;color:var(--error);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:var(--font)}

/* FAB */
.fab{
  position:absolute;bottom:96px;right:16px;
  background:var(--primary);color:var(--on-primary);
  border:none;border-radius:16px;
  padding:12px 20px;
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:600;font-family:var(--font);
  cursor:pointer;
  box-shadow:0 4px 12px rgba(76,102,43,.35);
}
.fab-icon{font-size:20px;line-height:1}

/* Bottom nav */
.bottom-nav{
  position:absolute;bottom:0;left:0;width:390px;height:80px;
  background:var(--surface);
  border-top:1px solid var(--surface-variant);
  display:flex;align-items:flex-start;
  padding:12px 8px 16px;
}
.nav-tab{
  width:73px;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;flex-shrink:0;
}
.nav-pill{
  width:56px;height:28px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
}
.nav-pill-active{background:var(--nav-active)}
.nav-pill svg{width:20px;height:20px}
.nav-label{font-size:11px;font-weight:500;color:var(--outline);text-align:center}
.nav-label-active{color:var(--primary);font-weight:600}
</style>
</head>
<body>
<main data-screen="account-applications" data-state="content" role="main">

  <!-- Page title -->
  <h1 class="page-title" data-component-type="text" data-component-id="page_title" role="heading" aria-level="1">Account Applications</h1>

  <!-- Filter tabs -->
  <div class="filter-tabs" data-component-type="stack" data-component-id="status_filter_tabs" role="tablist" aria-label="Filter applications by status">
    <button class="chip chip-active" data-component-type="input" data-component-id="filter_all" role="tab" aria-selected="true" data-action="filter" aria-label="Show all applications, 8 total">All (8)</button>
    <button class="chip chip-pending" data-component-type="input" data-component-id="filter_pending" role="tab" aria-selected="false" data-action="filter" aria-label="Show pending applications, 3 total">Pending (3)</button>
    <button class="chip chip-approved" data-component-type="input" data-component-id="filter_approved" role="tab" aria-selected="false" data-action="filter" aria-label="Show approved applications, 3 total">Approved (3)</button>
    <button class="chip chip-rejected" data-component-type="input" data-component-id="filter_rejected" role="tab" aria-selected="false" data-action="filter" aria-label="Show rejected applications, 2 total">Rejected (2)</button>
  </div>

  <!-- Application card 1 — Pending -->
  <div class="app-card" data-component-type="box" data-component-id="app_card_1"
    data-nav-to="application-detail" role="button" tabindex="0"
    aria-label="Application: John Mwangi, KCB Savings Account, Pending Review">
    <div class="card-top" data-component-type="stack" data-component-id="app_card_1_header">
      <span class="card-name" data-component-type="text" data-component-id="app_card_1_name">John Mwangi</span>
      <span class="status-chip chip-pend-status" data-component-type="box" data-component-id="app_card_1_status_chip" role="status" aria-label="Status: Pending Review">
        <span data-component-type="text" data-component-id="app_card_1_status_text">Pending Review</span>
      </span>
    </div>
    <div class="card-product" data-component-type="text" data-component-id="app_card_1_product">KCB Savings Account</div>
    <div class="card-footer" data-component-type="stack" data-component-id="app_card_1_footer">
      <span class="card-date" data-component-type="text" data-component-id="app_card_1_date">Submitted: 20 May 2026</span>
      <button class="btn-review" data-component-type="button" data-component-id="app_card_1_review_btn"
        data-nav-to="application-detail" aria-label="Review John Mwangi's application">Review</button>
    </div>
  </div>

  <!-- Application card 2 — Approved -->
  <div class="app-card" data-component-type="box" data-component-id="app_card_2"
    data-nav-to="application-detail" role="button" tabindex="0"
    aria-label="Application: Sarah Odhiambo, M-Shwari Checking, Approved">
    <div class="card-top" data-component-type="stack" data-component-id="app_card_2_header">
      <span class="card-name" data-component-type="text" data-component-id="app_card_2_name">Sarah Odhiambo</span>
      <span class="status-chip chip-approved-status" data-component-type="box" data-component-id="app_card_2_status_chip" role="status" aria-label="Status: Approved">
        <span data-component-type="text" data-component-id="app_card_2_status_text">Approved ✓</span>
      </span>
    </div>
    <div class="card-product" data-component-type="text" data-component-id="app_card_2_product">M-Shwari Checking Account</div>
    <div class="card-date" data-component-type="text" data-component-id="app_card_2_date">Submitted: 18 May 2026</div>
  </div>

  <!-- Application card 3 — Rejected -->
  <div class="app-card" data-component-type="box" data-component-id="app_card_3"
    data-nav-to="application-detail" role="button" tabindex="0"
    aria-label="Application: Peter Kamau, Business Current Account, Rejected">
    <div class="card-top" data-component-type="stack" data-component-id="app_card_3_header">
      <span class="card-name" data-component-type="text" data-component-id="app_card_3_name">Peter Kamau</span>
      <span class="status-chip chip-rejected-status" data-component-type="box" data-component-id="app_card_3_status_chip" role="status" aria-label="Status: Rejected">
        <span data-component-type="text" data-component-id="app_card_3_status_text">Rejected ✗</span>
      </span>
    </div>
    <div class="card-product" data-component-type="text" data-component-id="app_card_3_product">Business Current Account</div>
    <div class="card-footer" data-component-type="stack" data-component-id="app_card_3_footer">
      <span class="card-date" data-component-type="text" data-component-id="app_card_3_date">Submitted: 12 May 2026</span>
      <button class="link-reason" data-component-type="link" data-component-id="app_card_3_reason_link"
        data-nav-to="application-detail" aria-label="View rejection reason for Peter Kamau's application">View Reason</button>
    </div>
  </div>

  <!-- Extended FAB — has nav, so bottom:96px -->
  <button class="fab" data-component-type="button" data-component-id="new_application_fab"
    data-nav-to="customer-onboarding" aria-label="Start a new account application">
    <span class="fab-icon" aria-hidden="true">＋</span>
    New Application
  </button>

  <!-- Bottom Navigation — Applications tab active -->
  <nav class="bottom-nav" data-component-type="bottom_nav" data-component-id="bottom_nav" aria-label="Main navigation">
    <!-- Dashboard -->
    <div class="nav-tab" data-nav-to="fo-dashboard" role="tab" aria-label="Dashboard">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      </div>
      <span class="nav-label">Dashboard</span>
    </div>
    <!-- Customers -->
    <div class="nav-tab" data-nav-to="customer-search" role="tab" aria-label="Customers">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <span class="nav-label">Customers</span>
    </div>
    <!-- Applications (active) -->
    <div class="nav-tab" role="tab" aria-label="Applications" aria-selected="true">
      <div class="nav-pill nav-pill-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--primary)" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      </div>
      <span class="nav-label nav-label-active">Applications</span>
    </div>
    <!-- Messages -->
    <div class="nav-tab" data-nav-to="customer-messages" role="tab" aria-label="Messages">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      </div>
      <span class="nav-label">Messages</span>
    </div>
    <!-- More -->
    <div class="nav-tab" data-action="open_more" role="tab" aria-label="More">
      <div class="nav-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--outline)" d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </div>
      <span class="nav-label">More</span>
    </div>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
