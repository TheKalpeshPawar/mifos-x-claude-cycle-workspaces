responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    layout:
      scroll: vertical
      padding: 0
      showShimmer: true
  content:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F9FAEF"
  empty:
    layout:
      scroll: vertical
      padding: 32
      showEmptyState: true
      emptyTitle: "No Applications Found"
      emptySubtitle: "No account applications match the selected filter"
      emptyIcon: assignment
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: AccountApplicationsViewModel
  state_fields:
    - name: applications
      type: "List<AccountApplication>"
      default: emptyList
    - name: activeFilter
      type: ApplicationFilter
      values: [ALL, PENDING, APPROVED, REJECTED]
      default: ALL
    - name: filteredApplications
      type: "List<AccountApplication>"
      default: emptyList
    - name: isLoading
      type: Boolean
      default: "true"
    - name: counts
      type: ApplicationCounts
  errors:
    - LOAD_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - FilterChanged
    - ApplicationSelected
    - NewApplicationStarted
  actions:
    - filter
    - navigate
    - new_application
  di:
    - AccountApplicationRepository

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/account-applications"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - product_code
        - user
        - customer
        - date_of_application
        - date_last_modified
        - status
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED

dependencies:
  tier: feature
  features:
    - application-detail
    - customer-onboarding
    - corporate-onboarding
