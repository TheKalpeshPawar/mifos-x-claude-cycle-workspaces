sibling: api
schema_version: "4.0"
feature_id: account-applications
api:
  - id: obp_get_account_applications
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/account-applications"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - product_code
        - user
        - customer
        - date_of_application
        - date_last_modified
        - status
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
