sibling: data-flow
schema_version: "4.0"
feature_id: account-applications
entries:
  - screen_id: account-applications
    trigger: on_mount
    endpoints:
      - obp_get_account_applications
    direction: read
    dtos:
      - name: AccountApplication
        role: response
        api_id: obp_get_account_applications
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login

  - screen_id: account-applications
    trigger: on_interact
    event: FilterChanged
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Client-side filter applied to already-loaded applications list; no network call"

  - screen_id: account-applications
    trigger: on_interact
    event: ApplicationSelected
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to application-detail; no network call"

  - screen_id: account-applications
    trigger: on_interact
    event: NewApplicationStarted
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    notes: "Navigation event to customer-onboarding; no network call"
