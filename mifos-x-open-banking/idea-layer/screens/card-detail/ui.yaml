id: card-detail
name: Card Detail
feature: card-detail
flavor: consumer
status: approved
quality_score: 93
contract_version: "1.1.0"
approve_hash: "sha256:0caf12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []


screens:
  - id: card-detail
    name: Card Detail
    archetype: detail_screen
    shell:
      top_bar:
        title: "Card Details"
        navigation_icon: arrow_back
        actions:
          - icon: more_vert
            action: open_card_options_menu
      bottom_nav: false

components:
  - type: box
    id: card_visual
    variant: elevated
    label: "Card Visual"
    style:
      background_gradient:
        start: "#4C662B"
        end: "#4C662B"
        direction: diagonal
      border_radius: 20
      elevation: 12
      width: 340
      height: 210
      padding: 24
      margin_horizontal: auto
      margin_top: 8
      margin_bottom: 24
    on_click:
      action: ""
      target: ""
    a11y:
      label: "Mifos Debit Visa card ending in 4521. Expiry September 2029."
      role: image
    test_context:
      test_id: card_visual
      assert: visible

  - type: text
    id: card_number_display
    label: "•••• •••• •••• 4521"
    content: "•••• •••• •••• 4521"
    style:
      typography: title_large
      color: "#FFFFFF"
      font_family: monospace
      letter_spacing: 4
    a11y:
      label: "Card number ending in 4521"
      role: text
    test_context:
      test_id: card_number_display

  - type: text
    id: cardholder_name
    label: "Alex Johnson"
    content: "ALEX JOHNSON"
    style:
      typography: body_large
      color: "#CDEDA3"
      text_transform: uppercase
      letter_spacing: 1
    a11y:
      label: "Cardholder name: Alex Johnson"
      role: text
    test_context:
      test_id: cardholder_name

  - type: text
    id: card_expiry
    label: "09/29"
    content: "09/29"
    style:
      typography: body_medium
      color: "#CDEDA3"
      font_family: monospace
    a11y:
      label: "Card expiry: September 2029"
      role: text
    test_context:
      test_id: card_expiry

  - type: image
    id: card_network_logo
    label: "Visa"
    style:
      width: 60
      height: 22
      content_scale: fit
      tint_color: "#FFFFFF"
    on_click:
      action: ""
      target: ""
    a11y:
      label: "Visa card network"
      role: image
    test_context:
      test_id: card_network_logo
      assert: visible

  - type: link
    id: reveal_card_details_link
    label: "Show card details"
    content: "Show card details"
    style:
      typography: label_large
      color: "#4C662B"
      underline: true
      text_align: center
      padding_vertical: 4
    on_click:
      action: reveal_card_details
      target: ""
    a11y:
      label: "Reveal full card number, CVV and expiry. Requires biometric authentication."
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: reveal_card_details_link
      assert_text: "Show card details"

  - type: stack
    id: card_status_row
    label: "Card Status"
    style:
      direction: horizontal
      spacing: 0
      padding_vertical: 16
      padding_horizontal: 20
      justify: space_between
      align: center
      background: "#FFFFFF"
      border_radius: 12
      elevation: 1
    on_click:
      action: ""
      target: ""
    a11y:
      label: "Card status toggle"
      role: row
    test_context:
      test_id: card_status_row

  - type: text
    id: card_status_label
    label: "Card Active"
    content: "Card Active"
    style:
      typography: body_large
      color: "#1A1C16"
      font_weight: 500
    a11y:
      label: "Card active status label"
      role: text
    test_context:
      test_id: card_status_label
      assert_text: "Card Active"

  - type: input
    id: card_status_switch
    label: "Toggle card active state"
    content: "true"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: switch
      checked_color: "#4C662B"
      unchecked_color: "#75796C"
    on_click:
      action: toggle_card_status
      target: ""
    a11y:
      label: "Toggle to activate or deactivate your card. Currently active."
      role: switch
    keyboard:
      focusable: true
    test_context:
      test_id: card_status_switch
      assert_checked: true

  - type: box
    id: limits_section
    variant: surface
    label: "Spending Limits"
    style:
      background: "#FFFFFF"
      border_radius: 12
      elevation: 1
      padding_horizontal: 20
      padding_vertical: 16
      margin_top: 12
      border_color: "#F9FAEF"
      border_width: 1
    on_click:
      action: ""
      target: ""
    a11y:
      label: "Spending limits section"
      role: group
    test_context:
      test_id: limits_section

  - type: text
    id: limits_section_title
    label: "Spending Limits"
    content: "Spending Limits"
    style:
      typography: title_medium
      color: "#1A1C16"
      font_weight: 600
      padding_bottom: 12
    a11y:
      label: "Spending limits section title"
      role: heading
    test_context:
      test_id: limits_section_title

  - type: stack
    id: daily_limit_row
    label: "Daily Limit"
    style:
      direction: horizontal
      spacing: 0
      padding_vertical: 10
      justify: space_between
      align: center
    on_click:
      action: edit_limit
      target: ""
    a11y:
      label: "Daily spending limit: £2,500. Tap to edit."
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: daily_limit_row

  - type: text
    id: daily_limit_label
    label: "Daily limit"
    content: "Daily limit"
    style:
      typography: body_medium
      color: "#44483D"
    a11y:
      label: "Daily limit label"
      role: text
    test_context:
      test_id: daily_limit_label

  - type: text
    id: daily_limit_value
    label: "£2,500"
    content: "£2,500"
    style:
      typography: body_large
      color: "#1A1C16"
      font_weight: 500
    a11y:
      label: "Daily limit: £2,500"
      role: text
    test_context:
      test_id: daily_limit_value
      assert_text: "£2,500"

  - type: icon
    id: daily_limit_edit_icon
    label: "Edit daily limit"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      icon_name: edit
      size: 20
      color: "#4C662B"
    on_click:
      action: edit_limit
      target: ""
    a11y:
      label: "Edit daily spending limit"
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: daily_limit_edit_icon

  - type: divider
    id: limits_divider
    style:
      color: "#F9FAEF"
      thickness: 1
      padding_vertical: 2
    a11y:
      label: ""
      role: separator
    test_context:
      test_id: limits_divider
      assert: visible

  - type: stack
    id: monthly_limit_row
    label: "Monthly Limit"
    style:
      direction: horizontal
      spacing: 0
      padding_vertical: 10
      justify: space_between
      align: center
    on_click:
      action: edit_limit
      target: ""
    a11y:
      label: "Monthly spending limit: £10,000. Tap to edit."
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: monthly_limit_row

  - type: text
    id: monthly_limit_label
    label: "Monthly limit"
    content: "Monthly limit"
    style:
      typography: body_medium
      color: "#44483D"
    a11y:
      label: "Monthly limit label"
      role: text
    test_context:
      test_id: monthly_limit_label

  - type: text
    id: monthly_limit_value
    label: "£10,000"
    content: "£10,000"
    style:
      typography: body_large
      color: "#1A1C16"
      font_weight: 500
    a11y:
      label: "Monthly limit: £10,000"
      role: text
    test_context:
      test_id: monthly_limit_value
      assert_text: "£10,000"

  - type: icon
    id: monthly_limit_edit_icon
    label: "Edit monthly limit"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      icon_name: edit
      size: 20
      color: "#4C662B"
    on_click:
      action: edit_limit
      target: ""
    a11y:
      label: "Edit monthly spending limit"
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: monthly_limit_edit_icon

  - type: spacer
    id: action_buttons_spacer
    style:
      height: 16
    a11y:
      label: ""
      role: none
    test_context:
      test_id: action_buttons_spacer
      assert: visible

  - type: button
    id: freeze_card_button
    label: "Freeze Card"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#E8A317"
      text_color: "#44483D"  # fix A11Y-002: was #E8A317 (2.17:1 on white, FAIL); #44483D = 8.91:1 PASS
      border_radius: 12
      padding_vertical: 14
      full_width: true
      leading_icon: ac_unit
      typography: label_large
    on_click:
      action: freeze_card
      target: ""
    a11y:
      label: "Freeze this card to temporarily block all transactions"
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: freeze_card_button
      assert_text: "Freeze Card"

  - type: button
    id: report_lost_button
    label: "Report Lost/Stolen"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#BA1A1A"
      text_color: "#BA1A1A"
      border_radius: 12
      padding_vertical: 14
      full_width: true
      leading_icon: report_problem
      typography: label_large
    on_click:
      action: report_lost
      target: ""
    a11y:
      label: "Report this card as lost or stolen. This will permanently block the card."
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: report_lost_button
      assert_text: "Report Lost/Stolen"

  - type: button
    id: view_transactions_button
    label: "View Transactions"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: text
      text_color: "#4C662B"
      border_radius: 12
      padding_vertical: 12
      full_width: true
      leading_icon: receipt_long
      typography: label_large
    on_click:
      action: navigate
      target: transactions
    a11y:
      label: "View all transactions for this card"
      role: button
    keyboard:
      focusable: true
    test_context:
      test_id: view_transactions_button
      assert_text: "View Transactions"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    layout:
      visible_components: []
      show_skeleton_card_visual: true
      show_skeleton_fields: true
      skeleton_count: 4
  content:
    layout:
      visible_components:
        - card_visual
        - card_number_display
        - cardholder_name
        - card_expiry
        - card_network_logo
        - reveal_card_details_link
        - card_status_row
        - card_status_label
        - card_status_switch
        - limits_section
        - limits_section_title
        - daily_limit_row
        - daily_limit_label
        - daily_limit_value
        - daily_limit_edit_icon
        - limits_divider
        - monthly_limit_row
        - monthly_limit_label
        - monthly_limit_value
        - monthly_limit_edit_icon
        - action_buttons_spacer
        - freeze_card_button
        - report_lost_button
        - view_transactions_button
      card_status_switch_checked: true
      freeze_card_button_label: "Freeze Card"
  frozen:
    layout:
      visible_components:
        - card_visual
        - card_number_display
        - cardholder_name
        - card_expiry
        - card_network_logo
        - card_status_row
        - card_status_label
        - card_status_switch
        - limits_section
        - limits_section_title
        - action_buttons_spacer
        - freeze_card_button
        - report_lost_button
        - view_transactions_button
      card_visual_overlay: "FROZEN"
      card_visual_overlay_color: "#C5C8BA80"
      card_status_switch_checked: false
      freeze_card_button_label: "Unfreeze Card"
      freeze_card_button_icon: lock_open
      freeze_card_button_border_color: "#4C662B"
      freeze_card_button_text_color: "#4C662B"
      reveal_card_details_link_visible: false
  error:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: credit_card_off
      error_title: "Unable to load card details"
      error_message: "Please try again or contact support"
      show_retry_button: true

  empty:
    layout:
      visible_components: []
      show_empty_state: true
      empty_icon: credit_card_off
      empty_title: "Card information not available"
      empty_message: "No card data was found. The card may have been cancelled or removed from your account."
      show_back_button: true

state_model:
  view_model: CardDetailViewModel
  state_fields:
    - name: cardId
      type: String
      default: ""
    - name: cardNumber
      type: String
      default: ""
    - name: cardholderName
      type: String
      default: ""
    - name: expiryDate
      type: String
      default: ""
    - name: cardNetwork
      type: CardNetwork
      default: Visa
    - name: isActive
      type: Boolean
      default: true
    - name: isFrozen
      type: Boolean
      default: false
    - name: dailyLimit
      type: String
      default: "£2,500"
    - name: monthlyLimit
      type: String
      default: "£10,000"
    - name: isRevealed
      type: Boolean
      default: false
    - name: uiState
      type: CardDetailUiState
      default: Loading
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load card details. Please try again."
    - field: freeze
      code: FREEZE_FAILED
      message: "Failed to freeze card. Please contact support."
    - field: report_lost
      code: REPORT_FAILED
      message: "Failed to report card. Please call 0800 123 456."
  events:
    - CardLoaded
    - RevealCardDetailsRequested
    - BiometricAuthSucceeded
    - BiometricAuthFailed
    - CardStatusToggled
    - EditLimitClicked
    - FreezeCardClicked
    - ReportLostClicked
    - ViewTransactionsClicked
  actions:
    - reveal_card_details
    - toggle_card_status
    - edit_limit
    - freeze_card
    - report_lost
    - navigate
    - open_card_options_menu
  di:
    - CardRepository
    - BiometricAuthUseCase
    - CardLimitRepository

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/cards/{cardId}"
    tag: Cards
    response:
      fields:
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: bank_card_number
          type: String
        - name: name_on_card
          type: String
        - name: card_type
          type: String
        - name: card_description
          type: String
        - name: card_network
          type: String
        - name: allows
          type: List<String>
        - name: enabled
          type: Boolean
        - name: cancelled
          type: Boolean
        - name: on_hot_list
          type: Boolean
        - name: technology
          type: String
        - name: expires
          type: String
        - name: replacement
          type: CardReplacement
    errors:
      - code: 400
        message: "INVALID_CARD_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "CARD_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - cards
    - transactions
