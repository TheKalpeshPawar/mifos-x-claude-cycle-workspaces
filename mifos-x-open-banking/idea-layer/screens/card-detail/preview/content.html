<!doctype html>

<html lang="en" data-screen="card-detail" data-state="content" data-feature="card-detail" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Detail — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; --shadow-rgb: 0,0,0; --card-text-secondary: #CDEDA3; --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px; }
    [data-theme="dark"] { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline: #8F9285; --outline-variant: #44483D; --shadow-rgb: 0,0,0; --card-text-secondary: #CDEDA3; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline: #8F9285; --outline-variant: #44483D; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    .top-app-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--background); }
    .top-app-bar .icon-btn { background: transparent; border: none; color: var(--on-surface-variant); width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .top-app-bar h1 { font-size: 18px; font-weight: 600; flex: 1; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 24px; }
    .card-visual { background: linear-gradient(160deg, var(--primary) 0%, var(--primary-container) 100%); color: var(--on-primary); border-radius: 24px; margin: 0 16px 16px; padding: 24px; height: 210px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 12px 28px rgba(var(--shadow-rgb), 0.25); position: relative; cursor: pointer; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-network-logo { font-size: 16px; font-weight: 700; letter-spacing: 1px; opacity: 0.95; }
    .card-chip-img { width: 40px; height: 28px; background: rgba(255,255,255,0.18); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .card-chip-img .material-icons { font-size: var(--icon-sm); color: var(--card-text-secondary); }
    .card-number { font-family: 'Roboto Mono', monospace; font-size: 20px; letter-spacing: 4px; font-weight: 500; }
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .card-bottom .label { font-size: 9px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
    .card-bottom .name { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--card-text-secondary); }
    .card-bottom .expiry { font-size: 14px; font-weight: 600; text-align: right; color: var(--card-text-secondary); }
    .reveal-link { text-align: center; padding: 8px 16px 16px; }
    .reveal-link button { background: transparent; border: none; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--outline-variant); border-bottom: 1px solid var(--outline-variant); margin-top: 4px; }
    .toggle-label { font-size: 15px; font-weight: 600; }
    .toggle { width: 52px; height: 32px; border-radius: 16px; background: var(--primary); border: none; cursor: pointer; position: relative; padding: 0; }
    .toggle::after { content: ''; position: absolute; width: 26px; height: 26px; border-radius: 13px; background: var(--surface); top: 3px; right: 3px; transition: all 200ms ease; box-shadow: 0 1px 3px rgba(var(--shadow-rgb), 0.15); }
    .section { padding: 20px 0 8px; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.8px; padding: 0 20px 12px; }
    .limit-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface); }
    .limit-row + .limit-row { border-top: 1px solid var(--outline-variant); }
    .limit-label { font-size: 14px; color: var(--on-surface); flex: 1; }
    .limit-value { font-size: 14px; font-weight: 600; color: var(--primary); font-family: 'Roboto Mono', monospace; margin-right: 12px; }
    .limit-edit { background: transparent; border: none; cursor: pointer; padding: 4px; color: var(--on-surface-variant); display: flex; }
    .limit-edit .material-icons { font-size: var(--icon-sm); }
    .actions { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { padding: 14px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--outline-variant); display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); color: var(--on-surface); }
    .action-btn .material-icons { font-size: var(--icon-sm); }
    .action-btn.freeze { background: var(--secondary-container); color: var(--secondary); border-color: var(--secondary); }
    .action-btn.report { background: var(--error-container); color: var(--error); border-color: var(--error); }
    .action-btn.txns { grid-column: span 2; background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  </style>
</head>
<body>
  <header class="top-app-bar" data-component-type="app_bar" data-component-id="top_app_bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back" data-component-type="button" data-component-id="back_btn"><span class="material-icons">arrow_back</span></button>
    <h1>Card Details</h1>
    <button class="icon-btn" data-action="open_card_options_menu" aria-label="More options" data-component-type="button" data-component-id="more_btn"><span class="material-icons">more_vert</span></button>
  </header>
  <main>
    <section class="card-visual" data-action="state_change" data-component-type="box" data-component-id="card_visual" tabindex="0" aria-label="Mifos Debit Visa ending 4521, expires 09/29">
      <div class="card-top">
        <span class="card-network-logo" data-component-type="image" data-component-id="card_network_logo" role="img" aria-label="Visa">VISA</span>
        <div class="card-chip-img" aria-hidden="true"><span class="material-icons">memory</span></div>
      </div>
      <div class="card-number" data-component-type="text" data-component-id="card_number_display">•••• •••• •••• 4521</div>
      <div class="card-bottom">
        <div>
          <div class="label">Cardholder</div>
          <div class="name" data-component-type="text" data-component-id="cardholder_name">Alex Johnson</div>
        </div>
        <div>
          <div class="label">Expires</div>
          <div class="expiry" data-component-type="text" data-component-id="card_expiry">09/29</div>
        </div>
      </div>
    </section>

    <div class="reveal-link">
      <button data-action="reveal_card_details" data-component-type="link" data-component-id="reveal_card_details_link" tabindex="0" aria-label="Reveal full card number"><span class="material-icons" style="font-size:var(--icon-sm);">visibility</span>Reveal Full Number</button>
    </div>

    <div class="toggle-row" data-component-type="stack" data-component-id="card_status_row">
      <span class="toggle-label" data-component-type="text" data-component-id="card_status_label">Card Active</span>
      <button class="toggle" data-action="toggle_card_status" data-component-type="input" data-component-id="card_status_switch" tabindex="0" role="switch" aria-checked="true" aria-label="Toggle card active status"></button>
    </div>

    <section class="section" data-component-type="box" data-component-id="limits_section">
      <h2 class="section-title" data-component-type="text" data-component-id="limits_section_title" role="heading" aria-level="2">Spending Limits</h2>
      <div class="limit-row" data-component-type="stack" data-component-id="daily_limit_row">
        <span class="limit-label" data-component-type="text" data-component-id="daily_limit_label">Daily Limit</span>
        <span class="limit-value" data-component-type="text" data-component-id="daily_limit_value">£2,500</span>
        <button class="limit-edit" data-action="edit_daily_limit" data-component-type="icon" data-component-id="daily_limit_edit_icon" tabindex="0" aria-label="Edit daily limit"><span class="material-icons">edit</span></button>
      </div>
      <div class="limit-row" data-component-type="stack" data-component-id="monthly_limit_row">
        <span class="limit-label" data-component-type="text" data-component-id="monthly_limit_label">Monthly Limit</span>
        <span class="limit-value" data-component-type="text" data-component-id="monthly_limit_value">£10,000</span>
        <button class="limit-edit" data-action="edit_monthly_limit" data-component-type="icon" data-component-id="monthly_limit_edit_icon" tabindex="0" aria-label="Edit monthly limit"><span class="material-icons">edit</span></button>
      </div>
    </section>

    <div class="actions" data-component-type="box" data-component-id="action_buttons_spacer">
      <button class="action-btn freeze" data-action="toggle_freeze_card" data-component-type="button" data-component-id="freeze_card_button" tabindex="0" aria-label="Freeze card"><span class="material-icons">ac_unit</span>Freeze Card</button>
      <button class="action-btn report" data-action="report_card_lost" data-component-type="button" data-component-id="report_lost_button" tabindex="0" aria-label="Report card lost"><span class="material-icons">report_problem</span>Report Lost</button>
      <button class="action-btn txns" data-nav-to="transactions" data-component-type="button" data-component-id="view_transactions_button" tabindex="0" aria-label="View transactions"><span class="material-icons">receipt_long</span>View Transactions</button>
    </div>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
