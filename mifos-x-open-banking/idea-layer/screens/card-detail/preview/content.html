<!doctype html>
<html lang="en" data-screen="card-detail" data-state="content" data-feature="card-detail" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Detail — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .card-visual { background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 16px; margin: 8px 20px; padding: 24px; color: var(--on-primary); min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-number { font-size: 18px; font-weight: 600; letter-spacing: 2px; }
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .card-holder { font-size: 12px; opacity: 0.8; }
    .card-holder .name { font-size: 14px; font-weight: 600; opacity: 1; }
    .card-expiry { text-align: right; font-size: 12px; opacity: 0.8; }
    .card-expiry .date { font-size: 14px; font-weight: 600; opacity: 1; }
    .card-network { font-size: 20px; font-weight: 700; opacity: 0.9; text-align: right; }
    .reveal-link { text-align: center; padding: 8px; font-size: 13px; font-weight: 600; color: var(--primary); cursor: pointer; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .toggle-label { font-size: 15px; font-weight: 500; }
    .toggle { width: 48px; height: 28px; border-radius: 14px; background: var(--primary); border: none; cursor: pointer; position: relative; }
    .toggle::after { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 11px; background: var(--surface); top: 3px; right: 3px; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--primary); text-transform: uppercase; padding: 16px 20px 8px; }
    .limit-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .limit-label { font-size: 14px; }
    .limit-value { font-size: 14px; font-weight: 600; color: var(--primary); }
    .limit-edit .material-icons { font-size: 18px; color: var(--on-surface-variant); cursor: pointer; }
    .action-row { display: flex; gap: 8px; padding: 16px 20px; }
    .action-btn { flex: 1; padding: 12px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; border: none; }
    .action-btn.freeze { background: var(--surface-variant); color: var(--secondary); }
    .action-btn.report { background: rgba(186,26,26,0.08); color: var(--error); }
    .action-btn.txns { background: var(--primary-container); color: var(--primary); }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span>
      <h1>Card Details</h1>
    </div>
    <div class="card-visual" data-component-type="box" data-component-id="card_visual">
      <div class="card-network">VISA</div>
      <div class="card-number" data-component-type="text" data-component-id="card_number_display">•••• •••• •••• 4521</div>
      <div class="card-bottom">
        <div class="card-holder"><span>Cardholder</span><div class="name" data-component-type="text" data-component-id="cardholder_name">ALEX WANJIRU</div></div>
        <div class="card-expiry"><span>Expires</span><div class="date" data-component-type="text" data-component-id="card_expiry">12/28</div></div>
      </div>
    </div>
    <div class="reveal-link" data-action="reveal_card_details" tabindex="0" aria-label="Reveal card number">Reveal Full Number</div>
    <div class="toggle-row">
      <span class="toggle-label">Card Active</span>
      <button class="toggle" data-action="toggle_card_status" tabindex="0" aria-label="Toggle card active status"></button>
    </div>
    <div class="section-title">Spending Limits</div>
    <div class="limit-row">
      <span class="limit-label">Daily Limit</span>
      <span class="limit-value">£2,500</span>
      <span class="limit-edit" data-action="edit_limit" tabindex="0" aria-label="Edit daily limit"><span class="material-icons">edit</span></span>
    </div>
    <div class="limit-row">
      <span class="limit-label">Monthly Limit</span>
      <span class="limit-value">£10,000</span>
      <span class="limit-edit" data-action="edit_limit" tabindex="0" aria-label="Edit monthly limit"><span class="material-icons">edit</span></span>
    </div>
    <div class="action-row">
      <button class="action-btn freeze" data-action="freeze_card" tabindex="0" aria-label="Freeze Card"><span class="material-icons" style="font-size:inherit">ac_unit</span> Freeze</button>
      <button class="action-btn report" data-action="report_lost" tabindex="0" aria-label="Report Lost">Report Lost</button>
      <button class="action-btn txns" data-nav-to="transactions" tabindex="0" aria-label="View Transactions">Transactions</button>
    </div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
