<!doctype html>
<html lang="en" data-screen="card-detail" data-state="frozen">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Details — Frozen</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; --frozen: #1565C0; --frozen-surface: #E3F2FD; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 32px; overflow-x: hidden; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--outline-variant); padding: 14px 8px 10px; }
    .top-bar-left { display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: none; border: none; color: var(--on-surface); cursor: pointer; padding: 8px; display: flex; align-items: center; }
    .top-bar-title { font-size: 18px; font-weight: 600; color: var(--on-surface); }
    /* Card visual */
    .card-visual-wrap { padding: 24px 20px 16px; }
    .card-visual { background: linear-gradient(135deg, #37474F 0%, #607D8B 100%); border-radius: 20px; padding: 24px 22px; position: relative; overflow: hidden; min-height: 196px; display: flex; flex-direction: column; justify-content: space-between; filter: grayscale(0.3); }
    .card-frozen-overlay { position: absolute; inset: 0; background: rgba(21, 101, 192, 0.35); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .frozen-icon { font-size: 40px; color: #E3F2FD; }
    .frozen-label { font-size: 16px; font-weight: 700; color: #E3F2FD; letter-spacing: 1.5px; text-transform: uppercase; }
    .card-chip { width: 36px; height: 28px; background: linear-gradient(135deg, #FFD740, #FFA000); border-radius: 4px; }
    .card-network { font-size: 18px; font-weight: 800; color: rgba(255,255,255,0.9); letter-spacing: 1px; }
    .card-number { font-size: 15px; color: rgba(255,255,255,0.85); letter-spacing: 4px; font-weight: 500; }
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .card-holder { font-size: 13px; color: rgba(255,255,255,0.75); }
    .card-expiry { font-size: 13px; color: rgba(255,255,255,0.75); }
    /* Frozen status banner */
    .frozen-banner { margin: 4px 20px 16px; background: var(--frozen-surface); border: 1px solid var(--frozen); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
    .frozen-banner .material-icons { color: var(--frozen); font-size: 22px; flex-shrink: 0; }
    .frozen-banner-text { font-size: 13px; color: #0D47A1; line-height: 1.4; }
    /* Sections */
    .section-title { font-size: 14px; font-weight: 700; color: var(--on-surface); padding: 12px 20px 8px; }
    .info-card { background: var(--surface); border-radius: 12px; margin: 0 20px 16px; padding: 16px; }
    .info-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--surface-variant); }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 13px; color: var(--outline); }
    .info-value { font-size: 13px; color: var(--on-surface); font-weight: 500; }
    .info-value.frozen-val { color: var(--frozen); font-weight: 600; }
    /* Buttons */
    .btn-unfreeze { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 40px); margin: 8px 20px 8px; padding: 15px 24px; background: var(--frozen); color: #FFFFFF; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; box-shadow: 0 2px 6px rgba(21,101,192,0.3); }
    .btn-outline { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 40px); margin: 0 20px 8px; padding: 14px 24px; background: var(--surface); color: var(--on-surface); border: 1px solid var(--outline-variant); border-radius: 14px; font-size: 15px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; opacity: 0.5; pointer-events: none; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main>

  <div class="top-bar" data-component-type="top_app_bar" data-component-id="card_top_bar">
    <div class="top-bar-left">
      <button class="icon-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <span class="top-bar-title">Card Details</span>
    </div>
    <button class="icon-btn" data-action="open_card_menu" aria-label="More options" tabindex="0">
      <span class="material-icons" aria-hidden="true">more_vert</span>
    </button>
  </div>

  <div class="card-visual-wrap" data-component-type="box" data-component-id="card_visual_area">
    <div class="card-visual" aria-label="Debit card ending 4821 — FROZEN">
      <div class="card-chip" aria-hidden="true"></div>
      <div class="card-network" aria-hidden="true">Visa</div>
      <div class="card-number" aria-hidden="true">•••• •••• •••• 4821</div>
      <div class="card-bottom">
        <div>
          <div class="card-holder">A. Osei-Bonsu</div>
        </div>
        <div class="card-expiry">09/29</div>
      </div>
      <!-- Frozen overlay -->
      <div class="card-frozen-overlay" aria-hidden="true">
        <span class="material-icons frozen-icon">ac_unit</span>
        <span class="frozen-label">Frozen</span>
      </div>
    </div>
  </div>

  <div class="frozen-banner" role="alert"
       data-component-type="box" data-component-id="frozen_status_banner">
    <span class="material-icons" aria-hidden="true">ac_unit</span>
    <span class="frozen-banner-text">This card is frozen. All transactions are blocked until you unfreeze it.</span>
  </div>

  <p class="section-title">Card Information</p>
  <div class="info-card" data-component-type="box" data-component-id="card_info_card">
    <div class="info-row">
      <span class="info-label">Card Type</span>
      <span class="info-value">Debit — Visa</span>
    </div>
    <div class="info-row">
      <span class="info-label">Account</span>
      <span class="info-value">Primary Checking</span>
    </div>
    <div class="info-row">
      <span class="info-label">Status</span>
      <span class="info-value frozen-val">Frozen</span>
    </div>
    <div class="info-row">
      <span class="info-label">Frozen Since</span>
      <span class="info-value">27 May 2026, 09:15</span>
    </div>
    <div class="info-row">
      <span class="info-label">Daily Limit</span>
      <span class="info-value" style="opacity:0.4;">£500 (blocked)</span>
    </div>
  </div>

  <button class="btn-unfreeze"
          data-component-type="button" data-component-id="unfreeze_card_button"
          data-action="unfreeze_card" aria-label="Unfreeze this card" tabindex="0">
    <span class="material-icons" aria-hidden="true">lock_open</span>
    Unfreeze Card
  </button>

  <button class="btn-outline" disabled aria-disabled="true"
          data-component-type="button" data-component-id="view_transactions_button"
          aria-label="View transactions — unavailable while frozen">
    <span class="material-icons" aria-hidden="true">receipt_long</span>
    Transactions
  </button>

  <button class="btn-outline" disabled aria-disabled="true"
          data-component-type="button" data-component-id="spending_limits_button"
          aria-label="Spending limits — unavailable while frozen">
    <span class="material-icons" aria-hidden="true">tune</span>
    Spending Limits
  </button>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
