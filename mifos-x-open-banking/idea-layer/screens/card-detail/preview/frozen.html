<!doctype html>
<html lang="en" data-screen="card-detail" data-state="frozen" data-feature="card-detail" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Detail — Frozen</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .card-visual { background: var(--outline-variant); border-radius: 16px; margin: 8px 20px; padding: 24px; color: var(--on-surface-variant); min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; position: relative; opacity: 0.6; }
    .frozen-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .frozen-overlay .material-icons { font-size: 48px; color: var(--secondary); }
    .frozen-overlay .label { font-size: 16px; font-weight: 700; color: var(--secondary); margin-top: 8px; }
    .card-number { font-size: 18px; font-weight: 600; letter-spacing: 2px; }
    .card-network { font-size: 20px; font-weight: 700; opacity: 0.5; text-align: right; }
    .unfreeze-btn { margin: 16px 20px; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span>
      <h1>Card Details</h1>
    </div>
    <div class="card-visual" data-component-type="box" data-component-id="card_visual">
      <div class="card-network">VISA</div>
      <div class="card-number" data-component-type="text" data-component-id="card_number_display">•••• •••• •••• 4521</div>
      <div class="frozen-overlay"><span class="material-icons">ac_unit</span><div class="label">FROZEN</div></div>
    </div>
    <button class="unfreeze-btn" data-action="freeze_card" tabindex="0" aria-label="Unfreeze Card">Unfreeze Card</button>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
