<!doctype html>
<!-- render-hash: b4a903ca15d1 -->
<html lang="en" data-screen="card-detail" data-state="frozen" data-feature="card-detail" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Detail — Frozen</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --secondary-container: #BCEBE7; --error: #BA1A1A; --error-container: #FFDAD6; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; --shadow-rgb: 0,0,0; --frozen-tint: rgba(197,200,186,0.5); }
    [data-theme="dark"] { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --secondary: #A0CFCB; --secondary-container: #1F4E4B; --error: #FFB4AB; --error-container: #93000A; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline: #8F9285; --outline-variant: #44483D; --frozen-tint: rgba(68,72,61,0.6); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --secondary: #A0CFCB; --secondary-container: #1F4E4B; --error: #FFB4AB; --error-container: #93000A; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A; --outline: #8F9285; --outline-variant: #44483D; --frozen-tint: rgba(68,72,61,0.6); } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    .top-app-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .top-app-bar .icon-btn { background: transparent; border: none; color: var(--on-surface-variant); width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .top-app-bar h1 { font-size: 18px; font-weight: 600; flex: 1; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 24px; }
    .frozen-banner { background: var(--secondary-container); color: var(--secondary); padding: 12px 16px; margin: 0 16px 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--secondary); }
    .frozen-banner .material-icons { font-size: 20px; color: var(--secondary); }
    .card-visual-wrap { position: relative; margin: 0 16px 16px; }
    .card-visual { background: linear-gradient(160deg, var(--outline-variant) 0%, var(--surface-variant) 100%); color: var(--on-surface); border-radius: 24px; padding: 24px; height: 210px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 12px 28px rgba(var(--shadow-rgb), 0.2); filter: grayscale(0.7); }
    .card-visual-overlay { position: absolute; inset: 0; border-radius: 24px; background: var(--frozen-tint); display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .card-visual-overlay .material-icons { font-size: 64px; color: var(--secondary); opacity: 0.9; }
    .card-visual-overlay .label { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--secondary); letter-spacing: 4px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-network-logo { font-size: 16px; font-weight: 700; letter-spacing: 1px; opacity: 0.8; }
    .card-number { font-family: 'Roboto Mono', monospace; font-size: 20px; letter-spacing: 4px; font-weight: 500; opacity: 0.7; }
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; opacity: 0.8; }
    .card-bottom .name { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .card-bottom .expiry { font-size: 13px; font-weight: 600; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--outline-variant); border-bottom: 1px solid var(--outline-variant); }
    .toggle-label { font-size: 15px; font-weight: 600; }
    .toggle { width: 52px; height: 32px; border-radius: 16px; background: var(--outline-variant); border: none; cursor: pointer; position: relative; padding: 0; }
    .toggle::after { content: ''; position: absolute; width: 26px; height: 26px; border-radius: 13px; background: var(--surface); top: 3px; left: 3px; box-shadow: 0 1px 3px rgba(var(--shadow-rgb), 0.15); }
    .section-title { font-size: 14px; font-weight: 700; color: var(--outline); text-transform: uppercase; letter-spacing: 0.8px; padding: 20px 20px 12px; }
    .info-disabled { padding: 16px 20px; background: var(--surface-container); color: var(--on-surface-variant); font-size: 13px; text-align: center; font-style: italic; }
    .actions { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { padding: 14px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .action-btn .material-icons { font-size: 20px; }
    .action-btn.unfreeze { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .action-btn.report { background: var(--error-container); color: var(--error); border-color: var(--error); }
    .action-btn.txns { grid-column: span 2; background: var(--surface); color: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>
  <header class="top-app-bar" data-component-type="app_bar" data-component-id="top_app_bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back" data-component-type="button" data-component-id="back_btn"><span class="material-icons">arrow_back</span></button>
    <h1>Card Details</h1>
    <button class="icon-btn" data-action="open_card_options_menu" aria-label="More options" data-component-type="button" data-component-id="more_btn"><span class="material-icons">more_vert</span></button>
  </header>
  <main>
    <div class="frozen-banner" data-component-type="box" data-component-id="frozen_banner" role="status" aria-live="polite">
      <span class="material-icons" aria-hidden="true">ac_unit</span>
      <span>Card is frozen. Online and in-store payments are blocked.</span>
    </div>
    <section class="card-visual-wrap">
      <div class="card-visual" data-component-type="box" data-component-id="card_visual" aria-label="Frozen card ending 4521">
        <div class="card-top">
          <span class="card-network-logo" data-component-type="image" data-component-id="card_network_logo" role="img" aria-label="Visa">VISA</span>
        </div>
        <div class="card-number" data-component-type="text" data-component-id="card_number_display">•••• •••• •••• 4521</div>
        <div class="card-bottom">
          <span class="name" data-component-type="text" data-component-id="cardholder_name">Alex Johnson</span>
          <span class="expiry" data-component-type="text" data-component-id="card_expiry">09/29</span>
        </div>
      </div>
      <div class="card-visual-overlay" aria-hidden="true">
        <span class="material-icons">ac_unit</span>
        <span class="label">FROZEN</span>
      </div>
    </section>

    <div class="toggle-row" data-component-type="stack" data-component-id="card_status_row">
      <span class="toggle-label" data-component-type="text" data-component-id="card_status_label">Card Active</span>
      <button class="toggle" data-action="toggle_card_status" data-component-type="input" data-component-id="card_status_switch" tabindex="0" role="switch" aria-checked="false" aria-label="Toggle card active status"></button>
    </div>

    <section data-component-type="box" data-component-id="limits_section">
      <h2 class="section-title" data-component-type="text" data-component-id="limits_section_title" role="heading" aria-level="2">Spending Limits</h2>
      <div class="info-disabled">Limits are not editable while the card is frozen. Unfreeze the card to manage limits.</div>
    </section>

    <div class="actions" data-component-type="box" data-component-id="action_buttons_spacer">
      <button class="action-btn unfreeze" data-action="toggle_freeze_card" data-component-type="button" data-component-id="freeze_card_button" tabindex="0" aria-label="Unfreeze card"><span class="material-icons">lock_open</span>Unfreeze Card</button>
      <button class="action-btn report" data-action="report_card_lost" data-component-type="button" data-component-id="report_lost_button" tabindex="0" aria-label="Report card lost"><span class="material-icons">report_problem</span>Report Lost</button>
      <button class="action-btn txns" data-nav-to="transactions" data-component-type="button" data-component-id="view_transactions_button" tabindex="0" aria-label="View transactions"><span class="material-icons">receipt_long</span>View Transactions</button>
    </div>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
