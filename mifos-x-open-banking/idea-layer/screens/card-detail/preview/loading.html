<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px,initial-scale=1">
<title>Card Detail — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:390px;min-height:844px;position:relative;overflow-x:hidden;
  background:var(--background);font-family:var(--font);
}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;height:56px;background:var(--surface);
  position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--surface-variant);
}
.top-bar-left{display:flex;align-items:center;gap:4px;}
.icon-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:none;background:transparent;cursor:pointer;
}
.top-bar-title{font-size:20px;font-weight:500;color:var(--text-primary);margin-left:4px;}
.scroll-area{overflow-y:auto;height:calc(844px - 56px);padding-bottom:32px;}
@keyframes shimmer{
  0%{background-position:-390px 0;}
  100%{background-position:390px 0;}
}
.skeleton{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--background) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}
/* Card skeleton */
.card-skel{
  width:340px;height:210px;border-radius:20px;
  margin:16px auto 0;
}
/* Reveal skel */
.reveal-skel{width:140px;height:16px;margin:16px auto 0;border-radius:8px;}
/* Info skeletons */
.info-skel{margin:12px 16px 0;border-radius:12px;height:56px;}
.limits-skel{margin:12px 16px 0;border-radius:12px;height:120px;}
/* Button skeletons */
.btn-skel{margin:12px 16px 0;border-radius:12px;height:52px;}
.btn-skel-sm{margin:0 16px 0;border-radius:12px;height:48px;}
</style>
</head>
<body>
<main data-screen="card-detail" data-state="loading" role="main" aria-busy="true" aria-label="Loading card details">

  <header class="top-bar" role="banner">
    <div class="top-bar-left">
      <button class="icon-btn" aria-label="Go back" disabled>
        <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);">arrow_back</span>
      </button>
      <span class="top-bar-title">Card Details</span>
    </div>
  </header>

  <div class="scroll-area">
    <div class="card-skel skeleton" role="presentation"></div>
    <div class="reveal-skel skeleton" style="margin-top:16px;margin-left:auto;margin-right:auto;" role="presentation"></div>
    <div class="info-skel skeleton" role="presentation"></div>
    <div class="limits-skel skeleton" role="presentation"></div>
    <div class="btn-skel skeleton" role="presentation"></div>
    <div style="height:12px;"></div>
    <div class="btn-skel skeleton" role="presentation"></div>
    <div style="height:12px;"></div>
    <div class="btn-skel-sm skeleton" role="presentation"></div>
  </div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
