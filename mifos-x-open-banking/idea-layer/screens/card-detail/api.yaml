sibling: api
schema_version: "4.0"
feature_id: card-detail
api:
  - id: obp_get_card_detail
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/cards/{cardId}"
    tag: Cards
    response:
      fields:
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: bank_card_number
          type: String
        - name: name_on_card
          type: String
        - name: card_type
          type: String
        - name: card_description
          type: String
        - name: card_network
          type: String
        - name: allows
          type: List<String>
        - name: enabled
          type: Boolean
        - name: cancelled
          type: Boolean
        - name: on_hot_list
          type: Boolean
        - name: technology
          type: String
        - name: expires
          type: String
        - name: replacement
          type: CardReplacement
    errors:
      - code: 400
        message: "INVALID_CARD_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "CARD_NOT_FOUND"
