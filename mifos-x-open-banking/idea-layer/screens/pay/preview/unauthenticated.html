<!doctype html>
<!-- render-hash: pay-unauthenticated-obie -->
<html lang="en" data-screen="pay" data-state="unauthenticated" data-feature="pay" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
      --icon-md: 24px; --icon-2xl: 48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6;
      --outline: #75796C; --outline-variant: #C5C8BA;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A;
      --outline: #8F9285; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A;
      --outline: #8F9285; --outline-variant: #44483D;
    }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .topbar { display: flex; align-items: center; gap: var(--sp-sm); height: 56px; padding: 0 var(--sp-md); background: var(--background); }
    .topbar .title { flex: 1; font-size: 22px; line-height: 28px; font-weight: 500; }
    .material-symbols-outlined { font-size: var(--icon-md); line-height: 1; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--sp-md); padding: var(--sp-xl) var(--sp-lg); }
    .lock-badge { width: 80px; height: 80px; border-radius: var(--radius-pill); background: var(--surface-variant); color: var(--on-surface-variant); display: grid; place-items: center; margin-bottom: var(--sp-sm); }
    .lock-badge .material-symbols-outlined { font-size: 40px; }
    .u-title { font-size: 22px; font-weight: 600; }
    .u-msg { font-size: 15px; color: var(--on-surface-variant); max-width: 34ch; }
    .u-cta { margin-top: var(--sp-md); display: inline-flex; align-items: center; gap: var(--sp-sm); background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-pill); padding: 14px var(--sp-xl); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="pay" data-state="unauthenticated">
    <header data-shell="top-app-bar" data-variant="small" class="topbar">
      <span class="title" role="heading" aria-level="1">Pay</span>
    </header>

    <main id="main-content" data-shell="content" data-state="unauthenticated">
      <div class="state-block" data-component-type="error_state" data-component-id="unauthenticated_state" role="alert">
        <span class="lock-badge" aria-hidden="true"><span class="material-symbols-outlined">lock</span></span>
        <div class="u-title">Session expired</div>
        <p class="u-msg">Your sign-in has expired. Sign in again to load your accounts and make a payment.</p>
        <button class="u-cta" data-component-type="button" data-component-id="signin_button" data-nav-to="splash" data-action-id="reauthenticate">
          <span class="material-symbols-outlined" aria-hidden="true">login</span>Sign in again
        </button>
      </div>
    </main>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
