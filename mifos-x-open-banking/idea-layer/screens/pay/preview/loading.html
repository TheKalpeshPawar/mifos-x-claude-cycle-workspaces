<!doctype html>
<!-- render-hash: pay-loading-obie -->
<html lang="en" data-screen="pay" data-state="loading" data-feature="pay" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --pending: #E8A317; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
      --icon-md: 24px; --icon-lg: 32px; --icon-2xl: 48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA; --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D; --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D; --nav-active-indicator: #354E16;
    }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: var(--font-display); background: var(--background); color: var(--on-background);
      display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .topbar { display: flex; align-items: center; gap: var(--sp-sm); height: 56px; padding: 0 var(--sp-md); background: var(--background); position: sticky; top: 0; z-index: 5; }
    .topbar .title { flex: 1; font-size: 22px; line-height: 28px; font-weight: 500; }
    .material-symbols-outlined { font-size: var(--icon-md); line-height: 1; }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: var(--sp-sm) var(--sp-md) var(--sp-md); gap: var(--sp-lg); }
    .sk { background: var(--surface-variant); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
    .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
    .sk-label { height: 12px; width: 52%; margin-bottom: var(--sp-sm); }
    .sk-row { height: 72px; border-radius: var(--radius-md); }
    .sk-section { display: flex; flex-direction: column; gap: var(--sp-sm); }
    .progress-row { display: flex; align-items: center; justify-content: center; gap: var(--sp-sm); color: var(--on-surface-variant); font-size: 13px; padding-top: var(--sp-sm); }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--outline-variant); border-top-color: var(--primary); border-radius: var(--radius-pill); animation: spin 0.9s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface-container); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: var(--sp-sm) 0 10px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-xs) 12px; border-radius: var(--radius-lg); min-width: 56px; text-decoration: none; }
    .nav-item .material-symbols-outlined { font-size: var(--icon-md); color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
    .nav-item.active { background: var(--nav-active-indicator); }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="pay" data-state="loading">
    <header data-shell="top-app-bar" data-variant="small" class="topbar">
      <span class="title" role="heading" aria-level="1">Pay</span>
    </header>

    <main id="main-content" data-shell="content" data-state="loading" aria-busy="true" aria-label="Loading your payment options">
      <section class="sk-section" aria-hidden="true">
        <div class="sk sk-label"></div>
        <div class="sk sk-row"></div>
        <div class="sk sk-row"></div>
        <div class="sk sk-row"></div>
      </section>
      <section class="sk-section" aria-hidden="true">
        <div class="sk sk-label"></div>
        <div class="sk sk-row"></div>
      </section>
      <div class="progress-row">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading your accounts and payees…</span>
      </div>
    </main>

    <nav data-shell="bottom-nav" aria-label="Primary navigation">
      <a class="nav-item" data-nav-to="home" data-component-type="nav-item" data-component-id="nav_home" aria-label="Home">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-item" data-nav-to="accounts" data-component-type="nav-item" data-component-id="nav_accounts" aria-label="Accounts">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
        <span class="nav-label">Accounts</span>
      </a>
      <a class="nav-item active" data-nav-to="pay" data-component-type="nav-item" data-component-id="nav_pay" aria-current="page" aria-label="Pay">
        <span class="material-symbols-outlined" aria-hidden="true">send</span>
        <span class="nav-label">Pay</span>
      </a>
      <a class="nav-item" data-nav-to="pfm-dashboard" data-component-type="nav-item" data-component-id="nav_insights" aria-label="Insights">
        <span class="material-symbols-outlined" aria-hidden="true">insights</span>
        <span class="nav-label">Insights</span>
      </a>
      <a class="nav-item" data-nav-to="settings" data-component-type="nav-item" data-component-id="nav_more" aria-label="More">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
        <span class="nav-label">More</span>
      </a>
    </nav>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
