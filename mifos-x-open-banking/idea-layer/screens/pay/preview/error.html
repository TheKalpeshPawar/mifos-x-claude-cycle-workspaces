<!doctype html>
<!-- render-hash: pay-error-obie -->
<html lang="en" data-screen="pay" data-state="error" data-feature="pay" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6;
      --outline: #75796C; --outline-variant: #C5C8BA; --nav-active-indicator: #DCE7C8;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
      --icon-md: 24px; --icon-2xl: 48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6;
      --outline: #75796C; --outline-variant: #C5C8BA; --nav-active-indicator: #DCE7C8;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A;
      --outline: #8F9285; --outline-variant: #44483D; --nav-active-indicator: #354E16;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --surface-container: #1E201A;
      --outline: #8F9285; --outline-variant: #44483D; --nav-active-indicator: #354E16;
    }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .topbar { display: flex; align-items: center; gap: var(--sp-sm); height: 56px; padding: 0 var(--sp-md); background: var(--background); position: sticky; top: 0; z-index: 5; }
    .topbar .title { flex: 1; font-size: 22px; line-height: 28px; font-weight: 500; }
    .material-symbols-outlined { font-size: var(--icon-md); line-height: 1; }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: var(--sp-sm) var(--sp-md) var(--sp-md); gap: var(--sp-lg); }
    .section-label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-surface-variant); text-transform: uppercase; margin-bottom: var(--sp-sm); }
    .kind-list { display: flex; flex-direction: column; gap: var(--sp-sm); }
    .kind-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-md); padding: 14px var(--sp-md); cursor: pointer; color: var(--on-surface); font-family: inherit; }
    .kind-row .klead { width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; flex-shrink: 0; }
    .kind-row .kbody { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .kind-row .ktitle { font-size: 16px; font-weight: 600; }
    .kind-row .ksub { font-size: 13px; color: var(--on-surface-variant); }
    .kind-row .material-symbols-outlined { color: var(--on-surface-variant); }
    .state-panel { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-sm); padding: var(--sp-xl) var(--sp-md); background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); }
    .state-panel .s-icon { width: 56px; height: 56px; border-radius: var(--radius-pill); background: var(--error-container); color: var(--on-error-container); display: grid; place-items: center; }
    .state-panel .s-icon .material-symbols-outlined { font-size: var(--icon-2xl); }
    .state-panel .s-title { font-size: 17px; font-weight: 600; }
    .state-panel .s-msg { font-size: 14px; color: var(--on-surface-variant); max-width: 32ch; }
    .state-panel .s-retry { margin-top: var(--sp-sm); display: inline-flex; align-items: center; gap: var(--sp-sm); background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-pill); padding: 12px var(--sp-lg); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface-container); border-top: 1px solid var(--outline-variant); display: flex; justify-content: space-around; padding: var(--sp-sm) 0 10px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-xs) 12px; border-radius: var(--radius-lg); min-width: 56px; text-decoration: none; }
    .nav-item .material-symbols-outlined { font-size: var(--icon-md); color: var(--outline); }
    .nav-item .nav-label { font-size: 11px; font-weight: 400; color: var(--outline); }
    .nav-item.active .material-symbols-outlined { color: var(--primary); }
    .nav-item.active .nav-label { color: var(--primary); font-weight: 500; }
    .nav-item.active { background: var(--nav-active-indicator); }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="pay" data-state="error">
    <header data-shell="top-app-bar" data-variant="small" class="topbar">
      <span class="title" role="heading" aria-level="1">Pay</span>
    </header>

    <main id="main-content" data-shell="content" data-state="error">
      <section data-component-type="LayoutBox" data-component-id="kind_chooser_section" aria-labelledby="kind-label">
        <div class="section-label" id="kind-label" data-component-type="text" data-component-id="kind_chooser_header">How would you like to pay?</div>
        <div class="kind-list">
          <button class="kind-row" data-component-type="list_item" data-component-id="kind_now" data-nav-to="send-money-amount" data-action-id="select_kind" aria-label="Pay now. Send a one-off payment straight away.">
            <span class="klead" aria-hidden="true"><span class="material-symbols-outlined">bolt</span></span>
            <span class="kbody"><span class="ktitle">Pay now</span><span class="ksub">Send a one-off payment straight away</span></span>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
          </button>
          <button class="kind-row" data-component-type="list_item" data-component-id="kind_scheduled" data-nav-to="send-money-amount" data-action-id="select_kind" aria-label="Scheduled payment. Pay on a future date you choose.">
            <span class="klead" aria-hidden="true"><span class="material-symbols-outlined">event</span></span>
            <span class="kbody"><span class="ktitle">Scheduled payment</span><span class="ksub">Pay on a future date you choose</span></span>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
          </button>
          <button class="kind-row" data-component-type="list_item" data-component-id="kind_recurring" data-nav-to="send-money-amount" data-action-id="select_kind" aria-label="Recurring payment. Set up a standing order that repeats.">
            <span class="klead" aria-hidden="true"><span class="material-symbols-outlined">autorenew</span></span>
            <span class="kbody"><span class="ktitle">Recurring payment</span><span class="ksub">Set up a standing order that repeats</span></span>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
          </button>
        </div>
      </section>

      <section data-component-type="LayoutBox" data-component-id="error_section">
        <div class="state-panel" data-component-type="error_state" data-component-id="error_state" role="alert">
          <span class="s-icon" aria-hidden="true"><span class="material-symbols-outlined">cloud_off</span></span>
          <span class="s-title">Couldn't load recipients</span>
          <span class="s-msg">We couldn't load this account's recipients. Try again, or switch to another account.</span>
          <button class="s-retry" data-component-type="button" data-component-id="retry_button" data-action-id="retry">
            <span class="material-symbols-outlined" aria-hidden="true">refresh</span>Try again
          </button>
        </div>
      </section>
    </main>

    <nav data-shell="bottom-nav" aria-label="Primary navigation">
      <a class="nav-item" data-nav-to="home" data-component-type="nav-item" data-component-id="nav_home" aria-label="Home">
        <span class="material-symbols-outlined" aria-hidden="true">home</span><span class="nav-label">Home</span>
      </a>
      <a class="nav-item" data-nav-to="accounts" data-component-type="nav-item" data-component-id="nav_accounts" aria-label="Accounts">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span><span class="nav-label">Accounts</span>
      </a>
      <a class="nav-item active" data-nav-to="pay" data-component-type="nav-item" data-component-id="nav_pay" aria-current="page" aria-label="Pay">
        <span class="material-symbols-outlined" aria-hidden="true">send</span><span class="nav-label">Pay</span>
      </a>
      <a class="nav-item" data-nav-to="pfm-dashboard" data-component-type="nav-item" data-component-id="nav_insights" aria-label="Insights">
        <span class="material-symbols-outlined" aria-hidden="true">insights</span><span class="nav-label">Insights</span>
      </a>
      <a class="nav-item" data-nav-to="settings" data-component-type="nav-item" data-component-id="nav_more" aria-label="More">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span><span class="nav-label">More</span>
      </a>
    </nav>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
