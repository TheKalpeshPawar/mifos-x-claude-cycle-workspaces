responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - kind_chooser_header
        - kind_now
        - kind_scheduled
        - kind_recurring
        - kind_international
        - from_account_header
      show_progress_indicator: true
  content:
    layout:
      visible_components:
        - kind_chooser_header
        - kind_now
        - kind_scheduled
        - kind_recurring
        - kind_international
        - from_account_header
        - account_selector
        - recent_recipients_header
        - recipient_new
        - recent_recipient_item
        - all_beneficiaries_header
        - beneficiary_item
        - beneficiary_subtitle
        - no_beneficiaries_note
  empty:
    layout:
      visible_components:
        - kind_chooser_header
        - kind_now
        - kind_scheduled
        - kind_recurring
        - kind_international
        - from_account_header
        - account_selector
        - recent_recipients_header
        - recipient_new
      show_empty_state: true
      empty_state_title: "No recipients yet"
      empty_state_message: "People you pay will appear here. Start a new payment above."
      empty_state_cta: "New payment"
  error:
    layout:
      visible_components:
        - kind_chooser_header
        - kind_now
        - kind_scheduled
        - kind_recurring
      show_error_state: true
      error_icon: cloud_off
      error_title: "Couldn't load recipients"
      error_message: "We couldn't load this account's recipients. Try again, or switch to another account."
      show_retry_button: true
  no_network:
    layout:
      visible_components:
        - kind_chooser_header
        - kind_now
        - kind_scheduled
        - kind_recurring
      show_error_state: true
      error_icon: cloud_off
      error_title: "You're offline"
      error_message: "We can't reach your bank right now. Check your connection and try again."
      show_retry_button: true
  unauthenticated:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Session expired"
      error_message: "Your sign-in has expired. Sign in again to load your recipients."
      show_retry_button: true

state_model:
  view_model: PayHubViewModel
  ui_state_type: "ScreenState<PayHubContent>"
  content_type: PayHubContent
  content_fields:
    - name: accounts
      type: "List<OBReadAccount6>"
    - name: selectedAccountId
      type: String
    - name: recentRecipients
      type: List<HubRecipient>
    - name: allBeneficiaries
      type: List<HubRecipient>
  state_field_types:
    - name: account.id
      type: "Data.Account[].AccountId (String)"
    - name: account.label
      type: "Data.Account[].Nickname (String, fallback Account[].Name)"
    - name: account.identification
      type: "Data.Account[].Account[].Identification (String)"
    - name: beneficiary.id
      type: "Data.Beneficiary[].BeneficiaryId (String)"
    - name: beneficiary.name
      type: "Data.Beneficiary[].CreditorAccount.Name (String)"
    - name: beneficiary.identification
      type: "Data.Beneficiary[].CreditorAccount.Identification (String)"
    - name: beneficiary.scheme
      type: "Data.Beneficiary[].CreditorAccount.SchemeName (String)"
  states:
    - Loading
    - Content
    - Empty
    - Error
    - NoNetwork
    - Unauthenticated
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Couldn't load recipients."
  events:
    - onRefresh
    - onRetry
    - onAccountSelected
    - onKindSelected
  actions:
    - select_kind
    - select_recipient
    - new_recipient
    - select_account
  callbacks:
    - name: onKindSelected
      signature: "(kind: PaymentKind) -> Unit"
      consumer: send-money-amount
    - name: onRecipientSelected
      signature: "(accountId: String, counterpartyId: String, kind: PaymentKind) -> Unit"
      consumer: send-money-amount
    - name: onNewPayment
      signature: "(accountId: String, kind: PaymentKind) -> Unit"
      consumer: send-money-amount
  di:
    - AccountsRepository
    - PaymentsRepository
    - BanksRepository
    - UserPreferencesRepository

api:
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: AISP
    description: "List the PSU's authorised accounts to populate the FROM ACCOUNT selector. Requires an authorised account-access-consent (Status AUTH) + an authorization-code token (scope accounts)."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: AISP
    description: "Available balance for the selected source account, shown in the FROM ACCOUNT row. Requires ReadBalances on the account-access-consent. Prefer Type InterimAvailable."
    response:
      fields:
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
        - name: Data.Balance[].Type
          type: String
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/beneficiaries"
    tag: AISP
    description: "Saved beneficiaries linked to the selected account — builds the recent recipients + all beneficiaries lists for the pay-now shortcut. Requires ReadBeneficiariesBasic/Detail on the account-access-consent. The 'SEPA · BankName ·· last4' subtitle is derived from CreditorAccount.SchemeName + Identification (no separate bank-directory lookup under OBIE). 'Recent recipients' is a client-side ordering — OBIE AIS has no payee-recency timeline."
    response:
      fields:
        - name: Data.Beneficiary[].BeneficiaryId
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Name
          type: String
        - name: Data.Beneficiary[].CreditorAccount.SchemeName
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Identification
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries
    - send-money-amount
