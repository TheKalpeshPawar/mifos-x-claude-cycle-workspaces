sibling: data-flow
schema_version: "4.0"
feature_id: payment-declined
entries:
  - screen_id: payment-declined
    trigger: on_mount
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: >-
      Stateless args-driven terminal screen. Decline reason resolved upstream by auth-callback
      (consent Status RJCT StatusReason, oauth2_authorize error param, or rejected
      POST /pisp/domestic-payments submit) and passed as nav args. SCA was performed at HSBC
      during the authorise redirect — no SCA screen in-app. No OBIE API is called here.

  - screen_id: payment-declined
    trigger: on_interact
    event: TryAgain
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: "Navigates back to send-money to restart the payment flow. No API call."

  - screen_id: payment-declined
    trigger: on_interact
    event: GoHome
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: "Navigates to home. No API call."
