note: "PaymentDeclinedScreen is a stateless, args-driven terminal screen. The decline reason is resolved upstream by auth-callback from the consent Status RJCT StatusReason, the oauth2_authorize error param, or a rejected create_domestic_payment submit, and is passed in as a nav arg. SCA is performed AT HSBC during the authorise redirect — this screen replaces the OBP in-app sca-challenge error path. No OBIE API is invoked here."
