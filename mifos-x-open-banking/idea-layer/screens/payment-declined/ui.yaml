id: payment-declined
name: "Payment Declined"
feature: payment-declined
flavor: consumer
status: draft
quality_score: 0
contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - to: draft
    at: "2026-06-11"
    by: "/idea add (OBIE PISP migration)"
    note: "Terminal error screen for the HSBC Open Banking PISP payment journey. Reached from auth-callback when authorisation fails — the PSU declines at HSBC, the consent comes back Status RJCT, the callback returns an error param, or the /domestic-payments submit is rejected. Stateless, args-driven: shows what happened, the payment details (amount, payee, optional reason), and 'Try again' which pops back to send-money-confirm. SCA is performed AT HSBC during the authorise redirect, so this terminal screen replaces the OBP sca-challenge error path. archetype empty_state/error."

screens:
  - id: payment-declined
    name: "Payment Declined"
    archetype: empty_state
    shell:
      top_bar: false
      bottom_nav: false

archetype: empty_state

components:
  - type: stack
    id: declined_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
      align: center
      justify: center
    children:
      - declined_icon
      - declined_title
      - declined_message
      - declined_details_card
      - declined_amount_value
      - declined_payee_value
      - declined_reason_row
      - declined_reason_label
      - declined_reason_value
      - declined_assurance
      - declined_try_again_button
      - declined_done_button

  - type: icon
    id: declined_icon
    content: "cancel"
    variant: default
    style:
      color: "#BA1A1A"
      size: "92dp"
      alignment: center
    a11y:
      role: image
      label: "Payment declined"
    test_context:
      purpose: "Large declined glyph at the top of the terminal error screen"
      interaction_type: display
      data_driven: false

  - type: text
    id: declined_title
    content: "Payment declined"
    variant: headline_large
    style:
      typography: "Outfit/headline_medium"
      color: "#1A1C16"
      font_weight: 700
      alignment: center
      padding_top: spacing.md
    a11y:
      role: heading
      level: 1
      label: "Payment declined"
    test_context:
      purpose: "Primary terminal heading telling the user the payment was not authorised"
      interaction_type: display
      data_driven: false

  - type: text
    id: declined_message
    content: "HSBC didn't authorise this payment, so no money has left your account. You can review the details and try again."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_top: spacing.xs
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "HSBC didn't authorise this payment, so no money has left your account. You can review the details and try again."
    test_context:
      purpose: "Supporting copy explaining the decline happened at the bank and no charge was made"
      interaction_type: display
      data_driven: true

  - type: card
    id: declined_details_card
    variant: filled
    style:
      background: "#FFFFFF"
      border_radius: "16dp"
      border_color: "#FFDAD6"
      border_width: 1
      padding: spacing.md
      margin_top: spacing.sm
      margin_bottom: spacing.lg
      width: "match_parent"
    children:
      - declined_amount_value
      - declined_payee_value
      - declined_reason_row
    a11y:
      role: group
      label: "Declined payment details"
    test_context:
      purpose: "Details card echoing the amount, payee and decline reason of the rejected payment"
      interaction_type: display
      data_driven: true

  - type: text
    id: declined_amount_value
    content: "£500.00"
    variant: display_small
    style:
      typography: "Outfit/display_small"
      color: "#BA1A1A"
      font_weight: 700
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: text
      label: "Amount: five hundred pounds"
    test_context:
      purpose: "Amount of the payment that was declined, carried in from the PaymentDraft"
      interaction_type: display
      data_driven: true

  - type: text
    id: declined_payee_value
    content: "To John Smith — Barclays Bank UK"
    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
      alignment: center
      padding_bottom: spacing.sm
    a11y:
      role: text
      label: "To John Smith at Barclays Bank UK"
    test_context:
      purpose: "Payee line of the declined payment"
      interaction_type: display
      data_driven: true

  - type: stack
    id: declined_reason_row
    variant: row
    style:
      padding_top: spacing.sm
      justify: space_between
    children:
      - declined_reason_label
      - declined_reason_value
    a11y:
      role: row
      label: "Decline reason"
    test_context:
      purpose: "Row carrying the structured decline reason from the consent StatusReason or callback error"
      interaction_type: display
      data_driven: true

  - type: text
    id: declined_reason_label
    content: "Reason"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    a11y:
      role: text
      label: "Reason label"
    test_context:
      purpose: "Label for the decline reason row"
      interaction_type: display
      data_driven: false

  - type: text
    id: declined_reason_value
    content: "Authorisation cancelled at HSBC"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      font_weight: 500
    a11y:
      role: text
      label: "Reason: Authorisation cancelled at HSBC"
    test_context:
      purpose: "Human-readable decline reason mapped from consent Status RJCT StatusReason, the callback error param, or a rejected /domestic-payments submit"
      interaction_type: display
      data_driven: true

  - type: text
    id: declined_assurance
    content: "No charge was made. Your money is safe."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "No charge was made. Your money is safe."
    test_context:
      purpose: "Reassurance line confirming the account was not debited"
      interaction_type: display
      data_driven: false

  - type: button
    id: declined_try_again_button
    label: "Try again"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      width: "match_parent"
    on_click:
      action: navigate
      target: send-money-confirm
    a11y:
      role: button
      label: "Try this payment again"
    keyboard:
      focusable: true
    test_context:
      purpose: "Primary CTA — pops back to send-money-confirm to re-attempt the payment authorisation"
      interaction_type: navigate
      data_driven: false

  - type: button
    id: declined_done_button
    label: "Back to Send Money"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      typography: "Outfit/label_large"
      color: "#4C662B"
      width: "match_parent"
    on_click:
      action: navigate
      target: send-money
    a11y:
      role: button
      label: "Cancel and return to Send Money"
    keyboard:
      focusable: true
    test_context:
      purpose: "Secondary CTA — abandons this payment and returns to the send-money entry screen"
      interaction_type: navigate
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: error
  error:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [declined_icon, declined_title, declined_message, declined_details_card, declined_amount_value, declined_payee_value, declined_reason_row, declined_reason_label, declined_reason_value, declined_assurance, declined_try_again_button, declined_done_button]
    note: "Terminal declined state — rendered directly from nav args (amount, currency, payeeName, payeeBank, reason). declined_reason_row is shown only when reason is non-blank. Reached from auth-callback when the PSU declines at HSBC, the consent is Status RJCT, the callback returns an error param, or the /domestic-payments submit is rejected."

state_model:
  view_model: null
  note: "No ViewModel — PaymentDeclinedScreen is a stateless composable driven entirely by navigation arguments. SCA is performed AT HSBC during the authorise redirect, so this terminal screen replaces the OBP sca-challenge error path. The decline reason is resolved by auth-callback (consent StatusReason / OAuth error param / rejected submit) and passed in as a nav arg. No StateFlow, no async load, no DI."
  nav_params:
    - { name: amount, type: String }
    - { name: currency, type: String }
    - { name: payeeName, type: String }
    - { name: payeeBank, type: String }
    - { name: reason, type: "String?", default: "null" }
  actions:
    - navigate
  callbacks:
    - name: onTryAgain
      signature: "() -> Unit"
      consumer: send-money-confirm
    - name: onDone
      signature: "() -> Unit"
      consumer: send-money

navigation:
  - id: nav_try_again
    target: send-money-confirm
    trigger: try_again_click
    on_click:
      action: navigate
      target: send-money-confirm
    note: "'Try again' pops back to send-money-confirm to re-stage the consent and re-authorise (matches payment-initiation.yaml connection payment-declined → send-money-confirm)."
  - id: nav_done
    target: send-money
    trigger: done_click
    on_click:
      action: navigate
      target: send-money
    note: "Secondary exit back to the send-money entry screen, abandoning the payment."

api:
  endpoints: []
  note: "Stateless terminal screen — all data (amount, payee, decline reason) arrives via nav args resolved by auth-callback. No OBIE API is invoked here; the underlying decline comes from create_domestic_payment_consent (Status RJCT), the oauth2_authorize error param, or a rejected create_domestic_payment submit upstream."

dependencies:
  tier: feature
  features:
    - send-money-confirm
    - send-money
    - payment-authorize-handoff
