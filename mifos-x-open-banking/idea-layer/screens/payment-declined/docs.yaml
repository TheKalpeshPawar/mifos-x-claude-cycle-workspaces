status_history:
  - to: draft
    at: "2026-06-11"
    by: "/idea add (OBIE PISP migration)"
    note: >-
      Terminal error screen for the HSBC Open Banking PISP payment journey.
      Reached from auth-callback when authorisation fails — the PSU declines at
      HSBC, the consent comes back Status RJCT, the callback returns an error
      param, or the /domestic-payments submit is rejected. Stateless,
      args-driven: shows what happened, the payment details (amount, payee,
      optional reason), and 'Try again' which pops back to send-money-confirm.
      SCA is performed AT HSBC during the authorise redirect, so this terminal
      screen replaces the OBP in-app sca-challenge error path.
      archetype empty_state/error.
  - to: enriched
    at: "2026-06-12"
    by: "/idea enrich --feature payment-declined"
    note: >-
      Reframed to the calmer 'Payment not completed' with the 'no money has
      left your account' reassurance promoted above the explanation. Modelled a
      primary content state (PSU declined / access_denied) plus a generic error
      variant exposing a muted reference line. Sample values aligned to the PISP
      flow (£250.00, Jordan Avery — Barclays Bank UK, access_denied / consent
      RJCT). Try again → send-money-confirm; Back to home → home. Added a
      stateless-args MVI state_model and reasons card for parity with the
      consent-declined AIS sibling.
  - to: designed
    at: "2026-06-14"
    by: "/idea export"
    note: "Exported SPEC.md, API.md, MOCKUP.md, PROMPTS_FIGMA.md; roundtrip verification passed (RULE-EXPORT-ROUNDTRIP-001). Stateless terminal screen — API.md is (none); no network calls."
