sibling: api
schema_version: "4.0"
feature_id: products
api:
  - id: obp_products
    endpoint: "GET /obp/v5.0.0/banks/{bankId}/products"
    tag: Product
    description: "List available banking products from OBP v5.0.0"
    response:
      fields:
        - name: products
          type: "List<Product>"
        - name: code
          type: String
        - name: name
          type: String
        - name: category
          type: String
          enum: [SAVINGS, LOANS, CARDS, MORTGAGES, CURRENT]
        - name: family
          type: String
        - name: super_family
          type: String
        - name: more_info_url
          type: String
        - name: details
          type: ProductDetails
        - name: meta
          type: ProductMeta
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "BANK_NOT_FOUND"
      - code: 503
        message: "SERVICE_UNAVAILABLE"
