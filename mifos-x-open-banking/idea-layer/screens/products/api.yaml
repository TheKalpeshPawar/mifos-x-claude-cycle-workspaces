sibling: api
schema_version: "4.0"
feature_id: products
# Rebound OBP -> HSBC OBIE Open Data 2026-06-11. Products is now UNAUTHENTICATED product
# reference data (server/apis/open-data.yaml). No token, no consent, no my/accounts. The
# Personal/Business audience split maps directly onto the two Open Data product endpoints:
# Personal -> /personal-current-accounts (PCA), Business -> /business-current-accounts (BCA).
# The catalogue is per-Brand (data[].Brand[]) — the former bank selector becomes a brand
# selector keyed on data[].Brand[].BrandName.
api:
  - id: opendata_personal_current_accounts
    endpoint: "GET /open-banking/opendata/v2.4.0/personal-current-accounts"
    tag: Product
    auth_required: false
    description: "Personal Current Account (PCA) reference data — on-sale PCA products per brand. UNAUTHENTICATED Open Data; meta + data[].Brand[].PCA[] envelope. Backs the Personal audience tab."
    demo_source: demo-data.yaml#/collections/opendata_personal_current_accounts
    trigger: "on load / onRetry / onScopeSelected(PERSONAL) — ProductsRepository.personalCurrentAccounts()"
    response:
      wrapper: data
      dto: OpenDataPca
      fields:
        - name: meta.LastUpdated
          type: String
        - name: meta.TotalResults
          type: Integer
        - name: data[].Brand[].BrandName
          type: String
        - name: data[].Brand[].PCA[].Identification
          type: String
        - name: data[].Brand[].PCA[].ProductName
          type: String
        - name: data[].Brand[].PCA[].Segment
          type: String
        - name: data[].Brand[].PCA[].OnSaleIndicator
          type: String
        - name: data[].Brand[].PCA[].CoreProduct
          type: Object
        - name: data[].Brand[].PCA[].Overdraft
          type: Object
        - name: data[].Brand[].PCA[].CreditInterest
          type: Object
        - name: data[].Brand[].PCA[].OtherFeesCharges
          type: Array
    errors:
      - code: 400
        message: "Bad Request"
      - code: 429
        message: "TOO_MANY_REQUESTS"
      - code: 500
        message: "Internal Server Error"

  - id: opendata_business_current_accounts
    endpoint: "GET /open-banking/opendata/v2.4.0/business-current-accounts"
    tag: Product
    auth_required: false
    description: "Business Current Account (BCA) reference data per brand. UNAUTHENTICATED Open Data; meta + data[].Brand[].BCA[] envelope. Backs the Business audience tab."
    demo_source: demo-data.yaml#/collections/opendata_business_current_accounts
    trigger: "on load / onScopeSelected(BUSINESS) — ProductsRepository.businessCurrentAccounts()"
    response:
      wrapper: data
      dto: OpenDataBca
      fields:
        - name: data[].Brand[].BrandName
          type: String
        - name: data[].Brand[].BCA[].Identification
          type: String
        - name: data[].Brand[].BCA[].MarketingState
          type: Array
        - name: data[].Brand[].BCA[].CoreProduct
          type: Object
        - name: data[].Brand[].BCA[].Overdraft
          type: Object
        - name: data[].Brand[].BCA[].CreditInterest
          type: Object
        - name: data[].Brand[].BCA[].Eligibility
          type: Object
        - name: data[].Brand[].BCA[].OtherFeesCharges
          type: Array
    errors:
      - code: 400
        message: "Bad Request"
      - code: 429
        message: "TOO_MANY_REQUESTS"
      - code: 500
        message: "Internal Server Error"

  # DEFERRED — product search never shipped. No search endpoint is called by this screen;
  # the top-bar search action was removed (verified shipped 2026-06-11).
  - id: search_products
    deferred: true
    deferred_reason: "Product search was never wired on this screen — top-bar search action removed. No endpoint called. Open Data exposes no product-search endpoint."
