<!doctype html>
<!-- render-hash: 9e2b5d7f3a1c -->
<html lang="en" data-screen="products" data-state="error" data-feature="products" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products — Error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 24px; }
  .top-bar { display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--on-background); }
  .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--on-surface-variant); }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .state-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 32px 80px; }
  .state-illustration { margin-bottom: 24px; }
  .state-icon-circle { width: 96px; height: 96px; border-radius: 48px; background: var(--surface-variant); display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  .state-icon-circle .material-icons { font-size: 44px; color: var(--error); }
  .state-title { font-size: 18px; font-weight: 700; color: var(--on-surface); margin-bottom: 8px; }
  .state-message { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; max-width: 268px; margin: 0 auto 24px; }
  .retry-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 24px; background: var(--primary); color: var(--on-primary); border: none; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .retry-btn:hover { opacity: 0.92; }
  .retry-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .retry-btn .material-icons { font-size: var(--icon-sm); }
  .obie-note { margin-top: 32px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-soft); font-size: 12px; color: var(--on-surface-variant); max-width: 300px; line-height: 1.4; }
  .obie-note strong { color: var(--on-surface); }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back"><span class="material-icons">arrow_back</span></button>
    <h1 data-component-type="text" data-component-id="products_title">Products</h1>
  </header>

  <section class="state-wrap" role="alert" aria-live="assertive">
    <div class="state-illustration">
      <!-- Inline SVG — disconnected cloud / open-banking API unreachable -->
      <svg width="140" height="120" viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Unable to load Open Banking product data" role="img">
        <!-- Cloud body -->
        <path d="M105 62c0-12.15-9.85-22-22-22-1.76 0-3.47.22-5.1.62C75.22 33.25 67.07 28 57.5 28 43.42 28 32 39.42 32 53.5c0 .84.05 1.67.13 2.49C27.56 58.22 24 62.75 24 68c0 7.73 6.27 14 14 14h64c7.73 0 14-6.27 14-14 0-3.22-1.1-6.18-2.93-8.52-.68.34-1.38.52-2.07.52z" fill="var(--surface-variant)" stroke="var(--outline)" stroke-width="1.5"/>
        <!-- Diagonal slash through cloud — connectivity error -->
        <line x1="38" y1="34" x2="102" y2="86" stroke="var(--error)" stroke-width="3" stroke-linecap="round"/>
        <!-- Small wifi-off dots below -->
        <circle cx="57" cy="100" r="3.5" fill="var(--outline-variant)"/>
        <circle cx="70" cy="100" r="3.5" fill="var(--outline-variant)"/>
        <circle cx="83" cy="100" r="3.5" fill="var(--outline-variant)"/>
      </svg>
    </div>

    <div class="state-title">Unable to load products</div>
    <div class="state-message">The Open Banking product catalogue could not be reached. Check your connection and try again.</div>

    <button class="retry-btn" data-action="onRetry" aria-label="Retry loading Open Banking product catalogue">
      <span class="material-icons" aria-hidden="true">refresh</span>Try again
    </button>

    <div class="obie-note" role="note">
      <strong>Open Banking reference data</strong> is provided unauthenticated by participating banks. No login is required — this page will load once connectivity is restored.
    </div>
  </section>

</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
