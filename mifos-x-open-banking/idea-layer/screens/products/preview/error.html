<!doctype html>
<!-- render-hash: prod-error-01 -->
<html lang="en" data-screen="products" data-state="error" data-feature="products" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Products — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px 100px;text-align:center}
.error-icon{width:96px;height:96px;border-radius:48px;background:var(--error-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.error-icon .material-icons{font-size:var(--icon-2xl);color:var(--error)}
.error-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.error-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;margin-bottom:28px;max-width:320px}
.retry-btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;padding:12px 28px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}.retry-btn .material-icons{font-size:var(--icon-sm)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;position:relative}.nav-item .material-icons{font-size:var(--icon-sm);color:var(--on-surface-variant)}.nav-item .nav-label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons{color:#102000}.nav-item.active .nav-label{color:#102000;font-weight:600}.nav-item.active::before{content:'';position:absolute;top:6px;width:48px;height:28px;background:var(--nav-active);border-radius:14px;z-index:-1}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#CDEDA3}}</style>
</head>
<body><div class="top-bar"><span class="material-icons" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Products</h1></div><main><div class="error-icon"><span class="material-icons">cloud_off</span></div><h2 class="error-title">Couldn't load products</h2><p class="error-msg">We're having trouble reaching the products catalogue. Check your connection and try again.</p><button class="retry-btn" data-action="retry_load_products" tabindex="0" aria-label="Retry"><span class="material-icons">refresh</span>Retry</button></main>
<nav class="bottom-nav" aria-label="Primary"><a class="nav-item" data-nav-to="home" tabindex="0"><span class="material-icons">home</span><span class="nav-label">Home</span></a><a class="nav-item" data-nav-to="accounts" tabindex="0"><span class="material-icons">account_balance</span><span class="nav-label">Accounts</span></a><a class="nav-item" data-nav-to="send-money" tabindex="0"><span class="material-icons">send</span><span class="nav-label">Pay</span></a><a class="nav-item" data-nav-to="cards" tabindex="0"><span class="material-icons">credit_card</span><span class="nav-label">Cards</span></a><a class="nav-item active" data-nav-to="products" tabindex="0"><span class="material-icons">storefront</span><span class="nav-label">More</span></a></nav>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
