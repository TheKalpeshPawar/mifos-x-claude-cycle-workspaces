<!doctype html>
<!-- render-hash: a3f8c2e1d7b4 -->
<html lang="en" data-screen="products" data-state="loading" data-feature="products" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 24px; }
  .top-bar { display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--on-background); }
  .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--on-surface-variant); }
  @keyframes shimmer { 0% { background-position: -360px 0; } 100% { background-position: 360px 0; } }
  .shimmer { background: linear-gradient(90deg, var(--surface-variant) 25%, var(--outline-variant) 50%, var(--surface-variant) 75%); background-size: 720px 100%; animation: shimmer 1.4s infinite linear; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; background: var(--surface-variant); } }
  .sk-selector { display: flex; align-items: center; gap: 10px; margin: 4px 16px 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-soft); box-shadow: var(--shadow-1); }
  .sk-lead { width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; }
  .sk-lines { flex: 1; }
  .sk-line-sm { height: 9px; width: 35%; margin-bottom: 6px; }
  .sk-line-md { height: 13px; width: 55%; }
  .sk-trail { width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; }
  .sk-tabs { display: flex; gap: 4px; margin: 0 16px 14px; padding: 4px; background: var(--surface-variant); border-radius: var(--radius-lg); }
  .sk-tab { flex: 1; height: 32px; border-radius: 16px; }
  .sk-section { height: 11px; width: 45%; margin: 2px 16px 12px; }
  .sk-card { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 16px; margin: 0 16px 12px; padding: 16px; }
  .sk-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .sk-title { height: 15px; width: 60%; }
  .sk-badge { height: 18px; width: 64px; border-radius: 10px; flex-shrink: 0; }
  .sk-desc1 { height: 11px; width: 100%; margin-bottom: 6px; }
  .sk-desc2 { height: 11px; width: 80%; margin-bottom: 14px; }
  .sk-link { height: 12px; width: 84px; }
</style>
</head>
<body>
<main role="main" aria-busy="true" aria-label="Loading products">
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back"><span class="material-icons">arrow_back</span></button>
    <h1 data-component-type="text" data-component-id="products_title">Products</h1>
  </header>

  <div class="sk-selector" data-component-type="card" data-component-id="products_bank_selector" aria-hidden="true">
    <div class="sk-lead shimmer"></div>
    <div class="sk-lines">
      <div class="sk-line-sm shimmer"></div>
      <div class="sk-line-md shimmer"></div>
    </div>
    <div class="sk-trail shimmer"></div>
  </div>

  <div class="sk-tabs" data-component-type="tab_bar" data-component-id="products_scope_tabs" aria-hidden="true">
    <div class="sk-tab shimmer" data-component-type="text" data-component-id="products_tab_personal"></div>
    <div class="sk-tab shimmer" data-component-type="text" data-component-id="products_tab_business"></div>
  </div>

  <div class="sk-section shimmer" aria-hidden="true"></div>

  <div class="sk-card" data-component-type="card" data-component-id="product_card" aria-hidden="true">
    <div class="sk-row">
      <div class="sk-title shimmer"></div>
      <div class="sk-badge shimmer" data-component-type="badge" data-component-id="product_category_badge"></div>
    </div>
    <div class="sk-desc1 shimmer"></div>
    <div class="sk-desc2 shimmer"></div>
    <div class="sk-link shimmer" data-component-type="text" data-component-id="product_more_info"></div>
  </div>

  <div class="sk-card" data-component-type="card" data-component-id="product_card" aria-hidden="true">
    <div class="sk-row">
      <div class="sk-title shimmer" style="width:70%"></div>
      <div class="sk-badge shimmer" data-component-type="badge" data-component-id="product_category_badge"></div>
    </div>
    <div class="sk-desc1 shimmer"></div>
    <div class="sk-desc2 shimmer" style="width:55%"></div>
    <div class="sk-link shimmer" data-component-type="text" data-component-id="product_more_info"></div>
  </div>

  <div class="sk-card" data-component-type="card" data-component-id="product_card" aria-hidden="true">
    <div class="sk-row">
      <div class="sk-title shimmer" style="width:52%"></div>
      <div class="sk-badge shimmer" data-component-type="badge" data-component-id="product_category_badge"></div>
    </div>
    <div class="sk-desc1 shimmer"></div>
    <div class="sk-desc2 shimmer" style="width:75%"></div>
    <div class="sk-link shimmer" data-component-type="text" data-component-id="product_more_info"></div>
  </div>

</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
