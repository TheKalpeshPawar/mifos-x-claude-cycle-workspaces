<!doctype html>
<!-- render-hash: b7d4e9c1f230 -->
<html lang="en" data-screen="products" data-state="empty" data-feature="products" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products — Empty</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #DCE7C8; --on-secondary-container: #1A2A29;
    --error: #BA1A1A; --on-error: #FFFFFF;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px; --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06); --shadow-2: 0 2px 6px rgba(0,0,0,0.10);
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
    --error: #FFB4AB; --on-error: #690005;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B; --on-secondary-container: #BCECE7;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4); --shadow-2: 0 2px 6px rgba(0,0,0,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 24px; }
  .top-bar { display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--on-background); }
  .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--on-surface-variant); }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-variant); outline: none; }
  .state-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 32px 80px; }
  .state-illustration { margin-bottom: 24px; }
  .state-icon-circle { width: 96px; height: 96px; border-radius: 48px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  .state-icon-circle .material-icons { font-size: 44px; color: var(--on-primary-container); }
  .state-title { font-size: 18px; font-weight: 700; color: var(--on-surface); margin-bottom: 8px; }
  .state-message { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; max-width: 268px; margin: 0 auto; }
</style>
</head>
<body>
<main role="main">
  <header class="top-bar" data-shell="top-bar">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back"><span class="material-icons">arrow_back</span></button>
    <h1 data-component-type="text" data-component-id="products_title">Products</h1>
  </header>

  <section class="state-wrap" role="status" aria-live="polite">
    <div class="state-illustration">
      <!-- Inline SVG illustration — open banking product catalogue, no external URLs -->
      <svg width="140" height="120" viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Empty product catalogue illustration" role="img">
        <!-- Document stack representing empty catalogue -->
        <rect x="30" y="28" width="80" height="64" rx="8" fill="var(--surface-variant)" stroke="var(--outline-variant)" stroke-width="1.5"/>
        <rect x="24" y="22" width="80" height="64" rx="8" fill="var(--surface)" stroke="var(--outline-variant)" stroke-width="1.5"/>
        <rect x="18" y="16" width="80" height="64" rx="8" fill="var(--surface)" stroke="var(--outline)" stroke-width="1.5"/>
        <!-- Lines representing product rows — grayed out / empty -->
        <rect x="28" y="30" width="52" height="6" rx="3" fill="var(--surface-variant)"/>
        <rect x="28" y="42" width="42" height="5" rx="2.5" fill="var(--surface-variant)"/>
        <rect x="28" y="53" width="48" height="5" rx="2.5" fill="var(--surface-variant)"/>
        <rect x="28" y="64" width="36" height="5" rx="2.5" fill="var(--surface-variant)"/>
        <!-- "No catalogue" cross overlay -->
        <circle cx="82" cy="64" r="18" fill="var(--background)" stroke="var(--outline-variant)" stroke-width="1"/>
        <line x1="75" y1="57" x2="89" y2="71" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="89" y1="57" x2="75" y2="71" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="state-title" data-component-type="text" data-component-id="products_scope_empty">No products published</div>
    <div class="state-message">The bank has not published a product catalogue yet</div>
  </section>

</main>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
