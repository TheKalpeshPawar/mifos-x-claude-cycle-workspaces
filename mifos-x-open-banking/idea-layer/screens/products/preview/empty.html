<!doctype html>
<html lang="en" data-screen="products" data-state="empty">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Products — Empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
.screen-header{padding:24px 20px 8px;}
.screen-title{font-size:28px;font-weight:700;color:var(--primary);}
.screen-subtitle{font-size:14px;color:var(--outline);margin-top:4px;}
.category-tabs{display:flex;gap:8px;padding:8px 20px 12px;overflow-x:auto;scrollbar-width:none;}
.category-tabs::-webkit-scrollbar{display:none;}
.tab-chip{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--surface-variant);color:var(--outline);white-space:nowrap;cursor:pointer;}
.tab-chip.active{background:var(--primary);color:#FFF;border-color:var(--primary);}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;gap:16px;text-align:center;min-height:calc(844px - 56px - 130px);}
.empty-icon{width:96px;height:96px;background:var(--primary-container);border-radius:48px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.empty-icon .mi{font-size:48px;color:var(--primary);}
h2.empty-title{font-size:20px;font-weight:600;color:var(--text-primary);}
p.empty-msg{font-size:14px;color:var(--outline);line-height:1.5;max-width:280px;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="home">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Products</span>
</header>

<div class="screen-header">
  <div class="screen-title">Products</div>
  <div class="screen-subtitle">Savings, loans, cards and more</div>
</div>

<div class="category-tabs" role="tablist">
  <div class="tab-chip active">All</div>
  <div class="tab-chip">Savings</div>
  <div class="tab-chip">Loans</div>
  <div class="tab-chip">Cards</div>
  <div class="tab-chip">Mortgages</div>
</div>

<main>
  <div class="empty-icon">
    <span class="mi">store</span>
  </div>
  <h2 class="empty-title">No products available</h2>
  <p class="empty-msg">No products match the selected category. Try a different filter or check back later.</p>
</main>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
