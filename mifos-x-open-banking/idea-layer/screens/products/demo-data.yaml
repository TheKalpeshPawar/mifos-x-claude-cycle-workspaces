sibling: demo-data
schema_version: "4.0"
feature_id: products

# UNAUTHENTICATED OBIE Open Data v2.4.0 product reference data (OBOpenDataResponse envelope:
# meta + data[].Brand[].PCA[]/BCA[]). Personal tab -> /personal-current-accounts (PCA),
# Business tab -> /business-current-accounts (BCA). Per-brand HSBC UK products. No token, no consent.
collections:
  opendata_personal_current_accounts:
    dto: OBOpenDataResponse
    description: "200 OK — HSBC UK Personal Current Account (PCA) reference data, OBIE Open Data envelope. Backs the Personal audience tab."
    item:
      meta:
        LastUpdated: "2026-06-01T00:00:00+01:00"
        TotalResults: 3
        Agreement: "Use of the APIs and any related data is subject to the Open Licence at https://www.openbanking.org.uk/open-licence"
        License: "https://www.openbanking.org.uk/open-licence"
        TermsOfUse: "https://www.openbanking.org.uk/terms"
      data:
        - Brand:
            - BrandName: "HSBC UK"
              PCA:
                - Identification: "HSBC-PCA-BANKACCOUNT"
                  ProductName: "HSBC Bank Account"
                  Segment: "regular"
                  OnSaleIndicator: "1"
                  MarketingState:
                    - "Regular"
                  CoreProduct:
                    ProductURL: "https://www.hsbc.co.uk/current-accounts/products/bank-account/"
                    TandCsURL: "https://www.hsbc.co.uk/content/dam/hsbc/gb/pdf/personal-banking-tariff-of-charges.pdf"
                    MonthlyMaximumCharge: "80.00"
                  Overdraft:
                    OverdraftTierBandSet:
                      - TierBandMethod: "WHOL"
                        OverdraftTierBand:
                          - Identification: "1"
                            EAR: "39.90"
                  CreditInterest:
                    TierBandSet:
                      - TierBandMethod: "INBA"
                        TierBand:
                          - Identification: "1"
                            AER: "0.00"
                  OtherFeesCharges:
                    - FeeChargeDetail:
                        - FeeType: "ServiceCMaintenance"
                          FeeAmount: "0.00"
                          FeeRate: "0"
                - Identification: "HSBC-PCA-ADVANCE"
