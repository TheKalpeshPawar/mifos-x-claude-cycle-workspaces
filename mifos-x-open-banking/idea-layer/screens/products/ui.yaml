    note: "Added 4 real OBP products (Instant Access Savings, Fixed Rate Bond, Personal Loan, Platinum Credit Card), Mortgages category tab, application-detail nav target, loading/empty/error states, upgraded API to OBP v5.0.0"
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
