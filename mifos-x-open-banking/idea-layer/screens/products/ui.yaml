  - from: approved
    to: approved
    at: "2026-06-07T23:00:00Z"
    by: "/kmp-implement products"
    contract_version: "1.1.0"
    note: "Implemented as feature/products (new module) over the pre-existing ProductsApi/Repository/Store. Endpoint verified LIVE: GET v3.0.0/banks/{bank}/products returns 12 real sandbox products (Acme Current/Savings/Student, App2 Premium Saver, plus generic CURRENT/SAVINGS/CREDIT_CARD/DEBIT/LOAN/FIXED_DEPOSIT/WALLET/BUSINESS). Model fix: the Product model mapped a non-existent label field — the API returns name (display name was silently blank); corrected. Deviations from spec: (1) the API's category/family fields are null on the sandbox, so category tabs are derived client-side from code/name keywords — tabs are All/Everyday/Savings/Cards/Loans (no Mortgages tab: no mortgage product exists, LOAN bucket covers it); (2) the spec's enriched showcase products (Fixed Rate Bond, Platinum Credit Card, rates/fees rows) don't exist server-side — real catalogue data wins; (3) NO apply journey — account-application endpoints are unverified and the application flow is FO-side/unbuilt, so cards link out to the product's more_info_url in the platform browser instead (real URLs exist for the Acme products). Entry: home Banking Services grid Products tile (Category icon) — took the Pay Bill slot, which was removed entirely per user directive (Pay Bill had no planned feature). 6 VM tests incl. live-shape categorisation."
  - from: approved
    to: approved
    at: "2026-06-07T23:45:00Z"
    by: "per-bank rework (user directive)"
    contract_version: "1.1.0"
    note: "Catalogue is now PER BANK with a Personal / Business audience split (user directive). Bank selector chips list every bank the user holds an account at (3 on the sandbox: Acme/ac.bank.uk, Mifos Open Bank/mifos-x-openbank, Neon/neon.bank.eu — names resolved via the bank directory); all catalogues fetch in parallel once per session. Below the chips a two-tab row splits each bank's products into Personal and Business — audience derived from code/name keywords (BUSINESS, CORPORATE, WORKING-CAPITAL, FREELANCER, FX-SPOT → Business) since the API's category field is null. Bank-specific business products verified live: Mifos Business Current GBP, Working Capital Facility, FX Spot GBP/EUR; Neon Freelancer Account. Category filter chips dropped in favour of the audience tabs; the category remains as a badge on each card. Per-bank failure degrades to an inline retry for that bank only. ProductsRepository gained listProducts(bankId). 8 VM tests."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    quality_score: 95
    note: "MAJOR source-drift reconciliation against shipped feature/products (ProductsScreen.kt + ProductsViewModel.kt + ProductsModule.kt + ProductsTestTags.kt + core ProductsRepository.kt + ProductsApi.kt). Shipped = a PER-BANK catalogue: BankSelector pill (Surface) → shared PickerBottomSheet bank picker; Personal/Business audience TabRow (ProductScope enum, BUSINESS_MARKERS keyword split); parallel per-bank fetch (awaitAll) with per-bank failure degradation (bankLoadFailed → inline 'Could not load this bank's products' + Retry); ProductCard built from LIVE OBP Product (code/name/description/category-derived-badge/moreInfoUrl); 'More info' → LocalUriHandler.openUri opens the product's more_info_url in the platform browser. REMOVED never-built components: the 5 category filter chips (tab_all/savings/loans/cards/mortgages) — replaced by the Personal/Business audience tabs, category survives only as a per-card badge; ALL 4 hardcoded showcase products (Instant Access Savings / Fixed Rate Bond / Personal Loan / Platinum Credit Card) + their rate text + feature chips + Details/Apply Now buttons — there is NO apply journey, cards link out to more_info_url; promotions_banner + promo text; products_subtitle; bottom nav (Products is a pushed non-tab destination owning its own top bar). state_model rewritten to shipped contract: ProductsContent{banks, selectedBankId, scope:ProductScope, products:List<ProductRow>, bankLoadFailed}; ProductRow{code,name,description,scope,category:ProductCategory,moreInfoUrl}; ProductCategory={EVERYDAY,SAVINGS,CARDS,LOANS} (NOT MORTGAGES — no mortgage product exists) + separate ProductScope{PERSONAL,BUSINESS}; events = onRetry/onBankSelected/onScopeSelected; DI = ProductsRepository, AccountsRepository, BanksRepository. ScreenState adds NoNetwork/Unauthenticated. api: corrected to the SHIPPED endpoint GET /obp/v3.0.0/banks/{bankId}/products (was wrongly v5.0.0 in spec); category/family are null on sandbox → both audience split and badge derived client-side from code/name (scopeOf/categoryOf); search_products NOT wired → top-bar search action removed."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."
# Pushed (non-tab) destination — owns its own transparent top bar with a back arrow only.
# No search action: search_products was never wired (verified shipped 2026-06-11). No bottom nav.
top_app_bar:
  show: true
  title: "Products"
  navigation_icon: arrow_back
  navigation_action: navigate_back
  actions: []
bottom_nav: false

screens:
  - id: products
    name: Products
    viewmodel: ProductsViewModel
    archetype: index_list
    route: /products
    scroll: vertical
    states_handled: [loading, content, empty, error, no_network, unauthenticated]

archetype: index_list

components:
  # Page title — lives in the top app bar (TopAppBar title); tagged products_title.
  - type: text
    id: products_title
    label: "Products"
    content: "Products"
    style:
      typography: "Outfit/title_large"
      color: "#1A1C16"
      font_weight: semibold
    a11y:
      label: "Products"
      role: heading
    test_context:
      tag: products_title
      assert_text: "Products"

  # Bank selector pill (BankSelector — a Surface, always shown even for a single bank).
  # Tapping opens the shared PickerBottomSheet bank picker (onBankSelected). Shows the
  # selected bank's resolved name + a dropdown chevron.
  - type: card
    id: products_bank_selector
    label: "Bank selector"
    content: "Bank selector"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: "#F0F1E5"
      border_radius: 12
      border_color: "#C5C8BA"
      border_width: 1
      leading_icon: account_balance
      trailing_icon: keyboard_arrow_down
      padding_horizontal: 12
      padding_vertical: 10
      margin_horizontal: 16
      margin_bottom: 10
    on_click:
      action: onBankSelected
      target: ""
    a11y:
      label: "Selected bank. Tap to choose a different bank's product catalogue."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: products_bank_selector
      purpose: "Bank selector pill — opens the shared picker bottom sheet to switch which bank's catalogue is shown"
      interaction_type: action
      data_driven: true
      required_fields: [banks, selectedBankId]

  # Audience tab row (TabRow over ProductScope) — Personal | Business. Replaces the old
  # category filter chips; audience is derived client-side (scopeOf / BUSINESS_MARKERS).
  - type: tab_bar
    id: products_scope_tabs
    label: "Product audience tabs"
    style:
      orientation: horizontal
      background: "#FEFCF4"
    on_click:
      action: onScopeSelected
      target: ""
    a11y:
      label: "Filter products by audience: Personal or Business"
      role: tablist
    test_context:
      tag: products_scope_tabs

  - type: text
    id: products_tab_personal
    label: "Personal"
    content: "Personal"
    style:
      typography: "Outfit/label_large"
      color: "#4C662B"
    on_click:
      action: onScopeSelected
      target: PERSONAL
    a11y:
      label: "Show personal products"
      role: tab
      selected: true
    keyboard:
      focusable: true
    test_context:
      tag: products_tab_personal
      assert_text: "Personal"

  - type: text
    id: products_tab_business
    label: "Business"
    content: "Business"
    style:
      typography: "Outfit/label_large"
      color: "#44483D"
    on_click:
      action: onScopeSelected
      target: BUSINESS
    a11y:
      label: "Show business products"
      role: tab
      selected: false
    keyboard:
      focusable: true
    test_context:
      tag: products_tab_business
      assert_text: "Business"

  # Product card (ProductCard) — repeated per row in content.products (live OBP Product).
  # Name + category badge, optional description, and a "More info" affordance that opens
  # the product's more_info_url in the platform browser (LocalUriHandler.openUri). The card
  # is disabled (non-clickable) when moreInfoUrl is blank. There is NO Apply / Details path.
  - type: card
    id: product_card
    label: "Product"
    content: "Product"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#F0F1E5"
      border_radius: 16
      border_color: "#C5C8BA"
      border_width: 1
      elevation: 0
      padding: 16
      margin_horizontal: 16
      margin_bottom: 12
    on_click:
      action: open_url
      target: more_info_url
    a11y:
      label: "Product. Tap to open more info in your browser when available."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: product_card
      purpose: "One catalogue product (ProductCard) — name, category badge, description; opens more_info_url in the browser when present"
      interaction_type: action
      data_driven: true
      required_fields: [code, name, description, category, moreInfoUrl]

  - type: badge
    id: product_category_badge
    label: "Category"
    content: "Category"
    style:
      background: "#CDEDA3"
      border_radius: 10
      padding_horizontal: 8
      padding_vertical: 3
      text_color: "#4C662B"
      typography: "Outfit/label_small"
    a11y:
      label: "Product category"
      role: text
    test_context:
      tag: product_category_badge
      purpose: "Per-card category badge — Everyday / Savings / Cards / Loans (derived client-side via categoryOf)"
      interaction_type: display
      data_driven: true
      required_fields: [category]

  - type: text
    id: product_more_info
    label: "More info"
    content: "More info"
    style:
      typography: "Outfit/label_medium"
      color: "#4C662B"
      font_weight: semibold
      trailing_icon: open_in_new
    on_click:
      action: open_url
      target: more_info_url
    a11y:
      label: "Open product details in the browser"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: product_more_info
      assert_text: "More info"

  # Per-bank failure row — shown inline when the selected bank's catalogue failed to load
  # (bankLoadFailed); offers a Retry that re-fetches all banks (onRetry).
  - type: text
    id: products_bank_load_failed
    label: "Could not load this bank's products"
    content: "Could not load this bank's products"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      text_align: center
      padding: 24
    a11y:
      label: "This bank's product catalogue could not be loaded"
      role: text
    test_context:
      tag: products_bank_load_failed
      assert_text: "Could not load this bank's products"

  # In-scope empty row — selected bank has no products for the chosen audience tab.
  - type: text
    id: products_scope_empty
    label: "No products at this bank yet"
    content: "No products at this bank yet"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      text_align: center
      padding: 24
    a11y:
      label: "No products for the selected audience at this bank"
      role: text
    test_context:
      tag: products_scope_empty

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  # Shipped state set = ScreenState<ProductsContent>: Loading / Content / Empty / Error /
  # NoNetwork / Unauthenticated. Within Content, per-bank-load failure (bankLoadFailed) and
  # in-scope emptiness render inline rows rather than separate ScreenStates.
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components: []
      show_loading_icon: true
  content:
    layout:
      visible_components:
        - products_title
        - products_bank_selector
        - products_scope_tabs
        - products_tab_personal
        - products_tab_business
        - product_card
        - product_category_badge
        - product_more_info
        - products_bank_load_failed
        - products_scope_empty
  empty:
    layout:
      visible_components:
        - products_title
      show_empty_state: true
      empty_state_icon: inventory_2
      empty_state_title: "No products published"
      empty_state_message: "The bank has not published a product catalogue yet"
  error:
    layout:
      visible_components:
        - products_title
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load products"
      error_message: "Check your connection and try again"
      show_retry_button: true
  no_network:
    layout:
      visible_components:
        - products_title
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load products"
      error_message: "Check your connection and try again"
      show_retry_button: true
  unauthenticated:
    layout:
      visible_components:
        - products_title
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load products"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: ProductsViewModel
  screen_state: "ScreenState<ProductsContent>"
  content_type: ProductsContent
  content_fields:
    - name: banks
      type: List<ProductBank>
      default: "emptyList()"
    - name: selectedBankId
      type: String
      default: ""
    - name: scope
      type: ProductScope
      default: ProductScope.PERSONAL
    - name: products
      type: List<ProductRow>
      default: "emptyList()"
    - name: bankLoadFailed
      type: Boolean
      default: "false"
  enums:
    - name: ProductScope
      values: [PERSONAL, BUSINESS]
      note: "Audience split; derived client-side from code/name keywords (BUSINESS_MARKERS / scopeOf)."
    - name: ProductCategory
      values: [EVERYDAY, SAVINGS, CARDS, LOANS]
      note: "Per-card badge; derived client-side via categoryOf (API category is null on the sandbox). NO MORTGAGES bucket — no mortgage product exists; LOANS covers it."
  row_type:
    name: ProductRow
    fields:
      - name: code
        type: String
      - name: name
        type: String
      - name: description
        type: String
      - name: scope
        type: ProductScope
      - name: category
        type: ProductCategory
      - name: moreInfoUrl
        type: String
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load products. Please try again."
  events:
    - onRetry
    - onBankSelected
    - onScopeSelected
  actions:
    - onBankSelected
    - onScopeSelected
    - open_url
  states_handled: [loading, content, empty, error, no_network, unauthenticated]
  di:
    - ProductsRepository
    - AccountsRepository
    - BanksRepository

api:
  # SHIPPED endpoint — ProductsApi @GET("v3.0.0/banks/{bankId}/products"); fetched once per
  # bank in parallel (awaitAll) at load. category/family are null on the sandbox, so the
  # audience split (scopeOf) and the badge (categoryOf) are both derived client-side from
  # code + name. The earlier spec's v5.0.0 + category enum did NOT ship (corrected 2026-06-11).
  - id: obp_products
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/products"
    tag: Product
    description: "List a bank's published products. Per-bank, fetched in parallel once per session."
    trigger: "on load (per bank the user holds an account at) / onRetry — ProductsRepository.listProducts(bankId)"
    response:
      wrapper: products
      dto: Product
      fields:
        - name: products
          type: "List<Product>"
        - name: code
          type: String
        - name: name
          type: String
        - name: description
          type: String
        - name: category
          type: String
        - name: family
          type: String
        - name: super_family
          type: String
        - name: more_info_url
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "BANK_NOT_FOUND"
  # Account list source — AccountsRepository.myAccounts(); the set of banks the user holds an
  # account at IS the set of catalogues offered. Resolved to display names via BanksRepository.
  - id: obp_get_my_accounts
    endpoint: "GET /obp/v3.0.0/my/accounts"
    tag: Account
    description: "The user's accounts; the distinct bankIds drive which bank catalogues are shown."
    trigger: "on load — AccountsRepository.myAccounts"
    response:
      fields:
        - name: accounts
          type: List<Account>
        - name: bank_id
          type: String
  # DEFERRED — product search never shipped. No search_products UI path exists on this screen.
  - id: search_products
    deferred: true
    deferred_reason: "Product search was never wired — the top-bar search action was removed. No search endpoint is called by this screen (verified shipped 2026-06-11)."

dependencies:
  tier: feature
  features:
    - accounts

navigation:
  - action: open_url
    target: more_info_url
    description: "Open the product's more_info_url in the platform browser (LocalUriHandler.openUri) — the only outbound affordance; there is NO in-app apply/details journey."
  - action: onBankSelected
    target: ""
    description: "Switch which bank's catalogue is shown via the picker bottom sheet."
  - action: onScopeSelected
    target: ""
    description: "Switch the audience tab (Personal / Business)."
  - action: navigate_back
    target: ""
    description: "Return to the previous screen via the top-bar back arrow."
