  empty:
    layout:
      visible_components:
        - products_title
        - products_subtitle
        - category_tabs_row
        - tab_all
        - tab_savings
        - tab_loans
        - tab_cards
        - tab_mortgages
      show_empty_state: true
      empty_state_icon: store_outlined
      empty_state_title: "No products available"
      empty_state_message: "No products match the selected category. Try a different filter or check back later."

  error:
    layout:
      visible_components:
        - products_title
        - products_subtitle
        - category_tabs_row
        - tab_all
        - tab_savings
        - tab_loans
        - tab_cards
        - tab_mortgages
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load products"
      error_message: "Check your connection and try again. Your saved favourites are still available offline."
      show_retry_button: true

state_model:
  view_model: ProductsViewModel
  state_fields:
    - name: products
      type: "List<BankProduct>"
      default: "emptyList()"
    - name: selectedCategory
      type: ProductCategory
      default: ProductCategory.ALL
    - name: uiState
      type: ProductsUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load products. Please try again."
    - field: global
      code: NETWORK_TIMEOUT
      message: "Connection timed out. Check your internet connection."
  events:
    - "ProductsLoaded(products: List<BankProduct>)"
    - "CategoryFilterChanged(category: ProductCategory)"
    - "ApplyNowClicked(productCode: String)"
    - "ProductDetailClicked(productCode: String)"
    - RetryLoad
    - SearchOpened
  actions:
    - filter_products
    - search_products
    - navigate_to_application_detail
  di:
    - ProductRepository
    - BankRepository

api:
  - id: obp_products
    endpoint: "GET /obp/v5.0.0/banks/{bankId}/products"
    tag: Product
    description: "List available banking products from OBP v5.0.0"
    response:
      fields:
        - name: products
          type: "List<Product>"
        - name: code
          type: String
        - name: name
          type: String
        - name: category
          type: String
          enum: [SAVINGS, LOANS, CARDS, MORTGAGES, CURRENT]
        - name: family
          type: String
        - name: super_family
          type: String
        - name: more_info_url
          type: String
        - name: details
          type: ProductDetails
        - name: meta
          type: ProductMeta
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "BANK_NOT_FOUND"
      - code: 503
        message: "SERVICE_UNAVAILABLE"

dependencies:
  tier: feature
  features:
    - application-detail
    - home
    - accounts
    - send-money

navigation:
  - action: navigate
    target: application-detail
    description: "Navigate to application detail screen for selected product (Apply Now / Details)"
  - action: navigate
    target: home
    description: "Navigate to home screen via bottom nav or promotional banner"
  - action: navigate
    target: accounts
    description: "Navigate to accounts screen via bottom nav"
  - action: navigate
    target: send-money
    description: "Navigate to send money screen via bottom nav"
  - action: filter_products
    target: ""
    description: "Filter products list by category (All / Savings / Loans / Cards / Mortgages)"
  - action: search_products
    target: ""
    description: "Open product search overlay"
  - action: navigate_back
    target: home
    description: "Return to home via top bar back arrow"
