states:
  loading:
    layout:
      visible_components:
        - products_title
        - category_tabs_row
        - tab_all
        - tab_current
        - tab_savings
        - tab_loans
        - tab_cards
      show_skeleton_list: true
      skeleton_count: 3
  content:
    layout:
      visible_components:
        - products_title
        - category_tabs_row
        - tab_all
        - tab_current
        - tab_savings
        - tab_loans
        - tab_cards
        - product_current_plus
        - current_plus_name
        - current_plus_description
        - current_plus_features
        - current_plus_feat_no_fee
        - current_plus_feat_transfers
        - current_plus_actions
        - current_plus_learn_more
        - current_plus_apply
        - product_savings_flex
        - savings_flex_name
        - savings_flex_description
        - savings_flex_features
        - savings_flex_feat_aer
        - savings_flex_feat_access
        - savings_flex_actions
        - savings_flex_learn_more
        - savings_flex_apply
        - product_personal_loan
        - personal_loan_name
        - personal_loan_description
        - personal_loan_features
        - personal_loan_feat_apr
        - personal_loan_feat_amount
        - personal_loan_actions
        - personal_loan_learn_more
        - personal_loan_apply
        - bottom_spacer
  empty:
    layout:
      visible_components:
        - products_title
        - category_tabs_row
        - tab_all
        - tab_current
        - tab_savings
        - tab_loans
        - tab_cards
      show_empty_state: true
      empty_state_icon: store_outlined
      empty_state_title: "No products available"
      empty_state_message: "No products match the selected category. Try a different filter."
  error:
    layout:
      visible_components:
        - products_title
        - category_tabs_row
        - tab_all
        - tab_current
        - tab_savings
        - tab_loans
        - tab_cards
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load products"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: ProductsViewModel
  state_fields:
    - name: products
      type: "List<BankProduct>"
      default: "emptyList()"
    - name: selectedCategory
      type: ProductCategory
      default: ProductCategory.ALL
    - name: expandedProductCode
      type: "String?"
      default: "null"
    - name: uiState
      type: ProductsUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load products. Please try again."
  events:
    - ProductsLoaded
    - CategoryFilterChanged(category: ProductCategory)
    - ProductDetailExpanded(productCode: String)
    - ApplyClicked(productCode: String)
    - LearnMoreClicked(productCode: String)
    - RetryLoad
  actions:
    - filter_products
    - expand_product_detail
    - search_products
    - navigate_to_applications
  di:
    - ProductRepository
    - BankRepository

api:
  - id: obp_products
    endpoint: "GET /obp/v3.1.0/banks/{bankId}/products"
    tag: Product
    description: "List available banking products"
    response:
      fields:
        - name: products
          type: "List<Product>"
        - name: code
          type: String
        - name: name
          type: String
        - name: category
          type: String
        - name: family
          type: String
        - name: super_family
          type: String
        - name: more_info_url
          type: String
        - name: details
          type: ProductDetails
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "BANK_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - account-applications

navigation:
  - action: navigate
    target: account-applications
    description: "Navigate to account application form for selected product"
  - action: expand_product_detail
    target: ""
    description: "Expand product details inline"
  - action: navigate_back
    target: home
    description: "Return to home screen"
