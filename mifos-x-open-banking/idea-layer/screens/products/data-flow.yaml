sibling: data-flow
schema_version: "4.0"
feature_id: products
entries:
  - screen_id: products
    trigger: on_mount
    endpoints:
      - obp_products
    direction: read
    dtos:
      - name: Product
        role: response
        api_id: obp_products
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 500
        behavior: error_state
