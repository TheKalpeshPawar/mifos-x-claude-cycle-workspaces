<!doctype html>
<!-- render-hash: e3c1a9b7f5d2 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorisation Callback — Awaiting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --primary: #266489;
      --on-primary: #FFFFFF;
      --primary-container: #C9E6FF;
      --on-primary-container: #004B6F;
      --secondary: #50606E;
      --on-secondary: #FFFFFF;
      --secondary-container: #D3E5F5;
      --on-secondary-container: #384956;
      --tertiary: #64597B;
      --on-tertiary: #FFFFFF;
      --tertiary-container: #EADDFF;
      --on-tertiary-container: #4C4162;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --error-container: #FFDAD6;
      --on-error-container: #93000A;
      --background: #F7F9FF;
      --on-background: #181C20;
      --surface: #F7F9FF;
      --on-surface: #181C20;
      --surface-variant: #DDE3EA;
      --on-surface-variant: #41474D;
      --outline: #72787E;
      --outline-variant: #C1C7CE;
      --scrim: #000000;
      --inverse-surface: #2D3135;
      --inverse-on-surface: #EEF1F6;
      --inverse-primary: #95CDF7;
      --surface-dim: #D7DADF;
      --surface-bright: #F7F9FF;
      --surface-container-lowest: #FFFFFF;
      --surface-container-low: #F1F4F9;
      --surface-container: #EBEEF3;
      --surface-container-high: #E5E8ED;
      --surface-container-highest: #E0E3E8;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-base: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-xxl: 48px;

      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-large: 16px;
      --radius-extra-large: 28px;
      --radius-full: 9999px;

      --font-brand: 'Roboto', sans-serif;

      --type-title-medium-size: 16px;
      --type-title-medium-line: 24px;
      --type-title-medium-weight: 500;
      --type-body-medium-size: 14px;
      --type-body-medium-line: 20px;
      --type-body-medium-weight: 400;
      --type-label-large-size: 14px;
      --type-label-large-line: 20px;
      --type-label-large-weight: 500;

      --motion-short: 150ms;
      --motion-medium: 300ms;
      --motion-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    [data-theme="dark"] {
      --primary: #95CDF7;
      --on-primary: #00344E;
      --primary-container: #004B6F;
      --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9;
      --on-secondary: #22323F;
      --secondary-container: #384956;
      --on-secondary-container: #D3E5F5;
      --tertiary: #CFC0E8;
      --on-tertiary: #352B4B;
      --tertiary-container: #4C4162;
      --on-tertiary-container: #EADDFF;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --on-error-container: #FFDAD6;
      --background: #101417;
      --on-background: #E0E3E8;
      --surface: #101417;
      --on-surface: #E0E3E8;
      --surface-variant: #41474D;
      --on-surface-variant: #C1C7CE;
      --outline: #8B9198;
      --outline-variant: #41474D;
      --scrim: #000000;
      --inverse-surface: #E0E3E8;
      --inverse-on-surface: #2D3135;
      --inverse-primary: #266489;
      --surface-dim: #101417;
      --surface-bright: #363A3E;
      --surface-container-lowest: #0B0F12;
      --surface-container-low: #181C20;
      --surface-container: #1C2024;
      --surface-container-high: #262A2E;
      --surface-container-highest: #313539;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-brand);
      background-color: var(--background);
      color: var(--on-background);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen scaffold — no chrome ── */
    [data-screen="consent-callback"][data-state="empty"] {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background-color: var(--background);
    }

    /* ── Awaiting empty_state — centred column ── */
    .awaiting-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--spacing-xl);
      text-align: center;
      min-height: 100dvh;
      gap: 0;
    }

    /* ── hourglass_empty icon, 48 px, on-surface-variant tint ── */
    .state-icon {
      font-family: 'Material Symbols Outlined';
      font-size: 48px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
      color: var(--on-surface-variant);
      line-height: 1;
      user-select: none;
    }

    /* Subtle sway animation on the hourglass to hint at waiting */
    .state-icon--awaiting {
      animation: sway 2s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(8deg); }
      75%       { transform: rotate(-8deg); }
    }

    .spacer-lg { height: var(--spacing-lg); }
    .spacer-sm { height: var(--spacing-sm); }
    .spacer-xl { height: var(--spacing-xl); }

    /* ── Typography ── */
    .text-title-medium {
      font-size: var(--type-title-medium-size);
      line-height: var(--type-title-medium-line);
      font-weight: var(--type-title-medium-weight);
      color: var(--on-surface);
      letter-spacing: 0.15px;
    }

    .text-body-medium {
      font-size: var(--type-body-medium-size);
      line-height: var(--type-body-medium-line);
      font-weight: var(--type-body-medium-weight);
      color: var(--on-surface-variant);
      letter-spacing: 0.25px;
      max-width: 280px;
    }

    /* ── Filled button (M3) ── */
    .btn-filled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 var(--spacing-lg);
      background-color: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-brand);
      font-size: var(--type-label-large-size);
      line-height: var(--type-label-large-line);
      font-weight: var(--type-label-large-weight);
      letter-spacing: 0.1px;
      cursor: pointer;
      min-width: 48px;
      min-height: 48px;
      text-decoration: none;
      transition: box-shadow var(--motion-short) var(--motion-emphasis),
                  background-color var(--motion-short) var(--motion-emphasis);
      position: relative;
      overflow: hidden;
      outline-offset: 2px;
    }

    .btn-filled::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--on-primary);
      opacity: 0;
      transition: opacity var(--motion-short) var(--motion-emphasis);
      border-radius: inherit;
    }

    .btn-filled:hover::before  { opacity: 0.08; }
    .btn-filled:active::before { opacity: 0.12; }

    .btn-filled:focus-visible {
      outline: 3px solid var(--primary);
    }
  </style>
</head>
<body>
  <main
    data-screen="consent-callback"
    data-state="empty"
    aria-label="Waiting for HSBC to confirm authorisation"
    aria-live="polite"
  >
    <section
      class="awaiting-state"
      aria-label="Waiting for HSBC to confirm authorisation"
      data-component-type="empty_state"
      data-component-id="awaiting_state"
    >
      <!-- hourglass_empty icon -->
      <span
        class="state-icon state-icon--awaiting"
        role="img"
        aria-hidden="true"
        data-component-type="icon"
        data-component-id="awaiting_icon"
      >hourglass_empty</span>

      <div class="spacer-lg" aria-hidden="true"></div>

      <!-- Title -->
      <h1
        class="text-title-medium"
        data-component-type="text"
        data-component-id="awaiting_title"
      >Waiting for HSBC to confirm</h1>

      <div class="spacer-sm" aria-hidden="true"></div>

      <!-- Body -->
      <p
        class="text-body-medium"
        data-component-type="text"
        data-component-id="awaiting_body"
      >HSBC has not yet updated the consent status. Please wait a moment or try again.</p>

      <div class="spacer-xl" aria-hidden="true"></div>

      <!-- Filled button — re-poll action -->
      <button
        class="btn-filled"
        type="button"
        aria-label="Check consent status again"
        data-action="poll_consent_status"
        data-component-type="button"
        data-component-id="poll_again_button"
        data-component-variant="filled"
      >Check again</button>
    </section>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
