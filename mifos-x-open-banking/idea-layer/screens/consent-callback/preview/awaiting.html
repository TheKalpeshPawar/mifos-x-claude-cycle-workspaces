<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting — awaiting</title><style>
:root{--p:#266489;--s:#F7F9FF;--o:#181C20;--ov:#41474D;--rf:9999px}
@media(prefers-color-scheme:dark){:root{--p:#95CDF7;--s:#101417;--o:#E0E3E8;--ov:#C1C7CE}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s);color:var(--o);font:16px/1.5 Roboto,sans-serif;display:flex;justify-content:center}
.d{width:393px;min-height:852px;display:flex;flex-direction:column;padding:0 24px}
.sb{height:54px}.ab{height:56px;display:flex;align-items:center}.t{font-size:22px}
.b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.sp{width:48px;height:48px;border-radius:var(--rf);border:4px solid color-mix(in srgb,var(--p) 24%,transparent);
border-top-color:var(--p);animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
.dt{font-size:14px;color:var(--ov)}.bt{height:34px}</style></head>
<body><div class="d" data-screen="consent-callback" data-state="awaiting">
<div class="sb"></div><div class="ab"><div class="t">Connecting</div></div>
<div class="b"><div class="sp" role="progressbar" aria-label="Finishing up"></div>
<!--
  Code -> PSU token exchange, then the consent-status poll.
  ASYMMETRY WITH payment-consent: here the poll is BEST-EFFORT — a successful token exchange
  already proves authorisation. In the PISP screen it is MANDATORY, because submitting against
  a consent that is not Authorised returns 400 U009. Do not unify the two.
  ORDER MATTERS: saveConsentMeta runs BEFORE the tokens are persisted. Persisting flips
  ConsentSession.isActive() and the root navigator routes to Home, tearing this screen down;
  recording afterwards would be cancelled mid-write.
  The indicator must NOT restart between loading and awaiting — a two-stage flow that
  restarts reads as two failed attempts.
-->
<div class="dt">Finishing up…</div></div>
<div class="bt"></div></div></body></html>
