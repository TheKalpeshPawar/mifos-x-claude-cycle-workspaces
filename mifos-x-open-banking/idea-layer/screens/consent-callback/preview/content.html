<!doctype html>
<!-- render-hash: 9a7b5f2c1e4d -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorisation Callback — Connected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --primary: #266489;
      --on-primary: #FFFFFF;
      --primary-container: #C9E6FF;
      --on-primary-container: #004B6F;
      --secondary: #50606E;
      --on-secondary: #FFFFFF;
      --secondary-container: #D3E5F5;
      --on-secondary-container: #384956;
      --tertiary: #64597B;
      --on-tertiary: #FFFFFF;
      --tertiary-container: #EADDFF;
      --on-tertiary-container: #4C4162;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --error-container: #FFDAD6;
      --on-error-container: #93000A;
      --background: #F7F9FF;
      --on-background: #181C20;
      --surface: #F7F9FF;
      --on-surface: #181C20;
      --surface-variant: #DDE3EA;
      --on-surface-variant: #41474D;
      --outline: #72787E;
      --outline-variant: #C1C7CE;
      --scrim: #000000;
      --inverse-surface: #2D3135;
      --inverse-on-surface: #EEF1F6;
      --inverse-primary: #95CDF7;
      --surface-dim: #D7DADF;
      --surface-bright: #F7F9FF;
      --surface-container-lowest: #FFFFFF;
      --surface-container-low: #F1F4F9;
      --surface-container: #EBEEF3;
      --surface-container-high: #E5E8ED;
      --surface-container-highest: #E0E3E8;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-base: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-xxl: 48px;

      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-large: 16px;
      --radius-extra-large: 28px;
      --radius-full: 9999px;

      --font-brand: 'Roboto', sans-serif;

      --type-headline-small-size: 24px;
      --type-headline-small-line: 32px;
      --type-headline-small-weight: 400;
      --type-body-medium-size: 14px;
      --type-body-medium-line: 20px;
      --type-body-medium-weight: 400;

      --motion-short: 150ms;
      --motion-medium: 300ms;
      --motion-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    [data-theme="dark"] {
      --primary: #95CDF7;
      --on-primary: #00344E;
      --primary-container: #004B6F;
      --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9;
      --on-secondary: #22323F;
      --secondary-container: #384956;
      --on-secondary-container: #D3E5F5;
      --tertiary: #CFC0E8;
      --on-tertiary: #352B4B;
      --tertiary-container: #4C4162;
      --on-tertiary-container: #EADDFF;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --on-error-container: #FFDAD6;
      --background: #101417;
      --on-background: #E0E3E8;
      --surface: #101417;
      --on-surface: #E0E3E8;
      --surface-variant: #41474D;
      --on-surface-variant: #C1C7CE;
      --outline: #8B9198;
      --outline-variant: #41474D;
      --scrim: #000000;
      --inverse-surface: #E0E3E8;
      --inverse-on-surface: #2D3135;
      --inverse-primary: #266489;
      --surface-dim: #101417;
      --surface-bright: #363A3E;
      --surface-container-lowest: #0B0F12;
      --surface-container-low: #181C20;
      --surface-container: #1C2024;
      --surface-container-high: #262A2E;
      --surface-container-highest: #313539;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-brand);
      background-color: var(--background);
      color: var(--on-background);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen scaffold — no app bar, no bottom nav ── */
    [data-screen="consent-callback"][data-state="content"] {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background-color: var(--background);
    }

    /* ── Success layout — centred vertical stack ── */
    .success-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--spacing-xl);
      text-align: center;
      min-height: 100dvh;
    }

    /* ── Success icon: check_circle, 64 × 64, primary tint ── */
    .success-icon {
      font-family: 'Material Symbols Outlined';
      font-size: 64px;
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
      color: var(--primary);
      line-height: 1;
      user-select: none;
      /* subtle scale-in entrance */
      animation: icon-in var(--motion-medium) var(--motion-emphasis) both;
    }

    @keyframes icon-in {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .spacer-lg { height: var(--spacing-lg); }
    .spacer-sm { height: var(--spacing-sm); }

    /* ── Typography ── */
    .text-headline-small {
      font-size: var(--type-headline-small-size);
      line-height: var(--type-headline-small-line);
      font-weight: var(--type-headline-small-weight);
      color: var(--on-surface);
      letter-spacing: 0;
    }

    .text-body-medium {
      font-size: var(--type-body-medium-size);
      line-height: var(--type-body-medium-line);
      font-weight: var(--type-body-medium-weight);
      color: var(--on-surface-variant);
      letter-spacing: 0.25px;
      max-width: 280px;
    }

    /* ── Auto-navigate progress bar (visual cue for 1.5 s countdown) ── */
    .auto-nav-progress {
      margin-top: var(--spacing-xl);
      width: 160px;
      height: 2px;
      background-color: var(--surface-container-high);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .auto-nav-progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      border-radius: var(--radius-full);
      animation: fill-progress 1.5s linear forwards;
    }

    @keyframes fill-progress {
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <main
    data-screen="consent-callback"
    data-state="content"
    aria-label="HSBC authorisation successful"
    aria-live="polite"
  >
    <section
      class="success-layout"
      data-component-type="stack"
      data-component-id="success_layout"
      data-component-variant="vertical"
    >
      <!-- check_circle icon, 64 px, primary tint -->
      <span
        class="success-icon"
        role="img"
        aria-label="HSBC authorisation successful"
        data-component-type="icon"
        data-component-id="success_icon"
        data-component-variant="filled"
      >check_circle</span>

      <div class="spacer-lg" aria-hidden="true"></div>

      <!-- Headline -->
      <h1
        class="text-headline-small"
        data-component-type="text"
        data-component-id="success_headline"
      >Connected to HSBC</h1>

      <div class="spacer-sm" aria-hidden="true"></div>

      <!-- Supporting body -->
      <p
        class="text-body-medium"
        data-component-type="text"
        data-component-id="success_body"
      >Your account data is ready. Taking you to your accounts now.</p>

      <!-- Auto-navigate countdown indicator -->
      <div
        class="auto-nav-progress"
        role="progressbar"
        aria-label="Navigating to accounts"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-live="off"
      >
        <div class="auto-nav-progress-fill" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
