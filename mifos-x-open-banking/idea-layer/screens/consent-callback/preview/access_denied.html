<!doctype html>
<!-- render-hash: f6a2c8e1d4b9 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorisation Callback — Access Not Shared</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --primary: #266489;
      --on-primary: #FFFFFF;
      --primary-container: #C9E6FF;
      --on-primary-container: #004B6F;
      --secondary: #50606E;
      --on-secondary: #FFFFFF;
      --secondary-container: #D3E5F5;
      --on-secondary-container: #384956;
      --tertiary: #64597B;
      --on-tertiary: #FFFFFF;
      --tertiary-container: #EADDFF;
      --on-tertiary-container: #4C4162;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --error-container: #FFDAD6;
      --on-error-container: #93000A;
      --background: #F7F9FF;
      --on-background: #181C20;
      --surface: #F7F9FF;
      --on-surface: #181C20;
      --surface-variant: #DDE3EA;
      --on-surface-variant: #41474D;
      --outline: #72787E;
      --outline-variant: #C1C7CE;
      --scrim: #000000;
      --inverse-surface: #2D3135;
      --inverse-on-surface: #EEF1F6;
      --inverse-primary: #95CDF7;
      --surface-dim: #D7DADF;
      --surface-bright: #F7F9FF;
      --surface-container-lowest: #FFFFFF;
      --surface-container-low: #F1F4F9;
      --surface-container: #EBEEF3;
      --surface-container-high: #E5E8ED;
      --surface-container-highest: #E0E3E8;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-base: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-xxl: 48px;

      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-large: 16px;
      --radius-extra-large: 28px;
      --radius-full: 9999px;

      --font-brand: 'Roboto', sans-serif;

      --type-title-medium-size: 16px;
      --type-title-medium-line: 24px;
      --type-title-medium-weight: 500;
      --type-body-medium-size: 14px;
      --type-body-medium-line: 20px;
      --type-body-medium-weight: 400;
      --type-label-large-size: 14px;
      --type-label-large-line: 20px;
      --type-label-large-weight: 500;

      --motion-short: 150ms;
      --motion-medium: 300ms;
      --motion-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    [data-theme="dark"] {
      --primary: #95CDF7;
      --on-primary: #00344E;
      --primary-container: #004B6F;
      --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9;
      --on-secondary: #22323F;
      --secondary-container: #384956;
      --on-secondary-container: #D3E5F5;
      --tertiary: #CFC0E8;
      --on-tertiary: #352B4B;
      --tertiary-container: #4C4162;
      --on-tertiary-container: #EADDFF;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --on-error-container: #FFDAD6;
      --background: #101417;
      --on-background: #E0E3E8;
      --surface: #101417;
      --on-surface: #E0E3E8;
      --surface-variant: #41474D;
      --on-surface-variant: #C1C7CE;
      --outline: #8B9198;
      --outline-variant: #41474D;
      --scrim: #000000;
      --inverse-surface: #E0E3E8;
      --inverse-on-surface: #2D3135;
      --inverse-primary: #266489;
      --surface-dim: #101417;
      --surface-bright: #363A3E;
      --surface-container-lowest: #0B0F12;
      --surface-container-low: #181C20;
      --surface-container: #1C2024;
      --surface-container-high: #262A2E;
      --surface-container-highest: #313539;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-brand);
      background-color: var(--background);
      color: var(--on-background);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen scaffold — no chrome ── */
    [data-screen="consent-callback"][data-state="access_denied"] {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background-color: var(--background);
    }

    /* ── Access-denied state — centred column ── */
    .access-denied-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--spacing-xl);
      text-align: center;
      min-height: 100dvh;
    }

    /* ── block icon, 48 px, on-surface-variant (PSU chose not to share — soft tone) ── */
    .state-icon--denied {
      font-family: 'Material Symbols Outlined';
      font-size: 48px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
      color: var(--on-surface-variant);
      line-height: 1;
      user-select: none;
    }

    .spacer-lg { height: var(--spacing-lg); }
    .spacer-sm { height: var(--spacing-sm); }
    .spacer-xl { height: var(--spacing-xl); }

    /* ── Typography ── */
    .text-title-medium {
      font-size: var(--type-title-medium-size);
      line-height: var(--type-title-medium-line);
      font-weight: var(--type-title-medium-weight);
      color: var(--on-surface);
      letter-spacing: 0.15px;
    }

    .text-body-medium {
      font-size: var(--type-body-medium-size);
      line-height: var(--type-body-medium-line);
      font-weight: var(--type-body-medium-weight);
      color: var(--on-surface-variant);
      letter-spacing: 0.25px;
      max-width: 280px;
    }

    /* ── Outlined button (M3) — lower urgency: PSU chose not to share ── */
    .btn-outlined {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 var(--spacing-lg);
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--outline);
      border-radius: var(--radius-full);
      font-family: var(--font-brand);
      font-size: var(--type-label-large-size);
      line-height: var(--type-label-large-line);
      font-weight: var(--type-label-large-weight);
      letter-spacing: 0.1px;
      cursor: pointer;
      min-width: 48px;
      min-height: 48px;
      text-decoration: none;
      transition: background-color var(--motion-short) var(--motion-emphasis),
                  border-color var(--motion-short) var(--motion-emphasis);
      position: relative;
      overflow: hidden;
      outline-offset: 2px;
    }

    .btn-outlined::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--primary);
      opacity: 0;
      transition: opacity var(--motion-short) var(--motion-emphasis);
      border-radius: inherit;
    }

    .btn-outlined:hover::before  { opacity: 0.08; }
    .btn-outlined:active::before { opacity: 0.12; }

    .btn-outlined:focus-visible {
      outline: 3px solid var(--primary);
    }

    /* ── Reassurance note ── */
    .reassurance-note {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-sm) var(--spacing-md);
      background-color: var(--surface-container-low);
      border-radius: var(--radius-medium);
      border: 1px solid var(--outline-variant);
      max-width: 280px;
    }

    .reassurance-note span[role="img"] {
      font-family: 'Material Symbols Outlined';
      font-size: 16px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      color: var(--on-surface-variant);
      flex-shrink: 0;
    }

    .reassurance-note p {
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
      color: var(--on-surface-variant);
      text-align: left;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <main
    data-screen="consent-callback"
    data-state="access_denied"
    aria-label="Access to HSBC account data was not shared"
    aria-live="polite"
  >
    <section
      class="access-denied-state"
      aria-label="Access to HSBC account data was not shared"
      data-component-type="empty_state"
      data-component-id="access_denied_state"
      data-component-variant="error"
    >
      <!-- block icon, soft on-surface-variant tint (user chose this — not an error) -->
      <span
        class="state-icon--denied"
        role="img"
        aria-hidden="true"
        data-component-type="icon"
        data-component-id="access_denied_icon"
      >block</span>

      <div class="spacer-lg" aria-hidden="true"></div>

      <!-- Title -->
      <h1
        class="text-title-medium"
        data-component-type="text"
        data-component-id="access_denied_title"
      >Access not shared</h1>

      <div class="spacer-sm" aria-hidden="true"></div>

      <!-- Body -->
      <p
        class="text-body-medium"
        data-component-type="text"
        data-component-id="access_denied_body"
      >You chose not to share your HSBC account data. You can start again at any time.</p>

      <div class="spacer-lg" aria-hidden="true"></div>

      <!-- Reassurance note — AISP read-only, no money moved -->
      <div
        class="reassurance-note"
        aria-label="No action was taken on your account"
      >
        <span role="img" aria-label="Information">info</span>
        <p>No data was accessed and no action was taken on your HSBC account.</p>
      </div>

      <div class="spacer-xl" aria-hidden="true"></div>

      <!-- Outlined button — soft CTA to restart voluntarily -->
      <button
        class="btn-outlined"
        type="button"
        aria-label="Start the account connection process again"
        data-nav-to="login"
        data-action="navigate_retry"
        data-component-type="button"
        data-component-id="denied_cta_button"
        data-component-variant="outlined"
      >Start over</button>
    </section>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
