<!doctype html>
<!-- render-hash: cc4f2e1a8d3b -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorisation Callback — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --primary: #266489;
      --on-primary: #FFFFFF;
      --primary-container: #C9E6FF;
      --on-primary-container: #004B6F;
      --secondary: #50606E;
      --on-secondary: #FFFFFF;
      --secondary-container: #D3E5F5;
      --on-secondary-container: #384956;
      --tertiary: #64597B;
      --on-tertiary: #FFFFFF;
      --tertiary-container: #EADDFF;
      --on-tertiary-container: #4C4162;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --error-container: #FFDAD6;
      --on-error-container: #93000A;
      --background: #F7F9FF;
      --on-background: #181C20;
      --surface: #F7F9FF;
      --on-surface: #181C20;
      --surface-variant: #DDE3EA;
      --on-surface-variant: #41474D;
      --outline: #72787E;
      --outline-variant: #C1C7CE;
      --scrim: #000000;
      --inverse-surface: #2D3135;
      --inverse-on-surface: #EEF1F6;
      --inverse-primary: #95CDF7;
      --surface-dim: #D7DADF;
      --surface-bright: #F7F9FF;
      --surface-container-lowest: #FFFFFF;
      --surface-container-low: #F1F4F9;
      --surface-container: #EBEEF3;
      --surface-container-high: #E5E8ED;
      --surface-container-highest: #E0E3E8;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-base: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-xxl: 48px;

      --radius-small: 8px;
      --radius-medium: 12px;
      --radius-large: 16px;
      --radius-extra-large: 28px;
      --radius-full: 9999px;

      --font-brand: 'Roboto', sans-serif;

      --type-title-medium-size: 16px;
      --type-title-medium-line: 24px;
      --type-title-medium-weight: 500;
      --type-body-small-size: 12px;
      --type-body-small-line: 16px;
      --type-body-small-weight: 400;

      --motion-short: 150ms;
      --motion-medium: 300ms;
      --motion-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    [data-theme="dark"] {
      --primary: #95CDF7;
      --on-primary: #00344E;
      --primary-container: #004B6F;
      --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9;
      --on-secondary: #22323F;
      --secondary-container: #384956;
      --on-secondary-container: #D3E5F5;
      --tertiary: #CFC0E8;
      --on-tertiary: #352B4B;
      --tertiary-container: #4C4162;
      --on-tertiary-container: #EADDFF;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --on-error-container: #FFDAD6;
      --background: #101417;
      --on-background: #E0E3E8;
      --surface: #101417;
      --on-surface: #E0E3E8;
      --surface-variant: #41474D;
      --on-surface-variant: #C1C7CE;
      --outline: #8B9198;
      --outline-variant: #41474D;
      --scrim: #000000;
      --inverse-surface: #E0E3E8;
      --inverse-on-surface: #2D3135;
      --inverse-primary: #266489;
      --surface-dim: #101417;
      --surface-bright: #363A3E;
      --surface-container-lowest: #0B0F12;
      --surface-container-low: #181C20;
      --surface-container: #1C2024;
      --surface-container-high: #262A2E;
      --surface-container-highest: #313539;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-brand);
      background-color: var(--background);
      color: var(--on-background);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen scaffold — no app bar, no bottom nav (shell overrides) ── */
    [data-screen="consent-callback"][data-state="loading"] {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 100dvh;
      background-color: var(--background);
    }

    /* ── Loading layout — centred vertical stack ── */
    .loading-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--spacing-xl);
      text-align: center;
      gap: 0;
      min-height: 100dvh;
    }

    /* ── Circular progress indicator (M3 determinate-indeterminate) ── */
    .progress-indicator {
      width: 48px;
      height: 48px;
      position: relative;
      flex-shrink: 0;
    }

    .progress-indicator svg {
      width: 100%;
      height: 100%;
      animation: rotate 1.4s linear infinite;
      transform-origin: center;
    }

    .progress-indicator circle {
      stroke: var(--primary);
      stroke-linecap: round;
      fill: none;
      stroke-width: 3.6;
      stroke-dasharray: 80, 200;
      stroke-dashoffset: 0;
      animation: dash 1.4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    @keyframes dash {
      0%   { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
      50%  { stroke-dasharray: 90, 200; stroke-dashoffset: -35px; }
      100% { stroke-dasharray: 90, 200; stroke-dashoffset: -124px; }
    }

    .spacer-xl { height: var(--spacing-xl); }
    .spacer-sm { height: var(--spacing-sm); }

    /* ── Typography ── */
    .text-title-medium {
      font-size: var(--type-title-medium-size);
      line-height: var(--type-title-medium-line);
      font-weight: var(--type-title-medium-weight);
      color: var(--on-surface);
      letter-spacing: 0.15px;
    }

    .text-body-small {
      font-size: var(--type-body-small-size);
      line-height: var(--type-body-small-line);
      font-weight: var(--type-body-small-weight);
      color: var(--on-surface-variant);
      letter-spacing: 0.4px;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div
    data-screen="consent-callback"
    data-state="loading"
    role="main"
    aria-label="Authorisation in progress"
    aria-live="polite"
  >
    <section
      class="loading-layout"
      aria-label="Authorisation in progress"
      data-component-type="stack"
      data-component-id="loading_layout"
      data-component-variant="vertical"
    >
      <!-- Circular progress indicator -->
      <div
        class="progress-indicator"
        role="progressbar"
        aria-label="Verifying HSBC authorisation"
        aria-valuemin="0"
        aria-valuemax="100"
        data-component-type="progress_indicator"
        data-component-id="loading_spinner"
        data-component-variant="circular"
      >
        <svg viewBox="22 22 44 44" aria-hidden="true">
          <circle cx="44" cy="44" r="20.2" />
        </svg>
      </div>

      <div class="spacer-xl" aria-hidden="true"></div>

      <!-- Headline -->
      <p
        class="text-title-medium"
        data-component-type="text"
        data-component-id="loading_headline"
      >Verifying your authorisation…</p>

      <div class="spacer-sm" aria-hidden="true"></div>

      <!-- Supporting body -->
      <p
        class="text-body-small"
        data-component-type="text"
        data-component-id="loading_body"
      >Securely exchanging credentials with HSBC. This takes a few seconds.</p>
    </section>
  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
