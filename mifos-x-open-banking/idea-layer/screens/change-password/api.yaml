sibling: api
schema_version: "4.0"
feature_id: change-password
api:
  - id: obp_change_password
    endpoint: "PUT /obp/v7.0.0/users/current/password"
    tag: User
    trigger: OnSubmitClicked
    description: "Change password for the currently authenticated user"
    request:
      fields:
        - name: current_password
          type: String
        - name: new_password
          type: String
    response:
      fields:
        - name: success
          type: Boolean
        - name: message
          type: String
    errors:
      - code: 400
        message: "WRONG_CURRENT_PASSWORD"
      - code: 400
        message: "WEAK_PASSWORD"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 500
        message: "INTERNAL_SERVER_ERROR"
