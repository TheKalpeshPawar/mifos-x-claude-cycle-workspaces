sibling: data-flow
schema_version: "4.0"
feature_id: change-password
entries:
  - screen_id: change-password
    trigger: on_interact
    event: OnSubmitClicked
    endpoints:
      - obp_change_password
    direction: write
    dtos:
      - name: ChangePasswordRequest
        role: request
        api_id: obp_change_password
      - name: ChangePasswordResponse
        role: response
        api_id: obp_change_password
    produces_state: submitting
    error_paths:
      - error_code: 400
        behavior: show_validation_error
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 500
        behavior: show_error_banner

  - screen_id: change-password
    trigger: on_interact
    event: OnCurrentPasswordChanged
    endpoints: []
    direction: none
    dtos: []
    produces_state: idle

  - screen_id: change-password
    trigger: on_interact
    event: OnNewPasswordChanged
    endpoints: []
    direction: none
    dtos: []
    produces_state: idle

  - screen_id: change-password
    trigger: on_interact
    event: OnConfirmPasswordChanged
    endpoints: []
    direction: none
    dtos: []
    produces_state: idle
