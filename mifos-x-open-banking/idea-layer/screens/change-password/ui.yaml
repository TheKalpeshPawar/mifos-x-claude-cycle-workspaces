id: change-password
name: "Change Password"
feature: change-password
flavor: shared
status: enriched
quality_score: 96
status_history:
  - from: approved
    to: enriched
    at: "2026-06-02"
    by: "/idea enrich"
    quality_score: 95
    note: "Added archetype + states_handled to screens[] entry (Category 12 — viewmodel already present); verified component vocabulary (stack/text/card/input/divider/progress_bar/banner/button all in components.yaml); 7 states with layout blocks, full state_model, api response+errors, dependencies intact"
  - from: enriched
    to: enriched
    at: "2026-06-11"
    by: "/idea enrich"
    quality_score: 96
    note: "Added validation{} blocks to all 3 password inputs (required/min-length/complexity/match/server-side current-password check per RULE-IDEA-FORM-VALIDATION-001); corrected initial_state idle→content (submit-only form, no data-loading api); added required_fields[] to form-field + submit test_context; no structural/component/contract changes"
contract_version: "1.1.0"
approve_hash: "sha256:b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3"
approved_at: "2026-05-28T14:30:00Z"
approved_by: "/idea approve (via /idea sync)"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
  - has_api

screens:
  - id: change-password
    name: "Change Password"
    viewmodel: "ChangePasswordViewModel"
    archetype: form
    states_handled: [loading, idle, submitting, success, error, content, empty]

archetype: form

shell:
  top_app_bar:
    show: true
    title: "Change Password"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: chpw_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - chpw_header_section
      - chpw_form_card
      - chpw_error_banner
      - chpw_success_banner
      - chpw_submit_button

  # ── Header ────────────────────────────────────────────────────────────────────

  - type: stack
    id: chpw_header_section
    variant: column
    style:
      padding_bottom: spacing.xl
    children:
      - chpw_header_title
      - chpw_header_subtitle

  - type: text
    id: chpw_header_title
    content: "Update Your Password"
    variant: headline_small
    style:
      typography: "Outfit/headline_small"
      color: "#4C662B"
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "Update Your Password"
    test_context:
      purpose: "Screen headline providing context for the password change form"
      interaction_type: display
      data_driven: false

  - type: text
    id: chpw_header_subtitle
    content: "Choose a strong password that you don't use elsewhere."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
    a11y:
      role: text
      label: "Choose a strong password that you don't use elsewhere."
    test_context:
      purpose: "Instruction copy encouraging a unique, strong new password"
      interaction_type: display
      data_driven: false

  # ── Form Card ────────────────────────────────────────────────────────────────

  - type: card
    id: chpw_form_card
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - chpw_current_password_input
      - chpw_divider_1
      - chpw_new_password_input
      - chpw_strength_indicator
      - chpw_divider_2
      - chpw_confirm_password_input

  - type: input
    id: chpw_current_password_input
    label: "Current Password"
    placeholder: "Enter your current password"
    variant: password
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      error_border_color: "#BA1A1A"
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      margin_bottom: spacing.sm
    prefill: ""
    on_click:
      action: focus_field
      target: chpw_current_password_input
    validation:
      required: true
      required_message: "Enter your current password"
      server_side:
        check: current_password_match
        error_message: "The current password you entered is incorrect. Please try again."
    a11y:
      role: textbox
      label: "Current password"
      label_source: visible_label
    keyboard:
      focusable: true
      ime_action: next
    test_context:
      purpose: "Validates the user knows their existing password before allowing a change"
      required_fields: [currentPassword]
      interaction_type: action
      data_driven: false

  - type: divider
    id: chpw_divider_1
    style:
      color: "#E1E4D5"
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between current password and new password fields"
      interaction_type: display
      data_driven: false

  - type: input
    id: chpw_new_password_input
    label: "New Password"
    placeholder: "At least 8 characters"
    variant: password
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      error_border_color: "#BA1A1A"
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      margin_bottom: spacing.xs
    prefill: ""
    on_click:
      action: focus_field
      target: chpw_new_password_input
    validation:
      required: true
      required_message: "Enter a new password"
      min_length: 8
      min_length_message: "Password must be at least 8 characters"
      rules:
        - id: complexity
          requirement: uppercase_lowercase_number_special
          message: "Password must be at least 8 characters with uppercase, lowercase, number, and special character."
        - id: differs_from_current
          requirement: not_equal_to_current_password
          message: "New password must be different from your current password"
    a11y:
      role: textbox
      label: "New password"
      label_source: visible_label
    keyboard:
      focusable: true
      ime_action: next
    test_context:
      purpose: "Input for the desired new password; triggers strength evaluation on each keystroke"
      required_fields: [newPassword]
      interaction_type: action
      data_driven: false

  - type: stack
    id: chpw_strength_indicator
    variant: column
    style:
      padding_bottom: spacing.sm
    children:
      - chpw_strength_bar
      - chpw_strength_label

  - type: progress_bar
    id: chpw_strength_bar
    variant: linear
    style:
      color_low: "#BA1A1A"
      color_medium: "#F4B400"
      color_high: "#4C662B"
      height: "4dp"
      border_radius: "2dp"
      background: "#E1E4D5"
    prefill: "passwordStrengthProgress"
    a11y:
      role: progressbar
      label: "Password strength indicator"
    test_context:
      purpose: "Visual bar showing password strength from 0 (weak/red) to 1 (strong/green)"
      interaction_type: display
      data_driven: true

  - type: text
    id: chpw_strength_label
    content: "Password strength: Good"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      padding_top: "2dp"
    prefill: "passwordStrengthLabel"
    a11y:
      role: text
      label: "Password strength status"
    test_context:
      purpose: "Text companion to strength bar (Weak / Fair / Good / Strong)"
      interaction_type: display
      data_driven: true

  - type: divider
    id: chpw_divider_2
    style:
      color: "#E1E4D5"
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between new password field and confirm password field"
      interaction_type: display
      data_driven: false

  - type: input
    id: chpw_confirm_password_input
    label: "Confirm New Password"
    placeholder: "Re-enter your new password"
    variant: password
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      error_border_color: "#BA1A1A"
      typography: "Outfit/body_medium"
      color: "#1A1C16"
    prefill: ""
    on_click:
      action: focus_field
      target: chpw_confirm_password_input
    validation:
      required: true
      required_message: "Re-enter your new password"
      matches_field: chpw_new_password_input
      match_message: "Passwords don't match"
    a11y:
      role: textbox
      label: "Confirm new password"
      label_source: visible_label
    keyboard:
      focusable: true
      ime_action: done
    test_context:
      purpose: "Confirmation field; validated against new password on submit"
      required_fields: [confirmPassword, newPassword]
      interaction_type: action
      data_driven: false

  # ── Banners ───────────────────────────────────────────────────────────────────

  - type: banner
    id: chpw_error_banner
    variant: error
    content: "Password change failed. Please check your current password and try again."
    style:
      background: "#FFDAD6"
      color: "#BA1A1A"
      border_radius: "8dp"
      padding: spacing.sm
      margin_bottom: spacing.md
    visible_when: "uiState == error"
    a11y:
      role: alert
      label: "Password change error"
    test_context:
      purpose: "Error feedback when the API returns a 400/401 for incorrect current password"
      interaction_type: display
      data_driven: true

  - type: banner
    id: chpw_success_banner
    variant: success
    content: "Your password has been changed successfully."
    style:
      background: "#D8EED0"
      color: "#4C662B"
      border_radius: "8dp"
      padding: spacing.sm
      margin_bottom: spacing.md
    visible_when: "uiState == success"
    a11y:
      role: alert
      label: "Password changed successfully"
    test_context:
      purpose: "Success confirmation shown after a 200 OK from the password change endpoint"
      interaction_type: display
      data_driven: true

  # ── Submit Button ─────────────────────────────────────────────────────────────

  - type: button
    id: chpw_submit_button
    label: "Update Password"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      color: "#FFFFFF"
      typography: "Outfit/label_large"
      padding_horizontal: spacing.xl
      border_radius: "12dp"
      loading_when: "uiState == submitting"
    on_click:
      action: submit_change_password
      target: change-password
    a11y:
      role: button
      label: "Submit password change"
    keyboard:
      focusable: true
    test_context:
      purpose: "Triggers ChangePasswordViewModel.onSubmit(); disabled while submitting or on success"
      required_fields: [currentPassword, newPassword, confirmPassword]
      interaction_type: action
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - chpw_header_section
    note: "Brief skeleton while auth session validates; transitions to idle immediately on local auth"
  idle:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - chpw_header_section
      - chpw_form_card
      - chpw_submit_button
  submitting:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - chpw_header_section
      - chpw_form_card
      - chpw_submit_button
    note: "Submit button shows loading spinner; form fields disabled"
  success:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - chpw_header_section
      - chpw_success_banner
      - chpw_submit_button
    note: "Success banner visible; auto-navigate back to profile after 2 seconds"
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - chpw_header_section
      - chpw_form_card
      - chpw_error_banner
      - chpw_submit_button
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - chpw_header_section
      - chpw_form_card
      - chpw_submit_button
  empty:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - chpw_header_section
    show_empty_state: true
    empty_state_icon: lock_reset
    empty_state_message: "Password change unavailable. Please try again later."

state_model:
  ChangePasswordViewModel:
    screen_state: ChangePasswordUiState
    state:
      - field: currentPassword
        type: String
        default: "\"\""
      - field: newPassword
        type: String
        default: "\"\""
      - field: confirmPassword
        type: String
        default: "\"\""
      - field: passwordStrengthProgress
        type: Float
        default: "0f"
      - field: passwordStrengthLabel
        type: String
        default: "\"Enter a password\""
      - field: isSubmitting
        type: Boolean
        default: "false"
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isSuccess
        type: Boolean
        default: "false"
    errors: [WRONG_CURRENT_PASSWORD, PASSWORDS_DO_NOT_MATCH, NETWORK_ERROR, WEAK_PASSWORD]
    events: [OnCurrentPasswordChanged, OnNewPasswordChanged, OnConfirmPasswordChanged, OnSubmitClicked]
    actions:
      - onCurrentPasswordChanged(value: String)
      - onNewPasswordChanged(value: String)
      - onConfirmPasswordChanged(value: String)
      - onSubmitClicked()
    di: [AuthRepository, PasswordStrengthEvaluator]

navigation:
  - id: nav_back_to_profile
    target: profile
    on_click:
      action: navigate
      target: profile

api:
  - id: change_password
    method: PUT
    path: "/obp/v5.0.0/users/{userId}/password"
    request:
      current_password: String
      new_password: String
    response:
      success: Boolean
      message: String
    errors: [400, 401, 403]

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
