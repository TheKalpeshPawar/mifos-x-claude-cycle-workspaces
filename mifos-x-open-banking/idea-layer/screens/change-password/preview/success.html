<!doctype html>
<html lang="en" data-screen="change-password" data-state="success">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
      --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF;
      --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --spacing-xs: 4px; --spacing-sm: 8px; --spacing-md: 16px;
      --spacing-lg: 24px; --spacing-xl: 32px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
    .device-frame { max-width: 390px; margin: 0 auto; min-height: 100vh; background: var(--background); display: flex; flex-direction: column; }
    .top-app-bar {
      display: flex; align-items: center; height: 64px; padding: 0 var(--spacing-sm);
      background: var(--background); position: sticky; top: 0; z-index: 10;
    }
    .top-app-bar__nav-btn {
      width: 48px; height: 48px; border: none; background: transparent; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--on-background);
    }
    .top-app-bar__title { font-size: 22px; font-weight: 500; color: var(--on-background); flex: 1; padding-left: var(--spacing-sm); }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: var(--spacing-lg) var(--spacing-lg) 48px; gap: var(--spacing-md); text-align: center;
    }
    .success-icon-wrap {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--primary-container);
      display: flex; align-items: center; justify-content: center; margin-bottom: var(--spacing-sm);
    }
    .success-icon-wrap .material-icons { font-size: 48px; color: var(--primary); }
    .success-title { font-size: 26px; font-weight: 700; color: var(--primary); }
    .success-subtitle { font-size: 15px; color: var(--outline); line-height: 1.6; max-width: 280px; }
    .security-notice {
      background: var(--surface); border-radius: 12px; padding: 14px 16px;
      text-align: left; width: 100%;
      border: 1px solid var(--primary-container);
      display: flex; align-items: flex-start; gap: 10px;
    }
    .security-notice .material-icons { color: var(--primary); font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .security-text { font-size: 13px; color: var(--on-surface-variant); line-height: 1.5; }
    .btn-filled {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 52px; padding: 0 var(--spacing-xl);
      background: var(--primary); border: none; border-radius: 12px;
      color: var(--on-primary); font-family: 'Outfit', sans-serif;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-filled:hover { opacity: 0.9; }
    .material-icons {
      font-family: 'Material Icons'; font-style: normal; font-weight: normal;
      font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
      display: inline-block; white-space: nowrap; -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <nav class="top-app-bar" role="navigation" aria-label="Screen navigation">
      <button class="top-app-bar__nav-btn" aria-label="Navigate back"
              data-action="navigate_back" data-component-type="icon_button" data-component-id="top_app_bar_back">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar__title">Change Password</h1>
    </nav>

    <main id="chpw_success_root" data-component-type="stack" data-component-id="chpw_success_root">

      <div class="success-icon-wrap"
           data-component-type="image" data-component-id="chpw_success_icon"
           role="img" aria-label="Password changed successfully icon">
        <span class="material-icons" aria-hidden="true">check_circle</span>
      </div>

      <h2 class="success-title"
          data-component-type="text" data-component-id="chpw_success_title"
          role="heading" aria-label="Password changed">Password Changed</h2>

      <p class="success-subtitle"
         data-component-type="text" data-component-id="chpw_success_subtitle">
        Your password has been updated successfully. Use your new password next time you sign in.
      </p>

      <div class="security-notice"
           data-component-type="box" data-component-id="chpw_security_notice"
           role="note" aria-label="Security notice">
        <span class="material-icons" aria-hidden="true">info_outline</span>
        <span class="security-text">If you didn't make this change, contact support immediately and reset your password again.</span>
      </div>

      <button class="btn-filled"
              data-component-type="button" data-component-id="chpw_back_button"
              role="button" aria-label="Return to profile screen"
              tabindex="0" data-nav-to="profile">
        Back to Profile
      </button>

    </main>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
