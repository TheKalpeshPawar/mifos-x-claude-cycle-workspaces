feature: scheduled-payments
status: enriched
cluster: payments-context
acceptance_refs: [FR-006]
scaffolded_by: "/idea-heal"
archetype: index_list
flow_ref: recurring-and-statements
description: "Read-only list of future-dated one-off scheduled payments for an account, sourced from OBReadScheduledPayment3. Shows payee name, instructed amount (GBP formatted), formatted scheduled date (EEE d MMM yyyy), ScheduledType chip (Execution date / Arrival date), destination CreditorAccount.Identification (sort code + account number), and payment reference. Reached from account-detail Scheduled chip. ViewModel maps OBIE ScheduledType enum to human-readable chip label + icon."
has_ui: true
has_server: false

metadata:
  category: crud
  implementation_ready: true
  impl_ready_at: "2026-06-29T12:00:00Z"
  impl_ready_schema: "v2"

contracts: []

libraries:
  - capability: rest-client
    library: ktorfit
    version: "latest"
    targets: [android, ios, desktop, web]

vm_actions:
  - name: LoadScheduledPayments
    signature: "suspend fun loadScheduledPayments(accountId: String)"
    state_mutations:
      - "uiState = Loading"
      - "uiState = Content(scheduledPayments = response.Data.ScheduledPayment.map { it.toUiModel() })"
      - "uiState = Empty (when list is empty)"
    side_effects:
      - "GET /accounts/{accountId}/scheduled-payments via Ktorfit AisApiService"
    error_handling:
      on_401: "uiState = Error(TokenExpired)"
      on_403: "uiState = Error(ConsentRevoked)"
      on_429: "uiState = Error(RateLimited)"
      on_network: "uiState = Error(NetworkError)"
    notes: "toUiModel() maps: ScheduledPaymentDateTime ISO-8601 → scheduledDateFormatted (EEE d MMM yyyy); ScheduledType Execution → scheduledTypeLabel='Execution date', scheduledTypeIcon='calendar_today', scheduledTypeA11y='Money leaves your account on {date}'; ScheduledType Arrival → scheduledTypeLabel='Arrival date', scheduledTypeIcon='arrow_downward', scheduledTypeA11y='Funds arrive at {payee} on {date}'."

  - name: RetryLoad
    signature: "fun retryLoad()"
    state_mutations:
      - "re-invokes LoadScheduledPayments with same accountId"
    side_effects: []
    error_handling: {}

  - name: NavigateBack
    signature: "fun navigateBack()"
    state_mutations: []
    side_effects:
      - "Emits NavigationEvent.Back to NavController"
    error_handling: {}

error_cases:
  - id: TokenExpired
    trigger: "HTTP 401 from HSBC AIS"
    user_message: "Session expired. Please log in again."
    recovery: "Route to login screen"
  - id: ConsentRevoked
    trigger: "HTTP 403 from HSBC AIS"
    user_message: "Account access consent has been revoked."
    recovery: "Route to consent-list screen"
  - id: RateLimited
    trigger: "HTTP 429 from HSBC AIS"
    user_message: "Too many requests. Please wait a moment and try again."
    recovery: "Retry button shown; exponential back-off in ViewModel"
  - id: NetworkError
    trigger: "IOException / timeout"
    user_message: "No network connection. Check your connection and retry."
    recovery: "Retry button re-triggers LoadScheduledPayments"
  - id: EmptyResult
    trigger: "Data.ScheduledPayment[] is empty"
    user_message: "No future-dated payments are pending for this account."
    recovery: "Empty state shown; no action needed"

test_fixtures:
  source: "idea-layer/screens/scheduled-payments/demo-data.yaml"
  scenario_count: 8
  priority_distribution:
    p0: 3
    p1: 4
    p2: 1
