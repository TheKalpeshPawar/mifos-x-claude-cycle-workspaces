<!doctype html>
<!-- render-hash: f9e1c7a4d820 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="screen-id" content="scheduled-payments">
  <meta name="state" content="loading">
  <title>Scheduled Payments — loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    /* ── M3 Color tokens: light ──────────────────────────────── */
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-high: #E5E8ED;
      --md-sys-color-surface-container-highest: #E0E3E8;

      /* Typography */
      --fs-title-large: 22px;
      --lh-title-large: 28px;
      --fs-label-medium: 12px;
      --lh-label-medium: 16px;
      --fw-label-medium: 500;

      /* Shape */
      --radius-medium: 12px;
      --radius-full: 9999px;
      --radius-small: 8px;
      --radius-extra-small: 4px;

      /* Spacing */
      --screen-padding: 16px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 24px;

      /* Motion */
      --motion-easing: cubic-bezier(0.2, 0.0, 0, 1.0);
      --motion-duration-short: 150ms;

      /* Shell dimensions */
      --top-app-bar-height: 64px;
      --bottom-nav-height: 80px;
    }

    /* ── M3 Color tokens: dark ──────────────────────────────── */
    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
      --md-sys-color-surface-container-lowest: #0B0F12;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-high: #262A2E;
      --md-sys-color-surface-container-highest: #313539;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #95CDF7;
        --md-sys-color-on-primary: #00344E;
        --md-sys-color-primary-container: #004B6F;
        --md-sys-color-background: #101417;
        --md-sys-color-on-background: #E0E3E8;
        --md-sys-color-surface: #101417;
        --md-sys-color-on-surface: #E0E3E8;
        --md-sys-color-surface-variant: #41474D;
        --md-sys-color-on-surface-variant: #C1C7CE;
        --md-sys-color-outline: #8B9198;
        --md-sys-color-outline-variant: #41474D;
        --md-sys-color-surface-container: #1C2024;
        --md-sys-color-surface-container-high: #262A2E;
        --md-sys-color-surface-container-highest: #313539;
        --md-sys-color-secondary-container: #384956;
      }
    }

    /* ── Reset & base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 390px;
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Top app bar ────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--top-app-bar-height);
      background-color: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: 0 var(--spacing-sm);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .top-app-bar__back {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
      transition: background-color var(--motion-duration-short) var(--motion-easing);
    }
    .top-app-bar__back:hover {
      background-color: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
    }
    .top-app-bar__back:focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    .top-app-bar__title {
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Main content ───────────────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--screen-padding);
      padding-bottom: calc(var(--bottom-nav-height) + var(--spacing-lg));
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    /* ── Shimmer animation ──────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .skeleton {
      border-radius: var(--radius-extra-small);
      background: linear-gradient(
        90deg,
        var(--md-sys-color-surface-container-high) 25%,
        var(--md-sys-color-surface-container-highest) 50%,
        var(--md-sys-color-surface-container-high) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    /* ── Skeleton payment card ──────────────────────────────── */
    .skeleton-card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--radius-medium);
      padding: var(--spacing-lg);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      box-shadow: 0 1px 2px color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent);
    }

    .skeleton-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--spacing-sm);
    }

    .skeleton-card__payee {
      height: 20px;
      width: 55%;
    }

    .skeleton-card__amount {
      height: 28px;
      width: 28%;
      border-radius: var(--radius-extra-small);
    }

    .skeleton-card__date {
      height: 14px;
      width: 44%;
    }

    .skeleton-card__chip {
      height: 32px;
      width: 130px;
      border-radius: var(--radius-full);
    }

    .skeleton-card__divider {
      height: 1px;
      background-color: var(--md-sys-color-outline-variant);
      margin-top: var(--spacing-xs);
    }

    .skeleton-card__meta-row {
      height: 14px;
      width: 70%;
    }

    .skeleton-card__meta-row--short {
      width: 48%;
    }

    /* ── Circular progress (M3 indeterminate) ───────────────── */
    .loading-indicator-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl) 0 var(--spacing-sm);
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dash {
      0%   { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
      50%  { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
      100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
    }

    .circular-progress {
      width: 40px;
      height: 40px;
      animation: spin 1.4s linear infinite;
    }

    .circular-progress__track {
      fill: none;
      stroke: var(--md-sys-color-surface-container-high);
      stroke-width: 4;
    }

    .circular-progress__indicator {
      fill: none;
      stroke: var(--md-sys-color-primary);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 1, 150;
      stroke-dashoffset: 0;
      animation: dash 1.4s ease-in-out infinite;
    }

    /* ── Bottom navigation ──────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: var(--bottom-nav-height);
      background-color: var(--md-sys-color-surface-container);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 40;
    }

    .bottom-nav__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-height: 48px;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      border: none;
      text-decoration: none;
      color: var(--md-sys-color-on-surface-variant);
      transition: color var(--motion-duration-short) var(--motion-easing);
    }

    .bottom-nav__indicator {
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: var(--fw-label-medium);
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body data-screen="scheduled-payments" data-state="loading">

  <!-- ── Top app bar ──────────────────────────────────────────── -->
  <header class="top-app-bar" role="banner">
    <button
      class="top-app-bar__back"
      aria-label="Navigate back to Account Detail"
      data-nav-to="account-detail"
    >
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Scheduled Payments</h1>
  </header>

  <!-- ── Loading content ──────────────────────────────────────── -->
  <main
    class="screen-content"
    id="main-content"
    role="main"
    aria-label="Loading scheduled payments"
    aria-live="polite"
    aria-busy="true"
  >
    <!-- Circular progress indicator (M3 indeterminate) -->
    <div class="loading-indicator-wrap">
      <svg
        class="circular-progress"
        viewBox="0 0 48 48"
        role="progressbar"
        aria-label="Loading scheduled payments"
        aria-valuemin="0"
        aria-valuemax="100"
        data-component-type="progress_indicator"
        data-component-id="progress_indicator"
        data-component-variant="circular"
      >
        <circle class="circular-progress__track" cx="24" cy="24" r="20"/>
        <circle class="circular-progress__indicator" cx="24" cy="24" r="20"/>
      </svg>
    </div>

    <!-- Skeleton card 1 — mirrors content card block structure -->
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-card__header">
        <div class="skeleton skeleton-card__payee"></div>
        <div class="skeleton skeleton-card__amount"></div>
      </div>
      <div class="skeleton skeleton-card__date"></div>
      <div class="skeleton skeleton-card__chip"></div>
      <div class="skeleton-card__divider"></div>
      <div class="skeleton skeleton-card__meta-row"></div>
      <div class="skeleton skeleton-card__meta-row skeleton-card__meta-row--short"></div>
    </div>

    <!-- Skeleton card 2 -->
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-card__header">
        <div class="skeleton skeleton-card__payee" style="width:62%"></div>
        <div class="skeleton skeleton-card__amount" style="width:24%"></div>
      </div>
      <div class="skeleton skeleton-card__date" style="width:38%"></div>
      <div class="skeleton skeleton-card__chip"></div>
      <div class="skeleton-card__divider"></div>
      <div class="skeleton skeleton-card__meta-row" style="width:66%"></div>
      <div class="skeleton skeleton-card__meta-row skeleton-card__meta-row--short"></div>
    </div>

    <!-- Skeleton card 3 -->
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-card__header">
        <div class="skeleton skeleton-card__payee" style="width:50%"></div>
        <div class="skeleton skeleton-card__amount" style="width:30%"></div>
      </div>
      <div class="skeleton skeleton-card__date" style="width:40%"></div>
      <div class="skeleton skeleton-card__chip" style="width:115px"></div>
      <div class="skeleton-card__divider"></div>
      <div class="skeleton skeleton-card__meta-row" style="width:72%"></div>
      <div class="skeleton skeleton-card__meta-row skeleton-card__meta-row--short" style="width:40%"></div>
    </div>

  </main>

  <!-- ── Bottom navigation ────────────────────────────────────── -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <a class="bottom-nav__item" href="#" aria-label="Home" data-nav-to="home">
      <div class="bottom-nav__indicator" aria-hidden="true">
        <span class="material-symbols-outlined">home</span>
      </div>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a class="bottom-nav__item" href="#" aria-label="Accounts" data-nav-to="accounts">
      <div class="bottom-nav__indicator" aria-hidden="true">
        <span class="material-symbols-outlined">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </a>
    <a class="bottom-nav__item" href="#" aria-label="Transactions" data-nav-to="transactions">
      <div class="bottom-nav__indicator" aria-hidden="true">
        <span class="material-symbols-outlined">receipt_long</span>
      </div>
      <span class="bottom-nav__label">Transactions</span>
    </a>
    <a class="bottom-nav__item" href="#" aria-label="More" data-nav-to="settings">
      <div class="bottom-nav__indicator" aria-hidden="true">
        <span class="material-symbols-outlined">more_horiz</span>
      </div>
      <span class="bottom-nav__label">More</span>
    </a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
