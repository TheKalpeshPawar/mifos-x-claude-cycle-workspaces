screen_id: scheduled-payments

endpoints:
  - id: scheduled-payments-list
    method: GET
    path: "/accounts/{AccountId}/scheduled-payments"
    response_dto: OBReadScheduledPayment3
    permission: ReadScheduledPaymentsDetail
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns future-dated scheduled payments for the given AccountId. ScheduledType Execution = payment leaves account on date; Arrival = funds arrive at beneficiary on date."
