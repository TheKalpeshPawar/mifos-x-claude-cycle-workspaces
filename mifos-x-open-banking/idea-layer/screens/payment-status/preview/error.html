<body>
<div class="device" data-screen="payment-status" data-state="error" data-error-type="PaymentNotFound">
  <div class="statusbar"></div>
  <div class="appbar">
    <div class="iconbtn" data-nav-to="send-money" role="button" tabindex="0" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
    </div>
    <div class="title">Payment status</div>
  </div>

  <div class="body">
    <svg class="glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/>
    </svg>
    <h1 class="h">Couldn't load this payment</h1>
    <p class="p">Payment not found</p>
    <!--
      retry_button is ABSENT here by design. Two of four error types are terminal:
        PaymentNotFound (404 / U011) — the id will not start existing
        ConsentRevoked  (403)        — removes the right to READ; money already sent stays sent
      Only TokenExpired (401) and NetworkError render the Try again CTA.
      refresh_status is a PURE READ, so retrying it can never affect the payment —
      unlike send-money's retry, which re-sends a write and relies on the idempotency key.
    -->
  </div>

  <div class="navbar">

    <div class="tab" data-nav-to="accounts"><div class="dot"></div>Accounts</div>
