<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment status — content</title>
<style>
  :root{
    --primary:#266489; --on-primary:#FFFFFF;
    --secondary-container:#D3E5F5; --on-secondary-container:#384956;
    --surface:#F7F9FF; --on-surface:#181C20; --on-surface-variant:#41474D;
    --surface-container:#EBEEF3; --outline-variant:#C1C7CE;
    --r-md:12px; --r-full:9999px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --primary:#95CDF7; --on-primary:#00344E;
      --secondary-container:#384956; --on-secondary-container:#D3E5F5;
      --surface:#101417; --on-surface:#E0E3E8; --on-surface-variant:#C1C7CE;
      --surface-container:#1C2024; --outline-variant:#41474D;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--surface);color:var(--on-surface);
       font:16px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       display:flex;justify-content:center}
  .device{width:393px;min-height:852px;display:flex;flex-direction:column;background:var(--surface)}
  .statusbar{height:54px;flex:none}
  .appbar{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 4px}
  .iconbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:var(--r-full);
           color:var(--primary);cursor:pointer}
  .iconbtn svg{width:24px;height:24px}
  .title{font-size:22px}
  .scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:16px}
  .chip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
        padding:8px 16px;border-radius:var(--r-full);
        background:var(--secondary-container);color:var(--on-secondary-container);
        font-size:14px;font-weight:500;cursor:default}
  .chip svg{width:18px;height:18px}
  .card{background:var(--surface-container);border-radius:var(--r-md);padding:16px;
        display:flex;flex-direction:column;gap:16px}
  .pair{display:flex;flex-direction:column;gap:2px}
  .pair .l{font-size:12px;color:var(--on-surface-variant)}
  .pair .v{font-size:16px;color:var(--on-surface)}
  .amt{font-family:"Roboto Mono",ui-monospace,monospace;font-size:24px;line-height:32px;
       color:var(--on-surface-variant)}
  .note{font-size:14px;line-height:20px;color:var(--on-surface-variant)}
  .tonal{height:48px;border-radius:var(--r-full);background:var(--secondary-container);
         color:var(--on-secondary-container);font-size:14px;font-weight:500;
         display:grid;place-items:center;cursor:pointer}
  .navbar{height:80px;flex:none;display:flex;background:var(--surface-container);
          border-top:1px solid var(--outline-variant)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
       font-size:12px;color:var(--on-surface-variant);cursor:pointer}
  .tab.active{color:var(--primary);font-weight:500}
  .dot{width:24px;height:24px;border-radius:var(--r-full);background:currentColor;opacity:.35}
  .tab.active .dot{opacity:1}
  .safebottom{height:34px;flex:none;background:var(--surface-container)}
</style>
</head>
<body>
<div class="device" data-screen="payment-status" data-state="content" data-disposition="in_progress">

  <div class="statusbar"></div>
  <div class="appbar">
    <div class="iconbtn" data-nav-to="send-money" role="button" tabindex="0" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
    </div>
    <div class="title">Payment status</div>
  </div>

  <div class="scroll">
    <!-- in_progress: secondaryContainer + schedule icon + label. Never primaryContainer. -->
    <div class="chip" id="status_chip" aria-label="In progress">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm.5 5H11v6l5.2 3.1.8-1.3-4.5-2.6V7Z"/>
      </svg>
      In progress
    </div>

    <div class="card" id="payment_summary">
      <!-- amount is NEUTRAL and UNSIGNED — a payment amount is not a signed ledger movement -->
      <div class="pair"><span class="l">Amount</span><span class="amt">£850.00</span></div>
      <div class="pair"><span class="l">To</span><span class="v">Jameson Lettings</span></div>
      <div class="pair"><span class="l">Reference</span><span class="v">RENT-FLAT12</span></div>
      <div class="pair"><span class="l">From</span><span class="v">Current account ·· 3349</span></div>
      <div class="pair"><span class="l">Submitted</span><span class="v">30 Jul 2026, 10:44</span></div>
    </div>

    <!-- the invariant restated in words, so it is auditable by reading -->
    <p class="note" id="in_progress_note">Accepted by the bank. The money has not moved yet — this can
       take a few moments to settle.</p>

    <!-- hidden once terminal: a settled payment has nothing to refresh -->
    <div class="tonal" id="refresh_button" data-action="refresh_status"
         role="button" tabindex="0">Refresh</div>
  </div>

  <div class="navbar">
    <div class="tab" data-nav-to="home"><div class="dot"></div>Home</div>
    <div class="tab" data-nav-to="accounts"><div class="dot"></div>Accounts</div>
    <div class="tab active"><div class="dot"></div>Pay</div>
    <div class="tab" data-nav-to="settings"><div class="dot"></div>More</div>
  </div>
  <div class="safebottom"></div>
</div>
</body>
</html>
