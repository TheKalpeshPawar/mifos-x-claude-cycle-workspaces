appId: org.mifosx.openbanking
---
- launchApp
- openLink: "org.mifosx.openbanking://payment-status/PMT-812774903-01"

# The echoed Initiation is the substance of the screen.
- assertVisible: "£850.00"
- assertVisible: "Jameson Lettings"
- assertVisible: "RENT-FLAT12"

# An in-progress payment must read as in progress, never as sent.
- assertVisible:
    id: status_chip
- assertVisible:
    id: in_progress_note
- assertVisible:
    id: refresh_button

# Manual re-poll is reachable while the payment is still moving.
- tapOn:
    id: refresh_button
- assertVisible:
    id: status_chip

- tapOn:
    id: back_button
