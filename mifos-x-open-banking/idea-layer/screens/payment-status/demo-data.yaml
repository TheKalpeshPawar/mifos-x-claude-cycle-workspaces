error_fixtures:
  not_found:
    http_status: 400
    body:
      Code: "400"
      Id: "b81f4a02-6c35-4d97-a1e8-53c9f720be44"
      Message: "Bad Request"
      Errors:
        - ErrorCode: "U011"
          Message: "Resource cannot be found"

  rate_limited:
    http_status: 429
    headers:
      Retry-After: "12"
    body:
      Code: "429"
      Id: "5e0c9a37-8b14-42f6-90d3-7a2e1c6b04f9"
      Message: "Too Many Requests"
      Errors:
        - ErrorCode: "U002"
          Message: "Rate limit exceeded"

_test_fixtures:
  poll_stops_on_terminal:
    sequence: [payment_in_process, payment_in_process, payment_settled]
    expected_poll_count: 3
    expected_polls_after_settled: 0
  poll_never_starts_on_terminal:
    first_read: payment_settled
    expected_poll_count: 1
  unknown_status_fails_open:
    first_read: payment_unknown_status
    expected_disposition: in_progress
    expected_polling: true
  rejected_offers_new_payment:
    first_read: payment_rejected
    expected_visible: [new_payment_button]
    expected_hidden: [refresh_button]
