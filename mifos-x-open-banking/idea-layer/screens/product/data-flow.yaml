screen_id: product

on_mount:
  - trigger: product_load
    description: "Load product terms for the given accountId."
    steps:
      - call: product
        path_params:
          AccountId: "{accountId}"
        store_as: product
    on_loading: loading
    on_success: content
    on_error: error

on_user_action:
  - trigger: retry_load
    re_runs: [product_load]
