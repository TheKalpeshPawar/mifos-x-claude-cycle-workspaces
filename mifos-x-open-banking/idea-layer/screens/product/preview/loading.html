<!doctype html>
<!-- render-hash: 9c1d5b08e74a -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Product Terms — loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-secondary: #50606E;
      --md-on-secondary: #FFFFFF;
      --md-secondary-container: #D3E5F5;
      --md-on-secondary-container: #384956;
      --md-error: #BA1A1A;
      --md-on-error: #FFFFFF;
      --md-error-container: #FFDAD6;
      --md-on-error-container: #93000A;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-surface-variant: #DDE3EA;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low: #F1F4F9;
      --md-surface-container: #EBEEF3;
      --md-surface-container-high: #E5E8ED;
      --md-surface-container-highest: #E0E3E8;
      --font-body: 'Roboto', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }
    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9;
      --md-on-secondary: #22323F;
      --md-secondary-container: #384956;
      --md-on-secondary-container: #D3E5F5;
      --md-error: #FFB4AB;
      --md-on-error: #690005;
      --md-error-container: #93000A;
      --md-on-error-container: #FFDAD6;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-surface-variant: #41474D;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024;
      --md-surface-container-high: #262A2E;
      --md-surface-container-highest: #313539;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--md-background);
      color: var(--md-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Top App Bar ─────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--md-surface-container-low);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
      height: 64px;
      flex-shrink: 0;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
    }

    .top-app-bar-title {
      flex: 1;
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-on-surface);
      padding: 0 4px;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Loading centre ──────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 16px;
    }

    /* M3 circular progress — CSS-only spinner */
    .circular-progress {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid var(--md-primary-container);
      border-top-color: var(--md-primary);
      animation: spin 0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-label {
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      color: var(--md-on-surface-variant);
    }

    /* ── Shimmer skeleton blocks (structure-matching content) ───── */
    .skeleton-area {
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .skel {
      border-radius: 8px;
      background: linear-gradient(
        90deg,
        var(--md-surface-container) 25%,
        var(--md-surface-container-high) 50%,
        var(--md-surface-container) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    .skel-card {
      border-radius: 12px;
      height: 88px;
    }

    .skel-row {
      height: 20px;
      border-radius: 6px;
    }

    .skel-row--short { width: 40%; }
    .skel-row--medium { width: 60%; }
    .skel-row--long { width: 80%; }
    .skel-row--full { width: 100%; }

    .skeleton-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Bottom Navigation ───────────────────────────────────────── */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 10;
      background: var(--md-surface-container);
      display: flex;
      align-items: stretch;
      height: 80px;
      border-top: 1px solid var(--md-outline-variant);
      flex-shrink: 0;
    }

    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 8px 4px;
      color: var(--md-on-surface-variant);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 48px;
    }

    .bottom-nav-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      width: 64px;
      height: 32px;
    }

    .bottom-nav-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body data-screen="product" data-state="loading">

  <!-- Top App Bar -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn"
            aria-label="Navigate back to account detail"
            data-nav-to="account-detail">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar-title">Product Terms</h1>
  </header>

  <!-- Loading state: circular progress indicator + skeleton structure -->
  <main role="main" aria-busy="true" aria-label="Loading product terms">

    <!-- Circular progress indicator (OBReadProduct2 fetch in flight) -->
    <div class="circular-progress"
         data-component-type="progress_indicator"
         data-component-variant="circular"
         role="progressbar"
         aria-label="Loading product terms"
         aria-valuemin="0"
         aria-valuemax="100"></div>

    <span class="loading-label" aria-live="polite">Fetching product details…</span>

    <!-- Shimmer skeleton — mirrors content block structure -->
    <div class="skeleton-area" aria-hidden="true">

      <!-- Product header card skeleton -->
      <div class="skel skel-card"></div>

      <!-- Fees section skeleton -->
      <div class="skeleton-group">
        <div class="skel skel-row skel-row--short"></div>
        <div class="skel skel-row skel-row--full"></div>
      </div>

      <!-- Credit Interest section skeleton -->
      <div class="skeleton-group">
        <div class="skel skel-row skel-row--medium"></div>
        <div class="skel skel-row skel-row--full"></div>
        <div class="skel skel-row skel-row--full"></div>
      </div>

      <!-- Overdraft section skeleton -->
      <div class="skeleton-group">
        <div class="skel skel-row skel-row--short"></div>
        <div class="skel skel-row skel-row--long"></div>
        <div class="skel skel-row skel-row--long"></div>
      </div>

      <!-- Features section skeleton -->
      <div class="skeleton-group">
        <div class="skel skel-row skel-row--short"></div>
        <div class="skel skel-row skel-row--full"></div>
        <div class="skel skel-row skel-row--full"></div>
        <div class="skel skel-row skel-row--long"></div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation: Home · Accounts · Transactions · More (product is a pushed sub-screen of account-detail — no active tab) -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <button class="bottom-nav-item"
            aria-label="Home"
            data-nav-to="home">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav-label">Home</span>
    </button>
    <button class="bottom-nav-item"
            aria-label="Accounts"
            data-nav-to="accounts">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav-label">Accounts</span>
    </button>
    <button class="bottom-nav-item"
            aria-label="Transactions"
            data-nav-to="transactions">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav-label">Transactions</span>
    </button>
    <button class="bottom-nav-item"
            aria-label="More"
            data-nav-to="settings">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav-label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
