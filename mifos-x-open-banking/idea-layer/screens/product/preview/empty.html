<!doctype html>
<!-- render-hash: 3f7c20b49e51 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Product Terms — empty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-secondary: #50606E;
      --md-on-secondary: #FFFFFF;
      --md-secondary-container: #D3E5F5;
      --md-on-secondary-container: #384956;
      --md-error: #BA1A1A;
      --md-on-error: #FFFFFF;
      --md-error-container: #FFDAD6;
      --md-on-error-container: #93000A;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-surface-variant: #DDE3EA;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low: #F1F4F9;
      --md-surface-container: #EBEEF3;
      --md-surface-container-high: #E5E8ED;
      --md-surface-container-highest: #E0E3E8;
      --font-body: 'Roboto', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }
    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9;
      --md-on-secondary: #22323F;
      --md-secondary-container: #384956;
      --md-on-secondary-container: #D3E5F5;
      --md-error: #FFB4AB;
      --md-on-error: #690005;
      --md-error-container: #93000A;
      --md-on-error-container: #FFDAD6;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-surface-variant: #41474D;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024;
      --md-surface-container-high: #262A2E;
      --md-surface-container-highest: #313539;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--md-background);
      color: var(--md-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Top App Bar ─────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--md-surface-container-low);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
      height: 64px;
      flex-shrink: 0;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 150ms;
    }
    .icon-btn:hover  { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
    .icon-btn:active { background: color-mix(in srgb, var(--md-on-surface) 12%, transparent); }

    .top-app-bar-title {
      flex: 1;
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-on-surface);
      padding: 0 4px;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Main (centred empty state) ─────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 32px;
      text-align: center;
    }

    /* ── Empty state surface card ─────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: var(--md-surface-container);
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 320px;
    }

    .empty-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--md-secondary-container);
      margin-bottom: 4px;
    }

    .empty-icon .material-symbols-outlined {
      font-size: 36px;
      color: var(--md-on-secondary-container);
    }

    .empty-title {
      font-size: 20px;
      line-height: 28px;
      font-weight: 400;
      color: var(--md-on-surface);
    }

    .empty-body {
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      color: var(--md-on-surface-variant);
    }

    /* Context note (informational variant) */
    .info-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--md-primary-container);
      border-radius: 12px;
      padding: 12px;
      margin-top: 4px;
      text-align: left;
    }

    .info-note .material-symbols-outlined {
      font-size: 18px;
      color: var(--md-on-primary-container);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .info-note-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--md-on-primary-container);
    }

    /* ── Bottom Navigation ─────────────────────────────────────── */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 10;
      background: var(--md-surface-container);
      display: flex;
      align-items: stretch;
      height: 80px;
      border-top: 1px solid var(--md-outline-variant);
      flex-shrink: 0;
    }

    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 8px 4px;
      color: var(--md-on-surface-variant);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 48px;
    }

    .bottom-nav-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      width: 64px;
      height: 32px;
    }

    .bottom-nav-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body data-screen="product" data-state="empty">

  <!-- Top App Bar -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn"
            aria-label="Navigate back to account detail"
            data-nav-to="account-detail">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar-title">Product Terms</h1>
  </header>

  <!-- Empty state: OBReadProduct2 Data[] is empty or no OBProduct2 entry for account type -->
  <main role="main">
    <div class="empty-state"
         data-component-type="empty_state"
         data-component-id="empty_product_state"
         data-component-variant="informational"
         role="status"
         aria-label="No product information for this account">

      <!-- info_outline icon in secondary container circle -->
      <div class="empty-icon">
        <span class="material-symbols-outlined" aria-hidden="true">info</span>
      </div>

      <h2 class="empty-title">No product information</h2>
      <p class="empty-body">No product data is available for this account.</p>

      <!-- Informational note: explains GlobalMoney / non-PCA accounts -->
      <div class="info-note" role="note">
        <span class="material-symbols-outlined" aria-hidden="true">help_outline</span>
        <p class="info-note-text">
          Some account types — such as GlobalMoney, Savings, and Credit Card accounts —
          do not publish a product definition via UK Open Banking.
        </p>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation: Home · Accounts · Transactions · More (product is a pushed sub-screen of account-detail — no active tab) -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <button class="bottom-nav-item"
            aria-label="Home"
            data-nav-to="home">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav-label">Home</span>
    </button>
    <button class="bottom-nav-item"
            aria-label="Accounts"
            data-nav-to="accounts">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav-label">Accounts</span>
    </button>
    <button class="bottom-nav-item"
            aria-label="Transactions"
            data-nav-to="transactions">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav-label">Transactions</span>
    </button>
    <button class="bottom-nav-item"
            aria-label="More"
            data-nav-to="settings">
      <div class="bottom-nav-indicator">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav-label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
