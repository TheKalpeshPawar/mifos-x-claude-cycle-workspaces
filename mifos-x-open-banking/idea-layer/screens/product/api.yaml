screen_id: product

endpoints:
  - id: product
    method: GET
    path: "/accounts/{AccountId}/product"
    response_dto: OBReadProduct2
    permission: ReadProducts
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns the product (PCA or BCA) associated with the account, including fee tiers, credit interest bands, and overdraft terms."
