<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorising payment — checking</title>
<style>
  :root{--primary:#266489;--surface:#F7F9FF;--on-surface:#181C20;
        --on-surface-variant:#41474D;--r-full:9999px}
  @media (prefers-color-scheme:dark){
    :root{--primary:#95CDF7;--surface:#101417;--on-surface:#E0E3E8;--on-surface-variant:#C1C7CE}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--surface);color:var(--on-surface);
       font:16px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       display:flex;justify-content:center}
  .device{width:393px;min-height:852px;display:flex;flex-direction:column;background:var(--surface)}
  .statusbar{height:54px;flex:none}
  .appbar{height:56px;flex:none;display:flex;align-items:center;padding:0 16px}
  .title{font-size:22px}
  .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:16px;padding:24px;text-align:center}
  .spinner{width:48px;height:48px;border-radius:var(--r-full);
           border:4px solid color-mix(in srgb,var(--primary) 24%,transparent);
           border-top-color:var(--primary);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
  .detail{font-size:14px;color:var(--on-surface-variant)}
  .textbtn{padding:12px 16px;color:var(--primary);font-size:14px;font-weight:500;
           cursor:pointer;border-radius:var(--r-full)}
  .safebottom{height:34px;flex:none}
</style>
</head>
<body>
<!-- NO bottom nav and NO back arrow: the PSU is mid-authorisation on an irreversible
     action, and a tab tap would strand a staged consent. Only exits are abandon + completion. -->
<div class="device" data-screen="payment-consent" data-state="checking">
  <div class="statusbar"></div>
  <div class="appbar"><div class="title">Authorising payment</div></div>

  <div class="body">
    <div class="spinner" role="progressbar" aria-label="Checking with your bank"></div>
    <div class="detail" id="progress_detail">Checking with your bank…</div>

    <!--
      The poll here is LOAD-BEARING, not best-effort: submitting against a consent that is
      not Authorised returns 400 U009, so the screen does not hand back until AUTH is
      confirmed or the deadline passes. (The AIS consent-callback's poll IS best-effort,
      because a successful token exchange already proves authorisation there.)
      check_again is TEXT emphasis — the automatic backing-off poll is the primary mechanism.
    -->
    <div class="textbtn" id="check_again_button" data-action="check_again"
         role="button" tabindex="0">Check again</div>
  </div>

  <div class="safebottom"></div>
</div>
</body>
</html>
