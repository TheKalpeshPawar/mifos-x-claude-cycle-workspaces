<html lang="en">
<head>

<title>Authorising payment — error</title>
<style>
  :root{--primary:#266489;--on-primary:#FFFFFF;--surface:#F7F9FF;--on-surface:#181C20;
        --on-surface-variant:#41474D;--error:#BA1A1A;--r-full:9999px}

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--surface);color:var(--on-surface);
       font:16px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       display:flex;justify-content:center}
  .device{width:393px;min-height:852px;display:flex;flex-direction:column;background:var(--surface)}
  .statusbar{height:54px;flex:none}
  .appbar{height:56px;flex:none;display:flex;align-items:center;padding:0 16px}
  .title{font-size:22px}
  .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;

  .h{font-size:28px;line-height:36px}
  .p{font-size:14px;line-height:20px;color:var(--on-surface-variant);max-width:300px}

<body>
<div class="device" data-screen="payment-consent" data-state="error" data-error-type="CodeExpired">
  <div class="statusbar"></div>
  <div class="appbar"><div class="title">Authorising payment</div></div>

  <div class="body">
    <svg class="glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/>
    </svg>

    <h1 class="h">Authorisation didn't complete</h1>
    <p class="p">Your bank's response couldn't be verified.</p>

    <!--
      restart_authorisation is CONDITIONAL — shown only for the three types that left
      nothing submitted: CodeExpired, AuthorisationTimedOut, NetworkError.
      HIDDEN for:
        StateMismatch          — a SECURITY failure (possible replay/injection); never silently retried
        NoPendingAuthorisation — single-use pending auth is gone; nothing to resume
        ConsentRejected        — the PSU declined; re-prompting would override their decision
      This render shows the CodeExpired branch.
    -->
    <div class="cta" id="restart_authorisation_button" data-action="retry_authorisation"
         role="button" tabindex="0">Try again</div>

    <!-- abandon is shown in EVERY error case, including the three with no restart -->
    <div class="textbtn" id="abandon_button" data-action="abandon_payment"
         role="button" tabindex="0">Abandon payment</div>
  </div>

  <div class="safebottom"></div>
</div>
