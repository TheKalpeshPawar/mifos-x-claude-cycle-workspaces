sibling: flow
schema_version: "4.0"
feature_id: consent-expired
flow_ids:
  - account-access-consent
navigates_to:
  - consent-request
  - consent-intro
flow_logic:
  - decision: "Reconnect tapped?"
    condition: "ConsentExpiredAction.ReconnectClicked"
    true_path: consent-request
    false_path: consent-intro
    impl: "ConsentExpiredViewModel:onReconnect() clears the stale consent record then emits NavigateToConsentRequest; onDismiss() emits NavigateToConsentIntro"
journey_ids:
  - consumer-authentication
