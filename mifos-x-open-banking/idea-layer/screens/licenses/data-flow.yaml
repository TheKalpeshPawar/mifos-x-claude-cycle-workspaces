sibling: data-flow
schema_version: "4.0"
feature_id: licenses

# License data is static — bundled at build time via the Gradle license plugin
# (oss_licenses.json). No network endpoints are involved. Entries document the
# local-asset read that the LicensesRepository performs on first access.

entries:
  - screen_id: licenses
    trigger: on_mount
    endpoints: []
    direction: read
    transport: local_asset
    asset: "oss_licenses.json"
    dtos:
      - name: LibraryLicense
        role: response
        api_id: null
    produces_state: content
    error_paths:
      - error_code: asset_unreadable
        behavior: error_state
    notes: "Asset is bundled — error_state is defensive; should never fire in production"
