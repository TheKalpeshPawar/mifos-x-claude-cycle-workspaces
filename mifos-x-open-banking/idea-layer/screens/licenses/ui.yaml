responsive:
  mobile_only: true
  baseline_width: 390

states:
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - licenses_subtitle_text
      - licenses_list
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - licenses_loading_skeleton
    note: "Shimmer while license data loads from bundled asset"
  error:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components:
      - licenses_error_state
    note: "Shown if bundled license asset is unreadable"
  empty:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - licenses_subtitle_text
    show_empty_state: true
    empty_state_icon: "code_off"
    empty_state_title: "No licenses found"
    empty_state_message: "License data could not be parsed."
    note: "Should never occur in production — all 8 licenses are bundled"

state_model:
  LicensesViewModel:
    screen_state: LicensesUiState
    state:
      - field: licenses
        type: List<LibraryLicense>
        default: "emptyList()"
      - field: isLoading
        type: Boolean
        default: "true"
    errors:
      - id: load_failed
        message: "Failed to load open source license data."
    events: [OnBack, OnLicenseClicked]
    actions: [onLicenseClicked(licenseUrl: String)]
