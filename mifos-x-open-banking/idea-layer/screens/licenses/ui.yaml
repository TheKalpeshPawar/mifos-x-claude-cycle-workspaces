    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      margin_bottom: spacing.sm
    children:
      - lic_row_junit

  - type: list_item
    id: lic_row_junit
    variant: two_line
    supported_states: [idle]
    style: { padding_horizontal: spacing.md, padding_vertical: spacing.md }
    a11y: { role: text, label: "JUnit 4 by JUnit Team, EPL-1.0" }
    test_context: { purpose: "Static library row", interaction_type: display, data_driven: true }
    children: [lic_junit_name, lic_junit_author, lic_junit_url, lic_junit_badge]

  - type: text
    id: lic_junit_name
    content: "JUnit 4"
    variant: body_large
    style: { typography: "Outfit/body_large", color: "#1A1C16", font_weight: "500" }
    a11y: { role: text, label: "JUnit 4" }
    test_context: { purpose: "Library name", interaction_type: display, data_driven: true }

  - type: text
    id: lic_junit_author
    content: "JUnit Team"
    variant: body_small
    style: { typography: "Outfit/body_small", color: "#44483D" }
    a11y: { role: text, label: "Maintained by JUnit Team" }
    test_context: { purpose: "Library maintainer", interaction_type: display, data_driven: true }

  - type: text
    id: lic_junit_url
    content: "https://github.com/junit-team/junit4"
    variant: body_small
    style: { typography: "Outfit/body_small", color: "#4C662B" }
    a11y: { role: text, label: "Project URL" }
    test_context: { purpose: "Project URL plain text", interaction_type: display, data_driven: true }

  - type: badge
    id: lic_junit_badge
    content: "EPL-1.0"
    variant: tonal
    style: { background: "#CDEDA3", border_radius: "6dp", padding_horizontal: spacing.sm, padding_vertical: "3dp", text_color: "#4C662B", typography: "Outfit/label_small" }
    a11y: { role: text, label: "EPL-1.0 license" }
    test_context: { purpose: "License badge", interaction_type: display, data_driven: true }

  # ── Footer ────────────────────────────────────────────────────────────────────

  - type: text
    id: licenses_footer_text
    content: "Full license texts are available at each project's homepage. The Mifos Initiative thanks every maintainer and contributor whose work makes this app possible."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      padding_top: spacing.md
    a11y:
      role: text
      label: "Licenses footer acknowledgement"
    test_context:
      purpose: "Closing acknowledgement after the last license group"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - licenses_subtitle_text
      - licenses_app_license
      - licenses_group_apache_2_0
      - licenses_apache_card
      - licenses_group_mit
      - licenses_mit_card
      - licenses_group_mpl_2_0
      - licenses_mpl_card
      - licenses_group_epl_1_0
      - licenses_epl_card
      - licenses_footer_text

state_model:
  type: static_content
  note: "Static @Composable LicensesScreen(onBack, modifier). No ViewModel, no DI, no repository, no events. The library list is the compile-time constant OPEN_SOURCE_LIBRARIES (21 entries in OpenSourceLibrary.kt), grouped by license at render time via groupBy. Rows are non-interactive text (name + maintainer + URL as plain text + license badge); URLs are NOT tappable. No loading/error/empty states. Back navigation icon invokes the onBack lambda."

navigation:
  - id: nav_back
    target: about
    note: "Back navigation icon → onBack lambda"

dependencies:
  tier: feature
  features: [shared-core]
