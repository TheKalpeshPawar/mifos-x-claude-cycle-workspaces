  - type: text
    id: licenses_app_name
    content: "Mifos X Open Banking"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: "600"
    a11y:
      role: text
      label: "Mifos X Open Banking"
    test_context:
      purpose: "App name in its own license card"
      interaction_type: display
      data_driven: false

  - type: badge
    id: licenses_app_badge
    content: "MPL-2.0"
    variant: tonal
    style:
      background: "#CDEDA3"
      border_radius: "6dp"
      padding_horizontal: spacing.sm
      padding_vertical: "3dp"
      text_color: "#4C662B"
      typography: "Outfit/label_small"
