      data_driven: false

  - type: text
    id: licenses_app_note
    content: "Mifos X Open Banking is a free, open-source demo client maintained by the Mifos Initiative. The app is licensed under the Mozilla Public License 2.0 and is built from the openMF kmp-project-template. All accounts, transactions, and payments shown in the app come from the Open Bank Project sandbox and exist for demonstration purposes only."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_top: spacing.sm
    a11y:
      role: text
      label: "App license note"
    test_context:
      purpose: "Prose stating the app's own MPL-2.0 license and OBP sandbox provenance"
      interaction_type: display
      data_driven: false

