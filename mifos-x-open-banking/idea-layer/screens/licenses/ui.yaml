  - from: approved
    to: approved
    at: "2026-06-08T00:30:00Z"
    by: "/kmp-implement licenses (legal batch)"
    contract_version: "1.1.0"
    note: "Implemented in feature/legal: app-license card (MPL-2.0, Mifos Initiative, kmp-project-template origin, OBP data provenance) + library list grouped by license (Apache-2.0 / MIT / MPL-2.0 / EPL-1.0) with name, maintainer, URL and license badge per row. The 21-entry list was verified against gradle/libs.versions.toml and lives in a separate unit-testable file (OpenSourceLibrary.kt, OPEN_SOURCE_LIBRARIES) with 3 invariant tests (non-empty+complete fields, no duplicates, core stack acknowledged). Deviations: DataStore omitted (project uses Multiplatform Settings), per-row external link tap dropped (static screen — URL rendered as text), version numbers omitted (would rot against the catalog). Entry: Settings → Open Source Licenses."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.1.0"
    note: "SOURCE→SPEC reconciliation to shipped LicensesScreen.kt + OpenSourceLibrary.kt (static @Composable, compile-time OPEN_SOURCE_LIBRARIES list of 21 libs, no ViewModel). Replaced the flat 8-library tappable list with the shipped shape: subtitle prose, AppLicenseCard (app's own MPL-2.0 note), then libraries grouped by license with section headers (Apache-2.0 / MIT / MPL-2.0 / EPL-1.0), each row showing name + maintainer (author) + project URL + license badge, plus a closing footer. Removed: per-row open_external tap (rows are STATIC text, URL as plain text), per-library version numbers (omitted to avoid rot), loading skeleton, error state, empty state, LicensesViewModel state_model."

screens:
  - id: licenses
    name: "Open Source Licenses"
    route: /legal/licenses

archetype: index_list

shell:
  top_app_bar:
    show: true
    title: "Open Source Licenses"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: licenses_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - licenses_subtitle_text
      - licenses_app_license
      - licenses_group_apache_2_0
      - licenses_apache_card
      - licenses_group_mit
      - licenses_mit_card
      - licenses_group_mpl_2_0
      - licenses_mpl_card
      - licenses_group_epl_1_0
      - licenses_epl_card
      - licenses_footer_text

  - type: text
    id: licenses_subtitle_text
    content: "Mifos X Open Banking is built on these outstanding open-source libraries. Each entry lists the project, the team that maintains it, and the license it is distributed under."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_bottom: spacing.lg
    a11y:
      role: text
      label: "App is built on open source libraries"
    test_context:
      purpose: "Subtitle acknowledging OSS dependencies"
      interaction_type: display
      data_driven: false

  # ── App's own license card ────────────────────────────────────────────────────

  - type: card
    id: licenses_app_license
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
