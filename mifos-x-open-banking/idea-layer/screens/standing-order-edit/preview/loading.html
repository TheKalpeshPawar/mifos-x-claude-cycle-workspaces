<!doctype html>
<!-- render-hash: soe-loading-llm -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Standing Order — loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
      --secondary:#386663;--tertiary:#386663;--tertiary-container:#BCEBE7;
      --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
      --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
      --surface-variant:#E1E4D5;--on-surface-variant:#44483D;
      --surface-container:#F0F1E6;--surface-container-high:#EAECE1;
      --outline:#75796C;--outline-variant:#C5C8BA;--pending:#E8A317;
      --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
    }
    :root[data-theme="dark"] {
      --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
      --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
      --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
      --background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;
      --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
      --surface-container:#1E201A;--surface-container-high:#282A24;
      --outline:#8F9285;--outline-variant:#44483D;--pending:#E8A317;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
        --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
        --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
        --background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;
        --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
        --surface-container:#1E201A;--surface-container-high:#282A24;
        --outline:#8F9285;--outline-variant:#44483D;--pending:#E8A317;
      }
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;}
    .skip-link{position:absolute;left:-9999px;top:0;}
    .skip-link:focus{left:8px;top:8px;background:var(--primary);color:var(--on-primary);padding:8px 12px;border-radius:6px;z-index:200;}
    [data-shell="top-app-bar"]{position:sticky;top:0;z-index:10;display:flex;align-items:center;height:64px;padding:0 4px;background:var(--background);gap:4px;border-bottom:1px solid var(--outline-variant);}
    .bar-icon-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;min-width:44px;min-height:44px;border-radius:50%;border:none;background:transparent;color:var(--on-surface-variant);cursor:default;flex-shrink:0;opacity:.4;}
    .bar-icon-btn .material-symbols-outlined{font-size:var(--icon-md);}
    .bar-title{flex:1;font-size:18px;font-weight:500;color:var(--on-surface);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bar-spacer{width:48px;flex-shrink:0;}
    main{flex:1;display:flex;flex-direction:column;padding:24px 16px;}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    .shimmer{background:linear-gradient(90deg,var(--surface-container) 25%,var(--surface-variant) 50%,var(--surface-container) 75%);background-size:800px 100%;animation:shimmer 1.6s infinite linear;border-radius:8px;}
    .sk-card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.12);}
    .sk-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
    .sk-circle{width:40px;height:40px;border-radius:50%;flex-shrink:0;}
    .sk-lines{display:flex;flex-direction:column;gap:6px;flex:1;}
    .sk-line{height:14px;border-radius:6px;}
    .sk-label{height:10px;width:60px;border-radius:4px;margin-bottom:10px;}
    .sk-field{height:56px;border-radius:12px;margin-top:12px;}
    .sk-field:first-of-type{margin-top:16px;}
    .submit-panel{background:var(--surface);border-radius:20px;padding:32px 24px;margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
    .spinner-wrap{width:56px;height:56px;display:flex;align-items:center;justify-content:center;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:48px;height:48px;border:4px solid var(--surface-variant);border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;}
    .submit-title{font-size:18px;font-weight:600;color:var(--on-surface);text-align:center;}
    .submit-body{font-size:14px;color:var(--on-surface-variant);text-align:center;line-height:1.6;max-width:280px;}
    .submit-step{display:flex;align-items:center;gap:8px;background:var(--primary-container);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--on-primary-container);font-weight:500;width:100%;}
    .submit-step .material-symbols-outlined{font-size:var(--icon-sm);flex-shrink:0;}
    .submit-step-body{display:flex;flex-direction:column;gap:2px;}
    .step-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.7;}
  </style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div data-component-type="LayoutBox" data-component-id="soe_root" data-component-variant="column"
     data-screen-id="standing-order-edit" data-state="loading">

  <header data-shell="top-app-bar" role="banner">
    <button class="bar-icon-btn" type="button"
            aria-label="Back (disabled while saving)"
            data-component-type="icon_button" data-component-id="nav_back"
            disabled aria-disabled="true">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <span class="bar-title" role="heading" aria-level="1">Edit Standing Order</span>
    <div class="bar-spacer" aria-hidden="true"></div>
  </header>

  <main id="main-content" data-shell="content">

    <!-- Beneficiary skeleton -->
    <div class="sk-card" aria-hidden="true"
         data-component-type="card" data-component-id="soe_beneficiary_card" data-component-variant="filled">
      <div class="sk-label shimmer"></div>
      <div class="sk-row">
        <div class="sk-circle shimmer"></div>
        <div class="sk-lines">
          <div class="sk-line shimmer" style="width:52%"></div>
          <div class="sk-line shimmer" style="width:72%"></div>
        </div>
      </div>
    </div>

    <!-- Field skeletons -->
    <div class="sk-field shimmer" style="margin-top:16px" aria-hidden="true"
         data-component-type="input" data-component-id="soe_amount_input" data-component-variant="outlined"></div>
    <div class="sk-field shimmer" aria-hidden="true"
         data-component-type="input" data-component-id="soe_currency_selector" data-component-variant="outlined"></div>
    <div class="sk-field shimmer" aria-hidden="true"
         data-component-type="input" data-component-id="soe_frequency_selector" data-component-variant="outlined"></div>
    <div class="sk-field shimmer" aria-hidden="true"
         data-component-type="input" data-component-id="soe_start_date_input" data-component-variant="outlined"></div>
    <div class="sk-field shimmer" aria-hidden="true"
         data-component-type="input" data-component-id="soe_end_date_input" data-component-variant="outlined"></div>

    <!-- Submitting progress -->
    <div class="submit-panel"
         data-component-type="loading_indicator" data-component-id="soe_saving_indicator" data-component-variant="circular"
         role="status" aria-live="polite" aria-label="Saving your standing order changes">
      <div class="spinner-wrap">
        <div class="spinner"></div>
      </div>
      <div class="submit-title">Submitting consent…</div>
      <div class="submit-body">
        We are registering your updated standing order with your bank. You will be redirected to authorise the new payment instruction.
      </div>
      <div class="submit-step">
        <span class="material-symbols-outlined" aria-hidden="true">sync</span>
        <div class="submit-step-body">
          <span class="step-label">Step 1 of 3 — Creating replacement consent</span>
          <span>Consent ID: dsoc-edit-3a72f9c1-5e80</span>
        </div>
      </div>
    </div>

  </main>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
