<!doctype html>
<!-- render-hash: soe-loading-01 -->
<html lang="en" data-screen="standing-order-edit" data-state="loading" data-feature="standing-orders" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Standing Order — Saving</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --font-display: 'Outfit', system-ui, sans-serif;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --background: #F9FAEF; --on-surface: #1A1C16;
      --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --background: #12140E; --on-surface: #E3E3D8;
      --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --background: #12140E; --on-surface: #E3E3D8;
      --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-surface); display: flex; flex-direction: column; min-height: 100vh; }
    .top-bar { display: flex; align-items: center; gap: 8px; padding: 12px 8px; border-bottom: 1px solid var(--outline-variant); }
    .top-bar .back { width: 48px; height: 48px; border: 0; background: transparent; color: var(--outline); display: flex; align-items: center; justify-content: center; }
    .top-bar .back .material-symbols-outlined { font-size: 24px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; color: var(--on-surface); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 32px; gap: 16px; }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--outline-variant); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .saving-text { font-size: 14px; font-weight: 500; color: var(--on-surface-variant); }
  </style>
</head>
<body>
  <header class="top-bar" data-shell="top-app-bar">
    <button class="back" type="button" disabled aria-hidden="true">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 role="heading" aria-level="1">Edit Standing Order</h1>
  </header>

  <main role="status" aria-busy="true">
    <div class="spinner" data-component-type="loading_indicator" data-component-id="soe_saving_indicator" role="progressbar" aria-label="Saving your standing order changes"></div>
    <p class="saving-text">Saving your changes…</p>
  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
