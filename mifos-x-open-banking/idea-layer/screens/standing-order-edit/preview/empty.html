<!doctype html>
<!-- render-hash: soe-empty-llm -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Standing Order — empty</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
      --secondary:#386663;--tertiary:#386663;--tertiary-container:#BCEBE7;
      --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
      --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
      --surface-variant:#E1E4D5;--on-surface-variant:#44483D;
      --surface-container:#F0F1E6;--surface-container-high:#EAECE1;
      --outline:#75796C;--outline-variant:#C5C8BA;--pending:#E8A317;
      --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
    }
    :root[data-theme="dark"] {
      --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
      --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
      --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
      --background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;
      --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
      --surface-container:#1E201A;--surface-container-high:#282A24;
      --outline:#8F9285;--outline-variant:#44483D;--pending:#E8A317;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
        --secondary:#A0CFCB;--tertiary:#A0CFCB;--tertiary-container:#1F4E4B;
        --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
        --background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;
        --surface-variant:#44483D;--on-surface-variant:#C5C8BA;
        --surface-container:#1E201A;--surface-container-high:#282A24;
        --outline:#8F9285;--outline-variant:#44483D;--pending:#E8A317;
      }
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;}
    .skip-link{position:absolute;left:-9999px;top:0;}
    .skip-link:focus{left:8px;top:8px;background:var(--primary);color:var(--on-primary);padding:8px 12px;border-radius:6px;z-index:200;}
    [data-shell="top-app-bar"]{position:sticky;top:0;z-index:10;display:flex;align-items:center;height:64px;padding:0 4px;background:var(--background);gap:4px;border-bottom:1px solid var(--outline-variant);}
    .bar-icon-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;min-width:44px;min-height:44px;border-radius:50%;border:none;background:transparent;color:var(--primary);cursor:pointer;flex-shrink:0;}
    .bar-icon-btn:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);}
    .bar-icon-btn .material-symbols-outlined{font-size:var(--icon-md);}
    .bar-title{flex:1;font-size:18px;font-weight:500;color:var(--on-surface);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bar-spacer{width:48px;flex-shrink:0;}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
    .empty-illustration{width:120px;height:120px;margin-bottom:24px;}
    .empty-title{font-size:20px;font-weight:600;color:var(--on-surface);margin-bottom:10px;}
    .empty-body{font-size:14px;color:var(--on-surface-variant);line-height:1.65;max-width:280px;margin-bottom:32px;}
    .btn-filled{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 32px;border-radius:28px;border:none;background:var(--primary);color:var(--on-primary);font-family:'Outfit',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:.1px;transition:opacity .15s;}
    .btn-filled:hover{opacity:.92;}
    .btn-filled .material-symbols-outlined{font-size:var(--icon-md);}
    .btn-text{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:28px;border:none;background:transparent;color:var(--primary);font-family:'Outfit',system-ui,sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;}
    .btn-text:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);}
    .actions{display:flex;flex-direction:column;align-items:center;gap:4px;}
  </style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div data-component-type="LayoutBox" data-component-id="soe_root" data-component-variant="column"
     data-screen-id="standing-order-edit" data-state="empty">

  <header data-shell="top-app-bar" role="banner">
    <button class="bar-icon-btn" type="button"
            aria-label="Back to standing orders"
            data-component-type="icon_button" data-component-id="nav_back"
            data-nav-to="standing-order-detail">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <span class="bar-title" role="heading" aria-level="1">Edit Standing Order</span>
    <div class="bar-spacer" aria-hidden="true"></div>
  </header>

  <main id="main-content" data-shell="content">

    <!--
      ui.yaml declares: empty.not_applicable = true
      "Edit form — no list to be empty; standing order is always pre-loaded from navigation args."
      This state is a defensive fallback shown when the standing order could not be loaded
      (e.g. deep-link without navigation args, or the record was deleted before editing opened).
    -->

    <svg class="empty-illustration" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="No standing order available">
      <circle cx="60" cy="60" r="56" fill="var(--surface-container)" stroke="var(--outline-variant)" stroke-width="1.5"/>
      <rect x="30" y="38" width="60" height="10" rx="5" fill="var(--surface-variant)"/>
      <rect x="30" y="54" width="45" height="8" rx="4" fill="var(--surface-variant)"/>
      <rect x="30" y="68" width="35" height="8" rx="4" fill="var(--surface-variant)"/>
      <circle cx="60" cy="86" r="12" fill="var(--outline-variant)"/>
      <text x="60" y="91" text-anchor="middle" font-size="14" fill="var(--surface)" font-family="system-ui">?</text>
    </svg>

    <h2 class="empty-title"
        data-component-type="text" data-component-id="soe_empty_title">
      Standing order not found
    </h2>
    <p class="empty-body"
       data-component-type="text" data-component-id="soe_empty_body">
      We couldn't load the standing order you wanted to edit. It may have already been stopped, or the link you followed was incomplete.
    </p>

    <div class="actions"
         data-component-type="LayoutBox" data-component-id="soe_empty_actions" data-component-variant="column">
      <button class="btn-filled" type="button"
              data-component-type="button" data-component-id="soe_save_button" data-component-variant="filled"
              aria-label="Go back to your standing orders"
              data-nav-to="standing-order-detail">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        Back to Standing Orders
      </button>
      <button class="btn-text" type="button"
              data-component-type="button" data-component-id="soe_cancel_button" data-component-variant="text"
              aria-label="Discard changes and return to the standing order detail"
              data-nav-to="standing-order-detail">
        Cancel
      </button>
    </div>

  </main>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
