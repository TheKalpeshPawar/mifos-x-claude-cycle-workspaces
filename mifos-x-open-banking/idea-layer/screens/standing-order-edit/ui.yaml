sibling: ui
schema_version: "4.0"
feature_id: standing-order-edit
id: standing-order-edit
name: "Standing Order Edit"
feature: standing-orders
flavor: consumer
status: approved
quality_score: 94
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-006, standing-orders, payments, form, edit]
status_history:
  - status: draft
    timestamp: "2026-05-29T00:00:00Z"
    by: "/idea add"
  - from: draft
    to: enriched
    at: "2026-05-29"
    by: "/idea enrich"

screens:
  - id: standing-order-edit
    name: "Standing Order Edit"
    archetype: form
    route: /standing-orders/{standingOrderId}/edit
    viewmodel: "StandingOrderEditViewModel"

archetype: form

route:
  name: StandingOrderEditRoute
  params:
    standingOrderId: { type: String, required: true }
    accountId: { type: String, required: true }

shell:
  top_app_bar:
    show: true
    title: "Edit Standing Order"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions: []
  bottom_nav: false

components:
  - type: stack
    id: soe_root
    variant: column
    supported_states: [content, loading, error]
    style:
      background: "#F9FAEF"
      padding_horizontal: spacing.md
      padding_top: spacing.lg
    children:
      - soe_beneficiary_card
      - soe_amount_input
      - soe_currency_selector
      - soe_frequency_selector
      - soe_start_date_input
      - soe_end_date_input
      - soe_error_banner
      - soe_save_button
      - soe_cancel_button
      - soe_bottom_spacer

  # ── Beneficiary (read-only — immutable after creation) ────────────────────────

  - type: card
    id: soe_beneficiary_card
    variant: filled
    supported_states: [content]
    style:
      background: "#FFFFFF"
      border_radius: "16dp"
      padding: spacing.md
      margin_bottom: spacing.md
      elevation: "1dp"
    a11y:
      role: group
      label: "Paying to Landlord Holdings Ltd — recipient cannot be changed"
    children:
      - soe_beneficiary_header
      - soe_beneficiary_row

  - type: text
    id: soe_beneficiary_header
    content: "Paying To"
    variant: label_small
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
      letter_spacing: "0.8dp"
      padding_bottom: spacing.sm
      text_transform: uppercase
    a11y:
      role: text
      label: "Paying to section — read only"
    test_context:
      purpose: "Section label for the immutable beneficiary block"
      interaction_type: display
      data_driven: false

  - type: stack
    id: soe_beneficiary_row
    variant: row
    style:
      alignment: center_start
      spacing: spacing.sm
    children:
      - soe_beneficiary_icon
      - soe_beneficiary_info

  - type: icon
    id: soe_beneficiary_icon
    content: "account_balance"
    style:
      color: "#4C662B"
      size: "24dp"
    a11y:
      role: presentation
      label: ""
    test_context:
      purpose: "Bank icon beside the locked beneficiary name"
      interaction_type: display
      data_driven: false

  - type: stack
    id: soe_beneficiary_info
    variant: column
    style:
      spacing: "2dp"
    children:
      - soe_beneficiary_name
      - soe_beneficiary_iban

  - type: text
    id: soe_beneficiary_name
    content: "Landlord Holdings Ltd"
    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
      font_weight: "500"
    a11y:
      role: text
      label: "Recipient: Landlord Holdings Ltd"
    test_context:
      tag: soe_beneficiary_name
      purpose: "Read-only beneficiary name carried over from standing-order-detail"
      interaction_type: display
      data_driven: true

  - type: text
    id: soe_beneficiary_iban
    content: "GB29 NWBK 6016 1331 9268 19 · NatWest Bank"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      font_family: monospace
    a11y:
      role: text
      label: "IBAN GB29 NWBK 6016 1331 9268 19, NatWest Bank"
    test_context:
      purpose: "Read-only IBAN and bank for the locked beneficiary"
      interaction_type: display
      data_driven: true

  # ── Amount ────────────────────────────────────────────────────────────────────

  - type: input
    id: soe_amount_input
    label: "Amount"
    content: "1200.00"
    supported_states: [idle, hover, focus_visible, pressed, error]
    style:
      variant: outlined
      input_type: number
      placeholder: "0.00"
      border_radius: "12dp"
      prefix_text: "£"
      keyboard_type: decimal
      helper_text: "Amount taken on each payment date"
      margin_top: spacing.md
    on_click:
      action: edit_amount
      intent: form_field
    a11y:
      label: "Payment amount in pounds. Currently 1200.00"
      role: textbox
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: soe_amount_input
      purpose: "Editable amount field, pre-filled with the existing standing order amount"
      interaction_type: input
      data_driven: true

  # ── Currency (read-only — display only, GBP account) ──────────────────────────

  - type: input
    id: soe_currency_selector
    label: "Currency"
    content: "GBP — British Pound"
    supported_states: [idle, disabled]
    style:
      variant: outlined
      readonly: true
      trailing_icon: lock
      border_radius: "12dp"
      helper_text: "Matches the source account currency"
      margin_top: spacing.sm
    a11y:
      label: "Currency GBP British Pound — fixed to the account currency"
      role: text
    test_context:
      tag: soe_currency_selector
      purpose: "Currency is fixed to the source account (GBP); shown read-only for context"
      interaction_type: display
      data_driven: true

  # ── Frequency ─────────────────────────────────────────────────────────────────

  - type: input
    id: soe_frequency_selector
    label: "Frequency"
    content: "Monthly"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      variant: outlined
      trailing_icon: expand_more
      leading_icon: repeat
      border_radius: "12dp"
      helper_text: "How often the payment repeats"
      margin_top: spacing.sm
    on_click:
      action: select_frequency
      intent: picker
    a11y:
      label: "Payment frequency. Currently Monthly. Tap to choose Daily, Weekly, Monthly, or Yearly"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soe_frequency_selector
      purpose: "Opens a picker for DAILY, WEEKLY, MONTHLY, YEARLY — pre-selected to Monthly"
      interaction_type: action
      data_driven: true

  # ── Start Date ──────────────────────────────────────────────────────────────

  - type: input
    id: soe_start_date_input
    label: "Start Date"
    content: "1 Jan 2026"
    supported_states: [idle, hover, focus_visible, pressed, error]
    style:
      variant: outlined
      trailing_icon: calendar_today
      border_radius: "12dp"
      helper_text: "First date this payment runs"
      margin_top: spacing.sm
    on_click:
      action: pick_start_date
      intent: picker
    a11y:
      label: "Start date. Currently 1 January 2026. Tap to open the date picker"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soe_start_date_input
      purpose: "Opens a date picker for the schedule start date, pre-filled to 1 Jan 2026"
      interaction_type: action
      data_driven: true

  # ── End Date (optional / indefinite) ──────────────────────────────────────────

  - type: input
    id: soe_end_date_input
    label: "End Date (optional)"
    content: "Ongoing — no end date"
    supported_states: [idle, hover, focus_visible, pressed, error]
    style:
      variant: outlined
      trailing_icon: calendar_today
      border_radius: "12dp"
      helper_text: "Leave as Ongoing to run indefinitely"
      margin_top: spacing.sm
    on_click:
      action: pick_end_date
      intent: picker
    a11y:
      label: "End date. Currently Ongoing with no end date. Tap to set a final payment date"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: soe_end_date_input
      purpose: "Optional final date picker; defaults to Ongoing (null finalDate)"
      interaction_type: action
      data_driven: true

  # ── Inline Error Banner ─────────────────────────────────────────────────────

  - type: banner
    id: soe_error_banner
    content: "Couldn't save your changes. Check the amount and try again."
    variant: error
    supported_states: [error]
    visible_in_states: [error]
    style:
      background: "#FFDAD6"
      border_radius: "8dp"
      padding_horizontal: spacing.md
      padding_vertical: spacing.sm
      margin_top: spacing.md
      text_color: "#410002"
      leading_icon: error_outline
    a11y:
      role: alert
      live: assertive
      label: "Error: couldn't save your changes. Check the amount and try again."
    test_context:
      tag: soe_error_banner
      purpose: "Inline error surfaced when the PUT save call fails (400/409/network)"
      interaction_type: display
      data_driven: true

  # ── Save Button ───────────────────────────────────────────────────────────────

  - type: button
    id: soe_save_button
    label: "Save Changes"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled, loading]
    style:
      background: "#4C662B"
      text_color: "#FFFFFF"
      border_radius: "24dp"
      min_height: "56dp"
      width: fill
      margin_top: spacing.xl
      typography: "Outfit/label_large"
    on_click:
      action: save_standing_order
      intent: api
      target: authorise-handoff
      data:
        consentContext: recurring
        kind: recurring
    a11y:
      role: button
      label: "Save changes to this standing order"
    keyboard:
      focusable: true
    test_context:
      tag: soe_save_button
      purpose: "Submits the PUT update; shows spinner while saving, then returns to detail on success"
      interaction_type: action
      data_driven: false

  # ── Cancel Button ──────────────────────────────────────────────────────────────

  - type: button
    id: soe_cancel_button
    label: "Cancel"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      color: "#4C662B"
      typography: "Outfit/label_large"
      width: fill
      margin_top: spacing.sm
    on_click:
      action: navigate_back
      intent: target
      target: standing-order-detail
    a11y:
      role: button
      label: "Discard changes and return to the standing order detail"
    keyboard:
      focusable: true
    test_context:
      tag: soe_cancel_button
      purpose: "Discards edits and navigates back to standing-order-detail without saving"
      interaction_type: action
      data_driven: false

  # ── Bottom Spacer ───────────────────────────────────────────────────────────────

  - type: spacer
    id: soe_bottom_spacer
    style:
      height: "24dp"

  # ── Saving Overlay (loading state) ───────────────────────────────────────────

  - type: loading_indicator
    id: soe_saving_indicator
    variant: circular
    supported_states: [loading]
    style:
      color: "#4C662B"
      alignment: center
      padding: spacing.xl
    a11y:
      role: progressbar
      label: "Saving your standing order changes"
    test_context:
      tag: soe_saving_indicator
      purpose: "Circular progress shown while the PUT save request is in flight"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  content:
    layout:
      type: column
      scroll: vertical
      padding: spacing.md
    visible_components:
      - soe_beneficiary_card
      - soe_amount_input
      - soe_currency_selector
      - soe_frequency_selector
      - soe_start_date_input
      - soe_end_date_input
      - soe_save_button
      - soe_cancel_button
      - soe_bottom_spacer
    note: "Form pre-filled from the standing order passed in from standing-order-detail"
  loading:
    layout:
      type: column
      alignment: center
      padding: spacing.xl
    visible_components:
      - soe_saving_indicator
    note: "Save in progress — PUT request in flight; inputs disabled, save button shows spinner"
  error:
    layout:
      type: column
      scroll: vertical
      padding: spacing.md
    visible_components:
      - soe_beneficiary_card
      - soe_amount_input
      - soe_currency_selector
      - soe_frequency_selector
      - soe_start_date_input
      - soe_end_date_input
      - soe_error_banner
      - soe_save_button
      - soe_cancel_button
      - soe_bottom_spacer
    note: "Save failed — inline error banner shown above the buttons; form remains editable for retry"
  empty:
    not_applicable: true
    note: "Edit form — no list to be empty; standing order is always pre-loaded from navigation args"

state_model:
  StandingOrderEditViewModel:
    screen_state: StandingOrderEditUiState
    state:
      - field: standingOrderId
        type: String
        default: "\"\""
      - field: accountId
        type: String
        default: "\"\""
      - field: beneficiaryName
        type: String
        default: "\"\""
      - field: beneficiaryIban
        type: String
        default: "\"\""
      - field: amount
        type: BigDecimal
        default: "BigDecimal.ZERO"
        note: "serialized to Data.Initiation.FirstPaymentAmount.Amount (String) on the replacement consent"
      - field: currency
        type: String
        default: "\"GBP\""
        note: "Data.Initiation.FirstPaymentAmount.Currency"
      - field: frequency
        type: StandingOrderFrequency
        default: "StandingOrderFrequency.MONTHLY"
        note: "mapped to the OBIE Data.Initiation.Frequency schedule code (e.g. IntrvlWkDay:01:05)"
      - field: startDate
        type: LocalDate
        default: "LocalDate.now()"
        note: "Data.Initiation.FirstPaymentDateTime (ISO 8601)"
      - field: endDate
        type: "LocalDate?"
        default: "null"
        note: "no direct OBIE field — encode via Data.Initiation.NumberOfPayments or FinalPaymentDateTime if a bounded schedule is needed; ongoing when null"
      - field: replacementConsentId
        type: "String?"
        default: "null"
        note: "ConsentId from create_domestic_standing_order_consent; gates the authorise-redirect then create_domestic_standing_order submit"
      - field: amountError
        type: "String?"
        default: "null"
      - field: startDateError
        type: "String?"
        default: "null"
      - field: isSaving
        type: Boolean
        default: "false"
      - field: uiState
        type: StandingOrderEditUiState
        default: "StandingOrderEditUiState.Content"
    screen_state_members: [Content, Saving, Error]
    errors:
      - id: validation_amount
        message: "Enter an amount greater than £0.00."
      - id: validation_start_date
        message: "Start date can't be in the past."
      - id: save_failed
        message: "Couldn't save your changes. Check the amount and try again."
        note: "OB.Field.Invalid (400) on the replacement consent or order submit"
      - id: consent_not_authorised
        message: "We couldn't confirm your authorisation. Please try again."
        note: "consent Status came back Rejected / not Authorised (OB.Resource.InvalidConsentStatus, 403)"
      - id: network_error
        message: "Network unavailable. Please check your connection."
      - id: not_logged_in
        message: "Your session expired. Please sign in again."
        note: "UNAUTHORIZED (401)"
    events:
      - OnAmountChange
      - OnCurrencySelect
      - OnFrequencyChange
      - OnStartDateChange
      - OnEndDateChange
      - OnSave
      - OnCancel
      - NavigateBack
      - NavigateToDetail
    actions:
      - name: prefillForm
        param: standingOrderId
        triggers: [ScreenOpened]
      - name: onAmountChange
        param: amount
      - name: onFrequencyChange
        param: frequency
      - name: onStartDateChange
        param: startDate
      - name: onEndDateChange
        param: endDate
      - name: validateForm
      - name: saveStandingOrder
        triggers: [OnSave]
        note: "Create-replacement flow: create_domestic_standing_order_consent -> launch authorisation redirect -> get_domestic_standing_order_consent (confirm Authorised) -> create_domestic_standing_order. OBIE has no in-place update; the old order is not mutated and is stopped out of band."
      - name: cancelEdit
        triggers: [OnCancel]
    di:
      - StandingOrderRepository
      - AccountRepository

# api note: Rebound to OBIE PISP. OBIE has NO update-standing-order endpoint — a standing order is
# immutable once submitted. Save is a CREATE-REPLACEMENT flow: create_domestic_standing_order_consent
# (with the edited instruction) -> PSU authorises (redirect) -> get_domestic_standing_order_consent
# confirms Authorised -> create_domestic_standing_order submits it. The old order is NOT mutated in
# place; revoking it is out of band (no OBIE cancel-standing-order). Because this is a brand-new
# instruction, the beneficiary is no longer technically immutable, though the UI may still keep it
# locked. See api.yaml.
api:
  - id: create_domestic_standing_order_consent
    endpoint: "POST /obie/open-banking/v4.0/pisp/domestic-standing-order-consents"
    tag: StandingOrders
    auth: OAuth2-FAPI
    trigger: on_save_clicked
    description: "Step 1: register a new standing-order consent carrying the edited frequency / amount / first-payment date / creditor. Returns ConsentId in AwaitingAuthorisation."
    request:
      dto: OBWriteDomesticStandingOrderConsent5
      fields:
        - name: Data.Initiation.Frequency
          type: String
        - name: Data.Initiation.FirstPaymentDateTime
          type: String
        - name: Data.Initiation.FirstPaymentAmount.Amount
          type: String
        - name: Data.Initiation.FirstPaymentAmount.Currency
          type: String
        - name: Data.Initiation.CreditorAccount.Identification
          type: String
        - name: Data.Initiation.CreditorAccount.Name
          type: String
    response:
      dto: OBWriteDomesticStandingOrderConsentResponse6
      fields:
        - name: Data.ConsentId
          type: String
        - name: Data.Status
          type: String
  - id: get_domestic_standing_order_consent
    endpoint: "GET /obie/open-banking/v4.0/pisp/domestic-standing-order-consents/{ConsentId}"
    tag: StandingOrders
    auth: OAuth2-FAPI
    trigger: after_authorisation_redirect
    description: "Step 2: confirm Data.Status == Authorised before submitting."
    response:
      fields:
        - name: Data.ConsentId
          type: String
        - name: Data.Status
          type: String
  - id: create_domestic_standing_order
    endpoint: "POST /obie/open-banking/v4.0/pisp/domestic-standing-orders"
    tag: StandingOrders
    auth: OAuth2-FAPI
    trigger: on_consent_authorised
    description: "Step 3: submit the authorised replacement referencing the ConsentId; Data.Initiation must match the consent."
    response:
      dto: OBWriteDomesticStandingOrderResponse6
      fields:
        - name: Data.DomesticStandingOrderId
          type: String
        - name: Data.Status
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

unsupported_api:
  - id: update_standing_order
    reason: "OBIE has no in-place update-standing-order endpoint; replaced by the create-replacement consent flow above."
  - id: revoke_old_standing_order
    reason: "OBIE has no cancel/revoke-standing-order operation; stopping the superseded order is out of band (merchant / bank channel)."

navigation:
  - id: nav_back
    target: standing-order-detail
    on_click:
      action: navigate_back
  - id: nav_save_success
    target: standing-order-detail
    on_click:
      action: navigate
      intent: target
      note: "On successful PUT, pop back to standing-order-detail which reloads the updated record"

dependencies:
  tier: feature
  features: [standing-orders, standing-order-detail, accounts]
