sibling: tests
schema_version: "4.0"
feature_id: standing-order-edit
tests:
  - id: TC-SOE-001
    description: "Form pre-populates all fields from the existing standing order"
    type: ui
    priority: P0
    given: "User navigates from standing-order-detail with a valid standingOrderId (SO-2026-0001)"
    when: "Screen loads in the content state"
    then:
      - assert_tag: soe_amount_input
        assert_value: "1200.00"
      - assert_tag: soe_frequency_selector
        assert_text: "Monthly"
      - assert_tag: soe_start_date_input
        assert_text: "1 Jan 2026"
      - assert_tag: soe_beneficiary_name
        assert_text: "Landlord Holdings Ltd"

  - id: TC-SOE-002
    description: "Amount of zero or empty blocks save and shows a validation error"
    type: ui
    priority: P0
    given: "User clears the amount field"
    when: "User taps Save Changes"
    then:
      - assert_tag: soe_amount_input
        assert_error: "Enter an amount greater than £0.00."
      - assert_no_navigation: true

  - id: TC-SOE-003
    description: "Save shows the saving indicator while the PUT request is in flight"
    type: ui
    priority: P1
    given: "All required fields are valid"
    when: "User taps Save Changes"
    then:
      - assert_tag: soe_saving_indicator
        assert_visible: true
      - assert_tag: soe_save_button
        assert_state: loading

  - id: TC-SOE-004
    description: "Save success navigates back to standing-order-detail"
    type: ui
    priority: P0
    given: "All required fields are valid and the API returns 200"
    when: "User taps Save Changes"
    then:
      - assert_tag: soe_save_button
        interaction: tap
      - assert_navigation: standing-order-detail

  - id: TC-SOE-005
    description: "API error shows the inline error banner and keeps the form editable"
    type: ui
    priority: P0
    given: "API returns 400 INVALID_STANDING_ORDER_VALUES on save"
    when: "User taps Save Changes"
    then:
      - assert_tag: soe_error_banner
        assert_visible: true
        assert_text: "Couldn't save your changes. Check the amount and try again."
      - assert_no_navigation: true

  - id: TC-SOE-006
    description: "409 already-cancelled error is surfaced to the user"
    type: service
    priority: P1
    given: "Standing order was cancelled before save"
    when: "PUT returns 409 STANDING_ORDER_ALREADY_CANCELLED"
    then:
      - assert_error_message: "This standing order has been cancelled and can no longer be edited."

  - id: TC-SOE-007
    description: "Cancel button discards edits and returns to detail"
    type: ui
    priority: P1
    given: "User has unsaved edits"
    when: "User taps Cancel"
    then:
      - assert_navigation: standing-order-detail

  - id: TC-SOE-008
    description: "Back arrow discards changes and returns to detail"
    type: ui
    priority: P1
    given: "User has unsaved edits"
    when: "User taps the back arrow in the top app bar"
    then:
      - assert_navigation: standing-order-detail
coverage_target: 80
