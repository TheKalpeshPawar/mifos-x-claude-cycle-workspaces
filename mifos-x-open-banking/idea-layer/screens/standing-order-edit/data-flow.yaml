sibling: data-flow
schema_version: "4.0"
feature_id: standing-order-edit
entries:
  - screen_id: standing-order-edit
    trigger: on_interact
    event: OnSave
    endpoints:
      - create_domestic_standing_order_consent
      - get_domestic_standing_order_consent
      - create_domestic_standing_order
    direction: write
    dtos:
      - name: OBWriteDomesticStandingOrderConsent
        role: request
        api_id: create_domestic_standing_order_consent
      - name: OBWriteDomesticStandingOrderConsentResponse
        role: response
        api_id: create_domestic_standing_order_consent
      - name: OBWriteDomesticStandingOrder
        role: request
        api_id: create_domestic_standing_order
      - name: OBWriteDomesticStandingOrderResponse
        role: response
        api_id: create_domestic_standing_order
    produces_state: loading
    success_state: content
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 404
        behavior: error_state
    notes: >
      OBIE has no update-standing-order — save is create-replacement: POST consent ->
      PSU authorisation redirect -> GET consent (confirm Authorised) -> POST domestic-standing-order.
      On success pop back to standing-order-detail (which reloads). The old order is stopped out of band.

  - screen_id: standing-order-edit
    trigger: on_interact
    event: OnFrequencyChange
    endpoints: []
    direction: write
    dtos: []
    produces_state: content
    notes: "Client-side frequency picker; mutates form field, no network call"

  - screen_id: standing-order-edit
    trigger: on_interact
    event: OnStartDateChange
    endpoints: []
    direction: write
    dtos: []
    produces_state: content
    notes: "Client-side date picker for start_date; no network call"

  - screen_id: standing-order-edit
    trigger: on_interact
    event: OnEndDateChange
    endpoints: []
    direction: write
    dtos: []
    produces_state: content
    notes: "Client-side date picker for optional final_date; no network call"
