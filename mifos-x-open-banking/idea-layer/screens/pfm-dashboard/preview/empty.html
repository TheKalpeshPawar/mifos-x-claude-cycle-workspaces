<!doctype html>
<!-- render-hash: pfm-empty-01 -->
<html lang="en" data-screen="pfm-dashboard" data-state="empty" data-feature="pfm-dashboard" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spending Insights — Empty</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:24px;color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px 100px;text-align:center}
.empty-icon{width:96px;height:96px;border-radius:48px;background:var(--primary-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.empty-icon .material-icons{font-size:48px;color:var(--on-primary-container)}
.empty-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.empty-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:320px;margin-bottom:24px}
.cta-btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;padding:14px 28px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}.cta-btn .material-icons{font-size:20px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;position:relative}.nav-item .material-icons{font-size:22px;color:var(--on-surface-variant)}.nav-item .nav-label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#102000}.nav-item.active::before{content:'';position:absolute;top:6px;width:48px;height:28px;background:var(--nav-active);border-radius:14px;z-index:-1}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#CDEDA3}}</style>
</head>
<body><div class="top-bar"><span class="material-icons" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Spending Insights</h1></div><main><div class="empty-icon"><span class="material-icons">insights</span></div><h2 class="empty-title">No spending yet this month</h2><p class="empty-msg">Once you start spending, we'll show categories, trends, and budget progress here.</p><button class="cta-btn" data-nav-to="send-money" tabindex="0" aria-label="Make first transaction"><span class="material-icons">play_arrow</span>Make a payment</button></main>
<nav class="bottom-nav"><a class="nav-item" data-nav-to="home"><span class="material-icons">home</span><span class="nav-label">Home</span></a><a class="nav-item" data-nav-to="accounts"><span class="material-icons">account_balance</span><span class="nav-label">Accounts</span></a><a class="nav-item" data-nav-to="send-money"><span class="material-icons">send</span><span class="nav-label">Pay</span></a><a class="nav-item" data-nav-to="cards"><span class="material-icons">credit_card</span><span class="nav-label">Cards</span></a><a class="nav-item active"><span class="material-icons">analytics</span><span class="nav-label">More</span></a></nav>
<script src="../../preview/_shared/preview-runtime.js"></script></body></html>
