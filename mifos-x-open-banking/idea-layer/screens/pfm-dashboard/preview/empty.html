<!doctype html>
<!-- render-hash: pfm-empty-llm -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pfm-dashboard — empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B;
    --on-primary: #FFFFFF;
    --primary-container: #CDEDA3;
    --on-primary-container: #102000;
    --secondary: #386663;
    --tertiary: #386663;
    --tertiary-container: #BCEBE7;
    --error: #BA1A1A;
    --on-error: #FFFFFF;
    --error-container: #FFDAD6;
    --background: #F9FAEF;
    --on-background: #1A1C16;
    --surface: #FFFFFF;
    --on-surface: #1A1C16;
    --surface-variant: #E1E4D5;
    --on-surface-variant: #44483D;
    --surface-container: #F0F1E6;
    --surface-container-high: #EAECE1;
    --outline: #75796C;
    --outline-variant: #C5C8BA;
    --nav-active-indicator: #DCE7C8;
    --pending: #E8A317;
    --icon-xs: 16px;
    --icon-sm: 20px;
    --icon-md: 24px;
    --icon-lg: 32px;
    --icon-xl: 40px;
    --icon-2xl: 48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188;
    --on-primary: #1F3701;
    --primary-container: #354E16;
    --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB;
    --tertiary: #A0CFCB;
    --tertiary-container: #1F4E4B;
    --error: #FFB4AB;
    --on-error: #690005;
    --error-container: #93000A;
    --background: #12140E;
    --on-background: #E3E3D8;
    --surface: #1E201A;
    --on-surface: #E3E3D8;
    --surface-variant: #44483D;
    --on-surface-variant: #C5C8BA;
    --surface-container: #1E201A;
    --surface-container-high: #282A24;
    --outline: #8F9285;
    --outline-variant: #44483D;
    --nav-active-indicator: #354E16;
    --pending: #E8A317;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #B2D188;
      --on-primary: #1F3701;
      --primary-container: #354E16;
      --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB;
      --tertiary: #A0CFCB;
      --tertiary-container: #1F4E4B;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --background: #12140E;
      --on-background: #E3E3D8;
      --surface: #1E201A;
      --on-surface: #E3E3D8;
      --surface-variant: #44483D;
      --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A;
      --surface-container-high: #282A24;
      --outline: #8F9285;
      --outline-variant: #44483D;
      --nav-active-indicator: #354E16;
      --pending: #E8A317;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .top-app-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--background);
    border-bottom: 1px solid var(--outline-variant);
    display: flex;
    align-items: center;
    height: 64px;
    padding: 0 8px 0 4px;
    gap: 4px;
  }
  .nav-btn {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; cursor: pointer;
    border-radius: 50%;
    color: var(--on-surface);
    text-decoration: none;
    flex-shrink: 0;
  }
  .nav-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .bar-title {
    flex: 1;
    font-size: 22px;
    font-weight: 500;
    color: var(--on-surface);
    padding-left: 4px;
  }
  .action-btn {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; cursor: pointer;
    border-radius: 50%;
    color: var(--on-surface-variant);
    min-height: 44px;
  }
  .action-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-bottom: 80px;
  }
  .material-symbols-outlined {
    font-size: var(--icon-md);
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    user-select: none;
    vertical-align: middle;
  }
  .scope-chip-row { padding: 12px 20px 4px; }
  .scope-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-container);
    border: 1px solid var(--outline-variant);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--on-surface);
    min-height: 44px;
  }
  .scope-chip:hover { background: var(--surface-container-high); }
  .scope-chip .material-symbols-outlined { font-size: var(--icon-sm); }
  .period-selector {
    display: flex;
    gap: 8px;
    padding: 12px 20px 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .period-selector::-webkit-scrollbar { display: none; }
  .period-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    padding: 6px 16px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border: none;
    min-height: 44px;
    background: var(--surface-variant);
    color: var(--on-surface-variant);
  }
  .period-chip.selected { background: var(--primary-container); color: var(--on-primary-container); }
  .period-label {
    font-size: 13px;
    color: var(--on-surface-variant);
    padding: 0 20px 12px;
  }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
    text-align: center;
    gap: 16px;
  }
  .empty-icon-wrap {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--surface-container);
    border: 1px solid var(--outline-variant);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }
  .empty-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--on-surface);
    line-height: 1.3;
  }
  .empty-body {
    font-size: 14px;
    color: var(--on-surface-variant);
    line-height: 1.5;
    max-width: 280px;
  }
  nav[data-shell="bottom-nav"] {
    position: sticky;
    bottom: 0;
    margin-top: auto;
    z-index: 10;
    background: var(--surface-container);
    border-top: 1px solid var(--outline-variant);
    display: flex;
    justify-content: space-around;
    align-items: stretch;
    height: 64px;
  }
  nav[data-shell="bottom-nav"] a[data-nav-item] {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-decoration: none;
    color: var(--on-surface-variant);
    font-size: 11px;
    font-family: 'Outfit', sans-serif;
    padding: 8px 4px;
    min-height: 44px;
    cursor: pointer;
  }
  nav[data-shell="bottom-nav"] a[data-nav-item] .material-symbols-outlined {
    font-size: var(--icon-md);
    padding: 4px 16px;
    border-radius: 16px;
  }
  nav[data-shell="bottom-nav"] a[data-nav-item="nav_insights"] { color: var(--primary); }
  nav[data-shell="bottom-nav"] a[data-nav-item="nav_insights"] .material-symbols-outlined {
    background: var(--nav-active-indicator);
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body data-screen-id="pfm-dashboard" data-state="empty">

<header>
  <div class="top-app-bar" data-component-type="LayoutBox" data-component-id="top_app_bar">
    <a class="nav-btn" href="#" data-nav-to="home" aria-label="Back">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <span class="bar-title">Spending Insights</span>
    <button class="action-btn" data-action="open_pfm_settings" aria-label="PFM settings">
      <span class="material-symbols-outlined">tune</span>
    </button>
  </div>
</header>

<main>
  <div class="scope-chip-row" data-component-type="LayoutBox" data-component-id="scope_chip_row">
    <button class="scope-chip" data-component-type="chip" data-component-id="pfm_scope_chip" data-component-variant="assist" data-action="open_scope_picker" aria-label="Insights scope: All personal accounts, 3 accounts, GBP. Tap to choose insights scope.">
      All personal accounts · 3 accounts · GBP
      <span class="material-symbols-outlined">expand_more</span>
    </button>
  </div>

  <div class="period-selector" data-component-type="LayoutBox" data-component-id="period_selector_row" role="row" aria-label="Select reporting period">
    <button class="period-chip selected" data-component-type="chip" data-component-id="period_chip_this_month" data-component-variant="filter" data-action="select_period" aria-label="Filter by This Month, currently selected">This Month</button>
    <button class="period-chip" data-component-type="chip" data-component-id="period_chip_last_month" data-component-variant="filter" data-action="select_period" aria-label="Filter by Last Month">Last Month</button>
    <button class="period-chip" data-component-type="chip" data-component-id="period_chip_last_3_months" data-component-variant="filter" data-action="select_period" aria-label="Filter by Last 3 Months">Last 3 Months</button>
    <button class="period-chip" data-component-type="chip" data-component-id="period_chip_custom" data-component-variant="filter" data-action="open_custom_date_picker" aria-label="Select custom date range">Custom</button>
  </div>
  <p class="period-label" data-component-type="text" data-component-id="pfm_period_label" aria-label="Current reporting period: May 2026">May 2026</p>

  <!-- No activity empty state -->
  <div class="empty-state" data-component-type="box" data-component-id="no_activity_state" role="status" aria-label="No transaction history yet for the selected period and scope.">
    <div class="empty-icon-wrap">
      <svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"
           aria-label="No transactions" role="img">
        <path d="M14 6h20a2 2 0 0 1 2 2v32a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"
              fill="none" stroke="var(--outline)" stroke-width="2"/>
        <path d="M18 16h12M18 22h12M18 28h8"
              stroke="var(--outline)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="34" cy="34" r="8" fill="var(--surface-container)" stroke="var(--outline-variant)" stroke-width="1.5"/>
        <path d="M34 30v4l2.5 2.5" stroke="var(--on-surface-variant)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="empty-title" data-component-type="text" data-component-id="no_activity_title" role="heading" aria-label="No transaction history yet">No transaction history yet</p>
    <p class="empty-body" data-component-type="text" data-component-id="no_activity_body" aria-label="Your spending insights will appear once you have transactions in the selected period.">Your spending insights will appear once you have transactions in the selected period.</p>
  </div>
</main>

<nav data-shell="bottom-nav" data-shell-source="app-shell.yaml">
  <a data-nav-item="nav_home" data-nav-to="home" data-nav-selected="false" aria-label="Home">
    <span class="material-symbols-outlined">home</span>
    Home
  </a>
  <a data-nav-item="nav_accounts" data-nav-to="accounts" data-nav-selected="false" aria-label="Accounts">
    <span class="material-symbols-outlined">account_balance</span>
    Accounts
  </a>
  <a data-nav-item="nav_insights" data-nav-to="pfm-dashboard" data-nav-selected="true" aria-label="Insights, current screen">
    <span class="material-symbols-outlined">insights</span>
    Insights
  </a>
  <a data-nav-item="nav_more" data-nav-to="settings" data-nav-selected="false" aria-label="More">
    <span class="material-symbols-outlined">more_horiz</span>
    More
  </a>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
