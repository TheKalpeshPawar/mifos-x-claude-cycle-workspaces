<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Spending Insights – loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;--background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;--outline:#75796C;--outline-variant:#C5C8BA;--text-primary:#1A1C16;--text-secondary:#44483D;--tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;--nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--background);width:390px;min-height:844px;position:relative;overflow-x:hidden}
.top-bar{background:var(--surface);display:flex;align-items:center;padding:0 8px;height:56px;border-bottom:1px solid var(--surface-variant);position:sticky;top:0;z-index:10}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:transparent}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);font-family:var(--font);margin-left:4px}
.scroll-area{overflow-y:auto;padding-bottom:100px}
.page-title{font-size:28px;font-weight:700;color:var(--primary);padding:16px 20px 4px}
.chips-row{display:flex;gap:8px;padding:8px 20px 16px}
.chip{border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;font-family:var(--font)}
.chip.sel{background:var(--primary);color:var(--on-primary)}
.chip.unsel{background:var(--primary-container);color:var(--primary)}
.period-lbl{font-size:14px;color:var(--outline);padding:0 20px 16px}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear}
.skel-card{border-radius:20px;height:110px;margin:0 20px 20px}
.skel-bar{border-radius:6px;height:16px;margin:0 20px 12px}
.skel-bar-sm{border-radius:4px;height:12px;margin:0 20px 8px;width:60%}
nav[data-shell="bottom-nav"]{position:absolute;bottom:0;left:0;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--surface-variant);display:flex;align-items:center;justify-content:space-around;z-index:20}
.nav-tab{width:80px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 0}
.nav-pill{width:64px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.nav-pill.active{background:var(--nav-active)}
.nav-lbl{font-size:11px;font-weight:500;color:var(--outline)}
.nav-tab.active .nav-lbl{color:var(--primary)}
</style>
</head>
<body>
<main data-screen="pfm-dashboard" data-state="loading" role="main">

  <header class="top-bar" role="banner">
    <button class="top-bar-back" aria-label="Back" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" style="fill:var(--text-primary)"/></svg>
    </button>
    <span class="top-bar-title">Spending Insights</span>
  </header>

  <div class="scroll-area">
    <h1 class="page-title" data-component-type="text" data-component-id="pfm_title">Spending Insights</h1>

    <div class="chips-row" aria-label="Period selector" role="group">
      <button class="chip sel" disabled>This Month</button>
      <button class="chip unsel" disabled>Last Month</button>
      <button class="chip unsel" disabled>Last 3 Months</button>
      <button class="chip unsel" disabled>Custom</button>
    </div>
    <p class="period-lbl" data-component-type="text" data-component-id="pfm_period_label">May 2026</p>

    <!-- skeleton cards -->
    <div class="skel skel-card" role="presentation" aria-hidden="true"></div>
    <div class="skel skel-bar" role="presentation" aria-hidden="true"></div>
    <div class="skel skel-bar-sm" role="presentation" aria-hidden="true"></div>
    <div class="skel skel-card" style="height:140px" role="presentation" aria-hidden="true"></div>
    <div class="skel skel-bar" role="presentation" aria-hidden="true"></div>
    <div class="skel skel-card" style="height:80px" role="presentation" aria-hidden="true"></div>
    <div class="skel skel-card" style="height:80px" role="presentation" aria-hidden="true"></div>
    <div class="skel skel-card" style="height:80px" role="presentation" aria-hidden="true"></div>

    <div role="status" aria-live="polite" style="position:absolute;left:-9999px">Loading spending insights…</div>
  </div>

  <nav data-shell="bottom-nav" aria-label="Main navigation">
    <div class="nav-tab" data-nav-to="home" aria-label="Home">
      <div class="nav-pill"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" style="fill:var(--outline)"/></svg></div>
      <span class="nav-lbl">Home</span>
    </div>
    <div class="nav-tab" data-nav-to="accounts" aria-label="Accounts">
      <div class="nav-pill"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zM11.5 1L2 6v2h19V6l-9.5-5z" style="fill:var(--outline)"/></svg></div>
      <span class="nav-lbl">Accounts</span>
    </div>
    <div class="nav-tab active" aria-label="Insights" aria-current="page">
      <div class="nav-pill active"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" style="fill:var(--primary)"/></svg></div>
      <span class="nav-lbl" style="color:var(--primary)">Insights</span>
    </div>
    <div class="nav-tab" data-nav-to="cards" aria-label="Cards">
      <div class="nav-pill"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z" style="fill:var(--outline)"/></svg></div>
      <span class="nav-lbl">Cards</span>
    </div>
    <div class="nav-tab" data-nav-to="more" aria-label="More">
      <div class="nav-pill"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" style="fill:var(--outline)"/></svg></div>
      <span class="nav-lbl">More</span>
    </div>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
