<!doctype html>
<!-- render-hash: pfm-loading-4tabnav-20260630 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Finances — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
  :root {
    --md-primary: #266489;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #C9E6FF;
    --md-on-primary-container: #004B6F;
    --md-secondary: #50606E;
    --md-on-secondary: #FFFFFF;
    --md-secondary-container: #D3E5F5;
    --md-on-secondary-container: #384956;
    --md-error: #BA1A1A;
    --md-on-error: #FFFFFF;
    --md-background: #F7F9FF;
    --md-on-background: #181C20;
    --md-surface: #F7F9FF;
    --md-on-surface: #181C20;
    --md-surface-variant: #DDE3EA;
    --md-on-surface-variant: #41474D;
    --md-outline: #72787E;
    --md-outline-variant: #C1C7CE;
    --md-surface-container-lowest: #FFFFFF;
    --md-surface-container-low: #F1F4F9;
    --md-surface-container: #EBEEF3;
    --md-surface-container-high: #E5E8ED;
    --md-surface-container-highest: #E0E3E8;
    --shimmer-base: #E5E8ED;
    --shimmer-highlight: #F1F4F9;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px;
    --t-title-lg-size: 22px; --t-title-lg-line: 28px; --t-title-md-weight: 500;
    --t-label-sm-size: 11px; --t-label-sm-weight: 500; --t-body-sm-line: 16px;
    --dur-short: 150ms; --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    --bottom-nav-h: 80px; --screen-pad: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --md-primary: #95CDF7; --md-on-primary: #00344E;
      --md-primary-container: #004B6F; --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9; --md-on-secondary: #22323F;
      --md-secondary-container: #384956; --md-on-secondary-container: #D3E5F5;
      --md-error: #FFB4AB; --md-on-error: #690005;
      --md-background: #101417; --md-on-background: #E0E3E8;
      --md-surface: #101417; --md-on-surface: #E0E3E8;
      --md-surface-variant: #41474D; --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198; --md-outline-variant: #41474D;
      --md-surface-container-lowest: #0B0F12; --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024; --md-surface-container-high: #262A2E;
      --md-surface-container-highest: #313539;
      --shimmer-base: #262A2E; --shimmer-highlight: #313539;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', sans-serif;
    background: var(--md-background);
    color: var(--md-on-surface);
    min-height: 100dvh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  /* Top App Bar — back-arrow variant (not a root destination) */
  .top-bar {
    background: var(--md-surface);
    border-bottom: 1px solid var(--md-outline-variant);
    height: 64px;
    display: flex; align-items: center;
    padding: 0 var(--sp-sm) 0 var(--sp-xs);
    position: sticky; top: 0; z-index: 20; flex-shrink: 0; gap: var(--sp-xs);
  }
  .top-bar__back {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: var(--r-full);
    color: var(--md-on-surface); cursor: pointer; text-decoration: none;
    flex-shrink: 0;
  }
  .top-bar__back:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
  .top-bar__title {
    font-size: var(--t-title-lg-size); line-height: var(--t-title-lg-line);
    font-weight: var(--t-title-md-weight); color: var(--md-on-surface);
  }
  /* Scrollable body */
  .screen-scroll {
    flex: 1; overflow-y: auto;
    padding: var(--sp-lg) var(--screen-pad);
    padding-bottom: calc(var(--bottom-nav-h) + var(--sp-lg));
    display: flex; flex-direction: column; gap: var(--sp-md);
  }
  /* Shimmer */
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position:  200% center; }
  }
  .shimmer {
    background: linear-gradient(90deg, var(--shimmer-base) 25%, var(--shimmer-highlight) 50%, var(--shimmer-base) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
    border-radius: var(--r-sm);
  }
  .skel-card {
    border-radius: var(--r-md); overflow: hidden;
    display: flex; flex-direction: column; gap: var(--sp-sm);
    padding: var(--sp-lg); background: var(--md-surface-container-low);
  }
  .skel-line { height: 14px; border-radius: var(--r-sm); }
  .skel-line--wide  { width: 55%; } .skel-line--full { width: 100%; }
  .skel-line--med   { width: 38%; } .skel-line--short { width: 28%; }
  .skel-amount { height: 40px; width: 65%; border-radius: var(--r-sm); margin-top: var(--sp-xs); }
  .skel-divider { height: 1px; width: 100%; background: var(--md-outline-variant); margin: var(--sp-xs) 0; }
  .skel-row { display: flex; align-items: center; justify-content: space-between; height: 14px; }
  .skel-row .skel-line { margin: 0; }
  .skel-seg { height: 40px; border-radius: var(--r-full); width: 100%; }
  .skel-section-hdr { height: 14px; width: 28%; border-radius: var(--r-sm); margin-top: var(--sp-xs); }
  .skel-chart-card {
    border-radius: var(--r-md); overflow: hidden; padding: var(--sp-lg);
    background: var(--md-surface-container-low);
    display: flex; flex-direction: column; gap: var(--sp-md); height: 160px;
  }
  .skel-bars { display: flex; align-items: flex-end; justify-content: center; gap: var(--sp-xl); flex: 1; }
  .skel-bar-col { display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs); flex: 0 0 80px; height: 100%; }
  .skel-bar { flex: 1; width: 100%; border-radius: var(--r-sm) var(--r-sm) 0 0; }
  .skel-bar--short { flex: 0 0 60%; }
  .skel-bar-lbl { height: 12px; width: 36px; border-radius: var(--r-xs); }
  .skel-net { height: 14px; width: 50%; align-self: center; border-radius: var(--r-sm); }
  .skel-cat-list { display: flex; flex-direction: column; gap: var(--sp-sm); }
  .skel-cat-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); height: 44px; }
  .skel-cat-icon { width: 20px; height: 20px; border-radius: var(--r-full); flex-shrink: 0; }
  .skel-cat-info { flex: 1; display: flex; flex-direction: column; gap: var(--sp-xs); }
  .skel-cat-name { height: 14px; width: 55%; border-radius: var(--r-xs); }
  .skel-cat-sub  { height: 11px; width: 35%; border-radius: var(--r-xs); }
  .skel-cat-amt  { width: 56px; height: 14px; border-radius: var(--r-xs); flex-shrink: 0; }
  /* Bottom nav — no active tab */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bottom-nav-h);
    background: var(--md-surface-container);
    border-top: 1px solid var(--md-outline-variant);
    display: flex; align-items: flex-start;
    padding-top: var(--sp-xs);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 30;
  }
  .bn-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs);
    cursor: pointer; color: var(--md-on-surface-variant);
    text-decoration: none; padding: var(--sp-xs); min-height: 48px;
  }
  .bn-indicator {
    border-radius: var(--r-full); padding: 4px 18px;
    display: flex; align-items: center; justify-content: center;
    min-width: 64px; height: 32px;
  }
  .bn-icon { font-size: 24px; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .bn-label { font-size: var(--t-label-sm-size); font-weight: var(--t-label-sm-weight); line-height: var(--t-body-sm-line); letter-spacing: .5px; }
</style>
</head>
<body>

<!-- Top App Bar — back arrow, pfm-dashboard is not a root destination -->
<header class="top-bar" role="banner">
  <a class="top-bar__back" href="#" data-nav-to="home" aria-label="Navigate back">
    <span class="material-symbols-rounded" style="font-size:24px" aria-hidden="true">arrow_back</span>
  </a>
  <h1 class="top-bar__title">My Finances</h1>
</header>

<!-- Loading shimmer -->
<main class="screen-scroll" data-screen="pfm-dashboard" data-state="loading"
      aria-label="Loading your finances" aria-busy="true">

  <!-- Net-worth card shimmer -->
  <div class="skel-card" aria-hidden="true">
    <div class="skel-line skel-line--short shimmer"></div>
    <div class="skel-amount shimmer"></div>
    <div class="skel-line skel-line--med shimmer"></div>
    <div class="skel-divider"></div>
    <div class="skel-row"><div class="skel-line skel-line--wide shimmer"></div><div class="skel-line skel-line--short shimmer"></div></div>
    <div class="skel-row"><div class="skel-line skel-line--wide shimmer"></div><div class="skel-line skel-line--short shimmer"></div></div>
    <div class="skel-row"><div class="skel-line skel-line--wide shimmer"></div><div class="skel-line skel-line--short shimmer"></div></div>
  </div>

  <!-- Period selector shimmer -->
  <div aria-hidden="true">
    <div class="skel-seg shimmer"></div>
    <div class="skel-section-hdr shimmer" style="margin-top:12px"></div>
  </div>

  <!-- Bar chart shimmer -->
  <div class="skel-chart-card" aria-hidden="true">
    <div class="skel-bars">
      <div class="skel-bar-col"><div class="skel-bar shimmer"></div><div class="skel-bar-lbl shimmer"></div></div>
      <div class="skel-bar-col"><div class="skel-bar skel-bar--short shimmer"></div><div class="skel-bar-lbl shimmer"></div></div>
    </div>
    <div style="display:flex;justify-content:center"><div class="skel-net shimmer"></div></div>
  </div>

  <!-- Categories header shimmer -->
  <div aria-hidden="true"><div class="skel-section-hdr shimmer"></div></div>

  <!-- Category rows shimmer -->
  <div class="skel-cat-list" aria-hidden="true">
    <div class="skel-cat-row">
      <div class="skel-cat-icon shimmer"></div>
      <div class="skel-cat-info"><div class="skel-cat-name shimmer"></div><div class="skel-cat-sub shimmer"></div></div>
      <div class="skel-cat-amt shimmer"></div>
    </div>
    <div class="skel-cat-row">
      <div class="skel-cat-icon shimmer"></div>
      <div class="skel-cat-info"><div class="skel-cat-name shimmer" style="width:45%"></div><div class="skel-cat-sub shimmer" style="width:28%"></div></div>
      <div class="skel-cat-amt shimmer"></div>
    </div>
    <div class="skel-cat-row">
      <div class="skel-cat-icon shimmer"></div>
      <div class="skel-cat-info"><div class="skel-cat-name shimmer" style="width:38%"></div><div class="skel-cat-sub shimmer" style="width:30%"></div></div>
      <div class="skel-cat-amt shimmer"></div>
    </div>
  </div>
</main>

<!-- Bottom Navigation — Home · Accounts · Transactions · More (no active tab) -->
<nav class="bottom-nav" aria-label="Main navigation">
  <a class="bn-item" href="#" data-nav-to="home" aria-label="Home">
    <div class="bn-indicator">
      <span class="material-symbols-rounded bn-icon" aria-hidden="true">home</span>
    </div>
    <span class="bn-label">Home</span>
  </a>
  <a class="bn-item" href="#" data-nav-to="accounts" aria-label="Accounts">
    <div class="bn-indicator">
      <span class="material-symbols-rounded bn-icon" aria-hidden="true">account_balance</span>
    </div>
    <span class="bn-label">Accounts</span>
  </a>
  <a class="bn-item" href="#" data-nav-to="transactions" aria-label="Transactions">
    <div class="bn-indicator">
      <span class="material-symbols-rounded bn-icon" aria-hidden="true">receipt_long</span>
    </div>
    <span class="bn-label">Transactions</span>
  </a>
  <a class="bn-item" href="#" data-nav-to="settings" aria-label="More">
    <div class="bn-indicator">
      <span class="material-symbols-rounded bn-icon" aria-hidden="true">more_horiz</span>
    </div>
    <span class="bn-label">More</span>
  </a>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
