<!doctype html>
<!-- render-hash: pfm-loading-llm -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pfm-dashboard — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B;
    --on-primary: #FFFFFF;
    --primary-container: #CDEDA3;
    --on-primary-container: #102000;
    --secondary: #386663;
    --tertiary: #386663;
    --tertiary-container: #BCEBE7;
    --error: #BA1A1A;
    --on-error: #FFFFFF;
    --error-container: #FFDAD6;
    --background: #F9FAEF;
    --on-background: #1A1C16;
    --surface: #FFFFFF;
    --on-surface: #1A1C16;
    --surface-variant: #E1E4D5;
    --on-surface-variant: #44483D;
    --surface-container: #F0F1E6;
    --surface-container-high: #EAECE1;
    --outline: #75796C;
    --outline-variant: #C5C8BA;
    --nav-active-indicator: #DCE7C8;
    --pending: #E8A317;
    --icon-xs: 16px;
    --icon-sm: 20px;
    --icon-md: 24px;
    --shimmer-base: #E1E4D5;
    --shimmer-highlight: #F0F1E6;
  }
  [data-theme="dark"] {
    --primary: #B2D188;
    --on-primary: #1F3701;
    --primary-container: #354E16;
    --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB;
    --tertiary: #A0CFCB;
    --tertiary-container: #1F4E4B;
    --error: #FFB4AB;
    --on-error: #690005;
    --error-container: #93000A;
    --background: #12140E;
    --on-background: #E3E3D8;
    --surface: #1E201A;
    --on-surface: #E3E3D8;
    --surface-variant: #44483D;
    --on-surface-variant: #C5C8BA;
    --surface-container: #1E201A;
    --surface-container-high: #282A24;
    --outline: #8F9285;
    --outline-variant: #44483D;
    --nav-active-indicator: #354E16;
    --pending: #E8A317;
    --shimmer-base: #282A24;
    --shimmer-highlight: #333530;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #B2D188;
      --on-primary: #1F3701;
      --primary-container: #354E16;
      --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB;
      --tertiary: #A0CFCB;
      --tertiary-container: #1F4E4B;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --background: #12140E;
      --on-background: #E3E3D8;
      --surface: #1E201A;
      --on-surface: #E3E3D8;
      --surface-variant: #44483D;
      --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A;
      --surface-container-high: #282A24;
      --outline: #8F9285;
      --outline-variant: #44483D;
      --nav-active-indicator: #354E16;
      --pending: #E8A317;
      --shimmer-base: #282A24;
      --shimmer-highlight: #333530;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .top-app-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--background);
    border-bottom: 1px solid var(--outline-variant);
    display: flex;
    align-items: center;
    height: 64px;
    padding: 0 8px 0 4px;
    gap: 4px;
  }
  .nav-btn {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; cursor: pointer;
    border-radius: 50%;
    color: var(--on-surface);
    text-decoration: none;
    flex-shrink: 0;
  }
  .bar-title {
    flex: 1;
    font-size: 22px;
    font-weight: 500;
    color: var(--on-surface);
    padding-left: 4px;
  }
  .action-btn {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; cursor: pointer;
    border-radius: 50%;
    color: var(--on-surface-variant);
    min-height: 44px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-bottom: 80px;
  }
  .material-symbols-outlined {
    font-size: var(--icon-md);
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    user-select: none;
    vertical-align: middle;
  }
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .shimmer {
    background: linear-gradient(90deg, var(--shimmer-base) 25%, var(--shimmer-highlight) 50%, var(--shimmer-base) 75%);
    background-size: 800px 100%;
    animation: shimmer 1.6s infinite linear;
    border-radius: 6px;
  }
  .scope-chip-row { padding: 12px 20px 4px; }
  .scope-chip-skeleton { height: 40px; width: 260px; border-radius: 999px; }
  .period-selector {
    display: flex;
    gap: 8px;
    padding: 12px 20px 8px;
    overflow-x: hidden;
  }
  .period-chip-skeleton { height: 36px; border-radius: 20px; flex-shrink: 0; }
  .period-label-skeleton { height: 16px; width: 80px; margin: 0 20px 16px; border-radius: 4px; }
  .card-skeleton {
    margin: 0 20px 16px;
    border-radius: 12px;
    border: 1px solid var(--outline-variant);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--surface-container);
  }
  .sk-line { height: 14px; border-radius: 4px; }
  .sk-line-sm { height: 11px; border-radius: 4px; }
  .sk-line-lg { height: 20px; border-radius: 4px; }
  .sk-summary-row { display: flex; gap: 8px; }
  .sk-summary-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .sk-progress { height: 8px; border-radius: 4px; }
  .sk-donut-section { display: flex; gap: 16px; align-items: center; }
  .sk-donut-circle { width: 140px; height: 140px; border-radius: 50%; flex-shrink: 0; }
  .sk-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sk-legend-row { display: flex; align-items: center; gap: 8px; }
  .sk-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sk-budget-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--outline-variant); }
  .sk-budget-row:last-child { border-bottom: none; }
  .sk-budget-header { display: flex; justify-content: space-between; gap: 8px; }
  .sk-merchant-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--outline-variant); }
  .sk-merchant-row:last-child { border-bottom: none; }
  .sk-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .sk-merchant-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .section-label-skeleton { height: 16px; width: 160px; margin: 4px 20px 10px; border-radius: 4px; }
  nav[data-shell="bottom-nav"] {
    position: sticky;
    bottom: 0;
    margin-top: auto;
    z-index: 10;
    background: var(--surface-container);
    border-top: 1px solid var(--outline-variant);
    display: flex;
    justify-content: space-around;
    align-items: stretch;
    height: 64px;
  }
  nav[data-shell="bottom-nav"] a[data-nav-item] {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-decoration: none;
    color: var(--on-surface-variant);
    font-size: 11px;
    font-family: 'Outfit', sans-serif;
    padding: 8px 4px;
    min-height: 44px;
    cursor: pointer;
  }
  nav[data-shell="bottom-nav"] a[data-nav-item] .material-symbols-outlined {
    font-size: var(--icon-md);
    padding: 4px 16px;
    border-radius: 16px;
  }
  nav[data-shell="bottom-nav"] a[data-nav-item="nav_insights"] { color: var(--primary); }
  nav[data-shell="bottom-nav"] a[data-nav-item="nav_insights"] .material-symbols-outlined {
    background: var(--nav-active-indicator);
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body data-screen-id="pfm-dashboard" data-state="loading">

<header>
  <div class="top-app-bar" data-component-type="LayoutBox" data-component-id="top_app_bar">
    <a class="nav-btn" href="#" data-nav-to="home" aria-label="Back">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <span class="bar-title">Spending Insights</span>
    <button class="action-btn" data-action="open_pfm_settings" aria-label="PFM settings">
      <span class="material-symbols-outlined">tune</span>
    </button>
  </div>
</header>

<main aria-busy="true" aria-label="Loading spending insights">

  <div class="scope-chip-row" data-component-type="LayoutBox" data-component-id="scope_chip_row">
    <div class="scope-chip-skeleton shimmer" data-component-type="chip" data-component-id="pfm_scope_chip" role="presentation" aria-hidden="true"></div>
  </div>

  <div class="period-selector" data-component-type="LayoutBox" data-component-id="period_selector_row" role="presentation" aria-hidden="true">
    <div class="period-chip-skeleton shimmer" style="width:95px;"></div>
    <div class="period-chip-skeleton shimmer" style="width:100px;"></div>
    <div class="period-chip-skeleton shimmer" style="width:110px;"></div>
    <div class="period-chip-skeleton shimmer" style="width:75px;"></div>
  </div>
  <div class="period-label-skeleton shimmer" data-component-type="text" data-component-id="pfm_period_label" role="presentation" aria-hidden="true"></div>

  <!-- Summary card skeleton -->
  <div class="card-skeleton" data-component-type="box" data-component-id="pfm_summary_card" role="presentation" aria-hidden="true">
    <div class="sk-line shimmer" style="width:80px;"></div>
    <div class="sk-summary-row" data-component-type="LayoutBox" data-component-id="summary_metrics_row">
      <div class="sk-summary-col">
        <div class="sk-line-sm shimmer" style="width:60px;"></div>
        <div class="sk-line-lg shimmer" style="width:80px; margin-top:4px;"></div>
      </div>
      <div class="sk-summary-col">
        <div class="sk-line-sm shimmer" style="width:55px;"></div>
        <div class="sk-line-lg shimmer" style="width:80px; margin-top:4px;"></div>
      </div>
      <div class="sk-summary-col">
        <div class="sk-line-sm shimmer" style="width:30px;"></div>
        <div class="sk-line-lg shimmer" style="width:80px; margin-top:4px;"></div>
      </div>
    </div>
  </div>

  <!-- Monthly budget card skeleton -->
  <div class="card-skeleton" data-component-type="box" data-component-id="overall_budget_card" role="presentation" aria-hidden="true">
    <div style="display:flex;justify-content:space-between;">
      <div class="sk-line shimmer" style="width:120px;"></div>
      <div class="sk-line shimmer" style="width:60px;"></div>
    </div>
    <div style="display:flex;justify-content:space-between;">
      <div class="sk-line shimmer" style="width:90px;"></div>
      <div class="sk-line shimmer" style="width:70px;"></div>
    </div>
    <div class="sk-progress shimmer"></div>
    <div class="sk-line-sm shimmer" style="width:200px;"></div>
  </div>

  <!-- Spending by Category skeleton -->
  <div class="section-label-skeleton shimmer" data-component-type="text" data-component-id="category_section_label" role="presentation" aria-hidden="true"></div>
  <div class="card-skeleton" data-component-type="box" data-component-id="category_card" role="presentation" aria-hidden="true">
    <div class="sk-donut-section">
      <div class="sk-donut-circle shimmer" data-component-type="chart" data-component-id="category_donut_chart"></div>
      <div class="sk-legend" data-component-type="list" data-component-id="category_legend_list">
        <div class="sk-legend-row" data-component-type="list_item" data-component-id="category_legend_row"><div class="sk-dot shimmer"></div><div class="sk-line shimmer" style="flex:1;"></div><div class="sk-line shimmer" style="width:48px;"></div></div>
        <div class="sk-legend-row" data-component-type="list_item" data-component-id="category_legend_row"><div class="sk-dot shimmer"></div><div class="sk-line shimmer" style="flex:1;"></div><div class="sk-line shimmer" style="width:48px;"></div></div>
        <div class="sk-legend-row" data-component-type="list_item" data-component-id="category_legend_row"><div class="sk-dot shimmer"></div><div class="sk-line shimmer" style="flex:1;"></div><div class="sk-line shimmer" style="width:48px;"></div></div>
        <div class="sk-legend-row" data-component-type="list_item" data-component-id="category_legend_row"><div class="sk-dot shimmer"></div><div class="sk-line shimmer" style="flex:1;"></div><div class="sk-line shimmer" style="width:48px;"></div></div>
        <div class="sk-legend-row" data-component-type="list_item" data-component-id="category_legend_row"><div class="sk-dot shimmer"></div><div class="sk-line shimmer" style="flex:1;"></div><div class="sk-line shimmer" style="width:48px;"></div></div>
        <div class="sk-legend-row" data-component-type="list_item" data-component-id="category_legend_row"><div class="sk-dot shimmer"></div><div class="sk-line shimmer" style="flex:1;"></div><div class="sk-line shimmer" style="width:48px;"></div></div>
      </div>
    </div>
  </div>

  <!-- Budget Progress skeleton -->
  <div class="section-label-skeleton shimmer" data-component-type="text" data-component-id="budgets_section_label" role="presentation" aria-hidden="true"></div>
  <div class="card-skeleton" style="padding:6px 16px;" data-component-type="box" data-component-id="budget_rows_card" role="presentation" aria-hidden="true">
    <div data-component-type="list" data-component-id="budget_rows_list">
      <div class="sk-budget-row" data-component-type="list_item" data-component-id="budget_progress_row">
        <div class="sk-budget-header"><div class="sk-line shimmer" style="width:80px;"></div><div class="sk-line shimmer" style="width:100px;"></div></div>
        <div class="sk-progress shimmer" style="height:4px;border-radius:2px;"></div>
      </div>
      <div class="sk-budget-row" data-component-type="list_item" data-component-id="budget_progress_row">
        <div class="sk-budget-header"><div class="sk-line shimmer" style="width:80px;"></div><div class="sk-line shimmer" style="width:100px;"></div></div>
        <div class="sk-progress shimmer" style="height:4px;border-radius:2px;"></div>
      </div>
      <div class="sk-budget-row" data-component-type="list_item" data-component-id="budget_progress_row">
        <div class="sk-budget-header"><div class="sk-line shimmer" style="width:80px;"></div><div class="sk-line shimmer" style="width:100px;"></div></div>
        <div class="sk-progress shimmer" style="height:4px;border-radius:2px;"></div>
      </div>
      <div class="sk-budget-row" data-component-type="list_item" data-component-id="budget_progress_row">
        <div class="sk-budget-header"><div class="sk-line shimmer" style="width:70px;"></div><div class="sk-line shimmer" style="width:90px;"></div></div>
        <div class="sk-progress shimmer" style="height:4px;border-radius:2px;"></div>
      </div>
    </div>
  </div>

  <!-- Top Merchants skeleton -->
  <div class="section-label-skeleton shimmer" data-component-type="text" data-component-id="merchants_section_label" role="presentation" aria-hidden="true"></div>
  <div class="card-skeleton" style="padding:6px 16px;" data-component-type="box" data-component-id="merchants_card" role="presentation" aria-hidden="true">
    <div data-component-type="list" data-component-id="merchants_list">
      <div class="sk-merchant-row" data-component-type="list_item" data-component-id="merchant_row">
        <div class="sk-avatar shimmer"></div>
        <div class="sk-merchant-info"><div class="sk-line shimmer" style="width:100px;"></div><div class="sk-line-sm shimmer" style="width:70px;"></div></div>
        <div class="sk-line shimmer" style="width:55px;"></div>
      </div>
      <div class="sk-merchant-row" data-component-type="list_item" data-component-id="merchant_row">
        <div class="sk-avatar shimmer"></div>
        <div class="sk-merchant-info"><div class="sk-line shimmer" style="width:100px;"></div><div class="sk-line-sm shimmer" style="width:70px;"></div></div>
        <div class="sk-line shimmer" style="width:55px;"></div>
      </div>
      <div class="sk-merchant-row" data-component-type="list_item" data-component-id="merchant_row">
        <div class="sk-avatar shimmer"></div>
        <div class="sk-merchant-info"><div class="sk-line shimmer" style="width:100px;"></div><div class="sk-line-sm shimmer" style="width:70px;"></div></div>
        <div class="sk-line shimmer" style="width:55px;"></div>
      </div>
      <div class="sk-merchant-row" data-component-type="list_item" data-component-id="merchant_row">
        <div class="sk-avatar shimmer"></div>
        <div class="sk-merchant-info"><div class="sk-line shimmer" style="width:100px;"></div><div class="sk-line-sm shimmer" style="width:70px;"></div></div>
        <div class="sk-line shimmer" style="width:55px;"></div>
      </div>
      <div class="sk-merchant-row" data-component-type="list_item" data-component-id="merchant_row">
        <div class="sk-avatar shimmer"></div>
        <div class="sk-merchant-info"><div class="sk-line shimmer" style="width:100px;"></div><div class="sk-line-sm shimmer" style="width:70px;"></div></div>
        <div class="sk-line shimmer" style="width:55px;"></div>
      </div>
    </div>
  </div>

</main>

<nav data-shell="bottom-nav" data-shell-source="app-shell.yaml">
  <a data-nav-item="nav_home" data-nav-to="home" data-nav-selected="false" aria-label="Home">
    <span class="material-symbols-outlined">home</span>
    Home
  </a>
  <a data-nav-item="nav_accounts" data-nav-to="accounts" data-nav-selected="false" aria-label="Accounts">
    <span class="material-symbols-outlined">account_balance</span>
    Accounts
  </a>
  <a data-nav-item="nav_insights" data-nav-to="pfm-dashboard" data-nav-selected="true" aria-label="Insights, current screen">

    Insights
  </a>
  <a data-nav-item="nav_more" data-nav-to="settings" data-nav-selected="false" aria-label="More">
    <span class="material-symbols-outlined">more_horiz</span>
    More
  </a>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
