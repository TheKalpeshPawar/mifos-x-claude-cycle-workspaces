<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:96px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.chip-skel{display:flex;gap:8px;padding:0 20px 16px}.chip-skel .c{height:32px;width:80px;border-radius:999px}
.hero-skel{margin:0 20px 16px;height:200px;border-radius:20px;background:linear-gradient(120deg,rgba(205,237,163,0.5) 0%,rgba(249,250,239,0.5) 100%);animation:pulse 1.5s ease-in-out infinite}
.title-skel{height:12px;width:120px;margin:14px 20px 10px}
.budget-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 20px 12px;padding:16px;display:flex;flex-direction:column;gap:10px}.budget-skel .head{display:flex;justify-content:space-between}.budget-skel .l1{height:14px;width:50%}.budget-skel .l2{height:14px;width:60px}.budget-skel .bar{height:8px;border-radius:4px}.budget-skel .detail{height:11px;width:80%}
.cat-block-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 20px 12px;padding:8px 0}.cat-row-skel{display:flex;align-items:center;gap:14px;padding:10px 16px}.cat-row-skel .dot{width:12px;height:12px;border-radius:6px}.cat-row-skel .info{flex:1;display:flex;flex-direction:column;gap:6px}.cat-row-skel .name{height:13px;width:50%}.cat-row-skel .pct{height:10px;width:25%}.cat-row-skel .bar{width:80px;height:6px;border-radius:3px}.cat-row-skel .amount{height:14px;width:60px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}.nav-item .material-icons{font-size:var(--icon-sm);color:var(--on-surface-variant)}.nav-item .nav-label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#102000}.nav-item.active::before{content:'';position:absolute;top:6px;width:48px;height:28px;background:var(--nav-active);border-radius:14px;z-index:-1}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--nav-active:#354E16}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--nav-active:#354E16}.hero-skel{background:linear-gradient(120deg,#354E16 0%,#1E201A 100%)}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#CDEDA3}}</style>
</head>
