<!doctype html>
<!-- render-hash: pfm-error-4tabnav-20260630 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Finances — error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
  :root {
    --md-primary: #266489; --md-on-primary: #FFFFFF;
    --md-primary-container: #C9E6FF; --md-on-primary-container: #004B6F;
    --md-secondary: #50606E;
    --md-error: #BA1A1A; --md-on-error: #FFFFFF;
    --md-error-container: #FFDAD6; --md-on-error-container: #93000A;
    --md-background: #F7F9FF; --md-on-background: #181C20;
    --md-surface: #F7F9FF; --md-on-surface: #181C20;
    --md-surface-variant: #DDE3EA; --md-on-surface-variant: #41474D;
    --md-outline: #72787E; --md-outline-variant: #C1C7CE;
    --md-surface-container-lowest: #FFFFFF; --md-surface-container-low: #F1F4F9;
    --md-surface-container: #EBEEF3; --md-surface-container-high: #E5E8ED;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px;
    --t-title-lg-size: 22px; --t-title-lg-line: 28px; --t-title-md-weight: 500;
    --t-body-md-size: 14px; --t-label-sm-size: 11px; --t-label-sm-weight: 500;
    --t-body-sm-line: 16px; --t-headline-sm: 24px; --t-label-lg: 14px;
    --bottom-nav-h: 80px; --screen-pad: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --md-primary: #95CDF7; --md-on-primary: #00344E;
      --md-primary-container: #004B6F; --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9;
      --md-error: #FFB4AB; --md-on-error: #690005;
      --md-error-container: #93000A; --md-on-error-container: #FFDAD6;
      --md-background: #101417; --md-on-background: #E0E3E8;
      --md-surface: #101417; --md-on-surface: #E0E3E8;
      --md-surface-variant: #41474D; --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198; --md-outline-variant: #41474D;
      --md-surface-container-lowest: #0B0F12; --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024; --md-surface-container-high: #262A2E;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', sans-serif; background: var(--md-background);
    color: var(--md-on-surface); min-height: 100dvh;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  .top-bar {
    background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant);
    height: 64px; display: flex; align-items: center;
    padding: 0 var(--sp-sm) 0 var(--sp-xs);
    position: sticky; top: 0; z-index: 20; flex-shrink: 0; gap: var(--sp-xs);
  }
  .top-bar__back {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: var(--r-full);
    color: var(--md-on-surface); cursor: pointer; text-decoration: none; flex-shrink: 0;
  }
  .top-bar__back:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
  .top-bar__title { font-size: var(--t-title-lg-size); line-height: var(--t-title-lg-line); font-weight: var(--t-title-md-weight); color: var(--md-on-surface); }
  .screen-scroll {
    flex: 1; overflow-y: auto; padding: var(--sp-lg) var(--screen-pad);
    padding-bottom: calc(var(--bottom-nav-h) + var(--sp-xl));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-lg);
  }
  /* Error state */
  .error-state {
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-lg);
    padding: var(--sp-xl) var(--sp-lg); text-align: center; max-width: 320px;
  }
  .error-icon-wrap {
    width: 80px; height: 80px; border-radius: var(--r-full);
    background: var(--md-error-container);
    display: flex; align-items: center; justify-content: center;
  }
  .error-icon { font-size: 40px; color: var(--md-on-error-container); font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48; }
  .error-title { font-size: var(--t-headline-sm); font-weight: 400; color: var(--md-on-surface); line-height: 32px; }
  .error-body  { font-size: var(--t-body-md-size); color: var(--md-on-surface-variant); line-height: 20px; }
  /* Filled button (retry) */
  .btn-filled {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--md-primary); color: var(--md-on-primary);
    font-family: 'Roboto', sans-serif; font-size: var(--t-label-lg); font-weight: 500;
    border: none; border-radius: var(--r-full); padding: 10px 24px; min-height: 40px;
    cursor: pointer; text-decoration: none; transition: opacity .15s;
  }
  .btn-filled:hover { opacity: .9; }
  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-h); background: var(--md-surface-container); border-top: 1px solid var(--md-outline-variant); display: flex; align-items: flex-start; padding-top: var(--sp-xs); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 30; }
  .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs); cursor: pointer; color: var(--md-on-surface-variant); text-decoration: none; padding: var(--sp-xs); min-height: 48px; }
  .bn-indicator { border-radius: var(--r-full); padding: 4px 18px; display: flex; align-items: center; justify-content: center; min-width: 64px; height: 32px; }
  .bn-icon { font-size: 24px; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .bn-label { font-size: var(--t-label-sm-size); font-weight: var(--t-label-sm-weight); line-height: var(--t-body-sm-line); letter-spacing: .5px; }
</style>
</head>
<body>

<!-- Top App Bar — back arrow -->
<header class="top-bar" role="banner">
  <a class="top-bar__back" href="#" data-nav-to="home" aria-label="Navigate back">
    <span class="material-symbols-rounded" style="font-size:24px" aria-hidden="true">arrow_back</span>
  </a>
  <h1 class="top-bar__title">My Finances</h1>
</header>

<!-- Error state — computation failure -->
<main class="screen-scroll" data-screen="pfm-dashboard" data-state="error"
      aria-label="Error loading finances. Tap to retry.">
  <div class="error-state" role="alert">
    <div class="error-icon-wrap" aria-hidden="true">
      <span class="material-symbols-rounded error-icon">warning_amber</span>
    </div>
    <h2 class="error-title">Could not load finances</h2>
    <p class="error-body">An error occurred computing your financial overview.</p>
    <button class="btn-filled" data-action="reload_finances"
            aria-label="Try again to reload finances">
      Try again
    </button>
  </div>
</main>

<!-- Bottom Navigation — Home · Accounts · Transactions · More (no active tab) -->
<nav class="bottom-nav" aria-label="Main navigation">
  <a class="bn-item" href="#" data-nav-to="home" aria-label="Home">
    <div class="bn-indicator"><span class="material-symbols-rounded bn-icon" aria-hidden="true">home</span></div>
    <span class="bn-label">Home</span>
  </a>
  <a class="bn-item" href="#" data-nav-to="accounts" aria-label="Accounts">
    <div class="bn-indicator"><span class="material-symbols-rounded bn-icon" aria-hidden="true">account_balance</span></div>
    <span class="bn-label">Accounts</span>
  </a>
  <a class="bn-item" href="#" data-nav-to="transactions" aria-label="Transactions">
    <div class="bn-indicator"><span class="material-symbols-rounded bn-icon" aria-hidden="true">receipt_long</span></div>
    <span class="bn-label">Transactions</span>
  </a>
  <a class="bn-item" href="#" data-nav-to="settings" aria-label="More">
    <div class="bn-indicator"><span class="material-symbols-rounded bn-icon" aria-hidden="true">more_horiz</span></div>
    <span class="bn-label">More</span>
  </a>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
