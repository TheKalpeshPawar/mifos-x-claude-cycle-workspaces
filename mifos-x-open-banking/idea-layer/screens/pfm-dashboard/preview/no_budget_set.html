<!doctype html>
<html lang="en" data-screen="pfm-dashboard" data-state="no_budget_set" data-feature="pfm-dashboard" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spending Insights — No Budget</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; padding-bottom: 72px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; }
    .banner { background: var(--primary-container); border-radius: 12px; margin: 12px 20px; padding: 20px; text-align: center; }
    .banner-icon .material-icons { font-size: 40px; color: var(--primary); margin-bottom: 12px; }
    .banner-title { font-size: 18px; font-weight: 700; color: var(--on-primary-container); margin-bottom: 8px; }
    .banner-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 16px; line-height: 1.5; }
    .set-budget-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 12px 32px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
    .section-title { font-size: 14px; font-weight: 700; padding: 16px 20px 8px; }
    .category-row { display: flex; align-items: center; gap: 12px; padding: 10px 20px; } .cat-dot { width: 12px; height: 12px; border-radius: 6px; flex-shrink: 0; } .cat-name { flex: 1; font-size: 13px; } .cat-amount { font-size: 13px; font-weight: 600; }
    nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 8px 0 12px; } .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 12px; border-radius: 16px; min-width: 56px; cursor: pointer; text-decoration: none; } .nav-item .material-icons { font-size: 24px; color: var(--on-surface-variant); } .nav-item .nav-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Spending Insights</h1></div>
    <div class="banner">
      <div class="banner-icon"><span class="material-icons">savings</span></div>
      <div class="banner-title">Set a Monthly Budget</div>
      <p class="banner-msg">Track your spending against a budget to stay on top of your finances.</p>
      <button class="set-budget-btn" data-action="manage_budgets" tabindex="0" aria-label="Set Budget">Set Budget</button>
    </div>
    <div class="section-title">This Month's Spending</div>
    <div class="category-row"><div class="cat-dot" style="background:var(--primary)"></div><span class="cat-name">Groceries</span><span class="cat-amount">KES 12,400</span></div>
    <div class="category-row"><div class="cat-dot" style="background:var(--secondary)"></div><span class="cat-name">Transport</span><span class="cat-amount">KES 8,900</span></div>
    <div class="category-row"><div class="cat-dot" style="background:var(--warning)"></div><span class="cat-name">Utilities</span><span class="cat-amount">KES 7,200</span></div>
  </main>
  <nav data-shell="bottom-nav" role="navigation"><a class="nav-item" data-nav-to="home"><span class="material-icons">home</span><span class="nav-label">Home</span></a><a class="nav-item" data-nav-to="accounts"><span class="material-icons">account_balance</span><span class="nav-label">Accounts</span></a><a class="nav-item" data-nav-to="send-money"><span class="material-icons">send</span><span class="nav-label">Pay</span></a><a class="nav-item" data-nav-to="cards"><span class="material-icons">credit_card</span><span class="nav-label">Cards</span></a><a class="nav-item" data-nav-to="settings"><span class="material-icons">more_horiz</span><span class="nav-label">More</span></a></nav>
  <script src="../../preview/_shared/preview-runtime.js"></script></body></html>
