<!doctype html>
<!-- render-hash: pfm-error-s2-01 -->
<html lang="en" data-screen="pfm-dashboard" data-state="error" data-feature="pfm-dashboard" data-flavor="consumer" data-section="2">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Category Breakdown — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--error:#BA1A1A;--error-container:#FFDAD6;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);padding:20px;min-height:100vh}
.section-2{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.icon{width:48px;height:48px;border-radius:24px;background:var(--error-container);display:flex;align-items:center;justify-content:center}.icon .material-icons{font-size:var(--icon-md);color:var(--error)}
.title{font-size:14px;font-weight:700}.msg{font-size:13px;color:var(--on-surface-variant);line-height:1.5;max-width:260px}
.retry{background:transparent;color:var(--primary);border:1px solid var(--outline);border-radius:999px;padding:8px 18px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:6px}.retry .material-icons{font-size:var(--icon-xs)}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--error:#BA1A1A;--error-container:#FFDAD6;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--error:#FFB4AB;--error-container:#93000A;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--error:#FFB4AB;--error-container:#93000A;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><section class="section-2" data-component-type="category_breakdown" role="region" aria-label="Spending by category"><div class="icon"><span class="material-icons">error_outline</span></div><div class="title">Couldn't load categories</div><div class="msg">Spending breakdown isn't available right now.</div><button class="retry" data-action="retry_load_categories" tabindex="0" aria-label="Retry"><span class="material-icons">refresh</span>Retry</button></section><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
