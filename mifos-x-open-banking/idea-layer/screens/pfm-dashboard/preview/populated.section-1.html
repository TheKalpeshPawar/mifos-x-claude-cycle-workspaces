<!doctype html>
<!-- render-hash: pfm-pop-s1-01 -->
<html lang="en" data-screen="pfm-dashboard" data-state="populated" data-feature="pfm-dashboard" data-flavor="consumer" data-section="1">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spending Summary</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--primary:#4C662B;--primary-container:#CDEDA3;--on-primary-container:#102000;--background:#F9FAEF}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);padding:20px;min-height:100vh}
.section-1{padding:18px;background:linear-gradient(120deg,#CDEDA3 0%,#F9FAEF 100%);color:var(--on-primary-container);border-radius:20px}.stamp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;opacity:0.7}.amount{font-size:32px;font-weight:700;letter-spacing:-0.6px;margin-top:4px}.sub{font-size:13px;opacity:0.8;margin-top:4px}
.flow-row{display:flex;gap:14px;margin-top:18px}.flow-tile{flex:1;background:rgba(255,255,255,0.55);border-radius:12px;padding:12px}.flow-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;opacity:0.7}.flow-val{font-size:16px;font-weight:700;margin-top:4px;letter-spacing:-0.2px}.flow-val.spent{color:#8C3030}.flow-val.received{color:var(--primary)}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--on-primary-container:#102000;--background:#F9FAEF}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--on-primary-container:#CDEDA3;--background:#12140E}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--on-primary-container:#CDEDA3;--background:#12140E}.section-1{background:linear-gradient(120deg,#354E16 0%,#1E201A 100%)}.flow-tile{background:rgba(255,255,255,0.08)}}</style>
</head>
<body><section class="section-1" data-component-type="summary_card" role="region" aria-label="Spending summary"><div class="stamp">Total spend this month</div><div class="amount">£1,029.80</div><div class="sub">↓ 12% vs. last month</div><div class="flow-row"><div class="flow-tile"><div class="flow-label">In</div><div class="flow-val received">£3,250.00</div></div><div class="flow-tile"><div class="flow-label">Out</div><div class="flow-val spent">£1,029.80</div></div><div class="flow-tile"><div class="flow-label">Net</div><div class="flow-val">+£2,220.20</div></div></div></section>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
