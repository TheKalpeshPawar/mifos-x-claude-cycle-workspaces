<!doctype html>
<!-- render-hash: pfm-error-s1-01 -->
<html lang="en" data-screen="pfm-dashboard" data-state="error" data-feature="pfm-dashboard" data-flavor="consumer" data-section="1">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spending Summary — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--error:#BA1A1A;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);padding:20px;min-height:100vh}
.section-1{padding:18px;background:var(--error-container);color:var(--on-error-container);border-radius:20px;text-align:center}.icon-wrap{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:rgba(0,0,0,0.08);margin-bottom:10px}.icon-wrap .material-icons{font-size:var(--icon-md);color:var(--error)}.title{font-size:15px;font-weight:700;letter-spacing:-0.1px}.msg{font-size:13px;margin-top:4px;opacity:0.85;line-height:1.5}
.retry{margin-top:14px;background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;padding:10px 22px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.retry .material-icons{font-size:var(--icon-xs)}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--error:#BA1A1A;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285}@media (prefers-color-scheme: dark){:root{--primary:#B2D188;--on-primary:#1F3701;--error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285}}</style>
</head>
<body><section class="section-1" data-component-type="summary_card" role="region" aria-label="Spending summary"><div class="icon-wrap"><span class="material-icons">cloud_off</span></div><div class="title">Couldn't load summary</div><div class="msg">We can't fetch spending insights right now.</div><button class="retry" data-action="retry_load_pfm" tabindex="0" aria-label="Retry"><span class="material-icons">refresh</span>Retry</button></section><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
