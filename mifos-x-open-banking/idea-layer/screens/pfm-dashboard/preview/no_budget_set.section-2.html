<!doctype html>
<!-- render-hash: pfm-nb-s2-01 -->
<html lang="en" data-screen="pfm-dashboard" data-state="no_budget_set" data-feature="pfm-dashboard" data-flavor="consumer" data-section="2">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Budget CTA</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);padding:20px;min-height:100vh}
.budget-cta{background:var(--surface);border:1px solid var(--outline-variant);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.icon{width:60px;height:60px;border-radius:18px;background:var(--secondary-container);display:flex;align-items:center;justify-content:center}.icon .material-icons{font-size:var(--icon-lg);color:var(--on-secondary-container)}
.title{font-size:16px;font-weight:700;letter-spacing:-0.1px}.msg{font-size:13px;color:var(--on-surface-variant);line-height:1.5;max-width:280px}
.suggestion-row{display:flex;gap:10px;width:100%;flex-wrap:wrap;justify-content:center}.suggestion{padding:6px 12px;border-radius:999px;background:var(--surface-variant);color:var(--on-surface-variant);font-size:12px;font-weight:600;border:none;cursor:pointer}
.set-btn{padding:12px 24px;background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.set-btn .material-icons{font-size:var(--icon-sm)}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme: dark){:root{--primary:#B2D188;--on-primary:#1F3701;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><div class="budget-cta" data-component-type="cta_card" data-component-id="set-budget-cta" role="region" aria-label="Budget overview"><div class="icon"><span class="material-icons">flag</span></div><div class="title">Set a monthly budget</div><div class="msg">Track how much you spend and get nudged before you overshoot.</div><div class="suggestion-row"><button class="suggestion" data-action="set_budget" data-amount="1200" tabindex="0">£1,200</button><button class="suggestion" data-action="set_budget" data-amount="1500" tabindex="0">£1,500</button><button class="suggestion" data-action="set_budget" data-amount="2000" tabindex="0">£2,000</button></div><button class="set-btn" data-action="open_budget_setup" tabindex="0" aria-label="Set up a budget"><span class="material-icons">add</span>Set up a budget</button></div><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
