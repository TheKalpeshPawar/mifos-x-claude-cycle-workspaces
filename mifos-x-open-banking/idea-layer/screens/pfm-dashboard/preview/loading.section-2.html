<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Category Breakdown — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--background:#F9FAEF;--surface:#FFFFFF;--surface-variant:#E1E4D5;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);padding:20px;min-height:100vh}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.section-2{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:8px 0}
.row{display:flex;align-items:center;gap:14px;padding:10px 16px}.row .dot{width:12px;height:12px;border-radius:6px}.row .info{flex:1;display:flex;flex-direction:column;gap:6px}.row .name{height:13px;width:50%}.row .pct{height:10px;width:25%}.row .bar{width:80px;height:6px;border-radius:3px}.row .amount{height:14px;width:60px}
[data-theme="light"]{--background:#F9FAEF;--surface:#FFFFFF;--surface-variant:#E1E4D5;--outline-variant:#C5C8BA}[data-theme="dark"]{--background:#12140E;--surface:#1E201A;--surface-variant:#44483D;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--background:#12140E;--surface:#1E201A;--surface-variant:#44483D;--outline-variant:#44483D}}</style>
</head>
