<!doctype html>
<!-- render-hash: pfm-pop-s2-01 -->
<html lang="en" data-screen="pfm-dashboard" data-state="populated" data-feature="pfm-dashboard" data-flavor="consumer" data-section="2">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Category Breakdown</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--primary:#4C662B;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--chart-transport:#E8A317;--chart-shopping:#8C5A00;--chart-entertainment:#A45B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);padding:20px;min-height:100vh}
.section-title{font-size:14px;font-weight:700;padding:0 0 10px;letter-spacing:-0.1px;display:flex;justify-content:space-between}.section-title .more{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
.section-2{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:8px 0}
.cat-row{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer}.cat-dot{width:12px;height:12px;border-radius:6px;flex-shrink:0}.cat-info{flex:1;min-width:0}.cat-name{font-size:14px;font-weight:600}.cat-pct{font-size:11px;color:var(--on-surface-variant);margin-top:2px}.cat-bar{flex:1;height:6px;background:var(--surface-variant);border-radius:3px;overflow:hidden;max-width:80px}.cat-fill{height:100%;border-radius:3px}.cat-amount{font-size:13px;font-weight:600;min-width:80px;text-align:right}
[data-theme="light"]{--primary:#4C662B;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme: dark){:root{--primary:#B2D188;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body>
<div class="section-title">Top categories <span class="more" data-action="view_all_categories">View all</span></div>
<section class="section-2" data-component-type="category_breakdown" role="region" aria-label="Spending by category">
<div class="cat-row" data-action="open_category" data-category="bills" tabindex="0"><div class="cat-dot" style="background:var(--primary)"></div><div class="cat-info"><div class="cat-name">Bills &amp; utilities</div><div class="cat-pct">43.7%</div></div><div class="cat-bar"><div class="cat-fill" style="width:88%;background:var(--primary)"></div></div><div class="cat-amount">£450.00</div></div>
<div class="cat-row" data-action="open_category" data-category="food" tabindex="0"><div class="cat-dot" style="background:var(--secondary)"></div><div class="cat-info"><div class="cat-name">Food &amp; dining</div><div class="cat-pct">31.1%</div></div><div class="cat-bar"><div class="cat-fill" style="width:62%;background:var(--secondary)"></div></div><div class="cat-amount">£320.50</div></div>
<div class="cat-row" data-action="open_category" data-category="transport" tabindex="0"><div class="cat-dot" style="background:var(--chart-transport)"></div><div class="cat-info"><div class="cat-name">Transport</div><div class="cat-pct">12.1%</div></div><div class="cat-bar"><div class="cat-fill" style="width:24%;background:var(--chart-transport)"></div></div><div class="cat-amount">£125.00</div></div>
<div class="cat-row" data-action="open_category" data-category="shopping" tabindex="0"><div class="cat-dot" style="background:var(--chart-shopping)"></div><div class="cat-info"><div class="cat-name">Shopping</div><div class="cat-pct">8.7%</div></div><div class="cat-bar"><div class="cat-fill" style="width:17%;background:var(--chart-shopping)"></div></div><div class="cat-amount">£89.30</div></div>
<div class="cat-row" data-action="open_category" data-category="entertainment" tabindex="0"><div class="cat-dot" style="background:var(--chart-entertainment)"></div><div class="cat-info"><div class="cat-name">Entertainment</div><div class="cat-pct">4.4%</div></div><div class="cat-bar"><div class="cat-fill" style="width:9%;background:var(--chart-entertainment)"></div></div><div class="cat-amount">£45.00</div></div>
</section>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
