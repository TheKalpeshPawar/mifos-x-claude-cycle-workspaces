screen_id: pfm-dashboard

on_mount:
  - trigger: pfm_compute
    description: "Client-derived PFM computation over cached AIS transaction and balance data."
    initial_state: loading
    steps:
      - client_derived:
          description: >
            Read cached transaction list and account balances from the local PFM repository
            (Room/SQLDelight). Compute in parallel via kotlinx-coroutines:
            (1) net_worth = sum(credit account balances) − sum(credit-card outstanding);
            (2) period_income = sum of transactions with CreditDebitIndicator=Credit in
                selected window (7d / 30d / 3m via kotlinx-datetime period);
            (3) period_spend = sum of transactions with CreditDebitIndicator=Debit in same window;
            (4) top_categories = group debits by auto-assigned MerchantCategory, sum and sort
                descending, compute percentage_of_spend;
            (5) insights = rule-based cards — e.g. category spend >10% vs prior equivalent
                period, savings rate ≥20% positive reinforcement.
            All windowing uses kotlinx-datetime Clock.System.now() relative to device timezone.
          store_as: pfm_summary
    on_success: content
    on_empty: empty
    on_error: error

  - trigger: period_change
    description: "Re-runs pfm_compute with updated period window when user selects 7d / 30d / 3m."
    steps:
      - client_derived:
          description: >
            Re-aggregate period_income, period_spend, top_categories and insights using the
            new kotlinx-datetime interval. net_worth is period-independent (always current).
          store_as: pfm_summary
    on_success: content
    on_error: error

on_error:
  retry_action: reload_finances
  nav_target: null
  error_message_key: "pfm_dashboard.error.body"
