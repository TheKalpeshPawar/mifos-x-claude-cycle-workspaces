sibling: data-flow
schema_version: "4.0"
feature_id: pfm-dashboard
entries:
  - screen_id: pfm-dashboard
    trigger: on_mount
    endpoints:
      - obp_personal_data_fields
    direction: read
    dtos:
      - name: PersonalDataField
        role: response
        api_id: obp_personal_data_fields
    produces_state: populated
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: pfm-dashboard
    trigger: on_mount
    endpoints:
      - obp_transactions_list
    direction: read
    dtos:
      - name: Transaction
        role: response
        api_id: obp_transactions_list
    produces_state: populated
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login

  - screen_id: pfm-dashboard
    trigger: on_interact
    event: PeriodSelected
    endpoints:
      - obp_transactions_list
    direction: read
    dtos:
      - name: Transaction
        role: response
        api_id: obp_transactions_list
    produces_state: populated
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
