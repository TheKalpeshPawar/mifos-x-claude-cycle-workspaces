sibling: api
schema_version: "4.0"
feature_id: pfm-dashboard
# Rebound OBP -> HSBC OBIE on 2026-06-11. Contract source of truth: server/apis/ais.yaml.
# DERIVATION NOTE: OBIE AIS has NO spending-insights / PFM endpoint. ALL insights on this
# screen (category breakdown, summary spent/received/net, top merchants, budget meter) are
# DERIVED CLIENT-SIDE from get_account_transactions over the selected period+scope, with
# accounts + balances read for totals/classification. Two former OBP dependencies have NO
# OBIE banking equivalent and become LOCAL-ONLY state: PFM budgets and the base currency
# (previously stored as OBP personal-data-fields) are app-local preferences, NOT a banking
# resource. OBIE AIS also has NO FX-rate endpoint, so multi-currency aggregation must use a
# non-OBIE rate source or be presented per-currency. All OBIE reads require an authorised
# account-access consent (ReadAccountsBasic/Detail, ReadBalances, ReadTransactions*) + an
# Authorization-Code-scoped token (mutual TLS + x-fapi-financial-id on every call).
api:
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: Accounts
    description: "Authorised account list — the PFM scope spans all PERSONAL accounts. OBIE OBReadAccount6. AccountCategory (Personal | Business) classifies personal-vs-business scope; Currency drives the base-currency seed."
    response:
      fields:
        - name: Data.Account
          type: "Array<OBAccount6>"
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountCategory
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
  - id: get_account_details
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}"
    tag: Accounts
    description: "Per-account detail — AccountCategory/AccountTypeCode + Currency confirm personal-vs-business classification per account. OBIE OBReadAccount6. Replaces the OBP owner-view detail fetch (OBIE list already carries AccountCategory; detail is a per-account refinement)."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
        - name: Data.Account[].Nickname
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 404
        message: "OB.Field.Invalid (incl. non-existent AccountId)"
  - id: get_account_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: Accounts
    description: "Per-account balance — read for scope totals. OBIE OBReadBalance1; amount is Data.Balance[].Amount.Amount (decimal String) + Data.Balance[].Amount.Currency, with Data.Balance[].Type (e.g. InterimAvailable) + CreditDebitIndicator."
    response:
      fields:
        - name: Data.Balance[].AccountId
          type: String
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Type
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus (e.g. missing ReadBalances)"
  - id: get_account_transactions
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    tag: Transactions
    description: "Source for ALL derived insights — fetched per personal account and aggregated client-side. OBIE OBReadTransaction6. Categorisation runs over Data.Transaction[].MerchantDetails.MerchantName / TransactionInformation / BankTransactionCode.Code; amounts are Data.Transaction[].Amount.Amount (String) + .Currency with CreditDebitIndicator (Credit | Debit). Filter window via fromBookingDateTime/toBookingDateTime query params; BookingDateTime drives pagination. There is NO OBIE spending-insights endpoint — the dashboard is a client-side projection."
    request:
      params:
        - name: fromBookingDateTime
          type: String
          example: "2026-05-01T00:00:00Z"
        - name: toBookingDateTime
          type: String
          example: "2026-05-31T23:59:59Z"
    response:
      fields:
        - name: Data.Transaction
          type: "Array<OBTransaction6>"
        - name: Data.Transaction[].TransactionId
          type: String
        - name: Data.Transaction[].CreditDebitIndicator
          type: String
        - name: Data.Transaction[].BookingDateTime
          type: String
        - name: Data.Transaction[].TransactionInformation
          type: String
        - name: Data.Transaction[].Amount.Amount
          type: String
        - name: Data.Transaction[].Amount.Currency
          type: String
        - name: Data.Transaction[].BankTransactionCode.Code
          type: String
        - name: Data.Transaction[].MerchantDetails.MerchantName
          type: String
        - name: Data.Transaction[].CreditorAccount.Identification
          type: String
        - name: Data.Transaction[].DebtorAccount.Identification
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

# LOCAL-ONLY preferences (NO OBIE equivalent). Budgets (pfm_budget_<categoryId>) and the
# base currency (pfm_base_currency) were OBP personal-data-fields; OBIE AIS has no equivalent
# user-data store, so these persist as app-local preferences (e.g. on-device settings store).
# They are NOT banking resources and are NOT fetched from HSBC.
local_state:
  - id: pfm_budgets_local
    store: app_local_preferences
    description: "PFM budgets, keyed pfm_budget_<categoryId> (overall, food-dining, transport, entertainment, bills, shopping). No OBIE equivalent — read/written locally, newest-wins semantics preserved client-side."
  - id: pfm_base_currency_local
    store: app_local_preferences
    description: "User base currency for multi-account aggregation; seeded from the default personal account's Currency (get_accounts) when unset. No OBIE equivalent."

# GAP — NO OBIE FX endpoint. OBP's /banks/{bank}/fx had no OBIE counterpart in AIS. Cross-
# currency aggregation must either use a non-OBIE FX source or present spending per currency.
gaps:
  - id: fx_rate
    former_endpoint: "GET /obp/.../banks/{bankId}/fx/{from}/{to}"
    status: no_obie_equivalent
    description: "OBIE AIS exposes no FX-rate resource. FxConverter must source rates externally (non-OBIE) or the dashboard falls back to per-currency presentation / 1:1 passthrough with an FX-unavailable notice."
