sibling: api
schema_version: "4.0"
feature_id: pfm-dashboard
# Reconciled to shipped PFM v2 source on 2026-06-11 (code = truth). Beyond the budget
# personal-data-fields + transactions list, the shipped multi-account PFM also calls two
# endpoints that were missing from this spec: the OBP FX rate endpoint (FxConverter,
# session-cached, per-transaction conversion into the base currency) and the per-account
# owner-view detail fetch (PfmAccountsService, to resolve product_code for personal-vs-
# business classification — the /my/accounts list nulls product_code).
api:
  - id: obp_personal_data_fields
    endpoint: "GET /obp/v6.0.0/my/personal-data-fields"
    tag: User
    description: "Read PFM budgets stored as personal data fields (convention: pfm_budget_<categoryId>)"
    response:
      fields:
        - name: personal_data_fields
          type: "List<PersonalDataField>"
        - name: name
          type: String
        - name: value
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
  - id: obp_personal_data_field_create
    endpoint: "POST /obp/v6.0.0/my/personal-data-fields"
    tag: User
    description: "Create/update budget entry"
    request:
      fields:
        - name: name
          type: String
          example: "pfm_budget_food_dining"
        - name: value
          type: String
          example: "350"
    response:
      fields:
        - name: name
          type: String
        - name: value
          type: String
    errors:
      - code: 400
        message: "INVALID_FIELD_NAME"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transactions_list
    endpoint: "GET /obp/v6.0.0/my/accounts/{account_id}/transactions"
    tag: Transactions
    description: "Fetch transactions for PFM analysis — filtered by date range for selected period"
    request:
      params:
        - name: from_date
          type: String
          example: "2026-05-01T00:00:00Z"
        - name: to_date
          type: String
          example: "2026-05-31T23:59:59Z"
        - name: limit
          type: Int
          example: 500
    response:
      fields:
        - name: transactions
          type: "List<Transaction>"
        - name: transaction_id
          type: String
        - name: this_account
          type: AccountInfo
        - name: details
          type: TransactionDetails
        - name: value
          type: AmountOfMoney
    errors:
      - code: 400
        message: "INVALID_DATE_FORMAT"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "ACCOUNT_NOT_FOUND"
  - id: obp_fx_rate
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/fx/{fromCurrencyCode}/{toCurrencyCode}"
    tag: FX
    auth: DirectLogin
    description: "Live FX rate per currency pair — FxConverter resolves per-transaction amounts into the user's base currency when aggregating across multi-currency personal accounts. Session-cached per (bankId, from, to). Used by PFM v2 (pfm-multi-account-budget-strategy)."
    request:
      params:
        - name: bankId
          type: String
          example: "obp.bank.x"
        - name: fromCurrencyCode
          type: String
          example: "EUR"
        - name: toCurrencyCode
          type: String
          example: "GBP"
    response:
      fields:
        - name: bank_id
          type: String
        - name: from_currency_code
          type: String
        - name: to_currency_code
          type: String
        - name: conversion_value
          type: Double
        - name: inverse_conversion_value
          type: Double
        - name: effective_date
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "FX_CURRENCY_NOT_FOUND — pair unsupported by the bank; FxConverter degrades to a 1:1 passthrough and surfaces the FX-unavailable notice"
  - id: obp_account_detail_owner
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/account"
    tag: Accounts
    auth: DirectLogin
    description: "Owner-view detail for one account — PfmAccountsService fetches this per account (in parallel, session-cached) to resolve product_code, which the /my/accounts list endpoint returns null. product_code drives personal (CURRENT/WALLET/SAVINGS) vs business classification; a failed detail fetch degrades to the base list account."
    request:
      params:
        - name: bankId
          type: String
          example: "obp.bank.x"
        - name: accountId
          type: String
          example: "8ca8a7e4-6d02-40e3-a129-0b2bf89de9f1"
    response:
      fields:
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: label
          type: String
        - name: product_code
          type: String
        - name: account_type
          type: String
        - name: balance
          type: object
          children:
            - name: currency
              type: String
            - name: amount
              type: String
        - name: owners
          type: "List<AccountOwner>"
        - name: account_attributes
          type: "List<AccountAttribute>"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "ACCOUNT_NOT_FOUND"
