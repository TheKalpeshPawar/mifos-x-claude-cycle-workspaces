    note: "Implemented FULL E2E as the new feature/pfm module. Budgets are REAL server-side state: the ui.yaml's proposed personal-data-fields endpoints exist on OBP v6 and were verified live first (GET works; POST needs type per UserAttributeJsonV510 and APPENDS rather than upserts — BudgetsRepository reads the newest row per pfm_budget_<categoryId> name; slugs: overall, food-dining, transport, entertainment, bills, shopping). Insights derive client-side from the account's transaction history (sandbox caps at 50 newest and ignores date params): TXN_TYPE fallbacks (POS/ECOM→Shopping, DD/SO/FEE/CHG→Bills, ATM→Cash, TFR→Transfers) with keyword overrides via token-prefix matching (substring matching mis-binned Netflix under the tfl keyword — caught by TDD). Screen: account chip → reusable AccountPickerBottomSheet (insights are PER-ACCOUNT — multi-currency accounts cannot be summed; deviation from single-account-implicit spec), period chips This/Last/Last-3-Months + Custom via M3 DateRangePicker, summary card (Spent/Received/Net), Monthly Budget progress card OR no-budget banner (both tap → edit dialog), Canvas donut chart with center total + legend, per-category Budget Progress rows (tap → set/change limit; 70%/90% colour thresholds), Top Merchants (top 5 by debit total), View All Transactions → TransactionsRoute. Deviations: PFM settings top-bar action omitted; chart-expand and category-filtered transaction navigation deferred (rows inform, merchants/view-all navigate unfiltered); pie legend percentages live on the donut not per-row. Entry point: home services grid 'Support — coming soon' tile became 'Insights' (PieChart icon) → PfmDashboardRoute (real destination replacing the Phase-2 placeholder). Tests: 5 BudgetsRepository + 9 PfmAnalysis + 11 ViewModel = 25."
  - from: approved
    to: approved
    at: "2026-06-07T13:00:00Z"
    by: "/goal-implement-project pfm-multi-account-budget-strategy"
    contract_version: "1.1.0"
    note: "PFM v2 (pfm-multi-account-budget-strategy): dashboard unified across ALL personal accounts (CURRENT/WALLET/SAVINGS — business accounts excluded; they route to the new business-insights screen). Per-transaction FX conversion into a user-changeable base currency via OBP /banks/{bank}/fx rates (session-cached FxConverter); base persists as the pfm_base_currency personal-data-field (newest row wins), seeded from the default account's currency. Account picker REMOVED from the personal flow (scope line 'All personal accounts · N accounts · CCY' replaces the chip); accounts classify via per-account detail fetch product_code (list endpoint nulls it) through cached parallel PfmAccountsService. Transfers render as a category but never budget. The long-deferred open_pfm_settings top-bar action SHIPPED as the pfm-settings screen (base-currency radio list). Engine extracted to core (PfmAnalysisCore, taxonomy-parameterized with amountOf FX hook) — personal categorization semantics byte-identical, tests migrated to core/data. Supersedes the per-account deviation note above."
  - from: approved
    to: approved
    at: "2026-06-07T15:00:00Z"
    by: "post-walkthrough polish (plan eager-churning-storm)"
    contract_version: "1.1.0"
    note: "Two refinements after the v2 device walkthrough. (1) Account scope selector RETURNS as a tappable chip: 'All personal accounts' (default, aggregated) or any single personal account — pure client-side reprojection over the per-account transaction map (no refetch); budgets stay visible in the per-account view against the global limits; View All Transactions navigates to the selected account. Supersedes the picker-removed note above. (2) Monthly budget meter now counts only real spending: transfers between own accounts and uncategorised ('Other') debits are excluded from OverallBudget.spent/percent; ATM cash withdrawals still count. The Spent/Received summary and category donut keep showing all debits."
  - from: approved
