approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: draft
    timestamp: "2026-05-25T00:00:00Z"
  - status: enriched
    timestamp: "2026-05-25T00:00:00Z"
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - status: enriched
    at: "2026-05-25T10:00:00Z"
