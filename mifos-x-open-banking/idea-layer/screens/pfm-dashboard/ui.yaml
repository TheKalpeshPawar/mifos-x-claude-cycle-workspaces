responsive:
  mobile_only: false
  baseline_width: 390
  tablet:
    min_width: 600
    columns: 2
    content_max_width: 840
  desktop:
    min_width: 840
    columns: 3
    content_max_width: 1200

# States reconciled to the shipped ScreenState<PfmContent> contract on 2026-06-11. The
# shipped screen has four top-level render states (loading / content / empty / error)
# plus no_network + unauthenticated when the underlying ScreenState<T> surfaces them.
# Within content, the overall budget block is either overall_budget_card OR
# no_budget_set_banner (mutually exclusive). The category/budget/merchant rows are
# DYNAMIC templates (one rendered row per analyze() result) — the visible_components
# lists name the section anchors + row templates, not fixed per-category ids.
states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - pfm_title
        - pfm_scope_chip
        - period_selector_row
        - period_chip_this_month
        - period_chip_last_month
        - period_chip_last_3_months
        - period_chip_custom
        - pfm_period_label
      show_skeleton_list: true
      skeleton_count: 5
      skeleton_height: 120

  content:
    layout:
      visible_components:
        - pfm_title
        - pfm_scope_chip
        - period_selector_row
        - period_chip_this_month
        - period_chip_last_month
        - period_chip_last_3_months
        - period_chip_custom
        - pfm_period_label
        - pfm_summary_card
        - summary_section_label
        - summary_metrics_row
        - spent_label
        - spent_amount
        - received_label
        - received_amount
        - net_label
        - net_amount
        - overall_budget_card
        - overall_budget_header_row
        - overall_budget_title
        - overall_budget_percent
        - overall_budget_amounts_row
        - overall_budget_spent
        - overall_budget_remaining
        - overall_budget_progress
        - overall_budget_of_total
        - category_section_label
        - category_card
        - category_donut_chart
        - category_legend_list
        - category_legend_row
        - budgets_section_label
        - budget_rows_card
        - budget_rows_list
        - budget_progress_row
        - merchants_section_label
        - merchants_card
        - merchants_list
        - merchant_row
        - view_all_transactions_button
    notes: "When overallBudget == null the overall_budget_card block is replaced by no_budget_set_banner + no_budget_banner_title + no_budget_banner_body (mutually exclusive). Category/budget/merchant rows are dynamic — the *_row template renders once per analyze() result."

  empty:
    layout:
      visible_components:
        - pfm_title
        - pfm_scope_chip
        - period_selector_row
        - period_chip_this_month
        - period_chip_last_month
        - period_chip_last_3_months
        - period_chip_custom
        - pfm_period_label
        - no_activity_state
        - no_activity_icon
        - no_activity_title
        - no_activity_body

  error:
    layout:
      visible_components:
        - pfm_title
        - pfm_scope_chip
        - period_selector_row
        - period_chip_this_month
        - period_chip_last_month
        - period_chip_last_3_months
        - period_chip_custom
        - pfm_period_label
      show_error_state: true
      error_message: "Could not load spending insights. Please try again."
      error_action_label: "Retry"
      error_action: retry_load

  no_network:
    layout:
      show_error_state: true
      error_message: "You're offline. Connect to the internet to load your spending insights."
      error_action_label: "Retry"
      error_action: retry_load
    notes: "Surfaced by ScreenState<PfmContent> when the network is unavailable."

  unauthenticated:
    layout:
      show_error_state: true
      error_message: "Your session has expired. Sign in again to view your spending insights."
      error_action_label: "Sign In"
      error_action: navigate_to_login
    notes: "Surfaced by ScreenState<PfmContent> when the DirectLogin token is missing or expired."

# state_model reconciled to the shipped PfmDashboardViewModel on 2026-06-11. The public
# surface is ScreenState<PfmContent> (Loading/Content/Empty/Error + NoNetwork/Unauthenticated
# from the shared ScreenState<T>). Internally the VM holds a RawState (Loading/Failed/Loaded
# over the fetched per-account transaction map) + a Selection (period / custom range /
# account scope) and reprojects PfmContent client-side when the selection changes (no
# refetch on scope change). A separate notice StateFlow<String?> carries transient banners
# (FX-rate unavailable, budget-save failure).
state_model:
  view_model: PfmDashboardViewModel
  exposes: "ScreenState<PfmContent>"
  content_type: PfmContent
  content_fields:
    - name: scopeLabel
      type: String
    - name: accountCount
      type: Int
    - name: currency
      type: String
    - name: selectedAccountId
      type: "String?"
    - name: accounts
      type: "List<Account>"
    - name: navBankId
      type: String
    - name: navAccountId
      type: String
    - name: period
      type: PfmPeriod
    - name: periodLabel
      type: String
    - name: hasActivity
      type: Boolean
    - name: summary
      type: PfmSummary
    - name: overallBudget
      type: "OverallBudget?"
    - name: categories
      type: "List<CategorySpend>"
    - name: budgetRows
      type: "List<BudgetRow>"
    - name: topMerchants
      type: "List<MerchantSpend>"
  internal_state:
    - name: raw
      type: "RawState"
      variants: [Loading, "Failed(error)", "Loaded(accountTxns)"]
    - name: selection
      type: Selection
      fields: [period, "customStart: LocalDate?", "customEnd: LocalDate?", "accountId: String?"]
    - name: notice
      type: "StateFlow<String?>"
      description: "Transient banner — FX-rate-unavailable + budget-save-error."
  methods:
    - "onPeriodSelected(period: PfmPeriod)"
    - "onCustomRangeSelected(start: LocalDate, end: LocalDate)"
    - "onAccountFilterSelected(accountId: String?)"
    - "onSaveBudget(categoryId: String, amount: String)"
    - "retry()"
  events:
    - "ScopePickerOpened"
    - "AccountFilterSelected(accountId: String?)"
    - "PeriodSelected(period: PfmPeriod)"
    - "CustomRangeSelected(start, end)"
    - "BudgetSaved(categoryId, amount)"
    - "BudgetEditOpened(categoryId: String)"
    - "MerchantClicked"
    - "ViewAllTransactionsClicked"
    - RetryLoad
  actions:
    - open_scope_picker
    - select_period
    - open_custom_date_picker
    - edit_overall_budget
    - edit_category_budget
    - view_merchant_transactions
    - navigate_to_transactions
    - open_pfm_settings
    - navigate_back
    - retry_load
  budget_meter_rule: "OverallBudget.spent/percent EXCLUDE own-account transfers and uncategorised ('other') debits; ATM cash withdrawals still count. The Spent/Received summary and category donut show ALL debits."
  di:
    - BudgetsRepository
    - PfmAccountsService
    - FxConverter
    - TransactionsRepository
    - AccountsRepository

# Rebound OBP -> HSBC OBIE 2026-06-11. Insights are CLIENT-SIDE-DERIVED from
# get_account_transactions (no OBIE spending-insights endpoint). Budgets + base currency are
# LOCAL-ONLY (no OBIE user-data store); FX has no OBIE equivalent. See api.yaml for full notes.
api:
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: Accounts
    description: "Authorised account list — PFM scope spans all PERSONAL accounts. OBIE OBReadAccount6; Data.Account[].AccountCategory classifies personal-vs-business, Data.Account[].Currency seeds the base currency."
    response:
      fields:
        - name: Data.Account
          type: "Array<OBReadAccount6>"
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountCategory
          type: String
        - name: Data.Account[].Nickname
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
  - id: get_account_details
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}"
    tag: Accounts
    description: "Per-account detail — AccountCategory/AccountTypeCode + Currency refine personal-vs-business classification. OBIE OBReadAccount6. Replaces the OBP owner-view product_code fetch."
    response:
      fields:
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Currency
          type: String
        - name: Data.Account[].AccountTypeCode
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 404
        message: "OB.Field.Invalid"
  - id: get_account_balances
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
    tag: Accounts
    description: "Per-account balance — read for scope totals. OBIE OBReadBalance1; Data.Balance[].Amount.Amount (String) + Data.Balance[].Amount.Currency, with Type + CreditDebitIndicator."
    response:
      fields:
        - name: Data.Balance[].Amount.Amount
          type: String
        - name: Data.Balance[].Amount.Currency
          type: String
        - name: Data.Balance[].CreditDebitIndicator
          type: String
        - name: Data.Balance[].Type
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"
  - id: get_account_transactions
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    tag: Transactions
    description: "Source for ALL derived insights — fetched per personal account, aggregated client-side. OBIE OBReadTransaction6. Categorisation over Data.Transaction[].MerchantDetails.MerchantName / TransactionInformation / BankTransactionCode.Code; amounts Data.Transaction[].Amount.Amount (String) + .Currency with CreditDebitIndicator (Credit | Debit). Window via fromBookingDateTime/toBookingDateTime; period filtering otherwise client-side. NO OBIE spending-insights endpoint exists."
    request:
      params:
        - name: fromBookingDateTime
          type: String
          example: "2026-05-01T00:00:00Z"
        - name: toBookingDateTime
          type: String
          example: "2026-05-31T23:59:59Z"
    response:
      fields:
        - name: Data.Transaction
          type: "Array<OBReadTransaction6>"
        - name: Data.Transaction[].CreditDebitIndicator
          type: String
        - name: Data.Transaction[].BookingDateTime
          type: String
        - name: Data.Transaction[].TransactionInformation
          type: String
        - name: Data.Transaction[].Amount.Amount
          type: String
        - name: Data.Transaction[].Amount.Currency
          type: String
        - name: Data.Transaction[].MerchantDetails.MerchantName
          type: String
        - name: Data.Transaction[].CreditorAccount.Identification
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

# LOCAL-ONLY preferences (NO OBIE equivalent) — budgets + base currency were OBP
# personal-data-fields; OBIE AIS has no user-data store, so these persist app-locally.
local_state:
  - id: pfm_budgets_local
    store: app_local_preferences
    description: "PFM budgets keyed pfm_budget_<categoryId>. No OBIE equivalent — read/written locally, newest-wins preserved client-side."
  - id: pfm_base_currency_local
    store: app_local_preferences
    description: "User base currency; seeded from the default personal account's Currency (get_accounts) when unset. No OBIE equivalent."

# GAP — NO OBIE FX endpoint; cross-currency aggregation needs a non-OBIE rate source or
# per-currency presentation.
gaps:
  - id: fx_rate
    former_endpoint: "GET /obp/.../banks/{bankId}/fx/{from}/{to}"
    status: no_obie_equivalent
    description: "OBIE AIS has no FX-rate resource. FxConverter must source rates externally or fall back to per-currency presentation with an FX-unavailable notice."

