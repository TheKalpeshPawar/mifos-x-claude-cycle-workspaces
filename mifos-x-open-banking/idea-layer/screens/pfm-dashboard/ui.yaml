    notes: "Added period selector, category breakdown (Food & Dining £320.50, Transport £125.00, Shopping £89.30, Bills £450.00, Entertainment £45.00), budget progress (£1,029.80/£1,500.00 68%), top merchants (Tesco, Netflix, Spotify, TfL), states (loading/populated/empty/no_budget_set), nav targets wired, all test_context present."
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []

shell:
  top_app_bar:
    show: true
    title: "Spending Insights"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: tune
        action: open_pfm_settings
        label: "PFM settings"
  bottom_nav: true
  nav_items:
    - id: nav_home
      label: Home
      icon: home
      target: home
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
    - id: nav_insights
      label: Insights
      icon: insights
      target: pfm-dashboard
      active: true
    - id: nav_cards
      label: Cards
      icon: credit_card
      target: cards
    - id: nav_more
      label: More
      icon: more_horiz
      target: settings

screens:
  - id: pfm-dashboard
    name: Spending Insights
    archetype: dashboard
    route: /pfm-dashboard
    scroll: vertical

components:
  # ── Page title ──────────────────────────────────────────────────────────────
  - type: text
    id: pfm_title
    label: "Spending Insights"
    content: "Spending Insights"
    style:
      typography: "Outfit/headline_large"
      color: "#4C662B"
      font_weight: bold
      padding_horizontal: 20
      padding_top: 16
      padding_bottom: 4
    a11y:
      label: "Spending Insights dashboard title"
      role: heading
    test_context:
      tag: pfm_title
      assert_text: "Spending Insights"

  # ── Period selector ──────────────────────────────────────────────────────────
  - type: stack
    id: period_selector_row
    label: "Period selector row"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 16
      overflow: scroll_horizontal
      min_item_width: 80
      scroll_indicator: true
    on_click:
      action: state_change
      target: selected_period
    a11y:
      label: "Select reporting period"
      role: row
    test_context:
      tag: period_selector_row

  - type: chip
    id: period_chip_this_month
    label: "This Month"
    content: "This Month"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: true
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: select_period
      target: this_month
    a11y:
      label: "Filter by This Month, currently selected"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_this_month
      assert_text: "This Month"
      assert_selected: true

  - type: chip
    id: period_chip_last_month
    label: "Last Month"
    content: "Last Month"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: false
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: select_period
      target: last_month
    a11y:
      label: "Filter by Last Month"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_last_month
      assert_text: "Last Month"

  - type: chip
    id: period_chip_last_3_months
    label: "Last 3 Months"
    content: "Last 3 Months"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: false
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: select_period
      target: last_3_months
    a11y:
      label: "Filter by Last 3 Months"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_last_3_months
      assert_text: "Last 3 Months"

  - type: chip
    id: period_chip_custom
    label: "Custom"
    content: "Custom"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: false
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: open_custom_date_picker
      target: custom_date_range
    a11y:
      label: "Select custom date range"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_custom
      assert_text: "Custom"

  # ── Period label ────────────────────────────────────────────────────────────
  - type: text
    id: pfm_period_label
    label: "May 2026"
    content: "May 2026"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_horizontal: 20
      padding_bottom: 16
    a11y:
      label: "Current reporting period: May 2026"
      role: text
    test_context:
      tag: pfm_period_label
      assert_text: "May 2026"

  # ── Income vs Expense summary card ─────────────────────────────────────────
  - type: box
    id: this_month_summary_card
    label: "This Month summary"
    content: "This Month summary"
    style:
      background: "#FFFFFF"
      border_radius: 20
      elevation: 2
      padding_horizontal: 20
      padding_vertical: 20
      margin_horizontal: 20
      margin_bottom: 20
      border_color: "#F9FAEF"
      border_width: 1
    on_click:
      action: navigate_to_transactions
      target: transactions
    a11y:
      label: "This month summary. Spent £1,029.80, received £3,200.00, net positive £2,170.20. Tap to view all transactions."
      role: region
    keyboard:
      focusable: true
    api:
      endpoint_id: obp_transactions_list
      binding: totalSpent, totalReceived, netBalance
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 3
        description: "shimmer matching three metric columns (Spent, Received, Net)"
      error:
        type: banner  # fix REG-001: inline-error → banner (registered)
        message: "Could not load spending summary. Please try again."
        retry: true
      empty:
        type: box  # fix REG-001: inline-empty → box (registered)
        message: "No transactions this period. Start spending to see insights!"
        icon: receipt_long
    test_context:
      tag: this_month_summary_card

  - type: text
    id: summary_section_label
    label: "This Month"
    content: "This Month"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_bottom: 16
    a11y:
      label: "This month summary section"
      role: heading
    test_context:
      tag: summary_section_label
      assert_text: "This Month"

  - type: stack
    id: summary_metrics_row
    label: "Summary metrics"
    style:
      orientation: horizontal
      spacing: 0
      justify: space_between
      align: flex_start
    on_click:
      action: navigate
      target: transactions
    a11y:
      label: ""
      role: row
    test_context:
      tag: summary_metrics_row

  - type: stack
    id: spent_col
    label: "Total spent column"
    style:
      orientation: vertical
      align: flex_start
      flex: 1
    on_click:
      action: navigate
      target: transactions
    a11y:
      label: ""
      role: group
    test_context:
