states:
  loading:
    layout:
      visible_components:
        - pfm_title
        - pfm_period_label
      show_skeleton_list: true
      skeleton_count: 4
  content:
    layout:
      visible_components:
        - pfm_title
        - pfm_period_label
        - monthly_chart_placeholder
        - chart_label
        - this_month_summary_card
        - summary_section_label
        - summary_metrics_row
        - spent_col
        - spent_label
        - spent_amount
        - received_col
        - received_label
        - received_amount
        - net_col
        - net_label
        - net_amount
        - budgets_section_label
        - budget_groceries
        - groceries_header
        - groceries_category
        - groceries_amounts
        - groceries_progress_bar_track
        - groceries_progress_bar_fill
        - budget_transport
        - transport_header
        - transport_category
        - transport_amounts
        - transport_progress_bar_track
        - transport_progress_bar_fill
        - budget_dining
        - dining_header
        - dining_category
        - dining_amounts
        - dining_progress_bar_track
        - dining_progress_bar_fill
        - manage_budgets_button
  empty:
    layout:
      visible_components:
        - pfm_title
        - pfm_period_label
        - monthly_chart_placeholder
      show_empty_state: true
      empty_state_icon: insights_outlined
      empty_state_title: "No budget data yet"
      empty_state_message: "Set up budgets to track your spending by category"
      empty_state_action_label: "Create First Budget"
      empty_state_action: manage_budgets
  error:
    layout:
      visible_components:
        - pfm_title
        - pfm_period_label
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load spending insights"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: PfmDashboardViewModel
  state_fields:
    - name: totalSpent
      type: "BigDecimal"
      default: "BigDecimal.ZERO"
    - name: totalReceived
      type: "BigDecimal"
      default: "BigDecimal.ZERO"
    - name: budgets
      type: "List<BudgetEntry>"
      default: "emptyList()"
    - name: dailySpending
      type: "List<DailySpend>"
      default: "emptyList()"
    - name: reportingPeriod
      type: String
      default: '""'
    - name: uiState
      type: PfmDashboardUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load spending insights. Please try again."
    - field: budget_save
      code: SAVE_FAILED
      message: "Could not save budget. Please try again."
  events:
    - DataLoaded
    - BudgetEditClicked(categoryId: String)
    - ManageBudgetsClicked
    - ChartDetailClicked
    - RetryLoad
  actions:
    - edit_budget
    - manage_budgets
    - open_chart_detail
    - open_pfm_settings
  di:
    - PersonalDataFieldsRepository
    - TransactionsRepository

api:
  - id: obp_personal_data_fields
    endpoint: "GET /obp/v6.0.0/my/personal-data-fields"
    tag: User
    description: "Read PFM budgets stored as personal data fields (convention: pfm_budget_<categoryId>)"
    response:
      fields:
        - name: personal_data_fields
          type: "List<PersonalDataField>"
        - name: name
          type: String
        - name: value
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
  - id: obp_personal_data_field_create
    endpoint: "POST /obp/v6.0.0/my/personal-data-fields"
    tag: User
    description: "Create/update budget entry"
    request:
      fields:
        - name: name
          type: String
          example: "pfm_budget_groceries"
        - name: value
          type: String
          example: "400"
    response:
      fields:
        - name: name
          type: String
        - name: value
          type: String
    errors:
      - code: 400
        message: "INVALID_FIELD_NAME"
      - code: 401
        message: "USER_NOT_LOGGED_IN"

dependencies:
  tier: feature
  features:
    - transactions

navigation:
  - action: manage_budgets
    target: ""
    description: "Open budget management sheet"
  - action: open_chart_detail
    target: ""
    description: "Expand full-screen spending chart"
  - action: navigate_back
    target: home
    description: "Return to home screen"
