screen_id: pfm-dashboard
name: "My Finances"
status: enriched
initial_state: loading
quality_score: 93

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.pfm_dashboard.title}"
  fab_visible: false

business_logic:
  kind: calculation
  description: "Client-computed finance overview using kotlinx-datetime period windowing and kotlinx-coroutines across accounts. Net worth sums all balances; monthly spend and income filter by CreditDebitIndicator. Top categories rank AIS debits by MerchantCategory descending. Insights apply spend-vs-prior-month and category-over-budget rules. Period selector re-triggers computation with a new kotlinx-datetime window (7d/30d/3m). All computation is viewModelScope-scoped; no network calls on this screen."
  external_library_refs:
    - "kotlinx-datetime"
    - "kotlinx-coroutines"
  description_author: claude
  description_authored_at: "2026-06-29T12:00:00Z"

states: [loading, content, empty, error]

components:

  # ── Loading state — shimmer skeleton ────────────────────────────────
  - type: shimmer
    id: loading_shimmer
    state_binding: [loading]
    rows: 4
    row_heights: [120, 80, 200, 80]
    accessibility_label: "{strings.pfm_dashboard.loading.a11y}"
    test_context:
      purpose: "Shimmer while PFM coroutines compute from cache; verify shown only in loading state"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Error state ──────────────────────────────────────────────────────
  - type: error_state
    id: error_view
    state_binding: [error]
    title: "{strings.pfm_dashboard.error.title}"
    body: "{strings.pfm_dashboard.error.body}"
    icon: warning_amber
    accessibility_label: "{strings.pfm_dashboard.error.a11y}"
    test_context:
      purpose: "Error state when computation fails; verify retry button triggers reload"
      required_fields: []
      interaction_type: action
      data_driven: false
    action:
      label: "{strings.pfm_dashboard.error.retry}"
      on_click:
        action: reload_finances
        target: null

  # ── Period selector ──────────────────────────────────────────────────
  - type: segmented_button
    id: period_selector
    state_binding: [content]
    accessibility_label: "{strings.pfm_dashboard.period_selector.a11y}"
    test_context:
      purpose: "Period scope selector; verify switching period re-computes spend/income/categories"
      required_fields: [selected_period]
      interaction_type: action
      data_driven: true
    options:
      - id: period_7d
        label: "{strings.pfm_dashboard.period_selector.7d}"
        value: "7d"
      - id: period_30d
        label: "{strings.pfm_dashboard.period_selector.30d}"
        value: "30d"
        selected: true
      - id: period_3m
        label: "{strings.pfm_dashboard.period_selector.3m}"
        value: "3m"
    on_click:
      action: select_period
      params:
        period: "{selected.value}"

  # ── Net-worth / total-balance card ───────────────────────────────────
  - type: card
    id: net_worth_card
    state_binding: [content]
    elevation: 2
    test_context:
      purpose: "Aggregated net worth card; verify sum equals credit balances minus credit card balance"
      required_fields: [net_worth_amount, account_count]
      interaction_type: display
      data_driven: true
    children:
      - type: text
        id: net_worth_label
        value: "{strings.pfm_dashboard.net_worth.label}"
        style: labelMedium
        color: "secondary"
        accessibility_label: "{strings.pfm_dashboard.net_worth.a11y_label}"

      - type: text
        id: net_worth_amount
        value: "£14,955.45"
        style: displaySmall
        color: "primary"
        accessibility_label: "Net worth £14,955.45"
        test_context:
          purpose: "Formatted GBP net worth; verify sum = 2847.63 + 12450.00 − 342.18 = 14955.45"
          required_fields: [net_worth_amount]
          interaction_type: display
          data_driven: true

      - type: text
        id: net_worth_sub
        value: "{strings.pfm_dashboard.net_worth.subtitle}"
        style: bodySmall
        color: "on-surface-variant"
        test_context:
          purpose: "Account count subtitle; verify count reflects linked accounts"
          required_fields: [account_count]
          interaction_type: display
          data_driven: true

      # Account breakdown rows
      - type: stack
        id: net_worth_breakdown
        direction: vertical
        spacing: spacing.xs
        children:
          - type: list_item
            id: breakdown_current
            label: "{strings.pfm_dashboard.net_worth.breakdown.current}"
            trailing_content: "£2,847.63"
            style: compact
            accessibility_label: "Everyday current account balance £2,847.63"

          - type: list_item
            id: breakdown_savings
            label: "{strings.pfm_dashboard.net_worth.breakdown.savings}"
            trailing_content: "£12,450.00"
            style: compact
            accessibility_label: "ISA saver account balance £12,450.00"

          - type: list_item
            id: breakdown_credit
            label: "{strings.pfm_dashboard.net_worth.breakdown.credit}"
            trailing_content: "−£342.18"
            trailing_color: "error"
            style: compact
            accessibility_label: "Platinum Mastercard outstanding balance −£342.18"

  # ── Spending vs Income section ───────────────────────────────────────
  - type: text
    id: spending_income_header
    state_binding: [content]
    value: "{strings.pfm_dashboard.spending_income.header}"
    style: titleSmall
    color: "on-surface-variant"
    accessibility_label: "{strings.pfm_dashboard.spending_income.header}"

  - type: card
    id: spending_income_card
    state_binding: [content]
    elevation: 1
    test_context:
      purpose: "Income vs spend bar chart with net cashflow label for selected period"
      required_fields: [period_income, period_spend, net_cashflow]
      interaction_type: display
      data_driven: true
    children:
      - type: bar_chart
        id: spending_income_bars
        accessibility_label: "{strings.pfm_dashboard.spending_income.chart_a11y}"
        test_context:
          purpose: "Dual-bar: income (primary colour) vs spend (error colour); bar heights proportional to values"
          required_fields: [period_income, period_spend]
          interaction_type: display
          data_driven: true
        bars:
          - label: "{strings.pfm_dashboard.spending_income.income_bar}"
            value: 2400.00
            color: "primary"
            accessibility_label: "Income £2,400.00"
          - label: "{strings.pfm_dashboard.spending_income.spend_bar}"
            value: 1840.00
            color: "error"
            accessibility_label: "Spending £1,840.00"

      - type: text
        id: net_cashflow_label
        value: "{strings.pfm_dashboard.spending_income.net_cashflow_saved}"
        style: labelMedium
        color: "primary"
        accessibility_label: "Net saving of £560.00 this period"
        test_context:
          purpose: "Net cashflow label; verify +/− prefix reflects saved vs overspent"
          required_fields: [net_cashflow, net_cashflow_direction]
          interaction_type: display
          data_driven: true

  # ── Top spending categories ──────────────────────────────────────────
  - type: text
    id: top_categories_header
    state_binding: [content]
    value: "{strings.pfm_dashboard.top_categories.header}"
    style: titleSmall
    color: "on-surface-variant"

  - type: stack
    id: top_categories_list
    state_binding: [content]
    items_source: "{top_categories}"
    direction: vertical
    spacing: spacing.xs
    test_context:
      purpose: "Ranked spending categories with % progress bars; verify sorted by amount descending"
      required_fields: [top_categories]
      interaction_type: navigate
      data_driven: true
    children:
      - type: list_item
        id: category_row
        label: "{item.name}"
        supporting_text: "{strings.pfm_dashboard.category_row.transactions}"
        trailing_content: "£{item.amount}"
        accessibility_label: "{item.name}: £{item.amount} across {item.transaction_count} transactions"
        test_context:
          purpose: "Category row with name, transaction count, GBP amount, and spend-% bar; tap navigates filtered"
          required_fields: [item.name, item.amount, item.transaction_count, item.percentage_of_spend]
          interaction_type: navigate
          data_driven: true
        on_click:
          action: navigate_spending_by_category
          target: spending-by-category
          params:
            category: "{item.name}"
        children:
          - type: progress_linear
            id: category_spend_bar
            value: "{item.percentage_of_spend}"
            max: 100
            color: "primary"
            accessibility_label: "{item.name} represents {item.percentage_of_spend}% of total spending"

  - type: text_button
    id: view_all_categories
    state_binding: [content]
    label: "{strings.pfm_dashboard.top_categories.view_all}"
    accessibility_label: "{strings.pfm_dashboard.top_categories.view_all_a11y}"
    on_click:
      action: navigate_spending_by_category
      target: spending-by-category

  # ── Insight cards ────────────────────────────────────────────────────
  - type: text
    id: insights_header
    state_binding: [content]
    value: "{strings.pfm_dashboard.insights.header}"
    style: titleSmall
    color: "on-surface-variant"

  - type: stack
    id: insights_list
    state_binding: [content]
    items_source: "{insights}"
    direction: vertical
    spacing: spacing.sm
    test_context:
      purpose: "Rule-based insight cards; verify at least one insight when transactions present"
      required_fields: [insights]
      interaction_type: display
      data_driven: true
    children:
      - type: card
        id: insight_card
        elevation: 1
        test_context:
          purpose: "Insight card; verify title and body non-empty and grounded in real metric"
          required_fields: [item.title, item.body, item.icon]
          interaction_type: display
          data_driven: true
        children:
          - type: icon
            id: insight_icon
            icon: "{item.icon}"
            color: "primary"
            size: 20
            accessibility_label: null
          - type: text
            id: insight_title
            value: "{item.title}"
            style: titleSmall
            test_context:
              purpose: "Insight headline; verify non-empty and no placeholder tokens"
              required_fields: [item.title]
              interaction_type: display
              data_driven: true
          - type: text
            id: insight_body
            value: "{item.body}"
            style: bodySmall
            color: "on-surface-variant"
            test_context:
              purpose: "Insight detail text; verify grounded in actual computed metric, not placeholder"
              required_fields: [item.body]
              interaction_type: display
              data_driven: true

  # ── Quick-access chip group ──────────────────────────────────────────
  - type: chip_group
    id: pfm_nav_chips
    state_binding: [content]
    scroll_direction: horizontal
    test_context:
      purpose: "Horizontal chip group for quick PFM navigation; verify all chips tappable and navigate correctly"
      required_fields: []
      interaction_type: navigate
      data_driven: false
    children:
      - type: chip
        id: chip_spending
        label: "{strings.pfm_dashboard.chips.by_category}"
        icon: pie_chart
        accessibility_label: "{strings.pfm_dashboard.chips.by_category_a11y}"
        test_context:
          purpose: "Shortcut to spending-by-category; verify tap triggers navigation"
          required_fields: []
          interaction_type: navigate
          data_driven: false
        on_click:
          action: navigate_spending_by_category
          target: spending-by-category

      - type: chip
        id: chip_budgets
        label: "{strings.pfm_dashboard.chips.budgets}"
        icon: savings
        accessibility_label: "{strings.pfm_dashboard.chips.budgets_a11y}"
        test_context:
          purpose: "Shortcut to budgets; verify tap triggers navigation"
          required_fields: []
          interaction_type: navigate
          data_driven: false
        on_click:
          action: navigate_budgets
          target: budgets

      - type: chip
        id: chip_subscriptions
        label: "{strings.pfm_dashboard.chips.subscriptions}"
        icon: autorenew
        accessibility_label: "{strings.pfm_dashboard.chips.subscriptions_a11y}"
        test_context:
          purpose: "Shortcut to recurring-subscriptions; verify tap triggers navigation"
          required_fields: []
          interaction_type: navigate
          data_driven: false
        on_click:
          action: navigate_recurring_subscriptions
          target: recurring-subscriptions

  # ── Empty state ──────────────────────────────────────────────────────
  - type: empty_state
    id: empty_state_view
    state_binding: [empty]
    icon: bar_chart
    title: "{strings.pfm_dashboard.empty.title}"
    body: "{strings.pfm_dashboard.empty.body}"
    accessibility_label: "{strings.pfm_dashboard.empty.a11y}"
    test_context:
      purpose: "Empty state when no cached transactions exist; verify shown only in empty state"
      required_fields: []
      interaction_type: display
      data_driven: false

status_history:
  - from: draft
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"
  - from: enriched
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich (quality push: +loading/error states, period selector, category % bars, account breakdown, i18n, registry alignment)"
