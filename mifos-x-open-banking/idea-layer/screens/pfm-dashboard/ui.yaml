  - type: text
    id: no_budget_banner_body
    label: "Set a monthly budget to track how much you spend against your target. Tap to set one."
    content: "Set a monthly budget to track how much you spend against your target. Tap to set one."
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
    a11y:
      label: "Set a monthly budget to track how much you spend against your target. Tap to set one."
      role: text
    test_context:
      tag: no_budget_banner_body

  # ── Spending by Category (PfmCategorySection — donut + dynamic legend) ───────
  # Canvas donut (centre shows total spent + "spent"; % lives ON the donut arcs, NOT in
  # the legend rows). Legend rows are DYNAMIC — one per category returned by analyze()
  # over the PERSONAL_TAXONOMY; each row is colour-dot + label + amount (no per-row %).
  # The fixed Food/Transport/Shopping/Bills/Entertainment rows from the old demo are gone.
  - type: text
    id: category_section_label
    label: "Spending by Category"
    content: "Spending by Category"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_horizontal: 20
      padding_bottom: 10
    a11y:
      label: "Spending by Category"
      role: heading
    test_context:
      tag: category_section_label
      assert_text: "Spending by Category"

  - type: box
    id: category_card
    label: "Category breakdown card"
    content: "Category breakdown"
    style:
      background: "#F9FAEF"
      border_radius: 16
      elevation: 0
      border_color: "#C5C8BA"
