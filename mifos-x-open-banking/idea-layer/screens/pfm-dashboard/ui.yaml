shell:
  top_app_bar:
    show: true
    title: "Spending Insights"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: tune
        action: open_pfm_settings
        label: "PFM settings"
  bottom_nav: true
  nav_items:
    - id: nav_home
      label: Home
      icon: home
      target: home
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
    - id: nav_insights
      label: Insights
      icon: insights
      target: pfm-dashboard
      active: true
    - id: nav_more
      label: More
      icon: more_horiz
      target: settings

screens:
  - id: pfm-dashboard
    name: Spending Insights
    archetype: dashboard
    route: /pfm-dashboard
    scroll: vertical

archetype: dashboard

# Reconciled to shipped PfmDashboardScreen.kt + PfmSections.kt (PFM v2) on 2026-06-11
# (code = truth). The shipped PfmDashboardContent renders, in order: a tappable scope
# chip (PfmScopeChip), the period FilterChips, the period label, then — when the scope
# has activity — Summary card, Monthly-Budget overview (or no-budget banner), Spending-by-
# Category (donut + DYNAMIC legend), Budget-Progress (DYNAMIC rows), Top-Merchants
# (DYNAMIC rows), and a View-All-Transactions button; otherwise PfmNoActivity. All
# category/budget/merchant rows are derived at runtime from analyze() over the selected
# scope+period — the hardcoded Food/Transport/Shopping/Bills/Entertainment and
# Tesco/Netflix/Spotify/TfL demo rows that previously lived here were never shipped as
# fixed content and have been removed. The illustrative `content:` strings below are
# placeholders for rendering only; real values come from PfmContent at runtime.
components:
  # ── Page title ──────────────────────────────────────────────────────────────
  - type: text
    id: pfm_title
    label: "Spending Insights"
    content: "Spending Insights"
    style:
      typography: "Outfit/headline_large"
      color: "#4C662B"
      font_weight: bold
      padding_horizontal: 20
      padding_top: 16
      padding_bottom: 4
    a11y:
      label: "Spending Insights dashboard title"
      role: heading
      level: 1
    test_context:
      tag: pfm_title
      assert_text: "Spending Insights"

  # ── Scope chip (PfmScopeChip — AssistChip, shipped FIRST in PfmDashboardContent) ──
  # Tappable scope filter. Label = "{scopeLabel} · {N accounts} · {CCY}" when scope is
  # "All personal accounts"; "{scopeLabel} · {CCY}" when a single account is selected.
  # Trailing ExpandMore icon. Tap opens the reusable AccountPickerBottomSheet
  # (title "Insights for", allOptionLabel "All personal accounts"). Replaces the legacy
  # per-account account-selector chip — PFM v2 aggregates across ALL personal accounts.
  - type: chip
    id: pfm_scope_chip
    label: "All personal accounts · 3 accounts · GBP"
    content: "All personal accounts · 3 accounts · GBP"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      variant: assist
      trailing_icon: expand_more
      padding_horizontal: 20
      padding_vertical: 4
      typography: "Outfit/label_large"
    on_click:
      action: open_scope_picker
      target: account_picker_sheet
    a11y:
      label: "Insights scope: All personal accounts, 3 accounts, GBP. Tap to choose insights scope."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: pfm_account_selector
      assert_text: "All personal accounts"

  # ── Period selector ──────────────────────────────────────────────────────────
  - type: stack
    id: period_selector_row
    label: "Period selector row"
    style:
      orientation: horizontal
      spacing: 8
      padding_horizontal: 20
      padding_bottom: 16
      overflow: scroll_horizontal
      min_item_width: 80
      scroll_indicator: true
    on_click:
      action: state_change
      target: selected_period
    a11y:
      label: "Select reporting period"
      role: row
    test_context:
      tag: period_selector_row

  - type: chip
    id: period_chip_this_month
    label: "This Month"
    content: "This Month"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: true
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: select_period
      target: this_month
    a11y:
      label: "Filter by This Month, currently selected"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_this_month
      assert_text: "This Month"
      assert_selected: true

  - type: chip
    id: period_chip_last_month
    label: "Last Month"
    content: "Last Month"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: false
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: select_period
      target: last_month
    a11y:
      label: "Filter by Last Month"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_last_month
      assert_text: "Last Month"

  - type: chip
    id: period_chip_last_3_months
    label: "Last 3 Months"
    content: "Last 3 Months"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: false
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: select_period
      target: last_3_months
    a11y:
      label: "Filter by Last 3 Months"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_last_3_months
      assert_text: "Last 3 Months"

  - type: chip
    id: period_chip_custom
    label: "Custom"
    content: "Custom"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filter
      selected: false
      selected_background: "#4C662B"
      selected_text_color: "#FFFFFF"
      unselected_background: "#CDEDA3"
      unselected_text_color: "#4C662B"
      border_radius: 20
      padding_horizontal: 16
      padding_vertical: 8
      typography: "Outfit/label_medium"
    on_click:
      action: open_custom_date_picker
      target: custom_date_range
    a11y:
      label: "Select custom date range"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: period_chip_custom
      assert_text: "Custom"

  # ── Period label ────────────────────────────────────────────────────────────
  - type: text
    id: pfm_period_label
    label: "May 2026"
    content: "May 2026"
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      padding_horizontal: 20
      padding_bottom: 16
    a11y:
      label: "Current reporting period: May 2026"
      role: text
    test_context:
      tag: pfm_period_label
      assert_text: "May 2026"

  # ── Summary card (PfmSummaryCard — Total Spent / Received / Net) ────────────
  # Dynamic: values derive from analyze() over the selected scope + period. The three
  # columns are Total Spent (error colour, negated), Received (primary), Net (primary if
  # >= 0 else error, "+" prefix when positive). No fixed amounts — content is illustrative.
  - type: box
    id: pfm_summary_card
    label: "Summary card"
    content: "Summary"
    style:
      background: "#F9FAEF"
      border_radius: 16
      elevation: 0
      border_color: "#C5C8BA"
      border_width: 1
      padding_horizontal: 16
      padding_vertical: 16
      margin_horizontal: 20
      margin_bottom: 16
    a11y:
      label: "Spending summary for the selected period and scope."
      role: region
    test_context:
      tag: pfm_summary_card

  - type: text
    id: summary_section_label
    label: "Summary"
    content: "Summary"
    style:
      typography: "Outfit/title_small"
      color: "#1A1C16"
      font_weight: semibold
      padding_bottom: 12
    a11y:
      label: "Summary"
      role: heading
    test_context:
      tag: summary_section_label
      assert_text: "Summary"

  - type: stack
    id: summary_metrics_row
    label: "Summary metrics row"
    style:
      orientation: horizontal
      spacing: 8
      distribute: equal
    a11y:
      label: "Spent, received and net totals"
      role: row
    test_context:
      tag: summary_metrics_row

  - type: text
    id: spent_label
    label: "Total Spent"
    content: "Total Spent"
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
    a11y:
      label: "Total Spent"
      role: text
    test_context:
      tag: spent_label
      assert_text: "Total Spent"

  - type: text
    id: spent_amount
    label: "Total spent amount (dynamic)"
    content: "-£820.40"
    style:
      typography: "Outfit/title_medium"
      color: "#BA1A1A"
      font_weight: bold
    a11y:
      label: "Total spent this period"
      role: text
    test_context:
      tag: spent_amount

  - type: text
    id: received_label
    label: "Received"
    content: "Received"
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
    a11y:
      label: "Received"
      role: text
    test_context:
      tag: received_label
      assert_text: "Received"

  - type: text
    id: received_amount
    label: "Received amount (dynamic)"
    content: "£3,200.00"
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      font_weight: bold
    a11y:
      label: "Total received this period"
      role: text
    test_context:
      tag: received_amount

  - type: text
    id: net_label
    label: "Net"
    content: "Net"
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
    a11y:
      label: "Net"
      role: text
    test_context:
      tag: net_label
      assert_text: "Net"

  - type: text
    id: net_amount
    label: "Net amount (dynamic)"
    content: "+£2,379.60"
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      font_weight: bold
    a11y:
      label: "Net position this period"
      role: text
    test_context:
      tag: net_amount

  # ── Overall monthly budget card (PfmBudgetOverview — Monthly Budget) ─────────
  # Tappable card → BudgetEditDialog (overall slug). Shows "{percent}% used", spent + left,
  # progress bar (70%/90% colour thresholds), "of {limit} monthly budget — tap to change".
  # When no overall budget is set this is replaced by the no-budget banner (see below).
  # Spend counted here EXCLUDES own-account transfers + uncategorised 'other' debits.
  - type: box
    id: overall_budget_card
    label: "Monthly budget card"
    content: "Monthly Budget"
    style:
      background: "#F9FAEF"
      border_radius: 16
      elevation: 0
      border_color: "#C5C8BA"
      border_width: 1
      padding_horizontal: 16
      padding_vertical: 16
      margin_horizontal: 20
      margin_bottom: 16
    on_click:
      action: edit_overall_budget
      target: budget_edit_dialog
    a11y:
      label: "Monthly budget. Tap to change the limit."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: pfm_overall_budget_card

  - type: stack
    id: overall_budget_header_row
    label: "Overall budget header row"
    style:
      orientation: horizontal
      distribute: space_between
    a11y:
      role: row
    test_context:
      tag: overall_budget_header_row

  - type: text
    id: overall_budget_title
    label: "Monthly Budget"
    content: "Monthly Budget"
    style:
      typography: "Outfit/title_small"
      color: "#1A1C16"
      font_weight: semibold
    a11y:
      label: "Monthly Budget"
      role: heading
    test_context:
      tag: overall_budget_title
      assert_text: "Monthly Budget"

  - type: text
    id: overall_budget_percent
    label: "Percent used (dynamic)"
    content: "55% used"
    style:
      typography: "Outfit/label_medium"
      color: "#44483D"
      font_weight: semibold
    a11y:
      label: "Percent of monthly budget used"
      role: text
    test_context:
      tag: overall_budget_percent

  - type: stack
    id: overall_budget_amounts_row
    label: "Overall budget amounts row"
    style:
      orientation: horizontal
      distribute: space_between
      padding_top: 8
    a11y:
      role: row
    test_context:
      tag: overall_budget_amounts_row

  - type: text
    id: overall_budget_spent
    label: "Spent amount (dynamic)"
    content: "£820.40 spent"
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      font_weight: semibold
    a11y:
      label: "Amount spent against the monthly budget"
      role: text
    test_context:
      tag: overall_budget_spent

  - type: text
    id: overall_budget_remaining
    label: "Remaining amount (dynamic)"
    content: "£679.60 left"
    style:
      typography: "Outfit/body_medium"
      color: "#4C662B"
      font_weight: semibold
    a11y:
      label: "Amount remaining in the monthly budget"
      role: text
    test_context:
      tag: overall_budget_remaining

  - type: progress_bar
    id: overall_budget_progress
    label: "Overall budget progress (dynamic)"
    style:
      variant: linear
      track_color: "#E1E4D5"
      fill_color: "#4C662B"
      height: 8
      corner_radius: 4
      padding_top: 8
    a11y:
      label: "Monthly budget progress bar"
      role: progressbar
    test_context:
      tag: overall_budget_progress

  - type: text
    id: overall_budget_of_total
    label: "Of total budget (dynamic)"
    content: "of £1,500.00 monthly budget — tap to change"
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
      padding_top: 6
    a11y:
      label: "Of the total monthly budget — tap to change"
      role: text
    test_context:
      tag: overall_budget_of_total

  # ── no-budget banner (PfmBudgetOverview when overallBudget == null) ──────────
  # Mutually exclusive with overall_budget_card. Tappable → BudgetEditDialog (overall).
  - type: box
    id: no_budget_set_banner
    label: "No budget set banner"
    content: "No budget set"
    style:
      background: "#F9FAEF"
      border_radius: 16
      elevation: 0
      border_color: "#C5C8BA"
      border_width: 1
      padding_horizontal: 16
      padding_vertical: 16
      margin_horizontal: 20
      margin_bottom: 16
    on_click:
      action: edit_overall_budget
      target: budget_edit_dialog
    a11y:
      label: "No monthly budget set. Tap to set one."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: pfm_no_budget_banner

  - type: text
    id: no_budget_banner_title
    label: "No budget set"
    content: "No budget set"
    style:
      typography: "Outfit/title_small"
      color: "#1A1C16"
      font_weight: semibold
      padding_bottom: 4
    a11y:
      label: "No budget set"
      role: heading
    test_context:
