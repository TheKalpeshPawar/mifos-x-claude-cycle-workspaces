    test_context:
      tag: overall_budget_card

  - type: stack
    id: overall_budget_header_row
    label: "Overall budget header"
    style:
      orientation: horizontal
      justify: space_between
      align: center
      padding_bottom: 8
    on_click:
      action: manage_budgets
      target: budget_overview
    a11y:
      label: ""
      role: row
    test_context:
      tag: overall_budget_header_row

  - type: text
    id: overall_budget_title
    label: "Monthly Budget"
    content: "Monthly Budget"
    style:
