state_model:
  view_model: PfmDashboardViewModel
  state_fields:
    - name: totalSpent
      type: "BigDecimal"
      default: "BigDecimal.ZERO"
    - name: totalReceived
      type: "BigDecimal"
      default: "BigDecimal.ZERO"
    - name: categoryBreakdown
      type: "List<CategorySpend>"
      default: "emptyList()"
    - name: budgets
      type: "List<BudgetEntry>"
      default: "emptyList()"
    - name: overallBudgetLimit
      type: "BigDecimal?"
      default: "null"
    - name: topMerchants
      type: "List<MerchantSpend>"
      default: "emptyList()"
    - name: selectedPeriod
      type: PfmPeriod
      default: "PfmPeriod.THIS_MONTH"
    - name: reportingPeriod
      type: String
      default: '""'
    - name: uiState
      type: PfmDashboardUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load spending insights. Please try again."
    - field: budget_save
      code: SAVE_FAILED
      message: "Could not save budget. Please try again."
  events:
    - DataLoaded
    - "BudgetEditClicked(categoryId: String)"
    - ManageBudgetsClicked
    - "ChartDetailClicked(categoryId: String?)"
    - "PeriodSelected(period: PfmPeriod)"
    - "CategoryFilterClicked(categoryId: String)"
    - "MerchantClicked(merchantName: String)"
    - RetryLoad
    - NavigateToTransactions
    - NavigateToAccounts
  actions:
    - edit_budget
    - manage_budgets
    - open_chart_detail
    - open_pfm_settings
    - select_period
    - open_custom_date_picker
    - filter_by_category
    - view_merchant_transactions
    - navigate_to_transactions
    - navigate_to_accounts
  di:
    - PersonalDataFieldsRepository
    - TransactionsRepository

api:
  - id: obp_personal_data_fields
    endpoint: "GET /obp/v6.0.0/my/personal-data-fields"
    tag: User
    description: "Read PFM budgets stored as personal data fields (convention: pfm_budget_<categoryId>)"
    response:
      fields:
        - name: personal_data_fields
          type: "List<PersonalDataField>"
        - name: name
          type: String
        - name: value
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
  - id: obp_personal_data_field_create
    endpoint: "POST /obp/v6.0.0/my/personal-data-fields"
    tag: User
    description: "Create/update budget entry"
    request:
      fields:
        - name: name
          type: String
          example: "pfm_budget_food_dining"
        - name: value
          type: String
          example: "350"
    response:
      fields:
        - name: name
          type: String
        - name: value
          type: String
    errors:
      - code: 400
        message: "INVALID_FIELD_NAME"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
  - id: obp_transactions_list
    endpoint: "GET /obp/v6.0.0/my/accounts/{account_id}/transactions"
    tag: Transactions
    description: "Fetch transactions for PFM analysis — filtered by date range for selected period"
    request:
      params:
        - name: from_date
          type: String
          example: "2026-05-01T00:00:00Z"
        - name: to_date
          type: String
          example: "2026-05-31T23:59:59Z"
        - name: limit
          type: Int
          example: 500
    response:
      fields:
        - name: transactions
          type: "List<Transaction>"
        - name: transaction_id
          type: String
        - name: this_account
          type: AccountInfo
        - name: details
          type: TransactionDetails
        - name: value
          type: AmountOfMoney
    errors:
      - code: 400
        message: "INVALID_DATE_FORMAT"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "ACCOUNT_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - transactions
    - accounts

navigation:
  - action: manage_budgets
    target: ""
    description: "Open budget management bottom sheet"
  - action: open_chart_detail
    target: ""
    description: "Expand full-screen spending category chart"
  - action: navigate_back
    target: home
    description: "Return to home screen"
  - action: navigate_to_transactions
    target: transactions
    description: "Navigate to transactions list"
  - action: navigate_to_accounts
    target: accounts
    description: "Navigate to accounts overview"
  - action: filter_by_category
    target: transactions
    description: "Navigate to transactions filtered by selected category"
  - action: view_merchant_transactions
    target: transactions
    description: "Navigate to transactions filtered by selected merchant"
  - action: select_period
    target: ""
    description: "Update selected reporting period — reloads data in-place"
  - action: open_custom_date_picker
    target: ""
    description: "Open date range picker bottom sheet"
  - action: open_pfm_settings
    target: ""
    description: "Open PFM settings (categories, notification thresholds)"
  - action: edit_budget
    target: ""
    description: "Open edit budget sheet for tapped category"
