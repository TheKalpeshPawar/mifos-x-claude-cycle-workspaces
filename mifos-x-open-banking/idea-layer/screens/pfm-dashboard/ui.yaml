      typography: "Outfit/label_small"
      color: "#44483D"
      letter_spacing: 0.4
    a11y:
      label: "Total received label"
      role: text
    test_context:
      tag: received_label
      assert_text: "Total Received"

  - type: text
    id: received_amount
