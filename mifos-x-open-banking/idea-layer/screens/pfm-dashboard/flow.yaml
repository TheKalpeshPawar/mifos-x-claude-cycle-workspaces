feature: pfm
flow_ref: pfm-review

# pfm-dashboard is a bottom-nav root destination (order 3 — "Finances" tab).
# As a root destination it has no back stack entry from peers; back returns to OS.
# All forward transitions go to sub-screens of the pfm cluster.

entry_points:
  - source: app_shell_bottom_nav
    label: "Finances tab (bottom nav, order 3)"
  - source: accounts-list
    label: "My Finances shortcut (from Accounts screen header action)"
    params: []

transitions:
  - from: pfm-dashboard
    to: spending-by-category
    trigger: "Tap 'By Category' chip OR tap any category row in top-categories list"
    params:
      - name: category
        type: String
        optional: true
        description: "Pre-filter to this category; null = show all"

  - from: pfm-dashboard
    to: budgets
    trigger: "Tap 'Budgets' chip"
    params: []

  - from: pfm-dashboard
    to: recurring-subscriptions
    trigger: "Tap 'Subscriptions' chip"
    params: []

  # Return edges — sub-screens pop back to this root destination via bottom nav or system back
  - from: spending-by-category
    to: pfm-dashboard
    trigger: "System back or bottom nav Finances tap"
  - from: budgets
    to: pfm-dashboard
    trigger: "System back or bottom nav Finances tap"
  - from: recurring-subscriptions
    to: pfm-dashboard
    trigger: "System back or bottom nav Finances tap"
