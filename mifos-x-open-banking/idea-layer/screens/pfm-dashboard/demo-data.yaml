  # DERIVED VIEW (client-side, no DTO) — category breakdown for the donut + legend.
  # Totals sum from the transactions collection above for the May 2026 window.
  spending_by_category:
    description: "Client-side expense categorisation over the period — drives the category donut + legend. Derived from transactions; no OBIE endpoint."
    item:
      period_label: "May 2026"
      base_currency: "GBP"
      total_spent: "673.43"
      categories:
        - { category_id: "groceries", label: "Groceries", amount: "218.41", percent: 32.4, txn_count: 3 }
        - { category_id: "utilities", label: "Utilities", amount: "184.50", percent: 27.4, txn_count: 2 }
        - { category_id: "transport", label: "Transport", amount: "96.30", percent: 14.3, txn_count: 2 }
        - { category_id: "shopping", label: "Shopping", amount: "89.99", percent: 13.4, txn_count: 1 }
        - { category_id: "dining", label: "Dining", amount: "61.85", percent: 9.2, txn_count: 2 }
        - { category_id: "subscriptions", label: "Subscriptions", amount: "22.98", percent: 3.4, txn_count: 2 }

  # DERIVED VIEW (client-side, no DTO) — cash-flow summary cards.
  cashflow_summary:
    description: "Money In / Money Out / Net for the period — derived from CreditDebitIndicator + Amount over transactions."
    item:
      period_label: "May 2026"
      base_currency: "GBP"
      money_in: "2650.00"
      money_out: "673.43"
      net: "1976.57"

  # DERIVED VIEW (client-side, no DTO) — top merchants list (Tesco rows aggregated).
  top_merchants:
    description: "Highest-spend counterparties for the period — derived from MerchantDetails.MerchantName aggregation. Never a login username."
    item:
      period_label: "May 2026"
      base_currency: "GBP"
      merchants:
        - { name: "Tesco", category_id: "groceries", amount: "134.23", txn_count: 2 }
        - { name: "British Gas", category_id: "utilities", amount: "118.00", txn_count: 1 }
        - { name: "Argos", category_id: "shopping", amount: "89.99", txn_count: 1 }
        - { name: "Sainsbury's", category_id: "groceries", amount: "84.18", txn_count: 1 }
        - { name: "Thames Water", category_id: "utilities", amount: "66.50", txn_count: 1 }

  # LOCAL-ONLY preference (no OBIE equivalent) — budget meter inputs.
  pfm_budgets_local:
    description: "App-local PFM budgets keyed pfm_budget_<categoryId>. Newest-wins; not a banking resource."
    item:
      base_currency: "GBP"
      budgets:
        - { category_id: "overall", label: "Overall", limit: "1200.00", spent: "673.43", percent_used: 56.1 }
        - { category_id: "groceries", label: "Groceries", limit: "300.00", spent: "218.41", percent_used: 72.8 }
        - { category_id: "transport", label: "Transport", limit: "150.00", spent: "96.30", percent_used: 64.2 }
        - { category_id: "dining", label: "Dining", limit: "120.00", spent: "61.85", percent_used: 51.5 }

  # OBErrorResponse1 — 403 InvalidConsentStatus driving the error state.
  load_error:
    description: "Representative 403 OBErrorResponse1 for the dashboard error state (expired/revoked consent)."
    item:
      Code: "403 Forbidden"
      Id: "pfm-err-403-7c21"
      Message: "Forbidden"
      Errors:
        - ErrorCode: "UK.OBIE.Resource.InvalidConsentStatus"
          Message: "The account-access consent is no longer in an authorised state."
