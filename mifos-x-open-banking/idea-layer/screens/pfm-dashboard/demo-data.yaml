sibling: demo-data
schema_version: "4.0"
feature_id: pfm-dashboard

# OBIE AIS data backing the PFM dashboard. The dashboard is a CLIENT-SIDE projection:
# accounts + balances give scope totals; transactions over the period window are the
# single source for every derived insight (category breakdown, cash-flow summary, top
# merchants, budget meter). Amounts are GBP decimal strings; CreditDebitIndicator is
# Credit | Debit; Status is Booked | Pending. May 2026 window used throughout so the
# category totals below sum consistently with the transaction list.
collections:
  # GET /aisp/accounts — authorised personal accounts in PFM scope.
  accounts:
    dto: OBReadAccount6
    description: "Authorised personal account list driving PFM scope + base-currency seed."
    item:
      Data:
        Account:
          - AccountId: "acc-hsbc-0001"
            Status: "Enabled"
            StatusUpdateDateTime: "2026-05-01T06:00:00.000Z"
            Currency: "GBP"
            AccountCategory: "Personal"
            AccountTypeCode: "CurrentAccount"
            Nickname: "Everyday Current"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "401276 71625498"
                Name: "Mr J A Whitfield"
          - AccountId: "acc-hsbc-0002"
            Status: "Enabled"
            StatusUpdateDateTime: "2026-05-01T06:00:00.000Z"
            Currency: "GBP"
            AccountCategory: "Personal"
            AccountTypeCode: "Savings"
            Nickname: "Rainy Day Saver"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "401276 71625511"
                Name: "Mr J A Whitfield"
      Links: { Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts" }
      Meta: { TotalPages: 1 }

  # GET /aisp/accounts/{AccountId}/balances — InterimAvailable per account.
  balances:
    dto: OBReadBalance1
    description: "Per-account available balances used for scope totals on the dashboard header."
    item:
      Data:
        Balance:
          - AccountId: "acc-hsbc-0001"
            CreditDebitIndicator: "Credit"
            Type: "InterimAvailable"
            DateTime: "2026-05-31T23:59:59.000Z"
            Amount: { Amount: "2375.80", Currency: "GBP" }
          - AccountId: "acc-hsbc-0002"
            CreditDebitIndicator: "Credit"
            Type: "InterimAvailable"
            DateTime: "2026-05-31T23:59:59.000Z"
            Amount: { Amount: "8650.00", Currency: "GBP" }
      Links: { Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts/acc-hsbc-0001/balances" }
      Meta: { TotalPages: 1 }

