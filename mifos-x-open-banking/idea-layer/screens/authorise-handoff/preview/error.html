<!doctype html>
<!-- render-hash: authorise-handoff-error-obie -->
<!-- consentContext preview: PAYMENT. For consentContext=ais-consent the "No money has left your account" clause is dropped and Cancel routes to consent-declined instead of payment-declined. -->
<html lang="en" data-screen="authorise-handoff" data-state="error" data-feature="authorise-handoff" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorise with HSBC</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF;
      --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline-variant: #C5C8BA;
      --font-display: 'Outfit', system-ui, sans-serif;
      --icon-2xl: 48px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline-variant: #C5C8BA;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline-variant: #44483D;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-background); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .material-symbols-outlined { line-height: 1; }
    .bank-icon { font-size: 80px; color: var(--primary); margin-bottom: 8px; }
    .title { font-size: 24px; font-weight: 600; line-height: 1.25; max-width: 320px; margin-top: 16px; }
    .error-card { display: flex; align-items: flex-start; gap: 10px; text-align: left; background: var(--error-container); color: var(--on-error-container); border-radius: 12px; padding: 16px; margin-top: 24px; width: 100%; max-width: 340px; }
    .error-card .material-symbols-outlined { font-size: 22px; color: var(--error); flex-shrink: 0; }
    .error-card .etext { font-size: 14px; line-height: 1.5; }
    .retry-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 340px; margin-top: 24px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 8px; padding: 16px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
    .cancel-link { margin-top: 8px; background: transparent; border: none; color: var(--secondary); font-family: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main data-shell="root" data-screen-id="authorise-handoff" data-state="error">
    <span class="material-symbols-outlined bank-icon" data-component-type="icon" data-component-id="handoff_bank_icon" aria-label="HSBC">account_balance</span>
    <div class="title" data-component-type="text" data-component-id="handoff_title" role="heading" aria-level="1">Couldn't start authorisation</div>
    <div class="error-card" data-component-type="card" data-component-id="handoff_error_card" role="alert">
      <span class="material-symbols-outlined" data-component-id="handoff_error_icon" aria-hidden="true">error</span>
      <span class="etext" data-component-type="text" data-component-id="handoff_error_message">We couldn't start your secure sign-in with HSBC. No money has left your account. Please check your connection and try again.</span>
    </div>
    <button class="retry-btn" data-component-type="button" data-component-id="handoff_retry_button" data-nav-to="authorise-handoff" data-action-id="retry">
      <span class="material-symbols-outlined" aria-hidden="true">refresh</span>Try again
    </button>
    <button class="cancel-link" data-component-type="button" data-component-id="handoff_cancel_link" data-nav-to="payment-declined" data-action-id="cancel">Cancel</button>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
