<!doctype html>
<!-- render-hash: pay-international-loading-obie -->
<html lang="en" data-screen="pay-international" data-state="loading" data-feature="pay-international" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>International payment — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root { --primary:#4C662B; --background:#F9FAEF; --on-background:#1A1C16; --surface:#FFFFFF; --surface-variant:#E1E4D5; --on-surface-variant:#44483D; --outline-variant:#C5C8BA; --font-display:'Outfit',system-ui,sans-serif; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --radius-md:12px; --radius-pill:999px; }
    [data-theme="light"] { --primary:#4C662B; --background:#F9FAEF; --on-background:#1A1C16; --surface:#FFFFFF; --surface-variant:#E1E4D5; --on-surface-variant:#44483D; --outline-variant:#C5C8BA; }
    [data-theme="dark"] { --primary:#B2D188; --background:#12140E; --on-background:#E3E3D8; --surface:#1E201A; --surface-variant:#44483D; --on-surface-variant:#C5C8BA; --outline-variant:#44483D; }
    @media (prefers-color-scheme:dark){:root{ --primary:#B2D188; --background:#12140E; --on-background:#E3E3D8; --surface:#1E201A; --surface-variant:#44483D; --on-surface-variant:#C5C8BA; --outline-variant:#44483D; }}
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font-display); background:var(--background); color:var(--on-background); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
    .topbar { display:flex; align-items:center; gap:var(--sp-sm); height:56px; padding:0 var(--sp-md); }
    .topbar .title { font-size:22px; font-weight:500; }
    .material-symbols-outlined { font-size:24px; }
    main { flex:1; display:flex; flex-direction:column; padding:var(--sp-sm) var(--sp-md); gap:var(--sp-md); }
    .sk { background:var(--surface-variant); border-radius:var(--radius-md); position:relative; overflow:hidden; }
    .sk::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent); animation:shimmer 1.4s infinite; }
    @keyframes shimmer { 100%{ transform:translateX(100%); } }
    @media (prefers-reduced-motion:reduce){ .sk::after{ animation:none; } }
    .sk-label { height:12px; width:48%; }
    .sk-row { height:64px; }
    .progress { display:flex; align-items:center; justify-content:center; gap:var(--sp-sm); color:var(--on-surface-variant); font-size:13px; padding-top:var(--sp-sm); }
    .spinner { width:18px; height:18px; border:2px solid var(--outline-variant); border-top-color:var(--primary); border-radius:var(--radius-pill); animation:spin .9s linear infinite; }
    @keyframes spin { 100%{ transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce){ .spinner{ animation:none; } }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="pay-international" data-state="loading">
    <header class="topbar"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span><span class="title" role="heading" aria-level="1">International payment</span></header>
    <main aria-busy="true" aria-label="Fetching the exchange rate">
      <div class="sk sk-label"></div><div class="sk sk-row"></div>
      <div class="sk sk-label"></div><div class="sk sk-row"></div>
      <div class="sk sk-row"></div>
      <div class="progress"><span class="spinner" aria-hidden="true"></span><span>Getting today's exchange rate…</span></div>
    </main>
  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
