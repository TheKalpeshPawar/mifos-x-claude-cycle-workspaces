<!doctype html>
<!-- render-hash: splash-error-01 -->
<html lang="en" data-screen="splash" data-state="error" data-feature="splash" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Splash — Connection Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#CDEDA3 0%,#F9FAEF 100%);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh;position:relative}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px}
.logo-container{width:108px;height:108px;background:var(--primary);border-radius:28px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 12px 32px rgba(76,102,43,0.28)}.logo-container .material-icons{font-size:var(--icon-2xl);color:var(--on-primary)}
.app-name{font-size:28px;font-weight:700;color:var(--on-primary-container);margin-bottom:6px;letter-spacing:-0.3px}
.tagline{font-size:14px;color:var(--on-surface-variant);margin-bottom:32px;letter-spacing:0.3px}
.error-card{background:var(--error-container);border:1px solid rgba(186,26,26,0.18);border-radius:16px;padding:20px 24px;max-width:300px;text-align:left}
.error-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.error-header .material-icons{font-size:var(--icon-md);color:var(--error)}
.error-title{font-size:15px;font-weight:600;color:var(--on-error-container)}
.error-body{font-size:13px;color:var(--on-error-container);line-height:1.5;opacity:0.85;margin-bottom:16px}
.retry-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:600;padding:12px 0;border-radius:999px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:0.2px}
.retry-btn .material-icons{font-size:var(--icon-sm)}
.version{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--outline);letter-spacing:0.4px}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285}@media (prefers-color-scheme:dark){body{background:linear-gradient(135deg,#354E16 0%,#12140E 100%)}:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;--background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285}.app-name{color:var(--on-primary-container)}.logo-container{box-shadow:0 12px 32px rgba(0,0,0,0.4)}}</style>
</head>
<body><main>
<div class="logo-container" data-component-type="image" data-component-id="splash_logo" data-component-variant="default" role="img" aria-label="Mifos X Open Banking logo"><span class="material-icons">account_balance</span></div>
<h1 class="app-name" data-component-type="text" data-component-id="splash_app_name" data-component-variant="display_small">Mifos X Open Banking</h1>
<p class="tagline" data-component-type="text" data-component-id="splash_tagline" data-component-variant="body_large">Banking for Everyone</p>
<div class="error-card" data-component-type="card" data-component-id="splash_error_card" role="alert" aria-live="assertive">
  <div class="error-header"><span class="material-icons" aria-hidden="true">wifi_off</span><span class="error-title" data-component-type="text" data-component-id="splash_error_title">Connection failed</span></div>
  <p class="error-body" data-component-type="text" data-component-id="splash_error_body">We couldn't reach the Mifos X server. Please check your internet connection and try again.</p>
  <button class="retry-btn" data-component-type="button" data-component-id="splash_retry_button" data-action="onCheckSession" tabindex="0" aria-label="Retry connecting to Mifos X"><span class="material-icons" aria-hidden="true">refresh</span>Try again</button>
</div>
</main>
<span class="version">v1.0.0</span>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
