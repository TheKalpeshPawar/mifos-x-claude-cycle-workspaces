<!doctype html>
<html lang="en" data-screen="splash" data-state="error">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash Screen — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;--secondary:#386663;--error:#BA1A1A;--on-error:#FFF;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--warning:#E8A317; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);max-width:390px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px}
    .error-icon{width:80px;height:80px;border-radius:40px;background:#FDECEA;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
    .error-icon .material-icons{font-size:40px;color:var(--error)}
    .error-title{font-size:20px;font-weight:700;color:var(--on-background);margin-bottom:8px}
    .error-msg{font-size:14px;color:var(--on-surface-variant);margin-bottom:24px;line-height:1.5}
    .retry-btn{background:var(--primary);color:var(--on-primary);border:none;border-radius:12px;padding:12px 32px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="error-icon"><span class="material-icons">wifi_off</span></div>
  <h2 class="error-title">Connection Error</h2>
  <p class="error-msg">Unable to connect. Please check your network connection and try again.</p>
  <button class="retry-btn" data-action="retry_load" tabindex="0" aria-label="Retry">Try Again</button>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
