<!doctype html>
<html lang="en" data-screen="splash" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mifos X Open Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--surface);
      color: var(--on-background);
      min-height: 100vh;
    }
    .screen-root {
      max-width: 390px;
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      position: relative;
    }
    .splash-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .logo-wrap {
      width: 120px; height: 120px;
      border-radius: 28px;
      background: var(--primary-container);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 32px;
    }
    .logo-wrap .material-icons {
      font-size: 60px;
      color: var(--primary);
    }
    .app-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 16px;
      font-weight: 400;
      color: var(--secondary);
      text-align: center;
      margin-bottom: 56px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3.5px solid var(--primary-container);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .version-note {
      position: absolute;
      bottom: 28px;
      font-size: 12px;
      color: var(--outline-variant);
    }
  </style>
</head>
<body>
<div class="screen-root"
     data-component-type="stack"
     data-component-id="splash_root">

  <div class="splash-stack">
    <!-- Logo -->
    <div class="logo-wrap"
         data-component-type="image"
         data-component-id="splash_logo"
         role="img"
         aria-label="Mifos X application logo">
      <span class="material-icons" aria-hidden="true">account_balance</span>
    </div>

    <!-- App Name -->
    <h1 class="app-name"
        data-component-type="text"
        data-component-id="splash_app_name"
        role="heading"
        aria-label="Mifos X Open Banking">Mifos X Open Banking</h1>

    <!-- Tagline -->
    <p class="tagline"
       data-component-type="text"
       data-component-id="splash_tagline"
       aria-label="Banking for Everyone">Banking for Everyone</p>

    <!-- Loading Indicator -->
    <div class="spinner"
         data-component-type="icon"
         data-component-id="splash_loading_indicator"
         role="progressbar"
         aria-label="Loading, please wait"
         aria-busy="true"></div>
  </div>

  <span class="version-note">v1.0.0</span>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
