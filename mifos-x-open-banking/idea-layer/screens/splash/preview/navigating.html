<!doctype html>
<!-- render-hash: splash-navigating-v2 -->
<html lang="en" data-screen="splash" data-state="navigating" data-feature="splash" data-flavor="shared">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash — Mifos X Open Banking</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --secondary: #386663; --on-secondary: #FFFFFF; --secondary-container: #BCEBE7;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --grad-start: #CDEDA3; --grad-end: #F9FAEF;
    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
    --radius-lg: 16px; --radius-pill: 999px;
    --fs-display-sm: 32px; --fs-body-lg: 16px; --fs-body-sm: 12px;
    --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;
    --icon-2xl: 48px;
    --logo-size: 120px; --spinner-size: 40px; --spinner-border: 3px;
    --spin-dur: 900ms; --spin-ease: linear;
    --fade-dur: 400ms; --fade-ease: cubic-bezier(0.05, 0.7, 0.1, 1);
    --logo-shadow: 0 12px 32px rgba(76,102,43,0.28);
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B;
    --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    --grad-start: #354E16; --grad-end: #12140E;
    --logo-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735; --secondary-container: #1F4E4B;
      --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
      --grad-start: #354E16; --grad-end: #12140E;
      --logo-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, var(--grad-start) 0%, var(--grad-end) 100%);
    color: var(--on-background);
    min-height: 100vh; display: flex; flex-direction: column; position: relative;
  }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: var(--sp-xxl) var(--sp-xl);
    animation: lift var(--fade-dur) var(--fade-ease) forwards;
  }
  .logo {
    width: var(--logo-size); height: var(--logo-size);
    background: var(--primary); border-radius: var(--radius-lg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--logo-shadow); margin-bottom: var(--sp-lg);
  }
  .logo .material-icons-outlined { font-size: var(--icon-2xl); color: var(--on-primary); }
  .app-name {
    font-size: var(--fs-display-sm); font-weight: var(--fw-semibold);
    color: var(--primary); letter-spacing: -0.3px; margin-bottom: var(--sp-sm);
  }
  .tagline {
    font-size: var(--fs-body-lg); font-weight: var(--fw-regular);
    color: var(--secondary); margin-bottom: var(--sp-xl);
  }
  .spinner {
    width: var(--spinner-size); height: var(--spinner-size);
    border: var(--spinner-border) solid var(--surface-variant);
    border-top-color: var(--primary); border-radius: var(--radius-pill);
    animation: spin var(--spin-dur) var(--spin-ease) infinite;
  }
  .nav-hint {
    margin-top: var(--sp-md); font-size: var(--fs-body-sm); font-weight: var(--fw-medium);
    color: var(--on-surface-variant); letter-spacing: 0.4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes lift {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0.6; transform: translateY(-8px); }
  }
  .version {
    position: absolute; bottom: var(--sp-lg); left: 0; right: 0;
    text-align: center; font-size: var(--fs-body-sm);
    color: var(--on-surface-variant); letter-spacing: 0.4px;
  }
</style>
</head>
<body>
  <main>
    <div data-shell="root" data-screen-id="splash" data-state="navigating" data-component-type="stack" data-component-id="splash_root" style="display:flex;flex-direction:column;align-items:center;">
      <div class="logo" data-component-type="image" data-component-id="splash_logo" role="img" aria-label="Mifos X Open Banking logo">
        <span class="material-icons-outlined" aria-hidden="true">account_balance</span>
      </div>
      <h1 class="app-name" data-component-type="text" data-component-id="splash_app_name">Mifos X Open Banking</h1>
      <p class="tagline" data-component-type="text" data-component-id="splash_tagline">Banking for Everyone</p>
      <div class="spinner" data-component-type="loading_indicator" data-component-id="splash_loading_indicator" role="progressbar" aria-label="Loading, please wait"></div>
      <p class="nav-hint" aria-live="polite">Getting things ready…</p>
    </div>
  </main>
  <span class="version" aria-label="Version 1.0.0">v1.0.0</span>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
