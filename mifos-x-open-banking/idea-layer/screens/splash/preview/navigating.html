<!doctype html>
<!-- render-hash: splash-navigating-01 -->
<html lang="en" data-screen="splash" data-state="navigating" data-feature="splash" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Splash — Navigating</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#CDEDA3 0%,#F9FAEF 100%);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh;position:relative;overflow:hidden}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px;animation:fade-out 320ms ease forwards;animation-delay:200ms}
.logo-container{width:108px;height:108px;background:var(--primary);border-radius:28px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 12px 32px rgba(76,102,43,0.28);animation:logo-scale 400ms cubic-bezier(0.2,0,0,1)}.logo-container .material-icons{font-size:var(--icon-2xl);color:var(--on-primary)}
.app-name{font-size:28px;font-weight:700;color:var(--on-primary-container);margin-bottom:6px;letter-spacing:-0.3px}
.tagline{font-size:14px;color:var(--on-surface-variant);margin-bottom:32px;letter-spacing:0.3px}
.transition-text{font-size:13px;color:var(--on-surface-variant);font-weight:500;letter-spacing:0.4px}
@keyframes logo-scale{from{transform:scale(0.92);opacity:0.7}to{transform:scale(1);opacity:1}}
@keyframes fade-out{to{opacity:0.5;transform:translateY(-8px)}}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285}@media (prefers-color-scheme:dark){body{background:linear-gradient(135deg,#354E16 0%,#12140E 100%)}:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285}.app-name{color:var(--on-primary-container)}.logo-container{box-shadow:0 12px 32px rgba(0,0,0,0.4)}}</style>
</head>
<body><main>
<div class="logo-container" data-component-type="image" data-component-id="splash_logo" role="img" aria-label="Mifos X Open Banking logo"><span class="material-icons">account_balance</span></div>
<h1 class="app-name" data-component-type="text" data-component-id="splash_app_name">Mifos X Open Banking</h1>
<p class="tagline" data-component-type="text" data-component-id="splash_tagline">Banking for Everyone</p>
<p class="transition-text" data-component-type="text" data-component-id="splash_transition_text">Opening your dashboard</p>
</main>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
