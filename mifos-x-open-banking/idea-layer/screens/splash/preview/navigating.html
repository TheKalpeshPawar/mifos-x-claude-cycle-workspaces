<!doctype html>
<html lang="en" data-screen="splash" data-state="navigating">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mifos OBP — Navigating</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --outline: #75796C; --outline-variant: #C5C8BA; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--primary); color: var(--on-primary); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 40px 24px; }
    .logo-ring { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; }
    .logo-ring .material-icons { font-size: 54px; color: var(--on-primary); }
    .app-name { font-size: 32px; font-weight: 700; color: var(--on-primary); }
    .tagline { font-size: 15px; color: var(--primary-container); line-height: 1.5; }
    .nav-indicator { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .nav-spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--on-primary); border-radius: 50%; animation: spin 0.85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .nav-text { font-size: 14px; color: var(--primary-container); }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main data-component-type="stack" data-component-id="splash_navigating_root"
        role="status" aria-live="polite" aria-label="Redirecting to home screen">

    <div class="logo-ring" data-component-type="image" data-component-id="splash_logo" aria-hidden="true">
      <span class="material-icons">account_balance</span>
    </div>

    <h1 class="app-name" data-component-type="text" data-component-id="splash_app_name">Mifos OBP</h1>

    <p class="tagline" data-component-type="text" data-component-id="splash_tagline">
      Open Banking Platform
    </p>

    <div class="nav-indicator" data-component-type="box" data-component-id="splash_nav_indicator">
      <div class="nav-spinner" aria-hidden="true"></div>
      <span class="nav-text" data-component-type="text" data-component-id="splash_nav_text">Redirecting…</span>
    </div>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
