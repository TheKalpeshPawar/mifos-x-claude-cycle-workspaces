<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1.0" />
  <title>Splash — Loading State</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --background: #F9FAEF;
      --surface: #FFFFFF;
      --surface-variant: #E1E4D5;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --text-primary: #1A1C16;
      --text-secondary: #44483D;
      --tertiary: #386663;
      --error: #BA1A1A;
      --pending: #E8A317;
      --nav-active: #DCE7C8;
      --font: 'Outfit', system-ui, sans-serif;
    }

    html, body {
      width: 390px;
      min-height: 844px;
      font-family: var(--font);
      background-color: var(--background);
      color: var(--text-primary);
    }

    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 390px;
      min-height: 844px;
      background-color: var(--background);
      padding: 24px;
    }

    /* ── Logo circle (pulse animation in loading state) ──────── */
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logo-pulse 2s ease-in-out infinite;
    }

    .logo-letter {
      font-family: var(--font);
      font-size: 48px;
      font-weight: 600;
      color: var(--on-primary);
      line-height: 1;
      user-select: none;
    }

    @keyframes logo-pulse {
      0%   { transform: scale(1.0);  opacity: 1; }
      50%  { transform: scale(1.05); opacity: 0.85; }
      100% { transform: scale(1.0);  opacity: 1; }
    }

    /* ── App name ────────────────────────────────────────────── */
    .app-name {
      margin-top: 32px;
      font-family: var(--font);
      font-size: 32px;
      line-height: 40px;
      font-weight: 600;
      color: var(--primary);
      text-align: center;
      letter-spacing: 0;
    }

    /* ── Tagline ─────────────────────────────────────────────── */
    .tagline {
      margin-top: 8px;
      font-family: var(--font);
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: var(--tertiary);
      text-align: center;
    }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner-wrap {
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--primary-container);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="screen" data-screen="splash" data-state="loading" role="main" aria-label="Splash screen, loading">

    <!-- Logo (pulse animation active in loading state) -->
    <div class="logo"
         data-component-type="image"
         data-component-id="splash_logo"
         data-component-variant="default"
         role="img"
         aria-label="Mifos X application logo">
      <span class="logo-letter" aria-hidden="true">M</span>
    </div>

    <!-- App name -->
    <h1 class="app-name"
        data-component-type="text"
        data-component-id="splash_app_name"
        data-component-variant="display_sm">
      Mifos X Open Banking
    </h1>

    <!-- Tagline -->
    <p class="tagline"
       data-component-type="text"
       data-component-id="splash_tagline"
       data-component-variant="body_large">
      Banking for Everyone
    </p>

    <!-- Loading indicator -->
    <div class="spinner-wrap"
         data-component-type="icon"
         data-component-id="splash_loading_indicator"
         data-component-variant="circular_progress"
         role="progressbar"
         aria-label="Loading, please wait">
      <div class="spinner"></div>
    </div>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
