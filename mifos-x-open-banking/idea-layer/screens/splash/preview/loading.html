<!doctype html>
<html lang="en" data-screen="splash" data-state="loading" data-feature="splash" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splash — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--surface); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 32px; }
    .logo-container { width: 100px; height: 100px; background: var(--primary-container); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .logo-container .material-icons { font-size: 48px; color: var(--primary); }
    .app-name { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .tagline { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 40px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .version { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--outline); }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-container" data-component-type="image" data-component-id="splash_logo" role="img" aria-label="Mifos X Open Banking logo">
      <span class="material-icons">account_balance</span>
    </div>
    <h1 class="app-name" data-component-type="text" data-component-id="splash_app_name" role="heading" aria-level="1">Mifos X Open Banking</h1>
    <p class="tagline" data-component-type="text" data-component-id="splash_tagline">Banking for Everyone</p>
    <div class="spinner" data-component-type="icon" data-component-id="splash_loading_indicator" role="progressbar" aria-label="Loading application"></div>
  </main>
  <span class="version">v1.0.0</span>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
