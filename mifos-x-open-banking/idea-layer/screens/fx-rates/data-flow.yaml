sibling: data-flow
schema_version: "4.0"
feature_id: fx-rates
entries:
  - screen_id: fx-rates
    trigger: on_mount
    endpoints:
      - obp_currencies
    direction: read
    dtos:
      - name: Currency
        role: response
        api_id: obp_currencies
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 500
        behavior: show_error_state

  - screen_id: fx-rates
    trigger: on_mount
    endpoints:
      - obp_get_fx_rate
    direction: read
    dtos:
      - name: FxRate
        role: response
        api_id: obp_get_fx_rate
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_rate_unavailable_error
      - error_code: 500
        behavior: show_error_state

  - screen_id: fx-rates
    trigger: on_interact
    event: FromCurrencySelectedEvent
    endpoints:
      - obp_get_fx_rate
    direction: read
    dtos:
      - name: FxRate
        role: response
        api_id: obp_get_fx_rate
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_rate_unavailable_error

  - screen_id: fx-rates
    trigger: on_interact
    event: ToCurrencySelectedEvent
    endpoints:
      - obp_get_fx_rate
    direction: read
    dtos:
      - name: FxRate
        role: response
        api_id: obp_get_fx_rate
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_rate_unavailable_error

  - screen_id: fx-rates
    trigger: on_interact
    event: SwapCurrenciesEvent
    endpoints:
      - obp_get_fx_rate
    direction: read
    dtos:
      - name: FxRate
        role: response
        api_id: obp_get_fx_rate
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_rate_unavailable_error

  - screen_id: fx-rates
    trigger: on_interact
    event: PairSelectedEvent
    endpoints:
      - obp_get_fx_rate
    direction: read
    dtos:
      - name: FxRate
        role: response
        api_id: obp_get_fx_rate
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_rate_unavailable_error

  - screen_id: fx-rates
    trigger: on_interact
    event: AmountChangedEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: fx-rates
    trigger: on_interact
    event: SendMoneyEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
