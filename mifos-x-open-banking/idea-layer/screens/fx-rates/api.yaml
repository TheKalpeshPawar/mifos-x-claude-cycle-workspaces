sibling: api
schema_version: "4.0"
feature_id: fx-rates
api:
  - id: obp_currencies
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/currencies"
    tag: FX
    description: "List supported currencies for dropdown population"

  - id: obp_get_fx_rate
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/fx/{fromCurrencyCode}/{toCurrencyCode}"
    tag: FX
    params:
      - fromCurrencyCode: GBP
      - toCurrencyCode: EUR
    response:
      fields:
        - bank_id: String
        - from_currency_code: String
        - to_currency_code: String
        - conversion_value: Double
        - inverse_conversion_value: Double
        - effective_date: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Currency pair not supported"
      - 500: "Internal server error"
