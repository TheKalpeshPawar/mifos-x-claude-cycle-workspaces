responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      reduced_motion_fallback: static_placeholder
    layout:
      show_components:
        - fx_rates_title
      progress_components:
        - fx_progress_indicator
      hide_components:
        - last_updated_text
        - converter_card
        - popular_pairs_header
        - rate_row_gbp_eur
        - rate_row_gbp_usd
        - rate_row_gbp_jpy
        - rate_row_eur_usd
        - rate_row_usd_inr
        - rate_row_eur_gbp
        - fx_error_state
    note: "Centered CircularProgressIndicator while the selected pair + popular pairs + currencies load (no skeleton)."
  content:
    layout:
      show_components:
        - fx_rates_title
        - last_updated_text
        - converter_card
        - send_amount_input
        - from_currency_select
        - swap_currencies_icon
        - to_currency_select
        - converted_result_display
        - rate_info_text
        - send_money_cta
        - section_divider
        - popular_pairs_header
        - rate_row_gbp_eur
        - pair_label_gbp_eur
        - rate_value_gbp_eur
        - rate_row_gbp_usd
        - pair_label_gbp_usd
        - rate_value_gbp_usd
        - rate_row_gbp_jpy
        - pair_label_gbp_jpy
        - rate_value_gbp_jpy
        - rate_row_eur_usd
        - pair_label_eur_usd
        - rate_value_eur_usd
        - rate_row_usd_inr
        - pair_label_usd_inr
        - rate_value_usd_inr
        - rate_row_eur_gbp
        - pair_label_eur_gbp
        - rate_value_eur_gbp
      conditional_components:
        rate_available:
          - converted_result_display
          - rate_info_text
        rate_unavailable:
          - fx_rate_unavailable_notice
      note: "When the selected pair is unquotable, converted_result_display + rate_info_text are replaced by fx_rate_unavailable_notice and send_money_cta is disabled. last_updated_text hides when effective_date is blank."
  error:
    layout:
      show_components:
        - fx_rates_title
        - fx_error_state
        - fx_error_icon
        - fx_error_message
        - fx_retry_button
      hide_components:
        - converter_card
        - popular_pairs_header
        - rate_row_gbp_eur
        - rate_row_gbp_usd
        - rate_row_gbp_jpy
        - rate_row_eur_usd
        - rate_row_usd_inr
        - rate_row_eur_gbp
    note: "ScreenState.Error — the mandatory selected-pair rate could not be fetched. Empty also routes here (shipped FxErrorState handles Empty/Error/NoNetwork/Unauthenticated)."
  empty:
    layout:
      show_components:
        - fx_rates_title
        - fx_error_state
        - fx_error_icon
        - fx_error_message
        - fx_retry_button
      hide_components:
        - converter_card
        - popular_pairs_header
    note: "Folded into the shared error/retry view — no separate Reset-to-pair action (shipped projects only Loading/Failed→Error/Content)."
  no_network:
    layout:
      show_components:
        - fx_rates_title
        - fx_error_state
        - fx_error_icon
        - fx_error_message
        - fx_retry_button
      hide_components:
        - converter_card
        - popular_pairs_header
    note: "ScreenState.NoNetwork — rendered identically to error with retry via the shared FxErrorState branch."
  unauthenticated:
    layout:
      show_components:
        - fx_rates_title
        - fx_error_state
        - fx_error_icon
        - fx_error_message
        - fx_retry_button
      hide_components:
        - converter_card
        - popular_pairs_header
    note: "ScreenState.Unauthenticated — session expired; rendered via the shared FxErrorState branch with retry."

state_model:
  view_model: FxRatesViewModel
  content_type: FxRatesContent
  screen_state: "ScreenState<FxRatesContent>"
  selection:
    - name: fromCurrency
      type: String
      default: '"GBP"'
    - name: toCurrency
      type: String
      default: '"EUR"'
    - name: amountInput
      type: String
      default: '"1000"'
      note: "String, not Double — sanitized to digits + single dot, max 12 chars; parsed on render."
  raw_state:
    type: "Loading | Failed(error) | Loaded(currencies, rates, unavailable)"
    loaded_fields:
      - name: currencies
        type: "List<String>"
        note: "From v5.1.0 bank-currencies; sandbox returns empty so falls back to GBP/EUR/USD/JPY/INR/AUD/AED."
      - name: rates
        type: "Map<String, FxRate>"
        note: "Keyed 'FROM/TO'; per-pair lazy fetch via ensureRate, cached for the session."
      - name: unavailable
        type: "Set<String>"
        note: "Pair keys the bank cannot quote (400); not refetched, surfaced as the unavailable notice."
  content_fields:
    - name: fromCurrency
      type: String
    - name: toCurrency
      type: String
    - name: amountInput
      type: String
    - name: currencies
      type: "List<String>"
    - name: rateAvailable
      type: Boolean
    - name: convertedLabel
      type: String
    - name: rateLabel
      type: String
    - name: lastUpdatedLabel
      type: String
    - name: pairs
      type: "List<FxPairRow>"
      note: "Popular pairs that currently have a rate; a failed pair drops out individually."
  events:
    - onRetry
    - onAmountChanged
    - onFromCurrencySelected
    - onToCurrencySelected
    - onSwapCurrencies
    - onPairSelected
  actions:
    - retry_load
    - update_amount
    - select_from_currency
    - select_to_currency
    - swap_currencies
    - select_pair
    - navigate
  di:
    - FxRepository
  notes:
    - "Navigation to Send Money is the onSendMoney lambda passed to FxRatesScreen (no NavigationService); back is the onBack lambda."
    - "Selecting the currency already on the other side swaps the pair instead of duplicating it."
    - "POPULAR_PAIRS = GBP/EUR, GBP/USD, GBP/JPY, EUR/USD, USD/INR, EUR/GBP (all quotable on the sandbox, verified live)."

api:
  - id: obp_currencies
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/currencies"
    tag: FX
    description: "Supported currencies for the dropdowns. Sandbox returns an empty list for every bank, so the repository falls back to GBP/EUR/USD/JPY/INR/AUD/AED (codes the sandbox FX engine actually quotes)."

  - id: obp_get_fx_rate
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/fx/{fromCurrencyCode}/{toCurrencyCode}"
    tag: FX
    note: "Per-pair live rate. Called lazily per pair (ensureRate) and cached for the session; unquotable pairs answer 400 and are remembered in the unavailable set."
    response:
      fields:
        - bank_id: String
        - from_currency_code: String
        - to_currency_code: String
        - conversion_value: Double
        - inverse_conversion_value: Double
        - effective_date: String
    errors:
      - 400: "Currency pair not quotable by this bank"
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Currency pair not supported"
      - 500: "Internal server error"

navigation:
  - target: send-money
    label: "Send Money"
    trigger: send_money_cta
    note: "Via the onSendMoney lambda."

dependencies:
  tier: consumer
  features:
    - fx-rates
