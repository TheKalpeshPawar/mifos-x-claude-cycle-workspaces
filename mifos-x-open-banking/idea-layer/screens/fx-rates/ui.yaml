  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-05-27"
    by: "/idea enrich"
    note: "re-enriched: +component_states, +initial_state, +api bindings"
  - from: approved
    to: approved
    at: "2026-06-07T19:00:00Z"
    by: "/kmp-implement fx-rates"
    contract_version: "1.1.0"
    note: "Implemented as feature/fx-rates (new module). Converter card (amount input, from/to currency dropdowns, swap, live result + rate line, Send CTA → Pay tab) plus six tappable popular-pair rows that populate the converter. Client layer reuses the pre-existing FxApi/FxRepository (PFM groundwork); added GET v5.1.0 bank currencies endpoint — the sandbox returns an empty list for every bank, so the repository falls back to the codes the sandbox FX engine actually quotes (GBP/EUR/USD/JPY/INR/AUD/AED, probed live; pairs outside the set answer 400). All six spec pairs verified live. Per-pair rates cached for the session; unquotable pairs remembered and surfaced as an in-card unavailable notice. Deviations: rate-change chips (+0.2% etc.) omitted — OBP has no historical-rate endpoint so daily change is underivable; skeleton shimmer replaced by the app-standard loading indicator; selected-pair failure is a screen-level error with retry while popular rows degrade row-by-row. Entry point: home Banking Services grid — FX Rates tile took the Cards slot (Cards remains a bottom tab; user directive). 10 VM tests + 4 repository tests."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.1.0"
    note: "SOURCE→SPEC reconciliation to shipped FxRatesScreen.kt + FxRatesViewModel.kt. Added: session rate cache + per-pair lazy fetch (ensureRate); unquotable pairs surface a 'No exchange rate available for {from} / {to}.' in-card notice (rateAvailable=false) with the Send CTA disabled; currency-list fallback to sandbox-quotable codes; amount sanitization (digits + single dot, max 12 chars). Removed: per-pair rate-change %% chips (rate_change_* +0.2% etc. — OBP has no historical-rate endpoint, daily change underivable); skeleton shimmer (→ standard centered CircularProgressIndicator); empty-state Reset-to-GBP/EUR action (Empty folds into the shared error/retry view — shipped projects Loading/Failed→Error/Content only); flag emojis in the currency pickers (plain codes via OutlinedButton). state_model rewritten to ScreenState<FxRatesContent> with Selection(fromCurrency, toCurrency, amountInput:String) + RawState.Loaded(currencies, rates:Map, unavailable:Set); events onRetry/onAmountChanged/onFromCurrencySelected/onToCurrencySelected/onSwapCurrencies/onPairSelected; 6 POPULAR_PAIRS (GBP/EUR, GBP/USD, GBP/JPY, EUR/USD, USD/INR, EUR/GBP); nav via onSendMoney lambda (no NavigationService). Added +no_network and +unauthenticated states (rendered identically to error). api: obp_currencies corrected to v5.1.0 bank-currencies (sandbox empty → code fallback); obp_get_fx_rate stays v3.0.0 per-pair; response fields conversion_value/inverse_conversion_value/effective_date."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."


