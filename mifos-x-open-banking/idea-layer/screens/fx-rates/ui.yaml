states:
  loading:
    layout:
      show_components:
        - fx_rates_title
      skeleton_components:
        - last_updated_text
        - converter_card
        - send_amount_input
        - from_currency_select
        - swap_currencies_icon
        - to_currency_select
        - converted_result_display
        - rate_info_text
        - send_money_cta
        - popular_pairs_header
        - rate_row_gbp_eur
        - rate_row_gbp_usd
        - rate_row_gbp_jpy
        - rate_row_eur_usd
        - rate_row_usd_inr
        - rate_row_eur_gbp
  content:
    layout:
      show_components:
        - fx_rates_title
        - last_updated_text
        - converter_card
        - send_amount_input
        - from_currency_select
        - swap_currencies_icon
        - to_currency_select
        - converted_result_display
        - rate_info_text
        - send_money_cta
        - section_divider
        - popular_pairs_header
        - rate_row_gbp_eur
        - pair_label_gbp_eur
        - rate_value_gbp_eur
        - rate_change_gbp_eur
        - rate_row_gbp_usd
        - pair_label_gbp_usd
        - rate_value_gbp_usd
        - rate_change_gbp_usd
        - rate_row_gbp_jpy
        - pair_label_gbp_jpy
        - rate_value_gbp_jpy
        - rate_change_gbp_jpy
        - rate_row_eur_usd
        - pair_label_eur_usd
        - rate_value_eur_usd
        - rate_change_eur_usd
        - rate_row_usd_inr
        - pair_label_usd_inr
        - rate_value_usd_inr
        - rate_change_usd_inr
        - rate_row_eur_gbp
        - pair_label_eur_gbp
        - rate_value_eur_gbp
        - rate_change_eur_gbp
  error:
    layout:
      show_components:
        - fx_rates_title
      hide_components:
        - converter_card
        - popular_pairs_header
        - rate_row_gbp_eur
        - rate_row_gbp_usd
        - rate_row_gbp_jpy
        - rate_row_eur_usd
        - rate_row_usd_inr
        - rate_row_eur_gbp
      error_message: "Unable to load exchange rates. Check your connection and try again."

state_model:
  view_model: FxRatesViewModel
  state_fields:
    - name: fromCurrency
      type: String
      default: '"GBP"'
    - name: toCurrency
      type: String
      default: '"EUR"'
    - name: sendAmount
      type: Double
      default: "1000.0"
    - name: convertedAmount
      type: Double
      default: "1167.20"
    - name: exchangeRate
      type: Double
      default: "1.1672"
    - name: rateList
      type: "List<FxRate>"
      default: "emptyList()"
    - name: lastUpdated
      type: String
      default: '""'
    - name: isLoading
      type: Boolean
      default: "true"
  errors:
    - name: networkError
      type: "String?"
      default: "null"
    - name: rateUnavailable
      type: "String?"
      default: "null"
  events:
    - AmountChangedEvent
    - FromCurrencySelectedEvent
    - ToCurrencySelectedEvent
    - SwapCurrenciesEvent
    - PairSelectedEvent
    - SendMoneyEvent
  actions:
    - update_amount
    - select_from_currency
    - select_to_currency
    - swap_currencies
    - select_pair
    - navigate
  di:
    - FxRatesRepository
    - NavigationService

api:
  - id: obp_currencies
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/currencies"
    tag: FX
    description: "List supported currencies for dropdown population"

  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/fx/{fromCurrencyCode}/{toCurrencyCode}"
    tag: FX
    params:
      - fromCurrencyCode: GBP
      - toCurrencyCode: EUR
    response:
      fields:
        - bank_id: String
        - from_currency_code: String
        - to_currency_code: String
        - conversion_value: Double
        - inverse_conversion_value: Double
        - effective_date: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Currency pair not supported"
      - 500: "Internal server error"

navigation:
  - target: send-money
    label: "Send Money"
    trigger: send_money_cta

dependencies:
  tier: consumer
  features:
    - fx-rates
