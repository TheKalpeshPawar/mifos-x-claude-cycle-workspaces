<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px,initial-scale=1">
<title>FX Rates — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:390px;min-height:844px;position:relative;overflow-x:hidden;
  background:var(--background);font-family:var(--font);
}
.scroll-area{overflow-y:auto;height:calc(844px - 80px);padding-bottom:8px;}
.page-title{font-size:28px;font-weight:600;color:var(--primary);padding:24px 16px 0;}
@keyframes shimmer{
  0%{background-position:-390px 0;}
  100%{background-position:390px 0;}
}
.skeleton{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--background) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}
.ts-skel{height:14px;width:220px;border-radius:6px;margin:6px 16px 12px;}
.converter-skel{height:300px;border-radius:16px;margin:0 16px 16px;}
.row-skel{height:48px;border-radius:8px;margin:0 16px 2px;}
/* Bottom Nav */
.bottom-nav{
  position:absolute;bottom:0;left:0;width:390px;height:80px;
  background:var(--surface);border-top:1px solid var(--surface-variant);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px;
}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;width:80px;height:56px;border-radius:16px;
  background:transparent;border:none;cursor:pointer;font-family:var(--font);
}
.nav-tab.active{background:var(--nav-active);}
.nav-label{font-size:12px;font-weight:500;color:var(--outline);}
.nav-tab.active .nav-label{color:var(--primary);}
</style>
</head>
<body>
<main data-screen="fx-rates" data-state="loading" role="main" aria-busy="true" aria-label="Loading exchange rates">

  <div class="scroll-area">
    <h1 class="page-title">Exchange Rates</h1>
    <div class="ts-skel skeleton" role="presentation"></div>
    <div class="converter-skel skeleton" role="presentation"></div>
    <div class="row-skel skeleton" role="presentation"></div>
    <div class="row-skel skeleton" role="presentation"></div>
    <div class="row-skel skeleton" role="presentation"></div>
    <div class="row-skel skeleton" role="presentation"></div>
    <div class="row-skel skeleton" role="presentation"></div>
  </div>

  <!-- Consumer Bottom Nav: Home active -->
  <nav class="bottom-nav"
       data-shell="bottom-nav"
       role="navigation"
       aria-label="Main navigation">
    <button class="nav-tab active"
            data-nav-to="home"
            aria-label="Home"
            aria-current="page">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--primary);" aria-hidden="true">home</span>
      <span class="nav-label" style="color:var(--primary);">Home</span>
    </button>
    <button class="nav-tab"
            data-nav-to="accounts"
            aria-label="Accounts">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">account_balance</span>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-tab"
            data-nav-to="send-money"
            aria-label="Payments">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">payments</span>
      <span class="nav-label">Payments</span>
    </button>
    <button class="nav-tab"
            data-nav-to="cards"
            aria-label="Cards">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">credit_card</span>
      <span class="nav-label">Cards</span>
    </button>
    <button class="nav-tab"
            data-nav-to="profile"
            aria-label="Profile">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">person</span>
      <span class="nav-label">Profile</span>
    </button>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
