<!doctype html>
<!-- render-hash: f3e2m4p526a1 -->
<html lang="en" data-screen="fx-rates" data-state="empty" data-feature="fx-rates" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exchange Rates — No Rates Available</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px;
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 72px; }
  .top-bar { padding: 14px 16px 8px; }
  .top-bar h1 { font-size: 24px; font-weight: 700; color: var(--primary); }
  .selector-row { display: flex; gap: 10px; padding: 12px 16px 8px; }
  .currency-pill { flex: 1; display: inline-flex; align-items: center; gap: 6px; padding: 12px 14px; border-radius: 10px; background: var(--surface); color: var(--on-background); font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--outline-variant); justify-content: space-between; font-family: 'Outfit', sans-serif; }
  .currency-pill .material-icons { font-size: var(--icon-xs); color: var(--on-surface-variant); }
  .empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 32px 48px; }
  .empty-icon { width: 96px; height: 96px; border-radius: 48px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .empty-icon .material-icons { font-size: var(--icon-2xl); color: var(--on-primary-container); }
  .empty-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; line-height: 1.3; }
  .empty-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 24px; line-height: 1.45; max-width: 300px; }
  .pair-suggestion { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 280px; margin-bottom: 24px; }
  .suggest-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--surface); border-radius: var(--radius-soft); cursor: pointer; border: 1px solid var(--outline-variant); }
  .suggest-row:hover, .suggest-row:focus-visible { border-color: var(--primary); outline: none; }
  .suggest-row .code { font-size: 14px; font-weight: 700; color: var(--on-background); }
  .suggest-row .rate { font-size: 13px; color: var(--on-surface-variant); }
  .cta-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 12px; background: var(--primary); color: var(--on-primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
  .cta-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .cta-btn .material-icons { font-size: var(--icon-sm); }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--outline-variant); padding: 6px 0 10px; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
  <header class="top-bar" data-shell="top-bar"><h1>Exchange Rates</h1></header>
  <div class="selector-row">
    <button class="currency-pill" data-action="select_from_currency" aria-label="From currency">CNY <span class="material-icons">swap_horiz</span></button>
    <button class="currency-pill" data-action="select_to_currency" aria-label="To currency">TZS <span class="material-icons">expand_more</span></button>
  </div>

  <main class="empty-wrap" role="region" aria-label="No exchange rate available">
    <div class="empty-icon" aria-hidden="true"><span class="material-icons">currency_exchange</span></div>
    <h2 class="empty-title">No rate for CNY → TZS</h2>
    <p class="empty-msg">This currency pair isn't available right now. Try one of the popular pairs below, or reset to GBP / KES.</p>

    <div class="pair-suggestion" role="list" aria-label="Suggested currency pairs">
      <button class="suggest-row" role="listitem" data-action="select_pair" data-target="GBP_KES">
        <span class="code">GBP → KES</span><span class="rate">1 = 163.87</span>
      </button>
      <button class="suggest-row" role="listitem" data-action="select_pair" data-target="USD_KES">
        <span class="code">USD → KES</span><span class="rate">1 = 129.45</span>
      </button>
      <button class="suggest-row" role="listitem" data-action="select_pair" data-target="EUR_KES">
        <span class="code">EUR → KES</span><span class="rate">1 = 140.22</span>
      </button>
    </div>

    <button class="cta-btn" data-action="reset_currency_pair" aria-label="Reset to GBP and KES default pair"><span class="material-icons">restart_alt</span>Reset to GBP / KES</button>
  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item" data-nav-to="home" tabindex="0"><span class="material-icons">home</span>Home</a>
    <a class="nav-item" data-nav-to="accounts" tabindex="0"><span class="material-icons">account_balance</span>Accounts</a>
    <a class="nav-item active" data-nav-to="send-money" tabindex="0"><span class="material-icons">send</span>Pay</a>
    <a class="nav-item" data-nav-to="cards" tabindex="0"><span class="material-icons">credit_card</span>Cards</a>
    <a class="nav-item" data-nav-to="settings" tabindex="0"><span class="material-icons">more_horiz</span>More</a>
  </nav>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
