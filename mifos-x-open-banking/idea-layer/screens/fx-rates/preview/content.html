<!doctype html>
<html lang="en" data-screen="fx-rates" data-state="content" data-feature="fx-rates" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Rates — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .converter-card { background: var(--surface); border-radius: 16px; margin: 8px 20px 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .converter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .amount-input { flex: 1; padding: 12px 14px; background: var(--background); border: 1px solid var(--outline-variant); border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; color: var(--on-surface); }
    .currency-chip { padding: 8px 14px; border-radius: 10px; background: var(--primary-container); color: var(--primary); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .currency-chip .material-icons { font-size: 16px; }
    .swap-btn { width: 40px; height: 40px; border-radius: 20px; background: var(--primary); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; margin: 0 auto 12px; }
    .swap-btn .material-icons { font-size: 20px; color: var(--on-primary); }
    .result-text { font-size: 24px; font-weight: 700; color: var(--primary); text-align: center; padding: 8px 0; }
    .rate-info { font-size: 13px; color: var(--on-surface-variant); text-align: center; }
    .cta-btn { width: 100%; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    .section-title { font-size: 16px; font-weight: 700; color: var(--on-background); padding: 8px 20px; }
    .rate-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--surface-variant); }
    .rate-pair { font-size: 14px; font-weight: 600; color: var(--on-background); }
    .rate-value { font-size: 14px; color: var(--on-surface-variant); }
    .rate-change { font-size: 12px; font-weight: 600; }
    .rate-change.up { color: var(--primary); }
    .rate-change.down { color: var(--error); }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span>
      <h1>Exchange Rates</h1>
    </div>
    <div class="converter-card">
      <div class="converter-row">
        <input type="text" class="amount-input" value="1,000" data-action="update_amount" aria-label="Amount to convert" tabindex="0">
        <span class="currency-chip" data-action="select_from_currency" tabindex="0" aria-label="From currency: KES">KES <span class="material-icons">expand_more</span></span>
      </div>
      <button class="swap-btn" data-action="swap_currencies" tabindex="0" aria-label="Swap currencies"><span class="material-icons">swap_vert</span></button>
      <div class="converter-row">
        <span class="currency-chip" data-action="select_to_currency" tabindex="0" aria-label="To currency: USD">USD <span class="material-icons">expand_more</span></span>
      </div>
      <div class="result-text">$7.75</div>
      <div class="rate-info">1 USD = 129.03 KES · Updated 5 min ago</div>
      <button class="cta-btn" data-nav-to="send-money" tabindex="0" aria-label="Send Money">Send Money</button>
    </div>
    <div class="section-title">Popular Pairs</div>
    <div class="rate-row"><span class="rate-pair">GBP / EUR</span><span class="rate-value">1.1642</span><span class="rate-change up">+0.12%</span></div>
    <div class="rate-row"><span class="rate-pair">GBP / USD</span><span class="rate-value">1.2714</span><span class="rate-change up">+0.08%</span></div>
    <div class="rate-row"><span class="rate-pair">GBP / JPY</span><span class="rate-value">195.42</span><span class="rate-change down">-0.15%</span></div>
    <div class="rate-row"><span class="rate-pair">EUR / USD</span><span class="rate-value">1.0921</span><span class="rate-change up">+0.03%</span></div>
    <div class="rate-row"><span class="rate-pair">USD / KES</span><span class="rate-value">129.03</span><span class="rate-change down">-0.21%</span></div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
