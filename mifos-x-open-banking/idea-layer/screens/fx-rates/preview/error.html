<!doctype html>
<html lang="en" data-screen="fx-rates" data-state="error" data-feature="fx-rates" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Rates — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; }
    .error-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; }
    .error-icon { width: 80px; height: 80px; border-radius: 40px; background: rgba(186,26,26,0.08); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .error-icon .material-icons { font-size: 40px; color: var(--error); }
    .error-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .error-msg { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; margin-bottom: 24px; }
    .retry-btn { background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; padding: 12px 32px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span>
      <h1>Exchange Rates</h1>
    </div>
    <div class="error-content">
      <div class="error-icon"><span class="material-icons">error_outline</span></div>
      <h2 class="error-title">Could not load rates</h2>
      <p class="error-msg">We were unable to fetch exchange rates. Please check your connection and try again.</p>
      <button class="retry-btn" data-action="retry_load" tabindex="0" aria-label="Retry">Retry</button>
    </div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
