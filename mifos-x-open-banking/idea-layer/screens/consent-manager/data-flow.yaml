sibling: data-flow
schema_version: "4.0"
feature_id: consent-manager
entries:
  - screen_id: consent-manager
    trigger: on_mount
    event: LoadConsents
    endpoints:
      - get_account_access_consent
      - get_payment_consent
    direction: read
    dtos:
      - name: ConsentItem
        role: response
        api_id: get_account_access_consent
    produces_state: populated
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: consent-manager
    trigger: on_interact
    event: RevokeConsent
    endpoints:
      - delete_account_access_consent
    direction: write
    dtos: []
    produces_state: populated
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: consent-manager
    trigger: on_interact
    event: DisconnectAll
    endpoints:
      - delete_account_access_consent
    direction: write
    dtos: []
    produces_state: populated
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
