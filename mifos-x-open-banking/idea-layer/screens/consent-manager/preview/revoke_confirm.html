<!doctype html>
<html lang="en" data-screen="consent-manager" data-state="revoke_confirm" data-feature="consent-manager" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Revoke Access?</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }

    .dialog-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; } .dialog-msg { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; margin-bottom: 24px; }
    .dialog-actions { display: flex; gap: 12px; justify-content: flex-end; }
    .btn-cancel { padding: 10px 20px; background: transparent; border: none; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-revoke { padding: 10px 20px; background: var(--error); color: var(--on-error); border: none; border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main role="dialog" aria-label="Revoke access confirmation">
    <h2 class="dialog-title">Revoke access?</h2>
    <p class="dialog-msg">This will immediately remove this app's access to your account data. You can reconnect it at any time.</p>
    <div class="dialog-actions"><button class="btn-cancel" data-action="dismiss_revoke_dialog" tabindex="0" aria-label="Cancel">Cancel</button><button class="btn-revoke" data-action="confirm_revoke_consent" tabindex="0" aria-label="Revoke">Revoke</button></div>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
