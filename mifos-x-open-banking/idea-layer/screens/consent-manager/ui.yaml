states:
  loading:
    layout:
      visible_components:
        - consent_title
        - consent_subtitle
      show_skeleton_list: true
      skeleton_count: 2
  content:
    layout:
      visible_components:
        - consent_title
        - consent_subtitle
        - consent_monzo_plus
        - moneydash_header_row
        - moneydash_logo
        - moneydash_info
        - moneydash_name
        - moneydash_granted_date
        - moneydash_accepted_badge
        - moneydash_scopes_row
        - moneydash_scope_accounts
        - moneydash_scope_balances
        - moneydash_scope_transactions
        - moneydash_revoke_button
        - consent_savingwise
        - savingwise_header_row
        - savingwise_logo
        - savingwise_info
        - savingwise_name
        - savingwise_granted_date
        - savingwise_expired_badge
        - savingwise_scopes_row
        - savingwise_scope_balances
        - savingwise_remove_button
  empty:
    layout:
      visible_components:
        - consent_title
        - consent_subtitle
      show_empty_state: true
      empty_state_icon: link_off
      empty_state_title: "No apps connected"
      empty_state_message: "No apps are connected to your account. Third-party apps you authorise will appear here."
  error:
    layout:
      visible_components:
        - consent_title
        - consent_subtitle
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load connected apps"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: ConsentManagerViewModel
  state_fields:
    - name: consents
      type: "List<ConsentItem>"
      default: "emptyList()"
    - name: uiState
      type: ConsentManagerUiState
      default: Loading
    - name: revokingConsentId
      type: "String?"
      default: "null"
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load connected apps. Please try again."
    - field: revoke
      code: REVOKE_FAILED
      message: "Could not revoke consent. Please try again."
  events:
    - ConsentsLoaded
    - RevokeConsentClicked(consentId: String)
    - RevokeConsentConfirmed(consentId: String)
    - RevokeConsentComplete
    - RetryLoad
  actions:
    - revoke_consent
    - open_consent_info
  di:
    - ConsentRepository

api:
  - id: obp_my_consents
    endpoint: "GET /obp/v5.1.0/my/consents"
    tag: Consent
    description: "List all PSD2 consents granted by the user"
    response:
      fields:
        - name: consents
          type: "List<Consent>"
        - name: consent_id
          type: String
        - name: status
          type: String
          note: "INITIATED | ACCEPTED | REVOKED | EXPIRED"
        - name: created_at
          type: String
        - name: redirects
          type: "List<ConsentRedirect>"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"

dependencies:
  tier: feature
  features:
    - profile
    - settings

navigation:
  - action: revoke_consent
    target: ""
    description: "Show revoke confirmation dialog"
  - action: open_consent_info
    target: ""
    description: "Open PSD2 consent information sheet"
  - action: navigate_back
    target: settings
    description: "Return to settings screen"
