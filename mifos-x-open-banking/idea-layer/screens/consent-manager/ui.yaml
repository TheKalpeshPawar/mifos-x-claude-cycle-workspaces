        - budgetwise_name
        - budgetwise_dates
        - budgetwise_expired_badge
        - budgetwise_scopes_row
        - budgetwise_scope_check_balances
        - budgetwise_remove_button

  # content is aliased to populated for backward compat
  content:
    layout:
      alias: populated

  empty:
    layout:
      visible_components:
        - consent_title
        - consent_subtitle
        - empty_state_icon
        - empty_state_title
        - empty_state_body

  revoke_confirm:
    layout:
      visible_components:
        - consent_title
        - consent_subtitle
        - consent_moneymanager
        - moneymanager_header_row
        - moneymanager_logo
        - moneymanager_info
        - moneymanager_name
        - moneymanager_dates
        - moneymanager_active_badge
        - moneymanager_scopes_row
        - moneymanager_scope_read_accounts
        - moneymanager_scope_view_transactions
        - moneymanager_scope_check_balances
        - moneymanager_revoke_button
        - consent_taxhelper
        - taxhelper_header_row
        - taxhelper_logo
        - taxhelper_info
        - taxhelper_name
        - taxhelper_dates
        - taxhelper_active_badge
        - taxhelper_scopes_row
        - taxhelper_scope_view_transactions
        - taxhelper_scope_read_accounts
        - taxhelper_revoke_button
        - consent_budgetwise
        - budgetwise_header_row
        - budgetwise_logo
        - budgetwise_info
        - budgetwise_name
        - budgetwise_dates
        - budgetwise_expired_badge
        - budgetwise_scopes_row
        - budgetwise_scope_check_balances
        - budgetwise_remove_button
        - revoke_confirm_dialog
        - revoke_dialog_title
        - revoke_dialog_body
        - revoke_dialog_actions
        - revoke_dialog_cancel_button
        - revoke_dialog_confirm_button
      overlay: true
      overlay_scrim: "#80000000"

  error:
    layout:
      visible_components:
        - consent_title
        - consent_subtitle
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load connected apps"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: ConsentManagerViewModel
  state_fields:
    - name: consents
      type: "List<ConsentItem>"
      default: "emptyList()"
    - name: uiState
      type: ConsentManagerUiState
      default: Loading
    - name: revokingConsentId
      type: "String?"
      default: "null"
    - name: showRevokeDialog
      type: Boolean
      default: "false"
    - name: pendingRevokeConsent
      type: "ConsentItem?"
      default: "null"
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load connected apps. Please try again."
    - field: revoke
      code: REVOKE_FAILED
      message: "Could not revoke access. Please try again."
  events:
    - ConsentsLoaded
    - RevokeConsentClicked(consentId: String, appName: String)
    - RevokeConsentConfirmed(consentId: String)
    - RevokeConsentCancelled
    - RevokeConsentComplete(consentId: String)
    - RemoveExpiredConsentClicked(consentId: String)
    - RetryLoad
    - ConsentInfoOpened
  actions:
    - revoke_consent
    - confirm_revoke_consent
    - dismiss_revoke_dialog
    - open_consent_info
    - view_consent_detail
  di:
    - ConsentRepository

api:
  - id: obp_my_consents
    endpoint: "GET /obp/v5.1.0/my/consents"
    tag: Consent
    description: "List all PSD2 consents granted by the consumer user"
    response:
      fields:
        - name: consents
          type: "List<Consent>"
        - name: consent_id
          type: String
        - name: status
          type: String
          note: "INITIATED | ACCEPTED | REVOKED | EXPIRED"
        - name: created_at
          type: String
          note: "ISO-8601 UTC timestamp"
        - name: valid_until
          type: String
          note: "ISO-8601 UTC expiry timestamp"
        - name: consumer_id
          type: String
        - name: redirects
          type: "List<ConsentRedirect>"
        - name: json_web_token
          type: String
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"

  - id: obp_revoke_consent
    endpoint: "DELETE /obp/v5.1.0/my/consents/{consentId}"
    tag: Consent
    description: "Revoke a specific PSD2 consent by ID"
    path_params:
      - name: consentId
        type: String
    response:
      fields:
        - name: consent_id
          type: String
        - name: status
          type: String
          note: "REVOKED"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "CONSENT_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - profile
    - settings

navigation:
  - action: revoke_consent
    target: ""
    description: "Open revoke confirmation dialog (shows revoke_confirm state overlay)"
  - action: confirm_revoke_consent
    target: ""
    description: "Call DELETE consent API, dismiss dialog, refresh list"
  - action: dismiss_revoke_dialog
    target: ""
    description: "Dismiss revoke confirmation dialog, return to populated state"
  - action: view_consent_detail
    target: ""
    description: "Open bottom sheet with full consent detail and scope list"
  - action: open_consent_info
    target: ""
    description: "Open PSD2 consent information bottom sheet"
  - action: navigate_back
    target: settings
    description: "Return to settings screen"
