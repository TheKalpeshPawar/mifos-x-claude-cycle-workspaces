sibling: demo-data
schema_version: "4.0"
feature_id: consent-manager

# OBIE consents the PSU has granted to TPPs, surfaced on the consent-manager cards.
# account_access_consents: list of OBReadConsentResponse1 (one per GET account-access-consent).
# payment_consents: list of OBWriteDomesticConsentResponse5 so payment connections appear
# alongside account-access ones. Status enum AWAU|AUTH|RJCT|CANC|EXPD; AUTH renders ACTIVE,
# EXPD renders EXPIRED. Each item also carries a TppName for the card heading.
collections:
  account_access_consents:
    dto: OBReadConsentResponse1
    description: "200 OK per ConsentId — the account-access consents the PSU granted to third-party providers, with status, granted/expiry dates and permission clusters."
    items:
      - Data:
          ConsentId: "aac-1f8b2d40-91ce-4a77"
          Status: "AUTH"
          StatusUpdateDateTime: "2026-03-18T07:22:51.118Z"
          CreationDateTime: "2026-03-18T07:20:44.902Z"
          Permissions:
            - ReadAccountsDetail
            - ReadBalances
            - ReadTransactionsDetail
            - ReadStandingOrdersDetail
            - ReadDirectDebits
          ExpirationDateTime: "2026-09-14T07:20:44.902Z"
        TppName: "Emma Personal Finance"
        Links:
          Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/account-access-consents/aac-1f8b2d40-91ce-4a77"
        Meta:
          TotalPages: 1

      - Data:
          ConsentId: "aac-6c03e7a9-2b18-4f55"
          Status: "AUTH"
          StatusUpdateDateTime: "2026-05-02T19:41:09.557Z"
          CreationDateTime: "2026-05-02T19:39:33.210Z"
          Permissions:
            - ReadAccountsDetail
            - ReadBalances
            - ReadTransactionsDetail
            - ReadBeneficiariesDetail
            - ReadProducts
          ExpirationDateTime: "2026-11-01T19:39:33.210Z"
        TppName: "Plum Savings"
        Links:
          Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/account-access-consents/aac-6c03e7a9-2b18-4f55"
        Meta:
          TotalPages: 1

      - Data:
          ConsentId: "aac-d490a1f3-7e62-4c08"
          Status: "EXPD"
          StatusUpdateDateTime: "2026-05-28T00:00:00.000Z"
          CreationDateTime: "2025-11-28T14:05:12.640Z"
          Permissions:
            - ReadAccountsDetail
            - ReadBalances
            - ReadTransactionsDetail
          ExpirationDateTime: "2026-05-28T14:05:12.640Z"
        TppName: "Snoop Money"
        Links:
          Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/account-access-consents/aac-d490a1f3-7e62-4c08"
        Meta:
          TotalPages: 1

      - Data:
          ConsentId: "aac-3a77b2e1-5d09-44ba"
          Status: "CANC"
          StatusReason:
            - "Revoked by PSU"
          StatusUpdateDateTime: "2026-04-30T11:18:02.004Z"
          CreationDateTime: "2026-01-12T09:44:27.815Z"
          Permissions:
            - ReadAccountsDetail
            - ReadBalances
          ExpirationDateTime: "2026-07-12T09:44:27.815Z"
        TppName: "Yolt"
        Links:
          Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/account-access-consents/aac-3a77b2e1-5d09-44ba"
        Meta:
          TotalPages: 1

  payment_consents:
    dto: OBWriteDomesticConsentResponse5
    description: "200 OK — domestic-payment-consents the PSU authorised, shown alongside account-access connections. Status enum AwaitingAuthorisation|Authorised|Rejected|Consumed."
    items:
      - Data:
          ConsentId: "dpc-8b2f04c7-1a39-4e6d"
          Status: "Consumed"
          CreationDateTime: "2026-05-19T13:02:55.330Z"
          StatusUpdateDateTime: "2026-05-19T13:04:11.872Z"
          Initiation:
            InstructionIdentification: "INSTR-9920331"
            EndToEndIdentification: "E2E-RENT-MAY26"
            LocalInstrument: "UK.OBIE.FPS"
            InstructedAmount:
              Amount: "850.00"
              Currency: "GBP"
            CreditorAccount:
              SchemeName: "UK.OBIE.SortCodeAccountNumber"
              Identification: "401276 71043988"
              Name: "Greenway Lettings Ltd"
            RemittanceInformation:
              Reference: "Flat 6 May rent"
        Risk:
          PaymentContextCode: "PartyToParty"
        TppName: "Greenway Lettings"
        Links:
          Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/pisp/domestic-payment-consents/dpc-8b2f04c7-1a39-4e6d"
        Meta:
          TotalPages: 1

  # OBErrorResponse1 — drives the consent-manager error state.
  load_consents_error:
    description: "Representative 401 OBErrorResponse1 — the client-credentials token has expired and must be re-issued."
    item:
      Code: "401 Unauthorized"
      Id: "cm-err-7e14"
      Message: "Unauthorized"
      Errors:
        - ErrorCode: "UK.OBIE.Unauthorized"
          Message: "Please sign in again to manage your connected apps."
