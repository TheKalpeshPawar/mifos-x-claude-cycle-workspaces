feature: consent-onboarding
flow_ref: onboarding-consent

entry_points:
  - source: user-onboarding
    label: "User taps 'Connect with HSBC' on the onboarding screen"

transitions:
  - from: login
    to: consent-callback
    trigger: "HSBC authorisation redirect returns (OAuth callback) with auth code"
  - from: login
    to: user-onboarding
    trigger: "User taps Cancel"
