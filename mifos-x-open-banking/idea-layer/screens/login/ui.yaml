responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: idle
  idle:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_hero_badge, login_header_title, login_header_subtitle, login_card_title, login_username_input, login_password_input, login_remember_me_row, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_forgot_password_link, login_footer]
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_hero_badge, login_header_title, login_header_subtitle, login_card_title, login_username_input, login_password_input, login_remember_me_row, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_forgot_password_link, login_footer]
    note: "Canonical loading state alias — same as authenticating; login_cta_button shows loading spinner"
  authenticating:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_hero_badge, login_header_title, login_header_subtitle, login_card_title, login_username_input, login_password_input, login_remember_me_row, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_forgot_password_link, login_footer]
    note: "login_cta_button shows loading spinner; inputs disabled; oauth button disabled"
  oauth_redirecting:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [oauth_takeover_icon, oauth_redirect_title, oauth_redirect_msg, oauth_redirect_spinner]
    note: "Full-screen takeover (OAuthTakeover) — Bank icon + 'Redirecting to Open Bank Project' + message + spinner. System browser opens to OBP OIDC auth endpoint."
  oauth_exchanging:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [oauth_takeover_icon, oauth_exchange_title, oauth_exchange_msg, oauth_exchange_spinner]
    note: "Full-screen takeover (OAuthTakeover) — Bank icon + 'Completing Sign In' + message + spinner. App returned from browser with auth code; exchanging code for token."
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_hero_badge, login_header_title, login_header_subtitle, login_card_title, login_username_input, login_password_input, login_remember_me_row, login_error_banner, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_forgot_password_link, login_footer]
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_hero_badge, login_header_title, login_header_subtitle, login_card_title, login_username_input, login_password_input, login_remember_me_row, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_forgot_password_link, login_footer]

state_model:
  LoginViewModel:
    screen_state: LoginUiState
    state:
      - field: username
        type: String
        default: "\"\""
      - field: password
        type: String
        default: "\"\""
      - field: rememberMe
        type: Boolean
        default: "false"
      - field: isPasswordVisible
        type: Boolean
        default: "false"
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isLoading
        type: Boolean
        default: "false"
      - field: authMethod
        type: "AuthMethod"
        default: "AuthMethod.NONE"
        note: "enum AuthMethod { NONE, DIRECT_LOGIN, OAUTH_OIDC } — tracks which auth flow is in flight"
      - field: oauthPhase
        type: "OAuthPhase"
        default: "OAuthPhase.NONE"
        note: "enum OAuthPhase { NONE, REDIRECTING, EXCHANGING } — drives the full-screen OAuth takeover. PKCE code_verifier / CSRF state live inside ObpAuthRepository, NOT in UI state."
    derived:
      - field: isFormValid
        type: Boolean
        note: "computed get(): username.isNotBlank() && password.isNotBlank()"
    errors: [UNAUTHORIZED, BAD_REQUEST, REQUEST_TIMEOUT, TOO_MANY_REQUESTS, UNKNOWN]
    events:
      - LoginEvent.NavigateToForgotPassword
      - "LoginEvent.LaunchOidcAuth(authUrl: String)"
    actions:
      - "LoginAction.UsernameChanged(value: String)"
      - "LoginAction.PasswordChanged(value: String)"
      - LoginAction.RememberMeToggled
      - LoginAction.PasswordVisibilityToggled
      - LoginAction.DirectLoginClicked
      - LoginAction.OAuthLoginClicked
      - "LoginAction.OAuthCallback(code: String, state: String) — posted internally from OidcCallbackBus, not a user gesture"
      - LoginAction.ForgotPasswordClicked
      - "LoginAction.Internal.DirectLoginResultReceive(result) — internal async result"
      - "LoginAction.Internal.OAuthResultReceive(result) — internal async result"
    di: [ObpAuthRepository, UserDataRepository, OidcCallbackBus]
    base: "template.core.base.ui.viewmodel.BaseViewModel<LoginState, LoginEvent, LoginAction>"
    note: "Login success is REACTIVE: onAuthResult flips UserDataRepository.setIsAuthenticated(true); RootNavViewModel observes the authenticated session and routes to home/fo-dashboard. The screen never navigates to home/fo-dashboard imperatively — only NavigateToForgotPassword + LaunchOidcAuth are emitted as one-shot events."

navigation:
  - id: nav_to_forgot_password
    target: forgot-password
    trigger: forgot_password_click
    on_click:
      action: navigate
      target: forgot-password
    note: "Only outbound nav from the screen is forgot-password (one-shot LoginEvent.NavigateToForgotPassword). Post-login routing to home / fo-dashboard is handled reactively by RootNavViewModel observing UserDataRepository — NOT an imperative navigate from this screen."

api:
  # ── DirectLogin (form-based, sandbox-friendly) ───────────────────────
  - id: obp_direct_login
    endpoint: "POST /obp/v6.0.0/my/logins/direct"
    tag: Authentication
    trigger: on_direct_login_clicked
    description: "DirectLogin sends credentials in Authorization header (AuthApi.directLogin → v6.0.0/my/logins/direct)"
    request:
      headers:
        Authorization: 'DirectLogin username="{username}", password="{password}", consumer_key="{consumer_key}"'
      content_type: none
    response:
      fields:
        - name: token
          type: String
          stored_as: session_token
    errors:
      - code: 400
        name: INVALID_CREDENTIALS
        ui_message: "Invalid username or password. Please check your credentials and try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "You are not authorized to access this account."
      - code: 500
        name: SERVER_ERROR
        ui_message: "Something went wrong on our end. Please try again in a moment."

  # ── OAuth/OIDC (authorization_code + PKCE) ───────────────────────────
  - id: obp_oidc_discovery
    endpoint: "GET https://apisandbox.openbankproject.com/obp/v5.1.0/well-known"
    tag: Authentication
    trigger: app_startup
    description: "Discover OIDC provider from OBP well-known endpoint"
    response:
      fields:
        - name: provider_id
          type: String
          example: "obp-oidc"
        - name: well_known_url
          type: String
          example: "https://apisandbox-oidc.openbankproject.com/obp-oidc/.well-known/openid-configuration"

  - id: obp_oidc_authorize
    endpoint: "GET https://apisandbox-oidc.openbankproject.com/obp-oidc/auth"
    tag: Authentication
    trigger: on_oauth_login_clicked
    description: "Opens system browser for OAuth authorization_code flow with PKCE"
    request:
      params:
        response_type: "code"
        client_id: "{consumer_key}"
        redirect_uri: "org.mifos.openbanking://oauth/callback"
        scope: "openid profile email"
        state: "{csrf_state}"
        code_challenge: "{pkce_code_challenge}"
        code_challenge_method: "S256"
    response:
      redirect_params:
        - name: code
          type: String
        - name: state
          type: String
    errors:
      - code: 302
        name: OAUTH_CANCELLED
        ui_message: "Sign-in was cancelled. You can try again or use DirectLogin."

  - id: obp_oidc_token
    endpoint: "POST https://apisandbox-oidc.openbankproject.com/obp-oidc/token"
    tag: Authentication
    trigger: on_oauth_callback
    description: "Exchange authorization code for access_token + id_token + refresh_token"
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: grant_type
          type: String
          value: "authorization_code"
        - name: code
          type: String
          source: oauth_callback_code
        - name: redirect_uri
          type: String
          value: "org.mifos.openbanking://oauth/callback"
        - name: client_id
          type: String
          source: OBP_CONSUMER_KEY
        - name: code_verifier
          type: String
          source: pkce_code_verifier
    response:
      fields:
        - name: access_token
          type: String
          stored_as: session_token
        - name: id_token
          type: String
          note: "JWT signed with RS256; contains sub, name, email, email_verified"
        - name: refresh_token
          type: String
          stored_as: refresh_token
        - name: token_type
          type: String
          example: "Bearer"
        - name: expires_in
          type: Int
          example: 3600
    errors:
      - code: 400
        name: OAUTH_TOKEN_EXCHANGE_FAILED
        ui_message: "Authentication failed. Please try signing in again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "Invalid authorization. Please try again."

  - id: obp_oidc_userinfo
    endpoint: "GET https://apisandbox-oidc.openbankproject.com/obp-oidc/userinfo"
    tag: Authentication
    trigger: after_token_exchange
    description: "Fetch user profile after successful OAuth login"
    request:
      headers:
        Authorization: "Bearer {access_token}"
    response:
      fields:
        - name: sub
          type: String
        - name: name
          type: String
        - name: email
          type: String
        - name: email_verified
          type: Boolean

  - id: obp_oidc_refresh
    endpoint: "POST https://apisandbox-oidc.openbankproject.com/obp-oidc/token"
    tag: Authentication
    trigger: token_expired
    description: "Refresh access_token using refresh_token (silent re-auth)"
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: grant_type
          type: String
          value: "refresh_token"
        - name: refresh_token
          type: String
          source: stored_refresh_token
        - name: client_id
          type: String
          source: OBP_CONSUMER_KEY
    response:
      fields:
        - name: access_token
          type: String
        - name: refresh_token
          type: String
        - name: expires_in
          type: Int

  - id: obp_oidc_revoke
    endpoint: "POST https://apisandbox-oidc.openbankproject.com/obp-oidc/revoke"
    tag: Authentication
    trigger: on_logout
    description: "Revoke tokens on logout"
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: token
          type: String
          source: session_token
        - name: client_id
          type: String
          source: OBP_CONSUMER_KEY

dependencies:
  tier: feature
  features: [shared-core, obp-auth, obp-oidc-client]
