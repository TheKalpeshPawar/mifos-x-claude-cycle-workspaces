type: login
title: "Login"
flavor: shared
components:
  - type: text_field
    id: username_input
    label: "Username"
    placeholder: "Enter username"
  - type: text_field
    id: password_input
    label: "Password"
    placeholder: "Enter password"
    secure: true
  - type: checkbox
    id: remember_me
    label: "Remember me"
  - type: button
    id: login_button
    label: "Login"
    variant: contained
    on_click:
      target: home
      condition: "success"
  - type: button
    id: help_button
    label: "Need help?"
    variant: text
states:
  - idle
  - authenticating
  - error
navigation:
  - target: home
    label: "home"
