id: login
name: "Login"
feature: login
flavor: shared
status: approved
quality_score: 95
contract_version: "1.1.0"
approve_hash: "sha256:02af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-001, FR-002]
status_history:
  - { from: draft, to: enriched, at: "2026-05-25", by: "/idea enrich" }
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []


screens:
  - id: login
    name: "Login"
    viewmodel: "LoginViewModel"

archetype: form

components:
  - type: stack
    id: login_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - login_header_logo
      - login_header_title
      - login_header_subtitle
      - login_username_input
      - login_password_input
      - login_remember_me_row
      - login_error_banner
      - login_cta_button
      - login_divider
      - login_forgot_password_link

  - type: image
    id: login_header_logo
    content: "mifos_logo"
    label: "Mifos X logo"
    style:
      width: "80dp"
      height: "80dp"
      tint: "#4C662B"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "Mifos X Open Banking logo"
    test_context:
      purpose: "Brand logo at the top of the login form for trust and recognition"
      interaction_type: display
      data_driven: false

  - type: text
    id: login_header_title
    content: "Welcome Back"
    variant: headline_large
    style:
      typography: "Outfit/headline_small"
      color: "#4C662B"
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: heading
      level: 1
      label: "Welcome Back"
    test_context:
      purpose: "Login screen headline for context and persona warmth"
      interaction_type: display
      data_driven: false

  - type: text
    id: login_header_subtitle
    content: "Sign in to your Mifos X account"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Sign in to your Mifos X account"
    test_context:
      purpose: "Supporting copy below headline to orient the user"
      interaction_type: display
      data_driven: false

  - type: input
    id: login_username_input
    label: "Username"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#FFFFFF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      padding: spacing.md
    placeholder: "Enter your username"
    keyboard_type: text
    ime_action: next
    a11y:
      role: textbox
      label: "Username"
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      purpose: "Primary credential input — username or customer ID"
      interaction_type: input
      data_driven: false

  - type: input
    id: login_password_input
    label: "Password"
    variant: password
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#FFFFFF"
      typography: "Outfit/body_large"
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      padding: spacing.md
    placeholder: "Enter your password"
    keyboard_type: text
    ime_action: done
    trailing_icon: "visibility_toggle"
    a11y:
      role: textbox
      label: "Password, hidden"
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      purpose: "Password credential input with visibility toggle"
      interaction_type: input
      data_driven: false

  - type: stack
    id: login_remember_me_row
    variant: row
    style:
      padding_top: spacing.sm
      padding_bottom: spacing.sm
      alignment: center_start
    children:
      - login_remember_me_checkbox
      - login_remember_me_label

  - type: input
    id: login_remember_me_checkbox
    label: "Remember me"
    variant: checkbox
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      color: "#4C662B"
    a11y:
      role: checkbox
      label: "Remember me on this device"
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      purpose: "Persist session token across app restarts to skip re-authentication"
      interaction_type: action
      data_driven: false

  - type: text
    id: login_remember_me_label
    content: "Keep me signed in"
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      padding_start: spacing.sm
    a11y:
      role: text
      label: "Keep me signed in"
    test_context:
      purpose: "Label text paired with the remember-me checkbox"
      interaction_type: display
      data_driven: false

  - type: card
    id: login_error_banner
    variant: filled
    style:
      background: "#CDEDA3"
      border_color: "#BA1A1A"
      border_radius: "8dp"
      padding: spacing.md
      margin_bottom: spacing.md
    visible_when: "uiState == Error"
    children:
      - login_error_icon
      - login_error_message

  - type: icon
    id: login_error_icon
    content: "error_outline"
    variant: default
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      color: "#BA1A1A"
      size: "20dp"
    a11y:
      role: image
      label: "Error"
    test_context:
      purpose: "Error icon in the authentication failure banner"
      interaction_type: display
      data_driven: false

  - type: text
    id: login_error_message
    content: "Invalid username or password. Please check your credentials and try again."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#BA1A1A"
      padding_start: spacing.sm
    a11y:
      role: alert
      label: "Authentication error message"
    test_context:
      purpose: "Descriptive error message shown when DirectLogin returns 400 or 401"
      interaction_type: display
      data_driven: true

  - type: button
    id: login_cta_button
    label: "Sign In"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
      width: "match_parent"
    on_click:
      action: submit
      target: login
    loading_when: "uiState == Authenticating"
    a11y:
      role: button
      label: "Sign In with DirectLogin"
    keyboard:
      focusable: true
    test_context:
      purpose: "Submits DirectLogin credentials to OBP API; disabled when fields are empty"
      interaction_type: action
      data_driven: false

  - type: stack
    id: login_or_divider_row
    variant: row
    style:
      padding_top: spacing.lg
      padding_bottom: spacing.lg
      alignment: center
    children:
      - login_or_line_left
      - login_or_text
      - login_or_line_right

  - type: divider
    id: login_or_line_left
    style:
      color: "#E1E4D5"
      flex: 1
    a11y:
      role: separator
    test_context:
      purpose: "Left half of the OR divider between DirectLogin and OAuth"
      interaction_type: display
      data_driven: false

  - type: text
    id: login_or_text
    content: "OR"
    variant: label_medium
    style:
      typography: "Outfit/label_medium"
      color: "#44483D"
      padding_horizontal: spacing.md
    a11y:
      role: text
      label: "Or sign in with a different method"
    test_context:
      purpose: "Visual separator text between DirectLogin form and OAuth button"
      interaction_type: display
      data_driven: false

  - type: divider
    id: login_or_line_right
    style:
      color: "#E1E4D5"
      flex: 1
    a11y:
      role: separator
    test_context:
      purpose: "Right half of the OR divider"
      interaction_type: display
      data_driven: false

  - type: button
    id: login_oauth_button
    label: "Sign in with OBP Account"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#4C662B"
      typography: "Outfit/label_large"
      color: "#4C662B"
      border_radius: "8dp"
      padding: spacing.md
      width: "match_parent"
      icon_start: "open_in_browser"
    on_click:
      action: oauth_login
      target: obp_oidc_authorize
    a11y:
      role: button
      label: "Sign in using your Open Bank Project account via OAuth"
    keyboard:
      focusable: true
    test_context:
      purpose: "Initiates OAuth/OIDC authorization_code flow — opens system browser to OBP OIDC auth endpoint"
      interaction_type: action
      data_driven: false

  - type: text
    id: login_oauth_hint
    content: "Redirects to Open Bank Project for secure authentication"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_top: spacing.xs
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "OAuth login opens a browser for secure authentication"
    test_context:
      purpose: "Hint text explaining the OAuth redirect flow to set expectations"
      interaction_type: display
      data_driven: false

  - type: divider
    id: login_bottom_divider
    style:
      color: "#E1E4D5"
      margin_top: spacing.md
      margin_bottom: spacing.md
    a11y:
      role: separator
    test_context:
      purpose: "Divider above forgot password link"
      interaction_type: display
      data_driven: false

  - type: link
    id: login_forgot_password_link
    label: "Forgot Password?"
    variant: inline
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      alignment: center
      min_height: 44
      padding_vertical: spacing.sm
    on_click:
      action: navigate
      target: forgot-password
    a11y:
      role: link
      label: "Forgot Password? Navigate to password reset"
    keyboard:
      focusable: true
    test_context:
      purpose: "Secondary CTA for users who cannot recall their credentials"
      interaction_type: navigate
      data_driven: false

  - type: text
    id: oauth_redirect_title
    content: "Redirecting to Open Bank Project"
    style:
      typography: "Outfit/headline_small"
      color: "#1A1C16"
      alignment: center
    a11y:
      role: heading
      level: 2
      label: "Redirecting to Open Bank Project"

  - type: text
    id: oauth_redirect_msg
    content: "Opening your browser for secure OAuth authentication..."
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
    a11y:
      role: text

  - type: loading_indicator
    id: oauth_redirect_spinner
    variant: circular
    style:
      color: "#4C662B"
      size: "32dp"
    a11y:
      role: progressbar
      label: "Redirecting"

  - type: text
    id: oauth_exchange_title
    content: "Completing Sign In"
    style:
      typography: "Outfit/headline_small"
      color: "#1A1C16"
      alignment: center
    a11y:
      role: heading
      level: 2
      label: "Completing Sign In"

  - type: text
    id: oauth_exchange_msg
    content: "Exchanging authorization code for your session token..."
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
    a11y:
      role: text

  - type: loading_indicator
    id: oauth_exchange_spinner
    variant: circular
    style:
      color: "#4C662B"
      size: "32dp"
    a11y:
      role: progressbar
      label: "Exchanging token"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  idle:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_header_logo, login_header_title, login_header_subtitle, login_username_input, login_password_input, login_remember_me_row, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_bottom_divider, login_forgot_password_link]
  authenticating:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_header_logo, login_header_title, login_header_subtitle, login_username_input, login_password_input, login_remember_me_row, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_bottom_divider, login_forgot_password_link]
    note: "login_cta_button shows loading spinner; inputs disabled; oauth button disabled"
  oauth_redirecting:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [login_header_logo, oauth_redirect_title, oauth_redirect_msg, oauth_redirect_spinner]
    note: "Full-screen takeover — logo + redirecting message + spinner. System browser opens to OBP OIDC auth endpoint."
  oauth_exchanging:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [login_header_logo, oauth_exchange_title, oauth_exchange_msg, oauth_exchange_spinner]
    note: "Full-screen takeover — logo + exchanging message + spinner. App returned from browser with auth code; exchanging code for token."
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_header_logo, login_header_title, login_header_subtitle, login_username_input, login_password_input, login_remember_me_row, login_error_banner, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_bottom_divider, login_forgot_password_link]
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_header_logo, login_header_title, login_header_subtitle, login_username_input, login_password_input, login_remember_me_row, login_cta_button, login_or_divider_row, login_oauth_button, login_oauth_hint, login_bottom_divider, login_forgot_password_link]
  empty:
    layout: { type: column, padding: spacing.lg }
    visible_components: [login_header_logo, login_header_title, login_header_subtitle]
    show_empty_state: true
    empty_state_icon: account_circle_off
    empty_state_message: "No accounts found. Contact your bank to set up online banking."

state_model:
  LoginViewModel:
    screen_state: LoginUiState
    state:
      - field: username
        type: String
        default: "\"\""
      - field: password
        type: String
        default: "\"\""
      - field: rememberMe
        type: Boolean
        default: "false"
      - field: isPasswordVisible
        type: Boolean
        default: "false"
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isLoading
        type: Boolean
        default: "false"
      - field: authMethod
        type: "AuthMethod"
        default: "AuthMethod.NONE"
        note: "NONE | DIRECT_LOGIN | OAUTH_OIDC — tracks which auth flow is active"
      - field: oauthState
        type: "String?"
        default: "null"
        note: "CSRF state parameter for OAuth authorization_code flow"
      - field: oauthCodeVerifier
        type: "String?"
        default: "null"
        note: "PKCE code_verifier for OAuth PKCE flow"
    errors: [NETWORK_ERROR, INVALID_CREDENTIALS, UNAUTHORIZED, SERVER_ERROR, OAUTH_CANCELLED, OAUTH_TOKEN_EXCHANGE_FAILED, OAUTH_STATE_MISMATCH]
    events: [OnUsernameChanged, OnPasswordChanged, OnRememberMeToggled, OnPasswordVisibilityToggled, OnDirectLoginClicked, OnOAuthLoginClicked, OnOAuthCallback, OnForgotPasswordClicked, OnLoginSuccess, OnLoginError]
    actions: [onUsernameChanged(value: String), onPasswordChanged(value: String), onRememberMeToggled(), onPasswordVisibilityToggled(), onDirectLoginClicked(), onOAuthLoginClicked(), onOAuthCallback(code: String, state: String), onForgotPasswordClicked()]
    di: [ObpAuthRepository, ObpOidcClient, SessionManager, CredentialStore]

navigation:
  - id: nav_to_consumer_home
    target: home
    trigger: on_login_success
    condition: "userRole == CONSUMER"
    on_click:
      action: navigate
      target: home
  - id: nav_to_home
    target: home
    trigger: on_login_success
    condition: "userRole == CONSUMER"
    on_click:
      action: navigate
      target: home
  - id: nav_to_fo_dashboard
    target: fo-dashboard
    trigger: on_login_success
    condition: "userRole == FIELD_OFFICER"
    on_click:
      action: navigate
      target: fo-dashboard
  - id: nav_to_forgot_password
    target: forgot-password
    trigger: forgot_password_click
    on_click:
      action: navigate
      target: forgot-password

api:
  # ── DirectLogin (form-based, sandbox-friendly) ───────────────────────
  - id: obp_direct_login
    endpoint: "POST /my/logins/direct"
    tag: Authentication
    trigger: on_direct_login_clicked
    description: "DirectLogin sends credentials in Authorization header"
    request:
      headers:
        Authorization: 'DirectLogin username="{username}", password="{password}", consumer_key="{consumer_key}"'
      content_type: none
    response:
      fields:
        - name: token
          type: String
          stored_as: session_token
    errors:
      - code: 400
        name: INVALID_CREDENTIALS
        ui_message: "Invalid username or password. Please check your credentials and try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "You are not authorized to access this account."
      - code: 500
        name: SERVER_ERROR
        ui_message: "Something went wrong on our end. Please try again in a moment."

  # ── OAuth/OIDC (authorization_code + PKCE) ───────────────────────────
  - id: obp_oidc_discovery
    endpoint: "GET https://apisandbox.openbankproject.com/obp/v5.1.0/well-known"
    tag: Authentication
    trigger: app_startup
    description: "Discover OIDC provider from OBP well-known endpoint"
    response:
      fields:
        - name: provider_id
          type: String
          example: "obp-oidc"
        - name: well_known_url
          type: String
          example: "https://apisandbox-oidc.openbankproject.com/obp-oidc/.well-known/openid-configuration"

  - id: obp_oidc_authorize
    endpoint: "GET https://apisandbox-oidc.openbankproject.com/obp-oidc/auth"
    tag: Authentication
    trigger: on_oauth_login_clicked
    description: "Opens system browser for OAuth authorization_code flow with PKCE"
    request:
      params:
        response_type: "code"
        client_id: "{consumer_key}"
        redirect_uri: "org.mifos.openbanking://oauth/callback"
        scope: "openid profile email"
        state: "{csrf_state}"
        code_challenge: "{pkce_code_challenge}"
        code_challenge_method: "S256"
    response:
      redirect_params:
        - name: code
          type: String
        - name: state
          type: String
    errors:
      - code: 302
        name: OAUTH_CANCELLED
        ui_message: "Sign-in was cancelled. You can try again or use DirectLogin."

  - id: obp_oidc_token
    endpoint: "POST https://apisandbox-oidc.openbankproject.com/obp-oidc/token"
    tag: Authentication
    trigger: on_oauth_callback
    description: "Exchange authorization code for access_token + id_token + refresh_token"
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: grant_type
          type: String
          value: "authorization_code"
        - name: code
          type: String
          source: oauth_callback_code
        - name: redirect_uri
          type: String
          value: "org.mifos.openbanking://oauth/callback"
        - name: client_id
          type: String
          source: OBP_CONSUMER_KEY
        - name: code_verifier
          type: String
          source: pkce_code_verifier
    response:
      fields:
        - name: access_token
          type: String
          stored_as: session_token
        - name: id_token
          type: String
          note: "JWT signed with RS256; contains sub, name, email, email_verified"
        - name: refresh_token
          type: String
          stored_as: refresh_token
        - name: token_type
          type: String
          example: "Bearer"
        - name: expires_in
          type: Int
          example: 3600
    errors:
      - code: 400
        name: OAUTH_TOKEN_EXCHANGE_FAILED
        ui_message: "Authentication failed. Please try signing in again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "Invalid authorization. Please try again."

  - id: obp_oidc_userinfo
    endpoint: "GET https://apisandbox-oidc.openbankproject.com/obp-oidc/userinfo"
    tag: Authentication
    trigger: after_token_exchange
    description: "Fetch user profile after successful OAuth login"
    request:
      headers:
        Authorization: "Bearer {access_token}"
    response:
      fields:
        - name: sub
          type: String
        - name: name
          type: String
        - name: email
          type: String
        - name: email_verified
          type: Boolean

  - id: obp_oidc_refresh
    endpoint: "POST https://apisandbox-oidc.openbankproject.com/obp-oidc/token"
    tag: Authentication
    trigger: token_expired
    description: "Refresh access_token using refresh_token (silent re-auth)"
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: grant_type
          type: String
          value: "refresh_token"
        - name: refresh_token
          type: String
          source: stored_refresh_token
        - name: client_id
          type: String
          source: OBP_CONSUMER_KEY
    response:
      fields:
        - name: access_token
          type: String
        - name: refresh_token
          type: String
        - name: expires_in
          type: Int

  - id: obp_oidc_revoke
    endpoint: "POST https://apisandbox-oidc.openbankproject.com/obp-oidc/revoke"
    tag: Authentication
    trigger: on_logout
    description: "Revoke tokens on logout"
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: token
          type: String
          source: session_token
        - name: client_id
          type: String
          source: OBP_CONSUMER_KEY

dependencies:
  tier: feature
  features: [shared-core, obp-auth, obp-oidc-client]
