capability_completeness:
  answered_at: "2026-07-14"
  answered_by: "/idea-enrich"
  CC1_storage_location: "ConsentId stored in encrypted LocalStorage under key `consent-id-{state}` immediately after successful consent-create POST. OAuth state and nonce parameters stored under `oauth-state-{state}` for callback validation. Both are ephemeral session values cleared after successful callback or explicit revocation. No account/balance/transaction data is stored on this screen — it is consent initiation only."
  CC2_destructive_action_safety: "No destructive user actions. Cancel navigates back without side-effects. The consent-create POST is server-side only; if the PSU abandons in the loading state, the staged consent remains AwaitingAuthorisation on HSBC and expires per ExpirationDateTime without requiring app-side cleanup (OBIE-compliant behaviour)."
  CC3_nav_callback_wiring: "Cancel → user-onboarding via Navigator.navigateBack(). Empty-state Go Back → user-onboarding. Post-FAPI-redirect return → consent-callback screen via OS deep-link registered in AndroidManifest under the TPP redirect_uri scheme; not an in-app NavController transition."
  CC4_user_data_export: "No user-generated data created. ConsentId and OAuth state/nonce are AISP infrastructure values, not user content. Not subject to GDPR Article 20 data portability — no export mechanism required."
  CC5_permission_visibility: "Full OBReadConsent1.Permissions list (10 OBIE read scopes) is rendered in permissions_list with per-row human-readable label and description. PSU reviews every scope before tapping 'Continue to HSBC'. No additional OS runtime permissions are required for this screen."
  CC6_storage_budget_awareness: "ConsentId: 36-char UUID. OAuth state + nonce: two ~32-char random strings. Total LocalStorage footprint: <500 bytes. OBReadConsent1 request payload (~300 bytes JSON) is not cached locally; it is sent in-flight and discarded after a 201 response."
  CC7_network_data_policy: "Single authenticated POST to /account-access-consents using a client_credentials bearer token (no PSU token at consent-create stage). Response contains ConsentId only — no PSU account data. Response is consumed transiently to extract ConsentId and then garbage-collected; not persisted to disk. Ktorfit timeout: 15 seconds."
  CC8_cache_lifecycle: "ConsentId and OAuth state/nonce persist for the 90-day OBIE consent window. All are cleared by the consent-callback screen on successful authorisation exchange, or by the consent-detail revoke flow. A subsequent consent-create (re-authorisation flow) overwrites the stored ConsentId."
  CC9_error_recovery: "Five named error paths with distinct user messages: NetworkException, HttpException(400), HttpException(401), HttpException(500), FapiRedirectException. All surface error state with 'Could not connect to HSBC' title and error-specific body text, plus 'Try again' retry CTA re-triggering startOAuth(). Empty state (zero permissions) blocks consent-create and shows 'Go back' only — prevents submitting a zero-scope OBReadConsent1 that HSBC would reject with 400."

