description: >-
  OAuth/FAPI initiation screen. Displays the 10 OBIE read permissions being staged in OBReadConsent1 so the PSU
  understands what HSBC will ask them to approve. On 'Continue to HSBC', the app POSTs consent-create
  (client_credentials grant), builds a PS256-signed FAPI 1.0 Advanced /authorize URL (response_type=code id_token),
  and launches an app-to-app redirect to HSBC for SCA and account selection. Screen transitions to the authorising
  holding state once the redirect fires. Returns to consent-callback on the deep-link redirect leg.
has_ui: true
has_server: false
# has_system_integration: OAuth redirect out to the bank and back (deep_link).
# NOT is_auth_feature. That capability means the feature IS signin/signup/OTP and its
# sub-checks demand auth_screens[], OTP code TTL, resend rate limit and account-lockout
# policy. This app has none of those and cannot: the PSU authenticates AT their bank under
# the OBIE redirect model, so there is no password, no OTP and no lockout to declare here.
capabilities: [has_ui, has_api, has_flow, has_system_integration]
