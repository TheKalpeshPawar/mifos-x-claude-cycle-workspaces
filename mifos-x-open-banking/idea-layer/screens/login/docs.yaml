feature: consent-onboarding
status: enriched
cluster: consent
acceptance_refs: [FR-001, FR-002]
scaffolded_by: "/idea-heal"
archetype: login
description: "OAuth/FAPI initiation screen. Displays the 11 OBIE read permissions being staged in OBReadConsent1 so the PSU understands what HSBC will ask them to approve. On 'Continue to HSBC', the app POSTs consent-create (client_credentials grant), builds a PS256-signed FAPI 1.0 Advanced /authorize URL with PKCE S256, and launches an app-to-app redirect to HSBC for SCA and account selection. Screen transitions to the authorising holding state once the redirect fires. Returns to consent-callback on the deep-link redirect leg."
has_ui: true
has_server: false

metadata:
  category: composite
  implementation_ready: true
  impl_ready_at: "2026-06-29T12:00:00Z"
  impl_ready_schema: "v2"

contracts: []

libraries:
  - capability: rest-client
    library: ktorfit
    version: "latest"
    targets: [android, ios, desktop, web]
  - capability: jwt-signing
    library: jose4j
    version: "latest"
    targets: [android, ios, desktop, web]

vm_actions:
  - name: LoadPermissionsConfig
    signature: "fun loadPermissionsConfig(): Unit"
    state_mutations: ["uiState=Content(permissions=OBReadConsent1.Permissions, consentExpiryLabel=formatted)"]
    side_effects:
      - "Reads static OBReadConsent1.Permissions enum to build requested_permissions list"
      - "Computes consentExpiryLabel = DateFormatter.format(now + 90.days, 'd MMM yyyy', prefix='Expires ')"
    error_handling: {}

  - name: StartOAuth
    signature: "suspend fun startOAuth(): Unit"
    state_mutations: ["uiState=Loading", "uiState=Authorising", "uiState=Error(user_message)"]
    side_effects:
      - "ConsentService.createConsent(OBReadConsent1 with 11 Permissions, ExpirationDateTime, TransactionFromDateTime, TransactionToDateTime)"
      - "LocalStorage.storeConsentId(staged_consent.Data.ConsentId)"
      - "PkceGenerator.generateVerifier() → pkce_verifier"
      - "FapiAuthBuilder.buildAuthorizeUrl(consentId, pkce_challenge, pkce_method=S256, nonce, state, request_object_alg=PS256)"
      - "LocalStorage.storePkceVerifier(verifier, state)"
      - "Navigator.launchAppToAppRedirect(authorizeUrl)"
    error_handling:
      NetworkException: "uiState=Error(user_message='Unable to reach HSBC. Check your connection and try again.')"
      HttpException(400): "uiState=Error(user_message='HSBC rejected the consent request. Please try again.')"
      HttpException(401): "uiState=Error(user_message='Authorisation failed. The app may need to re-register with HSBC.')"
      HttpException(500): "uiState=Error(user_message='HSBC is temporarily unavailable. Try again in a moment.')"
      FapiRedirectException: "uiState=Error(user_message='Could not open HSBC. Ensure the HSBC Mobile Banking app is installed, or try again.')"

  - name: NavigateBack
    signature: "fun navigateBack(): Unit"
    state_mutations: []
    side_effects: ["Navigator.navigateBack()"]
    error_handling: {}

error_cases:
  - NetworkException
  - ConsentCreateBadRequest
  - ConsentCreateUnauthorised
  - ConsentCreateServerError
  - FapiRedirectFailed

test_fixtures:
  source: "screens/login/tests.yaml"
  scenario_count: 7
  priority_distribution: { high: 3, medium: 4, low: 0 }
