screen_id: login

endpoints:
  - id: consent-create
    method: POST
    path: "/account-access-consents"
    response_dto: OBReadConsentResponse1
    permission: null
    requires_auth: true
    notes: "Authenticated with client_credentials grant (not PSU token). Request body is OBReadConsent1 containing the full Permissions[] array and 90-day ExpirationDateTime. Returns ConsentId used to construct the FAPI authorisation URL."
