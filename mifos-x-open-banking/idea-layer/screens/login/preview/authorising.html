<!doctype html>
<!-- render-hash: 31e015e22d45f259bd6d53aa3e1cd546fa1363158a555f234b765aacd0e13c07 -->
<!-- feature: login · state: authorising -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect your bank — authorising</title><style>
:root{--p:#266489;--s:#F7F9FF;--o:#181C20;--ov:#41474D;--rf:9999px}
@media(prefers-color-scheme:dark){:root{--p:#95CDF7;--s:#101417;--o:#E0E3E8;--ov:#C1C7CE}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s);color:var(--o);font:16px/1.5 Roboto,sans-serif;display:flex;justify-content:center}
.d{width:393px;min-height:852px;display:flex;flex-direction:column;padding:0 24px}
.sb{height:54px}.ab{height:56px;display:flex;align-items:center}.t{font-size:22px}
.b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.sp{width:48px;height:48px;border-radius:var(--rf);border:4px solid color-mix(in srgb,var(--p) 24%,transparent);
border-top-color:var(--p);animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
.dt{font-size:14px;color:var(--ov)}
.nt{font-size:14px;color:var(--ov);max-width:300px}.bt{height:34px}</style></head>
<body><div class="d" data-screen="login" data-state="authorising">
<div class="sb"></div><div class="ab"><div class="t">Connect your bank</div></div>
<div class="b"><div class="sp" role="progressbar" aria-label="Opening HSBC"></div>
<div class="dt">Opening HSBC…</div>
<!--
  The app is BACKGROUNDED here — the PSU is at HSBC completing SCA. This state exists so
  returning to a backgrounded app shows something coherent rather than a stale form, and so
  the automatic return is expected. NO "I've finished" button and NO manual code entry:
  the redirect re-enters via ConsentRedirectBus and consent-callback takes over.
-->
<div class="nt">Continue in your browser. You'll come back here automatically.</div></div>
<div class="bt"></div></div></body></html>
