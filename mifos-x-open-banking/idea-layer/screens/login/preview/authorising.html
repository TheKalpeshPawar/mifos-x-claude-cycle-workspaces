<!doctype html>
<!-- render-hash: 9d5c8e2f1a4b -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connect with HSBC — Authorising</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    /* ── M3 Design Tokens ── */
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-shape-full: 9999px;
      --md-sys-shape-medium: 12px;
      --md-sys-motion-duration-medium: 300ms;
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0.0, 0, 1.0);
      --hsbc-red: #DB0011;
    }

    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-surface-container-lowest: #0B0F12;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #95CDF7;
        --md-sys-color-on-primary: #00344E;
        --md-sys-color-primary-container: #004B6F;
        --md-sys-color-on-primary-container: #C9E6FF;
        --md-sys-color-secondary: #B7C9D9;
        --md-sys-color-on-secondary: #22323F;
        --md-sys-color-secondary-container: #384956;
        --md-sys-color-on-secondary-container: #D3E5F5;
        --md-sys-color-error: #FFB4AB;
        --md-sys-color-on-error: #690005;
        --md-sys-color-error-container: #93000A;
        --md-sys-color-on-error-container: #FFDAD6;
        --md-sys-color-background: #101417;
        --md-sys-color-on-background: #E0E3E8;
        --md-sys-color-surface: #101417;
        --md-sys-color-on-surface: #E0E3E8;
        --md-sys-color-surface-variant: #41474D;
        --md-sys-color-on-surface-variant: #C1C7CE;
        --md-sys-color-outline: #8B9198;
        --md-sys-color-outline-variant: #41474D;
        --md-sys-color-surface-container: #1C2024;
        --md-sys-color-surface-container-low: #181C20;
        --md-sys-color-surface-container-lowest: #0B0F12;
      }
    }

    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── Material Symbols ── */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      vertical-align: middle;
      user-select: none;
    }

    /* ── Top App Bar ── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px;
      gap: 4px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .top-app-bar__leading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--md-sys-shape-full);
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
      background: none;
      border: none;
      /* disabled while user authenticates at HSBC */
      opacity: 0.38;
      pointer-events: none;
    }
    .top-app-bar__title {
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--md-sys-color-on-surface);
      flex: 1;
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Circular Spinner (M3) ── */
    .circular-progress {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }
    .circular-progress__track {
      fill: none;
      stroke: var(--md-sys-color-primary-container);
      stroke-width: 5;
    }
    .circular-progress__indicator {
      fill: none;
      stroke: var(--md-sys-color-primary);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 120 176;
      transform-origin: center;
      animation: spinner-rotate 1.5s ease-in-out infinite,
                 spinner-dash 1.5s ease-in-out infinite;
    }
    @keyframes spinner-rotate {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinner-dash {
      0%   { stroke-dasharray: 8 288; stroke-dashoffset: 0; }
      50%  { stroke-dasharray: 192 104; stroke-dashoffset: -96; }
      100% { stroke-dasharray: 8 288; stroke-dashoffset: -288; }
    }

    /* ── Screen Content ── */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      gap: 0;
      text-align: center;
    }

    /* ── HSBC brand mark (contextual during redirect) ── */
    .redirect-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    /* ── Status card ── */
    .status-card {
      background-color: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-sys-shape-medium);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    /* ── Authorising label ── */
    .authorising-label {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ── Authorising hint ── */
    .authorising-hint {
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 260px;
    }

    /* ── Waiting indicator dots ── */
    .waiting-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .waiting-dots__dot {
      width: 8px;
      height: 8px;
      border-radius: var(--md-sys-shape-full);
      background-color: var(--md-sys-color-primary);
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    .waiting-dots__dot:nth-child(2) { animation-delay: 0.2s; }
    .waiting-dots__dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.0); opacity: 1.0; }
    }

    /* ── Security reassurance ── */
    .security-reassurance {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      line-height: 16px;
      color: var(--md-sys-color-on-surface-variant);
      letter-spacing: 0.4px;
      margin-top: 32px;
    }
    .security-reassurance .material-symbols-outlined {
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body data-screen="login" data-state="authorising">

  <!-- Top App Bar (back disabled — user is at HSBC) -->
  <header class="top-app-bar" aria-label="Connect with HSBC">
    <button class="top-app-bar__leading" aria-label="Navigate back" aria-disabled="true" tabindex="-1">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <span class="top-app-bar__title">Connect with HSBC</span>
  </header>

  <!-- Screen Content -->
  <main class="screen-content"
        aria-live="polite"
        aria-label="Waiting for HSBC authorisation to complete"
        data-component-type="screen"
        data-component-id="login"
        data-component-variant="authorising">

    <!-- HSBC brand context -->
    <div class="redirect-brand" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="4" fill="#DB0011"/>
        <polygon points="16,1 31,16 16,16" fill="#FFFFFF" opacity="0.92"/>
        <polygon points="16,31 1,16 16,16" fill="#FFFFFF" opacity="0.92"/>
      </svg>
      <svg width="52" height="16" viewBox="0 0 52 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <text y="13" font-family="Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#DB0011" letter-spacing="2">HSBC</text>
      </svg>
    </div>

    <!-- Status card with spinner + labels -->
    <div class="status-card">

      <!-- Circular progress spinner -->
      <svg class="circular-progress"
           viewBox="0 0 68 68"
           xmlns="http://www.w3.org/2000/svg"
           role="progressbar"
           aria-label="Waiting for HSBC authorisation to complete"
           aria-live="polite"
           data-component-type="progress_indicator"
           data-component-id="authorising_spinner"
           data-component-variant="circular">
        <circle class="circular-progress__track" cx="34" cy="34" r="29"/>
        <circle class="circular-progress__indicator" cx="34" cy="34" r="29"/>
      </svg>

      <!-- Waiting dots visual -->
      <div class="waiting-dots" aria-hidden="true">
        <div class="waiting-dots__dot"></div>
        <div class="waiting-dots__dot"></div>
        <div class="waiting-dots__dot"></div>
      </div>

      <!-- Authorising label -->
      <p class="authorising-label"
         data-component-type="text"
         data-component-id="authorising_label"
         data-component-variant="bodyMedium">
        Opening HSBC…
      </p>

      <!-- Authorising hint -->
      <p class="authorising-hint"
         data-component-type="text"
         data-component-id="authorising_hint"
         data-component-variant="bodySmall">
        Complete sign-in in the HSBC app, then return here.
      </p>

    </div>

    <!-- FAPI security reassurance -->
    <div class="security-reassurance">
      <span class="material-symbols-outlined" aria-hidden="true">lock</span>
      Secured with FAPI 1.0 Advanced
    </div>

  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
