<!doctype html>
<!-- render-hash: 7f1e4a6b3c9d -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connect with HSBC — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    /* ── M3 Design Tokens ── */
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-shape-full: 9999px;
      --md-sys-shape-medium: 12px;
      --md-sys-motion-duration-medium: 300ms;
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-surface-container-lowest: #0B0F12;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #95CDF7;
        --md-sys-color-on-primary: #00344E;
        --md-sys-color-primary-container: #004B6F;
        --md-sys-color-on-primary-container: #C9E6FF;
        --md-sys-color-secondary: #B7C9D9;
        --md-sys-color-on-secondary: #22323F;
        --md-sys-color-secondary-container: #384956;
        --md-sys-color-on-secondary-container: #D3E5F5;
        --md-sys-color-error: #FFB4AB;
        --md-sys-color-on-error: #690005;
        --md-sys-color-error-container: #93000A;
        --md-sys-color-on-error-container: #FFDAD6;
        --md-sys-color-background: #101417;
        --md-sys-color-on-background: #E0E3E8;
        --md-sys-color-surface: #101417;
        --md-sys-color-on-surface: #E0E3E8;
        --md-sys-color-surface-variant: #41474D;
        --md-sys-color-on-surface-variant: #C1C7CE;
        --md-sys-color-outline: #8B9198;
        --md-sys-color-outline-variant: #41474D;
        --md-sys-color-surface-container: #1C2024;
        --md-sys-color-surface-container-low: #181C20;
        --md-sys-color-surface-container-lowest: #0B0F12;
      }
    }

    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── Material Symbols ── */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      vertical-align: middle;
      user-select: none;
    }

    /* ── Top App Bar ── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px;
      gap: 4px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .top-app-bar__leading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--md-sys-shape-full);
      cursor: pointer;
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
      background: none;
      border: none;
      transition: background-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
    }
    .top-app-bar__leading:hover {
      background-color: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
    }
    .top-app-bar__title {
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--md-sys-color-on-surface);
      flex: 1;
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Screen Content ── */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 32px;
      gap: 0;
    }

    /* ── Error Container (M3 error-container surface) ── */
    .error-container {
      background-color: var(--md-sys-color-error-container);
      border-radius: var(--md-sys-shape-full);
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      flex-shrink: 0;
    }
    .error-container .material-symbols-outlined {
      font-size: 44px;
      color: var(--md-sys-color-on-error-container);
    }

    /* ── Error Empty State ── */
    .error-title {
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--md-sys-color-on-surface);
      text-align: center;
      margin-bottom: 12px;
    }
    .error-body {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
      max-width: 300px;
      margin-bottom: 32px;
    }

    /* ── Error detail card (error context) ── */
    .error-detail-card {
      background-color: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-sys-shape-medium);
      padding: 12px 16px;
      width: 100%;
      margin-bottom: 32px;
      border-left: 3px solid var(--md-sys-color-error);
    }
    .error-detail-card__text {
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .error-detail-card__code {
      font-size: 11px;
      font-weight: 500;
      line-height: 16px;
      color: var(--md-sys-color-error);
      margin-top: 4px;
      font-family: 'Roboto Mono', 'Roboto', monospace;
    }

    /* ── CTA area ── */
    .cta-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    /* ── Filled button ── */
    .btn-filled {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 0 24px;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: var(--md-sys-shape-full);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      cursor: pointer;
      border: none;
      width: 100%;
      min-height: 48px;
      transition: box-shadow var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
    }
    .btn-filled:hover {
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.3), 0 1px 2px -1px rgba(0,0,0,0.3);
    }

    /* ── Text button ── */
    .btn-text {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 12px;
      background: none;
      color: var(--md-sys-color-primary);
      border-radius: var(--md-sys-shape-full);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      cursor: pointer;
      border: none;
      width: 100%;
      min-height: 48px;
      transition: background-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
    }
    .btn-text:hover {
      background-color: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);
    }
  </style>
</head>
<body data-screen="login" data-state="error">

  <!-- Top App Bar -->
  <header class="top-app-bar" aria-label="Connect with HSBC">
    <button
      class="top-app-bar__leading"
      aria-label="Navigate back"
      data-action="navigate_back"
      data-nav-to="user-onboarding">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <span class="top-app-bar__title">Connect with HSBC</span>
  </header>

  <!-- Error State Screen Content -->
  <main class="screen-content"
        aria-label="Error connecting to HSBC"
        aria-live="assertive"
        data-component-type="empty_state"
        data-component-id="error_state"
        data-component-variant="error">

    <!-- Error icon container (M3 error-container pattern) -->
    <div class="error-container" aria-hidden="true">
      <span class="material-symbols-outlined">error</span>
    </div>

    <!-- Error title -->
    <h1 class="error-title">
      Could not connect to HSBC
    </h1>

    <!-- Error body (VM-mapped user message — showing NetworkException mapping as default) -->
    <p class="error-body">
      Unable to reach HSBC. Check your connection and try again.
    </p>

    <!-- Error detail card (technical context for the PSU) -->
    <div class="error-detail-card" aria-label="Error details">
      <p class="error-detail-card__text">The consent request to HSBC could not be completed.</p>
      <p class="error-detail-card__code">Consent ID not yet created &middot; Consent stage: staging</p>
    </div>

    <!-- CTAs -->
    <div class="cta-area">

      <!-- Primary: Try again (re-triggers start_oauth) -->
      <button
        class="btn-filled"
        aria-label="Try again to create consent"
        data-component-type="button"
        data-component-id="retry_button"
        data-component-variant="filled"
        data-action="start_oauth">
        Try again
      </button>

      <!-- Secondary: Cancel -->
      <button
        class="btn-text"
        aria-label="Cancel and return to onboarding"
        data-component-type="button"
        data-component-id="cancel_button"
        data-component-variant="text"
        data-action="navigate_back"
        data-nav-to="user-onboarding">
        Cancel
      </button>

    </div>

  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
