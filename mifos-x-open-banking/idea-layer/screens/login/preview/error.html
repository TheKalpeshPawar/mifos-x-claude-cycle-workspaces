<!doctype html>
<html lang="en" data-screen="login" data-state="error">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Login — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
main{display:flex;flex-direction:column;align-items:center;padding:40px 24px;gap:16px;min-height:844px;}
.logo-container{width:80px;height:80px;background:var(--primary-container);border-radius:40px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.logo-container .mi{font-size:40px;color:var(--primary);}
.screen-title{font-size:26px;font-weight:700;color:var(--primary);text-align:center;}
.screen-subtitle{font-size:14px;color:var(--outline);text-align:center;margin-bottom:8px;}
.error-banner{width:100%;background:#FFDAD6;border-radius:8px;padding:12px 16px;}
.error-banner-text{font-size:13px;color:var(--error);line-height:1.4;}
.input-wrapper{width:100%;display:flex;flex-direction:column;gap:6px;}
.input-label{font-size:12px;font-weight:500;color:var(--text-secondary);}
.input-field{width:100%;padding:14px 12px;border:1px solid var(--outline-variant);border-radius:8px;font-family:var(--font);font-size:14px;background:var(--surface);color:var(--text-primary);outline:none;}
.input-field.error{border-color:var(--error);}
.login-btn{width:100%;padding:16px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
.divider-row{display:flex;align-items:center;gap:12px;width:100%;}
.divider-line{flex:1;height:1px;background:var(--surface-variant);}
.divider-text{font-size:12px;color:var(--outline);}
.forgot-link{font-size:14px;color:var(--tertiary);cursor:pointer;text-align:center;}
</style>
</head>
<body>
<main>
  <div class="logo-container">
    <span class="mi">account_balance</span>
  </div>
  <h2 class="screen-title">Welcome Back</h2>
  <p class="screen-subtitle">Sign in to your Mifos X account</p>

  <div class="error-banner">
    <p class="error-banner-text">Invalid username or password. Please check your credentials and try again.</p>
  </div>

  <div class="input-wrapper">
    <span class="input-label">Username</span>
    <input class="input-field error" type="text" placeholder="Enter your username" aria-label="Username">
  </div>
  <div class="input-wrapper">
    <span class="input-label">Password</span>
    <input class="input-field" type="password" placeholder="Enter your password" aria-label="Password">
  </div>

  <button class="login-btn" data-action="submit_login">Sign In</button>

  <div class="divider-row">
    <div class="divider-line"></div>
    <span class="divider-text">or</span>
    <div class="divider-line"></div>
  </div>

  <span class="forgot-link" data-nav-to="forgot-password">Forgot password?</span>
</main>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
