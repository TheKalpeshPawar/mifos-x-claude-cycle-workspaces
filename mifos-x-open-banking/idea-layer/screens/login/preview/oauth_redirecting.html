<!doctype html>
<html lang="en" data-screen="login" data-state="oauth_redirecting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Redirecting to OBP</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; gap: 20px; -webkit-font-smoothing: antialiased; }
    /* Logo pair */
    .logo-pair { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    .logo-box { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .logo-mifos { background: var(--primary-container); }
    .logo-mifos .material-icons { font-size: 34px; color: var(--primary); }
    .logo-arrow { display: flex; align-items: center; }
    .logo-arrow .material-icons { font-size: 28px; color: var(--outline); }
    .logo-obp { background: var(--secondary); }
    .logo-obp .material-icons { font-size: 34px; color: #FFFFFF; }
    /* Content */
    .redirect-title { font-size: 22px; font-weight: 700; color: var(--on-surface); }
    .redirect-sub { font-size: 14px; color: var(--on-surface-variant); line-height: 1.6; }
    /* Spinner */
    .spinner-row { display: flex; align-items: center; gap: 12px; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.85s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { font-size: 14px; color: var(--primary); font-weight: 500; }
    /* Security note */
    .security-card { background: var(--surface); border-radius: 12px; padding: 14px 16px; width: 100%; border: 1px solid var(--outline-variant); display: flex; gap: 10px; align-items: flex-start; text-align: left; }
    .security-card .material-icons { color: var(--outline); font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .security-text { font-size: 12px; color: var(--on-surface-variant); line-height: 1.5; }
    /* Cancel */
    .cancel-btn { background: none; border: none; color: var(--outline); font-family: 'Outfit', sans-serif; font-size: 14px; cursor: pointer; padding: 8px; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main data-component-type="stack" data-component-id="login_oauth_redirect_root"
        role="status" aria-live="polite" aria-label="Redirecting to OBP authorization server">

    <div class="logo-pair" aria-hidden="true">
      <div class="logo-box logo-mifos">
        <span class="material-icons">account_balance</span>
      </div>
      <div class="logo-arrow">
        <span class="material-icons">east</span>
      </div>
      <div class="logo-box logo-obp">
        <span class="material-icons">vpn_key</span>
      </div>
    </div>

    <h1 class="redirect-title" data-component-type="text" data-component-id="oauth_redirect_title">
      Redirecting to OBP
    </h1>

    <p class="redirect-sub" data-component-type="text" data-component-id="oauth_redirect_sub">
      You will be taken to the Open Banking Platform authorization page to sign in securely.
    </p>

    <div class="spinner-row">
      <div class="spinner" aria-hidden="true"></div>
      <span class="spinner-text" data-component-type="text" data-component-id="oauth_redirect_status">Redirecting to OBP…</span>
    </div>

    <div class="security-card" data-component-type="box" data-component-id="oauth_security_note">
      <span class="material-icons" aria-hidden="true">lock</span>
      <span class="security-text">Your credentials are handled securely by the OBP authorization server — Mifos never sees your password.</span>
    </div>

    <button class="cancel-btn"
            data-component-type="button" data-component-id="cancel_oauth_button"
            data-action="cancel_oauth" aria-label="Cancel and go back to login" tabindex="0">
      Cancel
    </button>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
