<!doctype html>
<!-- render-hash: 4e7b2f91c3a8 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connect with HSBC — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    /* ── M3 Design Tokens ── */
    :root {
      --md-sys-color-primary: #266489;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #C9E6FF;
      --md-sys-color-on-primary-container: #004B6F;
      --md-sys-color-secondary: #50606E;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #D3E5F5;
      --md-sys-color-on-secondary-container: #384956;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #93000A;
      --md-sys-color-background: #F7F9FF;
      --md-sys-color-on-background: #181C20;
      --md-sys-color-surface: #F7F9FF;
      --md-sys-color-on-surface: #181C20;
      --md-sys-color-surface-variant: #DDE3EA;
      --md-sys-color-on-surface-variant: #41474D;
      --md-sys-color-outline: #72787E;
      --md-sys-color-outline-variant: #C1C7CE;
      --md-sys-color-surface-container: #EBEEF3;
      --md-sys-color-surface-container-low: #F1F4F9;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-shape-full: 9999px;
      --md-sys-shape-medium: 12px;
      --md-sys-motion-duration-medium: 300ms;
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    [data-theme="dark"] {
      --md-sys-color-primary: #95CDF7;
      --md-sys-color-on-primary: #00344E;
      --md-sys-color-primary-container: #004B6F;
      --md-sys-color-on-primary-container: #C9E6FF;
      --md-sys-color-secondary: #B7C9D9;
      --md-sys-color-on-secondary: #22323F;
      --md-sys-color-secondary-container: #384956;
      --md-sys-color-on-secondary-container: #D3E5F5;
      --md-sys-color-error: #FFB4AB;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000A;
      --md-sys-color-on-error-container: #FFDAD6;
      --md-sys-color-background: #101417;
      --md-sys-color-on-background: #E0E3E8;
      --md-sys-color-surface: #101417;
      --md-sys-color-on-surface: #E0E3E8;
      --md-sys-color-surface-variant: #41474D;
      --md-sys-color-on-surface-variant: #C1C7CE;
      --md-sys-color-outline: #8B9198;
      --md-sys-color-outline-variant: #41474D;
      --md-sys-color-surface-container: #1C2024;
      --md-sys-color-surface-container-low: #181C20;
      --md-sys-color-surface-container-lowest: #0B0F12;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #95CDF7;
        --md-sys-color-on-primary: #00344E;
        --md-sys-color-primary-container: #004B6F;
        --md-sys-color-on-primary-container: #C9E6FF;
        --md-sys-color-secondary: #B7C9D9;
        --md-sys-color-on-secondary: #22323F;
        --md-sys-color-secondary-container: #384956;
        --md-sys-color-on-secondary-container: #D3E5F5;
        --md-sys-color-error: #FFB4AB;
        --md-sys-color-on-error: #690005;
        --md-sys-color-error-container: #93000A;
        --md-sys-color-on-error-container: #FFDAD6;
        --md-sys-color-background: #101417;
        --md-sys-color-on-background: #E0E3E8;
        --md-sys-color-surface: #101417;
        --md-sys-color-on-surface: #E0E3E8;
        --md-sys-color-surface-variant: #41474D;
        --md-sys-color-on-surface-variant: #C1C7CE;
        --md-sys-color-outline: #8B9198;
        --md-sys-color-outline-variant: #41474D;
        --md-sys-color-surface-container: #1C2024;
        --md-sys-color-surface-container-low: #181C20;
        --md-sys-color-surface-container-lowest: #0B0F12;
      }
    }

    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── Material Symbols ── */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      vertical-align: middle;
      user-select: none;
    }

    /* ── Top App Bar ── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px;
      gap: 4px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .top-app-bar__leading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--md-sys-shape-full);
      cursor: pointer;
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
      background: none;
      border: none;
      /* disabled during loading */
      opacity: 0.38;
      pointer-events: none;
    }
    .top-app-bar__title {
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--md-sys-color-on-surface);
      flex: 1;
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Linear Progress Indicator (M3) ── */
    .linear-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background-color: var(--md-sys-color-primary-container);
      overflow: hidden;
    }
    .linear-progress-bar {
      height: 100%;
      background-color: var(--md-sys-color-primary);
      border-radius: 2px;
      animation: linear-progress-indeterminate 2s ease-in-out infinite;
      transform-origin: left;
    }

    @keyframes linear-progress-indeterminate {
      0%   { transform: translateX(-100%) scaleX(0.3); }
      30%  { transform: translateX(0%)    scaleX(0.6); }
      60%  { transform: translateX(60%)   scaleX(0.6); }
      100% { transform: translateX(200%)  scaleX(0.3); }
    }

    /* ── Screen Content — centered for loading ── */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 24px;
    }

    /* ── Skeleton card (ghost of explainer card) ── */
    .skeleton-card {
      width: 100%;
      background-color: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-sys-shape-medium);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skeleton-block {
      background-color: var(--md-sys-color-surface-variant);
      border-radius: 4px;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.8; }
    }

    /* ── Loading label ── */
    .loading-label-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .loading-label {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
    }
  </style>
</head>
<body data-screen="login" data-state="loading">

  <!-- Top App Bar (back disabled during loading) -->
  <header class="top-app-bar" style="position:relative;" aria-label="Connect with HSBC">
    <button class="top-app-bar__leading" aria-label="Navigate back" aria-disabled="true" tabindex="-1">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <span class="top-app-bar__title">Connect with HSBC</span>
    <!-- Linear progress indicator below top bar -->
    <div class="linear-progress-track"
         role="progressbar"
         aria-label="Creating consent and redirecting to HSBC"
         aria-valuemin="0"
         aria-valuemax="100"
         aria-live="polite"
         data-component-type="progress_indicator"
         data-component-id="loading_indicator"
         data-component-variant="linear">
      <div class="linear-progress-bar"></div>
    </div>
  </header>

  <!-- Screen Content -->
  <main class="screen-content"
        aria-label="Creating consent and redirecting to HSBC"
        aria-live="polite"
        data-component-type="screen"
        data-component-id="login"
        data-component-variant="loading">

    <!-- Skeleton card — mirrors explainer card structure -->
    <div class="skeleton-card" aria-hidden="true">
      <!-- Logo row -->
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="skeleton-block" style="width:32px;height:32px;border-radius:4px;"></div>
        <div class="skeleton-block" style="width:52px;height:16px;border-radius:4px;"></div>
      </div>
      <!-- Badge -->
      <div class="skeleton-block" style="width:140px;height:14px;border-radius:4px;"></div>
      <!-- Headline -->
      <div class="skeleton-block" style="width:100%;height:20px;border-radius:4px;"></div>
      <!-- Body lines -->
      <div class="skeleton-block" style="width:100%;height:12px;border-radius:4px;"></div>
      <div class="skeleton-block" style="width:82%;height:12px;border-radius:4px;"></div>
      <!-- Divider -->
      <div style="height:1px;background-color:var(--md-sys-color-outline-variant);"></div>
      <!-- Notice -->
      <div class="skeleton-block" style="width:90%;height:12px;border-radius:4px;"></div>
    </div>

    <!-- Loading label -->
    <div class="loading-label-wrap">
      <p class="loading-label"
         data-component-type="text"
         data-component-id="loading_label"
         data-component-variant="bodyMedium">
        Connecting to HSBC…
      </p>
    </div>

  </main>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
