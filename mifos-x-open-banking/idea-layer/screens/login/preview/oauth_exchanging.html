<!doctype html>
<!-- render-hash: login-oauth_exchanging-provisional -->
<html lang="en" data-screen="login" data-state="oauth_exchanging" data-feature="login" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Exchanging Token</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; }
    .exchange-icon { width: 80px; height: 80px; background: var(--primary-container); border-radius: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .exchange-icon .material-icons { font-size: var(--icon-xl); color: var(--primary); }
    .exchange-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; }
    .exchange-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 24px; line-height: 1.5; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [data-theme="light"]{ --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }[data-theme="dark"]{ --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; }@media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="exchange-icon" data-component-type="image" data-component-id="login_header_logo" role="img" aria-label="Mifos X Open Banking logo"><span class="material-icons">account_balance</span></div>
    <h2 class="exchange-title" data-component-type="text" data-component-id="oauth_exchange_title">Completing Sign In</h2>
    <p class="exchange-msg" data-component-type="text" data-component-id="oauth_exchange_msg">Exchanging authorization code for your session token...</p>
    <div class="spinner" data-component-type="icon" data-component-id="oauth_exchange_spinner" role="progressbar" aria-label="Exchanging token"></div>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
