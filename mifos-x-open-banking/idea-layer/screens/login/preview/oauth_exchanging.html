<!doctype html>
<html lang="en" data-screen="login" data-state="oauth_exchanging" data-feature="login" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Exchanging Token</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; }
    .exchange-icon { width: 80px; height: 80px; background: var(--primary-container); border-radius: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .exchange-icon .material-icons { font-size: 40px; color: var(--primary); }
    .exchange-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; }
    .exchange-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 24px; line-height: 1.5; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="exchange-icon" data-component-type="icon" data-component-id="oauth_exchange_icon"><span class="material-icons">sync</span></div>
    <h2 class="exchange-title" data-component-type="text" data-component-id="oauth_exchange_title">Completing Sign In</h2>
    <p class="exchange-msg" data-component-type="text" data-component-id="oauth_exchange_msg">Exchanging authorization code for your session token...</p>
    <div class="spinner" role="progressbar" aria-label="Exchanging token"></div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
