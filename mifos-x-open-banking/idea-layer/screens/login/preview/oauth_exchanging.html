<!doctype html>
<html lang="en" data-screen="login" data-state="oauth_exchanging">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Exchanging Token</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--primary); color: var(--on-primary); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; gap: 20px; -webkit-font-smoothing: antialiased; }
    /* Logo */
    .logo-ring { width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; }
    .logo-ring .material-icons { font-size: 48px; color: var(--on-primary); }
    .exchange-title { font-size: 24px; font-weight: 700; color: var(--on-primary); }
    .exchange-sub { font-size: 14px; color: var(--primary-container); line-height: 1.6; }
    /* Token exchange steps */
    .steps-card { background: rgba(255,255,255,0.12); border-radius: 14px; padding: 16px 18px; width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .step-row { display: flex; align-items: center; gap: 10px; }
    .step-icon-done { width: 22px; height: 22px; border-radius: 50%; background: var(--primary-container); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-icon-done .material-icons { font-size: 13px; color: var(--primary); }
    .step-spinner { width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: rgba(255,255,255,0.9); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    .step-dot-pending { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step-label { font-size: 13px; color: var(--on-primary); }
    .step-label.done { opacity: 0.7; }
    .step-label.active { font-weight: 600; }
    .step-label.pending { opacity: 0.45; }
    /* Note */
    .note-text { font-size: 12px; color: var(--primary-container); line-height: 1.5; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main data-component-type="stack" data-component-id="login_oauth_exchange_root"
        role="status" aria-live="polite" aria-label="Exchanging authorization token — signing you in">

    <div class="logo-ring" aria-hidden="true">
      <span class="material-icons">account_balance</span>
    </div>

    <h1 class="exchange-title" data-component-type="text" data-component-id="exchange_title">
      Almost there…
    </h1>

    <p class="exchange-sub" data-component-type="text" data-component-id="exchange_sub">
      Exchanging your authorization token and signing you in.
    </p>

    <div class="steps-card" data-component-type="box" data-component-id="exchange_steps_card">
      <div class="step-row">
        <div class="step-icon-done" aria-hidden="true">
          <span class="material-icons">check</span>
        </div>
        <span class="step-label done">OBP authorization granted</span>
      </div>
      <div class="step-row">
        <div class="step-icon-done" aria-hidden="true">
          <span class="material-icons">check</span>
        </div>
        <span class="step-label done">Authorization code received</span>
      </div>
      <div class="step-row">
        <div class="step-spinner" aria-hidden="true"></div>
        <span class="step-label active">Exchanging token…</span>
      </div>
      <div class="step-row">
        <div class="step-dot-pending" aria-hidden="true"></div>
        <span class="step-label pending">Loading your account</span>
      </div>
    </div>

    <p class="note-text" data-component-type="text" data-component-id="exchange_note">
      Do not close or refresh this screen. This takes just a moment.
    </p>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
