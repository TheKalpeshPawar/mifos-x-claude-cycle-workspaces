<!doctype html>
<html lang="en" data-screen="login" data-state="idle" data-feature="login" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }
    .logo-container { text-align: center; margin-bottom: 16px; }
    .logo-icon { width: 80px; height: 80px; background: var(--primary-container); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; }
    .logo-icon .material-icons { font-size: 40px; color: var(--primary); }
    h1 { font-size: 24px; font-weight: 700; color: var(--primary); text-align: center; margin: 12px 0 4px; }
    .subtitle { font-size: 14px; color: var(--on-surface-variant); text-align: center; margin-bottom: 32px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }
    .input-field { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--on-surface); }
    .input-field::placeholder { color: var(--outline); }
    .password-wrapper { position: relative; }
    .password-wrapper .trailing-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; }
    .password-wrapper .trailing-icon .material-icons { font-size: 20px; color: var(--on-surface-variant); }
    .remember-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
    .remember-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .remember-row label { font-size: 14px; color: var(--on-surface); cursor: pointer; }
    .btn-filled { width: 100%; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 24px; }
    .divider-row { display: flex; align-items: center; gap: 12px; padding: 24px 0; }
    .divider-line { flex: 1; height: 1px; background: var(--surface-variant); }
    .divider-text { font-size: 13px; font-weight: 500; color: var(--outline); }
    .btn-outlined { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--primary); border-radius: 12px; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-outlined .material-icons { font-size: 18px; }
    .hint { font-size: 13px; color: var(--outline); text-align: center; margin-top: 8px; margin-bottom: 16px; }
    .divider { height: 1px; background: var(--surface-variant); margin: 16px 0; }
    .link { display: block; text-align: center; font-size: 14px; font-weight: 600; color: var(--secondary); text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="logo-container" data-component-type="image" data-component-id="login_header_logo">
      <div class="logo-icon" role="img" aria-label="Mifos X Open Banking logo"><span class="material-icons">account_balance</span></div>
    </div>
    <h1 data-component-type="text" data-component-id="login_header_title" role="heading" aria-level="1">Welcome Back</h1>
    <p class="subtitle" data-component-type="text" data-component-id="login_header_subtitle">Sign in to your Mifos X account</p>
    <div class="input-group" data-component-type="input" data-component-id="login_username_input">
      <label for="username">Username</label>
      <input type="text" id="username" class="input-field" placeholder="Enter your username" aria-label="Username" tabindex="0">
    </div>
    <div class="input-group" data-component-type="input" data-component-id="login_password_input">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" class="input-field" placeholder="Enter your password" aria-label="Password, hidden" tabindex="0">
        <span class="trailing-icon" aria-label="Toggle password visibility"><span class="material-icons">visibility_off</span></span>
      </div>
    </div>
    <div class="remember-row" data-component-type="stack" data-component-id="login_remember_me_row">
      <input type="checkbox" id="remember" data-component-type="input" data-component-id="login_remember_me_checkbox" aria-label="Remember me on this device" tabindex="0">
      <label for="remember" data-component-type="text" data-component-id="login_remember_me_label">Keep me signed in</label>
    </div>
    <button class="btn-filled" data-action="submit" data-component-type="button" data-component-id="login_cta_button" aria-label="Sign In with DirectLogin" tabindex="0">Sign In</button>
    <div class="divider-row" data-component-type="stack" data-component-id="login_or_divider_row">
      <div class="divider-line" data-component-type="divider" data-component-id="login_or_line_left" role="separator"></div>
      <span class="divider-text" data-component-type="text" data-component-id="login_or_text" aria-label="Or sign in with a different method">OR</span>
      <div class="divider-line" data-component-type="divider" data-component-id="login_or_line_right" role="separator"></div>
    </div>
    <button class="btn-outlined" data-action="oauth_login" data-component-type="button" data-component-id="login_oauth_button" aria-label="Sign in using your Open Bank Project account via OAuth" tabindex="0">
      <span class="material-icons">open_in_browser</span> Sign in with OBP Account
    </button>
    <p class="hint" data-component-type="text" data-component-id="login_oauth_hint">Redirects to Open Bank Project for secure authentication</p>
    <div class="divider" data-component-type="divider" data-component-id="login_bottom_divider" role="separator"></div>
    <a class="link" data-nav-to="forgot-password" data-component-type="link" data-component-id="login_forgot_password_link" role="link" aria-label="Forgot Password? Navigate to password reset" tabindex="0">Forgot Password?</a>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
