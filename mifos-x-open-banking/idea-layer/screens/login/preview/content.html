<!doctype html>
<!-- render-hash: c0a7f3d12e84 -->
<html lang="en" data-screen="login" data-state="content" data-feature="login" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --font-display: 'Outfit', system-ui, sans-serif;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-surface); min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; padding: 32px 24px 0; display: flex; flex-direction: column; }
    .logo-wrap { display: flex; justify-content: center; padding: 16px 0; }
    .logo { width: 80px; height: 80px; border-radius: 20px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; color: var(--on-primary-container); font-size: 32px; font-weight: 700; font-family: var(--font-display); }
    .title { font-size: 24px; font-weight: 600; color: var(--primary); text-align: center; margin-top: 16px; margin-bottom: 32px; }
    .field { display: flex; flex-direction: column; margin-bottom: 16px; }
    .field label { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: 6px; }
    .field-wrap { position: relative; }
    .field input { width: 100%; height: 56px; padding: 0 44px 0 16px; border-radius: 8px; border: 1px solid var(--outline); background: var(--surface-container); color: var(--on-surface); font-family: var(--font-display); font-size: 15px; font-weight: 400; }
    .field input:focus { outline: 2px solid var(--primary); outline-offset: -2px; border-color: var(--primary); }
    .field-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: none; border: 0; color: var(--on-surface-variant); border-radius: 16px; }
    .remember-row { display: flex; align-items: center; gap: 8px; padding: 8px 0 16px; }
    .remember-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .remember-row label { font-size: 14px; font-weight: 400; color: var(--on-surface); }
    .cta-button { width: 100%; height: 48px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-family: var(--font-display); font-size: 14px; font-weight: 600; border: 0; cursor: pointer; margin-top: 8px; }
    .cta-button:hover { filter: brightness(1.05); }
    .or-row { display: flex; align-items: center; gap: 12px; padding: 24px 0; }
    .or-row .line { flex: 1; height: 1px; background: var(--outline-variant); }
    .or-row .or-text { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); }
    .oauth-button { width: 100%; height: 48px; border-radius: 8px; background: transparent; color: var(--primary); font-family: var(--font-display); font-size: 14px; font-weight: 600; border: 1px solid var(--primary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .oauth-hint { font-size: 12px; font-weight: 400; color: var(--on-surface-variant); text-align: center; margin-top: 8px; margin-bottom: 16px; }
    .bottom-divider { height: 1px; background: var(--outline-variant); margin: 16px 0; }
    .forgot-link { display: block; text-align: center; padding: 12px; color: var(--secondary); font-size: 14px; font-weight: 500; text-decoration: none; min-height: 44px; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }
    .login-footer { text-align: center; font-size: 14px; font-weight: 700; color: var(--primary); padding-top: 8px; padding-bottom: 32px; margin-top: auto; }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap" data-component-type="image" data-component-id="login_header_logo">
      <div class="logo" role="img" aria-label="Mifos X Open Banking logo">MX</div>
    </div>
    <h1 class="title" data-component-type="text" data-component-id="login_header_title" role="heading" aria-level="1">Welcome Back</h1>

    <div class="field" data-component-type="input" data-component-id="login_username_input">
      <label for="username">Username</label>
      <div class="field-wrap">
        <input id="username" type="text" placeholder="Enter your username" autocomplete="username" aria-label="Username">
      </div>
    </div>

    <div class="field" data-component-type="input" data-component-id="login_password_input">
      <label for="password">Password</label>
      <div class="field-wrap">
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" aria-label="Password, hidden">
        <button class="field-icon" type="button" data-action="toggle_password_visibility" aria-label="Toggle password visibility">
          <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
        </button>
      </div>
    </div>

    <div class="remember-row" data-component-type="stack" data-component-id="login_remember_me_row">
      <input id="remember" type="checkbox" data-component-type="input" data-component-id="login_remember_me_checkbox" aria-label="Remember me on this device">
      <label for="remember" data-component-type="text" data-component-id="login_remember_me_label">Keep me signed in</label>
    </div>

    <button class="cta-button" type="button" data-action="submit_login" data-component-type="button" data-component-id="login_cta_button" aria-label="Sign In with DirectLogin">Sign In</button>

    <div class="or-row" data-component-type="stack" data-component-id="login_or_divider_row" role="separator">
      <span class="line" data-component-type="divider" data-component-id="login_or_line_left" aria-hidden="true"></span>
      <span class="or-text" data-component-type="text" data-component-id="login_or_text">OR</span>
      <span class="line" data-component-type="divider" data-component-id="login_or_line_right" aria-hidden="true"></span>
    </div>

    <button class="oauth-button" type="button" data-action="oauth_login" data-component-type="button" data-component-id="login_oauth_button" aria-label="Sign in with Open Bank Project account">
      <span class="material-symbols-outlined" aria-hidden="true">open_in_browser</span>
      Sign in with OBP Account
    </button>
    <p class="oauth-hint" data-component-type="text" data-component-id="login_oauth_hint">Redirects to Open Bank Project for secure authentication</p>

    <div class="bottom-divider" data-component-type="divider" data-component-id="login_bottom_divider" role="separator" aria-hidden="true"></div>

    <a class="forgot-link" data-nav-to="forgot-password" data-component-type="link" data-component-id="login_forgot_password_link" aria-label="Forgot password, navigate to password reset">Forgot Password?</a>

    <p class="login-footer" data-component-type="text" data-component-id="login_footer" aria-label="Powered by Mifos">Powered by Mifos</p>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
