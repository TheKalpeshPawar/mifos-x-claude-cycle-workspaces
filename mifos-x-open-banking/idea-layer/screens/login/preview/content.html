<!doctype html>
<html lang="en" data-screen="login" data-state="idle" data-feature="login" data-flavor="shared">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --on-primary-container: #102000;
      --secondary: #386663;
      --on-secondary: #FFFFFF;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 80px; height: 80px;
      background: var(--primary-container);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .logo-icon .material-icons { font-size: 40px; color: var(--primary); }

    .header-title {
      font-size: 24px; font-weight: 700;
      color: var(--primary); text-align: center;
      margin-bottom: 4px;
    }
    .header-subtitle {
      font-size: 14px; color: var(--on-surface-variant);
      text-align: center; margin-bottom: 32px;
    }

    .input-group { margin-bottom: 16px; }
    .input-group label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--on-surface-variant); margin-bottom: 6px;
    }
    .input-field {
      width: 100%; padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px; color: var(--on-surface);
      outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--primary); }
    .input-field::placeholder { color: var(--outline); }
    .password-wrapper { position: relative; }
    .password-wrapper .toggle-visibility {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
    }
    .password-wrapper .toggle-visibility .material-icons {
      font-size: 20px; color: var(--on-surface-variant);
    }

    .remember-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0;
    }
    .remember-row input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: var(--primary);
    }
    .remember-row label {
      font-size: 14px; color: var(--on-surface); cursor: pointer;
    }

    .btn-primary {
      width: 100%; padding: 14px;
      background: var(--primary); color: var(--on-primary);
      border: none; border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 24px;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }

    .divider-row {
      display: flex; align-items: center; gap: 12px;
      padding: 24px 0;
    }
    .divider-line { flex: 1; height: 1px; background: var(--surface-variant); }
    .divider-text { font-size: 13px; font-weight: 500; color: var(--outline); }

    .btn-outlined {
      width: 100%; padding: 14px;
      background: transparent;
      border: 1px solid var(--primary);
      border-radius: 12px; color: var(--primary);
      font-family: 'Outfit', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-outlined .material-icons { font-size: 18px; }

    .oauth-hint {
      font-size: 13px; color: var(--outline);
      text-align: center; margin-top: 8px; margin-bottom: 16px;
    }

    .bottom-divider {
      height: 1px; background: var(--surface-variant);
      margin: 16px 0;
    }

    .forgot-link {
      display: block; text-align: center;
      font-size: 14px; font-weight: 600;
      color: var(--secondary);
      text-decoration: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <!-- Logo -->
    <div class="logo-container" data-component-type="image" data-component-id="login_header_logo">
      <div class="logo-icon" role="img" aria-label="Mifos X Open Banking logo">
        <span class="material-icons">account_balance</span>
      </div>
    </div>

    <!-- Header -->
    <h1 class="header-title" data-component-type="text" data-component-id="login_header_title" role="heading" aria-level="1">Welcome Back</h1>
    <p class="header-subtitle" data-component-type="text" data-component-id="login_header_subtitle">Sign in to your Mifos X account</p>

    <!-- Username Input -->
    <div class="input-group" data-component-type="input" data-component-id="login_username_input">
      <label for="username">Username</label>
      <input type="text" id="username" class="input-field" placeholder="Enter your username" aria-label="Username" tabindex="0" />
    </div>

    <!-- Password Input -->
    <div class="input-group" data-component-type="input" data-component-id="login_password_input">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" class="input-field" placeholder="Enter your password" aria-label="Password, hidden" tabindex="0" />
        <button class="toggle-visibility" data-action="toggle_password_visibility" aria-label="Toggle password visibility" tabindex="0">
          <span class="material-icons">visibility_off</span>
        </button>
      </div>
    </div>

    <!-- Remember Me -->
    <div class="remember-row" data-component-type="input" data-component-id="login_remember_me_checkbox">
      <input type="checkbox" id="remember" data-action="toggle_remember_me" aria-label="Remember me on this device" tabindex="0" />
      <label for="remember" data-component-type="text" data-component-id="login_remember_me_label">Keep me signed in</label>
    </div>

    <!-- Sign In Button -->
    <button class="btn-primary" data-action="submit" data-component-type="button" data-component-id="login_cta_button" aria-label="Sign In with DirectLogin" tabindex="0">
      Sign In
    </button>

    <!-- OR Divider -->
    <div class="divider-row" data-component-type="stack" data-component-id="login_or_divider_row">
      <div class="divider-line" data-component-type="divider" data-component-id="login_or_line_left" role="separator"></div>
      <span class="divider-text" data-component-type="text" data-component-id="login_or_text" aria-label="Or sign in with a different method">OR</span>
      <div class="divider-line" data-component-type="divider" data-component-id="login_or_line_right" role="separator"></div>
    </div>

    <!-- OAuth Button -->
    <button class="btn-outlined" data-action="oauth_login" data-component-type="button" data-component-id="login_oauth_button" aria-label="Sign in using your Open Bank Project account via OAuth" tabindex="0">
      <span class="material-icons">open_in_browser</span> Sign in with OBP Account
    </button>
    <p class="oauth-hint" data-component-type="text" data-component-id="login_oauth_hint">Redirects to Open Bank Project for secure authentication</p>

    <!-- Bottom Divider -->
    <div class="bottom-divider" data-component-type="divider" data-component-id="login_bottom_divider" role="separator"></div>

    <!-- Forgot Password -->
    <a class="forgot-link" data-nav-to="forgot-password" data-component-type="link" data-component-id="login_forgot_password_link" role="link" aria-label="Forgot Password? Navigate to password reset" tabindex="0">
      Forgot Password?
    </a>
  </main>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
