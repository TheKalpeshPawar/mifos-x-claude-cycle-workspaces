<!doctype html>
<!-- render-hash: b3c8e0f51a29 -->
<html lang="en" data-screen="login" data-state="empty" data-feature="login" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — No Accounts — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --font-display: 'Outfit', system-ui, sans-serif;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --surface-container: #F0F1E6; --surface-container-high: #EAECE1;
      --outline: #75796C; --outline-variant: #C5C8BA;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --surface: #12140E; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A; --surface-container-high: #282A24;
      --outline: #8F9285; --outline-variant: #44483D;
    }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-surface); min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; padding: 32px 24px 0; display: flex; flex-direction: column; align-items: center; }
    .logo { width: 80px; height: 80px; border-radius: 20px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; color: var(--on-primary-container); font-size: 32px; font-weight: 700; margin-top: 16px; }
    .title { font-size: 24px; font-weight: 600; color: var(--primary); text-align: center; margin-top: 16px; margin-bottom: 8px; }
    .empty-block { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .empty-illu { width: 96px; height: 96px; border-radius: 48px; background: var(--surface-container-high); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .empty-illu .material-symbols-outlined { font-size: 48px; color: var(--on-surface-variant); }
    .empty-title { font-size: 20px; font-weight: 600; color: var(--on-surface); text-align: center; margin-bottom: 8px; }
    .empty-message { font-size: 14px; font-weight: 400; color: var(--on-surface-variant); text-align: center; line-height: 1.5; max-width: 320px; margin-bottom: 24px; }
    .cta-button { width: 100%; max-width: 280px; height: 48px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-family: var(--font-display); font-size: 14px; font-weight: 600; border: 0; cursor: pointer; }
    .help-link { display: block; text-align: center; padding: 16px; color: var(--on-surface-variant); font-size: 13px; font-weight: 400; text-decoration: none; }
    .login-footer { text-align: center; font-size: 14px; font-weight: 700; color: var(--primary); padding-top: 8px; padding-bottom: 32px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" data-component-type="image" data-component-id="login_header_logo" role="img" aria-label="Mifos X Open Banking logo">MX</div>
    <h1 class="title" data-component-type="text" data-component-id="login_header_title" role="heading" aria-level="1">Welcome Back</h1>
    <div class="empty-block">
      <div class="empty-illu" data-component-type="box" data-component-id="empty_illustration" aria-hidden="true">
        <span class="material-symbols-outlined">account_circle_off</span>
      </div>
      <h2 class="empty-title" data-component-type="text" data-component-id="empty_title" role="heading" aria-level="2">No accounts found</h2>
      <p class="empty-message" data-component-type="text" data-component-id="empty_message">No accounts found. Contact your bank to set up online banking.</p>
      <button class="cta-button" type="button" data-action="contact_bank" data-component-type="button" data-component-id="empty_cta" aria-label="Contact bank">Contact Your Bank</button>
      <a class="help-link" data-nav-to="forgot-password" data-component-type="link" data-component-id="empty_help_link" aria-label="Need help, navigate to help">Need help signing in?</a>
    </div>
    <p class="login-footer" data-component-type="text" data-component-id="login_footer" aria-label="Powered by Mifos">Powered by Mifos</p>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
