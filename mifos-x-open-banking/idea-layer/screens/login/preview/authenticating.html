<!doctype html>
<!-- render-hash: login-authenticating-provisional -->
<html lang="en" data-screen="login" data-state="authenticating" data-feature="login" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Authenticating</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }
    .logo-container { text-align: center; margin-bottom: 16px; }
    .logo-icon { width: 80px; height: 80px; background: var(--primary-container); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; }
    .logo-icon .material-icons { font-size: var(--icon-xl); color: var(--primary); }
    h1 { font-size: 24px; font-weight: 700; color: var(--primary); text-align: center; margin: 12px 0 4px; }
    .subtitle { font-size: 14px; color: var(--on-surface-variant); text-align: center; margin-bottom: 32px; }
    .input-group { margin-bottom: 16px; opacity: 0.5; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }
    .input-field { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--on-surface); }
    .password-wrapper { position: relative; }
    .password-wrapper .trailing-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; }
    .password-wrapper .trailing-icon .material-icons { font-size: var(--icon-sm); color: var(--on-surface-variant); }
    .remember-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; opacity: 0.5; }
    .remember-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .remember-row label { font-size: 14px; color: var(--on-surface); }
    .btn-filled { width: 100%; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; margin-top: 24px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--on-primary); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .divider-row { display: flex; align-items: center; gap: 12px; padding: 24px 0; opacity: 0.5; }
    .divider-line { flex: 1; height: 1px; background: var(--surface-variant); }
    .divider-text { font-size: 13px; font-weight: 500; color: var(--outline); }
    .btn-outlined { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--primary); border-radius: 12px; color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.5; pointer-events: none; }
    .btn-outlined .material-icons { font-size: var(--icon-sm); }
    .hint { font-size: 13px; color: var(--outline); text-align: center; margin-top: 8px; margin-bottom: 16px; opacity: 0.5; }
    .divider { height: 1px; background: var(--surface-variant); margin: 16px 0; }
    .link { display: block; text-align: center; font-size: 14px; font-weight: 600; color: var(--secondary); text-decoration: none; opacity: 0.5; pointer-events: none; }
    [data-theme="light"]{ --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }[data-theme="dark"]{ --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; }@media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-container" data-component-type="image" data-component-id="login_header_logo">
      <div class="logo-icon" role="img" aria-label="Mifos X Open Banking logo"><span class="material-icons">account_balance</span></div>
    </div>
    <h1 data-component-type="text" data-component-id="login_header_title">Welcome Back</h1>
    <p class="subtitle" data-component-type="text" data-component-id="login_header_subtitle">Sign in to your Mifos X account</p>
    <div class="input-group" data-component-type="input" data-component-id="login_username_input">
      <label>Username</label>
      <input type="text" class="input-field" value="alex.wanjiru" disabled aria-label="Username">
    </div>
    <div class="input-group" data-component-type="input" data-component-id="login_password_input">
      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" class="input-field" value="********" disabled aria-label="Password">
        <span class="trailing-icon"><span class="material-icons">visibility_off</span></span>
      </div>
    </div>
    <div class="remember-row" data-component-type="stack" data-component-id="login_remember_me_row">
      <input type="checkbox" id="remember" data-component-type="input" data-component-id="login_remember_me_checkbox" disabled aria-label="Remember me">
      <label for="remember" data-component-type="text" data-component-id="login_remember_me_label">Keep me signed in</label>
    </div>
    <button class="btn-filled" data-action="submit" data-component-type="button" data-component-id="login_cta_button" disabled aria-label="Signing in" aria-busy="true">
      <span class="spinner"></span> Signing In...
    </button>
    <div class="divider-row" data-component-type="stack" data-component-id="login_or_divider_row">
      <div class="divider-line" data-component-type="divider" data-component-id="login_or_line_left" role="separator"></div>
      <span class="divider-text" data-component-type="text" data-component-id="login_or_text">OR</span>
      <div class="divider-line" data-component-type="divider" data-component-id="login_or_line_right" role="separator"></div>
    </div>
    <button class="btn-outlined" data-action="oauth_login" data-component-type="button" data-component-id="login_oauth_button" disabled aria-label="OAuth sign in disabled during authentication">
      <span class="material-icons">open_in_browser</span> Sign in with OBP Account
    </button>
    <p class="hint" data-component-type="text" data-component-id="login_oauth_hint">Redirects to Open Bank Project for secure authentication</p>
    <div class="divider" data-component-type="divider" data-component-id="login_bottom_divider" role="separator"></div>
    <a class="link" data-nav-to="forgot-password" data-component-type="link" data-component-id="login_forgot_password_link" aria-label="Forgot Password?" tabindex="0">Forgot Password?</a>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
