<!doctype html>
<html lang="en" data-screen="login" data-state="authenticating">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Authenticating</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; -webkit-font-smoothing: antialiased; }
    /* Logo */
    .logo-container { text-align: center; margin-bottom: 16px; }
    .logo-icon { width: 80px; height: 80px; background: var(--primary-container); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; opacity: 0.6; }
    .logo-icon .material-icons { font-size: 44px; color: var(--primary); }
    .app-title { font-size: 26px; font-weight: 700; color: var(--primary); opacity: 0.6; }
    .app-subtitle { font-size: 14px; color: var(--on-surface-variant); margin-top: 4px; opacity: 0.6; }
    /* Form dimmed */
    .form-fields { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; opacity: 0.4; pointer-events: none; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; display: block; }
    .field-input { width: 100%; padding: 14px; border: 1px solid var(--outline-variant); border-radius: 10px; background: var(--surface); font-size: 15px; font-family: 'Outfit', sans-serif; color: var(--on-surface); outline: none; }
    /* Auth button with spinner */
    .auth-btn { margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: not-allowed; }
    .btn-spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: rgba(255,255,255,0.95); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .or-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 16px; opacity: 0.4; }
    .divider-line { flex: 1; height: 1px; background: var(--outline-variant); }
    .divider-text { font-size: 13px; color: var(--outline); }
    .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: var(--surface); color: var(--on-surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-size: 15px; font-weight: 500; font-family: 'Outfit', sans-serif; cursor: not-allowed; opacity: 0.4; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main data-component-type="stack" data-component-id="login_authenticating_root">

    <div class="logo-container" aria-hidden="true">
      <div class="logo-icon">
        <span class="material-icons">account_balance</span>
      </div>
      <div class="app-title">Mifos OBP</div>
      <div class="app-subtitle">Open Banking Platform</div>
    </div>

    <div class="form-fields" aria-hidden="true">
      <div>
        <label class="field-label">Username</label>
        <input class="field-input" type="text" value="maria.santos" disabled>
      </div>
      <div>
        <label class="field-label">Password</label>
        <input class="field-input" type="password" value="••••••••" disabled>
      </div>
    </div>

    <button class="auth-btn" disabled aria-disabled="true"
            data-component-type="button" data-component-id="sign_in_button"
            aria-label="Signing in — please wait"
            role="status" aria-live="polite">
      <div class="btn-spinner" aria-hidden="true"></div>
      Signing in…
    </button>

    <div class="or-divider" aria-hidden="true">
      <div class="divider-line"></div>
      <span class="divider-text">OR</span>
      <div class="divider-line"></div>
    </div>

    <button class="oauth-btn" disabled aria-disabled="true"
            data-component-type="button" data-component-id="oauth_button">
      <span class="material-icons" style="font-size:20px;" aria-hidden="true">vpn_key</span>
      Continue with OBP OAuth
    </button>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
