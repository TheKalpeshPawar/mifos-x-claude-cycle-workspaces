sibling: data-flow
schema_version: "4.0"
feature_id: consent-declined
entries:
  - screen_id: consent-declined
    trigger: on_mount
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: >-
      Terminal UI-only screen. Decline reason (consent Status RJCT/CANC or OAuth error param)
      resolved upstream in auth-callback and passed as nav args. No OBIE API is called here.

  - screen_id: consent-declined
    trigger: on_interact
    event: TryAgain
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: >-
      Navigates back to consent-request to start a fresh account-access-consent
      (POST /aisp/account-access-consents). No API call from this screen.

  - screen_id: consent-declined
    trigger: on_interact
    event: GoHome
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: "Navigates to the app root. No API call."
