sibling: demo-data
schema_version: "4.0"
feature_id: consent-declined
description: >-
  Realistic nav-arg fixtures for the terminal consent-declined screen. This screen makes no live
  OBIE call — the declined outcome is resolved upstream in auth-callback and handed in as navigation
  arguments (consentStatus, callbackError, consentId). Values mirror the AIS error branch in
  auth-callback/demo-data.yaml (error=access_denied, ConsentId aac-9f2c1b7e…). No real credentials.

samples:
  # ─── content state — PSU simply cancelled, no OAuth error code on the callback ─────
  cancelled:
    consentStatus: "CANC"
    callbackError: null
    consentId: "aac-9f2c1b7e-3d04-4a6e-8c11-2b5e7a9d0c44"
    hasErrorCode: false
    note: "PSU tapped Cancel/Deny at HSBC; the deep-link returned without an error param. The technical reference line is hidden — clean, non-alarming decline."

  # ─── error state — callback carried an explicit OAuth error param ──────────────────
  access_denied:
    consentStatus: "RJCT"
    callbackError: "access_denied"
    errorDescription: "PSU declined the consent"
    consentId: "aac-9f2c1b7e-3d04-4a6e-8c11-2b5e7a9d0c44"
    state: "aZ4kP1nQ7wsR3eT9"
    hasErrorCode: true
    reference_line: "Reference: access_denied · consent RJCT"
    note: "Deep-link org.mifos.openbanking://oauth/callback?error=access_denied&error_description=PSU%20declined%20the%20consent&state=aZ4kP1nQ7wsR3eT9 → resolved Status RJCT. The technical reference line is shown."

  # ─── error state — authorisation timed out / SCA could not complete ────────────────
  login_required:
    consentStatus: "RJCT"
    callbackError: "login_required"
    errorDescription: "Authorisation timed out before it was confirmed"
    consentId: "aac-2d51e8a0-7c93-4f12-ab64-9e30c7d1f805"
    state: "bN7mR2wsT9eQ1aZ5"
    hasErrorCode: true
    reference_line: "Reference: login_required · consent RJCT"
    note: "SCA/identity verification at HSBC did not complete in time; the callback carried login_required. Reference line shown."
