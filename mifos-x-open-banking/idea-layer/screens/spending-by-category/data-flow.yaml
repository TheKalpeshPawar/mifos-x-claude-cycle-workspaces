screen_id: spending-by-category

# ── Cache lifecycle (CC8) ────────────────────────────────────────────────────
cache_layers:
  - name: pfm_room_cache
    store: room-kmp
    shared_with: [pfm-dashboard, budgets]
    expiry:
      ttl_hours: 24
      staleness_policy: >
        Aggregation always re-runs from the current Room snapshot on every selectPeriod or
        retryCompute call; stale data is never returned from an in-memory cache. If Room is
        empty post-cache-clear the screen transitions to UiState.Empty (not Error) because
        zero rows is a valid clean-cache state, not a computation failure.
    max_size_mb: 50
    clear_triggers:
      - source: manual
        path: "Settings → Clear Local Data (settings screen, label: settings.clear_local_data.*)"
      - source: consent_revoked
        path: "ConsentRepository emits CONSENT_REVOKED event → Room transactions table wiped synchronously before UI observes stale rows"
    notes: >
      Cache is owned by the AIS sync layer; spending-by-category is a read-only consumer.
      Storage visibility (path, approximate size, and manual clear affordance) is handled
      by the Settings screen — no independent UI surface is required for this feature since
      it shares the same backing store as pfm-dashboard and budgets.

on_mount:
  - trigger: category_spend_compute
    description: "Client-derived spend aggregation for the default period (this month). Produces UiState: loading → content | empty | error."
    steps:
      - client_derived:
          description: >
            Emit UiState.Loading immediately.
            Filter cached Room transactions for CreditDebitIndicator=Debit and the selected
            kotlinx-datetime LocalDate range (default: first day of current month to today).
            Group by auto-assigned category tag (resolved from MerchantCategory or
            ProprietaryBankTransactionCode via a local MCC-to-category mapping).
            For each group compute: totalAmount (sum of Amount.Amount), transactionCount,
            percentageOfTotal (rounded to 1 d.p.), fraction (0.0–1.0) for the progress bar.
            Sort descending by totalAmount.
            If result list is empty → UiState.Empty.
            If Room throws → UiState.Error.
          store_as: categories
    on_success: content
    on_empty: empty
    on_error: error

on_user_action:
  - trigger: select_period
    description: "Re-filter cached transactions for the newly selected period window and recompute category groups. Transitions through loading state before resolving to content | empty | error."
    re_runs: [category_spend_compute]
    params:
      period: "SpendingPeriod enum (this_month | last_month | 3_months)"

  - trigger: retry_compute
    description: "Re-triggers category_spend_compute with the currently selected period after an error state."
    re_runs: [category_spend_compute]
