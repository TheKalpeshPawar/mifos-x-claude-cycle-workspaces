<!doctype html>
<!-- render-hash: sbc-lod-7e3b1a5f2c9d -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Spending by Category — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    /* ── M3 Light Color Tokens ──────────────────────────────────── */
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-secondary: #50606E;
      --md-on-secondary: #FFFFFF;
      --md-secondary-container: #D3E5F5;
      --md-on-secondary-container: #384956;
      --md-tertiary: #64597B;
      --md-tertiary-container: #EADDFF;
      --md-error: #BA1A1A;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-surface-variant: #DDE3EA;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low: #F1F4F9;
      --md-surface-container: #EBEEF3;
      --md-surface-container-high: #E5E8ED;
      --md-surface-container-highest: #E0E3E8;
      --md-inverse-surface: #2D3135;
      --md-inverse-on-surface: #EEF1F6;
      --md-inverse-primary: #95CDF7;
      /* Typography */
      --fs-title-large: 22px; --lh-title-large: 28px;
      --fs-label-large: 14px; --lh-label-large: 20px;
      --fs-label-medium: 12px; --lh-label-medium: 16px;
      --fw-medium: 500; --fw-regular: 400;
      /* Spacing & Shape */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px;
      --radius-lg: 16px; --radius-xl: 28px; --radius-full: 9999px;
      /* Motion */
      --dur-short: 150ms;
      --easing-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);
      /* Shell */
      --top-bar-height: 64px;
      --bottom-nav-height: 80px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #95CDF7;
        --md-on-primary: #00344E;
        --md-primary-container: #004B6F;
        --md-on-primary-container: #C9E6FF;
        --md-secondary: #B7C9D9;
        --md-on-secondary: #22323F;
        --md-secondary-container: #384956;
        --md-on-secondary-container: #D3E5F5;
        --md-error: #FFB4AB;
        --md-background: #101417;
        --md-on-background: #E0E3E8;
        --md-surface: #101417;
        --md-on-surface: #E0E3E8;
        --md-surface-variant: #41474D;
        --md-on-surface-variant: #C1C7CE;
        --md-outline: #8B9198;
        --md-outline-variant: #41474D;
        --md-surface-container-lowest: #0B0F12;
        --md-surface-container-low: #181C20;
        --md-surface-container: #1C2024;
        --md-surface-container-high: #262A2E;
        --md-surface-container-highest: #313539;
        --md-inverse-surface: #E0E3E8;
        --md-inverse-on-surface: #2D3135;
        --md-inverse-primary: #266489;
      }
    }

    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9;
      --md-on-secondary: #22323F;
      --md-secondary-container: #384956;
      --md-on-secondary-container: #D3E5F5;
      --md-error: #FFB4AB;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-surface-variant: #41474D;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024;
      --md-surface-container-high: #262A2E;
      --md-surface-container-highest: #313539;
      --md-inverse-surface: #E0E3E8;
      --md-inverse-on-surface: #2D3135;
      --md-inverse-primary: #266489;
    }

    /* ── Reset & Base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
      vertical-align: middle;
    }

    /* ── Top App Bar ────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: var(--md-surface);
      height: var(--top-bar-height);
      display: flex;
      align-items: center;
      padding: 0 var(--sp-1);
      gap: var(--sp-1);
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.38;
    }

    .top-app-bar__title {
      flex: 1;
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: var(--fw-medium);
      color: var(--md-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Screen content ─────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: calc(var(--bottom-nav-height) + var(--sp-4));
    }

    /* ── Period chip selector ───────────────────────────────────── */
    .period-selector {
      display: flex;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      overflow-x: auto;
      scrollbar-width: none;
      background-color: var(--md-surface);
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .period-selector::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-full);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-large);
      line-height: 1;
      font-weight: var(--fw-medium);
      white-space: nowrap;
      border: 1px solid var(--md-outline);
      background-color: transparent;
      color: var(--md-on-surface-variant);
      cursor: default;
      opacity: 0.6;
    }
    .chip--selected {
      background-color: var(--md-secondary-container);
      border-color: transparent;
      color: var(--md-on-secondary-container);
      opacity: 0.6;
    }

    /* ── Shimmer animation ──────────────────────────────────────── */
    @keyframes shimmer-sweep {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .shimmer {
      background: linear-gradient(
        90deg,
        var(--md-surface-container) 0%,
        var(--md-surface-container-high) 40%,
        var(--md-surface-container-highest) 60%,
        var(--md-surface-container) 100%
      );
      background-size: 400px 100%;
      animation: shimmer-sweep 1.4s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }

    /* ── Skeleton area ──────────────────────────────────────────── */
    .skeleton-area {
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    /* Spend summary card skeleton (80dp) */
    .skeleton-card {
      width: 100%;
      height: 80px;
      border-radius: var(--radius-md);
    }

    /* Section header text skeleton (60%, 16dp) */
    .skeleton-text {
      height: 16px;
      border-radius: var(--radius-xs);
    }
    .skeleton-text--60 { width: 60%; }

    /* Category list card skeleton */
    .skeleton-list-card {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--md-outline-variant);
      background-color: var(--md-surface-container-low);
    }

    /* Category row skeleton (56dp each) */
    .skeleton-row {
      height: 56px;
      border-radius: 0;
    }
    .skeleton-row + .skeleton-row {
      border-top: 1px solid var(--md-outline-variant);
    }

    /* ── Bottom Navigation ──────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-height);
      background-color: var(--md-surface-container);
      display: flex;
      align-items: stretch;
      z-index: 10;
      border-top: 1px solid var(--md-outline-variant);
    }

    .bottom-nav__btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      border: none;
      background: none;
      color: var(--md-on-surface-variant);
      padding: var(--sp-2) 0 12px;
      cursor: pointer;
    }
    .bottom-nav__btn--active { color: var(--md-primary); }

    .bottom-nav__indicator {
      width: 64px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
    }
    .bottom-nav__btn--active .bottom-nav__indicator {
      background-color: var(--md-secondary-container);
    }

    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: var(--fw-medium);
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ──────────────────────────────────────────── -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn"
            aria-label="Navigate back"
            data-action="navigate_back"
            disabled>
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Spending by Category</h1>
  </header>

  <!-- ── Screen Content ───────────────────────────────────────── -->
  <main class="screen-content"
        data-screen="spending-by-category"
        data-state="loading"
        aria-busy="true"
        aria-label="Loading spending analysis">

    <!-- Period chip selector (visible in loading state, non-interactive) -->
    <div class="period-selector"
         role="group"
         aria-label="Select spending period"
         aria-disabled="true">
      <span class="chip chip--selected" aria-hidden="true">This month</span>
      <span class="chip" aria-hidden="true">Last month</span>
      <span class="chip" aria-hidden="true">3 months</span>
    </div>

    <!-- Loading skeleton (mirrors content layout) -->
    <div class="skeleton-area"
         role="status"
         aria-label="Loading spending analysis"
         aria-live="polite">
      <span class="sr-only">Loading spending analysis, please wait.</span>

      <!-- Spend summary card skeleton (80dp) -->
      <div class="shimmer skeleton-card" aria-hidden="true"></div>

      <!-- Section header text skeleton (60% × 16dp) -->
      <div class="shimmer skeleton-text skeleton-text--60" aria-hidden="true"></div>

      <!-- Category list skeleton (3 rows × 56dp) -->
      <div class="skeleton-list-card" aria-hidden="true">
        <div class="shimmer skeleton-row"></div>
        <div class="shimmer skeleton-row"></div>
        <div class="shimmer skeleton-row"></div>
      </div>
    </div>
  </main>

  <!-- ── Bottom Navigation — Home·Accounts·Transactions·More (no active tab: pushed sub-screen) ── -->
  <nav class="bottom-nav" aria-label="App navigation">
    <button class="bottom-nav__btn"
            aria-label="Home"
            data-nav-to="home">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav__label">Home</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="Accounts"
            data-nav-to="accounts">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="Transactions"
            data-nav-to="transactions">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav__label">Transactions</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="More"
            data-nav-to="settings">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav__label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
