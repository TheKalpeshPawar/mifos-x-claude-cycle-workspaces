<!doctype html>
<!-- render-hash: sbc-emp-2d6a8c0f4e1b -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Spending by Category — Empty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    /* ── M3 Light Color Tokens ──────────────────────────────────── */
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-secondary: #50606E;
      --md-on-secondary: #FFFFFF;
      --md-secondary-container: #D3E5F5;
      --md-on-secondary-container: #384956;
      --md-tertiary: #64597B;
      --md-tertiary-container: #EADDFF;
      --md-error: #BA1A1A;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-surface-variant: #DDE3EA;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low: #F1F4F9;
      --md-surface-container: #EBEEF3;
      --md-surface-container-high: #E5E8ED;
      --md-surface-container-highest: #E0E3E8;
      --md-inverse-surface: #2D3135;
      --md-inverse-on-surface: #EEF1F6;
      --md-inverse-primary: #95CDF7;
      /* Typography */
      --fs-title-large: 22px; --lh-title-large: 28px;
      --fs-title-medium: 16px; --lh-title-medium: 24px;
      --fs-body-medium: 14px; --lh-body-medium: 20px;
      --fs-label-large: 14px; --lh-label-large: 20px;
      --fs-label-medium: 12px; --lh-label-medium: 16px;
      --fw-medium: 500; --fw-regular: 400;
      /* Spacing & Shape */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
      --sp-8: 32px; --sp-12: 48px;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px;
      --radius-lg: 16px; --radius-xl: 28px; --radius-full: 9999px;
      /* Motion */
      --dur-short: 150ms;
      --easing-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);
      /* Shell */
      --top-bar-height: 64px;
      --bottom-nav-height: 80px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #95CDF7;
        --md-on-primary: #00344E;
        --md-primary-container: #004B6F;
        --md-on-primary-container: #C9E6FF;
        --md-secondary: #B7C9D9;
        --md-on-secondary: #22323F;
        --md-secondary-container: #384956;
        --md-on-secondary-container: #D3E5F5;
        --md-error: #FFB4AB;
        --md-background: #101417;
        --md-on-background: #E0E3E8;
        --md-surface: #101417;
        --md-on-surface: #E0E3E8;
        --md-surface-variant: #41474D;
        --md-on-surface-variant: #C1C7CE;
        --md-outline: #8B9198;
        --md-outline-variant: #41474D;
        --md-surface-container-lowest: #0B0F12;
        --md-surface-container-low: #181C20;
        --md-surface-container: #1C2024;
        --md-surface-container-high: #262A2E;
        --md-surface-container-highest: #313539;
        --md-inverse-surface: #E0E3E8;
        --md-inverse-on-surface: #2D3135;
        --md-inverse-primary: #266489;
      }
    }

    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9;
      --md-on-secondary: #22323F;
      --md-secondary-container: #384956;
      --md-on-secondary-container: #D3E5F5;
      --md-error: #FFB4AB;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-surface-variant: #41474D;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024;
      --md-surface-container-high: #262A2E;
      --md-surface-container-highest: #313539;
      --md-inverse-surface: #E0E3E8;
      --md-inverse-on-surface: #2D3135;
      --md-inverse-primary: #266489;
    }

    /* ── Reset & Base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
      vertical-align: middle;
    }

    /* ── Top App Bar ────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: var(--md-surface);
      height: var(--top-bar-height);
      display: flex;
      align-items: center;
      padding: 0 var(--sp-1);
      gap: var(--sp-1);
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color var(--dur-short) var(--easing-emphasis);
    }
    .icon-btn:hover {
      background-color: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
    }

    .top-app-bar__title {
      flex: 1;
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: var(--fw-medium);
      color: var(--md-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Screen content ─────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: var(--bottom-nav-height);
    }

    /* ── Period chip selector ───────────────────────────────────── */
    .period-selector {
      display: flex;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      overflow-x: auto;
      scrollbar-width: none;
      background-color: var(--md-surface);
      border-bottom: 1px solid var(--md-outline-variant);
      flex-shrink: 0;
    }
    .period-selector::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-full);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-large);
      line-height: 1;
      font-weight: var(--fw-medium);
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid var(--md-outline);
      background-color: transparent;
      color: var(--md-on-surface-variant);
      transition: background-color var(--dur-short) var(--easing-emphasis),
                  border-color var(--dur-short) var(--easing-emphasis),
                  color var(--dur-short) var(--easing-emphasis);
    }
    .chip--selected {
      background-color: var(--md-secondary-container);
      border-color: transparent;
      color: var(--md-on-secondary-container);
    }
    .chip:hover:not(.chip--selected) {
      background-color: color-mix(in srgb, var(--md-on-surface-variant) 8%, transparent);
    }

    /* ── Empty state ────────────────────────────────────────────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-12) var(--sp-8);
      text-align: center;
      gap: var(--sp-4);
    }

    .empty-state__icon-wrap {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--md-surface-container);
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }

    .empty-state__icon-wrap .material-symbols-outlined {
      font-size: 40px;
      color: var(--md-on-surface-variant);
    }

    .empty-state__text {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .empty-state__title {
      font-size: var(--fs-title-medium);
      line-height: var(--lh-title-medium);
      font-weight: var(--fw-medium);
      color: var(--md-on-surface);
    }

    .empty-state__body {
      font-size: var(--fs-body-medium);
      line-height: var(--lh-body-medium);
      font-weight: var(--fw-regular);
      color: var(--md-on-surface-variant);
      max-width: 280px;
      margin: 0 auto;
    }

    /* ── Bottom Navigation ──────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-height);
      background-color: var(--md-surface-container);
      display: flex;
      align-items: stretch;
      z-index: 10;
      border-top: 1px solid var(--md-outline-variant);
    }

    .bottom-nav__btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      border: none;
      background: none;
      color: var(--md-on-surface-variant);
      padding: var(--sp-2) 0 12px;
      cursor: pointer;
    }
    .bottom-nav__btn--active { color: var(--md-primary); }

    .bottom-nav__indicator {
      width: 64px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
    }
    .bottom-nav__btn--active .bottom-nav__indicator {
      background-color: var(--md-secondary-container);
    }

    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: var(--fw-medium);
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ──────────────────────────────────────────── -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn"
            aria-label="Navigate back"
            data-action="navigate_back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Spending by Category</h1>
  </header>

  <!-- ── Screen Content ───────────────────────────────────────── -->
  <main class="screen-content"
        data-screen="spending-by-category"
        data-state="empty">

    <!-- Period chip selector (visible in empty state, interactive) -->
    <div class="period-selector"
         role="group"
         aria-label="Select spending period">
      <button class="chip chip--selected"
              aria-pressed="true"
              aria-label="Filter by this month"
              data-action="select_period"
              data-period="this_month">This month</button>
      <button class="chip"
              aria-pressed="false"
              aria-label="Filter by last month"
              data-action="select_period"
              data-period="last_month">Last month</button>
      <button class="chip"
              aria-pressed="false"
              aria-label="Filter by last 3 months"
              data-action="select_period"
              data-period="3_months">3 months</button>
    </div>

    <!-- Empty state (visible: empty) -->
    <div class="empty-state"
         role="status"
         aria-label="No spending data for the selected period">
      <div class="empty-state__icon-wrap" aria-hidden="true">
        <span class="material-symbols-outlined">pie_chart</span>
      </div>
      <div class="empty-state__text">
        <p class="empty-state__title">No spending data</p>
        <p class="empty-state__body">No transactions found for the selected period.</p>
      </div>
    </div>
  </main>

  <!-- ── Bottom Navigation — Home·Accounts·Transactions·More (no active tab: pushed sub-screen) ── -->
  <nav class="bottom-nav" aria-label="App navigation">
    <button class="bottom-nav__btn"
            aria-label="Home"
            data-nav-to="home">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav__label">Home</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="Accounts"
            data-nav-to="accounts">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="Transactions"
            data-nav-to="transactions">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav__label">Transactions</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="More"
            data-nav-to="settings">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav__label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
