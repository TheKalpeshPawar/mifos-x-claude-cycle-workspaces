<!doctype html>
<!-- render-hash: sbc-cnt-4f8a2c1e9b3d -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Spending by Category — Content</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    /* ── M3 Light Color Tokens ──────────────────────────────────── */
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-secondary: #50606E;
      --md-on-secondary: #FFFFFF;
      --md-secondary-container: #D3E5F5;
      --md-on-secondary-container: #384956;
      --md-tertiary: #64597B;
      --md-on-tertiary: #FFFFFF;
      --md-tertiary-container: #EADDFF;
      --md-on-tertiary-container: #4C4162;
      --md-error: #BA1A1A;
      --md-on-error: #FFFFFF;
      --md-error-container: #FFDAD6;
      --md-on-error-container: #93000A;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-surface-variant: #DDE3EA;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low: #F1F4F9;
      --md-surface-container: #EBEEF3;
      --md-surface-container-high: #E5E8ED;
      --md-surface-container-highest: #E0E3E8;
      --md-inverse-surface: #2D3135;
      --md-inverse-on-surface: #EEF1F6;
      --md-inverse-primary: #95CDF7;
      /* Typography */
      --fs-headline-medium: 28px; --lh-headline-medium: 36px;
      --fs-title-large: 22px; --lh-title-large: 28px;
      --fs-title-small: 14px; --lh-title-small: 20px;
      --fs-body-large: 16px; --lh-body-large: 24px;
      --fs-body-small: 12px; --lh-body-small: 16px;
      --fs-label-large: 14px; --lh-label-large: 20px;
      --fs-label-medium: 12px; --lh-label-medium: 16px;
      --fw-medium: 500; --fw-regular: 400;
      /* Spacing & Shape */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px;
      --radius-lg: 16px; --radius-xl: 28px; --radius-full: 9999px;
      /* Motion */
      --dur-short: 150ms; --dur-medium: 300ms;
      --easing-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);
      /* Shell */
      --top-bar-height: 64px;
      --bottom-nav-height: 80px;
    }

    /* ── M3 Dark Color Tokens ───────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #95CDF7;
        --md-on-primary: #00344E;
        --md-primary-container: #004B6F;
        --md-on-primary-container: #C9E6FF;
        --md-secondary: #B7C9D9;
        --md-on-secondary: #22323F;
        --md-secondary-container: #384956;
        --md-on-secondary-container: #D3E5F5;
        --md-tertiary: #CFC0E8;
        --md-on-tertiary: #352B4B;
        --md-tertiary-container: #4C4162;
        --md-on-tertiary-container: #EADDFF;
        --md-error: #FFB4AB;
        --md-on-error: #690005;
        --md-error-container: #93000A;
        --md-on-error-container: #FFDAD6;
        --md-background: #101417;
        --md-on-background: #E0E3E8;
        --md-surface: #101417;
        --md-on-surface: #E0E3E8;
        --md-surface-variant: #41474D;
        --md-on-surface-variant: #C1C7CE;
        --md-outline: #8B9198;
        --md-outline-variant: #41474D;
        --md-surface-container-lowest: #0B0F12;
        --md-surface-container-low: #181C20;
        --md-surface-container: #1C2024;
        --md-surface-container-high: #262A2E;
        --md-surface-container-highest: #313539;
        --md-inverse-surface: #E0E3E8;
        --md-inverse-on-surface: #2D3135;
        --md-inverse-primary: #266489;
      }
    }

    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9;
      --md-on-secondary: #22323F;
      --md-secondary-container: #384956;
      --md-on-secondary-container: #D3E5F5;
      --md-tertiary: #CFC0E8;
      --md-on-tertiary: #352B4B;
      --md-tertiary-container: #4C4162;
      --md-on-tertiary-container: #EADDFF;
      --md-error: #FFB4AB;
      --md-on-error: #690005;
      --md-error-container: #93000A;
      --md-on-error-container: #FFDAD6;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-surface-variant: #41474D;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024;
      --md-surface-container-high: #262A2E;
      --md-surface-container-highest: #313539;
      --md-inverse-surface: #E0E3E8;
      --md-inverse-on-surface: #2D3135;
      --md-inverse-primary: #266489;
    }

    /* ── Reset & Base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
      vertical-align: middle;
    }

    /* ── Top App Bar (M3 small, surface container) ──────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: var(--md-surface);
      height: var(--top-bar-height);
      display: flex;
      align-items: center;
      padding: 0 var(--sp-1);
      gap: var(--sp-1);
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color var(--dur-short) var(--easing-emphasis);
    }
    .icon-btn:hover { background-color: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }

    .top-app-bar__title {
      flex: 1;
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: var(--fw-medium);
      color: var(--md-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Screen content ─────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: calc(var(--bottom-nav-height) + var(--sp-4));
    }

    /* ── Period chip selector ───────────────────────────────────── */
    .period-selector {
      display: flex;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      overflow-x: auto;
      scrollbar-width: none;
      background-color: var(--md-surface);
      border-bottom: 1px solid var(--md-outline-variant);
      -webkit-overflow-scrolling: touch;
    }
    .period-selector::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-full);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-large);
      line-height: 1;
      font-weight: var(--fw-medium);
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid var(--md-outline);
      background-color: transparent;
      color: var(--md-on-surface-variant);
      transition: background-color var(--dur-short) var(--easing-emphasis),
                  border-color var(--dur-short) var(--easing-emphasis),
                  color var(--dur-short) var(--easing-emphasis);
    }
    .chip--selected {
      background-color: var(--md-secondary-container);
      border-color: transparent;
      color: var(--md-on-secondary-container);
    }
    .chip:hover:not(.chip--selected) {
      background-color: color-mix(in srgb, var(--md-on-surface-variant) 8%, transparent);
    }

    /* ── Spend summary card ─────────────────────────────────────── */
    .spend-summary-card {
      margin: var(--sp-4) var(--sp-4) var(--sp-2);
      padding: var(--sp-4);
      background-color: var(--md-surface-container-low);
      border-radius: var(--radius-md);
      border: 1px solid var(--md-outline-variant);
    }

    .spend-summary-card__label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: var(--fw-medium);
      color: var(--md-on-surface-variant);
      margin-bottom: var(--sp-2);
      letter-spacing: 0.5px;
    }

    .spend-summary-card__amount {
      font-family: 'Roboto Mono', monospace;
      font-size: var(--fs-headline-medium);
      line-height: var(--lh-headline-medium);
      font-weight: var(--fw-regular);
      color: var(--md-error);
    }

    /* ── Category list ──────────────────────────────────────────── */
    .category-list-card {
      margin: var(--sp-2) var(--sp-4) var(--sp-4);
      background-color: var(--md-surface-container-low);
      border-radius: var(--radius-md);
      border: 1px solid var(--md-outline-variant);
      overflow: hidden;
    }

    .category-row {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      padding: 0;
      color: inherit;
      transition: background-color var(--dur-short) var(--easing-emphasis);
    }
    .category-row:hover {
      background-color: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
    }
    .category-row + .category-row {
      border-top: 1px solid var(--md-outline-variant);
    }

    .category-row__inner {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      grid-template-rows: auto auto;
      column-gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      align-items: start;
    }

    .category-row__icon-wrap {
      grid-column: 1;
      grid-row: 1 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background-color: var(--md-secondary-container);
      border-radius: var(--radius-full);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .category-row__icon-wrap .material-symbols-outlined {
      font-size: 20px;
      color: var(--md-on-secondary-container);
    }

    .category-row__label {
      grid-column: 2;
      grid-row: 1;
    }

    .category-row__name {
      display: block;
      font-size: var(--fs-body-large);
      line-height: var(--lh-body-large);
      font-weight: var(--fw-medium);
      color: var(--md-on-surface);
    }

    .category-row__supporting {
      display: block;
      font-size: var(--fs-body-small);
      line-height: var(--lh-body-small);
      font-weight: var(--fw-regular);
      color: var(--md-on-surface-variant);
      margin-top: 2px;
    }

    .category-row__amount {
      grid-column: 3;
      grid-row: 1;
      font-family: 'Roboto Mono', monospace;
      font-size: var(--fs-body-large);
      line-height: var(--lh-body-large);
      font-weight: var(--fw-medium);
      color: var(--md-error);
      white-space: nowrap;
      padding-left: var(--sp-2);
      padding-top: 2px;
    }

    .category-row__progress-wrap {
      grid-column: 2 / 4;
      grid-row: 2;
      padding-top: var(--sp-2);
      padding-bottom: var(--sp-1);
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background-color: var(--md-surface-container-highest);
      border-radius: var(--radius-xs);
      overflow: hidden;
    }

    .progress-indicator {
      height: 100%;
      background-color: var(--md-primary);
      border-radius: var(--radius-xs);
    }

    /* ── Bottom Navigation (M3) ─────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-height);
      background-color: var(--md-surface-container);
      display: flex;
      align-items: stretch;
      z-index: 10;
      border-top: 1px solid var(--md-outline-variant);
    }

    .bottom-nav__btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      border: none;
      background: none;
      color: var(--md-on-surface-variant);
      padding: var(--sp-2) 0 12px;
      cursor: pointer;
      transition: color var(--dur-short) var(--easing-emphasis);
      -webkit-tap-highlight-color: transparent;
    }
    .bottom-nav__btn--active { color: var(--md-primary); }

    .bottom-nav__indicator {
      width: 64px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      transition: background-color var(--dur-short) var(--easing-emphasis);
    }
    .bottom-nav__btn--active .bottom-nav__indicator {
      background-color: var(--md-secondary-container);
    }

    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: var(--fw-medium);
    }
  </style>
</head>
<body>

  <!-- ── Top App Bar ──────────────────────────────────────────── -->
  <header class="top-app-bar" role="banner">
    <button class="icon-btn"
            aria-label="Navigate back"
            data-action="navigate_back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Spending by Category</h1>
  </header>

  <!-- ── Screen Content ───────────────────────────────────────── -->
  <main class="screen-content"
        data-screen="spending-by-category"
        data-state="content">

    <!-- Period chip selector (visible: loading, content, empty, error) -->
    <div class="period-selector"
         role="group"
         aria-label="Select spending period">
      <button class="chip chip--selected"
              aria-pressed="true"
              aria-label="Filter by this month"
              data-action="select_period"
              data-period="this_month">This month</button>
      <button class="chip"
              aria-pressed="false"
              aria-label="Filter by last month"
              data-action="select_period"
              data-period="last_month">Last month</button>
      <button class="chip"
              aria-pressed="false"
              aria-label="Filter by last 3 months"
              data-action="select_period"
              data-period="3_months">3 months</button>
    </div>

    <!-- Total spend summary card (visible: content) -->
    <div class="spend-summary-card"
         role="region"
         aria-label="Total spend for June 2026">
      <p class="spend-summary-card__label">Total Spend — June 2026</p>
      <p class="spend-summary-card__amount" aria-label="Total spend £1,840.00">£1,840.00</p>
    </div>

    <!-- Category breakdown list (visible: content) -->
    <section class="category-list-card" aria-label="Spending by category">

      <!-- Bills: £1,356.00 — 73.7% -->
      <button class="category-row"
              aria-label="Bills: £1,356.00, 73.7% of spend, 4 transactions"
              data-nav-to="transactions"
              data-action="navigate_category_transactions"
              data-category="Bills">
        <div class="category-row__inner">
          <div class="category-row__icon-wrap" aria-hidden="true">
            <span class="material-symbols-outlined">receipt_long</span>
          </div>
          <div class="category-row__label">
            <span class="category-row__name">Bills</span>
            <span class="category-row__supporting">4 transactions · 73.7% of spend</span>
          </div>
          <span class="category-row__amount">£1,356.00</span>
          <div class="category-row__progress-wrap">
            <div class="progress-track"
                 role="progressbar"
                 aria-valuenow="73.7" aria-valuemin="0" aria-valuemax="100"
                 aria-label="Bills share of total spend">
              <div class="progress-indicator" style="width:73.7%"></div>
            </div>
          </div>
        </div>
      </button>

      <!-- Groceries: £198.00 — 10.8% -->
      <button class="category-row"
              aria-label="Groceries: £198.00, 10.8% of spend, 9 transactions"
              data-nav-to="transactions"
              data-action="navigate_category_transactions"
              data-category="Groceries">
        <div class="category-row__inner">
          <div class="category-row__icon-wrap" aria-hidden="true">
            <span class="material-symbols-outlined">shopping_cart</span>
          </div>
          <div class="category-row__label">
            <span class="category-row__name">Groceries</span>
            <span class="category-row__supporting">9 transactions · 10.8% of spend</span>
          </div>
          <span class="category-row__amount">£198.00</span>
          <div class="category-row__progress-wrap">
            <div class="progress-track"
                 role="progressbar"
                 aria-valuenow="10.8" aria-valuemin="0" aria-valuemax="100"
                 aria-label="Groceries share of total spend">
              <div class="progress-indicator" style="width:10.8%"></div>
            </div>
          </div>
        </div>
      </button>

      <!-- Dining: £88.00 — 4.8% -->
      <button class="category-row"
              aria-label="Dining: £88.00, 4.8% of spend, 5 transactions"
              data-nav-to="transactions"
              data-action="navigate_category_transactions"
              data-category="Dining">
        <div class="category-row__inner">
          <div class="category-row__icon-wrap" aria-hidden="true">
            <span class="material-symbols-outlined">restaurant</span>
          </div>
          <div class="category-row__label">
            <span class="category-row__name">Dining</span>
            <span class="category-row__supporting">5 transactions · 4.8% of spend</span>
          </div>
          <span class="category-row__amount">£88.00</span>
          <div class="category-row__progress-wrap">
            <div class="progress-track"
                 role="progressbar"
                 aria-valuenow="4.8" aria-valuemin="0" aria-valuemax="100"
                 aria-label="Dining share of total spend">
              <div class="progress-indicator" style="width:4.8%"></div>
            </div>
          </div>
        </div>
      </button>

      <!-- Subscriptions: £63.00 — 3.4% -->
      <button class="category-row"
              aria-label="Subscriptions: £63.00, 3.4% of spend, 5 transactions"
              data-nav-to="transactions"
              data-action="navigate_category_transactions"
              data-category="Subscriptions">
        <div class="category-row__inner">
          <div class="category-row__icon-wrap" aria-hidden="true">
            <span class="material-symbols-outlined">subscriptions</span>
          </div>
          <div class="category-row__label">
            <span class="category-row__name">Subscriptions</span>
            <span class="category-row__supporting">5 transactions · 3.4% of spend</span>
          </div>
          <span class="category-row__amount">£63.00</span>
          <div class="category-row__progress-wrap">
            <div class="progress-track"
                 role="progressbar"
                 aria-valuenow="3.4" aria-valuemin="0" aria-valuemax="100"
                 aria-label="Subscriptions share of total spend">
              <div class="progress-indicator" style="width:3.4%"></div>
            </div>
          </div>
        </div>
      </button>

      <!-- Transport: £41.00 — 2.2% -->
      <button class="category-row"
              aria-label="Transport: £41.00, 2.2% of spend, 8 transactions"
              data-nav-to="transactions"
              data-action="navigate_category_transactions"
              data-category="Transport">
        <div class="category-row__inner">
          <div class="category-row__icon-wrap" aria-hidden="true">
            <span class="material-symbols-outlined">directions_transit</span>
          </div>
          <div class="category-row__label">
            <span class="category-row__name">Transport</span>
            <span class="category-row__supporting">8 transactions · 2.2% of spend</span>
          </div>
          <span class="category-row__amount">£41.00</span>
          <div class="category-row__progress-wrap">
            <div class="progress-track"
                 role="progressbar"
                 aria-valuenow="2.2" aria-valuemin="0" aria-valuemax="100"
                 aria-label="Transport share of total spend">
              <div class="progress-indicator" style="width:2.2%"></div>
            </div>
          </div>
        </div>
      </button>

    </section>
  </main>

  <!-- ── Bottom Navigation — Home·Accounts·Transactions·More (no active tab: pushed sub-screen) ── -->
  <nav class="bottom-nav" aria-label="App navigation">
    <button class="bottom-nav__btn"
            aria-label="Home"
            data-nav-to="home">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav__label">Home</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="Accounts"
            data-nav-to="accounts">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </button>
    <button class="bottom-nav__btn"
            aria-label="Transactions"
            data-nav-to="transactions">
