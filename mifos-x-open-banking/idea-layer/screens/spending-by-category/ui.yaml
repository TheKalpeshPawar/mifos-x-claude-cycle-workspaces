screen_id: spending-by-category
archetype: dashboard
name: "{strings.sbc.screen_title}"
status: enriched
initial_state: loading
quality_score: 95

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.sbc.screen_title}"
  top_app_bar_leading: back
  fab_visible: false

business_logic:
  kind: calculation
  description: "Groups cached AIS debits by MerchantCategory / ProprietaryBankTransactionCode (MCC-derived) and aggregates amount, transaction count, and percentage-of-total per category. Period windows (this_month / last_month / 3_months) use kotlinx-datetime LocalDate ranges relative to Clock.System.now(). Aggregation runs in viewModelScope using Kotlin coroutines; period chip selection re-aggregates without network calls — pure in-memory computation over the local Room transaction cache. Result list is sorted by amount descending. Drill-down to transactions passes category as a URI-encoded filter param."
  external_library_refs:
    - "kotlinx-datetime"
    - "kotlin-coroutines"
  description_author: claude
  description_authored_at: "2026-06-29T12:00:00Z"

states: [loading, content, empty, error]

components:
  # ── Period selector ──────────────────────────────────────────────────────────
  - type: chip_group
    id: period_selector
    variant: single_select
    state_binding: [loading, content, empty, error]
    scroll_direction: horizontal
    accessibility_label: "{strings.sbc.period_selector.a11y}"
    test_context:
      purpose: "Period filter chip group; verify exactly one chip selected at a time and triggers re-aggregation on change"
      required_fields: [selected_period]
      interaction_type: input
      data_driven: true
    children:
      - type: chip
        id: period_this_month
        label: "{strings.sbc.period.this_month}"
        variant: filter
        selected: true
        accessibility_label: "{strings.sbc.period.this_month.a11y}"
        test_context:
          purpose: "Default-selected period chip; verify selected state on initial render and deselects on sibling tap"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: select_period
          params:
            period: "this_month"

      - type: chip
        id: period_last_month
        label: "{strings.sbc.period.last_month}"
        variant: filter
        accessibility_label: "{strings.sbc.period.last_month.a11y}"
        test_context:
          purpose: "Last-month period filter; verify deselects this_month, triggers recompute, period label updates"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: select_period
          params:
            period: "last_month"

      - type: chip
        id: period_3_months
        label: "{strings.sbc.period.3_months}"
        variant: filter
        accessibility_label: "{strings.sbc.period.3_months.a11y}"
        test_context:
          purpose: "3-month rolling window chip; verify broader date range is applied and more categories may appear"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: select_period
          params:
            period: "3_months"

  # ── Loading skeleton ─────────────────────────────────────────────────────────
  - type: skeleton
    id: loading_skeleton
    state_binding: [loading]
    accessibility_label: "{strings.sbc.loading.a11y}"
    shapes:
      - type: shimmer
        variant: card
        width: "100%"
        height: "80dp"
      - type: shimmer
        variant: text
        width: "60%"
        height: "16dp"
      - type: shimmer
        variant: block
        width: "100%"
        height: "56dp"
      - type: shimmer
        variant: block
        width: "100%"
        height: "56dp"
      - type: shimmer
        variant: block
        width: "100%"
        height: "56dp"
    test_context:
      purpose: "Loading skeleton while category aggregation runs; verify visible only in loading state, each shimmer block mirrors real list row height"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Total spend summary ──────────────────────────────────────────────────────
  - type: card
    id: spend_summary_card
    state_binding: [content]
    elevation: 1
    accessibility_label: "{strings.sbc.spend_summary_card.a11y}"
    accessibility_label_params:
      period_label: "{period.label}"
    test_context:
      purpose: "Total spend summary card; verify amount updates when period chip changes and currency colour is error (expenditure)"
      required_fields: [period.label, period.total_spend]
      interaction_type: display
      data_driven: true
    children:
      - type: text
        id: total_spend_label
        value: "{strings.sbc.total_spend.header}"
        params:
          period_label: "{period.label}"
        style: labelMedium
        color: "on_surface_variant"
        test_context:
          purpose: "Period label in spend header; verify interpolates period.label correctly (e.g. 'Total Spend — June 2026')"
          required_fields: [period.label]
          interaction_type: display
          data_driven: true

      - type: text
        id: total_spend_amount
        value: "£{period.total_spend}"
        i18n: skip
        # i18n:skip — GBP amount formatted by CurrencyFormatter at runtime; not a translatable literal
        style: headlineMedium
        color: "error"
        accessibility_label: "{strings.sbc.total_spend.a11y}"
        params:
          amount: "{period.total_spend}"
        test_context:
          purpose: "Formatted GBP total for period; verify error colour applied and amount matches sum of category rows"
          required_fields: [period.total_spend]
          interaction_type: display
          data_driven: true

  # ── Category breakdown list ──────────────────────────────────────────────────
  - type: list
    id: category_list
    state_binding: [content]
    items_source: "{categories}"
    divider: true
    accessibility_label: "{strings.sbc.category_list.a11y}"
    test_context:
      purpose: "Category breakdown list; verify sorted by amount descending, percentages sum to 100%, each row drills to transactions"
      required_fields: [categories]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        id: category_row
        label: "{item.name}"
        supporting_text: "{strings.sbc.category_row.supporting_text}"
        supporting_text_params:
          transaction_count: "{item.transaction_count}"
          percentage: "{item.percentage}"
        trailing_content: "£{item.amount}"
        i18n_trailing: skip
        # i18n:skip on trailing_content — GBP formatted at runtime
        icon: "{item.icon}"
        accessibility_label: "{strings.sbc.category_row.a11y}"
        accessibility_label_params:
          name: "{item.name}"
          amount: "{item.amount}"
          percentage: "{item.percentage}"
          transaction_count: "{item.transaction_count}"
        test_context:
          purpose: "Category row with name, GBP amount, percentage, and transaction count; a11y label summarises full row data"
          required_fields: [item.name, item.amount, item.percentage, item.transaction_count, item.fraction]
          interaction_type: navigate
          data_driven: true
        children:
          - type: linear_progress
            id: category_progress_bar
            value: "{item.fraction}"
            color: "primary"
            accessibility_label: "{strings.sbc.category_progress.a11y}"
            accessibility_label_params:
              name: "{item.name}"
            test_context:
              purpose: "Progress bar for category share (0.0–1.0); verify value = item.percentage / 100"
              required_fields: [item.fraction]
              interaction_type: display
              data_driven: true
        on_click:
          action: navigate_category_transactions
          target: transactions
          params:
            category: "{item.name}"

  # ── Empty state ──────────────────────────────────────────────────────────────
  - type: empty_state
    id: empty_state
    state_binding: [empty]
    icon: pie_chart
    title: "{strings.sbc.empty.title}"
    body: "{strings.sbc.empty.body}"
    accessibility_label: "{strings.sbc.empty.a11y}"
    test_context:
      purpose: "Empty state when no debit transactions exist for selected period; verify no category rows shown and period selector still active"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Error state ──────────────────────────────────────────────────────────────
  - type: error_state
    id: error_state
    state_binding: [error]
    icon: warning_amber
    title: "{strings.sbc.error.title}"
    body: "{strings.sbc.error.body}"
    accessibility_label: "{strings.sbc.error.a11y}"
    test_context:
      purpose: "Error state when category computation fails; verify retry button visible and accessible"
      required_fields: []
      interaction_type: display
      data_driven: false
    action:
      - type: button
        id: retry_button
        variant: tonal
        label: "{strings.sbc.error.retry}"
        accessibility_label: "{strings.sbc.error.retry}"
        test_context:
          purpose: "Retry button in error state; verify tap re-triggers category_spend_compute for current period"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: retry_compute
          params:
            period: "{selected_period}"

status_history:
  - from: draft
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"
  - from: enriched
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"
    notes: "Push enrichment: +loading/error states, full i18n, canonical chip_group/linear_progress types, a11y on all components, quality 83→93"
  - from: enriched
    to: enriched
    at: "2026-07-14"
    by: "/idea-enrich spending-by-category (WARN-TIER CC-gaps pass)"
    quality_before: 95
    quality_after: 95
    changes:
      - "CC1 + CC8: reuses settings/ui.yaml Storage section (pfm_storage_location_row + clear_pfm_cache_row)"
      - "No duplicate settings entry created — shared pfm_room_cache backing store covered by pfm-dashboard's Storage section"
      - "CAPABILITY_GAPS: CC1 + CC8 spending-by-category closed"
