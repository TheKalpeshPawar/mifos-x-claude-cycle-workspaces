<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Debits — loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    /* ── Design tokens: Open Banking Trust Blue (M3 light) ── */
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-background: #F7F9FF;
      --md-surface: #F7F9FF;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low: #F1F4F9;
      --md-surface-container: #EBEEF3;
      --md-surface-container-high: #E5E8ED;
      --md-surface-container-highest: #E0E3E8;
      --md-on-surface: #181C20;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-error: #BA1A1A;
      --radius-medium: 12px;
      --radius-full: 9999px;
      --screen-padding: 16px;
    }

    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-background: #101417;
      --md-surface: #101417;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024;
      --md-surface-container-high: #262A2E;
      --md-surface-container-highest: #313539;
      --md-on-surface: #E0E3E8;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-error: #FFB4AB;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--md-surface-container-highest);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    /* ── Device frame ── */
    .device-frame {
      width: 393px;
      height: 852px;
      background: var(--md-background);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 48px rgba(0,0,0,0.20), 0 2px 8px rgba(0,0,0,0.12);
      position: relative;
    }

    /* ── Status bar ── */
    .status-bar {
      height: 44px;
      background: var(--md-surface-container-low);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .status-time { font-size: 15px; font-weight: 600; color: var(--md-on-surface); }
    .status-icons { display: flex; gap: 5px; align-items: center; color: var(--md-on-surface); font-size: 12px; }
    .material-symbols-outlined.small { font-size: 16px; }

    /* ── Top app bar ── */
    .top-app-bar {
      height: 64px;
      background: var(--md-surface-container-low);
      display: flex;
      align-items: center;
      padding: 0 4px;
      gap: 4px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .icon-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-on-surface);
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover { background: rgba(24,28,32,0.08); }
    .icon-btn:active { background: rgba(24,28,32,0.12); }
    .top-bar-title {
      font-size: 22px;
      font-weight: 400;
      color: var(--md-on-surface);
      line-height: 28px;
    }

    /* ── Screen content ── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px var(--screen-padding) 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Bottom nav ── */
    .bottom-nav {
      height: 80px;
      background: var(--md-surface-container);
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      border-top: 1px solid var(--md-outline-variant);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--md-on-surface-variant);
      text-decoration: none;
      background: transparent;
      border: none;
      padding: 8px 0 12px;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item .material-symbols-outlined { font-size: 24px; }
    .nav-item.active { color: var(--md-primary); }
    .nav-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
    }
    .nav-item.active .nav-pill { background: var(--md-primary-container); }

    /* ── Skeleton shimmer ── */
    .skeleton {
      background: linear-gradient(
        90deg,
        var(--md-surface-container-high) 0%,
        var(--md-surface-container-highest) 40%,
        var(--md-surface-container-high) 80%
      );
      background-size: 300% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0%   { background-position: 100% 50%; }
      100% { background-position: -100% 50%; }
    }

    /* ── Skeleton chip group ── */
    .skel-chip-row {
      display: flex;
      gap: 8px;
      padding-bottom: 4px;
    }
    .skel-chip {
      height: 32px;
      border-radius: var(--radius-full);
    }

    /* ── Skeleton card ── */
    .skel-card {
      background: var(--md-surface-container);
      border-radius: var(--radius-medium);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .skel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .skel-amount {
      height: 30px;
      width: 110px;
      border-radius: 4px;
    }
    .skel-meta {
      height: 14px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="device-frame" aria-label="Loading direct debits">

    <!-- Status bar -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-time">9:41</span>
      <span class="status-icons">
        <span class="material-symbols-outlined small">signal_cellular_alt</span>
        <span class="material-symbols-outlined small">wifi</span>
        <span class="material-symbols-outlined small">battery_full</span>
      </span>
    </div>

    <!-- Top app bar -->
    <header class="top-app-bar" role="banner">
      <button
        class="icon-btn"
        aria-label="Navigate back to Account Detail"
        data-action="navigate_back"
        data-nav-to="account-detail"
      >
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-bar-title">Direct Debits</h1>
    </header>

    <!-- Loading skeleton (aria-live for screen reader) -->
    <main
      class="screen-content"
      aria-label="Loading direct debits"
      aria-busy="true"
      aria-live="polite"
    >

      <!-- Chip group skeleton -->
      <div class="skel-chip-row" aria-hidden="true">
        <div class="skeleton skel-chip" style="width: 96px;"></div>
        <div class="skeleton skel-chip" style="width: 88px;"></div>
      </div>

      <!-- Skeleton card 1 -->
      <div class="skel-card" aria-hidden="true">
        <div class="skel-header">
          <div class="skeleton" style="height:18px; width:130px; border-radius:4px;"></div>
          <div class="skeleton" style="height:22px; width:60px; border-radius:9999px;"></div>
        </div>
        <div class="skeleton skel-amount"></div>
        <div class="skeleton skel-meta" style="width:72%;"></div>
        <div class="skeleton skel-meta" style="width:60%;"></div>
      </div>

      <!-- Skeleton card 2 -->
      <div class="skel-card" aria-hidden="true">
        <div class="skel-header">
          <div class="skeleton" style="height:18px; width:100px; border-radius:4px;"></div>
          <div class="skeleton" style="height:22px; width:60px; border-radius:9999px;"></div>
        </div>
        <div class="skeleton skel-amount"></div>
        <div class="skeleton skel-meta" style="width:68%;"></div>
        <div class="skeleton skel-meta" style="width:55%;"></div>
      </div>

      <!-- Skeleton card 3 -->
      <div class="skel-card" aria-hidden="true">
        <div class="skel-header">
          <div class="skeleton" style="height:18px; width:150px; border-radius:4px;"></div>
          <div class="skeleton" style="height:22px; width:60px; border-radius:9999px;"></div>
        </div>
        <div class="skeleton skel-amount"></div>
        <div class="skeleton skel-meta" style="width:75%;"></div>
        <div class="skeleton skel-meta" style="width:62%;"></div>
      </div>

      <!-- Skeleton card 4 -->
      <div class="skel-card" aria-hidden="true">
        <div class="skel-header">
          <div class="skeleton" style="height:18px; width:120px; border-radius:4px;"></div>
          <div class="skeleton" style="height:22px; width:60px; border-radius:9999px;"></div>
        </div>
        <div class="skeleton skel-amount"></div>
        <div class="skeleton skel-meta" style="width:70%;"></div>
        <div class="skeleton skel-meta" style="width:58%;"></div>
      </div>

    </main>

    <!-- Bottom navigation (sub-screen: no active tab — direct-debits is pushed from account-detail) -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" aria-label="Home" data-nav-to="home">
        <div class="nav-pill">
          <span class="material-symbols-outlined" aria-hidden="true">home</span>
        </div>
        <span>Home</span>
      </button>
      <button class="nav-item" aria-label="Accounts" data-nav-to="accounts">
        <div class="nav-pill">
          <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
        </div>
        <span>Accounts</span>
      </button>
      <button class="nav-item" aria-label="Transactions" data-nav-to="transactions">
        <div class="nav-pill">
          <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
        </div>
        <span>Transactions</span>
      </button>
      <button class="nav-item" aria-label="More" data-nav-to="settings">
        <div class="nav-pill">
          <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
        </div>
        <span>More</span>
      </button>
    </nav>

  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
