<!doctype html>
<!-- render-hash: dd-loading-llm -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direct Debits — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B;
    --on-primary: #FFFFFF;
    --primary-container: #CDEDA3;
    --on-primary-container: #102000;
    --secondary: #386663;
    --tertiary: #386663;
    --tertiary-container: #BCEBE7;
    --error: #BA1A1A;
    --on-error: #FFFFFF;
    --error-container: #FFDAD6;
    --background: #F9FAEF;
    --on-background: #1A1C16;
    --surface: #FFFFFF;
    --on-surface: #1A1C16;
    --surface-variant: #E1E4D5;
    --on-surface-variant: #44483D;
    --surface-container: #F0F1E6;
    --outline: #75796C;
    --outline-variant: #C5C8BA;
    --scrim: #000000;
    --pending: #E8A317;
    --icon-xs: 16px; --icon-sm: 20px; --icon-md: 24px;
    --icon-lg: 32px; --icon-xl: 40px; --icon-2xl: 48px;
    --shimmer-base: #E1E4D5;
    --shimmer-hi: #F4F5ED;
  }

  [data-theme="dark"] {
    --primary: #B2D188;
    --on-primary: #1F3701;
    --primary-container: #354E16;
    --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB;
    --tertiary: #A0CFCB;
    --tertiary-container: #1F4E4B;
    --error: #FFB4AB;
    --on-error: #690005;
    --error-container: #93000A;
    --background: #12140E;
    --on-background: #E3E3D8;
    --surface: #1E201A;
    --on-surface: #E3E3D8;
    --surface-variant: #44483D;
    --on-surface-variant: #C5C8BA;
    --surface-container: #282B22;
    --outline: #8F9285;
    --outline-variant: #44483D;
    --scrim: #000000;
    --pending: #E8A317;
    --shimmer-base: #282A24;
    --shimmer-hi: #363830;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #B2D188;
      --on-primary: #1F3701;
      --primary-container: #354E16;
      --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB;
      --tertiary: #A0CFCB;
      --tertiary-container: #1F4E4B;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --background: #12140E;
      --on-background: #E3E3D8;
      --surface: #1E201A;
      --on-surface: #E3E3D8;
      --surface-variant: #44483D;
      --on-surface-variant: #C5C8BA;
      --surface-container: #282B22;
      --outline: #8F9285;
      --outline-variant: #44483D;
      --scrim: #000000;
      --pending: #E8A317;
      --shimmer-base: #282A24;
      --shimmer-hi: #363830;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 390px;
    margin: 0 auto;
  }

  main { flex: 1; padding-bottom: 24px; }

  .top-app-bar {
    height: 64px;
    background: var(--surface);
    border-bottom: 1px solid var(--outline-variant);
    display: flex;
    align-items: center;
    padding: 0 4px 0 4px;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav-btn {
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: none; background: transparent;
    color: var(--on-surface);
    cursor: pointer;
  }

  .bar-title {
    font-size: 18px; font-weight: 500;
    color: var(--on-surface);
    flex: 1; padding-left: 4px;
  }

  @keyframes shimmer {
    0%   { background-position: -300% 0; }
    100% { background-position:  300% 0; }
  }

  .sk {
    border-radius: 6px;
    background: linear-gradient(90deg,
      var(--shimmer-base) 25%,
      var(--shimmer-hi)   50%,
      var(--shimmer-base) 75%
    );
    background-size: 300% 100%;
    animation: shimmer 1.2s ease-in-out infinite;
    display: block;
  }

  .header-row {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    margin-top: 8px;
  }

  .skel-card {
    background: var(--surface-container);
    border-radius: 12px;
    border: 1px solid var(--outline-variant);
    padding: 16px;
    margin: 0 20px 12px;
  }

  .skel-row {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .skel-row-end { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body data-screen-id="direct-debits" data-state="loading">

  <div data-shell="top-app-bar">
    <header class="top-app-bar">
      <button class="nav-btn" aria-label="Back" data-nav-to="accounts">
        <span class="material-symbols-outlined" style="font-size:var(--icon-md);">arrow_back</span>
      </button>
      <span class="bar-title">Direct Debits</span>
    </header>
  </div>

  <main data-shell="content">

    <!-- Header skeleton -->
    <div class="header-row" data-component-type="stack" data-component-id="mandates_header_row" data-variant="row">
      <span class="sk" style="width:120px;height:16px;"></span>
      <span class="sk" style="width:70px;height:24px;border-radius:12px;"></span>
    </div>

    <!-- Skeleton card 1 -->
    <div class="skel-card" data-component-type="card" data-component-id="mandate_card" data-variant="outlined-skeleton-1">
      <div class="skel-row">
        <span class="sk" style="width:96px;height:16px;"></span>
        <div class="skel-row-end">
          <span class="sk" style="width:52px;height:20px;border-radius:10px;"></span>
          <span class="sk" style="width:22px;height:22px;border-radius:50%;"></span>
        </div>
      </div>
      <span class="sk" style="width:110px;height:18px;display:block;margin-bottom:8px;"></span>
      <span class="sk" style="width:130px;height:12px;display:block;margin-bottom:6px;"></span>
      <span class="sk" style="width:150px;height:12px;display:block;"></span>
    </div>

    <!-- Skeleton card 2 -->
    <div class="skel-card" data-component-type="card" data-component-id="mandate_card" data-variant="outlined-skeleton-2">
      <div class="skel-row">
        <span class="sk" style="width:108px;height:16px;"></span>
        <div class="skel-row-end">
          <span class="sk" style="width:52px;height:20px;border-radius:10px;"></span>
          <span class="sk" style="width:22px;height:22px;border-radius:50%;"></span>
        </div>
      </div>
      <span class="sk" style="width:100px;height:18px;display:block;margin-bottom:8px;"></span>
      <span class="sk" style="width:124px;height:12px;display:block;margin-bottom:6px;"></span>
      <span class="sk" style="width:145px;height:12px;display:block;"></span>
    </div>

    <!-- Skeleton card 3 (dimmed) -->
    <div class="skel-card" style="opacity:0.55;" data-component-type="card" data-component-id="mandate_card" data-variant="outlined-skeleton-3">
      <div class="skel-row">
        <span class="sk" style="width:88px;height:16px;"></span>
        <div class="skel-row-end">
          <span class="sk" style="width:52px;height:20px;border-radius:10px;"></span>
          <span class="sk" style="width:22px;height:22px;border-radius:50%;"></span>
        </div>
      </div>
      <span class="sk" style="width:106px;height:18px;display:block;margin-bottom:8px;"></span>
      <span class="sk" style="width:128px;height:12px;display:block;margin-bottom:6px;"></span>
      <span class="sk" style="width:142px;height:12px;display:block;"></span>
    </div>

  </main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
