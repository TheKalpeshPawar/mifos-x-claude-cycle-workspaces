<!doctype html>
<html lang="en" data-screen="direct-debits" data-state="populated">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Debits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }
    .top-app-bar {
      display: flex; align-items: center;
      background: var(--surface); padding: 0 4px; height: 64px;
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--surface-variant);
    }
    .icon-btn {
      width: 48px; height: 48px; display: flex; align-items: center;
      justify-content: center; border-radius: 50%; cursor: pointer;
      color: var(--on-surface); background: none; border: none;
    }
    .bar-title { flex: 1; font-size: 22px; font-weight: 600; color: var(--on-surface); padding-left: 4px; }
    .screen-content { padding-bottom: 96px; }
    /* Header row */
    .title-row {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
    }
    .screen-title { font-size: 32px; font-weight: 700; color: var(--primary); flex: 1; }
    .count-chip {
      background: var(--primary-container); border-radius: 12px;
      padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--primary);
    }
    /* Mandate cards */
    .mandate-card {
      background: var(--surface); border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      padding: 16px; margin: 0 20px 12px;
      border: 1px solid var(--background); cursor: pointer;
    }
    .mandate-card.cancelled {
      background: var(--background); border-color: var(--surface-variant);
      box-shadow: none;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 8px;
    }
    .merchant-name { font-size: 16px; font-weight: 600; color: var(--on-surface); }
    .merchant-name-muted { font-size: 16px; font-weight: 600; color: var(--outline); }
    .badge {
      border-radius: 10px; padding: 3px 8px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .badge-active { background: var(--primary-container); color: var(--primary); }
    .badge-cancelled { background: var(--background); color: var(--outline); border: 1px solid var(--outline-variant); }
    .amount-row {
      display: flex; justify-content: space-between; align-items: center; padding-top: 4px;
    }
    .mandate-amount { font-size: 16px; font-weight: 600; color: var(--primary); }
    .mandate-amount-muted { font-size: 16px; font-weight: 400; color: var(--outline); }
    .next-date { font-size: 12px; color: var(--outline); }
    .mandate-ref { font-size: 11px; color: var(--outline); margin-top: 6px; }
    .mandate-ref-muted { font-size: 11px; color: var(--outline-variant); margin-top: 6px; }
    /* FAB */
    .fab-wrap { position: fixed; bottom: 24px; right: calc(50% - 195px + 16px); }
    .fab {
      display: flex; align-items: center; gap: 8px;
      background: var(--primary); color: var(--on-primary);
      border: none; border-radius: 16px; padding: 16px 20px;
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 12px rgba(76,102,43,0.35);
    }
  </style>
</head>
<body>
  <header class="top-app-bar" role="banner">
    <button class="icon-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons">arrow_back</span>
    </button>
    <span class="bar-title">Direct Debits</span>
    <button class="icon-btn" data-action="open_direct_debit_options" aria-label="More options" tabindex="0">
      <span class="material-icons">more_vert</span>
    </button>
  </header>

  <main class="screen-content" role="main">

    <!-- Header row with title + count chip -->
    <div data-component-type="stack" data-component-id="title_count_row" class="title-row" role="row" aria-label="Direct debits header with active count">
      <h1 data-component-type="text" data-component-id="direct_debits_title" class="screen-title" role="heading" aria-label="Direct Debits screen title">Direct Debits</h1>
      <span data-component-type="box" data-component-id="active_count_chip" class="count-chip" role="status" aria-label="3 active direct debits">3 active</span>
    </div>

    <!-- Netflix mandate -->
    <article data-component-type="box" data-component-id="direct_debit_netflix" class="mandate-card"
      data-nav-to="direct-debit-detail" role="button"
      aria-label="Netflix direct debit. £15.99 monthly. Next payment 3 June 2026. Active. Mandate ref DD-NF-20240301."
      tabindex="0">
      <div data-component-type="stack" data-component-id="netflix_header_row" class="card-header" role="row">
        <span data-component-type="text" data-component-id="netflix_payee" class="merchant-name">Netflix</span>
        <span data-component-type="box" data-component-id="netflix_active_badge" class="badge badge-active" role="status">Active</span>
      </div>
      <div data-component-type="stack" data-component-id="netflix_amount_row" class="amount-row" role="row">
        <span data-component-type="text" data-component-id="netflix_amount" class="mandate-amount">£15.99 / month</span>
        <span data-component-type="text" data-component-id="netflix_next_date" class="next-date">Next: 3 Jun 2026</span>
      </div>
      <div data-component-type="text" data-component-id="netflix_mandate_ref" class="mandate-ref">Ref: DD-NF-20240301</div>
    </article>

    <!-- Spotify mandate -->
    <article data-component-type="box" data-component-id="direct_debit_spotify" class="mandate-card"
      data-nav-to="direct-debit-detail" role="button"
      aria-label="Spotify direct debit. £10.99 monthly. Next payment 12 June 2026. Active. Mandate ref DD-SP-20231115."
      tabindex="0">
      <div data-component-type="stack" data-component-id="spotify_header_row" class="card-header" role="row">
        <span data-component-type="text" data-component-id="spotify_payee" class="merchant-name">Spotify</span>
        <span data-component-type="box" data-component-id="spotify_active_badge" class="badge badge-active" role="status">Active</span>
      </div>
      <div data-component-type="stack" data-component-id="spotify_amount_row" class="amount-row" role="row">
        <span data-component-type="text" data-component-id="spotify_amount" class="mandate-amount">£10.99 / month</span>
        <span data-component-type="text" data-component-id="spotify_next_date" class="next-date">Next: 12 Jun 2026</span>
      </div>
      <div data-component-type="text" data-component-id="spotify_mandate_ref" class="mandate-ref">Ref: DD-SP-20231115</div>
    </article>

    <!-- PureGym mandate (cancelled) -->
    <article data-component-type="box" data-component-id="direct_debit_gym" class="mandate-card cancelled"
      data-nav-to="direct-debit-detail" role="button"
      aria-label="PureGym direct debit. £29.99 monthly. Cancelled. Mandate ref DD-GYM-20220601."
      tabindex="0">
      <div data-component-type="stack" data-component-id="gym_header_row" class="card-header" role="row">
        <span data-component-type="text" data-component-id="gym_payee" class="merchant-name-muted">PureGym</span>
        <span data-component-type="box" data-component-id="gym_cancelled_badge" class="badge badge-cancelled" role="status">Cancelled</span>
      </div>
      <div class="amount-row">
        <span data-component-type="text" data-component-id="gym_amount" class="mandate-amount-muted">£29.99 / month</span>
      </div>
      <div data-component-type="text" data-component-id="gym_mandate_ref" class="mandate-ref-muted">Ref: DD-GYM-20220601</div>
    </article>

  </main>

  <!-- FAB -->
  <div class="fab-wrap">
    <button data-component-type="button" data-component-id="setup_direct_debit_fab" class="fab"
      data-action="setup_direct_debit" role="button" aria-label="Set up a new direct debit" tabindex="0">
      <span class="material-icons" style="font-size:18px;">add</span>
      Set Up Direct Debit
    </button>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
