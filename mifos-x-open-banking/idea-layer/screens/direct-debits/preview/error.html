<!doctype html>
<!-- render-hash: dd-error-llm -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direct Debits — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B;
    --on-primary: #FFFFFF;
    --primary-container: #CDEDA3;
    --on-primary-container: #102000;
    --secondary: #386663;
    --tertiary: #386663;
    --tertiary-container: #BCEBE7;
    --error: #BA1A1A;
    --on-error: #FFFFFF;
    --error-container: #FFDAD6;
    --background: #F9FAEF;
    --on-background: #1A1C16;
    --surface: #FFFFFF;
    --on-surface: #1A1C16;
    --surface-variant: #E1E4D5;
    --on-surface-variant: #44483D;
    --surface-container: #F0F1E6;
    --outline: #75796C;
    --outline-variant: #C5C8BA;
    --scrim: #000000;
    --pending: #E8A317;
    --icon-xs: 16px; --icon-sm: 20px; --icon-md: 24px;
    --icon-lg: 32px; --icon-xl: 40px; --icon-2xl: 48px;
  }

  [data-theme="dark"] {
    --primary: #B2D188;
    --on-primary: #1F3701;
    --primary-container: #354E16;
    --on-primary-container: #CDEDA3;
    --secondary: #A0CFCB;
    --tertiary: #A0CFCB;
    --tertiary-container: #1F4E4B;
    --error: #FFB4AB;
    --on-error: #690005;
    --error-container: #93000A;
    --background: #12140E;
    --on-background: #E3E3D8;
    --surface: #1E201A;
    --on-surface: #E3E3D8;
    --surface-variant: #44483D;
    --on-surface-variant: #C5C8BA;
    --surface-container: #282B22;
    --outline: #8F9285;
    --outline-variant: #44483D;
    --scrim: #000000;
    --pending: #E8A317;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #B2D188;
      --on-primary: #1F3701;
      --primary-container: #354E16;
      --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB;
      --tertiary: #A0CFCB;
      --tertiary-container: #1F4E4B;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --background: #12140E;
      --on-background: #E3E3D8;
      --surface: #1E201A;
      --on-surface: #E3E3D8;
      --surface-variant: #44483D;
      --on-surface-variant: #C5C8BA;
      --surface-container: #282B22;
      --outline: #8F9285;
      --outline-variant: #44483D;
      --scrim: #000000;
      --pending: #E8A317;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--background);
    color: var(--on-background);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 390px;
    margin: 0 auto;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 48px;
    text-align: center;
  }

  .top-app-bar {
    height: 64px;
    background: var(--surface);
    border-bottom: 1px solid var(--outline-variant);
    display: flex;
    align-items: center;
    padding: 0 4px;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav-btn {
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: none; background: transparent;
    color: var(--on-surface);
    cursor: pointer;
  }

  .bar-title {
    font-size: 18px; font-weight: 500;
    color: var(--on-surface);
    flex: 1; padding-left: 4px;
  }

  .error-illustration {
    width: 140px; height: 140px;
    margin-bottom: 28px;
  }

  .error-headline {
    font-size: 22px; font-weight: 600;
    color: var(--on-background);
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .error-body {
    font-size: 14px; font-weight: 400;
    color: var(--outline);
    line-height: 1.5;
    max-width: 260px;
    margin-bottom: 32px;
  }

  .retry-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary);
    color: var(--on-primary);
    font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    min-height: 48px;
    transition: opacity 0.15s;
  }
  .retry-btn:hover { opacity: 0.88; }
</style>
</head>
<body data-screen-id="direct-debits" data-state="error">

  <div data-shell="top-app-bar">
    <header class="top-app-bar">
      <button class="nav-btn" aria-label="Back" data-nav-to="accounts">
        <span class="material-symbols-outlined" style="font-size:var(--icon-md);">arrow_back</span>
      </button>
      <span class="bar-title">Direct Debits</span>
    </header>
  </div>

  <main data-shell="content">

    <div data-component-type="error_state"
         data-component-id="error_state"
         style="display:flex;flex-direction:column;align-items:center;"
         aria-label="Unable to load direct debits. Retry."
         role="status">

      <!-- Inline SVG: disconnected cloud -->
      <svg class="error-illustration"
           viewBox="0 0 140 140"
           fill="none"
           xmlns="http://www.w3.org/2000/svg"
           aria-hidden="true">
        <circle cx="70" cy="70" r="70" fill="var(--surface-container)"/>
        <!-- Cloud body -->
        <path d="M90 86H52a18 18 0 010-36 18 18 0 0135.6-5A16 16 0 0190 86z"
              fill="var(--surface)" stroke="var(--outline-variant)" stroke-width="2"/>
        <!-- Rain lines (error symbol) -->
        <line x1="55" y1="94" x2="52" y2="104" stroke="var(--outline)" stroke-width="2" stroke-linecap="round"/>
        <line x1="65" y1="94" x2="62" y2="104" stroke="var(--outline)" stroke-width="2" stroke-linecap="round"/>
        <line x1="75" y1="94" x2="72" y2="104" stroke="var(--outline)" stroke-width="2" stroke-linecap="round"/>
        <!-- X mark on cloud -->
        <line x1="62" y1="68" x2="78" y2="78" stroke="var(--error)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="78" y1="68" x2="62" y2="78" stroke="var(--error)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>

      <h2 class="error-headline">Could not load direct debits</h2>

      <p class="error-body">
        Please check your connection and try again.
      </p>

      <button class="retry-btn"
              data-component-type="button"
              data-component-id="retry_button"
              data-variant="filled"
              data-action="retry"
              aria-label="Retry loading direct debits">
        <span class="material-symbols-outlined" style="font-size:var(--icon-sm);">refresh</span>
        Retry
      </button>

    </div>
  </main>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
