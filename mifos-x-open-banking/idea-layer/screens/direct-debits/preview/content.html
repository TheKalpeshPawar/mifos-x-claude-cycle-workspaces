<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px,initial-scale=1">
<title>Direct Debits — Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:390px;min-height:844px;position:relative;overflow-x:hidden;
  background:var(--background);font-family:var(--font);
}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;height:56px;background:var(--surface);
  position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--surface-variant);
}
.top-bar-left{display:flex;align-items:center;gap:4px;}
.icon-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:none;background:transparent;cursor:pointer;
}
.top-bar-title{font-size:20px;font-weight:500;color:var(--text-primary);margin-left:4px;}
/* Scroll area leaves room for nav (80px) */
.scroll-area{overflow-y:auto;height:calc(844px - 56px - 80px);padding-bottom:8px;}
/* Header */
.title-row{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;
}
.screen-title{font-size:28px;font-weight:700;color:var(--primary);}
.count-chip{
  display:inline-flex;align-items:center;
  background:var(--primary-container);border-radius:12px;
  padding:4px 10px;
  font-size:13px;font-weight:600;color:var(--primary);
}
/* Mandate card */
.mandate-card{
  background:var(--surface);border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.07);
  border:1px solid var(--background);
  padding:16px;margin:0 20px 12px;
  cursor:pointer;
}
.mandate-card-cancelled{
  background:var(--background);border-radius:16px;
  border:1px solid var(--surface-variant);
  padding:16px;margin:0 20px 12px;
  cursor:pointer;
}
.mandate-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:8px;
}
.mandate-payee{font-size:16px;font-weight:600;color:var(--text-primary);}
.mandate-payee-grey{font-size:16px;font-weight:600;color:var(--outline);}
.badge-active{
  background:var(--primary-container);border-radius:10px;
  padding:3px 8px;
  font-size:11px;font-weight:500;color:var(--primary);
}
.badge-cancelled{
  background:var(--background);border-radius:10px;
  border:1px solid var(--outline-variant);
  padding:3px 8px;
  font-size:11px;font-weight:500;color:var(--outline-variant);
}
.amount-row{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:4px;
}
.mandate-amount{font-size:16px;font-weight:600;color:var(--primary);}
.mandate-amount-grey{font-size:16px;font-weight:400;color:var(--outline-variant);}
.mandate-next{font-size:13px;color:var(--outline);}
.mandate-ref{font-size:11px;color:var(--outline-variant);margin-top:4px;}
.mandate-ref-faint{font-size:11px;color:var(--surface-variant);margin-top:4px;}
/* FAB */
.fab{
  position:absolute;
  right:20px;
  bottom:96px;
  display:flex;align-items:center;gap:8px;
  background:var(--primary);color:var(--on-primary);
  border:none;border-radius:16px;cursor:pointer;
  padding:16px 20px;font-family:var(--font);font-size:15px;font-weight:600;
  box-shadow:0 4px 12px rgba(76,102,43,0.4);
  z-index:5;
}
/* Bottom Nav: Payments active */
.bottom-nav{
  position:absolute;bottom:0;left:0;width:390px;height:80px;
  background:var(--surface);border-top:1px solid var(--surface-variant);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px;
}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;width:80px;height:56px;border-radius:16px;
  background:transparent;border:none;cursor:pointer;font-family:var(--font);
}
.nav-tab.active{background:var(--nav-active);}
.nav-label{font-size:12px;font-weight:500;color:var(--outline);}
.nav-tab.active .nav-label{color:var(--primary);}
</style>
</head>
<body>
<main data-screen="direct-debits" data-state="content" role="main">

  <!-- Top App Bar -->
  <header class="top-bar" role="banner">
    <div class="top-bar-left">
      <button class="icon-btn" aria-label="Go back" data-action="navigate_back">
        <span class="material-symbols-rounded" style="font-size:24px;color:var(--text-primary);" aria-hidden="true">arrow_back</span>
      </button>
      <span class="top-bar-title">Direct Debits</span>
    </div>
    <button class="icon-btn" aria-label="More options" data-action="open_direct_debit_options">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--text-primary);" aria-hidden="true">more_vert</span>
    </button>
  </header>

  <div class="scroll-area">

    <!-- Header row -->
    <div class="title-row"
         data-component-type="stack"
         data-component-id="title_count_row"
         data-component-variant="horizontal"
         role="banner"
         aria-label="Direct debits header with active count">
      <h1 class="screen-title"
          data-component-type="text"
          data-component-id="direct_debits_title"
          data-component-variant="headline_large"
          role="heading"
          aria-level="1">Direct Debits</h1>
      <span class="count-chip"
            data-component-type="box"
            data-component-id="active_count_chip"
            data-component-variant="default"
            role="status"
            aria-label="3 active direct debits">3 active</span>
    </div>

    <!-- Netflix mandate (ACTIVE) -->
    <div class="mandate-card"
         data-component-type="box"
         data-component-id="direct_debit_netflix"
         data-component-variant="default"
         data-action="view_direct_debit"
         role="button"
         tabindex="0"
         aria-label="Netflix direct debit. £15.99 monthly. Next payment 3 June 2026. Active. Mandate ref DD-NF-20240301.">
      <div class="mandate-header"
           data-component-type="stack"
           data-component-id="netflix_header_row"
           data-component-variant="horizontal">
        <span class="mandate-payee"
              data-component-type="text"
              data-component-id="netflix_payee"
              data-component-variant="title_medium">Netflix</span>
        <span class="badge-active"
              data-component-type="box"
              data-component-id="netflix_active_badge"
              data-component-variant="default"
              role="status"
              aria-label="Status: Active">Active</span>
      </div>
      <div class="amount-row"
           data-component-type="stack"
           data-component-id="netflix_amount_row"
           data-component-variant="horizontal">
        <span class="mandate-amount"
              data-component-type="text"
              data-component-id="netflix_amount"
              data-component-variant="body_large">£15.99 / month</span>
        <span class="mandate-next"
              data-component-type="text"
              data-component-id="netflix_next_date"
              data-component-variant="body_small">Next: 3 Jun 2026</span>
      </div>
      <div class="mandate-ref"
           data-component-type="text"
           data-component-id="netflix_mandate_ref"
           data-component-variant="label_small">Ref: DD-NF-20240301</div>
    </div>

    <!-- Spotify mandate (ACTIVE) -->
    <div class="mandate-card"
         data-component-type="box"
         data-component-id="direct_debit_spotify"
         data-component-variant="default"
         data-action="view_direct_debit"
         role="button"
         tabindex="0"
         aria-label="Spotify direct debit. £10.99 monthly. Next payment 12 June 2026. Active. Mandate ref DD-SP-20231115.">
      <div class="mandate-header"
           data-component-type="stack"
           data-component-id="spotify_header_row"
           data-component-variant="horizontal">
        <span class="mandate-payee"
              data-component-type="text"
              data-component-id="spotify_payee"
              data-component-variant="title_medium">Spotify</span>
        <span class="badge-active"
              data-component-type="box"
              data-component-id="spotify_active_badge"
              data-component-variant="default"
              role="status"
              aria-label="Status: Active">Active</span>
      </div>
      <div class="amount-row"
           data-component-type="stack"
           data-component-id="spotify_amount_row"
           data-component-variant="horizontal">
        <span class="mandate-amount"
              data-component-type="text"
              data-component-id="spotify_amount"
              data-component-variant="body_large">£10.99 / month</span>
        <span class="mandate-next"
              data-component-type="text"
              data-component-id="spotify_next_date"
              data-component-variant="body_small">Next: 12 Jun 2026</span>
      </div>
      <div class="mandate-ref"
           data-component-type="text"
           data-component-id="spotify_mandate_ref"
           data-component-variant="label_small">Ref: DD-SP-20231115</div>
    </div>

    <!-- Gym mandate (CANCELLED) -->
    <div class="mandate-card-cancelled"
         data-component-type="box"
         data-component-id="direct_debit_gym"
         data-component-variant="default"
         data-action="view_direct_debit"
         role="button"
         tabindex="0"
         aria-label="PureGym direct debit. £29.99 monthly. Cancelled. Mandate ref DD-GYM-20220601.">
      <div class="mandate-header"
           data-component-type="stack"
           data-component-id="gym_header_row"
           data-component-variant="horizontal">
        <span class="mandate-payee-grey"
              data-component-type="text"
              data-component-id="gym_payee"
              data-component-variant="title_medium">PureGym</span>
        <span class="badge-cancelled"
              data-component-type="box"
              data-component-id="gym_cancelled_badge"
              data-component-variant="default"
              role="status"
              aria-label="Status: Cancelled">Cancelled</span>
      </div>
      <span class="mandate-amount-grey"
            data-component-type="text"
            data-component-id="gym_amount"
            data-component-variant="body_large">£29.99 / month</span>
      <div class="mandate-ref-faint"
           data-component-type="text"
           data-component-id="gym_mandate_ref"
           data-component-variant="label_small">Ref: DD-GYM-20220601</div>
    </div>

  </div>

  <!-- FAB: bottom:96px (nav present) -->
  <button class="fab"
          data-component-type="button"
          data-component-id="setup_direct_debit_fab"
          data-component-variant="filled"
          data-action="setup_direct_debit"
          aria-label="Set up a new direct debit">
    <span class="material-symbols-rounded" style="font-size:22px;color:var(--on-primary);" aria-hidden="true">add</span>
    Set Up Direct Debit
  </button>

  <!-- Consumer Bottom Nav: Payments active -->
  <nav class="bottom-nav"
       data-shell="bottom-nav"
       role="navigation"
       aria-label="Main navigation">
    <button class="nav-tab"
            data-nav-to="home"
            aria-label="Home">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">home</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-tab"
            data-nav-to="accounts"
            aria-label="Accounts">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">account_balance</span>
      <span class="nav-label">Accounts</span>
    </button>
    <button class="nav-tab active"
            data-nav-to="send-money"
            aria-label="Payments"
            aria-current="page">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--primary);" aria-hidden="true">payments</span>
      <span class="nav-label" style="color:var(--primary);">Payments</span>
    </button>
    <button class="nav-tab"
            data-nav-to="cards"
            aria-label="Cards">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">credit_card</span>
      <span class="nav-label">Cards</span>
    </button>
    <button class="nav-tab"
            data-nav-to="profile"
            aria-label="Profile">
      <span class="material-symbols-rounded" style="font-size:24px;color:var(--outline);" aria-hidden="true">person</span>
      <span class="nav-label">Profile</span>
    </button>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
