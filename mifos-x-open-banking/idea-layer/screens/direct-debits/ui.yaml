      purpose: "Primary creation CTA — always visible; opens new mandate setup bottom sheet"
      interaction_type: tap_action
      data_driven: false
      required_fields: []
      assert_text: "Set Up Direct Debit"

initial_state: loading

responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
      show_skeleton_list: true
      skeleton_count: 3
      skeleton_card_height: 110

  populated:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
        - active_count_chip
        - direct_debit_netflix
        - netflix_header_row
        - netflix_payee
        - netflix_active_badge
        - netflix_amount_row
        - netflix_amount
        - netflix_next_date
        - netflix_mandate_ref
        - direct_debit_spotify
        - spotify_header_row
        - spotify_payee
        - spotify_active_badge
        - spotify_amount_row
        - spotify_amount
        - spotify_next_date
        - spotify_mandate_ref
        - direct_debit_gym
        - gym_header_row
        - gym_payee
        - gym_cancelled_badge
        - gym_amount
        - gym_mandate_ref
        - setup_direct_debit_fab

  empty:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
        - setup_direct_debit_fab
      show_empty_state: true
      empty_state_icon: account_balance_wallet
      empty_state_title: "No direct debits set up"
      empty_state_message: "Authorise merchants like Netflix or your utility providers to collect payments automatically on agreed dates"

  cancel_confirm:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
        - active_count_chip
        - direct_debit_netflix
        - netflix_header_row
        - netflix_payee
        - netflix_active_badge
        - netflix_amount_row
        - netflix_amount
        - netflix_next_date
        - netflix_mandate_ref
        - direct_debit_spotify
        - spotify_header_row
        - spotify_payee
        - spotify_active_badge
        - spotify_amount_row
        - spotify_amount
        - spotify_next_date
        - spotify_mandate_ref
        - direct_debit_gym
        - gym_header_row
        - gym_payee
        - gym_cancelled_badge
        - gym_amount
        - gym_mandate_ref
        - setup_direct_debit_fab
        - cancel_confirm_dialog
        - cancel_dialog_title
        - cancel_dialog_body
        - cancel_confirm_cta
        - cancel_dismiss_cta
      overlay: true
      overlay_alpha: 0.5

  error:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
        - setup_direct_debit_fab
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load direct debits"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: DirectDebitsViewModel
  state_fields:
    - name: directDebits
      type: "List<DirectDebit>"
      default: "emptyList()"
    - name: activeCount
      type: Int
      default: 0
    - name: uiState
      type: DirectDebitsUiState
      default: Loading
    - name: selectedMandate
      type: "DirectDebit?"
      default: "null"
    - name: showCancelDialog
      type: Boolean
      default: false
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load direct debits. Please try again."
    - field: cancel
      code: CANCEL_FAILED
      message: "Could not cancel mandate. Please try again."
    - field: create
      code: CREATE_FAILED
      message: "Could not set up direct debit. Please try again."
  events:
    - DirectDebitsLoaded
    - ViewDirectDebitClicked
    - SetUpDirectDebitClicked
    - CancelDirectDebitClicked
    - CancelConfirmed
    - CancelDismissed
    - RefreshTriggered
    - RetryLoad
  actions:
    - view_direct_debit
    - setup_direct_debit
    - confirm_cancel_direct_debit
    - dismiss_cancel_dialog
    - open_direct_debit_options
  di:
    - DirectDebitRepository
    - AccountRepository

api:
  - id: obp_get_direct_debits
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/direct-debits"
    tag: Direct-Debit
    description: "Retrieve all direct debit mandates for the account"
    response:
      fields:
        - name: direct_debits
          type: "List<DirectDebit>"
    errors:
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"

  - id: obp_create_direct_debit
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/direct-debit"
    tag: Direct-Debit
    description: "Create direct debit mandate"
    request:
      fields:
        - name: start_date
          type: String
        - name: end_date
          type: String
        - name: to
          type: DirectDebitCounterparty
        - name: amount_value
          type: String
        - name: amount_currency
          type: String
    response:
      fields:
        - name: direct_debit_id
          type: String
        - name: bank_id
          type: String
        - name: account_id
          type: String
        - name: counterparty_id
          type: String
        - name: amount_value
          type: String
        - name: amount_currency
          type: String
        - name: start_date
          type: String
        - name: end_date
          type: String
        - name: active
          type: Boolean
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries

navigation:
  - action: view_direct_debit
    target: direct-debit-detail
    description: "Open direct debit detail sheet for the selected mandate"
  - action: setup_direct_debit
    target: ""
    description: "Open new direct debit setup bottom sheet"
  - action: confirm_cancel_direct_debit
    target: direct-debits
    description: "Cancel selected mandate via OBP API then reload mandate list"
  - action: dismiss_cancel_dialog
    target: ""
    description: "Close cancel confirmation dialog without side effects"
  - action: navigate_back
    target: accounts
    description: "Return to accounts screen"
  - action: nav_home
    target: home
    description: "Navigate to home dashboard"
  - action: nav_standing_orders
    target: standing-orders
    description: "Navigate to standing orders screen"
  - action: nav_cards
    target: cards
    description: "Navigate to cards management screen"
  - action: nav_account_detail
    target: account-detail
    description: "Navigate to account detail screen"
