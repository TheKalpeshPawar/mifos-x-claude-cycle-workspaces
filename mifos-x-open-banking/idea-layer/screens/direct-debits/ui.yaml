      target: filter_active
    a11y:
      label: "3 active direct debits"
      role: status
    api:
      endpoint_id: obp_get_direct_debits
      derives: active_count
    component_states:
      loading:
        type: skeleton  # fix REG-001: shimmer → skeleton (registered)
        count: 1
        description: "shimmer pill matching active count chip"
