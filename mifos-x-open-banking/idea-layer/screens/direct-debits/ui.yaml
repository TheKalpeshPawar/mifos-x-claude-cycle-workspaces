shell:
  top_app_bar:
    show: true
    title: "Direct Debits"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions: []
  bottom_nav: false

screens:
  - id: direct-debits
    name: Direct Debits
    archetype: index_list
    viewmodel: "DirectDebitsViewModel"
    route: /direct-debits
    scroll: vertical

archetype: index_list

components:
  # ── Header row: "Your mandates" + active-count chip ──────────────────────────
  - type: stack
    id: mandates_header_row
    label: "Your mandates header"
    variant: row
    style:
      orientation: horizontal
      padding_horizontal: 20
      padding_vertical: 8
      align: center
    a11y:
      label: "Your mandates header with active count"
      role: row
    test_context:
      tag: mandates_header_row
      purpose: "Header row holding the 'Your mandates' title and the active-count chip"
      interaction_type: display
      data_driven: true

  - type: text
    id: mandates_title
    label: "Your mandates"
    content: "Your mandates"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
    a11y:
      label: "Your mandates"
      role: heading
    test_context:
      tag: mandates_title
      assert_text: "Your mandates"
      purpose: "List header label"
      interaction_type: display
      data_driven: false

  - type: badge
    id: active_count_chip
    label: "active count"
    content: "3 active"
    variant: tonal
    style:
      background: "#CDEDA3"
      border_radius: 12
      padding_horizontal: 10
      padding_vertical: 4
      text_color: "#4C662B"
      typography: "Outfit/label_medium"
      font_weight: semibold
    a11y:
      label: "3 active direct debits"
      role: status
    test_context:
      tag: active_count_chip
      assert_text: "3 active"
      purpose: "Chip showing the count of active mandates; drops when one is cancelled"
      interaction_type: display
      data_driven: true

  # ── Data-driven mandate list ─────────────────────────────────────────────────
  - type: list
    id: mandates_list
    label: "Direct debit mandates"
    variant: lazy_column
    style:
      padding_bottom: 24
    a11y:
      label: "List of direct debit mandates"
      role: list
    test_context:
      tag: mandates_list
      purpose: "LazyColumn of derived mandates keyed by id; no hardcoded merchant rows"
      interaction_type: display
      data_driven: true

  - type: card
    id: mandate_card
    label: "Mandate card"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: "#FFFFFF"
      border_radius: 16
      border_color: "#E1E4D5"
      border_width: 1
      padding: 16
      margin_horizontal: 20
      margin_bottom: 12
    on_click:
      action: navigate
      target: direct-debit-detail
    a11y:
      label: "Direct debit mandate. Tap to view details."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: mandate_card
      purpose: "Tappable mandate card: merchant, status badge, inline Cancel icon (active only), amount/frequency, next-collection, reference. Muted background when cancelled. Navigates to direct-debit-detail with bankId/accountId/mandateId."
      interaction_type: action
      data_driven: true

  - type: text
    id: mandate_merchant
    label: "Merchant name"
    content: "Netflix"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
    a11y:
      label: "Merchant name"
      role: text
    test_context:
      tag: mandate_merchant
      purpose: "Merchant name from the transaction description (never the login-username holder placeholder). Muted when cancelled."
      interaction_type: display
      data_driven: true

  - type: badge
    id: mandate_status_badge
    label: "Status badge"
    content: "Active"
    variant: tonal
    style:
      background: "#CDEDA3"
      border_radius: 10
      padding_horizontal: 8
      padding_vertical: 3
      text_color: "#4C662B"
      typography: "Outfit/label_small"
    a11y:
      label: "Status"
      role: status
    test_context:
      tag: mandate_status_badge
      purpose: "Status pill: Active (green) / Cancelled (grey). Drives inline Cancel-icon visibility."
      interaction_type: display
      data_driven: true

  - type: icon
    id: mandate_cancel_icon
    label: "Cancel mandate"
    variant: icon_button
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      icon_name: cancel_outlined
      size: 22
      color: "#BA1A1A"
      padding: spacing.xs
    on_click:
      action: cancel_requested
      target: cancel_confirm_dialog
    a11y:
      label: "Cancel this direct debit"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: mandate_cancel_icon
      purpose: "Inline cancel icon (OBP legacy). UNSUPPORTED under OBIE — no cancel-direct-debit endpoint. Retained in layout but the action has no API binding; the mandate is view-only."
      interaction_type: action
      data_driven: true

  - type: text
    id: mandate_amount
    label: "Amount / frequency"
    content: "£15.99 / month"
    style:
      typography: "Outfit/body_large"
      color: "#4C662B"
      font_weight: semibold
    a11y:
      label: "Amount per period"
      role: text
    test_context:
      tag: mandate_amount
      purpose: "'{symbol}{amount} / {period}' (day/week/2 weeks/month/year). Muted when cancelled."
      interaction_type: display
      data_driven: true

  - type: text
    id: mandate_next_date
    label: "Next collection"
    content: "Next: 3 Jun 2026"
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
    a11y:
      label: "Next collection date"
      role: text
    test_context:
      tag: mandate_next_date
      purpose: "'Next: {date}' shown only for active mandates with a derivable next-collection date"
      interaction_type: display
      data_driven: true

  - type: text
    id: mandate_ref
    label: "Mandate reference"
    content: "Ref: DD-NF-20240301"
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
    a11y:
      label: "Mandate reference"
      role: text
    test_context:
      tag: mandate_ref
      purpose: "'Ref: {mandateReference}' (DD-{initials}-{first collection date}); shown when non-blank"
      interaction_type: display
      data_driven: true

  # ── Cancel confirmation dialog (local-only cancel) ───────────────────────────
  - type: dialog
    id: cancel_confirm_dialog
    label: "Cancel Direct Debit?"
    variant: alert
    title: "Cancel Direct Debit?"
    style:
      border_radius: 20
      background: "#FFFFFF"
      padding_horizontal: 24
      padding_vertical: 24
    a11y:
      label: "Cancel direct debit confirmation dialog"
      role: dialog
    keyboard:
      focusable: true
      shortcuts: [Escape]
    test_context:
      tag: cancel_confirm_dialog
      purpose: "Destructive-action guard (OBP legacy). UNSUPPORTED under OBIE — no cancel-direct-debit endpoint. Retained in layout but has no API binding; mandates are view-only."
      interaction_type: action
      data_driven: true

  - type: button
    id: cancel_confirm_cta
    label: "Yes, Cancel Mandate"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#BA1A1A"
      text_color: "#FFFFFF"
      border_radius: 12
      full_width: true
    on_click:
      action: cancel_confirmed
      target: direct-debits
    a11y:
      label: "Confirm cancellation of this direct debit"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: cancel_confirm_cta
      assert_text: "Yes, Cancel Mandate"
      purpose: "Records the cancellation locally then reloads mandates (mandate flips to Cancelled, active count drops)"
      interaction_type: action
      data_driven: true

  - type: button
    id: cancel_dismiss_cta
    label: "Keep Mandate"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      border_color: "#4C662B"
      text_color: "#4C662B"
      border_radius: 12
      full_width: true
    on_click:
      action: cancel_dismissed
      target: ""
    a11y:
      label: "Keep the direct debit active"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: cancel_dismiss_cta
      assert_text: "Keep Mandate"
      purpose: "Aborts the cancel flow with no side effects"
      interaction_type: action
      data_driven: false

  # ── Empty / Error ────────────────────────────────────────────────────────────
  - type: empty_state
    id: empty_state
    label: "No direct debits"
    style:
      empty_icon: account_balance_wallet
    a11y:
      label: "No direct debits on this account"
      role: status
    test_context:
      tag: empty_state
      purpose: "'No direct debits on this account' + 'Mandates from merchants you have authorised — like Netflix or your utility providers — will appear here once they start collecting'"
      interaction_type: display
      data_driven: false

  - type: error_state
    id: error_state
    label: "Unable to load"
    style:
      error_icon: cloud_off
    on_click:
      action: retry
      target: direct-debits
    a11y:
      label: "Unable to load direct debits. Retry."
      role: status
    test_context:
      tag: error_state
      purpose: "Error/no-network/unauthenticated state with Retry"
      interaction_type: action
      data_driven: false

initial_state: loading

responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components: []
      show_skeleton_list: true
      skeleton_count: 3
      note: "Centered CircularProgressIndicator while DirectDebitsRepository.listMandates() resolves."
  content:
    layout:
      visible_components:
        - mandates_header_row
        - mandates_title
        - active_count_chip
        - mandates_list
        - mandate_card
        - mandate_merchant
        - mandate_status_badge
        - mandate_cancel_icon
        - mandate_amount
        - mandate_next_date
        - mandate_ref
  cancel_confirm:
    layout:
      visible_components:
        - mandates_header_row
        - mandates_title
        - active_count_chip
        - mandates_list
        - mandate_card
        - mandate_merchant
        - mandate_status_badge
        - mandate_cancel_icon
        - mandate_amount
        - mandate_next_date
        - mandate_ref
        - cancel_confirm_dialog
        - cancel_confirm_cta
        - cancel_dismiss_cta
      overlay: true
      overlay_alpha: 0.5
      note: "cancelDialogFor != null — dialog overlays the content list."
  empty:
    layout:
      visible_components:
        - empty_state
  error:
    layout:
      visible_components:
        - error_state
  no_network:
    layout:
      visible_components:
        - error_state
  unauthenticated:
    layout:
      visible_components:
        - error_state

state_model:
  view_model: DirectDebitsViewModel
  route_params:
    - { name: bankId, type: String, default: "\"\"" }
    - { name: accountId, type: String, default: "\"\"", note: "blank → resolve persisted-default, else checking-first, else first account" }
  flows:
    - name: uiState
      type: "StateFlow<ScreenState<DirectDebitsContent>>"
      default: "ScreenState.Loading"
      obie_field_map:
        note: >
          Each DirectDebitRow is built from an OBIE Data.DirectDebit[] entry
          (get_account_direct_debits). Surfaced OBIE shapes:
          id ← Data.DirectDebit[].DirectDebitId (String)
          mandateReference ← Data.DirectDebit[].MandateIdentification (String)
          merchantName ← Data.DirectDebit[].Name (String, originator name)
          statusLabel/isActive ← Data.DirectDebit[].DirectDebitStatusCode (String, ExternalMandateStatus1Code: Active/Inactive)
          amountLabel ← Data.DirectDebit[].PreviousPaymentAmount.Amount (String) + .PreviousPaymentAmount.Currency (String)
          nextCollectionLabel ← derived from Data.DirectDebit[].PreviousPaymentDateTime + Frequency (OBIE exposes no NextPaymentDateTime for DDs)
  content_type:
    name: DirectDebitsContent
    fields:
      - { name: mandates, type: "List<DirectDebitRow>" }
      - { name: activeCount, type: Int }
      - { name: cancelDialogFor, type: "DirectDebitRow?", note: "OBP legacy; cancel UNSUPPORTED under OBIE — no API binding" }
  model_type:
    name: DirectDebitMandate
    note: "Built from OBIE Data.DirectDebit[] (get_account_direct_debits, OBReadDirectDebit2). Status from DirectDebitStatusCode. Cancel is UNSUPPORTED — OBIE has no cancel-direct-debit endpoint."
  supporting_types:
    - name: DirectDebitRow
      fields:
        - { name: id, type: String }
        - { name: merchantName, type: String }
        - { name: amountLabel, type: String }
        - { name: nextCollectionLabel, type: String }
        - { name: referenceLabel, type: String }
        - { name: statusLabel, type: String }
        - { name: isActive, type: Boolean }
        - { name: mandateReference, type: String }
  methods:
    - onRetry
    - onCancelRequested
    - onCancelDismissed
    - onCancelConfirmed
  di:
    - DirectDebitsRepository
    - AccountsRepository
    - UserPreferencesRepository

api:
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/direct-debits"
    id: get_account_direct_debits
    note: >
      HSBC OBIE AISP read endpoint (OBReadDirectDebit2). Lists the direct-debit mandates on the
      selected AccountId — READ-ONLY. Requires an authorised account-access consent with
      ReadDirectDebits permission. See api.yaml.
    tag: Direct-Debits
    unsupported_note: >
      Cancel is UNSUPPORTED under OBIE — there is no cancel-direct-debit endpoint (no OBIE DELETE,
      no DD mutation). The OBP build's local-only cancel has no OBIE binding; the cancel icon +
      confirm dialog are retained in layout but marked unsupported. See api.yaml#unsupported_actions.

dependencies:
  tier: feature
  features:
    - accounts
    - transactions

navigation:
  - action: navigate
    target: direct-debit-detail
    description: "Open mandate detail for the tapped mandate (passes bankId/accountId/mandateId)"
  - action: navigate_back
    target: accounts
    description: "Back to the previous screen"
