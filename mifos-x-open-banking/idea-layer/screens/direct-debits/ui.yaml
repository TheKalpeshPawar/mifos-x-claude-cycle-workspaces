states:
  loading:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
      show_skeleton_list: true
      skeleton_count: 2
  content:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
        - active_count_chip
        - direct_debit_council_tax
        - council_tax_header_row
        - council_tax_payee
        - council_tax_active_badge
        - council_tax_amount_row
        - council_tax_amount
        - council_tax_next_date
        - direct_debit_broadband
        - broadband_header_row
        - broadband_payee
        - broadband_active_badge
        - broadband_amount_row
        - broadband_amount
        - broadband_next_date
        - setup_direct_debit_fab
  empty:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
        - setup_direct_debit_fab
      show_empty_state: true
      empty_state_icon: account_balance_wallet
      empty_state_title: "No direct debits set up"
      empty_state_message: "Authorise merchants to collect payments automatically on agreed dates"
  error:
    layout:
      visible_components:
        - title_count_row
        - direct_debits_title
        - setup_direct_debit_fab
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load direct debits"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: DirectDebitsViewModel
  state_fields:
    - name: directDebits
      type: "List<DirectDebit>"
      default: "emptyList()"
    - name: activeCount
      type: Int
      default: 0
    - name: uiState
      type: DirectDebitsUiState
      default: Loading
    - name: error
      type: "UiError?"
      default: "null"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load direct debits. Please try again."
    - field: create
      code: CREATE_FAILED
      message: "Could not set up direct debit. Please try again."
  events:
    - DirectDebitsLoaded
    - ViewDirectDebitClicked
    - SetUpDirectDebitClicked
    - RefreshTriggered
    - RetryLoad
  actions:
    - view_direct_debit
    - setup_direct_debit
    - open_direct_debit_options
  di:
    - DirectDebitRepository
    - AccountRepository

api:
  - id: obp_create_direct_debit
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/direct-debit"
    tag: Direct-Debit
    description: "Create direct debit mandate"
    request:
      fields:
        - name: start_date
          type: String
        - name: end_date
          type: String
        - name: to
          type: DirectDebitCounterparty
        - name: amount_value
          type: String
        - name: amount_currency
          type: String
    response:
      fields:
        - name: direct_debit_id
          type: String
        - name: bank_id
          type: String
        - name: account_id
          type: String
        - name: counterparty_id
          type: String
        - name: amount_value
          type: String
        - name: amount_currency
          type: String
        - name: start_date
          type: String
        - name: end_date
          type: String
        - name: active
          type: Boolean
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries

navigation:
  - action: view_direct_debit
    target: ""
    description: "Open direct debit detail sheet"
  - action: setup_direct_debit
    target: ""
    description: "Open new direct debit setup sheet"
  - action: navigate_back
    target: accounts
    description: "Return to accounts screen"
