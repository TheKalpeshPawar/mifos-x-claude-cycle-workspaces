id: direct-debits
name: Direct Debits
feature: direct-debits
flavor: consumer
status: designed
quality_score: 78
status_history:
  - status: draft
    timestamp: "2026-05-25T00:00:00Z"
  - status: enriched
    timestamp: "2026-05-25T00:00:00Z"
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]

shell:
  top_app_bar:
    show: true
    title: "Direct Debits"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: more_vert
        action: open_direct_debit_options
        label: "More options"
