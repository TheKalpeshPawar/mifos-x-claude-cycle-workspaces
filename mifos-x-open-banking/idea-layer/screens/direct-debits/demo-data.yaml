sibling: demo-data
schema_version: "4.0"
feature_id: direct-debits

# Realistic OBReadDirectDebit2 returned by
# GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/direct-debits on the HSBC UK sandbox.
# READ-ONLY mandate list — OBIE has no create/cancel direct-debit endpoint (merchant-initiated).
# Real-looking UK billers; DirectDebitStatusCode is ExternalMandateStatus1Code (Active/Inactive);
# Frequency uses the UK.OBIE.* vocabulary; PreviousPaymentAmount is OBActiveOrHistoricCurrencyAndAmount.
collections:
  account_direct_debits:
    dto: OBReadDirectDebit2
    description: "200 OK — direct-debit mandates on the authorised current account, each with originator name, status, frequency and last payment."
    item:
