sibling: data-flow
schema_version: "4.0"
feature_id: direct-debits
entries:
  - screen_id: direct-debits
    trigger: on_mount
    endpoints:
      - get_account_direct_debits
    direction: read
    consent_required: true
    dtos:
      - name: OBReadDirectDebit2
        role: response
        api_id: get_account_direct_debits
    produces_state: content
    notes: >-
      Reads GET /aisp/accounts/{AccountId}/direct-debits (OBIE AISP). READ-ONLY: OBIE has
      no create or cancel direct-debit endpoint — direct debits are merchant-initiated.
      Requires an authorised account-access-consent (ReadDirectDebits) + authorization-code token.
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 429
        behavior: error_state
      - error_code: 500
        behavior: error_state

  - screen_id: direct-debits
    trigger: on_interact
    event: RetryLoad
    endpoints:
      - get_account_direct_debits
    direction: read
    consent_required: true
    dtos:
      - name: OBReadDirectDebit2
        role: response
        api_id: get_account_direct_debits
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: direct-debits
    trigger: on_interact
    event: ViewDirectDebitClicked
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: "Navigates to direct-debit-detail with the selected DirectDebitId. No API call."

  - screen_id: direct-debits
    trigger: on_interact
    event: CancelDirectDebitClicked
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
    notes: >-
      UNSUPPORTED on OBIE — no cancel-direct-debit endpoint exists in OBIE AISP.
      Direct debits are merchant-initiated and cancellation is out of band.
      The cancel affordance is hidden or surfaces an out-of-band guidance message.
