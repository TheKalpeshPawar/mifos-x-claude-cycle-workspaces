sibling: api
schema_version: "4.0"
feature_id: direct-debits
notes: >
  Reconciled to shipped source 2026-06-11. OBP exposes NO read/cancel endpoint for direct
  debits (only POST-create exists at any API version, live-verified 404). Mandates are
  therefore DERIVED in DirectDebitsRepository.listMandates(): it reads the account's
  transaction history (TXN_TYPE=DD attribute, grouped by description into collection series),
  then overlays locally-recorded cancellations from the Room JSON cache. There is no GET to
  document, and cancellation is local-only (no server DELETE).
api: []

derived_reads:
  - id: derive_direct_debits_from_history
    source: "TransactionsRepository.listTransactionsWithAttributes(bankId, accountId)"
    filter: "TXN_TYPE=DD"
    grouping: "by description into collection series"
    output_dto: "List<DirectDebitMandate>"
    note: >
      Replaces the non-existent GET-list endpoint (DirectDebitsRepository.listMandates).
      Each mandate carries merchant, amount, derived next-collection date and a stable
      DD-{initials}-{first collection yyyyMMdd} reference. Mandates whose id is in the local
      cancelled set render as CANCELLED with a cleared next-collection date.

local_mutations:
  - id: cancel_direct_debit_local
    source: "DirectDebitsRepository.cancel(accountId, mandateId)"
    note: >
      OBP has no cancel endpoint, so cancellation is recorded LOCALLY (the mandate id is
      appended to the per-account cancelled set in the Room JSON cache) and the list is
      re-projected — the mandate flips to CANCELLED and the active count drops. Persists
      across restarts; never reaches the server.

deferred:
  note: >
    GET list / GET detail / DELETE cancel were specified in the original design but DO NOT
    EXIST on OBP. The Set-Up Direct Debit create flow was also dropped — direct debits are
    merchant-initiated, so the consumer surface can only view + cancel. Re-add a server cancel
    only if OBP ships a DELETE endpoint.
