sibling: api
schema_version: "4.0"
feature_id: direct-debits
notes: >
  Rebound to HSBC OBIE AISP v4.0 (2026-06-11). Unlike OBP (no read endpoint — mandates were
  derived from transaction history), OBIE exposes a real READ endpoint: get_account_direct_debits.
  This screen is READ-ONLY: it lists the direct-debit mandates on the selected AccountId. OBIE
  provides NO cancel-direct-debit endpoint (and no create — direct debits are merchant-initiated),
  so the cancel affordance is UNSUPPORTED/removed (see unsupported_actions). Reads require an
  authorised account-access consent (ReadDirectDebits permission) and an authorization-code token.
api:
  - id: get_account_direct_debits
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/direct-debits"
    tag: Direct-Debits
    trigger: on_mount
    note: >
      OBIE object OBReadDirectDebit2 (HTTP 200). Requires ReadDirectDebits and an
      account-access-consent in AUTH status. Authorization-code token. Multiple mandates may
      return per account. The AccountId comes from the prior get_accounts call.
    request:
      dto: none
      fields: []
    response:
      dto: OBReadDirectDebit2
      fields:
        - name: Data.DirectDebit[].AccountId
          type: String
        - name: Data.DirectDebit[].DirectDebitId
          type: "String?"
        - name: Data.DirectDebit[].MandateIdentification
          type: "String?"
        - name: Data.DirectDebit[].DirectDebitStatusCode
          type: "String?"
        - name: Data.DirectDebit[].Name
          type: String
        - name: Data.DirectDebit[].PreviousPaymentDateTime
          type: "String?"
        - name: Data.DirectDebit[].Frequency
          type: "String?"
        - name: Data.DirectDebit[].PreviousPaymentAmount.Amount
          type: "String?"
        - name: Data.DirectDebit[].PreviousPaymentAmount.Currency
          type: "String?"
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus (e.g. missing ReadDirectDebits)"
      - code: 429
        message: "TOO_MANY_REQUESTS"
      - code: 500
        message: "OB.UnexpectedError"

consent_dependency:
  note: >
    The GET requires an authorised account-access-consent (Status AUTH) carrying ReadDirectDebits,
    plus an authorization-code scoped token. The AccountId is obtained from get_accounts.
    See server/apis/ais.yaml.

unsupported_actions:
  cancel_direct_debit:
    status: UNSUPPORTED
    note: >
      OBIE provides NO cancel-direct-debit endpoint (the OBIE AISP API is read-only; there is no
      DELETE on direct-debit mandates and no DD mutation in PISP either — direct debits are
      cancelled via the merchant or the bank's own channels). The OBP build recorded cancellation
      LOCALLY; under OBIE that affordance has no API binding and is removed. Surface the mandate as
      view-only.
  create_direct_debit:
    status: UNSUPPORTED
    note: "Direct debits are merchant-initiated — no consumer create endpoint in OBIE."
