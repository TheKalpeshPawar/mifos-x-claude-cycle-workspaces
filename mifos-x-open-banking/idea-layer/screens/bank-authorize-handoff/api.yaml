sibling: api
schema_version: "4.0"
feature_id: bank-authorize-handoff
api:
  - id: obie_authorize_redirect
    endpoint: "GET https://sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/authorize"
    tag: Authentication
    trigger: on_handoff_entered
    description: "PSU authorisation redirect (FAPI 1.0 Advanced Hybrid flow). EXTERNAL to the app — opened in the system browser / Custom Tab on the per-brand authorize host (sandbox.ob.*, no secure. prefix). Carries a signed request-object JWT embedding openbanking_intent_id = ConsentId; response_type 'code id_token'; PKCE as code_challenge + code_challenge_method S256. The PSU logs in and completes SCA at HSBC, then is redirected to redirect_uri with code + id_token + state. SHARED by AIS account-access-consent and PISP payment-consent — only the consent endpoint that produced the intent_id and the scope differ."
    auth_required: false
    request:
      params:
        response_type: "code id_token"
        client_id: "{hsbc_client_id}"
        redirect_uri: "org.mifos.openbanking://oauth/callback"
        scope: "openid accounts"
        state: "{csrf_state}"
        nonce: "{oidc_nonce}"
        request: "{signed_request_object_jwt}"
        code_challenge: "{pkce_code_challenge}"
        code_challenge_method: "S256"
    response:
      redirect_params:
        - name: code
          type: String
          note: "Authorization Code on the redirect query string (~30s lifetime); exchanged at auth-callback."
        - name: id_token
          type: String
          note: "Hybrid-flow ID token returned alongside code; carries refresh_token_expires_at and PSU/consent binding claims."
        - name: state
          type: String
          note: "Echo of the request state value — verified against csrf_state on return."
    errors:
      - code: 302
        name: AUTHORIZATION_FAILED
        ui_message: "We couldn't open HSBC's secure sign-in. Please check your connection and try again."
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "Something went wrong preparing your secure sign-in. Please try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "Your session could not be verified. Please try again."

  - id: obie_stage_account_access_consent
    endpoint: "POST https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/account-access-consents"
    tag: Authentication
    trigger: on_handoff_entered_ais
    description: "Stages the AIS account-access-consent (status AWAU) before the authorise redirect, using a client_credentials Bearer token. The returned ConsentId becomes the openbanking_intent_id embedded in the signed authorise request object. AIS context only."
    request:
      headers:
        Authorization: "Bearer {cc_access_token}"
        x-fapi-financial-id: "{hsbc_financial_id}"
      content_type: "application/json"
    response:
      fields:
        - name: ConsentId
          type: String
          stored_as: consent_id
        - name: Status
          type: String
          example: "AwaitingAuthorisation"
    errors:
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "Something went wrong preparing your secure sign-in. Please try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "Your session could not be verified. Please try again."

  - id: obie_get_cc_token
    endpoint: "POST https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/token"
    tag: Authentication
    trigger: before_consent_staging
    description: "Client-credentials token (grant_type=client_credentials) used to stage the consent in TPP-only context. Form-encoded; authenticated with a PS256 client-assertion JWT (private_key_jwt) over mTLS."
    request:
      content_type: "application/x-www-form-urlencoded"
      fields:
        - name: grant_type
          type: String
          value: "client_credentials"
        - name: scope
          type: String
          value: "accounts"
        - name: client_assertion_type
          type: String
          value: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
        - name: client_assertion
          type: String
          source: ps256_client_assertion_jwt
    response:
      fields:
        - name: access_token
          type: String
          stored_as: cc_access_token
        - name: token_type
          type: String
          example: "Bearer"
        - name: expires_in
          type: Int
    errors:
      - code: 400
        name: INVALID_REQUEST
        ui_message: "Something went wrong preparing your secure sign-in. Please try again."
      - code: 401
        name: INVALID_CLIENT
        ui_message: "Your session could not be verified. Please try again."
