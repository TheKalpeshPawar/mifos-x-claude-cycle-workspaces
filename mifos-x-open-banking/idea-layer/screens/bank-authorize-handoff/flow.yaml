sibling: flow
schema_version: "4.0"
feature_id: bank-authorize-handoff
flow_ids:
  - account-access-consent
  - payment-initiation
navigates_to:
  - auth-callback
  - consent-request
flow_logic:
  - from: consent-request
    to: bank-authorize-handoff
    type: push
    label: "Grant — stage consent (AWAU) + build signed authorise request"
  - from: send-money-confirm
    to: bank-authorize-handoff
    type: push
    label: "Confirm — stage payment-consent (AWAU) + build signed authorise request"
  - from: bank-authorize-handoff
    to: auth-callback
    type: external_redirect
    label: "PSU authenticates + completes SCA at HSBC → deep-link returns code"
  - from: bank-authorize-handoff
    to: consent-request
    type: pop
    label: "Cancel"
journey_ids:
  - consumer-account-access-consent
  - consumer-payment-initiation
