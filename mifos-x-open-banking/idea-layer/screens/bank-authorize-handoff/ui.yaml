sibling: ui
feature_id: bank-authorize-handoff
id: bank-authorize-handoff
name: "Redirecting to HSBC"
feature: account-access-consent
flavor: consumer
status: enriched
quality_score: 94
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-OBIE-AUTH-HANDOFF, FR-001]
status_history:
  - status: draft
    at: "2026-06-11"
    by: "/idea-add (manual draft authoring)"
    note: "Full-screen takeover authored for the OBIE redirect handoff. Shown while the app stages the account-access-consent (or payment-consent), builds the signed authorise request object, and opens the system browser / Custom Tab to HSBC. The PSU authenticates + completes SCA at HSBC, not in-app. Modelled on login/ui.yaml's oauth_redirecting takeover state. Awaiting /idea-enrich."
  - status: enriched
    at: "2026-06-12"
    by: "/idea-enrich"
    note: "Enriched the transitional handoff takeover. Reconciled states to the canonical [preparing, redirecting, error] set (idea-plan §10). preparing = building PKCE S256 + signed request object; redirecting = launching the external authorise URL with a 'Continue to HSBC' manual-launch fallback; error = could-not-start with retry/cancel. The redirect leaves the app (Custom Tab / external browser) and returns via deep-link org.mifos.openbanking://oauth/callback handled by auth-callback (external_redirect edge, not an imperative navigate). NO password/SCA is collected in-app. Added per-state layout blocks, route block, full state_model, dependencies, screens list. Cancel routes to consent-declined per the authoritative handoff."

screens:
  - id: bank-authorize-handoff
    name: "Redirecting to HSBC"
    viewmodel: "BankAuthorizeHandoffViewModel"
    description: "Transitional full-screen takeover that prepares the signed OAuth2 authorise request and launches the redirect to HSBC. Reassurance + security explainer + launch — not a form. PSU authenticates and completes SCA at HSBC."
    states_handled: [preparing, redirecting, error]

archetype: loading

route:
  name: BankAuthorizeHandoffRoute
  params:
    consentId:
      type: String
      required: true
      note: "The account-access (or payment) ConsentId staged by consent-request / send-money-confirm. Becomes openbanking_intent_id inside the signed request object."
    consentContext:
      type: String
      required: false
      note: "AIS | PAYMENT — resolved from the originating flow; carried through to auth-callback so it can route to home vs payment-result."

components:
  - type: stack
    id: handoff_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
      align: center
      justify: center
    a11y:
      role: region
      label: "Securely connecting to HSBC"
    test_context:
      purpose: "Root vertical takeover container that centres the handoff content"
      interaction_type: display
      data_driven: false
    children:
      - handoff_bank_icon
      - handoff_title
      - handoff_message
      - handoff_spinner
      - handoff_continue_button
      - handoff_security_note
      - handoff_error_card
      - handoff_retry_button
      - handoff_cancel_link

  - type: icon
    id: handoff_bank_icon
    content: "account_balance"
    variant: default
    style:
      color: "#4C662B"
      size: "80dp"
      alignment: center
    a11y:
      role: image
      contentDescription: "HSBC bank"
      label: "HSBC"
    test_context:
      purpose: "Bank icon shown at the top of the full-screen authorise handoff takeover"
      interaction_type: display
      data_driven: false

  - type: text
    id: handoff_title
    content: "Getting ready to connect securely"
    variant: headline_small
    style:
      typography: "Outfit/headline_small"
      color: "#1A1C16"
      alignment: center
      padding_top: spacing.lg
    a11y:
      role: heading
      level: 1
      contentDescription: "Getting ready to connect securely"
      label: "Getting ready to connect securely"
    test_context:
      purpose: "Primary heading of the handoff takeover. Reads 'Getting ready to connect securely' while preparing, switches to 'Taking you to HSBC' while redirecting."
      interaction_type: display
      data_driven: true

  - type: text
    id: handoff_message
    content: "You'll sign in directly with HSBC to approve access. Your username, password and security codes are never entered in this app — and you'll come straight back here once you've approved."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: text
      contentDescription: "You will sign in directly with HSBC to approve access. Your username, password and security codes are never entered in this app, and you will come straight back here once you have approved."
      label: "Explains that sign-in and approval happen at HSBC, never in this app"
    test_context:
      purpose: "Security explainer — authentication and SCA happen at HSBC, the app never sees credentials, and the PSU returns after approving"
      interaction_type: display
      data_driven: false

  - type: loading_indicator
    id: handoff_spinner
    variant: circular_indeterminate
    style:
      color: "#4C662B"
      size: "32dp"
      alignment: center
      padding_top: spacing.lg
    a11y:
      role: progressbar
      contentDescription: "Preparing your secure connection"
      label: "Preparing secure redirect"
    test_context:
      purpose: "Indeterminate spinner shown while the PKCE challenge and signed request object are built and the browser opens"
      interaction_type: display
      data_driven: false

  - type: button
    id: handoff_continue_button
    label: "Continue to HSBC"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled, loading]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
      width: "match_parent"
    visible_when: "uiState.phase == OPENING_BROWSER"
    on_click:
      action: launch_external
      target: auth-callback
      params:
        url: "{authorizeUrl}"
    a11y:
      role: button
      contentDescription: "Continue to HSBC to sign in and approve"
      label: "Continue to HSBC to sign in and approve"
    keyboard:
      focusable: true
    test_context:
      purpose: "Manual-launch fallback for the redirecting state — re-opens the external HSBC authorise URL in a Custom Tab if the auto-launch was blocked or dismissed. Leaves the app; the deep-link return lands on auth-callback."
      interaction_type: action
      data_driven: true

  - type: text
    id: handoff_security_note
    content: "Encrypted connection · You can return here anytime"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#74796D"
      alignment: center
      padding_top: spacing.md
    a11y:
      role: text
      contentDescription: "Encrypted connection. You can return to this app at any time."
      label: "Encrypted connection. You can return to this app at any time."
    test_context:
      purpose: "Reassurance caption beneath the spinner / continue button"
      interaction_type: display
      data_driven: false

  - type: card
    id: handoff_error_card
    variant: filled
    style:
      background: "#FFDAD6"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
    visible_when: "uiState.phase == ERROR"
    a11y:
      role: alert
      label: "Could not start authorisation"
    test_context:
      purpose: "Failure card shown when the consent could not be staged or the signed authorise request could not be built / launched"
      interaction_type: display
      data_driven: false
    children:
      - handoff_error_icon
      - handoff_error_message

  - type: icon
    id: handoff_error_icon
    content: "error"
    variant: default
    style:
      color: "#BA1A1A"
      size: "20dp"
    a11y:
      role: image
      contentDescription: "Error"
      label: "Error"
    test_context:
      purpose: "Error icon in the failure card when the authorise request cannot be built or the browser cannot be opened"
      interaction_type: display
      data_driven: false

  - type: text
    id: handoff_error_message
    content: "We couldn't start your secure sign-in with HSBC. Please check your connection and try again."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#410002"
      padding_start: spacing.sm
    a11y:
      role: alert
      contentDescription: "We couldn't start your secure sign-in with HSBC. Please check your connection and try again."
      label: "Redirect error message"
    test_context:
      purpose: "Error copy shown when consent staging or authorise-request building fails (network / 400 OB.Field.Invalid / request-object signing failure)"
      interaction_type: display
      data_driven: true

  - type: button
    id: handoff_retry_button
    label: "Try again"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
      width: "match_parent"
    visible_when: "uiState.phase == ERROR"
    on_click:
      action: retry
      target: bank-authorize-handoff
    a11y:
      role: button
      contentDescription: "Retry the secure redirect to HSBC"
      label: "Retry the secure redirect to HSBC"
    keyboard:
      focusable: true
    test_context:
      purpose: "Re-stages the consent and re-builds the HSBC authorise redirect after a failure (returns the screen to the preparing state)"
      interaction_type: action
      data_driven: false

  - type: button
    id: handoff_cancel_link
    label: "Cancel"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      typography: "Outfit/label_large"
      color: "#386663"
      alignment: center
      min_height: 44
      padding_vertical: spacing.sm
    visible_when: "uiState.phase == ERROR"
    on_click:
      action: navigate
      target: consent-declined
    a11y:
      role: button
      contentDescription: "Cancel connecting and see what to do next"
      label: "Cancel the secure redirect"
    keyboard:
      focusable: true
    test_context:
      purpose: "Aborts the handoff. Routes to consent-declined (the shared not-connected recovery screen) where the PSU can try again or back out."
      interaction_type: navigate
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: preparing
  preparing:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [handoff_bank_icon, handoff_title, handoff_message, handoff_spinner, handoff_security_note]
    overrides:
      handoff_title: { content: "Getting ready to connect securely" }
    note: "Full-screen takeover, first phase. The app stages the consent (POST account-access-consents / domestic-payment-consents → status AWAU), generates the PKCE code_verifier + S256 code_challenge, and builds + signs the authorise request-object JWT (openbanking_intent_id = ConsentId, PS256). Spinner runs; no user action required."
  redirecting:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [handoff_bank_icon, handoff_title, handoff_message, handoff_continue_button, handoff_security_note]
    overrides:
      handoff_title: { content: "Taking you to HSBC to sign in and approve" }
    note: "Second phase. The signed authorise URL is ready; the host opens it in the system browser / Custom Tab (auto-launch). 'Continue to HSBC' is the manual fallback if the auto-launch is blocked. The external redirect leaves the app at the end of this state; on return the deep-link lands on auth-callback. Sample masked authorise URL host: https://sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/authorize?... (intent_id = a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6)."
  error:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [handoff_bank_icon, handoff_title, handoff_error_card, handoff_retry_button, handoff_cancel_link]
    overrides:
      handoff_title: { content: "We couldn't start your secure sign-in" }
    note: "Consent staging or authorise-request building/launch failed (network / 400 OB.Field.Invalid / request-object signing error / no available browser). Offers retry (re-prepare) or cancel to consent-declined."

state_model:
  BankAuthorizeHandoffViewModel:
    screen_state: BankAuthorizeHandoffUiState
    state:
      - field: phase
        type: "HandoffPhase"
        default: "HandoffPhase.STAGING"
        note: "enum HandoffPhase { STAGING, BUILDING_REQUEST, OPENING_BROWSER, REDIRECTED, ERROR }. STAGING/BUILDING_REQUEST render the 'preparing' state; OPENING_BROWSER/REDIRECTED render 'redirecting'; ERROR renders 'error'. PKCE code_verifier / CSRF state / consentId live inside ObpAuthRepository, NOT in UI state."
      - field: consentContext
        type: "ConsentContext"
        default: "ConsentContext.AIS"
        note: "enum ConsentContext { AIS, PAYMENT } — passed through to auth-callback so the callback can route to home vs payment-result. Resolved from the originating flow / route param."
      - field: authorizeUrl
        type: "String?"
        default: "null"
        note: "The fully-built external HSBC authorise URL, set once BUILDING_REQUEST completes; consumed by the LaunchAuthorize event and the 'Continue to HSBC' manual fallback."
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isError
        type: Boolean
        default: "false"
    errors:
      name: BankAuthorizeHandoffError
      types:
        - { type: BadRequest, retry: true, message_key: error_authorize_bad_request }
        - { type: RequestTimeout, retry: true, message_key: error_network }
        - { type: SigningFailed, retry: true, message_key: error_authorize_signing }
        - { type: BrowserUnavailable, retry: true, message_key: error_browser_unavailable }
        - { type: Unknown, retry: true, message_key: error_unknown }
    events:
      name: BankAuthorizeHandoffEvent
      members:
        - "LaunchAuthorize(authorizeUrl: String)"
        - NavigateToConsentDeclined
    actions:
      name: BankAuthorizeHandoffAction
      members:
        - { name: RetryClicked, trigger: "Tap Try again in the error state" }
        - { name: CancelClicked, trigger: "Tap Cancel in the error state" }
        - { name: ContinueClicked, trigger: "Tap Continue to HSBC manual-launch fallback" }
        - { name: "Internal.ConsentStaged", params: { consentId: String }, trigger: "Consent reached AWAU" }
        - { name: "Internal.AuthorizeRequestBuilt", params: { authorizeUrl: String }, trigger: "Signed request object built" }
        - { name: "Internal.StagingFailed", params: { error: BankAuthorizeHandoffError }, trigger: "Staging or signing failed" }
    di: [ObpAuthRepository, OidcCallbackBus]
    base: "template.core.base.ui.viewmodel.BaseViewModel<BankAuthorizeHandoffUiState, BankAuthorizeHandoffEvent, BankAuthorizeHandoffAction>"
    note: "On entry the ViewModel asks ObpAuthRepository to stage the consent and build the signed authorise request, then emits LaunchAuthorize(authorizeUrl) as a one-shot event. The host opens the URL in a Custom Tab. The browser return is a deep-link handled by auth-callback — this screen does not navigate to home/payment-result itself."

navigation:
  - id: nav_to_auth_callback
    target: auth-callback
    trigger: external_redirect_return
    note: "The PSU authenticates + completes SCA at HSBC, then HSBC redirects to org.mifos.openbanking://oauth/callback. The deep-link is received by auth-callback, NOT this screen. This is an external_redirect edge, not an imperative navigate. The 'Continue to HSBC' button (launch_external) re-launches the same external authorize URL that ultimately returns here."
  - id: nav_to_consent_declined
    target: consent-declined
    trigger: cancel_click
    on_click:
      action: navigate
      target: consent-declined

api:
  - id: obie_authorize_redirect
    endpoint: "GET https://sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/authorize"
    tag: Authentication
    trigger: on_handoff_entered
    description: "PSU authorisation redirect (FAPI Hybrid). EXTERNAL to the app — opened in the system browser / Custom Tab, NOT a REST response this screen consumes. This screen CONSTRUCTS this request: it carries a signed request-object JWT embedding openbanking_intent_id = ConsentId, response_type 'code id_token', PKCE code_challenge + code_challenge_method S256, run over the per-brand authorize host (sandbox.ob.hsbc.co.uk, no secure. prefix). PSU authenticates + completes SCA at HSBC, then is redirected to redirect_uri with code + id_token + state. The redirect return is handled by auth-callback."
    request:
      params:
        response_type: "code id_token"
        client_id: "{hsbc_client_id}"
        redirect_uri: "org.mifos.openbanking://oauth/callback"
        scope: "openid accounts"
        state: "{csrf_state}"
        nonce: "{oidc_nonce}"
        request: "{signed_request_object_jwt}"
        code_challenge: "{pkce_code_challenge}"
        code_challenge_method: "S256"
    response:
      redirect_params:
        - name: code
          type: String
        - name: id_token
          type: String
        - name: state
          type: String
    errors:
      - code: 302
        name: AUTHORIZATION_FAILED
        ui_message: "We couldn't start your secure sign-in with HSBC. Please check your connection and try again."
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "Something went wrong preparing your secure sign-in. Please try again."

dependencies:
  tier: feature
  features:
    - feature: shared-core
      type: data
      required: true
    - feature: obp-auth
      type: auth
      required: true
      check: "feature/consent/ ObpAuthRepository exists"
    - feature: account-access-consent
      type: data
      required: true
  services: [ObpAuthRepository, OidcCallbackBus]
  shared_entities: [Consent]
