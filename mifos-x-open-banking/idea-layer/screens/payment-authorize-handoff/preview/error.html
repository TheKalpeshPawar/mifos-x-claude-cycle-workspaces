<!doctype html>
<!-- render-hash: pah-error-obie01 -->
<html lang="en" data-screen="payment-authorize-handoff" data-state="error" data-feature="payment-authorize-handoff" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Couldn't start authorisation</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--error:#BA1A1A;--error-container:#FFDAD6;--on-error-container:#410002}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);min-height:100vh}main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.err-icon{font-size:80px;color:var(--error);margin-bottom:8px}
.title{font-size:24px;font-weight:600;line-height:1.25;max-width:320px;margin-top:12px}
.assurance{font-size:14px;font-weight:600;color:var(--secondary);margin-top:10px}
.err-card{background:var(--surface);border:1px solid var(--error-container);border-radius:16px;padding:16px 18px;margin-top:20px;width:100%;max-width:340px;display:flex;align-items:flex-start;gap:10px;text-align:left}.err-card .material-symbols-outlined{font-size:20px;color:var(--error);flex-shrink:0}.err-card .ct{font-size:13px;color:var(--on-surface-variant);line-height:1.5}
.btn{height:52px;border-radius:999px;background:var(--primary);color:var(--on-primary);border:none;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:24px;width:100%;max-width:340px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn .material-symbols-outlined{font-size:20px}
.cancel{background:transparent;border:none;color:var(--on-surface-variant);font-family:inherit;font-size:15px;font-weight:600;margin-top:12px;cursor:pointer;height:44px}
[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6}}</style>
</head>
<body><main>
<span class="material-icons err-icon" aria-hidden="true">error_outline</span>
<div class="title">Couldn't start authorisation</div>
<div class="assurance">No money has left your account.</div>
<div class="err-card"><span class="material-symbols-outlined">info</span><span class="ct">We couldn't reach HSBC to set up this payment. This can happen with a poor connection. You can try again, or cancel and come back later.</span></div>
<button class="btn" data-action="retry" tabindex="0"><span class="material-symbols-outlined">refresh</span>Try again</button>
<button class="cancel" data-nav-to="payment-declined" data-action="cancel" tabindex="0">Cancel payment</button>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
