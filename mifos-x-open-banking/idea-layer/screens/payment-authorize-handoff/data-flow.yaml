sibling: data-flow
schema_version: "4.0"
feature_id: payment-authorize-handoff
entries:
  - screen_id: payment-authorize-handoff
    trigger: on_mount
    event: StageDomesticPaymentConsent
    endpoints:
      - create_domestic_payment_consent
    direction: write
    consent_required: false
    dtos:
      - name: OBWriteDomesticConsent4
        role: request
        api_id: create_domestic_payment_consent
      - name: OBWriteDomesticConsentResponse5
        role: response
        api_id: create_domestic_payment_consent
    produces_state: loading
    notes: >-
      Step 1 on mount: POSTs POST /pisp/domestic-payment-consents with the reviewed
      Initiation block (InstructedAmount, CreditorAccount, RemittanceInformation) + Risk.
      Client Credentials grant. Returns Data.ConsentId + Status AWAU. The ConsentId
      becomes the openbanking_intent_id for the payment authorise redirect.
    error_paths:
      - error_code: 400
        behavior: navigate_payment_declined
      - error_code: 401
        behavior: navigate_payment_declined
      - error_code: 429
        behavior: show_error_state
      - error_code: 500
        behavior: navigate_payment_declined

  - screen_id: payment-authorize-handoff
    trigger: on_mount
    event: OpenPaymentAuthorizeRedirect
    endpoints:
      - oauth2_authorize
    direction: none
    consent_required: false
    dtos: []
    produces_state: loading
    notes: >-
      Step 2: opens system browser to the OBIE authorize endpoint with signed request-object
      JWT, openbanking_intent_id=payment ConsentId, scope "openid payments". PSU authenticates
      and completes SCA at HSBC. On success the deep-link org.mifos.openbanking://oauth/callback
      delivers code + state to auth-callback, which exchanges the token and submits
      POST /pisp/domestic-payments. On PSU decline, error param on redirect routes to
      payment-declined via auth-callback.
    error_paths:
      - error_code: 302
        behavior: navigate_payment_declined
