sibling: flow
schema_version: "4.0"
feature_id: payment-authorize-handoff
flow_ids:
  - payment-initiation
navigates_to:
  - auth-callback
  - payment-declined
flow_logic:
  - decision: "Payment consent staged + signed authorise request built?"
    condition: "uiState.phase == HandoffPhase.OPENING_BROWSER && authorizeUrl != null"
    true_path: auth-callback
    false_path: payment-authorize-handoff
    impl: "PaymentAuthorizeHandoffViewModel:stageConsentAndBuildAuthorize()"
  - decision: "Consent staging or authorise-request build failed?"
    condition: "uiState.phase == HandoffPhase.ERROR"
    true_path: payment-declined
    false_path: auth-callback
    impl: "PaymentAuthorizeHandoffViewModel:onCancelClicked()"
journey_ids:
  - consumer-accounts-payments
