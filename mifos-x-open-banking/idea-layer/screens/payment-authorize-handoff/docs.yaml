status_history:
  - to: draft
    at: "2026-06-11"
    by: "/idea add (OBIE PISP migration)"
    note: >-
      New screen for the HSBC Open Banking PISP payment journey. Full-screen
      takeover shown after the user confirms a payment on send-money-confirm.
      Behind it the app has POSTed /pisp/domestic-payment-consents (ConsentId,
      Status AWAU) and built the signed authorise request (intent_id = payment
      ConsentId). SCA is performed AT HSBC during the authorise redirect — the
      obsolete in-app sca-challenge one-time-code screen is REMOVED under OBIE.
      On external_redirect the system browser opens GET /oauth2/authorize; the
      deep-link org.mifos.openbanking://oauth/callback returns to auth-callback.
  - to: enriched
    at: "2026-06-12"
    by: "/idea-enrich"
    note: >-
      Enriched the PISP payment-authorise handoff takeover, kept visually
      consistent with its AIS sibling bank-authorize-handoff. Reconciled the
      archetype to 'loading' and the state set to [preparing, redirecting,
      error]. preparing = staging the payment consent (AWAU) + building PKCE
      S256 + signed request object (intent_id = payment ConsentId,
      scope=payments); redirecting = launching the external authorise URL with a
      'Continue to HSBC' manual fallback; error = couldn't-start with retry +
      cancel. Restates amount (£250.00) + payee (Jordan Avery). Added route,
      per-state layouts, full state_model, dependencies, screens list. Cancel
      routes to payment-declined; SCA is never collected in-app.
  - to: designed
    at: "2026-06-14"
    by: "/idea export"
    note: "Exported SPEC.md, API.md, MOCKUP.md, PROMPTS_FIGMA.md + per-state Stitch prompts; roundtrip verification passed (RULE-EXPORT-ROUNDTRIP-001)."
