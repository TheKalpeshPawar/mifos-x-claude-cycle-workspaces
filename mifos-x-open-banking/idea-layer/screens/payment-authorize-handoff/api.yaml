sibling: api
schema_version: "4.0"
feature_id: payment-authorize-handoff
name: "Securing Payment"
feature: payment-authorize-handoff
flavor: consumer
status: draft

api:
  - id: create_domestic_payment_consent
    endpoint: "POST /obie/open-banking/v4.0/pisp/domestic-payment-consents"
    api_group: pisp-domestic
    tag: PISP
    trigger: on_handoff_mount
    description: "Stages the domestic-payment-consent before the authorise redirect. ASPSP returns Data.ConsentId with default Data.Status AWAU (awaiting PSU authorisation). Client Credentials grant. The Initiation block staged here MUST byte-match the later create_domestic_payment submit. CE HSBCnet: POST /ce/obie/open-banking/v3.1/pisp/domestic-payment-consents."
    request:
      fields:
        - name: Data.Initiation.InstructionIdentification
          type: String
        - name: Data.Initiation.InstructedAmount.Amount
          type: String
        - name: Data.Initiation.InstructedAmount.Currency
          type: String
        - name: Data.Initiation.CreditorAccount.SchemeName
          type: String
        - name: Data.Initiation.CreditorAccount.Identification
          type: String
        - name: Data.Initiation.CreditorAccount.Name
          type: String
        - name: Data.Initiation.RemittanceInformation.Reference
          type: String
        - name: Risk.PaymentContextCode
          type: String
          example: "TransferToThirdParty"
    response:
      fields:
        - name: Data.ConsentId
          type: String
          stored_as: payment_consent_id
        - name: Data.Status
          type: String
          example: "AWAU"
        - name: Data.CreationDateTime
          type: String
    errors:
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "We couldn't reach HSBC to secure your payment. Your account hasn't been charged. Please try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "We couldn't authorise this payment session. Please sign in again and retry."
      - code: 429
        name: TOO_MANY_REQUESTS
        ui_message: "HSBC is busy right now. Please wait a moment and try again."
      - code: 500
        name: OB_UNEXPECTED_ERROR
        ui_message: "Something went wrong securing your payment. Your account hasn't been charged. Please try again."

  - id: oauth2_authorize
    endpoint: "GET https://sandbox.ob.hsbc.co.uk/oauth2/authorize"
    api_group: pisp-domestic
    tag: Authorization
    trigger: on_consent_created
    description: "Opens the system browser for the OBIE authorise redirect. authorization_code + PKCE with a signed request object; openbanking_intent_id = the payment ConsentId. PSU authenticates AND completes SCA at HSBC — no in-app code entry. On success HSBC redirects to the registered deep-link with code + state; on PSU decline / consent RJCT it returns an error param."
    request:
      params:
        response_type: "code id_token"
        client_id: "{client_id}"
        redirect_uri: "org.mifos.openbanking://oauth/callback"
        scope: "openid payments"
        state: "{csrf_state}"
        request: "{signed_request_object}"
        code_challenge: "{pkce_code_challenge}"
        code_challenge_method: "S256"
    response:
      redirect_params:
        - name: code
          type: String
        - name: id_token
          type: String
        - name: state
          type: String
        - name: error
          type: String
          note: "Present instead of code when the PSU declines or the consent is RJCT at the bank — drives navigation to payment-declined via auth-callback."
    errors:
      - code: 302
        name: PSU_DECLINED
        ui_message: "You didn't approve this payment at HSBC. No money has left your account."

note: "Two-step handoff. On mount the app stages the consent (create_domestic_payment_consent → ConsentId, Status AWAU) and then opens the external authorise browser (oauth2_authorize, intent_id = ConsentId). SCA is performed AT HSBC during the redirect — the in-app sca-challenge one-time-code screen is REMOVED under OBIE. The deep-link org.mifos.openbanking://oauth/callback returns the authorization code to auth-callback, which exchanges the token and submits /domestic-payments."
