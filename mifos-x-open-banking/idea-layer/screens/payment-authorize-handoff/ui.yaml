sibling: ui
feature_id: payment-authorize-handoff
id: payment-authorize-handoff
name: "Securing Payment"
feature: payment-authorize-handoff
flavor: consumer
status: enriched
quality_score: 94
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_api
tags: [FR-OBIE-PISP-AUTHORIZE, FR-OBIE-PAYMENT-CONSENT]
status_history:
  - status: draft
    at: "2026-06-11"
    by: "/idea add (OBIE PISP migration)"
    note: "New screen for the HSBC Open Banking PISP payment journey. Full-screen takeover shown after the user confirms a payment on send-money-confirm. The app has already POSTed /pisp/domestic-payment-consents (ConsentId, Status AWAU) and built the signed authorise request (intent_id = payment ConsentId); this screen holds the user while it hands off to HSBC. SCA is performed AT HSBC during the authorise redirect — the obsolete in-app sca-challenge one-time-code screen is REMOVED under OBIE. On external_redirect the system browser opens GET /oauth2/authorize; the deep-link org.mifos.openbanking://oauth/callback returns to auth-callback."
  - status: enriched
    at: "2026-06-12"
    by: "/idea-enrich"
    note: "Enriched the PISP payment-authorise handoff takeover, kept visually consistent with its AIS sibling bank-authorize-handoff. Reconciled the archetype to 'loading' (transitional handoff, not a form) and the state set to the canonical [preparing, redirecting, error]. preparing = staging the domestic-payment-consent (Status AWAU) + building PKCE S256 + signed request object (intent_id = payment ConsentId, scope=payments); redirecting = launching the external authorise URL with a 'Continue to HSBC' manual-launch fallback; error = couldn't-start with retry + cancel. Restates the payment being authorised (amount £250.00 + payee 'Jordan Avery') so the PSU knows what they are approving. The external authorise redirect leaves the app (Custom Tab / system browser) and returns via deep-link org.mifos.openbanking://oauth/callback handled by auth-callback (external_redirect edge, not an imperative navigate). NO password/SCA is collected in-app. Added route block, per-state layout blocks, full state_model, dependencies, screens list. Cancel routes to payment-declined per the authoritative handoff; error retry re-prepares."

screens:
  - id: payment-authorize-handoff
    name: "Securing Payment"
    viewmodel: "PaymentAuthorizeHandoffViewModel"
    description: "Transitional full-screen takeover that stages the domestic-payment-consent, builds the signed OAuth2 authorise request (intent_id = payment ConsentId), and launches the redirect to HSBC to authorise THIS payment. Restates amount + payee, reassures the PSU that SCA happens at HSBC and the app never sees their credentials, then hands off — not a form."
    states_handled: [preparing, redirecting, error]

archetype: loading

route:
  name: PaymentAuthorizeHandoffRoute
  params:
    consentId:
      type: String
      required: false
      note: "The payment ConsentId. Usually null on entry — this screen STAGES the consent on mount (POST /pisp/domestic-payment-consents) and only then has a ConsentId. Passed in only when re-entering after a partial failure. Becomes openbanking_intent_id inside the signed request object."
    amount:
      type: String
      required: true
      note: "Display amount of the payment being authorised (e.g. £250.00), carried from the confirmed PaymentDraft on send-money-confirm."
    payeeName:
      type: String
      required: true
      note: "Payee display name (e.g. Jordan Avery), carried from the confirmed PaymentDraft."

components:
  - type: stack
    id: handoff_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
      align: center
      justify: center
    a11y:
      role: region
      label: "Securing your payment with HSBC"
    test_context:
      purpose: "Root vertical takeover container that centres the payment-authorise handoff content"
      interaction_type: display
      data_driven: false
    children:
      - handoff_bank_icon
      - handoff_title
      - handoff_message
      - handoff_summary_card
      - handoff_spinner
      - handoff_continue_button
      - handoff_security_note
      - handoff_error_card
      - handoff_retry_button
      - handoff_cancel_link

  - type: icon
    id: handoff_bank_icon
    content: "account_balance"
    variant: default
    style:
      color: "#4C662B"
      size: "80dp"
      alignment: center
    a11y:
      role: image
      contentDescription: "HSBC bank"
      label: "HSBC"
    test_context:
      purpose: "Bank icon shown at the top of the full-screen payment-authorise handoff takeover"
      interaction_type: display
      data_driven: false

  - type: text
    id: handoff_title
    content: "Getting your payment ready to authorise"
    variant: headline_small
    style:
      typography: "Outfit/headline_small"
      color: "#1A1C16"
      alignment: center
      padding_top: spacing.lg
    a11y:
      role: heading
      level: 1
      contentDescription: "Getting your payment ready to authorise"
      label: "Getting your payment ready to authorise"
    test_context:
      purpose: "Primary heading of the handoff takeover. Reads 'Getting your payment ready to authorise' while preparing, switches to 'Taking you to HSBC to authorise this payment' while redirecting."
      interaction_type: display
      data_driven: true

  - type: text
    id: handoff_message
    content: "You'll authorise this payment directly with HSBC. Your username, password and security codes are never entered in this app — and the payment is only sent once you've approved it."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: text
      contentDescription: "You will authorise this payment directly with HSBC. Your username, password and security codes are never entered in this app, and the payment is only sent once you have approved it."
      label: "Explains that approval and security checks happen at HSBC, never in this app, and the payment is sent only after authorisation"
    test_context:
      purpose: "Security explainer — authentication and SCA happen at HSBC, the app never sees credentials, and the payment is submitted only after the PSU authorises"
      interaction_type: display
      data_driven: false

  - type: card
    id: handoff_summary_card
    variant: filled
    style:
      background: "#FFFFFF"
      border_radius: "16dp"
      border_color: "#CDEDA3"
      border_width: 1
      padding: spacing.md
      margin_top: spacing.lg
      width: "match_parent"
    a11y:
      role: group
      label: "Payment being authorised"
    test_context:
      purpose: "Summary card restating the amount and payee of the payment being authorised so the PSU knows what they are approving at HSBC"
      interaction_type: display
      data_driven: true
    children:
      - handoff_amount_value
      - handoff_payee_value
      - handoff_securing_label

  - type: text
    id: handoff_amount_value
    content: "£250.00"
    variant: display_small
    style:
      typography: "Outfit/display_small"
      color: "#4C662B"
      font_weight: 700
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: text
      contentDescription: "Amount: two hundred and fifty pounds"
      label: "Amount: two hundred and fifty pounds"
    test_context:
      purpose: "Amount of the payment being authorised, carried in from the confirmed PaymentDraft on send-money-confirm"
      interaction_type: display
      data_driven: true

  - type: text
    id: handoff_payee_value
    content: "To Jordan Avery"
    variant: body_large
    style:
      typography: "Outfit/body_large"
      color: "#1A1C16"
      alignment: center
    a11y:
      role: text
      contentDescription: "To Jordan Avery"
      label: "To Jordan Avery"
    test_context:
      purpose: "Payee line of the payment being authorised during the HSBC handoff"
      interaction_type: display
      data_driven: true

  - type: text
    id: handoff_securing_label
    content: "Authorising securely with HSBC Open Banking"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#44483D"
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: text
      contentDescription: "Authorising securely with HSBC Open Banking"
      label: "Authorising securely with HSBC Open Banking"
    test_context:
      purpose: "Reassurance line under the amount and payee while the consent is created and the authorise URL is built"
      interaction_type: display
      data_driven: false

  - type: loading_indicator
    id: handoff_spinner
    variant: circular_indeterminate
    style:
      color: "#4C662B"
      size: "32dp"
      alignment: center
      padding_top: spacing.lg
    a11y:
      role: progressbar
      contentDescription: "Preparing your payment authorisation"
      label: "Preparing payment authorisation"
    test_context:
      purpose: "Indeterminate spinner shown while the consent is staged (Status AWAU) and the signed authorise request is built"
      interaction_type: display
      data_driven: false

  - type: button
    id: handoff_continue_button
    label: "Continue to HSBC"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled, loading]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
      width: "match_parent"
    visible_when: "uiState.phase == OPENING_BROWSER"
    on_click:
      action: launch_external
      target: auth-callback
      params:
        url: "{authorizeUrl}"
    a11y:
      role: button
      contentDescription: "Continue to HSBC to authorise this payment"
      label: "Continue to HSBC to authorise this payment"
    keyboard:
      focusable: true
    test_context:
      purpose: "Manual-launch fallback for the redirecting state — re-opens the external HSBC authorise URL in a Custom Tab if the auto-launch was blocked or dismissed. Leaves the app; the deep-link return lands on auth-callback."
      interaction_type: action
      data_driven: true

  - type: text
    id: handoff_security_note
    content: "Encrypted connection · You can return here anytime"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#74796D"
      alignment: center
      padding_top: spacing.md
    a11y:
      role: text
      contentDescription: "Encrypted connection. You can return to this app at any time."
      label: "Encrypted connection. You can return to this app at any time."
    test_context:
      purpose: "Reassurance caption beneath the spinner / continue button"
      interaction_type: display
      data_driven: false

  - type: card
    id: handoff_error_card
    variant: filled
    style:
      background: "#FFDAD6"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
    visible_when: "uiState.phase == ERROR"
    a11y:
      role: alert
      label: "Couldn't start authorisation"
    test_context:
      purpose: "Failure card shown when the payment consent could not be staged or the signed authorise request could not be built / launched"
      interaction_type: display
      data_driven: false
    children:
      - handoff_error_icon
      - handoff_error_message

  - type: icon
    id: handoff_error_icon
    content: "error"
    variant: default
    style:
      color: "#BA1A1A"
      size: "20dp"
    a11y:
      role: image
      contentDescription: "Error"
      label: "Error"
    test_context:
      purpose: "Error icon in the failure card when the authorise request cannot be built or the browser cannot be opened"
      interaction_type: display
      data_driven: false

  - type: text
    id: handoff_error_message
    content: "We couldn't reach HSBC to authorise your payment. No money has left your account. Please check your connection and try again."
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#410002"
      padding_start: spacing.sm
    a11y:
      role: alert
      contentDescription: "We couldn't reach HSBC to authorise your payment. No money has left your account. Please check your connection and try again."
      label: "Authorisation error message"
    test_context:
      purpose: "Error copy shown when consent staging or authorise-request building fails (network / 400 OB.Field.Invalid / request-object signing failure), reassuring that no charge was made"
      interaction_type: display
      data_driven: true

  - type: button
    id: handoff_retry_button
    label: "Try again"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      typography: "Outfit/label_large"
      color: "#FFFFFF"
      border_radius: "8dp"
      padding: spacing.md
      margin_top: spacing.lg
      width: "match_parent"
    visible_when: "uiState.phase == ERROR"
    on_click:
      action: retry
      target: payment-authorize-handoff
    a11y:
      role: button
      contentDescription: "Retry authorising your payment with HSBC"
      label: "Retry authorising your payment with HSBC"
    keyboard:
      focusable: true
    test_context:
      purpose: "Re-stages the payment consent and re-builds the HSBC authorise redirect after a failure (returns the screen to the preparing state)"
      interaction_type: action
      data_driven: false

  - type: button
    id: handoff_cancel_link
    label: "Cancel"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      typography: "Outfit/label_large"
      color: "#386663"
      alignment: center
      min_height: 44
      padding_vertical: spacing.sm
    visible_when: "uiState.phase == ERROR"
    on_click:
      action: navigate
      target: payment-declined
    a11y:
      role: button
      contentDescription: "Cancel authorising this payment and see what to do next"
      label: "Cancel the payment authorisation"
    keyboard:
      focusable: true
    test_context:
      purpose: "Aborts the handoff. Routes to payment-declined (the shared payment-not-completed recovery screen) where the PSU can try again or back out."
      interaction_type: navigate
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: preparing
  preparing:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [handoff_bank_icon, handoff_title, handoff_message, handoff_summary_card, handoff_amount_value, handoff_payee_value, handoff_securing_label, handoff_spinner, handoff_security_note]
    overrides:
      handoff_title: { content: "Getting your payment ready to authorise" }
    note: "Full-screen takeover, first phase. The app stages the payment consent (POST /pisp/domestic-payment-consents → ConsentId, Status AWAU), generates the PKCE code_verifier + S256 code_challenge, and builds + signs the authorise request-object JWT (openbanking_intent_id = payment ConsentId, scope=payments, PS256). The summary card restates the amount (£250.00) and payee (Jordan Avery) being authorised. Spinner runs; no user action required."
  redirecting:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [handoff_bank_icon, handoff_title, handoff_message, handoff_summary_card, handoff_amount_value, handoff_payee_value, handoff_securing_label, handoff_continue_button, handoff_security_note]
    overrides:
      handoff_title: { content: "Taking you to HSBC to authorise this payment" }
    note: "Second phase. The signed authorise URL is ready; the host opens it in the system browser / Custom Tab (auto-launch). 'Continue to HSBC' is the manual fallback if the auto-launch is blocked. The external redirect leaves the app at the end of this state; on return the deep-link org.mifos.openbanking://oauth/callback lands on auth-callback. Sample masked authorise URL host: https://sandbox.ob.hsbc.co.uk/oauth2/authorize?... (intent_id = pdc-7a31f9c2-4b8e-4d1a-9f63-1c0ab2d4e5f6)."
  error:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [handoff_bank_icon, handoff_title, handoff_error_card, handoff_retry_button, handoff_cancel_link]
    overrides:
      handoff_title: { content: "Couldn't start authorisation" }
    note: "Consent staging or authorise-request building/launch failed (network / 400 OB.Field.Invalid / request-object signing error / no available browser). No charge was made. Offers retry (re-prepare) or cancel to payment-declined."

state_model:
  PaymentAuthorizeHandoffViewModel:
    screen_state: PaymentAuthorizeHandoffUiState
    ui_state_type: PaymentAuthorizeHandoffUiState
    state:
      - field: phase
        type: "HandoffPhase"
        default: "HandoffPhase.STAGING"
        note: "enum HandoffPhase { STAGING, BUILDING_REQUEST, OPENING_BROWSER, REDIRECTED, ERROR }. STAGING/BUILDING_REQUEST render the 'preparing' state; OPENING_BROWSER/REDIRECTED render 'redirecting'; ERROR renders 'error'. PKCE code_verifier / CSRF state / consentId live inside ObpAuthRepository, NOT in UI state."
      - field: amount
        type: String
        default: "\"\""
        note: "Display amount of the payment being authorised (e.g. £250.00), from the confirmed PaymentDraft."
      - field: payeeName
        type: String
        default: "\"\""
        note: "Payee display name (e.g. Jordan Avery), from the confirmed PaymentDraft."
      - field: consentId
        type: "String?"
        default: "null"
        note: "Data.ConsentId returned by create_domestic_payment_consent (e.g. pdc-7a31f9c2-...); becomes the authorise intent_id."
      - field: authorizeUrl
        type: "String?"
        default: "null"
        note: "The fully-built external HSBC authorise URL, set once BUILDING_REQUEST completes; consumed by the LaunchAuthorize event and the 'Continue to HSBC' manual fallback."
      - field: errorMessage
        type: "String?"
        default: "null"
      - field: isError
        type: Boolean
        default: "false"
    derived:
      - field: isReadyToRedirect
        type: Boolean
        note: "computed get(): authorizeUrl != null && phase == HandoffPhase.OPENING_BROWSER"
    errors:
      name: PaymentAuthorizeHandoffError
      types:
        - { type: BadRequest, retry: true, message_key: error_authorize_bad_request }
        - { type: RequestTimeout, retry: true, message_key: error_network }
        - { type: SigningFailed, retry: true, message_key: error_authorize_signing }
        - { type: InvalidConsentStatus, retry: true, message_key: error_invalid_consent_status }
        - { type: BrowserUnavailable, retry: true, message_key: error_browser_unavailable }
        - { type: Unknown, retry: true, message_key: error_unknown }
    events:
      name: PaymentAuthorizeHandoffEvent
      members:
        - "LaunchAuthorize(authorizeUrl: String)"
        - NavigateToCallback
        - NavigateToPaymentDeclined
    actions:
      name: PaymentAuthorizeHandoffAction
      members:
        - { name: RetryClicked, trigger: "Tap Try again in the error state" }
        - { name: CancelClicked, trigger: "Tap Cancel in the error state" }
        - { name: ContinueClicked, trigger: "Tap Continue to HSBC manual-launch fallback" }
        - { name: "Internal.ConsentStaged", params: { consentId: String }, trigger: "Payment consent reached AWAU" }
        - { name: "Internal.AuthorizeRequestBuilt", params: { authorizeUrl: String }, trigger: "Signed request object built" }
        - { name: "Internal.StagingFailed", params: { error: PaymentAuthorizeHandoffError }, trigger: "Consent staging or signing failed" }
    di: [ObpAuthRepository, PaymentsRepository, OidcCallbackBus]
    base: "template.core.base.ui.viewmodel.BaseViewModel<PaymentAuthorizeHandoffUiState, PaymentAuthorizeHandoffEvent, PaymentAuthorizeHandoffAction>"
    nav_args:
      type: PaymentDraft
      note: "Carries the confirmed PaymentDraft (amount, currency, payeeName, payeeBank, Initiation fields) forward from send-money-confirm so the consent Initiation byte-matches the later /domestic-payments submit."
    note: "Handoff is REACTIVE: on mount PaymentsRepository stages the payment consent (Status AWAU) via ObpAuthRepository, which builds the PKCE + signed request authorise URL (intent_id = ConsentId, scope=payments) and emits LaunchAuthorize. SCA is NEVER collected in-app — it happens at HSBC during the external authorise redirect. The deep-link callback drives navigation to auth-callback; this screen only emits LaunchAuthorize + NavigateToCallback + NavigateToPaymentDeclined."

navigation:
  - id: nav_to_auth_callback
    target: auth-callback
    trigger: external_redirect_return
    note: "Primary outbound transition — the PSU authenticates + completes SCA at HSBC, then HSBC redirects to org.mifos.openbanking://oauth/callback. The deep-link is received by auth-callback (one-shot PaymentAuthorizeHandoffEvent.NavigateToCallback), NOT this screen. This is an external_redirect edge, not an imperative navigate. The 'Continue to HSBC' button (launch_external) re-launches the same external authorize URL that ultimately returns here."
  - id: nav_to_payment_declined
    target: payment-declined
    trigger: cancel_click
    on_click:
      action: navigate
      target: payment-declined
    note: "Cancel in the error state aborts the handoff and routes to payment-declined (the shared payment-not-completed recovery screen). No charge was made."

api:
  - id: create_domestic_payment_consent
    endpoint: "POST /obie/open-banking/v4.0/pisp/domestic-payment-consents"
    api_group: pisp-domestic
    tag: PISP
    trigger: on_handoff_mount
    description: "Stages the domestic-payment-consent before the authorise redirect. ASPSP returns Data.ConsentId (e.g. pdc-7a31f9c2-...) with default Data.Status AWAU (awaiting PSU authorisation). Client Credentials grant. The Initiation block here MUST byte-match the later create_domestic_payment submit. CE HSBCnet: POST /ce/obie/open-banking/v3.1/pisp/domestic-payment-consents."
    request:
      fields:
        - name: Data.Initiation.InstructionIdentification
          type: String
        - name: Data.Initiation.InstructedAmount.Amount
          type: String
          example: "250.00"
        - name: Data.Initiation.InstructedAmount.Currency
          type: String
          example: "GBP"
        - name: Data.Initiation.CreditorAccount.SchemeName
          type: String
        - name: Data.Initiation.CreditorAccount.Identification
          type: String
        - name: Data.Initiation.CreditorAccount.Name
          type: String
          example: "Jordan Avery"
        - name: Data.Initiation.RemittanceInformation.Reference
          type: String
        - name: Risk.PaymentContextCode
          type: String
          example: "TransferToThirdParty"
    response:
      fields:
        - name: Data.ConsentId
          type: String
          stored_as: payment_consent_id
          example: "pdc-7a31f9c2-4b8e-4d1a-9f63-1c0ab2d4e5f6"
        - name: Data.Status
          type: String
          example: "AWAU"
        - name: Data.CreationDateTime
          type: String
    errors:
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "We couldn't reach HSBC to authorise your payment. No money has left your account. Please check your connection and try again."
      - code: 401
        name: UNAUTHORIZED
        ui_message: "We couldn't authorise this payment session. Please sign in again and retry."
      - code: 403
        name: OB_RESOURCE_INVALID_CONSENT_STATUS
        ui_message: "This payment can't be authorised right now. Please go back and start the payment again."
      - code: 429
        name: TOO_MANY_REQUESTS
        ui_message: "HSBC is busy right now. Please wait a moment and try again."
      - code: 500
        name: OB_UNEXPECTED_ERROR
        ui_message: "Something went wrong authorising your payment. No money has left your account. Please try again."

  - id: oauth2_authorize
    endpoint: "GET https://sandbox.ob.hsbc.co.uk/oauth2/authorize"
    api_group: auth
    tag: Authorization
    trigger: on_consent_created
    description: "Opens the system browser / Custom Tab for the OBIE authorise redirect. authorization_code + PKCE with a signed request object; openbanking_intent_id = the payment ConsentId; scope='openid payments'. EXTERNAL — this screen CONSTRUCTS the request, it is not a REST response the screen consumes. The PSU authenticates AND completes SCA at HSBC — no in-app code entry. On success HSBC redirects to the registered deep-link with code + id_token + state; on PSU decline / consent RJCT it returns an error param. Runs on the per-brand authorize host (sandbox.ob.hsbc.co.uk, no secure. prefix). Full path /obie/open-banking/v1.1/oauth2/authorize per the auth group; CE brands use /ce/...."
    request:
      params:
        response_type: "code id_token"
        client_id: "{hsbc_client_id}"
        redirect_uri: "org.mifos.openbanking://oauth/callback"
        scope: "openid payments"
        state: "{csrf_state}"
        nonce: "{oidc_nonce}"
        request: "{signed_request_object_jwt}"
        code_challenge: "{pkce_code_challenge}"
        code_challenge_method: "S256"
    response:
      redirect_params:
        - name: code
          type: String
        - name: id_token
          type: String
        - name: state
          type: String
        - name: error
          type: String
          note: "Present instead of code when the PSU declines or the consent is RJCT at the bank — drives navigation to payment-declined via auth-callback."
    errors:
      - code: 302
        name: PSU_DECLINED
        ui_message: "You didn't approve this payment at HSBC. No money has left your account."
      - code: 400
        name: OB_FIELD_INVALID
        ui_message: "Something went wrong preparing your payment authorisation. Please try again."

dependencies:
  tier: feature
  features:
    - feature: send-money-confirm
      type: nav
      required: true
      check: "feature/send-money/ confirm screen exists"
    - feature: obp-auth
      type: auth
      required: true
      check: "feature/consent/ ObpAuthRepository exists"
    - feature: auth-callback
      type: nav
      required: true
      check: "feature/auth/ auth-callback deep-link handler exists"
    - feature: payment-declined
      type: nav
      required: true
    - feature: payment-result
      type: nav
