sibling: api
schema_version: "4.0"
feature_id: forgot-password
api:
  - id: obp_request_password_reset
    endpoint: "POST /obp/v7.0.0/users/forgot-password/reset-emails"
    tag: User
    trigger: OnSubmitClicked
    description: "Request a password reset email for the specified user account"
    request:
      fields:
        - name: username
          type: String
        - name: email
          type: String
    response:
      fields:
        - name: success
          type: Boolean
        - name: message
          type: String
    errors:
      - code: 404
        message: "ACCOUNT_NOT_FOUND"
      - code: 429
        message: "RATE_LIMITED"
      - code: 500
        message: "INTERNAL_SERVER_ERROR"
