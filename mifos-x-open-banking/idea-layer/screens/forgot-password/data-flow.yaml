sibling: data-flow
schema_version: "4.0"
feature_id: forgot-password
entries:
  - screen_id: forgot-password
    trigger: on_interact
    event: OnSubmitClicked
    endpoints:
      - obp_request_password_reset
    direction: write
    dtos:
      - name: PasswordResetRequest
        role: request
        api_id: obp_request_password_reset
      - name: PasswordResetResponse
        role: response
        api_id: obp_request_password_reset
    produces_state: submitting
    error_paths:
      - error_code: 404
        behavior: show_error_banner
      - error_code: 429
        behavior: show_rate_limit_error
      - error_code: 500
        behavior: show_error_banner

  - screen_id: forgot-password
    trigger: on_interact
    event: OnIdentifierChanged
    endpoints: []
    direction: none
    dtos: []
    produces_state: idle

  - screen_id: forgot-password
    trigger: on_interact
    event: OnBackToLoginClicked
    endpoints: []
    direction: none
    dtos: []
    produces_state: idle
