  - has_ui
  - has_api
status_history:
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    note: "SOURCE→SPEC reconciliation to shipped ForgotPasswordViewModel.kt + ForgotPasswordScreen.kt + AuthRecoveryApi.kt. The shipped screen requires TWO fields — username AND email — both non-blank (isFormValid = username.isNotBlank() && email.isNotBlank()); both are always sent to AuthRecoveryRepository.initiateReset(username.trim(), email.trim()). UI already carried the two-field form + subtitle; this pass fixed only the API contract: endpoint corrected to the shipped POST v6.0.0/users/password-reset-url (body {username, email}, both required) — replaced the prior /v5.0.0/users/password-reset (inline) and /v7.0.0/users/forgot-password/reset-emails (api.yaml) guesses. errorMessage maps from ObpException.reason: NOT_FOUND/BAD_REQUEST → 'We couldn't find an account…', TOO_MANY_REQUESTS → 'Too many requests…', else → 'Could not connect…'. DI = AuthRecoveryRepository only. AuthRecoveryApi.confirmReset (POST v6.0.0/users/password) exists but is NOT consumed by the app — the reset is completed via the emailed web link; marked deferred."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

screens:
  - id: forgot-password
    name: "Forgot Password"
    viewmodel: "ForgotPasswordViewModel"

archetype: form

shell:
  top_app_bar:
    show: true
    title: "Reset Password"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: fpw_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - fpw_illustration
      - fpw_header_title
      - fpw_header_subtitle
      - fpw_form_section
      - fpw_error_banner
      - fpw_success_section
      - fpw_submit_button
      - fpw_back_to_login_link

  # ── Illustration ──────────────────────────────────────────────────────────────

  - type: image
    id: fpw_illustration
    content: "ic_lock_reset"
    label: "Lock reset illustration"
    style:
      width: "72dp"
      height: "72dp"
      tint: "#4C662B"
      alignment: center
      padding_bottom: spacing.lg
    a11y:
      role: image
      label: "Password reset illustration"
    test_context:
      purpose: "Decorative illustration providing visual context for the reset flow"
      interaction_type: display
      data_driven: false

  # ── Header ────────────────────────────────────────────────────────────────────

  - type: text
    id: fpw_header_title
    content: "Forgot your password?"
    variant: headline_small
    style:
      typography: "Outfit/headline_small"
      color: "#4C662B"
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "Forgot your password?"
    test_context:
      purpose: "Screen headline identifying the purpose of this flow"
      interaction_type: display
      data_driven: false

  - type: text
    id: fpw_header_subtitle
    content: "Enter your username and email address and we'll send you a link to reset your password."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Enter your username and email address and we'll send you a link to reset your password."
    test_context:
      purpose: "Instruction copy — both username AND email are required (shipped sends both to AuthRecoveryRepository.initiateReset)"
      interaction_type: display
      data_driven: false

  # ── Form ──────────────────────────────────────────────────────────────────────

  - type: stack
    id: fpw_form_section
    variant: column
    style:
      padding_bottom: spacing.md
    visible_when: "uiState != success"
    children:
      - fpw_username_input
      - fpw_email_input

  - type: input
    id: fpw_username_input
    label: "Username"
    placeholder: "e.g. john.doe"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      error_border_color: "#BA1A1A"
      typography: "Outfit/body_medium"
      color: "#1A1C16"
      margin_bottom: spacing.sm
    prefill: ""
    keyboard_type: text
    ime_action: next
    a11y:
      role: textbox
      label: "Username"
      label_source: visible_label
    keyboard:
      focusable: true
      ime_action: next
    test_context:
      purpose: "Required username field — sent together with email to AuthRecoveryRepository.initiateReset"
      interaction_type: input
      data_driven: false

  - type: input
    id: fpw_email_input
    label: "Email"
    placeholder: "e.g. john@example.com"
    variant: email
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#C5C8BA"
      focused_border_color: "#4C662B"
      error_border_color: "#BA1A1A"
      typography: "Outfit/body_medium"
      color: "#1A1C16"
    prefill: ""
    keyboard_type: email
    ime_action: done
    a11y:
      role: textbox
      label: "Email address"
      label_source: visible_label
    keyboard:
      focusable: true
      ime_action: done
    test_context:
      purpose: "Required email field — sent together with username to AuthRecoveryRepository.initiateReset"
      interaction_type: input
      data_driven: false

  # ── Banners ───────────────────────────────────────────────────────────────────

  - type: banner
    id: fpw_error_banner
    variant: error
    content: "We couldn't find an account with that username or email. Please try again."
    style:
      background: "#FFDAD6"
      color: "#BA1A1A"
      border_radius: "8dp"
      padding: spacing.sm
      margin_bottom: spacing.md
    visible_when: "uiState == error"
    a11y:
      role: alert
      label: "Reset request error"
    test_context:
      purpose: "Error feedback when the identifier does not match a known account"
      interaction_type: display
      data_driven: true

  # ── Success Section ───────────────────────────────────────────────────────────

  - type: stack
    id: fpw_success_section
    variant: column
    style:
      alignment: center
      padding_vertical: spacing.xl
    visible_when: "uiState == success"
    children:
      - fpw_success_icon
      - fpw_success_title
      - fpw_success_body

  - type: icon
    id: fpw_success_icon
    content: "mark_email_read"
    variant: default
    style:
      color: "#4C662B"
      size: "48dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "Email sent successfully"
    test_context:
      purpose: "Confirmation icon displayed after a successful reset request"
      interaction_type: display
      data_driven: false

  - type: text
    id: fpw_success_title
    content: "Check your inbox"
    variant: title_large
    style:
      typography: "Outfit/title_large"
      color: "#4C662B"
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "Check your inbox"
    test_context:
      purpose: "Success state headline confirming the reset email was dispatched"
      interaction_type: display
      data_driven: false

  - type: text
    id: fpw_success_body
    content: "If an account exists for that email, you'll receive a password reset link within a few minutes."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
    a11y:
      role: text
      label: "If an account exists for that email, you'll receive a password reset link within a few minutes."
    test_context:
      purpose: "Non-enumeration copy — avoids confirming whether the account exists"
      interaction_type: display
      data_driven: false

  # ── Submit Button ─────────────────────────────────────────────────────────────

  - type: button
    id: fpw_submit_button
    label: "Send Reset Link"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: "#4C662B"
      color: "#FFFFFF"
      typography: "Outfit/label_large"
      padding_horizontal: spacing.xl
      border_radius: "12dp"
      loading_when: "uiState == submitting"
      margin_bottom: spacing.md
    visible_when: "uiState != success"
    on_click:
      action: submit_forgot_password
      target: forgot-password
    a11y:
      role: button
      label: "Send password reset link"
    keyboard:
      focusable: true
    test_context:
      purpose: "Triggers ForgotPasswordViewModel.onSubmit(); disabled while submitting"
      interaction_type: action
      data_driven: false

  # ── Back to Login ─────────────────────────────────────────────────────────────

  - type: link
    id: fpw_back_to_login_link
    label: "Back to Login"
    variant: inline
    style:
      typography: "Outfit/body_medium"
      color: "#386663"
      alignment: center
    on_click:
      action: navigate
      target: login
    a11y:
      role: link
      label: "Return to the login screen"
    keyboard:
      focusable: true
    test_context:
      purpose: "Allows users to abandon the reset flow and return to login"
      interaction_type: navigate
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: idle
  idle:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - fpw_illustration
      - fpw_header_title
      - fpw_header_subtitle
      - fpw_form_section
      - fpw_submit_button
      - fpw_back_to_login_link
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - fpw_illustration
      - fpw_header_title
      - fpw_header_subtitle
      - fpw_form_section
      - fpw_submit_button
      - fpw_back_to_login_link
    note: "Submit button shows loading spinner; input disabled"
  success:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - fpw_success_section
      - fpw_back_to_login_link
  error:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - fpw_illustration
      - fpw_header_title
      - fpw_header_subtitle
      - fpw_form_section
      - fpw_error_banner
      - fpw_submit_button
      - fpw_back_to_login_link
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - fpw_illustration
      - fpw_header_title
      - fpw_header_subtitle
      - fpw_form_section
      - fpw_submit_button
      - fpw_back_to_login_link

state_model:
  ForgotPasswordViewModel:
    screen_state: ForgotPasswordState
    state:
      - field: username
        type: String
        default: "\"\""
      - field: email
        type: String
        default: "\"\""
      - field: isSubmitting
        type: Boolean
        default: "false"
      - field: isSuccess
        type: Boolean
        default: "false"
      - field: errorMessage
        type: "String?"
        default: "null"
    derived:
      - field: isFormValid
        type: Boolean
        note: "computed get(): username.isNotBlank() && email.isNotBlank() — both fields required"
    errors: [NOT_FOUND, BAD_REQUEST, TOO_MANY_REQUESTS]
    events:
      - ForgotPasswordEvent.NavigateBackToLogin
    actions:
      - "ForgotPasswordAction.UsernameChanged(value: String)"
      - "ForgotPasswordAction.EmailChanged(value: String)"
      - ForgotPasswordAction.SubmitClicked
      - ForgotPasswordAction.BackToLoginClicked
      - "ForgotPasswordAction.Internal.ResetResultReceive(result: Result<String>) — internal async result"
    di: [AuthRecoveryRepository]
    base: "template.core.base.ui.viewmodel.BaseViewModel<ForgotPasswordState, ForgotPasswordEvent, ForgotPasswordAction>"
    note: "onSubmit() calls authRecoveryRepository.initiateReset(username.trim(), email.trim()) — BOTH always sent. On success swaps to anti-enumeration confirmation; errors map from ObpException.reason: NOT_FOUND/BAD_REQUEST → 'We couldn't find an account…', TOO_MANY_REQUESTS → 'Too many requests…', else → 'Could not connect…'."

navigation:
  - id: nav_back_to_login
    target: login
    on_click:
      action: navigate
      target: login

api:
  - id: obp_request_password_reset
    method: POST
    path: "/obp/v6.0.0/users/password-reset-url"
    description: "Shipped AuthRecoveryApi.initiateReset — body sends BOTH username and email; OBP looks the user up by both and they must both match a real account."
    request:
      username: String
      email: String
    response:
      message: String
    errors: [400, 404, 429]
  - id: obp_confirm_password_reset
    method: POST
    path: "/obp/v6.0.0/users/password"
    status: deferred
    description: "AuthRecoveryApi.confirmReset exists (body {token, new_password}) but is NOT consumed by the app — the reset is completed via the emailed web link, not in-app. Kept for contract completeness; no UI binding."
    request:
      token: String
      new_password: String
    response:
      message: String

dependencies:
  tier: feature
  features: [shared-core, obp-auth]
