sibling: demo-data
schema_version: "4.0"
feature_id: forgot-password
content:
  obp_request_password_reset:
    _template:
      username: "wanjiku.kamau"
      email: "wanjiku.kamau@safaricom.co.ke"
    _success_response:
      success: true
      message: "A password reset link has been sent to w****u@safaricom.co.ke. Check your inbox."
