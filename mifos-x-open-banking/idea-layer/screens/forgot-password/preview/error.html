<!doctype html>
<html lang="en" data-screen="forgot-password" data-state="error">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Forgot Password — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
main{display:flex;flex-direction:column;align-items:center;padding:40px 24px;gap:20px;min-height:calc(844px - 56px);}
.illus-icon{width:72px;height:72px;background:var(--primary-container);border-radius:36px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.illus-icon .mi{font-size:36px;color:var(--primary);}
.screen-title{font-size:22px;font-weight:600;color:var(--primary);text-align:center;}
.screen-subtitle{font-size:14px;color:var(--outline);text-align:center;line-height:1.5;max-width:300px;}
.error-banner{width:100%;background:#FFDAD6;border-radius:8px;padding:12px 16px;}
.error-banner-text{font-size:14px;color:var(--error);line-height:1.4;}
.input-wrapper{width:100%;display:flex;flex-direction:column;gap:6px;}
.input-label{font-size:12px;font-weight:500;color:var(--text-secondary);}
.input-field{width:100%;padding:14px 12px;border:2px solid var(--error);border-radius:8px;font-family:var(--font);font-size:14px;background:var(--surface);color:var(--text-primary);outline:none;}
.submit-btn{width:100%;padding:16px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
.back-link{font-size:14px;color:var(--tertiary);cursor:pointer;text-align:center;margin-top:8px;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="login">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Reset Password</span>
</header>

<main>
  <div class="illus-icon">
    <span class="mi">lock_reset</span>
  </div>
  <h2 class="screen-title">Forgot your password?</h2>
  <p class="screen-subtitle">Enter your username or email address and we'll send you a link to reset your password.</p>

  <div class="error-banner">
    <p class="error-banner-text">We couldn't find an account with that username or email. Please try again.</p>
  </div>

  <div class="input-wrapper">
    <span class="input-label">Username or Email</span>
    <input class="input-field" type="text" placeholder="e.g. john.doe or john@example.com" aria-label="Username or email address">
  </div>

  <button class="submit-btn" data-action="submit_forgot_password">Send Reset Link</button>
  <span class="back-link" data-nav-to="login">Back to Login</span>
</main>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
