<!doctype html>
<html lang="en" data-screen="forgot-password" data-state="success">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
      --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF;
      --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --spacing-xs: 4px; --spacing-sm: 8px; --spacing-md: 16px; --spacing-lg: 24px; --spacing-xl: 32px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
    .device-frame { max-width: 390px; margin: 0 auto; min-height: 100vh; background: var(--background); display: flex; flex-direction: column; }
    .top-app-bar {
      display: flex; align-items: center; height: 64px; padding: 0 var(--spacing-sm);
      background: var(--background); position: sticky; top: 0; z-index: 10;
    }
    .top-app-bar__nav-btn {
      width: 48px; height: 48px; border: none; background: transparent; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--on-background);
    }
    .top-app-bar__nav-btn:hover { background: rgba(0,0,0,0.08); }
    .top-app-bar__title { font-size: 22px; font-weight: 500; color: var(--on-background); flex: 1; padding-left: var(--spacing-sm); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--spacing-lg) var(--spacing-lg) 48px; gap: var(--spacing-md); text-align: center; }
    .email-icon-wrap {
      width: 96px; height: 96px; border-radius: 50%; background: var(--primary-container);
      display: flex; align-items: center; justify-content: center; margin-bottom: var(--spacing-sm);
    }
    .email-icon-wrap .material-icons { font-size: 48px; color: var(--primary); }
    .success-title { font-size: 26px; font-weight: 700; color: var(--primary); }
    .success-subtitle { font-size: 15px; color: var(--on-surface-variant); line-height: 1.6; max-width: 300px; }
    .email-highlight {
      font-size: 14px; font-weight: 600; color: var(--secondary);
      background: var(--primary-container); border-radius: 8px;
      padding: 10px 16px; width: 100%;
    }
    .info-note { font-size: 12px; color: var(--outline); line-height: 1.5; max-width: 280px; }
    .btn-filled {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 52px; padding: 0 var(--spacing-xl);
      background: var(--primary); border: none; border-radius: 12px;
      color: var(--on-primary); font-family: 'Outfit', sans-serif;
      font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: var(--spacing-sm);
    }
    .btn-filled:hover { opacity: 0.9; }
    .back-link {
      font-size: 14px; font-weight: 500; color: var(--secondary); text-decoration: none;
      cursor: pointer; background: none; border: none; font-family: 'Outfit', sans-serif;
      padding: var(--spacing-sm); border-radius: 4px;
    }
    .back-link:hover { background: rgba(56,102,99,0.06); }
    .material-icons {
      font-family: 'Material Icons'; font-style: normal; font-weight: normal; font-size: 24px; line-height: 1;
      display: inline-block; -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <nav class="top-app-bar" role="navigation">
      <button class="top-app-bar__nav-btn" aria-label="Navigate back"
              data-action="navigate_back" data-component-type="icon_button" data-component-id="top_app_bar_back">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar__title">Reset Password</h1>
    </nav>

    <main id="fpw_success_root" data-component-type="stack" data-component-id="fpw_success_root">

      <div class="email-icon-wrap"
           data-component-type="image" data-component-id="fpw_success_icon"
           role="img" aria-label="Email sent icon">
        <span class="material-icons" aria-hidden="true">mark_email_read</span>
      </div>

      <h2 class="success-title"
          data-component-type="text" data-component-id="fpw_success_title">Reset Link Sent</h2>

      <p class="success-subtitle"
         data-component-type="text" data-component-id="fpw_success_subtitle">
        We've sent a password reset link to your email address.
      </p>

      <div class="email-highlight"
           data-component-type="text" data-component-id="fpw_email_highlight"
           role="text" aria-label="Email sent to john.doe@example.com">
        john.doe@example.com
      </div>

      <p class="info-note"
         data-component-type="text" data-component-id="fpw_info_note">
        Check your inbox and spam folder. The link expires in 30 minutes.
      </p>

      <button class="btn-filled"
              data-component-type="button" data-component-id="fpw_back_to_login_button"
              role="button" aria-label="Return to login screen"
              tabindex="0" data-nav-to="login">
        Back to Login
      </button>

      <a class="back-link"
         data-component-type="link" data-component-id="fpw_resend_link"
         href="#" role="link" aria-label="Resend the password reset email"
         tabindex="0" data-action="resend_reset_email">
        Didn't receive it? Resend
      </a>

    </main>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
