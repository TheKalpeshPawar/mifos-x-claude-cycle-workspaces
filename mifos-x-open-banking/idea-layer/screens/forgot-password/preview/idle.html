<!doctype html>
<html lang="en" data-screen="forgot-password" data-state="idle" data-feature="forgot-password" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot Password</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; }
    .icon-wrap { text-align: center; margin-bottom: 20px; } .icon-circle { width: 80px; height: 80px; border-radius: 40px; background: var(--primary-container); display: inline-flex; align-items: center; justify-content: center; } .icon-circle .material-icons { font-size: 40px; color: var(--primary); }
    .heading { font-size: 22px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 8px; }
    .instruction { font-size: 14px; color: var(--on-surface-variant); text-align: center; margin-bottom: 32px; line-height: 1.5; }
    .input-group { margin-bottom: 16px; } .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; } .input-field { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--on-surface); } .input-field::placeholder { color: var(--outline); }
    .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    .back-link { display: block; text-align: center; margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--secondary); text-decoration: none; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Forgot Password</h1></div>
  <main>
    <div class="icon-wrap"><div class="icon-circle"><span class="material-icons">lock_reset</span></div></div>
    <h2 class="heading">Reset Your Password</h2>
    <p class="instruction">Enter your email or username and we'll send you a link to reset your password.</p>
    <div class="input-group"><label>Email or Username</label><input type="text" class="input-field" placeholder="Enter email or username" aria-label="Email or Username" tabindex="0"></div>
    <button class="submit-btn" data-action="submit_forgot_password" tabindex="0" aria-label="Send Reset Link">Send Reset Link</button>
    <a class="back-link" data-nav-to="login" tabindex="0" aria-label="Back to Login">Back to Login</a>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body></html>
