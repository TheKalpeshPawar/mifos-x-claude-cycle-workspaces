<!doctype html>
<html lang="en" data-screen="forgot-password" data-state="idle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Mifos X Open Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      min-height: 100vh;
    }

    .device-frame {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--background);
      display: flex;
      flex-direction: column;
    }

    /* Top App Bar */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--spacing-sm);
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-app-bar__nav-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--on-background);
      flex-shrink: 0;
    }

    .top-app-bar__nav-btn:hover {
      background: rgba(0,0,0,0.08);
    }

    .top-app-bar__title {
      font-size: 22px;
      font-weight: 500;
      color: var(--on-background);
      flex: 1;
      padding-left: var(--spacing-sm);
    }

    /* Main */
    main {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Illustration */
    .illustration {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--spacing-lg);
    }

    .illustration .material-icons {
      font-size: 56px;
      color: var(--primary);
    }

    /* Header */
    .screen-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin-bottom: var(--spacing-xs);
    }

    .screen-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: var(--outline);
      text-align: center;
      line-height: 1.6;
      margin-bottom: var(--spacing-xl);
      padding: 0 var(--spacing-sm);
    }

    /* Form section */
    .form-section {
      width: 100%;
      margin-bottom: var(--spacing-md);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--on-surface-variant);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--outline-variant);
      border-radius: 8px;
      background: var(--surface);
      transition: border-color 0.15s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
    }

    .input-field {
      flex: 1;
      height: 48px;
      padding: 0 var(--spacing-md);
      border: none;
      background: transparent;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: var(--on-surface);
      outline: none;
    }

    .input-field::placeholder {
      color: var(--outline-variant);
    }

    /* Banner */
    .banner {
      width: 100%;
      border-radius: 8px;
      padding: var(--spacing-sm) var(--spacing-md);
      margin-bottom: var(--spacing-md);
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-sm);
    }

    .banner--error {
      background: #FFDAD6;
      color: var(--error);
    }

    .banner__icon {
      font-size: 20px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .banner__text {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    /* Submit button */
    .btn-filled {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      padding: 0 var(--spacing-xl);
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: var(--spacing-md);
      transition: opacity 0.15s;
    }

    .btn-filled:hover {
      opacity: 0.9;
    }

    /* Back to login link */
    .back-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--secondary);
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Outfit', sans-serif;
      padding: var(--spacing-sm);
      border-radius: 4px;
      transition: background 0.15s;
    }

    .back-link:hover {
      background: rgba(56, 102, 99, 0.06);
    }

    .material-icons {
      font-family: 'Material Icons';
      font-style: normal;
      font-weight: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <!-- Top App Bar -->
    <nav class="top-app-bar" role="navigation" aria-label="Screen navigation">
      <button
        class="top-app-bar__nav-btn"
        aria-label="Navigate back"
        data-action="navigate_back"
        data-component-type="icon_button"
        data-component-id="top_app_bar_back"
      >
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar__title">Reset Password</h1>
    </nav>

    <!-- Main Content -->
    <main id="fpw_root" data-component-type="stack" data-component-id="fpw_root">

      <!-- Illustration -->
      <div
        class="illustration"
        data-component-type="image"
        data-component-id="fpw_illustration"
        role="img"
        aria-label="Password reset illustration"
      >
        <span class="material-icons" aria-hidden="true">lock_reset</span>
      </div>

      <!-- Header Title -->
      <h2
        class="screen-title"
        data-component-type="text"
        data-component-id="fpw_header_title"
        role="heading"
        aria-label="Forgot your password?"
      >
        Forgot your password?
      </h2>

      <!-- Header Subtitle -->
      <p
        class="screen-subtitle"
        data-component-type="text"
        data-component-id="fpw_header_subtitle"
        role="text"
        aria-label="Enter your username or email address and we'll send you a link to reset your password."
      >
        Enter your username or email address and we'll send you a link to reset your password.
      </p>

      <!-- Form Section -->
      <div
        class="form-section"
        data-component-type="stack"
        data-component-id="fpw_form_section"
      >
        <div
          class="input-group"
          data-component-type="input"
          data-component-id="fpw_identifier_input"
        >
          <label class="input-label" for="identifier">Username or Email</label>
          <div class="input-wrapper">
            <input
              id="identifier"
              class="input-field"
              type="text"
              placeholder="e.g. john.doe or john@example.com"
              aria-label="Username or email address"
              autocomplete="username email"
              inputmode="email"
              data-action="focus_field"
            >
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        class="btn-filled"
        data-component-type="button"
        data-component-id="fpw_submit_button"
        role="button"
        aria-label="Send password reset link"
        tabindex="0"
        data-action="submit_forgot_password"
      >
        Send Reset Link
      </button>

      <!-- Back to Login Link -->
      <a
        class="back-link"
        data-component-type="link"
        data-component-id="fpw_back_to_login_link"
        href="#"
        role="link"
        aria-label="Return to the login screen"
        tabindex="0"
        data-nav-to="login"
      >
        Back to Login
      </a>

    </main>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
