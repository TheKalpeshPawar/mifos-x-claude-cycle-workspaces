<!doctype html>
<html lang="en" data-screen="forgot-password" data-state="submitting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Submitting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
      --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF;
      --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --spacing-xs: 4px; --spacing-sm: 8px; --spacing-md: 16px; --spacing-lg: 24px; --spacing-xl: 32px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; }
    .device-frame { max-width: 390px; margin: 0 auto; min-height: 100vh; background: var(--background); display: flex; flex-direction: column; position: relative; }
    .top-app-bar {
      display: flex; align-items: center; height: 64px; padding: 0 var(--spacing-sm);
      background: var(--background); position: sticky; top: 0; z-index: 10;
    }
    .top-app-bar__nav-btn {
      width: 48px; height: 48px; border: none; background: transparent; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--on-background); opacity: 0.5;
    }
    .top-app-bar__title { font-size: 22px; font-weight: 500; color: var(--on-background); flex: 1; padding-left: var(--spacing-sm); }
    main { flex: 1; overflow-y: auto; padding: var(--spacing-lg); display: flex; flex-direction: column; align-items: center; opacity: 0.55; pointer-events: none; }
    .illustration { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; margin-bottom: var(--spacing-lg); }
    .illustration .material-icons { font-size: 56px; color: var(--primary); }
    .screen-title { font-size: 24px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: var(--spacing-xs); }
    .screen-subtitle { font-size: 14px; color: var(--outline); text-align: center; line-height: 1.6; margin-bottom: var(--spacing-xl); padding: 0 var(--spacing-sm); }
    .form-section { width: 100%; margin-bottom: var(--spacing-md); }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-label { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); }
    .input-wrapper { display: flex; align-items: center; border: 1.5px solid var(--outline-variant); border-radius: 8px; background: var(--surface); }
    .input-field { flex: 1; height: 48px; padding: 0 var(--spacing-md); border: none; background: transparent; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); outline: none; }
    .btn-filled {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 52px; padding: 0 var(--spacing-xl);
      background: var(--primary); border: none; border-radius: 12px;
      color: var(--on-primary); font-family: 'Outfit', sans-serif;
      font-size: 16px; font-weight: 600; margin-bottom: var(--spacing-md);
    }
    .btn-spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: var(--on-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Overlay */
    .submitting-overlay {
      position: absolute; inset: 0; background: rgba(249,250,239,0.60);
      display: flex; align-items: center; justify-content: center; z-index: 20;
    }
    .overlay-card {
      background: var(--surface); border-radius: 16px; padding: 32px 24px; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .overlay-spinner { width: 48px; height: 48px; border: 4px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.85s linear infinite; }
    .overlay-text { font-size: 16px; font-weight: 600; color: var(--on-surface); }
    .overlay-sub { font-size: 13px; color: var(--outline); }
    .material-icons {
      font-family: 'Material Icons'; font-style: normal; font-weight: normal; font-size: 24px; line-height: 1;
      display: inline-block; -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <nav class="top-app-bar" role="navigation">
      <button class="top-app-bar__nav-btn" aria-label="Navigate back" aria-disabled="true"
              data-component-type="icon_button" data-component-id="top_app_bar_back">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar__title">Reset Password</h1>
    </nav>

    <main id="fpw_root" data-component-type="stack" data-component-id="fpw_root" aria-busy="true">
      <div class="illustration" data-component-type="image" data-component-id="fpw_illustration" role="img" aria-label="Password reset icon">
        <span class="material-icons" aria-hidden="true">lock_reset</span>
      </div>
      <h2 class="screen-title" data-component-type="text" data-component-id="fpw_header_title">Forgot your password?</h2>
      <p class="screen-subtitle" data-component-type="text" data-component-id="fpw_header_subtitle">Enter your username or email address and we'll send you a link to reset your password.</p>
      <div class="form-section" data-component-type="stack" data-component-id="fpw_form_section">
        <div class="input-group" data-component-type="input" data-component-id="fpw_identifier_input">
          <label class="input-label" for="identifier">Username or Email</label>
          <div class="input-wrapper">
            <input id="identifier" class="input-field" type="text" value="john.doe@example.com" disabled aria-label="Identifier input, disabled while submitting">
          </div>
        </div>
      </div>
      <button class="btn-filled" disabled aria-busy="true" data-component-type="button" data-component-id="fpw_submit_button">
        <div class="btn-spinner" aria-hidden="true"></div>
        Sending...
      </button>
    </main>

    <div class="submitting-overlay" role="status" aria-live="polite" aria-label="Sending reset link"
         data-component-type="box" data-component-id="fpw_submitting_overlay">
      <div class="overlay-card">
        <div class="overlay-spinner" aria-hidden="true"></div>
        <span class="overlay-text">Sending reset link...</span>
        <span class="overlay-sub">This will only take a moment</span>
      </div>
    </div>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
