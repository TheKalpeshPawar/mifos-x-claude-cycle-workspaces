sibling: data-flow
schema_version: "4.0"
feature_id: business-insights
entries:
  - screen_id: business-insights
    trigger: on_mount
    endpoints:
      - get_accounts
    direction: read
    dtos:
      - name: OBReadAccount6
        role: response
        api_id: get_accounts
    produces_state: loading
    notes: "Resolves the authorised account list; Business scope is filtered client-side by Data.Account[].AccountCategory / AccountTypeCode (OBIE has no PFM-scope flag). Requires an authorised account-access consent (Status AUTH) + authorization-code token."
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: business-insights
    trigger: on_mount
    endpoints:
      - get_balances
    direction: read
    dtos:
      - name: OBReadBalance1
        role: response
        api_id: get_balances
    produces_state: loading
    notes: "Balance context (Data.Balance[].Amount.Amount / .Currency) for the in-scope account. Requires ReadBalances."
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: business-insights
    trigger: on_mount
    endpoints:
      - get_transactions
    direction: read
    dtos:
      - name: OBReadTransaction6
        role: response
        api_id: get_transactions
    produces_state: populated
    notes: >-
      Transactions for the in-scope account over the period window
      (fromBookingDateTime/toBookingDateTime). Cash-flow (Money In / Money Out / Net via
      Data.Transaction[].CreditDebitIndicator + Amount.Amount), the 8-category expense
      taxonomy, trends, and top counterparties are ALL DERIVED CLIENT-SIDE — OBIE has no
      insights/categorisation endpoint. Income credits are categorised but excluded from the
      expenses-only donut. Counterparty names follow MerchantDetails.MerchantName ->
      resolved Creditor/Debtor holder -> TransactionInformation (never a raw login).
      Zero transactions in window -> no_activity; no Business-scoped account -> empty.
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: business-insights
    trigger: on_interact
    event: SelectAccount
    endpoints:
      - get_balances
      - get_transactions
    direction: read
    dtos:
      - name: OBReadBalance1
        role: response
        api_id: get_balances
      - name: OBReadTransaction6
        role: response
        api_id: get_transactions
    produces_state: loading
    notes: "open_account_picker selects a different account; re-reads balances + transactions and re-derives cash-flow and categorisation client-side for the new AccountId."
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: business-insights
    trigger: on_interact
    event: SelectPeriod
    endpoints:
      - get_transactions
    direction: read
    dtos:
      - name: OBReadTransaction6
        role: response
        api_id: get_transactions
    produces_state: populated
    notes: "Period chip / custom range change re-issues get_transactions with new fromBookingDateTime/toBookingDateTime (or re-slices the cached list client-side within the consented window); cash-flow + categories are re-derived client-side."

  - screen_id: business-insights
    trigger: on_interact
    event: RetryLoad
    endpoints:
      - get_accounts
      - get_balances
      - get_transactions
    direction: read
    dtos:
      - name: OBReadAccount6
        role: response
        api_id: get_accounts
      - name: OBReadTransaction6
        role: response
        api_id: get_transactions
    produces_state: loading
    notes: "retry_load re-attempts the failed insights load from the error state."
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
