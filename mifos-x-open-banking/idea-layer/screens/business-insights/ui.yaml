states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - biz_account_selector
        - biz_period_selector_row
        - biz_period_label
      show_skeleton_list: true
      skeleton_count: 3
      skeleton_height: 120

  populated:
    layout:
      visible_components:
        - biz_account_selector
        - biz_period_selector_row
        - biz_period_label
        - biz_cash_flow_card
        - biz_cash_flow_row
        - biz_money_in
        - biz_money_out
        - biz_net
        - biz_expenses_title
        - biz_expense_donut_card
        - biz_category_payroll
        - biz_category_tax
        - biz_category_rent
        - biz_category_software
        - biz_category_insurance
        - biz_merchants_title
        - biz_merchants_card
        - biz_merchant_payroll

  empty:
    description: "No business accounts connected to the profile."
    layout:
      visible_components: []
      empty_message: "No business accounts"
      empty_detail: "Business insights appear once a business account is connected to your profile."
      empty_icon: storefront

  no_activity:
    description: "Business account selected but no transactions in the period."
    layout:
      visible_components:
        - biz_account_selector
        - biz_period_selector_row
        - biz_period_label
      empty_message: "No activity in this period"
      empty_detail: "Cash flow for this business account will appear once it has transactions in the selected period."
      empty_icon: storefront

  error:
    layout:
      visible_components: []
      error_message: "Could not load business insights"
      error_detail: "Check your connection and try again."
      retry_action: retry_load

# MVI state model — documents the shipped feature/business-insights ViewModel (8 VM tests green).
# Additive metadata: mirrors implemented behavior, introduces no component or contract change.
state_model:
  pattern: MVI
  initial_state: loading
  ui_state:
    fields:
      - name: phase
        type: "Enum<loading|populated|empty|no_activity|error>"
        description: "Drives which of the 5 declared states renders."
      - name: selectedAccount
        type: "BusinessAccount?"
        description: "BUSINESS-classified account in scope; null until first detail fetch resolves product_code."
      - name: businessAccounts
        type: "List<BusinessAccount>"
        description: "Accounts whose product_code resolved to BUSINESS via per-account detail fetch."
      - name: selectedPeriod
        type: "Period"
        description: "Reporting period (preset chip or custom range); all filtering is client-side."
      - name: moneyIn
        type: AmountOfMoney
        description: "Sum of credits in the period (cash-flow framing)."
      - name: moneyOut
        type: AmountOfMoney
        description: "Sum of debits in the period (cash-flow framing)."
      - name: net
        type: AmountOfMoney
        description: "moneyIn minus moneyOut."
      - name: expenseCategories
        type: "List<CategoryBreakdown>"
        description: "Debit totals over the 8-category business taxonomy (Payroll & Contractors, Tax, Rent & Facilities, Software & Subscriptions, Insurance, Treasury & Transfers, Income, Other). Income is computed but EXCLUDED from the donut, which is expenses-only."
      - name: topCounterparties
        type: "List<Counterparty>"
        description: "Aggregated by resolved counterparty display name (never the OBP login username)."
  intents:
    - name: LoadInsights
      from_states: [loading, error]
      to_states: [populated, empty, no_activity, error]
      api: [obp_account_detail, obp_transactions_list]
      description: "Resolve BUSINESS accounts via detail fetch, then fetch + categorise transactions for the selected account and period."
    - name: SelectAccount
      from_states: [populated, no_activity]
      to_states: [loading]
      action: open_account_picker
      description: "Switch the in-scope BUSINESS account; re-runs categorisation for the new account."
    - name: SelectPeriod
      from_states: [populated, no_activity]
      to_states: [loading]
      action: state_change
      target: selected_period
      description: "Change reporting period (preset or custom range); re-filters cached transactions client-side."
    - name: Retry
      from_states: [error]
      to_states: [loading]
      action: retry_load
      description: "Re-attempt the failed insights load."
  state_transitions:
    - from: loading
      to: populated
      when: "BUSINESS account in scope AND ≥1 transaction in period"
    - from: loading
      to: no_activity
      when: "BUSINESS account in scope AND zero transactions in period"
    - from: loading
      to: empty
      when: "No BUSINESS-classified account connected to the profile"
    - from: loading
      to: error
      when: "obp_account_detail or obp_transactions_list fails (401/404/network)"

# Per-component runtime states for the data-driven surfaces (donut + category rows + counterparties).
# Mirrors how the shipped composables render loading/error/empty without altering the component tree.
component_states:
  biz_cash_flow_card:
    loading: shimmer
    error: hidden
    empty: hidden
  biz_expense_donut_card:
    loading: shimmer
    error: hidden
    empty:
      message: "No expenses in this period"
      icon: pie_chart
    populated: data_bound
  biz_category_payroll: { loading: shimmer, error: hidden }
  biz_category_tax: { loading: shimmer, error: hidden }
  biz_category_rent: { loading: shimmer, error: hidden }
  biz_category_software: { loading: shimmer, error: hidden }
  biz_category_insurance: { loading: shimmer, error: hidden }
  biz_merchants_card:
    loading: shimmer
    error: hidden
    empty:
      message: "No counterparties in this period"
      icon: groups
    populated: data_bound
