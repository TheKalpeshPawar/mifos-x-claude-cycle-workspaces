<!doctype html>
<!-- render-hash: bi-loading-llm -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Insights — loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root {
  --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
  --secondary:#386663; --on-secondary:#FFFFFF; --secondary-container:#BCEBE7; --on-secondary-container:#00201E;
  --tertiary:#386663; --tertiary-container:#BCEBE7; --on-tertiary-container:#00201E;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --background:#F9FAEF; --on-background:#1A1C16;
  --surface:#FFFFFF; --on-surface:#1A1C16;
  --surface-variant:#E1E4D5; --on-surface-variant:#44483D;
  --surface-container:#F0F1E6; --surface-container-low:#F5F6EB;
  --outline:#75796C; --outline-variant:#C5C8BA;
  --pending:#E8A317; --nav-active-indicator:#DCE7C8;
  --shimmer-base:var(--surface-container-low); --shimmer-highlight:var(--surface-variant);
  --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px;
}
[data-theme="dark"] {
  --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
  --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
  --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
  --background:#12140E; --on-background:#E3E3D8;
  --surface:#1E201A; --on-surface:#E3E3D8;
  --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
  --surface-container:#2A2C24; --surface-container-low:#222419;
  --outline:#8F9285; --outline-variant:#44483D;
  --shimmer-base:#2A2C24; --shimmer-highlight:#35382E;
}
@media(prefers-color-scheme:dark){
  :root{
    --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
    --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
    --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
    --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
    --background:#12140E; --on-background:#E3E3D8;
    --surface:#1E201A; --on-surface:#E3E3D8;
    --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
    --surface-container:#2A2C24; --surface-container-low:#222419;
    --outline:#8F9285; --outline-variant:#44483D;
    --shimmer-base:#2A2C24; --shimmer-highlight:#35382E;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-style:normal;font-weight:normal;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased}
[data-shell="top-app-bar"]{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10;gap:4px}
.nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;min-width:44px;min-height:44px;border:none;background:transparent;border-radius:50%;cursor:pointer;color:var(--on-surface)}
.top-bar-title{font-size:22px;font-weight:400;color:var(--on-surface);flex:1;padding-left:4px}
[data-shell="content"]{flex:1;overflow-y:auto;padding-bottom:32px}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--shimmer-base) 25%,var(--shimmer-highlight) 50%,var(--shimmer-base) 75%);background-size:800px 100%;animation:shimmer 1.5s infinite linear}
.skel-chip{height:36px;width:200px;border-radius:999px}
.skel-chip-sm{height:36px;width:90px;border-radius:999px}
.skel-label{height:14px;width:80px;border-radius:4px;margin:4px 16px 8px}
.skel-card{border-radius:12px;margin:0 16px 12px;overflow:hidden;background:var(--surface-container-low)}
.skel-card-inner{padding:20px 16px}
.skel-period-row{display:flex;gap:8px;padding:8px 16px}
.cf-skel-row{display:flex;gap:8px;justify-content:space-between}
.cf-skel-item{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.skel-line-sm{height:10px;width:50px;border-radius:4px}
.skel-line-lg{height:22px;width:70px;border-radius:6px}
.section-skel-title{height:16px;width:140px;border-radius:4px;margin:12px 16px 8px}
.donut-skel-row{display:flex;gap:20px;align-items:center;padding:16px}
.skel-circle{width:110px;height:110px;border-radius:50%;flex-shrink:0}
.donut-skel-legend{flex:1;display:flex;flex-direction:column;gap:10px}
.skel-legend-row{display:flex;gap:8px;align-items:center}
.skel-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.skel-legend-name{height:12px;flex:1;border-radius:4px}
.skel-legend-val{height:12px;width:40px;border-radius:4px}
.merchant-skel-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--outline-variant)}
.merchant-skel-row:last-child{border-bottom:none}
.skel-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.skel-m-info{flex:1;display:flex;flex-direction:column;gap:6px}
.skel-m-line1{height:14px;width:60%;border-radius:4px}
.skel-m-line2{height:12px;width:40%;border-radius:4px}
.skel-m-amount{height:14px;width:64px;border-radius:4px}
.account-selector-row{padding:12px 16px 4px}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="business-insights" data-state="loading">

  <header data-shell="top-app-bar" role="banner">
    <button class="nav-btn"
            data-component-type="button" data-component-id="back_button" data-component-variant="icon"
            data-nav-to="home" aria-label="Back to home">
      <span class="material-symbols-outlined" style="font-size:var(--icon-md)">arrow_back</span>
    </button>
    <span class="top-bar-title">Business Insights</span>
  </header>

  <main data-shell="content" aria-busy="true" aria-label="Loading business insights">

    <div class="account-selector-row">
      <div data-component-type="LayoutBox" data-component-id="biz_account_selector" data-component-variant="skeleton"
           class="skel skel-chip" aria-hidden="true"></div>
    </div>

    <div data-component-type="LayoutBox" data-component-id="biz_period_selector_row" data-component-variant="skeleton"
         class="skel-period-row" aria-hidden="true">
      <div class="skel skel-chip-sm"></div>
      <div class="skel skel-chip-sm"></div>
      <div class="skel skel-chip-sm"></div>
      <div class="skel skel-chip-sm"></div>
    </div>

    <div data-component-type="LayoutBox" data-component-id="biz_period_label" data-component-variant="skeleton"
         class="skel skel-label" aria-hidden="true"></div>

    <div data-component-type="loading_indicator" data-component-id="biz_cash_flow_card" data-component-variant="skeleton_card"
         class="skel-card" aria-hidden="true">
      <div class="skel-card-inner">
        <div class="cf-skel-row">
          <div class="cf-skel-item">
            <div class="skel skel-line-sm"></div>
            <div class="skel skel-line-lg"></div>
          </div>
          <div class="cf-skel-item">
            <div class="skel skel-line-sm"></div>
            <div class="skel skel-line-lg"></div>
          </div>
          <div class="cf-skel-item">
            <div class="skel skel-line-sm"></div>
            <div class="skel skel-line-lg"></div>
          </div>
        </div>
      </div>
    </div>

    <div data-component-type="LayoutBox" data-component-id="biz_expenses_title" data-component-variant="skeleton"
         class="skel section-skel-title" aria-hidden="true"></div>

    <div data-component-type="loading_indicator" data-component-id="biz_expense_donut_card" data-component-variant="skeleton_card"
         class="skel-card" aria-hidden="true">
      <div class="donut-skel-row">
        <div class="skel skel-circle"></div>
        <div class="donut-skel-legend">
          <div class="skel-legend-row"><div class="skel skel-dot"></div><div class="skel skel-legend-name"></div><div class="skel skel-legend-val"></div></div>
          <div class="skel-legend-row"><div class="skel skel-dot"></div><div class="skel skel-legend-name"></div><div class="skel skel-legend-val"></div></div>
          <div class="skel-legend-row"><div class="skel skel-dot"></div><div class="skel skel-legend-name"></div><div class="skel skel-legend-val"></div></div>
          <div class="skel-legend-row"><div class="skel skel-dot"></div><div class="skel skel-legend-name"></div><div class="skel skel-legend-val"></div></div>
          <div class="skel-legend-row"><div class="skel skel-dot"></div><div class="skel skel-legend-name"></div><div class="skel skel-legend-val"></div></div>
        </div>
      </div>
    </div>

    <div data-component-type="LayoutBox" data-component-id="biz_merchants_title" data-component-variant="skeleton"
         class="skel section-skel-title" aria-hidden="true"></div>

    <div data-component-type="loading_indicator" data-component-id="biz_merchants_card" data-component-variant="skeleton_card"
         class="skel-card" aria-hidden="true">
      <div style="padding:4px 0">
        <div class="merchant-skel-row">
          <div class="skel skel-avatar"></div>
          <div class="skel-m-info"><div class="skel skel-m-line1"></div><div class="skel skel-m-line2"></div></div>
          <div class="skel skel-m-amount"></div>
        </div>
        <div class="merchant-skel-row">
          <div class="skel skel-avatar"></div>
          <div class="skel-m-info"><div class="skel skel-m-line1"></div><div class="skel skel-m-line2"></div></div>
          <div class="skel skel-m-amount"></div>
        </div>
        <div class="merchant-skel-row">
          <div class="skel skel-avatar"></div>
          <div class="skel-m-info"><div class="skel skel-m-line1"></div><div class="skel skel-m-line2"></div></div>
          <div class="skel skel-m-amount"></div>
        </div>
      </div>
    </div>

  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
