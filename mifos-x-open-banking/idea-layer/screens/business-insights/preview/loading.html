<!doctype html>

<html lang="en" data-screen="business-insights" data-state="loading" data-feature="business-insights" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Business Insights</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-md:24px;--primary:#4C662B;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--skeleton:#E1E4D5}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);min-height:100vh}main{padding-bottom:24px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.sk{background:var(--skeleton);border-radius:12px;position:relative;overflow:hidden}.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.45),transparent);animation:shimmer 1.4s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.sk-chip{height:34px;width:230px;border-radius:999px;margin:0 20px 16px}.sk-card{height:120px;margin:0 20px 14px}
[data-theme="light"]{--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--skeleton:#E1E4D5}[data-theme="dark"]{--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--skeleton:#2A2D24}@media (prefers-color-scheme:dark){:root{--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--skeleton:#2A2D24}}</style>
</head>
