<!doctype html>
<!-- render-hash: bi-empty-llm -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Insights — empty</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root {
  --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
  --secondary:#386663; --on-secondary:#FFFFFF; --secondary-container:#BCEBE7; --on-secondary-container:#00201E;
  --tertiary:#386663; --tertiary-container:#BCEBE7; --on-tertiary-container:#00201E;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --background:#F9FAEF; --on-background:#1A1C16;
  --surface:#FFFFFF; --on-surface:#1A1C16;
  --surface-variant:#E1E4D5; --on-surface-variant:#44483D;
  --surface-container:#F0F1E6; --surface-container-low:#F5F6EB;
  --outline:#75796C; --outline-variant:#C5C8BA;
  --pending:#E8A317; --nav-active-indicator:#DCE7C8;
  --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:64px;
}
[data-theme="dark"] {
  --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
  --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
  --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
  --background:#12140E; --on-background:#E3E3D8;
  --surface:#1E201A; --on-surface:#E3E3D8;
  --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
  --surface-container:#2A2C24; --surface-container-low:#222419;
  --outline:#8F9285; --outline-variant:#44483D;
}
@media(prefers-color-scheme:dark){
  :root{
    --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
    --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
    --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
    --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
    --background:#12140E; --on-background:#E3E3D8;
    --surface:#1E201A; --on-surface:#E3E3D8;
    --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
    --surface-container:#2A2C24; --surface-container-low:#222419;
    --outline:#8F9285; --outline-variant:#44483D;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-style:normal;font-weight:normal;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased}
[data-shell="top-app-bar"]{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10;gap:4px}
.nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;min-width:44px;min-height:44px;border:none;background:transparent;border-radius:50%;cursor:pointer;color:var(--on-surface)}
.top-bar-title{font-size:22px;font-weight:400;color:var(--on-surface);flex:1;padding-left:4px}
[data-shell="content"]{flex:1;overflow-y:auto;padding-bottom:32px;display:flex;align-items:center;justify-content:center}
.empty-container{display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 32px;text-align:center;max-width:320px}
.empty-icon-wrap{width:96px;height:96px;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center}
.empty-icon-wrap .material-symbols-outlined{font-size:var(--icon-2xl);color:var(--on-primary-container);font-variation-settings:'FILL' 1,'wght' 300,'GRAD' 0,'opsz' 48}
.empty-headline{font-size:20px;font-weight:600;color:var(--on-surface);line-height:1.3}
.empty-body{font-size:14px;color:var(--on-surface-variant);line-height:1.6}
.empty-cta{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:999px;border:none;background:var(--primary);color:var(--on-primary);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="business-insights" data-state="empty">

  <header data-shell="top-app-bar" role="banner">
    <button class="nav-btn"
            data-component-type="button" data-component-id="back_button" data-component-variant="icon"
            data-nav-to="home" aria-label="Back to home">
      <span class="material-symbols-outlined" style="font-size:var(--icon-md)">arrow_back</span>
    </button>
    <span class="top-bar-title">Business Insights</span>
  </header>

  <main data-shell="content">
    <div data-component-type="LayoutBox" data-component-id="biz_empty_state" data-component-variant="empty_state"
         class="empty-container" role="region" aria-label="No business accounts">

      <div class="empty-icon-wrap" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-label="Storefront icon" role="img">
          <rect x="8" y="28" width="48" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M8 28 L16 10 H48 L56 28" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round"/>
          <rect x="24" y="38" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="M8 28 H56" stroke="currentColor" stroke-width="2.5"/>
          <path d="M16 28 C16 32 20 36 24 36 C28 36 32 32 32 28" stroke="currentColor" stroke-width="2.5" fill="none"/>
          <path d="M32 28 C32 32 36 36 40 36 C44 36 48 32 48 28" stroke="currentColor" stroke-width="2.5" fill="none"/>
        </svg>
      </div>

      <h2 data-component-type="text" data-component-id="biz_empty_headline" data-component-variant="title_medium"
          class="empty-headline">No business accounts</h2>

      <p data-component-type="text" data-component-id="biz_empty_body" data-component-variant="body_medium"
         class="empty-body">Business insights appear once a business account is connected to your profile.</p>

      <button data-component-type="button" data-component-id="biz_empty_cta" data-component-variant="filled"
              data-nav-to="accounts" class="empty-cta"
              aria-label="Add a business account">
        <span class="material-symbols-outlined" style="font-size:var(--icon-sm)">add</span>
        Add business account
      </button>

    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
