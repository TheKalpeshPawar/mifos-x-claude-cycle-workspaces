<!doctype html>
<!-- render-hash: biz-empty-02 -->
<html lang="en" data-screen="business-insights" data-state="empty" data-feature="business-insights" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Business Insights</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-md:24px;--icon-empty:64px;--primary:#4C662B;--background:#F9FAEF;--on-background:#1A1C16;--on-surface-variant:#44483D;--outline:#75796C}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px;gap:8px}.empty .material-icons{font-size:var(--icon-empty);color:var(--outline)}.empty h2{font-size:18px;font-weight:600;margin-top:8px}.empty p{font-size:14px;color:var(--on-surface-variant);max-width:300px;line-height:1.5}
[data-theme="light"]{--background:#F9FAEF;--on-background:#1A1C16;--on-surface-variant:#44483D;--outline:#75796C}[data-theme="dark"]{--background:#12140E;--on-background:#E3E3D8;--on-surface-variant:#C5C8BA;--outline:#8F9285}@media (prefers-color-scheme:dark){:root{--background:#12140E;--on-background:#E3E3D8;--on-surface-variant:#C5C8BA;--outline:#8F9285}}</style>
</head>
<body>
<div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Business Insights</h1></div>
<div class="empty"><span class="material-icons" aria-hidden="true">storefront</span><h2>No business accounts</h2><p>Business insights appear once a business account is connected to your profile.</p></div>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
