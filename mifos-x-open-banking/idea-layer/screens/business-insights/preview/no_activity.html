<!doctype html>
<!-- render-hash: bi-no_activity-llm -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Insights — no activity</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root {
  --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
  --secondary:#386663; --on-secondary:#FFFFFF; --secondary-container:#BCEBE7; --on-secondary-container:#00201E;
  --tertiary:#386663; --tertiary-container:#BCEBE7; --on-tertiary-container:#00201E;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --background:#F9FAEF; --on-background:#1A1C16;
  --surface:#FFFFFF; --on-surface:#1A1C16;
  --surface-variant:#E1E4D5; --on-surface-variant:#44483D;
  --surface-container:#F0F1E6; --surface-container-low:#F5F6EB;
  --outline:#75796C; --outline-variant:#C5C8BA;
  --pending:#E8A317; --nav-active-indicator:#DCE7C8;
  --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:64px;
}
[data-theme="dark"] {
  --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
  --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
  --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
  --background:#12140E; --on-background:#E3E3D8;
  --surface:#1E201A; --on-surface:#E3E3D8;
  --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
  --surface-container:#2A2C24; --surface-container-low:#222419;
  --outline:#8F9285; --outline-variant:#44483D;
}
@media(prefers-color-scheme:dark){
  :root{
    --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
    --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
    --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
    --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
    --background:#12140E; --on-background:#E3E3D8;
    --surface:#1E201A; --on-surface:#E3E3D8;
    --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
    --surface-container:#2A2C24; --surface-container-low:#222419;
    --outline:#8F9285; --outline-variant:#44483D;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-style:normal;font-weight:normal;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased}
[data-shell="top-app-bar"]{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10;gap:4px}
.nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;min-width:44px;min-height:44px;border:none;background:transparent;border-radius:50%;cursor:pointer;color:var(--on-surface)}
.top-bar-title{font-size:22px;font-weight:400;color:var(--on-surface);flex:1;padding-left:4px}
[data-shell="content"]{flex:1;overflow-y:auto;padding-bottom:32px}
.account-selector-row{padding:12px 16px 4px}
[data-component-type="chip"]{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 12px;border-radius:999px;border:1px solid var(--outline);background:transparent;cursor:pointer;font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;color:var(--on-surface-variant);min-height:44px}
.period-row{display:flex;flex-direction:row;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.period-row::-webkit-scrollbar{display:none}
.period-chip{display:inline-flex;align-items:center;padding:6px 16px;border-radius:999px;border:1px solid var(--outline-variant);background:transparent;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;color:var(--on-surface-variant);cursor:pointer;white-space:nowrap;min-height:44px}
.period-chip.active{background:var(--primary-container);border-color:var(--primary-container);color:var(--on-primary-container)}
.period-label{font-size:13px;color:var(--on-surface-variant);padding:2px 16px 6px}
.no-activity-area{display:flex;align-items:center;justify-content:center;padding:48px 32px 32px;flex:1}
.no-activity-container{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:300px}
.no-activity-icon-wrap{width:88px;height:88px;border-radius:50%;background:var(--surface-container);display:flex;align-items:center;justify-content:center;border:2px solid var(--outline-variant)}
.no-activity-headline{font-size:18px;font-weight:600;color:var(--on-surface);line-height:1.3}
.no-activity-body{font-size:13px;color:var(--on-surface-variant);line-height:1.6}
.period-hint{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--primary);font-weight:500;cursor:pointer;min-height:44px;padding:4px 8px;border-radius:8px;background:transparent;border:none;font-family:'Outfit',sans-serif}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="business-insights" data-state="no_activity">

  <header data-shell="top-app-bar" role="banner">
    <button class="nav-btn"
            data-component-type="button" data-component-id="back_button" data-component-variant="icon"
            data-nav-to="home" aria-label="Back to home">
      <span class="material-symbols-outlined" style="font-size:var(--icon-md)">arrow_back</span>
    </button>
    <span class="top-bar-title">Business Insights</span>
  </header>

  <main data-shell="content">

    <!-- Account selector — visible in no_activity state -->
    <div class="account-selector-row">
      <button data-component-type="chip" data-component-id="biz_account_selector" data-component-variant="assist"
              data-action="open_account_picker" aria-label="Switch business account">
        <span class="material-symbols-outlined" style="font-size:var(--icon-sm)">business</span>
        TechStart Trading
        <span class="material-symbols-outlined" style="font-size:var(--icon-sm)">expand_more</span>
      </button>
    </div>

    <!-- Period selector row — visible in no_activity state -->
    <div data-component-type="LayoutBox" data-component-id="biz_period_selector_row" data-component-variant="horizontal_scroll"
         class="period-row" role="tablist" aria-label="Reporting period selector">
      <button class="period-chip active" data-component-type="chip" data-component-id="period_this_month" data-component-variant="filter"
              data-action="state_change" role="tab" aria-selected="true">This month</button>
      <button class="period-chip" data-component-type="chip" data-component-id="period_last_month" data-component-variant="filter"
              data-action="state_change" role="tab" aria-selected="false">Last month</button>
      <button class="period-chip" data-component-type="chip" data-component-id="period_q2" data-component-variant="filter"
              data-action="state_change" role="tab" aria-selected="false">Q2 2026</button>
      <button class="period-chip" data-component-type="chip" data-component-id="period_ytd" data-component-variant="filter"
              data-action="state_change" role="tab" aria-selected="false">Year to date</button>
    </div>

    <!-- Period label -->
    <p data-component-type="text" data-component-id="biz_period_label" data-component-variant="body_medium"
       class="period-label" aria-label="Selected reporting period: June 2026">June 2026</p>

    <!-- No activity empty state -->
    <div class="no-activity-area">
      <div data-component-type="LayoutBox" data-component-id="biz_no_activity_state" data-component-variant="empty_state"
           class="no-activity-container" role="region" aria-label="No activity in this period">

        <div class="no-activity-icon-wrap" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-label="No activity chart icon" role="img">
            <rect x="6" y="32" width="8" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.35"/>
            <rect x="20" y="24" width="8" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.35"/>
            <rect x="34" y="16" width="8" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.35"/>
            <line x1="8" y1="44" x2="40" y2="44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="24" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="22" y1="20" x2="22" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="24" y1="20" x2="27" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <h2 data-component-type="text" data-component-id="biz_no_activity_headline" data-component-variant="title_medium"
            class="no-activity-headline">No activity this period</h2>

        <p data-component-type="text" data-component-id="biz_no_activity_body" data-component-variant="body_medium"
           class="no-activity-body">Cash flow for this business account will appear once it has transactions in the selected period.</p>

        <button data-component-type="button" data-component-id="biz_change_period_hint" data-component-variant="text"
                data-action="state_change" class="period-hint"
                aria-label="Try a different period">
          <span class="material-symbols-outlined" style="font-size:var(--icon-sm)">calendar_month</span>
          Try a different period
        </button>

      </div>
    </div>

  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
