<!doctype html>
<!-- render-hash: biz-no_activity-01 -->
<html lang="en" data-screen="business-insights" data-state="no_activity" data-feature="business-insights" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Business Insights</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-sm:20px;--icon-md:24px;--icon-empty:64px;--primary:#4C662B;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--primary-container:#CDEDA3;--on-primary-container:#102000}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.acct-chip{display:inline-flex;align-items:center;gap:6px;margin:0 20px 12px;padding:8px 14px;border-radius:999px;border:1px solid var(--outline-variant);background:var(--surface);color:var(--on-surface);font-size:13px;font-weight:600;cursor:pointer}.acct-chip .material-icons{font-size:var(--icon-sm);color:var(--on-surface-variant)}
.period-chips{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}.period-chips::-webkit-scrollbar{display:none}.chip{flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--outline-variant);background:var(--surface);color:var(--on-surface-variant)}.chip.active{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:8px}.empty .material-icons{font-size:var(--icon-empty);color:var(--outline)}.empty h2{font-size:18px;font-weight:600;margin-top:8px}.empty p{font-size:14px;color:var(--on-surface-variant);max-width:300px;line-height:1.5}
[data-theme="light"]{--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--primary-container:#CDEDA3;--on-primary-container:#102000}[data-theme="dark"]{--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--primary-container:#354E16;--on-primary-container:#CDEDA3}@media (prefers-color-scheme:dark){:root{--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--on-surface:#E3E3D8;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--primary-container:#354E16;--on-primary-container:#CDEDA3}}</style>
</head>
<body>
<div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Business Insights</h1></div>
<button class="acct-chip" data-action="open_account_picker" tabindex="0" aria-label="Switch business account">TechStart — Business Current GBP<span class="material-icons">expand_more</span></button>
<div class="period-chips"><button class="chip" data-action="select_period" data-period="week" tabindex="0">Week</button><button class="chip active" data-action="select_period" data-period="month" tabindex="0">June 2026</button><button class="chip" data-action="select_period" data-period="quarter" tabindex="0">Quarter</button><button class="chip" data-action="select_period" data-period="year" tabindex="0">Year</button></div>
<div class="empty"><span class="material-icons" aria-hidden="true">storefront</span><h2>No activity in this period</h2><p>Cash flow for this business account will appear once it has transactions in the selected period.</p></div>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
