<!doctype html>
<!-- render-hash: biz-error-02 -->
<html lang="en" data-screen="business-insights" data-state="error" data-feature="business-insights" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Business Insights</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-md:24px;--icon-empty:64px;--primary:#4C662B;--on-primary:#FFFFFF;--background:#F9FAEF;--on-background:#1A1C16;--on-surface-variant:#44483D;--error:#BA1A1A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.error{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px;gap:10px}.error .material-icons{font-size:var(--icon-empty);color:var(--error)}.error h2{font-size:18px;font-weight:600;margin-top:8px}.error p{font-size:14px;color:var(--on-surface-variant);max-width:300px;line-height:1.5}
.retry-btn{margin-top:12px;padding:12px 28px;border:none;border-radius:999px;background:var(--primary);color:var(--on-primary);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;min-height:48px}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--background:#F9FAEF;--on-background:#1A1C16;--on-surface-variant:#44483D;--error:#BA1A1A}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--on-surface-variant:#C5C8BA;--error:#FFB4AB}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--background:#12140E;--on-background:#E3E3D8;--on-surface-variant:#C5C8BA;--error:#FFB4AB}}</style>
</head>
<body>
<div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Business Insights</h1></div>
<div class="error"><span class="material-icons" aria-hidden="true">error_outline</span><h2>Could not load business insights</h2><p>Check your connection and try again.</p><button class="retry-btn" data-action="retry_load" tabindex="0">Retry</button></div>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
