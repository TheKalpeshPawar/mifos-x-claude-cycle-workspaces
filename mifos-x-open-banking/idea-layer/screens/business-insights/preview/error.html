<!doctype html>
<!-- render-hash: bi-error-llm -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Insights — error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root {
  --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000;
  --secondary:#386663; --on-secondary:#FFFFFF; --secondary-container:#BCEBE7; --on-secondary-container:#00201E;
  --tertiary:#386663; --tertiary-container:#BCEBE7; --on-tertiary-container:#00201E;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --background:#F9FAEF; --on-background:#1A1C16;
  --surface:#FFFFFF; --on-surface:#1A1C16;
  --surface-variant:#E1E4D5; --on-surface-variant:#44483D;
  --surface-container:#F0F1E6; --surface-container-low:#F5F6EB;
  --outline:#75796C; --outline-variant:#C5C8BA;
  --pending:#E8A317; --nav-active-indicator:#DCE7C8;
  --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:64px;
}
[data-theme="dark"] {
  --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
  --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
  --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
  --background:#12140E; --on-background:#E3E3D8;
  --surface:#1E201A; --on-surface:#E3E3D8;
  --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
  --surface-container:#2A2C24; --surface-container-low:#222419;
  --outline:#8F9285; --outline-variant:#44483D;
}
@media(prefers-color-scheme:dark){
  :root{
    --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3;
    --secondary:#A0CFCB; --on-secondary:#003735; --secondary-container:#1F4E4B; --on-secondary-container:#BCEBE7;
    --tertiary:#A0CFCB; --tertiary-container:#1F4E4B; --on-tertiary-container:#BCEBE7;
    --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
    --background:#12140E; --on-background:#E3E3D8;
    --surface:#1E201A; --on-surface:#E3E3D8;
    --surface-variant:#44483D; --on-surface-variant:#C5C8BA;
    --surface-container:#2A2C24; --surface-container-low:#222419;
    --outline:#8F9285; --outline-variant:#44483D;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-style:normal;font-weight:normal;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased}
[data-shell="top-app-bar"]{display:flex;align-items:center;height:64px;padding:0 4px;background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10;gap:4px}
.nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;min-width:44px;min-height:44px;border:none;background:transparent;border-radius:50%;cursor:pointer;color:var(--on-surface)}
.top-bar-title{font-size:22px;font-weight:400;color:var(--on-surface);flex:1;padding-left:4px}
[data-shell="content"]{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.error-container{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:300px}
.error-icon-wrap{width:88px;height:88px;border-radius:50%;background:var(--error-container);display:flex;align-items:center;justify-content:center}
.error-icon-wrap .material-symbols-outlined{font-size:var(--icon-2xl);color:var(--on-error-container);font-variation-settings:'FILL' 1,'wght' 300,'GRAD' 0,'opsz' 48}
.error-headline{font-size:18px;font-weight:600;color:var(--on-surface);line-height:1.3}
.error-body{font-size:14px;color:var(--on-surface-variant);line-height:1.6}
.error-detail-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;background:var(--surface-container);font-size:12px;color:var(--on-surface-variant);font-family:'Outfit',sans-serif}
.retry-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:999px;border:1px solid var(--primary);background:transparent;color:var(--primary);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="business-insights" data-state="error">

  <header data-shell="top-app-bar" role="banner">
    <button class="nav-btn"
            data-component-type="button" data-component-id="back_button" data-component-variant="icon"
            data-nav-to="home" aria-label="Back to home">
      <span class="material-symbols-outlined" style="font-size:var(--icon-md)">arrow_back</span>
    </button>
    <span class="top-bar-title">Business Insights</span>
  </header>

  <main data-shell="content" role="main">
    <div data-component-type="LayoutBox" data-component-id="biz_error_state" data-component-variant="error_state"
         class="error-container" role="region" aria-label="Error loading business insights">

      <div class="error-icon-wrap" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-label="Error icon" role="img">
          <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
          <line x1="24" y1="14" x2="24" y2="26" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="24" cy="32" r="2" fill="currentColor"/>
        </svg>
      </div>

      <h2 data-component-type="text" data-component-id="biz_error_headline" data-component-variant="title_medium"
          class="error-headline">Could not load business insights</h2>

      <p data-component-type="text" data-component-id="biz_error_body" data-component-variant="body_medium"
         class="error-body">Check your connection and try again.</p>

      <div class="error-detail-chip" aria-label="Error detail: account access consent is no longer authorised">
        <span class="material-symbols-outlined" style="font-size:var(--icon-xs)">lock</span>
        Account consent expired
      </div>

      <button data-component-type="button" data-component-id="biz_retry_btn" data-component-variant="outlined"
              data-action="retry_load" class="retry-btn"
              aria-label="Retry loading business insights">
        <span class="material-symbols-outlined" style="font-size:var(--icon-sm)">refresh</span>
        Retry
      </button>

    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
