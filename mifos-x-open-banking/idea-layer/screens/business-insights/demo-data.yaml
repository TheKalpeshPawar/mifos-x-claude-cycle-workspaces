sibling: demo-data
schema_version: "4.0"
feature_id: business-insights

# OBIE AIS data backing business-insights. Business scope is filtered client-side by
# AccountCategory=Business. Cash-flow (Money In / Money Out / Net), the expense category
# taxonomy, trends, and top counterparties are ALL derived client-side from the transaction
# list — OBIE has no insights endpoint. June 2026 window. Income credits are categorised but
# excluded from the expenses-only donut. Counterparty names follow MerchantName -> resolved
# holder -> TransactionInformation (never a raw login).
collections:
  # GET /aisp/accounts — business-scoped accounts (AccountCategory=Business).
  accounts:
    dto: OBReadAccount6
    description: "Authorised account list; Business-scoped accounts drive the insights account picker."
    item:
      Data:
        Account:
          - AccountId: "acc-biz-1001"
            Status: "Enabled"
            Currency: "GBP"
            AccountCategory: "Business"
            AccountTypeCode: "CurrentAccount"
            Nickname: "TechStart Trading"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "404856 38112207"
                Name: "TechStart Ltd"
          - AccountId: "acc-biz-1002"
            Status: "Enabled"
            Currency: "GBP"
            AccountCategory: "Business"
            AccountTypeCode: "Savings"
            Nickname: "TechStart Reserve"
            Account:
              - SchemeName: "UK.OBIE.SortCodeAccountNumber"
                Identification: "404856 38112214"
                Name: "TechStart Ltd"
      Links: { Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts" }
      Meta: { TotalPages: 1 }

  # GET /aisp/accounts/{AccountId}/balances — InterimAvailable for the in-scope business account.
  balances:
    dto: OBReadBalance1
    description: "Available balance context for the in-scope business account."
    item:
      Data:
        Balance:
          - AccountId: "acc-biz-1001"
            CreditDebitIndicator: "Credit"
            Type: "InterimAvailable"
            DateTime: "2026-06-30T23:59:59.000Z"
            Amount: { Amount: "48184.00", Currency: "GBP" }
      Links: { Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp/accounts/acc-biz-1001/balances" }
      Meta: { TotalPages: 1 }

