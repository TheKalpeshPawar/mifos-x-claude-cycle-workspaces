  # OBErrorResponse1 — 403 InvalidConsentStatus driving the insights error state.
  load_error:
    description: "Representative 403 OBErrorResponse1 for an expired/revoked consent on the insights load."
    item:
      Code: "403 Forbidden"
      Id: "biz-insights-err-403-2b90"
      Message: "Forbidden"
      Errors:
        - ErrorCode: "UK.OBIE.Resource.InvalidConsentStatus"
          Message: "The account-access consent is no longer in an authorised state."
