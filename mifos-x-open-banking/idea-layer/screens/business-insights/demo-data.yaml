  # DERIVED VIEW (client-side, no DTO) — cash-flow framing cards.
  cashflow_summary:
    description: "Money In / Money Out / Net for the period — derived from CreditDebitIndicator + Amount over the transaction list."
    item:
      period_label: "June 2026"
      base_currency: "GBP"
      money_in: "26800.00"
      money_out: "12116.00"
      net: "14684.00"

  # DERIVED VIEW (client-side, no DTO) — expenses-only category donut (income excluded).
  expense_categories:
    description: "Client-side expense taxonomy over the period — drives the expenses-only donut. Income credits excluded."
    item:
      period_label: "June 2026"
      base_currency: "GBP"
      total_expense: "12116.00"
      categories:
        - { category_id: "payroll", label: "Payroll", amount: "8500.00", percent: 70.2, txn_count: 1 }
        - { category_id: "rent", label: "Office & Rent", amount: "2500.00", percent: 20.6, txn_count: 1 }
