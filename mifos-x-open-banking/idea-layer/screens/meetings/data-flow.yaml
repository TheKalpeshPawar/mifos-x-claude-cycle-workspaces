sibling: data-flow
schema_version: "4.0"
feature_id: meetings

entries:
  - screen_id: meetings
    trigger: on_mount
    endpoints:
      - obp_get_meetings
    direction: read
    dtos:
      - name: Meeting
        role: response
        api_id: obp_get_meetings
      - name: MeetingInvitee
        role: response
        api_id: obp_get_meetings
    produces_state: content
    error_paths:
      - error_code: "400"
        behavior: show_error_banner
      - error_code: "401"
        behavior: redirect_to_login
      - error_code: "404"
        behavior: show_empty_state

  - screen_id: meetings
    trigger: on_interact
    event: MeetingScheduled
    endpoints:
      - obp_create_meeting
    direction: write
    dtos:
      - name: Meeting
        role: request
        api_id: obp_create_meeting
      - name: MeetingInvitee
        role: request
        api_id: obp_create_meeting
      - name: Meeting
        role: response
        api_id: obp_create_meeting
    produces_state: content
    error_paths:
      - error_code: "400"
        behavior: show_inline_validation_error
      - error_code: "401"
        behavior: redirect_to_login
      - error_code: "404"
        behavior: show_error_banner

  - screen_id: meetings
    trigger: on_interact
    event: DaySelected
    endpoints: []
    direction: read
    dtos: []
    produces_state: content
    error_paths: []
