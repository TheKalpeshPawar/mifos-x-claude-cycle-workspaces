<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Meetings — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;
  --background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --text-primary:#1A1C16;--text-secondary:#44483D;
  --tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;
  --nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font)}
main{display:flex;flex-direction:column;min-height:844px;padding-bottom:96px}

@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
.shim{background:linear-gradient(90deg,var(--surface-variant) 25%,#f0f2e8 50%,var(--surface-variant) 75%);background-size:780px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}

.title-shim{height:32px;width:200px;margin:20px 16px 12px;border-radius:8px}
.week-strip-shim{display:flex;gap:4px;justify-content:space-between;padding:0 12px 12px}
.day-shim{height:52px;width:46px;border-radius:12px}
.btn-shim-sm{height:20px;width:60px;margin:0 16px 4px;border-radius:6px}
.sec-shim{height:16px;width:160px;margin:8px 16px 10px;border-radius:6px}
.card-shim{border-radius:12px;margin:0 16px 10px}
</style>
</head>
<body>
<main data-screen="meetings" data-state="loading" role="main" aria-busy="true" aria-label="Loading meetings">

  <div class="shim title-shim"></div>

  <div class="week-strip-shim">
    <div class="shim day-shim"></div>
    <div class="shim day-shim"></div>
    <div class="shim day-shim"></div>
    <div class="shim day-shim"></div>
    <div class="shim day-shim"></div>
    <div class="shim day-shim" style="opacity:.5"></div>
    <div class="shim day-shim" style="opacity:.5"></div>
  </div>

  <div class="shim btn-shim-sm"></div>
  <div class="shim sec-shim"></div>

  <div class="shim card-shim" style="height:110px"></div>
  <div class="shim card-shim" style="height:84px"></div>
  <div class="shim card-shim" style="height:84px;opacity:.75"></div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
