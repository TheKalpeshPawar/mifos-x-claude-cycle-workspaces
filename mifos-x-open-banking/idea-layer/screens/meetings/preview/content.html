<!doctype html>
<html lang="en" data-screen="meetings" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 96px;
      overflow-y: auto;
    }
    .material-icons { font-family: 'Material Icons'; font-style: normal; }
    .page-title { font-size: 28px; font-weight: 700; color: var(--primary); padding: 20px 16px 12px; }
    .week-strip { display: flex; gap: 4px; padding: 0 12px 12px; justify-content: space-between; }
    .day-cell {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 10px; border-radius: 12px; background: var(--background);
      cursor: pointer; border: none; font-family: 'Outfit', sans-serif; flex: 1;
    }
    .day-cell:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .day-cell.selected { background: var(--primary); }
    .day-lbl { font-size: 11px; color: var(--on-surface-variant); margin-bottom: 2px; }
    .day-cell.selected .day-lbl { color: var(--primary-container); }
    .day-num { font-size: 16px; font-weight: 600; color: var(--on-surface); }
    .day-cell.selected .day-num { color: var(--surface); font-weight: 700; }
    .day-cell.weekend .day-lbl,
    .day-cell.weekend .day-num { color: var(--outline); }
    .today-btn { background: none; border: none; color: var(--primary); font-size: 14px; font-weight: 600; font-family: 'Outfit', sans-serif; padding: 0 16px 4px; cursor: pointer; }
    .today-btn:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .section-count { font-size: 16px; font-weight: 600; color: var(--on-surface); padding: 8px 16px 10px; }
    .meeting-card {
      background: var(--surface); border-radius: 12px; padding: 16px;
      margin: 0 16px 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      cursor: pointer; border-left: 4px solid transparent;
    }
    .meeting-card:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .meeting-time-lbl { font-size: 14px; font-weight: 700; }
    .type-chip { border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: 600; }
    .meeting-title-t { font-size: 15px; font-weight: 700; color: var(--on-surface); margin-bottom: 2px; }
    .meeting-meta { font-size: 13px; color: var(--on-surface-variant); margin-bottom: 10px; }
    .card-actions { display: flex; gap: 8px; }
    .btn-filled {
      background: var(--primary); color: var(--on-primary); border: none;
      border-radius: 8px; padding: 6px 16px; font-size: 13px; font-weight: 600;
      font-family: 'Outfit', sans-serif; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-filled:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-outlined {
      background: transparent; color: var(--primary); border: 1px solid var(--primary);
      border-radius: 8px; padding: 6px 16px; font-size: 13px; font-weight: 600;
      font-family: 'Outfit', sans-serif; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-outlined:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .fab {
      position: fixed; bottom: 76px;
      right: max(16px, calc(50vw - 179px));
      background: var(--primary); color: var(--on-primary); border: none;
      border-radius: 16px; padding: 14px 20px; font-size: 14px; font-weight: 600;
      font-family: 'Outfit', sans-serif; cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.24);
      display: flex; align-items: center; gap: 8px; z-index: 50;
    }
    .fab:focus { outline: 2px solid var(--primary); outline-offset: 3px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 390px; background: var(--surface);
      border-top: 1px solid var(--outline-variant);
      display: flex; justify-content: space-around;
      padding: 8px 0 12px; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 4px 10px; cursor: pointer; border: none; background: none;
      font-family: 'Outfit', sans-serif; font-size: 11px; color: var(--outline);
    }
    .nav-item.active { color: var(--primary); }
    .nav-item .material-icons { font-size: 24px; }
  </style>
</head>
<body>
  <main>

  <div
    data-component-type="text"
    data-component-id="meetings_title"
    class="page-title"
    role="heading"
    aria-level="1"
    aria-label="Meetings for May 2026"
  >Meetings · May 2026</div>

  <!-- Week strip calendar -->
  <div
    data-component-type="stack"
    data-component-id="week_strip_calendar"
    class="week-strip"
    role="tablist"
    aria-label="Week calendar strip, select a day"
  >
    <button data-component-type="box" data-component-id="day_mon" class="day-cell" data-action="select_day" role="tab" tabindex="0" aria-label="Monday 19, no meetings" aria-selected="false">
      <span data-component-type="text" data-component-id="day_mon_label" class="day-lbl">Mon</span>
      <span data-component-type="text" data-component-id="day_mon_date" class="day-num">19</span>
    </button>
    <button data-component-type="box" data-component-id="day_tue" class="day-cell" data-action="select_day" role="tab" tabindex="0" aria-label="Tuesday 20, 1 meeting" aria-selected="false">
      <span data-component-type="text" data-component-id="day_tue_label" class="day-lbl">Tue</span>
      <span data-component-type="text" data-component-id="day_tue_date" class="day-num">20</span>
    </button>
    <button data-component-type="box" data-component-id="day_wed" class="day-cell selected" data-action="select_day" role="tab" tabindex="0" aria-label="Wednesday 21, selected, 2 meetings" aria-selected="true">
      <span data-component-type="text" data-component-id="day_wed_label" class="day-lbl">Wed</span>
      <span data-component-type="text" data-component-id="day_wed_date" class="day-num">21</span>
    </button>
    <button data-component-type="box" data-component-id="day_thu" class="day-cell" data-action="select_day" role="tab" tabindex="0" aria-label="Thursday 22, 1 meeting" aria-selected="false">
      <span data-component-type="text" data-component-id="day_thu_label" class="day-lbl">Thu</span>
      <span data-component-type="text" data-component-id="day_thu_date" class="day-num">22</span>
    </button>
    <button data-component-type="box" data-component-id="day_fri" class="day-cell" data-action="select_day" role="tab" tabindex="0" aria-label="Friday 23, no meetings" aria-selected="false">
      <span data-component-type="text" data-component-id="day_fri_label" class="day-lbl">Fri</span>
      <span data-component-type="text" data-component-id="day_fri_date" class="day-num">23</span>
    </button>
    <button data-component-type="box" data-component-id="day_sat" class="day-cell weekend" data-action="select_day" role="tab" tabindex="0" aria-label="Saturday 24, no meetings" aria-selected="false">
      <span data-component-type="text" data-component-id="day_sat_label" class="day-lbl">Sat</span>
      <span data-component-type="text" data-component-id="day_sat_date" class="day-num">24</span>
    </button>
    <button data-component-type="box" data-component-id="day_sun" class="day-cell weekend" data-action="select_day" role="tab" tabindex="0" aria-label="Sunday 25, no meetings" aria-selected="false">
      <span data-component-type="text" data-component-id="day_sun_label" class="day-lbl">Sun</span>
      <span data-component-type="text" data-component-id="day_sun_date" class="day-num">25</span>
    </button>
  </div>

  <button
    data-component-type="button"
    data-component-id="today_button"
    data-action="jump_to_today"
    class="today-btn"
    aria-label="Jump to today in the calendar"
    tabindex="0"
  >Today</button>

  <div
    data-component-type="text"
    data-component-id="upcoming_section_header"
    class="section-count"
    role="heading"
    aria-level="2"
    aria-label="Upcoming: 3 meetings this week"
  >3 meetings this week</div>

  <!-- Meeting card 1: Online -->
  <div
    data-component-type="box"
    data-component-id="meeting_card_1"
    class="meeting-card"
    data-action="view_meeting_detail"
    role="button"
    tabindex="0"
    aria-label="10:00 AM Account Opening Meeting with John Mwangi, 1 hour, Online Google Meet"
    style="border-left-color:var(--primary);"
  >
    <div data-component-type="stack" data-component-id="meeting_1_header" class="card-header">
      <span data-component-type="text" data-component-id="meeting_1_time" class="meeting-time-lbl" style="color:var(--primary);">10:00 AM</span>
      <span data-component-type="box" data-component-id="meeting_1_type_chip" class="type-chip" role="status" aria-label="Online meeting" style="background:var(--primary-container);color:var(--primary);">
        <span data-component-type="text" data-component-id="meeting_1_type_text">Online</span>
      </span>
    </div>
    <div data-component-type="text" data-component-id="meeting_1_title" class="meeting-title-t">Account Opening Meeting</div>
    <div data-component-type="text" data-component-id="meeting_1_customer" class="meeting-meta">John Mwangi · 1 hr · Google Meet</div>
    <div data-component-type="stack" data-component-id="meeting_1_actions" class="card-actions">
      <button
        data-component-type="button"
        data-component-id="meeting_1_join_button"
        data-action="join_meeting"
        class="btn-filled"
        aria-label="Join Account Opening Meeting on Google Meet"
        tabindex="0"
      >
        <span class="material-icons" style="font-size:16px;" aria-hidden="true">video_call</span>Join
      </button>
      <button
        data-component-type="button"
        data-component-id="meeting_1_notes_button"
        data-action="view_meeting_detail"
        class="btn-outlined"
        aria-label="View or add notes for this meeting"
        tabindex="0"
      >
        <span class="material-icons" style="font-size:16px;" aria-hidden="true">note</span>Notes
      </button>
    </div>
  </div>

  <!-- Meeting card 2: In-Person -->
  <div
    data-component-type="box"
    data-component-id="meeting_card_2"
    class="meeting-card"
    data-action="view_meeting_detail"
    role="button"
    tabindex="0"
    aria-label="2:00 PM KYC Review with Sarah Odhiambo, 30 minutes, Nairobi Branch"
    style="border-left-color:var(--secondary);"
  >
    <div data-component-type="stack" data-component-id="meeting_2_header" class="card-header">
      <span data-component-type="text" data-component-id="meeting_2_time" class="meeting-time-lbl" style="color:var(--secondary);">2:00 PM</span>
      <span data-component-type="box" data-component-id="meeting_2_type_chip" class="type-chip" role="status" aria-label="In-person meeting" style="background:#DCE7C8;color:var(--secondary);">
        <span data-component-type="text" data-component-id="meeting_2_type_text">In-Person</span>
      </span>
    </div>
    <div data-component-type="text" data-component-id="meeting_2_title" class="meeting-title-t">KYC Review</div>
    <div data-component-type="text" data-component-id="meeting_2_customer" class="meeting-meta">Sarah Odhiambo · 30 min · Nairobi Branch, Kimathi St</div>
  </div>

  <!-- Meeting card 3: Phone / Tomorrow -->
  <div
    data-component-type="box"
    data-component-id="meeting_card_3"
    class="meeting-card"
    data-action="view_meeting_detail"
    role="button"
    tabindex="0"
    aria-label="Tomorrow 11:00 AM New Prospect introductory call with Peter Kamau"
    style="border-left-color:var(--warning);"
  >
    <div data-component-type="stack" data-component-id="meeting_3_header" class="card-header">
      <span data-component-type="text" data-component-id="meeting_3_time" class="meeting-time-lbl" style="color:var(--warning);">Tomorrow · 11:00 AM</span>
      <span data-component-type="box" data-component-id="meeting_3_type_chip" class="type-chip" role="status" aria-label="Phone call" style="background:var(--primary-container);color:var(--warning);">
        <span data-component-type="text" data-component-id="meeting_3_type_text">Phone</span>
      </span>
    </div>
    <div data-component-type="text" data-component-id="meeting_3_title" class="meeting-title-t">New Prospect — Introductory Call</div>
    <div data-component-type="text" data-component-id="meeting_3_customer" class="meeting-meta">Peter Kamau · Referral from Equity Bank</div>
  </div>

  <!-- FAB -->
  <button
    data-component-type="button"
    data-component-id="schedule_meeting_fab"
    data-action="schedule_meeting"
    class="fab"
    aria-label="Schedule a new meeting"
    tabindex="0"
  >
    <span class="material-icons" aria-hidden="true">add</span>
    Schedule Meeting
  </button>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" data-shell="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" data-nav-to="fo-dashboard" aria-label="Dashboard">
      <span class="material-icons">dashboard</span>Dashboard
    </button>
    <button class="nav-item active" data-nav-to="meetings" aria-label="Meetings" aria-current="page">
      <span class="material-icons">event</span>Meetings
    </button>
    <button class="nav-item" data-nav-to="kyc-review" aria-label="KYC Review">
      <span class="material-icons">verified_user</span>KYC
    </button>
    <button class="nav-item" data-nav-to="customer-search" aria-label="Customers">
      <span class="material-icons">people</span>Customers
    </button>
    <button class="nav-item" data-nav-to="profile" aria-label="Profile">
      <span class="material-icons">account_circle</span>Profile
    </button>
  </nav>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
