<html lang="en" data-screen="meetings" data-state="error" data-feature="meetings" data-flavor="fieldOfficer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetings — Error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3;
    --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px;
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701;
    --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 72px; }
  .top-bar { padding: 14px 16px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .error-banner { display: flex; align-items: flex-start; gap: 10px; margin: 8px 16px 16px; padding: 12px 14px; background: var(--error-container); color: var(--on-error-container); border-radius: var(--radius-soft); border-left: 4px solid var(--error); }
  .error-banner .material-icons { font-size: var(--icon-sm); color: var(--error); flex-shrink: 0; }
  .error-banner p { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .error-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 32px 48px; }
  .error-icon { width: 96px; height: 96px; border-radius: 48px; background: var(--error-container); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .error-icon .material-icons { font-size: var(--icon-2xl); color: var(--error); }
  .error-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; }
  .error-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 28px; line-height: 1.45; max-width: 300px; }
  .retry-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; background: var(--primary); color: var(--on-primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
  .retry-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .retry-btn .material-icons { font-size: var(--icon-sm); }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--outline-variant); padding: 6px 0 10px; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
  <header class="top-bar" data-shell="top-bar"><h1>Meetings · May 2026</h1></header>

  <div class="error-banner" role="alert">
    <span class="material-icons" aria-hidden="true">error_outline</span>
    <p>Could not load schedule. Please try again.</p>
  </div>

  <main class="error-wrap" role="region" aria-live="assertive">
    <div class="error-icon" aria-hidden="true"><span class="material-icons">cloud_off</span></div>
    <h2 class="error-title">Could not load meetings</h2>
    <p class="error-msg">Check your network connection and try again. Your draft meetings remain saved locally.</p>
    <button class="retry-btn" data-action="retry_load_meetings" aria-label="Retry loading meetings"><span class="material-icons">refresh</span>Try Again</button>
  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" aria-label="Primary navigation">

    <a class="nav-item" data-nav-to="customer-search" tabindex="0"><span class="material-icons">people</span>Customers</a>
    <a class="nav-item" data-nav-to="account-applications" tabindex="0"><span class="material-icons">description</span>Applications</a>
    <a class="nav-item" data-nav-to="customer-messages" tabindex="0"><span class="material-icons">mail</span>Messages</a>
    <a class="nav-item" data-nav-to="settings" tabindex="0"><span class="material-icons">more_vert</span>More</a>
  </nav>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
