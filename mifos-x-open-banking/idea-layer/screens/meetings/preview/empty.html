<!doctype html>

<html lang="en" data-screen="meetings" data-state="empty" data-feature="meetings" data-flavor="fieldOfficer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetings — None Scheduled</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
    --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
    --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA;
    --radius-soft: 12px;
    --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
  }
  [data-theme="dark"] {
    --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
    --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
    --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1A1C16; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 72px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .week-strip { display: flex; gap: 6px; padding: 4px 12px 16px; }
  .day-pill { flex: 1; padding: 8px 4px; border-radius: var(--radius-soft); background: var(--surface); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .day-pill .label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.4px; }
  .day-pill .date { font-size: 16px; font-weight: 600; color: var(--on-background); margin-top: 2px; }
  .day-pill.selected { background: var(--primary); }
  .day-pill.selected .label { color: var(--primary-container); }
  .day-pill.selected .date { color: var(--on-primary); font-weight: 700; }
  .empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 32px 48px; }
  .empty-icon { width: 96px; height: 96px; border-radius: 48px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .empty-icon .material-icons { font-size: var(--icon-2xl); color: var(--on-primary-container); }
  .empty-title { font-size: 20px; font-weight: 700; color: var(--on-background); margin-bottom: 8px; line-height: 1.3; }
  .empty-msg { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 28px; line-height: 1.45; max-width: 280px; }
  .cta-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 12px; background: var(--primary); color: var(--on-primary); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; border: none; box-shadow: 0 2px 6px rgba(76,102,43,0.25); }
  .cta-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .cta-btn .material-icons { font-size: var(--icon-sm); }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--outline-variant); padding: 6px 0 10px; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
</style>
</head>
<body>
  <header class="top-bar" data-shell="top-bar">
    <h1>Meetings · May 2026</h1>
  </header>

  <div class="week-strip" aria-label="Week calendar strip">
    <div class="day-pill" data-action="select_day" data-target="monday" role="button" tabindex="0"><span class="label">Mon</span><span class="date">19</span></div>
    <div class="day-pill" data-action="select_day" data-target="tuesday" role="button" tabindex="0"><span class="label">Tue</span><span class="date">20</span></div>
    <div class="day-pill selected" data-action="select_day" data-target="wednesday" role="button" tabindex="0" aria-selected="true"><span class="label">Wed</span><span class="date">21</span></div>
    <div class="day-pill" data-action="select_day" data-target="thursday" role="button" tabindex="0"><span class="label">Thu</span><span class="date">22</span></div>
    <div class="day-pill" data-action="select_day" data-target="friday" role="button" tabindex="0"><span class="label">Fri</span><span class="date">23</span></div>
    <div class="day-pill" data-action="select_day" data-target="saturday" role="button" tabindex="0"><span class="label">Sat</span><span class="date">24</span></div>
    <div class="day-pill" data-action="select_day" data-target="sunday" role="button" tabindex="0"><span class="label">Sun</span><span class="date">25</span></div>
  </div>

  <main class="empty-wrap" role="region" aria-label="No meetings scheduled">
    <div class="empty-icon" aria-hidden="true"><span class="material-icons">event_available</span></div>
    <h2 class="empty-title">No Meetings Scheduled</h2>
    <p class="empty-msg">Tap the button below to schedule your first meeting for this week.</p>
    <button class="cta-btn" data-action="schedule_meeting" data-target="create_meeting_sheet" aria-label="Schedule a new meeting"><span class="material-icons">event</span>Schedule Meeting</button>
  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item active" data-nav-to="fo-dashboard" tabindex="0"><span class="material-icons">dashboard</span>Dashboard</a>
    <a class="nav-item" data-nav-to="customer-search" tabindex="0"><span class="material-icons">people</span>Customers</a>
    <a class="nav-item" data-nav-to="account-applications" tabindex="0"><span class="material-icons">description</span>Applications</a>
    <a class="nav-item" data-nav-to="customer-messages" tabindex="0"><span class="material-icons">mail</span>Messages</a>
    <a class="nav-item" data-nav-to="settings" tabindex="0"><span class="material-icons">more_vert</span>More</a>
  </nav>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
