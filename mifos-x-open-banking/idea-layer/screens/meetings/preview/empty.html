<!doctype html>
<html lang="en" data-screen="meetings" data-state="empty">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Meetings — Empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
.top-bar-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;gap:16px;text-align:center;min-height:calc(844px - 56px);}
.empty-icon{width:96px;height:96px;background:var(--primary-container);border-radius:48px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.empty-icon .mi{font-size:48px;color:var(--primary);}
h2.empty-title{font-size:20px;font-weight:600;color:var(--text-primary);}
p.empty-msg{font-size:14px;color:var(--outline);line-height:1.5;max-width:280px;}
.schedule-btn{margin-top:8px;padding:14px 32px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="fo-dashboard">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Meetings · May 2026</span>
  <div class="top-bar-action" data-action="schedule_meeting">
    <span class="mi" style="font-size:22px;color:var(--primary);">add</span>
  </div>
</header>

<main>
  <div class="empty-icon">
    <span class="mi">event_available</span>
  </div>
  <h2 class="empty-title">No Meetings Scheduled</h2>
  <p class="empty-msg">Tap the button below to schedule your first meeting for this week</p>
  <button class="schedule-btn" data-action="schedule_meeting">Schedule Meeting</button>
</main>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
