sibling: api
schema_version: "4.0"
feature_id: meetings
api:
  - id: obp_get_meetings
    endpoint: "GET /obp/v3.1.0/banks/{bankId}/meetings"
    tag: Meetings
    response:
      fields:
        - meeting_id
        - provider
        - provider_id
        - purpose_id
        - bank_id
        - present
        - keys
        - values
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
  - id: obp_create_meeting
    endpoint: "POST /obp/v3.1.0/banks/{bankId}/meetings"
    tag: Meetings
    note: "Body requires nested `creator.{name,email_address,mobile_phone}` and `invitees[].contact_details.{name,email_address,mobile_phone}` + `invitees[].status`"
    response:
      fields:
        - meeting_id
        - provider
        - provider_id
        - purpose_id
        - bank_id
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
