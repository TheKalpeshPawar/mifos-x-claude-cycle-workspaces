states:
  loading:
    layout:
      scroll: vertical
      padding: 0
      showShimmer: true
  content:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F9FAEF"
  empty:
    layout:
      scroll: vertical
      padding: 32
      showEmptyState: true
      emptyTitle: "No Meetings Scheduled"
      emptySubtitle: "Tap the button below to schedule your first meeting for this week"
      emptyIcon: event_available
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: MeetingsViewModel
  state_fields:
    - name: meetings
      type: "List<Meeting>"
      default: emptyList
    - name: selectedDate
      type: LocalDate
      default: LocalDate.today
    - name: filteredMeetings
      type: "List<Meeting>"
      default: emptyList
    - name: isScheduleSheetOpen
      type: Boolean
      default: "false"
    - name: scheduleDraft
      type: MeetingDraft
      nullable: true
    - name: isSubmitting
      type: Boolean
      default: "false"
  errors:
    - LOAD_FAILED
    - SCHEDULE_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - DaySelected
    - MeetingSelected
    - MeetingScheduled
    - MeetingJoined
    - SheetOpened
    - SheetDismissed
  actions:
    - select_day
    - jump_to_today
    - view_meeting_detail
    - join_meeting
    - schedule_meeting
    - confirm_meeting
    - open_date_picker
    - open_duration_picker
    - open_type_picker
    - search_customer
  di:
    - MeetingsRepository
    - CalendarService
    - CustomerSearchService

api:
  - endpoint: "GET /obp/v3.1.0/banks/{bankId}/meetings"
    tag: Meetings
    response:
      fields:
        - meeting_id
        - provider
        - provider_id
        - purpose_id
        - bank_id
        - present
        - keys
        - values
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
  - endpoint: "POST /obp/v3.1.0/banks/{bankId}/meetings"
    tag: Meetings
    note: "Body requires nested `creator.{name,email_address,mobile_phone}` and `invitees[].contact_details.{name,email_address,mobile_phone}` + `invitees[].status`"
    response:
      fields:
        - meeting_id
        - provider
        - provider_id
        - purpose_id
        - bank_id
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND

dependencies:
  tier: feature
  features:
    - customer-detail
    - customer-messages
