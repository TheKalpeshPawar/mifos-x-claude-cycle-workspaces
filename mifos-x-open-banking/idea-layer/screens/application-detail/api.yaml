sibling: api
schema_version: "4.0"
feature_id: application-detail
api:
  - id: obp_get_application_detail
    endpoint: "GET /obp/v5.1.0/banks/{bankId}/account-applications/{applicationId}"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - product_code
        - user
        - customer
        - date_of_application
        - date_last_modified
        - status
        - account_routing
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: APPLICATION_NOT_FOUND
  - id: obp_update_application
    endpoint: "PUT /obp/v5.1.0/banks/{bankId}/account-applications/{applicationId}"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - status
        - date_last_modified
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: APPLICATION_NOT_FOUND
