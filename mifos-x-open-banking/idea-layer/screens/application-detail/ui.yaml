        style:
          direction: vertical
          gap: 4
        children:
          - type: text
            id: purpose_label
            content: "Purpose"
            style:
              typography: "Outfit/body_medium"
              color: "#44483D"
            a11y:
              label: "Label: Purpose"
            test_context:
