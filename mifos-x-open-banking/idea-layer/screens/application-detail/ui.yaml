    bypass_flags: []

screens:
  - id: application-detail-main
    name: "Application Review"
    archetype: detail_screen

components:
  - type: box
    id: application_header
    style:
      backgroundColor: "#4C662B"
      paddingVertical: 18
      paddingHorizontal: 16
    a11y:
      contentDescription: "Application OBP-2026-00234, Pending Review, submitted 20 May 2026"
    test_context:
      tag: application_header
    components:
      - type: text
        id: app_reference_number
        content: "Application #OBP-2026-00234"
        style:
          textStyle: title_large
          color: "#FFFFFF"
          weight: 700
          marginBottom: 6
        a11y:
          contentDescription: "Application number OBP-2026-00234"
        test_context:
          tag: app_reference_number
      - type: stack
        id: app_header_meta
        style:
          direction: horizontal
          alignItems: center
          gap: 10
        components:
          - type: box
            id: app_status_chip
            style:
              backgroundColor: "#CDEDA3"
              borderRadius: 12
              paddingHorizontal: 10
              paddingVertical: 4
            a11y:
              contentDescription: "Status: Pending Review"
              role: status
            test_context:
              tag: app_status_chip
            components:
              - type: text
                id: app_status_text
                content: "Pending Review"
                style:
                  textStyle: label_small
                  color: "#E8A317"
                  weight: 600
                a11y:
                  contentDescription: "Pending Review"
                test_context:
                  tag: app_status_text
          - type: text
            id: app_submitted_date
            content: "Submitted: 20 May 2026"
            style:
              textStyle: body_small
              color: "#CDEDA3"
            a11y:
              contentDescription: "Submitted on 20 May 2026"
            test_context:
              tag: app_submitted_date

  - type: box
    id: customer_info_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 12
      padding: 16
      marginHorizontal: 16
      marginTop: 16
      marginBottom: 10
      elevation: 2
    a11y:
      contentDescription: "Customer information card"
    test_context:
      tag: customer_info_card
    components:
      - type: text
        id: customer_card_heading
        content: "Customer"
        style:
          textStyle: label_medium
          color: "#75796C"
          textTransform: uppercase
          letterSpacing: 0.8
          marginBottom: 6
        a11y:
          contentDescription: "Customer section"
        test_context:
          tag: customer_card_heading
      - type: stack
        id: customer_info_row
        style:
          direction: horizontal
          justifyContent: space_between
          alignItems: center
        components:
          - type: text
            id: customer_name
            content: "John Kamau Mwangi"
            style:
              textStyle: title_medium
              color: "#1A1C16"
              weight: 700
            a11y:
              contentDescription: "Customer: John Kamau Mwangi"
            test_context:
              tag: customer_name
          - type: link
            id: customer_profile_link
            content: "View Profile"
            style:
              textStyle: label_medium
              color: "#4C662B"
              textDecoration: underline
            on_click:
              action: navigate
              target: customer-detail
            a11y:
              contentDescription: "View John Kamau Mwangi's full profile"
              role: button
            keyboard:
              focusable: true
            test_context:
              tag: customer_profile_link
              assertClickable: true

  - type: box
    id: application_details_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 12
      padding: 16
      marginHorizontal: 16
      marginBottom: 10
      elevation: 2
    a11y:
      contentDescription: "Application details"
    test_context:
      tag: application_details_card
    components:
      - type: text
        id: app_details_heading
        content: "Application Details"
        style:
          textStyle: label_medium
          color: "#75796C"
          textTransform: uppercase
          letterSpacing: 0.8
          marginBottom: 10
        a11y:
          contentDescription: "Application Details section"
        test_context:
          tag: app_details_heading
      - type: stack
        id: account_type_row
        style:
          direction: horizontal
          spaceBetween: true
          marginBottom: 8
        components:
          - type: text
            id: account_type_label
            content: "Account Type"
            style:
              textStyle: body_medium
              color: "#44483D"
            a11y:
              contentDescription: "Label: Account Type"
            test_context:
              tag: account_type_label
          - type: text
            id: account_type_value
            content: "KCB Savings Account"
            style:
              textStyle: body_medium
              color: "#1A1C16"
              weight: 600
            a11y:
              contentDescription: "KCB Savings Account"
            test_context:
              tag: account_type_value
      - type: stack
        id: requested_limit_row
        style:
          direction: horizontal
          spaceBetween: true
          marginBottom: 8
        components:
          - type: text
            id: limit_label
            content: "Requested Limit"
            style:
              textStyle: body_medium
              color: "#44483D"
            a11y:
              contentDescription: "Label: Requested Limit"
            test_context:
              tag: limit_label
          - type: text
            id: limit_value
            content: "KES 500,000"
            style:
              textStyle: body_medium
              color: "#1A1C16"
              weight: 600
              fontFamily: monospace
            a11y:
              contentDescription: "KES 500,000"
            test_context:
              tag: limit_value
      - type: stack
        id: purpose_row
        style:
          direction: vertical
          gap: 4
        components:
          - type: text
            id: purpose_label
            content: "Purpose"
            style:
              textStyle: body_medium
              color: "#44483D"
            a11y:
              contentDescription: "Label: Purpose"
            test_context:
              tag: purpose_label
          - type: text
            id: purpose_value
            content: "Personal savings and salary credit"
            style:
              textStyle: body_medium
              color: "#1A1C16"
            a11y:
              contentDescription: "Personal savings and salary credit"
            test_context:
              tag: purpose_value

  - type: box
    id: kyc_status_row
    style:
      backgroundColor: "#CDEDA3"
      borderRadius: 12
      padding: 14
      marginHorizontal: 16
      marginBottom: 10
      borderWidth: 1
      borderColor: "#4C662B"
    a11y:
      contentDescription: "KYC Status: Verified"
    test_context:
      tag: kyc_status_row
    components:
      - type: stack
        id: kyc_row_stack
        style:
          direction: horizontal
          alignItems: center
          gap: 8
        components:
          - type: icon
            id: kyc_verified_icon
            content: "verified_user"
            style:
              color: "#4C662B"
              size: 20
            a11y:
              contentDescription: "Verified"
            test_context:
              tag: kyc_verified_icon
          - type: text
            id: kyc_status_label
            content: "KYC Status: Verified ✓"
            style:
              textStyle: body_medium
              color: "#4C662B"
              weight: 600
            a11y:
              contentDescription: "KYC is verified"
            test_context:
              tag: kyc_status_label

  - type: text
    id: documents_heading
    content: "Supporting Documents"
    style:
      textStyle: title_medium
      color: "#1A1C16"
      paddingHorizontal: 16
      paddingTop: 8
      paddingBottom: 8
    a11y:
      role: heading
      level: 2
      contentDescription: "Supporting Documents section"
    test_context:
      tag: documents_heading

  - type: box
    id: doc_national_id_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 8
      elevation: 1
      borderWidth: 1
      borderColor: "#E1E4D5"
    a11y:
      contentDescription: "National ID document — Verified"
    test_context:
      tag: doc_national_id_card
    components:
      - type: stack
        id: doc_id_row
        style:
          direction: horizontal
          alignItems: center
          gap: 12
        components:
          - type: image
            id: doc_id_thumbnail
            content: "doc_national_id_thumbnail"
            style:
              width: 56
              height: 40
              borderRadius: 6
              objectFit: cover
              borderWidth: 1
              borderColor: "#4C662B"
            a11y:
              contentDescription: "National ID thumbnail image"
              role: image
            test_context:
              tag: doc_id_thumbnail
          - type: box
            id: doc_id_info
            style:
              flex: 1
            a11y:
              contentDescription: ""
            test_context:
              tag: doc_id_info
            components:
              - type: text
                id: doc_id_title
                content: "National ID"
                style:
                  textStyle: body_large
                  color: "#1A1C16"
                  weight: 600
                  marginBottom: 2
                a11y:
                  contentDescription: "National ID"
                test_context:
                  tag: doc_id_title
              - type: text
                id: doc_id_status
                content: "Verified ✓"
                style:
                  textStyle: body_small
                  color: "#4C662B"
                a11y:
                  contentDescription: "Verified"
                test_context:
                  tag: doc_id_status
          - type: link
            id: doc_id_view_link
            content: "View"
            style:
              textStyle: label_medium
              color: "#4C662B"
              textDecoration: underline
            on_click:
              action: view_document
              target: national_id_doc
            a11y:
              contentDescription: "View National ID document"
              role: button
            keyboard:
              focusable: true
            test_context:
              tag: doc_id_view_link
              assertClickable: true

  - type: box
    id: doc_proof_address_card
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 16
      elevation: 1
      borderWidth: 1
      borderColor: "#E1E4D5"
    a11y:
      contentDescription: "Proof of Address — Pending upload"
    test_context:
      tag: doc_proof_address_card
    components:
      - type: stack
        id: doc_address_row
        style:
          direction: horizontal
          alignItems: center
          gap: 12
        components:
          - type: box
            id: doc_address_placeholder
            style:
              width: 56
              height: 40
              borderRadius: 6
              backgroundColor: "#F9FAEF"
              borderWidth: 1
              borderColor: "#E8A317"
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "No proof of address uploaded yet"
              role: image
            test_context:
              tag: doc_address_placeholder
            components:
              - type: icon
                id: doc_address_icon
                content: "home"
                style:
                  color: "#E8A317"
                  size: 20
                a11y:
                  contentDescription: "Address icon"
                test_context:
                  tag: doc_address_icon
          - type: box
            id: doc_address_info
            style:
              flex: 1
            a11y:
              contentDescription: ""
            test_context:
              tag: doc_address_info
            components:
              - type: text
                id: doc_address_title
                content: "Proof of Address"
                style:
                  textStyle: body_large
                  color: "#1A1C16"
                  weight: 600
                  marginBottom: 2
                a11y:
                  contentDescription: "Proof of Address"
                test_context:
                  tag: doc_address_title
              - type: text
                id: doc_address_status
                content: "Pending Upload"
                style:
                  textStyle: body_small
                  color: "#E8A317"
                a11y:
                  contentDescription: "Status: Pending Upload"
                test_context:
                  tag: doc_address_status
          - type: button
            id: upload_address_doc_button
            label: "Upload"
            style:
              variant: outlined
              borderColor: "#4C662B"
              textColor: "#4C662B"
              paddingHorizontal: 12
              paddingVertical: 6
              textStyle: label_small
            on_click:
              action: upload_document
              target: proof_of_address
            a11y:
              contentDescription: "Upload proof of address document"
              role: button
            keyboard:
              focusable: true
            test_context:
              tag: upload_address_doc_button
              assertClickable: true

  - type: input
    id: review_notes_input
    label: "Review Notes"
    style:
      variant: outlined
      inputType: textarea
      placeholder: "Add internal notes about this application — e.g. income verified via payslip, employer confirmed, recommend approval..."
      minLines: 3
      maxLines: 6
      marginHorizontal: 16
      marginBottom: 16
    on_click:
      action: focus_field
      target: review_notes_input
    a11y:
      contentDescription: "Internal review notes, not visible to customer"
      role: textField
    keyboard:
      focusable: true
    test_context:
      tag: review_notes_input

  - type: button
    id: approve_application_button
    label: "Approve Application"
    style:
      variant: filled
      backgroundColor: "#4C662B"
      textColor: "#FFFFFF"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: approve_application
      target: customer-detail
    a11y:
      contentDescription: "Approve this account application"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: approve_application_button
      assertClickable: true

  - type: button
    id: reject_application_button
    label: "Reject Application"
    style:
      variant: outlined
      borderColor: "#BA1A1A"
      textColor: "#BA1A1A"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: reject_application
      target: application-detail
    a11y:
      contentDescription: "Reject this account application"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: reject_application_button
      assertClickable: true

  - type: button
    id: request_info_button
    label: "Request Information"
    style:
      variant: text
      textColor: "#4C662B"
      marginHorizontal: 16
      marginBottom: 24
    on_click:
      action: request_info
      target: customer-messages
    a11y:
      contentDescription: "Request additional information from customer"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: request_info_button
      assertClickable: true

states:
  loading:
    layout:
      scroll: vertical
      padding: 0
      showShimmer: true
  reviewing:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F9FAEF"
  approved:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F9FAEF"
      showSuccessBanner: true
      bannerMessage: "Application approved successfully"
  rejected:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F9FAEF"
      showRejectionBanner: true
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: ApplicationDetailViewModel
  state_fields:
    - name: applicationId
      type: String
    - name: application
      type: AccountApplicationDetail
      nullable: true
    - name: reviewNotes
      type: String
      default: "''"
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: decisionMade
      type: ApplicationDecision
      values: [PENDING, APPROVED, REJECTED]
      default: PENDING
  errors:
    - APPROVAL_FAILED
    - REJECTION_FAILED
    - LOAD_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - ApplicationApproved
    - ApplicationRejected
    - InfoRequested
    - DocumentViewed
    - CustomerProfileOpened
  actions:
    - approve_application
    - reject_application
    - request_info
    - view_document
    - upload_document
    - navigate
  di:
    - AccountApplicationRepository
    - CustomerMessagingService

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/account-applications/{applicationId}"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - product_code
        - user
        - customer
        - date_of_application
        - date_last_modified
        - status
        - account_routing
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: APPLICATION_NOT_FOUND
  - endpoint: "PUT /obp/v5.1.0/banks/{bankId}/account-applications/{applicationId}"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - status
        - date_last_modified
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: APPLICATION_NOT_FOUND

dependencies:
  tier: feature
  features:
    - account-applications
    - customer-detail
    - customer-messages
    - kyc-review
