          color: "#FFFFFF"
          font_weight: 700
          margin_bottom: 6
        a11y:
          label: "Application number OBP-2026-00234"
        test_context:
          tag: app_reference_number
      - type: stack
        id: app_header_meta
        style:
          direction: horizontal
          align_items: center
          gap: 10
        children:
          - type: box
            id: app_status_chip
            style:
              background: "#CDEDA3"
              border_radius: 12
              padding_horizontal: spacing.sm
              padding_vertical: spacing.xs
