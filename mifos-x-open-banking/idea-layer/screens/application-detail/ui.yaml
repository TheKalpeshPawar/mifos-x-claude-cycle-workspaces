              color: "#1A1C16"
              font_weight: 700
            a11y:
              label: "Customer: John Kamau Mwangi"
            test_context:
              tag: customer_name
          - type: link
            id: customer_profile_link
            content: "View Profile"
            style:
              typography: "Outfit/label_medium"
              color: "#4C662B"
              text_decoration: underline
            on_click:
              action: navigate
              target: customer-detail
            a11y:
              label: "View John Kamau Mwangi's full profile"
              role: button
            keyboard:
              focusable: true
            test_context:
              tag: customer_profile_link
              assert_clickable: true

  - type: box
