            style:
              typography: "Outfit/body_medium"
              color: "#1A1C16"
            a11y:
              label: "Personal savings and salary credit"
            test_context:
              tag: purpose_value

  - type: box
    id: kyc_status_row
    style:
      background: "#CDEDA3"
      border_radius: 12
      padding: 14
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      border_width: 1
      border_color: "#4C662B"
    a11y:
      label: "KYC Status: Verified"
    test_context:
      tag: kyc_status_row
    children:
      - type: stack
        id: kyc_row_stack
        style:
          direction: horizontal
          align_items: center
          gap: 8
        children:
          - type: icon
            id: kyc_verified_icon
            content: "verified_user"
            supported_states: [idle, hover, focus_visible, pressed, disabled]
            style:
              color: "#4C662B"
              size: 20
            a11y:
              label: "Verified"
            test_context:
              tag: kyc_verified_icon
          - type: text
            id: kyc_status_label
            content: "KYC Status: Verified ✓"
            style:
              typography: "Outfit/body_medium"
              color: "#4C662B"
              font_weight: 600
            a11y:
              label: "KYC is verified"
            test_context:
              tag: kyc_status_label

  - type: text
    id: documents_heading
    content: "Supporting Documents"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      padding_horizontal: spacing.md
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    a11y:
      role: heading
      level: 2
      label: "Supporting Documents section"
    test_context:
      tag: documents_heading

  - type: box
    id: doc_national_id_card
    style:
      background: "#FFFFFF"
      border_radius: 10
      padding: 14
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      elevation: 1
      border_width: 1
      border_color: "#E1E4D5"
    a11y:
      label: "National ID document — Verified"
    test_context:
      tag: doc_national_id_card
    children:
      - type: stack
        id: doc_id_row
        style:
          direction: horizontal
          align_items: center
          gap: 12
        children:
          - type: image
            id: doc_id_thumbnail
            content: "doc_national_id_thumbnail"
            style:
              width: 56
              height: 40
              border_radius: 6
              object_fit: cover
              border_width: 1
              border_color: "#4C662B"
            a11y:
              label: "National ID thumbnail image"
              role: image
            test_context:
              tag: doc_id_thumbnail
          - type: box
            id: doc_id_info
            style:
              flex: 1
            a11y:
              label: ""
            test_context:
              tag: doc_id_info
            children:
              - type: text
                id: doc_id_title
                content: "National ID"
                style:
                  typography: "Outfit/body_large"
                  color: "#1A1C16"
                  font_weight: 600
                  margin_bottom: 2
                a11y:
                  label: "National ID"
                test_context:
                  tag: doc_id_title
              - type: text
                id: doc_id_status
                content: "Verified ✓"
                style:
                  typography: "Outfit/body_small"
                  color: "#4C662B"
                a11y:
                  label: "Verified"
                test_context:
                  tag: doc_id_status
          - type: link
            id: doc_id_view_link
            content: "View"
            style:
              typography: "Outfit/label_medium"
              color: "#4C662B"
              text_decoration: underline
            on_click:
              action: view_document
              target: national_id_doc
            a11y:
              label: "View National ID document"
              role: button
            keyboard:
              focusable: true
            test_context:
              tag: doc_id_view_link
              assert_clickable: true

  - type: box
    id: doc_proof_address_card
    style:
      background: "#FFFFFF"
      border_radius: 10
      padding: 14
      margin_horizontal: spacing.md
      margin_bottom: spacing.md
      elevation: 1
      border_width: 1
      border_color: "#E1E4D5"
    a11y:
      label: "Proof of Address — Pending upload"
    test_context:
      tag: doc_proof_address_card
    children:
      - type: stack
        id: doc_address_row
        style:
          direction: horizontal
          align_items: center
          gap: 12
        children:
          - type: box
            id: doc_address_placeholder
            style:
              width: 56
              height: 40
              border_radius: 6
              background: "#F9FAEF"
              border_width: 1
              border_color: "#E8A317"
              align_items: center
              justify_content: center
            a11y:
              label: "No proof of address uploaded yet"
              role: image
            test_context:
              tag: doc_address_placeholder
            children:
              - type: icon
                id: doc_address_icon
                content: "home"
                supported_states: [idle, hover, focus_visible, pressed, disabled]
                style:
                  color: "#44483D"  # fix A11Y-002: was #E8A317 (≤2.17:1 on white/CDEDA3, FAIL); #44483D ≥7.25:1 PASS
                  size: 20
                a11y:
                  label: "Address icon"
                test_context:
                  tag: doc_address_icon
          - type: box
            id: doc_address_info
            style:
              flex: 1
            a11y:
              label: ""
            test_context:
              tag: doc_address_info
            children:
              - type: text
                id: doc_address_title
                content: "Proof of Address"
                style:
                  typography: "Outfit/body_large"
                  color: "#1A1C16"
                  font_weight: 600
                  margin_bottom: 2
                a11y:
                  label: "Proof of Address"
                test_context:
                  tag: doc_address_title
              - type: text
                id: doc_address_status
                content: "Pending Upload"
                style:
                  typography: "Outfit/body_small"
                  color: "#44483D"  # fix A11Y-002: was #E8A317 (≤2.17:1 on white/CDEDA3, FAIL); #44483D ≥7.25:1 PASS
                a11y:
                  label: "Status: Pending Upload"
                test_context:
                  tag: doc_address_status
          - type: button
            id: upload_address_doc_button
            label: "Upload"
            supported_states: [idle, hover, focus_visible, pressed, disabled]
            style:
              variant: outlined
              border_color: "#4C662B"
              text_color: "#4C662B"
              padding_horizontal: spacing.sm
              padding_vertical: spacing.xs
              typography: "Outfit/label_small"
            on_click:
              action: upload_document
              target: proof_of_address
            a11y:
              label: "Upload proof of address document"
              role: button
            keyboard:
              focusable: true
            test_context:
              tag: upload_address_doc_button
              assert_clickable: true

  - type: input
    id: review_notes_input
    label: "Review Notes"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: textarea
      placeholder: "Add internal notes about this application — e.g. income verified via payslip, employer confirmed, recommend approval..."
      min_lines: 3
      max_lines: 6
      margin_horizontal: spacing.md
      margin_bottom: spacing.md
    on_click:
      action: focus_field
      target: review_notes_input
    a11y:
      role: textField
      label_source: visible_label
      label: "Internal review notes, not visible to customer"
    keyboard:
      focusable: true
    test_context:
      tag: review_notes_input

  - type: button
    id: approve_application_button
    label: "Approve Application"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: "#4C662B"
      text_color: "#FFFFFF"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: approve_application
      target: customer-detail
    a11y:
      label: "Approve this account application"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: approve_application_button
      assertClickable: true

  - type: button
    id: reject_application_button
    label: "Reject Application"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      border_color: "#BA1A1A"
      text_color: "#BA1A1A"
      margin_horizontal: spacing.md
      margin_bottom: spacing.sm
      full_width: true
    on_click:
      action: reject_application
      target: application-detail
    a11y:
      label: "Reject this account application"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: reject_application_button
      assertClickable: true

  - type: button
    id: request_info_button
    label: "Request Information"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: text
      text_color: "#4C662B"
      margin_horizontal: spacing.md
      margin_bottom: spacing.lg
    on_click:
      action: request_info
      target: customer-messages
    a11y:
      label: "Request additional information from customer"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: request_info_button
      assertClickable: true

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      scroll: vertical
      padding: 0
      showShimmer: true
  reviewing:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
  approved:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
      showSuccessBanner: true
      bannerMessage: "Application approved successfully"
  rejected:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
      showRejectionBanner: true
  content:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
    note: "Application details loaded — same layout as reviewing state; default loaded state alias"
  empty:
    layout:
      scroll: vertical
      padding: 16
      background: "#F9FAEF"
      showEmptyState: true
      emptyMessage: "Application details not available"
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: ApplicationDetailViewModel
  state_fields:
    - name: applicationId
      type: String
    - name: application
      type: AccountApplicationDetail
      nullable: true
    - name: reviewNotes
      type: String
      default: "''"
    - name: isSubmitting
      type: Boolean
      default: "false"
    - name: decisionMade
      type: ApplicationDecision
      values: [PENDING, APPROVED, REJECTED]
      default: PENDING
  errors:
    - APPROVAL_FAILED
    - REJECTION_FAILED
    - LOAD_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - ApplicationApproved
    - ApplicationRejected
    - InfoRequested
    - DocumentViewed
    - CustomerProfileOpened
  actions:
    - approve_application
    - reject_application
    - request_info
    - view_document
    - upload_document
    - navigate
  di:
    - AccountApplicationRepository
    - CustomerMessagingService

api:
  - endpoint: "GET /obp/v4.0.0/banks/{bankId}/account-applications/{applicationId}"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - product_code
        - user
        - customer
        - date_of_application
        - date_last_modified
        - status
        - account_routing
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: APPLICATION_NOT_FOUND
  - endpoint: "PUT /obp/v4.0.0/banks/{bankId}/account-applications/{applicationId}"
    tag: Account-Applications
    response:
      fields:
        - account_application_id
        - status
        - date_last_modified
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: APPLICATION_NOT_FOUND

dependencies:
  tier: feature
  features:
    - account-applications
    - customer-detail
    - customer-messages
    - kyc-review
