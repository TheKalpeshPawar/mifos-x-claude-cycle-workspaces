          color: "#44483D"
          text_transform: uppercase
          letter_spacing: 0.8
          margin_bottom: spacing.sm
        a11y:
          label: "Application Details section"
        test_context:
          tag: app_details_heading
      - type: stack
        id: account_type_row
        style:
