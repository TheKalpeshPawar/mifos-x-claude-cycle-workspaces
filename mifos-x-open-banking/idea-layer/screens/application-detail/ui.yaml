          typography: "Outfit/label_medium"
          color: "#44483D"
          text_transform: uppercase
          letter_spacing: 0.8
          margin_bottom: 6
        a11y:
          label: "Customer section"
        test_context:
          tag: customer_card_heading
      - type: stack
        id: customer_info_row
        style:
          direction: horizontal
          justify_content: space_between
          align_items: center
        children:
