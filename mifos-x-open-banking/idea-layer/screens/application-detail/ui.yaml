components:
  - type: box
    id: application_header
    style:
      background: "#4C662B"
      padding_vertical: spacing.md
      padding_horizontal: spacing.md
    a11y:
      label: "Application OBP-2026-00234, Pending Review, submitted 20 May 2026"
