<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Application Detail — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;
  --background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --text-primary:#1A1C16;--text-secondary:#44483D;
  --tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;
  --nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font)}
main{display:flex;flex-direction:column;min-height:844px;padding-bottom:32px}

@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
.shim{background:linear-gradient(90deg,var(--surface-variant) 25%,#f0f2e8 50%,var(--surface-variant) 75%);background-size:780px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}

.hdr-shim{height:80px;background:var(--primary);padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.hdr-t1{height:18px;width:200px;background:rgba(255,255,255,.25);border-radius:6px}
.hdr-t2{height:12px;width:130px;background:rgba(255,255,255,.18);border-radius:6px}
.card-shim{height:80px;margin:10px 16px 10px;border-radius:12px}
.card-lg-shim{height:120px;margin:0 16px 10px;border-radius:12px}
.kyc-shim{height:48px;margin:0 16px 10px;border-radius:12px}
.sec-shim{height:16px;width:160px;margin:8px 16px;border-radius:6px}
.doc-shim{height:68px;margin:0 16px 8px;border-radius:10px}
.ta-shim{height:96px;margin:0 16px 16px;border-radius:8px}
.btn-shim{height:48px;margin:0 16px 8px;border-radius:10px}
</style>
</head>
<body>
<main data-screen="application-detail" data-state="loading" role="main" aria-busy="true" aria-label="Loading application detail">

  <div class="hdr-shim">
    <div class="hdr-t1"></div>
    <div class="hdr-t2"></div>
  </div>

  <div class="shim card-shim" style="margin-top:16px"></div>
  <div class="shim card-lg-shim"></div>
  <div class="shim kyc-shim"></div>

  <div class="shim sec-shim"></div>
  <div class="shim doc-shim"></div>
  <div class="shim doc-shim" style="margin-bottom:16px"></div>

  <div class="shim ta-shim"></div>
  <div class="shim btn-shim"></div>
  <div class="shim btn-shim" style="opacity:.7"></div>
  <div class="shim btn-shim" style="opacity:.4;height:40px"></div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
