states:
  content:
    layout:
      scroll: vertical
      padding: 16
      backgroundColor: "#F5F5F5"
  editing:
    layout:
      scroll: vertical
      padding: 16
      backgroundColor: "#F5F5F5"
      showKeyboard: true
  saving:
    layout:
      scroll: vertical
      padding: 16
      backgroundColor: "#F5F5F5"
      showProgressOverlay: true

state_model:
  ViewModel: CustomerProfileViewModel
  state_fields:
    - name: customer
      type: CustomerDetail
    - name: isEditing
      type: Boolean
      default: "false"
    - name: isSaving
      type: Boolean
      default: "false"
    - name: editDraft
      type: CustomerEditDraft
      nullable: true
  errors:
    - CUSTOMER_LOAD_FAILED
    - SAVE_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - EditStarted
    - EditCancelled
    - CustomerSaved
    - CallInitiated
    - EmailInitiated
  actions:
    - edit_customer_info
    - save_customer_info
    - cancel_edit
    - call_customer
    - email_customer
  di:
    - CustomerRepository
    - ContactActionHandler

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/customers/{customerId}"
    tag: Customers
    response:
      fields:
        - customer_id
        - legal_name
        - date_of_birth
        - national_id_number
        - tax_pin
        - mobile_phone_number
        - email
        - address
        - employment_details
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
  - endpoint: "PUT /obp/v5.1.0/banks/{bankId}/customers/{customerId}"
    tag: Customers
    response:
      fields:
        - customer_id
        - legal_name
        - last_ok_date
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND

dependencies:
  tier: feature
  features:
    - customer-list
    - kyc-review
    - customer-messages
