sibling: api
schema_version: "4.0"
feature_id: customer-profile
api:
  - id: obp_get_customer_profile
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/customers/{customerId}"
    tag: Customers
    response:
      fields:
        - customer_id
        - legal_name
        - date_of_birth
        - national_id_number
        - tax_pin
        - mobile_phone_number
        - email
        - address
        - employment_details
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
  - id: obp_update_customer_profile
    endpoint: "PUT /obp/v3.0.0/banks/{bankId}/customers/{customerId}"
    tag: Customers
    response:
      fields:
        - customer_id
        - legal_name
        - last_ok_date
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
