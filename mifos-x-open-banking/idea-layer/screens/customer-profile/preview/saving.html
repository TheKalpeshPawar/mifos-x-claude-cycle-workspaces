<!doctype html>
<!-- render-hash: cp-saving-f06 -->
<html lang="en" data-screen="customer-profile" data-state="saving" data-feature="customer-profile" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Profile — Saving</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --radius-soft: 12px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285; --outline-variant: #44483D;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; gap: 8px; }
    .spinner { width: 52px; height: 52px; border: 4px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 20px; font-weight: 700; color: var(--on-background); }
    .msg { font-size: 14px; color: var(--on-surface-variant); max-width: 280px; line-height: 1.5; }
    .who { font-size: 13px; font-weight: 600; color: var(--primary); margin-top: 4px; }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="spinner" role="progressbar" aria-label="Saving profile changes"></div>
    <h2 class="title" data-component-type="text" data-component-id="saving_title">Saving Changes</h2>
    <p class="msg" data-component-type="text" data-component-id="saving_message">Updating the customer profile on the bank server. This will only take a moment.</p>
    <p class="who" data-component-type="text" data-component-id="saving_customer">Wanjiru Kamau · cust-ke-001-wanjiru</p>
  </main>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
