<!doctype html>
<!-- render-hash: cp-editing-e05 -->
<html lang="en" data-screen="customer-profile" data-state="editing" data-feature="customer-profile" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Profile — Editing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --radius-soft: 12px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --on-secondary: #003735;
      --error: #FFB4AB; --on-error: #690005;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735;
        --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285; --outline-variant: #44483D;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 96px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); position: sticky; top: 0; z-index: 1; }
    .top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.6px; padding: 18px 20px 8px; }
    .input-group { padding: 6px 20px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 5px; }
    .input-field { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--on-surface); }
    .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-container); }
    .input-field[readonly] { background: var(--surface-variant); color: var(--on-surface-variant); cursor: not-allowed; }
    .input-hint { font-size: 11px; color: var(--on-surface-variant); margin-top: 4px; }
    .action-bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--surface-variant); z-index: 10; }
    .btn-cancel { flex: 1; padding: 13px; background: transparent; border: 1.5px solid var(--outline-variant); border-radius: var(--radius-soft); color: var(--on-surface-variant); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-cancel:hover { background: var(--surface-variant); }
    .btn-save { flex: 2; padding: 13px; background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-soft); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-save:hover { filter: brightness(0.95); }
    .btn-save .material-icons { font-size: var(--icon-sm); }
  </style>
</head>
<body>
  <main>
    <header class="top-bar" role="banner">
      <span class="material-icons" data-action="cancel_edit" tabindex="0" aria-label="Cancel editing" role="button">close</span>
      <h1>Edit Customer Profile</h1>
    </header>

    <div class="section-title" data-component-type="text" data-component-id="personal_info_heading">Personal Information</div>
    <div class="input-group">
      <label for="f_name">Full Name</label>
      <input id="f_name" type="text" class="input-field" value="Wanjiru Kamau" aria-label="Full Name" tabindex="0">
    </div>
    <div class="input-group">
      <label for="f_dob">Date of Birth</label>
      <input id="f_dob" type="text" class="input-field" value="22 March 1988" aria-label="Date of Birth" tabindex="0">
    </div>
    <div class="input-group">
      <label for="f_natid">National ID</label>
      <input id="f_natid" type="text" class="input-field" value="28456789" aria-label="National ID" readonly>
      <p class="input-hint">National ID is verified and cannot be edited here.</p>
    </div>
    <div class="input-group">
      <label for="f_phone">Phone</label>
      <input id="f_phone" type="tel" class="input-field" value="+254 712 345 678" aria-label="Phone" tabindex="0">
    </div>
    <div class="input-group">
      <label for="f_email">Email</label>
      <input id="f_email" type="email" class="input-field" value="wanjiru.kamau@gmail.com" aria-label="Email" tabindex="0">
    </div>

    <div class="section-title" data-component-type="text" data-component-id="address_heading">Address</div>
    <div class="input-group">
      <label for="f_street">Street</label>
      <input id="f_street" type="text" class="input-field" value="26 Westlands Road, Westlands" aria-label="Street" tabindex="0">
    </div>
    <div class="input-group">
      <label for="f_county">County</label>
      <input id="f_county" type="text" class="input-field" value="Nairobi County, Kenya" aria-label="County" tabindex="0">
    </div>
    <div class="input-group">
      <label for="f_postcode">Postcode</label>
      <input id="f_postcode" type="text" class="input-field" value="00100" aria-label="Postcode" tabindex="0">
    </div>

    <div class="section-title" data-component-type="text" data-component-id="employment_heading">Employment</div>
    <div class="input-group">
      <label for="f_employer">Employer</label>
      <input id="f_employer" type="text" class="input-field" value="Safaricom PLC" aria-label="Employer" tabindex="0">
    </div>
    <div class="input-group">
      <label for="f_income">Monthly Income (KES)</label>
      <input id="f_income" type="text" class="input-field" value="85,000" aria-label="Monthly Income" tabindex="0">
    </div>
  </main>

  <div class="action-bar">
    <button class="btn-cancel" data-action="cancel_edit" tabindex="0" aria-label="Cancel">Cancel</button>
    <button class="btn-save" data-action="save_customer_info" tabindex="0" aria-label="Save changes">
      <span class="material-icons" aria-hidden="true">check</span> Save Changes
    </button>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
