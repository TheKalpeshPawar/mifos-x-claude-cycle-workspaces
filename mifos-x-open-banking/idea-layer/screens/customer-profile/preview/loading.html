<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Customer Profile – loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;--background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;--outline:#75796C;--outline-variant:#C5C8BA;--text-primary:#1A1C16;--text-secondary:#44483D;--tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;--nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--background);width:390px;min-height:844px;position:relative;overflow-x:hidden}
.top-bar{background:var(--surface);display:flex;align-items:center;padding:0 8px;height:56px;border-bottom:1px solid var(--surface-variant);position:sticky;top:0;z-index:10}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:transparent}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);font-family:var(--font);margin-left:4px}
.scroll-area{padding:16px 16px 100px}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear}
.skel-heading{height:24px;width:60%;border-radius:6px;margin-bottom:10px}
.skel-row{height:48px;border-radius:8px;margin-bottom:2px}
.divider{height:1px;background:var(--surface-variant);margin:16px 0}
.save-btn-wrap{position:absolute;bottom:0;left:0;width:390px;background:var(--surface);border-top:1px solid var(--surface-variant);padding:12px 16px 24px;z-index:10}
.save-btn-skel{height:48px;border-radius:12px}
</style>
</head>
<body>
<main data-screen="customer-profile" data-state="loading" role="main">

  <header class="top-bar" role="banner">
    <button class="top-bar-back" aria-label="Back" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" style="fill:var(--text-primary)"/></svg>
    </button>
    <span class="top-bar-title">Customer Information</span>
  </header>

  <div class="scroll-area" aria-hidden="true">
    <div class="skel skel-heading"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="divider"></div>
    <div class="skel skel-heading"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="divider"></div>
    <div class="skel skel-heading"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
  </div>

  <div class="save-btn-wrap" aria-hidden="true">
    <div class="skel save-btn-skel"></div>
  </div>

  <div role="status" aria-live="polite" style="position:absolute;left:-9999px">Loading customer information…</div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
