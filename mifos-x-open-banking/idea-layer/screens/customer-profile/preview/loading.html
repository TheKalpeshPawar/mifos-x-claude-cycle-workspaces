<!doctype html>
<!-- render-hash: cp-loading-b02 -->
<html lang="en" data-screen="customer-profile" data-state="loading" data-feature="customer-profile" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Customer Profile — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --skeleton-base: #E1E4D5; --skeleton-shine: #F1F3E5;
      --radius-soft: 12px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285; --outline-variant: #44483D;
      --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285; --outline-variant: #44483D;
        --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; padding-bottom: 80px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); cursor: pointer; }
    .top-bar h1 { font-size: 18px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .skel { background: linear-gradient(90deg, var(--skeleton-base) 0%, var(--skeleton-shine) 50%, var(--skeleton-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-banner { display: flex; gap: 14px; align-items: center; padding: 20px; margin: 16px; background: var(--surface); border-radius: var(--radius-soft); }
    .skel-avatar { width: 56px; height: 56px; border-radius: 28px; flex-shrink: 0; }
    .skel-banner .lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .skel-line-lg { height: 16px; width: 65%; }
    .skel-line-sm { height: 11px; width: 45%; }
    .skel-section-title { height: 12px; width: 38%; margin: 18px 20px 8px; }
    .skel-card { background: var(--surface); margin: 0 16px 2px; border-radius: var(--radius-soft); border: 1px solid var(--outline-variant); overflow: hidden; }
    .skel-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--surface-variant); }
    .skel-row:last-child { border-bottom: none; }
    .skel-row .skel-label { height: 12px; width: 32%; }
    .skel-row .skel-val { height: 12px; width: 42%; }
    .skel-btn { height: 48px; margin: 18px 16px; border-radius: var(--radius-soft); }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 6px 0 8px; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; cursor: pointer; padding: 6px 10px; border-radius: 8px; min-width: 56px; }
    .nav-item .material-icons { font-size: var(--icon-sm); }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>
  <main aria-busy="true" aria-live="polite">
    <header class="top-bar" role="banner">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back" role="button">arrow_back</span>
      <h1>Customer Profile</h1>
    </header>
    <span class="sr-only">Loading customer profile, please wait.</span>

    <section class="skel-banner" data-component-type="skeleton" data-component-id="customer_banner_skeleton" aria-hidden="true">
      <div class="skel skel-avatar"></div>
      <div class="lines">
        <div class="skel skel-line-lg"></div>
        <div class="skel skel-line-sm"></div>
      </div>
    </section>

    <div class="skel skel-section-title" aria-hidden="true"></div>
    <div class="skel-card" data-component-type="skeleton" data-component-id="personal_info_skeleton" aria-hidden="true">
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
    </div>

    <div class="skel skel-section-title" aria-hidden="true"></div>
    <div class="skel-card" data-component-type="skeleton" data-component-id="address_skeleton" aria-hidden="true">
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
    </div>

    <div class="skel skel-section-title" aria-hidden="true"></div>
    <div class="skel-card" data-component-type="skeleton" data-component-id="employment_skeleton" aria-hidden="true">
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
      <div class="skel-row"><div class="skel skel-label"></div><div class="skel skel-val"></div></div>
    </div>

    <div class="skel skel-btn" aria-hidden="true"></div>
  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" role="navigation" aria-label="Primary">
    <a class="nav-item" data-nav-to="fo-dashboard" tabindex="0" aria-label="Dashboard"><span class="material-icons">dashboard</span><span>Dashboard</span></a>
    <a class="nav-item active" data-nav-to="customer-search" tabindex="0" aria-label="Customers" aria-current="page"><span class="material-icons">people</span><span>Customers</span></a>
    <a class="nav-item" data-nav-to="account-applications" tabindex="0" aria-label="Applications"><span class="material-icons">description</span><span>Applications</span></a>
    <a class="nav-item" data-nav-to="customer-messages" tabindex="0" aria-label="Messages"><span class="material-icons">mail</span><span>Messages</span></a>
    <a class="nav-item" data-nav-to="settings" tabindex="0" aria-label="More"><span class="material-icons">more_vert</span><span>More</span></a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
