sibling: data-flow
schema_version: "4.0"
feature_id: customer-profile
entries:
  - screen_id: customer-profile
    trigger: on_mount
    endpoints:
      - obp_get_customer_profile
    direction: read
    dtos:
      - name: Customer
        role: response
        api_id: obp_get_customer_profile
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: show_error_banner
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_error_state

  - screen_id: customer-profile
    trigger: on_interact
    event: CustomerSaved
    endpoints:
      - obp_update_customer_profile
    direction: write
    dtos:
      - name: Customer
        role: request
        api_id: obp_update_customer_profile
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: show_validation_error
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_error_state

  - screen_id: customer-profile
    trigger: on_interact
    event: EditStarted
    endpoints: []
    direction: none
    dtos: []
    produces_state: editing

  - screen_id: customer-profile
    trigger: on_interact
    event: EditCancelled
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: customer-profile
    trigger: on_interact
    event: CallInitiated
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: customer-profile
    trigger: on_interact
    event: EmailInitiated
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
