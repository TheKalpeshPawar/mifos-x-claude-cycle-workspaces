<html lang="en" data-screen="transactions" data-state="loading" data-feature="transactions" data-flavor="consumer">
<head>
<meta charset="UTF-8">

<title>Transactions — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root {
  --primary: #4C662B; --on-primary: #FFFFFF;
  --primary-container: #CDEDA3; --on-primary-container: #102000;
  --secondary: #386663; --on-secondary: #FFFFFF;
  --error: #BA1A1A; --on-error: #FFFFFF;
  --background: #F9FAEF; --on-background: #1A1C16;
  --surface: #FFFFFF; --on-surface: #1A1C16;
  --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
  --outline: #75796C; --outline-variant: #C5C8BA;
  --shadow: rgba(26,28,22,0.08);
  --skel-base: #E1E4D5; --skel-shine: #EFF2E3;
  --icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;
}
[data-theme="dark"] {
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;
  --background: #12140E; --on-background: #E3E3D8;
  --surface: #1A1C16; --on-surface: #E3E3D8;
  --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
  --outline: #8F9285; --outline-variant: #44483D;
  --shadow: rgba(0,0,0,0.4);
  --skel-base: #2A2C25; --skel-shine: #3A3D33;
}
@media (prefers-color-scheme:dark){:root{
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;
  --background: #12140E; --on-background: #E3E3D8;
  --surface: #1A1C16; --on-surface: #E3E3D8;
  --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
  --outline: #8F9285; --outline-variant: #44483D;
  --shadow: rgba(0,0,0,0.4);
  --skel-base: #2A2C25; --skel-shine: #3A3D33;
}}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; padding-bottom: 88px; }
.top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; }
.top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); }
.top-bar h1 { font-size: 20px; font-weight: 600; flex: 1; color: var(--on-background); }
.search-bar { display: flex; align-items: center; gap: 10px; background: var(--background); border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 16px; margin: 8px 20px; }
.search-bar .material-icons { font-size: var(--icon-sm); color: var(--on-surface-variant); }
.search-bar input { flex: 1; border: none; outline: none; background: transparent; color: var(--on-background); font-family: 'Outfit', sans-serif; font-size: 14px; }
.chips-row { display: flex; gap: 8px; padding: 0 20px 12px; }
.chip { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid var(--outline-variant); background: transparent; color: var(--on-surface-variant); font-family: 'Outfit', sans-serif; }
.chip.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.skel { background: linear-gradient(90deg, var(--skel-base) 0%, var(--skel-shine) 50%, var(--skel-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-summary { height: 80px; margin: 0 20px 16px; border-radius: 16px; }
.skel-row { height: 68px; margin: 0 20px 8px; border-radius: 12px; }
.skel-date-header { height: 14px; width: 92px; margin: 8px 20px 12px; border-radius: 4px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--outline-variant); padding: 6px 0 8px; z-index: 20; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; cursor: pointer; color: var(--on-surface-variant); }
.nav-item.active { color: var(--primary); }
.nav-item .material-icons { font-size: var(--icon-sm); }
.nav-item .nav-label { font-size: 11px; font-weight: 500; }
</style>
</head>

<main data-component-type="screen" data-component-id="transactions_loading">

    <span class="material-icons" data-action="navigate_back" tabindex="0" role="button" aria-label="Go back">arrow_back</span>

  </div>

  <div class="search-bar" data-component-type="input" data-component-id="search_bar" data-action="search_transactions" tabindex="0" role="searchbox" aria-label="Search transactions">
    <span class="material-icons" aria-hidden="true">search</span>
    <input type="text" placeholder="Search by merchant, amount, date..." aria-label="Search transactions" disabled>
    <span class="material-icons" aria-label="Voice search">mic</span>
  </div>

  <div class="chips-row" data-component-type="stack" data-component-id="filter_chips_row" role="group" aria-label="Transaction type filters" aria-busy="true">
    <button class="chip active" data-component-id="filter_all" aria-pressed="true" disabled>All</button>
    <button class="chip" data-component-id="filter_debit" aria-pressed="false" disabled>Debit</button>
    <button class="chip" data-component-id="filter_credit" aria-pressed="false" disabled>Credit</button>
    <button class="chip" data-component-id="filter_pending" aria-pressed="false" disabled>Pending</button>
  </div>

  <div class="skel skel-summary" data-component-type="box" data-component-id="skel_summary" role="status" aria-label="Loading monthly summary" aria-busy="true"></div>

  <div class="skel skel-date-header" aria-hidden="true"></div>

  <div class="skel skel-row" data-component-id="skel_row_1" role="status" aria-label="Loading transaction" aria-busy="true"></div>
  <div class="skel skel-row" data-component-id="skel_row_2" role="status" aria-label="Loading transaction" aria-busy="true"></div>
  <div class="skel skel-row" data-component-id="skel_row_3" role="status" aria-label="Loading transaction" aria-busy="true"></div>
</main>

<nav class="bottom-nav" data-component-type="bottom-nav" data-component-id="bottom_nav" role="navigation" aria-label="Primary">

  <div class="nav-item" data-nav-to="send-money" tabindex="0" role="button" aria-label="Pay"><span class="material-icons">send</span><span class="nav-label">Pay</span></div>

  <div class="nav-item" data-nav-to="settings" tabindex="0" role="button" aria-label="More"><span class="material-icons">more_horiz</span><span class="nav-label">More</span></div>
</nav>

</html>
