<!doctype html>
<!-- render-hash: transactions-loading-obie -->
<html data-screen="transactions" data-state="loading" data-feature="transactions" data-flavor="consumer" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transactions — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
  --font-display:'Outfit',system-ui,sans-serif;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-2xl:48px;
}
[data-theme="light"] {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
}
[data-theme="dark"] {
  --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
  --secondary:#A0CFCB;--on-secondary:#1F3701;--secondary-container:#354E16;--on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB;--on-tertiary:#1F3701;--tertiary-container:#354E16;--on-tertiary-container:#BCEBE7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
  --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
  --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
    --secondary:#A0CFCB;--on-secondary:#1F3701;--secondary-container:#354E16;--on-secondary-container:#BCEBE7;
    --tertiary:#A0CFCB;--on-tertiary:#1F3701;--tertiary-container:#354E16;--on-tertiary-container:#BCEBE7;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
    --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
    --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
    --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
  }
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  display:flex; flex-direction:column; min-height:100vh;
  background:var(--background); color:var(--on-background);
  font-family:var(--font-display); -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined { font-family:'Material Symbols Outlined'; font-weight:400; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; }
.top-bar { display:flex; align-items:center; gap:var(--sp-sm); padding:var(--sp-md) var(--sp-md); background:var(--background); position:sticky; top:0; z-index:5; }
.top-bar .nav-icon { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-pill); border:none; background:transparent; color:var(--on-surface); cursor:pointer; }
.top-bar .nav-icon .material-symbols-outlined { font-size:var(--icon-md); }
.top-bar .title { font-size:22px; font-weight:600; color:var(--on-surface); }
.content { flex:1 1 auto; overflow-y:auto; padding-bottom:var(--sp-md); }
.search-bar { display:flex; align-items:center; gap:var(--sp-sm); margin:var(--sp-md) 20px; padding:var(--sp-md); background:var(--surface-container); border-radius:var(--radius-md); }
.search-bar .material-symbols-outlined { font-size:var(--icon-md); color:var(--on-surface-variant); }
.search-bar .placeholder { flex:1; font-size:15px; color:var(--on-surface-variant); }
.chip-row { display:flex; gap:var(--sp-sm); padding:0 20px var(--sp-md); overflow-x:auto; }
.chip-row::-webkit-scrollbar { display:none; }
.filter-chip { display:inline-flex; align-items:center; padding:var(--sp-sm) var(--sp-md); border-radius:var(--radius-pill); font-size:13px; font-weight:500; white-space:nowrap; border:1px solid var(--outline-variant); background:var(--surface); color:var(--on-surface-variant); }
.filter-chip.active { background:var(--primary); color:var(--on-primary); border-color:transparent; }
@keyframes shimmer { 0% { opacity:0.55; } 50% { opacity:1; } 100% { opacity:0.55; } }
.skel { background:var(--surface-variant); border-radius:var(--radius-md); animation:shimmer 1.4s ease-in-out infinite; }
.skel-summary { height:80px; border-radius:var(--radius-lg); margin:0 20px var(--sp-md); }
.skel-section { height:14px; width:96px; border-radius:var(--radius-xs); margin:var(--sp-xs) 20px var(--sp-sm); }
.skel-row { display:flex; align-items:center; gap:var(--sp-md); background:var(--surface); border-radius:var(--radius-md); padding:14px; margin:0 20px var(--sp-sm); box-shadow:0 1px 2px rgba(0,0,0,0.06); }
[data-theme="dark"] .skel-row { background:var(--surface-container); box-shadow:none; }
.skel-avatar { width:40px; height:40px; border-radius:var(--radius-pill); flex-shrink:0; }
.skel-lines { display:flex; flex-direction:column; flex:1; gap:8px; }
.skel-line-lg { height:14px; width:55%; border-radius:var(--radius-xs); }
.skel-line-sm { height:11px; width:35%; border-radius:var(--radius-xs); }
.skel-amount { width:60px; height:16px; border-radius:var(--radius-xs); flex-shrink:0; }
.bottom-spacer { height:24px; }
.bottom-nav { position:sticky; bottom:0; display:flex; justify-content:space-around; align-items:flex-end; background:var(--surface-container); border-top:1px solid var(--outline-variant); padding:var(--sp-sm) 0 calc(var(--sp-sm) + env(safe-area-inset-bottom)); z-index:5; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; flex:1; color:var(--on-surface-variant); font-family:var(--font-display); }
.nav-item .nav-pill { display:flex; align-items:center; justify-content:center; width:56px; height:28px; border-radius:var(--radius-pill); }
.nav-item .material-symbols-outlined { font-size:var(--icon-md); }
.nav-item .nav-label { font-size:11px; font-weight:500; }
.nav-item.active { color:var(--on-surface); }
.nav-item.active .nav-pill { background:var(--nav-active-indicator); }
.nav-item.active .nav-label { color:var(--on-surface); font-weight:600; }
</style>
</head>
<body data-component-type="screen" data-component-id="transactions_loading">

<header class="top-bar" data-component-type="app-bar" data-component-id="top_app_bar">
  <button class="nav-icon" data-component-type="icon-button" data-component-id="top_bar_back" data-nav-to="account-detail" aria-label="Navigate back">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <span class="title" data-component-type="text" data-component-id="top_bar_title">Transactions</span>
</header>

<main class="content" data-component-type="scroll-container" data-component-id="content_scroll" aria-busy="true">

  <div class="search-bar" data-component-type="input" data-component-id="search_bar" role="searchbox" aria-label="Search transactions">
    <span class="material-symbols-outlined">search</span>
    <span class="placeholder" data-component-type="text" data-component-id="search_placeholder">Search by merchant, amount, date…</span>
    <span class="material-symbols-outlined">mic</span>
  </div>

  <div class="chip-row" data-component-type="stack" data-component-id="filter_chips_row" role="group" aria-label="Transaction type filters">
    <span class="filter-chip active" data-component-type="button" data-component-id="filter_all" role="radio" aria-checked="true">All</span>
    <span class="filter-chip" data-component-type="button" data-component-id="filter_debit" role="radio" aria-checked="false">Debit</span>
    <span class="filter-chip" data-component-type="button" data-component-id="filter_credit" role="radio" aria-checked="false">Credit</span>
    <span class="filter-chip" data-component-type="button" data-component-id="filter_pending" role="radio" aria-checked="false">Pending</span>
  </div>

  <div class="skel skel-summary" data-component-type="box" data-component-id="skel_summary" aria-hidden="true"></div>

  <div class="skel skel-section" data-component-type="box" data-component-id="skel_section_1" aria-hidden="true"></div>

  <div class="skel-row" data-component-type="box" data-component-id="skel_row_1" aria-hidden="true">
    <div class="skel skel-avatar"></div>
    <div class="skel-lines"><div class="skel skel-line-lg"></div><div class="skel skel-line-sm"></div></div>
    <div class="skel skel-amount"></div>
  </div>

  <div class="skel-row" data-component-type="box" data-component-id="skel_row_2" aria-hidden="true">
    <div class="skel skel-avatar"></div>
    <div class="skel-lines"><div class="skel skel-line-lg"></div><div class="skel skel-line-sm"></div></div>
    <div class="skel skel-amount"></div>
  </div>

  <div class="skel skel-section" data-component-type="box" data-component-id="skel_section_2" aria-hidden="true"></div>

  <div class="skel-row" data-component-type="box" data-component-id="skel_row_3" aria-hidden="true">
    <div class="skel skel-avatar"></div>
    <div class="skel-lines"><div class="skel skel-line-lg"></div><div class="skel skel-line-sm"></div></div>
    <div class="skel skel-amount"></div>
  </div>

  <div class="skel-row" data-component-type="box" data-component-id="skel_row_4" aria-hidden="true">
    <div class="skel skel-avatar"></div>
    <div class="skel-lines"><div class="skel skel-line-lg"></div><div class="skel skel-line-sm"></div></div>
    <div class="skel skel-amount"></div>
  </div>

  <div class="bottom-spacer" data-component-type="spacer" data-component-id="bottom_spacer"></div>
</main>

<nav class="bottom-nav" data-component-type="navigation-bar" data-component-id="bottom_nav" role="navigation" aria-label="Primary">
  <button class="nav-item" data-component-type="nav-item" data-component-id="nav_home" data-nav-to="home">
    <span class="nav-pill"><span class="material-symbols-outlined">home</span></span>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-item active" data-component-type="nav-item" data-component-id="nav_accounts" data-nav-to="accounts" aria-current="page">
    <span class="nav-pill"><span class="material-symbols-outlined">account_balance</span></span>
    <span class="nav-label">Accounts</span>
  </button>
  <button class="nav-item" data-component-type="nav-item" data-component-id="nav_pay" data-nav-to="pay">
    <span class="nav-pill"><span class="material-symbols-outlined">send</span></span>
    <span class="nav-label">Pay</span>
  </button>
  <button class="nav-item" data-component-type="nav-item" data-component-id="nav_cards" data-nav-to="pfm-dashboard">
    <span class="nav-pill"><span class="material-symbols-outlined">insights</span></span>
    <span class="nav-label">Insights</span>
  </button>
  <button class="nav-item" data-component-type="nav-item" data-component-id="nav_more" data-nav-to="settings">
    <span class="nav-pill"><span class="material-symbols-outlined">more_horiz</span></span>
    <span class="nav-label">More</span>
  </button>
</nav>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
