<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Transactions — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
  background:var(--background);
  font-family:var(--font);
}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{
  width:390px;height:56px;
  background:var(--surface);
  display:flex;align-items:center;padding:0 8px;
  border-bottom:1px solid var(--surface-variant);
}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
.top-bar-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.screen-content{
  height:calc(844px - 56px - 80px);
  overflow-y:auto;scrollbar-width:none;
}
.screen-content::-webkit-scrollbar{display:none;}
@keyframes shimmer{
  0%{background-position:-390px 0}
  100%{background-position:390px 0}
}
.shimmer{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--background) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:8px;
}
/* Live search bar (visible in loading per state_model) */
.search-bar{
  display:flex;align-items:center;
  background:var(--background);
  border:1px solid var(--surface-variant);
  border-radius:12px;
  padding:10px 14px;
  margin:14px 20px 12px;gap:8px;
}
.search-placeholder{font-size:14px;color:var(--outline);flex:1;}
/* Filter chips (visible in loading per state_model) */
.filter-chips{
  display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none;
}
.filter-chips::-webkit-scrollbar{display:none;}
.chip-skel{height:34px;border-radius:20px;}
/* Skeleton pieces */
.skel-search{height:44px;border-radius:12px;margin:14px 20px 12px;}
.skel-date{height:44px;border-radius:12px;margin:0 20px 12px;}
.skel-summary{height:80px;border-radius:16px;margin:0 20px 16px;}
.skel-date-header{height:12px;width:100px;border-radius:5px;margin:4px 20px 8px;}
.skel-txn-row{
  background:var(--surface);
  border-radius:12px;padding:14px 16px;
  margin:0 20px 8px;
  display:flex;align-items:center;gap:12px;
}
.skel-txn-logo{width:40px;height:40px;border-radius:20px;flex-shrink:0;}
.skel-txn-info{flex:1;display:flex;flex-direction:column;gap:6px;}
.skel-txn-name{height:14px;width:130px;border-radius:6px;}
.skel-txn-meta{height:11px;width:160px;border-radius:5px;}
.skel-txn-amt{height:15px;width:65px;border-radius:6px;}
/* Bottom nav */
.bottom-nav{
  position:absolute;bottom:0;left:0;
  width:390px;height:80px;
  background:var(--surface);border-top:1px solid var(--surface-variant);
  display:flex;align-items:flex-start;padding:12px 12px 16px;gap:8px;
}
.nav-tab{display:flex;flex-direction:column;align-items:center;width:80px;gap:4px;text-decoration:none;}
.nav-pill{display:flex;align-items:center;justify-content:center;width:64px;height:28px;border-radius:14px;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-icon{font-size:22px;color:var(--outline);font-family:'Material Icons';font-style:normal;}
.nav-tab.active .nav-icon{color:var(--primary);}
.nav-label{font-size:11px;color:var(--outline);font-family:var(--font);}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-bar-back">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Transactions</span>
  <div class="top-bar-action">
    <span class="mi" style="font-size:24px;color:var(--outline);">filter_list</span>
  </div>
</header>

<main data-screen="transactions" data-state="loading" role="main" aria-busy="true" aria-label="Loading transactions">
  <div class="screen-content">

    <!-- Search bar (visible in loading state) -->
    <div class="search-bar" role="search" aria-label="Search transactions">
      <span class="mi" style="font-size:20px;color:var(--outline);">search</span>
      <span class="search-placeholder">Search by merchant, amount, date...</span>
    </div>

    <!-- Filter chips (visible in loading state) -->
    <div class="filter-chips" role="group" aria-label="Transaction type filters">
      <div class="shimmer chip-skel" style="width:48px;"></div>
      <div class="shimmer chip-skel" style="width:58px;"></div>
      <div class="shimmer chip-skel" style="width:62px;"></div>
      <div class="shimmer chip-skel" style="width:72px;"></div>
    </div>

    <!-- Summary skeleton -->
    <div class="shimmer skel-summary"></div>

    <!-- Date group skeleton -->
    <div class="shimmer skel-date-header"></div>

    <!-- Transaction row skeletons -->
    <div class="skel-txn-row">
      <div class="shimmer skel-txn-logo"></div>
      <div class="skel-txn-info">
        <div class="shimmer skel-txn-name"></div>
        <div class="shimmer skel-txn-meta"></div>
      </div>
      <div class="shimmer skel-txn-amt"></div>
    </div>

    <div class="skel-txn-row">
      <div class="shimmer skel-txn-logo"></div>
      <div class="skel-txn-info">
        <div class="shimmer skel-txn-name" style="width:110px;"></div>
        <div class="shimmer skel-txn-meta"></div>
      </div>
      <div class="shimmer skel-txn-amt" style="width:80px;"></div>
    </div>

    <div class="skel-txn-row">
      <div class="shimmer skel-txn-logo"></div>
      <div class="skel-txn-info">
        <div class="shimmer skel-txn-name" style="width:90px;"></div>
        <div class="shimmer skel-txn-meta"></div>
      </div>
      <div class="shimmer skel-txn-amt"></div>
    </div>

  </div>
</main>

<nav class="bottom-nav" aria-label="Main navigation" data-component-type="bottom-nav">
  <a class="nav-tab" href="#" data-nav-to="home" aria-label="Home">
    <div class="nav-pill"><span class="nav-icon">home</span></div>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-tab active" href="#" data-nav-to="accounts" aria-label="Accounts" aria-current="page">
    <div class="nav-pill"><span class="nav-icon">account_balance</span></div>
    <span class="nav-label">Accounts</span>
  </a>
  <a class="nav-tab" href="#" data-nav-to="send-money" aria-label="Payments">
    <div class="nav-pill"><span class="nav-icon">send</span></div>
    <span class="nav-label">Payments</span>
  </a>
  <a class="nav-tab" href="#" data-nav-to="profile" aria-label="Profile">
    <div class="nav-pill"><span class="nav-icon">person</span></div>
    <span class="nav-label">Profile</span>
  </a>
</nav>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
