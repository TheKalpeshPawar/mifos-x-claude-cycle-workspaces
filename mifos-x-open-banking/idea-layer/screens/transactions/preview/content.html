<!doctype html>
<html lang="en" data-screen="transactions" data-state="content" data-feature="transactions" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transactions</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>:root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; } main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; } .top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; } .top-bar h1 { font-size: 18px; font-weight: 600; }
    .search-bar { margin: 8px 20px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; display: flex; align-items: center; gap: 8px; } .search-bar .material-icons { font-size: 20px; color: var(--outline); } .search-bar input { border: none; outline: none; font-family: 'Outfit', sans-serif; font-size: 14px; flex: 1; background: transparent; }
    .filter-chips { display: flex; gap: 8px; padding: 8px 20px; } .chip { padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; } .chip.active { background: var(--primary); color: var(--on-primary); } .chip.inactive { background: var(--surface-variant); color: var(--on-surface-variant); }
    .date-header { font-size: 12px; font-weight: 700; color: var(--on-surface-variant); text-transform: uppercase; padding: 16px 20px 8px; letter-spacing: 0.5px; }
    .txn-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--surface-variant); }
    .txn-icon { width: 40px; height: 40px; border-radius: 20px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; flex-shrink: 0; } .txn-icon .material-icons { font-size: 20px; color: var(--primary); }
    .txn-info { flex: 1; } .txn-info .merchant { font-size: 14px; font-weight: 500; } .txn-info .meta { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }
    .txn-amount { font-size: 14px; font-weight: 600; } .txn-amount.debit { color: var(--error); } .txn-amount.credit { color: var(--primary); }
    .load-more { text-align: center; padding: 16px; font-size: 14px; font-weight: 600; color: var(--primary); cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }</style>
</head>
<body><main>
    <div class="top-bar"><span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back">arrow_back</span><h1>Transactions</h1></div>
    <div class="search-bar" data-action="search_transactions" tabindex="0"><span class="material-icons">search</span><input type="text" placeholder="Search transactions" aria-label="Search transactions"></div>
    <div class="filter-chips"><button class="chip active" data-action="filter_type" tabindex="0">All</button><button class="chip inactive" data-action="filter_type" tabindex="0">Debit</button><button class="chip inactive" data-action="filter_type" tabindex="0">Credit</button><button class="chip inactive" data-action="filter_type" tabindex="0">Pending</button></div>
    <div class="date-header">May 2026</div>
    <div class="txn-row" data-nav-to="transaction-detail" tabindex="0"><div class="txn-icon"><span class="material-icons">shopping_cart</span></div><div class="txn-info"><div class="merchant">Tesco</div><div class="meta">23 May · Groceries</div></div><span class="txn-amount debit">-£42.50</span></div>
    <div class="txn-row" data-nav-to="transaction-detail" tabindex="0"><div class="txn-icon"><span class="material-icons">payments</span></div><div class="txn-info"><div class="merchant">Salary</div><div class="meta">22 May · Income</div></div><span class="txn-amount credit">+£3,200.00</span></div>
    <div class="txn-row" data-nav-to="transaction-detail" tabindex="0"><div class="txn-icon"><span class="material-icons">bolt</span></div><div class="txn-info"><div class="merchant">EDF Energy</div><div class="meta">20 May · Utilities</div></div><span class="txn-amount debit">-£94.20</span></div>
    <div class="load-more" data-action="load_more" tabindex="0">Load More</div>
  </main><script src="../../preview/_shared/preview-runtime.js"></script></body></html>
