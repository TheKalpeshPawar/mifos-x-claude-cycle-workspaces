<!doctype html>
<html lang="en" data-screen="transactions" data-state="empty">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Transactions — Empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
.top-bar-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.search-bar{display:flex;align-items:center;background:var(--background);border:1px solid var(--surface-variant);border-radius:12px;padding:10px 14px;margin:14px 20px 8px;gap:8px;}
.search-placeholder{font-size:14px;color:var(--outline);flex:1;}
.filter-chips{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none;}
.filter-chips::-webkit-scrollbar{display:none;}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:13px;border:1px solid var(--surface-variant);color:var(--outline);white-space:nowrap;cursor:pointer;}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:16px;text-align:center;min-height:calc(844px - 56px - 110px - 80px);}
.empty-card{background:var(--surface);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.empty-icon{width:80px;height:80px;background:var(--primary-container);border-radius:40px;display:flex;align-items:center;justify-content:center;}
.empty-icon .mi{font-size:40px;color:var(--primary);}
h2.empty-title{font-size:18px;font-weight:600;color:var(--text-primary);}
p.empty-msg{font-size:13px;color:var(--outline);line-height:1.5;text-align:center;}
.cta-btn{padding:12px 28px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.bottom-nav{position:absolute;bottom:0;left:0;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--surface-variant);display:flex;align-items:flex-start;padding:12px 12px 16px;gap:8px;}
.nav-tab{display:flex;flex-direction:column;align-items:center;width:70px;gap:4px;text-decoration:none;}
.nav-pill{display:flex;align-items:center;justify-content:center;width:64px;height:28px;border-radius:14px;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-icon{font-size:22px;color:var(--outline);font-family:'Material Icons';font-style:normal;}
.nav-tab.active .nav-icon{color:var(--primary);}
.nav-label{font-size:11px;color:var(--outline);font-family:var(--font);}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="home">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Transactions</span>
  <div class="top-bar-action">
    <span class="mi" style="font-size:24px;color:var(--outline);">filter_list</span>
  </div>
</header>

<div class="search-bar">
  <span class="mi" style="font-size:20px;color:var(--outline);">search</span>
  <span class="search-placeholder">Search transactions…</span>
</div>

<div class="filter-chips">
  <div class="filter-chip">All</div>
  <div class="filter-chip">Credits</div>
  <div class="filter-chip">Debits</div>
  <div class="filter-chip">This Month</div>
</div>

<main>
  <div class="empty-card">
    <div class="empty-icon">
      <span class="mi">receipt_long</span>
    </div>
    <h2 class="empty-title">No transactions found</h2>
    <p class="empty-msg">No transactions match your current filters. Try adjusting your search or date range.</p>
    <button class="cta-btn" data-action="clear_filters">Clear Filters</button>
  </div>
</main>

<nav class="bottom-nav" aria-label="Main navigation">
  <a class="nav-tab" data-nav-to="home">
    <div class="nav-pill"><span class="nav-icon">home</span></div>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-tab active" data-nav-to="accounts">
    <div class="nav-pill"><span class="nav-icon">account_balance</span></div>
    <span class="nav-label">Accounts</span>
  </a>
  <a class="nav-tab" data-nav-to="send-money">
    <div class="nav-pill"><span class="nav-icon">send</span></div>
    <span class="nav-label">Pay</span>
  </a>
  <a class="nav-tab" data-nav-to="cards">
    <div class="nav-pill"><span class="nav-icon">credit_card</span></div>
    <span class="nav-label">Cards</span>
  </a>
  <a class="nav-tab" data-nav-to="more">
    <div class="nav-pill"><span class="nav-icon">more_horiz</span></div>
    <span class="nav-label">More</span>
  </a>
</nav>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
