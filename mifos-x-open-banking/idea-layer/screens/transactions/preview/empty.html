<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transactions — empty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-secondary: #50606E;
      --md-secondary-container: #D3E5F5;
      --md-on-secondary-container: #384956;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container-low: #F1F4F9;
      --md-surface-container: #EBEEF3;
      --md-surface-container-high: #E5E8ED;
      --fs-headline-small: 24px; --lh-headline-small: 32px;
      --fs-title-large: 22px;   --lh-title-large: 28px;
      --fs-title-medium: 16px;  --lh-title-medium: 24px;
      --fs-body-large: 16px;    --lh-body-large: 24px;
      --fs-body-medium: 14px;   --lh-body-medium: 20px;
      --fs-label-large: 14px;   --lh-label-large: 20px;
      --fs-label-medium: 12px;  --lh-label-medium: 16px;
      --radius-full: 9999px;
      --radius-medium: 12px;
      --motion-short: 150ms;
      --motion-easing: cubic-bezier(0.2, 0.0, 0, 1.0);
    }
    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-secondary: #B7C9D9;
      --md-secondary-container: #384956;
      --md-on-secondary-container: #D3E5F5;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2024;
      --md-surface-container-high: #262A2E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: var(--md-background);
      color: var(--md-on-surface);
      display: flex;
      flex-direction: column;
      max-width: 412px;
      margin: 0 auto;
      height: 100%;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      user-select: none;
    }

    /* ── Top App Bar ──────────────────────────────────── */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px;
      background: var(--md-surface);
      position: sticky;
      top: 0;
      z-index: 20;
      gap: 4px;
    }
    .top-app-bar__icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--motion-short) var(--motion-easing);
    }
    .top-app-bar__icon-btn:hover  { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
    .top-app-bar__icon-btn:active { background: color-mix(in srgb, var(--md-on-surface) 12%, transparent); }
    .top-app-bar__title {
      flex: 1;
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: 400;
      color: var(--md-on-surface);
    }

    /* ── Filter chips (still visible in empty state per ui.yaml state_binding) ─ */
    .filter-chips-wrap {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      background: var(--md-surface);
      scrollbar-width: none;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .filter-chips-wrap::-webkit-scrollbar { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      font-size: var(--fs-label-large);
      line-height: var(--lh-label-large);
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid var(--md-outline);
      background: transparent;
      color: var(--md-on-surface-variant);
      font-family: 'Roboto', sans-serif;
      transition: background var(--motion-short) var(--motion-easing);
      flex-shrink: 0;
    }
    .chip--selected {
      background: var(--md-secondary-container);
      border-color: transparent;
      color: var(--md-on-secondary-container);
    }
    .chip .material-symbols-outlined { font-size: 18px; }

    /* ── Search Field (visible in empty state) ────────── */
    .search-wrap {
      padding: 8px 16px;
      background: var(--md-surface);
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .search-field {
      display: flex;
      align-items: center;
      background: var(--md-surface-container-high);
      border-radius: var(--radius-medium);
      height: 48px;
      padding: 0 12px;
      gap: 8px;
    }
    .search-field__icon { color: var(--md-on-surface-variant); font-size: 20px; flex-shrink: 0; }
    .search-field__input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-body-medium);
      color: var(--md-on-surface);
      outline: none;
    }
    .search-field__input::placeholder { color: var(--md-on-surface-variant); }

    /* ── Screen content ───────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    /* ── Empty state ──────────────────────────────────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      text-align: center;
      gap: 16px;
    }
    .empty-state__icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background: var(--md-surface-container);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state__icon-wrap .material-symbols-outlined {
      font-size: 40px;
      color: var(--md-on-surface-variant);
    }
    .empty-state__title {
      font-size: var(--fs-title-medium);
      line-height: var(--lh-title-medium);
      font-weight: 500;
      color: var(--md-on-surface);
    }
    .empty-state__body {
      font-size: var(--fs-body-medium);
      line-height: var(--lh-body-medium);
      color: var(--md-on-surface-variant);
      max-width: 260px;
    }

    /* ── Outlined button ──────────────────────────────── */
    .btn-outlined {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 24px;
      border-radius: var(--radius-full);
      border: 1px solid var(--md-outline);
      background: transparent;
      color: var(--md-primary);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-large);
      line-height: var(--lh-label-large);
      font-weight: 500;
      cursor: pointer;
      transition: background var(--motion-short) var(--motion-easing);
      margin-top: 8px;
    }
    .btn-outlined:hover  { background: color-mix(in srgb, var(--md-primary) 8%, transparent); }
    .btn-outlined:active { background: color-mix(in srgb, var(--md-primary) 12%, transparent); }

    /* ── Bottom Navigation ────────────────────────────── */
    .bottom-nav {
      display: flex;
      background: var(--md-surface-container);
      height: 80px;
      align-items: flex-start;
      padding-top: 12px;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 20;
    }
    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      text-decoration: none;
    }
    .bottom-nav__indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
    }
    .bottom-nav__item--active .bottom-nav__indicator {
      background: var(--md-secondary-container);
    }
    .bottom-nav__icon {
      font-size: 24px;
      color: var(--md-on-surface-variant);
    }
    .bottom-nav__item--active .bottom-nav__icon {
      color: var(--md-on-secondary-container);
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: 500;
      color: var(--md-on-surface-variant);
    }
    .bottom-nav__item--active .bottom-nav__label { color: var(--md-on-surface); }
  </style>
</head>
<body data-component-type="screen" data-component-id="transactions" data-component-variant="empty">

  <!-- Top App Bar -->
  <header class="top-app-bar" role="banner">
    <button class="top-app-bar__icon-btn"
            aria-label="Back to Account Detail"
            data-nav-to="account-detail"
            data-nav-type="pop">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Transactions</h1>
  </header>

  <!-- Filter Chips (visible in empty state per state_binding) -->
  <div class="filter-chips-wrap"
       role="group"
       aria-label="Filter transactions"
       data-component-type="chip_row"
       data-component-id="filter_chips">
    <!-- "Money out" selected to illustrate how empty state is reached by filtering -->
    <button class="chip"
            aria-label="Show all transactions"
            aria-pressed="false"
            data-action="filter_transactions"
            data-param-filter="all">
      All
    </button>
    <button class="chip"
            aria-label="Show money in transactions"
            aria-pressed="false"
            data-action="filter_transactions"
            data-param-filter="credit">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span>
      Money in
    </button>
    <button class="chip chip--selected"
            aria-label="Show money out transactions"
            aria-pressed="true"
            data-action="filter_transactions"
            data-param-filter="debit">
      <span class="material-symbols-outlined" aria-hidden="true">check</span>
      Money out
    </button>
    <button class="chip"
            aria-label="Filter by date range"
            aria-pressed="false"
            data-action="open_date_range_picker">
      <span class="material-symbols-outlined" aria-hidden="true">date_range</span>
      Date range
    </button>
  </div>

  <!-- Search Field (visible in empty state per state_binding) -->
  <div class="search-wrap"
       role="search"
       data-component-type="text_field"
       data-component-id="search_field">
    <div class="search-field">
      <span class="material-symbols-outlined search-field__icon" aria-hidden="true">search</span>
      <input class="search-field__input"
             type="search"
             placeholder="Merchant, reference…"
             aria-label="Search transactions by merchant or reference"
             data-action="search_transactions"
             autocomplete="off">
    </div>
  </div>

  <!-- Empty State -->
  <main class="screen-content"
        data-screen="transactions"
        data-state="empty">
    <div class="empty-state"
         aria-label="No transactions match current filters"
         data-component-type="empty_state"
         data-component-id="empty_transactions">
      <div class="empty-state__icon-wrap" aria-hidden="true">
        <span class="material-symbols-outlined">receipt_long</span>
      </div>
      <p class="empty-state__title">No transactions found</p>
      <p class="empty-state__body">Try adjusting your filters or date range.</p>
      <button class="btn-outlined"
              aria-label="Clear all active transaction filters"
              data-action="clear_filters"
              data-component-type="button"
              data-component-id="clear_filters_button">
        Clear filters
      </button>
    </div>
  </main>

  <!-- Bottom Navigation — Home · Accounts · Transactions · More -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="bottom-nav__item"
       href="#"
       data-nav-to="home"

      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">home</span>

    <a class="bottom-nav__item"
       href="#"

        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </a>
    <a class="bottom-nav__item bottom-nav__item--active"
       href="#"
       data-nav-to="transactions"
       data-nav-type="tab"
       aria-label="Transactions, selected"
       aria-current="page">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav__label">Transactions</span>
    </a>
    <a class="bottom-nav__item"
       href="#"
       data-nav-to="settings"
       data-nav-type="tab"
       aria-label="More">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav__label">More</span>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
