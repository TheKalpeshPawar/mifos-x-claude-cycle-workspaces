<!doctype html>
<html lang="en" data-screen="transactions" data-state="searching">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — Searching</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
    .top-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--outline-variant); padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
    .back-btn { background: none; border: none; color: var(--on-surface); cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .search-bar { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--background); border: 1.5px solid var(--primary); border-radius: 12px; padding: 10px 14px; }
    .search-bar .material-icons { color: var(--primary); font-size: 20px; }
    .search-input { flex: 1; background: none; border: none; outline: none; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--on-surface); }
    .spinner-inline { width: 18px; height: 18px; border: 2px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .date-range { display: flex; align-items: center; gap: 8px; padding: 10px 16px; overflow-x: auto; }
    .date-chip { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 10px; padding: 6px 12px; font-size: 12px; color: var(--on-surface-variant); white-space: nowrap; cursor: pointer; font-family: 'Outfit', sans-serif; }
    .date-chip .material-icons { font-size: 14px; color: var(--outline); }
    .filter-chips { display: flex; gap: 8px; padding: 4px 16px 12px; overflow-x: auto; }
    .chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid var(--outline-variant); background: var(--surface); color: var(--on-surface-variant); white-space: nowrap; cursor: pointer; font-family: 'Outfit', sans-serif; }
    .chip.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .search-hint { font-size: 12px; color: var(--primary); padding: 0 16px 12px; }
    .section-label { font-size: 11px; font-weight: 600; color: var(--on-surface-variant); padding: 4px 16px 8px; text-transform: uppercase; letter-spacing: 0.6px; }
    /* Skeleton transaction rows */
    .skel-group { background: var(--surface); border-radius: 12px; margin: 0 16px 12px; overflow: hidden; }
    .skel-date-hd { height: 11px; width: 100px; background: var(--surface-variant); border-radius: 4px; margin: 12px 16px 8px; animation: shimmer 1.4s ease-in-out infinite; }
    .skel-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--surface-variant); }
    .skel-row:last-child { border-bottom: none; }
    .skel-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-variant); flex-shrink: 0; animation: shimmer 1.4s ease-in-out infinite; }
    .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skel-line { border-radius: 4px; background: var(--surface-variant); animation: shimmer 1.4s ease-in-out infinite; }
    .skel-amount { width: 60px; height: 14px; background: var(--surface-variant); border-radius: 4px; animation: shimmer 1.4s ease-in-out infinite; flex-shrink: 0; }
    @keyframes shimmer { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
    /* Bottom nav */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 390px; background: var(--surface); border-top: 1px solid var(--outline-variant); display: flex; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 3px; cursor: pointer; }
    .nav-label { font-size: 11px; color: var(--outline); }
    .nav-label.active { color: var(--primary); }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main>

  <header class="top-bar" role="banner" data-component-type="top_app_bar" data-component-id="transactions_top_bar">
    <button class="back-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <div class="search-bar" role="search" aria-label="Searching transactions">
      <span class="material-icons" aria-hidden="true">search</span>
      <input class="search-input" data-component-type="input" data-component-id="transaction_search_input"
             type="text" value="rent" aria-label="Search transactions" tabindex="0">
      <div class="spinner-inline" aria-live="polite" aria-label="Searching..."></div>
    </div>
  </header>

  <div class="date-range" data-component-type="stack" data-component-id="date_range_row">
    <div class="date-chip" data-action="open_start_date" tabindex="0">
      <span class="material-icons" aria-hidden="true">calendar_today</span>
      01 May 2026
    </div>
    <span style="font-size:12px;color:var(--outline);flex-shrink:0;">to</span>
    <div class="date-chip" data-action="open_end_date" tabindex="0">
      <span class="material-icons" aria-hidden="true">calendar_today</span>
      27 May 2026
    </div>
  </div>

  <div class="filter-chips" data-component-type="stack" data-component-id="filter_chips_row" role="group" aria-label="Filter transactions">
    <button class="chip active" data-action="filter_all" aria-pressed="true" tabindex="0">All</button>
    <button class="chip" data-action="filter_debits" aria-pressed="false" tabindex="0">Debits</button>
    <button class="chip" data-action="filter_credits" aria-pressed="false" tabindex="0">Credits</button>
    <button class="chip" data-action="filter_transfers" aria-pressed="false" tabindex="0">Transfers</button>
  </div>

  <p class="search-hint" aria-live="polite">Searching for "rent"…</p>
  <p class="section-label">Results</p>

  <div role="list" aria-label="Transaction results loading" data-component-type="stack" data-component-id="transaction_results_list">
    <div class="skel-group" role="listitem" aria-hidden="true">
      <div class="skel-date-hd"></div>
      <div class="skel-row">
        <div class="skel-icon"></div>
        <div class="skel-lines">
          <div class="skel-line" style="height:13px;width:60%;"></div>
          <div class="skel-line" style="height:10px;width:40%;"></div>
        </div>
        <div class="skel-amount"></div>
      </div>
      <div class="skel-row">
        <div class="skel-icon"></div>
        <div class="skel-lines">
          <div class="skel-line" style="height:13px;width:50%;"></div>
          <div class="skel-line" style="height:10px;width:30%;"></div>
        </div>
        <div class="skel-amount" style="width:50px;"></div>
      </div>
    </div>
    <div class="skel-group" role="listitem" aria-hidden="true">
      <div class="skel-date-hd" style="width:80px;"></div>
      <div class="skel-row">
        <div class="skel-icon"></div>
        <div class="skel-lines">
          <div class="skel-line" style="height:13px;width:65%;"></div>
          <div class="skel-line" style="height:10px;width:45%;"></div>
        </div>
        <div class="skel-amount" style="width:55px;"></div>
      </div>
    </div>
  </div>

  </main>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation"
       data-component-type="stack" data-component-id="bottom_nav">
    <div class="nav-item" data-action="navigate_home" tabindex="0">
      <span class="material-icons" style="color:var(--outline);" aria-hidden="true">home</span>
      <span class="nav-label">Home</span>
    </div>
    <div class="nav-item" data-action="navigate_payments" tabindex="0">
      <span class="material-icons" style="color:var(--outline);" aria-hidden="true">send</span>
      <span class="nav-label">Payments</span>
    </div>
    <div class="nav-item" aria-current="page">
      <span class="material-icons" style="color:var(--primary);" aria-hidden="true">receipt_long</span>
      <span class="nav-label active">Transactions</span>
    </div>
    <div class="nav-item" data-action="navigate_cards" tabindex="0">
      <span class="material-icons" style="color:var(--outline);" aria-hidden="true">credit_card</span>
      <span class="nav-label">Cards</span>
    </div>
    <div class="nav-item" data-action="navigate_profile" tabindex="0">
      <span class="material-icons" style="color:var(--outline);" aria-hidden="true">person</span>
      <span class="nav-label">Profile</span>
    </div>
  </nav>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
