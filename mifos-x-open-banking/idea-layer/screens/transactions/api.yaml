sibling: api
schema_version: "4.0"
feature_id: transactions
api:
  # Booked rows — shipped list call. v6.0.0 returns transaction_attributes inline (TXN_TYPE →
  # category badge), no N+1 fetch. The sandbox caps the window at the 50 newest transactions and
  # ignores limit/offset/from_date/to_date/type/sort_direction, so filter/search/date-range/paging
  # all run client-side. The v3.0.0 .../owner/transactions sibling endpoint still exists in the
  # client but is consumed only by CounterpartyNameResolver's mirror-join, not by this screen.
  - id: obp_list_transactions_with_attributes
    endpoint: "GET /obp/v6.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: bankId
        type: path
      - name: accountId
        type: path
      - name: limit
        type: query
        optional: true
        note: "ignored by sandbox"
      - name: offset
        type: query
        optional: true
        note: "ignored by sandbox"
    response:
      fields:
        - name: transactions
          type: "List<Transaction>"
          children:
            - name: id
              type: String
            - name: this_account
              type: object
            - name: other_account
              type: object
              children:
                - name: id
                  type: String
                - name: holder
                  type: object
            - name: details
              type: object
              children:
                - name: type
                  type: String
                - name: description
                  type: String
                - name: posted
                  type: String
                - name: completed
                  type: String
                - name: value
                  type: object
                  children:
                    - name: currency
                      type: String
                    - name: amount
                      type: String
            - name: transaction_attributes
              type: "List<TransactionAttribute>"
              note: "TXN_TYPE drives the category badge"
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"
      - code: 500
        message: "OBP server error"

  # Pending payments — transaction-requests still INITIATED (no booked transaction). Filtered
  # client-side to isPending; shown muted above the booked groups and excluded from monthly totals.
  - id: obp_list_transaction_requests
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-requests"
    tag: Transaction-Requests
    auth: DirectLogin
    params:
      - name: bankId
        type: path
      - name: accountId
        type: path
    response:
      fields:
        - name: transaction_requests
          type: "List<TransactionRequestSummary>"
          children:
            - name: id
              type: String
            - name: status
              type: String
              note: "INITIATED → isPending"
            - name: start_date
              type: String
            - name: details
              type: object
              children:
                - name: description
                  type: String
                - name: value
                  type: object
                  children:
                    - name: currency
                      type: String
                    - name: amount
                      type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"
