sibling: api
schema_version: "4.0"
feature_id: transactions
consent_dependency: "All reads require an authorised account-access-consent (Status AUTH) and an authorization-code token scoped to the accounts cluster (ReadTransactionsBasic/Detail/Credits/Debits, ReadAccountsBasic). mutual TLS + x-fapi-financial-id header on every call."
api:
  - id: ais_get_transactions
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    tag: AISP-Transactions
    auth: OAuth2-FAPI
    demo_source: demo-data.yaml#/collections/ais_get_transactions
    description: "OBIE AISP transactions for a single authorised AccountId (OBReadTransaction6). Detail varies by the consented ReadTransactions* permission. fromBookingDateTime/toBookingDateTime query params bound the booking window (UTC ISO 8601; timezone component ignored by the ASPSP) and drive pagination. OBIE has NO free-text search param — the merchant/amount search runs client-side over the fetched Data.Transaction[]. Requires an authorised account-access-consent + authorization-code token. CE HSBCnet + Malta use the v3.1 (+ /ce) path."
    params:
      - name: AccountId
        type: path
      - name: fromBookingDateTime
        type: query
        optional: true
        note: "UTC ISO 8601 lower bound on BookingDateTime (server-side date filter)"
      - name: toBookingDateTime
        type: query
        optional: true
        note: "UTC ISO 8601 upper bound on BookingDateTime (server-side date filter)"
    response:
      fields:
        - name: Data.Transaction
          type: "Array<OBReadTransaction6>"
          children:
            - name: AccountId
              type: String
            - name: TransactionId
              type: String
              note: "Unique transaction identifier (nullable in OBIE)"
            - name: TransactionReference
              type: String
            - name: CreditDebitIndicator
              type: String
              note: "OBInternalCreditDebitCode: Credit | Debit — drives sign/colour and the Debit/Credit filter"
            - name: Status
              type: String
              note: "ExternalEntryStatus1Code: Booked | Pending"
            - name: BookingDateTime
              type: String
              note: "ISO 8601 booking date-time — drives date grouping + client-side date filter/sort"
            - name: ValueDateTime
              type: String
            - name: TransactionInformation
              type: String
              note: "Free-text description; counterparty display fallback"
            - name: Amount
              type: object
              children:
                - name: Amount
                  type: String
                  note: "Decimal string"
                - name: Currency
                  type: String
                  note: "ISO 4217"
            - name: MerchantDetails
              type: object
              children:
                - name: MerchantName
                  type: String
                  note: "Counterparty display — preferred name (resolved holder name → MerchantName → TransactionInformation)"
            - name: BankTransactionCode
              type: object
              children:
                - name: Code
                  type: String
            - name: Balance
              type: object
              children:
                - name: Amount
                  type: object
                  children:
                    - name: Amount
                      type: String
            - name: CreditorAccount
              type: object
              children:
                - name: Identification
                  type: String
                  note: "Never rendered raw as a counterparty name — counterparty rule"
            - name: DebtorAccount
              type: object
              children:
                - name: Identification
                  type: String
        - name: Links.Next
          type: String
          note: "Pagination next-page link"
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus (e.g. consent not AUTH or missing ReadTransactions* permission)"
      - code: 429
        message: "TOO_MANY_REQUESTS"
      - code: 500
        message: "OB.UnexpectedError"
