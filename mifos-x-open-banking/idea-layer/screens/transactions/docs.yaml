description: >
  Displays the full transaction history for a single authorised account. Supports credit/debit filter chips, a
  date-range chip with server-side re-fetch, and free-text search by merchant or reference. Transactions are grouped by
  booking date. Each row shows merchant name, PFM category chip, colour-coded amount (credit = primary, debit = error),
  and a Pending badge when OBTransaction6.Status=Pending. A period summary strip shows totals for money-in and money-out
  across the filtered result set. OBIE Links.Next pagination is surfaced via a 'Load more' affordance with inline linear
  progress. All text labels use i18n {strings.transactions.*} references. Tapping a row navigates to transaction-detail.
has_ui: true
has_server: true
permissions_required:
  - ReadTransactionsDetail
obie_resources:
  - OBReadTransaction6
notes: >
  Client-side Category field is derived from ProprietaryBankTransactionCode.Code or MerchantDetails.MerchantCategoryCode
  mapping. Not returned by OBIE API directly.
metadata:
  category: transaction-list
  implementation_ready: true
  impl_ready_at: '2026-06-29'
  impl_ready_schema: v2
contracts: []
libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
  - capability: datetime
    library: kotlinx-datetime
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
vm_actions:
  - name: LoadTransactions
    signature: 'suspend fun loadTransactions(accountId: String)'
    state_mutations:
      - uiState = TransactionsUiState.Loading
      - uiState = TransactionsUiState.Content(transactionsByDate) on success
      - uiState = TransactionsUiState.Error(message) on failure
    side_effects:
      - >-
        GET /accounts/{accountId}/transactions via ktorfit; groups by BookingDateTime LocalDate via kotlinx-datetime;
        derives Category via MCC lookup map
    error_handling:
      on_401: emit TokenExpiredError; surface error state
      on_403: emit ConsentWithdrawnError; surface error state
      on_429: emit RateLimitError with retry-after hint; surface error state
      on_network: emit NetworkError; surface error state
  - name: FilterTransactions
    signature: 'fun filterTransactions(filter: TransactionFilter)'
    state_mutations:
      - activeFilter = filter
      - filteredList = transactions.filter { it.CreditDebitIndicator matches filter }
      - emit empty state if filteredList is empty
    side_effects: []
    error_handling: {}
  - name: OpenDateRangePicker
    signature: fun openDateRangePicker()
    state_mutations:
      - showDateRangePicker = true
    side_effects:
      - Show system date range picker dialog
    error_handling: {}
  - name: SearchTransactions
    signature: 'fun searchTransactions(query: String)'
    state_mutations:
      - searchQuery = query
      - >-
        filteredList = transactions.filter { case-insensitive match on TransactionInformation and
        MerchantDetails.MerchantName }
      - emit empty state if filteredList is empty
    side_effects: []
    error_handling: {}
  - name: NavigateTransactionDetail
    signature: 'fun navigateTransactionDetail(transactionId: String, accountId: String)'
    state_mutations: []
    side_effects:
      - Push transaction-detail route with transactionId and accountId params
    error_handling: {}
  - name: ClearFilters
    signature: fun clearFilters()
    state_mutations:
      - activeFilter = TransactionFilter.All
      - searchQuery = ''
      - dateRange = null
      - filteredList = all transactions
    side_effects: []
    error_handling: {}
  - name: RetryLoad
    signature: fun retryLoad()
    state_mutations:
      - nextLink = null
      - hasNextPage = false
      - isPaginating = false
      - delegates to LoadTransactions with current accountId
    side_effects: []
    error_handling: {}
  - name: LoadMoreTransactions
    signature: suspend fun loadMoreTransactions()
    state_mutations:
      - isPaginating = true
      - fetches nextLink URL via ktorfit; appends OBTransaction6 items to transactions list
      - nextLink = response.Links.Next (null if last page)
      - hasNextPage = response.Links.Next != null
      - isPaginating = false
      - recomputes period totals and filteredList from extended accumulated list
    side_effects:
      - GET nextLink (absolute OBIE Links.Next URL) via ktorfit
    error_handling:
      on_any: emit NetworkError or ApiError; surface error state; isPaginating = false
  - name: SetDateRange
    signature: 'fun setDateRange(from: LocalDate, to: LocalDate)'
    state_mutations:
      - dateRange = DateRange(from, to)
      - nextLink = null
      - hasNextPage = false
      - isPaginating = false
      - >-
        delegates to LoadTransactions with fromBookingDateTime=from.atStartOfDayIn(UTC) and
        toBookingDateTime=to.atTime(23, 59, 59).toInstant(UTC)
    side_effects:
      - Re-fetches first page of transactions with date bounds; pagination cursor reset
    error_handling:
      on_network: emit NetworkError; surface error state
error_cases:
  - id: TokenExpiredError
    http_status: 401
    user_message: Session expired. Please log in again.
    recoverable: true
    recovery_action: retry_load
  - id: ConsentWithdrawnError
    http_status: 403
    user_message: Access to transactions has been withdrawn.
    recoverable: false
    recovery_action: navigate_back
  - id: RateLimitError
    http_status: 429
    user_message: Too many requests. Please wait a moment and retry.
    recoverable: true
    recovery_action: retry_load
  - id: NetworkError
    http_status: null
    user_message: No network connection. Please check your connection and retry.
    recoverable: true
    recovery_action: retry_load
