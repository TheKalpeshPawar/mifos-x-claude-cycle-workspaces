sibling: demo-data
schema_version: "4.0"
feature_id: transactions

# OBIE AISP fixtures backing the transactions list screen.
# ais_get_transactions -> OBReadTransaction6 (Data.Transaction[]) for the current account,
# newest first, spanning Booked + Pending and Credit + Debit, with a running Balance.Amount per row,
# BankTransactionCode.Code (ISO 20022), and Creditor/Debtor sort-code accounts. Same James Whitfield
# persona / sort-code 30-00-00 as home/account-detail. Counterparty display uses MerchantDetails.MerchantName
# then TransactionInformation — never a raw CreditorAccount/DebtorAccount Identification.
collections:
  ais_get_transactions:
    dto: OBReadTransaction6
    description: "200 OK — paginated transaction history for the current account, newest first; Links.Next supplies the next page."
