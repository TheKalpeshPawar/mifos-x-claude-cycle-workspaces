  # OBErrorResponse1 envelope for the 400/403/500 error state.
  error:
    dto: OBErrorResponse1
    description: "Representative 403 OBErrorResponse1 driving the error state when the consent lacks ReadTransactions."
    item:
      Code: "403 Forbidden"
      Id: "a912-err-66d1"
      Message: "Invalid consent status"
      Errors:
        - ErrorCode: "UK.OBIE.Resource.InvalidConsentStatus"
          Message: "The account-access-consent does not grant a ReadTransactions permission."
