feature: transactions
flow_ref: transaction-review

entry_points:
  - source: account-detail
    label: "Tap Transactions chip"
    params: [accountId]
  - source: pfm
    label: "Drill down from PFM category"
    params: [accountId, category]

transitions:
  - from: transactions
    to: account-detail
    trigger: "Back button"
  - from: transactions
    to: transaction-detail
    trigger: "Tap transaction row"
    params: [transactionId, accountId]
