  top_app_bar:
    show: true
    title: "Transactions"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    # Shipped TopAppBar has no actions — the advanced-filter action was omitted (the type
    # chips + date-range chips cover filtering). Also note the search bar's trailing mic icon
    # in the spec is not wired in the shipped Header.
    actions: []
  nav_items:
    - id: nav_home
      label: Home
      icon: home
      target: home
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
      active: true
    - id: nav_pay
      label: Pay
      icon: send
      target: send-money
    - id: nav_cards
      label: Cards
      icon: credit_card
      target: cards
    - id: nav_more
      label: More
      icon: more_horiz
