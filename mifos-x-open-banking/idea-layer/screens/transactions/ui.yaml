screens:
  - id: transactions_content
    label: Transaction History
    route: /transactions
    scroll: vertical

archetype: index_list

components:
  - type: input
    id: search_bar
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: search
      background: "#F9FAEF"
      border_radius: 12
      padding_horizontal: spacing.md
      padding_vertical: spacing.md
      margin_horizontal: 20
      margin_top: spacing.md
      margin_bottom: spacing.md
      leading_icon: search
      trailing_icon: mic
      leading_icon_color: "#44483D"
    placeholder: "Search by merchant, amount, date..."
    on_click:
      action: search_transactions
    a11y:
      role: searchbox
      label: "Search transactions"
      hint: "Search by merchant name, amount, or date"
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: search_bar
      assert_visible: true
      assert_placeholder: "Search by merchant, amount, date..."
      purpose: "Filter transactions by free-text query"
      interaction_type: text_input
      data_driven: true

  # Shipped: a horizontally-scrolling row of M3 FilterChips — one per DateRangePreset
  # (7/30/60/90 days) plus a Custom chip that opens the shared DateRangePickerDialog
  # (future days disabled, max = today). Default selection is Last 30 Days. Replaced
  # the single date_range_picker box+menu chip that the spec previously modelled.
  - type: stack
    id: date_chips_row
    style:
      direction: horizontal
      spacing: spacing.sm
      padding_horizontal: 20
      padding_bottom: spacing.md
      overflow: scroll_horizontal
    a11y:
      role: group
      label: "Date range filters"
    test_context:
      tag: date_chips_row
    children:
      - type: chip
        id: range_chip_last_7_days
        label: "7 days"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: filter
          border_radius: 20
          padding_horizontal: spacing.md
          padding_vertical: spacing.sm
          typography: "Outfit/label_medium"
        on_click:
          action: select_date_preset
          params:
            preset: LAST_7_DAYS
        a11y:
          role: radio
          selected: false
          label: "Show transactions from the last 7 days"
        keyboard:
          focusable: true
        test_context:
          tag: range_chip_LAST_7_DAYS
          assert_clickable: true
          interaction_type: toggle

      - type: chip
        id: range_chip_last_30_days
        label: "30 days"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: filter
          border_radius: 20
          padding_horizontal: spacing.md
          padding_vertical: spacing.sm
          typography: "Outfit/label_medium"
        on_click:
          action: select_date_preset
          params:
            preset: LAST_30_DAYS
        a11y:
          role: radio
          selected: true
          label: "Show transactions from the last 30 days"
        keyboard:
          focusable: true
        test_context:
          tag: range_chip_LAST_30_DAYS
          assert_clickable: true
          interaction_type: toggle

      - type: chip
        id: range_chip_last_60_days
        label: "60 days"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: filter
          border_radius: 20
          padding_horizontal: spacing.md
          padding_vertical: spacing.sm
          typography: "Outfit/label_medium"
        on_click:
          action: select_date_preset
          params:
            preset: LAST_60_DAYS
        a11y:
          role: radio
          selected: false
          label: "Show transactions from the last 60 days"
        keyboard:
          focusable: true
        test_context:
          tag: range_chip_LAST_60_DAYS
          assert_clickable: true
          interaction_type: toggle

      - type: chip
        id: range_chip_last_90_days
        label: "90 days"
        supported_states: [idle, hover, focus_visible, pressed, disabled]
        style:
          variant: filter
          border_radius: 20
          padding_horizontal: spacing.md
          padding_vertical: spacing.sm
          typography: "Outfit/label_medium"
        on_click:
          action: select_date_preset
          params:
            preset: LAST_90_DAYS
        a11y:
          role: radio
          selected: false
          label: "Show transactions from the last 90 days"
        keyboard:
          focusable: true
        test_context:
          tag: range_chip_LAST_90_DAYS
          assert_clickable: true
          interaction_type: toggle

      - type: chip
