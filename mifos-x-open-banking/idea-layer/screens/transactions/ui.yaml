          type: box
          style:
            background: "#E1E4D5"
            border_radius: 16
            height: 80
            margin_horizontal: 20
            margin_bottom: 12
        - id: skel_row_1
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 68
            margin_horizontal: 20
            margin_bottom: 8
        - id: skel_row_2
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 68
            margin_horizontal: 20
            margin_bottom: 8
        - id: skel_row_3
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 68
            margin_horizontal: 20
            margin_bottom: 8

  content:
    layout:
      components_visible:
        - search_bar
        - date_range_picker
        - filter_chips_row
        - monthly_summary_card
        - transactions_date_group_header
        - txn_list_row_1
        - txn_list_row_2
        - txn_list_row_3
        - load_more_button

  empty:
    layout:
      components_visible:
        - search_bar
        - date_range_picker
        - filter_chips_row
      empty_card:
        id: empty_state_card
        illustration: no_transactions
        title: "No transactions found"
        message: "No transactions match your current filters. Try adjusting your search or date range."
        action_label: "Clear Filters"
        action: clear_filters

  error:
    layout:
      components_visible:
        - search_bar
      error_card:
        id: error_state_card
        title: "Could not load transactions"
        message: "We were unable to load your transactions. Check your connection and try again."
        action_label: "Retry"
        action: retry_load
        icon: error_outline

  searching:
    layout:
      components_visible:
        - search_bar
        - filter_chips_row
      skeleton:
        - id: skel_search_1
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 68
            margin_horizontal: 20
            margin_bottom: 8
        - id: skel_search_2
          type: box
          style:
            background: "#E1E4D5"
            border_radius: 12
            height: 68
            margin_horizontal: 20
            margin_bottom: 8

state_model:
  view_model: TransactionsViewModel
  screen_state: TransactionsScreenState
  state_fields:
    - name: isLoading
      type: Boolean
      default: "true"
    - name: transactions
      type: "List<TransactionSummary>"
      default: "emptyList()"
    - name: activeFilter
      type: TransactionTypeFilter
      default: TransactionTypeFilter.ALL
    - name: dateRange
      type: DateRange
      default: "DateRange.LAST_30_DAYS"
    - name: searchQuery
      type: String
      default: '""'
    - name: totalSpent
      type: "BigDecimal"
      default: "BigDecimal.ZERO"
    - name: totalReceived
      type: "BigDecimal"
      default: "BigDecimal.ZERO"
    - name: currentPage
      type: Int
      default: "0"
    - name: hasMore
      type: Boolean
      default: "true"
    - name: error
      type: "UiError?"
      default: "null"
    - name: isSearching
      type: Boolean
      default: "false"
  errors:
    - id: network_error
      message: "Network unavailable. Please check your connection."
    - id: auth_error
      message: "Session expired. Please log in again."
  events:
    - RetryLoad
    - "SearchQueryChanged(query: String)"
    - "FilterTypeChanged(filter: TransactionTypeFilter)"
    - "DateRangeChanged(range: DateRange)"
    - LoadMore
    - "TransactionSelected(transactionId: String)"
    - ClearFilters
  actions:
    - name: loadTransactions
      triggers: [ScreenOpened, RetryLoad, ClearFilters]
    - name: searchTransactions
      param: query
    - name: filterByType
      param: TransactionTypeFilter
    - name: filterByDateRange
      param: DateRange
    - name: loadNextPage
    - name: navigateToDetail
      param: transactionId
  di:
    - TransactionsRepository
    - AccountsRepository

api:
  - endpoint: "GET /obp/v5.1.0/my/banks/{bankId}/accounts/{accountId}/transactions"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: accountId
        type: path
      - name: limit
        type: query
        value: "20"
      - name: offset
        type: query
        value: "0"
      - name: from_date
        type: query
        example: "2026-04-25T00:00:00.000Z"
      - name: to_date
        type: query
        example: "2026-05-25T23:59:59.999Z"
      - name: type
        type: query
        optional: true
        values: [DEBIT, CREDIT, SEPA_CREDIT_TRANSFERS, UK_FASTER_PAYMENTS_SEND]
      - name: sort_direction
        type: query
        value: "DESC"
    response:
      fields:
        - name: id
          type: String
        - name: this_account
          type: object
        - name: other_account
          type: object
          children:
