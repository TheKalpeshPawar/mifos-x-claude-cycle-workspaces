state_model:
  view_model: TransactionsViewModel
  # Shipped: a single StateFlow<ScreenState<TransactionsContent>> derived by combining a raw
  # data flow (Loading/Failed/Loaded) with a FilterState flow and projecting per state. The
  # legacy flat TransactionsScreenState was never built.
  screen_state: "ScreenState<TransactionsContent>"
  state_wrapper: ScreenState
  screen_states: [Loading, Content, Empty, Error, NoNetwork, Unauthenticated]
  content_class: TransactionsContent
  content_fields:
    - name: pending
      type: "List<PendingPayment>"
    - name: groups
      type: "List<TransactionDayGroup>"
    - name: summary
      type: MonthlySummary
    - name: filter
      type: TransactionTypeFilter
    - name: range
      type: DateRangeFilter
    - name: query
      type: String
    - name: hasMore
      type: Boolean
    - name: counterpartyNames
      type: "Map<String, String>"
      default: "emptyMap()"
    - name: counterpartyPlaceholder
      type: String
      default: '""'
  supporting_types:
    - name: TransactionTypeFilter
      kind: enum
      values: [ALL, DEBIT, CREDIT, PENDING]
    - name: DateRangePreset
      kind: enum
      values: [LAST_7_DAYS, LAST_30_DAYS, LAST_60_DAYS, LAST_90_DAYS, CUSTOM]
    - name: DateRangeFilter
      kind: data_class
      fields: [preset, start, end]
      note: "start/end are resolved LocalDate bounds (null = unbounded); default preset LAST_30_DAYS"
    - name: PendingPayment
      kind: data_class
      fields: [id, description, amount, currency, date]
      note: "An initiated-but-unbooked transaction-request (above the SCA threshold, awaiting confirmation)"
    - name: TransactionDayGroup
      kind: data_class
      fields: [date, transactions]
    - name: MonthlySummary
      kind: data_class
      fields: [spent, received, currency]
      note: "Month-to-date totals over booked transactions only; pending excluded; computed client-side in account currency"
  filter_state:
    note: "Private FilterState holds filter/range/query/page (search is a filter field, NOT a ScreenState). page starts at 1; visible rows = booked.take(page * PAGE_SIZE)."
    fields: [filter, range, query, page]
  constants:
    - name: PAGE_SIZE
      value: 10
  events:
    - RetryLoad
    - "SearchQueryChanged(query: String)"
    - "FilterTypeChanged(filter: TransactionTypeFilter)"
    - "DateRangePresetSelected(preset: DateRangePreset)"
    - "CustomRangeSelected(start: LocalDate, end: LocalDate)"
    - LoadMore
    - "TransactionSelected(transactionId: String)"
    - "PendingSelected(requestId: String)"
  methods:
    - name: onRetry
    - name: onQueryChanged
      param: query
    - name: onFilterChanged
      param: TransactionTypeFilter
    - name: onRangePresetSelected
      param: DateRangePreset
    - name: onCustomRangeSelected
      params: [start, end]
    - name: onLoadMore
  data_flow:
    note: "load() fetches listTransactionsWithAttributes (booked, v6 attributes) + listTransactionRequests (pending, filtered isPending) + accountDetail (currency); resolves counterparty names via CounterpartyNameResolver.resolve + placeholderHolder. Filtering, search, date-range and paging are all client-side because the sandbox caps the window at the 50 newest transactions and ignores limit/offset/date params."
  di:
    - TransactionsRepository
    - PaymentsRepository
    - AccountsRepository
    - CounterpartyNameResolver

# Counterparty display — HARD RULE (workspaces/mifos-x/CLAUDE.md):
# other_account.holder.name is the OBP login-username placeholder for self-transfers and
# unresolved merchants and must NEVER be rendered directly. The row title and search-match
# text both go through counterpartyDisplayName(txn, counterpartyNames, counterpartyPlaceholder)
# whose precedence is: resolved destination account holder name → real non-placeholder holder
# → transaction description. counterpartyNames is built by CounterpartyNameResolver.resolve()
# (mirror-join of self-transfers across the user's own accounts), placeholder = the login
# username from the profile. The static merchant names in the rows above are demo content only.

api:
  # Booked rows — the shipped list call. v6.0.0 returns transaction_attributes inline (TXN_TYPE
  # → category badge) so no N+1 attribute fetch. The v3.0.0 sibling endpoint still exists in the
  # client but is used only by CounterpartyNameResolver's mirror-join, not by this screen's load.
  # Sandbox ignores limit/offset/from_date/to_date/type/sort_direction — kept here for contract
  # completeness but filtering/paging run client-side.
  - id: obp_list_transactions_with_attributes
    endpoint: "GET /obp/v6.0.0/banks/{bankId}/accounts/{accountId}/owner/transactions"
    tag: Transactions
    auth: DirectLogin
    params:
      - name: bankId
        type: path
      - name: accountId
        type: path
      - name: limit
        type: query
        optional: true
        note: "ignored by sandbox"
      - name: offset
        type: query
        optional: true
        note: "ignored by sandbox"
    response:
      fields:
        - name: transactions
          type: "List<Transaction>"
          children:
            - name: id
              type: String
            - name: this_account
              type: object
            - name: other_account
              type: object
              children:
                - name: id
                  type: String
                - name: holder
                  type: object
            - name: details
              type: object
              children:
                - name: type
                  type: String
                - name: description
                  type: String
                - name: posted
                  type: String
                - name: completed
                  type: String
                - name: value
                  type: object
                  children:
                    - name: currency
                      type: String
                    - name: amount
                      type: String
            - name: transaction_attributes
              type: "List<TransactionAttribute>"
              note: "TXN_TYPE drives the category badge"
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"
      - code: 500
        message: "OBP server error"

  # Pending payments — transaction-requests still INITIATED (no booked transaction). Filtered
  # client-side to isPending. Same endpoint backs the pending detail load path.
  - id: obp_list_transaction_requests
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/transaction-requests"
    tag: Transaction-Requests
    auth: DirectLogin
    params:
      - name: bankId
        type: path
      - name: accountId
        type: path
    response:
      fields:
        - name: transaction_requests
          type: "List<TransactionRequestSummary>"
          children:
            - name: id
              type: String
            - name: status
              type: String
              note: "INITIATED → isPending"
            - name: start_date
              type: String
            - name: details
              type: object
              children:
                - name: description
                  type: String
                - name: value
                  type: object
                  children:
                    - name: currency
                      type: String
                    - name: amount
                      type: String
    errors:
      - code: 401
        message: "Unauthorized"
      - code: 404
        message: "Account not found"

dependencies:
  tier: feature
  features:
    - transaction-detail
    - account-detail
