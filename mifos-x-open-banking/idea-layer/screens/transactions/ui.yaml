          variant: outlined
          border_color: "#E1E4D5"
          text_color: "#44483D"
          border_radius: 20
          padding_horizontal: spacing.md
          padding_vertical: spacing.sm
          typography: "Outfit/label_medium"
        on_click:
          action: filter_type
          params:
            type: PENDING
        a11y:
          role: radio
          selected: false
          label: "Show pending transactions only"
        keyboard:
          focusable: true
        test_context:
          tag: filter_pending
          assert_clickable: true
          purpose: "Filter to show pending transactions only"
          interaction_type: toggle
          data_driven: false

