                  assert_content: "£3,200.00"

  # Pending payments — transaction-requests still INITIATED (SCA challenge unanswered, money
  # not yet debited). Rendered muted above the booked date groups, excluded from monthly
  # totals, and tapping a pending row opens transaction-detail via the requestId load path.
  # The section (header + rows) only appears when content.pending is non-empty and the active
  # type filter is not DEBIT/CREDIT.
  - type: text
    id: pending_section_header
    content: "PENDING"
    style:
      typography: "Outfit/label_medium"
      color: "#44483D"
      letter_spacing: 0.5
      padding_horizontal: 20
      padding_top: spacing.xs
      padding_bottom: spacing.sm
    a11y:
      role: heading
