        on_click:
          action: open_custom_range_dialog
        a11y:
          role: button
          selected: false
          label: "Pick a custom date range"
          hint: "Opens a date range picker; shows the selected range once applied"
        keyboard:
          focusable: true
        test_context:
          tag: range_chip_CUSTOM
          assert_clickable: true
          interaction_type: tap

  - type: dialog
