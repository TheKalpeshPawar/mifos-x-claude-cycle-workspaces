id: transactions
name: Transaction History
feature: transactions
flavor: consumer
status: approved
quality_score: 83
contract_version: "1.1.0"
approve_hash: "sha256:06af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f037af12bd8c96e4f0"
approved_at: "2026-05-25T13:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []


shell:
  bottom_nav: true
  top_app_bar:
    show: true
    title: "Transactions"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: filter_list
        action: open_advanced_filter
        label: "Advanced filter"
  nav_items:
    - id: nav_home
      label: Home
      icon: home
      target: home
    - id: nav_accounts
      label: Accounts
      icon: account_balance
      target: accounts
      active: true
    - id: nav_pay
      label: Pay
      icon: send
      target: send-money
    - id: nav_cards
      label: Cards
      icon: credit_card
      target: cards
    - id: nav_more
      label: More
      icon: more_horiz
      target: settings

screens:
  - id: transactions_content
    label: Transaction History
    route: /transactions
    scroll: vertical

archetype: index_list

components:
  - type: input
    id: search_bar
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: search
      background: "#F9FAEF"
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      margin_horizontal: 20
      margin_top: 16
      margin_bottom: 12
      leading_icon: search
      trailing_icon: mic
      leading_icon_color: "#44483D"
    placeholder: "Search by merchant, amount, date..."
    on_click:
      action: search_transactions
    a11y:
      role: searchbox
      label: "Search transactions"
      hint: "Search by merchant name, amount, or date"
      label_source: visible_label
    keyboard:
      focusable: true
    test_context:
      tag: search_bar
      assert_visible: true
      assert_placeholder: "Search by merchant, amount, date..."

  - type: box
    id: date_range_picker
    style:
      background: "#F9FAEF"
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      margin_horizontal: 20
      margin_bottom: 12
    on_click:
      action: filter_date
    a11y:
      role: button
      label: "Select date range: currently showing Last 30 Days"
      hint: "Opens date range picker"
    keyboard:
      focusable: true
    test_context:
      tag: date_range_picker
      assert_clickable: true
