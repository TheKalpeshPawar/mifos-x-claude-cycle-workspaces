  - has_ui
status_history:
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-06-06T00:00:00Z"
    by: "/kmp-implement transactions"
    contract_version: "1.1.0"
    note: "Implemented as feature/transactions (new module). Booked rows from v6 transactions endpoint (TXN_TYPE attribute → category badges); PENDING rows are transaction-requests with status INITIATED and no booked transaction (SCA challenge unanswered — verified mechanism on apisandbox; above-threshold payments stay INITIATED) shown muted above date groups and excluded from monthly totals. Deviations: sandbox caps the window at 50 newest txns and ignores limit/offset/date params, so pagination (10/page Load More per spec load_more_button), search, type filter, and date range all run client-side; date_range_picker = preset menu (7/30/90/All) + M3 DateRangePicker custom range; monthly summary computed client-side in account currency (not hardcoded GBP); mic trailing icon and advanced-filter top-bar action omitted (chips + range cover it). Entry point: Account Detail → ACTIVITY → Transaction history (TransactionsRoute(bankId, accountId) replaced the Phase-2 placeholder). Row taps target transaction-detail placeholder until that feature lands. 13 VM tests (filters, pending derivation, paging at 10, presets, custom range, summary, error/empty)."
  - from: approved
    to: approved
    at: "2026-06-07T15:00:00Z"
    by: "post-walkthrough polish (plan eager-churning-storm)"
    contract_version: "1.1.0"
    note: "Pending payments no longer read as debited: the list row and the pending detail amount drop the minus prefix (unsigned amount, muted styling and Pending icon retained) because the money has not left the account until the SCA challenge completes. Balances and monthly totals were already unaffected — this is display-only."
  - from: approved
    to: approved
    at: "2026-06-07T18:00:00Z"
    by: "counterparty-name hard rule (user directive)"
    contract_version: "1.1.0"
    note: "Counterparty names never show the OBP login-username placeholder (e.g. afternooncoffee, stamped into other_account.holder.name for self-transfers and unresolved merchants). New core CounterpartyNameResolver mirror-joins self-transfers across the user's own accounts (same description + completed timestamp, negated amount) to identify the destination account, then shows its Owner customer legal name (account label fallback); learned obfuscated-id→name mappings persist in the Room cache. Display precedence everywhere (list title fallback, detail counterparty hero/row, tags merchant, search text): resolved holder name → real non-placeholder holder → description. HARD RULE recorded in workspaces/mifos-x/CLAUDE.md."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    note: "Reconciled spec to shipped Kotlin — uiState is ScreenState<TransactionsContent> (no_network + unauthenticated states added; searching demoted from a state to a FilterState field). state_model rewritten to the shipped contract: TransactionsContent + TransactionTypeFilter{ALL,DEBIT,CREDIT,PENDING}, DateRangePreset{7/30/60/90/CUSTOM} + DateRangeFilter, PendingPayment + TransactionDayGroup + MonthlySummary, page*PAGE_SIZE(10) client-side paging, on* methods, DI = TransactionsRepository/PaymentsRepository/AccountsRepository/CounterpartyNameResolver. date_range_picker box replaced by a DateRangePreset chip row + Custom chip → DateRangePickerDialog. Added pending section (PendingRow, SectionHeader 'PENDING', onPendingClick → transaction-detail requestId path; excluded from monthly totals). monthly_summary computed client-side in account currency. api.yaml reconciled: GET v6.0.0 .../owner/transactions (listTransactionsWithAttributes) is the shipped list call (v3.0.0 is a sibling, used only by the resolver mirror-join) + added GET v4.0.0 .../owner/transaction-requests (pending). Server-side date/type filtering ignored by sandbox → runs client-side (documented). Counterparty-resolution mechanism documented. Pending re-render + re-approve."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."


shell:
