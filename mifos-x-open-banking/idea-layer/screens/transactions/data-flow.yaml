sibling: data-flow
schema_version: "4.0"
feature_id: transactions
entries:
  - screen_id: transactions
    trigger: on_mount
    endpoints:
      - obp_get_transactions
    direction: read
    dtos:
      - name: Transaction
        role: response
        api_id: obp_get_transactions
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: empty_state
      - error_code: 500
        behavior: error_state

  - screen_id: transactions
    trigger: on_interact
    event: LoadMore
    endpoints:
      - obp_get_transactions
    direction: read
    dtos:
      - name: Transaction
        role: response
        api_id: obp_get_transactions
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
