sibling: demo-data
schema_version: "4.0"
feature_id: automatic-rules

# OBIE domestic-VRP consents backing the automatic-rules list — two active
# sweeping rules with PSU control parameters (max-per-payment + periodic limits).
collections:
  list_domestic_vrp_consents:
    dto: OBDomesticVRPConsentResponse
    description: "200 OK — the PSU's active domestic-VRP consents (automatic rules)."
    item:
      Data:
        - ConsentId: "vrp-9a83c1d0-roundup-saver"
          Status: "Authorised"
          CreationDateTime: "2026-05-20T08:00:00+01:00"
          ControlParameters:
            ValidToDateTime: "2027-05-20T00:00:00+01:00"
            MaximumIndividualAmount: { Amount: "50.00", Currency: "GBP" }
            PeriodicLimits:
              - { Amount: "200.00", Currency: "GBP", PeriodType: "Month", PeriodAlignment: "Calendar" }
        - ConsentId: "vrp-44b7e2f9-weekly-save"
          Status: "Authorised"
          CreationDateTime: "2026-04-02T08:00:00+01:00"
          ControlParameters:
            ValidToDateTime: "2027-04-02T00:00:00+01:00"
            MaximumIndividualAmount: { Amount: "25.00", Currency: "GBP" }
            PeriodicLimits:
              - { Amount: "100.00", Currency: "GBP", PeriodType: "Month", PeriodAlignment: "Calendar" }
      Links:
        Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/pisp/domestic-vrp-consents"
      Meta: { TotalPages: 1 }
