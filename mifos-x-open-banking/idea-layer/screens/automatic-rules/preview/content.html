<!doctype html>
<!-- render-hash: automatic-rules-content-obie -->
<html lang="en" data-screen="automatic-rules" data-state="content" data-feature="automatic-rules" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automatic rules — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --surface-container: #F0F1E6;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --font-display: 'Outfit', system-ui, sans-serif;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px; --icon-md: 24px;
    }
    [data-theme="light"] {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --secondary-container: #BCEBE7; --on-secondary-container: #00201E;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline-variant: #C5C8BA;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline-variant: #44483D;
    }
    @media (prefers-color-scheme:dark){:root{
      --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB; --secondary-container: #1F4E4B; --on-secondary-container: #BCEBE7;
      --background: #12140E; --on-background: #E3E3D8; --surface: #1E201A; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline-variant: #44483D;
    }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { font-family: var(--font-display); background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .topbar { display: flex; align-items: center; gap: var(--sp-sm); height: 56px; padding: 0 var(--sp-sm); background: var(--background); position: sticky; top: 0; z-index: 5; }
    .topbar .icon-btn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--radius-pill); background: transparent; border: none; color: var(--on-surface); cursor: pointer; }
    .topbar .title { flex: 1; font-size: 22px; line-height: 28px; font-weight: 500; }
    .material-symbols-outlined { font-size: var(--icon-md); line-height: 1; }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: var(--sp-sm) var(--sp-md) var(--sp-xl); gap: var(--sp-md); }
    .intro { font-size: 14px; line-height: 1.5; color: var(--on-surface-variant); }
    .rule { display: flex; align-items: center; gap: var(--sp-md); width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-md); padding: 14px var(--sp-md); cursor: pointer; color: var(--on-surface); font-family: inherit; }
    .rule .lead { width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; flex-shrink: 0; }
    .rule .body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .rule .name { font-size: 16px; font-weight: 600; }
    .rule .sub { font-size: 13px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
    .rule .material-symbols-outlined { color: var(--on-surface-variant); }
    .cta { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm); width: 100%; margin-top: var(--sp-sm); background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--radius-md); height: 52px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="automatic-rules" data-state="content">
    <header data-shell="top-app-bar" data-variant="small" class="topbar">
      <button class="icon-btn" data-component-type="button" data-action="navigate_back" aria-label="Go back"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></button>
      <span class="title" role="heading" aria-level="1">Automatic rules</span>
    </header>
    <main id="main-content" data-shell="content" data-state="content">
      <p class="intro" data-component-type="text" data-component-id="intro_copy">Move money automatically within limits you set — like sweeping spare cash to savings. You stay in control and can cancel anytime.</p>

      <button class="rule" data-component-type="list_item" data-component-id="rule_item" data-nav-to="automatic-rule-detail" data-action-id="open_rule" aria-label="Round-up to Rainy Day Saver. Max £50 per payment, £200 per month, active.">
        <span class="lead" aria-hidden="true"><span class="material-symbols-outlined">savings</span></span>
        <span class="body"><span class="name">Round-up to Rainy Day Saver</span><span class="sub">Max £50/payment · £200/month · Active</span></span>
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>

      <button class="rule" data-component-type="list_item" data-component-id="rule_item_2" data-nav-to="automatic-rule-detail" data-action-id="open_rule" aria-label="Weekly save 25 pounds. Max £25 per payment, £100 per month, active.">
        <span class="lead" aria-hidden="true"><span class="material-symbols-outlined">schedule</span></span>
        <span class="body"><span class="name">Weekly save £25</span><span class="sub">Max £25/payment · £100/month · Active</span></span>
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>

      <button class="cta" data-component-type="button" data-component-id="new_rule_button" data-nav-to="automatic-rule-create" data-action-id="new_rule"><span class="material-symbols-outlined" aria-hidden="true">add</span>New rule</button>
    </main>
  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
