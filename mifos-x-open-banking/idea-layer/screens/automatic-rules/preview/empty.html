<!doctype html>
<!-- render-hash: automatic-rules-empty-obie -->
<html lang="en" data-screen="automatic-rules" data-state="empty" data-feature="automatic-rules" data-flavor="consumer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automatic rules — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root { --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000; --background:#F9FAEF; --on-background:#1A1C16; --surface-variant:#E1E4D5; --on-surface-variant:#44483D; --font-display:'Outfit',system-ui,sans-serif; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --radius-md:12px; --radius-pill:999px; }
    [data-theme="light"] { --primary:#4C662B; --on-primary:#FFFFFF; --primary-container:#CDEDA3; --on-primary-container:#102000; --background:#F9FAEF; --on-background:#1A1C16; --surface-variant:#E1E4D5; --on-surface-variant:#44483D; }
    [data-theme="dark"] { --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3; --background:#12140E; --on-background:#E3E3D8; --surface-variant:#44483D; --on-surface-variant:#C5C8BA; }
    @media (prefers-color-scheme:dark){:root{ --primary:#B2D188; --on-primary:#1F3701; --primary-container:#354E16; --on-primary-container:#CDEDA3; --background:#12140E; --on-background:#E3E3D8; --surface-variant:#44483D; --on-surface-variant:#C5C8BA; }}
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font-display); background:var(--background); color:var(--on-background); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
    .topbar { display:flex; align-items:center; gap:var(--sp-sm); height:56px; padding:0 var(--sp-md); }
    .topbar .title { font-size:22px; font-weight:500; }
    .material-symbols-outlined { font-size:24px; }
    main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:var(--sp-sm); padding:var(--sp-lg); }
    .badge { width:72px; height:72px; border-radius:var(--radius-pill); background:var(--primary-container); color:var(--on-primary-container); display:grid; place-items:center; margin-bottom:var(--sp-sm); }
    .badge .material-symbols-outlined { font-size:40px; }
    .t { font-size:19px; font-weight:600; }
    .m { font-size:14px; color:var(--on-surface-variant); max-width:32ch; }
    .cta { margin-top:var(--sp-md); display:inline-flex; align-items:center; gap:var(--sp-sm); background:var(--primary); color:var(--on-primary); border:none; border-radius:var(--radius-md); padding:14px var(--sp-lg); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div data-shell="root" data-screen-id="automatic-rules" data-state="empty">
    <header class="topbar"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span><span class="title" role="heading" aria-level="1">Automatic rules</span></header>
    <main>
      <span class="badge" aria-hidden="true"><span class="material-symbols-outlined">savings</span></span>
      <div class="t">No automatic rules yet</div>
      <p class="m">Set up a rule to move money automatically within limits you choose.</p>
      <button class="cta" data-component-type="button" data-component-id="new_rule_button" data-nav-to="automatic-rule-create" data-action-id="new_rule"><span class="material-symbols-outlined" aria-hidden="true">add</span>New rule</button>
    </main>
  </div>
  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
