id: standing-orders
name: Standing Orders
feature: standing-orders
flavor: consumer
status: enriched
quality_score: 80

screens:
  - id: standing-orders
    name: Standing Orders
    archetype: index_list
    shell:
      top_bar:
        title: "Standing Orders"
        navigation_icon: arrow_back
        actions:
          - icon: filter_list
            action: filter_standing_orders
      bottom_nav: false

components:
  - type: stack
    id: title_count_row
    label: "Standing Orders Header"
    style:
      orientation: horizontal
      spacing: 12
      padding_bottom: 16
      align: center
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Standing orders header with active count"
      role: row
    test_context:
      tag: title_count_row

  - type: text
