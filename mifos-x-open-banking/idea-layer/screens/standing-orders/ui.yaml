    label: "Rent actions"
    style:
      orientation: horizontal
      spacing: 8
      justify: flex_end
      padding_top: 12
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Actions for Rent Payment standing order"
      role: row
    test_context:
