    style:
      icon_name: delete_outlined
      size: 22
      color: "#FF5252"
      padding: 8
    on_click:
      action: delete_standing_order
      target: ""
    a11y:
      content_description: "Delete Netflix Subscription standing order"
      role: button
    test_context:
