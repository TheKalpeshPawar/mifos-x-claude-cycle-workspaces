    label: "Active"
    content: "Active"
    style:
      background: "#E8F5E9"
      corner_radius: 10
      padding_horizontal: 8
      padding_vertical: 3
      text_color: "#4CAF50"
      typography: label_small
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: "Status: Active"
      role: status
    test_context:
      tag: netflix_active_badge

  - type: text
    id: netflix_amount
    label: "£15.99 / month"
    content: "£15.99 / month"
    style:
      typography: body_large
      color: "#1800B1"
      font_weight: semibold
    a11y:
