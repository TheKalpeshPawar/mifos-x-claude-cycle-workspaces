  - type: box
    id: standing_order_gym
    label: "Gym Membership"
    content: "Gym Membership"
    style:
      background: "#FAFAFA"
      corner_radius: 16
      elevation: 1
      padding_horizontal: 16
      padding_vertical: 16
      border_color: "#E0E0E0"
      border_width: 1
      margin_bottom: 12
    on_click:
      action: view_standing_order
      target: ""
    a11y:
      content_description: "Gym Membership standing order. £45 monthly. Next payment 15 June 2026. Paused."
      role: button
    test_context:
