responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    layout:
      visible_components:
        - title_count_row
        - standing_orders_title
      show_skeleton_list: true
      skeleton_count: 3
  content:
    layout:
      visible_components:
        - title_count_row
        - standing_orders_title
        - active_count_chip
        - standing_order_rent
        - rent_header_row
        - rent_title
        - rent_active_badge
        - rent_beneficiary
        - rent_amount_row
        - rent_amount
        - rent_next_date
        - rent_actions_row
        - rent_edit_icon
        - rent_delete_icon
        - standing_order_netflix
        - netflix_title
        - netflix_active_badge
        - netflix_amount
        - netflix_next_date
        - netflix_edit_icon
        - netflix_delete_icon
        - standing_order_gym
        - gym_title
        - gym_paused_badge
        - gym_amount
        - gym_next_date
        - gym_edit_icon
        - gym_delete_icon
        - create_standing_order_fab
  empty:
    layout:
      visible_components:
        - title_count_row
        - standing_orders_title
        - create_standing_order_fab
      active_count_chip_visible: false
      show_empty_state: true
      empty_state_icon: repeat_off
      empty_state_title: "No standing orders"
      empty_state_message: "Set up recurring payments to automate your regular bills"
  error:
    layout:
      visible_components:
        - title_count_row
        - standing_orders_title
        - create_standing_order_fab
      active_count_chip_visible: false
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load standing orders"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: StandingOrdersViewModel
  state_fields:
    - name: standingOrders
      type: List<StandingOrder>
      default: "emptyList()"
    - name: activeCount
      type: Int
      default: 0
    - name: selectedOrderId
      type: String
      default: ""
    - name: uiState
      type: StandingOrdersUiState
      default: Loading
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load standing orders. Please try again."
    - field: delete
      code: DELETE_FAILED
      message: "Could not delete standing order. Please try again."
    - field: create
      code: CREATE_FAILED
      message: "Could not create standing order. Please try again."
  events:
    - OrdersLoaded
    - ViewOrderClicked
    - EditOrderClicked
    - DeleteOrderClicked
    - DeleteOrderConfirmed
    - CreateOrderClicked
    - FilterChanged
    - RefreshTriggered
  actions:
    - view_standing_order
    - edit_standing_order
    - delete_standing_order
    - create_standing_order
    - filter_standing_orders
  di:
    - StandingOrderRepository
    - AccountRepository

api:
  - endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/owner/standing-order"
    note: "POST-only (no GET list endpoint). Show recurring via transaction history."
    tag: Standing-Orders
    response:
      fields:
        - name: standing_orders
          type: List<StandingOrder>
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: account_id
          type: String
        - name: counterparty
          type: Counterparty
        - name: counterparty.name
          type: String
        - name: amount_value
          type: String
        - name: amount_currency
          type: String
        - name: when
          type: StandingOrderSchedule
        - name: when.frequency
          type: String
        - name: when.start_date
          type: String
        - name: when.final_date
          type: String
        - name: active
          type: Boolean
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 403
        message: "INSUFFICIENT_AUTHORISATION"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - accounts
