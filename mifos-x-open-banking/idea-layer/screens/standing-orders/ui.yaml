  - type: icon
    id: netflix_edit_icon
    label: "Edit Netflix Subscription"
    style:
      icon_name: edit_outlined
      size: 22
      color: "#1800B1"
      padding: 8
    on_click:
      action: edit_standing_order
      target: ""
    a11y:
      content_description: "Edit Netflix Subscription standing order"
      role: button
