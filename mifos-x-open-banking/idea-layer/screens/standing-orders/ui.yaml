      target: account_picker_sheet
    a11y:
      label: "From account selector. Tap to change which account these standing orders belong to."
      role: button
    test_context:
      tag: account_selector
      purpose: "Per-account scoping card — opens AccountPickerBottomSheet when the user has more than one account"
      interaction_type: action
      data_driven: true

  - type: text
    id: account_selector_label
    label: "From account"
    content: "From account"
    style:
      typography: "Outfit/label_small"
      color: "#44483D"
    a11y:
      label: "From account label"
      role: text
    test_context:
      tag: account_selector_label
      purpose: "Caption above the selected account name"
      interaction_type: display
      data_driven: false

  - type: text
