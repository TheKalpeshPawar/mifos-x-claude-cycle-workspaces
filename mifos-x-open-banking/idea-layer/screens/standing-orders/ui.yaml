  - type: text
    id: netflix_next_date
    label: "Next: 7 Jun 2026"
    content: "Next: 7 Jun 2026"
    style:
      typography: body_small
      color: "#888888"
    a11y:
      content_description: "Next payment: 7 June 2026"
      role: text
    test_context:
