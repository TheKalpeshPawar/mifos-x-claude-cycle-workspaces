        - account_selector_label
        - account_selector_value
        - title_count_row
        - stat_active
        - stat_monthly_total
        - stat_paused
        - filter_chips
        - create_standing_order_fab
      show_skeleton_list: true
      skeleton_count: 3
      note: "Header (picker + zeroed stats + chips) stays pinned; list area shows centered progress."
  content:
    layout:
      visible_components:
        - account_selector
        - account_selector_label
        - account_selector_value
        - title_count_row
        - stat_active
        - stat_monthly_total
        - stat_paused
        - filter_chips
        - orders_list
        - order_card
        - order_name
        - order_status_badge
        - order_counterparty
        - order_from_account
        - order_amount
        - order_frequency
        - order_schedule_line
        - create_standing_order_fab
  empty:
    layout:
      visible_components:
        - account_selector
        - account_selector_label
        - account_selector_value
        - title_count_row
        - stat_active
        - stat_monthly_total
        - stat_paused
        - filter_chips
        - empty_state
        - create_standing_order_fab
  error:
    layout:
      visible_components:
        - account_selector
        - account_selector_label
        - account_selector_value
        - title_count_row
        - stat_active
        - stat_monthly_total
        - stat_paused
        - filter_chips
        - error_state
        - create_standing_order_fab
  no_network:
    layout:
      visible_components:
        - account_selector
        - title_count_row
        - filter_chips
        - error_state
        - create_standing_order_fab
      note: "ScreenState.NoNetwork — same Retry treatment as error."
  unauthenticated:
    layout:
      visible_components:
        - account_selector
        - title_count_row
        - filter_chips
        - error_state
        - create_standing_order_fab
      note: "ScreenState.Unauthenticated — same Retry treatment as error."

state_model:
  view_model: StandingOrdersViewModel
  state_contract:
    note: >
      Three independent StateFlows. The pinned header lives OUTSIDE uiState so the
      account picker + stats + chips stay visible (with zeroed stats) while the list
      below shows loading/empty/error. uiState carries only the list area.
  flows:
    - name: header
      type: "StateFlow<StandingOrdersHeader>"
      fields:
        - { name: accounts, type: "List<Account>", default: "emptyList()" }
        - { name: selectedAccountId, type: String, default: "\"\"" }
        - { name: activeCount, type: Int, default: 0 }
        - { name: pausedCount, type: Int, default: 0 }
        - { name: monthlyTotal, type: String, default: "\"0.00\"" }
        - { name: filter, type: StandingOrderFilter, default: "StandingOrderFilter.All" }
    - name: uiState
      type: "StateFlow<ScreenState<List<StandingOrder>>>"
      default: "ScreenState.Loading"
      obie_field_map:
        note: >
          Each StandingOrder row is built from an OBIE Data.StandingOrder[] entry
          (get_account_standing_orders). Surfaced OBIE shapes:
          id ← Data.StandingOrder[].StandingOrderId (String)
          status ← Data.StandingOrder[].StandingOrderStatusCode (String, ExternalMandateStatus1Code)
          frequency ← Data.StandingOrder[].Frequency (String, e.g. UK.OBIE.Monthly)
          amount ← Data.StandingOrder[].NextPaymentAmount.Amount (String) + .NextPaymentAmount.Currency (String)
          scheduleDate ← Data.StandingOrder[].NextPaymentDateTime (String, ISODateTime) / .FirstPaymentDateTime
          counterparty ← Data.StandingOrder[].CreditorAccount.Name + .CreditorAccount.Identification (Detail permission only)
    - name: createGate
      type: "StateFlow<CreateGate>"
      default: "CreateGate.Idle"
  supporting_types:
    - name: StandingOrderFilter
      kind: enum
      values: [All, Active, Paused, Cancelled]
    - name: CreateGate
      kind: sealed_interface
      cases: [Idle, Checking, NoPayees, "Ready(accountId: String)"]
  methods:
    - onRetry
    - onRefresh
    - onFilterChanged
    - onCreateClicked
    - onCreateGateConsumed
    - onAccountSelected
  di:
    - StandingOrdersRepository
    - AccountsRepository
    - UserPreferencesRepository
    - PaymentsRepository

api:
  - endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/standing-orders"
    id: get_account_standing_orders
    note: >
      HSBC OBIE AISP read endpoint (OBReadStandingOrder6). Lists the standing orders on the
      selected AccountId — READ-ONLY. Requires an authorised account-access consent with
      ReadStandingOrders permission. Creating a standing order is PISP, handled by
      standing-order-create — not this screen. See api.yaml.
    tag: Standing-Orders

dependencies:
  tier: feature
  features:
    - accounts
    - beneficiaries
    - transactions
