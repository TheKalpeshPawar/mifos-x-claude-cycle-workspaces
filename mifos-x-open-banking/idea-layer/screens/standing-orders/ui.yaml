    style:
      typography: body_medium
      color: "#666666"
      padding_bottom: 4
    a11y:
      content_description: "Recipient: Landlord Holdings Ltd"
      role: text
    test_context:
      tag: rent_beneficiary

  - type: stack
    id: rent_amount_row
    label: "Rent amount and schedule"
    style:
      orientation: horizontal
      spacing: 0
      justify: space_between
      align: center
    on_click:
      action: ""
      target: ""
    a11y:
      content_description: ""
      role: row
    test_context:
      tag: rent_amount_row

  - type: text
    id: rent_amount
    label: "£1,200 / month"
    content: "£1,200 / month"
    style:
      typography: body_large
      color: "#1800B1"
      font_weight: semibold
    a11y:
