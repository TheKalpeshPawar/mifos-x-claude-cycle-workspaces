impl_notes: >
  Reconciled to shipped feature/standing-orders module (2026-06-11). OBP reality: POST-create
  is the ONLY standing-order endpoint — no list/get/pause/resume/delete at any version
  (live-verified 404). The list is DERIVED from transaction history (TXN_TYPE=SO grouped by
  description). The screen is per-account: an AccountSelector (AccountPickerBottomSheet when
  more than one account) scopes the list, a stats row shows ACTIVE / MONTHLY TOTAL / PAUSED,
  and StandingOrderFilter chips (All/Active/Paused/Cancelled) filter. The extended FAB
  ("New order") checks the selected account's beneficiaries first: no payees shows a
  "No payees" dialog (CreateGate.NoPayees), otherwise navigates to standing-order-create
  (CreateStandingOrderScreen, wired via StandingOrderEditRoute(accountId)). Per-card inline
  edit/delete icons were NEVER built (no server mutation possible). Entry point: Standing
  Orders tile in Home "Banking Services".
