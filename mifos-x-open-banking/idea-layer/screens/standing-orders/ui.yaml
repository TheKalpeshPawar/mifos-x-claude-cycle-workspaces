      size: 22
      color: "#FF5252"
      padding: 8
    on_click:
      action: delete_standing_order
      target: ""
    a11y:
      content_description: "Delete Rent Payment standing order. This action cannot be undone."
      role: button
    test_context:
      tag: rent_delete_icon

  - type: box
    id: standing_order_netflix
    label: "Netflix Subscription"
    content: "Netflix Subscription"
    style:
      background: "#FFFFFF"
      corner_radius: 16
      elevation: 2
      padding_horizontal: 16
      padding_vertical: 16
      border_color: "#F0F0F0"
      border_width: 1
      margin_bottom: 12
    on_click:
