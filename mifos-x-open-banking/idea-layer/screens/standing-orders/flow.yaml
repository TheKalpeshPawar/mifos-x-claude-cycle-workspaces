sibling: flow
schema_version: "4.0"
feature_id: standing-orders
flow_ids:
  - consumer-banking
navigates_to:
  - standing-order-detail
  - standing-order-create
flow_logic:
  - from: standing-orders
    to: standing-order-create
    trigger: create_standing_order_fab
    guard: "CreateGate.Ready — account has at least one beneficiary; CreateGate.NoPayees shows the no-payees dialog instead"
  - from: standing-orders
    to: standing-order-detail
    trigger: order_card
    passes: [bankId, accountId, standingOrderId]
journey_ids:
  - consumer-cards-financing
