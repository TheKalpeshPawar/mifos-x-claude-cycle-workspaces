sibling: demo-data
schema_version: "4.0"
feature_id: standing-orders

# OBIE AISP v4.0 demo envelope for the read-only standing-orders list.
# Data.StandingOrder[] are the standing orders set up on the persona's current
# account (acc-30000012345678, sort 30-00-00 / 30000012345678 / Oliver Bennett).
# CreditorAccount populated under the ReadStandingOrdersDetail permission.
collections:
  get_account_standing_orders:
    dto: OBReadStandingOrder6
    description: "200 OK — standing orders on the selected account (active + inactive), newest first."
    item:
      Data:
        StandingOrder:
          - AccountId: "acc-30000012345678"
            StandingOrderId: "so-001-british-gas"
            Reference: "Gas and Electric"
            StandingOrderStatusCode: "Active"
            Frequency: "EvryMonth"
            FirstPaymentDateTime: "2026-01-05T00:00:00+00:00"
            NextPaymentDateTime: "2026-07-05T00:00:00+01:00"
            FirstPaymentAmount:
              Amount: "92.00"
              Currency: "GBP"
            NextPaymentAmount:
              Amount: "92.00"
              Currency: "GBP"
            CreditorAccount:
              SchemeName: "UK.OBIE.SortCodeAccountNumber"
              Identification: "60000412009988"
              Name: "British Gas"
          - AccountId: "acc-30000012345678"
            StandingOrderId: "so-002-thames-water"
            Reference: "Water Account 88421"
            StandingOrderStatusCode: "Active"
            Frequency: "EvryMonth"
            FirstPaymentDateTime: "2026-02-15T00:00:00+00:00"
            NextPaymentDateTime: "2026-07-15T00:00:00+01:00"
            FirstPaymentAmount:
              Amount: "38.50"
