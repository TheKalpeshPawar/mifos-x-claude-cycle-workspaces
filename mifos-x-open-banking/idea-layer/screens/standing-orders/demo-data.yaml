        TotalPages: 1

  # 403 OB.Resource.InvalidConsentStatus driving the error state.
  get_account_standing_orders.error:
    dto: OBErrorResponse1
    description: "403 OBErrorResponse1 — missing ReadStandingOrders on the account-access-consent."
    item:
      Code: "403 Forbidden"
      Id: "err-so-list-4a18c2"
      Message: "Invalid consent status"
      Errors:
        - ErrorCode: "UK.OBIE.Resource.InvalidConsentStatus"
          Message: "The account-access-consent does not carry ReadStandingOrdersBasic or ReadStandingOrdersDetail."
