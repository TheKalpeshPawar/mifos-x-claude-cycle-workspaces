<html lang="en" data-screen="standing-orders" data-state="empty" data-feature="standing-orders" data-flavor="consumer">

<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.empty-icon{width:96px;height:96px;border-radius:48px;background:var(--primary-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.empty-icon .material-icons{font-size:var(--icon-2xl);color:var(--on-primary-container)}

.help-link{font-size:13px;color:var(--primary);text-decoration:none;font-weight:600;margin-top:20px;display:inline-flex;align-items:center;gap:4px}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}}</style>
</head>
<body><div class="top-bar"><span class="material-icons" data-nav-to="home" tabindex="0" aria-label="Go back">arrow_back</span><h1>Standing Orders</h1></div><main><div class="empty-icon"><span class="material-icons">event_repeat</span></div><h2 class="empty-title">No standing orders yet</h2><p class="empty-msg">Set up recurring payments for rent, subscriptions, or savings. They'll run automatically on the schedule you choose.</p><button class="cta-btn" data-action="create_standing_order" tabindex="0" aria-label="Create your first standing order"><span class="material-icons">add</span>Create your first order</button><a class="help-link" data-action="open_help_standing_orders" tabindex="0">Learn how standing orders work</a></main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
