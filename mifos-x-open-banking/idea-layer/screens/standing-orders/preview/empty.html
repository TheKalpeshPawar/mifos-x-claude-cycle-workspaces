<!doctype html>
<!-- render-hash: so-empty-llm -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standing Orders — Empty</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --on-primary-container: #102000;
      --secondary: #386663;
      --tertiary: #386663;
      --tertiary-container: #BCEBE7;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --error-container: #FFDAD6;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --surface-container: #F0F1E6;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --pending: #E8A317;
      --icon-xs: 16px;
      --icon-sm: 20px;
      --icon-md: 24px;
      --icon-lg: 32px;
      --icon-xl: 40px;
      --icon-2xl: 48px;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 16px;
      --sp-lg: 24px;
      --sp-xl: 32px;
      --radius-card: 12px;
      --radius-pill: 999px;
      --radius-lg: 16px;
    }
    :root[data-theme="dark"] {
      --primary: #B2D188;
      --on-primary: #1F3701;
      --primary-container: #354E16;
      --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB;
      --tertiary: #A0CFCB;
      --tertiary-container: #1F4E4B;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --background: #12140E;
      --on-background: #E3E3D8;
      --surface: #1E201A;
      --on-surface: #E3E3D8;
      --surface-variant: #44483D;
      --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A;
      --outline: #8F9285;
      --outline-variant: #44483D;
      --pending: #E8A317;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188;
        --on-primary: #1F3701;
        --primary-container: #354E16;
        --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB;
        --tertiary: #A0CFCB;
        --tertiary-container: #1F4E4B;
        --error: #FFB4AB;
        --on-error: #690005;
        --error-container: #93000A;
        --background: #12140E;
        --on-background: #E3E3D8;
        --surface: #1E201A;
        --on-surface: #E3E3D8;
        --surface-variant: #44483D;
        --on-surface-variant: #C5C8BA;
        --surface-container: #1E201A;
        --outline: #8F9285;
        --outline-variant: #44483D;
        --pending: #E8A317;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 96px; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }

    /* Top App Bar */
    header[data-shell="top-app-bar"] {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--sp-xs) 0 var(--sp-xs);
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-bar-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--on-surface);
      border-radius: var(--radius-pill);
    }
    .top-bar-back .material-symbols-outlined { font-size: var(--icon-md); }
    .top-bar-title {
      flex: 1;
      font-size: 18px;
      font-weight: 500;
      color: var(--on-surface);
      letter-spacing: -0.1px;
    }
    .top-bar-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--on-surface-variant);
      border-radius: var(--radius-pill);
    }
    .top-bar-action .material-symbols-outlined { font-size: var(--icon-md); }

    /* Account Selector */
    .account-selector-card {
      margin: var(--sp-sm) var(--sp-md) 0;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-card);
      padding: var(--sp-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      min-height: 44px;
    }
    .account-selector-inner { display: flex; flex-direction: column; gap: 2px; }
    .account-selector-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--on-surface-variant);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .account-selector-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--on-surface);
    }
    .account-selector-chevron {
      font-size: var(--icon-sm);
      color: var(--on-surface-variant);
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      gap: var(--sp-sm);
      margin: var(--sp-sm) var(--sp-md) 0;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      padding: var(--sp-md) var(--sp-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--on-surface);
      letter-spacing: -0.3px;
    }
    .stat-value.muted { color: var(--on-surface-variant); }
    .stat-value.accent { color: var(--primary); }

    /* Filter Chips */
    .filter-row {
      display: flex;
      gap: var(--sp-sm);
      padding: var(--sp-md) var(--sp-md) var(--sp-sm);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--outline-variant);
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      min-height: 32px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }
    .chip.selected {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: transparent;
    }

    /* Empty state */
    .empty-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-xl) var(--sp-lg);
      gap: var(--sp-md);
      text-align: center;
    }
    .empty-illustration {
      width: 120px;
      height: 120px;
      margin-bottom: var(--sp-sm);
    }
    .empty-headline {
      font-size: 20px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.2px;
    }
    .empty-body {
      font-size: 14px;
      color: var(--on-surface-variant);
      max-width: 280px;
      line-height: 1.5;
    }
    .empty-cta {
      margin-top: var(--sp-sm);
      display: inline-flex;
      align-items: center;
      gap: var(--sp-sm);
      height: 44px;
      padding: 0 var(--sp-lg);
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: var(--radius-lg);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.1px;
    }
    .empty-cta .material-symbols-outlined { font-size: var(--icon-sm); }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 24px;
      right: var(--sp-md);
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      height: 56px;
      padding: 0 20px;
      background: var(--primary);
      border-radius: var(--radius-lg);
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.32);
      cursor: pointer;
      border: none;
      letter-spacing: 0.1px;
    }
    .fab .material-symbols-outlined { font-size: var(--icon-sm); color: var(--on-primary); }
    .fab:active { opacity: 0.88; }
  </style>
</head>
<body>
<div data-shell="root" data-screen-id="standing-orders" data-state="empty">
  <header data-shell="top-app-bar">
    <button class="top-bar-back" data-nav-to="home" aria-label="Go back" tabindex="0" role="button">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="top-bar-title">Standing Orders</h1>
    <button class="top-bar-action" data-action="filter_changed" aria-label="Filter" tabindex="0" role="button">
      <span class="material-symbols-outlined">tune</span>
    </button>
  </header>

  <main data-shell="content" data-state="empty">

    <!-- Account Selector -->
    <div
      class="account-selector-card"
      data-component-type="card"
      data-component-id="account_selector"
      data-component-variant="outlined"
      data-action="open_account_picker"
      tabindex="0"
      role="button"
      aria-label="From account selector. Tap to change which account these standing orders belong to."
    >
      <div class="account-selector-inner">
        <span class="account-selector-label" data-component-type="text" data-component-id="account_selector_label">From account</span>
        <span class="account-selector-value" data-component-type="text" data-component-id="account_selector_value">Current Account</span>
      </div>
      <span class="material-symbols-outlined account-selector-chevron" aria-hidden="true">expand_more</span>
    </div>

    <!-- Stats Row (zeroed) -->
    <div class="stats-row" data-component-type="stack" data-component-id="title_count_row" data-component-variant="row" role="row" aria-label="Standing orders summary stats">
      <div class="stat-card" data-component-type="card" data-component-id="stat_active" data-component-variant="outlined" role="status" aria-label="Active standing orders count">
        <span class="stat-label">Active</span>
        <span class="stat-value muted">0</span>
      </div>
      <div class="stat-card" data-component-type="card" data-component-id="stat_monthly_total" data-component-variant="outlined" role="status" aria-label="Total monthly amount of active standing orders">
        <span class="stat-label">Monthly</span>
        <span class="stat-value muted">£0.00</span>
      </div>
      <div class="stat-card" data-component-type="card" data-component-id="stat_paused" data-component-variant="outlined" role="status" aria-label="Paused standing orders count">
        <span class="stat-label">Paused</span>
        <span class="stat-value muted">0</span>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="filter-row" data-component-type="chip_group" data-component-id="filter_chips" data-component-variant="filter" role="tablist" aria-label="Filter standing orders by status: All, Active, Paused, Cancelled">
      <button class="chip selected" data-action="filter_changed" data-filter="All" role="tab" aria-selected="true" tabindex="0">All</button>
      <button class="chip" data-action="filter_changed" data-filter="Active" role="tab" aria-selected="false" tabindex="0">Active</button>
      <button class="chip" data-action="filter_changed" data-filter="Paused" role="tab" aria-selected="false" tabindex="0">Paused</button>
      <button class="chip" data-action="filter_changed" data-filter="Cancelled" role="tab" aria-selected="false" tabindex="0">Cancelled</button>
    </div>

    <!-- Empty state -->
    <div
      class="empty-area"
      data-component-type="empty_state"
      data-component-id="empty_state"
      role="status"
      aria-label="No standing orders"
    >
      <svg class="empty-illustration" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="No standing orders illustration" role="img">
        <!-- Calendar with repeat/cycle motif -->
        <rect x="18" y="28" width="84" height="72" rx="10" fill="var(--surface-container)" stroke="var(--outline-variant)" stroke-width="1.5"/>
        <rect x="18" y="28" width="84" height="26" rx="10" fill="var(--surface-variant)"/>
        <rect x="18" y="42" width="84" height="12" fill="var(--surface-variant)"/>
        <!-- Calendar header dots -->
        <rect x="34" y="20" width="6" height="14" rx="3" fill="var(--outline)"/>
        <rect x="80" y="20" width="6" height="14" rx="3" fill="var(--outline)"/>
        <!-- Calendar grid lines -->
        <rect x="28" y="64" width="16" height="10" rx="3" fill="var(--outline-variant)" opacity="0.6"/>
        <rect x="52" y="64" width="16" height="10" rx="3" fill="var(--outline-variant)" opacity="0.6"/>
        <rect x="76" y="64" width="16" height="10" rx="3" fill="var(--outline-variant)" opacity="0.6"/>
        <rect x="28" y="82" width="16" height="10" rx="3" fill="var(--outline-variant)" opacity="0.4"/>
        <rect x="52" y="82" width="16" height="10" rx="3" fill="var(--outline-variant)" opacity="0.4"/>
        <!-- Cycle/repeat arrow overlay -->
        <circle cx="84" cy="84" r="18" fill="var(--primary-container)" stroke="var(--primary)" stroke-width="1.5"/>
        <path d="M78 84 a6 6 0 1 1 6 6" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <polyline points="84,91 84,87 88,87" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>

      <p class="empty-headline">No standing orders</p>
      <p class="empty-body">Set up recurring payments to automate your regular bills and transfers.</p>

      <button
        class="empty-cta"
        data-component-type="button"
        data-component-id="create_standing_order_fab"
        data-component-variant="extended_fab"
        data-action="create_clicked"
        tabindex="0"
        aria-label="Create a new standing order"
      >
        <span class="material-symbols-outlined">add</span>
        New order
      </button>
    </div>

  </main>

  <!-- Extended FAB -->
  <button
    class="fab"
    data-component-type="button"
    data-component-id="create_standing_order_fab"
    data-component-variant="extended_fab"
    data-action="create_clicked"
    tabindex="0"
    role="button"
    aria-label="Create a new standing order"
  >
    <span class="material-symbols-outlined">add</span>
    New order
  </button>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
