<!doctype html>
<!-- render-hash: so-error-llm -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standing Orders — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --on-primary-container: #102000;
      --secondary: #386663;
      --tertiary: #386663;
      --tertiary-container: #BCEBE7;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --error-container: #FFDAD6;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --surface-container: #F0F1E6;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --pending: #E8A317;
      --icon-xs: 16px;
      --icon-sm: 20px;
      --icon-md: 24px;
      --icon-lg: 32px;
      --icon-xl: 40px;
      --icon-2xl: 48px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --radius-card: 12px;
      --radius-pill: 999px;
      --radius-lg: 16px;
    }
    :root[data-theme="dark"] {
      --primary: #B2D188;
      --on-primary: #1F3701;
      --primary-container: #354E16;
      --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB;
      --tertiary: #A0CFCB;
      --tertiary-container: #1F4E4B;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --background: #12140E;
      --on-background: #E3E3D8;
      --surface: #1E201A;
      --on-surface: #E3E3D8;
      --surface-variant: #44483D;
      --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A;
      --outline: #8F9285;
      --outline-variant: #44483D;
      --pending: #E8A317;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188;
        --on-primary: #1F3701;
        --primary-container: #354E16;
        --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB;
        --tertiary: #A0CFCB;
        --tertiary-container: #1F4E4B;
        --error: #FFB4AB;
        --on-error: #690005;
        --error-container: #93000A;
        --background: #12140E;
        --on-background: #E3E3D8;
        --surface: #1E201A;
        --on-surface: #E3E3D8;
        --surface-variant: #44483D;
        --on-surface-variant: #C5C8BA;
        --surface-container: #1E201A;
        --outline: #8F9285;
        --outline-variant: #44483D;
        --pending: #E8A317;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 96px; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }

    /* Top App Bar */
    header[data-shell="top-app-bar"] {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--space-xs) 0 var(--space-xs);
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-bar-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--on-surface);
      border-radius: var(--radius-pill);
    }
    .top-bar-back .material-symbols-outlined { font-size: var(--icon-md); }
    .top-bar-title {
      flex: 1;
      font-size: 18px;
      font-weight: 500;
      color: var(--on-surface);
      letter-spacing: -0.1px;
    }
    .top-bar-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--on-surface-variant);
      border-radius: var(--radius-pill);
    }
    .top-bar-action .material-symbols-outlined { font-size: var(--icon-md); }

    /* Account Selector */
    .account-selector-card {
      margin: var(--space-sm) var(--space-md) 0;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-card);
      padding: var(--space-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      min-height: 44px;
    }
    .account-selector-inner { display: flex; flex-direction: column; gap: 2px; }
    .account-selector-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--on-surface-variant);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .account-selector-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--on-surface);
    }
    .account-selector-chevron {
      font-size: var(--icon-sm);
      color: var(--on-surface-variant);
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      gap: var(--space-sm);
      margin: var(--space-sm) var(--space-md) 0;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      padding: var(--space-md) var(--space-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--on-surface-variant);
      letter-spacing: -0.3px;
    }

    /* Filter Chips */
    .filter-row {
      display: flex;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-md) var(--space-sm);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--outline-variant);
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      min-height: 32px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }
    .chip.selected {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: transparent;
    }

    /* Error state */
    .error-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-lg);
      gap: var(--space-md);
      text-align: center;
    }
    .error-illustration {
      width: 110px;
      height: 110px;
      margin-bottom: var(--space-sm);
    }
    .error-headline {
      font-size: 20px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.2px;
    }
    .error-body {
      font-size: 14px;
      color: var(--on-surface-variant);
      max-width: 280px;
      line-height: 1.5;
    }
    .error-detail {
      font-size: 12px;
      color: var(--on-surface-variant);
      opacity: 0.7;
      max-width: 280px;
    }
    .retry-btn {
      margin-top: var(--space-sm);
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      height: 44px;
      padding: 0 var(--space-lg);
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-lg);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.1px;
    }
    .retry-btn .material-symbols-outlined { font-size: var(--icon-sm); }
    .retry-btn:active { opacity: 0.8; }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 24px;
      right: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      height: 56px;
      padding: 0 20px;
      background: var(--primary);
      border-radius: var(--radius-lg);
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.32);
      cursor: pointer;
      border: none;
      letter-spacing: 0.1px;
    }
    .fab .material-symbols-outlined { font-size: var(--icon-sm); color: var(--on-primary); }
    .fab:active { opacity: 0.88; }
  </style>
</head>
<body>
<div data-shell="root" data-screen-id="standing-orders" data-state="error">
  <header data-shell="top-app-bar">
    <button class="top-bar-back" data-nav-to="home" aria-label="Go back" tabindex="0" role="button">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="top-bar-title">Standing Orders</h1>
    <button class="top-bar-action" data-action="filter_changed" aria-label="Filter" tabindex="0" role="button">
      <span class="material-symbols-outlined">tune</span>
    </button>
  </header>

  <main data-shell="content" data-state="error">

    <!-- Account Selector -->
    <div
      class="account-selector-card"
      data-component-type="card"
      data-component-id="account_selector"
      data-component-variant="outlined"
      data-action="open_account_picker"
      tabindex="0"
      role="button"
      aria-label="From account selector. Tap to change which account these standing orders belong to."
    >
      <div class="account-selector-inner">
        <span class="account-selector-label" data-component-type="text" data-component-id="account_selector_label">From account</span>
        <span class="account-selector-value" data-component-type="text" data-component-id="account_selector_value">Current Account</span>
      </div>
      <span class="material-symbols-outlined account-selector-chevron" aria-hidden="true">expand_more</span>
    </div>

    <!-- Stats Row (zeroed / unavailable) -->
    <div class="stats-row" data-component-type="stack" data-component-id="title_count_row" data-component-variant="row" role="row" aria-label="Standing orders summary stats — unavailable">
      <div class="stat-card" data-component-type="card" data-component-id="stat_active" data-component-variant="outlined" role="status" aria-label="Active count unavailable">
        <span class="stat-label">Active</span>
        <span class="stat-value">—</span>
      </div>
      <div class="stat-card" data-component-type="card" data-component-id="stat_monthly_total" data-component-variant="outlined" role="status" aria-label="Monthly total unavailable">
        <span class="stat-label">Monthly</span>
        <span class="stat-value">—</span>
      </div>
      <div class="stat-card" data-component-type="card" data-component-id="stat_paused" data-component-variant="outlined" role="status" aria-label="Paused count unavailable">
        <span class="stat-label">Paused</span>
        <span class="stat-value">—</span>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="filter-row" data-component-type="chip_group" data-component-id="filter_chips" data-component-variant="filter" role="tablist" aria-label="Filter standing orders by status: All, Active, Paused, Cancelled">
      <button class="chip selected" data-action="filter_changed" data-filter="All" role="tab" aria-selected="true" tabindex="0">All</button>
      <button class="chip" data-action="filter_changed" data-filter="Active" role="tab" aria-selected="false" tabindex="0">Active</button>
      <button class="chip" data-action="filter_changed" data-filter="Paused" role="tab" aria-selected="false" tabindex="0">Paused</button>
      <button class="chip" data-action="filter_changed" data-filter="Cancelled" role="tab" aria-selected="false" tabindex="0">Cancelled</button>
    </div>

    <!-- Error state -->
    <div
      class="error-area"
      data-component-type="error_state"
      data-component-id="error_state"
      role="status"
      aria-label="Unable to load standing orders. Retry."
    >
      <svg class="error-illustration" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Connection error illustration" role="img">
        <!-- Cloud with disconnected lines -->
        <ellipse cx="55" cy="52" rx="34" ry="24" fill="var(--surface-container)" stroke="var(--outline-variant)" stroke-width="1.5"/>
        <rect x="44" y="70" width="4" height="14" rx="2" fill="var(--outline-variant)"/>
        <rect x="62" y="70" width="4" height="14" rx="2" fill="var(--outline-variant)"/>
        <!-- Signal waves — interrupted -->
        <path d="M26 40 Q30 32 38 30" stroke="var(--outline-variant)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M84 40 Q80 32 72 30" stroke="var(--outline-variant)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <!-- X mark in center of cloud -->
        <circle cx="55" cy="52" r="14" fill="var(--error-container)"/>
        <path d="M49 46 L61 58 M61 46 L49 58" stroke="var(--error)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>

      <p class="error-headline">Couldn't load standing orders</p>
      <p class="error-body">We weren't able to fetch your standing orders. This may be a temporary issue with your bank connection.</p>
      <p class="error-detail">Missing ReadStandingOrders permission on the account consent.</p>

      <button
        class="retry-btn"
        data-component-type="button"
        data-component-id="error_state"
        data-action="retry"
        tabindex="0"
        aria-label="Retry loading standing orders"
      >
        <span class="material-symbols-outlined">refresh</span>
        Try again
      </button>
    </div>

  </main>

  <!-- Extended FAB -->
  <button
    class="fab"
    data-component-type="button"
    data-component-id="create_standing_order_fab"
    data-component-variant="extended_fab"
    data-action="create_clicked"
    tabindex="0"
    role="button"
    aria-label="Create a new standing order"
  >
    <span class="material-symbols-outlined">add</span>
    New order
  </button>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
