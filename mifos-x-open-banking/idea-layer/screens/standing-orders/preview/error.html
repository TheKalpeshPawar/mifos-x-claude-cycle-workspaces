<!doctype html>
<html lang="en" data-screen="standing-orders" data-state="error">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Standing Orders — Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --error:#BA1A1A;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font);}
.mi{font-family:'Material Icons';font-style:normal;}
.top-bar{width:390px;height:56px;background:var(--surface);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--surface-variant);}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);}
.top-bar-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.section-header{padding:16px 20px 8px;}
.section-title{font-size:28px;font-weight:700;color:var(--primary);}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;gap:16px;text-align:center;min-height:calc(844px - 56px - 120px);}
.error-icon{width:80px;height:80px;background:#FFDAD6;border-radius:40px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.error-icon .mi{font-size:40px;color:var(--error);}
.error-title{font-size:20px;font-weight:600;color:var(--text-primary);}
.error-msg{font-size:14px;color:var(--outline);line-height:1.5;max-width:280px;}
.retry-btn{margin-top:8px;padding:14px 32px;background:var(--primary);color:#FFF;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
.fab{position:absolute;bottom:24px;right:24px;width:56px;height:56px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-bar-back" data-nav-to="accounts">
    <span class="mi" style="font-size:24px;color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Standing Orders</span>
  <div class="top-bar-action">
    <span class="mi" style="font-size:24px;color:var(--outline);">more_vert</span>
  </div>
</header>

<div class="section-header">
  <div class="section-title">Standing Orders</div>
</div>

<main>
  <div class="error-icon">
    <span class="mi">cloud_off</span>
  </div>
  <h2 class="error-title">Unable to load standing orders</h2>
  <p class="error-msg">Check your connection and try again</p>
  <button class="retry-btn" data-action="retry_load">Retry</button>
</main>

<div class="fab" data-action="setup_standing_order">
  <span class="mi" style="font-size:24px;color:#FFF;">add</span>
</div>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
