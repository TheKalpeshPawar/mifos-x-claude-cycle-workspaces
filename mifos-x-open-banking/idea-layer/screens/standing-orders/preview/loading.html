<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Standing Orders — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
  background:var(--background);
  font-family:var(--font);
}
.top-bar{
  width:390px;
  height:56px;
  background:var(--surface);
  display:flex;
  align-items:center;
  padding:0 8px;
  border-bottom:1px solid var(--surface-variant);
}
.top-bar-back{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
}
.top-bar-title{font-size:18px;font-weight:600;color:var(--text-primary);flex:1;}
.top-bar-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.mi{font-family:'Material Icons';font-style:normal;font-size:24px;}
.screen-content{
  height:calc(844px - 56px - 80px);
  overflow-y:auto;
  padding:16px;
  scrollbar-width:none;
}
.screen-content::-webkit-scrollbar{display:none;}
@keyframes shimmer{
  0%{background-position:-390px 0}
  100%{background-position:390px 0}
}
.shimmer{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--background) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:8px;
}
.skel-page-header{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.skel-page-title{height:26px;width:160px;border-radius:8px;}
.skel-chip{height:26px;width:70px;border-radius:12px;}
.skel-card{
  background:var(--surface);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.skel-card-header{display:flex;align-items:center;justify-content:space-between;}
.skel-card-title{height:15px;width:130px;border-radius:6px;}
.skel-status{height:22px;width:55px;border-radius:10px;}
.skel-beneficiary{height:12px;width:180px;border-radius:5px;}
.skel-amount-row{display:flex;align-items:center;justify-content:space-between;}
.skel-amount{height:16px;width:110px;border-radius:6px;}
.skel-date{height:12px;width:95px;border-radius:5px;}
.skel-actions{
  display:flex;justify-content:flex-end;gap:8px;
  border-top:1px solid var(--background);padding-top:10px;
}
.skel-action-btn{width:36px;height:36px;border-radius:8px;}
/* Bottom nav */
.bottom-nav{
  position:absolute;bottom:0;left:0;
  width:390px;height:80px;
  background:var(--surface);border-top:1px solid var(--surface-variant);
  display:flex;align-items:flex-start;padding:12px 12px 16px;gap:8px;
}
.nav-tab{display:flex;flex-direction:column;align-items:center;width:80px;gap:4px;text-decoration:none;}
.nav-pill{display:flex;align-items:center;justify-content:center;width:64px;height:28px;border-radius:14px;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-icon{font-size:22px;color:var(--outline);font-family:'Material Icons';font-style:normal;}
.nav-tab.active .nav-icon{color:var(--primary);}
.nav-label{font-size:11px;color:var(--outline);font-family:var(--font);}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-bar-back">
    <span class="mi" style="color:var(--text-primary);">arrow_back</span>
  </div>
  <span class="top-bar-title">Standing Orders</span>
  <div class="top-bar-action">
    <span class="mi" style="color:var(--outline);">filter_list</span>
  </div>
</header>

<main data-screen="standing-orders" data-state="loading" role="main" aria-busy="true" aria-label="Loading standing orders">
  <div class="screen-content">

    <!-- Header skeleton -->
    <div class="skel-page-header">
      <div class="shimmer skel-page-title"></div>
      <div class="shimmer skel-chip"></div>
    </div>

    <!-- Card skeleton 1 -->
    <div class="skel-card">
      <div class="skel-card-header">
        <div class="shimmer skel-card-title"></div>
        <div class="shimmer skel-status"></div>
      </div>
      <div class="shimmer skel-beneficiary"></div>
      <div class="skel-amount-row">
        <div class="shimmer skel-amount"></div>
        <div class="shimmer skel-date"></div>
      </div>
      <div class="skel-actions">
        <div class="shimmer skel-action-btn"></div>
        <div class="shimmer skel-action-btn"></div>
      </div>
    </div>

    <!-- Card skeleton 2 -->
    <div class="skel-card">
      <div class="skel-card-header">
        <div class="shimmer skel-card-title" style="width:155px"></div>
        <div class="shimmer skel-status"></div>
      </div>
      <div class="skel-amount-row">
        <div class="shimmer skel-amount" style="width:105px"></div>
        <div class="shimmer skel-date"></div>
      </div>
      <div class="skel-actions">
        <div class="shimmer skel-action-btn"></div>
        <div class="shimmer skel-action-btn"></div>
      </div>
    </div>

    <!-- Card skeleton 3 -->
    <div class="skel-card">
      <div class="skel-card-header">
        <div class="shimmer skel-card-title" style="width:120px"></div>
        <div class="shimmer skel-status"></div>
      </div>
      <div class="skel-amount-row">
        <div class="shimmer skel-amount" style="width:100px"></div>
        <div class="shimmer skel-date"></div>
      </div>
      <div class="skel-actions">
        <div class="shimmer skel-action-btn"></div>
        <div class="shimmer skel-action-btn"></div>
      </div>
    </div>

  </div>
</main>

<nav class="bottom-nav" aria-label="Main navigation" data-component-type="bottom-nav">
  <a class="nav-tab" href="#" data-nav-to="home" aria-label="Home">
    <div class="nav-pill"><span class="nav-icon">home</span></div>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-tab" href="#" data-nav-to="accounts" aria-label="Accounts">
    <div class="nav-pill"><span class="nav-icon">account_balance</span></div>
    <span class="nav-label">Accounts</span>
  </a>
  <a class="nav-tab active" href="#" data-nav-to="send-money" aria-label="Payments" aria-current="page">
    <div class="nav-pill"><span class="nav-icon">send</span></div>
    <span class="nav-label">Payments</span>
  </a>
  <a class="nav-tab" href="#" data-nav-to="profile" aria-label="Profile">
    <div class="nav-pill"><span class="nav-icon">person</span></div>
    <span class="nav-label">Profile</span>
  </a>
</nav>

<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
