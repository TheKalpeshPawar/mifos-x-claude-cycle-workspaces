<!doctype html>
<!-- render-hash: so-loading-llm -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standing Orders — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --on-primary-container: #102000;
      --secondary: #386663;
      --tertiary: #386663;
      --tertiary-container: #BCEBE7;
      --error: #BA1A1A;
      --on-error: #FFFFFF;
      --error-container: #FFDAD6;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --surface-container: #F0F1E6;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --pending: #E8A317;
      --icon-xs: 16px;
      --icon-sm: 20px;
      --icon-md: 24px;
      --icon-lg: 32px;
      --icon-xl: 40px;
      --icon-2xl: 48px;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 16px;
      --sp-lg: 24px;
      --sp-xl: 32px;
      --radius-card: 12px;
      --radius-pill: 999px;
      --radius-lg: 16px;
    }
    :root[data-theme="dark"] {
      --primary: #B2D188;
      --on-primary: #1F3701;
      --primary-container: #354E16;
      --on-primary-container: #CDEDA3;
      --secondary: #A0CFCB;
      --tertiary: #A0CFCB;
      --tertiary-container: #1F4E4B;
      --error: #FFB4AB;
      --on-error: #690005;
      --error-container: #93000A;
      --background: #12140E;
      --on-background: #E3E3D8;
      --surface: #1E201A;
      --on-surface: #E3E3D8;
      --surface-variant: #44483D;
      --on-surface-variant: #C5C8BA;
      --surface-container: #1E201A;
      --outline: #8F9285;
      --outline-variant: #44483D;
      --pending: #E8A317;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188;
        --on-primary: #1F3701;
        --primary-container: #354E16;
        --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB;
        --tertiary: #A0CFCB;
        --tertiary-container: #1F4E4B;
        --error: #FFB4AB;
        --on-error: #690005;
        --error-container: #93000A;
        --background: #12140E;
        --on-background: #E3E3D8;
        --surface: #1E201A;
        --on-surface: #E3E3D8;
        --surface-variant: #44483D;
        --on-surface-variant: #C5C8BA;
        --surface-container: #1E201A;
        --outline: #8F9285;
        --outline-variant: #44483D;
        --pending: #E8A317;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main { flex: 1; display: flex; flex-direction: column; padding-bottom: 96px; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }

    /* Top App Bar */
    header[data-shell="top-app-bar"] {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--sp-xs) 0 var(--sp-xs);
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-bar-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--on-surface);
      border-radius: var(--radius-pill);
    }
    .top-bar-back .material-symbols-outlined { font-size: var(--icon-md); }
    .top-bar-title {
      flex: 1;
      font-size: 18px;
      font-weight: 500;
      color: var(--on-surface);
      letter-spacing: -0.1px;
    }
    .top-bar-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--on-surface-variant);
      border-radius: var(--radius-pill);
    }
    .top-bar-action .material-symbols-outlined { font-size: var(--icon-md); }

    /* Shimmer */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      border-radius: 6px;
      background: linear-gradient(
        90deg,
        var(--surface-variant) 25%,
        var(--surface-container) 50%,
        var(--surface-variant) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.6s infinite linear;
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; background: var(--surface-variant); }
    }

    /* Account Selector */
    .account-selector-card {
      margin: var(--sp-sm) var(--sp-md) 0;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-card);
      padding: var(--sp-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
    }
    .account-selector-inner { display: flex; flex-direction: column; gap: 4px; }

    /* Stats Row */
    .stats-row {
      display: flex;
      gap: var(--sp-sm);
      margin: var(--sp-sm) var(--sp-md) 0;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      padding: var(--sp-md) var(--sp-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* Filter Chips */
    .filter-row {
      display: flex;
      gap: var(--sp-sm);
      padding: var(--sp-md) var(--sp-md) var(--sp-sm);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    /* Skeleton card */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      padding: var(--sp-md);
      margin: 0 var(--sp-md) 12px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-sm);
    }
    .skel-row { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-sm); }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 24px;
      right: var(--sp-md);
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      height: 56px;
      padding: 0 20px;
      background: var(--primary);
      border-radius: var(--radius-lg);
      color: var(--on-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.32);
      cursor: pointer;
      border: none;
      letter-spacing: 0.1px;
    }
    .fab .material-symbols-outlined { font-size: var(--icon-sm); color: var(--on-primary); }
  </style>
</head>
<body>
<div data-shell="root" data-screen-id="standing-orders" data-state="loading">
  <header data-shell="top-app-bar">
    <button class="top-bar-back" data-nav-to="home" aria-label="Go back" tabindex="0" role="button">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="top-bar-title">Standing Orders</h1>
    <button class="top-bar-action" aria-label="Filter" tabindex="0" role="button">
      <span class="material-symbols-outlined">tune</span>
    </button>
  </header>

  <main data-shell="content" data-state="loading">

    <!-- Account Selector skeleton -->
    <div
      class="account-selector-card"
      data-component-type="card"
      data-component-id="account_selector"
      data-component-variant="outlined"
      aria-label="Loading account selector"
      aria-busy="true"
    >
      <div class="account-selector-inner">
        <div class="skeleton" style="height:10px;width:72px;" data-component-type="text" data-component-id="account_selector_label" aria-hidden="true"></div>
        <div class="skeleton" style="height:16px;width:130px;" data-component-type="text" data-component-id="account_selector_value" aria-hidden="true"></div>
      </div>
      <div class="skeleton" style="height:20px;width:20px;border-radius:4px;" aria-hidden="true"></div>
    </div>

    <!-- Stats Row skeleton -->
    <div class="stats-row" data-component-type="stack" data-component-id="title_count_row" data-component-variant="row" role="row" aria-label="Loading stats" aria-busy="true">
      <div class="stat-card" data-component-type="card" data-component-id="stat_active" data-component-variant="outlined">
        <div class="skeleton" style="height:10px;width:40px;" aria-hidden="true"></div>
        <div class="skeleton" style="height:22px;width:28px;" aria-hidden="true"></div>
      </div>
      <div class="stat-card" data-component-type="card" data-component-id="stat_monthly_total" data-component-variant="outlined">
        <div class="skeleton" style="height:10px;width:52px;" aria-hidden="true"></div>
        <div class="skeleton" style="height:22px;width:64px;" aria-hidden="true"></div>
      </div>
      <div class="stat-card" data-component-type="card" data-component-id="stat_paused" data-component-variant="outlined">
        <div class="skeleton" style="height:10px;width:44px;" aria-hidden="true"></div>
        <div class="skeleton" style="height:22px;width:28px;" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Filter Chips skeleton -->
    <div class="filter-row" data-component-type="chip_group" data-component-id="filter_chips" data-component-variant="filter" aria-label="Loading filters" aria-busy="true">
      <div class="skeleton" style="height:32px;width:40px;border-radius:999px;" aria-hidden="true"></div>
      <div class="skeleton" style="height:32px;width:60px;border-radius:999px;" aria-hidden="true"></div>
      <div class="skeleton" style="height:32px;width:56px;border-radius:999px;" aria-hidden="true"></div>
      <div class="skeleton" style="height:32px;width:82px;border-radius:999px;" aria-hidden="true"></div>
    </div>

    <!-- Skeleton order cards (3) -->
    <div data-component-type="list" data-component-id="orders_list" data-component-variant="lazy_column" role="list" aria-label="Loading standing orders" aria-busy="true">

      <div class="skeleton-card" data-component-type="card" data-component-id="order_card" data-component-variant="outlined" role="listitem">
        <div class="skel-row">
          <div class="skeleton" style="height:18px;width:140px;" data-component-type="text" data-component-id="order_name" aria-hidden="true"></div>
          <div class="skeleton" style="height:22px;width:58px;border-radius:999px;" data-component-type="badge" data-component-id="order_status_badge" aria-hidden="true"></div>
        </div>
        <div class="skeleton" style="height:12px;width:200px;" data-component-type="text" data-component-id="order_counterparty" aria-hidden="true"></div>
        <div class="skeleton" style="height:12px;width:160px;" data-component-type="text" data-component-id="order_from_account" aria-hidden="true"></div>
        <div class="skel-row">
          <div class="skeleton" style="height:26px;width:80px;" data-component-type="text" data-component-id="order_amount" aria-hidden="true"></div>
          <div class="skeleton" style="height:12px;width:64px;" data-component-type="text" data-component-id="order_frequency" aria-hidden="true"></div>
        </div>
        <div class="skeleton" style="height:12px;width:120px;" data-component-type="text" data-component-id="order_schedule_line" aria-hidden="true"></div>
      </div>

      <div class="skeleton-card" data-component-type="card" data-component-id="order_card" data-component-variant="outlined" role="listitem">
        <div class="skel-row">
          <div class="skeleton" style="height:18px;width:120px;" data-component-type="text" data-component-id="order_name" aria-hidden="true"></div>
          <div class="skeleton" style="height:22px;width:58px;border-radius:999px;" data-component-type="badge" data-component-id="order_status_badge" aria-hidden="true"></div>
        </div>
        <div class="skeleton" style="height:12px;width:180px;" data-component-type="text" data-component-id="order_counterparty" aria-hidden="true"></div>
        <div class="skeleton" style="height:12px;width:148px;" data-component-type="text" data-component-id="order_from_account" aria-hidden="true"></div>
        <div class="skel-row">
          <div class="skeleton" style="height:26px;width:64px;" data-component-type="text" data-component-id="order_amount" aria-hidden="true"></div>
          <div class="skeleton" style="height:12px;width:64px;" data-component-type="text" data-component-id="order_frequency" aria-hidden="true"></div>
        </div>
        <div class="skeleton" style="height:12px;width:110px;" data-component-type="text" data-component-id="order_schedule_line" aria-hidden="true"></div>
      </div>

      <div class="skeleton-card" data-component-type="card" data-component-id="order_card" data-component-variant="outlined" role="listitem">
        <div class="skel-row">
          <div class="skeleton" style="height:18px;width:112px;" data-component-type="text" data-component-id="order_name" aria-hidden="true"></div>
          <div class="skeleton" style="height:22px;width:68px;border-radius:999px;" data-component-type="badge" data-component-id="order_status_badge" aria-hidden="true"></div>
        </div>
        <div class="skeleton" style="height:12px;width:196px;" data-component-type="text" data-component-id="order_counterparty" aria-hidden="true"></div>
        <div class="skeleton" style="height:12px;width:160px;" data-component-type="text" data-component-id="order_from_account" aria-hidden="true"></div>
        <div class="skel-row">
          <div class="skeleton" style="height:26px;width:96px;" data-component-type="text" data-component-id="order_amount" aria-hidden="true"></div>
          <div class="skeleton" style="height:12px;width:64px;" data-component-type="text" data-component-id="order_frequency" aria-hidden="true"></div>
        </div>
        <div class="skeleton" style="height:12px;width:136px;" data-component-type="text" data-component-id="order_schedule_line" aria-hidden="true"></div>
      </div>

    </div>
  </main>

  <!-- Extended FAB -->
  <button
    class="fab"
    data-component-type="button"
    data-component-id="create_standing_order_fab"
    data-component-variant="extended_fab"
    data-action="create_clicked"
    tabindex="0"
    role="button"
    aria-label="Create a new standing order"
  >
    <span class="material-symbols-outlined">add</span>
    New order
  </button>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
