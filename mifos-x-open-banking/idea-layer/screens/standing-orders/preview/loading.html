<!doctype html>
<!-- render-hash: so-loading-01 -->
<html lang="en" data-screen="standing-orders" data-state="loading" data-feature="standing-orders" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Standing Orders — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.summary-skel{display:flex;gap:12px;margin:8px 20px 20px}.summary-skel .tile{flex:1;background:var(--surface);border:1px solid var(--outline-variant);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}.summary-skel .l1{height:10px;width:60%}.summary-skel .l2{height:18px;width:70%}
.chip-skel{display:flex;gap:8px;padding:0 20px 12px}.chip-skel .c{height:30px;width:80px;border-radius:999px}
.card-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;margin:0 20px 12px;padding:16px;display:flex;flex-direction:column;gap:12px}.card-skel .row{display:flex;justify-content:space-between;align-items:center;gap:12px}.card-skel .row .left{flex:1;display:flex;flex-direction:column;gap:6px}.card-skel .l1{height:14px;width:60%}.card-skel .l2{height:11px;width:80%}.card-skel .l3{height:22px;width:40%}.card-skel .l4{height:11px;width:50%}.card-skel .badge{height:22px;width:60px;border-radius:999px}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons">arrow_back</span><h1>Standing Orders</h1></div>
<div class="summary-skel"><div class="tile"><div class="skel l1"></div><div class="skel l2"></div></div><div class="tile"><div class="skel l1"></div><div class="skel l2"></div></div><div class="tile"><div class="skel l1"></div><div class="skel l2"></div></div></div>
<div class="chip-skel"><div class="skel c"></div><div class="skel c"></div><div class="skel c"></div><div class="skel c"></div></div>
<div class="card-skel"><div class="row"><div class="left"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel badge"></div></div><div class="skel l3"></div><div class="skel l4"></div></div>
<div class="card-skel"><div class="row"><div class="left"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel badge"></div></div><div class="skel l3"></div><div class="skel l4"></div></div>
<div class="card-skel"><div class="row"><div class="left"><div class="skel l1"></div><div class="skel l2"></div></div><div class="skel badge"></div></div><div class="skel l3"></div><div class="skel l4"></div></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
