<!doctype html>
<!-- render-hash: e8d3f5a1b029 -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standing Orders — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    /* ── Design tokens: light mode (:root) ─────────────────────────────── */
    :root {
      --md-primary:                  #266489;
      --md-on-primary:               #FFFFFF;
      --md-primary-container:        #C9E6FF;
      --md-on-primary-container:     #004B6F;
      --md-secondary:                #50606E;
      --md-on-secondary:             #FFFFFF;
      --md-secondary-container:      #D3E5F5;
      --md-on-secondary-container:   #384956;
      --md-error:                    #BA1A1A;
      --md-on-error:                 #FFFFFF;
      --md-background:               #F7F9FF;
      --md-on-background:            #181C20;
      --md-surface:                  #F7F9FF;
      --md-on-surface:               #181C20;
      --md-surface-variant:          #DDE3EA;
      --md-on-surface-variant:       #41474D;
      --md-outline:                  #72787E;
      --md-outline-variant:          #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low:    #F1F4F9;
      --md-surface-container:        #EBEEF3;
      --md-surface-container-high:   #E5E8ED;
      --md-surface-container-highest:#E0E3E8;

      /* Shimmer colours (derived from surface tokens) */
      --shimmer-base:      #EBEEF3;
      --shimmer-highlight: #F1F4F9;

      /* Typography */
      --font-brand: 'Roboto', sans-serif;

      /* Type scale */
      --ts-title-medium: 500 16px / 24px var(--font-brand);
      --ts-label-medium: 500 12px / 16px var(--font-brand);

      /* Shape */
      --radius-small:       8px;
      --radius-medium:      12px;
      --radius-full:        9999px;

      /* Spacing */
      --sp-4:  4px;
      --sp-8:  8px;
      --sp-12: 12px;
      --sp-16: 16px;
      --sp-24: 24px;
      --sp-32: 32px;
      --sp-48: 48px;
    }

    /* ── Dark mode tokens ───────────────────────────────────────────────── */
    [data-theme="dark"] {
      --md-primary:                  #95CDF7;
      --md-on-primary:               #00344E;
      --md-primary-container:        #004B6F;
      --md-on-primary-container:     #C9E6FF;
      --md-secondary:                #B7C9D9;
      --md-on-secondary:             #22323F;
      --md-secondary-container:      #384956;
      --md-on-secondary-container:   #D3E5F5;
      --md-error:                    #FFB4AB;
      --md-on-error:                 #690005;
      --md-background:               #101417;
      --md-on-background:            #E0E3E8;
      --md-surface:                  #101417;
      --md-on-surface:               #E0E3E8;
      --md-surface-variant:          #41474D;
      --md-on-surface-variant:       #C1C7CE;
      --md-outline:                  #8B9198;
      --md-outline-variant:          #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low:    #181C20;
      --md-surface-container:        #1C2024;
      --md-surface-container-high:   #262A2E;
      --md-surface-container-highest:#313539;

      --shimmer-base:      #1C2024;
      --shimmer-highlight: #262A2E;
    }

    /* ── Reset & base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font: var(--ts-body-medium, 14px/20px var(--font-brand));
      background: var(--md-background);
      color: var(--md-on-surface);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top App Bar ────────────────────────────────────────────────────── */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--md-surface);
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-8) var(--sp-4) var(--sp-8) var(--sp-4);
      height: 64px;
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
    }

    .top-app-bar__title {
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--md-on-surface);
      flex: 1;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-size: 24px;
      line-height: 1;
      user-select: none;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* ── Screen content ─────────────────────────────────────────────────── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-16);
      padding-bottom: calc(var(--sp-16) + 80px);
      display: flex;
      flex-direction: column;
      gap: var(--sp-12);
    }

    /* ── Shimmer skeleton ───────────────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .skeleton {
      background: linear-gradient(
        90deg,
        var(--shimmer-base) 25%,
        var(--shimmer-highlight) 50%,
        var(--shimmer-base) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: var(--radius-small);
    }

    /* Summary row skeleton */
    .skel-summary {
      height: 16px;
      width: 140px;
      margin-bottom: var(--sp-4);
    }

    /* Card skeleton */
    .skel-card {
      background: var(--md-surface-container);
      border-radius: var(--radius-medium);
      padding: var(--sp-16);
      display: flex;
      flex-direction: column;
      gap: var(--sp-8);
      box-shadow: 0 1px 2px color-mix(in srgb, var(--md-on-surface) 10%, transparent);
    }

    .skel-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-8);
    }
    .skel-payee   { height: 16px; width: 55%; }
    .skel-badge   { height: 20px; width: 56px; border-radius: var(--radius-full); }
    .skel-amount  { height: 28px; width: 45%; }
    .skel-meta    { height: 12px; }
    .skel-meta--w60 { width: 60%; }
    .skel-meta--w40 { width: 40%; }
    .skel-meta--w70 { width: 70%; }
    .skel-meta--w30 { width: 30%; }

    .skel-divider {
      height: 1px;
      background: var(--md-outline-variant);
      margin: var(--sp-4) 0;
    }

    /* ── Bottom Navigation ──────────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: var(--md-surface-container);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 var(--sp-8);
      border-top: 1px solid var(--md-outline-variant);
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-4);
      flex: 1;
      padding: var(--sp-8) 0 var(--sp-4);
      min-height: 48px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--md-on-surface-variant);
      font: var(--ts-label-medium);
      text-decoration: none;
    }
    .nav-item__indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
    }
    .nav-item__label { font: var(--ts-label-medium); }
  </style>
</head>
<body data-screen="standing-orders" data-state="loading">

  <!-- Top App Bar -->
  <header class="top-app-bar" role="banner">
    <button
      class="icon-btn"
      aria-label="Navigate back to Account Detail"
      data-nav-to="account-detail"
    >
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Standing Orders</h1>
  </header>

  <!-- Loading skeleton mirrors content block structure block-for-block -->
  <main
    class="screen-content"
    role="main"
    aria-label="Loading standing orders"
    aria-busy="true"
    aria-live="polite"
  >
    <!-- Summary skeleton -->
    <div class="skeleton skel-summary" role="presentation" aria-hidden="true"></div>

    <!-- Card skeleton × 3 (mirrors content layout) -->
    <!-- Card 1 -->
    <div class="skel-card" role="presentation" aria-hidden="true">
      <div class="skel-card__header">
        <div class="skeleton skel-payee"></div>
        <div class="skeleton skel-badge"></div>
      </div>
      <div class="skeleton skel-amount"></div>
      <div class="skeleton skel-meta skel-meta--w60"></div>
      <div class="skeleton skel-meta skel-meta--w40"></div>
      <div class="skel-divider"></div>
      <div class="skeleton skel-meta skel-meta--w70"></div>
      <div class="skeleton skel-meta skel-meta--w30"></div>
    </div>

    <!-- Card 2 -->
    <div class="skel-card" role="presentation" aria-hidden="true">
      <div class="skel-card__header">
        <div class="skeleton skel-payee" style="width:40%"></div>
        <div class="skeleton skel-badge"></div>
      </div>
      <div class="skeleton skel-amount" style="width:35%"></div>
      <div class="skeleton skel-meta skel-meta--w60"></div>
      <div class="skeleton skel-meta skel-meta--w40"></div>
      <div class="skel-divider"></div>
      <div class="skeleton skel-meta skel-meta--w70"></div>
      <div class="skeleton skel-meta skel-meta--w30"></div>
    </div>

    <!-- Card 3 -->
    <div class="skel-card" role="presentation" aria-hidden="true">
      <div class="skel-card__header">
        <div class="skeleton skel-payee" style="width:50%"></div>
        <div class="skeleton skel-badge"></div>
      </div>
      <div class="skeleton skel-amount" style="width:30%"></div>
      <div class="skeleton skel-meta skel-meta--w60"></div>
      <div class="skeleton skel-meta skel-meta--w40"></div>
      <div class="skel-divider"></div>
      <div class="skeleton skel-meta skel-meta--w70"></div>
      <div class="skeleton skel-meta skel-meta--w30"></div>
    </div>

    <!-- Circular progress indicator (supplementary) -->
    <div
      style="display:flex;justify-content:center;padding:var(--sp-24) 0;"
      role="status"
      aria-label="Loading standing orders"
    >
      <svg
        width="32" height="32" viewBox="0 0 32 32"
        aria-hidden="true"
        style="animation: spin 1s linear infinite;"
      >
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
        <circle
          cx="16" cy="16" r="12"
          fill="none"
          stroke="var(--md-primary)"
          stroke-width="3"
          stroke-dasharray="52 75"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </main>

  <!-- Bottom Navigation — 4-tab: Home · Accounts · Transactions · More (no active tab: sub-screen of account-detail) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" aria-label="Home" data-nav-to="home">
      <span class="nav-item__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
      </span>
      <span class="nav-item__label">Home</span>
    </button>
    <button class="nav-item" aria-label="Accounts" data-nav-to="accounts">
      <span class="nav-item__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
      </span>
      <span class="nav-item__label">Accounts</span>
    </button>
    <button class="nav-item" aria-label="Transactions" data-nav-to="transactions">
      <span class="nav-item__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
      </span>
      <span class="nav-item__label">Transactions</span>
    </button>
    <button class="nav-item" aria-label="More" data-nav-to="settings">
      <span class="nav-item__indicator">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
      </span>
      <span class="nav-item__label">More</span>
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
