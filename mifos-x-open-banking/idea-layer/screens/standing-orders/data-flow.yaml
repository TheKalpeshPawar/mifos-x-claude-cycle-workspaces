sibling: data-flow
schema_version: "4.0"
feature_id: standing-orders
entries:
  - screen_id: standing-orders
    trigger: on_interact
    event: CreateOrderClicked
    endpoints:
      - obp_create_standing_order
    direction: write
    dtos:
      - name: StandingOrder
        role: response
        api_id: obp_create_standing_order
    produces_state: content
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
      - error_code: 500
        behavior: error_state
