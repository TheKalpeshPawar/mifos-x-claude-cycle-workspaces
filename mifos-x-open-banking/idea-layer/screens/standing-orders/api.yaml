screen_id: standing-orders

endpoints:
  - id: standing-orders-list
    method: GET
    path: "/accounts/{AccountId}/standing-orders"
    response_dto: OBReadStandingOrder6
    permission: ReadStandingOrdersDetail
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns all standing orders for the given AccountId. Frequency field uses OBIE ISO 20022 codes (e.g. IntrvlMnthDay:01:01 = monthly on 1st)."
