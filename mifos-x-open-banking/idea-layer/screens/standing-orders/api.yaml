sibling: api
schema_version: "4.0"
feature_id: standing-orders
notes: >
  Rebound to HSBC OBIE AISP v4.0 (2026-06-11). Unlike OBP (which had no list endpoint and
  derived the list from transaction history), OBIE exposes a real READ endpoint:
  get_account_standing_orders. This screen is READ-ONLY — it lists the standing orders set up
  on the selected AccountId. Creating/editing a standing order is a PISP write handled by the
  standing-order-create / standing-order-edit screens, NOT bound here. Reads require an
  authorised account-access consent (ReadStandingOrdersBasic/Detail permission) and an
  authorization-code scoped token; the AccountId comes from the prior get_accounts call.
api:
  - id: get_account_standing_orders
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/standing-orders"
    tag: Standing-Orders
    trigger: on_mount
    note: >
      OBIE object OBReadStandingOrder6 (HTTP 200). Requires ReadStandingOrdersBasic/Detail and
      an account-access-consent in AUTH status. Authorization-code token. CreditorAccount is
      only populated under the Detail permission. Multiple standing orders may return per account.
    request:
      dto: none
      fields: []
    response:
      dto: OBReadStandingOrder6
      fields:
        - name: Data.StandingOrder[].AccountId
          type: String
        - name: Data.StandingOrder[].StandingOrderId
          type: "String?"
        - name: Data.StandingOrder[].Reference
          type: "String?"
        - name: Data.StandingOrder[].StandingOrderStatusCode
          type: "String?"
        - name: Data.StandingOrder[].Frequency
          type: "String?"
        - name: Data.StandingOrder[].FirstPaymentDateTime
          type: "String?"
        - name: Data.StandingOrder[].NextPaymentDateTime
          type: "String?"
        - name: Data.StandingOrder[].FirstPaymentAmount.Amount
          type: "String?"
        - name: Data.StandingOrder[].FirstPaymentAmount.Currency
          type: "String?"
        - name: Data.StandingOrder[].NextPaymentAmount.Amount
          type: "String?"
        - name: Data.StandingOrder[].NextPaymentAmount.Currency
          type: "String?"
        - name: Data.StandingOrder[].CreditorAccount.SchemeName
          type: "String?"
        - name: Data.StandingOrder[].CreditorAccount.Identification
          type: "String?"
        - name: Data.StandingOrder[].CreditorAccount.Name
          type: "String?"
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus (e.g. missing ReadStandingOrders)"
      - code: 429
        message: "TOO_MANY_REQUESTS"
      - code: 500
        message: "OB.UnexpectedError"

consent_dependency:
  note: >
    Every data-resource GET requires an account-access-consent (create_consent) that the PSU has
    authorised (Status AUTH) carrying ReadStandingOrdersBasic or ReadStandingOrdersDetail, plus an
    authorization-code scoped token. The AccountId is obtained from get_accounts. See server/apis/ais.yaml.

writes_elsewhere:
  note: >
    Creating a standing order is OBIE PISP (POST domestic-standing-order-consents +
    POST domestic-standing-orders), surfaced by the standing-order-create / standing-order-edit
    screens. This AISP list screen does NOT create, edit, pause, resume or delete — OBIE AISP is
    read-only for standing orders.
