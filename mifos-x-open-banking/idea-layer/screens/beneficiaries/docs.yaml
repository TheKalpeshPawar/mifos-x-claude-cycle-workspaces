scaffolded_by: /idea-heal
archetype: index_list
flow_ref: recurring-and-statements
description: >-
  Read-only list of saved payees for an account, sourced from OBReadBeneficiary5 via GET
  /accounts/{AccountId}/beneficiaries. Reached from account-detail Beneficiaries chip. Displays avatar initials,
  creditor name, scheme-type label (Sort Code / IBAN / Paym), account identifier, and payment reference. Supports
  client-side search filtering by name or reference. Differentiates error recovery: Retry for transient failures, View
  Consents for 403 ConsentRevoked.
has_ui: true
has_server: false
metadata:
  category: crud
  implementation_ready: true
  impl_ready_at: '2026-06-29T12:00:00Z'
  impl_ready_schema: v2
  quality_score: 95
  quality_last_updated: '2026-07-14'
  quality_improvements:
    - Typed error recovery per HTTP code (401 TokenExpired/retry, 403 ConsentRevoked/view-consents, 429 RateLimited/backoff, network/retry)
    - Client-side search filter by Name and Reference with no API round-trip
    - Avatar initials derived from CreditorAccount.Name for visual identity
    - Scheme-type label mapping (Sort Code/IBAN/Paym/Card/Account) from OBIE SchemeName
    - Empty state for zero-beneficiary accounts distinct from error state
    - i18n string-key wrapping across all UI strings
    - Formal state_model block declaring BeneficiariesUiState sealed variants (Loading/Content/Empty/Error) with field types, error enum, events, actions, and DI
    - Formal dependencies block (tier + features[] + libraries[]) linking account-detail parent, consent-list error-recovery, and ktorfit library
    - HTTP 500 ServerError coverage added to error_cases, LoadBeneficiaries.error_handling, data-flow error_type_mapping, and strings
    - Fixed misleading beneficiary_row accessibility_label (removed "tap to view payment details" — row has no on_click); now runtime template giving CreditorAccount.Name + scheme + Identification to screen readers
    - Distinct search_bar accessibility_label key (search_a11y) separate from placeholder text
    - Added navigate_back trigger to data-flow.yaml on_user_action for completeness
