feature: beneficiaries
flow_ref: recurring-and-statements

entry_points:
  - source: account-detail
    label: "Tap Beneficiaries chip"
    params: [accountId]

transitions:
  - from: beneficiaries
    to: account-detail
    trigger: "Back button (top-app-bar leading)"
    params: [accountId]

  - from: beneficiaries
    to: consent-list
    trigger: "View Consents button (shown on 403 ConsentRevoked error state)"
    params: []
    condition: "error.type == ConsentRevoked"
