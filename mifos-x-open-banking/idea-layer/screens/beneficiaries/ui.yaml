states:
  loading:
    layout:
      visible_components:
        - beneficiary_search_bar
      show_skeleton_list: true
      skeleton_count: 6
  content:
    layout:
      visible_components:
        - beneficiary_search_bar
        - recently_used_header
        - recent_beneficiary_john
        - recent_beneficiary_john_avatar
        - recent_john_bank
        - recent_john_last_payment
        - recent_beneficiary_sarah
        - recent_beneficiary_sarah_avatar
        - recent_sarah_bank
        - recent_sarah_last_payment
        - recent_beneficiary_michael
        - recent_beneficiary_michael_avatar
        - recent_michael_bank
        - section_divider
        - all_beneficiaries_header_row
        - all_beneficiaries_header
        - sort_button
        - beneficiary_item_anderson
        - natwest_logo
        - anderson_iban
        - anderson_last_payment
        - beneficiary_item_patel
        - santander_logo
        - patel_iban
        - add_beneficiary_fab
  empty:
    layout:
      visible_components:
        - beneficiary_search_bar
        - add_beneficiary_fab
      show_empty_state: true
      empty_state_icon: person_off
      empty_state_title: "No beneficiaries yet"
      empty_state_message: "Add a beneficiary to start sending money quickly"
  searching:
    layout:
      visible_components:
        - beneficiary_search_bar
      show_search_results: true
      search_results_placeholder: "Showing results for query"
  error:
    layout:
      visible_components:
        - beneficiary_search_bar
        - add_beneficiary_fab
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load beneficiaries"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: BeneficiariesViewModel
  state_fields:
    - name: beneficiaries
      type: List<Counterparty>
      default: "emptyList()"
    - name: recentBeneficiaries
      type: List<Counterparty>
      default: "emptyList()"
    - name: searchQuery
      type: String
      default: ""
    - name: filteredBeneficiaries
      type: List<Counterparty>
      default: "emptyList()"
    - name: sortOrder
      type: SortOrder
      default: AlphaAscending
    - name: uiState
      type: BeneficiariesUiState
      default: Loading
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load beneficiaries. Please try again."
  events:
    - SearchQueryChanged
    - BeneficiarySelected
    - AddBeneficiaryClicked
    - SortChanged
    - RefreshTriggered
  actions:
    - search
    - navigate
    - open_add_beneficiary_sheet
    - sort
  di:
    - BeneficiaryRepository
    - CounterpartyRepository

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/counterparties"
    tag: Counterparties
    response:
      fields:
        - name: counterparties
          type: List<Counterparty>
        - name: id
          type: String
        - name: name
          type: String
        - name: description
          type: String
        - name: other_bank_routing_address
          type: String
        - name: other_account_routing_address
          type: String
        - name: other_account_routing_scheme
          type: String
        - name: is_beneficiary
          type: Boolean
        - name: created_by_user_id
          type: String
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"

dependencies:
  tier: feature
  features:
    - send-money
