screens:
  - id: beneficiaries
    name: Beneficiaries
    viewmodel: BeneficiariesViewModel
    archetype: index_list
    states_handled: [loading, content, empty, error, no_network, unauthenticated]
    shell:
      top_bar:
        title: "Beneficiaries"
        navigation_icon: arrow_back
        actions: []
      bottom_nav: false

archetype: index_list

components:
  # Account selector — beneficiaries are per-account. Single account → read-only field;
  # >1 account → tappable Card opening a DropdownMenu (onAccountSelected). Shipped: AccountSelector.
  - type: card
    id: beneficiary_account_selector
    label: "Beneficiaries of <account>"
    content: "Beneficiaries of <account>"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: "#FFFFFF"
      border_radius: 12
      border_color: "#C5C8BA"
      border_width: 1
      elevation: 0
      leading_icon: account_balance
      padding: 14
      margin_horizontal: 16
      margin_vertical: 12
    on_click:
      action: onAccountSelected
      target: ""
    a11y:
      label: "Selected account for beneficiaries. Tap to switch when you hold more than one account."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: beneficiary_account_selector
      assert_text: "Beneficiaries of"

  - type: input
    id: beneficiary_search_bar
    label: "Search"
    content: ""
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: outlined
      input_type: search
      placeholder: "Search beneficiaries by name or IBAN..."
      leading_icon: search
      trailing_icon: clear
      border_radius: 28
      padding_horizontal: spacing.md
    on_click:
      action: search
      target: ""
    a11y:
      label: "Search beneficiaries by name or IBAN"
      role: search_field
    keyboard:
      focusable: true
    test_context:
      tag: beneficiary_search_bar
      assert_hint: "Search beneficiaries by name or IBAN..."

  # "Recently Used" section header — shown only when recentlyUsed is non-empty AND search is blank.
  - type: text
    id: recently_used_header
    label: "Recently Used"
    content: "Recently Used"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
      padding_top: spacing.md
      padding_bottom: spacing.sm
    a11y:
      label: "Recently used beneficiaries section"
      role: heading
    test_context:
      tag: recently_used_header
      assert_text: "Recently Used"

  # Recent beneficiary card (RecentCard) — repeated per row in content.recentlyUsed (max 3).
  # CircleAvatar initials (alternating primary/secondary), name, resolved bank name,
  # last-payment "amount · relativeDate". Tapping → onBeneficiaryClick(id) → Pay tab.
  - type: card
    id: recent_beneficiary_card
    label: "Recent beneficiary"
    content: "Recent beneficiary"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: "#FFFFFF"
      border_radius: 12
      elevation: 1
      padding: 14
      border_color: "#C5C8BA"
      border_width: 1
      leading_avatar: circle_initials
    on_click:
      action: navigate
      target: send-money
    a11y:
      label: "Recently paid beneficiary. Tap to send money."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: recent_beneficiary_card
      purpose: "One recently-used beneficiary row (RecentCard) — circle initials avatar, name, bank name, last-payment amount + relative date; opens the Pay tab"
      interaction_type: navigate
      data_driven: true
      required_fields: [id, name, bankName, initials, lastPayment]

  - type: divider
    id: section_divider
    style:
      color: "#E1E4D5"
      thickness: 1
      padding_vertical: spacing.md
    a11y:
      label: ""
      role: separator
    test_context:
      tag: section_divider

  - type: stack
    id: all_beneficiaries_header_row
    label: "All Beneficiaries"
    style:
      orientation: horizontal
      spacing: 0
      padding_vertical: spacing.xs
      justify: space_between
      align: center
    on_click:
      action: dismiss
      target: ""
    a11y:
      label: "All beneficiaries section header"
      role: row
    test_context:
      tag: all_beneficiaries_header_row

  - type: text
    id: all_beneficiaries_header
    label: "All Beneficiaries"
    content: "All Beneficiaries"
    style:
      typography: "Outfit/title_medium"
      color: "#1A1C16"
      font_weight: semibold
    a11y:
      label: "All beneficiaries section"
      role: heading
    test_context:
      tag: all_beneficiaries_header
      assert_text: "All Beneficiaries"

  # Sort toggle — lives INSIDE the All Beneficiaries header (IconButton), NOT the top bar.
  # Toggles client-side AlphaAscending ⇄ AlphaDescending (toggleSort). No network.
  - type: icon
    id: sort_button
    label: "Sort"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      icon_name: sort
      size: 24
      color: "#4C662B"
      padding: spacing.sm
    on_click:
      action: sort
      target: ""
    a11y:
      label: "Sort beneficiaries by name, ascending or descending"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: sort_button
      purpose: "Client-side alphabetical sort toggle (AlphaAscending ⇄ AlphaDescending) in the All Beneficiaries header"
      interaction_type: action
      data_driven: false

  # All beneficiaries row (AllCard) — repeated per row in content.all. SquareAvatar initials,
  # name, masked accountIdentifier (IBAN), optional "Last: <date>". Tapping → onBeneficiaryClick(id).
  - type: card
    id: beneficiary_row
    label: "Beneficiary"
    content: "Beneficiary"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: "#FFFFFF"
      border_radius: 12
      elevation: 1
      padding: 14
      border_color: "#C5C8BA"
      border_width: 1
      leading_avatar: square_initials
    on_click:
      action: navigate
      target: send-money
    a11y:
      label: "Beneficiary. Tap to send money."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: beneficiary_row
      purpose: "One beneficiary in the All list (AllCard) — square initials avatar, name, masked IBAN, optional last-payment date; opens the Pay tab"
      interaction_type: navigate
      data_driven: true
      required_fields: [id, name, accountIdentifier, initials, lastPayment]

  # No-result rows in the All section (mutually exclusive): NoPayeesRow when query blank +
  # account has no beneficiaries; NoMatchRow when a search matches nothing.
  - type: text
    id: no_payees_row
    label: "No beneficiaries on this account yet. Switch accounts above."
    content: "No beneficiaries on this account yet. Switch accounts above."
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      text_align: center
      padding: 32
    a11y:
      label: "This account has no beneficiaries yet"
      role: text
    test_context:
      tag: no_payees_row
      assert_text: "No beneficiaries on this account yet"

  - type: text
    id: no_match_row
    label: "No beneficiaries match your search."
    content: "No beneficiaries match your search."
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      text_align: center
      padding: 32
    a11y:
      label: "No beneficiaries match the current search"
      role: text
    test_context:
      tag: no_match_row
      assert_text: "No beneficiaries match your search"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  # Shipped state set = ScreenState<BeneficiariesContent>: Loading / Content / Empty / Error /
  # NoNetwork / Unauthenticated. A search that matches nothing stays Content (search bar
  # operable) with no_match_row in the All section — there is NO distinct `searching` state.
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components: []
      show_loading_icon: true
  content:
    layout:
      visible_components:
        - beneficiary_account_selector
        - beneficiary_search_bar
        - recently_used_header
        - recent_beneficiary_card
        - section_divider
        - all_beneficiaries_header_row
        - all_beneficiaries_header
        - sort_button
        - beneficiary_row
        - no_payees_row
        - no_match_row
  empty:
    layout:
      visible_components:
        - beneficiary_search_bar
      show_empty_state: true
      empty_state_icon: person_off
      empty_state_title: "No beneficiaries yet"
      empty_state_message: "People you pay will appear here"
  error:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load beneficiaries"
      error_message: "Check your connection and try again"
      show_retry_button: true
  no_network:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load beneficiaries"
      error_message: "Check your connection and try again"
      show_retry_button: true
  unauthenticated:
    layout:
      visible_components: []
      show_error_state: true
      error_icon: cloud_off
      error_title: "Unable to load beneficiaries"
      error_message: "Check your connection and try again"
      show_retry_button: true

state_model:
  view_model: BeneficiariesViewModel
  screen_state: "ScreenState<BeneficiariesContent>"
  content_type: BeneficiariesContent
  content_fields:
    - name: accounts
      type: List<Account>
      default: "emptyList()"
    - name: selectedAccountId
      type: String
      default: ""
    - name: recentlyUsed
      type: List<BeneficiaryRow>
      default: "emptyList()"
    - name: all
      type: List<BeneficiaryRow>
      default: "emptyList()"
    - name: query
      type: String
      default: ""
    - name: sortOrder
      type: SortOrder
      default: AlphaAscending
    - name: totalCount
      type: Int
      default: "0"
  row_type:
    name: BeneficiaryRow
    fields:
      - name: id
        type: String
      - name: name
        type: String
      - name: bankName
        type: String
      - name: accountIdentifier
        type: String
      - name: lastPayment
        type: "LastPayment?"
      - name: initials
        type: String
        derived: "first two name initials, else '?'"
    methods:
      - "matches(query): name | accountIdentifier | bankName contains, case-insensitive"
  errors:
    - field: global
      code: LOAD_FAILED
      message: "Unable to load beneficiaries. Please try again."
  events:
    - onSearchQueryChanged
    - onSortChanged
    - toggleSort
    - onAccountSelected
    - onRetry
    - onRefresh
  actions:
    - search
    - sort
    - onAccountSelected
    - navigate
  states_handled: [loading, content, empty, error, no_network, unauthenticated]
  di:
    - PaymentsRepository
    - BanksRepository
    - TransactionsRepository
    - AccountsRepository
    - UserPreferencesRepository

api:
  # Counterparty list — PaymentsRepository.listBeneficiaries(bankId, accountId), filtered to
  # is_beneficiary. viewId is owner.
  - id: obp_get_counterparties
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/{viewId}/counterparties"
    tag: Counterparties
    trigger: "on load / onAccountSelected — PaymentsRepository.listBeneficiaries"
    response:
      fields:
        - name: counterparties
          type: List<Counterparty>
        - name: counterparty_id
          type: String
        - name: name
          type: String
        - name: other_bank_routing_scheme
          type: String
        - name: other_bank_routing_address
          type: String
        - name: other_account_routing_address
          type: String
        - name: is_beneficiary
          type: Boolean
    errors:
      - code: 401
        message: "OBP-20001: User not logged in"
      - code: 404
        message: "OBP-30018: Bank Account not found"
  # Accounts list — AccountsRepository.myAccounts(); drives the AccountSelector + per-account scoping.
  - id: obp_get_my_accounts
    endpoint: "GET /obp/v3.0.0/my/accounts"
    tag: Account
    trigger: "on load — AccountsRepository.myAccounts"
    response:
      fields:
        - name: accounts
          type: List<Account>
        - name: id
          type: String
        - name: bank_id
          type: String
        - name: label
          type: String
  # Transactions — TransactionsRepository.listTransactions(bankId, accountId); last-payment
  # amount/date/recency derived by joining transaction description to counterparty name.
  - id: obp_get_account_transactions
    endpoint: "GET /obp/v3.0.0/my/banks/{bankId}/accounts/{accountId}/transactions"
    tag: Transaction
    trigger: "on loadForAccount — TransactionsRepository.listTransactions (last-payment join)"
    response:
      fields:
        - name: transactions
          type: List<Transaction>
  # DEFERRED — Add Beneficiary never shipped. There is no create path in the UI, so
  # POST counterparties is unused by this screen (verified shipped 2026-06-11).
  - id: obp_create_counterparty
    deferred: true
    deferred_reason: "Add Beneficiary FAB + create sheet never shipped — no UI write path. Endpoint exists but is not called by this screen."
    endpoint: "POST /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/{viewId}/counterparties"
    tag: Counterparties

dependencies:
  tier: feature
  features:
    - send-money
