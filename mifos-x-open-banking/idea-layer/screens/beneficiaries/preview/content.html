<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Beneficiaries — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
}
.top-bar{
  display:flex;align-items:center;padding:0 4px;height:56px;
  background:var(--surface);border-bottom:1px solid var(--surface-variant);
}
.top-bar-btn{
  width:48px;height:48px;border:none;background:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:var(--text-primary);flex-shrink:0;
}
.top-bar-btn:hover{background:var(--surface-variant);}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);padding-left:4px;}
/* Scroll area — leaves 80px for nav */
.content-scroll{overflow-y:auto;padding:16px 16px 96px;}
/* Search bar */
.search-bar{
  display:flex;align-items:center;gap:8px;
  border:1.5px solid var(--surface-variant);border-radius:28px;
  padding:12px 16px;background:var(--background);margin-bottom:8px;
}
.search-bar input{
  flex:1;border:none;background:none;font-family:var(--font);
  font-size:14px;color:var(--text-primary);outline:none;
}
.search-bar input::placeholder{color:var(--outline-variant);}
.search-bar:focus-within{border-color:var(--primary);}
/* Section header */
.section-header{
  font-size:16px;font-weight:600;color:var(--text-primary);
  padding:16px 0 8px;
}
/* Beneficiary item card */
.bene-card{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border-radius:12px;
  padding:14px 16px;margin-bottom:8px;
  border:1px solid var(--background);
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  cursor:pointer;text-decoration:none;
}
.bene-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);}
.avatar{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--on-primary);
  flex-shrink:0;
}
.av-green{background:var(--primary);}
.av-teal{background:var(--tertiary);}
.bene-info{flex:1;min-width:0;}
.bene-name{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:2px;}
.bene-meta{font-size:12px;color:var(--outline);}
.bene-last-payment{font-size:12px;color:var(--tertiary);font-weight:500;}
/* Section divider */
.section-divider{height:1px;background:var(--surface-variant);margin:8px 0 8px;}
/* All beneficiaries header row */
.section-header-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 0;margin-bottom:0;
}
.section-header-row .section-header{padding:0;}
.sort-btn{
  width:36px;height:36px;border:none;background:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:var(--primary);
}
.sort-btn:hover{background:var(--primary-container);}
/* IBAN text */
.bene-iban{font-size:12px;color:var(--outline);font-family:monospace;}
.bene-last-txt{font-size:12px;color:var(--outline);}
/* Bank badge */
.bank-badge{
  width:32px;height:32px;border-radius:4px;
  background:var(--surface-variant);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--text-secondary);
  flex-shrink:0;
}
/* FAB */
.fab{
  position:absolute;bottom:96px;right:16px;
  display:flex;align-items:center;gap:8px;
  background:var(--primary);color:var(--on-primary);
  border:none;border-radius:16px;padding:12px 20px;
  font-family:var(--font);font-size:14px;font-weight:600;
  cursor:pointer;box-shadow:0 4px 12px rgba(76,102,43,.4);
  z-index:10;
}
.fab:hover{opacity:.88;}
/* Bottom nav */
nav[data-shell="bottom-nav"]{
  position:absolute;bottom:0;left:0;width:390px;height:80px;
  background:var(--surface);
  border-top:1px solid var(--surface-variant);
  display:flex;align-items:center;justify-content:space-around;
  z-index:20;
}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;width:80px;height:80px;cursor:pointer;
  border:none;background:none;font-family:var(--font);
  color:var(--outline);font-size:11px;font-weight:500;
}
.nav-tab.active{color:var(--primary);}
.nav-pill{
  display:flex;align-items:center;justify-content:center;
  width:64px;height:28px;border-radius:14px;
}
.nav-tab.active .nav-pill{background:var(--nav-active);}
</style>
</head>
<body>
<main data-screen="beneficiaries" data-state="content" role="main">

  <div class="top-bar">
    <button class="top-bar-btn" aria-label="Back" data-action="navigate_back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="top-bar-title">Beneficiaries</span>
    <button class="top-bar-btn" aria-label="Sort beneficiaries" data-action="sort_beneficiaries">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
    </button>
  </div>

  <div class="content-scroll">

    <!-- Search -->
    <div class="search-bar"
         data-component-type="input" data-component-id="beneficiary_search_bar"
         aria-label="Search beneficiaries by name or IBAN">
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline);flex-shrink:0" aria-hidden="true">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5a6.5 6.5 0 1 0-6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="search" placeholder="Search beneficiaries by name or IBAN..." aria-label="Search beneficiaries">
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline-variant);flex-shrink:0" aria-hidden="true">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </div>

    <!-- Recently Used -->
    <h2 class="section-header" data-component-type="text" data-component-id="recently_used_header">Recently Used</h2>

    <div class="bene-card"
         data-component-type="box" data-component-id="recent_beneficiary_john" data-component-variant="list-item"
         data-nav-to="send-money"
         role="button" tabindex="0"
         aria-label="John Smith at Barclays UK. Last payment £500, 2 days ago. Tap to send money.">
      <div class="avatar av-green" data-component-type="box" data-component-id="recent_beneficiary_john_avatar" aria-hidden="true">JS</div>
      <div class="bene-info">
        <div class="bene-name">John Smith</div>
        <div class="bene-meta" data-component-type="text" data-component-id="recent_john_bank">Barclays UK</div>
        <div class="bene-last-payment" data-component-type="text" data-component-id="recent_john_last_payment">£500 · 2 days ago</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline-variant)" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>

    <div class="bene-card"
         data-component-type="box" data-component-id="recent_beneficiary_sarah" data-component-variant="list-item"
         data-nav-to="send-money"
         role="button" tabindex="0"
         aria-label="Sarah Williams at HSBC UK. Last payment £1,200, 5 days ago. Tap to send money.">
      <div class="avatar av-teal" data-component-type="box" data-component-id="recent_beneficiary_sarah_avatar" aria-hidden="true">SW</div>
      <div class="bene-info">
        <div class="bene-name">Sarah Williams</div>
        <div class="bene-meta" data-component-type="text" data-component-id="recent_sarah_bank">HSBC UK</div>
        <div class="bene-last-payment" data-component-type="text" data-component-id="recent_sarah_last_payment">£1,200 · 5 days ago</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline-variant)" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>

    <div class="bene-card"
         data-component-type="box" data-component-id="recent_beneficiary_michael" data-component-variant="list-item"
         data-nav-to="send-money"
         role="button" tabindex="0"
         aria-label="Michael Chen at Lloyds Bank. Last payment £250, 1 week ago. Tap to send money.">
      <div class="avatar av-green" data-component-type="box" data-component-id="recent_beneficiary_michael_avatar" aria-hidden="true">MC</div>
      <div class="bene-info">
        <div class="bene-name">Michael Chen</div>
        <div class="bene-meta" data-component-type="text" data-component-id="recent_michael_bank">Lloyds Bank</div>
        <div class="bene-last-payment" style="font-size:12px;color:var(--tertiary);font-weight:500;">£250 · 1 week ago</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline-variant)" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>

    <!-- Divider -->
    <div class="section-divider" data-component-type="divider" data-component-id="section_divider" role="separator"></div>

    <!-- All Beneficiaries header -->
    <div class="section-header-row"
         data-component-type="stack" data-component-id="all_beneficiaries_header_row"
         role="row" aria-label="All beneficiaries section header">
      <h2 class="section-header" data-component-type="text" data-component-id="all_beneficiaries_header">All Beneficiaries</h2>
      <button class="sort-btn"
              data-component-type="icon" data-component-id="sort_button"
              data-action="sort"
              aria-label="Sort beneficiaries list">
        <svg width="22" height="22" viewBox="0 0 24 24" style="fill:var(--primary)" aria-hidden="true"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
      </button>
    </div>

    <!-- Anderson -->
    <div class="bene-card"
         data-component-type="box" data-component-id="beneficiary_item_anderson" data-component-variant="list-item"
         data-nav-to="send-money"
         role="button" tabindex="0"
         aria-label="James Anderson at NatWest. IBAN ending 8819. Last payment 12 May 2026.">
      <div class="bank-badge" data-component-type="image" data-component-id="natwest_logo" aria-label="NatWest bank logo">NW</div>
      <div class="bene-info">
        <div class="bene-name">James Anderson</div>
        <div class="bene-iban" data-component-type="text" data-component-id="anderson_iban">GB29 NWBK ··· 8819</div>
        <div class="bene-last-txt" data-component-type="text" data-component-id="anderson_last_payment">Last: 12 May 2026</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline-variant)" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>

    <!-- Patel -->
    <div class="bene-card"
         data-component-type="box" data-component-id="beneficiary_item_patel" data-component-variant="list-item"
         data-nav-to="send-money"
         role="button" tabindex="0"
         aria-label="Priya Patel at Santander UK. IBAN ending 4421. Last payment 3 May 2026.">
      <div class="bank-badge" data-component-type="image" data-component-id="santander_logo" aria-label="Santander bank logo">SAN</div>
      <div class="bene-info">
        <div class="bene-name">Priya Patel</div>
        <div class="bene-iban" data-component-type="text" data-component-id="patel_iban">GB72 ABBY ··· 4421</div>
        <div class="bene-last-txt">Last: 3 May 2026</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--outline-variant)" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>

  </div>

  <!-- FAB -->
  <button class="fab"
          data-component-type="button" data-component-id="add_beneficiary_fab" data-component-variant="fab"
          data-action="open_add_beneficiary_sheet"
          aria-label="Add a new beneficiary">
    <svg width="20" height="20" viewBox="0 0 24 24" style="fill:var(--on-primary)" aria-hidden="true">
      <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    </svg>
    Add Beneficiary
  </button>

  <!-- Consumer bottom nav — Payments active -->
  <nav data-shell="bottom-nav" aria-label="Main navigation">
    <button class="nav-tab" data-nav-to="home" aria-label="Home">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      Home
    </button>
    <button class="nav-tab" data-nav-to="accounts" aria-label="Accounts">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zm-9 9h22v-3H1v3zm15-9v7h3v-7h-3zM12 1L1 6v2h22V6L12 1z"/></svg>
      </div>
      Accounts
    </button>
    <button class="nav-tab active" data-nav-to="beneficiaries" aria-label="Payments" aria-current="page">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
      </div>
      Payments
    </button>
    <button class="nav-tab" data-nav-to="cards" aria-label="Cards">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
      </div>
      Cards
    </button>
    <button class="nav-tab" data-nav-to="profile" aria-label="Profile">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      Profile
    </button>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
