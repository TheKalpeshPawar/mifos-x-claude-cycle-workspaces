<!doctype html>
<html lang="en" data-screen="beneficiaries" data-state="searching">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beneficiaries — Searching</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 32px; }
    .top-bar { display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--outline-variant); padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
    .back-btn { background: none; border: none; color: var(--on-surface); cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .search-bar { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--background); border: 1.5px solid var(--primary); border-radius: 12px; padding: 10px 14px; }
    .search-bar .material-icons { color: var(--primary); font-size: 20px; }
    .search-input { background: none; border: none; outline: none; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--on-surface); flex: 1; }
    .spinner-inline { width: 18px; height: 18px; border: 2px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-hint { font-size: 12px; color: var(--outline); padding: 8px 20px 16px; }
    .section-label { font-size: 13px; font-weight: 600; color: var(--on-surface-variant); padding: 16px 20px 8px; }
    /* Skeleton rows */
    .skeleton-row { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .skel-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-variant); flex-shrink: 0; animation: shimmer 1.4s ease-in-out infinite; }
    .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .skel-line { border-radius: 6px; background: var(--surface-variant); animation: shimmer 1.4s ease-in-out infinite; }
    .skel-line.long { height: 13px; width: 70%; }
    .skel-line.short { height: 11px; width: 45%; }
    @keyframes shimmer { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <main>

  <div class="top-bar" role="banner" data-component-type="top_app_bar" data-component-id="beneficiaries_top_bar">
    <button class="back-btn" data-action="navigate_back" aria-label="Go back" tabindex="0">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
    </button>
    <div class="search-bar" role="search" aria-label="Searching beneficiaries">
      <span class="material-icons" aria-hidden="true">search</span>
      <input class="search-input" data-component-type="input" data-component-id="beneficiary_search_input"
             type="text" value="John" aria-label="Search beneficiaries" autocomplete="off" tabindex="0">
      <div class="spinner-inline" aria-label="Searching..." aria-live="polite"></div>
    </div>
  </div>

  <p class="search-hint" aria-live="polite">Searching for "John"…</p>

  <p class="section-label">Results</p>

  <div role="list" aria-label="Search results loading" data-component-type="stack" data-component-id="beneficiary_search_results">
    <div class="skeleton-row" role="listitem" aria-hidden="true">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line long"></div>
        <div class="skel-line short"></div>
      </div>
    </div>
    <div class="skeleton-row" role="listitem" aria-hidden="true">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line long" style="width:55%;"></div>
        <div class="skel-line short" style="width:35%;"></div>
      </div>
    </div>
    <div class="skeleton-row" role="listitem" aria-hidden="true">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line long" style="width:65%;"></div>
        <div class="skel-line short" style="width:40%;"></div>
      </div>
    </div>
    <div class="skeleton-row" role="listitem" aria-hidden="true">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line long" style="width:50%;"></div>
        <div class="skel-line short" style="width:30%;"></div>
      </div>
    </div>
  </div>

  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
