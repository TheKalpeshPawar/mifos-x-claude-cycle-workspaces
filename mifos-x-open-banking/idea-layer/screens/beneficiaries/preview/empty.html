<!doctype html>
<!-- render-hash: f2b6d19e4a73 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beneficiaries — empty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --md-primary: #266489;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #C9E6FF;
      --md-on-primary-container: #004B6F;
      --md-secondary-container: #D3E5F5;
      --md-on-secondary-container: #384956;
      --md-tertiary-container: #EADDFF;
      --md-on-tertiary-container: #4C4162;
      --md-background: #F7F9FF;
      --md-on-background: #181C20;
      --md-surface: #F7F9FF;
      --md-on-surface: #181C20;
      --md-on-surface-variant: #41474D;
      --md-outline: #72787E;
      --md-outline-variant: #C1C7CE;
      --md-surface-container: #EBEEF3;
      --fs-title-large: 22px;   --lh-title-large: 28px;
      --fs-title-medium: 16px;  --lh-title-medium: 24px;
      --fs-body-medium: 14px;   --lh-body-medium: 20px;
      --fs-label-medium: 12px;  --lh-label-medium: 16px;
      --radius-full: 9999px;
      --radius-extra-large: 28px;
      --motion-short: 150ms;
      --motion-easing: cubic-bezier(0.2, 0.0, 0, 1.0);
    }
    [data-theme="dark"] {
      --md-primary: #95CDF7;
      --md-on-primary: #00344E;
      --md-primary-container: #004B6F;
      --md-on-primary-container: #C9E6FF;
      --md-secondary-container: #384956;
      --md-on-secondary-container: #D3E5F5;
      --md-tertiary-container: #4C4162;
      --md-on-tertiary-container: #EADDFF;
      --md-background: #101417;
      --md-on-background: #E0E3E8;
      --md-surface: #101417;
      --md-on-surface: #E0E3E8;
      --md-on-surface-variant: #C1C7CE;
      --md-outline: #8B9198;
      --md-outline-variant: #41474D;
      --md-surface-container: #1C2024;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: var(--md-background);
      color: var(--md-on-surface);
      display: flex;
      flex-direction: column;
      max-width: 412px;
      margin: 0 auto;
      height: 100%;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      user-select: none;
    }

    /* ── Top App Bar ─────────────────────────────────── */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 4px 0 4px;
      background: var(--md-surface);
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 4px;
    }
    .top-app-bar__icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      transition: background var(--motion-short) var(--motion-easing);
      flex-shrink: 0;
    }
    .top-app-bar__icon-btn:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
    .top-app-bar__title {
      flex: 1;
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: 400;
      color: var(--md-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Empty state ─────────────────────────────────── */
    .screen-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      max-width: 280px;
    }
    .empty-state__icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-extra-large);
      background: var(--md-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state__icon {
      font-size: 36px;
      color: var(--md-on-primary-container);
    }
    .empty-state__title {
      font-size: var(--fs-title-medium);
      line-height: var(--lh-title-medium);
      font-weight: 500;
      color: var(--md-on-surface);
    }
    .empty-state__body {
      font-size: var(--fs-body-medium);
      line-height: var(--lh-body-medium);
      color: var(--md-on-surface-variant);
    }

    /* ── Bottom Navigation (4 tabs, no active — sub-screen) ── */
    .bottom-nav {
      display: flex;
      background: var(--md-surface-container);
      height: 80px;
      align-items: flex-start;
      padding-top: 12px;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 10;
    }
    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      text-decoration: none;
    }
    .bottom-nav__indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--radius-full);
    }
    .bottom-nav__icon {
      font-size: 24px;
      color: var(--md-on-surface-variant);
    }
    .bottom-nav__label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: 500;
      color: var(--md-on-surface-variant);
    }
  </style>
</head>
<body>

  <!-- Top App Bar: back arrow — pushed sub-screen of account-detail -->
  <header class="top-app-bar" role="banner">
    <button class="top-app-bar__icon-btn"
            aria-label="Back to Account Detail"
            data-action="navigate_back"
            data-nav-to="account-detail"
            data-nav-type="pop">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="top-app-bar__title">Beneficiaries</h1>
  </header>

  <!-- Empty state: no beneficiaries registered for this account -->
  <main class="screen-content" data-screen="beneficiaries" data-state="empty">
    <div class="empty-state" role="status" aria-label="No beneficiaries">
      <div class="empty-state__icon-wrap" aria-hidden="true">
        <span class="material-symbols-outlined empty-state__icon">people_outline</span>
      </div>
      <p class="empty-state__title">No beneficiaries</p>
      <p class="empty-state__body">No saved payees are registered for this account. Beneficiaries set up through your bank will appear here.</p>
    </div>
  </main>

  <!-- Bottom Navigation: Home · Accounts · Transactions · More — NO active tab (sub-screen) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="bottom-nav__item"
       href="#"
       data-nav-to="home"
       data-nav-type="tab"
       aria-label="Home">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">home</span>
      </div>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a class="bottom-nav__item"
       href="#"
       data-nav-to="accounts"
       data-nav-type="tab"
       aria-label="Accounts">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">account_balance</span>
      </div>
      <span class="bottom-nav__label">Accounts</span>
    </a>
    <a class="bottom-nav__item"
       href="#"
       data-nav-to="transactions"
       data-nav-type="tab"
       aria-label="Transactions">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">receipt_long</span>
      </div>
      <span class="bottom-nav__label">Transactions</span>
    </a>
    <a class="bottom-nav__item"
       href="#"
       data-nav-to="settings"
       data-nav-type="tab"
       aria-label="More">
      <div class="bottom-nav__indicator">
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">more_horiz</span>
      </div>
      <span class="bottom-nav__label">More</span>
    </a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
