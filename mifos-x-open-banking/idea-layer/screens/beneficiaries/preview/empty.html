<!doctype html>

<html lang="en" data-screen="beneficiaries" data-state="empty" data-feature="beneficiaries" data-flavor="consumer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beneficiaries — Empty</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root {
  --primary: #4C662B; --on-primary: #FFFFFF;
  --primary-container: #CDEDA3; --on-primary-container: #102000;
  --secondary: #386663; --on-secondary: #FFFFFF;
  --error: #BA1A1A; --on-error: #FFFFFF;
  --background: #F9FAEF; --on-background: #1A1C16;
  --surface: #FFFFFF; --on-surface: #1A1C16;
  --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
  --outline: #75796C; --outline-variant: #C5C8BA;
}
[data-theme="dark"] {
  --primary: #B2D188; --on-primary: #1F3701;
  --primary-container: #354E16; --on-primary-container: #CDEDA3;
  --secondary: #A0CFCB; --on-secondary: #003735;
  --error: #FFB4AB; --on-error: #690005;
  --background: #12140E; --on-background: #E3E3D8;
  --surface: #1A1C16; --on-surface: #E3E3D8;
  --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
  --outline: #8F9285; --outline-variant: #44483D;
}
@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--on-secondary:#003735;--error:#FFB4AB;--on-error:#690005;--background:#12140E;--on-background:#E3E3D8;--surface:#1A1C16;--on-surface:#E3E3D8;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D}}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); min-height: 100vh; display: flex; flex-direction: column; }
.top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; }
.top-bar .material-icons { font-size: 24px; color: var(--on-surface-variant); cursor: pointer; }
.top-bar h1 { font-size: 20px; font-weight: 600; flex: 1; color: var(--on-background); }
.search-bar { display: flex; align-items: center; gap: 10px; background: var(--background); border: 1px solid var(--outline-variant); border-radius: 28px; padding: 12px 16px; margin: 4px 16px 16px; }
.search-bar .material-icons { font-size: 20px; color: var(--on-surface-variant); }
.search-bar input { flex: 1; border: none; outline: none; background: transparent; color: var(--on-background); font-family: 'Outfit', sans-serif; font-size: 14px; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 32px 120px; text-align: center; gap: 12px; }
.empty-illu { width: 96px; height: 96px; border-radius: 48px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.empty-illu .material-icons { font-size: 44px; color: var(--primary); }
.empty-title { font-size: 18px; font-weight: 600; color: var(--on-background); }
.empty-msg { font-size: 14px; color: var(--on-surface-variant); max-width: 280px; line-height: 1.5; }
.fab { position: fixed; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 8px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 16px; padding: 14px 22px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(76,102,43,0.32); }
.fab .material-icons { font-size: 20px; }
</style>
</head>
<body>
<div class="top-bar" data-component-type="top-app-bar" data-component-id="top_app_bar">
  <span class="material-icons" data-action="navigate_back" tabindex="0" role="button" aria-label="Go back">arrow_back</span>
  <h1>Beneficiaries</h1>
  <span class="material-icons" aria-hidden="true">filter_list</span>
</div>

<label class="search-bar" data-component-type="input" data-component-id="beneficiary_search_bar" role="searchbox" aria-label="Search beneficiaries">
  <span class="material-icons" aria-hidden="true">search</span>
  <input type="text" placeholder="Search beneficiaries by name or IBAN..." aria-label="Search beneficiaries">
</label>

<main data-component-type="box" data-component-id="empty_state_card" role="region" aria-label="No beneficiaries yet">
  <div class="empty-illu" aria-hidden="true"><span class="material-icons">person_off</span></div>
  <h2 class="empty-title">No beneficiaries yet</h2>
  <p class="empty-msg">Add a beneficiary to start sending money quickly.</p>
</main>

<button class="fab" data-component-type="button" data-component-id="add_beneficiary_fab" data-action="open_add_beneficiary_sheet" tabindex="0" aria-label="Add a new beneficiary">
  <span class="material-icons" aria-hidden="true">person_add</span>
  <span>Add Beneficiary</span>
</button>

<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
