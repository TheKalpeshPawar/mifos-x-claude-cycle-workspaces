<!doctype html>
<!-- render-hash: beneficiaries-loading-obie -->
<html data-screen="beneficiaries" data-state="loading" data-feature="beneficiaries" data-flavor="consumer" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beneficiaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
  --font-display:'Outfit',system-ui,sans-serif;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-2xl:48px;
}
[data-theme="light"] {
  --primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;
  --secondary:#386663;--on-secondary:#FFFFFF;--secondary-container:#BCEBE7;--on-secondary-container:#00201E;
  --tertiary:#386663;--on-tertiary:#FFFFFF;--tertiary-container:#BCEBE7;--on-tertiary-container:#00201E;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--on-surface:#1A1C16;
  --surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--surface-container-high:#EAECE1;
  --outline:#75796C;--outline-variant:#C5C8BA;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#DCE7C8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
    --secondary:#A0CFCB;--on-secondary:#003735;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
    --tertiary:#A0CFCB;--on-tertiary:#003735;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
    --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
    --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
    --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
  }
}
[data-theme="dark"] {
  --primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;
  --secondary:#A0CFCB;--on-secondary:#003735;--secondary-container:#1F4E4B;--on-secondary-container:#BCEBE7;
  --tertiary:#A0CFCB;--on-tertiary:#003735;--tertiary-container:#1F4E4B;--on-tertiary-container:#BCEBE7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --background:#12140E;--on-background:#E3E3D8;--surface:#12140E;--on-surface:#E3E3D8;
  --surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--surface-container-high:#282A24;
  --outline:#8F9285;--outline-variant:#44483D;--scrim:#000000;--pending:#E8A317;--nav-active-indicator:#354E16;
}
* { box-sizing:border-box; margin:0; padding:0; }
.material-symbols-outlined { font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; font-feature-settings:'liga'; }
html, body { height:100%; }
body { display:flex; flex-direction:column; min-height:100vh; background:var(--background); color:var(--on-background); font-family:var(--font-display); }
.top-bar { display:flex; align-items:center; gap:var(--sp-md); padding:var(--sp-md); background:var(--surface); color:var(--on-surface); border-bottom:1px solid var(--outline-variant); }
.top-bar .title { font-size:22px; font-weight:600; }
.top-bar .nav-icon { font-size:var(--icon-md); color:var(--on-surface); background:none; border:none; cursor:pointer; padding:var(--sp-xs); }
.scroll { flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:var(--sp-md); gap:var(--sp-md); }
.search-bar { display:flex; align-items:center; gap:var(--sp-sm); background:var(--surface-container); border:1px solid var(--outline-variant); border-radius:var(--radius-xl); padding:0 var(--sp-md); height:48px; }
.search-bar .lead { color:var(--on-surface-variant); font-size:var(--icon-md); }
.search-bar input { flex:1; border:none; outline:none; background:transparent; font-family:var(--font-display); font-size:15px; color:var(--on-surface); }
.search-bar input::placeholder { color:var(--on-surface-variant); }
.skel { background:var(--surface-variant); border-radius:var(--radius-sm); position:relative; overflow:hidden; }
.skel::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, var(--surface-container-high), transparent); animation:shimmer 1.4s infinite; }
@keyframes shimmer { 100% { transform:translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .skel::after { animation:none; } }
.skel-card { display:flex; align-items:center; gap:var(--sp-md); background:var(--surface); border:1px solid var(--outline-variant); border-radius:var(--radius-md); padding:14px; }
.skel-avatar { width:44px; height:44px; border-radius:var(--radius-pill); flex-shrink:0; }
.skel-avatar.square { border-radius:var(--radius-md); }
.skel-lines { flex:1; display:flex; flex-direction:column; gap:var(--sp-sm); }
.skel-line { height:12px; }
.skel-line.w70 { width:70%; }
.skel-line.w45 { width:45%; }
.skel-line.w35 { width:35%; }
.skel-header { height:16px; width:40%; margin-top:var(--sp-sm); }
.skel-selector { height:64px; border-radius:var(--radius-md); }
.divider { height:1px; background:var(--surface-variant); border:none; margin:var(--sp-xs) 0; }
.skel-rail { display:flex; flex-direction:column; gap:var(--sp-sm); }
.bottom-nav { position:sticky; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--outline-variant); padding:var(--sp-xs) 0 var(--sp-sm); }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; cursor:pointer; color:var(--on-surface-variant); font-family:var(--font-display); font-size:11px; padding:var(--sp-xs) 0; }
.nav-item .ind { display:flex; align-items:center; justify-content:center; width:56px; height:30px; border-radius:var(--radius-pill); }
.nav-item .material-symbols-outlined { font-size:var(--icon-md); }
.nav-item.active { color:var(--on-surface); font-weight:600; }
.nav-item.active .ind { background:var(--nav-active-indicator); }
.nav-item.active .material-symbols-outlined { color:var(--on-primary-container); }
</style>
</head>
<body data-component-type="screen" data-component-id="beneficiaries_screen">
  <header class="top-bar" data-component-type="top-app-bar" data-component-id="top_bar">
    <button class="nav-icon material-symbols-outlined" data-component-type="icon-button" data-component-id="top_back" data-nav-to="send-money" aria-label="Back">arrow_back</button>
    <span class="title" data-component-type="text" data-component-id="top_title">Beneficiaries</span>
  </header>

  <main class="scroll" data-component-type="scroll-container" data-component-id="loading_scroll" aria-busy="true">
    <div class="skel skel-selector" data-component-type="skeleton" data-component-id="skel_account_selector"></div>

    <div class="search-bar" data-component-type="input" data-component-id="beneficiary_search_bar" data-action="search">
      <span class="lead material-symbols-outlined" data-component-type="icon" data-component-id="search_lead_icon">search</span>
      <input type="search" placeholder="Search beneficiaries by name or IBAN..." aria-label="Search beneficiaries by name or IBAN" disabled data-component-type="text-input" data-component-id="search_input">
    </div>

    <div class="skel skel-header" data-component-type="skeleton" data-component-id="skel_recently_used_header"></div>

    <div class="skel-rail" data-component-type="container" data-component-id="skel_recent_rail">
      <div class="skel-card" data-component-type="skeleton" data-component-id="skel_recent_1">
        <div class="skel skel-avatar"></div>
        <div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w45"></div></div>
      </div>
      <div class="skel-card" data-component-type="skeleton" data-component-id="skel_recent_2">
        <div class="skel skel-avatar"></div>
        <div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w45"></div></div>
      </div>
    </div>

    <hr class="divider" data-component-type="divider" data-component-id="section_divider">

    <div class="skel skel-header" data-component-type="skeleton" data-component-id="skel_all_header"></div>

    <div class="skel-rail" data-component-type="container" data-component-id="skel_all_rail">
      <div class="skel-card" data-component-type="skeleton" data-component-id="skel_row_1">
        <div class="skel skel-avatar square"></div>
        <div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w35"></div></div>
      </div>
      <div class="skel-card" data-component-type="skeleton" data-component-id="skel_row_2">
        <div class="skel skel-avatar square"></div>
        <div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w35"></div></div>
      </div>
      <div class="skel-card" data-component-type="skeleton" data-component-id="skel_row_3">
        <div class="skel skel-avatar square"></div>
        <div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w35"></div></div>
      </div>
      <div class="skel-card" data-component-type="skeleton" data-component-id="skel_row_4">
        <div class="skel skel-avatar square"></div>
        <div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w35"></div></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" data-component-type="bottom-nav" data-component-id="bottom_nav">
    <button class="nav-item" data-component-type="nav-item" data-component-id="nav_home" data-nav-to="home" aria-label="Home">
      <span class="ind"><span class="material-symbols-outlined">home</span></span>Home
    </button>
    <button class="nav-item" data-component-type="nav-item" data-component-id="nav_accounts" data-nav-to="accounts" aria-label="Accounts">
      <span class="ind"><span class="material-symbols-outlined">account_balance</span></span>Accounts
    </button>
    <button class="nav-item active" data-component-type="nav-item" data-component-id="nav_pay" data-nav-to="send-money" aria-label="Pay">
      <span class="ind"><span class="material-symbols-outlined">send</span></span>Pay
    </button>
    <button class="nav-item" data-component-type="nav-item" data-component-id="nav_cards" data-nav-to="cards" aria-label="Cards">
      <span class="ind"><span class="material-symbols-outlined">credit_card</span></span>Cards
    </button>
    <button class="nav-item" data-component-type="nav-item" data-component-id="nav_more" data-nav-to="settings" aria-label="More">
      <span class="ind"><span class="material-symbols-outlined">more_horiz</span></span>More
    </button>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
