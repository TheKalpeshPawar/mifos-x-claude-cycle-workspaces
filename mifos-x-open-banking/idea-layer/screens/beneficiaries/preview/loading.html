<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1">
<title>Beneficiaries — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
}
.top-bar{
  display:flex;align-items:center;padding:0 4px;height:56px;
  background:var(--surface);border-bottom:1px solid var(--surface-variant);
}
.top-bar-btn{
  width:48px;height:48px;border:none;background:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:var(--text-primary);flex-shrink:0;
}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--text-primary);padding-left:4px;}
@keyframes shimmer{
  0%{background-position:-390px 0}
  100%{background-position:390px 0}
}
.skeleton{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}
.content-pad{padding:16px 16px 96px;}
.skel-search{height:48px;width:100%;border-radius:28px;margin-bottom:16px;}
.skel-section{height:20px;width:120px;border-radius:4px;margin-bottom:12px;}
.skel-bene-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.skel-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;}
.skel-text-group{flex:1;display:flex;flex-direction:column;gap:6px;}
.skel-line-full{height:14px;width:100%;border-radius:4px;}
.skel-line-half{height:12px;width:55%;border-radius:4px;}
.skel-line-short{height:12px;width:40%;border-radius:4px;}
/* Bottom nav */
nav[data-shell="bottom-nav"]{
  position:absolute;bottom:0;left:0;width:390px;height:80px;
  background:var(--surface);border-top:1px solid var(--surface-variant);
  display:flex;align-items:center;justify-content:space-around;z-index:20;
}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;width:80px;height:80px;cursor:pointer;
  border:none;background:none;font-family:var(--font);
  color:var(--outline);font-size:11px;font-weight:500;
}
.nav-tab.active{color:var(--primary);}
.nav-pill{
  display:flex;align-items:center;justify-content:center;
  width:64px;height:28px;border-radius:14px;
}
.nav-tab.active .nav-pill{background:var(--nav-active);}
</style>
</head>
<body>
<main data-screen="beneficiaries" data-state="loading" role="main" aria-busy="true" aria-label="Loading beneficiaries">

  <div class="top-bar">
    <button class="top-bar-btn" aria-label="Back" data-action="navigate_back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="top-bar-title">Beneficiaries</span>
  </div>

  <div class="content-pad">
    <div class="skeleton skel-search" aria-hidden="true"></div>

    <div class="skeleton skel-section" aria-hidden="true"></div>

    <!-- 3 recent skeleton items -->
    <div class="skel-bene-row" aria-hidden="true">
      <div class="skeleton skel-avatar"></div>
      <div class="skel-text-group">
        <div class="skeleton skel-line-full"></div>
        <div class="skeleton skel-line-half"></div>
        <div class="skeleton skel-line-short"></div>
      </div>
    </div>
    <div class="skel-bene-row" aria-hidden="true">
      <div class="skeleton skel-avatar"></div>
      <div class="skel-text-group">
        <div class="skeleton skel-line-full"></div>
        <div class="skeleton skel-line-half"></div>
        <div class="skeleton skel-line-short"></div>
      </div>
    </div>
    <div class="skel-bene-row" aria-hidden="true">
      <div class="skeleton skel-avatar"></div>
      <div class="skel-text-group">
        <div class="skeleton skel-line-full"></div>
        <div class="skeleton skel-line-half"></div>
      </div>
    </div>

    <div class="skeleton skel-section" aria-hidden="true" style="margin-top:16px"></div>

    <!-- 3 all-bene skeleton items -->
    <div class="skel-bene-row" aria-hidden="true">
      <div class="skeleton skel-avatar" style="border-radius:4px"></div>
      <div class="skel-text-group">
        <div class="skeleton skel-line-full"></div>
        <div class="skeleton skel-line-half"></div>
        <div class="skeleton skel-line-short"></div>
      </div>
    </div>
    <div class="skel-bene-row" aria-hidden="true">
      <div class="skeleton skel-avatar" style="border-radius:4px"></div>
      <div class="skel-text-group">
        <div class="skeleton skel-line-full"></div>
        <div class="skeleton skel-line-half"></div>
        <div class="skeleton skel-line-short"></div>
      </div>
    </div>
    <div class="skel-bene-row" aria-hidden="true">
      <div class="skeleton skel-avatar" style="border-radius:4px"></div>
      <div class="skel-text-group">
        <div class="skeleton skel-line-full"></div>
        <div class="skeleton skel-line-half"></div>
      </div>
    </div>
  </div>

  <!-- Consumer bottom nav — Payments active -->
  <nav data-shell="bottom-nav" aria-label="Main navigation">
    <button class="nav-tab" data-nav-to="home" aria-label="Home">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      Home
    </button>
    <button class="nav-tab" data-nav-to="accounts" aria-label="Accounts">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zm-9 9h22v-3H1v3zm15-9v7h3v-7h-3zM12 1L1 6v2h22V6L12 1z"/></svg>
      </div>
      Accounts
    </button>
    <button class="nav-tab active" data-nav-to="beneficiaries" aria-label="Payments" aria-current="page">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
      </div>
      Payments
    </button>
    <button class="nav-tab" data-nav-to="cards" aria-label="Cards">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
      </div>
      Cards
    </button>
    <button class="nav-tab" data-nav-to="profile" aria-label="Profile">
      <div class="nav-pill">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      Profile
    </button>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
