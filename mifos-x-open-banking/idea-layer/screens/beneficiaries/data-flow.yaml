sibling: data-flow
schema_version: "4.0"
feature_id: beneficiaries
entries:
  - screen_id: beneficiaries
    trigger: on_mount
    endpoints:
      - get_account_beneficiaries
    direction: read
    dtos:
      - name: OBReadBeneficiary5
        role: response
        api_id: get_account_beneficiaries
    produces_state: content
    notes: >-
      READ-ONLY OBIE beneficiary list (OBReadBeneficiary5). Requires an authorised
      account-access consent (ReadBeneficiariesBasic/Detail) + Authorization-Code token.
      No create path — OBIE has no create-beneficiary endpoint.
    error_paths:
      - error_code: 400
        behavior: error_state
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
