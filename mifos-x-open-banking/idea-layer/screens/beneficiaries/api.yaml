sibling: api
schema_version: "4.0"
feature_id: beneficiaries
# Rebound OBP -> HSBC OBIE on 2026-06-11. READ-ONLY beneficiaries: OBIE AIS exposes the
# beneficiary list (OBReadBeneficiary5) but has NO create-beneficiary endpoint, so the
# previously-deferred Add path stays removed/unsupported. All reads require an authorised
# account-access consent (ReadBeneficiariesBasic/Detail + ReadAccountsBasic + ReadTransactions*)
# and an Authorization-Code-scoped token (mutual TLS + x-fapi-financial-id on every call).
# Contract source of truth: server/apis/ais.yaml.
api:
  - id: get_account_beneficiaries
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/beneficiaries"
    tag: Beneficiaries
    description: "List the beneficiaries (payees) linked to a specific AccountId. OBIE OBReadBeneficiary5; requires ReadBeneficiariesBasic/Detail and an authorised account-access consent. READ-ONLY — there is no OBIE create-beneficiary endpoint."
    response:
      fields:
        - name: Data.Beneficiary
          type: "Array<OBBeneficiary5>"
        - name: Data.Beneficiary[].BeneficiaryId
          type: String
        - name: Data.Beneficiary[].AccountId
          type: String
        - name: Data.Beneficiary[].BeneficiaryType
          type: String
        - name: Data.Beneficiary[].Reference
          type: String
        - name: Data.Beneficiary[].CreditorAccount.SchemeName
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Identification
          type: String
        - name: Data.Beneficiary[].CreditorAccount.Name
          type: String
    errors:
      - code: 400
        message: "OB.Field.Invalid"
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus (e.g. missing ReadBeneficiaries permission)"
      - code: 429
        message: "TOO_MANY_REQUESTS"

  # Account list source — drives the account selector and the per-account scoping of the whole
  # screen. OBIE accounts call after consent authorisation; first call after consent returns
  # the authorised AccountId(s).
  - id: get_accounts
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts"
    tag: Accounts
    description: "The PSU's authorised accounts; populates the account selector and picks the default account. OBIE OBReadAccount6."
    response:
      fields:
        - name: Data.Account
          type: "Array<OBAccount6>"
        - name: Data.Account[].AccountId
          type: String
        - name: Data.Account[].Nickname
          type: String
        - name: Data.Account[].Account[].SchemeName
          type: String
        - name: Data.Account[].Account[].Identification
          type: String
        - name: Data.Account[].Account[].Name
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

  # Last-payment metadata source — the screen joins transaction descriptions / creditor
  # identifiers to each beneficiary to derive last-payment amount/date/recency.
  - id: get_account_transactions
    endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
    tag: Transactions
    description: "Transactions for the selected account; used only to derive last-payment per beneficiary (join on CreditorAccount.Identification / TransactionInformation). OBIE OBReadTransaction6."
    response:
      fields:
        - name: Data.Transaction
          type: "Array<OBTransaction6>"
        - name: Data.Transaction[].Amount.Amount
          type: String
        - name: Data.Transaction[].Amount.Currency
          type: String
        - name: Data.Transaction[].BookingDateTime
          type: String
        - name: Data.Transaction[].TransactionInformation
          type: String
        - name: Data.Transaction[].CreditorAccount.Identification
          type: String
    errors:
      - code: 401
        message: "UNAUTHORIZED"
      - code: 403
        message: "OB.Resource.InvalidConsentStatus"

  # UNSUPPORTED on OBIE — there is NO create-beneficiary endpoint in OBIE AIS. The Add
  # Beneficiary path never shipped under OBP and stays removed: OBIE cannot create a
  # beneficiary at all, so no create endpoint can be wired here.
  - id: create_beneficiary
    deferred: true
    deferred_reason: "OBIE AIS has NO create-beneficiary endpoint (read-only beneficiary resource). The Add Beneficiary path was already deferred under OBP and remains unsupported — there is no HSBC equivalent to bind."
    unsupported: true
    endpoint: "N/A — no OBIE create-beneficiary endpoint exists"
    tag: Beneficiaries
    description: "Create a beneficiary. NOT SUPPORTED by OBIE AIS — read-only resource. Retained only as an explicit gap marker."

# Cross-feature dependency: last-payment amount/date + recency are derived from the
# account's transactions (get_account_transactions), by joining transaction creditor
# identifier / description to the beneficiary's CreditorAccount.Identification / Name.
