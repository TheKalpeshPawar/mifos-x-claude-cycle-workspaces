sibling: api
schema_version: "4.0"
feature_id: beneficiaries
api:
  - id: obp_get_counterparties
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/accounts/{accountId}/{viewId}/counterparties"
    tag: Counterparties
    response:
      fields:
        - name: counterparties
          type: List<Counterparty>
        - name: id
          type: String
        - name: name
          type: String
        - name: description
          type: String
        - name: other_bank_routing_address
          type: String
        - name: other_account_routing_address
          type: String
        - name: other_account_routing_scheme
          type: String
        - name: is_beneficiary
          type: Boolean
        - name: created_by_user_id
          type: String
    errors:
      - code: 400
        message: "INVALID_BANK_ID"
      - code: 401
        message: "USER_NOT_LOGGED_IN"
      - code: 404
        message: "BANK_ACCOUNT_NOT_FOUND"
