<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>KYC Document Review — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;
  --background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;
  --outline:#75796C;--outline-variant:#C5C8BA;
  --text-primary:#1A1C16;--text-secondary:#44483D;
  --tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;
  --nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;min-height:844px;position:relative;overflow-x:hidden;background:var(--background);font-family:var(--font)}
main{display:flex;flex-direction:column;min-height:844px}

/* Shimmer */
@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
.shim{background:linear-gradient(90deg,var(--surface-variant) 25%,#f0f2e8 50%,var(--surface-variant) 75%);background-size:780px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}

/* Header shimmer */
.hdr-shim{height:72px;background:var(--primary);padding:16px;display:flex;align-items:center;gap:12px}
.hdr-avatar-shim{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25)}
.hdr-text-shim{display:flex;flex-direction:column;gap:6px;flex:1}
.hdr-t1{height:14px;width:100px;background:rgba(255,255,255,.25);border-radius:6px}
.hdr-t2{height:10px;width:140px;background:rgba(255,255,255,.18);border-radius:6px}

/* Content shims */
.status-shim{height:32px;width:160px;margin:14px 16px 8px;border-radius:16px}
.sec-shim{height:16px;width:100px;margin:12px 16px 8px;border-radius:6px}
.doc-card-shim{height:68px;margin:0 16px 8px;border-radius:10px}
.risk-shim{height:48px;margin:0 16px 12px;border-radius:8px}
.btn-shim{height:48px;margin:0 16px 10px;border-radius:10px}
</style>
</head>
<body>
<main data-screen="kyc-review" data-state="loading" role="main" aria-busy="true" aria-label="Loading KYC review">

  <!-- Header shimmer -->
  <div class="hdr-shim">
    <div class="hdr-avatar-shim"></div>
    <div class="hdr-text-shim">
      <div class="hdr-t1"></div>
      <div class="hdr-t2"></div>
    </div>
  </div>

  <!-- Status shimmer -->
  <div class="shim status-shim"></div>

  <!-- Documents section shimmer -->
  <div class="shim sec-shim"></div>
  <div class="shim doc-card-shim"></div>
  <div class="shim doc-card-shim"></div>
  <div class="shim doc-card-shim"></div>
  <div class="shim doc-card-shim" style="margin-bottom:16px"></div>

  <!-- Risk shimmer -->
  <div class="shim sec-shim"></div>
  <div class="shim risk-shim"></div>
  <div class="shim risk-shim" style="height:96px"></div>

  <!-- Button shimmers -->
  <div class="shim btn-shim"></div>
  <div class="shim btn-shim"></div>
  <div class="shim btn-shim" style="opacity:.6"></div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
