<!doctype html>
<!-- render-hash: kyc-loading-j10 -->
<html lang="en" data-screen="kyc-review" data-state="loading" data-feature="kyc-review" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading KYC Review — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF;
      --primary-container: #CDEDA3; --on-primary-container: #102000;
      --background: #F9FAEF; --on-background: #1A1C16;
      --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D;
      --outline: #75796C; --outline-variant: #C5C8BA;
      --skeleton-base: #E1E4D5; --skeleton-shine: #F1F3E5;
      --radius-soft: 12px;
      --icon-xs:16px; --icon-sm:20px; --icon-md:24px; --icon-lg:32px; --icon-xl:40px; --icon-2xl:48px;
    }
    [data-theme="dark"] {
      --primary: #B2D188; --on-primary: #1F3701;
      --background: #12140E; --on-background: #E3E3D8;
      --surface: #1F211B; --on-surface: #E3E3D8;
      --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
      --outline: #8F9285; --outline-variant: #44483D;
      --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #B2D188; --on-primary: #1F3701;
        --background: #12140E; --on-background: #E3E3D8;
        --surface: #1F211B; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA;
        --outline: #8F9285; --outline-variant: #44483D;
        --skeleton-base: #2A2D26; --skeleton-shine: #3A3D35;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; padding-bottom: 90px; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-variant); }
    .top-bar .material-icons { font-size: var(--icon-md); color: var(--on-surface-variant); }
    .top-bar h1 { font-size: 18px; font-weight: 600; color: var(--on-surface); flex: 1; }
    .header-band { padding: 18px 20px; background: var(--primary); display: flex; gap: 12px; align-items: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .skel { background: linear-gradient(90deg, var(--skeleton-base) 0%, var(--skeleton-shine) 50%, var(--skeleton-base) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-av { width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.3); }
    .skel-hdr-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skel-hdr-1 { height: 14px; width: 50%; background: rgba(255,255,255,0.4); border-radius: 4px; }
    .skel-hdr-2 { height: 11px; width: 35%; background: rgba(255,255,255,0.3); border-radius: 4px; }
    .skel-section { height: 14px; width: 38%; margin: 18px 20px 8px; }
    .skel-doc { display: flex; gap: 12px; align-items: center; padding: 14px; margin: 0 16px 8px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-soft); }
    .skel-thumb { width: 56px; height: 40px; border-radius: 6px; flex-shrink: 0; }
    .skel-doc .lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skel-line-1 { height: 12px; width: 60%; }
    .skel-line-2 { height: 10px; width: 40%; }
    .skel-btn-link { width: 50px; height: 14px; }
    .skel-select { height: 48px; margin: 8px 16px 16px; border-radius: var(--radius-soft); }
    .skel-btn { height: 48px; margin: 0 16px 10px; border-radius: var(--radius-soft); }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--surface-variant); display: flex; justify-content: space-around; padding: 6px 0 8px; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; padding: 6px 10px; min-width: 56px; }
    .nav-item .material-icons { font-size: var(--icon-sm); }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>
  <main aria-busy="true" aria-live="polite">
    <header class="top-bar" role="banner">
      <span class="material-icons" data-action="navigate_back" tabindex="0" aria-label="Go back" role="button">arrow_back</span>
      <h1>KYC Verification</h1>
    </header>
    <span class="sr-only">Loading KYC documents, please wait.</span>

    <section class="header-band" data-component-type="skeleton" data-component-id="header_skeleton" aria-hidden="true">
      <div class="skel skel-av"></div>
      <div class="skel-hdr-lines">
        <div class="skel-hdr-1"></div>
        <div class="skel-hdr-2"></div>
      </div>
    </section>

    <div class="skel skel-section" aria-hidden="true"></div>

    <div class="skel-doc" data-component-type="skeleton" data-component-id="doc_skel_1" aria-hidden="true">
      <div class="skel skel-thumb"></div>
      <div class="lines"><div class="skel skel-line-1"></div><div class="skel skel-line-2"></div></div>
      <div class="skel skel-btn-link"></div>
    </div>
    <div class="skel-doc" data-component-type="skeleton" data-component-id="doc_skel_2" aria-hidden="true">
      <div class="skel skel-thumb"></div>
      <div class="lines"><div class="skel skel-line-1"></div><div class="skel skel-line-2"></div></div>
      <div class="skel skel-btn-link"></div>
    </div>
    <div class="skel-doc" data-component-type="skeleton" data-component-id="doc_skel_3" aria-hidden="true">
      <div class="skel skel-thumb"></div>
      <div class="lines"><div class="skel skel-line-1"></div><div class="skel skel-line-2"></div></div>
      <div class="skel skel-btn-link"></div>
    </div>
    <div class="skel-doc" data-component-type="skeleton" data-component-id="doc_skel_4" aria-hidden="true">
      <div class="skel skel-thumb"></div>
      <div class="lines"><div class="skel skel-line-1"></div><div class="skel skel-line-2"></div></div>
      <div class="skel skel-btn-link"></div>
    </div>

    <div class="skel skel-section" aria-hidden="true"></div>
    <div class="skel skel-select" aria-hidden="true"></div>
    <div class="skel skel-btn" aria-hidden="true"></div>
    <div class="skel skel-btn" aria-hidden="true"></div>
  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" role="navigation" aria-label="Primary">
    <a class="nav-item" data-nav-to="fo-dashboard" tabindex="0" aria-label="Dashboard"><span class="material-icons">dashboard</span><span>Dashboard</span></a>
    <a class="nav-item active" data-nav-to="customer-search" tabindex="0" aria-label="Customers, current" aria-current="page"><span class="material-icons">people</span><span>Customers</span></a>
    <a class="nav-item" data-nav-to="account-applications" tabindex="0" aria-label="Applications"><span class="material-icons">description</span><span>Applications</span></a>
    <a class="nav-item" data-nav-to="customer-messages" tabindex="0" aria-label="Messages"><span class="material-icons">mail</span><span>Messages</span></a>
    <a class="nav-item" data-nav-to="settings" tabindex="0" aria-label="More"><span class="material-icons">more_vert</span><span>More</span></a>
  </nav>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
