<!doctype html>
<html lang="en" data-screen="kyc-review" data-state="content">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC Document Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B;
      --on-primary: #FFFFFF;
      --primary-container: #CDEDA3;
      --secondary: #386663;
      --error: #BA1A1A;
      --background: #F9FAEF;
      --on-background: #1A1C16;
      --surface: #FFFFFF;
      --on-surface: #1A1C16;
      --surface-variant: #E1E4D5;
      --on-surface-variant: #44483D;
      --outline: #75796C;
      --outline-variant: #C5C8BA;
      --warning: #E8A317;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--on-background);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 24px;
      overflow-y: auto;
    }
    .material-icons { font-family: 'Material Icons'; font-style: normal; }
    .customer-header { background: var(--primary); padding: 16px; }
    .header-row { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar-text { font-size: 14px; font-weight: 700; color: var(--primary); }
    .header-name { font-size: 16px; font-weight: 700; color: var(--surface); }
    .header-kyc-sub { font-size: 12px; color: var(--primary-container); }
    .status-row { padding: 14px 16px 8px; display: flex; align-items: center; gap: 8px; }
    .status-lbl { font-size: 14px; color: var(--on-surface-variant); font-weight: 500; }
    .status-chip { background: var(--primary-container); border: 1px solid var(--warning); border-radius: 16px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--warning); }
    .section-hd { font-size: 16px; font-weight: 600; color: var(--on-surface); padding: 12px 16px 8px; }
    .doc-card { background: var(--surface); border-radius: 10px; border: 1px solid var(--outline-variant); padding: 14px; margin: 0 16px 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .doc-row { display: flex; align-items: center; gap: 12px; }
    .thumb { width: 56px; height: 40px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .doc-info { flex: 1; }
    .doc-title-t { font-size: 15px; font-weight: 600; color: var(--on-surface); margin-bottom: 2px; }
    .doc-ok { font-size: 12px; color: var(--primary); }
    .doc-pending { font-size: 12px; color: var(--warning); }
    .doc-gray { font-size: 12px; color: var(--outline); }
    .view-link { font-size: 13px; font-weight: 500; color: var(--primary); text-decoration: underline; background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; }
    .view-link:focus { outline: 2px solid var(--primary); border-radius: 2px; }
    .upload-btn { border: 1px solid var(--secondary); color: var(--secondary); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; }
    .upload-btn:focus { outline: 2px solid var(--secondary); outline-offset: 2px; }
    .field-grp { margin: 0 16px 12px; }
    .field-lbl { font-size: 12px; font-weight: 600; color: var(--outline); margin-bottom: 4px; display: block; }
    .sel { width: 100%; padding: 12px; border: 1px solid var(--outline-variant); border-radius: 8px; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--on-surface); background: var(--surface); cursor: pointer; }
    .sel:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    .txta { width: 100%; padding: 12px; border: 1px solid var(--outline-variant); border-radius: 8px; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--on-surface); background: var(--surface); resize: vertical; min-height: 80px; }
    .txta:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    .btn-primary { display: block; width: calc(100% - 32px); margin: 0 16px 8px; padding: 14px; background: var(--primary); color: var(--on-primary); border: none; border-radius: 8px; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; }
    .btn-primary:focus { outline: 2px solid var(--primary); outline-offset: 3px; }
    .btn-error { display: block; width: calc(100% - 32px); margin: 0 16px 8px; padding: 14px; background: transparent; color: var(--error); border: 1px solid var(--error); border-radius: 8px; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; text-align: center; }
    .btn-error:focus { outline: 2px solid var(--error); outline-offset: 2px; }
    .btn-txt { display: block; width: calc(100% - 32px); margin: 0 16px 24px; padding: 12px; background: none; color: var(--primary); border: none; font-size: 14px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; text-align: center; }
    .btn-txt:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
  </style>
</head>
<body>

  <!-- Customer mini header -->
  <div
    data-component-type="box"
    data-component-id="customer_mini_header"
    class="customer-header"
    aria-label="Customer: John Mwangi — KYC Review Required"
  >
    <div data-component-type="stack" data-component-id="header_stack" class="header-row">
      <div data-component-type="box" data-component-id="customer_avatar" class="avatar" role="img" aria-label="Customer avatar initials JM">
        <span data-component-type="text" data-component-id="avatar_initials" class="avatar-text">JM</span>
      </div>
      <div data-component-type="box" data-component-id="header_text_group">
        <div data-component-type="text" data-component-id="header_customer_name" class="header-name">John Mwangi</div>
        <div data-component-type="text" data-component-id="header_kyc_label" class="header-kyc-sub">KYC Review Required</div>
      </div>
    </div>
  </div>

  <!-- KYC Status badge row -->
  <div
    data-component-type="box"
    data-component-id="kyc_status_badge_row"
    class="status-row"
    aria-label="KYC Status: In Progress"
  >
    <span data-component-type="text" data-component-id="kyc_status_label" class="status-lbl">KYC Status:</span>
    <span data-component-type="box" data-component-id="kyc_status_chip" class="status-chip" role="status">
      <span data-component-type="text" data-component-id="kyc_status_chip_text">In Progress</span>
    </span>
  </div>

  <!-- Documents -->
  <div
    data-component-type="text"
    data-component-id="documents_section_heading"
    class="section-hd"
    role="heading"
    aria-level="2"
    aria-label="Documents section"
  >Documents</div>

  <!-- National ID Front -->
  <div data-component-type="box" data-component-id="doc_national_id_front" class="doc-card" aria-label="National ID Front: Uploaded and verified">
    <div data-component-type="stack" data-component-id="doc_front_row" class="doc-row">
      <div data-component-type="image" data-component-id="id_front_thumbnail" class="thumb" role="img" aria-label="Thumbnail of National ID front side"
           style="background:linear-gradient(135deg,var(--primary-container),var(--primary));">
        <span class="material-icons" style="color:var(--on-primary);font-size:20px;" aria-hidden="true">badge</span>
      </div>
      <div data-component-type="box" data-component-id="doc_front_info" class="doc-info">
        <div data-component-type="text" data-component-id="doc_front_title" class="doc-title-t">National ID — Front</div>
        <div data-component-type="text" data-component-id="doc_front_status" class="doc-ok">Uploaded ✓ · 22 May 2026</div>
      </div>
      <button
        data-component-type="link"
        data-component-id="doc_front_view_link"
        data-action="view_document"
        class="view-link"
        aria-label="View National ID front document"
        tabindex="0"
      >View</button>
    </div>
  </div>

  <!-- National ID Back -->
  <div data-component-type="box" data-component-id="doc_national_id_back" class="doc-card" aria-label="National ID Back: Pending upload">
    <div data-component-type="stack" data-component-id="doc_back_row" class="doc-row">
      <div data-component-type="box" data-component-id="id_back_placeholder" class="thumb" role="img" aria-label="No thumbnail, upload pending"
           style="background:var(--background);border:1px solid var(--outline-variant);">
        <span data-component-type="icon" data-component-id="id_back_placeholder_icon" class="material-icons" style="color:var(--outline);font-size:20px;" aria-hidden="true">image_not_supported</span>
      </div>
      <div data-component-type="box" data-component-id="doc_back_info" class="doc-info">
        <div data-component-type="text" data-component-id="doc_back_title" class="doc-title-t">National ID — Back</div>
        <div data-component-type="text" data-component-id="doc_back_status" class="doc-pending">Pending Upload</div>
      </div>
    </div>
  </div>

  <!-- Selfie / Liveness -->
  <div data-component-type="box" data-component-id="doc_selfie" class="doc-card" aria-label="Selfie Liveness Check: Passed">
    <div data-component-type="stack" data-component-id="doc_selfie_row" class="doc-row">
      <div data-component-type="image" data-component-id="selfie_thumbnail" class="thumb" role="img" aria-label="Customer selfie thumbnail"
           style="border-radius:28px;border:2px solid var(--primary);background:linear-gradient(135deg,var(--primary-container),var(--primary));">
        <span class="material-icons" style="color:var(--on-primary);font-size:20px;" aria-hidden="true">face</span>
      </div>
      <div data-component-type="box" data-component-id="doc_selfie_info" class="doc-info">
        <div data-component-type="text" data-component-id="doc_selfie_title" class="doc-title-t">Selfie / Liveness Check</div>
        <div data-component-type="text" data-component-id="doc_selfie_status" class="doc-ok">Passed ✓ · 22 May 2026</div>
      </div>
    </div>
  </div>

  <!-- Proof of Address -->
  <div data-component-type="box" data-component-id="doc_proof_of_address" class="doc-card" aria-label="Proof of Address: Optional, not yet uploaded" style="margin-bottom:16px;">
    <div data-component-type="stack" data-component-id="doc_address_row" class="doc-row">
      <div data-component-type="box" data-component-id="proof_address_placeholder" class="thumb" role="img" aria-label="No proof of address uploaded"
           style="background:var(--background);border:1px solid var(--outline-variant);">
        <span data-component-type="icon" data-component-id="proof_address_icon" class="material-icons" style="color:var(--outline);font-size:20px;" aria-hidden="true">home</span>
      </div>
      <div data-component-type="box" data-component-id="doc_address_info" class="doc-info">
        <div data-component-type="text" data-component-id="doc_address_title" class="doc-title-t">Proof of Address (Optional)</div>
        <div data-component-type="text" data-component-id="doc_address_status" class="doc-gray">Not uploaded</div>
      </div>
      <button
        data-component-type="button"
        data-component-id="upload_address_proof_button"
        data-action="view_document"
        class="upload-btn"
        aria-label="Upload proof of address"
        tabindex="0"
      >Upload</button>
    </div>
  </div>

  <!-- Risk Assessment -->
  <div
    data-component-type="text"
    data-component-id="risk_section_heading"
    class="section-hd"
    role="heading"
    aria-level="2"
    aria-label="Risk Assessment section"
  >Risk Assessment</div>

  <div class="field-grp">
    <label class="field-lbl" for="risk_level_select">Risk Level</label>
    <select
      data-component-type="input"
      data-component-id="risk_level_select"
      data-action="select_risk_level"
      id="risk_level_select"
      class="sel"
      aria-label="Select customer risk level"
      tabindex="0"
    >
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
      <option>Declined</option>
    </select>
  </div>

  <div class="field-grp" style="margin-bottom:16px;">
    <label class="field-lbl" for="rejection_reason_input">Reason for Rejection</label>
    <textarea
      data-component-type="input"
      data-component-id="rejection_reason_input"
      data-action="focus_field"
      id="rejection_reason_input"
      class="txta"
      placeholder="Explain why KYC cannot be approved — e.g. National ID does not match selfie, blurry documents, suspected fraud..."
      aria-label="Reason for rejection, required when rejecting"
      tabindex="0"
    ></textarea>
  </div>

  <button
    data-component-type="button"
    data-component-id="approve_kyc_button"
    data-action="approve_kyc"
    class="btn-primary"
    aria-label="Approve KYC for this customer"
    tabindex="0"
  >Approve KYC</button>

  <button
    data-component-type="button"
    data-component-id="reject_kyc_button"
    data-action="reject_kyc"
    class="btn-error"
    aria-label="Reject KYC for this customer"
    tabindex="0"
  >Reject KYC</button>

  <button
    data-component-type="button"
    data-component-id="request_more_docs_button"
    data-action="request_more_docs"
    class="btn-txt"
    aria-label="Request additional documents from the customer"
    tabindex="0"
  >Request More Documents</button>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
