<!doctype html>
<html lang="en" data-screen="kyc-review" data-state="verifying">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC Review — Verifying</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --secondary: #386663; --error: #BA1A1A; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 24px; overflow-y: auto; position: relative; }
    .material-icons { font-family: 'Material Icons'; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
    .customer-header { background: var(--primary); padding: 16px; opacity: 0.5; }
    .header-row { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar-text { font-size: 14px; font-weight: 700; color: var(--primary); }
    .header-name { font-size: 16px; font-weight: 700; color: var(--surface); }
    .header-kyc-sub { font-size: 12px; color: var(--primary-container); }
    .content-dimmed { opacity: 0.35; pointer-events: none; padding: 16px; }
    .field-mock { height: 52px; border: 1px solid var(--outline-variant); border-radius: 8px; background: var(--surface); margin-bottom: 12px; }
    .field-lbl-mock { font-size: 12px; color: var(--outline); margin-bottom: 4px; }
    .section-hd { font-size: 16px; font-weight: 600; color: var(--on-surface); margin-bottom: 12px; }
    /* Overlay */
    .verify-overlay { position: fixed; inset: 0; max-width: 390px; margin: 0 auto; background: rgba(249,250,239,0.7); display: flex; align-items: center; justify-content: center; z-index: 30; }
    .overlay-card { background: var(--surface); border-radius: 20px; padding: 36px 28px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 14px; width: 290px; }
    .doc-check-list { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; }
    .doc-check-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--on-surface-variant); }
    .doc-check-row.done { color: var(--primary); }
    .doc-check-row.active { color: var(--on-surface); font-weight: 600; }
    .check-icon { font-size: 18px; color: var(--primary); }
    .active-spinner { width: 18px; height: 18px; border: 2.5px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.85s linear infinite; flex-shrink: 0; }
    .pending-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--surface-variant); flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-title { font-size: 17px; font-weight: 700; color: var(--on-surface); }
    .overlay-sub { font-size: 13px; color: var(--outline); }
    .progress-bar-wrap { width: 100%; height: 4px; background: var(--surface-variant); border-radius: 2px; overflow: hidden; }
    .progress-bar-fill { width: 55%; height: 100%; background: var(--primary); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="customer-header" data-component-type="box" data-component-id="kyc_customer_header">
    <div class="header-row">
      <div class="avatar" aria-hidden="true"><span class="avatar-text">FA</span></div>
      <div>
        <div class="header-name">Fatima Al-Rashid</div>
        <div class="header-kyc-sub">KYC ID: KYC-2026-00472</div>
      </div>
    </div>
  </div>

  <div class="content-dimmed">
    <div class="section-hd">Documents</div>
    <div class="field-lbl-mock">Passport</div><div class="field-mock"></div>
    <div class="field-lbl-mock">Utility Bill</div><div class="field-mock"></div>
    <div class="field-lbl-mock">Risk Level</div><div class="field-mock"></div>
  </div>

  <div class="verify-overlay" role="status" aria-live="polite" aria-label="Verifying KYC documents"
       data-component-type="box" data-component-id="kyc_verifying_overlay">
    <div class="overlay-card">
      <span class="overlay-title">Verifying Documents</span>
      <div class="progress-bar-wrap" aria-hidden="true">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="doc-check-list">
        <div class="doc-check-row done">
          <span class="material-icons check-icon" aria-hidden="true">check_circle</span>
          Passport — Verified
        </div>
        <div class="doc-check-row active">
          <div class="active-spinner" aria-hidden="true"></div>
          Utility Bill — Checking address...
        </div>
        <div class="doc-check-row">
          <div class="pending-dot" aria-hidden="true"></div>
          Selfie photo match
        </div>
        <div class="doc-check-row">
          <div class="pending-dot" aria-hidden="true"></div>
          Sanctions &amp; PEP screening
        </div>
      </div>
      <span class="overlay-sub">This may take a few moments</span>
    </div>
  </div>

  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
