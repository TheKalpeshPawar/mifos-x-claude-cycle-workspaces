id: kyc-review
name: "KYC Document Review"
feature: kyc-review
flavor: fieldOfficer
status: enriched
quality_score: 83

screens:
  - id: kyc-review-main
    name: "KYC Verification"
    archetype: detail_screen

components:
  - type: box
    id: customer_mini_header
    style:
      backgroundColor: "#1800B1"
      paddingVertical: 16
      paddingHorizontal: 16
      borderRadius: 0
    a11y:
      contentDescription: "Customer: John Mwangi — KYC Review Required"
    test_context:
      tag: customer_mini_header
    components:
      - type: stack
        id: header_stack
        style:
          direction: horizontal
          alignItems: center
          gap: 12
        components:
          - type: box
            id: customer_avatar
            style:
              backgroundColor: "#FFFFFF"
              borderRadius: 24
              width: 40
              height: 40
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "Customer avatar initials JM"
              role: image
            test_context:
              tag: customer_avatar
            components:
              - type: text
                id: avatar_initials
                content: "JM"
                style:
                  textStyle: label_large
                  color: "#1800B1"
                  weight: 700
                a11y:
                  contentDescription: "JM"
                test_context:
                  tag: avatar_initials
          - type: box
            id: header_text_group
            style:
              direction: vertical
            a11y:
              contentDescription: ""
            test_context:
              tag: header_text_group
            components:
              - type: text
                id: header_customer_name
                content: "John Mwangi"
                style:
                  textStyle: title_medium
                  color: "#FFFFFF"
                  weight: 700
                a11y:
                  contentDescription: "John Mwangi"
                test_context:
                  tag: header_customer_name
              - type: text
                id: header_kyc_label
                content: "KYC Review Required"
                style:
                  textStyle: body_small
                  color: "#B0B8FF"
                a11y:
                  contentDescription: "KYC review required"
                test_context:
                  tag: header_kyc_label

  - type: box
    id: kyc_status_badge_row
    style:
      paddingHorizontal: 16
      paddingTop: 14
      paddingBottom: 8
      direction: horizontal
      alignItems: center
      gap: 8
    a11y:
      contentDescription: "KYC Status: In Progress"
    test_context:
      tag: kyc_status_badge_row
    components:
      - type: text
        id: kyc_status_label
        content: "KYC Status:"
        style:
          textStyle: body_medium
          color: "#666666"
          weight: 500
        a11y:
          contentDescription: "KYC Status label"
        test_context:
          tag: kyc_status_label
      - type: box
        id: kyc_status_chip
        style:
          backgroundColor: "#FFF8E1"
          borderRadius: 16
          paddingHorizontal: 12
          paddingVertical: 4
          borderWidth: 1
          borderColor: "#FFB300"
        a11y:
          contentDescription: "Status: In Progress"
          role: status
        test_context:
          tag: kyc_status_chip
        components:
          - type: text
            id: kyc_status_chip_text
            content: "In Progress"
            style:
              textStyle: label_medium
              color: "#E65100"
              weight: 600
            a11y:
              contentDescription: "In Progress"
            test_context:
              tag: kyc_status_chip_text

  - type: text
    id: documents_section_heading
    content: "Documents"
    style:
      textStyle: title_medium
      color: "#1A1A1A"
      paddingHorizontal: 16
      paddingTop: 12
      paddingBottom: 8
    a11y:
      role: heading
      level: 2
      contentDescription: "Documents section"
    test_context:
      tag: documents_section_heading

  - type: box
    id: doc_national_id_front
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 8
      elevation: 1
      borderWidth: 1
      borderColor: "#E0E0E0"
    a11y:
      contentDescription: "National ID Front: Uploaded and verified"
    test_context:
      tag: doc_national_id_front
    components:
      - type: stack
        id: doc_front_row
        style:
          direction: horizontal
          alignItems: center
          gap: 12
        components:
          - type: image
            id: id_front_thumbnail
            content: "kyc_id_front_thumbnail"
            style:
              width: 56
              height: 40
              borderRadius: 6
              objectFit: cover
            a11y:
              contentDescription: "Thumbnail of National ID front side"
              role: image
            test_context:
              tag: id_front_thumbnail
          - type: box
            id: doc_front_info
            style:
              flex: 1
              direction: vertical
            a11y:
              contentDescription: ""
            test_context:
              tag: doc_front_info
            components:
              - type: text
                id: doc_front_title
                content: "National ID — Front"
                style:
                  textStyle: body_large
                  color: "#1A1A1A"
                  weight: 600
                  marginBottom: 2
                a11y:
                  contentDescription: "National ID front"
                test_context:
                  tag: doc_front_title
              - type: text
                id: doc_front_status
                content: "Uploaded ✓ · 22 May 2026"
                style:
                  textStyle: body_small
                  color: "#4CAF50"
                a11y:
                  contentDescription: "Uploaded and verified on 22 May 2026"
                test_context:
                  tag: doc_front_status
          - type: link
            id: doc_front_view_link
            content: "View"
            style:
              textStyle: label_medium
              color: "#1800B1"
              textDecoration: underline
            on_click:
              action: view_document
              target: kyc_id_front
            a11y:
              contentDescription: "View National ID front document"
              role: button
            test_context:
              tag: doc_front_view_link
              assertClickable: true

  - type: box
    id: doc_national_id_back
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 8
      elevation: 1
      borderWidth: 1
      borderColor: "#E0E0E0"
    a11y:
      contentDescription: "National ID Back: Pending upload"
    test_context:
      tag: doc_national_id_back
    components:
      - type: stack
        id: doc_back_row
        style:
          direction: horizontal
          alignItems: center
          gap: 12
        components:
          - type: box
            id: id_back_placeholder
            style:
              width: 56
              height: 40
              borderRadius: 6
              backgroundColor: "#F5F5F5"
              borderWidth: 1
              borderColor: "#E0E0E0"
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "No thumbnail, upload pending"
              role: image
            test_context:
              tag: id_back_placeholder
            components:
              - type: icon
                id: id_back_placeholder_icon
                content: "image_not_supported"
                style:
                  color: "#BDBDBD"
                  size: 20
                a11y:
                  contentDescription: "No image"
                test_context:
                  tag: id_back_placeholder_icon
          - type: box
            id: doc_back_info
            style:
              flex: 1
              direction: vertical
            a11y:
              contentDescription: ""
            test_context:
              tag: doc_back_info
            components:
              - type: text
                id: doc_back_title
                content: "National ID — Back"
                style:
                  textStyle: body_large
                  color: "#1A1A1A"
                  weight: 600
                  marginBottom: 2
                a11y:
                  contentDescription: "National ID back"
                test_context:
                  tag: doc_back_title
              - type: text
                id: doc_back_status
                content: "Pending Upload"
                style:
                  textStyle: body_small
                  color: "#FF8F00"
                a11y:
                  contentDescription: "Status: Pending Upload"
                test_context:
                  tag: doc_back_status

  - type: box
    id: doc_selfie
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 8
      elevation: 1
      borderWidth: 1
      borderColor: "#E0E0E0"
    a11y:
      contentDescription: "Selfie Liveness Check: Passed"
    test_context:
      tag: doc_selfie
    components:
      - type: stack
        id: doc_selfie_row
        style:
          direction: horizontal
          alignItems: center
          gap: 12
        components:
          - type: image
            id: selfie_thumbnail
            content: "kyc_selfie_thumbnail"
            style:
              width: 56
              height: 40
              borderRadius: 28
              objectFit: cover
              borderWidth: 2
              borderColor: "#4CAF50"
            a11y:
              contentDescription: "Customer selfie thumbnail"
              role: image
            test_context:
              tag: selfie_thumbnail
          - type: box
            id: doc_selfie_info
            style:
              flex: 1
              direction: vertical
            a11y:
              contentDescription: ""
            test_context:
              tag: doc_selfie_info
            components:
              - type: text
                id: doc_selfie_title
                content: "Selfie / Liveness Check"
                style:
                  textStyle: body_large
                  color: "#1A1A1A"
                  weight: 600
                  marginBottom: 2
                a11y:
                  contentDescription: "Selfie and liveness check"
                test_context:
                  tag: doc_selfie_title
              - type: text
                id: doc_selfie_status
                content: "Passed ✓ · 22 May 2026"
                style:
                  textStyle: body_small
                  color: "#4CAF50"
                a11y:
                  contentDescription: "Passed on 22 May 2026"
                test_context:
                  tag: doc_selfie_status

  - type: box
    id: doc_proof_of_address
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: 10
      padding: 14
      marginHorizontal: 16
      marginBottom: 16
      elevation: 1
      borderWidth: 1
      borderColor: "#E0E0E0"
    a11y:
      contentDescription: "Proof of Address: Optional, not yet uploaded"
    test_context:
      tag: doc_proof_of_address
    components:
      - type: stack
        id: doc_address_row
        style:
          direction: horizontal
          alignItems: center
          gap: 12
        components:
          - type: box
            id: proof_address_placeholder
            style:
              width: 56
              height: 40
              borderRadius: 6
              backgroundColor: "#F5F5F5"
              borderWidth: 1
              borderColor: "#E0E0E0"
              alignItems: center
              justifyContent: center
            a11y:
              contentDescription: "No proof of address uploaded"
              role: image
            test_context:
              tag: proof_address_placeholder
            components:
              - type: icon
                id: proof_address_icon
                content: "home"
                style:
                  color: "#BDBDBD"
                  size: 20
                a11y:
                  contentDescription: "Address document"
                test_context:
                  tag: proof_address_icon
          - type: box
            id: doc_address_info
            style:
              flex: 1
              direction: vertical
            a11y:
              contentDescription: ""
            test_context:
              tag: doc_address_info
            components:
              - type: text
                id: doc_address_title
                content: "Proof of Address (Optional)"
                style:
                  textStyle: body_large
                  color: "#1A1A1A"
                  weight: 600
                  marginBottom: 2
                a11y:
                  contentDescription: "Proof of Address, optional"
                test_context:
                  tag: doc_address_title
              - type: text
                id: doc_address_status
                content: "Not uploaded"
                style:
                  textStyle: body_small
                  color: "#999999"
                a11y:
                  contentDescription: "Not uploaded"
                test_context:
                  tag: doc_address_status
          - type: button
            id: upload_address_proof_button
            label: "Upload"
            style:
              variant: outlined
              borderColor: "#008B8B"
              textColor: "#008B8B"
              paddingHorizontal: 12
              paddingVertical: 6
              textStyle: label_small
            on_click:
              action: view_document
              target: proof_of_address
            a11y:
              contentDescription: "Upload proof of address"
              role: button
            test_context:
              tag: upload_address_proof_button
              assertClickable: true

  - type: text
    id: risk_section_heading
    content: "Risk Assessment"
    style:
      textStyle: title_medium
      color: "#1A1A1A"
      paddingHorizontal: 16
      paddingBottom: 8
    a11y:
      role: heading
      level: 2
      contentDescription: "Risk Assessment section"
    test_context:
      tag: risk_section_heading

  - type: input
    id: risk_level_select
    label: "Risk Level"
    style:
      variant: outlined
      inputType: select
      options:
        - "Low"
        - "Medium"
        - "High"
        - "Declined"
      marginHorizontal: 16
      marginBottom: 12
    on_click:
      action: select_risk_level
      target: risk_level_select
    a11y:
      contentDescription: "Select customer risk level"
      role: spinner
    test_context:
      tag: risk_level_select

  - type: input
    id: rejection_reason_input
    label: "Reason for Rejection"
    style:
      variant: outlined
      inputType: textarea
      placeholder: "Explain why KYC cannot be approved — e.g. National ID does not match selfie, blurry documents, suspected fraud..."
      minLines: 3
      maxLines: 6
      marginHorizontal: 16
      marginBottom: 16
      conditionalVisible: true
    on_click:
      action: focus_field
      target: rejection_reason_input
    a11y:
      contentDescription: "Reason for rejection, required when rejecting"
      role: textField
    test_context:
      tag: rejection_reason_input

  - type: button
    id: approve_kyc_button
    label: "Approve KYC"
    style:
      variant: filled
      backgroundColor: "#4CAF50"
      textColor: "#FFFFFF"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: approve_kyc
      target: customer-detail
    a11y:
      contentDescription: "Approve KYC for this customer"
      role: button
    test_context:
      tag: approve_kyc_button
      assertClickable: true

  - type: button
    id: reject_kyc_button
    label: "Reject KYC"
    style:
      variant: outlined
      borderColor: "#FF5252"
      textColor: "#FF5252"
      marginHorizontal: 16
      marginBottom: 8
      fillWidth: true
    on_click:
      action: reject_kyc
      target: kyc-review
    a11y:
      contentDescription: "Reject KYC for this customer"
      role: button
    test_context:
      tag: reject_kyc_button
      assertClickable: true

  - type: button
    id: request_more_docs_button
    label: "Request More Documents"
    style:
      variant: text
      textColor: "#1800B1"
      marginHorizontal: 16
      marginBottom: 24
    on_click:
      action: request_more_docs
      target: customer-messages
    a11y:
      contentDescription: "Request additional documents from the customer"
      role: button
    test_context:
      tag: request_more_docs_button
      assertClickable: true

states:
  loading:
    layout:
      scroll: vertical
      padding: 0
      showShimmer: true
  reviewing:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F5F5F5"
  verifying:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F5F5F5"
      showProgressOverlay: true
      overlayMessage: "Verifying documents..."
  approved:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F5F5F5"
      showSuccessBanner: true
  rejected:
    layout:
      scroll: vertical
      padding: 0
      backgroundColor: "#F5F5F5"
      showRejectionBanner: true
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: KycReviewViewModel
  state_fields:
    - name: customerId
      type: String
    - name: kycStatus
      type: KycStatus
      values: [IN_PROGRESS, VERIFIED, REJECTED]
    - name: documents
      type: "List<KycDocument>"
    - name: riskLevel
      type: RiskLevel
      values: [LOW, MEDIUM, HIGH, DECLINED]
      nullable: true
    - name: rejectionReason
      type: String
      nullable: true
    - name: showRejectionField
      type: Boolean
      default: "false"
    - name: isVerifying
      type: Boolean
      default: "false"
  errors:
    - APPROVAL_FAILED
    - REJECTION_FAILED
    - DOCUMENT_LOAD_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - KycApproved
    - KycRejected
    - MoreDocsRequested
    - DocumentViewed
    - RiskLevelChanged
  actions:
    - approve_kyc
    - reject_kyc
    - request_more_docs
    - view_document
    - select_risk_level
  di:
    - KycRepository
    - CustomerMessagingService

api:
  - endpoint: "GET /obp/v5.1.0/customers/{customerId}/kyc_documents"
    tag: KYC
    response:
      fields:
        - kyc_document_id
        - customer_id
        - type
        - status
        - date_added
        - is_valid
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
  - endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_documents/{documentId}"
    tag: KYC
    response:
      fields:
        - kyc_document_id
        - status
        - is_valid
        - last_updated
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: DOCUMENT_NOT_FOUND

  - id: obp_kyc_check
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_check/{kycCheckId}"
    tag: KYC
    description: "Record KYC check result (caller-supplied check ID)"
    request:
      fields:
        - name: customer_number
          type: String
        - name: date
          type: String
        - name: how
          type: String
          note: "in_person | online | postal"
        - name: staff_user_id
          type: String
        - name: staff_name
          type: String
        - name: satisfied
          type: Boolean
        - name: comments
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: satisfied
          type: Boolean

  - id: obp_kyc_status
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_statuses"
    tag: KYC
    description: "Set KYC status (appends to timeline, no ID in path)"
    request:
      fields:
        - name: customer_number
          type: String
        - name: ok
          type: Boolean
        - name: date
          type: String
    response:
      fields:
        - name: ok
          type: Boolean

dependencies:
  tier: feature
  features:
    - customer-onboarding
    - customer-detail
    - customer-messages
