    label: "Request More Documents"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: text
      text_color: "#4C662B"
      margin_horizontal: spacing.md
      margin_bottom: spacing.lg
    on_click:
      action: request_more_docs
      target: customer-messages
    a11y:
      label: "Request additional documents from the customer"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: request_more_docs_button
      assertClickable: true

responsive:
  mobile_only: true
  baseline_width: 390

states:
  loading:
    layout:
      scroll: vertical
      padding: 0
      showShimmer: true
  reviewing:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
  verifying:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
      showProgressOverlay: true
      overlayMessage: "Verifying documents..."
  approved:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
      showSuccessBanner: true
  rejected:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
      showRejectionBanner: true
  content:
    layout:
      scroll: vertical
      padding: 0
      background: "#F9FAEF"
    note: "KYC documents loaded — same layout as reviewing state; default loaded state alias"
  empty:
    layout:
      scroll: vertical
      padding: 16
      background: "#F9FAEF"
      showEmptyState: true
      emptyMessage: "No KYC documents to review"
  error:
    layout:
      scroll: vertical
      padding: 16
      showErrorBanner: true

state_model:
  ViewModel: KycReviewViewModel
  state_fields:
    - name: customerId
      type: String
    - name: kycStatus
      type: KycStatus
      values: [IN_PROGRESS, VERIFIED, REJECTED]
    - name: documents
      type: "List<KycDocument>"
    - name: riskLevel
      type: RiskLevel
      values: [LOW, MEDIUM, HIGH, DECLINED]
      nullable: true
    - name: rejectionReason
      type: String
      nullable: true
    - name: showRejectionField
      type: Boolean
      default: "false"
    - name: isVerifying
      type: Boolean
      default: "false"
  errors:
    - APPROVAL_FAILED
    - REJECTION_FAILED
    - DOCUMENT_LOAD_FAILED
    - NETWORK_UNAVAILABLE
  events:
    - KycApproved
    - KycRejected
    - MoreDocsRequested
    - DocumentViewed
    - RiskLevelChanged
  actions:
    - approve_kyc
    - reject_kyc
    - request_more_docs
    - view_document
    - select_risk_level
  di:
    - KycRepository
    - CustomerMessagingService

api:
  - endpoint: "GET /obp/v5.1.0/customers/{customerId}/kyc_documents"
    tag: KYC
    response:
      fields:
        - kyc_document_id
        - customer_id
        - type
        - status
        - date_added
        - is_valid
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
  - endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_documents/{documentId}"
    tag: KYC
    response:
      fields:
        - kyc_document_id
        - status
        - is_valid
        - last_updated
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: DOCUMENT_NOT_FOUND

  - id: obp_kyc_check
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_check/{kycCheckId}"
    tag: KYC
    description: "Record KYC check result (caller-supplied check ID)"
    request:
      fields:
        - name: customer_number
          type: String
        - name: date
          type: String
        - name: how
          type: String
          note: "in_person | online | postal"
        - name: staff_user_id
          type: String
        - name: staff_name
          type: String
        - name: satisfied
          type: Boolean
        - name: comments
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: satisfied
          type: Boolean

  - id: obp_kyc_status
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_statuses"
    tag: KYC
    description: "Set KYC status (appends to timeline, no ID in path)"
    request:
      fields:
        - name: customer_number
          type: String
        - name: ok
          type: Boolean
        - name: date
          type: String
    response:
      fields:
        - name: ok
          type: Boolean

dependencies:
  tier: feature
  features:
    - customer-onboarding
    - customer-detail
    - customer-messages
