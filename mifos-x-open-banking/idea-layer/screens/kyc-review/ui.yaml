type: kyc_review
title: "KYC Review"
flavor: fieldOfficer
components:
  - type: customer_header
    id: customer_header
  - type: kyc_document_list
    id: kyc_documents
  - type: button
    id: upload_document_button
    label: "Upload Document"
    variant: contained
  - type: select
    id: kyc_status_select
    label: "KYC Status"
    options: ["Not Started", "In Progress", "Verified", "Rejected"]
  - type: button
    id: approve_kyc_button
    label: "Approve KYC"
    variant: contained
  - type: button
    id: reject_kyc_button
    label: "Reject KYC"
    variant: outlined
    color: error
states:
  - reviewing
  - verified
  - rejected
navigation: []
