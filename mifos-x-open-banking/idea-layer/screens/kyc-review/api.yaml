sibling: api
schema_version: "4.0"
feature_id: kyc-review
api:
  - id: obp_get_kyc_documents
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/customers/{customerId}/kyc_documents"
    tag: KYC
    response:
      fields:
        - kyc_document_id
        - customer_id
        - type
        - status
        - date_added
        - is_valid
    errors:
      - 400: BAD_REQUEST
      - 401: UNAUTHORIZED
      - 404: CUSTOMER_NOT_FOUND
  - id: obp_update_kyc_document
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_documents/{documentId}"
    tag: KYC
    response:
      fields:
        - kyc_document_id
        - status
        - is_valid
        - last_updated
    errors:
      - 400: VALIDATION_FAILED
      - 401: UNAUTHORIZED
      - 404: DOCUMENT_NOT_FOUND

  - id: obp_kyc_check
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_check/{kycCheckId}"
    tag: KYC
    description: "Record KYC check result (caller-supplied check ID)"
    request:
      fields:
        - name: customer_number
          type: String
        - name: date
          type: String
        - name: how
          type: String
          note: "in_person | online | postal"
        - name: staff_user_id
          type: String
        - name: staff_name
          type: String
        - name: satisfied
          type: Boolean
        - name: comments
          type: String
    response:
      fields:
        - name: id
          type: String
        - name: satisfied
          type: Boolean

  - id: obp_kyc_status
    endpoint: "PUT /obp/v2.0.0/banks/{bankId}/customers/{customerId}/kyc_statuses"
    tag: KYC
    description: "Set KYC status (appends to timeline, no ID in path)"
    request:
      fields:
        - name: customer_number
          type: String
        - name: ok
          type: Boolean
        - name: date
          type: String
    response:
      fields:
        - name: ok
          type: Boolean
