sibling: data-flow
schema_version: "4.0"
feature_id: customer-detail
entries:
  - screen_id: customer-detail
    trigger: on_mount
    endpoints:
      - obp_get_customer
    direction: read
    dtos:
      - name: Customer
        role: response
        api_id: obp_get_customer
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_forbidden_error
      - error_code: 404
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: customer-detail
    trigger: on_mount
    endpoints:
      - obp_get_customer_accounts
    direction: read
    dtos:
      - name: Account
        role: response
        api_id: obp_get_customer_accounts
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 403
        behavior: show_forbidden_error
      - error_code: 404
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: customer-detail
    trigger: on_mount
    endpoints:
      - obp_customer_account_links
    direction: read
    dtos:
      - name: Customer
        role: response
        api_id: obp_customer_account_links
    produces_state: content
    error_paths: []

  - screen_id: customer-detail
    trigger: on_interact
    event: TabSwitchedEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: customer-detail
    trigger: on_interact
    event: CreateApplicationEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: customer-detail
    trigger: on_interact
    event: SendMessageEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: customer-detail
    trigger: on_interact
    event: ReassignOfficerEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
