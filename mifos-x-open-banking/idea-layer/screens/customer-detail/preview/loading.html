<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Customer 360 Profile – loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#4C662B;--on-primary:#FFF;--primary-container:#CDEDA3;--background:#F9FAEF;--surface:#FFF;--surface-variant:#E1E4D5;--outline:#75796C;--outline-variant:#C5C8BA;--text-primary:#1A1C16;--text-secondary:#44483D;--tertiary:#386663;--error:#BA1A1A;--pending:#E8A317;--nav-active:#DCE7C8;--font:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--background);width:390px;min-height:844px;position:relative;overflow-x:hidden}
.top-bar{background:var(--primary);display:flex;align-items:center;padding:0 8px;height:56px;position:sticky;top:0;z-index:10}
.top-bar-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:transparent}
.top-bar-title{flex:1;font-size:18px;font-weight:600;color:var(--on-primary);font-family:var(--font);margin-left:4px}
.hero{background:var(--primary);padding:20px 16px 24px;display:flex;align-items:flex-start;gap:16px}
.avatar-skel{width:60px;height:60px;border-radius:30px;background:rgba(255,255,255,.2)}
.hero-skel{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.skel-line{border-radius:6px;background:rgba(255,255,255,.2);height:16px}
.skel-line.lg{height:22px;width:70%}
.skel-line.sm{height:12px;width:50%}
.skel-line.xs{height:12px;width:40%}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear}
.stats-row{background:var(--background);padding:12px 0;display:flex;justify-content:space-around;border-bottom:1px solid var(--surface-variant)}
.stat-skel{display:flex;flex-direction:column;align-items:center;gap:6px}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--surface-variant);padding:0 4px}
.tab-skel{height:44px;flex:1;margin:4px}
.skel-card{border-radius:12px;height:140px;margin:16px 16px 8px}
.skel-card-sm{border-radius:12px;height:60px;margin:0 16px 8px}
</style>
</head>
<body>
<main data-screen="customer-detail" data-state="loading" role="main">

  <header class="top-bar" role="banner">
    <button class="top-bar-back" aria-label="Back" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" style="fill:var(--on-primary)"/></svg>
    </button>
    <span class="top-bar-title">Customer Profile</span>
  </header>

  <div class="hero" data-component-type="box" data-component-id="customer_header_box" role="presentation">
    <div class="avatar-skel" aria-hidden="true"></div>
    <div class="hero-skel" aria-hidden="true">
      <div class="skel-line lg"></div>
      <div class="skel-line sm"></div>
      <div class="skel-line xs"></div>
    </div>
  </div>

  <div class="stats-row" role="presentation" aria-hidden="true">
    <div class="stat-skel"><div class="skel" style="width:70px;height:16px;border-radius:4px"></div><div class="skel" style="width:50px;height:12px;border-radius:4px"></div></div>
    <div class="stat-skel"><div class="skel" style="width:80px;height:16px;border-radius:4px"></div><div class="skel" style="width:40px;height:12px;border-radius:4px"></div></div>
    <div class="stat-skel"><div class="skel" style="width:60px;height:16px;border-radius:4px"></div><div class="skel" style="width:55px;height:12px;border-radius:4px"></div></div>
  </div>

  <div class="tab-bar" role="presentation" aria-hidden="true">
    <div class="skel tab-skel" style="border-radius:6px"></div>
    <div class="skel tab-skel" style="border-radius:6px"></div>
    <div class="skel tab-skel" style="border-radius:6px"></div>
    <div class="skel tab-skel" style="border-radius:6px"></div>
    <div class="skel tab-skel" style="border-radius:6px"></div>
  </div>

  <div class="skel skel-card" role="presentation" aria-hidden="true"></div>
  <div class="skel skel-card-sm" role="presentation" aria-hidden="true"></div>
  <div class="skel skel-card-sm" role="presentation" aria-hidden="true"></div>
  <div class="skel skel-card-sm" role="presentation" aria-hidden="true"></div>

  <div role="status" aria-live="polite" style="position:absolute;left:-9999px">Loading customer profile…</div>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
