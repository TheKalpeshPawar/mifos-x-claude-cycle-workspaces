<!doctype html>
<html lang="en" data-screen="customer-detail" data-state="loading" data-feature="customer-detail" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Detail — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000;
      --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF;
      --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16;
      --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); color: var(--on-background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--primary); }
    .top-bar .material-icons { color: var(--on-primary); }
    .top-bar h1 { font-size: 18px; font-weight: 600; color: var(--on-primary); }
    .skeleton { background: var(--surface-variant); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .skel-header { height: 80px; background: var(--primary); }
    .skel-stats { display: flex; gap: 8px; padding: 12px 20px; }
    .skel-stat { flex: 1; height: 60px; border-radius: 12px; }
    .skel-tabs { height: 44px; margin: 0 20px; border-radius: 8px; }
    .skel-card { height: 120px; margin: 12px 20px; border-radius: 12px; }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3;
        --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005;
        --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8;
        --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="top-bar"><span class="material-icons">arrow_back</span><h1>Customer</h1></div>
    <div class="skel-header"></div>
    <div class="skel-stats"><div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div></div>
    <div class="skeleton skel-tabs"></div>
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
