type: customer_detail
title: "Customer Profile"
flavor: fieldOfficer
components:
  - type: customer_header
    id: customer_header
    show_name: true
    show_status: true
  - type: tab_group
    id: detail_tabs
    tabs:
      - label: "Overview"
        content: customer_overview
      - label: "KYC"
        content: kyc_status
      - label: "Applications"
        content: applications_list
  - type: button
    id: create_application_button
    label: "Create Application"
    variant: fab
states:
  - loading
  - content
navigation:
  - target: kyc_review
    label: "kyc_review"
  - target: account_applications
    label: "account_applications"
