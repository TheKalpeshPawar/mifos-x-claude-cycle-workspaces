responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      show_components:
        - customer_header_box
      skeleton_components:
        - customer_avatar
        - customer_full_name
        - customer_since_text
        - kyc_verified_badge
        - quick_stats_row
        - stat_accounts_count
        - stat_total_balance
        - stat_last_activity
        - tab_bar
        - tab_overview
        - tab_kyc
        - tab_accounts
        - tab_applications
        - tab_messages
        - personal_info_card
        - view_full_profile_link
        - address_card
        - relationship_manager_card
  content:
    layout:
      show_components:
        - customer_header_box
        - customer_avatar
        - customer_full_name
        - customer_since_text
        - kyc_verified_badge
        - quick_stats_row
        - stat_accounts_count
        - stat_total_balance
        - stat_last_activity
        - tab_bar
        - tab_overview
        - tab_kyc
        - tab_accounts
        - tab_applications
        - tab_messages
        - personal_info_card
        - personal_info_label
        - personal_info_name
        - personal_info_dob
        - personal_info_id
        - personal_info_phone
        - personal_info_email
        - view_full_profile_link
        - address_card
        - address_label
        - address_value
        - relationship_manager_card
        - relationship_manager_label
        - reassign_link
        - kyc_status_banner_verified
        - kyc_verified_text
        - spacer: bottom_actions_spacer
        - create_application_fab
        - send_message_button
      hide_components:
        - kyc_status_banner_pending
        - kyc_pending_text
  error:
    layout:
      show_components:
        - customer_header_box
      hide_components:
        - quick_stats_row
        - tab_bar
        - personal_info_card
        - address_card
        - relationship_manager_card
        - kyc_status_banner_verified
        - kyc_status_banner_pending
        - create_application_fab
        - send_message_button
      error_message: "Unable to load customer details. Check your connection and try again."

  empty:
    layout:
      show_components: []
      hide_components:
        - customer_header_box
        - quick_stats_row
        - tab_bar
        - personal_info_card
        - address_card
        - relationship_manager_card
        - kyc_status_banner_verified
        - kyc_status_banner_pending
        - create_application_fab
        - send_message_button
      empty_message: "Customer record not found. The customer may have been archived or the ID is invalid."

state_model:
  view_model: CustomerDetailViewModel
  state_fields:
    - name: customerId
      type: String
      default: '""'
    - name: customer
      type: "Customer?"
      default: "null"
    - name: accounts
      type: "List<Account>"
      default: "emptyList()"
    - name: selectedTab
      type: CustomerDetailTab
      default: "CustomerDetailTab.OVERVIEW"
    - name: kycStatus
      type: KycStatus
      default: "KycStatus.UNKNOWN"
    - name: totalBalance
      type: Double
      default: "0.0"
    - name: isLoading
      type: Boolean
      default: "true"
  errors:
    - name: networkError
      type: "String?"
      default: "null"
    - name: customerNotFound
      type: "String?"
      default: "null"
  events:
    - TabSwitchedEvent
    - CreateApplicationEvent
    - SendMessageEvent
    - ReassignOfficerEvent
    - ReviewKycEvent
    - RetryLoadEvent
  actions:
    - switch_tab
    - navigate
    - reassign_officer
    - retry_load
  di:
    - CustomerRepository
    - AccountRepository
    - NavigationService

api:
  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/customers/{customerId}"
    tag: Customers
    params:
      - bankId: String
      - customerId: String
    response:
      fields:
        - bank_id: String
        - customer_id: String
        - customer_number: String
        - legal_name: String
        - mobile_phone_number: String
        - email: String
        - face_image: FaceImage
        - date_of_birth: String
        - relationship_status: String
        - dependants: Int
        - dob_of_dependants: "List<String>"
        - credit_rating: CreditRating
        - credit_limit: Amount
        - highest_education_attained: String
        - employment_status: String
        - kyc_status: Boolean
        - last_ok_date: String
        - title: String
        - branch_id: String
        - name_suffix: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 403: "Forbidden — insufficient permissions"
      - 404: "Customer not found"
      - 500: "Internal server error"

  - endpoint: "GET /obp/v3.0.0/banks/{bankId}/customers/{customerId}/accounts"
    tag: Accounts
    params:
      - bankId: String
      - customerId: String
    response:
      fields:
        - accounts: "List<Account>"
        - id: String
        - label: String
        - number: String
        - bank_id: String
        - account_routings: "List<AccountRouting>"
        - balance: Amount
        - account_type: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 403: "Forbidden — insufficient permissions"
      - 404: "Customer or bank not found"
      - 500: "Internal server error"

  - id: obp_customer_account_links
    endpoint: "GET /obp/v5.0.0/banks/{bankId}/customers/{customerId}/customer-account-links"
    tag: Customer
    description: "Get accounts linked to this customer"
    response:
      fields:
        - name: links
          type: "List<CustomerAccountLink>"
        - name: customer_account_link_id
          type: String
        - name: account_id
          type: String

navigation:
  - target: kyc-review
    label: "KYC Review"
    trigger: tab_kyc
  - target: account-applications
    label: "Account Applications"
    trigger: create_application_fab
  - target: customer-messages
    label: "Customer Messages"
    trigger: send_message_button
  - target: customer-profile
    label: "Customer Profile"
    trigger: view_full_profile_link

dependencies:
  tier: fieldOfficer
  features:
    - customer-detail
