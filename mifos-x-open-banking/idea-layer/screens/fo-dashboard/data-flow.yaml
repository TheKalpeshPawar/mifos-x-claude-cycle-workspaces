sibling: data-flow
schema_version: "4.0"
feature_id: fo-dashboard
entries:
  - screen_id: fo-dashboard
    trigger: on_mount
    endpoints:
      - obp_get_fo_customers
    direction: read
    dtos:
      - name: Customer
        role: response
        api_id: obp_get_fo_customers
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: fo-dashboard
    trigger: on_mount
    endpoints:
      - obp_get_fo_applications
    direction: read
    dtos:
      - name: AccountApplication
        role: response
        api_id: obp_get_fo_applications
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: redirect_to_login
      - error_code: 404
        behavior: show_error_state
      - error_code: 500
        behavior: show_error_state

  - screen_id: fo-dashboard
    trigger: on_interact
    event: StatCardClickedEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: fo-dashboard
    trigger: on_interact
    event: AlertActionClickedEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content

  - screen_id: fo-dashboard
    trigger: on_interact
    event: MeetingClickedEvent
    endpoints: []
    direction: none
    dtos: []
    produces_state: content
