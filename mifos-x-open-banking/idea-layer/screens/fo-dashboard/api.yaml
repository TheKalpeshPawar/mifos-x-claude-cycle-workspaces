sibling: api
schema_version: "4.0"
feature_id: fo-dashboard
api:
  - id: obp_get_fo_customers
    endpoint: "GET /obp/v3.0.0/banks/{bankId}/customers"
    tag: Customers
    params:
      - bankId: String
    response:
      fields:
        - customers: "List<Customer>"
        - customer_id: String
        - legal_name: String
        - kyc_status: String
        - customer_number: String
        - mobile_phone_number: String
        - date_of_birth: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"

  - id: obp_get_fo_applications
    endpoint: "GET /obp/v4.0.0/banks/{bankId}/account-applications"
    tag: Account-Applications
    params:
      - bankId: String
    response:
      fields:
        - account_applications: "List<AccountApplication>"
        - account_application_id: String
        - product_code: String
        - proposed_balance: MoneyAmount
        - status: String
        - date_of_application: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"
