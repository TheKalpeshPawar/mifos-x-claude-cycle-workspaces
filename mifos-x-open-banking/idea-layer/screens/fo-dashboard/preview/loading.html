<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0">
<title>Field Officer Dashboard — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4C662B;
  --on-primary:#FFF;
  --primary-container:#CDEDA3;
  --background:#F9FAEF;
  --surface:#FFF;
  --surface-variant:#E1E4D5;
  --outline:#75796C;
  --outline-variant:#C5C8BA;
  --text-primary:#1A1C16;
  --text-secondary:#44483D;
  --tertiary:#386663;
  --error:#BA1A1A;
  --pending:#E8A317;
  --nav-active:#DCE7C8;
  --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--background);
  width:390px;
  min-height:844px;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
}
main{padding-bottom:96px;}

.top-bar{position:relative;padding:20px 16px 0;}
.greeting{font-size:22px;font-weight:600;color:var(--primary);padding-right:88px;line-height:1.3;}
.date-ctx{font-size:13px;color:var(--text-secondary);padding-top:4px;padding-bottom:16px;}

@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
.skel{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);
  background-size:780px 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:8px;
}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px;}
.skel-stat{height:80px;border-radius:12px;}
.skel-section-hdr{height:22px;width:140px;margin:8px 16px 12px;border-radius:6px;}
.skel-alert{height:52px;border-radius:12px;margin:0 16px 8px;}
.skel-meeting{height:52px;border-radius:10px;margin:0 16px 8px;}

.bottom-nav{position:absolute;bottom:0;left:0;width:390px;height:80px;background:var(--surface);border-top:1px solid var(--surface-variant);display:flex;align-items:center;justify-content:space-between;padding:12px 8px 16px;z-index:20;}
.nav-tab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:73px;background:none;border:none;font-family:var(--font);}
.nav-pill{width:56px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.nav-tab.active .nav-pill{background:var(--nav-active);}
.nav-label{font-size:10px;color:var(--text-secondary);font-weight:500;}
.nav-tab.active .nav-label{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<main data-screen="fo-dashboard" data-state="loading" role="main">

  <div class="top-bar">
    <h1 class="greeting" data-component-type="text" data-component-id="greeting_text">Good morning, Priya 👋</h1>
    <p class="date-ctx" data-component-type="text" data-component-id="date_branch_context">Monday, 25 May 2026 · Mifos Nairobi Branch</p>
  </div>

  <div class="stats-grid" aria-hidden="true">
    <div class="skel skel-stat"></div>
    <div class="skel skel-stat"></div>
    <div class="skel skel-stat"></div>
    <div class="skel skel-stat"></div>
  </div>

  <div class="skel skel-section-hdr" aria-hidden="true"></div>
  <div class="skel skel-alert" aria-hidden="true"></div>
  <div class="skel skel-alert" aria-hidden="true"></div>
  <div class="skel skel-alert" aria-hidden="true"></div>
  <div class="skel skel-section-hdr" aria-hidden="true"></div>
  <div class="skel skel-meeting" aria-hidden="true"></div>
  <div class="skel skel-meeting" aria-hidden="true"></div>

  <nav class="bottom-nav" aria-label="Field officer navigation" data-shell="bottom-nav">
    <button class="nav-tab active" aria-label="Dashboard — current" data-nav-to="fo-dashboard">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" style="fill:var(--primary)"/></svg>
      </div>
      <span class="nav-label">Dashboard</span>
    </button>
    <button class="nav-tab" aria-label="Customers" data-nav-to="customer-search">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Customers</span>
    </button>
    <button class="nav-tab" aria-label="Applications" data-nav-to="account-applications">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Applications</span>
    </button>
    <button class="nav-tab" aria-label="Messages" data-nav-to="customer-messages">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">Messages</span>
    </button>
    <button class="nav-tab" aria-label="More options" data-action="open_more_menu">
      <div class="nav-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" style="fill:var(--outline)"/></svg>
      </div>
      <span class="nav-label">More</span>
    </button>
  </nav>

</main>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
