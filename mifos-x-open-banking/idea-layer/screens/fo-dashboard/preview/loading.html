<!doctype html>
<html lang="en" data-screen="fo-dashboard" data-state="loading" data-feature="fo-dashboard" data-flavor="fieldOfficer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FO Dashboard — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --primary: #4C662B; --on-primary: #FFFFFF; --primary-container: #CDEDA3; --on-primary-container: #102000; --secondary: #386663; --on-secondary: #FFFFFF; --error: #BA1A1A; --on-error: #FFFFFF; --background: #F9FAEF; --on-background: #1A1C16; --surface: #FFFFFF; --on-surface: #1A1C16; --surface-variant: #E1E4D5; --on-surface-variant: #44483D; --outline: #75796C; --outline-variant: #C5C8BA; --warning: #E8A317; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--background); display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; padding: 12px 20px; }
    .top-bar-title { font-size: 20px; font-weight: 700; color: var(--primary); }
    .skeleton { background: var(--surface-variant); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .skel-greeting { height: 48px; margin: 4px 20px 16px; border-radius: 8px; }
    .skel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 20px 12px; }
    .skel-stat { height: 72px; border-radius: 12px; }
    .skel-section { height: 16px; width: 120px; margin: 16px 20px 8px; border-radius: 4px; }
    .skel-alert { height: 80px; margin: 0 20px 8px; border-radius: 12px; }
    @media (prefers-color-scheme: dark) { :root { --primary: #B2D188; --on-primary: #1F3701; --primary-container: #354E16; --on-primary-container: #CDEDA3; --secondary: #A0CFCB; --on-secondary: #003735; --error: #FFB4AB; --on-error: #690005; --background: #12140E; --on-background: #E3E3D8; --surface: #12140E; --on-surface: #E3E3D8; --surface-variant: #44483D; --on-surface-variant: #C5C8BA; --outline: #8F9285; --outline-variant: #44483D; --warning: #E8A317; } }
  </style>
</head>
<body>
  <main>
    <div class="top-bar"><span class="top-bar-title">Dashboard</span></div>
    <div class="skeleton skel-greeting"></div>
    <div class="skel-grid"><div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div></div>
    <div class="skeleton skel-section"></div>
    <div class="skeleton skel-alert"></div>
    <div class="skeleton skel-alert"></div>
  </main>
  <script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
