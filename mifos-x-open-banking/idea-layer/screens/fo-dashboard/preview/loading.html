<!doctype html>
<!-- render-hash: fod-loading-01 -->
<html lang="en" data-screen="fo-dashboard" data-state="loading" data-feature="fo-dashboard" data-flavor="fieldOfficer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--nav-active:#DCE7C8;--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:90px}
.hero{background:linear-gradient(120deg,#386663 0%,#1F4E4B 100%);padding:18px 20px 22px;border-radius:0 0 24px 24px}
.hero-skel-pill{width:120px;height:36px;background:rgba(255,255,255,0.18);border-radius:18px;margin-bottom:14px;animation:pulse 1.5s ease-in-out infinite}
.hero-skel-l1{height:24px;width:65%;background:rgba(255,255,255,0.2);border-radius:8px;margin-bottom:6px;animation:pulse 1.5s ease-in-out infinite}
.hero-skel-l2{height:14px;width:40%;background:rgba(255,255,255,0.16);border-radius:7px;animation:pulse 1.5s ease-in-out infinite}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
.tile-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:104px}.tile-skel .icon{width:32px;height:32px;border-radius:10px}.tile-skel .v{height:22px;width:50%}.tile-skel .l{height:10px;width:75%}
.title-skel{height:14px;width:140px;margin:18px 20px 10px}
.row-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:14px;margin:0 20px 8px;padding:14px;display:flex;align-items:center;gap:12px}.row-skel .icon{width:40px;height:40px;border-radius:12px}.row-skel .body{flex:1;display:flex;flex-direction:column;gap:6px}.row-skel .l1{height:13px;width:55%}.row-skel .l2{height:11px;width:80%}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav-item .material-icons{font-size:var(--icon-sm);color:var(--on-surface-variant)}.nav-item .label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons{color:#102000}.nav-item.active .label{color:#102000;font-weight:600}
[data-theme="light"]{--primary:#4C662B;--primary-container:#CDEDA3;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}[data-theme="dark"]{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--nav-active:#354E16}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--primary-container:#354E16;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline-variant:#44483D;--nav-active:#354E16}.hero{background:linear-gradient(120deg,#1F4E4B 0%,#003735 100%)}.nav-item.active .material-icons,.nav-item.active .label{color:#CDEDA3}}</style>
</head>
<body><main>
<section class="hero"><div class="hero-skel-pill"></div><div class="hero-skel-l1"></div><div class="hero-skel-l2"></div></section>
<div class="grid"><div class="tile-skel"><div class="skel icon"></div><div class="skel v"></div><div class="skel l"></div></div><div class="tile-skel"><div class="skel icon"></div><div class="skel v"></div><div class="skel l"></div></div><div class="tile-skel"><div class="skel icon"></div><div class="skel v"></div><div class="skel l"></div></div><div class="tile-skel"><div class="skel icon"></div><div class="skel v"></div><div class="skel l"></div></div></div>
<div class="skel title-skel"></div>
<div class="row-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div></div>
<div class="row-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div></div></div>
</main>
<nav class="bottom-nav"><div class="nav-item active"><span class="material-icons">dashboard</span><span class="label">Dashboard</span></div><div class="nav-item"><span class="material-icons">people</span><span class="label">Customers</span></div><div class="nav-item"><span class="material-icons">description</span><span class="label">Apps</span></div><div class="nav-item"><span class="material-icons">mail</span><span class="label">Messages</span></div><div class="nav-item"><span class="material-icons">more_vert</span><span class="label">More</span></div></nav>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
