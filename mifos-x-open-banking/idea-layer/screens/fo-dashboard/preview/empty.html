<!doctype html>
<!-- render-hash: fod-empty-01 -->
<html lang="en" data-screen="fo-dashboard" data-state="empty" data-feature="fo-dashboard" data-flavor="fieldOfficer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard — Quiet day</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:90px;display:flex;flex-direction:column}
.hero{background:linear-gradient(120deg,#386663 0%,#1F4E4B 100%);color:#FFFFFF;padding:18px 20px 22px;border-radius:0 0 24px 24px}
.officer-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.14);padding:6px 12px 6px 6px;border-radius:999px;width:fit-content;margin-bottom:14px}.officer-avatar{width:28px;height:28px;border-radius:14px;background:#BCEBE7;color:#00201E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.officer-name{font-size:13px;font-weight:600}
.greeting h1{font-size:22px;font-weight:700;letter-spacing:-0.3px}.context{font-size:13px;opacity:0.85;margin-top:4px}
.empty-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;text-align:center}
.empty-icon{width:96px;height:96px;border-radius:48px;background:var(--primary-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.empty-icon .material-icons{font-size:48px;color:var(--on-primary-container)}
.empty-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.empty-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:320px;margin-bottom:24px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.btn{padding:12px 22px;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.btn .material-icons{font-size:18px}.btn-primary{background:var(--primary);color:var(--on-primary);border:none}.btn-secondary{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative}.nav-item .material-icons{font-size:22px;color:var(--on-surface-variant)}.nav-item .label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons{color:var(--on-primary-container)}.nav-item.active .label{color:var(--on-primary-container);font-weight:600}.nav-item.active::before{content:'';position:absolute;top:6px;width:48px;height:28px;background:var(--nav-active);border-radius:14px;z-index:-1}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--on-primary-container:#102000;--secondary:#386663;--secondary-container:#BCEBE7;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--surface-container:#F0F1E6;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--on-primary-container:#CDEDA3;--secondary:#A0CFCB;--secondary-container:#1F4E4B;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--surface-container:#1E201A;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}.hero{background:linear-gradient(120deg,#1F4E4B 0%,#003735 100%)}}</style>
</head>
<body><main>
<section class="hero"><div class="officer-chip"><div class="officer-avatar">PK</div><div class="officer-name">Priya K. · FO</div></div><div class="greeting"><h1>Good morning, Priya</h1><div class="context">Westlands Branch · 25 May 2026</div></div></section>
<div class="empty-card"><div class="empty-icon"><span class="material-icons">beach_access</span></div><h2 class="empty-title">A quiet day ahead</h2><p class="empty-msg">No pending applications, KYC tasks, or meetings scheduled today. Catch up on customers or visit a community.</p><div class="actions"><button class="btn btn-primary" data-nav-to="customer-search" tabindex="0" aria-label="Find customers"><span class="material-icons">people</span>Find customers</button><button class="btn btn-secondary" data-nav-to="agent-registration" tabindex="0" aria-label="Register a new customer">Register new</button></div></div>
</main>
<nav class="bottom-nav" aria-label="Primary">
<div class="nav-item active" data-nav-to="fo-dashboard" tabindex="0"><span class="material-icons">dashboard</span><span class="label">Dashboard</span></div>
<div class="nav-item" data-nav-to="customer-search" tabindex="0"><span class="material-icons">people</span><span class="label">Customers</span></div>
<div class="nav-item" data-nav-to="account-applications" tabindex="0"><span class="material-icons">description</span><span class="label">Apps</span></div>
<div class="nav-item" data-nav-to="customer-messages" tabindex="0"><span class="material-icons">mail</span><span class="label">Messages</span></div>
<div class="nav-item" data-nav-to="settings" tabindex="0"><span class="material-icons">more_vert</span><span class="label">More</span></div>
</nav>
<script src="../../preview/_shared/preview-runtime.js"></script></body></html>
