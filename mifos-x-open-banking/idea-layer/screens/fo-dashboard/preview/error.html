<!doctype html>
<!-- render-hash: fod-error-01 -->
<html lang="en" data-screen="fo-dashboard" data-state="error" data-feature="fo-dashboard" data-flavor="fieldOfficer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;display:flex;flex-direction:column;padding-bottom:90px}
.hero{background:linear-gradient(120deg,#386663 0%,#1F4E4B 100%);color:#FFFFFF;padding:18px 20px;border-radius:0 0 24px 24px}
.officer-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.14);padding:6px 12px 6px 6px;border-radius:999px;width:fit-content}.officer-avatar{width:28px;height:28px;border-radius:14px;background:#BCEBE7;color:#00201E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.officer-name{font-size:13px;font-weight:600}
.error-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.error-icon{width:96px;height:96px;border-radius:48px;background:var(--error-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.error-icon .material-icons{font-size:48px;color:var(--error)}
.error-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.error-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;margin-bottom:8px;max-width:320px}
.offline-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-variant);color:var(--on-surface-variant);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;margin-bottom:24px}.offline-pill .material-icons{font-size:14px}
.actions{display:flex;gap:10px}.btn{padding:12px 22px;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:var(--primary);color:var(--on-primary);border:none}.btn-secondary{background:transparent;color:var(--primary);border:1px solid var(--outline)}.btn .material-icons{font-size:18px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative}.nav-item .material-icons{font-size:22px;color:var(--on-surface-variant)}.nav-item .label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons{color:#102000}.nav-item.active .label{color:#102000;font-weight:600}.nav-item.active::before{content:'';position:absolute;top:6px;width:48px;height:28px;background:var(--nav-active);border-radius:14px;z-index:-1}
[data-theme="light"]{--primary:#4C662B;--on-primary:#FFFFFF;--primary-container:#CDEDA3;--secondary:#386663;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F9FAEF;--on-background:#1A1C16;--surface:#FFFFFF;--surface-variant:#E1E4D5;--on-surface-variant:#44483D;--outline:#75796C;--outline-variant:#C5C8BA;--nav-active:#DCE7C8}[data-theme="dark"]{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}@media (prefers-color-scheme:dark){:root{--primary:#B2D188;--on-primary:#1F3701;--primary-container:#354E16;--secondary:#A0CFCB;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#12140E;--on-background:#E3E3D8;--surface:#1E201A;--surface-variant:#44483D;--on-surface-variant:#C5C8BA;--outline:#8F9285;--outline-variant:#44483D;--nav-active:#354E16}.hero{background:linear-gradient(120deg,#1F4E4B 0%,#003735 100%)}.nav-item.active .material-icons,.nav-item.active .label{color:#CDEDA3}}</style>
</head>
<body><main>
<section class="hero"><div class="officer-chip"><div class="officer-avatar">PK</div><div class="officer-name">Priya K. · FO</div></div></section>
<div class="error-wrap"><div class="error-icon"><span class="material-icons">signal_wifi_off</span></div><h2 class="error-title">Dashboard unavailable</h2><p class="error-msg">We can't reach the operations server. Your offline records are safe — sync will resume automatically.</p><div class="offline-pill"><span class="material-icons">cloud_off</span>Working offline · 8 unsynced records</div><div class="actions"><button class="btn btn-secondary" data-action="open_offline_queue" tabindex="0" aria-label="View offline queue">Offline queue</button><button class="btn btn-primary" data-action="retry_load_dashboard" tabindex="0" aria-label="Retry"><span class="material-icons">refresh</span>Retry</button></div></div>
</main>
<nav class="bottom-nav"><div class="nav-item active" data-nav-to="fo-dashboard"><span class="material-icons">dashboard</span><span class="label">Dashboard</span></div><div class="nav-item" data-nav-to="customer-search"><span class="material-icons">people</span><span class="label">Customers</span></div><div class="nav-item" data-nav-to="account-applications"><span class="material-icons">description</span><span class="label">Apps</span></div><div class="nav-item" data-nav-to="customer-messages"><span class="material-icons">mail</span><span class="label">Messages</span></div><div class="nav-item" data-nav-to="settings"><span class="material-icons">more_vert</span><span class="label">More</span></div></nav>
<script src="../../preview/_shared/preview-runtime.js"></script></body></html>
