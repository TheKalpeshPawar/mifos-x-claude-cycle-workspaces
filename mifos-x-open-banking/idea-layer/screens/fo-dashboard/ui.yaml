states:
  loading:
    layout:
      show_components:
        - greeting_text
        - date_branch_context
      skeleton_components:
        - stats_grid
        - stat_active_customers
        - stat_pending_applications
        - stat_kyc_pending
        - stat_meetings_today
        - action_needed_header
        - alert_kyc_expiry_john
        - alert_application_pending_sarah
        - alert_new_lead_peter
        - action_corporate_onboard
        - schedule_header
        - meeting_row_1
        - meeting_row_2
  content:
    layout:
      show_components:
        - greeting_text
        - date_branch_context
        - stats_grid
        - stat_active_customers
        - stat_active_customers_value
        - stat_active_customers_label
        - stat_pending_applications
        - stat_pending_applications_value
        - stat_pending_applications_label
        - stat_kyc_pending
        - stat_kyc_pending_value
        - stat_kyc_pending_label
        - stat_meetings_today
        - stat_meetings_today_value
        - stat_meetings_today_label
        - action_needed_header
        - alert_kyc_expiry_john
        - alert_kyc_expiry_john_text
        - alert_kyc_review_button
        - alert_application_pending_sarah
        - alert_application_pending_sarah_text
        - alert_view_application_button
        - alert_new_lead_peter
        - alert_new_lead_peter_text
        - alert_start_onboarding_button
        - action_corporate_onboard
        - action_corporate_title
        - action_corporate_btn
        - schedule_header
        - meeting_row_1
        - meeting_1_time
        - meeting_1_details
        - meeting_row_2
        - meeting_2_time
        - meeting_2_details
  error:
    layout:
      show_components:
        - greeting_text
        - date_branch_context
      hide_components:
        - stats_grid
        - action_needed_header
        - schedule_header
      error_message: "Unable to load dashboard data. Check your connection and try again."

state_model:
  view_model: FoDashboardViewModel
  state_fields:
    - name: officerName
      type: String
      default: '"Priya"'
    - name: branchName
      type: String
      default: '"Mifos Nairobi Branch"'
    - name: activeCustomerCount
      type: Int
      default: "0"
    - name: pendingApplicationCount
      type: Int
      default: "0"
    - name: kycPendingCount
      type: Int
      default: "0"
    - name: meetingsTodayCount
      type: Int
      default: "0"
    - name: actionAlerts
      type: "List<ActionAlert>"
      default: "emptyList()"
    - name: todayMeetings
      type: "List<Meeting>"
      default: "emptyList()"
    - name: isLoading
      type: Boolean
      default: "true"
  errors:
    - name: networkError
      type: "String?"
      default: "null"
  events:
    - StatCardClickedEvent
    - AlertActionClickedEvent
    - MeetingClickedEvent
  actions:
    - navigate
  di:
    - CustomerRepository
    - AccountApplicationRepository
    - MeetingRepository
    - NavigationService

api:
  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/customers"
    tag: Customers
    params:
      - bankId: String
    response:
      fields:
        - customers: "List<Customer>"
        - customer_id: String
        - legal_name: String
        - kyc_status: String
        - customer_number: String
        - mobile_phone_number: String
        - date_of_birth: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"

  - endpoint: "GET /obp/v5.1.0/banks/{bankId}/account-applications"
    tag: Account-Applications
    params:
      - bankId: String
    response:
      fields:
        - account_applications: "List<AccountApplication>"
        - account_application_id: String
        - product_code: String
        - proposed_balance: Amount
        - status: String
        - date_of_application: String
    errors:
      - 401: "Unauthorized — missing or invalid token"
      - 404: "Bank not found"
      - 500: "Internal server error"

navigation:
  - target: customer-search
    label: "Customer Search"
  - target: account-applications
    label: "Account Applications"
  - target: kyc-review
    label: "KYC Review"
  - target: meetings
    label: "Meetings"
  - target: corporate-onboarding
    label: "Corporate Onboarding"
    trigger: action_corporate_onboard
  - target: profile
    label: "Profile"
    trigger: top_bar_avatar
  - target: settings
    label: "Settings"
    trigger: bottom_nav_more

dependencies:
  tier: fieldOfficer
  features:
    - fo-dashboard
