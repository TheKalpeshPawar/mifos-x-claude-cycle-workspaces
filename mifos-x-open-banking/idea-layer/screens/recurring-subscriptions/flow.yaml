feature: pfm
flow_ref: pfm-review

entry_points:
  - source: pfm-dashboard
    label: "Tap 'Subscriptions' chip on PFM dashboard"

transitions:
  # Tapping a subscription row opens merchant-filtered transaction history.
  # Implemented as an in-ViewModel action (showMerchantTransactionHistory)
  # that navigates to the existing `transactions` screen with a merchant filter.
  - trigger: show_merchant_transaction_history
    from: recurring-subscriptions
    to: transactions
    params:
      merchant_filter: string
    label: "Tap subscription row → filtered transaction history"
