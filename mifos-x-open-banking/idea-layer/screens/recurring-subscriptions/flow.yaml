feature: pfm
flow_ref: pfm-review

entry_points:
  - source: pfm-dashboard
    label: "Tap 'Subscriptions' chip on PFM dashboard"

transitions:
  # Tapping a subscription row opens merchant-filtered transaction history.
  # on_click action: navigate_transactions (target: transactions, params.merchant).
  # ViewModel exposes navigateTransactions(merchant: String) which emits the nav event.
  - trigger: navigate_transactions
    from: recurring-subscriptions
    to: transactions
    params:
      merchant: string
    label: "Tap subscription row → filtered transaction history"
