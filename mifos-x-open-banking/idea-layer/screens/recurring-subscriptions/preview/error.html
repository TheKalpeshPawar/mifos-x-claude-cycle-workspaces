<!doctype html>
<!-- render-hash: d9c2f4b8e6a3 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recurring Payments — error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&display=swap" />
  <style>
    /* ─── Design tokens — M3 light palette ──────────────────────── */
    :root {
      --md-primary:                  #266489;
      --md-on-primary:               #FFFFFF;
      --md-primary-container:        #C9E6FF;
      --md-on-primary-container:     #004B6F;
      --md-secondary:                #50606E;
      --md-on-secondary:             #FFFFFF;
      --md-secondary-container:      #D3E5F5;
      --md-on-secondary-container:   #384956;
      --md-error:                    #BA1A1A;
      --md-on-error:                 #FFFFFF;
      --md-error-container:          #FFDAD6;
      --md-on-error-container:       #93000A;
      --md-background:               #F7F9FF;
      --md-on-background:            #181C20;
      --md-surface:                  #F7F9FF;
      --md-on-surface:               #181C20;
      --md-surface-variant:          #DDE3EA;
      --md-on-surface-variant:       #41474D;
      --md-outline:                  #72787E;
      --md-outline-variant:          #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low:    #F1F4F9;
      --md-surface-container:        #EBEEF3;
      --md-surface-container-high:   #E5E8ED;
      --md-surface-container-highest:#E0E3E8;

      /* Typography */
      --fs-headline-small: 24px; --lh-headline-small: 32px;
      --fs-title-large:    22px; --lh-title-large:    28px;
      --fs-title-medium:   16px; --lh-title-medium:   24px; --fw-title-medium: 500;
      --fs-body-medium:    14px; --lh-body-medium:    20px;
      --fs-label-large:    14px; --lh-label-large:    20px; --fw-label-large:  500;
      --fs-label-medium:   12px; --lh-label-medium:   16px; --fw-label-medium: 500;

      /* Spacing */
      --sp-4: 4px;  --sp-8: 8px;  --sp-12: 12px; --sp-16: 16px;
      --sp-24: 24px; --sp-32: 32px; --sp-48: 48px;

      /* Shape */
      --radius-xs: 4px;  --radius-sm: 8px;   --radius-md: 12px;
      --radius-lg: 16px; --radius-xl: 28px;  --radius-full: 9999px;

      /* Motion */
      --duration-short: 150ms;
      --easing-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);

      /* Chrome heights */
      --top-bar-height: 64px;
      --bottom-nav-height: 80px;

      /* Minimum touch target */
      --min-touch: 48px;
    }

    /* ─── Dark palette — system preference ──────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary:                  #95CDF7;
        --md-on-primary:               #00344E;
        --md-primary-container:        #004B6F;
        --md-on-primary-container:     #C9E6FF;
        --md-secondary:                #B7C9D9;
        --md-on-secondary:             #22323F;
        --md-secondary-container:      #384956;
        --md-on-secondary-container:   #D3E5F5;
        --md-error:                    #FFB4AB;
        --md-on-error:                 #690005;
        --md-error-container:          #93000A;
        --md-on-error-container:       #FFDAD6;
        --md-background:               #101417;
        --md-on-background:            #E0E3E8;
        --md-surface:                  #101417;
        --md-on-surface:               #E0E3E8;
        --md-surface-variant:          #41474D;
        --md-on-surface-variant:       #C1C7CE;
        --md-outline:                  #8B9198;
        --md-outline-variant:          #41474D;
        --md-surface-container-lowest: #0B0F12;
        --md-surface-container-low:    #181C20;
        --md-surface-container:        #1C2024;
        --md-surface-container-high:   #262A2E;
        --md-surface-container-highest:#313539;
      }
    }

    /* ─── Dark palette — explicit override via viewer ────────────── */
    [data-theme="dark"] {
      --md-primary:                  #95CDF7;
      --md-on-primary:               #00344E;
      --md-primary-container:        #004B6F;
      --md-on-primary-container:     #C9E6FF;
      --md-secondary:                #B7C9D9;
      --md-on-secondary:             #22323F;
      --md-secondary-container:      #384956;
      --md-on-secondary-container:   #D3E5F5;
      --md-error:                    #FFB4AB;
      --md-on-error:                 #690005;
      --md-error-container:          #93000A;
      --md-on-error-container:       #FFDAD6;
      --md-background:               #101417;
      --md-on-background:            #E0E3E8;
      --md-surface:                  #101417;
      --md-on-surface:               #E0E3E8;
      --md-surface-variant:          #41474D;
      --md-on-surface-variant:       #C1C7CE;
      --md-outline:                  #8B9198;
      --md-outline-variant:          #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low:    #181C20;
      --md-surface-container:        #1C2024;
      --md-surface-container-high:   #262A2E;
      --md-surface-container-highest:#313539;
    }

    /* ─── Reset + base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ─── App shell ─────────────────────────────────────────────── */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background-color: var(--md-background);
    }

    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      height: var(--top-bar-height);
      padding: 0 var(--sp-4);
      background-color: var(--md-surface-container-low);
      flex-shrink: 0;
    }

    .top-app-bar-leading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      transition: background-color var(--duration-short) var(--easing-emphasis);
      flex-shrink: 0;
    }
    .top-app-bar-leading:hover {
      background-color: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
    }
    .top-app-bar-leading:focus-visible {
      outline: 2px solid var(--md-primary);
      outline-offset: 2px;
    }

    .top-app-bar-title {
      flex: 1;
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: 400;
      color: var(--md-on-surface);
      padding: 0 var(--sp-12);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .screen-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-32) var(--sp-24);
      background-color: var(--md-background);
      overflow-y: auto;
    }

    .bottom-nav {
      display: flex;
      align-items: stretch;
      height: var(--bottom-nav-height);
      background-color: var(--md-surface-container);
      border-top: 1px solid var(--md-outline-variant);
      flex-shrink: 0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-4);
      border: none;
      background: transparent;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      padding: var(--sp-12) var(--sp-4) var(--sp-16);
      min-width: 0;
    }
    .nav-item .nav-label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: var(--fw-label-medium);
      color: inherit;
      text-align: center;
      white-space: nowrap;
    }
    .nav-item .material-symbols-outlined { font-size: 24px; }

    /* ─── Error state ───────────────────────────────────────────── */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--sp-16);
      max-width: 280px;
    }

    .error-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      border-radius: var(--radius-full);
      background-color: var(--md-error-container);
    }
    .error-icon-wrap .material-symbols-outlined {
      font-size: 48px;
      color: var(--md-on-error-container);
    }

    .error-text { display: flex; flex-direction: column; gap: var(--sp-8); }

    .error-title {
      font-size: var(--fs-headline-small);
      line-height: var(--lh-headline-small);
      font-weight: 400;
      color: var(--md-on-surface);
    }

    .error-body {
      font-size: var(--fs-body-medium);
      line-height: var(--lh-body-medium);
      color: var(--md-on-surface-variant);
    }

    /* Outlined button — retry action */
    .btn-outlined {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--min-touch);
      min-width: 120px;
      padding: 0 var(--sp-24);
      border-radius: var(--radius-full);
      border: 1px solid var(--md-outline);
      background: transparent;
      color: var(--md-primary);
      font-family: 'Roboto', sans-serif;
      font-size: var(--fs-label-large);
      line-height: var(--lh-label-large);
      font-weight: var(--fw-label-large);
      cursor: pointer;
      letter-spacing: 0.01em;
      transition:
        background-color var(--duration-short) var(--easing-emphasis),
        border-color     var(--duration-short) var(--easing-emphasis);
      margin-top: var(--sp-8);
    }
    .btn-outlined:hover {
      background-color: color-mix(in srgb, var(--md-primary) 8%, transparent);
    }
    .btn-outlined:focus-visible {
      outline: 2px solid var(--md-primary);
      outline-offset: 2px;
    }
    .btn-outlined:active {
      background-color: color-mix(in srgb, var(--md-primary) 12%, transparent);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ── Top app bar ──────────────────────────────────────────── -->
    <header class="top-app-bar" role="banner">
      <button class="top-app-bar-leading"
              data-action="navigate_back"
              aria-label="Navigate back">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar-title">Recurring Payments</h1>
    </header>

    <!-- ── Error state content ─────────────────────────────────── -->
    <main class="screen-content"
          data-screen="recurring-subscriptions"
          data-state="error"
          aria-label="Error loading recurring payments">

      <div class="error-state" role="alert" aria-live="assertive">
        <div class="error-icon-wrap">
          <span class="material-symbols-outlined" aria-hidden="true">error</span>
        </div>
        <div class="error-text">
          <h2 class="error-title">Could not analyse transactions</h2>
          <p class="error-body">
            We couldn't load your transaction history. Please try again.
          </p>
        </div>
        <button class="btn-outlined"
                data-action="retry_load_subscriptions"
                aria-label="Retry loading recurring payments">
          Try again
        </button>
      </div>

    </main>

    <!-- ── Bottom navigation (4-tab: Home·Accounts·Transactions·More) ── -->
    <!-- Sub-screen pushed onto back stack — no tab is active             -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" data-nav-to="home" aria-label="Home">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-nav-to="accounts" aria-label="Accounts">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
        <span class="nav-label">Accounts</span>
      </button>
      <button class="nav-item" data-nav-to="transactions" aria-label="Transactions">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
        <span class="nav-label">Transactions</span>
      </button>
      <button class="nav-item" data-nav-to="settings" aria-label="More">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
        <span class="nav-label">More</span>
      </button>
    </nav>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
