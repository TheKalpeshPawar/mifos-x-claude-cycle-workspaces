<!doctype html>
<!-- render-hash: b7f3a9e2d6c1 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recurring Payments — loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&display=swap" />
  <style>
    /* ─── Design tokens — M3 light palette ──────────────────────── */
    :root {
      --md-primary:                  #266489;
      --md-on-primary:               #FFFFFF;
      --md-primary-container:        #C9E6FF;
      --md-on-primary-container:     #004B6F;
      --md-secondary:                #50606E;
      --md-on-secondary:             #FFFFFF;
      --md-secondary-container:      #D3E5F5;
      --md-on-secondary-container:   #384956;
      --md-error:                    #BA1A1A;
      --md-on-error:                 #FFFFFF;
      --md-error-container:          #FFDAD6;
      --md-on-error-container:       #93000A;
      --md-background:               #F7F9FF;
      --md-on-background:            #181C20;
      --md-surface:                  #F7F9FF;
      --md-on-surface:               #181C20;
      --md-surface-variant:          #DDE3EA;
      --md-on-surface-variant:       #41474D;
      --md-outline:                  #72787E;
      --md-outline-variant:          #C1C7CE;
      --md-surface-container-lowest: #FFFFFF;
      --md-surface-container-low:    #F1F4F9;
      --md-surface-container:        #EBEEF3;
      --md-surface-container-high:   #E5E8ED;
      --md-surface-container-highest:#E0E3E8;

      /* Typography */
      --fs-title-large:  22px; --lh-title-large: 28px;
      --fs-label-medium: 12px; --lh-label-medium: 16px; --fw-label-medium: 500;

      /* Spacing */
      --sp-4: 4px;  --sp-8: 8px;  --sp-12: 12px; --sp-16: 16px;
      --sp-24: 24px; --sp-32: 32px; --sp-48: 48px;

      /* Shape */
      --radius-xs: 4px;  --radius-sm: 8px;   --radius-md: 12px;
      --radius-lg: 16px; --radius-xl: 28px;  --radius-full: 9999px;

      /* Motion */
      --duration-short: 150ms; --duration-medium: 300ms;
      --easing-emphasis: cubic-bezier(0.2, 0.0, 0, 1.0);

      /* Chrome heights */
      --top-bar-height: 64px;
      --bottom-nav-height: 80px;
    }

    /* ─── Dark palette — system preference ──────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary:                  #95CDF7;
        --md-on-primary:               #00344E;
        --md-primary-container:        #004B6F;
        --md-on-primary-container:     #C9E6FF;
        --md-secondary:                #B7C9D9;
        --md-on-secondary:             #22323F;
        --md-secondary-container:      #384956;
        --md-on-secondary-container:   #D3E5F5;
        --md-error:                    #FFB4AB;
        --md-on-error:                 #690005;
        --md-error-container:          #93000A;
        --md-on-error-container:       #FFDAD6;
        --md-background:               #101417;
        --md-on-background:            #E0E3E8;
        --md-surface:                  #101417;
        --md-on-surface:               #E0E3E8;
        --md-surface-variant:          #41474D;
        --md-on-surface-variant:       #C1C7CE;
        --md-outline:                  #8B9198;
        --md-outline-variant:          #41474D;
        --md-surface-container-lowest: #0B0F12;
        --md-surface-container-low:    #181C20;
        --md-surface-container:        #1C2024;
        --md-surface-container-high:   #262A2E;
        --md-surface-container-highest:#313539;
      }
    }

    /* ─── Dark palette — explicit override via viewer ────────────── */
    [data-theme="dark"] {
      --md-primary:                  #95CDF7;
      --md-on-primary:               #00344E;
      --md-primary-container:        #004B6F;
      --md-on-primary-container:     #C9E6FF;
      --md-secondary:                #B7C9D9;
      --md-on-secondary:             #22323F;
      --md-secondary-container:      #384956;
      --md-on-secondary-container:   #D3E5F5;
      --md-error:                    #FFB4AB;
      --md-on-error:                 #690005;
      --md-error-container:          #93000A;
      --md-on-error-container:       #FFDAD6;
      --md-background:               #101417;
      --md-on-background:            #E0E3E8;
      --md-surface:                  #101417;
      --md-on-surface:               #E0E3E8;
      --md-surface-variant:          #41474D;
      --md-on-surface-variant:       #C1C7CE;
      --md-outline:                  #8B9198;
      --md-outline-variant:          #41474D;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low:    #181C20;
      --md-surface-container:        #1C2024;
      --md-surface-container-high:   #262A2E;
      --md-surface-container-highest:#313539;
    }

    /* ─── Reset + base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-background);
      height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ─── App shell ─────────────────────────────────────────────── */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background-color: var(--md-background);
    }

    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      height: var(--top-bar-height);
      padding: 0 var(--sp-4);
      background-color: var(--md-surface-container-low);
      flex-shrink: 0;
    }

    .top-app-bar-leading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      flex-shrink: 0;
    }

    .top-app-bar-title {
      flex: 1;
      font-size: var(--fs-title-large);
      line-height: var(--lh-title-large);
      font-weight: 400;
      color: var(--md-on-surface);
      padding: 0 var(--sp-12);
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: var(--sp-16);
      background-color: var(--md-background);
    }

    .bottom-nav {
      display: flex;
      align-items: stretch;
      height: var(--bottom-nav-height);
      background-color: var(--md-surface-container);
      border-top: 1px solid var(--md-outline-variant);
      flex-shrink: 0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-4);
      border: none;
      background: transparent;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      padding: var(--sp-12) var(--sp-4) var(--sp-16);
      min-width: 0;
    }
    .nav-item .nav-label {
      font-size: var(--fs-label-medium);
      line-height: var(--lh-label-medium);
      font-weight: var(--fw-label-medium);
      color: inherit;
      text-align: center;
      white-space: nowrap;
    }
    .nav-item .material-symbols-outlined { font-size: 24px; }

    /* ─── Shimmer animation ─────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position: 600px 0; }
    }

    .shimmer {
      background: linear-gradient(
        90deg,
        var(--md-surface-container-high)     25%,
        var(--md-surface-container-highest)  50%,
        var(--md-surface-container-high)     75%
      );
      background-size: 1200px 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: var(--radius-sm);
    }

    /* ─── Skeleton blocks — mirror content.html structure ────────── */
    .skeleton-padding { padding: var(--sp-16); }

    /* Banner skeleton */
    .skeleton-banner {
      margin: var(--sp-16) var(--sp-16) 0;
      padding: var(--sp-12) var(--sp-16);
      background-color: var(--md-surface-container);
      border-radius: var(--radius-md);
      display: flex;
      align-items: flex-start;
      gap: var(--sp-12);
    }
    .skeleton-banner-icon {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .skeleton-banner-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--sp-8);
    }
    .skeleton-line-full  { height: 14px; width: 100%; }
    .skeleton-line-75    { height: 14px; width: 75%; }
    .skeleton-line-50    { height: 14px; width: 50%; }
    .skeleton-line-40    { height: 14px; width: 40%; }
    .skeleton-line-30    { height: 14px; width: 30%; }

    /* Summary card skeleton */
    .skeleton-summary {
      margin: var(--sp-16) var(--sp-16) 0;
      padding: var(--sp-16);
      background-color: var(--md-surface-container);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: var(--sp-8);
    }
    .skeleton-amount { height: 36px; width: 45%; }

    /* List rows skeleton */
    .skeleton-list {
      margin-top: var(--sp-16);
    }

    .skeleton-row {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-16);
      padding: var(--sp-12) var(--sp-16);
      min-height: 80px;
    }
    .skeleton-row + .skeleton-row {
      border-top: 1px solid var(--md-outline-variant);
    }

    .skeleton-circle {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      margin-top: var(--sp-4);
    }

    .skeleton-row-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--sp-8);
    }
    .skeleton-row-top {
      display: flex;
      justify-content: space-between;
      gap: var(--sp-8);
    }
    .skeleton-merchant { height: 16px; width: 40%; }
    .skeleton-amount-trail { height: 16px; width: 18%; }
    .skeleton-support { height: 14px; width: 55%; }
    .skeleton-chip    { height: 32px; width: 80px; border-radius: var(--radius-full); }

    /* Accessibility: hide shimmer from AT, announce loading region */
    .loading-region {
      position: absolute;
      width: 1px;
      height: 1px;
      clip: rect(0, 0, 0, 0);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ── Top app bar ──────────────────────────────────────────── -->
    <header class="top-app-bar" role="banner">
      <button class="top-app-bar-leading"
              data-action="navigate_back"
              aria-label="Navigate back">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <h1 class="top-app-bar-title">Recurring Payments</h1>
    </header>

    <!-- ── Shimmer skeleton content ────────────────────────────── -->
    <main class="screen-content"
          data-screen="recurring-subscriptions"
          data-state="loading"
          aria-label="Recurring Payments"
          aria-busy="true">

      <!-- Live region for screen readers -->
      <div class="loading-region" role="status" aria-live="polite" aria-atomic="true">
        Analysing transaction history…
      </div>

      <!-- Banner skeleton — mirrors detected_notice banner -->
      <div class="skeleton-banner" aria-hidden="true">
        <div class="shimmer skeleton-banner-icon"></div>
        <div class="skeleton-banner-lines">
          <div class="shimmer skeleton-line-full"></div>
          <div class="shimmer skeleton-line-75"></div>
        </div>
      </div>

      <!-- Summary card skeleton — mirrors summary_card -->
      <div class="skeleton-summary" aria-hidden="true">
        <div class="shimmer skeleton-line-50"></div>
        <div class="shimmer skeleton-amount"></div>
        <div class="shimmer skeleton-line-30"></div>
      </div>

      <!-- 5 subscription row skeletons — mirrors subscription_row × 5 -->
      <div class="skeleton-list" aria-hidden="true">

        <div class="skeleton-row">
          <div class="shimmer skeleton-circle"></div>
          <div class="skeleton-row-body">
            <div class="skeleton-row-top">
              <div class="shimmer skeleton-merchant"></div>
              <div class="shimmer skeleton-amount-trail"></div>
            </div>
            <div class="shimmer skeleton-support"></div>
            <div class="shimmer skeleton-chip"></div>
          </div>
        </div>

        <div class="skeleton-row">
          <div class="shimmer skeleton-circle"></div>
          <div class="skeleton-row-body">
            <div class="skeleton-row-top">
              <div class="shimmer skeleton-merchant" style="width:35%"></div>
              <div class="shimmer skeleton-amount-trail"></div>
            </div>
            <div class="shimmer skeleton-support" style="width:60%"></div>
            <div class="shimmer skeleton-chip"></div>
          </div>
        </div>

        <div class="skeleton-row">
          <div class="shimmer skeleton-circle"></div>
          <div class="skeleton-row-body">
            <div class="skeleton-row-top">
              <div class="shimmer skeleton-merchant" style="width:30%"></div>
              <div class="shimmer skeleton-amount-trail"></div>
            </div>
            <div class="shimmer skeleton-support" style="width:50%"></div>
            <div class="shimmer skeleton-chip"></div>
          </div>
        </div>

        <div class="skeleton-row">
          <div class="shimmer skeleton-circle"></div>
          <div class="skeleton-row-body">
            <div class="skeleton-row-top">
              <div class="shimmer skeleton-merchant" style="width:48%"></div>
              <div class="shimmer skeleton-amount-trail" style="width:22%"></div>
            </div>
            <div class="shimmer skeleton-support" style="width:58%"></div>
            <div class="shimmer skeleton-chip"></div>
          </div>
        </div>

        <div class="skeleton-row">
          <div class="shimmer skeleton-circle"></div>
          <div class="skeleton-row-body">
            <div class="skeleton-row-top">
              <div class="shimmer skeleton-merchant" style="width:38%"></div>
              <div class="shimmer skeleton-amount-trail"></div>
            </div>
            <div class="shimmer skeleton-support" style="width:52%"></div>
            <div class="shimmer skeleton-chip"></div>
          </div>
        </div>

      </div>
    </main>

    <!-- ── Bottom navigation (4-tab: Home·Accounts·Transactions·More) ── -->
    <!-- Sub-screen pushed onto back stack — no tab is active             -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" data-nav-to="home" aria-label="Home">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-nav-to="accounts" aria-label="Accounts">
        <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
        <span class="nav-label">Accounts</span>
      </button>
      <button class="nav-item" data-nav-to="transactions" aria-label="Transactions">
        <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
        <span class="nav-label">Transactions</span>
      </button>
      <button class="nav-item" data-nav-to="settings" aria-label="More">
        <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>
        <span class="nav-label">More</span>
      </button>
    </nav>
  </div>

  <script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
