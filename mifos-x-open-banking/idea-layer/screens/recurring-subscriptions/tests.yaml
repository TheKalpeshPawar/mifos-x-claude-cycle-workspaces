screen_id: recurring-subscriptions

scenarios:
  # ── Loading state ────────────────────────────────────────────────
  - id: TC-RS-001
    description: "Loading state shows shimmer skeleton while pattern-detection algorithm runs"
    state: loading
    given: "Screen mounted; DataStore transaction cache read is in progress"
    when: "RecurringSubscriptionsViewModel.loadSubscriptions() has not yet resolved"
    then:
      - "loading_skeleton shimmer rows are visible"
      - "No subscription list, summary card, or banner is shown"
      - "App bar title 'Recurring Payments' is visible"
    priority: high

  # ── Content state ────────────────────────────────────────────────
  - id: TC-RS-002
    description: "Content state renders 7 detected subscriptions sorted by monthly cost descending"
    state: content
    given: >
      Transaction cache contains: PureGym £24.99/mo, Spotify £11.99/mo,
      Netflix £10.99/mo, Adobe Lightroom £143.88/yr, Amazon Prime £8.99/mo,
      Apple TV+ £8.99/mo, Disney+ £7.99/mo — each with ≥2 qualifying occurrences
    when: "Screen mounts and recurring_detect trigger completes"
    then:
      - "detected_notice banner is visible"
      - "summary_amount shows '£85.93'"
      - "summary_count shows '7 subscriptions detected'"
      - "First row is PureGym (£24.99) — highest monthly cost"
      - "Adobe Lightroom row shows cadence 'Annual' and amount '£143.88'"
      - "Every row shows a 'Detected' assist chip badge"
    priority: high

  - id: TC-RS-003
    description: "Annual cadence amount normalised to monthly equivalent in total"
    state: content
    given: "Transaction cache yields only Adobe Lightroom with Annual cadence: £143.88/yr"
    when: "recurring_detect trigger completes"
    then:
      - "summary_amount shows '£11.99' (£143.88 ÷ 12, rounded 2dp)"
      - "Adobe Lightroom row label shows '£143.88' (the actual charge amount)"
      - "Cadence field reads 'Annual'"
    priority: high

  - id: TC-RS-004
    description: "Tapping a subscription row dispatches show_merchant_transaction_history"
    state: content
    given: "Content state with 7 subscriptions rendered"
    when: "User taps the Netflix subscription row"
    then:
      - "show_merchant_transaction_history action fires"
      - "params.merchant = 'Netflix'"
      - "ViewModel routes user to merchant-filtered transaction history"
    priority: medium

  - id: TC-RS-005
    description: "Total is sum of all monthly-equivalent amounts across all cadences"
    state: content
    given: "7-subscription demo-data set loaded"
    when: "Screen renders"
    then:
      - "summary_amount = £85.93 (24.99 + 11.99 + 10.99 + 11.99 + 8.99 + 8.99 + 7.99)"
      - "Annual Adobe Lightroom contributes £11.99 (£143.88 / 12) to the total"
    priority: medium

  # ── Empty state ──────────────────────────────────────────────────
  - id: TC-RS-006
    description: "Empty state when fewer than 2 qualifying occurrences per merchant"
    state: empty
    given: "Transaction cache has only one occurrence per merchant (insufficient for pattern detection)"
    when: "Screen mounts and recurring_detect trigger yields zero qualifying patterns"
    then:
      - "empty_state component is visible with autorenew icon"
      - "Title 'No recurring payments detected' is shown"
      - "Body explains patterns will appear as more transactions load"
      - "No subscription list or summary card is visible"
    priority: high

  # ── Error state ──────────────────────────────────────────────────
  - id: TC-RS-007
    description: "Error state renders when DataStore read throws IOException"
    state: error
    given: "DataStore throws IOException during cached transaction read"
    when: "recurring_detect trigger propagates on_error"
    then:
      - "error_state component is visible with error_outline icon"
      - "Error title and descriptive body text are shown"
      - "'Try again' outlined button is visible and tappable"
      - "No subscription list, summary card, or loading skeleton is shown"
    priority: high

  - id: TC-RS-008
    description: "Retry button resets to loading state and re-runs detection"
    state: error
    given: "Screen is in error state after a failed cache read"
    when: "User taps the 'Try again' button"
    then:
      - "State transitions to loading (shimmer visible)"
      - "loadSubscriptions() is reinvoked"
      - "On second success: state transitions to content with correct subscription list"
    priority: medium

  # ── Cadence normalisation edge cases ─────────────────────────────
  - id: TC-RS-009
    description: "Weekly cadence amount normalised to monthly equivalent in summary total"
    state: content
    given: "Transaction cache yields Gym Membership with Weekly cadence at £10.00 per week (≥2 occurrences within ±5 day tolerance)"
    when: "recurring_detect trigger completes"
    then:
      - "summary_amount shows '£43.33' (£10.00 × 52 / 12, rounded to 2dp)"
      - "Gym Membership row trailing_content shows '£10.00' (per-occurrence charge, not normalised)"
      - "supporting_text cadence segment reads 'Weekly'"
    priority: high

  - id: TC-RS-010
    description: "Fortnightly cadence amount normalised to monthly equivalent in summary total"
    state: content
    given: "Transaction cache yields Council Tax payment with Fortnightly cadence at £25.00 per fortnight (≥2 occurrences within ±5 day tolerance)"
    when: "recurring_detect trigger completes"
    then:
      - "summary_amount shows '£54.17' (£25.00 × 26 / 12, rounded to 2dp)"
      - "Council Tax row trailing_content shows '£25.00'"
      - "supporting_text cadence segment reads 'Fortnightly'"
    priority: medium

  # ── Merchant name normalisation ───────────────────────────────────
  - id: TC-RS-011
    description: "Merchant normalisation merges legal-suffix variants into single subscription row"
    state: content
    given: >
      Transaction cache contains monthly payments for:
      'NETFLIX.COM UK LTD' (2 occurrences), 'Netflix UK Ltd' (1 occurrence),
      'NETFLIX INC' (1 occurrence) — all within ±5 day monthly window
    when: "recurring_detect trigger applies lower-case + strip-legal-suffix + collapse-whitespace normalisation"
    then:
      - "subscriptions_list contains exactly 1 Netflix entry (not 3 separate rows)"
      - "row label shows normalised name 'Netflix' (or closest clean form)"
      - "Cadence reads 'Monthly' based on 4 merged occurrences"
      - "detected_badge chip is visible on the merged row"
    priority: high
