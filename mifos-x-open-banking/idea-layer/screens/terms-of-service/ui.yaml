id: terms-of-service
name: "Terms of Service"
feature: shared
flavor: shared
status: approved
quality_score: 92
schema_version: "3.1"
contract_version: "1.1.0"
approve_hash: "sha256:tos1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0ab"
approved_at: "2026-05-28T00:00:00Z"
approved_by: "/idea completeness"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-002, terms, legal]
status_history:
  - status: draft
    timestamp: "2026-05-28T00:00:00Z"
  - from: draft
    to: approved
    at: "2026-05-28T00:00:00Z"
    by: "/idea completeness"
    contract_version: "1.1.0"
    bypass_flags: []

screens:
  - id: terms-of-service
    name: "Terms of Service"
    viewmodel: "TermsOfServiceViewModel"
    route: /legal/terms

archetype: settings

shell:
  top_app_bar:
    show: true
    title: "Terms of Service"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: tos_root
    variant: column
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    children:
      - tos_scroll_content
      - tos_last_updated_text

  # ── Scrollable legal content ──────────────────────────────────────────────────

  - type: stack
    id: tos_scroll_content
    variant: column
    style:
      padding_bottom: spacing.xl
    children:
      - tos_intro_card
      - tos_acceptance_card
      - tos_account_usage_card
      - tos_data_handling_card
      - tos_prohibited_card
      - tos_liability_card
      - tos_dispute_card
      - tos_governing_law_card

  # ── Acceptance Section ────────────────────────────────────────────────────────

  - type: card
    id: tos_intro_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_intro_header
      - tos_intro_body

  - type: text
    id: tos_intro_header
    content: "Agreement Overview"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Agreement Overview"
    test_context:
      purpose: "Section header for the agreement overview"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_intro_body
    content: "These Terms of Service govern your use of Mifos X Open Banking, provided by the Mifos Initiative (\"we\", \"us\", or \"our\"). By accessing or using this application, you agree to be bound by these terms. If you do not agree, please discontinue use immediately."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Agreement overview text"
    test_context:
      purpose: "Introduction paragraph summarising the terms agreement"
      interaction_type: display
      data_driven: false

  # ── Account Usage Section ─────────────────────────────────────────────────────

  - type: card
    id: tos_account_usage_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_account_usage_header
      - tos_account_usage_body

  - type: text
    id: tos_account_usage_header
    content: "Account Usage"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Account Usage"
    test_context:
      purpose: "Section header for account usage terms"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_account_usage_body
    content: "You are responsible for maintaining the confidentiality of your DirectLogin credentials. Your account must not be shared with or transferred to any other party. You must immediately notify us of any unauthorised access or suspected security breach. We reserve the right to suspend accounts suspected of fraudulent activity."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Account usage terms"
    test_context:
      purpose: "Account usage obligations and responsibilities"
      interaction_type: display
      data_driven: false

  # ── Acceptance Section ────────────────────────────────────────────────────────

  - type: card
    id: tos_acceptance_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_acceptance_header
      - tos_acceptance_body

  - type: text
    id: tos_acceptance_header
    content: "Acceptance of Terms"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Acceptance of Terms"
    test_context:
      purpose: "Section header for acceptance clause"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_acceptance_body
    content: "By creating an account or continuing to use Mifos X Open Banking after changes to these terms are posted, you confirm your acceptance. We will notify you of material changes via in-app notification at least 14 days before they take effect. Your continued use constitutes acceptance."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Acceptance of terms"
    test_context:
      purpose: "Acceptance clause with notification obligations"
      interaction_type: display
      data_driven: false

  # ── Data Handling Section ─────────────────────────────────────────────────────

  - type: card
    id: tos_data_handling_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_data_handling_header
      - tos_data_handling_body

  - type: text
    id: tos_data_handling_header
    content: "Data Handling via Open Bank Project API"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Data Handling via Open Bank Project API"
    test_context:
      purpose: "Section header for data handling via OBP"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_data_handling_body
    content: "This application connects to banking services via the Open Bank Project (OBP) REST API, operated by Open Bank Project Limited. Data transmitted includes account identifiers, transaction records, and payment instructions. You authorise us to retrieve and transmit your financial data through OBP on your behalf. OBP's own API usage terms apply in conjunction with these terms."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Data handling via OBP API"
    test_context:
      purpose: "Data handling and OBP API integration clause"
      interaction_type: display
      data_driven: false

  # ── Prohibited Uses ───────────────────────────────────────────────────────────

  - type: card
    id: tos_prohibited_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_prohibited_header
      - tos_prohibited_body

  - type: text
    id: tos_prohibited_header
    content: "Prohibited Uses"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Prohibited Uses"
    test_context:
      purpose: "Section header for prohibited uses"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_prohibited_body
    content: "You must not use this application to: (a) initiate fraudulent or unauthorised transactions; (b) attempt to reverse-engineer, decompile, or extract source code; (c) circumvent security controls or rate limits imposed by OBP; (d) engage in money laundering, terrorist financing, or any activity prohibited under applicable AML/CTF regulations; (e) scrape or systematically harvest financial data beyond your own accounts."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Prohibited uses list"
    test_context:
      purpose: "Enumerated prohibited activities"
      interaction_type: display
      data_driven: false

  # ── Liability Section ─────────────────────────────────────────────────────────

  - type: card
    id: tos_liability_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_liability_header
      - tos_liability_body

  - type: text
    id: tos_liability_header
    content: "Limitation of Liability"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Limitation of Liability"
    test_context:
      purpose: "Section header for liability limitation"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_liability_body
    content: "To the maximum extent permitted by law, the Mifos Initiative shall not be liable for indirect, incidental, special, consequential, or punitive damages arising from your use of this application. Our total liability for any claim shall not exceed the greater of £100 or amounts paid by you in the preceding 12 months. This limitation does not apply to death, personal injury, or fraud caused by our negligence."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Limitation of liability clause"
    test_context:
      purpose: "Liability cap and exclusions"
      interaction_type: display
      data_driven: false

  # ── Dispute Resolution ────────────────────────────────────────────────────────

  - type: card
    id: tos_dispute_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_dispute_header
      - tos_dispute_body

  - type: text
    id: tos_dispute_header
    content: "Dispute Resolution"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Dispute Resolution"
    test_context:
      purpose: "Section header for dispute resolution"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_dispute_body
    content: "We encourage you to contact us at legal@mifos.org before initiating any formal dispute. If a dispute cannot be resolved informally within 30 days, either party may refer the matter to the Financial Ombudsman Service (UK) where applicable, or to binding arbitration under the London Court of International Arbitration (LCIA) rules."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Dispute resolution process"
    test_context:
      purpose: "Dispute escalation pathway and arbitration clause"
      interaction_type: display
      data_driven: false

  # ── Governing Law ─────────────────────────────────────────────────────────────

  - type: card
    id: tos_governing_law_card
    variant: filled
    supported_states: [idle]
    style:
      background: "#FFFFFF"
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_governing_law_header
      - tos_governing_law_body

  - type: text
    id: tos_governing_law_header
    content: "Governing Law"
    variant: title_medium
    style:
      typography: "Outfit/title_medium"
      color: "#4C662B"
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Governing Law"
    test_context:
      purpose: "Section header for governing law"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_governing_law_body
    content: "These Terms of Service are governed by and construed in accordance with the laws of England and Wales. As an FCA-adjacent application interfacing with regulated financial data, we adhere to applicable Financial Conduct Authority (FCA) guidance and GDPR obligations under UK GDPR and the Data Protection Act 2018. EU users are additionally protected under Regulation (EU) 2016/679 (GDPR)."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      line_height: "1.6"
    a11y:
      role: text
      label: "Governing law and jurisdiction"
    test_context:
      purpose: "Jurisdiction, FCA alignment, and GDPR compliance statement"
      interaction_type: display
      data_driven: false

  # ── Last Updated Footer ───────────────────────────────────────────────────────

  - type: text
    id: tos_last_updated_text
    content: "Last updated: 28 May 2026 — Version 1.0"
    variant: body_small
    style:
      typography: "Outfit/body_small"
      color: "#C5C8BA"
      alignment: center
      padding_top: spacing.md
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Terms last updated 28 May 2026 version 1.0"
    test_context:
      purpose: "Version stamp so users know when terms were last revised"
      interaction_type: display
      data_driven: false

  # ── Loading Skeleton ──────────────────────────────────────────────────────────

  - type: skeleton
    id: tos_loading_skeleton
    variant: settings
    style:
      background: "#F9FAEF"
      padding: spacing.lg
    a11y:
      role: progressbar
      label: "Loading terms of service"
    test_context:
      purpose: "Shimmer while static content loads from asset/remote source"
      interaction_type: display
      data_driven: false

  # ── Error State ───────────────────────────────────────────────────────────────

  - type: stack
    id: tos_error_state
    variant: column
    style:
      alignment: center
      padding: spacing.xl
    children:
      - tos_error_icon
      - tos_error_message
      - tos_retry_button

  - type: icon
    id: tos_error_icon
    content: "gavel"
    style:
      color: "#BA1A1A"
      size: "48dp"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: image
      label: "Error loading terms"
    test_context:
      purpose: "Error icon when terms content cannot be retrieved"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_error_message
    content: "Unable to load Terms of Service. Please check your connection and try again."
    variant: body_medium
    style:
      typography: "Outfit/body_medium"
      color: "#44483D"
      alignment: center
      padding_bottom: spacing.md
    a11y:
      role: text
      label: "Unable to load Terms of Service"
    test_context:
      purpose: "Error message when TOS content fails to load"
      interaction_type: display
      data_driven: false

  - type: button
    id: tos_retry_button
    label: "Retry"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      border_color: "#4C662B"
      color: "#4C662B"
      typography: "Outfit/label_large"
      alignment: center
    on_click:
      action: retry_load
      target: terms-of-service
      intent: api
    a11y:
      role: button
      label: "Retry loading Terms of Service"
    keyboard:
      focusable: true
    test_context:
      purpose: "Retry button to reload terms content after failure"
      interaction_type: action
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - tos_scroll_content
      - tos_last_updated_text
  loading:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - tos_loading_skeleton
    note: "Shimmer while bundled TOS content deserializes"
  error:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components:
      - tos_error_state
    note: "Shown when bundled asset load fails"
  empty:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - tos_scroll_content
    show_empty_state: false
    note: "TOS always has static content — empty state not applicable"

state_model:
  TermsOfServiceViewModel:
    screen_state: TermsOfServiceUiState
    state:
      - field: termsContent
        type: String
        default: "\"\""
      - field: scrollPosition
        type: Int
        default: "0"
      - field: isLoading
        type: Boolean
        default: "true"
    errors:
      - id: load_failed
        message: "Failed to load Terms of Service."
    events: [OnBack, OnRetry, OnScrollPositionChanged]
    actions: [onRetry(), onScrollPositionChanged(position: Int)]
    di: [LegalContentRepository]

navigation:
  - id: nav_back
    target: about
    on_click:
      action: navigate_back

dependencies:
  tier: feature
  features: [shared-core]
