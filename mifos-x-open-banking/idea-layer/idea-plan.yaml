# ─── §9 REQUIREMENTS ────────────────────────────────────────────────────────
requirements:
  _status: approved
  _quality_score: 88
  _source: idea_layer_screens
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    # Authentication & Consent (HSBC FAPI — replaces OBP DirectLogin, migration 2026-06-11)
    - id: FR-001
      feature_ref: bank-authorize-handoff
      description: "User authenticates via HSBC Open Banking OAuth2 (FAPI 1.0 Advanced): client onboards via Dynamic Client Registration, then consent → PSU authorisation (authorization_code + PKCE, mTLS, detached JWS) → access token. Replaces OBP DirectLogin. There is no in-app password — SCA happens at the bank."
    - id: FR-002
      feature_ref: consent-intro
      description: "User starts the 'Connect your HSBC account' journey from an intro screen explaining what Open Banking data sharing means."
    - id: FR-003
      feature_ref: consent-request
      description: "User selects the data-sharing permissions and the app creates an account-access consent (status AWAU) before redirecting to the bank to authorise."
    - id: FR-004
      feature_ref: auth-callback
      description: "On deep-link return the app exchanges the authorisation code for a consent-scoped access token and confirms the consent reached AUTH before reading any account data."
    - id: FR-005
      feature_ref: consent-expired
      description: "When a prior consent is EXPD/RJCT or revoked, the user is routed to re-consent rather than into the app."
    # Consumer Banking — Account Information (AISP, read-only, consent-gated)
    - id: FR-010
      feature_ref: home
      description: "Consumer sees account summary cards, recent transactions, and quick-action shortcuts on the home dashboard."
    - id: FR-011
      feature_ref: accounts
      description: "Consumer can view all authorised accounts (current, savings) with balance and status."
    - id: FR-012
      feature_ref: account-detail
      description: "Consumer can view individual account details including balances and recent transactions."
    - id: FR-013
      feature_ref: transactions
      description: "Consumer can browse transaction history with date range filtering and text search."
    - id: FR-015
      feature_ref: beneficiaries
      description: "Consumer can view their read-only beneficiaries from the AISP feed (add/edit/delete is not supported under Open Banking)."
    - id: FR-018
      feature_ref: standing-orders
      description: "Consumer can view their read-only standing orders and open standing-order detail."
    - id: FR-019
      feature_ref: direct-debits
      description: "Consumer can view active direct debit mandates and their detail (read-only under AISP)."
    - id: FR-024
      feature_ref: pfm-dashboard
      description: "Consumer can view spending insights, budget progress, and category breakdowns over connected accounts."
    - id: FR-025
      feature_ref: products
      description: "Consumer can browse product reference data and compare available banking products."
    - id: FR-026
      feature_ref: transaction-tags
      description: "Consumer can tag and categorize transactions for personal tracking (local PFM annotation)."
    - id: FR-027
      feature_ref: business-insights
      description: "Consumer can view business cashflow insights across their connected accounts."
    # Consumer Banking — Payments (PISP — consent → authorise → submit → status)
    - id: FR-014
      feature_ref: send-money
      description: "Consumer can initiate a payment by selecting a payee/account and payment kind (domestic, scheduled, standing-order, international), then confirming."
    - id: FR-041
      feature_ref: send-money
      description: "Consumer enters the transfer amount and the app runs a Confirmation-of-Funds check against the source account balance before continuing."
    - id: FR-043
      feature_ref: send-money
      description: "Consumer sees a terminal payment result (amount, payee, payment id) after the bank authorisation and submission, with links to transaction detail and back to home."
    - id: FR-044
      feature_ref: standing-orders-create
      description: "Consumer authors and edits a domestic standing order (amount, frequency, start/end date, beneficiary) via the PISP standing-order consent flow."
    - id: FR-045
      feature_ref: send-money
      description: "Consumer can initiate an international (cross-currency) payment with exchange-rate information surfaced before authorising."
    - id: FR-046
      feature_ref: send-money
      description: "Payment authorisation is performed at HSBC via a redirect handoff (SCA at the bank); the app submits the payment only after the consent is authorised and never collects an SCA code in-app."
    # New capabilities
    - id: FR-022
      feature_ref: consent-manager
      description: "Consumer can review and revoke active data-sharing consents granted to the app."
    - id: FR-023
      feature_ref: notifications
      description: "Consumer receives in-app event notifications (consent-revoked, payment status) via the Event Notification feed."
    - id: FR-020
      feature_ref: atm-locator
      description: "Consumer can find nearby ATMs and branches using geolocation via unauthenticated Open Data."

