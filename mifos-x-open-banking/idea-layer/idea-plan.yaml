            cross-cutting prerequisites gate every feature in it and are not per-feature work:
            a Pisp.kt Ktorfit client (core/network/api ships only Aisp.kt and OAuth.kt), and a
            detached-JWS signer plus idempotency-key handling. Without the signer every write
            returns 400 U019, so nothing in P3 can be device-verified until it lands.
          prerequisites:
            - "core/network/api/Pisp.kt — Ktorfit interface for the five PISP endpoints"
            - "Detached JWS (PS256, b64:false + crit) extending the shipped signPs256"
            - "x-idempotency-key generation, persisted across retries of a staged payment"
            - "payments-scope client-credentials token path (OAuth.kt mints accounts scope only)"

