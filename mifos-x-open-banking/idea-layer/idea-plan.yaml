# ─── §3 VISION ──────────────────────────────────────────────────────────────
vision:
  _status: approved
  _quality_score: 93
  _source: source_analysis
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    elevator_pitch: "A production-ready Kotlin Multiplatform consumer Open Banking app — a regulated TPP (AISP + PISP) on HSBC's UK/CE sandbox. The user connects their HSBC account by consent, views accounts, balances, and transactions, and initiates payments (domestic, scheduled, standing-order, international, VRP) — all gated by redirect-based authorisation with SCA at the bank."
    problem_statement: "People want to see all their banking in one trusted app and move money safely without sharing their bank password. Open Banking (PSD2 / OBIE) enables this via consent + redirect authorisation, but building a compliant FAPI 1.0 Advanced TPP client (mTLS, DCR, detached JWS, consent lifecycle) is hard. This project is a cross-platform reference TPP against the HSBC UK/CE sandbox."
    target_users: "Retail banking consumers who want to connect their HSBC account via Open Banking to view their finances in one place and initiate payments — without entering a bank password in a third-party app."
    success_criteria:
      - "All 14 HSBC Open Banking API groups (85 endpoints) integrated with Ktorfit service interfaces over mTLS"
      - "Consumer app ships on Android, iOS, Desktop, Web from one codebase"
      - "Account-access consent journey reaches AUTH status end-to-end against the HSBC sandbox"
      - "Domestic payment completes consent → authorise → submit → settled status"
      - "Consumer can start a payment in under 3 taps from home"
    scope:
      - Account Information (AIS) — consent-gated accounts, balances, transactions, beneficiaries, standing orders, direct debits, scheduled payments, party, products, statements (read-only)
      - Payments (PIS) — domestic, scheduled, standing-order, international (+ file/bulk, VRP)
      - Confirmation of Funds (CoF) and Open Data (ATM/branch + product reference)
      - Event Notification + consent management
      - Multi-platform deployment (Android, iOS, Desktop, Web)
    known_limitations:
      - Event notifications are short-poll today; real-time push is post-v1.0
      - HSBC sandbox only — production needs real TPP enrolment + eIDAS (QWAC/QSEAL) certs
      - AISP surfaces are read-only — beneficiaries cannot be added/edited; no card-management API
      - File/bulk + Multi-Bill payment screens deferred (UK Business bulk)
    differentiators:
      - "Regulated TPP architecture — consent + redirect authorisation, SCA at the bank, no in-app password"
      - "OBIE UK Open Banking Read/Write v4.0 on HSBC's sandbox — real bank standard, not microfinance-specific"
      - "Full KMP coverage: Android + iOS + Desktop + Web from shared Kotlin"

