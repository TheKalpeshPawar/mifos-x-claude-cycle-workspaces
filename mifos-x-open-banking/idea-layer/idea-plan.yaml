          - "Read-only beneficiaries, standing orders, direct debits, products"
          - "Consumer bottom nav: Home, Accounts, Pay, Insights, More"
        exit_criteria: "Consumer can browse accounts, balances, transactions, and read-only AIS data"

      - name: "Phase 3 — Payments (PISP, P0)"
        weeks: "W9–W12"
        priority: P0
        features:
          - send-money
          - send-money-confirm
          - standing-orders-create
        deliverables:
          - "Domestic payment end-to-end (consent → authorise at bank → submit → poll status)"
          - "Confirmation-of-Funds check on amount entry"
          - "Domestic scheduled + standing-order payments"
          - "International (cross-currency) payment with exchange-rate information"
        exit_criteria: "Consumer can initiate and authorise a payment; result reaches a settled status"

      - name: "Phase 4 — Advanced Capabilities (P1)"
        weeks: "W13–W15"
