# ─── §3 VISION ──────────────────────────────────────────────────────────────
vision:
  _status: approved
  _quality_score: 93
  _source: source_analysis
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    elevator_pitch: "A production-ready Kotlin Multiplatform open banking application providing consumer self-service banking (accounts, payments, cards, PFM) and field officer agent banking (customer onboarding, KYC review, application management) — powered by Open Bank Project API v7."
    problem_statement: "Financial institutions adopting open banking standards need a cross-platform reference app that demonstrates both consumer-facing digital banking and agent-assisted field operations, while remaining compliant with OBP API v7 specifications."
    target_users: "Retail banking consumers managing accounts, payments, and cards across devices; field officers performing customer onboarding, KYC verification, and account application reviews in the field."
    success_criteria:
      - "All 21 OBP API tags integrated with Ktorfit service interfaces"
      - "Both product flavors (consumer + fieldOfficer) ship on Android, iOS, Desktop, Web"
      - "Offline-first via Room KMP with sync-on-reconnect for critical flows"
      - "KYC onboarding flow end-to-end in under 5 minutes on field officer persona"
      - "Consumer can complete send-money flow in under 3 taps from home"
    scope:
      - Consumer retail banking (accounts, transactions, payments, cards)
      - Field officer agent banking (onboarding, KYC, applications)
      - Personal finance management (spending insights, budgets)
      - Multi-platform deployment (Android, iOS, Desktop, Web)
    known_limitations:
      - No real-time push notifications (polling-based)
      - OBP sandbox only — production bank integration requires bank-specific OAuth setup
      - Biometric auth not yet implemented
    differentiators:
      - "Dual-persona architecture via product flavors — single codebase, two distinct apps"
      - "OBP API v7 (not Fineract) — open banking standard, not microfinance-specific"
      - "Full KMP coverage: Android + iOS + Desktop + Web from shared Kotlin"

# ─── §4 PERSONAS ────────────────────────────────────────────────────────────
personas:
  _status: approved
  _quality_score: 93
  _source: idea_layer_rebuild
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    - name: Priya
      role: Consumer (Retail Banking)
      description: "A retail banking customer who manages multiple accounts, sends money to beneficiaries, tracks spending, and monitors card activity across devices."
      needs: [Account overview, Transaction history with search, Send money to saved beneficiaries, Card management and freeze, Standing order management, ATM/branch locator, Personal finance insights]
      jobs_to_be_done:
        - "When I receive my salary, I want to see it reflected across all my accounts instantly so I can plan my spending."
        - "When I need to pay rent, I want to send money to my landlord in under 3 taps from the home screen."
        - "When I travel abroad, I want to check FX rates and find nearby ATMs so I never run out of cash."
      pain_points: ["Slow cross-platform sync", "Too many taps to complete payments", "No spending categorization"]
      primary_screens: [home, accounts, transactions, send-money, cards, pfm-dashboard]
    - name: Kwame
      role: Field Officer (Agent Banking)
      description: "A microfinance field officer who visits rural communities to onboard new customers, verify KYC documents, process account applications, and maintain customer relationships."
      needs: [Customer search and 360-view, KYC document verification, Account application review, Customer onboarding (individual and corporate), Meeting scheduling, Secure messaging with customers]
      jobs_to_be_done:
        - "When I visit a village, I want to onboard a new customer end-to-end on my phone before I leave."
        - "When a customer submits KYC documents, I want to verify them in the field so they don't wait weeks."
        - "When I have 20 pending applications, I want to review and approve them sorted by urgency."
      pain_points: ["Limited connectivity in rural areas", "Paper-based fallback for KYC", "No offline queue for applications"]
      primary_screens: [fo-dashboard, customer-search, customer-onboarding, kyc-review, account-applications]
    - name: Anika
      role: Operations Manager
      description: "A branch or regional manager who monitors field officer performance, reviews agent registrations, and oversees application pipelines."
      needs: [Dashboard metrics, Application pipeline overview, Agent registration approval, Consent management oversight]
      jobs_to_be_done:
        - "When new agents register, I want to verify credentials and approve them before they start field work."
        - "When I review weekly metrics, I want to see which field officers are falling behind on onboarding targets."
      pain_points: ["No centralized view of all field officers", "Manual reporting"]
      primary_screens: [fo-dashboard, account-applications, agent-registration]

