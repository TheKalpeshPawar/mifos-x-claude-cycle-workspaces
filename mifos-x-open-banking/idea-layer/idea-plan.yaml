  requirements:
    _tag: "§requirements"
    _status: draft
    _quality_score: 75
    _source: wizard
    content:
      functional_requirements:
        - id: FR-001
          description: "Perform Dynamic Client Registration (DCR) once per brand using the signed SSA to obtain client credentials."
          priority: must
          acceptance_criteria: ["POST /register with PS256-signed JWS returns a client_id stored securely."]
        - id: FR-002
          description: "Run the FAPI consent journey: client_credentials token → create account-access-consent → app-to-app authorize (auth code + PKCE + signed request object) → token exchange."
          priority: must
          acceptance_criteria: ["Consent reaches Authorised; PSU-bound access token + refresh token obtained against the HSBC sandbox."]
        - id: FR-003
          description: "List authorised accounts and show account detail."
          priority: must
          acceptance_criteria: ["GET /accounts and GET /accounts/{id} render real sandbox data."]
        - id: FR-004
          description: "Show balances per account."
          priority: must
        - id: FR-005
          description: "Show transactions with date and credit/debit filtering, plus transaction detail."
          priority: must
        - id: FR-006
          description: "Show beneficiaries, standing orders, direct debits, scheduled payments (read-only)."
          priority: should
        - id: FR-007
          description: "Show statements (list + detail) and account product information and party (account holder) details."
          priority: should
        - id: FR-008
          description: "Provide a consent dashboard: active consents, granted permissions, expiry, revoke, and 90-day reconfirmation."
          priority: must
          acceptance_criteria: ["DELETE /account-access-consents/{id} revokes; reconfirm re-runs authorize before 90 days."]
        # ── FR-009 + FR-010 REMOVED 2026-07-30 (/idea-sync stale reconciliation) ──
        # Both were orphaned: no features[] entry referenced either, because the
        # multi-currency and atm-locator features were deleted in the 2026-07-28
        # reverse sync while their requirements were left behind.
        #
        #   FR-009 "Display multi-currency accounts (Global Money / Global Wallet)."
        #     Removed as a REQUIREMENT, not as behaviour. There is no dedicated
        #     multi-currency surface and AccountFilter deliberately offers no Global
        #     chip (a Global Money wallet reports CACC, indistinguishable from a
        #     current account, so the chip could never match). Global Money and Global
        #     Wallet accounts DO render in the accounts list under Current, and
        #     AccountUiType still carries GLOBAL_MONEY / GLOBAL_WALLET — that behaviour
        #     stays documented in screens/accounts and screens/home.
        #
        #   FR-010 "ATM locator via HSBC Open Data (unauthenticated)."
        #     No screen, no repository, no Aisp call. AccountDetailChip.AtmLocator
        #     ships and navigates, but only to PlaceholderScreen("ATM locator"); that
        #     chip stays documented in screens/account-detail as an explicit
        #     placeholder binding.
        - id: FR-011
          description: "Client-side personal finance management derived from AIS transactions: categorization, spending-by-category, monthly budgets, recurring/subscription detection, income-vs-expense, and net worth. No payment initiation; no additional API."
          priority: should
          acceptance_criteria: ["Transactions are categorized and summarized in-app; budgets track against category spend; recurring payments are detected from transaction patterns."]
          retained_because: >-
            NOT orphaned — the transactions feature still claims it, and the client-side
            primitives genuinely ship: SpendingCalculator.computeSpendingSnapshot,
            SpendingSnapshot and the 7-value TransactionCategory enum all exist in
            core/data. Only the four PFM SCREENS were removed. Scoped down accordingly:
            the dashboard, budgets and drill-down surfaces are out of scope; the
            per-transaction category tag is not.
        # ── PISP requirements added 2026-07-30 (/idea-evolve scope reversal) ──
        - id: FR-012
          description: >-
            Initiate a consumer domestic payment (PISP): the PSU selects one of their own
            authorised accounts as debtor, a saved payee or a manually entered sort code and
            account number as creditor, an amount and an optional reference, reviews the
            payment, and confirms.
          priority: must
          acceptance_criteria:
            - "POST /domestic-payment-consents returns 201 with Status AwaitingAuthorisation."
            - "POST /domestic-payments returns 201 with a DomesticPaymentId after authorisation."
            - "Amount is validated against the selected account's available balance before the review step."
        - id: FR-013
          description: >-
            Complete the PISP app-to-app authorisation round trip on scope=payments: validate
            the redirect state and nonce, exchange the code for a PSU access token, and poll
            the payment consent until it reaches Authorised.
          priority: must
          acceptance_criteria:
            - "A state or nonce mismatch is rejected before any token exchange is attempted."
            - "The payments-scope token is never persisted into ConsentSession — the AIS session token is untouched."
            - "Submit is gated on the consent reaching Authorised, since a non-Authorised consent returns 400 U009."
        - id: FR-014
          description: >-
            Track a submitted payment to settlement via GET /domestic-payments/{PaymentId},
            mapping OBIE status onto an in-progress / terminal-success / terminal-failure
            disposition.
          priority: must
          acceptance_criteria:
            - "AcceptedSettlementInProcess renders as in progress and is never described as sent or complete."
            - "Polling stops on a terminal disposition and never starts on one."
            - "An unrecognised status fails open to in progress rather than being guessed as success or failure."
        - id: FR-015
          description: >-
            Restrict every payment this app initiates to a consumer payment context.
            Risk.PaymentContextCode must be TransferToThirdParty or TransferToSelf; the
            merchant fields MerchantCategoryCode, MerchantCustomerIdentification and
            DeliveryAddress must never be sent.
          priority: must
          rationale: >-
            OBInternalPaymentContext1Code offers six contexts, four of which describe a
            merchant collecting from a customer. HSBC's own Postman examples use the merchant
            shape, so copying them verbatim — the obvious thing to do — would model the wrong
            application.
          acceptance_criteria:
            - "Every staged consent and submitted payment carries a consumer PaymentContextCode."
            - "No request body contains any of the three merchant Risk fields."
        - id: FR-016
          description: >-
            Sign every PISP write with a detached JWS in the x-jws-signature header (PS256,
            b64:false plus the crit claims), extending the existing signPs256 primitive.
          priority: must
          acceptance_criteria:
            - "POST /domestic-payment-consents and POST /domestic-payments both carry x-jws-signature."
            - "Absence of the header is verified to produce 400 U019, and that error is surfaced as non-recoverable with a support reference rather than a Retry."
        - id: FR-017
          description: >-
            Attach an x-idempotency-key (max 40 characters) to every PISP write, generated
            once per staged payment and reused across the consent stage, the submit, and every
            retry of either.
          priority: must
          acceptance_criteria:
            - "A retry after a network failure reuses the original key and creates no second payment."
            - "The same key is used for the consent stage and the subsequent submit."
      third_party_services:
        - name: HSBC UK Open Banking sandbox
          purpose: "Account & Transaction (AIS) API — the data source."
          integration_type: api
        - name: Firebase
          purpose: "Crash + performance observability only."
          integration_type: sdk

  features:
    _tag: "§features"
    _status: draft
    _quality_score: 82
    _source: wizard
    content:
      features:
        - name: consent-onboarding
          priority: must
          description: "User onboarding → OAuth login with HSBC. The app stages an account-access-consent (Permissions array); the PSU authenticates, approves the permission set and selects accounts on HSBC's portal; callback → token. No in-app bank picker (HSBC only) and no in-app permission toggles (approval is on the bank)."
          acceptance_criteria: ["Consent created with explicit permission list; PSU authenticates + approves on HSBC; token obtained on accept; rejection yields no token and surfaces a clear retry."]
          requirement_refs: [FR-001, FR-002]
        - name: consent-dashboard
          priority: must
          description: "Active consents, granted permissions, expiry, revoke, and 90-day reconfirmation."
          acceptance_criteria: ["Revoke calls DELETE consent; reconfirm re-runs authorize."]
          requirement_refs: [FR-008]
        - name: home
          priority: must
          description: "Home landing tab (bottom-nav order 0) showing the currently selected account — hero balance card, quick actions (Transactions, Statements, Manage consents), recent transactions, and a spending snapshot. An account switcher changes the selected account, which drives the whole screen. Aggregates AIS accounts/balances/transactions client-side; no new endpoint. Consents are surfaced here (and in Settings) since they were removed from the bottom-nav rail."
          requirement_refs: [FR-003, FR-004, FR-005]
          dependencies: [accounts, balances, transactions]
        - name: accounts
          priority: must
          description: "List of authorised accounts + account detail."
          requirement_refs: [FR-003]
        - name: balances
          priority: must
          description: "Current/available balances per account."
          requirement_refs: [FR-004]
          dependencies: [accounts]
        - name: transactions
          priority: must
          description: "Transaction history with date + credit/debit filters, search, and per-transaction detail; transactions carry a category tag (auto-categorized) that feeds the PFM feature."
          requirement_refs: [FR-005, FR-011]
          dependencies: [accounts]
        - name: beneficiaries
          priority: should
          description: "Saved payees (read-only)."
          requirement_refs: [FR-006]
          dependencies: [accounts]
        - name: standing-orders
          priority: should
          description: "Recurring outbound orders (read-only)."
          requirement_refs: [FR-006]
          dependencies: [accounts]
        - name: direct-debits
          priority: should
          description: "Direct-debit mandates (read-only)."
          requirement_refs: [FR-006]
          dependencies: [accounts]
        - name: scheduled-payments
          priority: should
          description: "Future-dated one-off payments (read-only)."
          requirement_refs: [FR-006]
          dependencies: [accounts]
        - name: statements
          priority: should
          description: "Statement list + statement detail."
          requirement_refs: [FR-007]
          dependencies: [accounts]
        - name: product
          priority: could
          description: "Account product terms (fees/rates) for BCA/PCA accounts."
          requirement_refs: [FR-007]
          dependencies: [accounts]
        - name: account-holder
          priority: could
          description: "Account holder / PSU party details. Renamed from `party` 2026-07-28 to match the shipped module feature/account-holder."
          requirement_refs: [FR-007]
          dependencies: [accounts]
        - name: settings
          priority: should
          description: "App settings: appearance (theme dropdown), a Manage Consents shortcut, and About & Legal (privacy policy in a browser, in-app open-source licences, static app version). Reverse-synced 2026-07-28 — biometric app-lock, session timeout and notification preferences were specified but never built."
          dependencies: [consent-dashboard]
        - name: licences
          priority: should
          description: "Open-source licence readout — a pushed, arg-less screen inside the settings module rendering the bundled MPL text. Source-originated; added to the plan 2026-07-28 because it ships but was never specified."
          dependencies: [settings]

        # ── PISP features added 2026-07-30 (/idea-evolve scope reversal) ─────
        - name: send-money
          id: send-money
          priority: must
          status: scaffold
          scaffolded_at: "2026-07-30T00:00:00Z"
          category: payment-initiation
          description: >-
            Consumer-initiated domestic payment. Three-step form — funding account, payee,
            amount — then review and confirm, which stages a domestic-payment-consent and hands
            off to payment-consent for the bank authorisation. Replaces the Pay tab placeholder
            (SendMoneyRoute -> PlaceholderScreen("Pay")). Composes with two already-shipped
            surfaces: accounts supplies the debtor, beneficiaries supplies the creditor.
          acceptance_criteria:
            - "Payment stages and submits against the HSBC sandbox with a detached JWS and an idempotency key."
            - "Risk carries a consumer PaymentContextCode and no merchant fields."
            - "A retry after a network failure cannot create a duplicate payment."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017]
          dependencies: [accounts, beneficiaries, payment-consent, payment-status]

        - name: payment-consent
          id: payment-consent
          priority: must
          status: scaffold
          scaffolded_at: "2026-07-30T00:00:00Z"
          category: payment-initiation
          description: >-
            Return leg of the PISP app-to-app authorisation on scope=payments — the analogue of
            the shipped consent-callback, but for a domestic-payment-consent. Validates state and
            nonce, exchanges the code, and polls the consent to Authorised before handing back to
            send-money. Deliberately does NOT persist its token into ConsentSession, which holds
            the AIS data-sharing session.
          acceptance_criteria:
            - "State or nonce mismatch is rejected before the single-use authorisation code is spent."
            - "ConsentSession is never written to."
            - "Return to send-money is gated on the consent reaching Authorised."
          requirement_refs: [FR-013]
          dependencies: [send-money]

        - name: payment-status
          id: payment-status
          priority: must
          status: scaffold
          scaffolded_at: "2026-07-30T00:00:00Z"
          category: payment-initiation
          description: >-
            Settlement tracking for a submitted payment. Exists because a successful submit
            returns AcceptedSettlementInProcess, not a completed settlement — without it the PSU
            is told "sent" with no way to learn whether the money actually moved. Maps OBIE
            status onto a three-way disposition and polls only while in progress.
          acceptance_criteria:
            - "An in-progress payment is never described as sent, complete or successful."
            - "Polling stops on a terminal disposition and never starts on one."
            - "An unmapped status fails open to in progress."
          requirement_refs: [FR-014]
          dependencies: [send-money]

