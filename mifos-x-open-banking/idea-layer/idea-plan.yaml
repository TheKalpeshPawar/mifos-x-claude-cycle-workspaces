# ─── §11 FLOWS ──────────────────────────────────────────────────────────────
flows:
  _status: draft
  _quality_score: 85
  _source: source_analysis
  content:
    - name: create_task_flow
      feature_ref: home
      steps:
        - Open TasksList
        - Tap FloatingActionButton (+)
        - Navigate to EditTask form
        - Enter title, description, date, time, priority
        - Tap Save
        - StorageService.addTask() executed
        - Return to TasksList and see new task
    - name: filter_tasks_by_date_flow
      feature_ref: home
      steps:
        - Open TasksList
        - View calendar pickers (year, month, day)
        - Select year from dropdown or month with ± buttons
        - Tap day in grid
        - TasksViewModel.updateSelectDayInMonth() called
        - TasksFlow updates → LazyColumn filters tasks
        - Display filtered task list
    - name: mark_task_complete_flow
      feature_ref: home
      steps:
        - Open TasksList
        - Locate task in list
        - Tap CheckBox to toggle completion
        - TasksViewModel.flagTask() called
        - StorageService.updateTask() persists state
        - Task visual state updates in list
    - name: settings_theme_toggle_flow
      feature_ref: settings
      steps:
        - Open Settings (from Home TopAppBar)
        - Tap ThemeCard
        - SettingsDialog appears
        - Toggle theme selection
        - AppViewModel.updateAppTheme() called
        - handleThemeMode() updates OS dark mode
        - App recomposes with new color scheme

