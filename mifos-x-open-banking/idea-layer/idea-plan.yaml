          - "iOS build + Fastlane setup"
          - "Web (Wasm) deployment to GitHub Pages"
        exit_criteria: "FO has complete toolset; all 4 platforms build and deploy"

      - name: "Phase 6 — Hardening & Release (P0)"
        weeks: "W16"
        priority: P0
        deliverables:
