  _quality_score: 92
  _source: enrichment
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    total_weeks: 16
    phases:
      - name: "Phase 1 — Foundation & Auth (P0 Core)"
        weeks: "W1–W3"
        priority: P0
        features:
          - splash
          - login
          - forgot-password
          - change-password
          - profile
          - settings
          - about
        deliverables:
          - "OBP DirectLogin auth flow (token exchange + session management)"
          - "Shared navigation shell (bottom nav per flavor)"
          - "Design system + theme (M3 tokens, dark mode)"
          - "CI pipeline (pr-check.yml, build matrix)"
        exit_criteria: "User can login, view profile, toggle theme on Android + Desktop"

      - name: "Phase 2 — Consumer Banking Core (P0)"
        weeks: "W4–W7"
        priority: P0
        features:
          - home
          - accounts
          - account-detail
          - transactions
          - transaction-detail
          - send-money
          - send-money-confirm
          - beneficiaries
          - cards
          - card-detail
        deliverables:
