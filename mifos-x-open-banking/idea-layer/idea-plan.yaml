# ─── §11 FLOWS ──────────────────────────────────────────────────────────────
flows:
  _status: approved
  _quality_score: 88
  _source: idea_layer_flows
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    - name: account_access_consent_flow
      feature_ref: consent-intro
      steps:
        - Splash checks for a valid, authorised account-access consent + token
        - No consent → Consent Intro (explain Open Banking data sharing)
        - Consent Request → pick permissions → POST account-access-consents (status AWAU)
        - Bank Authorize Handoff → build signed authorise request → redirect to HSBC
        - PSU authenticates + approves at HSBC (SCA at the bank)
        - Auth Callback → deep-link returns code → POST /oauth2/token → consent AUTH
        - Enter Home; declined → Consent Declined; expired/revoked → Consent Expired → re-consent
    - name: consumer_banking_flow
      feature_ref: home
      steps:
        - Home dashboard (connected-account summary + quick actions)
        - Navigate to Accounts list (read-only AISP)
        - Select account → Account Detail (balances)
        - View transactions → Transaction Detail
        - Pay → Send Money
    - name: payment_initiation_flow
      feature_ref: send-money
      steps:
        - Open Send Money from Home (pick payee/account + payment kind)
        - Enter amount → Confirmation-of-Funds check against source balance
        - Review on Confirm → POST payment-consents (status AWAU)
        - Payment Authorize Handoff → redirect to HSBC (PSU authenticates + completes SCA at the bank)
        - Auth Callback → token → POST domestic-payments → poll status
        - Payment Result (terminal); declined → Payment Declined → retry
    - name: consent_management_flow
      feature_ref: consent-manager
      steps:
        - Open Consent Manager from More
        - View active data-sharing consents
        - Revoke a consent (DELETE account-access-consents)
        - Receive consent-revoked event in Notifications

# ─── §12 API_SURFACE ────────────────────────────────────────────────────────
api_surface:
  _status: approved
  _quality_score: 88
  _source: idea_layer_rebuild
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    base_url: "https://secure.sandbox.ob.hsbc.co.uk"
    authorize_base_url: "https://sandbox.ob.hsbc.co.uk"
    standard: "obie-uk-open-banking"
    api_version: v4.0
    auth_method: OAuth2-FAPI
    owned_backend: false
    manifest_ref: "server/api_manifest.yaml"
    group_count: 14
    endpoint_count: 85
    endpoints:
      - tag: auth
        description: "FAPI / OAuth2 / DCR — Dynamic Client Registration, token endpoint, PSU authorise redirect"
        methods: [POST, GET]
      - tag: ais
        description: "Account Information (AISP) — accounts, balances, transactions, beneficiaries, standing orders, direct debits, scheduled payments, party, products, statements (read-only)"
        methods: [POST, GET, DELETE]
      - tag: cbpii
        description: "Confirmation of Funds (CBPII) — pre-payment funds check"
        methods: [POST, GET, DELETE]
      - tag: vrp
        description: "Variable Recurring Payments — recurring / sweeping payments"
        methods: [POST, GET]
      - tag: pisp-domestic
        description: "Domestic Payment — single immediate payment"
        methods: [POST, GET]
      - tag: pisp-domestic-scheduled
        description: "Domestic Scheduled Payment — future-dated"
        methods: [POST, GET]
      - tag: pisp-domestic-standing-order
        description: "Domestic Standing Order — recurring schedule"
        methods: [POST, GET]
      - tag: pisp-international
        description: "International Payment — cross-currency"
        methods: [POST, GET]
      - tag: pisp-international-scheduled
        description: "International Scheduled Payment"
        methods: [POST, GET]
      - tag: pisp-international-standing-order
        description: "International Standing Order"
        methods: [POST, GET]
      - tag: pisp-file
        description: "File Payment / bulk — ISO 20022 pain.001"
        methods: [POST, GET]
      - tag: pisp-multibill
        description: "Multi-Bill Payment (HSBC-specific, UK Business)"
        methods: [POST]
      - tag: events
        description: "Event Notification — subscriptions + poll (consent-revoked + status)"
        methods: [POST, GET, DELETE]
      - tag: open-data
        description: "Open Data (unauthenticated) — ATM/branch locator + product reference"
        methods: [GET]
    repositories:
      - name: ConsentRepository
        description: "Account-access + payment consent lifecycle (create, status, revoke) via HSBC OBIE consent endpoints"
      - name: AccountsRepository
        description: "Authorised accounts + balances via HSBC AISP API"
      - name: TransactionsRepository
        description: "Transaction history and details via HSBC AISP API"
      - name: PaymentsRepository
        description: "Payment initiation (domestic, scheduled, standing-order, international) via HSBC PISP API"
      - name: FundsConfirmationRepository
        description: "Confirmation of Funds checks via HSBC CBPII API"
      - name: EventsRepository
        description: "Event subscriptions + polling via HSBC Event Notification API"
      - name: OpenDataRepository
        description: "ATM/branch + product reference via HSBC Open Data (unauthenticated)"

