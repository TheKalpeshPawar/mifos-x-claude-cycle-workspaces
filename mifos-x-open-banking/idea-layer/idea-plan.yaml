    total_weeks: 16
    phases:
      - name: "Phase 1 — Consent Onboarding (P0 Foundation)"
        weeks: "W1–W4"
        priority: P0
        features:
          - splash
          - consent-intro
          - consent-request
          - bank-authorize-handoff
          - auth-callback
          - consent-declined
          - consent-expired
          - profile
          - settings
          - about
        deliverables:
          - "FAPI 1.0 Advanced client (mTLS QWAC+QSEAL, DCR, detached JWS)"
          - "Account-access consent journey end-to-end (create-consent → authorize → token → AUTH)"
          - "Deep-link auth callback + consent/token cache (Room)"
          - "Navigation shell + design system (M3 tokens, dark mode)"
          - "CI pipeline (pr-check.yml, build matrix)"
        exit_criteria: "User connects their HSBC account by consent and lands on Home on Android + Desktop"

      - name: "Phase 2 — Account Information (AISP, P0)"
        weeks: "W5–W8"
        priority: P0
        features:
          - home
          - accounts
          - account-detail
          - transactions
          - transaction-detail
          - transaction-tags
          - beneficiaries
          - standing-orders
          - direct-debits
          - products
