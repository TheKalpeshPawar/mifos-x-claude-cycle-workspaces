# ─── §7 TECHNICAL_DECISIONS ─────────────────────────────────────────────────
technical_decisions:
  _status: approved
  _quality_score: 96
  _source: source_analysis
  _approved_at: "2026-05-27"
  content:
    language: kotlin
    language_version: "2.1.20"
    ui_framework: compose-multiplatform
    ui_framework_version: "1.8.2"
    architecture: stream-first
    state_pattern: "BaseViewModel + ScreenDataStream + Store5"
    di: koin
    di_version: "4.1.0"
    network: ktor-ktorfit
    network_version: "Ktor 3.2.0 + Ktorfit 2.5.2 (mTLS — QWAC transport + QSEAL signing)"
    database: room-kmp
    database_version: "Room 2.7.2 (consent + token cache)"
    navigation: androidx-navigation
    kmp_arch: stream-first@latest
    backend_provider: rest
    backend_api: "HSBC UK/CE Open Banking — OBIE Read/Write Standard v4.0 (v3.1 on CE HSBCnet + Malta)"
    backend_base_url: "https://secure.sandbox.ob.hsbc.co.uk"
    backend_authorize_url: "https://sandbox.ob.hsbc.co.uk"
    backend_owned: false
    auth:
      security_profile: fapi-1.0-advanced
      protocol: oauth2
      grants: [client_credentials, authorization_code]
      pkce: s256
      transport: mtls
      request_signing: jws-detached
      client_registration: dcr
      consent_model: "create-consent -> authorize -> token -> resource (SCA at the bank)"
    product_flavors:
      plugin: "io.github.mobilebytelabs.kmp-product-flavors"
      flavors: [consumer]

