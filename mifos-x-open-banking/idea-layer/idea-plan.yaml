# ─── §11 FLOWS ──────────────────────────────────────────────────────────────
flows:
  _status: approved
  _quality_score: 88
  _source: idea_layer_flows
  _last_updated: "2026-05-27"
  _enriched_at: "2026-05-27"
  _approved_at: "2026-05-27"
  content:
    - name: consumer_banking_flow
      feature_ref: home
      steps:
        - Login (DirectLogin auth)
        - Home dashboard (account summary + quick actions)
        - Navigate to Accounts list
        - Select account → Account Detail
        - View transactions → Transaction Detail
        - Send Money → Select beneficiary → Confirm → Success
    - name: field_officer_flow
      feature_ref: fo-dashboard
      steps:
        - Login (DirectLogin auth)
        - FO Dashboard (metrics + pending tasks)
        - Customer Search → Customer Detail
        - Start Customer Onboarding (multi-step)
        - KYC Review → Approve/Reject
        - Account Applications → Application Detail → Approve
    - name: send_money_flow
      feature_ref: send-money
      steps:
        - Open Send Money from Home or Accounts
        - Select beneficiary from saved list (or add new)
        - Enter amount and reference
        - Validate via OBP TransactionRequests API
        - Review on Confirm screen
        - Submit → Success notification
    - name: customer_onboarding_flow
      feature_ref: customer-onboarding
      steps:
        - FO opens Customer Onboarding
        - Step 1 — Personal information
        - Step 2 — Address and contact
        - Step 3 — KYC document upload
        - Step 4 — Account type selection
        - Submit to OBP Customers API
        - Pending approval state

