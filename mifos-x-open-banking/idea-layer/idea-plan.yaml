        - name: send-money
          archetype: form
          feature_refs: [send-money, accounts, beneficiaries]
          description: >-
            Three-step consumer payment form reached from the Pay tab — choose the funding
            account from the PSU's own authorised accounts, choose a saved payee or enter a sort
