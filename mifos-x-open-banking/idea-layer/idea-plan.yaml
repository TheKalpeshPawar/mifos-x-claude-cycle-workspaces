          - "Send Money flow end-to-end (TransactionRequests API)"
          - "Card management with freeze/unfreeze"
          - "Consumer bottom nav: Home, Accounts, Pay, Cards, More"
        exit_criteria: "Consumer can view accounts, browse transactions, send money, manage cards"

      - name: "Phase 3 — Field Officer Core (P0)"
        weeks: "W8–W10"
        priority: P0
        features:
          - fo-dashboard
          - customer-search
          - customer-detail
          - customer-profile
          - customer-onboarding
          - corporate-onboarding
          - kyc-review
          - account-applications
          - application-detail
        deliverables:
          - "Customer CRUD via OBP Customers API"
          - "KYC verification workflow (approve/reject with notes)"
          - "Multi-step onboarding (individual + corporate)"
          - "Application pipeline with status filters"
          - "FO bottom nav: Dashboard, Customers, Applications, Messages, More"
        exit_criteria: "Field officer can search customers, onboard new ones, review KYC, process applications"

      - name: "Phase 4 — Consumer Extended (P1)"
        weeks: "W11–W13"
        priority: P1
        features:
          - standing-orders
          - direct-debits
          - direct-debit-detail
          - atm-locator
