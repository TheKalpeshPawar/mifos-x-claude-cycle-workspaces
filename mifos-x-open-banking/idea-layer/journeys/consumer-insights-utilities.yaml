id: consumer-insights-utilities
version: "1.0.0"
name: "Consumer Insights & Utilities"
description: "Consumer uses financial insights (PFM), checks FX rates before a transfer, locates a nearby ATM, browses banking products, and reviews notifications."

persona:
  archetype: "returning consumer"
  jtbd: "understand my spending patterns and find the best way to send money abroad"
  context: "planning a transfer abroad, wants to check rates and spending capacity first"
  knowledge_level: familiar
  emotional_state: "curious"

goal: "Review spending insights, check FX rates, and locate a nearby ATM within one session."

success_metric:
  name: pfm_engagement_rate
  kind: activation
  target: ">=60% of consumers who open PFM view ≥2 spending categories"
  measurement: "analytics: pfm_dashboard_opened → category_drill_down event count"

screen_sequence:
  - screen_id: pfm-dashboard
    feature_id: pfm-dashboard
    state: content
    user_intent: "understand monthly spending by category"
    success_signal: "spending categories visible with amounts"
  - screen_id: transactions_content
    feature_id: transactions
    state: content
    user_intent: "drill into a spending category's transactions"
    success_signal: "filtered transactions for category loaded"
  - screen_id: pay-international
    feature_id: pay-international
    state: content
    user_intent: "send money abroad and check the exchange rate"
    success_signal: "exchange rate + converted amount shown before authorising"
  - screen_id: atm_locator_main
    feature_id: atm-locator
    state: content
    user_intent: "find the nearest ATM"
    success_signal: "map loaded with ATM pins"
  - screen_id: products
    feature_id: products
    state: content
    user_intent: "browse available banking products"
    success_signal: "product catalogue visible"
  - screen_id: notifications
    feature_id: notifications
    state: content
    user_intent: "check recent bank notifications"
    success_signal: "notification list loaded"

expected_outcome: "Consumer has reviewed their spending patterns, checked FX rates, located an ATM, and browsed available products."

flows:
  - feature_id: pfm-dashboard
    flow_id: consumer-banking
    role: primary
  - feature_id: pay-international
    flow_id: consumer-banking
    role: primary
  - feature_id: atm-locator
    flow_id: consumer-banking
    role: primary

capabilities_used: [has_ui, has_api]

tier: medium

preconditions:
  - "user is authenticated as consumer"
  - "device is online"
  - "location permissions granted (ATM locator)"

failure_modes:
  - cause: "location permission denied"
    recovery_screen: atm_locator_main
    notes: "Shows empty state with permission request CTA"
  - cause: "FX rate API unavailable"
    recovery_screen: fx_rates_main
    notes: "Cached rates shown with staleness warning"

tags: [consumer, pfm, fx, atm, products, notifications]
deprecated: false
