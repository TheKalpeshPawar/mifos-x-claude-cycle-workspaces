id: settings-and-profile
version: "1.0.0"
name: "Settings and User Profile"
description: >
  Priya opens Settings from the More tab to configure app appearance (light/dark theme),
  enable biometric app-lock, review notification preferences, access About & Legal, and
  shortcut to consent management. She then navigates to her Profile to see her connected
  identity (name and address from the OBIE party resource), an active-consents summary,
  and sign out (which clears token + consent and redirects to login).
persona:
  archetype: "returning user — personalisation and privacy manager"
  jtbd: "Customise the app to my preferences and verify my connected identity before sharing the app with a family member."
  context: "Quiet evening at home, setting up the app properly after a few weeks of use."
  knowledge_level: familiar
  emotional_state: "settled and thorough"
goal: "Configure app settings and review connected identity, then sign out cleanly."
success_metric:
  name: "settings-profile-task-completion"
  kind: satisfaction
  target: ">=80% of users who open settings also open profile within the same session"
  measurement: "Sequential funnel: settings_screen_viewed → profile_screen_viewed, same session"
screen_sequence:
  - screen_id: settings
    state: "populated"
    user_intent: "Browse settings categories and toggle appearance or security preferences."
    success_signal: "Settings list renders sections: Appearance (theme toggle), Security (biometric lock toggle), Notifications, About & Legal, and Manage Consents shortcut row."
    notes: "Theme toggle applies immediately. Biometric lock toggle triggers OS biometric enrolment prompt if not already set up."
  - screen_id: profile
    state: "populated"
    user_intent: "Review connected identity (name and address from OBIE ReadParty) and see the active-consents summary."
    success_signal: "Profile screen shows account holder name, address, at least one active consent row with expiry, and a visible 'Sign Out' button."
    notes: "Sign-out triggers a confirmation dialog. On confirm: local tokens and consent data are cleared, and the app navigates to login/user-onboarding."
expected_outcome: >
  Priya has applied her preferred theme and security settings, confirmed her connected
  identity matches her HSBC account details, and understands how to sign out if she
  needs to. The app is set up to her satisfaction.
tier: minimal
preconditions:
  - "Active consent and valid PSU access token."
  - "ReadParty permission granted — required to populate identity on profile screen."
failure_modes:
  - cause: "ReadParty permission not in consent scope — party name and address are unavailable."
    recovery_screen: profile
    notes: "Profile renders with 'Party details not available' placeholder and suggests reconfirming consent with ReadParty permission. No navigation change."
  - cause: "Biometric hardware not available on device."
    recovery_screen: settings
    notes: "Biometric toggle is greyed out with a tooltip 'Not available on this device'. Settings screen remains active."
tags: [settings, profile, appearance, security, biometric, sign-out, p0]
