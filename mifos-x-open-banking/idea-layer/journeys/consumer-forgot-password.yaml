id: consumer-forgot-password
version: "1.0.0"
name: "Consumer Password Reset"
description: "Consumer has forgotten their password and needs to recover access to their account."

persona:
  archetype: "recovery-from-error user"
  jtbd: "regain access to my banking account after forgetting my password"
  context: "trying to log in, frustrated that credentials aren't working"
  knowledge_level: familiar
  emotional_state: "frustrated"

goal: "Reset password and return to the login screen to authenticate successfully."

success_metric:
  name: password_reset_completion
  kind: task_completion
  target: ">=90% of users who initiate reset complete the flow"
  measurement: "funnel: forgot_password_tapped → reset_email_sent → login_reopened"

screen_sequence:
  - screen_id: login
    feature_id: login
    state: content
    user_intent: "find the forgot password option"
    success_signal: "taps Forgot Password link"
  - screen_id: forgot-password
    feature_id: forgot-password
    state: content
    user_intent: "enter email to receive reset link"
    success_signal: "email submitted, confirmation shown"
  - screen_id: login
    feature_id: login
    state: content
    user_intent: "sign in with new credentials"
    success_signal: "navigates back to login to re-authenticate"

expected_outcome: "User receives password reset instructions and is returned to login screen ready to sign in with new credentials."

flows:
  - feature_id: login
    flow_id: app-main
    role: primary
  - feature_id: forgot-password
    flow_id: app-main
    role: branch

capabilities_used: [is_auth_feature, has_ui]

tier: maximum

preconditions:
  - "user is on the login screen"
  - "device is online"
  - "user has a registered email address"

failure_modes:
  - cause: "email not registered"
    recovery_screen: forgot-password
    notes: "Inline error; user re-enters email"
  - cause: "network offline"
    recovery_screen: forgot-password
    notes: "Error toast with retry"

tags: [auth, consumer, recovery]
deprecated: false
