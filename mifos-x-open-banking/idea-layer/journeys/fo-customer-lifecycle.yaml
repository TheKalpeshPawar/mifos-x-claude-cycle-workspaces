id: fo-customer-lifecycle
version: "1.0.0"
name: "Field Officer Customer Lifecycle"
description: "Field officer onboards a new individual customer — searches for existing record, creates a new customer profile, captures KYC documents, and submits for review."

persona:
  archetype: "field officer agent"
  jtbd: "onboard a new unbanked customer quickly and accurately in the field"
  context: "visiting a rural customer at their home or a market stall with poor connectivity"
  knowledge_level: familiar
  emotional_state: "focused"

goal: "Search for a customer, create a new profile, complete KYC, and submit the application."

success_metric:
  name: customer_onboarding_completion
  kind: task_completion
  target: ">=80% of started onboardings reach KYC submission within a single session"
  measurement: "funnel: customer_onboarding_started → kyc_submitted_event"

screen_sequence:
  - screen_id: customer_search_main
    feature_id: customer-search
    state: content
    user_intent: "verify customer doesn't already have a profile"
    success_signal: "search returns no results, FO proceeds to create new"
  - screen_id: customer-onboarding-main
    feature_id: customer-onboarding
    state: content
    user_intent: "fill in new customer personal details"
    success_signal: "form completed and submitted for KYC"
  - screen_id: kyc-review-main
    feature_id: kyc-review
    state: content
    user_intent: "capture and verify KYC documents"
    success_signal: "KYC documents submitted for back-office review"
  - screen_id: customer_detail_main
    feature_id: customer-detail
    state: content
    user_intent: "confirm customer record created and view status"
    success_signal: "customer detail shows pending KYC status"
  - screen_id: customer-profile-main
    feature_id: customer-profile
    state: content
    user_intent: "review full profile for accuracy"
    success_signal: "profile details correct"
  - screen_id: customer-messages-main
    feature_id: customer-messages
    state: content
    user_intent: "send onboarding confirmation message to customer"
    success_signal: "message sent successfully"
  - screen_id: corporate-onboarding-main
    feature_id: corporate-onboarding
    state: content
    user_intent: "onboard a corporate/business entity (alternate path)"
    success_signal: "corporate entity record created"
    notes: "This step is an alternate path for corporate customers, not sequential"

expected_outcome: "New customer profile created with KYC submitted, confirmation message sent, and customer record visible in the system."

flows:
  - feature_id: customer-search
    flow_id: field-officer
    role: primary
  - feature_id: customer-onboarding
    flow_id: field-officer
    role: primary
  - feature_id: kyc-review
    flow_id: field-officer
    role: primary
  - feature_id: corporate-onboarding
    flow_id: field-officer
    role: branch
  - feature_id: customer-messages
    flow_id: field-officer
    role: branch

capabilities_used: [has_ui, has_api]

tier: maximum

preconditions:
  - "field officer is authenticated"
  - "device is online or has offline-sync enabled"

failure_modes:
  - cause: "KYC document upload fails"
    recovery_screen: kyc-review-main
    notes: "Partial save; FO retries on reconnect"
  - cause: "duplicate customer detected"
    recovery_screen: customer_detail_main
    notes: "FO shown existing record, prompted to update instead"
  - cause: "network offline during form fill"
    recovery_screen: customer-onboarding-main
    notes: "Offline queue; syncs when connectivity restored"

tags: [field-officer, customer, onboarding, kyc]
deprecated: false
