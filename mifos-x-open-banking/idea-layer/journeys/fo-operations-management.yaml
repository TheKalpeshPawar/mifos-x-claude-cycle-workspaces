id: fo-operations-management
version: "1.0.0"
name: "Field Officer Daily Operations"
description: "Field officer starts the day by reviewing their dashboard, checking scheduled meetings, processing account applications, and following up with applicants."

persona:
  archetype: "field officer agent"
  jtbd: "process my daily customer workload efficiently — meetings, applications, and follow-ups"
  context: "Monday morning, reviewing the day's task list before heading into the field"
  knowledge_level: expert
  emotional_state: "focused"

goal: "Complete daily operations — review dashboard, join scheduled meetings, process pending applications."

success_metric:
  name: fo_daily_ops_completion
  kind: task_completion
  target: ">=90% of FO sessions include at least one application status update"
  measurement: "analytics: fo_dashboard_loaded → application_detail_viewed"

screen_sequence:
  - screen_id: fo_dashboard_main
    feature_id: fo-dashboard
    state: content
    user_intent: "review pending KYC, applications, and meetings for the day"
    success_signal: "dashboard widgets show counts for tasks"
  - screen_id: meetings-main
    feature_id: meetings
    state: content
    user_intent: "see today's scheduled customer meetings"
    success_signal: "meeting list loaded with times and customer names"
  - screen_id: account-applications-main
    feature_id: account-applications
    state: content
    user_intent: "review pending account applications"
    success_signal: "applications list loaded with status indicators"
  - screen_id: application-detail-main
    feature_id: application-detail
    state: content
    user_intent: "review and update a specific application"
    success_signal: "application detail visible with action buttons"
  - screen_id: customer_detail_main
    feature_id: customer-detail
    state: content
    user_intent: "view the applicant's customer record"
    success_signal: "customer detail loaded"
  - screen_id: customer-messages-main
    feature_id: customer-messages
    state: content
    user_intent: "send status update to customer about their application"
    success_signal: "message sent"

expected_outcome: "Field officer has reviewed all daily tasks, processed pending applications, and communicated status updates to customers."

flows:
  - feature_id: fo-dashboard
    flow_id: field-officer
    role: primary
  - feature_id: meetings
    flow_id: field-officer
    role: primary
  - feature_id: account-applications
    flow_id: field-officer
    role: primary
  - feature_id: application-detail
    flow_id: field-officer
    role: primary

capabilities_used: [has_ui, has_api]

tier: maximum

preconditions:
  - "field officer is authenticated"
  - "device is online"

failure_modes:
  - cause: "meetings API unavailable"
    recovery_screen: meetings-main
    notes: "Cached meetings shown with staleness notice"
  - cause: "application update fails"
    recovery_screen: application-detail-main
    notes: "Error toast; changes not persisted until connectivity restored"

tags: [field-officer, operations, meetings, applications]
deprecated: false
