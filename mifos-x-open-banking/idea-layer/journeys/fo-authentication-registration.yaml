id: fo-authentication-registration
version: "1.0.0"
name: "Field Officer Authentication & Registration"
description: "A new field officer agent completes their device registration, authenticates with OBP credentials, and lands on the field officer dashboard."

persona:
  archetype: "first-time field officer"
  jtbd: "register my device and start serving customers in the field"
  context: "first day of deployment, onboarded by bank administrator, device in hand"
  knowledge_level: novice
  emotional_state: "anxious"

goal: "Complete agent registration, sign in, and reach the field officer dashboard ready to serve customers."

success_metric:
  name: fo_onboarding_completion
  kind: activation
  target: ">=95% of registered FO agents complete first login within 1 hour of registration"
  measurement: "funnel: agent_registration_submit → fo_dashboard_loaded"

screen_sequence:
  - screen_id: splash
    feature_id: splash
    state: loading
    user_intent: "wait for app to initialise"
    success_signal: "splash transitions to login"
  - screen_id: agent-registration
    feature_id: agent-registration
    state: content
    user_intent: "register device with agent ID and bank code"
    success_signal: "registration submitted, confirmation shown"
  - screen_id: login
    feature_id: login
    state: content
    user_intent: "sign in with OBP field officer credentials"
    success_signal: "authenticated, navigates to FO dashboard"
  - screen_id: fo_dashboard_main
    feature_id: fo-dashboard
    state: content
    user_intent: "see daily task summary and quick actions"
    success_signal: "dashboard loads with pending tasks"

expected_outcome: "Field officer has a registered device, an authenticated session, and the FO dashboard is loaded showing their daily tasks."

flows:
  - feature_id: splash
    flow_id: app-main
    role: primary
  - feature_id: agent-registration
    flow_id: field-officer
    role: primary
  - feature_id: login
    flow_id: app-main
    role: primary
  - feature_id: fo-dashboard
    flow_id: field-officer
    role: primary

capabilities_used: [is_auth_feature, has_ui, has_api]

tier: maximum

preconditions:
  - "agent-registration form accessible (no existing session)"
  - "device is online"
  - "bank administrator has provisioned agent credentials"

failure_modes:
  - cause: "invalid agent ID or bank code"
    recovery_screen: agent-registration
    notes: "Inline validation error"
  - cause: "network offline during registration"
    recovery_screen: agent-registration
    notes: "Error toast with retry"
  - cause: "wrong FO credentials"
    recovery_screen: login
    notes: "Inline error; agent contacts admin"

tags: [field-officer, auth, registration, onboarding]
deprecated: false
