id: pfm-review
name: pfm-review
description: "Personal finance management flow — PFM dashboard shows total balance / net worth across accounts, this-month spending vs income, top spending categories and insight cards. Drill into spending-by-category (with per-category transaction drill-through to transaction-review), set and track monthly budgets per category, and review detected recurring subscriptions / payments."
type: happy
feature_ref: pfm
release_phase: P2

screens:
  - pfm-dashboard
  - spending-by-category
  - budgets
  - recurring-subscriptions

entry_screen: pfm-dashboard

connections:
  - { from: pfm-dashboard, to: spending-by-category, type: push, label: "Tap 'By Category' chip or a top-category row" }
  - { from: pfm-dashboard, to: budgets, type: push, label: "Tap 'Budgets' chip" }
  - { from: pfm-dashboard, to: recurring-subscriptions, type: push, label: "Tap 'Subscriptions' chip" }
  - { from: spending-by-category, to: transactions, type: push, label: "Tap a category row — drill into category transactions (cross-flow → transaction-review)" }
  - { from: budgets, to: spending-by-category, type: push, label: "Tap 'View transactions' on a budget card" }
