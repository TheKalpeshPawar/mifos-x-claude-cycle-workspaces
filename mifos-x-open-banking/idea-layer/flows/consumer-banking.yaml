# flows/consumer-banking.yaml — Consumer Open Banking navigation (HSBC OBIE)
# Rewritten 2026-06-11 — MIGRATION OBP → HSBC. Consent-gated: this flow is only reachable AFTER an
# authorised account-access consent (see account-access-consent.yaml). All data screens read AIS resources
# scoped to that consent. Payment journey lives in payment-initiation.yaml.
# REMOVED vs OBP: cards, card-detail (no card API), fx-rates (no FX-rates API), change-password (no in-app
# credentials). Beneficiaries is READ-ONLY (AISP beneficiaries cannot be created/edited via Open Banking).

schema_version: "1.0"
id: consumer-banking
name: "Consumer Open Banking Flow"
description: "Personal banking over HSBC Open Banking AIS — accounts, balances, transactions, standing orders, direct debits, PFM insights, product reference data, ATM/branch locator, and consent management. Entered only after the account-access consent is authorised."
created_at: "2026-05-25"
updated_at: "2026-06-11"
status: active
gated_by: account-access-consent          # consumer-banking is unreachable without an AUTH-status AIS consent

entry_screen: home
screens:
  - home
  - accounts
  - account-detail
  - transactions
  - transaction-detail
  - transaction-tags
  - pay                   # Pay tab hub — entry into payment-initiation sub-flow
  - beneficiaries         # READ-ONLY (AIS)
  - standing-orders
  - standing-order-create
  - standing-order-detail
  - standing-order-edit
  - direct-debits
  - direct-debit-detail
  - atm-locator
  - notifications
  - pfm-dashboard
  - pfm-settings
  - business-insights
  - automatic-rules
  - automatic-rule-create
  - automatic-rule-detail
  - products
  - consent-manager
  - about
  - profile
  - settings

connections:
  - { from: home, to: accounts, type: push, label: "View Accounts" }
  - { from: home, to: pay, type: push, label: "Pay (→ payment-initiation)" }
  - { from: home, to: transactions, type: push, label: "View Transactions" }
  - { from: home, to: beneficiaries, type: push, label: "View Beneficiaries (read-only)" }
  - { from: home, to: standing-orders, type: push, label: "Standing Orders" }
  - { from: home, to: direct-debits, type: push, label: "Direct Debits" }
  - { from: home, to: atm-locator, type: push, label: "ATM / Branch Finder (Open Data)" }
  - { from: home, to: notifications, type: push, label: "Notifications (event-notification)" }
  - { from: home, to: pfm-dashboard, type: push, label: "Spending Insights" }
  - { from: home, to: products, type: push, label: "Compare Products (Open Data)" }
  - { from: home, to: profile, type: tab, label: "Profile (More)" }
  - { from: home, to: settings, type: tab, label: "Settings (More)" }
  - { from: accounts, to: account-detail, type: push, label: "Account selected" }
  - { from: account-detail, to: transactions, type: push, label: "View transactions" }
  - { from: account-detail, to: pay, type: push, label: "Pay from this account" }
  - { from: account-detail, to: standing-orders, type: push, label: "Standing orders on account" }
  - { from: account-detail, to: direct-debits, type: push, label: "Direct debits on account" }
  - { from: transactions, to: transaction-detail, type: push, label: "Transaction selected" }
  - { from: transaction-detail, to: transaction-tags, type: sheet, label: "Add tag/note (local PFM)" }
  - { from: beneficiaries, to: pay, type: push, label: "Pay beneficiary (→ payment-initiation Pay hub)" }
  - { from: standing-orders, to: standing-order-create, type: push, label: "Create standing order (→ PISP authorise)" }
  - { from: standing-orders, to: standing-order-detail, type: push, label: "Standing order selected" }
  - { from: standing-order-detail, to: standing-order-edit, type: push, label: "Edit standing order" }
  - { from: standing-order-edit, to: standing-order-detail, type: pop, label: "Save / cancel" }
  - { from: standing-order-detail, to: standing-orders, type: pop, label: "Back to list" }
  - { from: direct-debits, to: direct-debit-detail, type: push, label: "Direct debit selected" }
  - { from: direct-debit-detail, to: direct-debits, type: pop, label: "Back to list" }
  - { from: pfm-dashboard, to: transactions, type: push, label: "Category transactions" }
  - { from: pfm-dashboard, to: pfm-settings, type: push, label: "PFM settings" }
  - { from: pfm-dashboard, to: business-insights, type: push, label: "Cash-flow insights" }
  - { from: pfm-dashboard, to: automatic-rules, type: push, label: "Automatic rules (VRP)" }
  - { from: automatic-rules, to: automatic-rule-create, type: push, label: "New rule" }
  - { from: automatic-rules, to: automatic-rule-detail, type: push, label: "Open a rule" }
  - { from: automatic-rule-create, to: authorise-handoff, type: push, label: "Approve at bank (consentContext=vrp-setup)" }
  - { from: automatic-rule-detail, to: automatic-rules, type: pop, label: "Revoke → back to list" }
  - { from: products, to: accounts, type: push, label: "Linked account" }
  - { from: settings, to: consent-manager, type: push, label: "Data sharing & consents" }
  - { from: settings, to: about, type: push, label: "About" }
  - { from: consent-manager, to: settings, type: pop, label: "Back to Settings" }
  - { from: consent-manager, to: consent-intro, type: replace, label: "Disconnect — revoke all consents (DELETE account-access-consents) → re-onboard" }
  - { from: profile, to: consent-manager, type: push, label: "Manage data sharing" }
  - { from: profile, to: consent-intro, type: replace, label: "Disconnect HSBC (revoke consent + clear token)" }

obie_context:
  reads: "All list/detail screens read AIS resources (GET /aisp/*) scoped to the authorised account-access consent."
  no_logout_password: "There is no password logout. 'Disconnect' revokes the OBIE consent (DELETE account-access-consents) and clears the local token, returning to consent onboarding."
  open_data: "atm-locator + products read unauthenticated Open Data (GET /branches | /atms | /personal-current-accounts | /business-current-accounts)."
  events: "notifications surfaces event-notification polling (e.g. UK.OBIE.Consent-Authorization-Revoked)."
