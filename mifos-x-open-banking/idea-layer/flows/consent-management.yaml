id: consent-management
name: consent-management
description: "Active consent lifecycle dashboard — list active consents with status and expiry, open a consent to see granted permissions, revoke immediately (DELETE /account-access-consents/{id}), or trigger a reconfirmation before the 90-day OBIE window expires (re-runs the onboarding-consent flow)."
type: happy
feature_ref: consent-dashboard
release_phase: P0

screens:
  - consent-list
  - consent-detail

entry_screen: consent-list

connections:
  - { from: consent-list, to: consent-detail, type: push, label: "Tap a consent card" }
  - { from: consent-list, to: user-onboarding, type: push, label: "Tap 'Connect HSBC' on empty state (cross-flow → onboarding-consent)" }
  - { from: consent-detail, to: consent-list, type: push, label: "Consent successfully revoked — back to list after clearing local token" }
  - { from: consent-detail, to: login, type: push, label: "Tap 'Reconfirm before expiry' — initiates fresh consent staging (cross-flow → onboarding-consent)" }
