  - profile

entry_screen: settings

connections:
  - { from: settings, to: profile, type: push, label: "Tap Profile row" }
  - { from: settings, to: consent-list, type: push, label: "Tap Manage Consents row (cross-flow → consent-management)" }
  - { from: profile, to: consent-detail, type: push, label: "Tap Manage Consent button (cross-flow → consent-management)" }
  - { from: profile, to: login, type: push, label: "Sign-out confirmed — clears tokens + consent, redirects to login (cross-flow → onboarding-consent)" }
