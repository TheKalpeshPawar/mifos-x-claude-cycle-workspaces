id: settings-and-profile
name: settings-and-profile
description: "Settings and profile flow — the More tab (bottom nav order 4) leads to Settings (appearance/dark-mode, biometric lock, notifications, about & legal, manage-consents shortcut) and Profile (connected identity from account party, active consent summary, sign-out). Sign-out clears tokens and consent and redirects to login."
type: happy
feature_ref: settings
release_phase: P0

screens:
