schema_version: "1.0"
id: field-officer
name: "Field Officer Agent Banking Flow"
description: "Agent banking operations — customer onboarding, KYC, account applications, meetings"
created_at: "2026-05-25"
status: active

entry_screen: fo-dashboard
screens:
  - fo-dashboard
  - customer-search
  - customer-detail
  - customer-profile
  - customer-onboarding
  - corporate-onboarding
  - kyc-review
  - account-applications
  - application-detail
  - customer-messages
  - meetings
  - agent-registration
  - consent-manager
  - change-password
  - about
  - profile
  - settings

connections:
