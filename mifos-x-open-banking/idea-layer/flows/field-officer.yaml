  - { from: fo-dashboard, to: account-applications, type: push, label: "Pending applications" }
  - { from: fo-dashboard, to: kyc-review, type: push, label: "KYC queue" }
  - { from: fo-dashboard, to: meetings, type: push, label: "Today's meetings" }
  - { from: fo-dashboard, to: profile, type: tab, label: "Profile (more)" }
  - { from: fo-dashboard, to: settings, type: tab, label: "Settings (more)" }
  - { from: customer-search, to: customer-detail, type: push, label: "Customer selected" }
  - { from: customer-search, to: customer-onboarding, type: push, label: "New individual customer" }
  - { from: customer-search, to: corporate-onboarding, type: push, label: "New corporate customer" }
  - { from: customer-detail, to: customer-profile, type: push, label: "View full profile" }
  - { from: customer-detail, to: customer-messages, type: push, label: "Message customer" }
  - { from: customer-detail, to: kyc-review, type: push, label: "Review KYC" }
  - { from: customer-detail, to: account-applications, type: push, label: "Account applications" }
  - { from: customer-onboarding, to: kyc-review, type: push, label: "Submit for KYC" }
  - { from: corporate-onboarding, to: account-applications, type: push, label: "Open account" }
  - { from: kyc-review, to: customer-detail, type: pop, label: "Back to customer" }
  - { from: kyc-review, to: customer-messages, type: push, label: "Message re: KYC" }
  - { from: account-applications, to: application-detail, type: push, label: "Application selected" }
  - { from: account-applications, to: customer-onboarding, type: push, label: "New application" }
  - { from: application-detail, to: customer-detail, type: push, label: "View customer" }
  - { from: application-detail, to: customer-messages, type: push, label: "Message customer" }
  - { from: fo-dashboard, to: agent-registration, type: push, label: "Register as Agent" }
  - { from: agent-registration, to: fo-dashboard, type: replace, label: "Registration complete" }
  - { from: settings, to: consent-manager, type: push, label: "Data & Consent" }
  - { from: consent-manager, to: settings, type: pop, label: "Back to Settings" }
  - { from: settings, to: change-password, type: push, label: "Change password" }
  - { from: settings, to: about, type: push, label: "About" }
  - { from: change-password, to: profile, type: pop, label: "Back to profile" }
  - { from: profile, to: login, type: replace, label: "Logout" }

