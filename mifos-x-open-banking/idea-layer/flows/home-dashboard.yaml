id: home-dashboard
name: home-dashboard
description: "Authenticated home dashboard flow — aggregates balance, recent transactions, and spending snapshot across the user's authorised accounts. Entry from bottom-nav Home tab (order 0) and on successful FAPI consent callback. Cross-flow exits to account-browsing (account-detail), transaction-review (transactions, transaction-detail), recurring-and-statements (statements), consent-management (consent-list), and pfm-review (spending-by-category). Transitions to login on 401 / no active consent."
type: happy
feature_ref: home
release_phase: P0

screens:
  - home

entry_screen: home

connections:
  - { from: home, to: account-detail, type: push, label: "Tap hero balance card (cross-flow → account-browsing)" }
  - { from: home, to: transactions, type: push, label: "Tap Transactions quick action or 'View all' recent transactions (cross-flow → transaction-review)" }
  - { from: home, to: transaction-detail, type: push, label: "Tap a recent transaction row (cross-flow → transaction-review)" }
  - { from: home, to: statements, type: push, label: "Tap Statements quick action (cross-flow → recurring-and-statements)" }
  - { from: home, to: consent-list, type: push, label: "Tap Manage consents quick action (cross-flow → consent-management)" }
  - { from: home, to: spending-by-category, type: push, label: "Tap spending snapshot card (cross-flow → pfm-review)" }
  - { from: home, to: login, type: push, label: "401 — access token expired or no active consent" }
  - { from: home, to: login, type: push, label: "Empty state CTA — no authorised accounts / no active consent" }
