# flows/app-main.yaml — Main app navigation flow
# Generated by project template sync (2026-05-22)
# Describes the primary user journeys across all 6 feature modules

schema_version: 1

metadata:
  name: app-main
  description: Main app navigation flow — access to home, profile, settings, and utility features (crypto, currency-rates, emi-calculator)
  created_at: 2026-05-22
  status: draft

# Entry point — app launch
entry_point: home

# Node definitions: each feature module gets a primary screen
nodes:
  # Core features (3)
  home:
    label: Home
    feature_module: feature:home
    description: Dashboard and primary app experience
    transitions:
      - to: profile
        trigger: tap_profile_button
      - to: settings
        trigger: tap_settings_button
      - to: crypto
        trigger: tap_crypto_button
      - to: currency_rates
        trigger: tap_rates_button
      - to: emi_calculator
        trigger: tap_calc_button

  profile:
    label: User Profile
    feature_module: feature:profile
    description: User account and profile management
    transitions:
      - to: home
        trigger: tap_back_or_home
      - to: settings
        trigger: tap_settings_button

  settings:
    label: Settings
    feature_module: feature:settings
    description: App configuration, preferences, and account settings
    transitions:
      - to: home
        trigger: tap_home_button
      - to: profile
        trigger: tap_profile_button

  # Utility features (3)
  crypto:
    label: Crypto Tools
    feature_module: feature:crypto
    description: Cryptocurrency utilities and converters
    transitions:
      - to: home
        trigger: tap_back_or_home
      - to: currency_rates
        trigger: tap_rates_button

  currency_rates:
    label: Currency Rates
    feature_module: feature:currency-rates
    description: Live currency exchange rates and converters
    transitions:
      - to: home
        trigger: tap_back_or_home
      - to: crypto
        trigger: tap_crypto_button
      - to: emi_calculator
        trigger: tap_calc_button

  emi_calculator:
    label: EMI Calculator
    feature_module: feature:emi-calculator
    description: Loan EMI and financial calculations
    transitions:
      - to: home
        trigger: tap_back_or_home
      - to: currency_rates
        trigger: tap_rates_button

# Bottom navigation structure (typical for multi-feature KMP apps)
bottom_navigation:
  - label: Home
    target: home
    icon: ic_home
  - label: Profile
    target: profile
    icon: ic_profile
  - label: Settings
    target: settings
    icon: ic_settings
  - label: Tools
    submenu:
      - label: Crypto
        target: crypto
        icon: ic_crypto
      - label: Rates
        target: currency_rates
        icon: ic_rates
      - label: EMI
        target: emi_calculator
        icon: ic_calc

notes:
  - "This is a starter flow structure from the template sync."
  - "Update based on actual app's bottom nav / drawer / tab bar structure."
  - "Each node should map to a screen YAML in idea-layer/screens/{feature}/{screen_name}/ui.yaml"
