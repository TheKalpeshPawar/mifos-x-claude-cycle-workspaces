# flows/app-main.yaml — Entry point / persona router
# Updated 2026-05-25 by /idea sync STEP 4f
# Routes to consumer-banking.yaml or field-officer.yaml based on login role

schema_version: "1.0"
id: app-main
name: "App Entry & Persona Router"
description: "Bootstrap flow — Splash → Login → routes to Consumer Home or Field Officer Dashboard based on user role"
created_at: "2026-05-22"
updated_at: "2026-05-28"
status: active

entry_screen: splash
screens:
  - splash
  - login
  - forgot-password
  - profile
  - settings

connections:
  - from: splash
    to: login
    type: replace
    label: "unauthenticated"
  - from: splash
    to: home
    type: replace
    label: "consumer session restored"
  - from: splash
    to: fo-dashboard
    type: replace
    label: "field officer session restored"
  - from: login
    to: home
    type: replace
    label: "consumer login success"
  - from: login
    to: fo-dashboard
    type: replace
    label: "field officer login success"
  - from: login
    to: forgot-password
    type: push
    label: "Forgot password"
  - from: forgot-password
    to: login
    type: pop
    label: "Back to login"
  - from: profile
    to: login
    type: replace
    label: "logout"

sub_flows:
  - id: consumer-banking
    file: "flows/consumer-banking.yaml"
    persona: consumer
    entry: home
  - id: field-officer
    file: "flows/field-officer.yaml"
    persona: fieldOfficer
    entry: fo-dashboard

bottom_nav:
  consumer:
    - { label: Home, target: home, icon: home }
    - { label: Accounts, target: accounts, icon: account_balance }
    - { label: Pay, target: send-money, icon: send }
    - { label: Cards, target: cards, icon: credit_card }
    - { label: More, target: more, icon: more_horiz }
  fieldOfficer:
    - { label: Dashboard, target: fo-dashboard, icon: dashboard }
    - { label: Customers, target: customer-search, icon: people }
    - { label: Applications, target: account-applications, icon: assignment }
    - { label: Meetings, target: meetings, icon: calendar_today }
    - { label: More, target: more, icon: more_horiz }
