# flows/app-main.yaml — Main app navigation flow (empty-slate scaffold)
# Generated 2026-05-22 post-template-sync.
# Reflects ONLY home / profile / settings — template features intentionally excluded.

schema_version: 1

metadata:
  name: app-main
  description: "Main app navigation flow — scaffolding only (home/profile/settings). Real feature flows added once product scope is defined."
  created_at: 2026-05-22
  status: draft

# Entry point — app launch
entry_point: splash

# Node definitions
nodes:
  splash:
    label: Splash
    feature_module: cmp-shared
    description: Bootstrap — load theme + language prefs, route to Home
    transitions:
      - to: home
        trigger: bootstrap_complete

  home:
    label: Home
    feature_module: feature:home
    description: Entry hub. Specific destinations TBD once product scope is defined.
    transitions:
      - to: profile
        trigger: tap_profile
      - to: settings
        trigger: tap_settings

  profile:
    label: User Profile
    feature_module: feature:profile
    description: User profile placeholder. Awaits auth + user-data integration.
    transitions:
      - to: home
        trigger: tap_back_or_home

  settings:
    label: Settings
    feature_module: feature:settings
    description: App configuration — theme, language, notification preferences (placeholder).
    transitions:
      - to: settings_theme_dialog
        trigger: tap_theme_card
      - to: settings_language_dialog
        trigger: tap_language_card
      - to: settings_notification_screen
        trigger: tap_notification_card
      - to: home
        trigger: tap_back

  settings_theme_dialog:
    label: SettingsDialog (Theme picker)
    feature_module: feature:settings
    description: Modal — light/dark/system + brand color
    transitions:
      - to: settings
        trigger: dismiss

  settings_language_dialog:
    label: LanguageDialog (Locale picker)
    feature_module: feature:settings
    description: Modal — pick from platform-supported locales
    transitions:
      - to: settings
        trigger: dismiss

  settings_notification_screen:
    label: Notification (stub)
    feature_module: feature:settings
    description: Placeholder for notification preferences UI
    transitions:
      - to: settings
        trigger: tap_back

# Bottom navigation structure (scaffolding — refine when feature scope set)
bottom_navigation:
  - label: Home
    target: home
    icon: home
  - label: Profile
    target: profile
    icon: account_circle
  - label: Settings
    target: settings
    icon: settings

notes:
  - "Empty-slate scaffold — only home/profile/settings are real."
  - "Template features (crypto/currency-rates/emi-calculator) are NOT represented here — they will be removed from source."
  - "Update this flow once /idea-plan defines actual product features."
