id: consent-expired
name: consent-expired
description: "Error / edge-case flow — when any AIS resource call returns a consent-expired or consent-revoked error (e.g. 403 with UK OB error code UK.OBIE.Resource.ConsentMismatch), the app surfaces a re-consent prompt on the current data screen and redirects to the FAPI onboarding-consent flow. No dedicated screens; surfaces as an in-screen banner or dialog on data screens then cross-flows to login."
type: error
feature_ref: consent-dashboard
release_phase: P0

screens:
  - accounts
  - login

entry_screen: accounts

connections:
  - { from: accounts, to: login, type: push, label: "Consent expired/revoked detected on any AIS call — prompt re-consent, redirect to login (cross-flow → onboarding-consent)" }

# Note: This flow is cross-cutting. The same error path can originate from
# any data screen (transactions, account-detail, etc.) and follows the
# same pattern: surface banner → user confirms → navigate to login.
# 'accounts' is listed here as the canonical representative data screen.
