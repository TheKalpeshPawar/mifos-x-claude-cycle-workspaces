flow_id: send-money-payment
name: "Send money — consumer domestic payment"
type: happy
feature_ref: send-money
is_primary_flow: true

description: >-
  The PSU pays a person from one of their own authorised accounts using the HSBC PISP
  domestic-payment endpoints. This is a consumer payment, not a merchant checkout — the
  Risk block carries PaymentContextCode TransferToThirdParty (or TransferToSelf for an
  own-account move) and no merchant fields. The flow spans three features: send-money owns
  the form and the two writes, payment-consent owns the out-of-app authorise leg, and
  payment-status owns settlement tracking.

screen_sequence:
  - screen: send-money
    step: "Recipient — choose the funding account from the PSU's own authorised accounts, then a saved payee or a manual sort code and account number"
    success_signal: "A debtor account and a creditor are both selected; the form advances to the amount step"

  - screen: send-money
    step: "Amount — enter the amount and an optional reference; validated locally against the account's available balance"
    success_signal: "validationError is null and the Review button is enabled"

  - screen: send-money
    step: "Review — confirm the finished payment; staging POSTs a domestic-payment-consent with a detached JWS and an idempotency key"
    success_signal: "HTTP 201 with Data.Status AwaitingAuthorisation and a ConsentId"

  - screen: payment-consent
    step: "Authorise — app-to-app redirect to HSBC where the PSU completes SCA and approves the payment"
    success_signal: "Redirect returns with an authorisation code; PSU access token obtained and the consent reaches Authorised"

  - screen: send-money
    step: "Submit — POST the payment reusing the SAME idempotency key and the byte-identical staged Initiation"
    success_signal: "HTTP 201 with a DomesticPaymentId and an accepted Status"

  - screen: payment-status
    step: "Track — poll the payment resource until settlement completes"
    success_signal: "Status reaches AcceptedSettlementCompleted"

steps:
  - "Pay tab → send-money (replaces the SendMoneyRoute placeholder)"
  - "Choose funding account from the PSU's own authorised accounts"
  - "Choose a saved payee, or enter a sort code and account number manually"
  - "Enter amount and optional reference; local validation against available balance"
  - "Review the payment and confirm"
  - "App stages a domestic-payment-consent (payments-scope CC token + detached JWS + idempotency key)"
  - "App-to-app redirect to HSBC: PSU authenticates (SCA) and approves the payment"
  - "Callback exchanges the code for a PSU access token"
  - "App submits the payment reusing the same idempotency key"
  - "Land on the success state; View status opens payment-status"

entry_points:
  - source: app-shell
    detail: "Pay tab, bottom_navigation.items[2] — already declared with target_screen: send-money"

error_paths:
  - condition: "400 U019 — missing or malformed detached JWS"
    outcome: "Non-recoverable error with a support reference; no Retry offered"
  - condition: "400 U009 — consent not Authorised"
    outcome: "Re-authorise CTA restarts the payment-consent leg"
  - condition: "400 U014 — payment outside control parameters"
    outcome: "Return to the amount step, debtor and creditor preserved"
  - condition: "400 U008 — staged consent does not match the submitted order"
    outcome: "Discard the staged consent and restart the form"
  - condition: "403 — payment consent revoked or expired"
    outcome: "View Consents CTA navigates to consent-list"
  - condition: "funds-confirmation FundsAvailable=false"
    outcome: "InsufficientFunds error; the payment is never submitted"
  - condition: "network failure mid-submit"
    outcome: "Retry reusing the same idempotency key — cannot produce a duplicate payment"
