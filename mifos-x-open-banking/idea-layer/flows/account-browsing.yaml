id: account-browsing
name: account-browsing
description: "Core account information flow — list authorised accounts with balance preview, open account detail with balances, and drill into product terms, party details, and ATM locator. Entry points into recurring payments, statements, and transactions are cross-flow exits to recurring-and-statements and transaction-review respectively."
type: happy
feature_ref: accounts
release_phase: P0

screens:
  - accounts
  - account-detail
  - product
  - party
  - atm-locator

entry_screen: accounts

connections:
  - { from: accounts, to: account-detail, type: push, label: "Tap account card" }
  - { from: accounts, to: login, type: push, label: "Token expired or no active consent — redirect to re-auth (cross-flow → onboarding-consent)" }
  - { from: account-detail, to: accounts, type: push, label: "Back button" }
  - { from: account-detail, to: transactions, type: push, label: "Tap Transactions chip (cross-flow → transaction-review)" }
  - { from: account-detail, to: statements, type: push, label: "Tap Statements chip (cross-flow → recurring-and-statements)" }
  - { from: account-detail, to: standing-orders, type: push, label: "Tap Standing Orders chip (cross-flow → recurring-and-statements)" }
  - { from: account-detail, to: direct-debits, type: push, label: "Tap Direct Debits chip (cross-flow → recurring-and-statements)" }
  - { from: account-detail, to: scheduled-payments, type: push, label: "Tap Scheduled chip (cross-flow → recurring-and-statements)" }
  - { from: account-detail, to: beneficiaries, type: push, label: "Tap Beneficiaries chip (cross-flow → recurring-and-statements)" }
  - { from: account-detail, to: product, type: push, label: "Tap Product chip" }
  - { from: account-detail, to: party, type: push, label: "Tap Account Holder (Party) chip" }
  - { from: account-detail, to: atm-locator, type: push, label: "Tap Nearby ATMs chip" }
  - { from: product, to: account-detail, type: push, label: "Back navigation" }
  - { from: party, to: account-detail, type: push, label: "Back navigation" }
  - { from: atm-locator, to: account-detail, type: push, label: "Back navigation" }
