id: recurring-and-statements
name: recurring-and-statements
description: "Payments-context read surfaces flow — all screens reachable from account-detail's Explore row: standing orders (read-only recurring outbound orders), direct debits (mandate list), scheduled payments (future-dated one-offs), beneficiaries (saved payees), statements list, and statement detail with period/balance/transactions. All entries are cross-flow exits from account-browsing."
type: happy
feature_ref: standing-orders
release_phase: P1

screens:
  - standing-orders
  - direct-debits
  - scheduled-payments
  - beneficiaries
  - statements
  - statement-detail

entry_screen: standing-orders

connections:
  - { from: standing-orders, to: account-detail, type: push, label: "Back button (cross-flow → account-browsing)" }
  - { from: direct-debits, to: account-detail, type: push, label: "Back button (cross-flow → account-browsing)" }
  - { from: scheduled-payments, to: account-detail, type: push, label: "Back button (cross-flow → account-browsing)" }
  - { from: beneficiaries, to: account-detail, type: push, label: "Back button (cross-flow → account-browsing)" }
  - { from: statements, to: statement-detail, type: push, label: "Tap statement row" }
  - { from: statements, to: account-detail, type: push, label: "Back navigation (cross-flow → account-browsing)" }
  - { from: statement-detail, to: statements, type: push, label: "Back navigation" }
