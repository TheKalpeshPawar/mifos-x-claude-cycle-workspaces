  reference_files:
    base_viewmodel: "core/common/src/commonMain/kotlin/org/mifos/core/common/viewmodel/BaseViewModel.kt"
    screen_data_stream: "core/common/src/commonMain/kotlin/org/mifos/core/common/stream/ScreenDataStream.kt"
    store5_module: "core/data/src/commonMain/kotlin/org/mifos/core/data/store/"
  rules:
    - "Every ViewModel extends BaseViewModel"
    - "State is exposed via ScreenDataStream<S>"
    - "Network-backed repos use Store5 (cache-then-network)"
    - "DI uses Koin module scoped per feature"

