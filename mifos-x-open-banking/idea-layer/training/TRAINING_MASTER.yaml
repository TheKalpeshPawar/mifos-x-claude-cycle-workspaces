# ─── State model patterns ────────────────────────────────────────────────────
state_model_patterns:
  simple_viewmodel:
    name: "Stream-First simple state"
    structure: |
      data class FooState(
        val loading: Boolean = false,
        val items: List<Foo> = emptyList(),
        val error: String? = null
      )
      class FooViewModel(repo: FooRepo) : BaseViewModel<FooState>(FooState()) {
        override val dataStream: ScreenDataStream<FooState> = ScreenDataStream { ... }
      }

  parameterized_detail:
    name: "Stream-First detail with route param"
    structure: |
      class FooDetailViewModel(savedStateHandle: SavedStateHandle, repo: FooRepo)
        : BaseViewModel<FooDetailState>(FooDetailState()) {
          private val id = savedStateHandle.get<String>("id")!!
          override val dataStream = ScreenDataStream { repo.detailStream(id) }
        }

