schema_version: "1.0"
project: mifos-x-open-banking
components:
  primitives:
    - box
    - button
    - divider
    - grid
    - icon
    - image
    - input
    - link
    - spacer
    - stack
    - text
  patterns:
    - badge
    - banner
    - card
    - chip
    - dialog
    - list_item
    - loading_indicator
    - progress_bar
    - skeleton
  project_specific:
    # Added 2026-06-11 (/idea verify --source-drift, pfm-dashboard PFM v2 reconciliation):
    # the shipped Spending Insights screen renders a Canvas donut (chart) and dynamic
    # data-bound row lists (list) for category/budget/merchant breakdowns.
    - chart   # Canvas donut / data visualization (PfmDonutChart)
    - list    # data-bound vertical list rendering a row template per analyze() result
