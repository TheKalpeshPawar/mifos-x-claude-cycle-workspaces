# Tier-3 Project Components — mifos-x-open-banking
#
# Domain-specific components for the UK Open Banking AISP reference app.
# Each entry extends a framework primitive or pattern, so it inherits a renderer.
# Loaded after the framework registry (primitives + registry/*.yaml).
#
# Registered during /idea sync enrichment reconciliation (2026-06-29). These three
# types are used across enriched screens, are NOT framework primitives or patterns,
# and each needs a renderer via `extends`. (All other non-primitive types used by
# this project — empty_state, chip_group, error_state, banner, stat_block,
# segmented_button, stepper, search_bar, bottom_sheet, text_button, outlined_button,
# filled_button, progress_linear — are valid framework Tier-2 patterns and must NOT
# be redefined here, or they would override the framework renderer.)
#
# NOTE: the `name` field mirrors `type` because the idea-graph-audit allow-list
# (.claude-runtime/lib/idea-graph-audit/layer0.ts) reads `components[].name`.
#
# Conforms to ../../templates/specialized/idea-layer/COMPONENT_REGISTRY.schema.yaml

components:

  # ────────────────────────────────────────────────────────────────
  # Section Header — small heading label above a grouped block.
  # Used 28× to label balances / details / explore / fees / interest sections.
  # ────────────────────────────────────────────────────────────────
  - name: section_header
    type: section_header
    tier: project
    extends: text
    category: typography
    description: >
      Compact section title (M3 titleSmall/labelLarge) rendered above a grouped
      list or card cluster. Provides a labelled landmark for screen-reader
      navigation between sections.
    a11y:
      role: heading
      semantic_html: h2
      label_source: "{value}"
      contrast_required: true
    default_style:
      background: transparent
      padding: "16dp 0dp 8dp 0dp"
      corner_radius: radius.none
      elevation: elevation.level0
      text_color: onSurfaceVariant
    supported_states: [idle]
    properties_schema:
      type: object
      required: [value]
      properties:
        value: { type: string }
        style: { type: string, default: titleSmall }

  # ────────────────────────────────────────────────────────────────
  # Chip Row — horizontally scrollable single-line chip strip (no wrap).
  # Used as the account-detail "Explore" navigation strip.
  # ────────────────────────────────────────────────────────────────
  - name: chip_row
    type: chip_row
    tier: project
    extends: chip_group
    category: navigation
    description: >
      Single-line, horizontally scrolling row of chips (no wrap). Used for inline
      navigation/filter strips where a wrapping chip_group would push content
      vertically. Children are chips.
    a11y:
      role: group
      semantic_html: div
      label_source: "{accessibility_label}"
      contrast_required: false
    default_style:
      background: transparent
      padding: "4dp 0dp"
      corner_radius: radius.none
      elevation: elevation.level0
    supported_states: [idle]
    properties_schema:
      type: object
      properties:
        accessibility_label: { type: string }
        scroll_direction: { type: string, default: horizontal }

  # ────────────────────────────────────────────────────────────────
  # Info Row — read-only labelled row (label + value + optional secondary line).
  # Used on settings for the location-permission and PFM-storage disclosure rows.
  # ────────────────────────────────────────────────────────────────
  - name: info_row
    type: info_row
    tier: project
    extends: list_item
    category: containers
    description: >
      Read-only labelled row: a label with a resolved value, an optional secondary
      line, an optional leading icon and an optional trailing action. Richer than
      a bare list_item (which carries a single supporting_text) — used for
      settings disclosure rows (permission state, cache storage location).
    a11y:
      role: listitem
      semantic_html: li
      label_source: "{label}"
      contrast_required: true
    default_style:
      background: transparent
      padding: "12dp 16dp"
      corner_radius: radius.none
      elevation: elevation.level0
    supported_states: [idle]
    properties_schema:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        secondary: { type: string }
        icon: { type: string }
        trailing_content: { type: string }
        # Added 2026-07-31 for the send-money review card: the amount row must read as the
        # primary fact on the last surface before money moves.
        emphasis: { type: boolean, default: false }

  # ────────────────────────────────────────────────────────────────
  # Review Card — the confirmation surface on send-money step 3.
  # Trust-critical: the last thing the PSU reads before money moves. Registered
  # 2026-07-31; send-money previously rendered this as a generic `card`, which
  # left the design system's trust_critical treatment unreachable.
  # ────────────────────────────────────────────────────────────────
  - name: review_card
    type: review_card
    tier: project
    extends: card
    category: containers
    description: >
      Confirmation container holding the finished payment as labelled info_row children.
      Trust-critical: elevated and outlined so it reads as a distinct commitment surface
      rather than another content card, because confirming it moves money irreversibly.
    a11y:
      role: region
      semantic_html: section
      label_source: "{accessibility_label}"
      contrast_required: true
    default_style:
      background: surfaceContainer
      padding: "16dp"
      corner_radius: radius.medium
      elevation: elevation.level1
    supported_states: [idle]
    properties_schema:
      type: object
      properties:
        accessibility_label: { type: string }

  # ────────────────────────────────────────────────────────────────
  # Step Indicator — textual "Step N of M" for multi-step forms.
  # Deliberately textual, not a progress bar: the motion dial is 2.
  # ────────────────────────────────────────────────────────────────
  - name: step_indicator
    type: step_indicator
    tier: project
    extends: text
    category: typography
    description: >
      Textual progress readout for a multi-step form ("Step 2 of 3"). Chosen over a
      progress bar so the screen carries no continuous motion, and so screen-reader users
      get the position as words rather than as a percentage they must interpret.
    a11y:
      role: status
      semantic_html: p
      label_source: "{accessibility_label}"
      contrast_required: true
    default_style:
      background: transparent
      padding: "8dp 16dp"
      corner_radius: radius.none
      elevation: elevation.level0
      text_color: onSurfaceVariant
    supported_states: [idle]
    properties_schema:
      type: object
      required: [current, total]
      properties:
        value: { type: string }
        current: { type: string }
        total: { type: integer }
        accessibility_label: { type: string }

  # ────────────────────────────────────────────────────────────────
  # Bar Chart — dual-bar income vs spend visualization.
  # UNUSED since 2026-07-28 — was declared for the pfm-dashboard income/spend
  # comparison; that screen was never built and has been removed.
  #
  # STRUCK 2026-07-31: kept as a comment rather than a live entry, on the same
  # reasoning design-system/components/_index.yaml gives for its own `removed:`
  # block — an aspirational registry entry is worse than no entry, because a
  # codegen pass reads the registry as a contract and will try to satisfy it.
  # PFM is out of scope; if it returns, restore this from git history.
  #
  # - name: bar_chart
  #   type: bar_chart
  #   tier: project
  #   extends: box
  #   category: data_display
  #   (full entry in history at components.yaml before 2026-07-31)
  # ────────────────────────────────────────────────────────────────
