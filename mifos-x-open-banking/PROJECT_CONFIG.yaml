# PROJECT_CONFIG.yaml — Machine-readable project configuration (schema v2)
# Last updated: 2026-05-25 (dual-persona rebuild — Consumer + Field Officer)
# Source: https://github.com/openMF/mifos-x-open-banking.git

schema_version: 2

# ─── Project Identity ────────────────────────────────────────────────────────
project:
  name: mifos-x-open-banking
  type: kmp
  subtype: kmp-app
  status: idea-layer-complete        # idea-layer rebuilt 2026-05-25
  created: 2026-05-20
  updated: 2026-05-25

# ─── Tech Stack ───────────────────────────────────────────────────────────────
tech:
  language: kotlin                   # Kotlin 2.1.20
  ui_framework: compose-multiplatform  # Compose Multiplatform 1.8.2
  architecture: stream-first         # BaseViewModel + ScreenDataStream + Store5
  di: koin                           # Koin 4.1.0 + koin-annotations 2.1.0
  network: ktor-ktorfit              # Ktor 3.2.0 + Ktorfit 2.5.2
  database: room-kmp                 # Room 2.7.2 + sqlite-bundled 2.5.2
  navigation: androidx-navigation    # Jetpack Navigation Compose (type-safe @Serializable routes)
  product_flavors:
    plugin: io.github.mobilebytelabs.kmp-product-flavors
    version: "2.4.3"
    applied_to: cmp-navigation        # navigation hub is the flavor entry point
    flavors:
      - name: consumer
        is_default: true
        description: Retail banking super-app (self-service)
        bottom_nav: [Home, Accounts, Pay, Cards, More]
      - name: fieldOfficer
        description: Agent banking tool (onboarding, KYC, applications)
        bottom_nav: [Dashboard, Customers, Applications, Messages, More]

# ─── Backend ─────────────────────────────────────────────────────────────────
# Primary backend: Open Bank Project (OBP) API v7.0.0
# Secondary: Firebase (observability only — Crashlytics + Performance)
#
# IMPORTANT — EXTERNAL API CONSUMER, NO OWNED BACKEND:
# This project OWNS NO backend and NO database. It is a pure KMP client that
# CONSUMES the external OBP REST API. There is intentionally NO `server.backends`
# block → RULE-IDEA-SERVER-DATA-001 (owned-DB checks: server/tables/, apis↔flows
# 1:1) MUST SKIP entirely (rule Enforcement line 145 / Evaluation line 168).
# The artifacts under idea-layer/server/apis/ + api_manifest.yaml are CLIENT
# contracts for Ktorfit codegen — they are NOT owned-backend schema. Screens
# declare `capabilities: [has_ui]` only; none declare `has_api` (no owned data layer).
backend:
  owned: false                       # no backend/DB built or owned by this project
  provider: rest                     # OBP REST API (external, not Supabase/Firebase data)
  environments:
    local:
      api_base_url: https://apisandbox.openbankproject.com
      api_version: v7.0.0
      auth_method: direct_login      # POST /obp/v4.0.0/banks/{bank}/direct_login
      consumer_key_env: OBP_CONSUMER_KEY   # from .env.local — never hardcode
    production:
      api_base_url: https://api.openbankproject.com
      api_version: v7.0.0
      auth_method: direct_login
      consumer_key_env: OBP_CONSUMER_KEY_PROD
  observability:
    provider: firebase
    services: [crashlytics, performance]
    firebase_project_id: TBD

# ─── Platforms ───────────────────────────────────────────────────────────────
platforms: [android, ios, desktop, web]

# ─── Layers ──────────────────────────────────────────────────────────────────
layers:
  plan:        { enabled: true }
  design-spec: { enabled: true, design_tool: figma }
  server:      { enabled: true }   # OBP REST — client/server contract via Ktorfit interfaces
  client:      { enabled: true }   # Ktorfit services + Store5 repos per OBP tag
  feature:     { enabled: true }
  infrastructure: { enabled: true }
  platform:    { enabled: true }   # expect/actual: cmp-android, cmp-ios, cmp-desktop, cmp-web
  testing:     { enabled: true, frameworks: [kotlin-test] }

# ─── Stitch (mockup generation) ──────────────────────────────────────────────
# Live .stitch/ infra + .env.stitch present in the project.
stitch:
  enabled: true

# ─── Source Metadata ─────────────────────────────────────────────────────────
