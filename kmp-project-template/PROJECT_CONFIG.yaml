# PROJECT_CONFIG.yaml — Machine-readable project configuration (schema v2)
# Generated by /project-import → /idea-plan --from-source on 2026-05-22
# Source: ~/OpenSource/Mifos/kmp-project-template (symlinked; user fork of openMF/kmp-project-template)

schema_version: 2

# ─── Project Identity ────────────────────────────────────────────────────────
project:
  name: kmp-project-template
  type: kmp
  subtype: kmp-template            # consumable starter template, not a shipping app
  status: initialized
  created: 2026-05-22

# ─── Tech Stack (detected from gradle/libs.versions.toml + source scan) ──────
tech:
  language: kotlin                 # Kotlin 2.3.20
  ui_framework: compose-multiplatform   # Compose Multiplatform (build-logic conventions)
  architecture: mvi                # Effect.kt + EventsEffect pattern (standard MBS/Mifos MVI)
  di: koin                         # Koin 4.1.1 + koin-annotations 2.1.0 + kotlinInject 0.7.2
  network: ktor-ktorfit            # Ktor 3.3.3 + Ktorfit 2.7.3
  database: room-kmp               # Room 3.0.0-alpha03 + sqlite-bundled 2.6.2 (+ sqlite-web 2.6.2)

# ─── Backend ────────────────────────────────────────────────────────────────
# Firebase detected via firebaseBom 34.7.0 (template wires Crashlytics/Performance plugins).
# Template is an app starter — no real backend yet. Backend wiring is observability-only.
backend:
  provider: firebase
  environments:
    local:
      auto_generated: true
    production:
      firebase_project_id: TBD     # template ships no prod firebase; populate when forking

# ─── Platforms (detected from settings.gradle.kts include() blocks + cmp-* dirs) ──
# Note: cmp-ios directory exists on disk but is NOT included in settings.gradle.kts —
# it's present as a scaffold but inactive in the gradle build. iOS treated as supported-but-scaffold.
platforms: [android, desktop, web]
platforms_scaffold: [ios]

# ─── Layers ──────────────────────────────────────────────────────────────────
layers:
  plan:
    enabled: true
  design-spec:
    enabled: true
    design_tool: figma
  server:
    enabled: true                  # firebase wired; template has no real backend
  client:
    enabled: true                  # ktor/ktorfit modules present (core:network, core-base:network)
  feature:
    enabled: true
  infrastructure:
    enabled: true
  platform:
    enabled: true                  # core-base:platform module present; cmp-* apps wire expect/actual
  testing:
    enabled: true
    frameworks: [kotlin-test]

# ─── Source Metadata ─────────────────────────────────────────────────────────
source:
  repo_url: https://github.com/openMF/kmp-project-template.git           # canonical upstream (openMF)
  fork_url: https://github.com/TheKalpeshPawar/kmp-project-template.git  # user's working remote (origin)
  default_branch: dev              # upstream default
  current_branch: dev              # user's active local branch
  local_clone_at: workspaces/mifos-x/kmp-project-template/source/kmp-project-template
  local_clone_kind: symlink        # symlink → /home/kalpesh/OpenSource/Mifos/kmp-project-template
  symlink_target: /home/kalpesh/OpenSource/Mifos/kmp-project-template
  shallow: false                   # full git history available
  origin: user_external            # user-managed external clone (NOT framework-cloned)
  package_name: cmp.android.app    # androidPackageNamespace from libs.versions.toml
  modules:
    apps: [cmp-android, cmp-desktop, cmp-web]     # cmp-ios scaffolded but not in settings include()
    shared: [cmp-shared, cmp-navigation]
    core: [core:analytics, core:common, core:data, core:database, core:datastore, core:designsystem, core:domain, core:model, core:network, core:store, core:ui]
    core_base: [core-base:analytics, core-base:common, core-base:database, core-base:datastore, core-base:designsystem, core-base:network, core-base:platform, core-base:security, core-base:store, core-base:ui]
    feature: [feature:home, feature:profile, feature:settings, feature:crypto, feature:currency-rates, feature:emi-calculator]

# ─── Versions (key dependencies) ────────────────────────────────────────────
versions:
  kotlin: "2.3.20"
  ktor: "3.3.3"
  ktorfit: "2.7.3"
  koin: "4.1.1"
  koin_annotations: "2.1.0"
  room: "3.0.0-alpha03"
  sqlite_bundled: "2.6.2"
  firebase_bom: "34.7.0"
