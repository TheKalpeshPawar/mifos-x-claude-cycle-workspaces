# ─── §8 FEATURES ────────────────────────────────────────────────────────────
features:
  _status: draft
  _quality_score: 90
  _source: source_analysis
  content:
    - name: home
      description: "Hub landing screen — 4 feature cards (Currency Rates, Crypto, EMI Calculator, etc.) for navigation. Stateless; no ViewModel."
      type: navigation
    - name: profile
      description: "Placeholder profile screen. Currently a stub centered text label — slot for future identity / account flow."
      type: stub
    - name: settings
      description: "User preferences: theme brand, dynamic color, dark mode config, language. DataStore-backed via UserDataRepository."
      type: preference
    - name: crypto
      description: "Cryptocurrency watchlist with infinite paging. Hits CoinGecko /api/v3/coins/markets via Ktorfit + PagingScreenStream<CoinMarket>. Pull-to-refresh + load-more. Coin click → detail screen."
      type: data-list
    - name: currency-rates
      description: "FX rates table with live search filter. Hits Frankfurter /v1/latest (USD base) via Ktorfit. Empty state on no-match search."
      type: data-list
    - name: emi-calculator
      description: "Pure-Kotlin EMI computation — principal + annual rate % + tenure months → monthly EMI / total payment / total interest. No network."
      type: compute

# ─── §9 REQUIREMENTS ────────────────────────────────────────────────────────
requirements:
  _status: draft
  _quality_score: 85
  _source: source_analysis
  content:
    - id: FR-001
      feature_ref: home
      text: "User can navigate to any of the 6 demo features via card click on the Home hub."
    - id: FR-002
      feature_ref: settings
      text: "User can change theme brand, dark mode config, dynamic color, and language; choices persist to DataStore and apply immediately."
    - id: FR-003
      feature_ref: crypto
      text: "User can scroll an infinite list of cryptocurrencies (CoinGecko markets), pull-to-refresh, and tap a coin to view detail."
    - id: FR-004
      feature_ref: currency-rates
      text: "User can view USD-based exchange rates (Frankfurter /v1/latest) and filter the table by currency code via a search field."
    - id: FR-005
      feature_ref: emi-calculator
      text: "User can input principal, annual interest rate, and tenure (months); results (monthly EMI, total payment, total interest) auto-compute and display."
    - id: FR-006
      feature_ref: profile
      text: "Profile tab renders a placeholder screen (stub slot for future fork-specific identity flow)."
    - id: NFR-001
      feature_ref: all
      text: "All network-backed screens (crypto, currency-rates) render Loading / Content / Empty / Error states via shared ScreenContent composable."
    - id: NFR-002
      feature_ref: all
      text: "All ViewModels follow BaseViewModel<LocalState, Event, Action> contract (with kotlinx.serialization route classes for type-safe nav)."

