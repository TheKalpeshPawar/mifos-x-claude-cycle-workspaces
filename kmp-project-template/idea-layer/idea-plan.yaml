# ─── §15 RELEASE_PLAN ───────────────────────────────────────────────────────
release_plan:
  _status: draft
  _quality_score: 80
  _source: source_analysis
  content:
    milestones:
      - name: android-release
        targets: [apk, aab]
        distribution: [firebase-app-distribution, play-store-internal, play-store-beta, play-store-production]
        signing: "ORIGINAL_KEYSTORE_* + UPLOAD_KEYSTORE_* (GitHub Secrets)"
      - name: ios-release
        targets: [ipa]
        distribution: [firebase-app-distribution, testflight, app-store]
        signing: "NOTARIZATION_APPLE_ID + NOTARIZATION_PASSWORD + NOTARIZATION_TEAM_ID"
        status: "scaffolded — cmp-ios not in settings.gradle.kts include()"
      - name: desktop-release
        targets: [exe, msi, dmg, deb]
        distribution: [github-releases]
        signing: "macOS notarization wired; Windows code-signing pending"
      - name: web-release
        targets: [browser-bundle]
        distribution: [github-pages]
    versioning:
      scheme: "Gradle Reckon (semantic via git tags) + monthly calendar versioning (YYYY.MM.0)"
      bot: "openMF/mifos-x-actionhub@v1.0.8 — 13+ custom GH Actions"
    workflows:
      - pr-check.yml                            # PR gate — spotless / detekt / dependency-guard / unit tests
      - multi-platform-build-and-publish.yml    # full multi-platform build + deploy (manual + push to dev)
      - promote-to-production.yml               # beta → prod (manual + release event)
      - tag-weekly-release.yml                  # weekly reckon bump
      - monthly-version-tag.yml                 # monthly calendar bump
      - test-coverage.yml                       # Kover coverage gate per .kover-floor.yml
      - build-and-deploy-site.yml               # docs site → GH Pages
      - cache-cleanup.yaml                      # Gradle cache hygiene
      - sync-dirs.yaml                          # directory sync utility
    secrets_required:
      - ORIGINAL_KEYSTORE_FILE
      - ORIGINAL_KEYSTORE_FILE_PASSWORD
      - ORIGINAL_KEYSTORE_ALIAS
      - ORIGINAL_KEYSTORE_ALIAS_PASSWORD
      - UPLOAD_KEYSTORE_FILE
      - UPLOAD_KEYSTORE_FILE_PASSWORD
      - UPLOAD_KEYSTORE_ALIAS
      - UPLOAD_KEYSTORE_ALIAS_PASSWORD
      - GOOGLESERVICES
      - PLAYSTORECREDS
      - FIREBASECREDS
      - NOTARIZATION_APPLE_ID
      - NOTARIZATION_PASSWORD
      - NOTARIZATION_TEAM_ID
    maturity_grade: "3.5 / 5 — production-ready Android + iOS (TestFlight); Desktop signing partial; Web untested in CI; matrix-mode disabled (kmpFlavors.buildMatrix=false)."
