# ─── §11 FLOWS ──────────────────────────────────────────────────────────────
flows:
  _status: draft
  _quality_score: 80
  _source: source_analysis
  content:
    - name: launch_flow
      feature_ref: cmp-shared
      steps: [Splash, AuthenticatedNavbar]
      goal: "Boot app and land on Home tab."
      trigger: "App startup"
    - name: home_navigate_flow
      feature_ref: home
      steps: [Home, "<feature card>"]
      goal: "User taps a feature card; deep-links into that feature's nested graph."
      trigger: "Card click on Home"
    - name: crypto_browse_flow
      feature_ref: crypto
      steps: [Home, CryptoWatchlist, CoinDetail]
      goal: "Browse markets, drill into a coin."
      trigger: "Crypto card on Home"
    - name: currency_rates_flow
      feature_ref: currency-rates
      steps: [Home, CurrencyRates, RateHistory]
      goal: "View USD rates, optionally drill into history."
      trigger: "Currency Rates card on Home"
    - name: emi_calc_flow
      feature_ref: emi-calculator
      steps: [Home, EmiCalculator]
      goal: "Compute loan EMI locally; no network."
      trigger: "EMI Calculator card on Home"
    - name: settings_flow
      feature_ref: settings
      steps: [Home, Settings, SettingsDialog]
      goal: "Adjust theme/language; persist to DataStore."
      trigger: "Settings button on top app bar"

# ─── §12 API_SURFACE ────────────────────────────────────────────────────────
api_surface:
  _status: draft
  _quality_score: 80
  _source: source_analysis
  content:
    endpoints:
      - service_class: "org.mifos.core.network.crypto.api.CoinGeckoApi"
        base_url: "https://api.coingecko.com/"
        method: GET
        path: "/api/v3/coins/markets"
        response_dto: CoinMarketDto
        consumed_by_feature: crypto
        auth: none
      - service_class: "org.mifos.core.network.crypto.api.CoinGeckoApi"
        base_url: "https://api.coingecko.com/"
        method: GET
        path: "/api/v3/coins/{id}"
        response_dto: CoinDetailDto
        consumed_by_feature: crypto
        auth: none
      - service_class: "org.mifos.core.network.currency.api.FrankfurterApi"
        base_url: "https://api.frankfurter.app/"
        method: GET
        path: "/v1/latest"
        response_dto: ExchangeRatesDto
        consumed_by_feature: currency-rates
        auth: none
      - service_class: "org.mifos.core.network.currency.api.FrankfurterApi"
        base_url: "https://api.frankfurter.app/"
        method: GET
        path: "/v1/{startDate}..{endDate}"
        response_dto: RateHistoryDto
        consumed_by_feature: currency-rates
        auth: none
    db_schema:
      provider: "Room 3.0.0-alpha03 (KMP)"
      notes: "Room is wired in core:database / core-base:database modules but the demo features stream directly from network without local cache. Forks add @Entity / DAO + cache layer as needed."
    http_client:
      engine_android: OkHttp
      engine_ios: Darwin
      engine_desktop_jvm: CIO
      engine_web: Js
      timeout_seconds: 60
      logging: "All traffic for api.coingecko.com + api.frankfurter.app; Authorization header sanitized."
      json: "kotlinx-serialization-json — isLenient, ignoreUnknownKeys, explicitNulls=false, prettyPrint"

