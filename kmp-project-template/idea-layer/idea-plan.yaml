# ─── §2 DOMAIN ──────────────────────────────────────────────────────────────
domain:
  _status: draft
  _quality_score: 90
  _source: source_analysis
  content:
    category: developer-tooling
    app_type: starter-template
    subcategory: kmp-scaffold
    notes: |
      This is a CONSUMABLE STARTER TEMPLATE — not a shipping product. Forks customize via:
        (a) `customizer.sh` to rewrite package namespace + app name
        (b) `lib-integrate.properties` (skip-worktree) to swap Maven artifacts for local source
        (c) `core/store` seams (AppScreenStateDefaults, AppErrorMapper, AppStoreRegistry)
      The 6 shipped features (home, profile, settings, crypto, currency-rates, emi-calculator) are
      DEMO features showcasing the architecture; they hit real public APIs (CoinGecko, Frankfurter)
      to demonstrate end-to-end flow rather than ship a real product.

# ─── §3 VISION ──────────────────────────────────────────────────────────────
vision:
  _status: draft
  _quality_score: 85
  _source: source_analysis
  content:
    elevator_pitch: "Production-ready Kotlin Multiplatform template — pre-wired MVI + offline-first Store + Compose UI across Android, Desktop, and Web (iOS scaffolded)."
    problem_statement: "Bootstrapping a cross-platform KMP app from scratch costs weeks: build-logic conventions, DI, MVI plumbing, design system, multi-platform CI/CD. Each new openMF / Mifos-X consumer app re-solves the same problems."
    target_users: "openMF KMP engineers bootstrapping new Mifos-X consumer apps; external fintech / NGO teams evaluating CMP for cross-platform shipping; open-source contributors learning the Mifos MVI + Store pattern."
    differentiator: "Real demos (live CoinGecko + Frankfurter integrations), 15 convention plugins, 9 GitHub Actions workflows wired to Fastlane + Play Store + TestFlight + Firebase, lib-integrate machinery for workspace-local dependency swapping."

# ─── §4 PERSONAS ────────────────────────────────────────────────────────────
personas:
  _status: draft
  _quality_score: 80
  _source: source_analysis
  content:
    - name: Priya
      role: KMP Team Lead, Mifos-X consumer app
      goal: "Spin up a new Mifos-X app (group banking, field officer, …) with the same architecture as the rest of the suite."
      pain: "Before this template: ad-hoc module layout per project, inconsistent MVI patterns, manual CI wiring each time."
    - name: Daniel
      role: Senior Engineer, fintech startup evaluating CMP
      goal: "Validate CMP feasibility for shipping Android + Desktop + Web from a single codebase, with a realistic example that already wires network, Room, DI, Theme, Navigation."
      pain: "Existing CMP samples are toy apps — no production CI, no offline-first patterns, no real APIs."
    - name: Mara
      role: Open-source contributor learning Mifos architecture
      goal: "Understand the BaseViewModel + Effect.kt + Store pattern by reading 6 well-organized demo features."
      pain: "Mifos production apps (Mobile, Mobile-Wallet) are too large to learn from cold; this template is the minimum viable example."

