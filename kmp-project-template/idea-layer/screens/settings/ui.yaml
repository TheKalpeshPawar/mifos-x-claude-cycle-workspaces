  - name: SettingsDialog
    archetype: dialog
    purpose: "Modal theme picker — pick brand + dark mode + dynamic color."
    composition:
      - AlertDialog
      - RadioButton          # brand selector
      - Switch               # dynamic color toggle
      - RadioButton          # dark mode (system / light / dark)

    state_model:
