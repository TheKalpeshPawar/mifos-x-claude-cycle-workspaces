        - updateDynamicColor
        - updateDarkThemeConfig
        - updateLanguage

    data_dependencies:
      - service: UserDataRepository
        ops: [getUserEditableSettings, setThemeBrand, setDynamicColor, setDarkThemeConfig, setLanguage]
        backend: datastore

