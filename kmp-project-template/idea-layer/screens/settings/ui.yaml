    archetype: settings
    purpose: "User preferences — theme brand, dark mode, dynamic color, language. Persists to DataStore via UserDataRepository."
    composition:
      - KptScaffold          # top bar with back nav
      - CircularProgressIndicator  # loading state
      - Card                 # Theme settings card
      - Card                 # Language settings card
      - ListItem             # per-setting row
