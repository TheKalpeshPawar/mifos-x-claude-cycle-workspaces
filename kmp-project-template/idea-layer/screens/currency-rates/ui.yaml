      - KptScaffold              # top bar
      - Row                      # header: base + date metadata
      - OutlinedTextField        # search input
      - ScreenContent            # Loading / Content / Empty wrapper
      - LazyColumn               # rate rows
      - ListItem                 # per-rate row (currency code + value)
      - Text                     # empty state message

    state_model:
      class: CurrencyRatesViewModel
      kind: MVI                   # extends BaseViewModel<RatesLocalState, RatesEvent, RatesAction>
      states: [Loading, Content, Empty]
      action_count: 2
      event_count: 0
      key_actions:
        - updateSearchQuery
        - refresh

    data_dependencies:
      - service: CurrencyRepository
        ops: [exchangeRatesStream]
        backend: network
        api: api_frankfurter
        endpoint: "GET /v1/latest"

    requirements_covered: [FR-004]

  - name: RateHistory
    archetype: detail
    purpose: "Historical rate chart between two dates."
    composition:
      - KptScaffold
      - DateRangePicker          # start + end date inputs
      - Card                     # chart container
      - ScreenContent

    state_model:
      class: RateHistoryViewModel  # inferred — verify in source
      kind: MVI
      states: [Loading, Content, Error]
      action_count: 1
      event_count: 0
      key_actions: [selectDateRange]

    data_dependencies:
      - service: CurrencyRepository
        ops: [rateHistoryStream]
        api: api_frankfurter
        endpoint: "GET /v1/{startDate}..{endDate}"

    requirements_covered: [FR-004]

