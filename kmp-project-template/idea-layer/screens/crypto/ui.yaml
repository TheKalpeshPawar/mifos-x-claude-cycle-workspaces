feature: crypto
status: draft
_source: source_analysis
_source_files:
  - feature/crypto/src/commonMain/kotlin/org/mifos/feature/crypto/ui/CryptoWatchlistScreen.kt
  - feature/crypto/src/commonMain/kotlin/org/mifos/feature/crypto/ui/CryptoWatchlistViewModel.kt
  - feature/crypto/src/commonMain/kotlin/org/mifos/feature/crypto/data/CryptoRepository.kt

screens:
  - name: CryptoWatchlist
    archetype: feed
    purpose: "Infinite-scrolling cryptocurrency watchlist via CoinGecko API. Pull-to-refresh + load-more paging."
    composition:
      - KptScaffold              # top bar with title
      - PullToRefreshContainer
      - LazyColumn               # paged coin list
      - ListItem                 # per-coin row (icon, name, symbol, price, 24h %)
      - AsyncImage               # coin icon via Coil
      - ScreenContent            # shared Loading / Content / Empty / Error wrapper
      - ShimmerLoadingBox        # loading skeleton

    state_model:
      class: CryptoWatchlistViewModel
      kind: MVI                   # extends BaseViewModel<Unit, CryptoEvent, CryptoAction>
      states: [Loading, Content, Empty, Error]
      action_count: 3
      event_count: 0
      key_actions:
        - refresh
        - loadMore
        - selectCoin

    data_dependencies:
      - service: CryptoRepository
        ops: [coinMarketsStream]
        backend: network
        api: api_coingecko
        endpoint: "GET /api/v3/coins/markets"

    requirements_covered: [FR-003]

  - name: CoinDetail
    archetype: detail
    purpose: "Per-coin detail with extended market data."
    composition:
      - KptScaffold              # top bar with back nav
      - ScreenContent
      - AsyncImage               # coin icon
      - Text                     # name + symbol header
      - Card                     # price card
      - Card                     # 24h change card
      - Card                     # market cap card

    state_model:
      class: CoinDetailViewModel  # inferred — verify in source
      kind: MVI
      states: [Loading, Content, Error]
      action_count: 1
      event_count: 0
      key_actions: [refresh]

    data_dependencies:
      - service: CryptoRepository
        ops: [getCoinDetail]
        api: api_coingecko
        endpoint: "GET /api/v3/coins/{id}"

    requirements_covered: [FR-003]

navigation:
  entry: CryptoWatchlist
  edges:
    - from: CryptoWatchlist
      to: CoinDetail
      trigger: tap coin row
      args: {coinId}

deeplinks: []
